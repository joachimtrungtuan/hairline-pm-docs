  - {"op": "update_node", "id": "REQ-003-003", "attrs": {"statement": "Providers MUST see anonymized patient data and tiered medical alerts until payment confirmation per system PRD."}}
  - {"op": "update_node", "id": "REQ-003-020", "attrs": {"statement": "When a provider becomes `Suspended` or `Deactivated`, System MUST NOT cancel an inquiry whose accepted treatment belongs to that provider; it MUST keep the inquiry open with `supportRequired = true` while FR-006 Alternative Flow B4 records cause `ProviderSuspended` or `ProviderDeactivated` on the booking; before treatment starts, B4 closes the booking and an admin rehomes the patient through FR-006 Alternative Flow B5, an `In progress` booking stays `In progress` for the admin decision in FR-006 Alternative Flow B7, and an `Aftercare` booking follows FR-006 Alternative Flow B6; for inquiries still comparing providers, System MUST cancel only that provider's ProviderInquiry participation and quotes, keep the inquiry stage, flag it `supportRequired = true`, and preserve other providers' offers. Before acceptance, patients MUST receive the offer-unavailability message with Contact Admin/Support; after acceptance and before treatment starts, they MUST receive the `booking.provider_fault_replacement` notice that an admin will arrange a replacement provider within the same inquiry. Patients MUST NOT receive the patient-cancellation message in either case (FR-015 A5/Screen 4)."}}
  - {"op": "update_node", "id": "REQ-003-034", "attrs": {"statement": "All required fields must be completed: nature of concern (text), duration (a choice from the Admin-managed problem-duration list), previous treatments (text) and symptom severity (integer 1-10 slider). Lifestyle factors and additional notes are optional. Text fields have character limits."}}
  - {"op": "update_node", "id": "REQ-003-035", "attrs": {"statement": "Visual evidence limited to 5 files total, photos and videos together; the head scan photo set is counted separately. Photos: JPG/PNG <= 2MB each. Videos: MP4 <= 30s, <= 20MB each. File size and format validation enforced; invalid media is blocked with actionable guidance.", "rationale": "PRD Screen 3 rules, Validation and Constraints 1, Workflow 1 upload step, Edge Cases. The 5-file total covers the inquiry's photos and videos together; the head scan photo set (Screen 4) is counted on its own."}}
  - {"op": "update_node", "id": "REQ-003-036", "attrs": {"statement": "Head scan photo set must meet minimum completeness/quality thresholds required by FR-002. Head scan media quality validation applies. The photo set holds up to 5 photos, JPG or PNG, 2 MB each, counted on its own and separate from the 5-file visual-evidence limit on Screen 3."}}
  - {"op": "update_node", "id": "REQ-003-072", "attrs": {"statement": "For an FR-037 exclusive inquiry, redistribution removes the exclusive restriction in the same way as the explicit-decline fallback (REQ-037-029). The supportRequired marker stays on the inquiry."}}
  - {"op": "update_node", "id": "REQ-003-118", "attrs": {"statement": "distributed_at (timestamp, UTC) is set once per provider when the inquiry is distributed to that provider, including when an inquiry is released to normal distribution after an exclusive provider declines (REQ-037-029). Distribution retries or re-sends to the same provider never overwrite it. It is the start point for FR-014 time to first quote (TTFQ) and response rate, and for the FR-020/FR-030 inquiry.ttfq_sla_breached alert."}}
  - {"op": "update_node", "id": "REQ-003-100", "title": "Providers whose quotes were cancelled are notified within 5 minutes, without the reason", "attrs": {"statement": "Only providers whose quotes were cancelled receive notification of the cancellation; cancellation reason is NOT shared with providers (patient-private analytics data). Send/enqueue notifications (target <= 5 minutes); if enqueue/send fails, queue/retry notifications and log attempts (do not roll back cancellation). When no quote was cancelled, no provider is notified."}}
  - {"op": "update_node", "id": "REQ-003-103", "attrs": {"statement": "System MAY cancel an eligible inquiry as a consequence of a patient account deletion request (FR-001). In that case, the system MUST set a system-generated cancellation reason for audit (e.g., \"Account Deleted (System)\") and MUST NOT prompt the patient for a cancellation reason. Draft, sent, and expired quotes are auto-cancelled as in Workflow 5, other quotes keep their status and cause; only providers whose quotes were cancelled are notified and MUST NOT see the cancellation reason; inquiry becomes read-only."}}
  - {"op": "update_node", "id": "REQ-003-106", "attrs": {"statement": "\"Cancel Inquiry\" is visible only in Inquiry or Quoted stages and hidden when stage is Accepted, Confirmed, In progress, Aftercare, Completed, or Cancelled. \"Contact support\" is shown in place of \"Cancel Inquiry\" from the Accepted stage onward (Accepted, Confirmed, In progress or Aftercare) and opens Help & Support so an admin can act on the request."}}
  - {"op": "add_node", "id": "REQ-003-120", "type": "Rule", "owner_fr": "FR-003", "title": "Treatment-area options are an Admin-managed list seeded with Hair, Beard and Both", "attrs": {"statement": "Treatment-area options come from the Admin-managed catalog; Hair, Beard, and Both remain the default seeded options and are not a fixed client-side enum.", "rationale": "PRD Screen 1 Treatment Area Selection notes."}}
