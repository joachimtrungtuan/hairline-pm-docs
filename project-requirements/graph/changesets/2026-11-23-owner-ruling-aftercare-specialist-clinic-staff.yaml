  - {"op": "update_node", "id": "REQ-031-056", "attrs": {"statement": "System admin roles (Super Admin, Aftercare Coordinator, Billing Admin, Support Staff) cannot be deleted; all of them except Super Admin can be edited. The four provider roles cannot be renamed or removed."}}
  - {"op": "update_node", "id": "REQ-030-095", "attrs": {"statement": "Provider-Caused Cancellation — Admin Support Required (provider.status_cancellation_admin_support) is an admin-configurable notification event. Primary recipients: Admin. Same trigger (FR-020 REQ-020-013), and also when a provider-status event leaves an `In Progress` booking open and flagged `supportRequired` for an admin decision (move the booking to `Aftercare` with aftercare reassignment, or cancel it with a reason), or leaves an `Aftercare` booking or FR-011 standalone aftercare case flagged for admin aftercare reassignment (FR-006 Alternative Flow B6). Mandatory admin-support alert per affected inquiry/case with patient, inquiry/case reference, prior stage, cause, and FR-016 deep link (Admin Support Required filter). Sent to admins with the FR-031 Respond to Support permission (default roles Super Admin, Aftercare Coordinator, and Support Staff); opening the FR-016 list also requires View Patients. Mandatory — admin cannot disable this event; sent regardless of \"Notify Provider\"; pinned as critical in the admin dropdown. No FR-034 ticket is auto-created. Retries de-duplicated per provider-status event + affected record + recipient"}}
  - {"op": "update_node", "id": "REQ-011-004", "attrs": {"statement": "Admin MUST be able to oversee cases, reassign providers, and override plans with full audit. Admin assignment of who delivers the aftercare (a provider, whose clinic staff are the aftercare specialists, or a Hairline aftercare team member, an admin with the FR-031 Aftercare Coordinator role) is owned by FR-011"}}
