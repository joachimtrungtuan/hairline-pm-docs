  - {"op": "update_node", "id": "ENT-subquote.acceptance_state", "attrs": {"description": "Subquote state (Key Entities `state`; the field name acceptance_state was set during FR-004 migration and is immutable). FR-005 owns it; derived from the parent and subquote lifecycle; exactly one Accepted, and not superseded, across the inquiry. Superseded is the original accepted subquote after an admin-authored replacement acceptance."}}
  - {"op": "update_node", "id": "REQ-005-052", "attrs": {"statement": "Subquote state is Available, Accepted, Not Selected, Expired, Withdrawn, Cancelled, or Superseded, derived from the parent and subquote lifecycle; exactly one subquote across the inquiry is Accepted and not superseded. After an admin-authored replacement acceptance (REQ-005-024) the original accepted subquote is Superseded: read-only, never acceptable again, with its AcceptanceEvent and acceptance snapshot unchanged and closed by the supersession record."}}
