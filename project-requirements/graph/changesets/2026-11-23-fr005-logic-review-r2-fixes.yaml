operations:
  - {"op": "update_node", "id": "ENT-acceptance-event.terms_acknowledged_at", "attrs": {"description": "Patient terms acknowledgment captured before acceptance (Screens 2 and 3). Required on a patient acceptance; empty on an admin-authored replacement acceptance (REQ-005-024), which records the admin as actor and carries the actor and reason on its supersession record instead. FR-004 holds a copy on the Quote. Added for the Terms Acknowledgment fields."}}
  - {"op": "update_field", "id": "ENT-acceptance-event.terms_acknowledged_at", "required": false}
  - {"op": "update_node", "id": "REQ-005-024", "attrs": {"statement": "System MUST allow exactly one patient acceptance per inquiry. The only additional acceptance record is the admin-authored record created by an FR-006 provider-fault transfer before treatment starts; it MUST point to an admin-authored FR-004 replacement quote, Quote Option, and option/date-price row, and the original MUST be marked superseded by one supersession record inserted at the replacement acceptance rather than by editing it. The admin-authored record carries no patient terms acknowledgment, so its terms acknowledgment time stays empty; it records the admin as actor, and the supersession record written in the same operation carries the actor and the reason."}}
