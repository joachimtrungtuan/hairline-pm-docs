reason: "FR-005 logic review round 2: terms acknowledgment empty on an admin-authored replacement acceptance (REQ-005-024, ENT-acceptance-event.terms_acknowledged_at); Superseded subquote state (REQ-005-052, REQ-005-024 step STP-005-016); STP-005-014 screen; Cancelled (Provider Status) reason text (REQ-005-039); owning Step for the 5-minute question notice (REQ-005-016, new STP-005-028); stale-version rejection step (new STP-005-029); retired-rule edges removed from REQ-005-009, -017, -027, -030, -053 and -060; replacement step order and stage (STP-006-605, STP-005-016, STP-006-606); owning Steps for REQ-005-048 and REQ-005-044. The inquiry cancellation cascade wording and the FR-010 FAQ line change in the PRDs only."
