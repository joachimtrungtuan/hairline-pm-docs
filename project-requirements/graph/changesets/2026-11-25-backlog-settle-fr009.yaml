  - {"op": "update_node", "id": "REQ-009-048", "attrs": {"statement": "The Owner can resend any Pending or Expired invitation; a Manager can resend only invitations for Clinical Staff and Billing Staff, the same limit as for inviting (REQ-009-001) and cancelling (REQ-009-193). For an Expired invitation, System checks that a seat is free and blocks the resend with the Screen 2 seat limit message when none is (the invitation stays Expired); a Pending invitation already holds its seat, so it has no seat check and no seat change. System generates new invitation token and sends new email Old invitation token invalidated; the old link stops working Outcome: Team member receives fresh invitation with new 7-day expiry"}}
