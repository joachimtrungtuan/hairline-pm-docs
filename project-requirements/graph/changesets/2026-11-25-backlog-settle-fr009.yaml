  - {"op": "update_node", "id": "ENT-team-activity-audit-log.action_type", "attrs": {"description": "Values are listed in the enum. The Screen 6 filter groups them as Login, Inquiry, Quote, Treatment, Patient Communication and Settings (REQ-009-110); the Screen 11 filter groups them as Login, Patient Access, Data Export, Settings Change, Communication and Treatment (REQ-009-122)."}}
