# FR-031 logic review pass 1: graph change-set mirroring the revised PRD (Admin Access Control & Permissions). New fields, setting, rules, flows and steps come first, then removals, updates, new enum values and new edges.
# Cross-FR edges: FR-031 references REQ-027-011, REQ-027-025 (FR-027), REQ-015-069 (FR-015), REQ-034-094 (FR-034) and REQ-026-116 (FR-026); no node owned by another FR is updated. New steps in the A10 and A11 flows link to FR-031 steps only.
# Queued for other FRs, not done here: FR-022 (admin user list role filter, Billing Admin wording, FR-031 status values, fixed permission categories, and the FR-022 edges to FR-031 nodes), FR-016 (REQ-016-198 Billing Staff to Billing Admin). Also noted: FR-030 catalogue entries for the suspend, reactivate and request-new-invitation notices, and the FR-026 settings screen entry for the new denial time window.
# Left alone on purpose: minor observations not ruled in; Manage Treatments and Manage Packages have no default holder beyond Owner.
reason: "FR-031 logic review pass 1: invitation creates the account as Invited with steps and labels aligned, pending role with Effective From, Super Admin accounts cannot be demoted, suspended or deleted in the product, suspend, reactivate and delete flows, widened sensitive permission list, provider team-removal and refund-approval rules corrected, audit trail limited to access-control events with a 30-day default and wider action types, new flows for editing admin role permissions, cancelling invitations, requesting a new invitation, deleting and cloning roles and provider sync failure, permission rows added or reworded for messaging, localization, reviews, treatments, packages, patients, retry charge and affiliates, full default tables, and settings pointers to FR-021, FR-027 and FR-034."
by: docs-manager
operations:
  - {"op": "add_field", "id": "ENT-admin-user-account.pending_role_id", "entity_id": "ENT-admin-user-account", "name": "pending_role_id", "data_type": "id", "title": "Pending role", "owner_fr": "FR-031", "required": false, "attrs": {"description": "Foreign key to the role definition the user will hold from pending_role_effective_from; empty when no role change is waiting. The current role applies until then, and a second change replaces it."}}
  - {"op": "add_field", "id": "ENT-admin-user-account.pending_role_effective_from", "entity_id": "ENT-admin-user-account", "name": "pending_role_effective_from", "data_type": "datetime", "title": "Pending role effective from", "owner_fr": "FR-031", "required": false, "attrs": {"description": "When the pending role takes over; never earlier than the moment the change is made."}}
  - {"op": "add_node", "id": "SET-admin-repeated-denial-window", "type": "Setting", "owner_fr": "FR-031", "title": "Repeated access denial time window", "attrs": {"description": "Time window in which the refusals of one admin are counted for the Super Admin alert: 10 minutes at launch; admin setting in A-09 (FR-031 Alternative Flow B5, Admin Editability).", "default": "10", "unit": "minutes"}}
  - {"op": "add_node", "id": "REQ-031-125", "type": "Rule", "owner_fr": "FR-031", "title": "A role change waits as a pending role until its Effective From", "attrs": {"statement": "System MUST store a role change as a pending role with its Effective From (never earlier than now); the current role applies until Effective From, and a second change made before then replaces the pending one.", "rationale": "PRD Business Rule 8; Alternative Flow A2 steps 6 to 14; Tab 2 pending-role note; Core Requirements."}}
  - {"op": "add_node", "id": "REQ-031-126", "type": "Rule", "owner_fr": "FR-031", "title": "Suspend, reactivate and delete admin accounts", "attrs": {"statement": "System MUST let a Super Admin suspend (with a required reason), reactivate, and delete a suspended non-Super Admin account; suspension ends the user's sessions and emails the user, reactivation returns the account to Active and emails the user, and deletion anonymises the account under REQ-031-022 and keeps the audit entries. A Super Admin account can never be suspended, demoted or deleted inside the product.", "rationale": "PRD Alternative Flow A8; Tab 2 actions; Business Rule 7; Admin Editability."}}
  - {"op": "add_node", "id": "REQ-031-127", "type": "Rule", "owner_fr": "FR-031", "title": "Pending Invitations sub-tab with resend and cancel", "attrs": {"statement": "System MUST list every invitation not yet accepted (Invited, Expired or Pending Send) in a Pending Invitations sub-tab of the Admin Users tab, with Name, Email, Role, Invited by, Expires at and Status; a Super Admin can resend an invitation (REQ-031-042) or cancel it, and cancelling removes the Invited account, invalidates the invitation link and writes an audit entry.", "rationale": "PRD Alternative Flows A1 and A9; Tab 2 Pending Invitations sub-tab."}}
  - {"op": "add_node", "id": "REQ-031-128", "type": "Rule", "owner_fr": "FR-031", "title": "Request New Invitation notifies all Super Admins", "attrs": {"statement": "System MUST notify all Super Admins by email and in the app when an invitee uses Request New Invitation on an expired or invalid invitation link, with a link to the invitation row in the Pending Invitations sub-tab.", "rationale": "PRD Alternative Flow A10; Screen 3 notes."}}
  - {"op": "add_node", "id": "REQ-031-129", "type": "Rule", "owner_fr": "FR-031", "title": "Delete and clone custom admin roles", "attrs": {"statement": "System MUST let a Super Admin delete a custom admin role only while no admin user (including an Invited account) and no pending role change holds it, and MUST name a cloned role \"Copy of [role name]\", editable and cut to 50 characters; roles have no active or inactive status.", "rationale": "PRD Alternative Flow A11; Tab 1 actions and rules."}}
  - {"op": "add_node", "id": "REQ-031-130", "type": "Rule", "owner_fr": "FR-031", "title": "Provider role sync failure is shown and retried", "attrs": {"statement": "System MUST, when a provider role permission change fails to reach the Provider Platform, mark the role \"Sync failed\", retry automatically 3 times, send an in-app alert to all Super Admins, and show the role as \"not yet applied\" on the Provider Roles tab until a retry succeeds.", "rationale": "PRD Alternative Flow A4 steps 17 to 19; Tab 3 sync indicator."}}
  - {"op": "add_node", "id": "REQ-031-131", "type": "Rule", "owner_fr": "FR-031", "title": "Editing an admin role applies to all its holders", "attrs": {"statement": "System MUST let a Super Admin edit the permissions of an admin role other than Super Admin, show the sensitive-permission warning when needed, log the change with before and after, email every admin user holding the role, and apply the new permissions to everyone holding it from their next request without ending any session.", "rationale": "PRD Alternative Flow A7."}}
  - {"op": "add_node", "id": "REQ-031-132", "type": "Rule", "owner_fr": "FR-031", "title": "User detail audit trail shows access-control events only", "attrs": {"statement": "The audit trail on the admin user detail screen shows access-control events only (sign-ins, access denials, invitations, role and permission changes, suspensions, reactivations and deletions); actions on patient accounts, reviews and other records stay in the logs of their own features, such as the FR-016 patient action log.", "rationale": "PRD Screen 5 purpose and business rules."}}
  - {"op": "add_node", "id": "REQ-031-133", "type": "Rule", "owner_fr": "FR-031", "title": "Admin Terms of Service acceptance belongs to this feature", "attrs": {"statement": "System MUST ask a new admin to accept the Admin Terms of Service when setting up the account; acceptance is recorded by this feature, while the legal text is edited under Edit Settings and viewed under View Settings in FR-027.", "rationale": "PRD Main Flow steps 17 and 19; Screen 3 notes."}}
  - {"op": "add_node", "id": "REQ-031-134", "type": "Rule", "owner_fr": "FR-031", "title": "Default permission tables are complete defaults", "attrs": {"statement": "System MUST define each predefined role's default permissions as a full table: Super Admin holds every admin permission, Owner holds every provider permission, and for every other predefined role a permission not listed in its default table is off; Reset to Default restores exactly that table.", "rationale": "PRD Screen 4 default permission tables and Reset to Default."}}
  - {"op": "add_node", "id": "FLW-031-a7-edit-admin-role", "type": "Flow", "title": "A7: Edit Admin Role Permissions", "attrs": {"kind": "alternative", "description": "A7: Edit Admin Role Permissions", "prd_ref": "A7"}}
