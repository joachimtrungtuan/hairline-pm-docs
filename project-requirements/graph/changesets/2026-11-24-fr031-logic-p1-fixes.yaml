  - {"op": "update_node", "id": "REQ-031-009", "attrs": {"statement": "System MUST NOT allow a Super Admin account to be suspended by another user, or removed, demoted or self-deactivated inside the product (system protection; if ever needed, this is done outside the product). When another admin tries to suspend one, including one Super Admin trying to suspend another, the action is blocked with \"A Super Admin account cannot be suspended. Super Admin accounts can only be changed outside the product.\" and both accounts stay active; when a Super Admin tries to change their own role or deactivate their own account, the action is blocked with \"A Super Admin account cannot be demoted or deactivated in the product. This can only be done outside the product.\" The Admin Users tab shows no Change Role, Suspend or Delete action on a Super Admin row."}}
  - {"op": "update_node", "id": "REQ-031-011", "attrs": {"statement": "System MUST support role assignment changes with **Effective From** date/time tracking (stored and auditable); the current role stays in force until Effective From"}}
  - {"op": "update_node", "id": "REQ-031-012", "attrs": {"statement": "System MUST maintain admin user accounts with: email, name, password hash, assigned role, role effective date/time, pending role and its effective date/time, role change acknowledgement time, status (active/invited/suspended), creation date, last login timestamp"}}
  - {"op": "update_node", "id": "REQ-031-014", "attrs": {"statement": "System MUST maintain audit trail entries with: timestamp, user ID, action type (the access-control events listed on the user detail screen), action details, IP address, outcome (success/failed/denied)"}}
  - {"op": "update_node", "id": "REQ-031-033", "attrs": {"statement": "The invitation form requires first name, last name, email address and an assigned role. First and last name are 2 to 50 characters (letters, spaces, hyphens only); the email is converted to lowercase; phone number is optional (E.164 format); personal message is optional but recommended for first-time team setup (max 500 characters, included in the invitation email). The form cannot be submitted until all required fields pass validation."}}
  - {"op": "update_node", "id": "REQ-031-035", "attrs": {"statement": "System checks the invitation email against all admin users (active, suspended, invited) and pending invitations; a duplicate is blocked with the error \"This email is already associated with an admin account. Please use a different email or check existing team members.\" and the system suggests \"View team member\" or, if the invitation is pending, \"Resend invitation\". The existing record is kept."}}
  - {"op": "update_node", "id": "REQ-031-036", "attrs": {"statement": "The role dropdown on the invitation form is populated from the admin roles, including custom admin roles, and shows role name plus a brief description on hover; an expandable role permission summary is shown below it, and a role must be selected (\"Please select a role for this team member.\"). Every existing role can be assigned to new or existing users; roles have no active or inactive status and cannot be deactivated."}, "title": "Any admin role can be assigned"}
  - {"op": "update_node", "id": "REQ-031-037", "attrs": {"statement": "Invitation tokens expire after the configured invitation expiry (7 days, 168 hours, at launch), which a Super Admin can set through A-09 settings within a range of 1 to 30 days."}}
  - {"op": "update_node", "id": "REQ-031-038", "attrs": {"statement": "The invitation email carries the invitation link, Hairline Admin Platform branding and the role being offered, plus the personal message when provided. Before sending, the form can preview the email (invitee name, role, personal message, invitation link placeholder) and shows \"Invitation will expire in [N] days on [date] at [time]\". After sending, it shows \"Invitation sent to [email]. They have [N] days to accept.\" N is the configured invitation expiry."}}
  - {"op": "update_node", "id": "REQ-031-039", "attrs": {"statement": "When an invitation is sent, System creates the new admin user's account with the assigned role and status \"Invited\" and records the invitation on it. The invitation shows \"Accepted\" when the account is set up (the account then becomes Active), \"Expired\" when the token has passed its expiry, when Cancel is used on Admin Account Setup, or when it still cannot be sent 24 hours after it was created, and \"Pending Send\" while the email cannot be delivered. The Pending Invitations sub-tab shows each invitation's status."}}
  - {"op": "update_node", "id": "REQ-031-040", "attrs": {"statement": "When the invitee opens the invitation link, System validates the token (not expired, not already used) before showing the Admin Account Setup screen pre-filled with email, first name and last name. An expired or invalid token redirects to an error page with a \"Request New Invitation\" option. Request New Invitation notifies all Super Admins (REQ-031-128)."}}
  - {"op": "update_node", "id": "REQ-031-042", "attrs": {"statement": "A Super Admin can resend an invitation for an invitation that is still pending (Invited or Pending Send) or has expired: System generates a new token, sends a new email, and invalidates the old token. The invitee receives a fresh invitation with a new expiry. The Pending Invitations sub-tab shows a notification dot when invitations are about to expire (< 24 hours)."}}
  - {"op": "update_node", "id": "REQ-031-043", "attrs": {"statement": "If the invitation email fails to send, System logs each failed delivery in the audit trail and retries under the notification retry rule owned by FR-030 (this flow sets no retry count or interval of its own). While sending fails the invitation shows \"Pending Send\" and the Super Admin is warned \"Invitation created but the email could not be sent yet. The system keeps retrying and the invitation expires if it is still unsent after 24 hours.\"; if the invitation still cannot be sent 24 hours after it was created, it becomes \"Expired\" and the system alerts the admin team. The Super Admin can resend the invitation."}}
  - {"op": "update_node", "id": "REQ-031-046", "attrs": {"statement": "The new admin user must accept the Admin Terms of Service (\"You must accept the Admin Terms of Service to continue.\"); \"Create Account\" stays disabled until all required fields are valid and terms are accepted. Acceptance belongs to this feature; the legal text is managed in FR-027."}, "title": "Admin Terms of Service acceptance required"}
  - {"op": "update_node", "id": "REQ-031-049", "attrs": {"statement": "When the new admin user clicks Create Account, System validates all inputs, sets the account Active with the role from the invitation, marks the invitation \"Accepted\", logs the account creation in the audit trail, sends a confirmation email to both the new admin user and the Super Admin who sent the invitation, shows \"Account created successfully! Redirecting to login...\" and redirects to the admin login page after 3 seconds. The new admin user can log in immediately."}}
  - {"op": "update_node", "id": "REQ-031-053", "attrs": {"statement": "Suspended admin users cannot log in but their accounts remain in the system (soft suspension); Super Admin accounts are never suspended inside the product. Super Admins can suspend (with a required reason), reactivate, and delete a suspended non-Super Admin account (REQ-031-126)."}}
  - {"op": "update_node", "id": "REQ-031-054", "attrs": {"statement": "A Super Admin can assign or change the role of any admin user except Super Admin accounts."}}
  - {"op": "update_node", "id": "REQ-031-057", "attrs": {"statement": "Custom admin roles can be created, edited, and deleted (deleted only while no admin user, including an Invited account, and no pending role change holds the role). A role name is unique within the role's guard (max 50 characters) and a role description is required (max 500 characters). Clone Role creates a new custom admin role based on an existing role, named \"Copy of [role name]\" and cut to 50 characters."}}
  - {"op": "update_node", "id": "REQ-031-067", "attrs": {"statement": "The admin permissions Edit Settings, Manage Users and Manage Roles are write permissions reserved for Super Admin only. The following actions are also Super Admin only: the Manage Localization actions of FR-021 (editing English source values, changing the default language, publishing, rollback, moving a language to Active, the free-text translation switch and budget, and machine translation credentials), the Affiliate Program Settings panel and the commission ceiling override under Manage Affiliates, Login as Provider (REQ-015-069), and the Support Center settings (Screen 7 of FR-034) and the support audit export (REQ-034-094)."}}
  - {"op": "update_node", "id": "REQ-031-068", "attrs": {"statement": "Provider permissions Manage Bank Details and Edit Settings are Owner only; Document Treatment is limited to Owner or Clinical Staff (not Manager); Remove Team Members is limited to Owner (any non-Owner member) or Manager (Clinical Staff and Billing Staff only); Invite Team Members and Edit Team Member Roles (non-Owner) are limited to Owner or Manager, and a Manager may invite or set only Clinical Staff and Billing Staff and cannot create a Manager."}}
  - {"op": "update_node", "id": "REQ-031-069", "attrs": {"statement": "The admin permission Issue Refunds is a write permission that requires approval by another admin holding the permission, never the requester; FR-007 owns the approval step and its 2-business-day escalation."}}
  - {"op": "update_node", "id": "REQ-031-070", "attrs": {"statement": "Permission dependencies apply across all roles: selecting any write permission that has a matching View permission (such as Edit Patients, Manage Aftercare or Moderate Reviews) automatically selects that View permission (for example \"Edit Patients\" requires \"View Patients\") and the dependency is highlighted."}, "title": "A write permission selects its View automatically"}
  - {"op": "update_node", "id": "REQ-031-072", "attrs": {"statement": "Permissions are organised by module code (A-01, A-02 for admin; PR-01, PR-02 for provider) for traceability, and a Select All checkbox is available for each category. Select All skips the Super Admin-only permissions."}}
  - {"op": "update_node", "id": "REQ-031-073", "attrs": {"statement": "When a permission matrix is saved with a newly granted sensitive permission, and again when a role holding one is assigned to a user, System shows a warning modal \"This role grants access to sensitive features: [Issue Refunds, Process Payouts, Manage Users]. Confirm?\" together with the full permission summary; the Super Admin either confirms or cancels. Sensitive permissions are all financial write permissions (refunds, payouts, payment settings), Manage Roles, Manage Users and Delete Patients."}}
  - {"op": "update_node", "id": "REQ-031-076", "attrs": {"statement": "In Single Role Mode, Reset to Default resets a predefined role to its default permissions (the full default tables, REQ-031-134) and is not offered on custom roles, and Preview Impact shows which users and providers will be affected by the changes. In matrix mode, Reset Role to Default resets the selected predefined roles and asks for confirmation when unsaved changes exist."}}
  - {"op": "update_node", "id": "REQ-031-077", "attrs": {"statement": "The matrix view shows permissions as rows grouped by category/module and all roles of the same type (Admin or Provider, including custom admin roles) as columns, with checkboxes or access-level indicators. Super Admins can edit several roles at once and save all changes together; bulk actions are Select All on a column header, Select All on a row header, and Select Category, all of which skip the Super Admin-only permissions (their cells stay disabled for every role other than Super Admin); locked cells (Super Admin, Owner) show a lock icon and a disabled checkbox. The matrix can be filtered by category, searched by permission name, set to show only differences, sorted by role or permission, and exported to CSV or Excel."}}
  - {"op": "update_node", "id": "REQ-031-079", "attrs": {"statement": "The Provider Roles tab shows \"Last synced to Provider Platform: [timestamp]\". A role whose sync failed shows \"Sync failed\" and \"not yet applied\" until a retry succeeds (REQ-031-130)."}}
  - {"op": "update_node", "id": "REQ-031-082", "attrs": {"statement": "To change an admin user's role, the Super Admin opens Change Role, picks the new role and sets Effective From (default now); System shows the permission comparison and effective date/time, requires confirmation, validates that Effective From is not before now, and stores the new role as the user's pending role with its Effective From; the current role stays in force until then and a second change made before then replaces the pending one (REQ-031-125). At Effective From the pending role becomes the user's role and System enforces its permissions on the first API call at or after that time."}}
  - {"op": "update_node", "id": "REQ-031-085", "attrs": {"statement": "A warning banner \"Warning: Only one Super Admin account. Consider adding backup admin.\" is shown on the Admin Users tab while only one Super Admin exists. No Super Admin can be demoted, removed or deactivated inside the product (REQ-031-009)."}, "title": "Warning banner while only one Super Admin exists"}
  - {"op": "update_node", "id": "REQ-031-090", "attrs": {"statement": "System sends an alert to Super Admin when one admin is refused access 5 times within 10 minutes (launch default; the count and the time window are each an admin setting in A-09; potential security issue)."}}
  - {"op": "update_node", "id": "REQ-031-093", "attrs": {"statement": "Super Admins can send a password reset from the user detail page, which forces a password reset on the user's next login. An account still in the Invited status does not support password reset (no password set yet): the user must request a new invitation from a Super Admin, and the original invitation token is invalidated to prevent duplicate accounts."}}
  - {"op": "update_node", "id": "REQ-031-094", "attrs": {"statement": "The audit trail on the user detail page shows the last 30 days by default, 100 rows at a time with a Load More option, and the date range filter reaches further back; it shows access-control events only (REQ-031-132). Each row shows timestamp, action type (Login, Role Change, Permission Grant, Access Denied, Password Reset, User Suspended, User Reactivated, User Deleted, Account Created, Role Created, Role Deleted, Role Permissions Edited, Invitation Sent, Invitation Resent, Invitation Cancelled, Invitation Delivery Failed, Sensitive Access), details, IP address and outcome (Success, Failed, Denied). Sensitive actions (role changes, permission grants) are highlighted, and role change events offer a comparison of old and new role permissions. Login failures are logged with the reason (invalid password, account suspended, and so on)."}}
  - {"op": "update_node", "id": "REQ-031-099", "attrs": {"statement": "The maximum failed login attempts before lockout (default 5 failed attempts with a 15-minute lockout, the same setting as FR-001; the admin login rate limit of REQ-031-100 is a separate control and whichever trips first applies, REQ-026-116), the session timeout duration (the admin inactivity timeout of A-09, whole minutes from 5 to 240, default 30) and the number of concurrent sessions per admin user (default 3, range 1-5; at the limit a new sign-in ends the oldest session) are configurable in A-09 Authentication Settings."}}
  - {"op": "update_node", "id": "REQ-031-124", "attrs": {"statement": "System MUST ask an admin user to acknowledge a role change within 24 hours of it taking effect; the acknowledgement time is stored on the account and shown to Super Admins, who see an \"Overdue\" flag when it is late; nothing is blocked and no reminder is sent."}}
  - {"op": "update_node", "id": "REQ-031-102", "attrs": {"statement": "Permission category \"Patient Management\" (A-01) in the admin permission matrix offers: View Patients (View patient list and profiles; Read); Edit Patients (Modify patient information; Write); Delete Patients (Approve patient account deletion requests (FR-016); Delete)."}}
  - {"op": "update_node", "id": "REQ-031-103", "attrs": {"statement": "Permission category \"Provider Management\" (A-02) in the admin permission matrix offers: View Providers (View provider list and profiles; Read); Edit Providers (Modify provider information; Write); Onboard Providers (Create new provider accounts; Write); Suspend Providers (Suspend/activate provider accounts, including Reject Request on an account-closure request; Delete)."}}
  - {"op": "update_node", "id": "REQ-031-106", "attrs": {"statement": "Permission category \"Reviews & Ratings Management\" (A-01) in the admin permission matrix offers: View Reviews (View all patient reviews; Read); Moderate Reviews (Decide takedown requests, remove a review, remove a provider response and resolve a flag; Write); Add Reviews (Import authenticated reviews for providers; Write); Manage Review Categories (Configure review categories and labels; Write); Manage Review Settings (Configure photo guidelines, the removal reason catalog, flagging and the takedown decision deadline; Write); Export Reviews (Export review data (audited); Read)."}}
  - {"op": "update_node", "id": "REQ-031-107", "attrs": {"statement": "Permission category \"Billing & Financial\" (A-05) in the admin permission matrix offers: View Transactions (View patient and provider transactions; Read); Process Payouts (Initiate provider payouts; Write); Issue Refunds (Process patient refunds; Write (requires approval by another admin holding this permission, never the requester; the approval step and its 2-business-day escalation are defined in FR-007)); View Financial Reports (Access revenue analytics; Read); View Patient Billing (View patient invoices and payment status; Read); Send Payment Reminders (Send payment reminders to patients; Write); Retry Charge (Retry a failed patient payment charge (FR-007B); Write); Download Invoices (Download patient/provider invoices; Read)."}}
  - {"op": "update_node", "id": "REQ-031-109", "attrs": {"statement": "Permission category \"Affiliate Management\" (A-07) in the admin permission matrix offers: View Affiliates (View affiliate list and details; Read); Manage Affiliates (Add affiliates, edit profiles and commission rules, generate codes, suspend, reinstate, offboard and ban; Write (the Affiliate Program Settings panel and the commission ceiling override stay Super Admin only)); Process Affiliate Payouts (Process affiliate commission payments; Write); View Affiliate Performance (View referral counts and conversions; Read)."}}
  - {"op": "update_node", "id": "REQ-031-111", "attrs": {"statement": "Permission category \"Communication & Support\" (A-10) in the admin permission matrix offers: View Support Center (Access patient support cases; Read); Respond to Support (Send messages to patients/providers; Write); View Provider-Patient Messages (Read patient and provider conversations for monitoring; Read); Flag Communications (Flag suspicious or policy-violating messages; Write); Enable Emergency Intervention (Step into a conversation as an emergency intervention (FR-012); Write); Export Conversation Transcripts (Export chat transcripts for compliance (deferred to a future phase; conversation export is not available yet); Read)."}}
  - {"op": "update_node", "id": "REQ-031-113", "attrs": {"statement": "Permission category \"System Settings\" (A-09) in the admin permission matrix offers: View Settings (View system configuration; Read); Edit Settings (Modify system settings; Write (Super Admin only)); Manage Users (Create/edit admin accounts; Write (Super Admin only)); Manage Roles (Create/edit roles and permissions; Write (Super Admin only)); Manage App Data (Edit countries, discovery questions, location presentation and starting prices; Write); Manage Treatment Catalog (Create, edit and deactivate treatments and manage the treatment types list; provider packages are view-only for admins; Write); Manage Aftercare Templates (Create/edit aftercare milestone templates; Write); Manage Notification Templates (Edit email templates (OTP, confirmations); Write); Configure Payment Settings (Manage Stripe accounts, commission rates, split pay (the permission FR-029 calls PaymentConfigAdmin); Write); Manage Help Centre (Create/edit Help Centre content for providers and patients; Write); View Sensitive Settings (View the full value of sensitive settings (for example API keys); Read); Manage Authentication Policies (Edit authentication policy settings (for example lockout, session timeout and the one-time-code (OTP) settings); Write); Manage Localization (Manage languages, translations and machine translation (FR-021); Write (editing English source values, changing the default language, publishing, rollback, moving a language to Active, the free-text translation switch and budget, and machine translation credentials stay Super Admin only))."}}
  - {"op": "update_node", "id": "REQ-031-119", "attrs": {"statement": "Permission category \"Team Management\" (PR-01) in the provider permission matrix offers: View Team Members (View team member list; Read); Invite Team Members (Send team member invitations; Write (a Manager may invite Clinical Staff and Billing Staff only)); Edit Team Member Roles (Change team member roles (non-Owner); Write (Owner or Manager only; a Manager may set only Clinical Staff and Billing Staff and cannot create a Manager)); Remove Team Members (Remove or suspend team members; Write (Owner: any non-Owner member; Manager: Clinical Staff and Billing Staff only)); View Team Activity (Access team activity logs; Read)."}}
  - {"op": "update_node", "id": "REQ-031-120", "attrs": {"statement": "Permission category \"Provider Settings\" (PR-06) in the provider permission matrix offers: View Profile (View provider profile information; Read); Edit Profile (Update provider profile details; Write); Manage Treatments (Set a treatment Offered or Not Offered and configure its pricing, including Quick Copy Pricing (FR-024); Write); Manage Packages (Create, edit, clone and deactivate packages and use quick price edit (FR-024); Write); Manage Promotions (Create and edit discount codes; Write); View Settings (View provider settings; Read); Edit Settings (Modify provider settings; Write (Owner only))."}}
  - {"op": "update_node", "id": "SET-admin-invitation-token-expiry", "attrs": {"description": "Lifetime of an admin team invitation token, configurable by Super Admin in A-09 settings; range 1-30 days, 7 days at launch. It applies to admin team invitations only."}}
  - {"op": "update_node", "id": "SET-admin-repeated-denial-threshold", "attrs": {"description": "Refusals of one admin that trigger the Super Admin alert: 5 refusals at launch; an admin setting in A-09 (FR-031 Alternative Flow B5, Admin Editability). The time window is SET-admin-repeated-denial-window."}}
  - {"op": "update_node", "id": "ENT-permission.is_sensitive", "attrs": {"description": "Flag that triggers the sensitive-permission warning (REQ-031-073)."}}
  - {"op": "update_node", "id": "ENT-role-permission-definition.last_synced_at", "attrs": {"description": "Shown as the sync status indicator on the provider roles tab; a role whose sync failed shows Sync failed and not yet applied until a retry succeeds."}}
  - {"op": "update_node", "id": "ENT-admin-user-account.role_effective_from", "attrs": {"description": "When the current assigned role became active for authorization checks; a later change waits in the pending role fields until its Effective From."}}
  - {"op": "update_node", "id": "SCR-031-01", "attrs": {"description": "Admin Platform, Settings > User Roles & Permissions, three tabs: Admin Roles, Admin Users, Provider Roles (PRD Screen 1). UI controls, not fields: tab switcher, role list action buttons (Edit Permissions, View Users, Clone Role, and Delete on custom roles; Edit Permissions and Clone Role are disabled for Super Admin), Create Custom Role, Invite Team Member, user action menu (Change Role, Suspend or Reactivate, Delete on a suspended account, View Audit; a Super Admin row shows View Audit only), search bar and filters (Tab 2 specified in FR-022 REQ-022-115, Tab 1 in REQ-022-116), Pending Invitations sub-tab (Resend, Cancel) and notification dot, sync status indicator, warning banner when only one Super Admin exists. Tab 3 View Users links to FR-015. Tab 2 rows also show whether the user has acknowledged the latest role change (Acknowledged, Awaiting acknowledgement or Overdue) and any pending role change with its Effective From."}}
  - {"op": "update_node", "id": "SCR-031-05", "attrs": {"description": "Admin Platform page with an admin user's profile and audit trail (PRD Screen 5). UI controls: Send Password Reset, Load More, Export audit trail to CSV, security alerts, audit filters (specified in FR-022 REQ-022-117). The audit trail shows access-control events only (REQ-031-132); actions on patient accounts stay in the FR-016 patient action log, and patient accounts and admin accounts remain separate records. Shows the Role Change Acknowledged status (Acknowledged, Awaiting acknowledgement or Overdue)."}}
