# FR-037 logic review (second pass): ruled fixes applied to the PRD. New steps and fields come first, then field and rule updates, removed edges and retired steps, and new edges.
# Cross-FR edges: none added. Removed (outbound, FR-037 to FR-003): STP-037-044 -> STP-003-066, STP-037-045 -> STP-003-020. STP-003-019 stays the single router; STP-003-014 -> STP-037-043 is unchanged.
# Not touched here (owned elsewhere): assignment-ended event row (FR-020/FR-030), the provider_withdrawn and provider_assigned event wording (FR-030/FR-020), the FR-003 problem-duration contract (FR-003/FR-026), STP-003-065 (FR-003).
reason: "FR-037 logic review (second pass): open advice window expires at assignment end, Request Treatment shows no confirmation, advice state ended and the Assign and Share gates, assignment-end notifications and end cause and reason, Admin step for the case list, flowchart returns, PDF failure and retry on a converted case, Duration as an option reference and label, provider routing evaluated when submission succeeds, single FR-003 router (steps 044 and 045 retired), Admin-editable list, Admin advice-text notice, first recorded severity, resumed draft rebuilt, preview expiry range, cadence audit."
by: docs-manager
