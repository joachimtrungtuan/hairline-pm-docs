  - {"op": "update_node", "id": "ENT-monitoring-case.duration", "attrs": {"description": "Screen 1: the label of the option chosen from the FR-026-managed problem-duration list (FR-003, REQ-003-122), stored with its option reference (duration_option_id) at capture. Only active options are offered; conversion asks for a new choice when the option is no longer active (REQ-037-035)."}}
  - {"op": "update_node", "id": "ENT-monitoring-advice-window.start_date", "attrs": {"description": "The first window starts one cadence period (7 or 14 days) after the provider is first assigned; after a reassignment the replacement provider's first window starts one cadence period after the new assignment (REQ-037-013)."}}
  - {"op": "update_node", "id": "ENT-monitoring-case.advice_state", "attrs": {"description": "Advice mode only: not requested, pending assignment, assigned, pending reassignment or ended (set when the case is completed or converted) (Screen 2 Provider Advice Status)."}}
  - {"op": "update_node", "id": "ENT-monitoring-case.severity_summary", "attrs": {"description": "First recorded severity, latest, minimum, maximum, average and trend (Screens 6 and 7 Step A)."}}
  - {"op": "update_node", "id": "ENT-monitoring-case.starting_severity", "attrs": {"description": "Screen 1 Initial Severity: integer 1 to 10. A trend point dated on the case creation date that follows the same-date rule (REQ-037-057)."}}
  - {"op": "update_node", "id": "ENT-monitoring-conversion.provider_routing", "attrs": {"description": "The exclusive-provider routing applied when the inquiry submission succeeds (REQ-037-029)."}}
  - {"op": "update_node", "id": "REQ-037-013", "attrs": {"statement": "Each advice window MUST open on its calculated start date and remain actionable without an ordinary deadline until its single advice is submitted or a successor window opens; a successor MUST expire only the older unsubmitted window and become the sole actionable window. The cadence is the spacing between window openings. The first window MUST open one cadence period (7 or 14 days) after the provider is first assigned; an open, unanswered window MUST expire when the assignment ends, for any cause; windows MUST then pause while the case has no assigned provider, and the first window for a replacement provider MUST open one cadence period after the new assignment. Window dates MUST be UTC dates. A future window is derived from its start date, so the stored window state has three values (available, submitted, expired)."}}
  - {"op": "update_node", "id": "REQ-037-018", "attrs": {"statement": "Admin MUST be able to generate and revoke a read-only pre-assignment case-preview link for a candidate provider, MUST select its expiry at share time (any time from 1 to 14 days), and preview access MUST NOT create an assignment or ongoing case access. Open previews MUST be revoked on assignment, completion, and conversion."}}
  - {"op": "update_node", "id": "REQ-037-021", "attrs": {"statement": "Conversion MUST pre-fill compatible information and allow the patient to edit all copied fields; a Duration whose stored option is no longer active MUST be chosen again."}}
  - {"op": "update_node", "id": "REQ-037-023", "attrs": {"statement": "Conversion MUST attach a PDF containing logs, scan photos, logged-day count, and severity summary; if generation fails three times, conversion proceeds without it and the PDF MUST be attached once a retry succeeds (REQ-037-059)."}}
  - {"op": "update_node", "id": "REQ-037-026", "attrs": {"statement": "System MUST audit all medical-data access, advice submissions and edits, preview-link creation/access/expiry/revocation, exports, assignments, withdrawals, conversions, and advice-cadence changes."}}
  - {"op": "update_node", "id": "REQ-037-029", "attrs": {"statement": "If an assigned advice provider exists when the FR-003 inquiry submission succeeds, only that provider MUST initially be selected to quote. Exclusive routing ends only when that provider explicitly declines before quote creation (FR-003 MUST audit the reason) or when redistribution follows the provider's suspension or deactivation (REQ-003-072); either way FR-003 MUST remove exclusive routing and execute normal distribution exactly once. If no provider is assigned at that moment, or the assigned provider has withdrawn or is not eligible at that moment, conversion MUST continue and FR-003 normal distribution MUST apply immediately. Exclusive routing MUST bypass only FR-003 country and provider-selection matching and the 10-provider cap; anonymization, notification timing, and provider dashboard behavior MUST remain unchanged. Expiry MUST remain governed by FR-003/FR-004 rather than this decline fallback."}}
  - {"op": "update_node", "id": "REQ-037-035", "attrs": {"statement": "Hair-loss monitoring intake captures Nature of Concern (required, 1 to 2000 characters), Duration (required; only active options of the FR-026-managed problem-duration list are offered, and the case stores the option reference and its label at capture), Previous Treatments or \"None\" (required, maximum 2000 characters), Initial Severity (required, integer 1 to 10), Lifestyle Factors and Additional Notes (optional, maximum 2000 characters each), Initial Photos (optional, FR-003 image limits) and an Initial Head Scan (optional, FR-002 quality contract)."}}
  - {"op": "update_node", "id": "REQ-037-040", "attrs": {"statement": "The patient may create, edit, or delete their own entries while the case is active; all versions remain auditable. Deleted and superseded entries are excluded from every count and from the severity trend, and First recorded severity is recalculated from the remaining entries (the first remaining trend point, which can be the intake rating)."}}
  - {"op": "update_node", "id": "REQ-037-052", "attrs": {"statement": "End Monitoring shows the patient a preview of date range, logged-day count, scan count, and severity trend. The patient makes a single completion choice (complete and export, or Request Treatment). Complete and export requires a confirmation that acknowledges monitoring will end; Request Treatment shows no confirmation and does not end monitoring until the FR-003 inquiry is successfully submitted (Step A states that monitoring ends when the inquiry is submitted); declining returns to the active case."}}
  - {"op": "update_node", "id": "REQ-037-053", "attrs": {"statement": "Completing or successfully converting ends the active case and any advice assignment, sets the advice state to ended, revokes open case previews, and removes the case from the Admin queue."}}
  - {"op": "update_node", "id": "REQ-037-054", "attrs": {"statement": "A completed or converted case is read-only except for Admin audited correction of its content; its status stays final and Admin cannot edit it. A converted case's summary PDF can be viewed on the summary screen like a completed case's, and Retry PDF stays available there while the PDF has failed."}}
  - {"op": "update_node", "id": "REQ-037-055", "attrs": {"statement": "Summary PDFs are generated asynchronously and the generated artifact is retained; the patient is notified when the PDF is ready. A failed generation is retryable on a completed or converted case without altering it. The PDF is regenerated when logs or the selected scan change after it was made."}}
  - {"op": "update_node", "id": "REQ-037-057", "attrs": {"statement": "Monitoring summary values are derived from valid entries: deleted and superseded entries are excluded from every count and from the severity trend. The monitoring period is the date range from the earlier of the case creation date and the earliest log date through the final case date. The severity trend is in date order; the Initial Severity given at intake is a trend point dated on the case creation date that follows the same-date rule (the latest-timestamped entry on a date wins), and the summary's First recorded severity is the first (earliest-dated) remaining trend point, which can be the intake rating, recalculated when entries are deleted or superseded. Logged-day count, scan count, advice count when applicable, and severity latest, minimum, maximum, average, and trend are derived from the same valid entries. A case with zero logs starts its period on the case creation date, shows the Initial Severity as a one-point trend, and shows no log entries."}}
  - {"op": "update_node", "id": "REQ-037-059", "attrs": {"statement": "If PDF generation has not finished, the conversion summary step shows generation status and allows the patient to continue once it is ready or retry on failure. After three failed tries the PDF is marked failed and the patient can continue without it: the conversion proceeds, the inquiry shows \"summary pending\", and Admin sees the failure on the case overview. Retry PDF works on the converted case, and a successful retry attaches the PDF to the inquiry."}}
  - {"op": "update_node", "id": "REQ-037-060", "attrs": {"statement": "The conversion summary step states, when an advice provider has an active assignment, that the assigned advice provider will be the only initial quote recipient if still assigned when the patient submits the inquiry."}}
  - {"op": "update_node", "id": "REQ-037-064", "attrs": {"statement": "When FR-003 data is invalid or submission fails, System preserves the monitoring case and the conversion draft and shows corrections or a retry option. The conversion draft is held by the patient's app and is not stored on the case; when a kept draft is resumed, the PDF and carried-over values are rebuilt from the current case."}}
  - {"op": "update_node", "id": "REQ-037-067", "attrs": {"statement": "Reassignment cases display the withdrawal reason and prior assignment history to Admin; the replacement provider receives the case history and the date of the first window after reassignment."}}
  - {"op": "update_node", "id": "REQ-037-069", "attrs": {"statement": "The provider assigned when the inquiry submission succeeds is eligible to receive the inquiry; if that provider has withdrawn or is not eligible at that moment, conversion continues and the case follows the no-assigned-provider path."}}
  - {"op": "update_node", "id": "REQ-037-072", "attrs": {"statement": "Admin may edit all patient-supplied monitoring information, logs, severity ratings, scan metadata, and advice records where operational correction is required, each with a reason, but never the case status (completed and converted are final); assignment changes happen only through the assignment controls, conversion provenance is fixed, and no edit may erase historical values or provenance."}}
  - {"op": "update_node", "id": "REQ-037-074", "attrs": {"statement": "Admin edits to advice preserve the provider as original author, retain every prior version, and surface the edited cue and latest-edit timestamp. An Admin change to the advice text sends the patient the same advice notification marked \"updated\"; other corrections send no notification."}}
  - {"op": "update_node", "id": "REQ-037-078", "attrs": {"statement": "The patient is notified when a provider is assigned, withdraws, is replaced, or posts advice; editing posted advice, or an Admin change to its text, sends the same advice notification marked \"updated\". When an assignment ends other than by the provider's withdrawal, the patient and Admin are notified; the provider is also notified, in neutral wording that does not show the reason, when Admin ends the assignment, and receives no notice on completion or conversion. Provider and Admin are notified of assignment and reassignment actions."}}
  - {"op": "update_node", "id": "REQ-037-079", "attrs": {"statement": "FR-037 notifications are limited to assignment, reassignment, assignment-ended, advice, withdrawal, completion, export-ready, and conversion events. FR-037 defines no patient-configurable logging or scan reminder for hair-loss cases; reminders belong to transplant-progress cases only (FR-038, REQ-038-031)."}}
  - {"op": "update_node", "id": "REQ-037-094", "attrs": {"statement": "Admin can assign a provider and share a case preview with a candidate provider only while the case is active and in Pending Assignment or Pending Reassignment. Admin can end an assignment with a reason, and it ends automatically when the provider is suspended or deactivated (FR-015); the case then returns to Pending Reassignment and the provider's access ends. The assignment record keeps the end cause and, for an Admin end, the reason; the reason is not shown to the provider."}}
  - {"op": "update_node", "id": "STP-037-029", "title": "System revokes provider access, records how the assignment ended, marks Pending Reassignment and notifies"}
  - {"op": "update_node", "id": "STP-037-047", "title": "Patient retries the PDF generation on the completed or converted case"}
