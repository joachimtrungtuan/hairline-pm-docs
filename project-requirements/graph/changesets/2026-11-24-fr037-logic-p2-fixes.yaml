  - {"op": "add_field", "id": "ENT-monitoring-provider-assignment.end_cause", "entity_id": "ENT-monitoring-provider-assignment", "name": "end_cause", "data_type": "enum", "title": "End cause", "owner_fr": "FR-037", "required": false, "attrs": {"description": "How an assignment ended other than by the provider's withdrawal (that is status withdrawn): Admin ended it, the provider was suspended or deactivated, the case was completed or converted, or a reassignment replaced it. Empty while the assignment is active. Shown on Screens 12 and 13."}}
  - {"op": "add_field", "id": "ENT-monitoring-provider-assignment.end_reason", "entity_id": "ENT-monitoring-provider-assignment", "name": "end_reason", "data_type": "text", "title": "End reason", "owner_fr": "FR-037", "required": false, "attrs": {"description": "Reason Admin enters when ending the assignment; required in that case, empty otherwise. Visible to Admin on Screens 12 and 13, not shown to the provider (REQ-037-094)."}}
  - {"op": "add_field", "id": "ENT-monitoring-case.duration_option_id", "entity_id": "ENT-monitoring-case", "name": "duration_option_id", "data_type": "id", "title": "Duration option ID", "owner_fr": "FR-037", "required": true, "attrs": {"description": "Reference to the option chosen from the FR-026-managed problem-duration list (FR-003, REQ-003-122) at capture; only active options are offered (REQ-037-035)."}}
