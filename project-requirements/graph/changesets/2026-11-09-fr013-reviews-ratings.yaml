  # --- Screens
  - {"op": "add_node", "id": "SCR-013-01", "type": "Screen", "owner_fr": "FR-013", "title": "Patient - Submit Review", "attrs": {"platform": "patient", "description": "Eligible patients submit a structured post-procedure review: read-only clinic and treatment labels, five star ratings, feedback and optional photos. Rating rows use a row-select interaction (tap row to set or update the score) and show selected values as X/5 star. Saving publishes immediately."}}
  - {"op": "add_node", "id": "SCR-013-02", "type": "Screen", "owner_fr": "FR-013", "title": "Patient - Submitted Reviews List (My Reviews)", "attrs": {"platform": "patient", "description": "Card list of the patient's submitted reviews across treatment cases: rating and relative time, status badge, optional takedown request badge, treatment line, two-line excerpt with See more, provider row, header sort icon, empty state."}}
  - {"op": "add_node", "id": "SCR-013-03", "type": "Screen", "owner_fr": "FR-013", "title": "Patient - Review Detail and Takedown Request", "attrs": {"platform": "patient", "description": "Full submitted review with provider response when available, admin removal reason when removed, Edit review and Request takedown actions for Published reviews, and the takedown confirmation bottom sheet/modal with required reason and retention notice."}}
  - {"op": "add_node", "id": "SCR-013-04", "type": "Screen", "owner_fr": "FR-013", "title": "Patient - Provider Profile Reviews Section", "attrs": {"platform": "patient", "description": "The FR-013 review section embedded in the existing patient-facing provider profile used in quote and provider evaluation: rating summary teaser, review preview list, View all full list, reviewer alias, provider response and Verified Off-platform badge. Not a standalone provider profile screen."}}
  - {"op": "add_node", "id": "SCR-013-05", "type": "Screen", "owner_fr": "FR-013", "title": "Provider - Reviews List and Filters", "attrs": {"platform": "provider", "description": "List of the provider's published reviews across treatment cases with ratings summary, source type, reviewer alias, case context, response status, filters and sort. Final placement (dashboard list or embedded in the provider profile detail) is a UX/UI design decision."}}
  - {"op": "add_node", "id": "SCR-013-06", "type": "Screen", "owner_fr": "FR-013", "title": "Provider - Review Detail and Response", "attrs": {"platform": "provider", "description": "Review detail for the provider with an inline response composer (not a separate screen): Respond as Provider, response text with live character counter, cancel with confirmation, submit."}}
  - {"op": "add_node", "id": "SCR-013-07", "type": "Screen", "owner_fr": "FR-013", "title": "Admin - Reviews Management List", "attrs": {"platform": "admin", "description": "Global paginated review list with source type, flagged and response badges, filters, search, and navigation to detail, takedown queue and review settings."}}
  - {"op": "add_node", "id": "SCR-013-08", "type": "Screen", "owner_fr": "FR-013", "title": "Admin - Review Detail, Insert and Edit", "attrs": {"platform": "admin", "description": "Admin inspects a review, edits or removes it with a reason, and inserts authenticated off-platform reviews with a structured source verification group."}}
  - {"op": "add_node", "id": "SCR-013-09", "type": "Screen", "owner_fr": "FR-013", "title": "Admin - Takedown Requests Queue", "attrs": {"platform": "admin", "description": "Queue of pending and resolved patient takedown requests with linked review preview, approve or reject action, required decision note and admin removal reason, decision history."}}
  - {"op": "add_node", "id": "SCR-013-10", "type": "Screen", "owner_fr": "FR-013", "title": "Admin - Review Settings and Export", "attrs": {"platform": "admin", "description": "Review categories/labels, photo guidelines, removal reason catalog, reviewer display policy, flagging thresholds, takedown SLA settings, read-only link-outs to FR-030 for invitation and reminder cadence, and the review export action."}}
