  - {"op": "add_node", "id": "REQ-013-020", "type": "Rule", "owner_fr": "FR-013", "title": "Takedown modal with required reason and 7-year retention notice", "attrs": {"statement": "Takedown request submission MUST use a confirmation modal/bottom-sheet with required patient reason and explicit 7-year retention-policy notice before submission.", "rationale": "Screen 3 rules: the takedown request is submitted from a bottom sheet/modal with required reason and mandatory retention-policy notice. The notice text is display-only policy text: \"Review content will be removed from public view but archived for a 7-year minimum (medical-records retention). Audit records of this takedown are retained for 10 years (audit-log policy).\" Change Log 1.14 makes the reason required."}}
  - {"op": "add_node", "id": "REQ-013-021", "type": "Rule", "owner_fr": "FR-013", "title": "Provider inline response composer with validation and cancel", "attrs": {"statement": "Provider Review Detail MUST include a documented inline response-composer model/state (not separate screen navigation) with validation, cancel/confirm behavior, and immutable post-publish response rendering.", "rationale": "Screen 6 rules: the composer is an inline state of the screen, not a separate navigation screen; Cancel response asks for confirmation if unsaved content exists; Submit response is enabled only when validation passes."}}
  - {"op": "add_node", "id": "REQ-013-022", "type": "Rule", "owner_fr": "FR-013", "title": "Admin review settings and restricted export; cadence owned by FR-030", "attrs": {"statement": "Admin Review Settings MUST support review category labels, photo guidelines, removal reason catalog, reviewer display policy, restricted flagging/SLA settings, and RBAC-restricted export actions with audit logging. Review invitation and reminder cadence are owned by FR-030 (Notification Rules & Configuration); Screen 10 provides link-outs only.", "rationale": "Screen 10 and its rules. Change Logs 1.12 and 1.14 move invitation and reminder cadence to FR-030 and leave Screen 10 with read-only link-outs."}}
  - {"op": "add_node", "id": "REQ-013-023", "type": "Rule", "owner_fr": "FR-013", "title": "Per-treatment sub-scores endpoint for FR-014 (PRD id REQ-013-018a)", "attrs": {"statement": "System MUST additionally expose a per-treatment aggregated sub-scores endpoint that returns, for a given provider, `{treatment_id → {avg_overall, avg_facility, avg_staff, avg_results, avg_value, review_count, distribution}}` over Published reviews only. This endpoint is the data contract consumed by FR-014 \"review sub-scores per treatment\" analytics; cache invalidation MUST be triggered on every review publish, edit republish, removal, and approved takedown.", "rationale": "Renumbered from REQ-013-018a because Rule ids carry digits only. Change Log 1.13 item 4; Dependencies FR-014."}}
  - {"op": "add_node", "id": "REQ-013-024", "type": "Rule", "owner_fr": "FR-013", "title": "Entry points to reviews, takedown requests and review settings", "attrs": {"statement": "Time-gated invite after confirmed procedure completion (≥ 3 months) triggers review flow. Patient navigates to “Write a Review” from provider history. Patient views published reviews from provider profile/offer evaluation surfaces. Patient navigates to “Submitted Reviews” to view review history and request takedown from detail page. Providers access “Reviews” in dashboard to list/filter/detail reviews and respond. Admins access “Review Management”, “Takedown Requests”, and “Review Settings” from Admin platform navigation."}}
  - {"op": "add_node", "id": "REQ-013-025", "type": "Rule", "owner_fr": "FR-013", "title": "Submission validated; ineligible attempts blocked with clear messaging", "attrs": {"statement": "System validates inputs (rating ranges, feedback length, file type/size) and verifies eligibility. Ineligible attempts (too early/no completed procedure) are blocked with clear messaging.", "rationale": "Main Flow step 2 and the Edge Cases list. Rating ranges and lengths are in the rating and feedback rule; file limits in the photo rule."}}
  - {"op": "add_node", "id": "REQ-013-026", "type": "Rule", "owner_fr": "FR-013", "title": "Overall and four category ratings required; feedback 100-2000 characters", "attrs": {"statement": "Overall rating and the four category ratings (facility, staff, results, value) are required integers 1-5. Feedback is required and must be 100-2000 characters.", "rationale": "Composed from the Screen 1 data field table (Overall, Facility, Staff, Results, Value Rating, Feedback). Screen 1 notes: the 100-character minimum ensures reviews contain enough substance to be useful to other patients; the 2000-character ceiling deters off-topic walls of text and reduces spam/abuse surface area without truncating genuine narrative experience. Rating rows use a row-select interaction pattern (tap row to set/update score) and display selected values in X/5 star format."}}
  - {"op": "add_node", "id": "REQ-013-027", "type": "Rule", "owner_fr": "FR-013", "title": "Eligibility logic, text lengths and rating scale fixed in code", "attrs": {"statement": "Fixed in Codebase (Not Editable): Eligibility logic requires completed procedure and time threshold. Minimum and maximum lengths for text fields and rating scale bounds.", "rationale": "Admin Editability Rules, Fixed in Codebase list. Statement is the two list items verbatim under the list heading."}}
  - {"op": "add_node", "id": "REQ-013-028", "type": "Rule", "owner_fr": "FR-013", "title": "Review photos optional, up to 5 files; over-limit uploads prevented", "attrs": {"statement": "Photos are optional: up to 5 files, jpg/png, max 10MB each. Photos exceed limits: user informed, upload prevented until compliant.", "rationale": "Composed from the Screen 1 Photos row (Up to 5 files; jpg/png; max 10MB each) and the Edge Cases line (Photos exceed limits: user informed, upload prevented until compliant.)."}}
  - {"op": "add_node", "id": "REQ-013-029", "type": "Rule", "owner_fr": "FR-013", "title": "Photo guidelines shown; display policies and removal right disclosed", "attrs": {"statement": "Clear photo guidelines; sensitive/identifying content discouraged. Disclose display policies and admin's right to remove for violations.", "rationale": "Screen 1 business rule and notes. The guideline text is the admin setting photo guidelines text."}}
  - {"op": "add_node", "id": "REQ-013-030", "type": "Rule", "owner_fr": "FR-013", "title": "Patient may edit a published review at any time; edits publish immediately", "attrs": {"statement": "Patient can edit their published review at any time. `Edit Review` opens pre-filled form fields; saved edits are published immediately (no moderation gate).", "rationale": "Screen 1 rule (\"One review per completed procedure; patient can edit their published review at any time.\") and Screen 3 rule (`Edit Review` opens pre-filled form fields; saved edits are published immediately (no moderation gate).). Edit availability by status is in the Screen 3 actions rule."}}
  - {"op": "add_node", "id": "REQ-013-031", "type": "Rule", "owner_fr": "FR-013", "title": "Publish and edit republish recalculate provider rating metrics", "attrs": {"statement": "System publishes (or republishes, on edit) the review immediately and recalculates provider rating metrics (average, count, distribution) with associated cache invalidation. Recalculation applies whether the action is an initial submission or an edit to an already-published review.", "rationale": "Main Flow step 3. The takedown decision rule repeats the recalculation on approval."}}
  - {"op": "add_node", "id": "REQ-013-032", "type": "Rule", "owner_fr": "FR-013", "title": "Patient edit re-runs flagging, tracks edits, audits and notifies provider", "attrs": {"statement": "On edit (republish), system also: (a) re-runs B2 automated flagging (keyword/duplicate/rate-limit checks) against the new payload, (b) sets `last_edited_at` and increments `edit_count`, (c) writes a full audit record (before/after values, actor=patient), and (d) notifies the provider that an existing review they may have responded to was edited so they can re-evaluate their response.", "rationale": "Main Flow step 4 (Change Log 1.13 item 5). last_edited_at and edit_count are calculated by this rule."}}
  - {"op": "add_node", "id": "REQ-013-033", "type": "Rule", "owner_fr": "FR-013", "title": "Edited reviews show an Edited relative-time marker on public surfaces", "attrs": {"statement": "Edited reviews surface an \"Edited {relative_time}\" marker on all public surfaces (Patient list, Patient detail, Provider list/detail, Provider Profile Reviews Section) so readers can distinguish current content from the original publish.", "rationale": "Main Flow step 5, second sentence."}}
  - {"op": "add_node", "id": "REQ-013-034", "type": "Rule", "owner_fr": "FR-013", "title": "Patient sees confirmation; review live and listed", "attrs": {"statement": "Patient sees confirmation; review is live on provider profile and appears in Patient “Submitted Reviews” list.", "rationale": "Main Flow step 5, first sentence."}}
  - {"op": "add_node", "id": "REQ-013-035", "type": "Rule", "owner_fr": "FR-013", "title": "Admin-seeded reviews flagged Verified Off-platform and published directly by admin", "attrs": {"statement": "Admin-imported authenticated reviews must be flagged as \"Verified Off‑platform\" with verification source and date. These are published directly by admin (no patient submission flow).", "rationale": "Admin-Seeded Review Policy. Restated by workflow A1 (step 2: System validates fields and stores source provenance; step 3: System publishes review flagged as \"Verified Off-platform\"; outcome: seeded review with explicit provenance marker and full audit record), Screen 8 rules (Admin-seeded reviews must be flagged as \"Verified Off-platform\" with verification provenance) and Screen 4 rules (Admin-seeded reviews must display the Verified Off-platform marker)."}}
  - {"op": "add_node", "id": "REQ-013-036", "type": "Rule", "owner_fr": "FR-013", "title": "Admin-seeded review needs complete source verification metadata", "attrs": {"statement": "Admin-seeded reviews require structured `source_metadata`; all required sub-fields must be provided. Source platform is one of Google, Trustpilot, Doctolify, Provider Website, Email Testimonial, Other, and \"Other\" requires a free-text platform name. Source URL must be a valid URL and is required unless `source_platform` = Email Testimonial. Evidence files: 1-5 files, jpg/png/pdf, max 10MB each, stored via S-05. Capture date is an ISO date and not in the future.", "rationale": "Composed from the Screen 8 Source verification group rows (Source platform, Source URL, Evidence file(s), Capture date). Change Log 1.13 item 2 introduces the structured source_metadata payload, persisted to Review.source_metadata."}}
  - {"op": "add_node", "id": "REQ-013-037", "type": "Rule", "owner_fr": "FR-013", "title": "Seeded review needs a permission record and admin attestation", "attrs": {"statement": "Admin-seeded reviews require a permission record: either a file upload or a text reference, plus a mandatory admin attestation checkbox confirming consent was obtained. The reviewer display name is admin-entered, PII-safe, with no full last name and no contact info.", "rationale": "Composed from the Screen 8 rows Permission record and Reviewer display name. The alias and display-name policy is in the reviewer alias rule."}}
  - {"op": "add_node", "id": "REQ-013-038", "type": "Rule", "owner_fr": "FR-013", "title": "Admin add, edit and remove record identity, time, reason and before/after", "attrs": {"statement": "Every admin add/edit/remove action records admin identity, timestamp, reason, and before/after changes.", "rationale": "Screen 8 rule. Restated by workflow A2 step 2 (System records before/after values, reason, and admin identity.)."}}
  - {"op": "add_node", "id": "REQ-013-039", "type": "Rule", "owner_fr": "FR-013", "title": "Admin edit and remove need a reason; removal reason at least 10 characters", "attrs": {"statement": "Insert authenticated reviews and edit/remove existing reviews with mandatory reasons. Removal reason must be at least 10 characters.", "rationale": "Admin Editability Rules, Editable by Admin list, plus the Screen 8 rows Edit fields (Reason required for edit), Remove review (Removal reason min 10 chars) and Removal/edit reason (Reason catalog plus optional details; required for edit/remove). The insert case is covered by the source verification rules, which the PRD calls the provenance inputs."}}
  - {"op": "add_node", "id": "REQ-013-040", "type": "Rule", "owner_fr": "FR-013", "title": "Review status labels Published and Removed; takedown state shown separately", "attrs": {"statement": "Review status badge uses app-facing labels: `Published`, `Removed`. `Submitted` is not a review status in V1; successful review submission immediately creates a `Published` review. Takedown request state is displayed separately from review status when applicable (`Pending`, `Approved`, `Rejected`). `Removed` means no longer publicly visible due to admin action or approved takedown.", "rationale": "Screen 2 business rules. Key Entities add an admin-internal Flagged state; see the Flagged question in the migration report. Change Log 1.10."}}
  - {"op": "add_node", "id": "REQ-013-041", "type": "Rule", "owner_fr": "FR-013", "title": "My Reviews list newest first, paginated, with empty-state message", "attrs": {"statement": "Default list sort is latest submission date descending. The list is paginated and shows the empty state \"No reviews yet - complete a treatment to leave a review\" when the patient has no submitted reviews.", "rationale": "Screen 2 rule plus the Review list row (sorted by newest first; paginated), the Sort option row (Default: Most recent first) and the Empty state row (\"No reviews yet - complete a treatment to leave a review\", shown when the patient has no submitted reviews)."}}
  - {"op": "add_node", "id": "REQ-013-042", "type": "Rule", "owner_fr": "FR-013", "title": "Edit and takedown actions only while a review is Published", "attrs": {"statement": "For `Published` status, both `Edit Review` and `Request Takedown` actions are available. For `Removed` status, detail is read-only and shows admin removal reason; edit/takedown actions are hidden.", "rationale": "Screen 3 business rules and the Edit review and Request takedown rows (visible only when status = Published)."}}
  - {"op": "add_node", "id": "REQ-013-043", "type": "Rule", "owner_fr": "FR-013", "title": "Review stays published while a takedown request is pending", "attrs": {"statement": "While request status is `Pending`, review remains `Published` unless manually removed by admin.", "rationale": "Screen 3 rule. Restated by workflow A3 outcome (review remains visible until decision) and the Screen 9 note on the reject decision."}}
  - {"op": "add_node", "id": "REQ-013-044", "type": "Rule", "owner_fr": "FR-013", "title": "Takedown request recorded as Pending, linked to review and case; admin queue notified", "attrs": {"statement": "System records patient reason, creates takedown request with `Pending` status, and links it to review/case. System notifies admin takedown queue.", "rationale": "Workflow A3 steps 3 and 4."}}
  - {"op": "add_node", "id": "REQ-013-045", "type": "Rule", "owner_fr": "FR-013", "title": "Takedown reason required, 10-1000 characters", "attrs": {"statement": "The patient takedown reason is required and must be 10-1000 characters.", "rationale": "Composed from the Screen 3 Takedown reason row. Change Log 1.14 replaced the optional message with this required reason."}}
  - {"op": "add_node", "id": "REQ-013-046", "type": "Rule", "owner_fr": "FR-013", "title": "Admin approves or rejects takedown with note; approval unpublishes, recalculates, notifies", "attrs": {"statement": "Admin reviews request reason, review content, and compliance context. Admin approves or rejects request with decision note. System applies decision: approved -> review unpublished/archived and provider rating metrics recalculated; rejected -> review remains published. System notifies patient of decision and reason.", "rationale": "Workflow A4. Edge Cases add that on a rejected request the review stays published and the decision reason is visible to the patient."}}
  - {"op": "add_node", "id": "REQ-013-047", "type": "Rule", "owner_fr": "FR-013", "title": "Takedown decision note required; admin removal reason stored on removed review", "attrs": {"statement": "The takedown decision note is required, 10-1000 characters. Approved takedown must persist `Admin removal reason` on the removed review so Patient Review Detail (Screen 3) can display the same reason consistently. Admin removal reason is required when approving takedown.", "rationale": "Composed from the Screen 9 rows Decision note and Admin removal reason and the Screen 9 note (Approved takedown must persist `Admin removal reason` on the removed review so Patient Review Detail (Screen 3) can display the same reason consistently.)."}}
  - {"op": "add_node", "id": "REQ-013-048", "type": "Rule", "owner_fr": "FR-013", "title": "Review content retained at least 7 years; takedowns archive, never hard-delete", "attrs": {"statement": "Review content (review record + photos + provider responses + takedown requests) retained for minimum 7 years (medical-records baseline, Constitution §III.A); approved takedown requests are processed by unpublish + archival with restricted access — never hard-deleted.", "rationale": "Data & Privacy Rules. Screen 3 retention notice repeats it to the patient."}}
  - {"op": "add_node", "id": "REQ-013-049", "type": "Rule", "owner_fr": "FR-013", "title": "Audit records immutable and retained at least 10 years", "attrs": {"statement": "`AdminAction` and all audit-log records (patient self-edits, admin edits/removals/seeded reviews, takedown decisions, settings changes, provider responses) are immutable and retained for minimum 10 years per Constitution §VI (Audit Trail). The 10-year audit-log retention is independent of and longer than the 7-year review-content retention.", "rationale": "Data & Privacy Rules; Change Log 1.13 item 1. Independent of, and longer than, the 7-year review content retention."}}
  - {"op": "add_node", "id": "REQ-013-050", "type": "Rule", "owner_fr": "FR-013", "title": "All review mutations fully auditable with actor type and prior values", "attrs": {"statement": "All review mutations are fully auditable (who, when, what, before/after, reason where applicable), including patient self-edits to published reviews, admin actions (edits, removals, seeded reviews, takedown decisions, settings changes), and provider response creation. Audit records preserve actor type (patient / provider / admin) and prior field values to satisfy constitution Auditability requirements.", "rationale": "Data & Privacy Rules. Restated by Screen 8 (audit trail preview, full audit retained) and Screen 7 (review visibility/filter results must preserve complete audit traceability)."}}
  - {"op": "add_node", "id": "REQ-013-051", "type": "Rule", "owner_fr": "FR-013", "title": "Photos and text must not expose sensitive personal information", "attrs": {"statement": "Photos and text must not expose sensitive personal information; admin may redact or remove post-publication.", "rationale": "Data & Privacy Rules."}}
  - {"op": "add_node", "id": "REQ-013-052", "type": "Rule", "owner_fr": "FR-013", "title": "Reviewer alias algorithm; seeded display name; alias-only default", "attrs": {"statement": "Reviewer alias algorithm (canonical, applied uniformly across Patient, Provider, and Admin public surfaces): `{first_name} {last_initial}.` (e.g., \"Sarah M.\"); collisions within the same provider's review list are deduplicated with a numeric suffix (`Sarah M. 2`, `Sarah M. 3`, …). Admin views may unmask to full identity per RBAC. Admin-seeded reviews use an admin-entered `reviewer_display_name` field (free text, subject to the same PII-safety policy — no full last name, no contact info) instead of the algorithmic alias; the `Verified Off-platform` badge accompanies the display name. Patients have no opt-in to expose full name in V1; reviewer display policy toggle on Screen 10 governs only future policy expansion and MUST default to alias-only.", "rationale": "Data & Privacy Rules, canonical alias, whole bullet verbatim (Change Log 1.13 item 6). Includes the admin-seeded reviewer_display_name rule and the alias-only default of the reviewer display policy setting."}}
  - {"op": "add_node", "id": "REQ-013-053", "type": "Rule", "owner_fr": "FR-013", "title": "Ratings use a 1-5 scale; averages may display half stars", "attrs": {"statement": "Ratings use 1–5 scale with half‑stars display allowed for averages.", "rationale": "General Module Rules."}}
  - {"op": "add_node", "id": "REQ-013-054", "type": "Rule", "owner_fr": "FR-013", "title": "Provider response required, 50-1000 characters", "attrs": {"statement": "The provider response text is required and must be 50-1000 characters. The character counter updates live and submit is blocked outside the limits.", "rationale": "Composed from the Screen 6 rows Response text, Character counter and Submit response. Screen 6 notes: the 50-character minimum prevents single-word or non-substantive replies that erode trust; the 1000-character ceiling keeps public responses scannable on review surfaces and discourages defensive long-form rebuttals."}}
  - {"op": "add_node", "id": "REQ-013-055", "type": "Rule", "owner_fr": "FR-013", "title": "Provider responses public and immutable while published", "attrs": {"statement": "Provider responses are public and immutable while published; admins may remove a response for policy violation. After an admin removal, the provider may submit exactly one replacement response (see one-active-response rule below) — outside of that single replacement, posted responses cannot be edited or re-posted by the provider.", "rationale": "Screen 6 rule; Change Log 1.13 item 8 re-worded it from immutable once posted."}}
  - {"op": "add_node", "id": "REQ-013-056", "type": "Rule", "owner_fr": "FR-013", "title": "One active provider response per review; one replacement after admin removal", "attrs": {"statement": "Provider may have at most one active public response per review in V1. If admin removes a prior response for policy violation, provider may submit one replacement response; both the removed and replacement responses are retained in the audit trail (`AdminAction` for the removal, `ProviderResponse` history for the lifecycle).", "rationale": "Screen 6 rule; Change Log 1.12 item 2."}}
  - {"op": "add_node", "id": "REQ-013-057", "type": "Rule", "owner_fr": "FR-013", "title": "Respond action only on published reviews without a response; submission recorded and patient notified", "attrs": {"statement": "Respond as Provider is visible only when the review is published and no response exists. Submission records provider identity and timestamp and triggers patient notification.", "rationale": "Composed from the Screen 6 row Respond as Provider (Visible only when review is published and no response exists) and the Screen 6 rule (Submission records provider identity and timestamp and triggers patient notification.)."}}
  - {"op": "add_node", "id": "REQ-013-058", "type": "Rule", "owner_fr": "FR-013", "title": "Provider detail and list keep treatment-case context and support case filtering", "attrs": {"statement": "Detail view must preserve treatment-case context so provider can differentiate multi-case patient histories. One patient may have multiple treatment cases; list must support case-specific filtering.", "rationale": "Screens 5 and 6 business rules."}}
  - {"op": "add_node", "id": "REQ-013-059", "type": "Rule", "owner_fr": "FR-013", "title": "Only Published reviews shown on patient profile and provider list surfaces", "attrs": {"statement": "Only `Published` reviews are visible on patient-facing provider/clinic profile surfaces. Only published reviews appear in provider list surfaces.", "rationale": "Screen 4 and Screen 5 business rules."}}
  - {"op": "add_node", "id": "REQ-013-060", "type": "Rule", "owner_fr": "FR-013", "title": "Embedded review section inherits provider identity from the host profile", "attrs": {"statement": "The embedded preview must not redefine or duplicate the full provider profile layout; it inherits provider identity and navigation from the host provider profile screen.", "rationale": "Screen 4 business rule and context note (it is not a standalone provider profile screen; non-review profile content belongs to the provider profile and quote-review specifications)."}}
  - {"op": "add_node", "id": "REQ-013-061", "type": "Rule", "owner_fr": "FR-013", "title": "View all opens the full review list of the same provider", "attrs": {"statement": "`View all` opens the complete review list for the same provider without changing review ownership or source rules.", "rationale": "Screen 4 business rule."}}
  - {"op": "add_node", "id": "REQ-013-062", "type": "Rule", "owner_fr": "FR-013", "title": "Profile review preview limited; full list paginated, newest first, sort and rating filter", "attrs": {"statement": "The provider profile review preview shows a limited count of Published reviews before View all. The full reviews list is paginated, newest first by default, with sort by recency or rating and filter by rating.", "rationale": "Composed from the Screen 4 rows Review preview list, Full reviews list state and Sort/filter controls."}}
  - {"op": "add_node", "id": "REQ-013-063", "type": "Rule", "owner_fr": "FR-013", "title": "Provider review list paginated, newest first by default; sort by recency or rating", "attrs": {"statement": "The provider review list is paginated, newest first by default, and can be sorted by recency or rating (default: recency).", "rationale": "Composed from the Screen 5 rows Review list and Sort. Filter criteria are owned by FR-022 (REQ-022-092)."}}
  - {"op": "add_node", "id": "REQ-013-064", "type": "Rule", "owner_fr": "FR-013", "title": "Public review photos follow the media privacy and removal rules", "attrs": {"statement": "Review photos shown publicly must follow the same media privacy and removal rules as submitted review photos.", "rationale": "Screen 4 business rule."}}
  - {"op": "add_node", "id": "REQ-013-065", "type": "Rule", "owner_fr": "FR-013", "title": "Admin list covers patient-submitted and admin-seeded reviews with audit traceability", "attrs": {"statement": "Admin list includes patient-submitted and admin-seeded reviews. Review visibility/filter results must preserve complete audit traceability.", "rationale": "Screen 7 business rules."}}
  - {"op": "add_node", "id": "REQ-013-066", "type": "Rule", "owner_fr": "FR-013", "title": "Settings changes are admin-only and audit logged", "attrs": {"statement": "Settings changes are admin-only and audit logged.", "rationale": "Screen 10 business rule."}}
  - {"op": "add_node", "id": "REQ-013-067", "type": "Rule", "owner_fr": "FR-013", "title": "Settings must not weaken fixed eligibility, rating, length, retention or privacy rules", "attrs": {"statement": "Settings must not weaken fixed eligibility, rating scale, text length, retention, or privacy rules.", "rationale": "Screen 10 business rule."}}
  - {"op": "add_node", "id": "REQ-013-068", "type": "Rule", "owner_fr": "FR-013", "title": "Export preserves RBAC, PII handling and audit traceability", "attrs": {"statement": "Export actions must preserve RBAC, PII handling, and audit traceability.", "rationale": "Screen 10 business rule. REQ-013-022 states the export is RBAC-restricted and audit logged."}}
  - {"op": "add_node", "id": "REQ-013-069", "type": "Rule", "owner_fr": "FR-013", "title": "Flagging thresholds and takedown SLA configurable within policy bounds", "attrs": {"statement": "Configurable with Restrictions: Flagging thresholds and auto-flag rules for admin review (within safe bounds approved by policy). Takedown decision SLA/queue prioritization parameters (within policy bounds).", "rationale": "Admin Editability Rules. Screen 10 rows Flagging thresholds (restricted safe ranges only) and Takedown SLA settings (restricted policy range)."}}
  - {"op": "add_node", "id": "REQ-013-070", "type": "Rule", "owner_fr": "FR-013", "title": "Admin edits review labels, photo guidelines, removal reasons and display-name policy", "attrs": {"statement": "Editable by Admin: review category labels (canonical keys remain fixed); photo guidelines text; removal reasons catalogue; visibility rules for display name (alias/full name toggle policy).", "rationale": "Composed from the Admin Editability Rules (Editable by Admin) and the Screen 10 row Review categories/labels (Admin-editable labels; canonical keys remain fixed). The PRD list also names \"invitation cadence and reminders\"; that item is left out because REQ-013-022, Screen 10 and Change Logs 1.12 and 1.14 assign cadence to FR-030 (see the cadence question in the migration report)."}}
  - {"op": "add_node", "id": "REQ-013-071", "type": "Rule", "owner_fr": "FR-013", "title": "Photo guidelines text required; edits audit-logged through AdminAction", "attrs": {"statement": "Photo guidelines text is required. All edits are captured via AdminAction with before/after values; there is no formal version model.", "rationale": "Composed from the Screen 10 row Photo guidelines text; Change Log 1.12 item 4."}}
  - {"op": "add_node", "id": "REQ-013-072", "type": "Rule", "owner_fr": "FR-013", "title": "Removal reason catalog holds at least one active reason", "attrs": {"statement": "The removal reason catalog must hold at least one active reason.", "rationale": "Composed from the Screen 10 row Removal reason catalog."}}
  - {"op": "add_node", "id": "REQ-013-073", "type": "Rule", "owner_fr": "FR-013", "title": "System-automated flagging queues content for admin review post-publication", "attrs": {"statement": "Trigger: Content flagged by system-automated detection (keyword matching, duplicate submission patterns, rate-limit triggers). User-initiated flagging is a future enhancement. Steps: System queues flagged content for admin review; Admin may redact, unpublish, or uphold. Outcome: Policy-compliant content remains; violations are removed with audit record.", "rationale": "Workflow B2. Edge Cases: \"Duplicate or spam reviews: auto‑flag for admin review post-publication.\" Implementation Notes (technical, not migrated) add that anti-abuse covers duplicate detection, keyword flags and rate limits for submissions and responses. User-initiated flagging is a future enhancement (Change Log 1.11)."}}
  - {"op": "add_node", "id": "REQ-013-074", "type": "Rule", "owner_fr": "FR-013", "title": "RBAC enforced for submit, moderate and respond actions", "attrs": {"statement": "Enforce RBAC for submit/moderate/respond actions.", "rationale": "Security Considerations, promoted as a business rule."}}
  # --- Settings (owned by FR-013: Screen 10 and REQ-013-022 keep review labels, display policy, flagging and SLA settings in this FR)
  - {"op": "add_node", "id": "SET-review-category-labels", "type": "Setting", "owner_fr": "FR-013", "title": "Review category labels", "attrs": {"description": "Admin-editable labels for the category ratings (facility, staff, results, value) used by review forms and displays; the canonical keys stay fixed."}}
  - {"op": "add_node", "id": "SET-review-photo-guidelines-text", "type": "Setting", "owner_fr": "FR-013", "title": "Review photo guidelines text", "attrs": {"description": "Patient-facing photo upload guidance shown on the review form; required; edits are audit-logged."}}
  - {"op": "add_node", "id": "SET-review-removal-reason-catalog", "type": "Setting", "owner_fr": "FR-013", "title": "Review removal reason catalog", "attrs": {"description": "Standard reasons for admin removals and redactions; at least one active reason."}}
  - {"op": "add_node", "id": "SET-review-display-policy", "type": "Setting", "owner_fr": "FR-013", "title": "Reviewer display policy", "attrs": {"description": "Alias or full-name policy for reviewer display; defaults to alias-only and is PII-safe. In V1 the toggle governs only future policy expansion.", "default": "alias"}}
  - {"op": "add_node", "id": "SET-review-flagging-thresholds", "type": "Setting", "owner_fr": "FR-013", "title": "Review flagging thresholds", "attrs": {"description": "Duplicate, spam and keyword flag settings, within restricted safe ranges approved by policy."}}
  - {"op": "add_node", "id": "SET-review-takedown-sla", "type": "Setting", "owner_fr": "FR-013", "title": "Takedown request SLA settings", "attrs": {"description": "Queue priority and SLA target for takedown decisions, within a restricted policy range. The PRD gives no default."}}
  # --- Events (all emitted by the Review and close stage)
  - {"op": "add_node", "id": "EVT-review-requested", "type": "Event", "owner_fr": "FR-013", "title": "Review requested", "attrs": {"description": "review.requested: time-gated review invitation (and reminders) sent to the patient once the 3-month threshold after procedure completion is reached. Timing and cadence are owned by FR-030 (Screen 10 link-outs); the PRD does not say which FR owns the event itself.", "payload": "patient, provider, treatment case"}}
  - {"op": "add_node", "id": "EVT-review-published", "type": "Event", "owner_fr": "FR-013", "title": "Review published", "attrs": {"description": "A new review is published; the provider is notified of a new published review (Provider Platform scope, REQ-013-017).", "payload": "review, provider"}}
  - {"op": "add_node", "id": "EVT-review-edited", "type": "Event", "owner_fr": "FR-013", "title": "Review edited by patient", "attrs": {"description": "A patient edited a published review; the provider is notified so they can re-evaluate any response (Main Flow step 4d).", "payload": "review, provider"}}
  - {"op": "add_node", "id": "EVT-provider-response-published", "type": "Event", "owner_fr": "FR-013", "title": "Provider response published", "attrs": {"description": "A provider response was published; the patient is notified (workflow B1 outcome, Screen 6).", "payload": "review, response, patient"}}
  - {"op": "add_node", "id": "EVT-review-removed", "type": "Event", "owner_fr": "FR-013", "title": "Review removed by admin", "attrs": {"description": "Admin removal notice (REQ-013-017). The PRD does not name the recipient.", "payload": "review, removal reason"}}
  - {"op": "add_node", "id": "EVT-takedown-requested", "type": "Event", "owner_fr": "FR-013", "title": "Takedown requested", "attrs": {"description": "A patient created a takedown request; the admin takedown queue is notified (workflow A3 step 4).", "payload": "takedown request, review"}}
  - {"op": "add_node", "id": "EVT-takedown-decided", "type": "Event", "owner_fr": "FR-013", "title": "Takedown decided", "attrs": {"description": "Admin approved or rejected a takedown request; the patient is notified of the decision and reason (workflow A4 step 4).", "payload": "takedown request, decision, reason"}}
  # --- Entities
  - {"op": "update_node", "id": "ENT-review", "attrs": {"description": "A patient-submitted or admin-seeded review of a provider after a completed treatment case, published immediately. Every platform reads and writes this one canonical schema. Patient-facing status is Published or Removed; Flagged is admin-internal."}}  # existing stub (FR-032 migration)
  - {"op": "add_node", "id": "ENT-review-source-metadata", "type": "Entity", "owner_fr": "FR-013", "title": "Review source metadata", "attrs": {"description": "Structured provenance payload persisted to Review.source_metadata for admin-seeded reviews: platform, URL, evidence files, capture date, permission record with admin attestation, and the admin-entered reviewer display name."}}
  - {"op": "add_node", "id": "ENT-review-photo", "type": "Entity", "owner_fr": "FR-013", "title": "Review photo", "attrs": {"description": "A photo attached to a review: file references, thumbnails and alt text, associated with one review."}}
  - {"op": "add_node", "id": "ENT-takedown-request", "type": "Entity", "owner_fr": "FR-013", "title": "Takedown request", "attrs": {"description": "A patient's request to remove their published review from public view. Runs its own state machine (Pending, Approved, Rejected) separate from review visibility."}}
  - {"op": "add_node", "id": "ENT-admin-action", "type": "Entity", "owner_fr": "FR-013", "title": "Admin action", "attrs": {"description": "Immutable audit record of an admin action on a review or takedown request: action type, reason, admin identity, timestamp and the changes made."}}
  - {"op": "add_node", "id": "ENT-provider-response", "type": "Entity", "owner_fr": "FR-013", "title": "Provider response", "attrs": {"description": "A public provider response to a review: text, author and timestamp, associated with one review."}}
  - {"op": "add_node", "id": "ENT-review-settings", "type": "Entity", "owner_fr": "FR-013", "title": "Review settings", "attrs": {"description": "Admin-managed review configuration: category labels, photo guidelines, removal reasons, display policy, flagging thresholds and takedown SLA settings, with who updated it and when. Review invite and reminder cadence is owned by FR-030."}}
  - {"op": "add_node", "id": "ENT-provider-treatment-review-summary", "type": "Entity", "owner_fr": "FR-013", "title": "Provider treatment review summary", "attrs": {"description": "Per-provider, per-treatment aggregate of Published reviews (average sub-scores, count, distribution). Data contract consumed by FR-014 review sub-scores per treatment analytics."}}
  - {"op": "update_node", "id": "ENT-provider-review-summary", "attrs": {"description": "Per-provider aggregate of Published reviews: average rating, count and distribution, recalculated on every publish, edit republish, removal and approved takedown, with caching. Shown read-only on the provider profile review section, the provider review list and the FR-005 quote comparison."}}  # stub filled in
  # --- Fields and enum values
  - {"op": "add_field", "id": "ENT-review.patient_id", "entity_id": "ENT-review", "name": "patient_id", "data_type": "id", "title": "Patient", "owner_fr": "FR-013", "required": false, "attrs": {"description": "Link to the reviewing patient (FR-001 Patient). Admin-seeded reviews have no patient; see the seeded-review question."}}
  - {"op": "add_field", "id": "ENT-review.procedure_id", "entity_id": "ENT-review", "name": "procedure_id", "data_type": "id", "title": "Completed procedure", "owner_fr": "FR-013", "required": false, "attrs": {"description": "Link to the completed procedure / treatment case the review covers. The PRD does not name the owning entity."}}
  - {"op": "add_field", "id": "ENT-review.provider_id", "entity_id": "ENT-review", "name": "provider_id", "data_type": "id", "title": "Provider", "owner_fr": "FR-013", "required": true, "attrs": {"description": "Link to the reviewed provider (FR-015 Provider)."}}
  - {"op": "add_field", "id": "ENT-review.treatment_id", "entity_id": "ENT-review", "name": "treatment_id", "data_type": "id", "title": "Treatment", "owner_fr": "FR-013", "required": false, "attrs": {"description": "Link to the treatment, used for per-treatment sub-scores."}}
  - {"op": "add_field", "id": "ENT-review.clinic_name", "entity_id": "ENT-review", "name": "clinic_name", "data_type": "text", "title": "Clinic name", "owner_fr": "FR-013", "required": true, "attrs": {"description": "Read-only clinic/provider label derived from the booked provider."}}
  - {"op": "add_field", "id": "ENT-review.facility_rating", "entity_id": "ENT-review", "name": "facility_rating", "data_type": "int", "title": "Facility rating", "owner_fr": "FR-013", "required": true, "attrs": {"description": "Facility cleanliness. Integer 1-5."}}
  - {"op": "add_field", "id": "ENT-review.staff_rating", "entity_id": "ENT-review", "name": "staff_rating", "data_type": "int", "title": "Staff rating", "owner_fr": "FR-013", "required": true, "attrs": {"description": "Staff professionalism. Integer 1-5."}}
  - {"op": "add_field", "id": "ENT-review.results_rating", "entity_id": "ENT-review", "name": "results_rating", "data_type": "int", "title": "Results rating", "owner_fr": "FR-013", "required": true, "attrs": {"description": "Results satisfaction. Integer 1-5."}}
  - {"op": "add_field", "id": "ENT-review.value_rating", "entity_id": "ENT-review", "name": "value_rating", "data_type": "int", "title": "Value rating", "owner_fr": "FR-013", "required": true, "attrs": {"description": "Value for money. Integer 1-5."}}
  - {"op": "add_field", "id": "ENT-review.photos", "entity_id": "ENT-review", "name": "photos", "data_type": "media[]", "title": "Photos", "owner_fr": "FR-013", "required": false, "attrs": {"description": "Optional before/after photos (ReviewPhoto records), up to 5."}}
  - {"op": "add_field", "id": "ENT-review.status", "entity_id": "ENT-review", "name": "status", "data_type": "enum", "title": "Review status", "owner_fr": "FR-013", "required": true, "attrs": {"description": "Patient-facing review visibility. Flagged is tracked separately as flagged_status."}}
  - {"op": "add_enum_value", "field_id": "ENT-review.status", "value": "published", "label": "Published", "sort_order": 0}
  - {"op": "add_enum_value", "field_id": "ENT-review.status", "value": "removed", "label": "Removed", "sort_order": 1}
  - {"op": "add_field", "id": "ENT-review.flagged_status", "entity_id": "ENT-review", "name": "flagged_status", "data_type": "enum", "title": "Flagged status", "owner_fr": "FR-013", "required": true, "attrs": {"description": "Admin-internal flag state; independent of review visibility."}}
  - {"op": "add_enum_value", "field_id": "ENT-review.flagged_status", "value": "flagged", "label": "Flagged", "sort_order": 0}
  - {"op": "add_enum_value", "field_id": "ENT-review.flagged_status", "value": "not_flagged", "label": "Not flagged", "sort_order": 1}
  - {"op": "add_field", "id": "ENT-review.flag_reason", "entity_id": "ENT-review", "name": "flag_reason", "data_type": "text", "title": "Flag reason", "owner_fr": "FR-013", "required": false, "attrs": {"description": "Reason for the auto or manual flag, shown on the admin review detail."}}
  - {"op": "add_field", "id": "ENT-review.last_edited_at", "entity_id": "ENT-review", "name": "last_edited_at", "data_type": "datetime", "title": "Last edited at", "owner_fr": "FR-013", "required": false, "calculated_by": "REQ-013-032", "attrs": {"description": "Set when the patient edits a published review."}}
  - {"op": "add_field", "id": "ENT-review.edit_count", "entity_id": "ENT-review", "name": "edit_count", "data_type": "int", "title": "Edit count", "owner_fr": "FR-013", "required": false, "calculated_by": "REQ-013-032", "attrs": {"description": "Incremented on each patient edit."}}
  - {"op": "add_field", "id": "ENT-review.source_type", "entity_id": "ENT-review", "name": "source_type", "data_type": "enum", "title": "Source type", "owner_fr": "FR-013", "required": true, "attrs": {"description": "Patient-submitted, or admin-seeded and flagged Verified Off-platform."}}
  - {"op": "add_enum_value", "field_id": "ENT-review.source_type", "value": "patient_submitted", "label": "Patient-submitted", "sort_order": 0}
  - {"op": "add_enum_value", "field_id": "ENT-review.source_type", "value": "verified_off_platform", "label": "Verified Off-platform", "sort_order": 1}
  - {"op": "add_field", "id": "ENT-review.source_metadata", "entity_id": "ENT-review", "name": "source_metadata", "data_type": "json", "title": "Source metadata", "owner_fr": "FR-013", "required": false, "attrs": {"description": "Provenance payload for admin-seeded reviews; structured as ENT-review-source-metadata."}}
  - {"op": "add_field", "id": "ENT-review.admin_removal_reason", "entity_id": "ENT-review", "name": "admin_removal_reason", "data_type": "text", "title": "Admin removal reason", "owner_fr": "FR-013", "required": false, "attrs": {"description": "Reason supplied by admin when a review is removed; shown to the patient when status is Removed. Not in Key Entities; added for Screens 3, 8 and 9."}}
  - {"op": "add_field", "id": "ENT-review-source-metadata.review_id", "entity_id": "ENT-review-source-metadata", "name": "review_id", "data_type": "id", "title": "Review", "owner_fr": "FR-013", "required": true, "attrs": {"description": "The admin-seeded review this metadata belongs to."}}
  - {"op": "add_field", "id": "ENT-review-source-metadata.source_platform", "entity_id": "ENT-review-source-metadata", "name": "source_platform", "data_type": "enum", "title": "Source platform", "owner_fr": "FR-013", "required": true, "attrs": {"description": "Origin of the off-platform review."}}
  - {"op": "add_enum_value", "field_id": "ENT-review-source-metadata.source_platform", "value": "google", "label": "Google", "sort_order": 0}
  - {"op": "add_enum_value", "field_id": "ENT-review-source-metadata.source_platform", "value": "trustpilot", "label": "Trustpilot", "sort_order": 1}
  - {"op": "add_enum_value", "field_id": "ENT-review-source-metadata.source_platform", "value": "doctolify", "label": "Doctolify", "sort_order": 2}
  - {"op": "add_enum_value", "field_id": "ENT-review-source-metadata.source_platform", "value": "provider_website", "label": "Provider Website", "sort_order": 3}
  - {"op": "add_enum_value", "field_id": "ENT-review-source-metadata.source_platform", "value": "email_testimonial", "label": "Email Testimonial", "sort_order": 4}
  - {"op": "add_enum_value", "field_id": "ENT-review-source-metadata.source_platform", "value": "other", "label": "Other", "sort_order": 5}
  - {"op": "add_field", "id": "ENT-review-source-metadata.other_platform_name", "entity_id": "ENT-review-source-metadata", "name": "other_platform_name", "data_type": "text", "title": "Other platform name", "owner_fr": "FR-013", "required": false, "attrs": {"description": "Free-text platform name, required when source_platform = Other. Not in Key Entities; added for Screen 8."}}
  - {"op": "add_field", "id": "ENT-review-source-metadata.source_url", "entity_id": "ENT-review-source-metadata", "name": "source_url", "data_type": "text", "title": "Source URL", "owner_fr": "FR-013", "required": false, "attrs": {"description": "Public link to the original review; required unless source_platform = Email Testimonial."}}
