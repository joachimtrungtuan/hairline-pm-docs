  - {"op": "add_node", "id": "REQ-013-013", "type": "Rule", "owner_fr": "FR-013", "title": "One canonical review schema across Patient, Provider and Admin", "attrs": {"statement": "System MUST preserve a single canonical review schema across Patient, Provider, and Admin platforms (`overall_rating`, `facility_rating`, `staff_rating`, `results_rating`, `value_rating`, `feedback_text`, `photos[]`, plus read-only clinic/treatment context fields).", "rationale": "Screen 9 note: \"Admin tooling must read/write the same canonical review schema as patient/provider surfaces to prevent cross-tenant drift.\" Screen 4 context note says the embedded section connects to the same review data model."}}
