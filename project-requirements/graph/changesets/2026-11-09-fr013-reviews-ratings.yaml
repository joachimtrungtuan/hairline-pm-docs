  - {"op": "add_node", "id": "REQ-013-017", "type": "Rule", "owner_fr": "FR-013", "title": "Invite, reminder and status notifications via Notification Service", "attrs": {"statement": "System MUST send invite/reminder and status notifications (new published review to provider, provider reply, admin removal, takedown decision) via Notification Service.", "rationale": "Restated by Main Flow step 4(d), workflows A3 step 4, A4 step 4 and B1 outcome, the Provider Platform scope (receive notification on new published reviews) and Shared Services. Invite and reminder timing is owned by FR-030."}}
