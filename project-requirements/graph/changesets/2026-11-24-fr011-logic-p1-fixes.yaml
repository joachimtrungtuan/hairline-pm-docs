  - {"op": "update_node", "id": "STP-011-038", "title": "System flags the case Urgent for concerning symptoms and records when the flag was raised"}
  - {"op": "update_node", "id": "STP-011-045", "title": "Admin (including the Aftercare Coordinator) reviews the case and reassigns it, assigns the Hairline team or cancels with a reason"}
  - {"op": "update_node", "id": "STP-011-053", "title": "Admin (including the Aftercare Coordinator) reassigns the case on Screen 19, assigns the Hairline team or keeps it cancelled, and resolves the marker"}
  - {"op": "update_node", "id": "STP-011-056", "title": "System sets the request to Payment due and notifies the patient that payment is now due; the 48 hours start at this notice"}
  - {"op": "update_node", "id": "REQ-011-001", "attrs": {"statement": "System MUST support treatment-linked and standalone aftercare activation paths; a standalone request may also start as a conversion from FR-038 monitoring (REQ-011-093)"}}
  - {"op": "update_node", "id": "REQ-011-004", "attrs": {"statement": "Admin MUST be able to oversee cases, reassign providers, and override plans with full audit. Admin assignment of who delivers the aftercare (a provider, whose clinic staff are the aftercare specialists, or a Hairline aftercare team member, an admin with the FR-031 Aftercare Coordinator role) is owned by FR-011. The Aftercare Coordinator works on the admin aftercare Screens 13 to 19 (plan configuration, scan review, escalations) when the Hairline team delivers."}}
  - {"op": "update_node", "id": "REQ-011-007", "attrs": {"statement": "Progress MUST be derived deterministically from plan and task completion (completed scan, questionnaire and education tasks over total such tasks; medication adherence is tracked separately)"}}
  - {"op": "update_node", "id": "REQ-011-010", "title": "Provider sees patient details from assignment (standalone) or payment (add-on)", "attrs": {"statement": "The assigned provider MUST see patient details from assignment in the standalone flow, and from payment in the post-treatment add-on flow, where assignment follows payment; the admin is exempt and always sees them.", "rationale": "General Module Rule 3 and Data and Privacy Rule 2; access from assignment follows REQ-038-050."}}
  - {"op": "update_node", "id": "REQ-011-016", "title": "Aftercare has exactly three entry sources", "attrs": {"statement": "Aftercare has exactly three entry sources: treatment-linked aftercare (starts from the patient's accepted Hairline quote whose treatment was performed, covering the Workflow 1 setup and the Workflow 2b post-treatment add-on bought within 90 days), standalone aftercare (bought directly by patients treated at an outside clinic, with no inquiry or quote), and standalone aftercare converted from an FR-038 monitoring case (a standalone request with the monitoring data pre-filled, REQ-011-093). Admin assignment is a step inside these routes, not a separate route."}}
  - {"op": "update_node", "id": "REQ-011-017", "title": "Treatment-linked setup starts automatically at treatment completion", "attrs": {"statement": "Treatment-linked aftercare setup starts automatically at treatment completion, on the FR-010 completion signal. The plan activates when the provider confirms it (REQ-011-055) or an admin activates it (REQ-011-019). FR-006 owns the move of the booking to Aftercare."}}
  - {"op": "update_node", "id": "REQ-011-019", "attrs": {"statement": "Admin can manually activate aftercare for special cases, including a plan whose setup stays unconfirmed after the escalation of REQ-011-090. Manual activation needs a mandatory reason and creates an audit entry."}}
  - {"op": "update_node", "id": "REQ-011-020", "title": "Standard duration 6-12 months, extensions proposed by the provider or coordinator and approved by the admin", "attrs": {"statement": "Standard aftercare duration is 6-12 months, determined by treatment type and complexity. Extensions are proposed by the provider (or the coordinator) with a reason and approved or rejected by the admin (REQ-011-098)."}}
  - {"op": "update_node", "id": "REQ-011-023", "title": "Milestones progress by time, cannot be skipped, close on scan, questionnaire and education tasks", "attrs": {"statement": "Milestones progress automatically based on time elapsed. Patients cannot skip milestones. A milestone closes when all required tasks are completed: scan, questionnaire and education. Medication tick-offs are adherence tracking only and do not block a milestone."}}
  - {"op": "update_node", "id": "REQ-011-024", "attrs": {"statement": "Scan uploads must meet the quality threshold. Questionnaires must be completed in full. Medication adherence is tracked but does not block a milestone and is not part of the progress percentage."}}
  - {"op": "update_node", "id": "REQ-011-025", "attrs": {"statement": "Overdue tasks trigger escalation after 48 hours counted from the task due date (the 24 hours before the Overdue flag are part of those 48)."}}
  - {"op": "update_node", "id": "REQ-011-027", "title": "Progress is completed scan, questionnaire and education tasks over total such tasks, equally weighted, real time", "attrs": {"statement": "Progress = (completed scan, questionnaire and education tasks / total such tasks) * 100. Tasks are weighted equally; medication adherence is not part of the percentage. Progress updates in real time."}}
  - {"op": "update_node", "id": "REQ-011-037", "attrs": {"statement": "Any payment already taken is refunded in full and automatically when a request is rejected by the admin or expires unassigned after 7 days (in the post-treatment add-on flow the 7 days count from payment). A request that expires unpaid after 48 hours, or that the patient cancels at a changed price, had no payment taken, so nothing is refunded. Rejection requires a reason."}}
  - {"op": "update_node", "id": "REQ-011-040", "title": "Platform commission 15-25% of the aftercare price when a provider delivers", "attrs": {"statement": "Platform commission is deducted from standalone and post-treatment add-on aftercare payments when a provider delivers; no commission line applies when the Hairline team keeps the full price (REQ-011-057). The commission rate is 15-25% (configurable); it is a percentage of the aftercare price, one amount under one setting, taken from the aftercare price and never added to the patient's total. Commission is calculated at time of payment."}}
  - {"op": "update_node", "id": "REQ-011-049", "attrs": {"statement": "The assigned provider reviews the patient case, selects the aftercare template (the purchased one, or an alternative that offers the chosen pricing option, REQ-011-100) and customizes the plan. For a standalone request the provider completes the plan, the request becomes Payment due, the plan is not active until payment succeeds and the system notifies the patient that payment is now due; for a post-treatment add-on the provider activates the plan. On activation the patient receives an activation notification and gains access to the aftercare dashboard (Screen 1) and the aftercare team begins monitoring."}}
  - {"op": "update_node", "id": "REQ-011-050", "attrs": {"statement": "When payment fails the patient receives a failure notification and can retry with a different payment method; the request becomes Expired after 48 hours without successful payment (standalone: counted from the payment-due notice; add-on: counted from the failed payment). Nothing was charged, so nothing is refunded."}}
  - {"op": "update_node", "id": "REQ-011-052", "attrs": {"statement": "When no suitable provider is available, the admin marks the request \"Awaiting provider availability\", the patient is notified of the delay and the admin manually assigns when a provider becomes available. The 7-day unassigned timer of REQ-011-053 pauses while the request carries this mark and resumes when it is cleared."}}
  - {"op": "update_node", "id": "REQ-011-053", "attrs": {"statement": "Requests expire after 7 days if not assigned, counted from submission (from payment in the post-treatment add-on flow) and paused while the request is Awaiting provider availability; an expired request becomes Rejected with a system reason, and the refund rule applies."}}
  - {"op": "update_node", "id": "REQ-011-055", "attrs": {"statement": "Treatment-linked setup starts on the FR-010 completion signal. The provider selects an admin-created milestone template, adds patient-specific instructions and post-operative medications (name, dosage, frequency, special instructions), may modify milestone durations and confirms the plan; the system then generates the plan with milestones, creates the patient aftercare dashboard, sends an activation notification to the patient and sends the aftercare team a case assignment notification."}}
  - {"op": "update_node", "id": "REQ-011-057", "title": "Who is paid depends on who delivers; a provider who hands aftercare to the Hairline team gets a fixed handover fee", "attrs": {"statement": "When the provider marks \"Assign to Hairline aftercare team\", the admin receives a notification for aftercare assignment, the Hairline aftercare team takes over patient monitoring, and the provider is paid a fixed handover fee set by the admin (default 0, so nothing is paid until the admin sets an amount); Hairline keeps the rest of the price. When the Hairline team delivers by default in the add-on flow, or after an admin reassignment, Hairline keeps the full price with no commission line and no provider payment. When a provider delivers, the provider is paid the price less commission (REQ-011-040)."}}
  - {"op": "update_node", "id": "REQ-011-067", "attrs": {"statement": "Provider changes are logged and tracked, admin changes override provider settings, major changes require admin approval (proposed with a reason and approved or rejected per REQ-011-098), all changes are logged with reason and timestamp, the patient is notified of approved changes and change history is maintained for the audit trail."}}
  - {"op": "update_node", "id": "REQ-011-071", "title": "Questionnaire sets selected per milestone from FR-025 Aftercare and Multi-Context sets", "attrs": {"statement": "Screen 16 selects among existing Questionnaire Sets and configures schedule and frequency per milestone; each milestone independently selects one Questionnaire Set; the sets surfaced are Aftercare sets plus every Multi-Context set. Assigning a set to a milestone and replacing it are written to the audit trail with the set version, and each response stores the set version. Sets and questions are not authored in FR-011."}}
  - {"op": "update_node", "id": "REQ-011-088", "attrs": {"statement": "By default System MUST send each patient a progress reminder once a month for 12 months after treatment; the patient MAY change or switch off the reminder, and the default is admin-editable. The reminders stop when the plan completes (REQ-011-096)."}}
  - {"op": "update_node", "id": "REQ-011-083", "attrs": {"statement": "Full refund if request rejected by admin; prorated refund for subscription cancellations based on unused months (REQ-011-097 states the outcome per payment plan)"}}
