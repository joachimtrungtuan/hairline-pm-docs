# FR-011 logic review pass 1: graph change-set mirroring the revised PRD (Aftercare and Recovery Management). Order: new settings, rules, events, steps, flows, fields and enum values first; then removals; then updates; then new edges.
# Cross-FR edges: adds FR-011 references to REQ-002-047 and REQ-002-051 (FR-002 rules); adds next edges from STP-011-010 and STP-011-023 to STP-007-081 (FR-007 step, edges only); removes three FR-011 edges from retired REQ-011-011 to FR-030 events (REQ-011-028 and REQ-011-058 already govern them); adds FR-011 rules applying to new FR-011 events only. The incoming edges from STP-010-026 and STP-010-046 to STP-011-001 and STP-038 edges on STP-011-009 are kept. No node owned by another FR is changed; no handoff attrs are set.
# emits runs from a Stage to an Event only, so each new notice event is emitted by the Stage where the notice happens, not by the notice Step.
# Queued for other FRs, not done here: FR-006 (read the completion event, REQ-006-060), FR-030 (register the 8 new events and the reminder and escalation notices), FR-029 (SET-commission-rate unit wording), FR-007 and FR-017 (cancellation proration, commission and payout), FR-010 (retry pointer only), FR-038 (receiving side), FR-002, FR-031, FR-025, FR-012, FR-019, FR-037.
reason: "FR-011 logic review pass 1: provider sees patient details from assignment or payment; milestones close on scan, questionnaire and education with medication out of the percentage; setup starts on the FR-010 signal with reminder, escalation and manual activation; early close and repeated signal; coordinator on admin screens; who is paid by who delivers and a handover fee; Payment due and Expired statuses with timers; final template and price acceptance; add-on refusal; FR-038 conversion entry; scan task rule; plan completion; subscription cancellation; extension approval; urgent flag; new FR-011 events; wiring of conditional next edges, screens and retired-rule edges."
by: docs-manager
operations:
  - {"op": "add_node", "id": "SET-aftercare-plan-reminder-days", "type": "Setting", "owner_fr": "FR-011", "title": "Days before the provider is reminded that no plan is confirmed", "attrs": {"description": "Number of days after the FR-010 completion signal before the provider gets a reminder that the aftercare plan is not confirmed. Admin-editable.", "default": "2", "unit": "days"}}
  - {"op": "add_node", "id": "SET-aftercare-plan-escalation-days", "type": "Setting", "owner_fr": "FR-011", "title": "Days before an unconfirmed plan escalates to the admin", "attrs": {"description": "Number of days after the FR-010 completion signal before an unconfirmed aftercare plan is escalated to the admin. Admin-editable.", "default": "4", "unit": "days"}}
  - {"op": "add_node", "id": "SET-aftercare-handover-fee", "type": "Setting", "owner_fr": "FR-011", "title": "Fixed fee paid to a provider who hands aftercare to the Hairline team", "attrs": {"description": "Fixed amount paid to the provider when the provider hands the aftercare to the Hairline aftercare team; Hairline keeps the rest of the price. Admin-editable; a default of 0 means nothing is paid until the admin sets an amount.", "default": "0", "unit": "currency amount"}}
  - {"op": "add_node", "id": "REQ-011-090", "type": "Rule", "owner_fr": "FR-011", "title": "Unconfirmed plan: provider reminder after 2 days, admin escalation after 4 days", "attrs": {"statement": "When no aftercare plan is confirmed after the FR-010 completion signal, System MUST remind the provider after 2 days and escalate the case to the admin after 4 days; both day counts are admin settings. The admin can reassign on Screen 19 or activate the plan manually (REQ-011-019).", "rationale": "Workflow 1 Alternative Flow A3; General Module Rule 1."}}
  - {"op": "add_node", "id": "REQ-011-091", "type": "Rule", "owner_fr": "FR-011", "title": "FR-010 completion signal opens setup; early close opens it for the assigned team; a repeated signal returns the existing plan", "attrs": {"statement": "Aftercare setup (Workflow 1) opens on the FR-010 treatment completion signal; FR-006 owns the move of the booking to Aftercare. When FR-010 closes treatment early, setup opens for the aftercare team or the reassigned provider after the admin assigns them on Screen 19. A repeated completion signal for the same booking MUST return the existing plan and create no second plan. The retry of a failed signal stays in FR-010 (REQ-010-086).", "rationale": "Workflow 1 Trigger, A4 and A5; FR-010 and FR-006 integration points."}}
  - {"op": "add_node", "id": "REQ-011-092", "type": "Rule", "owner_fr": "FR-011", "title": "No add-on while a plan for the same booking is Active or Completed", "attrs": {"statement": "System MUST refuse a post-treatment add-on while a plan for the same booking is Active or Completed, and allow it after a paperwork-only completion.", "rationale": "Workflow 2b step 1; Screen 6 business rules."}}
  - {"op": "add_node", "id": "REQ-011-093", "type": "Rule", "owner_fr": "FR-011", "title": "A standalone request may be converted from FR-038 monitoring, with an idempotency key", "attrs": {"statement": "System MUST accept a standalone request converted from an FR-038 transplant-progress monitoring case, carrying the source, the monitoring case, the scan or photo set, the report file and an idempotency key; a repeated key returns the existing request. The patient still picks the template and pricing option.", "rationale": "Entry Points; Workflow 2 step 1; Screen 6 business rules. Agreed with the FR-038 hand-off."}}
  - {"op": "add_node", "id": "REQ-011-094", "type": "Rule", "owner_fr": "FR-011", "title": "A conversion is refused after the monitoring case is completed; a failed or abandoned request returns the patient to FR-038 Screen 6", "attrs": {"statement": "System MUST refuse a conversion once the monitoring case is completed, and after a failed or abandoned request MUST return the patient to FR-038 Screen 6 with the draft intact (REQ-038-068).", "rationale": "Workflow 2 step 1; Screen 6 business rules."}}
  - {"op": "add_node", "id": "REQ-011-095", "type": "Rule", "owner_fr": "FR-011", "title": "Scan task uses the FR-002 media-only call with the scan id as idempotency key", "attrs": {"statement": "The scan task MUST use the FR-002 media-only call (REQ-002-047) with at least one photo and the scan id as idempotency key, so a retried upload never creates a second scan; staged photos that are never attached to a scan are removed after 7 days (REQ-002-051).", "rationale": "Screen 2 business rules; FR-002 integration point."}}
  - {"op": "add_node", "id": "REQ-011-096", "type": "Rule", "owner_fr": "FR-011", "title": "Plan completes at the end of the last milestone or the subscription term", "attrs": {"statement": "System MUST complete the plan at the end of the last milestone or the end of the subscription term, whichever is later, stop all reminders for the plan (including the progress reminder of REQ-011-088) and emit a completion event that FR-006 reads (REQ-006-060).", "rationale": "Workflow 3 Alternative Flow C3."}}
  - {"op": "add_node", "id": "REQ-011-097", "type": "Rule", "owner_fr": "FR-011", "title": "Patient can cancel an aftercare subscription or a plan paid in full", "attrs": {"statement": "The patient MUST be able to cancel from the plan payment screen (Screen 7). A monthly subscription runs to the end of the paid month, later months are not charged, the plan then becomes Cancelled, and nothing is refunded. A plan paid in full stops at the end of the current month and the unused full months are refunded pro rata (REQ-011-083). Commission and provider payout follow the refund in the same proportion.", "rationale": "Workflow 3 Alternative Flow C4; Payment Rule 4 (refund policy). Money movement is executed through FR-007 and FR-017."}}
  - {"op": "add_node", "id": "REQ-011-098", "type": "Rule", "owner_fr": "FR-011", "title": "Extensions and major changes are proposed by the provider or coordinator and decided by the admin", "attrs": {"statement": "The assigned provider (or the Aftercare Coordinator when the Hairline team delivers) MUST be able to propose an extension or major change with a reason. The admin approves or rejects it on the admin case screen (approval status Proposed, Approved or Rejected) and the patient is notified. Where the change costs more, the patient MUST accept and pay before it takes effect. A rejection leaves the plan unchanged and the proposer is told why.", "rationale": "Workflow 4 Alternative Flow D6; Screens 11 and 14 business rules."}}
  - {"op": "add_node", "id": "REQ-011-099", "type": "Rule", "owner_fr": "FR-011", "title": "Urgent flag with raised-at time, cleared with a note, escalated to the admin after 2 hours", "attrs": {"statement": "The plan MUST carry an urgent flag and the time it was raised, set by an urgent questionnaire answer or a manual flag. The assigned provider (or the coordinator when the Hairline team delivers) clears it with a note. With no response within 2 hours of the raised time, System MUST escalate the case to the admin. Dashboards count the plans that have the flag set.", "rationale": "Workflow 3 Alternative Flow C2; Communication Rule 1; Screens 9, 12, 13 and 14."}}
  - {"op": "add_node", "id": "REQ-011-100", "type": "Rule", "owner_fr": "FR-011", "title": "Alternative template only among those offering the chosen pricing option; the patient accepts a changed price or cancels at no charge", "attrs": {"statement": "The provider MAY pick an alternative template only among templates that offer the pricing option the patient chose. Screen 7 shows the order summary of the final template; when the final price differs from the requested price the patient MUST accept the new price before paying, or may cancel at no charge, in which case the request becomes Rejected with the system reason cancelled by patient.", "rationale": "Workflow 2 step 3 and Alternative Flow B4; Workflow 2b step 4; Screen 7 business rules."}}
  - {"op": "add_node", "id": "EVT-aftercare-request-assigned", "type": "Event", "owner_fr": "FR-011", "title": "Aftercare request assigned to a provider", "attrs": {"description": "aftercare.request_assigned: the admin assigns a provider to a standalone request on Screen 15 and the provider is notified (Workflow 2 step 2). FR-011 is the producer; FR-030 owns notification delivery and catalogue registration."}}
  - {"op": "add_node", "id": "EVT-aftercare-payment-due", "type": "Event", "owner_fr": "FR-011", "title": "Aftercare payment due", "attrs": {"description": "aftercare.payment_due: the provider completes the standalone plan, the request becomes Payment due and the patient is told payment is due; the 48 hours start at this notice (Workflow 2 step 3). FR-011 is the producer; FR-030 owns delivery and catalogue registration."}}
  - {"op": "add_node", "id": "EVT-aftercare-request-rejected", "type": "Event", "owner_fr": "FR-011", "title": "Aftercare request rejected", "attrs": {"description": "aftercare.request_rejected: the request becomes Rejected, by the admin with a reason, by the 7-day unassigned expiry, or by the patient cancelling a changed price (Workflow 2 B2 and B4). FR-011 is the producer; FR-030 owns delivery and catalogue registration."}}
  - {"op": "add_node", "id": "EVT-aftercare-request-expired", "type": "Event", "owner_fr": "FR-011", "title": "Aftercare request expired", "attrs": {"description": "aftercare.request_expired: the request becomes Expired after 48 hours without successful payment (Workflow 2 B1, Workflow 2b B1b). FR-011 is the producer; FR-030 owns delivery and catalogue registration."}}
  - {"op": "add_node", "id": "EVT-aftercare-awaiting-availability", "type": "Event", "owner_fr": "FR-011", "title": "Aftercare request awaiting provider availability", "attrs": {"description": "aftercare.awaiting_availability: the admin marks the request Awaiting provider availability and the patient is told of the delay (Workflow 2 B3). FR-011 is the producer; FR-030 owns delivery and catalogue registration."}}
  - {"op": "add_node", "id": "EVT-aftercare-provider-withdrawn", "type": "Event", "owner_fr": "FR-011", "title": "Aftercare provider withdrawn", "attrs": {"description": "aftercare.provider_withdrawn: the provider tells the admin that they cannot continue the aftercare (Workflow 4 D1) and the admin is notified. FR-011 is the producer; FR-030 owns delivery and catalogue registration."}}
  - {"op": "add_node", "id": "EVT-aftercare-team-assigned", "type": "Event", "owner_fr": "FR-011", "title": "Aftercare assigned to the Hairline team", "attrs": {"description": "aftercare.team_assigned: the aftercare is assigned to the Hairline aftercare team, by the provider handover or by the admin, and the admin and team are notified (Workflow 1 A2, Workflow 2b B1a). FR-011 is the producer; FR-030 owns delivery and catalogue registration."}}
  - {"op": "add_node", "id": "EVT-aftercare-completed", "type": "Event", "owner_fr": "FR-011", "title": "Aftercare plan completed", "attrs": {"description": "aftercare.completed: the plan completes at the end of the last milestone or the subscription term (REQ-011-096). FR-006 reads this event to move the booking on (REQ-006-060). FR-011 is the producer; FR-030 owns registration."}}
  - {"op": "add_node", "id": "STP-011-058", "type": "Step", "owner_fr": "FR-011", "title": "System reminds the provider after 2 days that no plan is confirmed", "attrs": {"prd_ref": "Workflow 1 Alternative Flow A3"}}
  - {"op": "add_node", "id": "STP-011-059", "type": "Step", "owner_fr": "FR-011", "title": "System escalates the case to the admin after 4 days without a confirmed plan", "attrs": {"prd_ref": "Workflow 1 Alternative Flow A3"}}
  - {"op": "add_node", "id": "STP-011-060", "type": "Step", "owner_fr": "FR-011", "title": "Admin activates the plan manually with a mandatory reason, recorded in the audit trail", "attrs": {"prd_ref": "Workflow 1 Alternative Flow A3"}}
  - {"op": "add_node", "id": "STP-011-061", "type": "Step", "owner_fr": "FR-011", "title": "Admin assigns the aftercare team or the reassigned provider after an early close, and setup opens for them", "attrs": {"prd_ref": "Workflow 1 Alternative Flow A4"}}
  - {"op": "add_node", "id": "STP-011-062", "type": "Step", "owner_fr": "FR-011", "title": "System returns the existing plan when the completion signal arrives again", "attrs": {"prd_ref": "Workflow 1 Alternative Flow A5"}}
  - {"op": "add_node", "id": "STP-011-063", "type": "Step", "owner_fr": "FR-011", "title": "Patient accepts the final template's new price, or cancels the request at no charge", "attrs": {"prd_ref": "Workflow 2 Alternative Flow B4"}}
  - {"op": "add_node", "id": "STP-011-064", "type": "Step", "owner_fr": "FR-011", "title": "System sets the request to Rejected with the reason cancelled by patient", "attrs": {"prd_ref": "Workflow 2 Alternative Flow B4"}}
  - {"op": "add_node", "id": "STP-011-065", "type": "Step", "owner_fr": "FR-011", "title": "System completes the plan at the end of the last milestone or the subscription term and stops its reminders", "attrs": {"prd_ref": "Workflow 3 Alternative Flow C3"}}
  - {"op": "add_node", "id": "STP-011-066", "type": "Step", "owner_fr": "FR-011", "title": "Patient cancels the subscription or the plan paid in full from the plan payment screen", "attrs": {"prd_ref": "Workflow 3 Alternative Flow C4"}}
  - {"op": "add_node", "id": "STP-011-067", "type": "Step", "owner_fr": "FR-011", "title": "System applies the cancellation: care ends per the payment plan, with the pro-rata refund where one is due", "attrs": {"prd_ref": "Workflow 3 Alternative Flow C4"}}
