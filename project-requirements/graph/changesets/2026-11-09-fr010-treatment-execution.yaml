operations:
  - {"op": "update_node", "id": "ENT-treatment-record", "title": "Treatment record", "attrs": {"description": "The case's treatment execution record. One per booking; created at booking confirmation in status Awaiting Check In, seeded from the accepted snapshot. Holds the current treatment plan, clinician set, estimated and actual graft counts, documentation notes and lifecycle timestamps. Key Entities, Entity 1."}}  # was add_node; FR-007 created the stub, FR-010 fills it (controller conversion)
  - {"op": "add_node", "id": "ENT-treatment-day-record", "type": "Entity", "owner_fr": "FR-010", "title": "Treatment day record", "attrs": {"description": "One record per treatment day of the case's current treatment plan: relative day number, description, status, provider-only note. Never consolidated into a multi-day record. The PRD folds day records under Entity 1; modelled as a separate Entity here."}}
  - {"op": "add_node", "id": "ENT-treatment-media", "type": "Entity", "owner_fr": "FR-010", "title": "Treatment photo or head scan photo set", "attrs": {"description": "A media asset on a treatment record: head scan photo set before or after (V1) or a treatment photo. Key Entities, Entity 2."}}
  - {"op": "add_node", "id": "ENT-medication-instructions", "type": "Entity", "owner_fr": "FR-010", "title": "Medication instructions", "attrs": {"description": "Free-text medication instructions with author and update time; no structured schedule in FR-010. Key Entities, Entity 3."}}
  - {"op": "add_node", "id": "ENT-treatment-detail-change", "type": "Entity", "owner_fr": "FR-010", "title": "Treatment detail change", "attrs": {"description": "Append-only audit record of one post-acceptance change to plan days, clinician set or estimated graft count; never alters the accepted snapshot or any money field. Key Entities, Entity 5."}}
  - {"op": "add_node", "id": "ENT-treatment-audit-entry", "type": "Entity", "owner_fr": "FR-010", "title": "Treatment audit entry", "attrs": {"description": "Audit log entry for a treatment documentation action: who, what changed, when, from which IP address, with the reason for admin edits. Not a Key Entities entity; derived from REQ-010-014, the Audit Rule and the Audit Trail on Screen 8."}}
  - {"op": "add_node", "id": "SET-documentation-completion-deadline", "type": "Setting", "owner_fr": "FR-010", "title": "Documentation completion deadline", "attrs": {"description": "Treatment documentation completion deadline after Check In; admin can adjust within 12 to 48 hours. Owner is FR-010 because only the FR-010 PRD states it (ownership question for FR-026).", "default": "24", "unit": "hours"}}
  - {"op": "add_node", "id": "SET-documentation-reminder-timing", "type": "Setting", "owner_fr": "FR-010", "title": "Documentation reminder timing", "attrs": {"description": "Timing of the reminder notification when documentation is not completed after arrival; admin configurable. Owner is FR-010 because only the FR-010 PRD states it.", "default": "12", "unit": "hours"}}
  - {"op": "add_node", "id": "SET-photo-max-file-size", "type": "Setting", "owner_fr": "FR-010", "title": "Photo maximum file size", "attrs": {"description": "Maximum size per uploaded treatment photo; part of the admin-editable photo upload limits.", "default": "10", "unit": "MB"}}
  - {"op": "add_node", "id": "SET-photo-max-count-per-case", "type": "Setting", "owner_fr": "FR-010", "title": "Photo maximum count per case", "attrs": {"description": "Per-case limit on uploaded photos and head scan photo sets; admin configurable. The PRD gives no default value."}}
  - {"op": "add_node", "id": "EVT-treatment-started", "type": "Event", "owner_fr": "FR-010", "title": "Treatment started", "attrs": {"description": "treatment_started: sent to the patient when Check In moves the booking to In Progress (Integration 3, REQ-010-007)."}}
  - {"op": "add_node", "id": "EVT-treatment-completed", "type": "Event", "owner_fr": "FR-010", "title": "Treatment completed", "attrs": {"description": "treatment_completed: sent to the patient when treatment completes, with post-op and medication instructions; the admin is also notified of completion for billing (Integration 3, REQ-010-007, REQ-010-008)."}}
  - {"op": "add_node", "id": "EVT-treatment-day-updated", "type": "Event", "owner_fr": "FR-010", "title": "Treatment day updated", "attrs": {"description": "treatment_day_updated: day status or day progress synced to the patient app and admin dashboard within 30 seconds (Integration 1 and 3, REQ-010-032). Day statuses only; no clinical notes."}}
  - {"op": "add_node", "id": "EVT-treatment-plan-changed", "type": "Event", "owner_fr": "FR-010", "title": "Treatment plan changed", "attrs": {"description": "treatment.plan_changed: emitted for every treatment-detail change (plan days, clinicians or graft estimate); carries what changed and the new values, never money fields; registered in the FR-030 catalogue. Also fires from Confirmed, before the treatment stage; one producer stage recorded."}}
  - {"op": "add_node", "id": "EVT-treatment-completion-signal", "type": "Event", "owner_fr": "FR-010", "title": "Treatment completion signalled to aftercare", "attrs": {"description": "Signal from FR-010 to FR-011 when the provider saves End of Treatment: patient ID, treatment record ID, conclusion notes, prescription, advice, medication instructions, actual graft count, completion date (Integration 4, REQ-010-006, REQ-010-009, REQ-010-023)."}}
  - {"op": "add_node", "id": "REQ-010-001", "type": "Rule", "owner_fr": "FR-010", "title": "Check In moves a confirmed booking to In Progress", "attrs": {"statement": "System MUST allow providers to \"Check In\" confirmed bookings when patient arrives at clinic, transitioning status to \"In Progress\"", "rationale": "Functional Requirements Summary id kept verbatim. Archived FR-010 PRD baseline, lines 940."}}
  - {"op": "add_node", "id": "REQ-010-002", "type": "Rule", "owner_fr": "FR-010", "title": "Only Owner, Manager or Clinical Staff document treatments", "attrs": {"statement": "System MUST validate provider role (Owner, Manager, or Clinical Staff) before allowing treatment documentation; Billing Staff cannot document treatments", "rationale": "Functional Requirements Summary id kept verbatim. Archived FR-010 PRD baseline, lines 941."}}
  - {"op": "add_node", "id": "REQ-010-003", "type": "Rule", "owner_fr": "FR-010", "title": "Documentation auto-saved every 2 minutes", "attrs": {"statement": "System MUST auto-save treatment documentation every 2 minutes during active procedures to prevent data loss", "rationale": "Functional Requirements Summary id kept verbatim. Archived FR-010 PRD baseline, lines 942."}}
  - {"op": "add_node", "id": "REQ-010-004", "type": "Rule", "owner_fr": "FR-010", "title": "Minimum documentation required before treatment completion", "attrs": {"statement": "System MUST require minimum documentation before allowing treatment completion: conclusion notes, prescription, advice, medication (min 1), actual graft count, final head scan photo set (V1)", "rationale": "Functional Requirements Summary id kept verbatim. Archived FR-010 PRD baseline, lines 943."}}
  - {"op": "add_node", "id": "REQ-010-006", "type": "Rule", "owner_fr": "FR-010", "title": "Completion signalled to FR-011, which owns the Aftercare transition", "attrs": {"statement": "System MUST signal treatment completion to FR-011 upon provider saving the End of Treatment modal. FR-011 owns the status transition to \"Aftercare\" and aftercare plan activation", "rationale": "Functional Requirements Summary id kept verbatim. Archived FR-010 PRD baseline, lines 944."}}
  - {"op": "add_node", "id": "REQ-010-007", "type": "Rule", "owner_fr": "FR-010", "title": "Patient notified when treatment starts and completes", "attrs": {"statement": "System MUST send real-time status notifications to patient mobile app when treatment starts (\"In Progress\") and when treatment completes (\"Aftercare\")", "rationale": "Functional Requirements Summary id kept verbatim. The patient notice events are EVT-treatment-started and EVT-treatment-completed. Archived FR-010 PRD baseline, lines 945."}}
  - {"op": "add_node", "id": "REQ-010-008", "type": "Rule", "owner_fr": "FR-010", "title": "Post-op instruction sheet sent within 5 minutes of completion", "attrs": {"statement": "System MUST generate and send post-op instruction sheet to patient via email and in-app notification within 5 minutes of treatment completion", "rationale": "Functional Requirements Summary id kept verbatim. Archived FR-010 PRD baseline, lines 947."}}
  - {"op": "add_node", "id": "REQ-010-009", "type": "Rule", "owner_fr": "FR-010", "title": "Completion data signalled to FR-011 for aftercare setup", "attrs": {"statement": "System MUST signal treatment completion data (conclusion, prescription, advice, medication, graft count) to FR-011 for aftercare setup. FR-011 owns aftercare template selection, plan activation, milestone generation, scan schedules, and questionnaire cadence", "rationale": "Functional Requirements Summary id kept verbatim. Archived FR-010 PRD baseline, lines 948."}}
  - {"op": "add_node", "id": "REQ-010-010", "type": "Rule", "owner_fr": "FR-010", "title": "Documentation due within 24 hours of Check In, with reminders", "attrs": {"statement": "System MUST enforce treatment documentation completion within 24 hours of Check In; send reminder notifications at 12 and 24 hours if incomplete", "rationale": "Functional Requirements Summary id kept verbatim. Treatment plans span several days; see the product owner question on how the 24-hour window applies. The deadline and the reminder timing are governed by the two documentation Settings. Archived FR-010 PRD baseline, lines 949."}}
  - {"op": "add_node", "id": "REQ-010-011", "type": "Rule", "owner_fr": "FR-010", "title": "All documentation fields persisted with audit trail", "attrs": {"statement": "System MUST persist all treatment documentation fields with audit trail: graft counts, treatment reference, head scan photo sets (V1), treatment photos, medications, notes, timestamps, provider actions", "rationale": "Functional Requirements Summary id kept verbatim. Archived FR-010 PRD baseline, lines 960."}}
  - {"op": "add_node", "id": "REQ-010-012", "type": "Rule", "owner_fr": "FR-010", "title": "Documentation linked to snapshot and current details; estimate vs actual", "attrs": {"statement": "System MUST link treatment documentation to the accepted snapshot and the case's current treatment details, allowing providers to compare estimated vs. actual graft counts", "rationale": "Functional Requirements Summary id kept verbatim. Archived FR-010 PRD baseline, lines 961."}}
  - {"op": "add_node", "id": "REQ-010-013", "type": "Rule", "owner_fr": "FR-010", "title": "Treatment photos encrypted at rest and retained 7+ years", "attrs": {"statement": "System MUST store treatment photos encrypted at rest (AES-256) with retention period of 7+ years per healthcare compliance regulations", "rationale": "Functional Requirements Summary id kept verbatim. Archived FR-010 PRD baseline, lines 962."}}
  - {"op": "add_node", "id": "REQ-010-014", "type": "Rule", "owner_fr": "FR-010", "title": "Immutable audit log of documentation actions", "attrs": {"statement": "System MUST maintain immutable audit log of all treatment documentation actions: who documented, what changed, when changed (timestamp), IP address", "rationale": "Functional Requirements Summary id kept verbatim. Archived FR-010 PRD baseline, lines 963."}}
  - {"op": "add_node", "id": "REQ-010-015", "type": "Rule", "owner_fr": "FR-010", "title": "Documentation access limited to the owning clinic", "attrs": {"statement": "System MUST restrict treatment documentation access to provider clinic that owns the booking (no cross-clinic access)", "rationale": "Functional Requirements Summary id kept verbatim. Archived FR-010 PRD baseline, lines 967."}}
  - {"op": "add_node", "id": "REQ-010-016", "type": "Rule", "owner_fr": "FR-010", "title": "Patient medical data encrypted in transit and at rest", "attrs": {"statement": "System MUST encrypt patient medical data (treatment notes, complications, medications) in transit (TLS 1.3) and at rest (AES-256)", "rationale": "Functional Requirements Summary id kept verbatim. Archived FR-010 PRD baseline, lines 968."}}
  - {"op": "add_node", "id": "REQ-010-017", "type": "Rule", "owner_fr": "FR-010", "title": "Role-based access control for documentation", "attrs": {"statement": "System MUST implement role-based access control (RBAC) for treatment documentation: Owner, Manager, and Clinical Staff roles can document treatments; Billing Staff can view according to their access level but cannot document", "rationale": "Functional Requirements Summary id kept verbatim. Archived FR-010 PRD baseline, lines 969."}}
  - {"op": "add_node", "id": "REQ-010-018", "type": "Rule", "owner_fr": "FR-010", "title": "Upload file types validated and virus scanned", "attrs": {"statement": "System MUST validate file types on uploads — JPG, PNG for treatment photos and head scan photo sets (V1) — and perform virus scanning before storage", "rationale": "Functional Requirements Summary id kept verbatim. Archived FR-010 PRD baseline, lines 970."}}
  - {"op": "add_node", "id": "REQ-010-019", "type": "Rule", "owner_fr": "FR-010", "title": "Photo uploads rate-limited per provider", "attrs": {"statement": "System MUST rate-limit photo uploads (max 50 uploads per hour per provider) to prevent abuse or system overload", "rationale": "Functional Requirements Summary id kept verbatim. Archived FR-010 PRD baseline, lines 971."}}
  - {"op": "add_node", "id": "REQ-010-020", "type": "Rule", "owner_fr": "FR-010", "title": "Media uploads go through S-05 Media Storage", "attrs": {"statement": "System MUST integrate with S-05 Media Storage Service for secure treatment photo and head scan photo set (V1) uploads with encryption and retrieval", "rationale": "Functional Requirements Summary id kept verbatim. Archived FR-010 PRD baseline, lines 975."}}
  - {"op": "add_node", "id": "REQ-010-021", "type": "Rule", "owner_fr": "FR-010", "title": "Check In gated on outstanding balance; no payment capture in FR-010", "attrs": {"statement": "System MUST read booking payment state (from P-03 / FR-007) to gate \"Check In\" when there is an outstanding balance; FR-010 does not initiate payment capture", "rationale": "Functional Requirements Summary id kept verbatim. The same gate is held by FR-006 REQ-006-043 (Check In button availability). Kept here because the PRD states it as an FR-010 requirement. Archived FR-010 PRD baseline, lines 976."}}
  - {"op": "add_node", "id": "REQ-010-022", "type": "Rule", "owner_fr": "FR-010", "title": "Notifications go through S-03 Notification Service", "attrs": {"statement": "System MUST integrate with S-03 Notification Service to send status notifications, post-op instructions, and medication instructions to patients", "rationale": "Functional Requirements Summary id kept verbatim. Archived FR-010 PRD baseline, lines 977."}}
  - {"op": "add_node", "id": "REQ-010-023", "type": "Rule", "owner_fr": "FR-010", "title": "Completion data signalled to FR-011 (P-05 Aftercare)", "attrs": {"statement": "System MUST integrate with P-05 Aftercare Module (FR-011) by signalling treatment completion data; FR-011 handles aftercare plan creation and activation", "rationale": "Functional Requirements Summary id kept verbatim. Archived FR-010 PRD baseline, lines 978."}}
  - {"op": "add_node", "id": "REQ-010-024", "type": "Rule", "owner_fr": "FR-010", "title": "RESTful endpoints for treatment documentation", "attrs": {"statement": "System MUST expose RESTful API endpoints for treatment documentation CRUD operations (create treatment record, update progress, upload photos, complete treatment)", "rationale": "Functional Requirements Summary id kept verbatim. Archived FR-010 PRD baseline, lines 979."}}
  - {"op": "add_node", "id": "REQ-010-025", "type": "Rule", "owner_fr": "FR-010", "title": "Provider suspension or deactivation handling for In Progress cases", "attrs": {"statement": "When a provider's suspension or deactivation becomes effective, System MUST cancel that provider's In Progress cases with cause `ProviderSuspended` or `ProviderDeactivated` and an independent `supportRequired` marker, block further provider documentation, preserve clinical notes/photos and any recorded completion milestone, and let an admin rehome the patient to a replacement provider in the same inquiry through the FR-006 Alternative Flow B5 transfer, without restoring the case on reactivation (Alternative Flow B5; FR-015 A5/Screen 4). Provider-requested Cancel/Close Case (B4) remains a non-transitioning admin notification.", "rationale": "Functional Requirements Summary id kept verbatim. Conflicts with Rule 12, Alternative Flow B5, the edge case, REQ-010-029, REQ-010-031 and FR-006 REQ-006-015/019, which keep the In Progress case In Progress. The graph keeps this line verbatim and follows the stay-In-Progress reading elsewhere; see the product owner question. Archived FR-010 PRD baseline, lines 950."}}
  - {"op": "add_node", "id": "REQ-010-026", "type": "Rule", "owner_fr": "FR-010", "title": "Accepted snapshot is the only source of money and appointment data", "attrs": {"statement": "System MUST read price, currency, date range, appointment, and promotion only from the accepted snapshot reached through the booking's AcceptanceEvent, and MUST seed the case's treatment plan days, clinician set, and estimated graft count from the same snapshot; FR-010 MUST NOT read accepted data from live FR-004 records or edit the snapshot (Rule 14)", "rationale": "Functional Requirements Summary id kept verbatim. Archived FR-010 PRD baseline, lines 951."}}
  - {"op": "add_node", "id": "REQ-010-027", "type": "Rule", "owner_fr": "FR-010", "title": "FR-010 is the only path for post-acceptance treatment-detail changes", "attrs": {"statement": "System MUST make FR-010 the only path for post-acceptance changes to treatment plan days, clinician set, and estimated graft count, blocked while the booking is `Accepted` and limited to the clinic (Owner, Manager, or Clinical Staff, from `Confirmed` until Check In) and admins (from `Confirmed` onward); each change MUST require a reason, be audited with before/after values, notify the patient through the FR-030 `treatment.plan_changed` event, leave the accepted snapshot unchanged, and never change money fields (Rule 13; Alternative Flow A2)", "rationale": "Functional Requirements Summary id kept verbatim. Archived FR-010 PRD baseline, lines 952."}}
  - {"op": "add_node", "id": "REQ-010-028", "type": "Rule", "owner_fr": "FR-010", "title": "Plan days stored and displayed as relative day numbers only", "attrs": {"statement": "System MUST display and store treatment plan days as relative day numbers only, never as calendar dates (Rule 15)", "rationale": "Functional Requirements Summary id kept verbatim. Archived FR-010 PRD baseline, lines 953."}}
  - {"op": "add_node", "id": "REQ-010-029", "type": "Rule", "owner_fr": "FR-010", "title": "Treating provider never reassigned in FR-010", "attrs": {"statement": "System MUST NOT reassign the treating provider in FR-010; provider withdrawal, drop-out, or replacement after acceptance MUST be handed to the FR-006 Alternative Flow B5 provider-fault transfer before Check In, and to the FR-006 Alternative Flow B7 admin decision while In Progress (Rule 16; Alternative Flow B6)", "rationale": "Functional Requirements Summary id kept verbatim. Archived FR-010 PRD baseline, lines 954."}}
  - {"op": "add_node", "id": "REQ-010-030", "type": "Rule", "owner_fr": "FR-010", "title": "Admin Change Treatment Details screen from Confirmed onward", "attrs": {"statement": "System MUST give admins the Change Treatment Details screen (Screen 9) for any booking from `Confirmed` onward that is not `Cancelled`, with mandatory reason, a before and after confirmation step, a Treatment Detail Change record, an audit entry, and the `treatment.plan_changed` event; the clinic form follows the same rules but closes at Check In", "rationale": "Functional Requirements Summary id kept verbatim. Archived FR-010 PRD baseline, lines 955."}}
  - {"op": "add_node", "id": "REQ-010-031", "type": "Rule", "owner_fr": "FR-010", "title": "No manual setting of booking or case status in FR-010", "attrs": {"statement": "System MUST NOT let any user set a booking or case status by hand in FR-010; provider Cancel / Close Case requests and admin case closures resolve only through the FR-006 governed actions (change appointment, cancel booking, provider-fault transfer, In-Progress provider-fault decision)", "rationale": "Functional Requirements Summary id kept verbatim. Archived FR-010 PRD baseline, lines 956."}}
  - {"op": "add_node", "id": "REQ-010-032", "type": "Rule", "owner_fr": "FR-010", "title": "Day-based progress synced to patient app and admin within 30 seconds", "attrs": {"statement": "System MUST sync day-based treatment progress (accepted Quote Option ID, current treatment day number, day description from the case's current treatment plan, seeded from that option's `QuoteOptionPlanDay` records in the accepted snapshot, and day status) to patient app and admin dashboard in real-time (within 30 seconds of provider update) for transparency into day-to-day treatment progress *(day statuses only — clinical notes are provider-only)*", "rationale": "Renumbered from the PRD id REQ-010-007A (ids are digits only). Renumbered from the PRD id REQ-010-007A (ids are digits only). Day statuses only; clinical notes stay provider-only. Archived FR-010 PRD baseline, lines 946."}}
  - {"op": "add_node", "id": "REQ-010-033", "type": "Rule", "owner_fr": "FR-010", "title": "Booking status moves Confirmed, In Progress, Aftercare, Completed with no skipping", "attrs": {"statement": "Booking status MUST transition through sequence: Confirmed → In Progress → Aftercare → Completed (no skipping stages). Exceptions: after a provider fault an admin may move an In Progress booking to Aftercare through the FR-006 In-Progress provider-fault decision (Rule 12), and an admin may cancel the booking from any non-terminal state through the FR-006 Cancel Booking action.", "rationale": "Archived FR-010 PRD baseline, lines 552."}}
  - {"op": "add_node", "id": "REQ-010-034", "type": "Rule", "owner_fr": "FR-010", "title": "Documentation starts only at Check In; record created at confirmation as Awaiting Check In", "attrs": {"statement": "Treatment documentation MUST be initiated by the \"Check In\" action from the Confirmed list (cannot pre-document treatments). The treatment record itself is created at booking confirmation (first successful payment) in status \"Awaiting Check In\", seeded from the accepted snapshot, so audited treatment-detail changes before Check In have a record to change", "rationale": "The record is created at booking confirmation, which the PRD places in the booking flow, so the rule also applies at the booking stage. The Check In gate itself is held by FR-006 REQ-006-043. Archived FR-010 PRD baseline, lines 553."}}
  - {"op": "add_node", "id": "REQ-010-035", "type": "Rule", "owner_fr": "FR-010", "title": "Timestamps recorded in UTC and shown in the provider's local timezone", "attrs": {"statement": "All timestamps (check-in, end of treatment) MUST be recorded in UTC and displayed in provider's local timezone", "rationale": "Archived FR-010 PRD baseline, lines 556."}}
  - {"op": "add_node", "id": "REQ-010-036", "type": "Rule", "owner_fr": "FR-010", "title": "At most one treatment In Progress per patient", "attrs": {"statement": "Maximum one treatment can be \"In Progress\" per patient at any time (prevents duplicate documentation)", "rationale": "Archived FR-010 PRD baseline, lines 558."}}
  - {"op": "add_node", "id": "REQ-010-037", "type": "Rule", "owner_fr": "FR-010", "title": "Plan days, clinician set and estimated graft count locked for providers after Check In", "attrs": {"statement": "Treatment Plan (per-day) day descriptions, the assigned clinician set, and the estimated graft count are LOCKED for providers once Check In is performed — providers cannot modify them mid-procedure. While the booking is `Accepted` (unpaid) they are locked for everyone. From `Confirmed` until Check In the clinic may change them, and from `Confirmed` onward an admin may change them, only through the treatment-detail change (Rule 13). Each change MUST carry a reason and MUST be captured in the audit trail (previous values preserved).", "rationale": "Source link names the stakeholder item the product owner decision log (reports/2026-10-16/mtg002-quote-model-decisions-2026-10-16.md, items M2 and Q2) refines. Archived FR-010 PRD baseline, lines 559."}}
  - {"op": "add_node", "id": "REQ-010-038", "type": "Rule", "owner_fr": "FR-010", "title": "Each treatment day is a discrete record", "attrs": {"statement": "Each treatment day is a discrete record — day records are NEVER consolidated into a single multi-day record", "rationale": "Repeated by the Screen 4 business rule on day independence. Archived FR-010 PRD baseline, lines 560."}}
  - {"op": "add_node", "id": "REQ-010-039", "type": "Rule", "owner_fr": "FR-010", "title": "Only five day statuses are valid", "attrs": {"statement": "Valid day statuses are: Not started | In progress | Finished | Need caution/attention | Cancelled/Deferred. No other statuses are permitted.", "rationale": "Screen 4 and Screen 5 add that Pause is not a valid status and must not appear in the Status dropdown. Archived FR-010 PRD baseline, lines 561."}}
  - {"op": "add_node", "id": "REQ-010-040", "type": "Rule", "owner_fr": "FR-010", "title": "Provider Cancel or Close Case does not change status or trigger money actions", "attrs": {"statement": "The provider's Cancel / Close Case action does NOT auto-transition status or trigger financial actions. The admin resolves it only through the FR-006 governed actions (change appointment, cancel booking, or provider-fault transfer); no one sets a booking status by hand", "rationale": "Archived FR-010 PRD baseline, lines 562."}}
  - {"op": "add_node", "id": "REQ-010-041", "type": "Rule", "owner_fr": "FR-010", "title": "Suspension or deactivation leaves In Progress cases In Progress with a support marker", "attrs": {"statement": "An effective provider suspension/deactivation (FR-015 A5/Screen 4) does not cancel the provider's In Progress cases: each stays In Progress with cause `ProviderSuspended` or `ProviderDeactivated` and an independent `supportRequired` marker, and provider documentation is blocked (Alternative Flow B5). This cascade is distinct from Rule 11's provider-requested closure. Clinical notes, photos, head scan photo sets, and any already recorded completion milestone are preserved; an admin decides case by case through FR-006 Alternative Flow B7 to move the booking to Aftercare and reassign the aftercare provider through FR-011 Screen 19, or to cancel the booking. No replacement acceptance is created for an In Progress case. Reactivation never restores the provider's actions on the case.", "rationale": "Conflicts with REQ-010-025 (see the product owner question). Also stated in Alternative Flow B5 and the suspended-mid-treatment edge case; the edge case adds that a later deactivation does not overwrite an earlier ProviderSuspended cause. Archived FR-010 PRD baseline, lines 563."}}
  - {"op": "add_node", "id": "REQ-010-042", "type": "Rule", "owner_fr": "FR-010", "title": "Post-acceptance treatment-detail changes only through FR-010, with reason and audit", "attrs": {"statement": "After subquote acceptance, FR-010 is the only path for changing the treatment plan days, the assigned clinician set, and the estimated graft count. No change is allowed while the booking is `Accepted` (unpaid); changes are allowed only from `Confirmed`. Only the clinic (Owner, Manager, or Clinical Staff, from `Confirmed` until Check In) or an admin (from `Confirmed` onward) may make the change. Each change MUST record actor, role, reason, timestamp, and before/after values; MUST notify the patient through the FR-030 `treatment.plan_changed` event; MUST leave the accepted snapshot unchanged as the original record; and MUST NOT change price, currency, date range, appointment, or promotion (Alternative Flow A2). Admin changes use Screen 9.", "rationale": "Restates REQ-010-027 with more detail (who may change, what is recorded); possible duplicate within this FR. Archived FR-010 PRD baseline, lines 564."}}
  - {"op": "add_node", "id": "REQ-010-043", "type": "Rule", "owner_fr": "FR-010", "title": "Money and appointment baseline read only from the accepted snapshot", "attrs": {"statement": "Price, currency, date range, accepted appointment baseline, and promotion are read only from the accepted snapshot, reached through the FR-006 booking's AcceptanceEvent. The operative procedure date (Check In gate and displays) is the current FR-006 booking appointment, which equals the snapshot appointment unless an approved FR-006 admin date change applies. FR-010 never edits the snapshot or reads these values from live FR-004 records. The case's current treatment details are seeded from the same snapshot and then change only under Rule 13.", "rationale": "Restates REQ-010-026 and adds the operative procedure date; possible duplicate within this FR. Archived FR-010 PRD baseline, lines 565."}}
  - {"op": "add_node", "id": "REQ-010-044", "type": "Rule", "owner_fr": "FR-010", "title": "FR-010 never reassigns the treating provider; hand-off to FR-006 flows", "attrs": {"statement": "FR-010 never reassigns the treating provider. Provider withdrawal, drop-out, or replacement after acceptance and before Check In is handed to the FR-006 Alternative Flow B5 provider-fault transfer (Alternative Flow B6); after Check In it is handed to the FR-006 Alternative Flow B7 admin decision (move to Aftercare with an aftercare reassignment, or cancel), with no replacement acceptance. The B5 payment placeholder applies to the transfer: amounts already paid move with the patient as credit toward the replacement booking, any unused part is refunded, and the patient pays no cancellation fee.", "rationale": "Restates REQ-010-029 and adds the payment placeholder; possible duplicate within this FR. Archived FR-010 PRD baseline, lines 567."}}
  - {"op": "add_node", "id": "REQ-010-045", "type": "Rule", "owner_fr": "FR-010", "title": "Patient name and contact visible to provider only after payment", "attrs": {"statement": "Patient full name and contact details visible to provider ONLY after payment completion (pre-payment shows anonymized ID)", "rationale": "FR-006 REQ-006-008 says payment confirmation; see the product owner question on payment completion versus payment confirmation. Archived FR-010 PRD baseline, lines 571."}}
  - {"op": "add_node", "id": "REQ-010-046", "type": "Rule", "owner_fr": "FR-010", "title": "Treatment documentation retained at least 7 years", "attrs": {"statement": "Treatment documentation MUST be retained for minimum 7 years per healthcare compliance regulations", "rationale": "Overlaps the 7+ year retention for photos in REQ-010-013; possible duplicate within this FR. Archived FR-010 PRD baseline, lines 573."}}
  - {"op": "add_node", "id": "REQ-010-047", "type": "Rule", "owner_fr": "FR-010", "title": "Documentation changes logged; no hard deletes", "attrs": {"statement": "All changes to treatment documentation MUST be logged with timestamp, user ID, and action type (create, update, status change, archive/soft-delete, restore). Hard deletes are forbidden for treatment documentation and associated media assets.", "rationale": "Archived FR-010 PRD baseline, lines 575."}}
  - {"op": "add_node", "id": "REQ-010-048", "type": "Rule", "owner_fr": "FR-010", "title": "Treatment photos and notes are PHI and must follow data protection regulations", "attrs": {"statement": "Treatment photos and medical notes constitute Protected Health Information (PHI) and MUST comply with data protection regulations", "rationale": "Archived FR-010 PRD baseline, lines 576."}}
  - {"op": "add_node", "id": "REQ-010-049", "type": "Rule", "owner_fr": "FR-010", "title": "Audit log retained 10 years minimum, immutable", "attrs": {"statement": "Audit log retention (10 years minimum, immutable)", "rationale": "Listed under Fixed in Codebase (Not Editable). Overlaps REQ-010-014 (immutable audit log). Archived FR-010 PRD baseline, lines 592."}}
  - {"op": "add_node", "id": "REQ-010-050", "type": "Rule", "owner_fr": "FR-010", "title": "Admin edits medication and post-op instruction templates", "attrs": {"statement": "Editable by Admin: Medication templates (common post-op medication presets to speed up prescribing) Post-op instruction templates (standard instruction text that providers can customize)", "rationale": "Ownership of the templates (FR-010, FR-011 or FR-026) is a product owner question. Treatment catalog (FR-024) and aftercare templates (FR-011) are listed in the same section and are cited, not owned here. Archived FR-010 PRD baseline, lines 584, 585."}}
  - {"op": "add_node", "id": "REQ-010-051", "type": "Rule", "owner_fr": "FR-010", "title": "Admin can configure the documentation deadline and reminder timing", "attrs": {"statement": "Admin can adjust \"treatment documentation completion deadline\" (default 24 hours, range 12-48 hours) Admin can configure reminder notification timing (default: 12 hours after arrival if not completed)", "rationale": "Archived FR-010 PRD baseline, lines 597, 598."}}
  - {"op": "add_node", "id": "REQ-010-052", "type": "Rule", "owner_fr": "FR-010", "title": "Admin cannot disable required fields or bypass validation", "attrs": {"statement": "Fixed in codebase / configurable with restrictions: Admin cannot disable required fields or bypass validation rules (ensures data quality) Required fields for treatment completion (conclusion notes, prescription, advice, medication, actual graft count, final head scan photo set (V1))", "rationale": "Archived FR-010 PRD baseline, lines 593, 599."}}
  - {"op": "add_node", "id": "REQ-010-053", "type": "Rule", "owner_fr": "FR-010", "title": "Photo upload limits are admin-configurable", "attrs": {"statement": "Photo upload limits (max number of photos, max file size) System enforces a reasonable per-case upload limit (configurable by admin). Upload interface shows current count and disables additional uploads when limit reached with a clear message. Treatment Photos (Before): Regular photos of patient's condition before procedure (JPG/PNG) (Max 10MB per file; JPG/PNG only; multiple uploads allowed)", "rationale": "Edge case on too many head scan photo sets: the upload interface shows the current count and disables further uploads at the limit. Archived FR-010 PRD baseline, lines 359, 586, 909."}}
  - {"op": "add_node", "id": "REQ-010-054", "type": "Rule", "owner_fr": "FR-010", "title": "Free-text clinical fields limited to 2000 characters", "attrs": {"statement": "Screen validation: Conclusion Notes: Max 2000 characters Prescription: Max 2000 characters Advice: Max 2000 characters Beginning Note: Max 2000 characters; auto-saved every 2 minutes Note: Max 2000 characters", "rationale": "Archived FR-010 PRD baseline, lines 357, 404, 427, 428, 429."}}
  - {"op": "add_node", "id": "REQ-010-055", "type": "Rule", "owner_fr": "FR-010", "title": "Graft counts are whole numbers from 0 to 10000", "attrs": {"statement": "Screen validation: Actual Graft Count: Min 0, max 10000; compared against estimated count for reference Actual Graft Count: Min 0, max 10000; edit logged Estimated Graft Count: Whole number from 0 to 10000", "rationale": "Archived FR-010 PRD baseline, lines 431, 497, 533."}}
  - {"op": "add_node", "id": "REQ-010-056", "type": "Rule", "owner_fr": "FR-010", "title": "FR-010 never initiates payment capture", "attrs": {"statement": "FR-010 MUST NOT initiate payment capture. Final payment collection is handled in FR-007 / P-03: Booking & Payment.", "rationale": "Restates REQ-010-021's second half; possible duplicate within this FR. Archived FR-010 PRD baseline, lines 603."}}
  - {"op": "add_node", "id": "REQ-010-057", "type": "Rule", "owner_fr": "FR-010", "title": "Completion timestamp used for billing reconciliation; admin notified", "attrs": {"statement": "Treatment completion timestamp is used for billing reconciliation and reporting (admin notified on completion).", "rationale": "Archived FR-010 PRD baseline, lines 605."}}
  - {"op": "add_node", "id": "REQ-010-058", "type": "Rule", "owner_fr": "FR-010", "title": "Price, currency and promotion never change in FR-010", "attrs": {"statement": "Price, currency, and promotion are read from the accepted snapshot and never change in FR-010; neither treatment-detail changes nor treatment completion modify amounts (Rule 14).", "rationale": "Overlaps REQ-010-026 and Rule 14; possible duplicate within this FR. Archived FR-010 PRD baseline, lines 606."}}
  - {"op": "add_node", "id": "REQ-010-059", "type": "Rule", "owner_fr": "FR-010", "title": "No-Show: admin handles deposit retention and reconciliation", "attrs": {"statement": "If a case is flagged as No-Show, admin handles deposit retention and reconciliation per cancellation policy (EC-004).", "rationale": "References EC-004, which does not exist in this PRD (product owner question). Archived FR-010 PRD baseline, lines 607."}}
  - {"op": "add_node", "id": "REQ-010-060", "type": "Rule", "owner_fr": "FR-010", "title": "Patient sees day statuses only; clinical notes are provider-only", "attrs": {"statement": "Patient sees day status badges only — provider clinical notes are NOT visible to the patient.", "rationale": "Repeated on Screen 2 (clinical notes for the day not visible) and Screen 5 (notes entered here are provider-only). Applies on screens SCR-010-01, SCR-010-02 and SCR-010-05. Archived FR-010 PRD baseline, lines 281."}}
  - {"op": "add_node", "id": "REQ-010-061", "type": "Rule", "owner_fr": "FR-010", "title": "Beginning note shown to the patient only if the provider entered it", "attrs": {"statement": "Beginning note is visible to the patient only if the provider has entered it; otherwise the section is hidden. Hidden if provider has not entered it; no placeholder shown", "rationale": "Applies on screen SCR-010-01. Archived FR-010 PRD baseline, lines 274, 282."}}
  - {"op": "add_node", "id": "REQ-010-062", "type": "Rule", "owner_fr": "FR-010", "title": "Patient sees the summary note and before/after photos after completion", "attrs": {"statement": "Views provider-authored treatment summary note after completion (high-level outcome, final graft count, treatment type) Accesses before/after photos uploaded by provider (after completion)", "rationale": "Archived FR-010 PRD baseline, lines 36, 37."}}
  - {"op": "add_node", "id": "REQ-010-063", "type": "Rule", "owner_fr": "FR-010", "title": "Estimated graft count is shown for reference; actual count appears after End of Treatment", "attrs": {"statement": "Estimated graft count is shown for patient reference; actual graft count appears after End of Treatment.", "rationale": "Applies on screen SCR-010-01. Archived FR-010 PRD baseline, lines 283."}}
  - {"op": "add_node", "id": "REQ-010-064", "type": "Rule", "owner_fr": "FR-010", "title": "Patient screens are read-only; patient has no part in clinical documentation", "attrs": {"statement": "All fields are read-only; the patient cannot take any action on this screen. NOT involved in clinical documentation (no access to detailed medical notes, complications, or real-time clinical data during procedure)", "rationale": "Applies on screens SCR-010-01 and SCR-010-02. Archived FR-010 PRD baseline, lines 38, 284."}}
  - {"op": "add_node", "id": "REQ-010-065", "type": "Rule", "owner_fr": "FR-010", "title": "Admin sees all active treatments and their day progress in real time", "attrs": {"statement": "Admin real-time visibility into treatment progress across all active procedures (which day + day status + day description — for oversight) View all active treatments across all providers (real-time \"In Progress\" list with current day and status)", "rationale": "Archived FR-010 PRD baseline, lines 51, 70."}}
  - {"op": "add_node", "id": "REQ-010-066", "type": "Rule", "owner_fr": "FR-010", "title": "Admin can view and manage payment status for operational follow-up", "attrs": {"statement": "View and manage payment status (outstanding balance / split pay) for operational follow-up", "rationale": "No screen field shows payment status, and what manage means next to Payment Rule 1 is unclear (product owner question). Archived FR-010 PRD baseline, lines 55."}}
  - {"op": "add_node", "id": "REQ-010-067", "type": "Rule", "owner_fr": "FR-010", "title": "Chat, video and live streaming of treatment are out of scope", "attrs": {"statement": "Real-time chat between patient and provider during treatment (patients are physically present) Video documentation of procedure (future enhancement) Live streaming of detailed treatment progress to third parties (e.g., patient's family) (future enhancement)", "rationale": "Archived FR-010 PRD baseline, lines 74, 75, 76."}}
  - {"op": "add_node", "id": "REQ-010-068", "type": "Rule", "owner_fr": "FR-010", "title": "No SMS treatment alerts in the MVP", "attrs": {"statement": "SMS notifications to patient's emergency contact (handled by S-03: Notification Service configuration; no SMS treatment alerts are sent in MVP and this capability is reserved for a future phase once S-03 SMS support is enabled)", "rationale": "Archived FR-010 PRD baseline, lines 77."}}
  - {"op": "add_node", "id": "REQ-010-069", "type": "Rule", "owner_fr": "FR-010", "title": "Entry points to treatment execution", "attrs": {"statement": "Entry points: Provider navigates to \"Confirmed\" section in Patient Management (Provider Platform dashboard) System opens the case detail page in tabbed view (tabs: Treatment Plan | Note | Book hotel & Book flight | In Progress) Provider can resume documentation for \"In Progress\" treatments from the \"In Progress\" section in Patient Management Provider can view completed treatments from \"Completed\" section (read-only mode)", "rationale": "Screens SCR-010-03 and SCR-010-04 are the provider entry screens. Archived FR-010 PRD baseline, lines 83, 85, 91, 92."}}
  - {"op": "add_node", "id": "REQ-010-070", "type": "Rule", "owner_fr": "FR-010", "title": "Check In unavailable shows the reason and admin can assist", "attrs": {"statement": "Provider sees a clear reason and admin is able to assist per billing ops. \"Check In\" button disabled for bookings with procedure date > today; tooltip displays \"Cannot check in future appointments. Wait until procedure date.\" \"Check In\" is disabled with a clear message. Patient must complete payment through the booking/payment flow (FR-007) before treatment documentation can start.", "rationale": "The blocking condition itself is held by FR-006 REQ-006-043 (see cross-FR duplicates). Archived FR-010 PRD baseline, lines 604, 911, 921."}}
  - {"op": "add_node", "id": "REQ-010-071", "type": "Rule", "owner_fr": "FR-010", "title": "Early arrival: provider confirms early Check In; original appointment time kept", "attrs": {"statement": "Provider clicks Check In; system detects early arrival and displays confirmation prompt Outcome: Treatment proceeds earlier than scheduled; original appointment time preserved in booking record", "rationale": "Alternative Flow A1. The confirmation prompt text is in the flow step; the Outcome line is the second part. Archived FR-010 PRD baseline, lines 138, 143."}}
  - {"op": "add_node", "id": "REQ-010-072", "type": "Rule", "owner_fr": "FR-010", "title": "Treatment-detail change form validation", "attrs": {"statement": "Screen 9 validation: Current Treatment Plan Days: Days stay relative; no calendar dates; at least one day remains; days that already have a day status other than Not started cannot be removed Assigned Clinicians: At least one clinician remains; only clinicians on the treating provider's staff list Change Reason: Mandatory; 10 to 1000 characters Confirm Change: Enabled only when at least one value changed and the reason is valid", "rationale": "Estimated graft count range is held by the graft-count rule. The clinic form on Screen 4 follows the same rules. Archived FR-010 PRD baseline, lines 531, 532, 534, 537."}}
  - {"op": "add_node", "id": "REQ-010-073", "type": "Rule", "owner_fr": "FR-010", "title": "Admin treatment-detail change available from Confirmed, never while Accepted, Expired or Cancelled", "attrs": {"statement": "The admin may use this screen at any time from `Confirmed` onward, including after Check In, during `Aftercare`, and after `Completed`; it is never available while the booking is `Accepted`, `Payment Window Expired`, or `Cancelled`.", "rationale": "Applies on screen SCR-010-09. Archived FR-010 PRD baseline, lines 542."}}
  - {"op": "add_node", "id": "REQ-010-074", "type": "Rule", "owner_fr": "FR-010", "title": "Change saved only after the admin confirms the before and after summary", "attrs": {"statement": "The change is saved only after the admin confirms the before and after summary.", "rationale": "Applies on screen SCR-010-09. Archived FR-010 PRD baseline, lines 543."}}
  - {"op": "add_node", "id": "REQ-010-075", "type": "Rule", "owner_fr": "FR-010", "title": "Each saved change creates one Treatment Detail Change record and an audit entry", "attrs": {"statement": "Each saved change creates one Treatment Detail Change record (Entity 5) with actor, actor type, role, reason, timestamp, and before and after values, and adds an audit trail entry.", "rationale": "Applies on screen SCR-010-09. Archived FR-010 PRD baseline, lines 544."}}
  - {"op": "add_node", "id": "REQ-010-076", "type": "Rule", "owner_fr": "FR-010", "title": "Patient no-show: Cancel or Close Case notifies admin; booking stays Confirmed", "attrs": {"statement": "Provider clicks Cancel/Close Case; selects reason: No-show; adds note System notifies admin; the booking stays Confirmed. The admin rebooks through the FR-006 Change Appointment action (FR-006 Screen 8) or cancels through the FR-006 Cancel Booking action (FR-006 Screen 9); deposit retention follows the FR-006 payment placeholder. No-Show is an admin-managed case label, not a system-defined booking pipeline status", "rationale": "Alternative Flow B1. The flow header says financial penalties are applied per cancellation policy, which step 6 does not support (product owner question). Archived FR-010 PRD baseline, lines 176, 177."}}
  - {"op": "add_node", "id": "REQ-010-077", "type": "Rule", "owner_fr": "FR-010", "title": "Medical postponement: Cancel or Close Case notifies admin; booking stays Confirmed", "attrs": {"statement": "Provider selects reason: Medical postponement; documents the condition and clearance requirements System notifies admin; the booking stays Confirmed. The admin reschedules through the FR-006 Change Appointment action (FR-006 Screen 8) with no financial penalty, or cancels through the FR-006 Cancel Booking action (FR-006 Screen 9). Note: 'Postponed' is an admin-managed case label, not a system-defined booking pipeline status", "rationale": "Alternative Flow B2. Archived FR-010 PRD baseline, lines 189, 190."}}
  - {"op": "add_node", "id": "REQ-010-078", "type": "Rule", "owner_fr": "FR-010", "title": "Interrupted treatment: reason in day note; case stays In Progress until admin acts", "attrs": {"statement": "Provider documents interruption reason in the affected day's note field Provider sets day status to Cancelled/Deferred; clicks Cancel/Close Case; documents reason System notifies admin; the case stays In Progress until the admin acts. The admin lets the case resume later, changes treatment details through Screen 9, or cancels the booking through the FR-006 Cancel Booking action (FR-006 Screen 9); financial reconciliation follows the FR-006 payment placeholder", "rationale": "Alternative Flow B3. Archived FR-010 PRD baseline, lines 201, 204, 205."}}
  - {"op": "add_node", "id": "REQ-010-079", "type": "Rule", "owner_fr": "FR-010", "title": "Provider closes an In Progress case with a reason; admin notified", "attrs": {"statement": "Provider clicks Cancel/Close Case; selects closure reason from list (No-show, Patient cancellation, Medical, Operational, Other); adds free-text note System sends notification to admin with reason and note", "rationale": "Alternative Flow B4. Closure is resolved through the FR-006 Cancel Booking action or the In-Progress provider-fault decision. Archived FR-010 PRD baseline, lines 216, 217."}}
  - {"op": "add_node", "id": "REQ-010-080", "type": "Rule", "owner_fr": "FR-010", "title": "Provider documentation blocked and records read-only after a provider status cascade", "attrs": {"statement": "Provider documentation actions (day edits, End Treatment) are blocked; day records, clinical notes, photos, head scan photo sets, and any already recorded completion milestone are retained read-only Patient/admin notifications per FR-015 Screen 4 and FR-030; the patient is told an admin will contact them about the next step", "rationale": "Alternative Flow B5; overlaps Rule 12, possible duplicate within this FR. Archived FR-010 PRD baseline, lines 231, 232."}}
  - {"op": "add_node", "id": "REQ-010-081", "type": "Rule", "owner_fr": "FR-010", "title": "Provider fault before Check In: documentation blocked, records retained read-only", "attrs": {"statement": "FR-006 cancels the booking with cause ProviderFault; provider documentation on this case is blocked; day records, notes, photos, and head scan photo sets are retained read-only", "rationale": "Alternative Flow B6. Archived FR-010 PRD baseline, lines 246."}}
  - {"op": "add_node", "id": "REQ-010-082", "type": "Rule", "owner_fr": "FR-010", "title": "Replacement booking reads money and seeds treatment details from the replacement acceptance", "attrs": {"statement": "Patient and admin are notified through FR-006 Alternative Flow B5 (booking.provider_fault_replacement); the replacement provider learns through quote.accepted and the patient receives booking.scheduled; the replacement booking follows the FR-006 main flow; its FR-010 case reads its money fields and seeds its treatment details from the replacement acceptance snapshot", "rationale": "Alternative Flow B6. Archived FR-010 PRD baseline, lines 248."}}
  - {"op": "add_node", "id": "REQ-010-083", "type": "Rule", "owner_fr": "FR-010", "title": "Saved End of Treatment is final for the provider; adjustments go through admin and FR-011", "attrs": {"statement": "Once saved, the provider cannot return to edit In Progress documentation — an audit snapshot is captured. Provider cannot edit completed treatment record; aftercare template selection and plan activation are handled entirely by FR-011. If adjustments are needed, provider contacts admin; admin can modify the aftercare plan through FR-011's admin interface; audit trail logs admin intervention.", "rationale": "Archived FR-010 PRD baseline, lines 442, 932."}}
  - {"op": "add_node", "id": "REQ-010-084", "type": "Rule", "owner_fr": "FR-010", "title": "Actual graft count is the definitive record; estimates preserved", "attrs": {"statement": "Actual graft count is the definitive record; the current estimated graft count, and the original estimate in the accepted snapshot, are preserved for reference and audit.", "rationale": "Archived FR-010 PRD baseline, lines 443."}}
  - {"op": "add_node", "id": "REQ-010-085", "type": "Rule", "owner_fr": "FR-010", "title": "Completion blocked until the final head scan is stored; photos queue when storage is down", "attrs": {"statement": "Media files (head scan photo sets and treatment photos) queued locally on provider device with status \"Pending Upload\"; background process retries upload every 5 minutes; provider sees upload progress indicator; treatment completion blocked until all required uploads (final head scan photo set) are successfully stored — optional treatment photos may remain queued without blocking completion. Error handling: If upload fails, photos queued locally; retry with exponential backoff; provider notified of pending uploads", "rationale": "Archived FR-010 PRD baseline, lines 757, 917."}}
  - {"op": "add_node", "id": "REQ-010-086", "type": "Rule", "owner_fr": "FR-010", "title": "If the FR-011 signal fails, treatment stays complete and admin triggers aftercare", "attrs": {"statement": "If signal to FR-011 fails, treatment still marked complete in FR-010, but admin notified to manually trigger aftercare setup in FR-011", "rationale": "Archived FR-010 PRD baseline, lines 767."}}
  - {"op": "add_node", "id": "REQ-010-087", "type": "Rule", "owner_fr": "FR-010", "title": "Admin may edit treatment documentation except snapshot, money fields and provider", "attrs": {"statement": "Admin has full edit access to treatment documentation fields as confirmed in client requirements, except the accepted snapshot, the money fields read from it (price, currency, date range, appointment, promotion), and the treating provider, which are read-only in FR-010.", "rationale": "Archived FR-010 PRD baseline, lines 507."}}
  - {"op": "add_node", "id": "REQ-010-088", "type": "Rule", "owner_fr": "FR-010", "title": "Admin edits logged with admin identity and a reason", "attrs": {"statement": "All edits by admin are logged in the audit trail with timestamp and admin identity; admin MUST provide a reason for each edit (stored alongside before/after values).", "rationale": "Archived FR-010 PRD baseline, lines 510."}}
  - {"op": "add_node", "id": "REQ-010-089", "type": "Rule", "owner_fr": "FR-010", "title": "Admin can trigger End Treatment on behalf of the provider", "attrs": {"statement": "Admin can trigger End Treatment on behalf of a provider; the End of Treatment modal collects the same required fields as Screen 6.", "rationale": "Archived FR-010 PRD baseline, lines 513."}}
  - {"op": "add_node", "id": "REQ-010-090", "type": "Rule", "owner_fr": "FR-010", "title": "Admin may correct provider clinical notes for legal or compliance reasons, always logged", "attrs": {"statement": "Editing provider clinical notes by admin is permitted for legal or compliance corrections and is always logged.", "rationale": "Archived FR-010 PRD baseline, lines 515."}}
  - {"op": "add_node", "id": "REQ-010-091", "type": "Rule", "owner_fr": "FR-010", "title": "Admin remove means archive or soft-delete only, restorable", "attrs": {"statement": "Admin “remove” actions are archive/soft-delete only (no hard delete) for treatment documentation or media assets; archived items remain retained per policy and are restorable.", "rationale": "Overlaps the hard-delete ban in the Audit Rule; possible duplicate within this FR. Archived FR-010 PRD baseline, lines 516."}}
  - {"op": "add_node", "id": "REQ-010-092", "type": "Rule", "owner_fr": "FR-010", "title": "No automatic financial resolution on case cancellation", "attrs": {"statement": "Case cancellation is performed by an admin through the FR-006 Cancel Booking action; financial reconciliation follows the FR-006 payment placeholder and the platform does not perform automatic financial resolution.", "rationale": "Archived FR-010 PRD baseline, lines 514."}}
  - {"op": "add_node", "id": "REQ-010-093", "type": "Rule", "owner_fr": "FR-010", "title": "Auto-saved state restored when the provider reopens the record", "attrs": {"statement": "Auto-save mechanism persists all field changes every 2 minutes to server; when provider re-opens treatment record, last auto-saved state restored; provider can continue from where they left off.", "rationale": "Archived FR-010 PRD baseline, lines 913."}}
  - {"op": "add_node", "id": "REQ-010-094", "type": "Rule", "owner_fr": "FR-010", "title": "Optimistic locking: second saver is warned before overwriting", "attrs": {"statement": "System implements optimistic locking: first provider to save changes succeeds; second provider receives warning \"Another user has modified this treatment record. Reload to see latest version?\" with option to review changes before overwriting.", "rationale": "Archived FR-010 PRD baseline, lines 915."}}
  - {"op": "add_node", "id": "REQ-010-095", "type": "Rule", "owner_fr": "FR-010", "title": "Reminders at 12 and 24 hours; admin dashboard flags Overdue Documentation", "attrs": {"statement": "System sends reminder notification to provider 12 hours after Check In if treatment still \"In Progress\"; second reminder at 24 hours; admin dashboard flags treatments \"In Progress\" > 24 hours as \"Overdue Documentation\" for manual follow-up.", "rationale": "Overlaps REQ-010-010; the fixed 12 and 24 hour values sit beside a configurable deadline (product owner question). Archived FR-010 PRD baseline, lines 919."}}
  - {"op": "add_node", "id": "REQ-010-096", "type": "Rule", "owner_fr": "FR-010", "title": "If real-time sync fails, viewers see the last known status with a last-updated indicator", "attrs": {"statement": "If real-time sync fails, queue update for retry; patient/admin see last known day status with \"last updated [time] ago\" indicator", "rationale": "Archived FR-010 PRD baseline, lines 752."}}
  - {"op": "add_node", "id": "REQ-010-097", "type": "Rule", "owner_fr": "FR-010", "title": "Notification failure does not block the treatment workflow", "attrs": {"statement": "If notification fails, queue for retry; notifications are informational, not critical to treatment workflow", "rationale": "Archived FR-010 PRD baseline, lines 762."}}
  - {"op": "add_node", "id": "REQ-010-098", "type": "Rule", "owner_fr": "FR-010", "title": "Patient consent for photo storage and use is obtained during booking", "attrs": {"statement": "Treatment documentation must comply with HIPAA-equivalent standards (access controls, audit trails, encryption); patient consent obtained during booking for photo storage and usage", "rationale": "The whole Compliance line is kept because the consent clause is part of the same sentence as the HIPAA-equivalent requirement. Archived FR-010 PRD baseline, lines 784."}}
  - {"op": "add_node", "id": "REQ-010-099", "type": "Rule", "owner_fr": "FR-010", "title": "Treatment record status lifecycle", "attrs": {"statement": "status (\"Awaiting Check In\", \"In Progress\", \"Completed\", \"Cancelled\"; the record is created with status \"Awaiting Check In\" when the booking becomes `Confirmed`, seeded from the accepted snapshot, so treatment-detail changes before Check In have a record to change; Check In sets \"In Progress\"; saving End Treatment sets \"Completed\"; \"Cancelled\" is set when the booking is cancelled through the FR-006 Cancel Booking action, the provider-status cascade (before Check In), or the provider-fault transfer; when an admin moves an In Progress booking to Aftercare after a provider fault (FR-006 Alternative Flow B7), the record keeps what was documented and provider documentation stays blocked; cause and `supportRequired` are held on the booking", "rationale": "From Key Entities, Entity 1. Overlaps Rule 2 on record creation; possible duplicate within this FR. Archived FR-010 PRD baseline, lines 986."}}
  - {"op": "add_node", "id": "REQ-010-100", "type": "Rule", "owner_fr": "FR-010", "title": "Progress summary and current day status calculated from day statuses", "attrs": {"statement": "Overall Progress: Summary of treatment completion (e.g., \"2 of 3 days complete\") (Display only; auto-calculated from day statuses) Days Status Summary: Completion summary e.g., \"2 / 3 days complete\" Current Day Status: Status of the most recent active day", "rationale": "Screens SCR-010-01, SCR-010-03 and SCR-010-07. How the most recent active day is chosen is not stated. Archived FR-010 PRD baseline, lines 275, 330, 331."}}
  - {"op": "add_node", "id": "REQ-010-101", "type": "Rule", "owner_fr": "FR-010", "title": "Plan day position shown as a relative position, never a calendar date", "attrs": {"statement": "Plan Day Position: Relative position of this day in the treatment plan (e.g., \"Day 2 of 4\") (Display only; relative day number only, never converted to or shown as a calendar date)", "rationale": "Archived FR-010 PRD baseline, lines 298."}}
  - {"op": "add_node", "id": "REQ-010-102", "type": "Rule", "owner_fr": "FR-010", "title": "Provider In Progress listing: own clinic only, live search and filters, sorted by procedure date", "attrs": {"statement": "List shows only cases in \"In Progress\" status for the provider's clinic. Search and filters apply in real-time without page reload. Default sort: procedure date ascending.", "rationale": "Screen SCR-010-03. Archived FR-010 PRD baseline, lines 335, 337, 338."}}
  - {"op": "add_node", "id": "REQ-010-103", "type": "Rule", "owner_fr": "FR-010", "title": "Admin In Progress listing: all providers, opens the case in editable mode", "attrs": {"statement": "Admin listing shows all providers' In Progress cases — platform-wide visibility. Clicking a row or the Action button opens Screen 8: In Progress Case Detail in editable mode. Default sort: procedure date ascending.", "rationale": "Screen SCR-010-07. Archived FR-010 PRD baseline, lines 472, 473, 474."}}
  - {"op": "add_node", "id": "REQ-010-104", "type": "Rule", "owner_fr": "FR-010", "title": "End Treatment enabled only when every day record is in a terminal status", "attrs": {"statement": "The \"End Treatment\" button is enabled only when ALL day records are in a terminal status (Finished, Need caution/attention, or Cancelled/Deferred). Days remaining in \"Not started\" or \"In progress\" block the button. This modal is accessible only after all day records are in terminal status.", "rationale": "Screens SCR-010-04 and SCR-010-06. Archived FR-010 PRD baseline, lines 386, 438."}}
  - {"op": "add_node", "id": "REQ-010-105", "type": "Rule", "owner_fr": "FR-010", "title": "Provider may reopen Day Edit at any time while the case is In Progress", "attrs": {"statement": "Provider may return to this modal at any time while the case is In Progress.", "rationale": "Screen SCR-010-05. Archived FR-010 PRD baseline, lines 413."}}
