  - {"op": "add_field", "id": "ENT-treatment-audit-entry.before_values", "entity_id": "ENT-treatment-audit-entry", "name": "before_values", "data_type": "json", "title": "Before values", "required": false, "owner_fr": "FR-010"}
  - {"op": "add_field", "id": "ENT-treatment-audit-entry.after_values", "entity_id": "ENT-treatment-audit-entry", "name": "after_values", "data_type": "json", "title": "After values", "required": false, "owner_fr": "FR-010"}
  - {"op": "add_field", "id": "ENT-treatment-audit-entry.reason", "entity_id": "ENT-treatment-audit-entry", "name": "reason", "data_type": "text", "title": "Reason", "required": false, "owner_fr": "FR-010", "attrs": {"description": "Mandatory for admin edits."}}
  - {"op": "add_field", "id": "ENT-treatment.name", "entity_id": "ENT-treatment", "name": "name", "data_type": "text", "title": "Treatment name", "required": false, "owner_fr": "FR-024", "attrs": {"description": "Treatment name from the admin-curated catalog through the treatmentId in the accepted snapshot (Screens 1, 3, 7). Stub created during FR-010 migration; detail arrives when FR-024 migrates."}}  # stub
  - {"op": "add_node", "id": "SCR-010-01", "type": "Screen", "owner_fr": "FR-010", "title": "In Progress Case View", "attrs": {"platform": "patient", "description": "Show the patient a read-only view of their active treatment case, including the provider's beginning-of-treatment note, day-by-day treatment status, and an estimated graft count reference."}}
  - {"op": "add_node", "id": "SCR-010-02", "type": "Screen", "owner_fr": "FR-010", "title": "Day Details Popup", "attrs": {"platform": "patient", "description": "Show the patient a focused view of a single treatment day's description and current status when they tap a day row in Screen 1."}}
  - {"op": "add_node", "id": "SCR-010-03", "type": "Screen", "owner_fr": "FR-010", "title": "In Progress Listing", "attrs": {"platform": "provider", "description": "Display all cases currently in the \"In Progress\" stage for the provider's clinic, with search and filter capabilities."}}
  - {"op": "add_node", "id": "SCR-010-04", "type": "Screen", "owner_fr": "FR-010", "title": "In Progress Case Detail", "attrs": {"platform": "provider", "description": "The primary treatment execution workspace, displayed as a tabbed case detail page with tabs: Treatment Plan | Note | Book hotel & Book flight | In Progress (active tab during treatment). The In Progress tab is organised into three stages: Before Procedure, During Procedure, and End of Procedure."}}
  - {"op": "add_node", "id": "SCR-010-05", "type": "Screen", "owner_fr": "FR-010", "title": "Day Edit Modal", "attrs": {"platform": "provider", "description": "Allow the provider to update the status of a specific treatment day and add or edit a clinical note."}}
  - {"op": "add_node", "id": "SCR-010-06", "type": "Screen", "owner_fr": "FR-010", "title": "End of Treatment Modal", "attrs": {"platform": "provider", "description": "Capture final treatment documentation — conclusion, prescription, advice, medications, actual graft count, final head scan photo set *(V1; true 3D scan in V2)*, and treatment photos — and signal treatment completion to FR-011."}}
  - {"op": "add_node", "id": "SCR-010-07", "type": "Screen", "owner_fr": "FR-010", "title": "In Progress Listing (Admin)", "attrs": {"platform": "admin", "description": "Display all active In Progress cases across all providers and clinics platform-wide, with search, filter, and direct access to edit any case."}}
  - {"op": "add_node", "id": "SCR-010-08", "type": "Screen", "owner_fr": "FR-010", "title": "In Progress Case Detail (Admin)", "attrs": {"platform": "admin", "description": "Allow admin to view and edit all aspects of an In Progress case — including treatment day statuses, provider notes, and case actions. The case status is never set by hand. All fields are editable by admin unless system-locked for audit integrity."}}
  - {"op": "add_node", "id": "SCR-010-09", "type": "Screen", "owner_fr": "FR-010", "title": "Change Treatment Details (Admin)", "attrs": {"platform": "admin", "description": "Let an admin change a case's current treatment plan days, assigned clinician set, and estimated graft count at any time from `Confirmed` onward (Alternative Flow A2). The clinic uses the same form from Screen 4, but only from `Confirmed` until Check In."}}
