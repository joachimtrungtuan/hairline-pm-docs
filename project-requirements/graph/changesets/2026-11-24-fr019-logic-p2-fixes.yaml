# FR-019 logic review, second pass: ruled fixes applied to the PRD (Promotions and Discounts). New rules and steps first, then updates, then new edges.
# Cross-FR edges: none of the nodes touched belongs to another FR. New edges end at platform nodes shared by every FR (STG-main-02-quote, STG-main-03-acceptance, STG-admin-02-operations, ACT-platform-admin, ACT-provider, SRC-PRD-019); all other ends are FR-019 nodes.
# Not touched here (owned elsewhere): FR-030 catalogue rows for the terms-changed notice, the Force-Revoked, Paused and Resumed notices to adopting providers and the provider-revoked notice to admins (no event nodes are added here).
# Left alone on purpose: no revive, supersede or refund steps in the flow; the overlap between EVT-promotion-approval-requested and EVT-promotion-discount-approval-requested.
reason: "FR-019 logic review, second pass: a use also returns on a provider-fault transfer; an admin revive returns the Application from Voided to active; the per-patient usage limit gets a counting basis and check points; a fixed amount at or above the row price is not attached; fixed-amount conversion for a patient code; auto-applied eligibility named by Screen 2 fields; Hairline-Funded programs limited to Auto-applied or Code-only; adopting providers notified when Value or Hairline Share % changes; provider and admin notices listed; four stale field and event descriptions corrected; steps added for Force-Revoke, Re-invite, provider revoke, pause and resume, and code revoke."
by: docs-manager
operations:
  - {"op": "add_node", "id": "REQ-019-116", "type": "Rule", "owner_fr": "FR-019", "title": "The per-patient usage limit counts reserved plus consumed uses by the same patient and is checked where the total limit is checked", "attrs": {"statement": "The per-patient usage limit counts the reserved plus consumed uses by the same patient on the same program, the same basis as the total limit, and is checked at the same points: when a promotion is attached at send (for a known patient), when a patient code is validated, and when the patient confirms acceptance. A promotion whose per-patient limit the patient has reached does not attach and fails code validation.", "rationale": "General Module Rules, per-patient usage limit bullet; the Per-User Usage Limit field on Screens 2 and 9."}}
  - {"op": "add_node", "id": "REQ-019-117", "type": "Rule", "owner_fr": "FR-019", "title": "A fixed amount that equals or exceeds the row's offered price is not attached and the code is refused", "attrs": {"statement": "When a fixed-amount discount, after conversion to the quote currency, would be equal to or more than the offered price of the row, System MUST NOT attach the promotion (or MUST refuse the patient's code), MUST show the reason, and MUST leave the price unchanged.", "rationale": "Screen 2 business rules (fixed amount) and the Value validation row."}}
  - {"op": "add_node", "id": "REQ-019-118", "type": "Rule", "owner_fr": "FR-019", "title": "A change to the Value or Hairline Share % of an adopted Both Fees program notifies every adopting provider and applies to later quotes only", "attrs": {"statement": "When an admin changes the Value or the Hairline Share % of a Both Fees program that providers have adopted, System MUST notify every adopting provider with the old and new terms; the change applies only to quotes sent afterwards, each adoption stays Accepted, and the provider may revoke it as before.", "rationale": "Screen 2 business rules and acceptance criterion 7. The notice is a new row in the FR-030 notification catalogue."}}
  - {"op": "add_node", "id": "STP-019-024", "type": "Step", "owner_fr": "FR-019", "title": "Admin force-revokes an adopting provider's Accepted adoption with a reason; the program leaves that provider's selection list and the provider is notified", "attrs": {"prd_ref": "Screen 3 business rules and acceptance criterion 1"}}
  - {"op": "add_node", "id": "STP-019-025", "type": "Step", "owner_fr": "FR-019", "title": "Admin re-invites a provider; the adoption returns to Pending and the approval notification is re-sent", "attrs": {"prd_ref": "Screen 3 business rules"}}
  - {"op": "add_node", "id": "STP-019-026", "type": "Step", "owner_fr": "FR-019", "title": "Provider revokes its own adoption with a reason; the program leaves its selection list, sent quotes keep their promotion and admins are notified", "attrs": {"prd_ref": "Screen 7 business rules and acceptance criterion 2"}}
  - {"op": "add_node", "id": "STP-019-027", "type": "Step", "owner_fr": "FR-019", "title": "Admin pauses or resumes a program; sent rows keep their terms and the adopting providers are notified", "attrs": {"prd_ref": "Screen 1 row actions and acceptance criterion 4"}}
  - {"op": "add_node", "id": "STP-019-028", "type": "Step", "owner_fr": "FR-019", "title": "Admin revokes a code; it stops validating on unaccepted subquotes and a use already reserved stays", "attrs": {"prd_ref": "Screen 5 business rules"}}
  - {"op": "update_node", "id": "REQ-019-014", "attrs": {"statement": "For provider-selected promotions and patient-entered codes, System MUST reserve one promotion use at acceptance, consume it at the first successful payment, release it on `Payment Window Expired` or cancellation, and re-reserve it on an admin revive, rejecting the revive if the usage limit is exhausted; an accepted revive returns the Application from Voided to its Active status and clears `use_returned_at`. On release or void, System MUST drop the code's In-Progress count and return a single-use code to Unused; a refund after the first payment MUST NOT return the use, which returns only on a release before the first payment or when a provider-fault transfer replaces the booking (Superseded)."}}
  - {"op": "update_node", "id": "REQ-019-015", "attrs": {"statement": "For an auto-applied promotion, System MUST reserve one use when a quote carrying it is sent, MUST hold at most one reserved use per sent quote across re-sent versions (keeping the existing reservation, creating one only when a new version newly carries the promotion, and releasing it when a new version no longer carries the promotion), MUST release the reservation when the quote expires, is withdrawn, is archived (`archived`), ends Not Selected, drops the promotion in a re-sent version, or is cancelled before acceptance because the inquiry was cancelled or the provider's status changed, or when a subquote of that quote is accepted that does not carry the promotion (`not_applied`), and MUST consume it when the accepted subquote carries the promotion. If the booking reaches `Payment Window Expired` or is cancelled before the first payment, System MUST return the consumed use to the limit; on an admin revive, System MUST take the use again if the limit has room and otherwise MUST reject the revive, so the accepted price never changes; an accepted revive returns the Application from Voided to its Active status and clears `use_returned_at`. Restoring an archived quote MUST re-check the promotion and take a new reservation, and the restore MUST be refused when the limit is used up or the promotion has ended (FR-004 REQ-004-105). Usage limits MUST count active reservations plus consumed uses so that a limit can never be exceeded."}}
  - {"op": "update_node", "id": "REQ-019-018", "attrs": {"statement": "System MUST convert a fixed-amount discount into the quote currency at the FR-029 conversion rate in effect at send (for a patient-entered code, in effect when the code is validated) and keep the converted amount in the terms fixed at send."}}
  - {"op": "update_node", "id": "REQ-019-035", "attrs": {"statement": "Trigger: When a quote is sent, more than one automatic promotion is eligible for the quote, or an automatic promotion is eligible for an option/date-price row that already carries another discount. Steps: A quote carries at most one automatic promotion. System silently resolves the conflict using the priority order: patient-entered code > provider discount (provider-selected or provider auto-applied) > Hairline-funded discount > affiliate discount. The usage limit is checked before ranking: an automatic program whose limit is fully reserved or consumed, or whose per-patient limit is reached for a known patient, is skipped, and the next-ranked qualifying program may attach. When several automatic programs qualify, only the highest-ranked remaining one attaches, to every row it is eligible for; the others attach to no row of that quote and reserve no use. On a row that already carries a higher-ranked discount, the automatic promotion is not applied to that row; a provider-selected promotion wins over a provider auto-applied one on the same row. No user prompt is shown. Example: A Hairline-funded automatic program and a provider's automatic program are both eligible when a quote is sent. The provider's program ranks higher, so it attaches to every row it is eligible for and one use is reserved for it; the Hairline-funded program attaches to no row of that quote and no use is reserved for it."}}
  - {"op": "update_node", "id": "REQ-019-038", "attrs": {"statement": "Trigger: A provider sends a quote while an auto-applied program is active and eligible for one or more of its option/date-price rows. Steps: A quote carries at most one automatic promotion; when several qualify, Alternative Flow B3 picks one. System attaches that program to every eligible option/date-price row of the sent quote and copies its terms into the sent quote version. The provider's entered price on each row stays unchanged, and the discount is shown as a separate line next to it. Rows that are not eligible receive no automatic promotion. Conflicts with another discount on the same row are resolved by Alternative Flow B3. Sending a quote carrying the automatic promotion reserves one use against the program's usage limits. A sent quote holds at most one reserved use: re-sending a new version keeps the existing reservation, creates one only if the new version newly carries the promotion, and releases it if the new version no longer carries the promotion. An admin edit that creates a new version of a sent quote (FR-004) counts as a re-send for these rules. If the limit is already fully reserved or consumed, or the per-patient limit is reached for a known patient, that program is skipped and Alternative Flow B3 picks the next-ranked qualifying program, if any; a promotion never attaches past a full limit."}}
  - {"op": "update_node", "id": "REQ-019-039", "attrs": {"statement": "Trigger: While reviewing one named subquote and before confirming acceptance, the patient enters a code (FR-005 Alternative Flow A8). Steps: System validates the code for that subquote only (active window, eligibility, total and per-patient usage limits, recipient binding, and, for a fixed amount, that the converted amount stays below the row's offered price). If valid, the discounted price is shown next to the provider's offered price; if invalid, the reason is shown and the price stays what the row carried at send, including its attached promotion. The code is held with the open subquote view and stored only on the AcceptanceEvent at acceptance; it is never written to the provider's promotion or quote records. Opening another subquote does not carry the code over. Outcome: On acceptance, the discounted price and the applied promotion are frozen into the AcceptanceEvent snapshot."}}
  - {"op": "update_node", "id": "REQ-019-040", "attrs": {"statement": "Trigger: The patient accepts a subquote that carries a promotion attached at send or a valid patient-entered code. Steps: In the same atomic step as the acceptance, the system creates one Application linked to the AcceptanceEvent, the parent quote and version, and the accepted option/date-price row, and reserves one use against the program's usage limits. For an automatic promotion attached at send, the use already reserved at send is consumed instead. If the accepted subquote does not carry the automatic promotion that reserved a use for its parent quote, that reservation is released with reason `not_applied` and the use returns to the limit. Sibling subquotes marked Not Selected and competing quotes never create an Application; any use reserved for them at send is released. A patient code replaces the promotion the row carried: when the replaced promotion is the automatic one, its reservation is released with reason `not_applied` and the code's use is reserved instead. If the total or per-patient usage limit of a provider-selected promotion is used up when the patient confirms, it is handled like an invalid code (FR-005 REQ-005-026): the acceptance does not happen, the reason is shown, and the patient returns to the subquote detail, which shows the row without that promotion. Pausing, revoking or ending the program after send does not affect a sent quote (General Module Rules); only the usage limit can refuse it at acceptance. A patient code entered on a subquote that was not accepted is discarded. Outcome: The Application is in state Applied with its use reserved, or consumed for an automatic promotion; the discounted price is read from the acceptance snapshot by every later step."}}
  - {"op": "update_node", "id": "REQ-019-052", "attrs": {"statement": "`Application Mode = Auto-applied` is only allowed for programs with `Funding Model = Hairline Only` or `Provider Only` and only when the program's own fields on this screen define who it applies to: Start / End Date, the usage limits and, for a Hairline Only program, Issuance Channel and Recipient Binding (together the eligibility checked at send and at code validation); it cannot be auto-applied across multiple providers without consent. A Hairline Only program may use only Auto-applied or Code-only: List-selection and Either are not offered for it, because providers never see it in selection UIs. Auto-applied programs attach when a quote is sent (Alternative Flow A3). They never attach to an admin-authored replacement quote, and no use is reserved for one."}}
  - {"op": "update_node", "id": "REQ-019-070", "attrs": {"statement": "Voided is set only by the system, when the booking reaches `Payment Window Expired` or is cancelled, except for a provider-fault transfer, where Superseded takes precedence; the reserved use is then released. For an automatic promotion, the use consumed at acceptance returns to the usage limit when the row is Voided before the first payment. Superseded is set only by the system when a provider-fault transfer replaces the accepted record, and the use it held returns to the usage limit. A Voided Application returns to its Active status only through an admin revive of the booking, which also clears `use_returned_at`. There is no admin Void action."}}
  - {"op": "update_node", "id": "REQ-019-084", "attrs": {"statement": "Validation occurs when the code is entered and again when the patient confirms acceptance. A fixed amount is converted at the rate in effect at each validation, and the amount shown at confirm is the one frozen at acceptance. On acceptance, the discounted price is frozen into the AcceptanceEvent snapshot."}}
  - {"op": "update_node", "id": "REQ-019-086", "attrs": {"statement": "Active dates, eligibility, and usage limits (the total limit and the per-patient limit, REQ-019-116) are checked when a promotion is attached to a row at send (the per-patient limit only for a known patient), when a patient code is validated before acceptance, and, for the usage limits of a provider-selected promotion, when the patient confirms acceptance (Alternative Flow A5). If a promotion the provider selected cannot attach at send (its limit is used up, the program is paused or ended, the provider's adoption is revoked, or its fixed amount equals or exceeds the row's offered price), the provider sees the reason and the quote is sent without that promotion only after the provider confirms; a draft quote that holds a revoked or paused program drops it the same way. An archived quote that is restored re-checks its promotion and takes a new reservation, and the restore is refused when the limit is used up or the promotion has ended (FR-004 REQ-004-105)."}}
  - {"op": "update_node", "id": "REQ-019-114", "attrs": {"statement": "The Value of a promotion program is required. A percentage discount must be from 1 to 100 and not above the configurable maximum discount value, which starts at 50 percent; a fixed-amount discount must be above 0 and has no cap, but it is not applied to a row whose offered price it equals or exceeds (REQ-019-117). The same applies on the admin form and the provider form."}}
  - {"op": "update_node", "id": "REQ-019-056", "title": "Application Mode choices follow the funding model: Hairline Only programs offer only Auto-applied or Code-only", "attrs": {"statement": "Application Mode choices follow the funding model. Both Fees programs offer `List-selection / Code-only / Either` and never `Auto-applied`. Hairline Only programs offer only `Auto-applied / Code-only`, because Hairline-Funded programs do not appear in provider selection UIs and List-selection or Either would never reach a patient. Provider Self-Created programs offer all four choices, with `Auto-applied` limited as stated on Screen 2. A provider selects an admin program on a quote only from the list of programs the provider has adopted through the approval workflow (Screen 7), never before adoption."}}
  - {"op": "update_node", "id": "REQ-019-010", "attrs": {"statement": "System MUST notify targeted providers when a platform discount awaits their approval (on publish and on Re-invite), using the approval-requested event of the FR-030 notification catalogue and the notification service defined in FR-020. System MUST also notify the adopting providers when the terms of an adopted program change and when an admin Force-Revokes, pauses or resumes an adopted program, and MUST notify admins when a provider revokes its own adoption; each notice is its own event in that catalogue."}}
  - {"op": "update_node", "id": "ENT-promotion-application.status", "attrs": {"description": "active, voided, superseded or refunded. Voided and Superseded are set only by the system; a voided Application returns to active only through an admin revive of the booking."}}
  - {"op": "update_node", "id": "ENT-promotion-application.hairline_portion", "attrs": {"description": "Funding split, Hairline part. For every program type it follows the commission effect (commission on the accepted price after the promotion); a Both Fees program adds Hairline's reimbursement of the Hairline share % (REQ-019-110)."}}
  - {"op": "update_node", "id": "ENT-promotion-application.provider_portion", "attrs": {"description": "Funding split, provider part. For every program type it follows the commission effect, so the provider bears most of the discount (REQ-019-110)."}}
  - {"op": "update_node", "id": "ENT-promotion-program.application_mode", "attrs": {"description": "auto, code_only, list_selection or either. Both Fees programs use list_selection, code_only or either (never auto); Hairline Only programs use only auto or code_only (never list_selection or either); Provider Self-Created programs use any of the four."}}
  - {"op": "update_node", "id": "EVT-promotion-reconciliation-requested", "attrs": {"description": "FR-017 receives a reconciliation event when an admin records a Refund on a Completed redemption (Screen 6, Refund action)."}}
  - {"op": "update_node", "id": "ENT-promotion-application.use_returned_at", "attrs": {"description": "Set when a consumed use returns to the limit on Payment Window Expired or cancellation; cleared when an admin revive takes the use again, which also returns the Application from voided to active."}}
  - {"op": "update_node", "id": "ENT-promotion-program.per_user_usage_limit", "attrs": {"description": "Per-patient cap on the reserved plus consumed uses by the same patient on the program; blank means unlimited (REQ-019-116)."}}
  - {"op": "update_node", "id": "ENT-promotion-program.value", "attrs": {"description": "Discount value; range per type, maximum configurable. A fixed amount is not applied to a row whose offered price it equals or exceeds (REQ-019-117)."}}
