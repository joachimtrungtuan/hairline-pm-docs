  - {"op": "add_node", "id": "REQ-019-009", "type": "Rule", "owner_fr": "FR-019", "title": "Encrypt sensitive data; tamper-evident audit logs", "attrs": {"statement": "System MUST encrypt sensitive data and preserve tamper‑evident audit logs.", "rationale": "Restated by Security Considerations. PRD line 833."}}
  - {"op": "add_node", "id": "REQ-019-010", "type": "Rule", "owner_fr": "FR-019", "title": "Provider approval notifications through the Notification Service", "attrs": {"statement": "System MUST send provider approval notifications via Notification Service.", "rationale": "Restated by the Shared Services scope and Screen 2 business rules. PRD lines 25, 49, 303."}}
  - {"op": "add_node", "id": "REQ-019-011", "type": "Rule", "owner_fr": "FR-019", "title": "Integrate with calculation and settlement services for consistent totals", "attrs": {"statement": "System MUST integrate with calculation/settlement services for consistent totals.", "rationale": "Restated by Shared Services S-02 and Internal Dependencies. PRD lines 50, 766-770."}}
  - {"op": "add_node", "id": "REQ-019-012", "type": "Rule", "owner_fr": "FR-019", "title": "Copy promotion terms into the sent quote version; later program changes never change a sent row", "attrs": {"statement": "System MUST copy each row's promotion terms into the sent quote version at send; later program changes MUST NOT change a sent row.", "rationale": "Restated by Scope Boundaries, Entry Points, Alternative Flow A3 outcome, Screen 2 acceptance criterion 3 and General Module Rules. PRD lines 57, 76, 145, 314, 722, 900."}}
  - {"op": "add_node", "id": "REQ-019-013", "type": "Rule", "owner_fr": "FR-019", "title": "Freeze promotion and discounted price at acceptance; reject later change", "attrs": {"statement": "System MUST freeze the promotion and discounted price of an accepted subquote in the AcceptanceEvent snapshot and MUST reject any later removal, replacement, code entry, price-changing revalidation, or admin void, except through the FR-006 provider-fault transfer, which creates a new linked record.", "rationale": "Restated by Scope Boundaries (out of scope), Alternative Flow B4, Screens 6, 10 and 11 and General Module Rules. PRD lines 65, 162-164, 502, 652, 680, 730."}}
  - {"op": "add_node", "id": "REQ-019-014", "type": "Rule", "owner_fr": "FR-019", "title": "Provider-selected and patient-code use: reserve at acceptance, consume at first payment, release on expiry or cancellation", "attrs": {"statement": "For provider-selected promotions and patient-entered codes, System MUST reserve one promotion use at acceptance, consume it at the first successful payment, release it on `Payment Window Expired` or cancellation, and re-reserve it on an admin revive, rejecting the revive if the usage limit is exhausted.", "rationale": "Restated by Scope Boundaries and General Module Rules. PRD lines 58, 726."}}
  - {"op": "add_node", "id": "REQ-019-015", "type": "Rule", "owner_fr": "FR-019", "title": "Auto-applied use: reserve at send, one per sent quote, release or consume by outcome", "attrs": {"statement": "For an auto-applied promotion, System MUST reserve one use when a quote carrying it is sent, MUST hold at most one reserved use per sent quote across re-sent versions (keeping the existing reservation, creating one only when a new version newly carries the promotion, and releasing it when a new version no longer carries the promotion), MUST release the reservation when the quote expires, is withdrawn, ends Not Selected, drops the promotion in a re-sent version, or is cancelled before acceptance because the inquiry was cancelled or the provider's status changed, or when a subquote of that quote is accepted that does not carry the promotion (`not_applied`), and MUST consume it when the accepted subquote carries the promotion. If the booking reaches `Payment Window Expired` or is cancelled before the first payment, System MUST return the consumed use to the limit; on an admin revive, System MUST take the use again if the limit has room and otherwise MUST reject the revive, so the accepted price never changes. Usage limits MUST count active reservations plus consumed uses so that a limit can never be exceeded.", "rationale": "Restated by Scope Boundaries, Alternative Flows A3 and A5, Screen 6 rules and General Module Rules. PRD lines 58, 144-145, 157, 727, 729."}}
  - {"op": "add_node", "id": "REQ-019-016", "type": "Rule", "owner_fr": "FR-019", "title": "Commission on the accepted price after the promotion for every discount type", "attrs": {"statement": "System MUST calculate commission on the accepted price after the promotion for every discount type, including Hairline-funded programs.", "rationale": "Restated by Alternative Flows A2 and C1, the Screen Specifications overview and General Module Rules. PRD lines 113-114, 139, 176, 731."}}
  - {"op": "add_node", "id": "REQ-019-017", "type": "Rule", "owner_fr": "FR-019", "title": "Hairline share percent on Both Fees programs, fixed at send, given to FR-017", "attrs": {"statement": "System MUST record a Hairline share % from 0 to 100 on every Both Fees program, copy it into the terms fixed at send, and provide it to FR-017, which reimburses that share of the discount to the provider at payout on top of the commission effect.", "rationale": "Restated by the Screen Specifications overview, Screen 2 and General Module Rules. PRD lines 176, 288, 306, 732."}}
  - {"op": "add_node", "id": "REQ-019-018", "type": "Rule", "owner_fr": "FR-019", "title": "Fixed-amount discount converted to the quote currency at the send-time FR-029 rate", "attrs": {"statement": "System MUST convert a fixed-amount discount into the quote currency at the FR-029 conversion rate in effect at send and keep the converted amount in the terms fixed at send.", "rationale": "Restated by Screen 2 business rules. PRD line 307."}}
  - {"op": "add_node", "id": "REQ-019-019", "type": "Rule", "owner_fr": "FR-019", "title": "No automatic promotion on an admin-authored replacement quote", "attrs": {"statement": "System MUST NOT attach an automatic promotion to an admin-authored replacement quote (FR-004 Workflow 7) or reserve a use for it; the admin sets the replacement price directly, and the promotion use held by the closed acceptance MUST be returned or kept under the normal rules.", "rationale": "Restated by Alternative Flow A3 exception and Screen 2 business rules. PRD lines 146, 305."}}
