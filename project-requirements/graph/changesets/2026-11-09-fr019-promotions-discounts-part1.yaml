  - {"op": "add_node", "id": "REQ-019-003", "type": "Rule", "owner_fr": "FR-019", "title": "Attach promotions at send; validate patient code on one named subquote; one discount per subquote", "attrs": {"statement": "System MUST attach provider-selected and eligible automatic promotions to option/date-price rows when a quote is sent, validate patient codes on one named subquote before acceptance, and apply at most one discount per subquote.", "rationale": "Restated by the Provider and Patient scope lines, Scope Boundaries, Entry Points, Alternative Flows A3 and A4 and General Module Rules. PRD lines 38, 57, 75-76, 143-152, 721."}}
