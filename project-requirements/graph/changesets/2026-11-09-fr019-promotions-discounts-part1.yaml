  - {"op": "add_node", "id": "REQ-019-020", "type": "Rule", "owner_fr": "FR-019", "title": "Patient sees the discount on each subquote and may enter a code before acceptance", "attrs": {"statement": "Patient Platform (P-03 overlay): See the discount on each offered subquote; enter a discount code on one named subquote before acceptance when enabled; view the final price breakdown, which is read-only after acceptance.", "rationale": "Patient Platform scope. PRD lines 22, 31-32. Screen 11 carries the code entry."}}
  - {"op": "add_node", "id": "REQ-019-021", "type": "Rule", "owner_fr": "FR-019", "title": "Providers accept or decline both-fees programs; provider-only discounts become active automatically", "attrs": {"statement": "Accept/decline platform both‑fees discounts per program; auto‑active provider‑only discounts.", "rationale": "Provider Platform scope. PRD line 37."}}
  - {"op": "add_node", "id": "REQ-019-022", "type": "Rule", "owner_fr": "FR-019", "title": "Admin manages the both-fees approval workflow and monitors provider responses", "attrs": {"statement": "Manage approval workflow for both‑fees discounts; monitor provider responses.", "rationale": "Admin Platform scope. PRD line 44. Screen 3 (Provider Adoption Manager) is where responses are monitored."}}
  - {"op": "add_node", "id": "REQ-019-023", "type": "Rule", "owner_fr": "FR-019", "title": "Program lifecycle in scope: draft to active to expired, with usage limits and date windows", "attrs": {"statement": "Discount code definition and lifecycle (draft → active → expired), with usage limits and date windows.", "rationale": "Scope Boundaries. PRD line 56. Screen 2 lists a longer lifecycle (Draft, Active, Paused, Expired, Archived) and the Screen 1 filter adds Pending Approval; the two are not reconciled in the PRD (open item)."}}
  - {"op": "add_node", "id": "REQ-019-024", "type": "Rule", "owner_fr": "FR-019", "title": "Payment and refund mechanics, loyalty and referral rewards, and tax changes are out of scope", "attrs": {"statement": "Payment, refund, and fund-release mechanics (FR-007, FR-007b, FR-017). Loyalty points and referral rewards (covered elsewhere). Tax/VAT calculation changes (handled by billing/finance rules).", "rationale": "Scope Boundaries, out of scope. PRD lines 66-68. Owned by FR-007, FR-007b, FR-017 and billing rules."}}
  - {"op": "add_node", "id": "REQ-019-025", "type": "Rule", "owner_fr": "FR-019", "title": "Affiliate code generation, assignment, dashboard and payout attribution belong to FR-018; FR-019 owns the shared engine", "attrs": {"statement": "Affiliate-specific promo code generation, bulk assignment to affiliates, affiliate dashboard display, and affiliate payout attribution are owned by FR-018 / A-07. FR-019 owns the shared promotion engine: validation, active windows, usage limits, single-discount conflict behavior, applied/completed redemption state, and financial-impact logging.", "rationale": "Scope Boundaries, out of scope. PRD line 69, Screen 5 business rules (line 437) and Alternative Flow C1 (line 138) repeat the boundary. Screen 5 acceptance criterion 1 conflicts with it (open item)."}}
  - {"op": "add_node", "id": "REQ-019-026", "type": "Rule", "owner_fr": "FR-019", "title": "Entry points: admin creates a platform discount, provider creates a discount, patient enters a code, provider sends a quote", "attrs": {"statement": "Admin creates a platform discount in A-06; if both‑fees, providers receive approval requests. Provider creates a provider discount in PR-02/PR-05; becomes active per dates/limits. Patient enters a code (if enabled) on one named subquote before acceptance (FR-005 Alternative Flow A8); system validates it for that subquote and shows the discounted price if eligible. Provider sends a quote; system attaches the selected promotion and any eligible automatic promotion to each option/date-price row and copies the promotion terms into the sent quote version.", "rationale": "Entry Points. PRD lines 73-76."}}
  - {"op": "add_node", "id": "REQ-019-027", "type": "Rule", "owner_fr": "FR-019", "title": "Admin defines a both-fees discount; it is saved as Pending Approval and targeted providers are notified", "attrs": {"statement": "Admin defines discount (type, value, Hairline share %, dates, usage limit, targeted providers). System saves discount as Pending Approval and notifies targeted providers.", "rationale": "Main Flow steps 1-2. PRD lines 90-91, Screen 2 business rules (line 303) and acceptance criterion 1 (line 312) repeat the Pending Approval and notification outcome."}}
  - {"op": "add_node", "id": "REQ-019-028", "type": "Rule", "owner_fr": "FR-019", "title": "Providers accept or decline a both-fees discount and the system logs the response", "attrs": {"statement": "Providers accept or decline; system logs responses.", "rationale": "Main Flow step 3. PRD line 92, Screen 7 business rules (line 533: all decisions logged with timestamp and user) repeat it."}}
  - {"op": "add_node", "id": "REQ-019-029", "type": "Rule", "owner_fr": "FR-019", "title": "An accepting provider makes the discount eligible for its option/date-price rows during the active window", "attrs": {"statement": "When provider accepts, discount becomes eligible for that provider’s option/date-price rows during the active window.", "rationale": "Main Flow step 4. PRD line 93, Screen 7 acceptance criterion 1 (line 539: selectable in quote creation within 5 seconds)."}}
  - {"op": "add_node", "id": "REQ-019-030", "type": "Rule", "owner_fr": "FR-019", "title": "Provider-only reusable discount activates per dates and limits with no approval", "attrs": {"statement": "Trigger: Provider creates their own discount from the standalone Promotion Detail screen (Screen 9). Steps: System validates inputs, persists the program with `scope = REUSABLE`, and activates per dates/limits; no approval needed. Outcome: Discount immediately eligible for **list-selection** during the provider's quote creation flow (FR-004 Screen 1).", "rationale": "Alternative Flow A1a. PRD lines 100-102. Screen 9 business rule (line 602) repeats that no admin approval is needed in either mode; acceptance criterion 1 (line 607) repeats list selection within the active window."}}
  - {"op": "add_node", "id": "REQ-019-031", "type": "Rule", "owner_fr": "FR-019", "title": "Inline provider discount is bound to one quote and one option/date-price row", "attrs": {"statement": "Trigger: Provider opens the inline promotion creator from within FR-004 Screen 1 during quote drafting. Steps: Provider enters name, type, value, applies-to, and optional code in a mini-form for one FR-004 option/date-price row; system creates a new `PromotionProgram` with `scope = AD_HOC_QUOTE_BOUND`, `bound_quote_id` set to the parent quote, and `bound_quote_option_date_price_id` set to that row. Provider may toggle \"Save as reusable program for future quotes\" to promote the record to `scope = REUSABLE`. Outcome: Discount is attached through `QuoteOptionDatePrice.promotionId` and is governed by the same caps, validation, and admin-override rules as A1a. Ad-hoc records appear in FR-019 Screen 1 Hub (filterable by `scope`) and Screen 4 Portfolio.", "rationale": "Alternative Flow A1b. PRD lines 106-108. Screen 9 acceptance criteria 3 and 5 (lines 609, 611) repeat the binding and the rejection of use on another row or quote."}}
  - {"op": "add_node", "id": "REQ-019-032", "type": "Rule", "owner_fr": "FR-019", "title": "Hairline-only discount is hidden from providers; commission is on the price after the promotion", "attrs": {"statement": "Trigger: Admin creates a Hairline‑funded discount. Steps: System applies the discount to the patient's price; the program is not visible to providers in selection UIs. Commission is calculated on the accepted price after the promotion, as for every discount type. Outcome: Both the platform commission and the provider's payout are reduced; the provider bears most of the discount. The funding of each program is defined in General Module Rules; FR-017 applies it in payout settlement.", "rationale": "Alternative Flow A2. PRD lines 112-114. Screen 2 business rules (line 304) and acceptance criterion 2 (line 313) repeat that Hairline-funded programs do not appear in provider selection UIs or adoption inboxes."}}
  - {"op": "add_node", "id": "REQ-019-033", "type": "Rule", "owner_fr": "FR-019", "title": "Invalid, expired or limit-reached code returns a reason and no discount is applied", "attrs": {"statement": "Trigger: Patient/provider enters invalid/expired/reached‑limit code. Steps: System returns reason; prevents application. Outcome: No discount applied; user can retry.", "rationale": "Alternative Flow B1. PRD lines 118-120. Screen 11 business rules (line 681) add segment-mismatched codes to the list of reasons shown."}}
  - {"op": "add_node", "id": "REQ-019-034", "type": "Rule", "owner_fr": "FR-019", "title": "A second discount entered by the user prompts a replace-or-keep choice", "attrs": {"statement": "Trigger: Before the quote is sent (provider) or before the subquote is accepted (patient), the user manually enters or selects a second discount for an option/date-price row (subquote) that already has one. Steps: System blocks the new entry; prompts the user to confirm replacement or keep the existing discount. A patient's replacement applies only to the patient's selection on that subquote and never changes the provider's promotion. Outcome: Exactly one discount per subquote; the user's confirmed choice is applied. After acceptance no entry, selection, or replacement is accepted (Alternative Flow B4).", "rationale": "Alternative Flow B2. PRD lines 124-126. Screen 11 business rule (line 677) and acceptance criterion 2 (line 688: audit records both events) repeat it for the patient."}}
  - {"op": "add_node", "id": "REQ-019-035", "type": "Rule", "owner_fr": "FR-019", "title": "Auto-applied conflicts resolve silently by priority, with no user prompt", "attrs": {"statement": "Trigger: When a quote is sent, more than one automatic promotion is eligible for the quote, or an automatic promotion is eligible for an option/date-price row that already carries another discount. Steps: A quote carries at most one automatic promotion. System silently resolves the conflict using the priority order: patient-entered code > provider discount (provider-selected or provider auto-applied) > Hairline-funded discount > affiliate discount. When several automatic programs qualify, only the highest-ranked one attaches, to every row it is eligible for; the others attach to no row of that quote and reserve no use. On a row that already carries a higher-ranked discount, the automatic promotion is not applied to that row. No user prompt is shown. Example: A Hairline-funded automatic program and a provider's automatic program are both eligible when a quote is sent. The provider's program ranks higher, so it attaches to every row it is eligible for and one use is reserved for it; the Hairline-funded program attaches to no row of that quote and no use is reserved for it.", "rationale": "Alternative Flow B3. PRD lines 130-132. General Module Rules (line 721) repeat the priority order."}}
  - {"op": "add_node", "id": "REQ-019-036", "type": "Rule", "owner_fr": "FR-019", "title": "Exactly one discount affects the price; audit records applied and superseded programs; affiliate attribution is preserved", "attrs": {"statement": "Outcome: Exactly one discount affects the patient's final price; audit records which program was applied and which was superseded. If a valid affiliate-bound code/link was already captured as the patient acquisition source, FR-019 preserves that affiliate attribution metadata for FR-018 even when a provider-side promotion wins the price-discount priority.", "rationale": "Alternative Flow B3 outcome. PRD line 133."}}
  - {"op": "add_node", "id": "REQ-019-037", "type": "Rule", "owner_fr": "FR-019", "title": "Direct-issued code is validated against its binding and redemption is recorded against the issuing channel", "attrs": {"statement": "Trigger: Admin issues a Hairline-funded code (open code, segment-bound, or affiliate-distributed) and the patient enters it on one named subquote before acceptance. Steps: System validates the code against issuance binding (open vs recipient-bound), records the redemption against the issuing channel (e.g., affiliate id), and calculates commission on the accepted price after the promotion, as for every discount type. For affiliate-bound codes, code generation and affiliate assignment are initiated from FR-018; FR-019 receives the registered code and manages redemption lifecycle. Outcome: Patient receives discount; the platform commission and the provider's payout are both reduced, with the provider bearing most of the discount; affiliate (if applicable) accrues the configured incentive (see FR-018).", "rationale": "Alternative Flow C1. PRD lines 137-139."}}
  - {"op": "add_node", "id": "REQ-019-038", "type": "Rule", "owner_fr": "FR-019", "title": "Automatic promotion attaches at send to every eligible row; the provider price stays and the discount shows as a separate line", "attrs": {"statement": "Trigger: A provider sends a quote while an auto-applied program is active and eligible for one or more of its option/date-price rows. Steps: A quote carries at most one automatic promotion; when several qualify, Alternative Flow B3 picks one. System attaches that program to every eligible option/date-price row of the sent quote and copies its terms into the sent quote version. The provider's entered price on each row stays unchanged, and the discount is shown as a separate line next to it. Rows that are not eligible receive no automatic promotion. Conflicts with another discount on the same row are resolved by Alternative Flow B3. Sending a quote carrying the automatic promotion reserves one use against the program's usage limits. A sent quote holds at most one reserved use: re-sending a new version keeps the existing reservation, creates one only if the new version newly carries the promotion, and releases it if the new version no longer carries the promotion. If the limit is already fully reserved or consumed, the promotion does not attach.", "rationale": "Alternative Flow A3. PRD lines 143-146, General Module Rules (line 724). Outcome and exception lines are carried by REQ-019-012, REQ-019-015 and REQ-019-019."}}
  - {"op": "add_node", "id": "REQ-019-039", "type": "Rule", "owner_fr": "FR-019", "title": "Patient code is validated for the named subquote only and never written to the provider promotion", "attrs": {"statement": "Trigger: While reviewing one named subquote and before confirming acceptance, the patient enters a code (FR-005 Alternative Flow A8). Steps: System validates the code for that subquote only (active window, eligibility, usage limits, recipient binding). If valid, the discounted price is shown next to the provider's offered price; if invalid, the reason is shown and the offered price is unchanged. The code is recorded against the patient's selection on that subquote and is never written to the provider's promotion or quote records. Opening another subquote does not carry the code over. Outcome: On acceptance, the discounted price and the applied promotion are frozen into the AcceptanceEvent snapshot.", "rationale": "Alternative Flow A4. PRD lines 150-152. Screen 11 business rule (line 678) and acceptance criterion 3 (line 688) repeat that the code is not carried to another subquote."}}
  - {"op": "add_node", "id": "REQ-019-040", "type": "Rule", "owner_fr": "FR-019", "title": "Accepting a subquote with a promotion creates one Application atomically and reserves or consumes a use", "attrs": {"statement": "Trigger: The patient accepts a subquote that carries a promotion attached at send or a valid patient-entered code. Steps: In the same atomic step as the acceptance, the system creates one Application linked to the AcceptanceEvent, the parent quote and version, and the accepted option/date-price row, and reserves one use against the program's usage limits. For an automatic promotion attached at send, the use already reserved at send is consumed instead. If the accepted subquote does not carry the automatic promotion that reserved a use for its parent quote, that reservation is released with reason `not_applied` and the use returns to the limit. Sibling subquotes marked Not Selected and competing quotes never create an Application; any use reserved for them at send is released. A patient code entered on a subquote that was not accepted is discarded. Outcome: The Application is in state Applied with its use reserved, or consumed for an automatic promotion; the discounted price is read from the acceptance snapshot by every later step.", "rationale": "Alternative Flow A5. PRD lines 156-158, Implementation Notes (line 814)."}}
  - {"op": "add_node", "id": "REQ-019-041", "type": "Rule", "owner_fr": "FR-019", "title": "Any promotion change attempted after acceptance is rejected and logged", "attrs": {"statement": "Trigger: Any actor (patient, provider, or admin) tries to remove, replace, enter, or revalidate a promotion on an accepted subquote, including at checkout or booking. Steps: System rejects the action, leaves the Application and the AcceptanceEvent snapshot unchanged, and logs the attempt. Outcome: The accepted price stands. The only exception is the provider-fault transfer in FR-006 (Alternative Flow B5), which creates a new linked acceptance record; promotion handling for that case follows the post-acceptance freeze rule in General Module Rules.", "rationale": "Alternative Flow B4. PRD lines 162-164. Screen 11 business rule (line 680) and Screen 11 acceptance criterion 4 (line 689) repeat the rejection at checkout and payment."}}
  - {"op": "add_node", "id": "REQ-019-042", "type": "Rule", "owner_fr": "FR-019", "title": "Three program types share one governance model", "attrs": {"statement": "This module exposes **three promotion programs** under one unified governance model: **Admin-via-Provider** — Admin defines a campaign that affects both Hairline and provider fees; targeted providers must opt-in before the code becomes selectable on their quotes. **Provider Self-Created** — Provider defines a discount on their own quotes; no admin approval required. **Hairline-Funded & Direct-Issued** — Admin defines a Hairline-only discount that is issued directly to patients (open-entry code, patient-segment-bound, affiliate-distributed, or individually issued); providers are not involved in approval.", "rationale": "Screen Specifications overview. PRD lines 170-176."}}
  - {"op": "add_node", "id": "REQ-019-043", "type": "Rule", "owner_fr": "FR-019", "title": "Admin may pause or revoke adoption on any program and record a refund; no actor may change the promotion on an accepted subquote", "attrs": {"statement": "All three program types share a single `PromotionProgram` entity (see Key Entities) and are managed through a unified screen system with type-aware filters, forms, and analytics. Admin retains override authority on every program (pause, revoke adoption) and may record a refund through FR-017 regardless of program type. No actor, including admin, may void, remove, or change the promotion on an accepted subquote (Alternative Flow B4).", "rationale": "Screen Specifications overview. PRD line 178."}}
  - {"op": "add_node", "id": "REQ-019-044", "type": "Rule", "owner_fr": "FR-019", "title": "The hub lists every program type in one catalog with a default sort and result count; filters combine as AND", "attrs": {"statement": "All three program types appear in this hub; the Program Type filter narrows the view. Given the admin opens the Hub, when the screen loads, then the system shows all program types in one list with the default descending Last Updated sort and the result count for the default query. Given the admin applies any combination of Program Type, Status, Funding Model, Provider Participation, Date Range, Usage, and ROI filters, then the catalog returns only rows satisfying all active filters and updates the result count. Given the admin selects a row, then the system opens Screen 2 for that program without losing catalog context.", "rationale": "Screen 1 (Promotion Program Hub) business rules and acceptance criteria 1-3. PRD lines 245, 252-254."}}
  - {"op": "add_node", "id": "REQ-019-045", "type": "Rule", "owner_fr": "FR-019", "title": "Admin monitors provider self-created programs and may pause or archive them; editing stays with the provider", "attrs": {"statement": "Provider Self-Created programs appear here so admins can monitor and intervene; admins may pause or archive any program but typically do not edit provider-owned definitions (see Screen 4 Notes). Admin may open Screen 2 in read-only mode for provider self-created programs; editing is reserved for the provider unless an override is needed (governance action, logged in audit). Admin may pause or archive any provider self-created program via row action with mandatory reason text.", "rationale": "Screen 1 business rules and Screen 4 business rules. PRD lines 246, 397-398. Screen 4 notes (lines 400-402) record that this goes beyond the client transcription."}}
  - {"op": "add_node", "id": "REQ-019-046", "type": "Rule", "owner_fr": "FR-019", "title": "Hub search, filter, result count and reset behaviour stay aligned with FR-022", "attrs": {"statement": "Search, filter, result count, and reset behavior must stay aligned with FR-022 control standards. Search and filter field definitions are co-owned with FR-022. Any change must be updated in both FR-019 and FR-022.", "rationale": "Screen 1 business rules and notes. PRD lines 247, 259. FR-022 co-owns the field definitions."}}
  - {"op": "add_node", "id": "REQ-019-047", "type": "Rule", "owner_fr": "FR-019", "title": "Pausing a program keeps redemptions intact and stops new attachment and code validation", "attrs": {"statement": "Given the admin triggers Pause on an Active program row, then the program lifecycle transitions to Paused, all existing redemptions remain intact, the program is not attached to newly sent quotes and does not validate new patient codes, and option/date-price rows already sent keep the terms copied at send.", "rationale": "Screen 1 acceptance criterion 4. PRD line 255. Sent rows keep the terms copied at send (REQ-019-012)."}}
  - {"op": "add_node", "id": "REQ-019-048", "type": "Rule", "owner_fr": "FR-019", "title": "Program form limits: name and description length, end not before start, usage limits non-negative", "attrs": {"statement": "Program Name: 3–120 chars. Description: ≤ 1000 chars. Start / End Date: End ≥ Start. Total Usage Limit: ≥ 0; blank = unlimited. Per-User Usage Limit: ≥ 0; blank = unlimited.", "rationale": "Screen 2 common data fields, validation column, composed from table cells. PRD lines 271-280. Screen 9 rows 585-593 repeat the same limits."}}
  - {"op": "add_node", "id": "REQ-019-049", "type": "Rule", "owner_fr": "FR-019", "title": "Program lifecycle state moves forward only", "attrs": {"statement": "Lifecycle State: Draft → Active → Paused → Expired → Archived; Forward transitions only.", "rationale": "Screen 2 common data fields, composed from the table row. PRD line 281. Row actions Pause and Resume on Screens 1 and 8 and the Pending Approval state on Screen 1 do not fit a forward-only sequence (open item)."}}
  - {"op": "add_node", "id": "REQ-019-050", "type": "Rule", "owner_fr": "FR-019", "title": "Funding model is derived from the program type and cannot be set independently", "attrs": {"statement": "`Funding Model` is derived from `Program Type` and cannot be set independently.", "rationale": "Screen 2 business rules. PRD lines 302, 287, 381, 601 (Provider Only is fixed on the provider form)."}}
  - {"op": "add_node", "id": "REQ-019-051", "type": "Rule", "owner_fr": "FR-019", "title": "Saving an Admin-via-Provider program sets Pending Approval and notifies targeted providers", "attrs": {"statement": "For Admin-via-Provider, saving transitions the program to `Pending Approval` and notifies targeted providers (S-03).", "rationale": "Screen 2 business rules. PRD line 303; same outcome as the Main Flow step 2 rule."}}
  - {"op": "add_node", "id": "REQ-019-052", "type": "Rule", "owner_fr": "FR-019", "title": "Auto-applied mode is allowed only for Hairline Only or Provider Only programs and never on a replacement quote", "attrs": {"statement": "`Application Mode = Auto-applied` is only allowed for programs with `Funding Model = Hairline Only` or `Provider Only` and explicit eligibility rules (cannot be auto-applied across multiple providers without consent). Auto-applied programs attach when a quote is sent (Alternative Flow A3). They never attach to an admin-authored replacement quote, and no use is reserved for one.", "rationale": "Screen 2 business rules. PRD line 305, acceptance criterion 4 (line 315: message \"Auto-applied is not permitted for Both-Fees programs.\")."}}
  - {"op": "add_node", "id": "REQ-019-053", "type": "Rule", "owner_fr": "FR-019", "title": "Hairline share percent is required for Both Fees programs, 0 to 100, audited, and part of the terms fixed at send", "attrs": {"statement": "`Hairline Share %` is required for Both Fees programs and must be a number from 0 to 100; it is hidden for other funding models. It is part of the terms fixed at send and frozen at acceptance, so an edit applies only to quotes sent afterwards. Every change is recorded in the Audit Trail Panel with actor, timestamp, and old and new values.", "rationale": "Screen 2 business rules. PRD line 306, acceptance criterion 5 (line 316)."}}
  - {"op": "add_node", "id": "REQ-019-054", "type": "Rule", "owner_fr": "FR-019", "title": "Bulk upload and bulk edit are available for campaign management", "attrs": {"statement": "Bulk upload / bulk edit available for campaign management.", "rationale": "Screen 2 business rules. PRD line 308."}}
  - {"op": "add_node", "id": "REQ-019-055", "type": "Rule", "owner_fr": "FR-019", "title": "A single open code is redeemable by any patient as soon as the program is published", "attrs": {"statement": "Given the admin creates a Hairline-Funded program with `Issuance Channel = Open code` and a single code, when the program is published, then the code is immediately redeemable by any patient on a named subquote before acceptance and the program does not appear in any provider's adoption inbox.", "rationale": "Screen 2 acceptance criterion 2. PRD line 313."}}
  - {"op": "add_node", "id": "REQ-019-056", "type": "Rule", "owner_fr": "FR-019", "title": "Application mode options differ by program type by design", "attrs": {"statement": "`Application Mode` options differ by Program Type by design: admin programs use `Auto-applied / Code-only` (no list-selection because admin programs are not shown in a provider's quote-creation picker — they are adopted via the approval workflow and then selected from the provider's adopted campaigns list); provider programs use `List-selection / Code-only / Either`.", "rationale": "Screen 2 notes. PRD line 321. Conflicts with Screen 9 and FR-004 on how admin programs reach a quote (open item)."}}
  - {"op": "add_node", "id": "REQ-019-057", "type": "Rule", "owner_fr": "FR-019", "title": "All state changes, edits, approvals and overrides are listed in time order with actor, time and reason", "attrs": {"statement": "All state changes, edits, approvals, and override actions are listed in chronological order with actor, timestamp, and reason.", "rationale": "Screen 2 audit trail panel. PRD line 298."}}
  - {"op": "add_node", "id": "REQ-019-058", "type": "Rule", "owner_fr": "FR-019", "title": "Bulk code generation creates N unique codes, quantity 1 to 10,000", "attrs": {"statement": "Bulk Generate Codes: Generate N unique codes for distribution; quantity 1–10,000", "rationale": "Screen 2 type-specific fields, composed from the table row. PRD line 294."}}
  - {"op": "add_node", "id": "REQ-019-059", "type": "Rule", "owner_fr": "FR-019", "title": "Force-Revoke removes the program from the provider's selection list at once and keeps in-flight quotes", "attrs": {"statement": "Force-Revoke immediately removes the program from the provider's quote-creation selection list; in-flight quotes with the program already applied are preserved.", "rationale": "Screen 3 business rules. PRD line 350, acceptance criterion 1 (line 356: within 5 seconds)."}}
  - {"op": "add_node", "id": "REQ-019-060", "type": "Rule", "owner_fr": "FR-019", "title": "Re-invite resets a declined or auto-declined provider to Pending and re-sends the notification", "attrs": {"statement": "Re-invite resets the provider's status from Declined or Auto-Declined back to Pending and re-sends the S-03 notification.", "rationale": "Screen 3 business rules. PRD line 351."}}
  - {"op": "add_node", "id": "REQ-019-061", "type": "Rule", "owner_fr": "FR-019", "title": "Every admin override requires reason text in the audit trail", "attrs": {"statement": "All admin overrides are logged with mandatory reason text in the audit trail.", "rationale": "Screen 3 business rules. PRD line 352."}}
  - {"op": "add_node", "id": "REQ-019-062", "type": "Rule", "owner_fr": "FR-019", "title": "An approval request with no response auto-declines after the window and is visible in audit", "attrs": {"statement": "Given the program's Auto-Decline Window elapses without a provider decision, then the provider's status updates to Auto-Declined and is visible in this manager. Auto-Decline triggers if the Auto-Decline Window (Screen 2) elapses without a decision.", "rationale": "Screen 3 acceptance criterion 2, Screen 7 business rules and edge cases. PRD lines 357, 535, 902."}}
  - {"op": "add_node", "id": "REQ-019-063", "type": "Rule", "owner_fr": "FR-019", "title": "An open code serves any eligible patient until the total usage limit is reached", "attrs": {"statement": "Open codes have one code that any eligible patient may use until the total usage limit is reached.", "rationale": "Screen 5 business rules. PRD line 436."}}
  - {"op": "add_node", "id": "REQ-019-064", "type": "Rule", "owner_fr": "FR-019", "title": "Segment-bound codes validate the patient against the segment at entry time", "attrs": {"statement": "Segment-bound codes validate the patient against the segment definition at entry time.", "rationale": "Screen 5 business rules. PRD line 438."}}
  - {"op": "add_node", "id": "REQ-019-065", "type": "Rule", "owner_fr": "FR-019", "title": "Individually-issued codes are single-use and bound to one patient", "attrs": {"statement": "Individually-issued codes are single-use and bound to a specific patient identifier.", "rationale": "Screen 5 business rules. PRD line 439."}}
  - {"op": "add_node", "id": "REQ-019-066", "type": "Rule", "owner_fr": "FR-019", "title": "Revoking a code stops validation on unaccepted subquotes but not a reserved use", "attrs": {"statement": "Revoking a code stops it from validating on any subquote not yet accepted. A use already reserved by an accepted subquote (`In-Progress`) stays frozen with the acceptance and is not cancelled by the revoke.", "rationale": "Screen 5 business rules. PRD line 440. Bulk Revoke needs a mandatory reason (line 418)."}}
  - {"op": "add_node", "id": "REQ-019-067", "type": "Rule", "owner_fr": "FR-019", "title": "Bulk Generate for 50 selected affiliates creates 50 unique codes, one per affiliate", "attrs": {"statement": "Given the admin selects a Hairline-Funded program with channel = Affiliate-bound and triggers Bulk Generate for 50 selected affiliates, when generation completes, then 50 unique codes are created, each code is bound to exactly one affiliate, and each appears in the table with status = Unused.", "rationale": "Screen 5 acceptance criterion 1. PRD line 444. Conflicts with the FR-018 generation boundary (open item)."}}
  - {"op": "add_node", "id": "REQ-019-068", "type": "Rule", "owner_fr": "FR-019", "title": "First successful payment on an affiliate-bound code marks it Redeemed and triggers the affiliate incentive event", "attrs": {"statement": "FR-018: Affiliate Management – Affiliate-bound code redemptions accrue incentive to the linked affiliate; FR-019 triggers the incentive event consumed by FR-018. Given a patient enters an Affiliate-bound code on a named subquote and accepts it, when the first payment succeeds, then the corresponding row updates to Redeemed and the affiliate's incentive accrual (per FR-018) is triggered.", "rationale": "Internal Dependencies (FR-018) and Screen 5 acceptance criterion 2. PRD lines 437, 445, 775."}}
  - {"op": "add_node", "id": "REQ-019-069", "type": "Rule", "owner_fr": "FR-019", "title": "Applied and Completed are two distinct redemption states", "attrs": {"statement": "The two-state distinction (Applied vs Completed) is preserved per client request (Admin Part 1 L341–344). Applied = the subquote carrying the promotion has been accepted and, for a provider-selected promotion or patient code, one use is reserved; Completed = the first payment for that booking has succeeded and that reserved use is consumed. For an automatic promotion the use is already consumed at acceptance, so Completed only marks the first payment.", "rationale": "Screen 6 business rules. PRD line 492."}}
  - {"op": "add_node", "id": "REQ-019-070", "type": "Rule", "owner_fr": "FR-019", "title": "Voided and Superseded are set only by the system; there is no admin Void", "attrs": {"statement": "Voided is set only by the system, when the booking reaches `Payment Window Expired` or is cancelled; the reserved use is then released. For an automatic promotion, the use consumed at acceptance returns to the usage limit when the row is Voided before the first payment. Superseded is set only by the system when a provider-fault transfer replaces the accepted record. There is no admin Void action.", "rationale": "Screen 6 business rules. PRD line 493, acceptance criteria 3 and 4 (lines 501-502)."}}
  - {"op": "add_node", "id": "REQ-019-071", "type": "Rule", "owner_fr": "FR-019", "title": "Reverse and Refund are logged with a reason, integrate with FR-017 and never change the accepted price", "attrs": {"statement": "Reverse / Refund actions are logged with mandatory reason and integrate with FR-017 (Billing & Finance) for monetary reconciliation. They never change the accepted price or the AcceptanceEvent snapshot.", "rationale": "Screen 6 business rules. PRD line 494, acceptance criterion 2 (line 500: status Refunded, FR-017 receives a reconciliation event)."}}
  - {"op": "add_node", "id": "REQ-019-072", "type": "Rule", "owner_fr": "FR-019", "title": "The first successful payment moves Applied to Completed and consumes the reserved use", "attrs": {"statement": "Given an accepted subquote with an Applied redemption, when the first payment for the booking succeeds, then the redemption row transitions from State = Applied to State = Completed, the reserved use is consumed (for an automatic promotion the use was already consumed at acceptance and is not counted again), and the change is reflected in Overview KPIs within 5 seconds.", "rationale": "Screen 6 acceptance criterion 1. PRD line 499, Screen 6 rule on automatic promotions (line 492)."}}
  - {"op": "add_node", "id": "REQ-019-073", "type": "Rule", "owner_fr": "FR-019", "title": "Revoking an adoption does not affect quotes that already have the program applied", "attrs": {"statement": "Revoking adoption does not affect quotes that already have the program applied; only new selections are blocked.", "rationale": "Screen 7 business rules. PRD line 534."}}
  - {"op": "add_node", "id": "REQ-019-074", "type": "Rule", "owner_fr": "FR-019", "title": "Revoking an adoption requires a reason and ends in Revoked-by-Provider", "attrs": {"statement": "Given an Active campaign, when the provider clicks Revoke Adoption with reason, then the campaign moves to Past with state = Revoked-by-Provider and is no longer offered in quote creation.", "rationale": "Screen 7 acceptance criterion 2. PRD line 540."}}
  - {"op": "add_node", "id": "REQ-019-075", "type": "Rule", "owner_fr": "FR-019", "title": "A provider may run many self-created promotions at once, subject to one discount per booking", "attrs": {"statement": "Provider may have an arbitrary number of self-created promotions concurrently active, subject to the platform's single-discount-per-booking rule at redemption time.", "rationale": "Screen 8 business rules. PRD line 566."}}
  - {"op": "add_node", "id": "REQ-019-076", "type": "Rule", "owner_fr": "FR-019", "title": "Codes are unique platform-wide", "attrs": {"statement": "Code uniqueness enforced platform-wide (cannot collide with admin codes or other providers' codes).", "rationale": "Screen 8 business rules. PRD line 567, Screen 2 field rows (lines 276, 589). Format policy is admin configurable (PRD line 745)."}}
  - {"op": "add_node", "id": "REQ-019-077", "type": "Rule", "owner_fr": "FR-019", "title": "The code is optional on provider self-created promotions; the default mode is list selection", "attrs": {"statement": "The **Code field is optional** per a deliberate scope decision. The client transcription (Provider Part 2 L27–33) stated codes are not relevant for provider self-created discounts since providers select them from a list during quote creation. This FR retains the field as **optional** so providers may also issue code-based promotions for marketing distribution (e.g., flyer codes, partner promos). Default Application Mode is `List-selection during quote`.", "rationale": "Screen 9 business rules. PRD line 598, scope note (line 615). A scope extension beyond the client transcription (open item)."}}
  - {"op": "add_node", "id": "REQ-019-078", "type": "Rule", "owner_fr": "FR-019", "title": "Ad-hoc records are scoped to one quote and hidden from other quotes' pickers", "attrs": {"statement": "**Mode 2 ad-hoc records** are scoped to a single quote and are not shown in the list-selection picker on other quotes' creation screens. They remain visible to admin in Screen 1 Hub (Scope filter = Ad-Hoc Quote-Bound) and Screen 4 Portfolio.", "rationale": "Screen 9 business rules. PRD line 599."}}
  - {"op": "add_node", "id": "REQ-019-079", "type": "Rule", "owner_fr": "FR-019", "title": "A promotion on a row changes only while the quote is drafted or revised before acceptance", "attrs": {"statement": "A promotion selected on an option/date-price row may be changed only while the quote is drafted or revised in FR-004 before acceptance. Its terms are copied into the sent quote version when the quote is sent, and a promotion can apply only to a row it was attached to at send.", "rationale": "Screen 9 business rules and Screen 10 business rules. PRD lines 603, 652."}}
  - {"op": "add_node", "id": "REQ-019-080", "type": "Rule", "owner_fr": "FR-019", "title": "A code-only promotion is hidden from the quote picker and redeemable by code on a named subquote", "attrs": {"statement": "Given the provider saves a Mode 1 promotion with a Code and Application Mode = Code-only, then the promotion is not shown in the quote-creation selection list but is redeemable when the patient enters the code on a named subquote of that provider's quote before acceptance.", "rationale": "Screen 9 acceptance criterion 2. PRD line 608."}}
  - {"op": "add_node", "id": "REQ-019-081", "type": "Rule", "owner_fr": "FR-019", "title": "Saving an ad-hoc promotion as reusable clears both bindings and makes it selectable on future quotes", "attrs": {"statement": "Given the provider saves a Mode 2 ad-hoc promotion with \"Save as reusable\" enabled, then `scope = REUSABLE` is recorded and the promotion becomes selectable on future quotes within its active window.", "rationale": "Screen 9 acceptance criterion 4. PRD line 610."}}
  - {"op": "add_node", "id": "REQ-019-082", "type": "Rule", "owner_fr": "FR-019", "title": "Ad-hoc promotion defaults: active window of the bound quote, total limit 1 unless saved as reusable", "attrs": {"statement": "Start / End Date: Mode 1: end ≥ start. Mode 2: defaults to the active window of the bound quote. Total Usage Limit: ≥ 0; blank = unlimited. Mode 2 forces total limit = 1 unless \"Save as reusable\" is toggled.", "rationale": "Screen 9 data fields, composed from table cells. PRD lines 591-592."}}
  - {"op": "add_node", "id": "REQ-019-083", "type": "Rule", "owner_fr": "FR-019", "title": "A provider cannot reverse a Completed redemption; that authority is admin's", "attrs": {"statement": "The provider cannot reverse a Completed redemption; that authority sits with admin (Screen 6).", "rationale": "Screen 10 business rules. PRD line 653."}}
  - {"op": "add_node", "id": "REQ-019-084", "type": "Rule", "owner_fr": "FR-019", "title": "A code is validated at entry and again when the patient confirms acceptance", "attrs": {"statement": "Validation occurs when the code is entered and again when the patient confirms acceptance. On acceptance, the discounted price is frozen into the AcceptanceEvent snapshot.", "rationale": "Screen 11 business rules. PRD line 679, edge case on a code no longer valid at confirmation."}}
  - {"op": "add_node", "id": "REQ-019-085", "type": "Rule", "owner_fr": "FR-019", "title": "A partial-scope discount shows which price line it reduces", "attrs": {"statement": "Where a discount applies only to a sub-component (e.g., treatment cost, not travel), the breakdown explicitly shows which line is reduced.", "rationale": "Screen 11 business rules. PRD line 682, acceptance criterion 1 (line 686: breakdown updates within 1 second with the scope label)."}}
  - {"op": "add_node", "id": "REQ-019-086", "type": "Rule", "owner_fr": "FR-019", "title": "Active dates, eligibility and usage limits are checked at attach and at code validation", "attrs": {"statement": "Active dates, eligibility, and usage limits are checked when a promotion is attached to a row at send and when a patient code is validated before acceptance.", "rationale": "General Module Rules. PRD line 723."}}
  - {"op": "add_node", "id": "REQ-019-087", "type": "Rule", "owner_fr": "FR-019", "title": "A promotion applies only to the row it was attached to at send or the one named subquote", "attrs": {"statement": "A promotion applies only to an option/date-price row it was attached to at send, or to the one named subquote on which the patient entered a code. Any other application is rejected.", "rationale": "General Module Rules. PRD line 725, Screen 9 acceptance criterion 5 (line 611), User Story 4 scenario 4."}}
  - {"op": "add_node", "id": "REQ-019-088", "type": "Rule", "owner_fr": "FR-019", "title": "A fully reserved or consumed limit blocks attach at send and fails code validation", "attrs": {"statement": "Usage limits count active reservations plus consumed uses, so a limit can never be exceeded. A promotion whose limit is fully reserved or consumed does not attach at send and fails code validation.", "rationale": "General Module Rules. PRD line 728; the counting sentence is also in REQ-019-015."}}
  - {"op": "add_node", "id": "REQ-019-089", "type": "Rule", "owner_fr": "FR-019", "title": "On a provider-fault transfer the original Application is kept as Superseded and a new Application is linked", "attrs": {"statement": "Post-acceptance freeze: after acceptance, the promotion and discounted price of the accepted subquote are frozen in the AcceptanceEvent snapshot. No removal, replacement, code entry at checkout or booking, price-changing revalidation, or admin void is allowed. The only exception is the provider-fault transfer in FR-006 (Alternative Flow B5): the original Application is kept as history and marked Superseded, and any promotion on the replacement is recorded as a new Application linked to the new admin-authored acceptance record; a use already reserved or consumed carries over and is not counted twice. Money handling for that transfer is defined by FR-006, FR-007, FR-007b, and FR-017.", "rationale": "General Module Rules, post-acceptance freeze exception. PRD line 730. FR-006 Alternative Flow B5 owns the transfer."}}
  - {"op": "add_node", "id": "REQ-019-090", "type": "Rule", "owner_fr": "FR-019", "title": "All discount creations, approvals, applications and removals are auditable", "attrs": {"statement": "All discount creations, approvals, applications, and removals are auditable.", "rationale": "General Module Rules. PRD line 733."}}
  - {"op": "add_node", "id": "REQ-019-091", "type": "Rule", "owner_fr": "FR-019", "title": "Patients see only non-sensitive discount information; cost splits stay internal", "attrs": {"statement": "Display only non‑sensitive discount info to patients; provider/Hairline cost splits remain internal.", "rationale": "Data and Privacy Rules. PRD line 737."}}
  - {"op": "add_node", "id": "REQ-019-092", "type": "Rule", "owner_fr": "FR-019", "title": "Financial records and discount artifacts are kept at least 7 years; takedown is by archival", "attrs": {"statement": "Financial records and discount artifacts retained for ≥ 7 years; takedowns handled by archival, not deletion.", "rationale": "Data and Privacy Rules. PRD line 738, Implementation Notes (line 815: soft-disable without data loss)."}}
  - {"op": "add_node", "id": "REQ-019-093", "type": "Rule", "owner_fr": "FR-019", "title": "Admin edits discount categories, code format policy, max value caps, dates, targeting, approval routing and templates", "attrs": {"statement": "Discount categories, code format policy, max value caps, and campaign dates. Targeting rules (all providers vs. subsets) and approval routing. Notification templates for approvals and status.", "rationale": "Admin Editability Rules. PRD lines 745-747."}}
  - {"op": "add_node", "id": "REQ-019-094", "type": "Rule", "owner_fr": "FR-019", "title": "Max discount value per policy and region and the auto-decline window are configurable with restrictions", "attrs": {"statement": "Max discount value thresholds per policy and region. Auto‑decline window for unresponded provider approvals.", "rationale": "Admin Editability Rules. PRD lines 757-758."}}
  - {"op": "add_node", "id": "REQ-019-095", "type": "Rule", "owner_fr": "FR-019", "title": "Single-discount rule, priority order, terms fixed at send and calculation order are fixed in code", "attrs": {"statement": "Single‑discount rule and priority order. Promotion terms fixed at send and frozen at acceptance. Calculation order of operations (base → discounts → taxes/fees).", "rationale": "Admin Editability Rules. PRD lines 751-753, Implementation Notes (line 813: base price, then single discount, then taxes and fees; idempotent validation)."}}
  - {"op": "add_node", "id": "REQ-019-096", "type": "Rule", "owner_fr": "FR-019", "title": "The Application and the usage reservation are created atomically with acceptance; payment never recomputes the price", "attrs": {"statement": "Create the Application and reserve usage atomically with the subquote acceptance. Payment and booking read the discounted price from the acceptance snapshot and never revalidate or recompute it.", "rationale": "Implementation Notes. PRD line 814."}}
  - {"op": "add_node", "id": "REQ-019-097", "type": "Rule", "owner_fr": "FR-019", "title": "Treatment changes never change the accepted promotion", "attrs": {"statement": "FR-010: Treatment & Recovery Case Management – Screen 10 Applications tab links redemptions to FR-010 treatment case entities; treatment changes never change the accepted promotion.", "rationale": "Internal Dependencies (FR-010). PRD line 778."}}
  - {"op": "add_node", "id": "REQ-019-098", "type": "Rule", "owner_fr": "FR-019", "title": "Simultaneous code attempts on one subquote: the last confirmed wins and both are audited", "attrs": {"statement": "Simultaneous attempts to apply codes on one subquote before acceptance: last confirmed selection wins; audit both attempts. Attempts after acceptance are rejected.", "rationale": "Edge cases. PRD line 899."}}
  - {"op": "add_node", "id": "REQ-019-099", "type": "Rule", "owner_fr": "FR-019", "title": "If the code is no longer valid at confirmation, the patient may accept at the offered price or cancel", "attrs": {"statement": "Patient code no longer valid when the patient confirms acceptance (for example, its usage limit was reached): the reason is shown and the patient may accept at the offered price or cancel.", "rationale": "Edge cases. PRD line 901."}}
  # --- Entities: ENT-promotion-program was a stub from FR-004 (updated, not recreated); the others are new
  - {"op": "update_node", "id": "ENT-promotion-program", "title": "Promotion program", "attrs": {"description": "The single entity for all three promotion program types (admin-via-provider, provider self-created, Hairline-funded and direct-issued). Stored in the promotion_programs table; the legacy discounts table does not hold programs. PRD line 947.", "table": "promotion_programs"}}
  - {"op": "add_node", "id": "ENT-promotion-code", "type": "Entity", "owner_fr": "FR-019", "title": "Promotion code", "attrs": {"description": "One code of a promotion program: text, binding to an open channel, affiliate, segment or patient, and redemption status. Stored in the promotion_codes table. PRD line 948. in_progress means a use is reserved by an accepted subquote and the first payment has not yet succeeded; it is the code-level view of the same moment as Application state APPLIED.", "table": "promotion_codes"}}
