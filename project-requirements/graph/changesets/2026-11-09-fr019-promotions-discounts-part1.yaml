  - {"op": "add_node", "id": "REQ-019-005", "type": "Rule", "owner_fr": "FR-019", "title": "Track usage and financial impact with exports and dashboards", "attrs": {"statement": "System MUST track usage and financial impact with exports and dashboards.", "rationale": "Restated by the Admin Platform scope, Main Flow step 5 and Screens 6 and 10. PRD lines 45, 60, 94."}}
  - {"op": "add_node", "id": "REQ-019-006", "type": "Rule", "owner_fr": "FR-019", "title": "Persist definitions, approvals and usage records with audit details", "attrs": {"statement": "System MUST persist discount definitions, approvals, and usage records with audit details.", "rationale": "Restated by Implementation Notes (audit trail for all state changes; soft-disable without data loss). PRD line 815."}}
  - {"op": "add_node", "id": "REQ-019-007", "type": "Rule", "owner_fr": "FR-019", "title": "Application links to quote, version, subquote, acceptance event, booking and participants", "attrs": {"statement": "System MUST link each Application to the parent quote and version, the accepted option/date-price row (subquote), the AcceptanceEvent, the booking, and participant entities.", "rationale": "Restated by Alternative Flow A5 and the Application entity. PRD lines 157, 950."}}
