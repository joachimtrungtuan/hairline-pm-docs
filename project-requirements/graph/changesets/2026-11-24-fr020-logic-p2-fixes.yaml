# Order: node updates first (no node is added), then edge removals and edge additions.
# The writer applies in file order. Every edge end exists in the graph.
reason: 'FR-020 logic review pass 2 (15 findings; 14 accepted or ruled, P2-13 deferred to the backlog; PRD 2.18). The three provider-status variants are chosen in a stated order; the redistribution reminder is dropped when no confirmation is awaited; booking.cancelled causes follow FR-006; inquiry.cancelled has an Admin-close variant that says no replacement will follow; an Admin Close inquiry sends no provider notice and an account-deletion cancellation does; a notice counts as complete when its first attempt is handed to a channel or it has ended failed; dsr.fulfilled goes by email to the captured address with no in-app record; every patient notice creates the in-app record; the 5-minute figure is a first-attempt target in the acceptance scenario; an archived-notice link opens the dropdown on provider and admin surfaces; flow steps 006, 007 and 008 reach step 004; delivery and audit rules move to the all-stages platform stage. Neighbour changes in FR-003, FR-004, FR-006, FR-023, FR-030 are queued in plans/reports/logic-review-ledger.md (pass 2 section), not made here.'
by: docs-manager
operations:

  # ---- P2-01: order of the three provider-status variants ----
  - op: update_node
    id: REQ-020-013
    attrs:
      statement: 'System MUST send mandatory provider.status_cancellation_patient and provider.status_cancellation_admin_support notifications for each record affected by an FR-015 provider suspension/deactivation, regardless of the Notify Provider checkbox, with privacy-safe patient content (no patient-cancelled wording, no payment instruction, no confidential reason), and MUST use the FR-003 pre-acceptance variants (Workflow 2 Alternative Flow B4, REQ-003-021): in this order: (1) "[Clinic] is no longer available. Your other offers are still open." when other live offers remain; (2) a confirmation request first, with Confirm and Decline deep links to FR-003 Screen 8, when no live offer remains and the patient had explicitly selected the affected provider; (3) "[Clinic] is no longer available. We are finding new offers for you." when no live offer remains and the patient made no explicit selection. When the patient has not answered after 48 hours, one mandatory reminder provider.status_redistribution_reminder follows (REQ-020-159).'

  # ---- P2-02: reminder drop conditions ----
  - op: update_node
    id: REQ-020-159
    attrs:
      statement: 'Notification catalog event provider.status_redistribution_reminder (Redistribution Confirmation Reminder), category Provider/Compliance. Primary recipients: Patient. Notes: FR-003 Workflow 2 Alternative Flow B4 step 3 (STP-003-095, REQ-003-128). Sent once, when the patient has not answered the confirm variant of provider.status_cancellation_patient after 48 hours; same Confirm and Decline deep links to FR-003 Screen 8 and the Contact Admin/Support action; no second reminder. The reminder is not sent, and a pending one is dropped, when the redistribution is no longer awaiting the patient''s confirmation (the patient answered, the inquiry was cancelled, an Admin reassigned providers or reran distribution, or the support marker was cleared). Mandatory (cannot be disabled in FR-030 rules).'

  # ---- P2-03: booking.cancelled causes follow FR-006 ----
  - op: update_node
    id: REQ-020-092
    attrs:
      statement: 'Notification catalog event booking.cancelled (Booking Cancelled), category Booking/Schedule. Primary recipients: Patient, Provider, Admin (optional). Notes: Fires for an Admin cancellation, a provider drop-out at the FR-006 Screen 10 submit, and a system cancellation for an unpaid balance (including an FR-007B installment plan default). A closure for provider suspension or deactivation sends booking.provider_fault_replacement to the patient and not booking.cancelled. The reason text each recipient sees is the one FR-006 defines (REQ-006-011).'

  # ---- P2-04 and P2-06: inquiry.cancelled Admin-close variant; no separate patient notice for a deletion cancellation ----
  - op: update_node
    id: REQ-020-076
    attrs:
      statement: 'Notification catalog event inquiry.cancelled (Inquiry Cancelled), category Inquiry. Primary recipients: Patient, Admin (optional). Notes: Fires when a patient cancels the inquiry in the Inquiry or Quoted stage (FR-003 Workflow 5) and when an admin closes the inquiry (FR-006 Close inquiry, cancelled_by = admin; REQ-003-014). The patient receives the cancellation confirmation (mandatory, aligns with FR-003 Workflow 5 step 4 and Screen 8b); an admin close is one event key with a second variant: the notice says the inquiry was closed by Hairline, gives the reason as FR-006 defines (REQ-003-014), says no replacement will follow and carries the Contact Admin/Support action. A system cancellation at the approval of an account deletion (FR-023 REQ-023-042) sends the patient no inquiry.cancelled. Providers are not recipients: each provider holding a quote for the inquiry in draft, sent or expired state is told by quote.cancelled_inquiry only, and a provider that never quoted is told nothing (REQ-020-020). The reason a patient gives is patient-private. MVP default channels: Email + Push.'

  # ---- P2-05 and P2-06: quote.cancelled_inquiry triggers ----
  - op: update_node
    id: REQ-020-020
    attrs:
      statement: 'System MUST always send quote.cancelled_inquiry, and only that notice, to each provider holding a quote for the inquiry in draft, sent or expired state when a patient cancels the inquiry or the system cancels it at the approval of an account deletion (FR-023 REQ-023-042) (never to the provider of a replacement draft quote, REQ-003-127); a provider that never quoted is told nothing; an admin Close inquiry sends no provider notice; neither FR-030 toggles nor FR-032 provider notification preferences may suppress it. The reason is patient-private: a patient cancellation says only Inquiry cancelled by patient; the deletion cancellation shows no reason. The notice is critical (REQ-020-158): its target is a first send attempt within 5 minutes, and a failed first attempt is retried under the FR-030 retry rule (up to 3 retries, 1 hour apart by default), so 5 minutes is a target, not a guarantee.'

  # ---- P2-06: a notice counts as complete; P2-11: in-app record for every patient notice ----
  - op: update_node
    id: REQ-020-040
    attrs:
      statement: 'Channel Failure. Trigger: Email/push/SMS provider unavailable. Outcome: Failed attempts are retried under the FR-030 retry rule (up to 3 retries, 1 hour apart by default), each retry returning to step 4; status reflects failure cause; after the last retry the notice ends with status failed. A notice counts as complete when its first attempt has been handed to a channel or it has ended failed after the last retry.'
  - op: update_node
    id: STP-020-008
    title: 'Delivery is retried under the FR-030 retry rule and the status reflects the failure cause'
    attrs:
      description: 'B2: a failed channel attempt is retried under the FR-030 retry rule (up to 3 retries, 1 hour apart by default), each retry returning to step 4. May also end: after the last retry the notice ends with status failed. A notice counts as complete when its first attempt has been handed to a channel or it has ended failed after the last retry.'
  - op: update_node
    id: REQ-020-038
    attrs:
      statement: 'Preference Disabled. Trigger: Recipient has disabled Email or Push. Outcome: Channel suppressed; delivery attempted on remaining enabled channels (back to step 3). A mandatory patient notice is sent by email even when the patient has switched off every channel; a non-mandatory notice with no channel left is recorded with status suppressed and ends. Every patient notice creates the in-app record whatever the channel toggles (dsr.fulfilled excepted, REQ-020-161); suppressed describes the email and push attempts only.'

  # ---- P2-07: dsr.fulfilled delivery ----
  - op: update_node
    id: REQ-020-161
    attrs:
      statement: 'Notification catalog events dsr.verification_required, dsr.in_progress, dsr.fulfilled, dsr.denied and dsr.blocked_by_obligation (Data Request Status Notices), category Account/Auth. Primary recipients: Patient. Notes: FR-023 REQ-023-008. Status notices on a deletion request: identity proof insufficient (the patient provides more), approved and processing, completed (with the actions taken and the legal basis of any retained records), denied (with the reason), approval blocked by an active obligation (with the expected timeline). The outcome notices dsr.fulfilled and dsr.denied are mandatory; admin cannot disable them. dsr.fulfilled is sent by email only, to the contact address FR-023 captured (REQ-023-033), is critical and creates no in-app record; when the email still fails after all retries, the captured address is deleted anyway and the Admin sees the failure in the delivery log.'

  # ---- P2-08: first-attempt wording in the acceptance scenario ----
  - op: update_node
    id: REQ-020-071
    attrs:
      statement: 'Given patient cancels inquiry with 2 active quotes, when cancellation completes, then a first send attempt of `inquiry.cancelled` is made within 5 minutes on both email and push, confirming the cancellation and showing the patient''s own cancellation reason.'

  # ---- P2-15: archived-notice link on provider and admin surfaces ----
  - op: update_node
    id: REQ-020-068
    attrs:
      statement: 'Notifications persist for 90 days then archive. The same 90-day window applies to the patient, provider and admin lists; an archived notice is no longer in the lists, and a deep link to it opens the list with a no longer available message; on the provider and admin surfaces it opens the notification dropdown with that message.'

  # ---- P2-09: step wiring (the two relabelled edges keep their ends; no duplicate edge) ----
  - {op: remove_edge, from: STP-020-006, verb: next, to: STP-020-003}
  - {op: add_edge, from: STP-020-006, verb: next, to: STP-020-003, attrs: {label: 'Remaining channels still enabled, or the forced email for a mandatory notice with every channel off', condition: 'REQ-020-038'}}
  - {op: add_edge, from: STP-020-006, verb: next, to: STP-020-004, attrs: {label: 'No channel left: recorded as suppressed', condition: 'REQ-020-038'}}
  - {op: add_edge, from: STP-020-007, verb: next, to: STP-020-004, attrs: {label: 'Coalesced: recorded as coalesced', condition: 'REQ-020-039'}}
  - {op: remove_edge, from: STP-020-008, verb: next, to: STP-020-004}
  - {op: add_edge, from: STP-020-008, verb: next, to: STP-020-004, attrs: {label: 'Retry attempt recorded; after the last retry the status is failed', condition: 'REQ-020-040'}}

  # ---- P2-12: delivery and audit rules apply at the all-stages platform stage ----
