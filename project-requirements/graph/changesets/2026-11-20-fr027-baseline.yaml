  - {"op": "update_node", "id": "REQ-027-024", "title": "Warning banner on the document list when pending acceptance is below the Admin-set threshold", "attrs": {"statement": "Screen 1 (Admin Legal Documents List, SCR-027-01) shows warning banners for pending acceptance coverage below the Admin-set threshold.", "rationale": "Screen 1 notes. The threshold is set by Admin and has no default (CL-5)."}}
  - {"op": "update_node", "id": "REQ-027-029", "title": "One Current version per document type; the prior Current is archived when the new version becomes Current", "attrs": {"statement": "Only one Current version per document type at a time; when a newly published version becomes Current, the prior Current is auto-archived.", "rationale": "Screen 1 business rules and Status validation. Restated by Main Flow step 4 and Screen 3 business rule. A published version with a future effective date is Scheduled and the previous version stays Current until then."}}
  - {"op": "update_node", "id": "REQ-027-030", "title": "A future effective date keeps the previous version Current until then, then activates the new version and starts prompts", "attrs": {"statement": "When Admin sets a future effective date, System marks the new version Scheduled and the previous version stays Current; on the effective date the new version becomes Current, the previous version is archived, and prompts begin.", "rationale": "Alternative Flow A1 and Screen 3 business rule. Until the effective date the new version is Scheduled."}}
  - {"op": "update_node", "id": "REQ-027-031", "title": "Restoring an earlier text is a new draft published as a new version; no revert button; prompts updated and audit entry recorded", "attrs": {"statement": "There is no revert button. To go back to the text of an earlier version, Admin creates a new draft from the old version and publishes the restored text as a new version through the normal publishing flow; prompts update accordingly and an audit entry is recorded.", "rationale": "Alternative Flow B1 (Restoring an Earlier Version)."}}
  - {"op": "update_node", "id": "REQ-027-032", "title": "Restoring an earlier text keeps existing acceptance records; users who accepted only the replaced version accept the restored one", "attrs": {"statement": "When an earlier text is restored it is published as a new version; existing acceptance records are preserved, and users who accepted only the version that was replaced are asked to accept the restored version.", "rationale": "Edge Cases (restoring an earlier text after partial acceptance) and Alternative Flow B1 outcome."}}
  - {"op": "update_node", "id": "REQ-027-053", "title": "Acceptance Rate base is the users who must accept that document, computed from the ledger; Pending Users are those who must accept and have not", "attrs": {"statement": "Acceptance Rate is the % accepted out of the users who must accept that document, computed from the acceptance ledger; Pending Users are the users who must accept that document and have not.", "rationale": "Screen 4 Acceptance Rate and Pending Users. Computes ENT-legal-document.acceptance_rate and pending_user_count."}}
  - {"op": "update_node", "id": "REQ-027-049", "attrs": {"rationale": "Screen 1 business rules and Actions field: Edit is shown for Draft versions only."}}
  - {"op": "update_node", "id": "REQ-027-036", "title": "Missing translation falls back to the platform default language (English) with a notice; publishing needs complete English (en-US) content", "attrs": {"statement": "If a localized version is unavailable, fall back to the platform default language (English) and display a discreet notice. When a version is published globally, the system validates that at least the English (en-US) locale content is complete; if other locales are configured, the Admin UI summarises their completeness and publishing proceeds with the platform default language (English, en-US) version as the single fallback where a locale is missing or incomplete (as per CL-3).", "rationale": "CL-3, Edge Cases (locale mismatch), Assumptions and Screen 3 business rule. The platform default language (English) is the single fallback. Merged from REQ-027-039."}}
