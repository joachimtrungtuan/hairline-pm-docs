  - {"op": "update_node", "id": "REQ-008-013", "attrs": {"statement": "The `transportation` field in the hotel record MUST be the canonical field for airport pickup and transfer coordination in MVP. When the hotel is marked Not needed, no transportation details are collected (accepted for MVP)."}}
  - {"op": "update_node", "id": "REQ-008-018", "attrs": {"statement": "The binary travel path MUST be derived from `included_services` in the accepted FR-004 Quote Option snapshot carried by the FR-005 AcceptanceEvent, not selected by the provider in FR-008. `flight` or `hotel` (the FR-004 `accommodation` item type) yields `provider_included` (Path A); neither yields `patient_self_booked` (Path B), including transport-only options. FR-008 MUST persist the derived path and accepted inclusions in TravelContext at booking confirmation. Path A allows provider entry only for included flight/hotel services and never patient entry; Path B allows patient entry only and never provider entry. An omitted Path A flight/hotel service is \"Not included\" and is not collected in MVP. The reusable package preset and parent quote are not the authority for this choice. The FR-004 included_services checklist alone decides the path; option item names are display detail only."}}
  - {"op": "update_node", "id": "REQ-008-031", "attrs": {"statement": "When a return flight departs, or the hotel check-out date falls, before the last treatment plan day (current booking appointment date plus the plan day count minus one), the system MUST show the submitter a soft warning that must be acknowledged before saving, MUST still allow the record to be saved, MUST record who acknowledged it and when, and MUST show the provider an early-departure flag on the booking. If a reschedule then leaves the return flight or the hotel check-out before the new last treatment plan day, the earlier acknowledgment is cleared and asked again."}}
  - {"op": "update_node", "id": "REQ-008-032", "attrs": {"statement": "When FR-006 Alternative Flow B5 transfers a patient to a replacement booking, the system MUST keep the original TravelContext closed with its records read-only; only when the replacement booking's travel path (A or B) matches the original's, MUST carry the passport record over to the replacement TravelContext as a new locked booking-linked record, MUST copy the current flight and hotel records to it with a copy-source reference and the flag \"travel-date review required\", MUST NOT request carried-over items from the patient again, and MUST set the replacement TravelContext to `travel-date-review-required` until an admin clears the review under REQ-008-030. When the paths differ, nothing is carried over or copied, the replacement TravelContext starts `active`, and the initial requests for its own path are sent. Each copied record (passport, flight, hotel) keeps its original submitter plus the copy-source reference; any correction to a copy goes through the admin. The carry-over also keeps any Not-needed marks, the no-travel declaration and an Incomplete passport mark as they were, and the admin travel record shows \"carried over from the original booking\" so an admin can review them."}}
  - {"op": "update_node", "id": "REQ-008-044", "attrs": {"statement": "Included travel items of the accepted option (for example hotel, airport transfer, or another travel service such as a city tour) MUST be listed as Package Travel Items on the patient itinerary whenever they exist, in Path A or Path B, named from the accepted option's included-services list as saved with the TravelContext at confirmation. Services not included are shown as Not included and are not collected in MVP. The FR-004 included_services checklist supplies these labels; option item names are display detail only."}}
  - {"op": "update_node", "id": "REQ-008-050", "attrs": {"statement": "Provider access to passport data MUST be logged (timestamp, provider user ID), and a provider MUST NOT be able to view passport data of patients not assigned to its clinic. The provider sees the passport number in full and the passport view is read-only; incorrect data is corrected by contacting admin. Once the TravelContext is closed (booking cancelled after confirmation, or closed by a provider-fault transfer) or the booking reaches Completed, the provider MUST lose access to the passport record; flight and hotel details stay read-only for that provider, and admins keep access."}}
  - {"op": "update_node", "id": "REQ-008-051", "attrs": {"statement": "If passport details were previously submitted for an earlier appointment, the passport request is still sent as usual. The patient either confirms the earlier details (\"Use these details\") or enters new ones (\"Enter new details\"), and the result is a new booking-linked locked record; the earlier record is not edited."}}
  - {"op": "update_node", "id": "REQ-008-056", "attrs": {"statement": "Each itinerary section MUST show the submission timestamp and the submitter (patient or provider). A pending item shows an 'Awaiting submission' state, and a submission link appears only when the patient owns that item (Path B, or the Path A passport). The passport section (full name, masked passport number, date of expiry) appears only for Path A, and in Path A the return flight section only if a return record exists. In Path B the outbound flight, return flight and hotel rows are always shown, as the record, Awaiting or Not needed."}}
  - {"op": "update_node", "id": "REQ-008-059", "attrs": {"statement": "A patient MUST NOT be able to reverse a no-travel declaration and contacts admin instead. Admin MAY override no_travel_required from the Travel section and re-send the travel submission request. The declaration and any admin override MUST be recorded on the TravelContext with timestamp and actor ID. The provider MUST see \"Patient declared no travel needed\" on the Travel Details view and MUST be notified when the declaration is made or overridden."}}
  - {"op": "update_node", "id": "REQ-008-060", "attrs": {"statement": "Admin 'Re-notify patient' MUST send a manual notification only for a patient-owned pending item: the passport in Path A (not yet submitted, or marked Incomplete), or flight or hotel in Path B unless the booking is marked no_travel_required or the item is marked Not needed. Provider-owned Path A flight and hotel items MUST NOT create patient submission notifications. There are no automatic reminders at MVP; after the initial request this admin action is the only follow-up."}}
  - {"op": "update_node", "id": "REQ-008-062", "attrs": {"statement": "When an approved admin intervention changes the appointment date after confirmation and FR-006 sends its booking.rescheduled event (REQ-006-011), the system MUST preserve the immutable accepted appointment baseline, show the current booking appointment alongside it, and revalidate the existing flight and hotel dates before the itinerary is treated as current. Patients and providers see 'Travel dates under admin review' on the affected sections but cannot clear it. FR-008 MUST NOT automatically rebook external travel. A reschedule on a booking with no flight or hotel records starts no review. Submissions and edits stay allowed during a review, and the admin still confirms the dates."}}
  - {"op": "update_node", "id": "REQ-008-064", "attrs": {"statement": "The provider Travel section MUST show status badges for the passport (Path A only; Awaiting, Submitted or Incomplete), the outbound flight, the return flight and the hotel (Not included, Awaiting, Submitted or, in Path B, Not needed), updated in real time on submission and on admin correction, and MUST show the Awaiting states immediately when the booking becomes Confirmed. In Path A, View Passport appears, and Enter Flight and Enter Hotel appear only for included services that have not yet been submitted; services not included show 'Not included' with no entry action. In Path B only View Travel Details (read-only) is shown and the provider cannot enter or modify records. An item marked Not needed shows Not needed, not Awaiting."}}
  - {"op": "update_node", "id": "REQ-008-067", "attrs": {"statement": "Admin MAY soft-delete any travel record with a mandatory reason; deletion is not permanent and is retained in the backend audit trail. After a flight or hotel soft-delete the status returns to Awaiting and the item's owner (provider in Path A, patient in Path B) MAY enter one replacement, following the passport pattern (REQ-008-076); until then the item counts as not submitted. The owner of a soft-deleted flight or hotel record MUST receive a notice asking them to enter it again."}}
  - {"op": "update_node", "id": "REQ-008-076", "attrs": {"statement": "After an admin soft-deletes a passport record, the system MUST set the passport status back to Awaiting and allow exactly one new submission by the patient. The deleted record stays in the travel audit trail. The patient MUST receive a notice asking them to submit it again."}}
  - {"op": "update_node", "id": "REQ-008-077", "attrs": {"statement": "The system MUST work out the booking's Overall Status shown on the admin travel record screen as follows. Pending: nothing has been submitted. Partially submitted: some required items are in, or the passport is marked Incomplete by an admin. Complete: all required items are in and the passport is not marked Incomplete. Required items: in Path A, the passport plus each of the flight and the hotel that the accepted option includes; in Path B, the outbound flight, the return flight and the hotel, except any item marked Not needed. A booking marked no_travel_required is Complete. A soft-deleted flight or hotel record counts as not submitted until re-entered. When every required Path B item is marked Not needed, the Overall Status is Complete; this is separate from the no-travel declaration, which stays its own flag."}}
  - {"op": "update_node", "id": "REQ-008-080", "attrs": {"statement": "In the provider's read-only Travel Details view of a Path B booking, a flight leg or hotel record that the patient has not submitted MUST show 'Awaiting patient submission' unless it is marked Not needed, in which case it MUST show 'Not needed', and when no return flight record exists the view MUST show 'Return flight not yet submitted'. When the patient has declared no travel needed, the view MUST show 'Patient declared no travel needed' and the Awaiting messages do not apply."}}
  - {"op": "update_node", "id": "REQ-008-081", "attrs": {"statement": "On the admin travel record screen, a tab with nothing submitted and nothing marked Not needed MUST show 'Awaiting submission'; an item marked Not needed shows 'Not needed' and is not offered for Re-notify. The Passport tab then offers the Re-notify patient button, while the Flight and Hotel tabs offer Re-notify patient only in Path B because Path A flight and hotel entry is provider-owned. When the return flight is neither submitted nor marked Not needed the Flight tab MUST show 'Return flight not yet submitted'. The Passport tab also offers Re-notify patient while the passport is marked Incomplete."}}
