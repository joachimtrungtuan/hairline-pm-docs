# Backlog points of FR-017 settled from rules already written: payout status list, re-authentication and payout flag on Pay Now and Release Earnings, affiliate payout flow, clinic share move flow, invalid Stripe bank account wording, provider-status hold wording.
reason: "FR-017 backlog settle: filing and wording fixes taken from live rules (REQ-017-047, REQ-017-178, REQ-017-179, REQ-017-186, REQ-017-187, REQ-017-194, REQ-017-197, FR-032 REQ-032-146); no business decision changed."
by: controller
source_id: SRC-PRD-017
operations:
  - {"op": "update_node", "id": "REQ-017-015", "attrs": {"statement": "System MUST maintain separate payout records for providers and affiliates with status tracking: a settlement statement and a Stripe Connect per-booking payout carry the states of REQ-017-186 and REQ-017-187, and an affiliate payout is Pending, Processing, Paid or Failed"}}
  - {"op": "update_node", "id": "REQ-017-193", "attrs": {"statement": "For a Suspended or Deactivated clinic, an admin releases earnings with a Release earnings resolution on Screen 7 that needs no target payout cycle: a manual-rail clinic gets a one-off manual statement and a Stripe Connect clinic a direct per-booking payout, with an internal note and an audit entry. It covers bookings completed normally and bookings held under General Module Rule 16 once the admin has resolved them. The one-off statement is created Approved (the admin's release is the approval), sits outside the weekly cycle and is paid with Mark as Paid like any other statement. The release asks for financial re-authentication before it is confirmed (REQ-017-047) and the payout is checked against the payout flag (REQ-017-194)."}}
  - {"op": "update_node", "id": "REQ-017-201", "attrs": {"statement": "On Screen 7, for a Stripe Connect clinic the Target Payout Cycle field is hidden and Pay Now replaces Add to Next Payout. Pay Now is available only when the booking was not already paid, its funds are released and the admin has provided an Internal Note; it starts a direct per-booking payout, which shows Waiting for clinic setup until the clinic's Stripe setup is Ready, asks for financial re-authentication before it is confirmed (REQ-017-047) and is checked against the payout flag (REQ-017-194), and the provider notification is mandatory. Confirm Already Paid and Escalate Technical Investigation stay for both rails."}}
  - {"op": "update_node", "id": "REQ-017-187", "attrs": {"statement": "A Stripe Connect clinic is paid one payout per released booking, listed in the Stripe Connect payouts section of Screen 2. That payout has the states Waiting for clinic setup, Processing, Paid and Failed, moved by the Stripe transfer webhooks; Retry Payout and the three automatic attempts belong to it. When Stripe reports an invalid bank account, the clinic corrects its payout details through the Complete Stripe sign-up link in the status panel of its Billing Settings (FR-032 REQ-032-146) and the admin then retries the payout."}}
  - {"op": "update_node", "id": "STP-017-008", "title": "Invalid bank account reported by Stripe: admin contacts the clinic, which corrects its payout details through the Complete Stripe sign-up link in the status panel of its Billing Settings; admin retries the per-booking payout from the Stripe Connect payouts section", "attrs": {"prd_ref": "Screen 2 Stripe Connect payouts section"}}
  - {"op": "update_node", "id": "STP-017-009", "attrs": {"prd_ref": "Screen 2 Stripe Connect payouts section"}}
  - {"op": "update_node", "id": "STP-017-087", "title": "System checks the booking's funds when the confirmation window ends: with no open problem case they are released; with an open problem case on a Completed booking the payout is held. A provider-status cancellation has no confirmation window: its amounts are held from the cancellation until admin resolution"}
