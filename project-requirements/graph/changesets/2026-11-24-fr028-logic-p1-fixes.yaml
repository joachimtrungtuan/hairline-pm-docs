# Operations ordered so new nodes and fields come first, then edge removals, then updates, retirements and the merge, then new edges. Neighbour needs (FR-001, FR-003, FR-026, FR-029, FR-031, FR-038) are queued in the ledger, not in this file.
reason: 'FR-028 logic review pass 1: one price lookup chain always in the patient currency, converted prices marked approx., ends in Price available on request (owner default 120); the destination cap is a display cap with Show all destinations (owner default 121); number of destinations shown first is a grouping field and the setting is retired; Manage App Data permission (owner default 122); inactive and archived are one state that releases countries and switching back to Active re-runs the country check (owner default 123); warning at the 51st grouping (owner default 124); destination is an FR-026 active country, the same key as treatment countries (owner default 125); matching on the profile country, no IP geolocation (owner default 126); proximity uses a fixed distance table in code (owner default 127); preview entry point and flow; flows for effective and expiry dates, location default currency and the system-wide default price; location default currency same on every row of a location and the last currency fallback is the FR-029 system default currency; dated rows in UTC with history from the audit log; audit and cache clear attached to every save step; amount, decimals and currency checks on fallback and bulk steps; stale next edges to retired steps removed; save confirmation is on-screen only, warnings are banners on Screen 2 (owner default 128); admin screens and the save event belong to the configuration stage; a Stripe-assigned grouping cannot be archived or lose a country (owner default 129); a deactivated country keeps applying until edited (owner default 130); stale-edit warning covers prices and bulk apply; decimals from the FR-029 currency catalogue; audit rules merged.'
by: docs-manager
operations:
# ---- New field -------------------------------------------------------------
- {op: add_field, id: ENT-regional-grouping.locations_displayed, entity_id: ENT-regional-grouping, name: locations_displayed, data_type: int, title: Destinations shown first, owner_fr: FR-028, required: false, attrs: {description: 'How many destinations patients from this grouping see first; the rest sit behind Show all destinations. Whole number 5 to 20; empty means the default 10.'}}

# ---- New rules -------------------------------------------------------------
- op: add_node
  id: REQ-028-090
  type: Rule
  owner_fr: FR-028
  title: A future-dated price change is a new dated row; the lookup uses the row whose window contains today
  attrs:
    statement: |-
      A future-dated price change MUST be saved as a new row for the same destination and currency; the lookup picks the row whose window contains the current day, dates are UTC and the expiry day is included, and price history is read from the configuration change audit log
    rationale: 'Main Flow: Starting Prices step 7 and Screen 2 Effective Dating. Effective and expiry date rules are REQ-028-060 to REQ-028-062.'
- op: add_node
  id: REQ-028-091
  type: Rule
  owner_fr: FR-028
  title: A grouping with an assigned Stripe account cannot be archived or lose a country
  attrs:
    statement: |-
      Archiving a regional grouping, or removing a country from it, MUST be blocked while a Stripe account is assigned to the grouping (FR-029), and the screen names the account
    rationale: General Module Rule 8 and Dependencies FR-029. The account assignment itself is owned by FR-029.
- op: add_node
  id: REQ-028-092
  type: Rule
  owner_fr: FR-028
  title: A deactivated country keeps applying in groupings and fallback prices until an admin edits them
  attrs:
    statement: |-
      A country deactivated in FR-026 MUST keep applying in regional groupings and fallback prices until an admin edits them
    rationale: General Module Rule 9 and Dependencies FR-026.

