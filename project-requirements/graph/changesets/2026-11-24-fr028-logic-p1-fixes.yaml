# ---- Rule updates ----------------------------------------------------------
- op: update_node
  id: REQ-028-003
  title: Regional grouping applied to the patient destination list by the profile country
  attrs:
    statement: |-
      System MUST apply regional grouping to the patient destination list by matching the patient's country in the profile (ENT-patient.country) to an active regional grouping; there is no IP geolocation
    rationale: 'Patient Entry Point and Main Flow: Patient Views Personalized Location Recommendations steps 2 to 4. The patient screen is FR-003 Screen 2 (SCR-003-02). Overlaps REQ-003-032.'
- op: update_node
  id: REQ-028-004
  title: Starting price in the patient's currency; the lookup chain applies when it has none
  attrs:
    statement: |-
      System MUST display starting prices in the patient's currency; where that currency has no price for the location, the lookup chain of REQ-028-040 applies
    rationale: 'Main Flow: Patient Views Personalized Location Recommendations step 8 and A6. The chain is REQ-028-040. Overlaps REQ-003-033.'
- op: update_node
  id: REQ-028-006
  title: A country belongs to at most one active regional grouping, enforced at configuration time
  attrs:
    statement: |-
      System MUST prevent overlapping active regional groupings by enforcing one-to-one mapping between country and active regional grouping at configuration time
    rationale: General Module Rule 1, Main Flow step 4 and Screen 1 Unique Membership. Inactive groupings release their countries (REQ-028-029). The error text is REQ-028-021.
- op: update_node
  id: REQ-028-009
  title: Regional grouping stored with name, country list, location order, destinations shown first and status
  attrs:
    statement: |-
      System MUST store regional grouping configuration with grouping name, country list, location ordering, number of destinations shown first, and status (active/inactive)
- op: update_node
  id: REQ-028-013
  title: Regional configuration restricted to admins with the Manage App Data permission
  attrs:
    statement: |-
      System MUST restrict regional configuration and pricing management to admin users with the FR-031 permission "Manage App Data", which guards both regional groupings and starting prices
    rationale: Entry Points, Dependencies FR-031 and Security Considerations Authentication and Authorization (read-only roles cannot modify regional groupings or pricing).
- op: update_node
  id: REQ-028-014
  title: Every configuration change logged with user id, timestamp, IP address, reason and details
  attrs:
    rationale: Security Considerations Audit Trail (old value to new value). Includes the earlier audit trail rule REQ-028-011, merged here; it covers groupings, location ordering, starting prices, default currencies and the system-wide default price.
- op: update_node
  id: REQ-028-021
  attrs:
    statement: |-
      System MUST block selection or save of a country that already belongs to another active regional grouping and MUST show the error "Each country can only belong to one regional grouping. Remove it from the other grouping first." together with the list of conflicting groupings.
- op: update_node
  id: REQ-028-028
  attrs:
    statement: |-
      Deleting a regional grouping MUST archive it (soft delete), never remove it permanently, so the audit trail stays complete; an archived grouping is an inactive grouping; System clears the cache and confirms "Regional grouping archived. Patients from affected countries will now see proximity-based destination ordering."
- op: update_node
  id: REQ-028-029
  title: Inactive and archived groupings are one state, not applied, and release their countries
  attrs:
    statement: |-
      Inactive and archived regional groupings are one state: retained in the system but not applied to patient location presentation, and their countries are released to other groupings. Switching a grouping back to Active re-runs the country check and is blocked with the error of REQ-028-021 while a country of the grouping sits in another active grouping.
    rationale: General Module Rule 6, Screen 1 Status field and Alternative Flow A7.
- op: update_node
  id: REQ-028-030
  title: At the 51st regional grouping the admin is warned and may continue
  attrs:
    statement: |-
      At the 51st regional grouping System warns the admin, who may continue; the number 50 is fixed in the code.
    rationale: General Module Rule 5, Admin Editability Fixed in Codebase and the Add step of the main grouping flow.
- op: update_node
  id: REQ-028-031
  title: Cache timing, the proximity distance table and the grouping warning number are fixed in the codebase
  attrs:
    statement: |-
      Cache propagation timing (1-minute TTL), the country-to-country distance table used for proximity ordering and the number of regional groupings that triggers the warning (50) are fixed in the codebase and not editable by admin.
    rationale: Admin Editability, Fixed in Codebase. Decimal places are not fixed here; they come from the FR-029 currency catalogue (REQ-028-055).
- op: update_node
  id: REQ-028-032
  attrs:
    statement: |-
      Admins can edit regional grouping names, countries and location ordering; starting price amounts for any location-currency combination; fallback pricing configuration per location; regional grouping active or inactive status; price effective and expiry dates; the number of destinations shown first per regional grouping; the default currency per destination location; and the system-wide default starting price.
- op: update_node
  id: REQ-028-033
  title: 'Number of destinations shown first per grouping: default 10, range 5-20, the rest behind Show all destinations'
  attrs:
    statement: |-
      The number of destinations shown first is set per regional grouping by the admin (default 10, allowed range 5-20). It only decides how many destinations show first; the rest sit behind "Show all destinations". A patient with no matching grouping gets the default 10.
    rationale: Admin Editability, Screen 1 field Locations Displayed and the display cap step of the patient flow. Stored on ENT-regional-grouping.locations_displayed.
- op: update_node
  id: REQ-028-035
  title: 'No matching grouping: destinations ordered by proximity from a fixed distance table'
  attrs:
    statement: |-
      If no active regional grouping matches the patient's country (or the grouping was deleted or is inactive), System orders destinations by proximity of countries using a fixed country-to-country distance table kept in the product code and not editable by admin; the first 10 show first and the rest sit behind "Show all destinations".
    rationale: Screen 1 Default Fallback, A5 steps 1 to 3, A2 outcome and the third edge case.
- op: update_node
  id: REQ-028-036
  title: Configured order first; other locations after, by proximity to the patient's country
  attrs:
    statement: |-
      System shows destinations in the matched grouping's configured order (first position first, second position second, and so on); locations not in the configured order appear at the end, ordered by proximity to the patient's country (REQ-028-035).
- op: update_node
  id: REQ-028-038
  title: Patient currency from the profile, else the location default, else the FR-029 system default currency
  attrs:
    statement: |-
      System identifies the patient's currency from the patient profile preference, else from the location default currency, else from the FR-029 system default currency.
    rationale: 'Main Flow: Patient Views Personalized Location Recommendations step 8.'
- op: update_node
  id: REQ-028-039
  title: Starting price lookup follows the chain of REQ-028-040
  attrs:
    statement: |-
      For each displayed location System looks up the starting price by the chain of REQ-028-040.
    rationale: 'Main Flow: Patient Views Personalized Location Recommendations step 8. The chain is stated once in REQ-028-040.'
- op: update_node
  id: REQ-028-040
  title: Starting price lookup chain, always shown in the patient's currency
  attrs:
    statement: |-
      System follows one lookup chain for the starting price of a displayed location, always shown in the patient's currency: (1) the price for the location in the patient's currency; (2) else the fallback price for the patient's country, where a fallback row already in the patient's currency is preferred; (3) else the system-wide default starting price; (4) else the price in the location's default currency; (5) else "Price available on request" with an error logged for admin review (REQ-028-041). A price found in another currency at steps 2 to 4 is converted with the FR-029 conversion rate with markup and marked "approx." ("Starting from approx. £2,500").
    rationale: A6 and the second edge case. This is the only statement of the chain; REQ-028-004, REQ-028-039, REQ-028-085 and REQ-028-087 point to it.
- op: update_node
  id: REQ-028-041
  title: 'No price can be shown: Price available on request, error logged, banner on Screen 2'
  attrs:
    statement: |-
      When no price can be shown by the chain of REQ-028-040 (no fallback or system-wide default, and currency conversion unavailable), System displays the location without a starting price, shows the text "Price available on request" to the patient and logs an error for admin review; Screen 2 shows the banner "[Location] missing fallback pricing - patients seeing no price estimate."
- op: update_node
  id: REQ-028-046
  title: The save confirmation is the on-screen message only
  attrs:
    statement: |-
      The save confirmation of a regional grouping change or a starting price change is the on-screen message only; System sends no separate notification.
    rationale: Communication Structure, In Scope.
- op: update_node
  id: REQ-028-049
  title: Entry points to regional configuration, pricing and preview
  attrs:
    statement: |-
      Admin reaches the configuration at Settings > General Settings, on the Location Presentation by Country tab, the Location Pricing tab or the Location Display Preview tab, with the FR-031 permission "Manage App Data", and changes take effect on save within the 1-minute cache propagation. Patient reaches it through the "Choose Your Destination" screen of the quote request flow, where System reads the patient's country from the profile, applies the regional configuration to order the destinations, and shows starting prices in the patient's currency.
    rationale: Entry Points; the PRD names the three tabs.
- op: update_node
  id: REQ-028-050
  attrs:
    statement: |-
      After a successful save System confirms: "Regional grouping saved. Changes will be live for patients within 1 minute." for a grouping; "Starting price for [Location] in [Currency] set to [Amount]." for a price; "Fallback pricing enabled for [Location]. Patients from [Country] without specific pricing will see these prices." for fallback pricing; "[X] currency prices updated for [Location]." for a bulk update; an on-screen success message for a location default currency and for the system-wide default starting price.
- op: update_node
  id: REQ-028-055
  title: Decimal places follow the currency's minor units in the FR-029 catalogue
  attrs:
    statement: |-
      System enforces the decimal places of the currency's minor units in the FR-029 currency catalogue (ENT-currency.minor_units) for every starting price, including fallback prices and bulk-updated prices.
    rationale: 'Main Flow: Starting Prices step 10 and Screen 2 Decimal Precision.'
- op: update_node
  id: REQ-028-057
  attrs:
    statement: |-
      Admins can update all currency prices of one destination at once by a percentage increase or decrease or a fixed amount adjustment; System shows a preview of the new prices for all currencies, the admin enters a change reason and confirms, and System saves all currency price updates simultaneously. A bulk apply whose result would break the amount, decimals or currency checks (REQ-028-053 to REQ-028-055) is blocked.
- op: update_node
  id: REQ-028-060
  title: A future effective date keeps the current price in use until then, as a new row
  attrs:
    statement: |-
      If a price's effective date is in the future, the change is a new row (REQ-028-090) and the current pricing remains in use until the effective date; without an effective date pricing is effective immediately.
- op: update_node
  id: REQ-028-061
  title: Expiry date after effective date; banner on Screen 2 7 days before expiry
  attrs:
    statement: |-
      A price expiry date, when set, MUST be after the effective date, and a banner on Screen 2 warns the admin 7 days before the price expiry date.
- op: update_node
  id: REQ-028-063
  title: Price history is read from the configuration change audit log
  attrs:
    statement: |-
      System keeps no separate price history; the history of all price changes for audit and trend analysis is read from the configuration change audit log (REQ-028-014).
- op: update_node
  id: REQ-028-075
  title: 'Preview inputs: a valid country and a currency defaulting to the FR-029 system default currency'
  attrs:
    statement: |-
      The preview requires a patient country that is valid in the system and a patient currency preference, which defaults to the FR-029 system default currency.
- op: update_node
  id: REQ-028-082
  title: 'Concurrent edits: a stale-edit warning before overwriting'
  attrs:
    statement: |-
      When another admin saved the same regional grouping, price row or bulk-updated price since this admin opened it (or since the bulk update preview), System warns "This [grouping or price] was modified by [Admin Name] at [Time]. Your changes will overwrite theirs. Continue?" and saves only when the admin confirms.
    rationale: 'Fourth edge case, A1 step 5, Main Flow: Starting Prices step 9 and A4 step 7.'
- op: update_node
  id: REQ-028-085
  title: 'Configuration unavailable: default ordering and Price available on request'
  attrs:
    statement: |-
      If the regional configuration is unavailable, System falls back to default location ordering and shows "Price available on request" (REQ-028-041).
- op: update_node
  id: REQ-028-086
  title: A destination is a country from the FR-026 active country list
  attrs:
    statement: |-
      The destination chosen for a starting price, and each destination in a grouping's location order, MUST be a country from the FR-026 active country list, the same key as the inquiry treatment countries (ENT-inquiry.treatment_countries).
    rationale: Screen 2 field Destination Location and Main Flow step 5 of the grouping flow.
- op: update_node
  id: REQ-028-087
  title: Price stops showing after its expiry date; the next step of the lookup chain shows
  attrs:
    statement: |-
      After a starting price's expiry date has passed, patients MUST no longer see that price; the next step of the lookup chain (REQ-028-040) applies. Prices with no expiry date stay active until an admin changes them
- op: update_node
  id: REQ-028-089
  attrs:
    statement: |-
      System MUST let admins set a default currency for each destination location; it is the same on every price row of that location

# ---- Step titles -----------------------------------------------------------
- {op: update_node, id: STP-028-402, title: 'System reads the patient''s country from the profile'}
- {op: update_node, id: STP-028-403, title: 'System takes the profile country as the matching key'}
- {op: update_node, id: STP-028-414, title: 'System shows starting prices by the price lookup chain'}
- {op: update_node, id: STP-028-423, title: 'System displays the fallback price, converted and marked approx. when it is in another currency'}
- {op: update_node, id: STP-028-424, title: 'System displays the price in the location''s default currency converted to the patient''s currency and marked approx. when there is no fallback and no system-wide default'}
- {op: update_node, id: STP-028-427, title: 'System displays the system-wide default starting price when an admin has set one, converted and marked approx. when it is in another currency'}

# ---- New edges: rules to fields and settings --------------------------------
- {op: add_edge, from: REQ-028-033, verb: applies to, to: ENT-regional-grouping.locations_displayed}
- {op: add_edge, from: REQ-028-003, verb: applies to, to: ENT-patient.country}
