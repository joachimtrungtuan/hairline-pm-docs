  - {"op": "add_field", "id": "ENT-installment-plan.cancellation_point_days", "entity_id": "ENT-installment-plan", "name": "cancellation_point_days", "data_type": "int", "title": "Cancellation point days", "owner_fr": "FR-007B", "attrs": {"description": "The FR-029 Unpaid Balance Cancellation Point in force at confirmation (days after the first missed due date); empty when it was unset, in which case nothing cancels automatically. Saved on the plan and shown on Screen 1 when set."}}
