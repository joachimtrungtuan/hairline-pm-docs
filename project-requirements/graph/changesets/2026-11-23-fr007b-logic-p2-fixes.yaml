reason: "FR-007B logic review pass 2: the support-required marker also pauses the cancellation-point count and the FR-006 B8 hand-off; paused installments on a Defaulted plan carry no flag, notice, reminder or fee and are charged once at the next daily run when the plan returns to Active, whoever paid; Mark as Resolved is limited to a recorded bank transfer approved by a second billing admin; the late fee has a currency, a base, stays outside the clinic share, waits for retries, lapses with the plan and is returned on a provider-fault refund; the plan keeps the late fee, grace period and cancellation point as confirmed and Screen 1 shows them; a date change keeps the due dates; only enabled counts are offered; early payment with Pay now; the provider list covers every plan status; insufficient funds is retried and hard declines are defined; one void step runs before the refund and sets the plan Cancelled; guards go on the edges and the edges of retired steps are removed. Written, not applied."
by: docs-manager
operations:
  - {"op": "update_node", "id": "REQ-007B-018", "title": "Retryable failures retried after waits of 1, 3 and 7 days; no automatic retry after a hard decline", "attrs": {"statement": "System MUST execute 3 automatic retry attempts for an installment whose charge failed for a retryable reason (any failure except a hard decline, so a technical fault or insufficient funds), with waits of 1 day, 3 days and 7 days (retries fall on day 1, day 4 and day 11 after the failure). A hard decline is a refusal because the card is expired, lost, stolen, invalid or flagged for fraud. After a hard decline, or when a retry returns one, System MUST NOT retry automatically and MUST cancel the retries still pending; it MUST notify the patient, who must use Pay now or update the card, and the installment becomes Defaulted on day 11 after the due date if still unpaid. Admin retries do not count toward the 3 automatic retries"}}
  - {"op": "update_node", "id": "REQ-007B-022", "attrs": {"rationale": "PRD id REQ-007b-022 (prd.md line 852). Restated by Alternative Flow B2 step 2, the Admin scope (process refunds for cancelled bookings with partial installments) and Screen 6 (Cancel Plan calculates refunds per cancellation policy)."}}
  - {"op": "update_node", "id": "REQ-007B-023", "title": "Remaining installments voided with the booking, before the refund is computed", "attrs": {"statement": "System MUST cancel remaining installments when booking is cancelled. The void is one step shared by the admin cancellation, the provider-fault cancellation and the unpaid-balance cancellation: it runs before the refund is computed, waits for any charge in flight, sets the plan Cancelled, and adds a charge that still succeeds to the refund base. Stopping the installments and the refund happen inside the FR-006 Cancel Booking action, and installment plans have no separate cancel action"}}
  - {"op": "update_node", "id": "REQ-007B-024", "title": "Date change keeps the due dates and recalculates the final payment deadline, or is blocked when no plan fits", "attrs": {"statement": "System MUST handle an admin date change by keeping the due dates, count and amounts and recalculating the Final Payment Deadline from the new date; when the remaining installments cannot all stay at least the cutoff days before it, System MUST return no feasible plan and FR-006 blocks the change"}}
  - {"op": "update_node", "id": "REQ-007B-027", "attrs": {"statement": "When the provider fails after acceptance (FR-006 Alternative Flows B4 and B5 only), System MUST cancel remaining installments with no patient cancellation fee. On a provider withdrawal, drop-out, suspension or deactivation, System MUST refund in full every installment already paid and any late fee already collected, and the replacement booking takes a new payment per FR-006 Alternative Flows B4 and B5. The FR-006 unpaid-balance cancellation does not take this path: it takes the refund ladder"}}
  - {"op": "update_node", "id": "REQ-007B-030", "title": "Provider list covers the provider's own bookings with an installment plan of any status", "attrs": {"statement": "The provider installment plans list includes every installment plan, whatever its status, on the current provider's bookings (no one-time payments); clicking a row opens the shared Booking Installment Plan Detail screen for that booking."}}
  - {"op": "update_node", "id": "REQ-007B-036", "title": "Patient may choose any enabled count from 2 up to the maximum", "attrs": {"statement": "Patient can choose fewer installments than the maximum available (pay faster) and may select any enabled count (FR-029) from 2 to the maximum available; when no enabled count fits the installment option is not shown; the same cutoff window is maintained and the payment schedule adjusts."}}
  - {"op": "update_node", "id": "REQ-007B-060", "attrs": {"statement": "The admin date change, made through the FR-006 Change Appointment action and notified to the patient and provider through booking.rescheduled, triggers an installment plan check against the updated booking date; the plan total, currency and the accepted snapshot do not change. Patient self-service rescheduling remains deferred to V2."}}
  - {"op": "update_node", "id": "REQ-007B-061", "title": "Sufficient time: due dates stay and the final payment deadline is recalculated", "attrs": {"statement": "After a date change the system checks whether every remaining installment, on its existing due date, still falls at least the cutoff days (the cutoff saved on the plan) before the new procedure date; if so, the due dates, count and amounts stay as they were, the system recalculates only the Final Payment Deadline from the new date and returns the schedule to FR-006 Screen 8 read-only."}}
  - {"op": "update_node", "id": "REQ-007B-066", "attrs": {"statement": "Reducing the number of installments mid-plan is not supported; on an Active plan the patient can pay the next scheduled installment or all remaining installments early with Pay now, in due-date order, and the due dates of unpaid ones do not change."}}
  - {"op": "update_node", "id": "REQ-007B-080", "attrs": {"statement": "The admin can perform Retry Charge on a Failed installment or one flagged Overdue (invokes the payment processor via S-02). Admin retries do not count toward the 3 automatic retries; on success the installment is Paid and the plan follows REQ-007B-108, on failure it returns to Failed and the plan is unchanged."}}
  - {"op": "update_node", "id": "REQ-007B-081", "title": "Admin Mark as Resolved settles an installment only as a recorded bank transfer a second billing admin approves", "attrs": {"statement": "The admin can Mark as Resolved an unpaid installment only for a bank transfer into Hairline's account: the admin enters the amount, date, receiving account and reference, and a second billing admin approves it (REQ-007B-109). On approval the system sets the installment Paid with payment source manual and passes the payment to FR-007; the plan then follows REQ-007B-108."}}
  - {"op": "update_node", "id": "REQ-007B-084", "attrs": {"statement": "Retry Charge is logged with installment ID and retry attempt number; Mark as Resolved with installment ID, amount, date, receiving account, reference and the approving admin."}}
  - {"op": "update_node", "id": "REQ-007B-099", "attrs": {"statement": "A late fee is added once to an installment when the late payment grace period saved on the plan, counted from the due date, passes with the installment unpaid and no automatic retry is pending (the fee waits until the retries end). It is collected with the next successful charge, never as a separate charge, and the refund base excludes it. The fee amount is set by the admin in FR-029 and saved on the plan at confirmation; its currency, base and treatment are in REQ-007B-110."}}
  - {"op": "update_node", "id": "REQ-007B-100", "attrs": {"statement": "Overdue is not a status: it is a calculated flag on the installment, true from the day after its due date while it is unpaid, not Cancelled and not paused on a Defaulted plan, and it is not stored. The plan flag is true while any installment is Overdue."}}
  - {"op": "update_node", "id": "REQ-007B-101", "attrs": {"statement": "An installment is Overdue from the day after its due date while it is unpaid, not Cancelled and not paused on a Defaulted plan. On that day the day's retry runs first; if the installment is still unpaid System sends the patient one overdue notice, which replaces that day's failure notice and states the date on which the booking will be cancelled when the cancellation point is set, and notifies the billing admins once. The provider sees the Overdue banner on the plan detail screen and is notified only when the plan is Defaulted."}}
  - {"op": "update_node", "id": "REQ-007B-102", "attrs": {"statement": "When the Unpaid Balance Cancellation Point saved on the plan is set (the booking was confirmed after FR-029 set it), System hands the Confirmed booking to FR-006 Alternative Flow B8 (cause UnpaidBalance) that many days after the due date of the first missed installment, whatever the retry, grace period or Defaulted state; pending retries and the grace period end with the plan. While the support-required marker is on the count pauses, is not reset, and nothing is handed over (REQ-007B-103). While the point is unset nothing cancels automatically. It covers any unpaid balance."}}
  - {"op": "update_node", "id": "REQ-007B-103", "title": "A pending provider fault pauses every charge, retry, reminder, flag, late fee and cancellation-point hand-off", "attrs": {"statement": "While the booking carries the support-required marker (FR-006 REQ-006-081), System MUST NOT charge, retry, remind, flag Overdue or Defaulted, add a late fee for an installment, or hand the booking to FR-006 Alternative Flow B8, and the retry, grace and cancellation-point clocks are paused, not reset. A card update is still accepted but re-offers no charge. If a replacement is accepted, the replacement plan recalculates all dates (B4); otherwise charges resume at the Screen 10 submit."}}
  - {"op": "update_node", "id": "REQ-007B-105", "title": "Later installments on a Defaulted plan are paused, with no flag or fee, until the plan returns to Active", "attrs": {"statement": "While a plan is Defaulted, System MUST NOT charge its later installments on their due dates. They keep their dates and amounts, are not Overdue, and get no overdue notice, reminder or late fee. When the plan returns to Active (REQ-007B-108), each paused installment whose due date has passed is charged once at the next daily run, before any Overdue flag or notice that day, with the normal failure handling."}}
  - {"op": "update_node", "id": "REQ-007B-106", "attrs": {"statement": "System MUST offer the installment option only when installments are enabled in FR-029, the booking total is at or above the FR-029 minimum booking amount (converted at the locked rate) and the days until the procedure are at least the cutoff days plus 30. The options offered are the enabled counts up to the maximum; when none fits the installment option is not shown and only pay in full is offered. When fewer days remain than the FR-029 balance due days only pay in full is offered."}}
  - {"op": "update_node", "id": "REQ-007B-107", "title": "Retries and the grace period continue past the cutoff; the share moves after the plan is Completed, as FR-007 sets", "attrs": {"statement": "Retries and the grace period continue past the cutoff date. The plan is Completed whenever the final installment is paid, after which the clinic's share moves as FR-007 REQ-007-090 sets, whatever the date."}}
  - {"op": "add_node", "id": "REQ-007B-108", "type": "Rule", "title": "A Defaulted plan returns to Active when nothing is Failed or Overdue, whoever paid", "owner_fr": "FR-007B", "attrs": {"statement": "A Defaulted plan returns to Active when no installment is Failed or Overdue, whoever paid (the patient with Pay now or a new card, an admin Retry Charge, or Mark as Resolved), and becomes Completed when every installment is Paid."}}
