  - {"op": "add_node", "id": "REQ-007B-110", "type": "Rule", "title": "A fixed late fee converts at the accepted rate, a percentage applies to the late installment, and the fee stays outside the clinic share", "owner_fr": "FR-007B", "attrs": {"statement": "A fixed late fee is converted at the plan's accepted exchange rate and a percentage fee applies to the late installment amount. The fee stays outside the clinic's share and commission (owned by FR-029 and FR-007). A fee still uncollected when the plan ends lapses. A provider-fault full refund (REQ-007B-027) returns a collected fee."}}
