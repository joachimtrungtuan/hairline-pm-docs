  - {"op": "update_node", "id": "ENT-installment-payment.late_fee_amount", "attrs": {"description": "Late fee added once to the installment when the grace period passes unpaid and no automatic retry is pending; collected with the next successful charge and excluded from the refund base. A fixed fee is converted at the plan's accepted rate and a percentage applies to the late installment amount; it lapses if never collected before the plan ends (REQ-007B-110)."}}
  - {"op": "update_node", "id": "ENT-installment-payment.payment_source", "attrs": {"description": "How a Paid installment was settled: an automatic charge, or manual when an admin marked a recorded bank transfer resolved after a second billing admin approved it (REQ-007B-109)."}}
  - {"op": "update_node", "id": "ENT-installment-plan.final_payment_deadline", "attrs": {"description": "Date by which all installments must be completed; must meet the configured cutoff rule. An admin date change keeps the due dates and recalculates only this date."}}
  - {"op": "update_node", "id": "ENT-installment-plan.status", "attrs": {"description": "Active, Cancelled, Completed (shown as Fully Paid) or Defaulted. Overdue is not a status: it is the calculated is_overdue flag, not stored. A Defaulted plan returns to Active when no installment is Failed or Overdue (REQ-007B-108); the void on cancellation sets Cancelled (REQ-007B-023)."}}
  - {"op": "update_node", "id": "EVT-installment-overdue-notice", "attrs": {"description": "One notice to the patient and one to the billing admins on the day after an installment due date passes with the installment unpaid, after that day's retry; the patient notice replaces that day's failure notice and states the date on which the booking will be cancelled when the cancellation point is set (REQ-007B-101, REQ-007B-111)."}}
  - {"op": "update_node", "id": "SCR-007B-01", "attrs": {"description": "Allow the patient to select an installment plan at booking checkout. Reached from the Payment Options step (FR-006/FR-007) after the patient selects Pay in Installments; shows the full schedule, the late fee, grace period and cancellation point, an interest-free highlight, a Pay in Full alternative, a plan versus full payment comparison and a calculator. UI controls: installment selector, calculator, Pay in Full option, confirm."}}
  - {"op": "update_node", "id": "SCR-007B-02", "attrs": {"description": "Allow the patient to view the installment payment schedule and history from the booking details screen. UI controls: progress bar, countdown, Update Payment Method button (opens payment method management from the FR-001 menu, REQ-001-151), Pay now button on a Failed or Overdue installment or, on an Active plan, on the next scheduled installment, receipt download."}}
  - {"op": "update_node", "id": "SCR-007B-06", "attrs": {"description": "Actionable view of one booking's installment plan with the Admin Action Panel (Retry Charge, Mark as Resolved), each with a justification of at least 20 characters. Mark as Resolved is only for a recorded bank transfer (amount, date, receiving account, reference) that a second billing admin approves. The panel is a UI control group; its justification is written to the audit log (S-06), not to a graph entity. Cancelling a booking is not a plan action: it uses the FR-006 Cancel Booking action."}}
  - {"op": "update_node", "id": "STP-007B-003", "title": "System displays the enabled installment options up to the maximum"}
  - {"op": "update_node", "id": "STP-007B-403", "title": "If the failure is retryable (any failure except a hard decline), system schedules the first retry after a wait of 1 day"}
  - {"op": "update_node", "id": "STP-007B-410", "title": "On the day after the due date, after that day's retry, with the installment still unpaid, System shows it Overdue, sends the patient one overdue notice that replaces the day's failure notice, and notifies the billing admins once"}
  - {"op": "update_node", "id": "STP-007B-412", "title": "At the FR-029 cancellation point after the first missed due date, System hands the Confirmed booking to FR-006 Alternative Flow B8 whatever the retry or Defaulted state; the count pauses while the support-required marker is on"}
  - {"op": "update_node", "id": "STP-007B-413", "title": "After treatment has started, the admin resolves a Defaulted plan by payment only, with Retry Charge or Mark as Resolved (a recorded bank transfer a second billing admin approves) and no cancel route"}
  - {"op": "update_node", "id": "STP-007B-414", "title": "When the grace period saved on the plan, counted from the due date, has passed with the installment unpaid and no automatic retry pending, System adds the late fee once; the next successful charge collects it"}
  - {"op": "update_node", "id": "STP-007B-601", "title": "System checks that every remaining installment, on its existing due date, still falls at least the cutoff days before the new date"}
  - {"op": "update_node", "id": "STP-007B-603", "title": "The due dates, count and amounts stay; System recalculates the Final Payment Deadline from the new date and returns the schedule to Screen 8 read-only"}
  - {"op": "update_node", "id": "STP-007B-701", "title": "System voids the remaining unpaid installments of the booking before the refund is computed: it waits for any charge in flight and sets the plan Cancelled (common to the provider-fault, admin and unpaid-balance cancellations)", "attrs": {"prd_ref": "Alternative Flow B2 step 4 and B4 step 1"}}
  - {"op": "update_node", "id": "STP-007B-702", "title": "Only on a provider withdrawal, drop-out, suspension or deactivation (B4 and B5), paid installments and any collected late fee are refunded in full with no cancellation fee"}
