  - {"op": "add_node", "id": "REQ-007B-112", "type": "Rule", "title": "On an Active plan Pay now can also pay the next scheduled installment or all remaining ones early", "owner_fr": "FR-007B", "attrs": {"statement": "On an Active plan, Pay now also lets the patient pay the next scheduled installment, or all remaining installments at once, in due-date order; the due dates of unpaid installments do not change, and the plan is Completed when every installment is Paid."}}
