  - {"op": "add_node", "id": "REQ-007B-109", "type": "Rule", "title": "An installment is settled outside the card only as a recorded bank transfer that a second billing admin approves", "owner_fr": "FR-007B", "attrs": {"statement": "Mark as Resolved is used only for a bank transfer into Hairline's account. The admin enters the amount, date, receiving account and reference, and a second billing admin approves it as FR-007 REQ-007-015 sets for refunds, never the same admin; only then is the installment Paid with payment source manual. FR-007 owns the manual payment record, the refund of a manual payment and the clinic-share movement for it."}}
  - {"op": "add_edge", "from": "REQ-007B-109", "verb": "applies at", "to": "STG-main-05-payment"}
