  - {"op": "add_node", "id": "REQ-007B-111", "type": "Rule", "title": "The patient sees the late fee, grace period and cancellation point at checkout, and the plan keeps them as confirmed", "owner_fr": "FR-007B", "attrs": {"statement": "Screen 1 shows the late fee, the grace period and, when set, the cancellation point before the patient confirms. The plan keeps the values in force at confirmation, as it keeps the cutoff days; a later FR-029 change applies only to plans confirmed afterwards. The overdue notice states the date on which the booking will be cancelled when the point is set."}}
