  - {"op": "add_node", "id": "REQ-020-136", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Provider Approval Needed for Platform Discount (promotion.discount_approval_requested)", "attrs": {"statement": "Notification catalog event promotion.discount_approval_requested (Provider Approval Needed for Platform Discount), category Promotions/Discounts. Primary recipients: Provider. Notes: “Approval notifications to providers when new platform discount is created”", "rationale": "Event Catalog table, prd.md line 106. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-137", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Provider Onboarding Requested (provider.onboarding_requested)", "attrs": {"statement": "Notification catalog event provider.onboarding_requested (Provider Onboarding Requested), category Provider/Compliance. Primary recipients: Admin. Notes: New provider onboarding request awaiting review/approval", "rationale": "Event Catalog table, prd.md line 107. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-138", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Provider-Caused Cancellation / Offer Unavailable (provider.status_cancellation_patient)", "attrs": {"statement": "Notification catalog event provider.status_cancellation_patient (Provider-Caused Cancellation / Offer Unavailable), category Provider/Compliance. Primary recipients: Patient. Notes: FR-015 Alternative Flow A5 / Screen 4. One per affected inquiry/case when provider suspension (`ProviderSuspended`) or deactivation (`ProviderDeactivated`) cancels the patient's case or the provider's offer before acceptance. A cancelled unsent draft quote alone does not trigger this notice, because the patient never saw it. For a case already accepted, the patient instead receives `booking.provider_fault_replacement`. Before acceptance, three variants apply (FR-003 Workflow 2 Alternative Flow B4, REQ-003-021): when other offers remain open, the notice says \"[Clinic] is no longer available. Your other offers are still open.\"; when no other live offer remains and the inquiry is redistributed, the notice says \"[Clinic] is no longer available. We are finding new offers for you.\"; when the patient had explicitly selected the affected provider, the notice asks the patient to confirm the redistribution first. Includes inquiry/case reference and a Contact Admin/Support action. MUST NOT say the patient cancelled, instruct payment against the cancelled selection, or expose confidential suspension/deactivation reasons. Mandatory (cannot be disabled in FR-030 rules); sent regardless of FR-015's \"Notify Provider\" checkbox. MVP channels: Email + Push + in-app (global patient toggles still apply to Email/Push; in-app record always created)", "rationale": "Event Catalog table, prd.md line 108. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-139", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Provider-Caused Cancellation — Admin Support Required (provider.status_cancellation_admin_support)", "attrs": {"statement": "Notification catalog event provider.status_cancellation_admin_support (Provider-Caused Cancellation — Admin Support Required), category Provider/Compliance. Primary recipients: Admin. Notes: Same trigger, and also when a provider-status event leaves an `In Progress` booking open and flagged `supportRequired` for an admin decision (move the booking to `Aftercare` with aftercare reassignment, or cancel it with a reason), or leaves an `Aftercare` booking or FR-011 standalone aftercare case flagged for admin aftercare reassignment (FR-006 Alternative Flow B6). Mandatory admin-support alert per affected inquiry/case with patient, inquiry/case reference, prior stage, cause, and FR-016 deep link (Admin Support Required filter). Sent to admins with the FR-031 Respond to Support permission (default roles Super Admin, Aftercare Specialist, and Support Staff); opening the FR-016 list also requires View Patients. Sent regardless of \"Notify Provider\"; pinned as critical in the admin dropdown. No FR-034 ticket is auto-created", "rationale": "Event Catalog table, prd.md line 109. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-140", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Provider Suspended / Deactivated (provider.suspended)", "attrs": {"statement": "Notification catalog event provider.suspended / provider.deactivated (Provider Suspended / Deactivated), category Provider/Compliance. Primary recipients: Provider (Owner only). Notes: FR-015 Screen 4. Sent only when \"Notify Provider\" is checked (default); FR-015 locks it on for deactivations from an FR-032 account-closure request (A7), so `provider.deactivated` is always sent then. For a scheduled change it is sent when the scheduled change is created (with the effective date) and again when it takes effect; with \"Notify Provider\" unchecked it is sent at neither point. Team members are not emailed; they see the FR-032 Rule 6 banner or login message. Email with action taken, admin-provided reason, effective date (if scheduled), and admin support contact. Unaffected by provider FR-032 category preferences (account notice)", "rationale": "Event Catalog table, prd.md line 110. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-141", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Provider Account Activation (Welcome / Set Password) (provider.activation)", "attrs": {"statement": "Notification catalog event provider.activation (Provider Account Activation (Welcome / Set Password)), category Provider/Compliance. Primary recipients: Provider. Notes: FR-015 Main Flow step 13 and Alternative Flow A1. Welcome email with platform introduction, login email, first-login instructions, and the one-time set-password link (expires in 24 hours). Re-sent on A1 resend (previous link invalidated). Mandatory; cannot be disabled in FR-030 rules. Unaffected by FR-032 category preferences. Email only", "rationale": "Event Catalog table, prd.md line 111. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-142", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Owner Login Email Changed (provider.login_email_changed)", "attrs": {"statement": "Notification catalog event provider.login_email_changed (Owner Login Email Changed), category Provider/Compliance. Primary recipients: Provider (old and new login address). Notes: FR-015 Screen 3 Tab 1, Owner login email change by an admin. One email to each address. To the old address: the login email for [clinic] was changed to [new address, partly masked] by a Hairline admin on [date/time]; contact support if this was unexpected. To the new address: this address is now the login email for [clinic]. If the Owner's `password_set` is false, `provider.activation` is also sent to the new address. Mandatory security notice; cannot be disabled in FR-030 rules or by FR-032 category preferences. Email only", "rationale": "Event Catalog table, prd.md line 112. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-143", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Provider Reactivated (provider.reactivated)", "attrs": {"statement": "Notification catalog event provider.reactivated (Provider Reactivated), category Provider/Compliance. Primary recipients: Provider (Owner only). Notes: FR-015 Alternative Flow A6 / Screen 5. Sent only when \"Notify Provider\" is checked (default). Email with reactivation notice, admin-provided reason, and admin support contact; notes that cancelled cases are not restored and, if a scheduled change the provider was notified of was cancelled by the reactivation, that it no longer applies. Mandatory in FR-030 rules when triggered. Unaffected by FR-032 category preferences (account notice)", "rationale": "Event Catalog table, prd.md line 113. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-144", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Scheduled Status Change Cancelled (provider.scheduled_change_cancelled)", "attrs": {"statement": "Notification catalog event provider.scheduled_change_cancelled (Scheduled Status Change Cancelled), category Provider/Compliance. Primary recipients: Provider (Owner only). Notes: FR-015 Screen 4 (Cancel Scheduled Change). Sent when an admin cancels a pending scheduled suspension/deactivation and the scheduled change had \"Notify Provider\" checked. Email states which change was cancelled and its former effective date. When a reactivation cancels the scheduled change automatically, the note is included in `provider.reactivated` instead. Mandatory in FR-030 rules when triggered. Unaffected by FR-032 category preferences (account notice)", "rationale": "Event Catalog table, prd.md line 114. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-145", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Provider Account-Closure Requested (provider.closure_requested)", "attrs": {"statement": "Notification catalog event provider.closure_requested (Provider Account-Closure Requested), category Provider/Compliance. Primary recipients: Admin. Notes: FR-032 Request Account Closure (step 10) / FR-015 A7. Sent to admins with View Providers permission when a provider submits a closure request. Includes provider and clinic name, request date, optional reason, and a deep link to the request in the FR-015 provider profile (Closure Requested filter). Mandatory; cannot be disabled in FR-030 rules. Email + in-app", "rationale": "Event Catalog table, prd.md line 115. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-146", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Provider Account-Closure Request Rejected (provider.closure_rejected)", "attrs": {"statement": "Notification catalog event provider.closure_rejected (Provider Account-Closure Request Rejected), category Provider/Compliance. Primary recipients: Provider. Notes: FR-015 A7 step 6 / FR-032 step 16. Sent when an admin rejects a closure request. Email states that the account stays Active, gives the admin review notes, and the admin support contact. Mandatory; cannot be disabled in FR-030 rules. Unaffected by FR-032 category preferences (account notice). Email only", "rationale": "Event Catalog table, prd.md line 116. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-147", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Provider Document Expiration Warning (provider.document_expiration_warning)", "attrs": {"statement": "Notification catalog event provider.document_expiration_warning (Provider Document Expiration Warning), category Provider/Compliance. Primary recipients: Admin, Provider (optional). Notes: License/credential expiry warnings; timing is policy-driven", "rationale": "Event Catalog table, prd.md line 117. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-148", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: System Escalation (system.escalation)", "attrs": {"statement": "Notification catalog event system.escalation (System Escalation), category System/Operations. Primary recipients: Admin. Notes: Operational escalation events requiring admin action", "rationale": "Event Catalog table, prd.md line 118. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-149", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: System Alert (system.alert)", "attrs": {"statement": "Notification catalog event system.alert (System Alert), category System/Operations. Primary recipients: Admin. Notes: System health/monitoring alerts surfaced via notifications", "rationale": "Event Catalog table, prd.md line 119. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-150", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Analytics Export Ready (analytics.export_ready)", "attrs": {"statement": "Notification catalog event analytics.export_ready (Analytics Export Ready), category System/Operations. Primary recipients: Provider. Notes: FR-014 REQ-014-062/063. A one-off or scheduled provider analytics export (PDF or CSV) has finished generating. Sent to the provider's registered email and each selected recipient; email carries the PDF attachment where applicable plus a secure download link that expires after 48 hours; in-app notification links to Report History. Default channels: email + in-app", "rationale": "Event Catalog table, prd.md line 120. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
