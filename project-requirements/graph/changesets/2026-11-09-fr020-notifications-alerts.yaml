  - {"op": "add_node", "id": "REQ-020-130", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Monitoring Converted to Inquiry (monitoring.converted)", "attrs": {"statement": "Notification catalog event monitoring.converted (Monitoring Converted to Inquiry), category Monitoring. Primary recipients: Patient. Notes: Monitoring case successfully converts into a distinct FR-003 inquiry (FR-037/FR-038)", "rationale": "Event Catalog table, prd.md line 100. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
