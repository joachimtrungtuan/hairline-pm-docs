  - {"op": "add_node", "id": "REQ-020-122", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Aftercare Provider Reassigned (aftercare.provider_reassigned)", "attrs": {"statement": "Notification catalog event aftercare.provider_reassigned (Aftercare Provider Reassigned), category Aftercare. Primary recipients: Patient, Provider (new aftercare provider). Notes: Fired by FR-011 when an admin reassigns an aftercare case to another provider or the Hairline aftercare team, including an `Aftercare` booking reassigned through FR-006 Alternative Flow B6, an `In Progress` booking that the admin moves to `Aftercare` with reassignment, and an FR-011 standalone aftercare case. Tells the patient who now provides aftercare and gives the new provider the case reference; MUST NOT expose confidential suspension or deactivation reasons. No admin alert is sent because the admin is the actor. Mandatory — admin cannot disable this event; not subject to FR-032 provider notification preferences", "rationale": "Event Catalog table, prd.md line 92. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
