  - {"op": "add_node", "id": "REQ-020-012", "type": "Rule", "owner_fr": "FR-020", "title": "quote.accepted outcomes routed per sent parent quote", "attrs": {"statement": "System MUST route FR-005 acceptance outcomes through `quote.accepted` with an explicit `outcome` code and recipient-scoped payload, sending one provider notice per sent parent quote (de-duplicated on acceptance record + parent quote + recipient) and no notice for unsent drafts; the selected-provider and not-selected-provider outcomes MUST NOT be disableable. Non-selected providers MUST receive only their own outcome context and MUST NOT receive the selected provider identity or accepted price; `quote.declined` MUST NOT represent FR-005 system-generated sibling or competing-parent outcomes.", "rationale": "Functional Requirements Summary, prd.md line 493. Also stated at line 305 (privacy allowlist) and lines 308, 309."}}
  - {"op": "add_node", "id": "REQ-020-013", "type": "Rule", "owner_fr": "FR-020", "title": "Mandatory provider-status cancellation notices", "attrs": {"statement": "System MUST send mandatory `provider.status_cancellation_patient` and `provider.status_cancellation_admin_support` notifications for each record affected by an FR-015 provider suspension/deactivation, regardless of the \"Notify Provider\" checkbox, with privacy-safe patient content (no patient-cancelled wording, no payment instruction, no confidential reason), and MUST use the FR-003 pre-acceptance variants (Workflow 2 Alternative Flow B4, REQ-003-021): \"[Clinic] is no longer available. Your other offers are still open.\" when other offers remain open; \"[Clinic] is no longer available. We are finding new offers for you.\" when the inquiry is redistributed, or a confirmation request first when the patient had explicitly selected the affected provider.", "rationale": "Functional Requirements Summary, prd.md line 494. Also stated at line 302 (Business Rules, Provider-Status Cancellation Notifications): patient content uses provider-caused wording and a Contact Admin/Support action, with the three pre-acceptance variants from FR-003 REQ-003-021 (CR links in the PRD line are not read)."}}
  - {"op": "add_node", "id": "REQ-020-014", "type": "Rule", "owner_fr": "FR-020", "title": "Provider-status email retry without duplicates and recipients", "attrs": {"statement": "System MUST retry failed provider-status notifications without duplicates per provider-status event + affected record + recipient, and MUST send `provider.suspended` / `provider.deactivated` email to the provider Owner only when \"Notify Provider\" is checked; for a scheduled change, the email MUST be sent when the change is created and again when it takes effect. `provider.status_cancellation_admin_support` MUST go to admins with the FR-031 Respond to Support permission, and `provider.reactivated` and `provider.scheduled_change_cancelled` MUST go to the provider Owner only.", "rationale": "Functional Requirements Summary, prd.md line 495. Also stated at line 304 and line 302 (retry per Flow B2, de-duplicated on provider-status event + affected record + recipient)."}}
  - {"op": "add_node", "id": "REQ-020-015", "type": "Rule", "owner_fr": "FR-020", "title": "Mandatory provider.activation and login-email notices", "attrs": {"statement": "System MUST always send `provider.activation` (non-disableable) when FR-015 creates a provider or a resend is requested, and MUST send `provider.reactivated` and `provider.scheduled_change_cancelled` to the provider when FR-015's \"Notify Provider\" applies; these events MUST NOT be suppressed by FR-030 toggles or FR-032 category preferences. System MUST always send `provider.login_email_changed` to the old and the new address when an admin changes the Owner login email in FR-015.", "rationale": "Functional Requirements Summary, prd.md line 496. Also stated at line 304: provider.activation is mandatory because without it a new provider cannot set a password; provider.login_email_changed is a security notice to the old and the new address."}}
  - {"op": "add_node", "id": "REQ-020-016", "type": "Rule", "owner_fr": "FR-020", "title": "Closure request and rejection notices are mandatory", "attrs": {"statement": "System MUST send `provider.closure_requested` to admins when a provider submits an FR-032 account-closure request and `provider.closure_rejected` to the provider when an admin rejects it, and MUST always send `provider.deactivated` for a deactivation that processes a closure request; these events MUST NOT be suppressed by FR-030 toggles or FR-032 category preferences.", "rationale": "Functional Requirements Summary, prd.md line 497. Also stated at line 304 (account-closure events)."}}
  - {"op": "add_node", "id": "REQ-020-017", "type": "Rule", "owner_fr": "FR-020", "title": "Mandatory quote and booking events; admin-configurable reminders", "attrs": {"statement": "System MUST send `quote.withdrawn` (before and after acceptance), `booking.payment_window_expired`, `booking.revived`, `booking.provider_fault_replacement` and `treatment.plan_changed` as mandatory notifications that FR-030 toggles cannot disable, and MUST send `quote.expiring_soon` and `booking.hold_expiring_soon` at the FR-026 lead times when enabled in FR-030.", "rationale": "Functional Requirements Summary, prd.md line 498. Locks restated at line 313."}}
  - {"op": "add_node", "id": "REQ-020-018", "type": "Rule", "owner_fr": "FR-020", "title": "Quote and booking notices use parent-level and snapshot variables", "attrs": {"statement": "System MUST render pre-acceptance quote notifications with parent-level variables only (\"From\" price with currency, option count, treatment, expiry) and no single quote total, MUST resolve post-acceptance money variables (price, currency, date range, appointment, promotion) from the accepted snapshot, and MUST NOT carry changed money values in treatment events.", "rationale": "Functional Requirements Summary, prd.md line 499. Also stated at lines 310, 311, 312: pre-acceptance notices use only the From price (lowest subquote price in the parent quote) with currency, option count, treatment, expiry date, provider name and parent quote reference; a single quote total does not exist and MUST NOT be offered as a variable; booking.* appointment variables resolve from the booking's current appointment, with the accepted appointment kept as baseline; booking.rescheduled carries both the previous and the new appointment; treatment events may use the current treatment plan, clinicians and graft count and MUST NOT carry changed money values."}}
  - {"op": "add_node", "id": "REQ-020-019", "type": "Rule", "owner_fr": "FR-020", "title": "Acceptance sends the patient only booking.scheduled", "attrs": {"statement": "At acceptance, System MUST send the patient only `booking.scheduled` and no `quote.accepted` notice, MUST send `quote.accepted` only to the accepted provider and the not-selected providers, and MUST NOT send an admin notification for the acceptance. Admins MUST be alerted only for the exceptions `booking.hold_expiring_soon`, `booking.payment_window_expired`, `booking.provider_fault_replacement` and `quote.withdrawn` when the withdrawn quote was already accepted; `quote.withdrawn` MUST always reach the patient and MUST NOT alert admins for a withdrawal before acceptance.", "rationale": "Functional Requirements Summary, prd.md line 500. Also stated at lines 314 and 315: admins are alerted only for exceptions on the quote-to-booking path (a slot hold expiring while the first payment is unpaid, Payment Window Expired, provider fault, and a provider withdrawing a quote that was already accepted), and routine acceptances are visible on admin dashboards only; the same applies to an admin-authored replacement acceptance in the FR-006 provider-fault transfer."}}
  - {"op": "add_node", "id": "REQ-020-020", "type": "Rule", "owner_fr": "FR-020", "title": "quote.cancelled_inquiry always sent to affected providers", "attrs": {"statement": "System MUST always send `quote.cancelled_inquiry` to each provider whose quote is auto-cancelled by an inquiry cancellation; neither FR-030 toggles nor FR-032 provider notification preferences may suppress it.", "rationale": "Functional Requirements Summary, prd.md line 501."}}
  - {"op": "add_node", "id": "REQ-020-021", "type": "Rule", "owner_fr": "FR-020", "title": "booking.scheduled to patient only; booking.rescheduled to both", "attrs": {"statement": "System MUST send `booking.scheduled` to the patient only, as a mandatory event, both when the patient accepts a subquote and when an admin-authored replacement acceptance creates a replacement booking. System MUST send the mandatory `booking.rescheduled` to the patient and the provider when an admin changes the appointment, with the previous and the new appointment. Booking notices MUST read the booking's current appointment. No mandatory provider event may be suppressed by FR-032 provider notification preferences.", "rationale": "Functional Requirements Summary, prd.md line 502. The last sentence (no mandatory provider event is suppressed by FR-032 preferences) is also stated at line 300 and line 313."}}
  - {"op": "add_node", "id": "REQ-020-022", "type": "Rule", "owner_fr": "FR-020", "title": "aftercare.provider_reassigned and supportRequired notices", "attrs": {"statement": "System MUST send the mandatory `aftercare.provider_reassigned` notice, produced by FR-011, to the patient and the new aftercare provider whenever an admin reassigns an aftercare case, with no admin alert, and MUST send `provider.status_cancellation_admin_support` when a provider-status event leaves an `In Progress` booking open and flagged `supportRequired` for an admin decision; such a booking MUST NOT fire `booking.provider_fault_replacement`.", "rationale": "Functional Requirements Summary, prd.md line 503. Also stated at line 303: produced only by FR-011, goes to the patient and the new aftercare provider, cannot be disabled in FR-030 rules, no admin alert because the admin performs the reassignment."}}
  - {"op": "add_node", "id": "REQ-020-024", "type": "Rule", "owner_fr": "FR-020", "title": "Patient platform receives notifications and shows history", "attrs": {"statement": "Patient Platform (FR-001: Patient Authentication & Profile Management): Receive push/email notifications; manage global Email/Push toggles (MVP) and view notification history (listing specified in FR-020).", "rationale": "prd.md line 26."}}
  - {"op": "add_node", "id": "REQ-020-025", "type": "Rule", "owner_fr": "FR-020", "title": "Provider platform receives notifications and shows dropdown", "attrs": {"statement": "Provider Platform (FR-032: Provider Dashboard Settings & Profile Management / PR-06): Receive notifications for inquiries, quotes, bookings, payments, and messages; manage notification preferences; view notifications via dropdown.", "rationale": "prd.md line 27."}}
  - {"op": "add_node", "id": "REQ-020-026", "type": "Rule", "owner_fr": "FR-020", "title": "Admin platform receives catalog events, configures policy", "attrs": {"statement": "Admin Platform (FR-030: Notification Rules & Configuration + FR-020 dropdown): Receive notifications for configurable events per FR-030 event catalog; configure default notification policies, SMS enablement, throttling thresholds, and view delivery dashboards; view notifications via dropdown.", "rationale": "prd.md line 28."}}
  - {"op": "add_node", "id": "REQ-020-027", "type": "Rule", "owner_fr": "FR-020", "title": "Affiliate payout notifications when program enabled", "attrs": {"statement": "Affiliate Program (if enabled): Receive affiliate payout notifications; configuration is managed via FR-030 event catalog and rules.", "rationale": "prd.md line 29."}}
  - {"op": "add_node", "id": "REQ-020-028", "type": "Rule", "owner_fr": "FR-020", "title": "Unified Notification Service orchestrates channels", "attrs": {"statement": "Shared Services (S-03): Unified Notification Service orchestrating channels (email, push, and SMS in future phases) with templates, throttling, and delivery tracking. SMS delivery is not implemented in MVP and is treated as a future enhancement.", "rationale": "prd.md line 30. The SMS-in-future-phases wording is part of the open question on REQ-020-003."}}
  - {"op": "add_node", "id": "REQ-020-029", "type": "Rule", "owner_fr": "FR-020", "title": "FR-030 catalog is the source of truth; FR-030 prevails", "attrs": {"statement": "**Source of truth**: `FR-030: Notification Rules & Configuration` (Admin-Configurable Notification Event Catalog). The table below mirrors FR-030 for completeness; **if any mismatch exists, FR-030 prevails**.", "rationale": "prd.md line 37. Also line 38 and line 306."}}
  - {"op": "add_node", "id": "REQ-020-030", "type": "Rule", "owner_fr": "FR-020", "title": "SMS channel is not available in MVP", "attrs": {"statement": "Channels: email, push; SMS is an optional/configurable channel for urgent events in the target architecture but is **not available in MVP** (no SMS notifications are sent until a later phase explicitly enables this capability).", "rationale": "prd.md line 122. Also line 30. Conflicts with REQ-020-003: see the open question in the migration report."}}
  - {"op": "add_node", "id": "REQ-020-031", "type": "Rule", "owner_fr": "FR-020", "title": "Patient per-category preferences deferred to V2", "attrs": {"statement": "**Patients**: global Email/Push toggles (managed in FR-001: Patient Authentication & Profile Management, Settings → Notifications section); per‑category preferences deferred to V2 (not in scope).", "rationale": "prd.md line 124. Also line 132 (Out of Scope) and line 299."}}
  - {"op": "add_node", "id": "REQ-020-032", "type": "Rule", "owner_fr": "FR-020", "title": "quote.declined is post-MVP and hidden", "attrs": {"statement": "Quote Declined (`quote.declined`): Post-MVP and hidden, as in the FR-030 Post-MVP / Hidden Events list. It is reserved for an explicit governed decline flow; no MVP producer exists because patients have no explicit decline action (FR-005). FR-005 sibling Not Selected and competing-parent cancellation outcomes do not use this event.", "rationale": "prd.md line 133."}}
  - {"op": "add_node", "id": "REQ-020-033", "type": "Rule", "owner_fr": "FR-020", "title": "Entry points: system events and Settings, Notifications", "attrs": {"statement": "System events published by core modules (inquiry, quote, booking, payment, chat, scheduling, aftercare) trigger notifications via S-03. Users access Settings → Notifications to set global Email/Push toggles (MVP).", "rationale": "prd.md line 137."}}
  - {"op": "add_node", "id": "REQ-020-034", "type": "Rule", "owner_fr": "FR-020", "title": "Event emitted with type, actor, subject and recipient id", "attrs": {"statement": "Event emitted with payload (type, actor, subject, recipient id).", "rationale": "prd.md line 152. Main Flow step 1."}}
  - {"op": "add_node", "id": "REQ-020-035", "type": "Rule", "owner_fr": "FR-020", "title": "Service evaluates preferences and throttling, then routes", "attrs": {"statement": "Notification Service evaluates preferences and throttling. Builds message from template and routes to enabled channels.", "rationale": "prd.md line 153. Main Flow steps 2 and 3."}}
  - {"op": "add_node", "id": "REQ-020-036", "type": "Rule", "owner_fr": "FR-020", "title": "Delivery attempt and status recorded with audit", "attrs": {"statement": "Records delivery attempt and status; exposes audit.", "rationale": "prd.md line 155. Main Flow step 4."}}
  - {"op": "add_node", "id": "REQ-020-037", "type": "Rule", "owner_fr": "FR-020", "title": "SMS path only when enabled and urgent", "attrs": {"statement": "(If SMS enabled and urgent) include SMS path; else email/push only.", "rationale": "prd.md line 156. Main Flow step 5."}}
  - {"op": "add_node", "id": "REQ-020-038", "type": "Rule", "owner_fr": "FR-020", "title": "A1: disabled channel suppressed, others still attempted", "attrs": {"statement": "Preference Disabled. Trigger: Recipient has disabled Email or Push. Outcome: Channel suppressed; delivery attempted on remaining enabled channels.", "rationale": "prd.md line 160. Alternative Flow A1 (lines 160 to 162)."}}
  - {"op": "add_node", "id": "REQ-020-039", "type": "Rule", "owner_fr": "FR-020", "title": "B1: excessive events coalesced or deferred, suppression audited", "attrs": {"statement": "Throttling. Trigger: Excessive events in short time window. Outcome: Coalesce or defer per policy; record suppression in audit.", "rationale": "prd.md line 164. Alternative Flow B1."}}
  - {"op": "add_node", "id": "REQ-020-040", "type": "Rule", "owner_fr": "FR-020", "title": "B2: channel failure retried with backoff, failover when configured", "attrs": {"statement": "Channel Failure. Trigger: Email/push/SMS provider unavailable. Outcome: Retry with backoff; failover when configured; status reflects failure cause.", "rationale": "prd.md line 168. Alternative Flow B2."}}
  - {"op": "add_node", "id": "REQ-020-041", "type": "Rule", "owner_fr": "FR-020", "title": "One notification record per attempt", "attrs": {"statement": "One notification record per attempt with channel, provider, status, and timestamp.", "rationale": "prd.md line 330."}}
  - {"op": "add_node", "id": "REQ-020-042", "type": "Rule", "owner_fr": "FR-020", "title": "Throttling and suppression visible in audit logs", "attrs": {"statement": "Throttling and suppression policies are transparent in audit logs.", "rationale": "prd.md line 331."}}
  - {"op": "add_node", "id": "REQ-020-043", "type": "Rule", "owner_fr": "FR-020", "title": "Event handlers are idempotent and retried with backoff", "attrs": {"statement": "Event-driven design; idempotent handlers; retries with backoff.", "rationale": "prd.md line 381. Implementation Notes: promoted because idempotency is a business rule."}}
  - {"op": "add_node", "id": "REQ-020-044", "type": "Rule", "owner_fr": "FR-020", "title": "No sensitive content in notifications; deep links secured", "attrs": {"statement": "Privacy: no sensitive content in notifications; deep links use secure tokens.", "rationale": "prd.md line 383. Implementation Notes: promoted privacy rule."}}
  - {"op": "add_node", "id": "REQ-020-045", "type": "Rule", "owner_fr": "FR-020", "title": "Mandatory provider events ignore FR-032 preferences", "attrs": {"statement": "Every event that is mandatory for providers (`quote.cancelled_inquiry`, the selected-provider and not-selected-provider outcomes of `quote.accepted`, `booking.payment_window_expired`, `booking.revived` and `booking.rescheduled`) is delivered regardless of these preferences.", "rationale": "prd.md line 300. Repeated at line 313: no mandatory provider event is subject to FR-032 provider notification preferences."}}
  - {"op": "add_node", "id": "REQ-020-046", "type": "Rule", "owner_fr": "FR-020", "title": "Admin recipients and coverage come from the FR-030 catalog", "attrs": {"statement": "Admin recipients and event coverage are defined by the FR-030 event catalog and configured rules (no additional hard-coded admin event list in FR-020).", "rationale": "prd.md line 301."}}
  - {"op": "add_node", "id": "REQ-020-047", "type": "Rule", "owner_fr": "FR-020", "title": "Notification content managed in FR-030 template editor", "attrs": {"statement": "Notification Content Management: Notification content (titles, messages, templates) is managed in FR-030: Notification Rules & Configuration via the Notification Template Editor. Notification Content Management: Notification templates (email, push, SMS) are managed in FR-030: Notification Rules & Configuration via the Notification Template Editor, which supports dynamic variables, multi-language content, rich text formatting (email), and preview capabilities.", "rationale": "prd.md line 332. Repeated at line 384 (Implementation Notes)."}}
  - {"op": "add_node", "id": "REQ-020-048", "type": "Rule", "owner_fr": "FR-020", "title": "General email templates in FR-030, OTP templates in FR-026", "attrs": {"statement": "General notification email templates: Managed in FR-030 (Notification Rules & Configuration) with support for dynamic variables, multi-language content, rich text formatting, and preview capabilities. OTP email templates (verification, password reset): Managed in FR-026 (App Settings & Security Policies) as part of authentication settings.", "rationale": "prd.md line 334. Repeated at lines 386 and 387. The FR-026 template setting is cited, not linked, because it is created by the FR-026 change-set."}}
  - {"op": "add_node", "id": "REQ-020-049", "type": "Rule", "owner_fr": "FR-020", "title": "Admin editability of throttling, SMS and channel policy", "attrs": {"statement": "Editable by Admin: Throttling thresholds, SMS enablement, default channel policies, templates. Fixed in Codebase (Not Editable): Supported channels (Email/Push; SMS behind config), baseline event types per FR-030 event catalog. Configurable with Restrictions: Maximum SMS volume, high‑priority categories allowed for SMS.", "rationale": "prd.md line 339. The restrictions on the last two settings are not stated: see the open question in the migration report."}}
  - {"op": "add_node", "id": "REQ-020-050", "type": "Rule", "owner_fr": "FR-020", "title": "SMS costs controlled by caps; only urgent categories use SMS", "attrs": {"statement": "SMS costs are controlled via caps; only urgent categories use SMS.", "rationale": "prd.md line 375. Assumptions section, promoted. User Story 2 scenario 2 (line 416) adds that messages beyond the cap are suppressed and recorded."}}
  - {"op": "add_node", "id": "REQ-020-051", "type": "Rule", "owner_fr": "FR-020", "title": "Quote outcome payloads use a per-recipient allowlist", "attrs": {"statement": "`quote.accepted` carries an explicit `outcome` code and recipient scope. Payload rendering MUST use an allowlist per recipient; non-selected providers MUST NOT receive the selected provider identity, accepted price, or another provider's quote/subquote identifiers.", "rationale": "prd.md line 305."}}
  - {"op": "add_node", "id": "REQ-020-052", "type": "Rule", "owner_fr": "FR-020", "title": "Event producers by FR; lead times set in FR-026", "attrs": {"statement": "FR-004 produces `quote.submitted`, `quote.updated`, `quote.expiring_soon`, `quote.expired` and `quote.withdrawn`. FR-005 produces `quote.accepted` and its outcomes. FR-006 produces `booking.scheduled`, `booking.hold_expiring_soon`, `booking.payment_window_expired`, `booking.revived`, `booking.rescheduled` and `booking.provider_fault_replacement`. FR-010 produces `treatment.plan_changed`. Admin sets the quote-expiring-soon and hold-expiring-soon lead times in FR-026.", "rationale": "prd.md line 307."}}
  - {"op": "add_node", "id": "REQ-020-053", "type": "Rule", "owner_fr": "FR-020", "title": "quote.accepted: one provider notice per sent parent quote", "attrs": {"statement": "One provider notice per sent parent quote, never one per subquote. The de-duplication key is acceptance record + parent quote + recipient. The recipient matrix below shows each population.", "rationale": "prd.md line 308."}}
  - {"op": "add_node", "id": "REQ-020-054", "type": "Rule", "owner_fr": "FR-020", "title": "Unsent drafts cancelled by acceptance send no notice", "attrs": {"statement": "When FR-004 cancels an unsent draft parent quote as `cancelled_other_accepted` because another subquote was accepted, no notification is sent to the drafting provider or anyone else. Only sent parent quotes receive acceptance outcomes.", "rationale": "prd.md line 309."}}
  - {"op": "add_node", "id": "REQ-020-055", "type": "Rule", "owner_fr": "FR-020", "title": "Mandatory events that FR-030 toggles cannot disable", "attrs": {"statement": "`quote.withdrawn`, the selected-provider and not-selected-provider outcomes of `quote.accepted`, `booking.payment_window_expired`, `booking.revived`, `booking.provider_fault_replacement`, `booking.scheduled`, `booking.rescheduled` and `treatment.plan_changed` are mandatory and cannot be disabled in FR-030 rules. `quote.expiring_soon` and `booking.hold_expiring_soon` are admin-configurable.", "rationale": "prd.md line 313."}}
  - {"op": "add_node", "id": "REQ-020-056", "type": "Rule", "owner_fr": "FR-020", "title": "Replacement acceptance: patient gets booking.scheduled, provider quote.accepted", "attrs": {"statement": "The same applies to an admin-authored replacement acceptance in the FR-006 provider-fault transfer: the patient receives `booking.scheduled` with the replacement payment deadline, and the replacement provider receives `quote.accepted` (`selected_subquote_accepted`).", "rationale": "prd.md line 314."}}
  - {"op": "add_node", "id": "REQ-020-057", "type": "Rule", "owner_fr": "FR-020", "title": "Payment window expiry covers the first payment step only", "attrs": {"statement": "`booking.payment_window_expired` covers only the first payment step (deposit or first instalment).", "rationale": "prd.md line 316."}}
  - {"op": "add_node", "id": "REQ-020-058", "type": "Rule", "owner_fr": "FR-020", "title": "quote.accepted recipient matrix by population", "attrs": {"statement": "`quote.accepted` recipient matrix (provider P has sent parent quotes A and B, and the patient accepts one subquote in A): Accepted subquote in parent A: One notice to P for parent A (mandatory); outcome `selected_subquote_accepted`; payload allowlist: Accepted subquote details from the accepted snapshot. Other subquotes in parent A (siblings): No separate notice; listed inside P's parent A notice; outcome `sibling_subquote_not_selected`; payload allowlist: P's own parent A subquote references and outcome. Other sent parent quote of the same provider (parent B): One separate notice to P for parent B (mandatory); outcome `competing_parent_cancelled_other_subquote_accepted`; payload allowlist: Parent B quote and subquote references, outcome and reason. Sent parent quote of any other provider: One notice per parent quote to that provider (mandatory); outcome `competing_parent_cancelled_other_subquote_accepted`; payload allowlist: That provider's own parent quote and subquote references, outcome and reason; no selected provider identity and no accepted price. Unsent draft parent quote of any provider: No notice (draft cancelled silently by FR-004); outcome None; payload allowlist: None. The patient receives no `quote.accepted` notice; at acceptance the patient receives only `booking.scheduled` (Booking Accepted — Slot Held (Pending Payment)) and never receives sibling or competing outcomes. Admins receive no acceptance notice.", "rationale": "prd.md line 318. Statement assembled from the five matrix rows and the closing paragraph (lines 322 to 328)."}}
  - {"op": "add_node", "id": "REQ-020-059", "type": "Rule", "owner_fr": "FR-020", "title": "Notifications listed newest first", "attrs": {"statement": "Notifications sorted by most recent first (newest at top).", "rationale": "prd.md line 198. Repeated on all three screens (lines 198, 228, 264)."}}
  - {"op": "add_node", "id": "REQ-020-060", "type": "Rule", "owner_fr": "FR-020", "title": "Unread notifications visibly highlighted", "attrs": {"statement": "Unread notifications highlighted with visual indicator.", "rationale": "prd.md line 199. Patient screen. Provider and admin screens show the same state as a Read/Unread dot (Read Status field, lines 222 and 257)."}}
  - {"op": "add_node", "id": "REQ-020-061", "type": "Rule", "owner_fr": "FR-020", "title": "Click marks notification read and opens related content", "attrs": {"statement": "Clicking notification marks as read and navigates to related content (if applicable).", "rationale": "prd.md line 200. Repeated on all three screens (lines 200, 230, 267). Patient Action Button gives a deep link to related content, context-dependent (line 194)."}}
  - {"op": "add_node", "id": "REQ-020-062", "type": "Rule", "owner_fr": "FR-020", "title": "Patient filters: All, Unread, By Type", "attrs": {"statement": "Filter options: All, Unread, By Type (Inquiry, Quote, Booking, Payment, Treatment, Aftercare, Account, Messaging).", "rationale": "prd.md line 201. Open question: the type list omits Review, Monitoring, Support and provider-account notices that patients receive."}}
  - {"op": "add_node", "id": "REQ-020-063", "type": "Rule", "owner_fr": "FR-020", "title": "Provider dropdown filters: All, Unread, By Type", "attrs": {"statement": "Filter options within dropdown: All, Unread, By Type (Quote, Booking, Payment, etc.).", "rationale": "prd.md line 232."}}
  - {"op": "add_node", "id": "REQ-020-064", "type": "Rule", "owner_fr": "FR-020", "title": "Admin dropdown filters: All, Unread, Critical, By Type", "attrs": {"statement": "Filter options within dropdown: All, Unread, Critical, By Type (Payment, Aftercare, Booking, Support, etc.).", "rationale": "prd.md line 269."}}
  - {"op": "add_node", "id": "REQ-020-065", "type": "Rule", "owner_fr": "FR-020", "title": "Notifications searchable by content", "attrs": {"statement": "Search functionality: search by notification content.", "rationale": "prd.md line 202. Provider and admin dropdowns search within the dropdown (lines 233, 270)."}}
  - {"op": "add_node", "id": "REQ-020-066", "type": "Rule", "owner_fr": "FR-020", "title": "Unread count badge updates in real time", "attrs": {"statement": "Unread count badge updates in real-time.", "rationale": "prd.md line 229. Provider and admin dropdowns (lines 229, 266). Consolidated notes line 281 name WebSocket or polling as the mechanism (technical, not migrated)."}}
  - {"op": "add_node", "id": "REQ-020-067", "type": "Rule", "owner_fr": "FR-020", "title": "Admin critical notifications pinned above non-critical", "attrs": {"statement": "Critical notifications highlighted with red badge and always shown at top (before non-critical).", "rationale": "prd.md line 265. Also Consolidated Screen Notes line 282."}}
  - {"op": "add_node", "id": "REQ-020-068", "type": "Rule", "owner_fr": "FR-020", "title": "Notifications persist 90 days, then archive", "attrs": {"statement": "Notifications persist for 90 days then archive.", "rationale": "prd.md line 280. Consolidated Screen Notes, Patient listing."}}
  - {"op": "add_node", "id": "REQ-020-069", "type": "Rule", "owner_fr": "FR-020", "title": "Message and title truncated; relative timestamps", "attrs": {"statement": "Message: Read-only, truncated with \"Read more\". Title (provider and admin dropdowns): Read-only, truncated. Timestamp: Read-only, relative time.", "rationale": "prd.md line 191. Screen field validation rules (Screens 1 to 3)."}}
  - {"op": "add_node", "id": "REQ-020-070", "type": "Rule", "owner_fr": "FR-020", "title": "Admin dropdown flags urgent items with a priority badge", "attrs": {"statement": "Priority Indicator: Critical/High priority badge for urgent items. Notification Type: Type indicator (critical, warning, info), read-only, color-coded.", "rationale": "prd.md line 258. Open question: Notification Type (critical, warning, info) and Priority Indicator (Critical/High) may or may not be the same thing; the graph holds two fields."}}
  - {"op": "add_node", "id": "REQ-020-071", "type": "Rule", "owner_fr": "FR-020", "title": "inquiry.cancelled delivered by email and push within 5 minutes", "attrs": {"statement": "Given patient cancels inquiry with 2 active quotes, when cancellation completes, then patient receives `inquiry.cancelled` notification via both email and push within 5 minutes confirming cancellation with reason visible.", "rationale": "prd.md line 437. Promoted from User Story 4 acceptance scenario 1 because it states a delivery time and channel requirement. Change Log line 528 records the SLA alignment."}}
  - {"op": "add_node", "id": "REQ-020-072", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Email Verification / OTP Code (account.email_verification_code)", "attrs": {"statement": "Notification catalog event account.email_verification_code (Email Verification / OTP Code), category Account/Auth. Primary recipients: Patient, Provider, Admin. Notes: Extends FR-026 OTP templates; security-critical and non-disableable by default", "rationale": "Event Catalog table, prd.md line 42. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-073", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Password Reset Code / Link (account.password_reset)", "attrs": {"statement": "Notification catalog event account.password_reset (Password Reset Code / Link), category Account/Auth. Primary recipients: Patient, Provider, Admin. Notes: Security-critical and non-disableable by default", "rationale": "Event Catalog table, prd.md line 43. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-074", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: New Account Created (Welcome / Onboarding) (account.created)", "attrs": {"statement": "Notification catalog event account.created (New Account Created (Welcome / Onboarding)), category Account/Auth. Primary recipients: Patient. Notes: Optional; can be disabled if not needed. Provider onboarding uses `provider.activation` instead", "rationale": "Event Catalog table, prd.md line 44. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-075", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Inquiry Submitted (Provider notified) (inquiry.submitted)", "attrs": {"statement": "Notification catalog event inquiry.submitted (Inquiry Submitted (Provider notified)), category Inquiry. Primary recipients: Provider. Notes: “New inquiry matching clinic/location”", "rationale": "Event Catalog table, prd.md line 45. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-076", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Inquiry Cancelled (inquiry.cancelled)", "attrs": {"statement": "Notification catalog event inquiry.cancelled (Inquiry Cancelled), category Inquiry. Primary recipients: Patient, Provider, Admin (optional). Notes: Patient-initiated inquiry cancellation (FR-003 Workflow 5). Fires when patient cancels inquiry in Inquiry, Quoted, or Accepted stages. Patient receives cancellation confirmation (mandatory — aligns with FR-003 Workflow 5 step 4 and Screen 8b). Cancellation reason is patient-private — provider notification says only \"Inquiry cancelled by patient\". MVP default channels: Email + Push.", "rationale": "Event Catalog table, prd.md line 46. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-077", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Inquiry Response SLA Breached (inquiry.ttfq_sla_breached)", "attrs": {"statement": "Notification catalog event inquiry.ttfq_sla_breached (Inquiry Response SLA Breached), category Inquiry. Primary recipients: Provider. Notes: FR-014 REQ-014-113. Fires once per distributed inquiry/provider pair when the provider has not submitted a parent quote within the FR-026 Analytics Configuration TTFQ SLA target (default 120 minutes) from distribution. Recipients: provider users permitted to respond to inquiries (FR-009). Not sent if the inquiry is cancelled, the distribution is withdrawn, or the provider responds first; never repeated for the same pair. MVP default channel: in-app only; email/push off by default and admin-configurable", "rationale": "Event Catalog table, prd.md line 47. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-078", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Quote Submitted / Ready (Patient notified) (quote.submitted)", "attrs": {"statement": "Notification catalog event quote.submitted (Quote Submitted / Ready (Patient notified)), category Quote. Primary recipients: Patient. Notes: Fired by FR-004 when the provider sends the parent quote; the quote expiry is set and governed by FR-004. The notice shows the \"From\" price (the lowest subquote price in the parent quote, in the quote currency), the option count, the treatment and the expiry date. Exact subquote prices are not shown before acceptance, and no single quote total exists (see Quote, Booking and Treatment-Change Notifications in Business Rules)", "rationale": "Event Catalog table, prd.md line 48. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-079", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Quote Revised (New Version) (quote.updated)", "attrs": {"statement": "Notification catalog event quote.updated (Quote Revised (New Version)), category Quote. Primary recipients: Patient, Provider. Notes: Fired by FR-004 when a new version of an already-sent parent quote is re-sent to the patient. The notice describes the quote as revised (new version). Drafts that were never sent do not fire this event", "rationale": "Event Catalog table, prd.md line 49. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-080", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Quote Expiring Soon (quote.expiring_soon)", "attrs": {"statement": "Notification catalog event quote.expiring_soon (Quote Expiring Soon), category Quote. Primary recipients: Patient, Provider. Notes: Fired by FR-004 once per sent parent quote when the time left before expiry reaches the quote-expiring-soon lead time set by admin in FR-026. Never fired for drafts or for accepted, withdrawn or cancelled quotes. Admin-configurable", "rationale": "Event Catalog table, prd.md line 50. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-081", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Quote Expired (quote.expired)", "attrs": {"statement": "Notification catalog event quote.expired (Quote Expired), category Quote. Primary recipients: Patient, Provider. Notes: Sent on expiry processing completion", "rationale": "Event Catalog table, prd.md line 51. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-082", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Quote Withdrawn (quote.withdrawn)", "attrs": {"statement": "Notification catalog event quote.withdrawn (Quote Withdrawn), category Quote. Primary recipients: Patient, Admin (only when the quote was already accepted). Notes: Fired by FR-004 when a provider withdraws a sent parent quote, before or after acceptance. The patient is always told. Admins receive it as an exception alert only when the withdrawn quote was already accepted; a withdrawal before acceptance is a normal provider action and does not alert admins. After acceptance, FR-006 hands the case to the provider-fault transfer and the patient also receives `booking.provider_fault_replacement`. Mandatory before and after acceptance — admin cannot disable this event", "rationale": "Event Catalog table, prd.md line 52. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-083", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Quote Accepted / Subquote Outcomes (quote.accepted)", "attrs": {"statement": "Notification catalog event quote.accepted (Quote Accepted / Subquote Outcomes), category Quote. Primary recipients: Provider. Notes: FR-005 uses the existing event with `outcome` = `selected_subquote_accepted`, `sibling_subquote_not_selected`, or `competing_parent_cancelled_other_subquote_accepted`. Selected-provider payloads may include the accepted subquote details, read from the accepted snapshot. A non-selected provider receives only its own parent quote/subquote references, its outcome, and reason; selected provider identity and accepted price are excluded. Each provider receives one notice per sent parent quote: the provider of the accepted parent quote receives `selected_subquote_accepted`, with that parent's sibling subquotes listed in the same notice as `sibling_subquote_not_selected`; each other sent parent quote produces one not-selected notice (`competing_parent_cancelled_other_subquote_accepted`) to its provider, including another parent quote of the selected provider. Unsent drafts cancelled by FR-004 produce no notice. The selected-provider and not-selected-provider outcomes are mandatory — admin cannot disable them (see Quote, Booking and Treatment-Change Notifications in Business Rules). The patient is not a recipient: at acceptance the patient receives only `booking.scheduled`. No admin notification is sent for an acceptance", "rationale": "Event Catalog table, prd.md line 53. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-084", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Quote Cancelled (Inquiry Cancelled) (quote.cancelled_inquiry)", "attrs": {"statement": "Notification catalog event quote.cancelled_inquiry (Quote Cancelled (Inquiry Cancelled)), category Quote. Primary recipients: Provider. Notes: Sent to each provider whose quote is auto-cancelled due to patient inquiry cancellation (FR-003 Workflow 5). Provider receipt is mandatory — admin cannot disable this event. Cancellation reason is patient-private — provider notification says only \"Inquiry cancelled by patient\". MVP default channels: Email + Push. Not subject to FR-032 provider notification preferences; FR-032 offers no toggle for this event. Available template variables: `quote.id`, `quote.provider_id`, `inquiry.id`, `inquiry.cancelled_at`; `inquiry.cancellation_reason` is excluded per privacy rule.", "rationale": "Event Catalog table, prd.md line 54. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-085", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Booking Accepted — Slot Held (Pending Payment) (booking.scheduled)", "attrs": {"statement": "Notification catalog event booking.scheduled (Booking Accepted — Slot Held (Pending Payment)), category Booking/Schedule. Primary recipients: Patient. Notes: Fired by FR-006 when subquote acceptance creates the slot hold, or when an admin-authored replacement acceptance in the FR-006 provider-fault transfer creates the replacement booking, before the first payment is confirmed; states the payment deadline (hold expiry). The provider is not a recipient: the accepted or replacement provider learns of the booking through `quote.accepted` (`selected_subquote_accepted`). Mandatory — admin cannot disable this event", "rationale": "Event Catalog table, prd.md line 55. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-086", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Hold Expiring Soon (Payment Reminder) (booking.hold_expiring_soon)", "attrs": {"statement": "Notification catalog event booking.hold_expiring_soon (Hold Expiring Soon (Payment Reminder)), category Booking/Schedule. Primary recipients: Patient, Admin. Notes: Fired by FR-006 once per slot hold when the time left before the hold expires reaches the hold-expiring-soon lead time set by admin in FR-026 and the first payment is still outstanding. Reminds the patient to pay before the slot is released; admins receive it as an exception alert (slot hold expiring while unpaid). Admin-configurable", "rationale": "Event Catalog table, prd.md line 56. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-087", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Payment Window Expired (booking.payment_window_expired)", "attrs": {"statement": "Notification catalog event booking.payment_window_expired (Payment Window Expired), category Booking/Schedule. Primary recipients: Patient, Provider, Admin. Notes: Fired by FR-006 when the slot hold expires before the first payment (deposit or first instalment) succeeds; applies only to that first payment step. Patient is told the booking lapsed and given the recovery routes (cancel and start a new inquiry, or contact support); provider is told the slot is free; admins receive it as an exception alert. Mandatory — admin cannot disable this event", "rationale": "Event Catalog table, prd.md line 57. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-088", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Booking Revived (booking.revived)", "attrs": {"statement": "Notification catalog event booking.revived (Booking Revived), category Booking/Schedule. Primary recipients: Patient, Provider. Notes: Fired by FR-006 when an admin revives a booking after Payment Window Expired. Patient receives the new payment deadline; provider is told the slot is held again. Mandatory — admin cannot disable this event", "rationale": "Event Catalog table, prd.md line 58. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-089", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Provider Unable to Proceed — Replacement Being Arranged (booking.provider_fault_replacement)", "attrs": {"statement": "Notification catalog event booking.provider_fault_replacement (Provider Unable to Proceed — Replacement Being Arranged), category Booking/Schedule. Primary recipients: Patient, Admin. Notes: Fired by FR-006 when an accepted booking is closed for provider fault: the provider withdraws after acceptance, drops out before treatment starts, or is suspended or deactivated after acceptance and before treatment starts (FR-015). An `In Progress` booking is not closed for provider fault and never fires this event; it stays `In Progress` with `supportRequired` for an admin decision. Tells the patient that an admin will arrange a replacement provider within the same inquiry and that the patient pays no cancellation fee; MUST NOT expose confidential suspension or deactivation reasons. Admins receive it as an exception alert so they can arrange the replacement. Providers are not recipients: the replacement provider learns through `quote.accepted` (`selected_subquote_accepted`) from the replacement acceptance, and the faulted provider is not notified by this event. Mandatory — admin cannot disable this event", "rationale": "Event Catalog table, prd.md line 59. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-090", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Booking Confirmed (booking.confirmed)", "attrs": {"statement": "Notification catalog event booking.confirmed (Booking Confirmed), category Booking/Schedule. Primary recipients: Patient, Provider. Notes: Critical", "rationale": "Event Catalog table, prd.md line 60. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-091", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Booking Rescheduled (booking.rescheduled)", "attrs": {"statement": "Notification catalog event booking.rescheduled (Booking Rescheduled), category Booking/Schedule. Primary recipients: Patient, Provider. Notes: Fired by FR-006 when an admin changes the appointment date or time of an `Accepted` or `Confirmed` booking (FR-006 Change Appointment). States the previous and the new appointment, read from the booking's current appointment. Mandatory — admin cannot disable this event; not subject to FR-032 provider notification preferences", "rationale": "Event Catalog table, prd.md line 61. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-092", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Booking Cancelled (booking.cancelled)", "attrs": {"statement": "Notification catalog event booking.cancelled (Booking Cancelled), category Booking/Schedule. Primary recipients: Patient, Provider, Admin (optional). Notes: Include cancellation reason where appropriate", "rationale": "Event Catalog table, prd.md line 62. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-093", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Appointment Reminder (booking.appointment_reminder)", "attrs": {"statement": "Notification catalog event booking.appointment_reminder (Appointment Reminder), category Booking/Schedule. Primary recipients: Patient, Provider. Notes: Scheduled reminders; policy-driven", "rationale": "Event Catalog table, prd.md line 63. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-094", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Treatment Start / Day-1 Starting (treatment.started)", "attrs": {"statement": "Notification catalog event treatment.started (Treatment Start / Day-1 Starting), category Treatment. Primary recipients: Patient, Provider. Notes: “Treatment start notifications”", "rationale": "Event Catalog table, prd.md line 64. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-095", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Treatment Details Changed After Acceptance (treatment.plan_changed)", "attrs": {"statement": "Notification catalog event treatment.plan_changed (Treatment Details Changed After Acceptance), category Treatment. Primary recipients: Patient. Notes: Fired by FR-010 when the clinic or an admin makes an audited change to the treatment plan, assigned clinicians or graft count from booking confirmation (`Confirmed`) onward. States what changed; price, currency and other money terms never change through this path. Mandatory — admin cannot disable this event", "rationale": "Event Catalog table, prd.md line 65. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-096", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Treatment Cancelled (treatment.cancelled)", "attrs": {"statement": "Notification catalog event treatment.cancelled (Treatment Cancelled), category Treatment. Primary recipients: Patient, Provider, Admin (optional). Notes: Used when treatment is cancelled after scheduling/confirmation", "rationale": "Event Catalog table, prd.md line 66. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-097", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Treatment Completed (Post‑Op Instructions) (treatment.completed)", "attrs": {"statement": "Notification catalog event treatment.completed (Treatment Completed (Post‑Op Instructions)), category Treatment. Primary recipients: Patient, Provider, Admin (optional). Notes: Completion confirmation; triggers post-op and aftercare next steps", "rationale": "Event Catalog table, prd.md line 67. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-098", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Treatment Documentation Completed (treatment.documentation_completed)", "attrs": {"statement": "Notification catalog event treatment.documentation_completed (Treatment Documentation Completed), category Treatment. Primary recipients: Provider. Notes: Sent when treatment documentation is successfully saved", "rationale": "Event Catalog table, prd.md line 68. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-099", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Task In Progress Reminder (treatment.task_in_progress_reminder)", "attrs": {"statement": "Notification catalog event treatment.task_in_progress_reminder (Task In Progress Reminder), category Treatment. Primary recipients: Provider. Notes: Reminder for incomplete treatment tasks or documentation", "rationale": "Event Catalog table, prd.md line 69. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-100", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Payment Received / Receipt (payment.received)", "attrs": {"statement": "Notification catalog event payment.received (Payment Received / Receipt), category Payment. Primary recipients: Patient, Provider, Admin (optional). Notes: Critical", "rationale": "Event Catalog table, prd.md line 70. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-101", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Payment Failed (payment.failed)", "attrs": {"statement": "Notification catalog event payment.failed (Payment Failed), category Payment. Primary recipients: Patient, Admin (optional). Notes: Critical", "rationale": "Event Catalog table, prd.md line 71. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-102", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Payment Due Reminder (Installment / Balance) (payment.due_reminder)", "attrs": {"statement": "Notification catalog event payment.due_reminder (Payment Due Reminder (Installment / Balance)), category Payment. Primary recipients: Patient. Notes: “Installment reminder” (split-pay compatible)", "rationale": "Event Catalog table, prd.md line 72. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-103", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Provider Payout Processed (payout.provider_processed)", "attrs": {"statement": "Notification catalog event payout.provider_processed (Provider Payout Processed), category Billing/Payouts. Primary recipients: Provider, Admin (optional). Notes: “They’ve been paid” notification to provider", "rationale": "Event Catalog table, prd.md line 73. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-104", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Affiliate Payout Processed (payout.affiliate_processed)", "attrs": {"statement": "Notification catalog event payout.affiliate_processed (Affiliate Payout Processed), category Billing/Payouts. Primary recipients: Affiliate, Admin (optional). Notes: If affiliate program is enabled", "rationale": "Event Catalog table, prd.md line 74. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-105", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Payout Failed (payout.failed)", "attrs": {"statement": "Notification catalog event payout.failed (Payout Failed), category Billing/Payouts. Primary recipients: Admin, Provider (optional), Affiliate (optional). Notes: Failure processing payout; recipients depend on payout type", "rationale": "Event Catalog table, prd.md line 75. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-106", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: New Message Received (message.received)", "attrs": {"statement": "Notification catalog event message.received (New Message Received), category Messaging/Support. Primary recipients: Patient, Provider, Admin (optional). Notes: Real-time notification for new messages", "rationale": "Event Catalog table, prd.md line 76. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-107", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Support Case Created (support.case_created)", "attrs": {"statement": "Notification catalog event support.case_created (Support Case Created), category Messaging/Support. Primary recipients: Patient, Provider, Admin. Notes: Sent to submitter confirming case creation with case ID; Admin notification if case is urgent or unassigned", "rationale": "Event Catalog table, prd.md line 77. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-108", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Support Case Assigned (support.case_assigned)", "attrs": {"statement": "Notification catalog event support.case_assigned (Support Case Assigned), category Messaging/Support. Primary recipients: Admin. Notes: Sent to assigned admin when case is assigned to them", "rationale": "Event Catalog table, prd.md line 78. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-109", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Support Case Status Changed (support.case_status_changed)", "attrs": {"statement": "Notification catalog event support.case_status_changed (Support Case Status Changed), category Messaging/Support. Primary recipients: Patient, Provider. Notes: Sent when case status changes (Open → In Progress, In Progress → Resolved); includes status update and context", "rationale": "Event Catalog table, prd.md line 79. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-110", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Support Case Admin Reply (support.case_admin_reply)", "attrs": {"statement": "Notification catalog event support.case_admin_reply (Support Case Admin Reply), category Messaging/Support. Primary recipients: Patient, Provider. Notes: Sent when admin replies to case in communication thread; includes message content", "rationale": "Event Catalog table, prd.md line 80. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-111", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Support Case User Reply (support.case_user_reply)", "attrs": {"statement": "Notification catalog event support.case_user_reply (Support Case User Reply), category Messaging/Support. Primary recipients: Admin. Notes: Sent to assigned admin (or all support staff if unassigned) when patient/provider replies to case", "rationale": "Event Catalog table, prd.md line 81. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-112", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Support Case Resolved (support.case_resolved)", "attrs": {"statement": "Notification catalog event support.case_resolved (Support Case Resolved), category Messaging/Support. Primary recipients: Patient, Provider. Notes: Sent when case is marked as Resolved; includes resolution summary and feedback resolution (if applicable)", "rationale": "Event Catalog table, prd.md line 82. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
