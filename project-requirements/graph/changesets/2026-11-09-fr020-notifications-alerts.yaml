  - {"op": "add_node", "id": "REQ-020-132", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Review Published / New Review Posted (review.published)", "attrs": {"statement": "Notification catalog event review.published (Review Published / New Review Posted), category Reviews. Primary recipients: Provider. Notes: Notifies provider when a new published review appears on their profile; subject to provider Review Notifications preference in FR-032", "rationale": "Event Catalog table, prd.md line 102. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-133", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Provider Response Posted (review.response_posted)", "attrs": {"statement": "Notification catalog event review.response_posted (Provider Response Posted), category Reviews. Primary recipients: Patient. Notes: Notifies reviewer when provider posts a public response to their review", "rationale": "Event Catalog table, prd.md line 103. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
  - {"op": "add_node", "id": "REQ-020-134", "type": "Rule", "owner_fr": "FR-020", "title": "Catalog: Review Removed by Admin (review.removed_by_admin)", "attrs": {"statement": "Notification catalog event review.removed_by_admin (Review Removed by Admin), category Reviews. Primary recipients: Patient. Notes: Notifies reviewer when admin removes their published review for policy/compliance reasons", "rationale": "Event Catalog table, prd.md line 104. The table mirrors FR-030; FR-030 prevails on any mismatch."}}
