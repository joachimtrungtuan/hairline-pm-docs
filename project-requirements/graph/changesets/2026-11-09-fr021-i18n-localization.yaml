  - {"op": "add_node", "id": "REQ-021-064", "type": "Rule", "owner_fr": "FR-021", "title": "User-generated content stays in the language the user entered", "attrs": {"statement": "Patient App continues to show user-generated content in the language originally entered by the user.", "rationale": "PRD Module Scope (prd.md line 46). Restated at: Screen 1 note (line 253)."}}
  - {"op": "add_node", "id": "REQ-021-065", "type": "Rule", "owner_fr": "FR-021", "title": "Provider Dashboard uses the latest published provider-dashboard bundle", "attrs": {"statement": "Provider Dashboard uses the latest published provider-dashboard translation bundle for the selected locale.", "rationale": "PRD Screen Specifications, Screen 2 (prd.md line 273)."}}
  - {"op": "add_node", "id": "REQ-021-066", "type": "Rule", "owner_fr": "FR-021", "title": "Provider language choice applies to dashboard text and provider-facing notifications", "attrs": {"statement": "Language selection applies to dashboard UI, system labels, validation messages, and provider-facing system notifications where FR-030 templates exist.", "rationale": "PRD Screen Specifications, Screen 2 (prd.md line 274)."}}
  - {"op": "add_node", "id": "REQ-021-067", "type": "Rule", "owner_fr": "FR-021", "title": "Inactive provider locale falls back to the fallback locale", "attrs": {"statement": "If a provider's selected locale becomes inactive, the dashboard falls back to the configured fallback locale.", "rationale": "PRD Screen Specifications, Screen 2 (prd.md line 277)."}}
  - {"op": "add_node", "id": "REQ-021-068", "type": "Rule", "owner_fr": "FR-021", "title": "Admin Platform uses the latest published admin-platform bundle", "attrs": {"statement": "Admin Platform uses the latest published admin-platform translation bundle for the selected locale.", "rationale": "PRD Screen Specifications, Screen 3 (prd.md line 303)."}}
  - {"op": "add_node", "id": "REQ-021-069", "type": "Rule", "owner_fr": "FR-021", "title": "Localization screens show several languages regardless of Admin UI language", "attrs": {"statement": "Localization-management screens may show translation values in multiple languages at once, regardless of the admin user's current UI language.", "rationale": "PRD Screen Specifications, Screen 3 (prd.md line 304)."}}
  - {"op": "add_node", "id": "REQ-021-070", "type": "Rule", "owner_fr": "FR-021", "title": "Admin UI language does not change the registry default locale", "attrs": {"statement": "Admin UI language preference does not change the default/source locale of the translation registry.", "rationale": "PRD Screen Specifications, Screen 3 (prd.md line 305)."}}
  - {"op": "add_node", "id": "REQ-021-071", "type": "Rule", "owner_fr": "FR-021", "title": "Draft changes are visible in localization screens but not used in the Admin UI", "attrs": {"statement": "Draft translation changes are visible inside localization-management screens but are not used to localize the Admin Platform UI until published.", "rationale": "PRD Screen Specifications, Screen 3 (prd.md line 306)."}}
  - {"op": "add_node", "id": "REQ-021-072", "type": "Rule", "owner_fr": "FR-021", "title": "Deactivating a language hides it but keeps translations, versions and audit history", "attrs": {"statement": "Admin can deactivate languages; deactivation hides the language from user-facing selectors but preserves translations, versions, and audit history.", "rationale": "PRD Screen Specifications, Screen 4 (prd.md line 339). Restated at: Screen 4 row: remove/deactivate action (line 333)."}}
  - {"op": "add_node", "id": "REQ-021-073", "type": "Rule", "owner_fr": "FR-021", "title": "A language with history is never hard-deleted", "attrs": {"statement": "Hard deletion of a language is not allowed once translation history or published versions exist; use inactive/archived state instead.", "rationale": "PRD Screen Specifications, Screen 4 (prd.md line 340)."}}
  - {"op": "add_node", "id": "REQ-021-074", "type": "Rule", "owner_fr": "FR-021", "title": "English is the initial default and source locale", "attrs": {"statement": "English (`en`) is the initial default/source locale unless changed through approved governance.", "rationale": "PRD Screen Specifications, Screen 4 (prd.md line 341)."}}
  - {"op": "add_node", "id": "REQ-021-075", "type": "Rule", "owner_fr": "FR-021", "title": "New languages start in Preparation state", "attrs": {"statement": "New languages should start in Preparation state until required tenant bundles are ready.", "rationale": "PRD Screen Specifications, Screen 4 (prd.md line 342)."}}
  - {"op": "add_node", "id": "REQ-021-076", "type": "Rule", "owner_fr": "FR-021", "title": "Only Active locales appear in language selectors", "attrs": {"statement": "Only Active locales appear in user-facing language selectors; Inactive and Preparation locales are hidden from all patient, provider, and admin language selector controls.", "rationale": "PRD Screen Specifications, Screen 4 (prd.md line 343). Restated at: Screen 1 rule (line 246); Screen 2 row: available languages (line 268); Screen 3 row: available languages (line 298); Alternative flow A1 step 2 (line 176)."}}
  - {"op": "add_node", "id": "REQ-021-077", "type": "Rule", "owner_fr": "FR-021", "title": "Locale code is unique and follows the locale-code format", "attrs": {"statement": "Locale code must be unique and must follow the supported locale-code format", "rationale": "PRD Screen Specifications, Screen 4 (prd.md line 324)."}}
  - {"op": "add_node", "id": "REQ-021-078", "type": "Rule", "owner_fr": "FR-021", "title": "Exactly one default locale; it cannot be deactivated or removed", "attrs": {"statement": "Exactly one default locale exists; the default locale cannot be inactive and cannot be removed", "rationale": "PRD Screen Specifications, Screen 4 (prd.md line 329). Restated at: Screen 4 row: status (line 328); Screen 4 note: default protected (line 350)."}}
  - {"op": "add_node", "id": "REQ-021-079", "type": "Rule", "owner_fr": "FR-021", "title": "Machine translation route is offered only for non-English languages and authorized Admins", "attrs": {"statement": "Admin can also open machine translation for non-English languages when provider credentials and authorization are available.", "rationale": "PRD Screen Specifications, Screen 5 (prd.md line 377). Restated at: Screen 5 row: machine translation route (line 371)."}}
  - {"op": "add_node", "id": "REQ-021-080", "type": "Rule", "owner_fr": "FR-021", "title": "Export does not modify system state", "attrs": {"statement": "Export is available for translator handoff, backup, and implementation review, but export does not modify system state.", "rationale": "PRD Screen Specifications, Screen 5 (prd.md line 378)."}}
  - {"op": "add_node", "id": "REQ-021-081", "type": "Rule", "owner_fr": "FR-021", "title": "An export identifies whether it is draft or published", "attrs": {"statement": "Export JSON action: Must identify draft vs published export", "rationale": "PRD Screen Specifications, Screen 5 (prd.md line 369)."}}
  - {"op": "add_node", "id": "REQ-021-082", "type": "Rule", "owner_fr": "FR-021", "title": "Key inventory is a baseline; implementation keys may change within the model", "attrs": {"statement": "Developers may add, remove, split, or rename implementation keys without first updating this PRD when the change stays within the documented localization model, follows naming conventions, and is captured in the implementation registry/audit trail.", "rationale": "PRD Screen Specifications, Screen 6 (prd.md line 415). Restated at: Screen 6 rule: baseline map (line 414); Screen 6 rule: when PRD updates are required (line 416)."}}
  - {"op": "add_node", "id": "REQ-021-083", "type": "Rule", "owner_fr": "FR-021", "title": "Shared keys are reused only when meaning is identical; others stay tenant-scoped", "attrs": {"statement": "Shared/common keys may be reused only when meaning and context are identical across tenants.", "rationale": "PRD Screen Specifications, Screen 6 (prd.md line 417). Restated at: Screen 6 rule: tenant-specific keys (line 418)."}}
  - {"op": "add_node", "id": "REQ-021-084", "type": "Rule", "owner_fr": "FR-021", "title": "Key detail shows all active language values for the selected key", "attrs": {"statement": "All active language values for the selected key should be visible or accessible from this screen.", "rationale": "PRD Screen Specifications, Screen 7 (prd.md line 513)."}}
  - {"op": "add_node", "id": "REQ-021-085", "type": "Rule", "owner_fr": "FR-021", "title": "Saving is blocked when placeholders are removed, renamed or malformed", "attrs": {"statement": "System must block saving if placeholders are removed, renamed, or malformed.", "rationale": "PRD Screen Specifications, Screen 7 (prd.md line 516)."}}
  - {"op": "add_node", "id": "REQ-021-086", "type": "Rule", "owner_fr": "FR-021", "title": "English source edit exception for non-semantic changes", "attrs": {"statement": "English source edits require elevated authorization, reason capture, audit logging, and review-needed marking for dependent translations unless Admin explicitly confirms the source change is non-semantic.", "rationale": "PRD Screen Specifications, Screen 7 (prd.md line 517)."}}
  - {"op": "add_node", "id": "REQ-021-087", "type": "Rule", "owner_fr": "FR-021", "title": "Change reason is required for protected edits and sensitive publishes", "attrs": {"statement": "Change reason: Required when editing English source or publishing sensitive changes", "rationale": "PRD Screen Specifications, Screen 7 (prd.md line 505)."}}
  - {"op": "add_node", "id": "REQ-021-088", "type": "Rule", "owner_fr": "FR-021", "title": "Character length guidance does not block unless a screen limit exists", "attrs": {"statement": "Character guidance: Non-blocking unless a screen-specific limit exists", "rationale": "PRD Screen Specifications, Screen 7 (prd.md line 504)."}}
  - {"op": "add_node", "id": "REQ-021-089", "type": "Rule", "owner_fr": "FR-021", "title": "Validation failure blocks save, import or publish and shows errors", "attrs": {"statement": "System blocks save, import, or publish when validation fails and shows errors for correction", "rationale": "PRD Main Flow (prd.md line 134)."}}
  - {"op": "add_node", "id": "REQ-021-090", "type": "Rule", "owner_fr": "FR-021", "title": "Import preview is required before a confirmed import", "attrs": {"statement": "Import preview is required before confirmed import.", "rationale": "PRD Screen Specifications, Screen 8 (prd.md line 551)."}}
  - {"op": "add_node", "id": "REQ-021-091", "type": "Rule", "owner_fr": "FR-021", "title": "Import validates syntax, known and duplicate keys, placeholders, ICU, locale and orphans", "attrs": {"statement": "System must validate JSON syntax, known keys, duplicate keys, placeholder consistency, ICU syntax, target-locale compatibility, and unsupported/orphaned keys.", "rationale": "PRD Screen Specifications, Screen 8 (prd.md line 552). Restated at: Screen 8 row: file (line 539); Security consideration: threat mitigation (line 906)."}}
  - {"op": "add_node", "id": "REQ-021-092", "type": "Rule", "owner_fr": "FR-021", "title": "Every confirmed import creates an import record", "attrs": {"statement": "Every confirmed import creates an import record with file name, actor, timestamp, language, surface, group, decision, summary counts, and validation results.", "rationale": "PRD Screen Specifications, Screen 8 (prd.md line 553)."}}
  - {"op": "add_node", "id": "REQ-021-093", "type": "Rule", "owner_fr": "FR-021", "title": "Import and publish creates an import record and an immutable version", "attrs": {"statement": "If Admin chooses Import and Publish Version, system creates both an import record and an immutable published version record.", "rationale": "PRD Screen Specifications, Screen 8 (prd.md line 554)."}}
  - {"op": "add_node", "id": "REQ-021-094", "type": "Rule", "owner_fr": "FR-021", "title": "Unknown keys are blocked unless Admin may create registry keys", "attrs": {"statement": "Unknown keys are blocked unless Admin has explicit permission to create new registry keys through import.", "rationale": "PRD Screen Specifications, Screen 8 (prd.md line 555). Restated at: Screen 8 row: group (line 538)."}}
  - {"op": "add_node", "id": "REQ-021-095", "type": "Rule", "owner_fr": "FR-021", "title": "Row-level import errors: import valid rows only or cancel", "attrs": {"statement": "When a JSON import has row-level errors or warnings, Admin chooses whether to import valid rows only or cancel for correction", "rationale": "PRD Main Flow (prd.md line 141)."}}
  - {"op": "add_node", "id": "REQ-021-096", "type": "Rule", "owner_fr": "FR-021", "title": "Publishing creates a new active bundle for the language, surface and group scope", "attrs": {"statement": "Publishing creates a new active bundle version for selected language, tenant/surface, and group scope.", "rationale": "PRD Screen Specifications, Screen 9 (prd.md line 588)."}}
  - {"op": "add_node", "id": "REQ-021-097", "type": "Rule", "owner_fr": "FR-021", "title": "Cache is invalidated after publish and rollback", "attrs": {"statement": "Cache invalidation occurs after publish and rollback.", "rationale": "PRD Screen Specifications, Screen 9 (prd.md line 590). Restated at: Main flow step 14 (line 162)."}}
  - {"op": "add_node", "id": "REQ-021-098", "type": "Rule", "owner_fr": "FR-021", "title": "Publish and rollback record actor, time, reason, keys, scope and previous version", "attrs": {"statement": "System must record actor, timestamp, publish/rollback reason, impacted keys, language, tenant/surface, and previous active version.", "rationale": "PRD Screen Specifications, Screen 9 (prd.md line 591)."}}
  - {"op": "add_node", "id": "REQ-021-099", "type": "Rule", "owner_fr": "FR-021", "title": "Publishing is blocked by required validation errors", "attrs": {"statement": "Admin cannot publish if required validation errors exist, such as malformed ICU syntax or placeholder mismatch.", "rationale": "PRD Screen Specifications, Screen 9 (prd.md line 592). Restated at: Screen 9 row: publish action (line 581); External dependency: translator files (line 790)."}}
  - {"op": "add_node", "id": "REQ-021-100", "type": "Rule", "owner_fr": "FR-021", "title": "Rollback requires a reason and confirmation after an impact warning", "attrs": {"statement": "Before rollback the system displays the impacted locale, tenant/surface, groups, keys, and a rollback warning; rollback requires a reason and confirmation", "rationale": "PRD Main Flow (prd.md line 122). Restated at: Main flow step 4R (line 121); Screen 9 row: rollback action (line 582)."}}
  - {"op": "add_node", "id": "REQ-021-101", "type": "Rule", "owner_fr": "FR-021", "title": "Version comparison is limited to one language and surface scope", "attrs": {"statement": "Compare versions action: Versions must share language/surface scope", "rationale": "PRD Screen Specifications, Screen 9 (prd.md line 583)."}}
  - {"op": "add_node", "id": "REQ-021-102", "type": "Rule", "owner_fr": "FR-021", "title": "Publish and rollback require a change summary", "attrs": {"statement": "Change summary: Required for publish/rollback", "rationale": "PRD Screen Specifications, Screen 9 (prd.md line 577). Restated at: Main flow step 11 (line 157)."}}
  - {"op": "add_node", "id": "REQ-021-103", "type": "Rule", "owner_fr": "FR-021", "title": "Machine translation is a draft-generation tool, not a runtime path", "attrs": {"statement": "Machine translation is a draft-generation tool, not a runtime translation path.", "rationale": "PRD Screen Specifications, Screen 10 (prd.md line 624). Restated at: Screen 10 note: whole-language readiness (line 638); Out of scope: runtime or direct publishing (line 87)."}}
  - {"op": "add_node", "id": "REQ-021-104", "type": "Rule", "owner_fr": "FR-021", "title": "Machine translation targets non-English locales only", "attrs": {"statement": "Machine translation can only target non-English locales; English/source values remain human-authored and governed by source-edit protections.", "rationale": "PRD Screen Specifications, Screen 10 (prd.md line 625). Restated at: Screen 10 row: target language (line 613); Screen 10 row: generation mode (line 616)."}}
  - {"op": "add_node", "id": "REQ-021-105", "type": "Rule", "owner_fr": "FR-021", "title": "Machine-generated values stay Review Needed until reviewed or accepted", "attrs": {"statement": "All machine-generated values are marked Review Needed until reviewed or explicitly accepted by Admin.", "rationale": "PRD Screen Specifications, Screen 10 (prd.md line 628)."}}
  - {"op": "add_node", "id": "REQ-021-106", "type": "Rule", "owner_fr": "FR-021", "title": "Machine-generated values pass the same validation as JSON imports", "attrs": {"statement": "Generated values must pass the same placeholder, ICU syntax, key-existence, target-locale compatibility, and publish validation rules as JSON imports.", "rationale": "PRD Screen Specifications, Screen 10 (prd.md line 629). Restated at: Main flow step 8M (line 151)."}}
  - {"op": "add_node", "id": "REQ-021-107", "type": "Rule", "owner_fr": "FR-021", "title": "Provider configuration changes and translation jobs are audited", "attrs": {"statement": "Every provider configuration change and machine-translation job must be audited with actor, timestamp, provider, target language, mode, scope, counts, and reason.", "rationale": "PRD Screen Specifications, Screen 10 (prd.md line 632)."}}
  - {"op": "add_node", "id": "REQ-021-108", "type": "Rule", "owner_fr": "FR-021", "title": "A custom machine-translation provider needs an existing integration", "attrs": {"statement": "Custom machine-translation provider is allowed only if an integration exists", "rationale": "PRD Screen Specifications, Screen 10 (prd.md line 609)."}}
  - {"op": "add_node", "id": "REQ-021-109", "type": "Rule", "owner_fr": "FR-021", "title": "Adding a provider stores the credential encrypted and verifies the connection", "attrs": {"statement": "When Admin adds a provider, the system stores the encrypted credential and verifies the connection", "rationale": "PRD Alternative Flows (prd.md line 209)."}}
  - {"op": "add_node", "id": "REQ-021-110", "type": "Rule", "owner_fr": "FR-021", "title": "Starting a translation job needs an active provider, preview, reason and authorization", "attrs": {"statement": "Generate draft action: Requires active provider, preview, confirmation, and authorization. Preview counts and a confirmation reason are required before generation", "rationale": "PRD Screen Specifications, Screen 10 (prd.md line 619). Restated at: Screen 10 row: preview counts (line 617); Screen 10 row: confirmation reason (line 618)."}}
  - {"op": "add_node", "id": "REQ-021-111", "type": "Rule", "owner_fr": "FR-021", "title": "Translation job failures are recorded and create no publishable values", "attrs": {"statement": "Provider errors, quota limits, unsupported languages, placeholder mismatches, or malformed outputs are recorded in job history; accepted results remain draft and cannot publish until validation passes.", "rationale": "PRD Dependencies (prd.md line 795). Restated at: Integration note: machine translation errors (line 889)."}}
  - {"op": "add_node", "id": "SCR-021-01", "type": "Screen", "owner_fr": "FR-021", "title": "Patient App - Language & Region Settings", "attrs": {"platform": "patient", "description": "PRD Screen 1 (prd.md line 226). Purpose: Allow patients to choose the language used by the Patient App and review region-dependent display settings. Lives inside the Settings menu, not primary navigation. The Fallback notice is read-only text (UI element, not a field)."}}
  - {"op": "add_node", "id": "SCR-021-02", "type": "Screen", "owner_fr": "FR-021", "title": "Provider Dashboard - Top-Bar Language Selector", "attrs": {"platform": "provider", "description": "PRD Screen 2 (prd.md line 259). Purpose: Allow provider users to switch the Provider Dashboard interface language without leaving their current workflow. Selector sits in the top bar near account controls, shows readable and native names, and preserves the current route and task where technically feasible. Save/apply is a UI control."}}
  - {"op": "add_node", "id": "SCR-021-03", "type": "Screen", "owner_fr": "FR-021", "title": "Admin Platform - Top-Bar Language Selector", "attrs": {"platform": "admin", "description": "PRD Screen 3 (prd.md line 289). Purpose: Allow admin users to switch the Admin Platform interface language while keeping their administrative context. Selector sits in the top bar; localization screens keep column language labels visible when the admin UI language changes. Apply is a UI control."}}
  - {"op": "add_node", "id": "SCR-021-04", "type": "Screen", "owner_fr": "FR-021", "title": "Admin - Localization Dashboard & Language Management", "attrs": {"platform": "admin", "description": "PRD Screen 4 (prd.md line 315). Purpose: Admin landing screen for localization: manage available languages and see release readiness per tenant. Selecting a language row opens Language Detail (SCR-021-05). Add language and Remove/deactivate are UI controls; the Language list is the table of the locale fields shown here."}}
  - {"op": "add_node", "id": "SCR-021-05", "type": "Screen", "owner_fr": "FR-021", "title": "Admin - Language Detail", "attrs": {"platform": "admin", "description": "PRD Screen 5 (prd.md line 354). Purpose: Primary working screen for one language: coverage, draft changes, edit, import, export, version history and machine-translation routes. Route and action controls (Edit keys, Import JSON, Export JSON, Version history, Machine translation) are UI controls; each keeps the selected language context."}}
  - {"op": "add_node", "id": "SCR-021-06", "type": "Screen", "owner_fr": "FR-021", "title": "Admin - Translation Key Inventory", "attrs": {"platform": "admin", "description": "PRD Screen 6 (prd.md line 389). Purpose: Inventory of translation keys across the system, split into Patient App, Provider Dashboard and Admin Platform tenant sub-screens (6A, 6B, 6C: baseline key groups, not migrated as nodes). Open key opens SCR-021-07. When opened from Language Detail it is pre-filtered to that language."}}
  - {"op": "add_node", "id": "SCR-021-07", "type": "Screen", "owner_fr": "FR-021", "title": "Admin - Translation Key Detail Editor", "attrs": {"platform": "admin", "description": "PRD Screen 7 (prd.md line 488). Purpose: Open one key from the inventory, review all language values and edit per-language values through the draft workflow. Shows English source first, then active languages, then inactive or preparation ones if chosen; shows missing and review-needed indicators and a Pending Publish state after saving. Admin can save one or several language values. Save draft is a UI control; Selected language highlight is a UI state."}}
  - {"op": "add_node", "id": "SCR-021-08", "type": "Screen", "owner_fr": "FR-021", "title": "Admin - JSON Import Modal/Screen", "attrs": {"platform": "admin", "description": "PRD Screen 8 (prd.md line 528). Purpose: Separate modal or screen from the key editor: upload a JSON package for one language, surface and group, validate it, then choose Import as Draft or controlled Import and Publish Version. Shows whether the file is only imported as draft or published live, and separates structural errors, row warnings, publish-blocking errors and non-blocking warnings. Validation preview is shown through the summary counts and validation result."}}
  - {"op": "add_node", "id": "SCR-021-09", "type": "Screen", "owner_fr": "FR-021", "title": "Admin - Language Version History & Rollback", "attrs": {"platform": "admin", "description": "PRD Screen 9 (prd.md line 564). Purpose: Manage published versions for a language, inspect changes, publish drafts and roll back. Language-focused when entered from Language Detail, with filters for a global history view. Version history shows whether a version came from manual patching, JSON import, import and publish, machine translation or rollback. Publish, Rollback and Compare are UI controls."}}
  - {"op": "add_node", "id": "SCR-021-10", "type": "Screen", "owner_fr": "FR-021", "title": "Admin - Machine Translation Provider & Draft Generation", "attrs": {"platform": "admin", "description": "PRD Screen 10 (prd.md line 601). Purpose: Configure a machine-translation provider credential and generate review-required draft translations for a selected non-English language. Shows cost and usage warnings where provider metadata or integration limits are available. Generate draft is a UI control. Job history lists prior jobs with actor, language, mode, counts, provider, status and errors."}}
  - {"op": "add_node", "id": "EVT-missing-translation-logged", "type": "Event", "owner_fr": "FR-021", "title": "Missing translation logged", "attrs": {"description": "A client requested a key with no value in the selected locale: the system shows fallback text and logs the missing key with locale, surface and fallback used, for coverage reporting (PRD Alternative Flow B1, prd.md line 183). Raised at the patient stage; the same event also occurs on the provider and admin surfaces."}}
  - {"op": "add_field", "id": "ENT-translation-import.validation_result", "entity_id": "ENT-translation-import", "name": "validation_result", "data_type": "json", "title": "Validation result", "owner_fr": "FR-021", "required": false, "calculated_by": "REQ-021-091"}
  - {"op": "add_field", "id": "ENT-translation-import.summary_counts", "entity_id": "ENT-translation-import", "name": "summary_counts", "data_type": "json", "title": "Summary counts", "owner_fr": "FR-021", "required": false, "calculated_by": "REQ-021-091"}
  - {"op": "add_field", "id": "ENT-translation-import.error_report", "entity_id": "ENT-translation-import", "name": "error_report", "data_type": "file", "title": "Error report", "owner_fr": "FR-021", "required": false, "calculated_by": "REQ-021-091"}
  - {"op": "add_field", "id": "ENT-mt-job.preview_counts", "entity_id": "ENT-mt-job", "name": "preview_counts", "data_type": "json", "title": "Preview counts", "owner_fr": "FR-021", "required": false, "calculated_by": "REQ-021-110"}
