  - {"op": "add_node", "id": "REQ-021-001", "type": "Rule", "owner_fr": "FR-021", "title": "Multiple languages, English and Turkish first, expandable, RTL-ready", "attrs": {"statement": "System MUST support multiple languages, initially English and Turkish, with expandable locale catalog and future RTL readiness.", "rationale": "PRD Functional Requirements Summary (prd.md line 1043). PRD id REQ-021-001.  Restated at: Exec Summary: initial languages (line 25); Business Assumption 2: Turkish first (line 845)."}}
  - {"op": "add_node", "id": "REQ-021-002", "type": "Rule", "owner_fr": "FR-021", "title": "Patient selects language in Settings and it persists", "attrs": {"statement": "Patients MUST be able to select preferred language from Patient App Settings, and preference MUST persist across sessions/devices where account sync exists.", "rationale": "PRD Functional Requirements Summary (prd.md line 1044). PRD id REQ-021-002.  Restated at: Module Scope P-01 (line 43)."}}
  - {"op": "add_node", "id": "REQ-021-003", "type": "Rule", "owner_fr": "FR-021", "title": "Provider selects dashboard language without overwriting spoken languages", "attrs": {"statement": "Provider users MUST be able to select Provider Dashboard language from the dashboard top bar without overwriting provider profile spoken-language data.", "rationale": "PRD Functional Requirements Summary (prd.md line 1045). PRD id REQ-021-003.  Restated at: Module Scope PR-06 (line 52); Screen 2 rule (line 275)."}}
  - {"op": "add_node", "id": "REQ-021-004", "type": "Rule", "owner_fr": "FR-021", "title": "Admin selects Admin Platform language from the top bar", "attrs": {"statement": "Admin users MUST be able to select Admin Platform language from the dashboard top bar.", "rationale": "PRD Functional Requirements Summary (prd.md line 1046). PRD id REQ-021-004. "}}
  - {"op": "add_node", "id": "REQ-021-005", "type": "Rule", "owner_fr": "FR-021", "title": "UI strings, messages, emails and push notifications are translated", "attrs": {"statement": "System MUST translate UI strings, validation messages, empty states, system labels, emails, and push notifications for supported locales where the owning module supplies translatable content.", "rationale": "PRD Functional Requirements Summary (prd.md line 1047). PRD id REQ-021-005.  Restated at: Module Scope: in-scope localized text (line 76); Screen 1 note: coverage of selected language (line 252)."}}
  - {"op": "add_node", "id": "REQ-021-006", "type": "Rule", "owner_fr": "FR-021", "title": "Admin manages locales, activation, default, fallback order, names, direction", "attrs": {"statement": "Admin MUST be able to manage supported locales, activation state, default locale, fallback order, native names, and locale direction metadata.", "rationale": "PRD Functional Requirements Summary (prd.md line 1048). PRD id REQ-021-006.  Restated at: Module Scope A-09 (line 58)."}}
  - {"op": "add_node", "id": "REQ-021-007", "type": "Rule", "owner_fr": "FR-021", "title": "Admin edits translation values in a registry grid and key-detail editor", "attrs": {"statement": "Admin MUST be able to edit translation values in a table/grid registry and key-detail editor.", "rationale": "PRD Functional Requirements Summary (prd.md line 1049). PRD id REQ-021-007.  Restated at: Module Scope A-09 (line 59)."}}
  - {"op": "add_node", "id": "REQ-021-008", "type": "Rule", "owner_fr": "FR-021", "title": "Admin edits save as draft and do not affect live clients", "attrs": {"statement": "Admin translation edits MUST save as draft and MUST NOT affect live clients until published.", "rationale": "PRD Functional Requirements Summary (prd.md line 1050). PRD id REQ-021-008.  Restated at: Screen 7 rule: saving creates draft (line 514); Screen 7 rule: bundles unchanged until publish (line 518); Screen 5 rule: drafts stay draft (line 379)."}}
  - {"op": "add_node", "id": "REQ-021-009", "type": "Rule", "owner_fr": "FR-021", "title": "Admin imports locale JSON with preview and history; draft or controlled publish", "attrs": {"statement": "Admin MUST be able to import locale JSON files with validation preview and import history, choosing either Import as Draft or controlled Import and Publish Version.", "rationale": "PRD Functional Requirements Summary (prd.md line 1051). PRD id REQ-021-009.  Restated at: Screen 8 rule: draft is default (line 549); Screen 8 rule: publish gate (line 550)."}}
  - {"op": "add_node", "id": "REQ-021-010", "type": "Rule", "owner_fr": "FR-021", "title": "Admin exports translation JSON by locale, surface, group, version, format", "attrs": {"statement": "Admin MUST be able to export translation JSON files by locale, tenant/surface, group, version, and format.", "rationale": "PRD Functional Requirements Summary (prd.md line 1052). PRD id REQ-021-010.  Restated at: Module Scope A-09 (line 60)."}}
  - {"op": "add_node", "id": "REQ-021-011", "type": "Rule", "owner_fr": "FR-021", "title": "Published translation changes are packaged as immutable versioned bundles", "attrs": {"statement": "System MUST package published translation changes into immutable versioned bundles.", "rationale": "PRD Functional Requirements Summary (prd.md line 1053). PRD id REQ-021-011.  Restated at: Business Rule 7: every publish creates a version (line 652); Screen 9 rule: versions immutable (line 587)."}}
  - {"op": "add_node", "id": "REQ-021-012", "type": "Rule", "owner_fr": "FR-021", "title": "Admin rolls back by creating a new rollback version", "attrs": {"statement": "System MUST allow Admin to roll back to a prior published translation bundle by creating a new rollback version.", "rationale": "PRD Functional Requirements Summary (prd.md line 1054). PRD id REQ-021-012.  Restated at: Business Rule 8: rollback creates new version (line 653); Screen 9 rule: rollback keeps history (line 589)."}}
  - {"op": "add_node", "id": "REQ-021-013", "type": "Rule", "owner_fr": "FR-021", "title": "Only published bundles are served to runtime clients", "attrs": {"statement": "Published bundles MUST be the only translation source served to Patient, Provider, and Admin runtime clients.", "rationale": "PRD Functional Requirements Summary (prd.md line 1055). PRD id REQ-021-013.  Restated at: Business Rule 6 (line 651); Screen 1 rule: no drafts to Patient App (line 243); Screen 2 rule: no drafts to Provider Dashboard (line 276)."}}
  - {"op": "add_node", "id": "REQ-021-027", "type": "Rule", "owner_fr": "FR-021", "title": "Admin configures machine-translation provider credentials", "attrs": {"statement": "Admin MUST be able to configure machine-translation provider credentials for draft generation, with notable provider options including Google Cloud Translation, DeepL, Microsoft Azure Translator, and Amazon Translate.", "rationale": "PRD Functional Requirements Summary (prd.md line 1056). PRD id REQ-021-013a. Renumbered from REQ-021-013a (id must be digits only). Restated at: Module Scope A-09 (line 61)."}}
  - {"op": "add_node", "id": "REQ-021-028", "type": "Rule", "owner_fr": "FR-021", "title": "Admin prefills missing keys of a non-English language by machine translation", "attrs": {"statement": "Admin MUST be able to prefill all missing keys for a selected non-English language using machine translation, saving generated values as Review Needed drafts.", "rationale": "PRD Functional Requirements Summary (prd.md line 1057). PRD id REQ-021-013b. Renumbered from REQ-021-013b (id must be digits only). Restated at: Screen 10 rule: prefill scope (line 626)."}}
  - {"op": "add_node", "id": "REQ-021-029", "type": "Rule", "owner_fr": "FR-021", "title": "Admin replaces an entire non-English language by machine translation after explicit confirmation", "attrs": {"statement": "Admin MUST be able to replace an entire selected non-English language with machine-generated draft values, excluding English/source values and requiring explicit confirmation.", "rationale": "PRD Functional Requirements Summary (prd.md line 1058). PRD id REQ-021-013c. Renumbered from REQ-021-013c (id must be digits only). Restated at: Screen 10 rule: replace scope (line 627); Configurable with restrictions: replacement confirmation (line 693)."}}
  - {"op": "add_node", "id": "REQ-021-014", "type": "Rule", "owner_fr": "FR-021", "title": "Canonical translation registry", "attrs": {"statement": "System MUST maintain a canonical translation registry with stable keys, source English values, tenant/surface metadata, group/namespace, locale values, lifecycle status, and history.", "rationale": "PRD Functional Requirements Summary (prd.md line 1062). PRD id REQ-021-014. "}}
  - {"op": "add_node", "id": "REQ-021-015", "type": "Rule", "owner_fr": "FR-021", "title": "Validate placeholders, ICU syntax, duplicate and unknown keys, required source values", "attrs": {"statement": "System MUST validate placeholder variables, ICU syntax, duplicate keys, unknown keys, and required source values during edit/import/publish workflows.", "rationale": "PRD Functional Requirements Summary (prd.md line 1063). PRD id REQ-021-015.  Restated at: Implementation note: validation list (line 859)."}}
  - {"op": "add_node", "id": "REQ-021-016", "type": "Rule", "owner_fr": "FR-021", "title": "Log missing translations and expose coverage metrics", "attrs": {"statement": "System MUST log missing translations and expose locale coverage metrics by tenant/surface, group, and locale.", "rationale": "PRD Functional Requirements Summary (prd.md line 1064). PRD id REQ-021-016.  Restated at: Alternative flow B1: log missing key (line 195)."}}
  - {"op": "add_node", "id": "REQ-021-017", "type": "Rule", "owner_fr": "FR-021", "title": "Fallback applies per key when the selected locale value is missing", "attrs": {"statement": "System MUST apply fallback per key when a selected locale value is missing.", "rationale": "PRD Functional Requirements Summary (prd.md line 1065). PRD id REQ-021-017.  Restated at: Screen 1 rule: missing keys use fallback chain (line 244); Module Scope P-01 (line 45)."}}
  - {"op": "add_node", "id": "REQ-021-018", "type": "Rule", "owner_fr": "FR-021", "title": "Dates and times shown in user timezone; canonical timestamps stored in UTC", "attrs": {"statement": "System MUST display dates/times in user timezone while storing canonical timestamps in UTC.", "rationale": "PRD Functional Requirements Summary (prd.md line 1066). PRD id REQ-021-018. "}}
  - {"op": "add_node", "id": "REQ-021-019", "type": "Rule", "owner_fr": "FR-021", "title": "Local currency shown with configured conversion, rounding and locale formatting", "attrs": {"statement": "System MUST display local currency with configured conversion, rounding, and locale-aware formatting.", "rationale": "PRD Functional Requirements Summary (prd.md line 1067). PRD id REQ-021-019. "}}
  - {"op": "add_node", "id": "REQ-021-020", "type": "Rule", "owner_fr": "FR-021", "title": "English source edits need elevated authorization, reason, audit and review-needed marking", "attrs": {"statement": "English source value edits MUST require elevated authorization, reason capture, audit logging, and review-needed marking for dependent locale values.", "rationale": "PRD Functional Requirements Summary (prd.md line 1071). PRD id REQ-021-020.  Restated at: Configurable with restrictions: English source (line 690)."}}
  - {"op": "add_node", "id": "REQ-021-021", "type": "Rule", "owner_fr": "FR-021", "title": "Audit locale changes, imports, publishes, rollbacks, source edits and missing translations", "attrs": {"statement": "System MUST audit locale changes, import confirmations, publish actions, rollback actions, protected source edits, and missing-translation events.", "rationale": "PRD Functional Requirements Summary (prd.md line 1072). PRD id REQ-021-021.  Restated at: Security consideration: audit trail (line 905)."}}
  - {"op": "add_node", "id": "REQ-021-022", "type": "Rule", "owner_fr": "FR-021", "title": "Bundles and import/export files exclude medical data, private account data and free text", "attrs": {"statement": "Translation bundles and import/export files MUST NOT include patient medical data, private account data, or user-generated free text.", "rationale": "PRD Functional Requirements Summary (prd.md line 1073). PRD id REQ-021-022.  Restated at: Privacy Rule 1 (line 662); Security consideration: compliance (line 907)."}}
  - {"op": "add_node", "id": "REQ-021-030", "type": "Rule", "owner_fr": "FR-021", "title": "Machine translation requests exclude private, medical, user-generated and legal content", "attrs": {"statement": "Machine translation requests MUST exclude patient medical data, private account data, user-generated free text, legal content, support messages, and uploaded documents unless another owning FR explicitly permits the content.", "rationale": "PRD Functional Requirements Summary (prd.md line 1074). PRD id REQ-021-022a. Renumbered from REQ-021-022a (id must be digits only). Restated at: Privacy Rule 3 (line 664); Screen 10 rule: no private content (line 630)."}}
  - {"op": "add_node", "id": "REQ-021-031", "type": "Rule", "owner_fr": "FR-021", "title": "Machine-translation credentials encrypted, masked, access-controlled, never exported", "attrs": {"statement": "Machine-translation API credentials MUST be encrypted at rest, masked after save, access-controlled, and excluded from exports and audit payload details.", "rationale": "PRD Functional Requirements Summary (prd.md line 1075). PRD id REQ-021-022b. Renumbered from REQ-021-022b (id must be digits only). Restated at: Screen 10 rule: credential handling (line 631); Security consideration: credential security (line 904)."}}
  - {"op": "add_node", "id": "REQ-021-023", "type": "Rule", "owner_fr": "FR-021", "title": "Published bundles consumable by Patient App, Provider Dashboard and Admin Platform", "attrs": {"statement": "System MUST provide published translation bundles consumable by Patient App, Provider Dashboard, and Admin Platform by locale and tenant/surface.", "rationale": "PRD Functional Requirements Summary (prd.md line 1079). PRD id REQ-021-023.  Restated at: Module Scope shared services (line 67)."}}
  - {"op": "add_node", "id": "REQ-021-024", "type": "Rule", "owner_fr": "FR-021", "title": "Locale and fallback behavior consumable by FR-030 notification delivery", "attrs": {"statement": "System MUST provide locale/fallback behavior consumable by FR-030 notification template delivery.", "rationale": "PRD Functional Requirements Summary (prd.md line 1080). PRD id REQ-021-024.  Restated at: Module Scope S-03 (line 68)."}}
  - {"op": "add_node", "id": "REQ-021-025", "type": "Rule", "owner_fr": "FR-021", "title": "Language catalog consumable by FR-032 provider spoken-language selection", "attrs": {"statement": "System MUST provide language/locale catalog data consumable by FR-032 provider spoken-language profile selection without conflating it with provider UI language preference.", "rationale": "PRD Functional Requirements Summary (prd.md line 1081). PRD id REQ-021-025.  Restated at: Module Scope PR-06 (line 53)."}}
  - {"op": "add_node", "id": "REQ-021-026", "type": "Rule", "owner_fr": "FR-021", "title": "Currency display consumes FR-029 and S-02 configuration without owning it", "attrs": {"statement": "System MUST consume FR-029/S-02 currency conversion configuration for localized currency display and MUST NOT duplicate ownership of conversion rates, markup, rate locking, or payment fallback rules.", "rationale": "PRD Functional Requirements Summary (prd.md line 1082). PRD id REQ-021-026. "}}
  - {"op": "add_node", "id": "REQ-021-032", "type": "Rule", "owner_fr": "FR-021", "title": "All system-controlled text is externalized into translation keys", "attrs": {"statement": "All user-facing system-controlled text must be externalized into translation keys before production release.", "rationale": "PRD Business Rules (prd.md line 646)."}}
  - {"op": "add_node", "id": "REQ-021-033", "type": "Rule", "owner_fr": "FR-021", "title": "Translation keys are stable identifiers", "attrs": {"statement": "Translation keys must be stable identifiers and should not be based on mutable display copy.", "rationale": "PRD Business Rules (prd.md line 647)."}}
  - {"op": "add_node", "id": "REQ-021-034", "type": "Rule", "owner_fr": "FR-021", "title": "Active keys require an English source value", "attrs": {"statement": "Active keys require an English source value.", "rationale": "PRD Business Rules (prd.md line 648)."}}
  - {"op": "add_node", "id": "REQ-021-035", "type": "Rule", "owner_fr": "FR-021", "title": "Keys carry surface and group metadata", "attrs": {"statement": "Keys must include tenant/surface and group/namespace metadata.", "rationale": "PRD Business Rules (prd.md line 649)."}}
  - {"op": "add_node", "id": "REQ-021-036", "type": "Rule", "owner_fr": "FR-021", "title": "Edits save as draft; imports default to draft; import and publish is gated", "attrs": {"statement": "Inline text edits save draft changes only; JSON imports default to Import as Draft, with Import and Publish Version allowed only after full validation preview, publish-summary entry, and required authorization.", "rationale": "PRD Business Rules (prd.md line 650)."}}
  - {"op": "add_node", "id": "REQ-021-037", "type": "Rule", "owner_fr": "FR-021", "title": "Fallback chain: selected locale, fallback locale, default locale", "attrs": {"statement": "Fallback applies per key using selected locale, configured fallback locale, and default/source locale.", "rationale": "PRD Business Rules (prd.md line 654)."}}
  - {"op": "add_node", "id": "REQ-021-038", "type": "Rule", "owner_fr": "FR-021", "title": "Locale direction metadata is stored", "attrs": {"statement": "Locale direction metadata must be stored so future RTL support is not blocked.", "rationale": "PRD Business Rules (prd.md line 655)."}}
  - {"op": "add_node", "id": "REQ-021-039", "type": "Rule", "owner_fr": "FR-021", "title": "Machine-generated translations are draft only and Review Needed", "attrs": {"statement": "Machine-generated translations save as draft only, must be marked Review Needed, and cannot be served to runtime clients until published.", "rationale": "PRD Business Rules (prd.md line 656)."}}
  - {"op": "add_node", "id": "REQ-021-040", "type": "Rule", "owner_fr": "FR-021", "title": "Machine translation can target a whole non-English language, never English", "attrs": {"statement": "Machine translation generation can target a whole non-English language by missing keys or full-language replacement scope; English/source locale is never replaced by machine translation.", "rationale": "PRD Business Rules (prd.md line 657)."}}
  - {"op": "add_node", "id": "REQ-021-041", "type": "Rule", "owner_fr": "FR-021", "title": "Clients revalidate bundles; stale window after publish or rollback is bounded", "attrs": {"statement": "Clients MUST revalidate translation bundles against version metadata (ETag/hash or equivalent) on each fetch cycle. After a publish or rollback, the maximum acceptable stale window is a platform-configurable interval, recommended at 5 minutes or less, ensuring clients do not serve outdated bundles for an indeterminate period after a version change.", "rationale": "PRD Business Rules (prd.md line 658)."}}
  - {"op": "add_node", "id": "REQ-021-042", "type": "Rule", "owner_fr": "FR-021", "title": "Import and export files hold system-controlled text only", "attrs": {"statement": "Import/export files must contain system-controlled text only unless another owning FR explicitly permits additional metadata.", "rationale": "PRD Business Rules (prd.md line 663)."}}
  - {"op": "add_node", "id": "REQ-021-043", "type": "Rule", "owner_fr": "FR-021", "title": "Audit log content for localization changes", "attrs": {"statement": "System must log locale changes, protected source edits, imports, publishes, rollbacks, and missing-translation events with actor, timestamp, scope, and reason where applicable.", "rationale": "PRD Business Rules (prd.md line 665)."}}
  - {"op": "add_node", "id": "REQ-021-044", "type": "Rule", "owner_fr": "FR-021", "title": "Version history and audit trail retention", "attrs": {"statement": "Published version history and audit trail must be retained according to platform audit-retention policy.", "rationale": "PRD Business Rules (prd.md line 666)."}}
  - {"op": "add_node", "id": "REQ-021-045", "type": "Rule", "owner_fr": "FR-021", "title": "Published versions are immutable and stay inspectable after rollback", "attrs": {"statement": "Published versions are immutable and must remain inspectable after rollback.", "rationale": "PRD Business Rules (prd.md line 667)."}}
  - {"op": "add_node", "id": "REQ-021-046", "type": "Rule", "owner_fr": "FR-021", "title": "Items editable by Admin", "attrs": {"statement": "Editable by Admin: Supported locales, native names, activation state, fallback order, and locale direction metadata; Translation values for non-source locales; Translation key metadata such as description/context and group where allowed; Draft translation changes, import confirmations, publish actions, and rollback actions; Machine-translation provider credentials, provider activation state, and machine-translation draft generation jobs; Currency display configuration where already owned by A-09/S-02.", "rationale": "PRD Business Rules (prd.md line 673). Restated at: Editable list: translation values (line 674); Editable list: key metadata (line 675); Editable list: publish and rollback (line 676); Editable list: MT credentials and jobs (line 677); Editable list: currency display (line 678)."}}
  - {"op": "add_node", "id": "REQ-021-047", "type": "Rule", "owner_fr": "FR-021", "title": "Items fixed in code and not editable by Admin", "attrs": {"statement": "Fixed in codebase (not editable by Admin): Locale formatting library behavior; Runtime bundle fetch protocol; Mandatory system keys required by application code; Notification variable contracts owned by FR-030; Security and audit-retention mechanisms.", "rationale": "PRD Business Rules (prd.md line 682). Restated at: Fixed list: bundle fetch protocol (line 683); Fixed list: mandatory system keys (line 684); Fixed list: notification variables (line 685); Fixed list: security and retention mechanisms (line 686)."}}
  - {"op": "add_node", "id": "REQ-021-048", "type": "Rule", "owner_fr": "FR-021", "title": "Key identifiers after first publish change only by controlled migration", "attrs": {"statement": "Translation key identifiers after first publish require controlled migration rather than casual editing.", "rationale": "PRD Business Rules (prd.md line 691)."}}
  - {"op": "add_node", "id": "REQ-021-049", "type": "Rule", "owner_fr": "FR-021", "title": "Default locale change needs governance approval and cannot deactivate the source locale", "attrs": {"statement": "Default locale changes require governance approval and must not deactivate the source locale.", "rationale": "PRD Business Rules (prd.md line 692)."}}
  - {"op": "add_node", "id": "REQ-021-050", "type": "Rule", "owner_fr": "FR-021", "title": "Historical versions and audit records cannot be deleted by Admin", "attrs": {"statement": "Historical versions and audit records cannot be deleted through normal admin controls.", "rationale": "PRD Business Rules (prd.md line 694)."}}
  - {"op": "add_node", "id": "REQ-021-051", "type": "Rule", "owner_fr": "FR-021", "title": "Elevated authorization means Super Admin for four protected operations", "attrs": {"statement": "**Elevated Authorization Definition**: For the purposes of FR-021, \"elevated authorization\" means the **Super Admin** role as defined in FR-031 (Admin Access Control & Permissions). Only Super Admin role holders may edit English source values, change the default locale, publish translation versions, and perform rollback operations. The exact per-operation permission scope must be aligned with FR-031 configuration at implementation time.", "rationale": "PRD Business Rules (prd.md line 696). Restated at: Dependency FR-031 (line 777); Integration note: HTTP 403 (line 879); Security: authorization (line 902)."}}
  - {"op": "add_node", "id": "REQ-021-052", "type": "Rule", "owner_fr": "FR-021", "title": "Currency display uses configured rules and never stores them in translation files", "attrs": {"statement": "Currency display must use configured country/locale/currency rules without storing currency settings inside translation JSON files.", "rationale": "PRD Business Rules (prd.md line 700)."}}
  - {"op": "add_node", "id": "REQ-021-053", "type": "Rule", "owner_fr": "FR-021", "title": "Locale-aware number formatting is owned by S-02 and consumed by FR-021", "attrs": {"statement": "Currency conversion source, refresh cadence, markup, rate locking, and payment-collection fallback are owned by FR-029 / S-02 and consumed by FR-021 for localized display. Locale-aware number formatting (decimal separator, symbol position, digit grouping, and RTL currency rendering) is owned by S-02 as a shared service capability and consumed by FR-021; neither FR-021 nor FR-029 duplicates this formatting logic.", "rationale": "PRD Business Rules (prd.md line 701)."}}
  - {"op": "add_node", "id": "REQ-021-054", "type": "Rule", "owner_fr": "FR-021", "title": "Selected language does not override timezone or currency", "attrs": {"statement": "User-selected language does not automatically override timezone or currency unless product rules explicitly map country/locale defaults.", "rationale": "PRD Business Rules (prd.md line 702)."}}
  - {"op": "add_node", "id": "REQ-021-055", "type": "Rule", "owner_fr": "FR-021", "title": "Only authenticated Admin users reach localization management", "attrs": {"statement": "Only authenticated Admin users can access localization-management screens.", "rationale": "PRD Implementation Notes (prd.md line 901)."}}
  - {"op": "add_node", "id": "REQ-021-056", "type": "Rule", "owner_fr": "FR-021", "title": "User-generated content is not automatically translated", "attrs": {"statement": "Out of scope: Automatic translation of patient/provider messages, reviews, support-ticket messages, notes, uploaded documents, or any other user-generated content.", "rationale": "PRD Module Scope (prd.md line 84)."}}
  - {"op": "add_node", "id": "REQ-021-057", "type": "Rule", "owner_fr": "FR-021", "title": "Full RTL layout is not part of V1", "attrs": {"statement": "RTL languages such as Arabic are planned, with V1 requiring locale metadata and implementation readiness, but not full RTL layout delivery.", "rationale": "PRD Executive Summary (prd.md line 25). Restated at: Out of scope list: RTL (line 88); Business Assumption 3: Arabic (line 846)."}}
  - {"op": "add_node", "id": "ENT-locale", "type": "Entity", "owner_fr": "FR-021", "title": "Locale", "attrs": {"description": "Supported language or locale available to the platform. A locale has many translation values, published bundles, imports and user preferences (PRD Key Entities, Entity 1)."}}
  - {"op": "add_node", "id": "ENT-translation-key", "type": "Entity", "owner_fr": "FR-021", "title": "Translation key", "attrs": {"description": "Stable identifier of one system-controlled translatable text item; has one source value and many locale values (Entity 2)."}}
  - {"op": "add_node", "id": "ENT-translation-value", "type": "Entity", "owner_fr": "FR-021", "title": "Translation value", "attrs": {"description": "Locale-specific value for one translation key; belongs to one key and one locale and can be part of import records and published versions (Entity 3)."}}
