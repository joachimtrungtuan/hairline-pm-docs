  - {"op": "add_node", "id": "REQ-021-060", "type": "Rule", "owner_fr": "FR-021", "title": "Deactivated locale: patients fall back without losing their preference", "attrs": {"statement": "If a locale is deactivated, patients who previously selected it are moved to fallback behavior without deleting their historical preference.", "rationale": "PRD Screen Specifications, Screen 1 (prd.md line 245)."}}
  - {"op": "add_node", "id": "REQ-021-061", "type": "Rule", "owner_fr": "FR-021", "title": "Patient timezone falls back to device, then UTC, with a visible indicator", "attrs": {"statement": "When timezone preference is null or unset, the Patient App uses the device/browser-detected timezone; if unavailable, it falls back to UTC and displays a visible timezone indicator so the patient knows which timezone is in use.", "rationale": "PRD Screen Specifications, Screen 1 (prd.md line 247)."}}
