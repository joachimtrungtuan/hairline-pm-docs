  - {"op": "add_node", "id": "REQ-017-174", "type": "Rule", "owner_fr": "FR-017", "title": "Funds are released per booking at Treatment, then paid out per provider", "attrs": {"statement": "Funds are released per booking at Treatment, then paid out per provider. The provider marks the procedure complete; the patient confirms or disputes within a confirmation window (default 7 days, an editable admin setting); no answer means automatic release; a dispute pauses release until an admin resolves it. Any admin with support access can resolve a completion problem case and choose the money outcome; there is no time limit. A completion problem case ends in one of three outcomes: release in full, refund in full, or refund in part and release the rest", "rationale": "FR-017 PRD, Fund Release and Payout Rules, Release Rule 1."}}
  - {"op": "add_edge", "from": "REQ-017-174", "verb": "applies at", "to": "STG-main-06-treatment"}
  - {"op": "add_edge", "from": "REQ-017-174", "verb": "applies to", "to": "ACT-provider"}
  - {"op": "add_edge", "from": "REQ-017-174", "verb": "governed by", "to": "SET-patient-confirmation-window"}
  - {"op": "add_node", "id": "REQ-017-175", "type": "Rule", "owner_fr": "FR-017", "title": "Two payout rails, chosen by the admin when the clinic is created", "attrs": {"statement": "There are two payout rails: Stripe Connect, and a manual rail (manual first, Revolut later). The admin chooses the rail when creating the clinic (FR-015); the clinic sees the method and its readiness read-only and completes Stripe's own sign-up itself", "rationale": "FR-017 PRD, Fund Release and Payout Rules, Release Rule 2."}}
  - {"op": "add_edge", "from": "REQ-017-175", "verb": "applies at", "to": "STG-provider-01-invited"}
  - {"op": "add_edge", "from": "REQ-017-175", "verb": "applies to", "to": "ACT-platform-admin"}
  - {"op": "add_edge", "from": "REQ-017-175", "verb": "applies to", "to": "ACT-provider"}
  - {"op": "add_node", "id": "REQ-017-176", "type": "Rule", "owner_fr": "FR-017", "title": "Manual rail runs one platform-wide weekly cycle", "attrs": {"statement": "The manual rail runs one platform-wide weekly cycle: Sunday cutoff, Wednesday payout (both admin-editable). The admin records each payment by marking the statement as paid. A manually paid clinic is \"Ready\" once the admin has set its payout method to manual bank transfer and saved valid bank details. A booking with an open problem case leaves the unpaid settlement statement until the admin decides. A bank charge on a manual transfer is recorded against the settlement statement; the clinic bears it, and it is deducted from the clinic's statement amount and shown as a deduction", "rationale": "FR-017 PRD, Fund Release and Payout Rules, Release Rule 3."}}
  - {"op": "add_edge", "from": "REQ-017-176", "verb": "applies at", "to": "STG-payout-01-statement"}
