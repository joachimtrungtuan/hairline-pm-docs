  - {"op": "add_node", "id": "REQ-017-177", "type": "Rule", "owner_fr": "FR-017", "title": "A Stripe Connect clinic is paid one payout per released booking", "attrs": {"statement": "A Stripe Connect clinic is paid one payout per released booking, at release, recorded on the booking ledger; the weekly cycle does not apply to it. A failed Stripe Connect payout gets 3 automatic attempts with exponential backoff, then goes to manual review, and the Retry Payout button (Screen 2) stays available", "rationale": "FR-017 PRD, Fund Release and Payout Rules, Release Rule 4."}}
  - {"op": "add_edge", "from": "REQ-017-177", "verb": "applies at", "to": "STG-main-06-treatment"}
  - {"op": "add_edge", "from": "REQ-017-177", "verb": "applies to", "to": "ENT-provider-payout"}
  - {"op": "add_node", "id": "REQ-017-178", "type": "Rule", "owner_fr": "FR-017", "title": "Hairline is the seller; the clinic share moves 60 days before treatment", "attrs": {"statement": "On a card payment through Stripe Connect the seller is Hairline: its balance pays refunds, chargebacks and Stripe fees first and recovers the clinic's part afterwards. Hairline holds the payment; the clinic's share moves to the clinic's locked Stripe balance 60 days before treatment (30 days for instalments once fully paid) and is paid out at release. The deposit's share moves 60 days before the scheduled treatment date, the balance share moves when the balance is paid, and a fully paid instalment plan moves 30 days before; payout happens only at release. If fewer than 60 days remain at payment (30 for a fully paid instalment plan), the clinic share moves at once to the clinic's locked Stripe balance and is paid out only at release after completion", "rationale": "FR-017 PRD, Fund Release and Payout Rules, Release Rule 5."}}
  - {"op": "add_edge", "from": "REQ-017-178", "verb": "applies at", "to": "STG-main-05-payment"}
  - {"op": "add_node", "id": "REQ-017-179", "type": "Rule", "owner_fr": "FR-017", "title": "The clinic share waits until Ready; pulled back on cancellation or reschedule", "attrs": {"statement": "When a clinic's Stripe payout setup is not Ready at the time its share is due to move, the share stays with Hairline, the clinic and the admin are told, it moves when the clinic becomes Ready, and nothing is paid out before then, even after treatment. If the patient cancels after the share has moved, Hairline refunds the patient per the refund ladder, pulls the share back from the clinic's locked balance, and deducts any shortfall from the clinic's next payout. If the treatment is rescheduled after the share has moved, the share is always pulled back and moved again 60 or 30 days before the new date; this also keeps the share inside Stripe's 90-day limit. The share can be pulled back to Hairline before Stripe's 90-day limit and moved again later; there is no deadline for moving it again", "rationale": "FR-017 PRD, Fund Release and Payout Rules, Release Rule 6."}}
  - {"op": "add_edge", "from": "REQ-017-179", "verb": "applies at", "to": "STG-main-05-payment"}
  - {"op": "add_node", "id": "REQ-017-180", "type": "Rule", "owner_fr": "FR-017", "title": "Clinic cancellation deduction and patient cancellation fee split", "attrs": {"statement": "When a clinic cancels, a fixed amount set in admin settings is deducted from the clinic's next payout. A patient cancellation fee is split between Hairline and the clinic by a percentage set in admin settings. The refund ladder is one global ladder now (General Module Rule 7)", "rationale": "FR-017 PRD, Fund Release and Payout Rules, Release Rule 7."}}
  - {"op": "add_edge", "from": "REQ-017-180", "verb": "applies at", "to": "STG-main-05-payment"}
  - {"op": "add_edge", "from": "REQ-017-180", "verb": "governed by", "to": "SET-clinic-cancellation-deduction"}
  - {"op": "add_edge", "from": "REQ-017-180", "verb": "governed by", "to": "SET-patient-cancellation-fee-split"}
  - {"op": "add_node", "id": "REQ-017-181", "type": "Rule", "owner_fr": "FR-017", "title": "Bookings Completed or in Aftercare at go-live follow the old payout rule", "attrs": {"statement": "Bookings that are Completed or Aftercare at go-live follow the old payout rule and are payable as they are", "rationale": "FR-017 PRD, Fund Release and Payout Rules, Release Rule 8."}}
  - {"op": "add_edge", "from": "REQ-017-181", "verb": "applies at", "to": "STG-main-06-treatment"}
  - {"op": "add_edge", "from": "REQ-017-181", "verb": "applies at", "to": "STG-main-07-aftercare"}
  - {"op": "update_node", "id": "REQ-017-002", "title": "Admins view the manual-rail payment schedule and process payouts", "attrs": {"statement": "System MUST allow admins to view the manual-rail provider payment schedule (the one platform-wide weekly settlement period) and process payouts with itemized treatment breakdowns"}}
  - {"op": "update_node", "id": "REQ-017-017", "attrs": {"statement": "System MUST implement role-based access control (RBAC) with granular permissions: Billing Admin (full access) and Super Admin (full access); read-only finance access is granted by permission, not by a named role"}}
  - {"op": "update_node", "id": "REQ-017-020", "title": "Soft delete financial records; retention follows the platform rule", "attrs": {"statement": "System MUST soft-delete financial records (no hard deletion); retention follows the system PRD, Platform-Wide Rules: One 10-year retention period"}}
  - {"op": "update_node", "id": "REQ-017-034", "title": "Admin consolidates earnings into manual-rail payout statements", "attrs": {"statement": "Payouts follow the clinic's payout rail (see Business Rules, Fund Release and Payout Rails): a Stripe Connect clinic is paid one payout per released booking, at release; a manual-rail clinic has its eligible earnings consolidated by admin into a payout statement on the one platform-wide settlement period. Providers view their upcoming payout schedule and expected payout amounts. Providers view payout history (completed payouts with itemised breakdown). Providers download invoices for completed payouts (PDF, generated after admin processes payout)"}}
  - {"op": "update_node", "id": "REQ-017-038", "title": "Cron generates Pending Approval statements on the cutoff day", "attrs": {"statement": "Scheduled cron job runs on the platform-wide cutoff day (Sunday by default) for manual-rail clinics: for each active clinic with eligible earnings, the system generates a payout statement with status \"Pending Approval\"; admin notified to review and approve newly generated statements. The review time is the gap between the cutoff day and the payout day"}}
  - {"op": "update_node", "id": "REQ-017-040", "attrs": {"statement": "Stage 1 (earnings tracking): Provider sees per-treatment earnings accumulate in real time as treatments complete — this is always visible. Stage 2 (payout visibility): Provider sees a confirmed payout entry ONLY after admin has approved the payout statement and the Stripe transfer is initiated — providers do NOT see draft statements during the review window between the cutoff day and the payout day"}}
  - {"op": "update_node", "id": "REQ-017-047", "title": "Read-only finance access is a permission; money-moving actions need re-authentication", "attrs": {"statement": "Billing Admin and Super Admin can view all admin financial screens and execute payout approvals, retries, refunds, overrides, and bulk actions. Read-only finance access is granted by permission, not by a named role. An admin who holds only the read-only finance permission can access the same screens in read-only mode, but selection checkboxes, money-moving buttons, retry buttons, override buttons, and confirmation modals are hidden. Any action that moves money or changes a financial status MUST invoke the financial re-authentication step before the final confirm action is enabled"}}
  - {"op": "update_node", "id": "REQ-017-074", "title": "Payout period follows the platform-wide settlement period", "attrs": {"statement": "Payout period determined by the one platform-wide settlement period for manual-rail clinics (weekly by default, ending on the Sunday cutoff day; set in admin payment settings). Per-clinic payout frequency no longer applies"}}
  - {"op": "update_node", "id": "REQ-017-076", "title": "Approve queues the statement; no transfer during the review", "attrs": {"statement": "\"Approve Payout\" button marks the statement as \"Approved\" and queues it for the payout-day cron; Stripe transfer is not initiated during the review action"}}
  - {"op": "update_node", "id": "REQ-017-080", "attrs": {"statement": "Reminder Type: Auto-selected based on invoice status: \"Upcoming Due Reminder\" (Pending), \"Overdue Reminder\" (Overdue), \"At Risk — Final Notice\" (At Risk). The four reminder types are Upcoming Due, Overdue, At Risk - Final Notice, and Manual Reminder. Display-only; not editable by admin. Channel: \"Via: Email + Push Notification\""}}
  - {"op": "update_node", "id": "REQ-017-112", "title": "Audit log is read-only, exportable, retained per the platform rule", "attrs": {"statement": "Audit log is read-only; no editing or deletion of log entries is permitted. Audit-log retention follows the system PRD, Platform-Wide Rules: One 10-year retention period, enforced at storage level; UI displays entries for the full retention period. Export to CSV button available for compliance reporting. Log entries link back to the affected entity's detail screen"}}
  - {"op": "update_node", "id": "REQ-017-131", "attrs": {"statement": "Provider payouts processed ONLY after treatment status changes to \"Completed\" or \"Aftercare\" and the booking's funds have been released (see Fund Release and Payout Rules)"}}
  - {"op": "update_node", "id": "REQ-017-133", "title": "Refunds follow the platform-wide refund ladder", "attrs": {"statement": "Refunds follow the refund ladder, a platform-wide setting owned by FR-029 / A-09: Payment System Configuration (default: >30 days = 90%, 15-30 days = 50%, <15 days = 0%). The data model allows a per-clinic ladder later. Provider-status cancellations follow Rule 13"}}
  - {"op": "update_node", "id": "REQ-017-137", "attrs": {"statement": "Bookings cancelled by an FR-015 provider suspension or deactivation (cause `ProviderSuspended` / `ProviderDeactivated`) are excluded from provider payout calculation like other cancelled bookings. No refund is issued by the system on its own and the Rule 7 refund ladder is not applied. When the clinic withdraws or drops out, the patient is always refunded in full everything paid, and pays no cancellation fee; the refund is issued through admin financial resolution (Screen 4b, mandatory reason, audit trail). A replacement booking through the FR-006 provider-fault transfer takes a new payment. The full-refund ruling covers withdrawal or drop-out only. Captured patient payments on these bookings, including payments captured while the cancellation cascade was running, remain recorded against the booking invoice and are routed to admin financial resolution through the existing refund and adjustment controls (Screen 4b, mandatory reason, audit trail). Provider reactivation does not restore cancelled bookings or their payout eligibility"}}
  - {"op": "update_node", "id": "REQ-017-142", "attrs": {"statement": "Payout statement approval during the review time between the cutoff day and the payout day, and during overdue review; payout processing is automatic on payout day for approved statements and immediate only when an overdue statement is approved after the normal payout day"}}
  - {"op": "update_node", "id": "REQ-017-149", "title": "Failed installments retried 3 times (waits of 1, 3 and 7 days) then flagged", "attrs": {"statement": "Failed installment payments trigger 3 automatic retry attempts after waits of 1, 3 and 7 days (see FR-007B); if all fail, booking flagged for admin review"}}
  - {"op": "update_node", "id": "REQ-017-150", "attrs": {"statement": "Provider payout statements (dashboard view) for manual-rail clinics are auto-generated on the platform-wide cutoff day. Provider invoice PDFs are generated separately only after the payout is confirmed (post-payout). Statements and invoices are two distinct artefacts."}}
  - {"op": "update_node", "id": "REQ-017-151", "title": "Affiliate invoices on the monthly affiliate payout day", "attrs": {"statement": "Affiliate invoices are generated on the monthly affiliate payout day (a platform setting owned by FR-018, default the 7th); no payout buffer window applies (see Billing Rule 4)"}}
  - {"op": "update_node", "id": "REQ-017-152", "title": "Cutoff day replaces the payout buffer window", "attrs": {"statement": "The platform-wide cutoff day replaces the payout buffer window; the FR-029 buffer setting no longer exists. The review time is the gap between the cutoff day and the payout day. For example, with a Sunday cutoff and a Wednesday payout, the statement is generated on Sunday and the admin has until Wednesday to review it."}}
  - {"op": "update_node", "id": "REQ-017-153", "title": "Approve between cutoff and payout day; payout day processes only Approved", "attrs": {"statement": "Admin must approve payout statements during the review time between the cutoff day and the payout day. On payout day, the system auto-processes only \"Approved\" statements. Any statement still in \"Pending Approval\" at that point moves to \"Overdue\" and is NOT auto-processed. Overdue statements can be approved and processed at any time outside the normal cycle; the Stripe transfer is initiated immediately on approval. For a manual-rail clinic the admin records the payment by marking the statement as paid. Delay is recorded in the audit trail."}}
