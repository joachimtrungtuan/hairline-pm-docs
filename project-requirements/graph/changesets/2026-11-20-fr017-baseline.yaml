  - {"op": "add_node", "id": "SET-patient-cancellation-fee-split", "type": "Setting", "owner_fr": "FR-017", "title": "Patient cancellation fee split percentage", "attrs": {"description": "Percentage by which a patient cancellation fee is split between Hairline and the clinic (FR-017 Release Rule 7). Set in admin settings; the PRD gives no default.", "unit": "percent"}}
  - {"op": "add_node", "id": "SET-outstanding-invoice-alert-threshold", "type": "Setting", "owner_fr": "FR-017", "title": "Outstanding invoice alert threshold", "attrs": {"description": "Number of days overdue after which an outstanding patient invoice raises an alert (FR-017 Admin Editability). Default not yet set.", "unit": "days overdue"}}
  - {"op": "add_node", "id": "REQ-017-172", "type": "Rule", "owner_fr": "FR-017", "title": "FR-017 owns financial reconciliation", "attrs": {"statement": "Hairline admins can view reconciliation dashboards, export payment and commission reports, and monitor financial reconciliation data and payment operations. FR-017 owns financial reconciliation; FR-007 points here for it", "rationale": "FR-017 PRD, General Module Rule 17."}}
