  - {"op": "add_node", "id": "REQ-017-173", "type": "Rule", "owner_fr": "FR-017", "title": "A banned clinic forfeits its whole pending balance", "attrs": {"statement": "When a clinic's account ends as Inactive with the reason \"banned\", its whole pending balance is forfeited: nothing further is paid out to that clinic", "rationale": "FR-017 PRD, General Module Rule 18."}}
  - {"op": "add_edge", "from": "REQ-017-173", "verb": "applies at", "to": "STG-provider-05-offboarded"}
