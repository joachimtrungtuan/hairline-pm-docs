  - {"op": "add_node", "id": "REQ-016-194", "type": "Rule", "owner_fr": "FR-016", "title": "Cancel Booking action: Opens the FR-006 Cancel Booking action (FR-006", "attrs": {"statement": "Cancel Booking action: Opens the FR-006 Cancel Booking action (FR-006 Screen 9) prefilled with the request source and support case reference; Shown for cancellation requests when the booking is `Accepted`, `Payment Window Expired`, `Confirmed`, `In Progress`, or `Aftercare`", "rationale": "Stated in prd.md, Screen 9: Booking Support Requests (Cancellation and Change) (line 664)."}}
