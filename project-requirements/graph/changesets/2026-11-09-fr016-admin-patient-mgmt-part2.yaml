  - {"op": "add_node", "id": "REQ-016-175", "type": "Rule", "owner_fr": "FR-016", "title": "Requests appear here when the patient uses Contact Support on an FR-006", "attrs": {"statement": "Requests appear here when the patient uses Contact Support on an FR-006 booking screen from acceptance onward; requests for an inquiry still in the Inquiry or Quoted stage are not listed, because the patient can cancel those in the app (FR-003)", "rationale": "Stated in prd.md, Screen 9: Booking Support Requests (Cancellation and Change) (line 671)."}}
  - {"op": "add_node", "id": "REQ-016-176", "type": "Rule", "owner_fr": "FR-016", "title": "The admin performs a cancellation or appointment change only through", "attrs": {"statement": "The admin performs a cancellation or appointment change only through the FR-006 action; FR-006 holds the mandatory reason, confirmation, audit entry, and notice (`booking.cancelled` or `booking.rescheduled`) for that action", "rationale": "Stated in prd.md, Screen 9: Booking Support Requests (Cancellation and Change) (line 672)."}}
  - {"op": "add_node", "id": "REQ-016-177", "type": "Rule", "owner_fr": "FR-016", "title": "A request becomes Resolved when its FR-006 action completes, and", "attrs": {"statement": "A request becomes Resolved when its FR-006 action completes, and Declined when the admin records a decline reason; the patient is answered through the FR-034 support case in both cases", "rationale": "Stated in prd.md, Screen 9: Booking Support Requests (Cancellation and Change) (line 673). Restated: prd.md line 263: \"If the admin declines the request, admin records a decline reason, and the patient is answered through the FR-034 support case\""}}
