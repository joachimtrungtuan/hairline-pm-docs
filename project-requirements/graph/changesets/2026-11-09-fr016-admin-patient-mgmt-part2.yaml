  - {"op": "add_node", "id": "REQ-016-184", "type": "Rule", "owner_fr": "FR-016", "title": "Stage column: Current journey stage badge (Inquiry, Quoted, Accepted", "attrs": {"statement": "Stage column: Current journey stage badge (Inquiry, Quoted, Accepted, Confirmed, In Progress, Aftercare, Completed, Cancelled), using the FR-003 stage list. \"Cancelled\" indicates a patient-initiated inquiry cancellation in the Inquiry or Quoted stage (FR-003 Workflow 5) — admin has oversight only, no reversal — an admin cancellation of a booking through FR-006 (shown as \"Cancelled — Admin\"), or a provider-caused cancellation shown as \"Cancelled — Provider Suspended\" or \"Cancelled — Provider Deactivated\". An unresolved provider-caused impact adds a separate \"Admin Support Required\" badge, including when the inquiry stage itself is not cancelled.", "rationale": "Stated in prd.md, Screen 1: Patient List View (line 339)."}}
  - {"op": "add_node", "id": "REQ-016-185", "type": "Rule", "owner_fr": "FR-016", "title": "Resolve Support action: Clears Admin Support Required on one affected", "attrs": {"statement": "Resolve Support action: Clears Admin Support Required on one affected record; Resolution reason required (minimum 20 characters); shown only for unresolved records and only to admins with the FR-031 Respond to Support permission", "rationale": "Stated in prd.md, Screen 2: Patient Detail View - Overview Tab (line 389)."}}
