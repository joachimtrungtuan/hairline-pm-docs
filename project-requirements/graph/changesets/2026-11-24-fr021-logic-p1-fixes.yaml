  - {"op": "add_node", "id": "REQ-021-122", "type": "Rule", "owner_fr": "FR-021", "title": "Manage Localization permission covers everyday localization work; four operations stay Super Admin only", "attrs": {"statement": "The Manage Localization permission MUST cover editing non-English translation values, importing JSON as a draft, and generating machine-translation drafts. The Super Admin holds it and MAY grant it to another admin role in the FR-031 permission matrix. Editing the English source, changing the default locale, publishing, and rollback MUST stay Super Admin only.", "rationale": "Pass 1 logic review. Stated in the PRD Functional Requirements Summary and restated at the screen or rule that applies it."}}
  - {"op": "add_node", "id": "REQ-021-123", "type": "Rule", "owner_fr": "FR-021", "title": "Import into the English source locale is an English source edit", "attrs": {"statement": "An import into the English source locale MUST be treated as an English source edit with the REQ-021-020 controls, and a new key created through import MUST carry an English value in the same file or the row is an error.", "rationale": "Pass 1 logic review. Stated in the PRD Functional Requirements Summary and restated at the screen or rule that applies it."}}
  - {"op": "add_node", "id": "REQ-021-124", "type": "Rule", "owner_fr": "FR-021", "title": "Review Needed values do not block publish; the publish confirmation shows the count", "attrs": {"statement": "Review Needed values MUST NOT block publish; the Screen 9 publish confirmation MUST show how many values remain flagged.", "rationale": "Pass 1 logic review. Stated in the PRD Functional Requirements Summary and restated at the screen or rule that applies it."}}
  - {"op": "add_node", "id": "REQ-021-125", "type": "Rule", "owner_fr": "FR-021", "title": "Preparation to Active is Super Admin only and needs a published bundle for every surface", "attrs": {"statement": "Moving a locale from Preparation to Active MUST be Super Admin only and MUST require a published bundle for every surface (Patient App, Provider Dashboard, Admin Platform). The default locale MUST be Active.", "rationale": "Pass 1 logic review. Stated in the PRD Functional Requirements Summary and restated at the screen or rule that applies it."}}
  - {"op": "add_node", "id": "REQ-021-126", "type": "Rule", "owner_fr": "FR-021", "title": "Provider and admin screens format dates and numbers by the selected locale", "attrs": {"statement": "Provider and admin screens MUST format dates and numbers by the selected locale. Provider screens MUST use the provider timezone set in FR-032 (a value from the FR-026 GMT list); admin screens MUST use the platform default timezone.", "rationale": "Pass 1 logic review. Stated in the PRD Functional Requirements Summary and restated at the screen or rule that applies it."}}
  - {"op": "add_node", "id": "REQ-021-127", "type": "Rule", "owner_fr": "FR-021", "title": "Admin-authored library text is registered as translation key groups", "attrs": {"statement": "Admin-authored library text (treatment type descriptions and technique specifications) MUST be registered as translation key groups on the Patient App and Provider Dashboard inventories. Provider-authored package names and descriptions are free text under REQ-021-119 and are not keys.", "rationale": "Pass 1 logic review. Stated in the PRD Functional Requirements Summary and restated at the screen or rule that applies it."}}
