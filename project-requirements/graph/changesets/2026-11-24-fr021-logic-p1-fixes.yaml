  - {"op": "update_node", "id": "REQ-021-006", "attrs": {"statement": "Admin MUST be able to manage supported locales, activation state, fallback order, native names, and locale direction metadata; only a Super Admin can change the default locale."}}
  - {"op": "update_node", "id": "REQ-021-020", "attrs": {"statement": "English source value edits MUST require elevated authorization, reason capture, audit logging, and review-needed marking for dependent locale values once the edit passes validation, unless the Super Admin confirms the source change is non-semantic in the English edit dialog. A rejected edit marks nothing."}}
  - {"op": "update_node", "id": "REQ-021-025", "attrs": {"statement": "System MUST provide language/locale catalog data consumable by FR-032 provider spoken-language profile selection and FR-030 template-language selection, without conflating it with provider UI language preference. Interface-language selectors show Active locales only; the spoken-language and template-language lists show Active and Preparation locales."}}
  - {"op": "update_node", "id": "REQ-021-036", "attrs": {"statement": "Inline text edits save draft changes only; JSON imports default to Import as Draft, with Import and Publish Version allowed only when no row was skipped for an error, after full validation preview, publish-summary entry, and Super Admin authorization. When any row is skipped for an error, only Import as Draft is offered."}}
  - {"op": "update_node", "id": "REQ-021-037", "attrs": {"statement": "Fallback applies per key: the selected locale first, then that locale's configured fallback locale, then always the English source locale."}}
  - {"op": "update_node", "id": "REQ-021-046", "attrs": {"statement": "Editable by Admin: Supported locales, native names, activation state, fallback order, and locale direction metadata; Translation values for non-source locales; Translation key metadata such as description/context and group where allowed; Draft translation changes and import confirmations (publish and rollback are Super Admin only); Machine-translation provider credentials, provider activation state, and machine-translation draft generation jobs; The free-text translation switch and its monthly budget; Currency display configuration where already owned by A-09/S-02."}}
  - {"op": "update_node", "id": "REQ-021-049", "attrs": {"statement": "Default locale changes require approval by the Super Admin alone (no second approver); the new default locale must be Active, and English always remains the last-resort fallback."}}
  - {"op": "update_node", "id": "REQ-021-051", "attrs": {"statement": "Elevated authorization means the Super Admin role as defined in FR-031. Only Super Admin role holders may edit English source values (including by import into the English locale), change the default locale, publish translation versions, and perform rollback operations. These four protected operations cannot be delegated. Moving a locale from Preparation to Active is also Super Admin only (REQ-021-125). The exact per-operation permission scope must be aligned with FR-031 configuration at implementation time."}}
  - {"op": "update_node", "id": "REQ-021-055", "attrs": {"statement": "Only authenticated admins holding the Manage Localization permission can access localization-management Screens 4 to 10; the Screen 3 language selector is open to every authenticated admin."}}
  - {"op": "update_node", "id": "REQ-021-074", "attrs": {"statement": "English (`en`) is always the source locale and is the initial default locale; only the default locale can be changed, and only by a Super Admin."}}
  - {"op": "update_node", "id": "REQ-021-075", "attrs": {"statement": "New languages start in Preparation state and become Active only under REQ-021-125: Super Admin only, with a published bundle for every surface."}}
  - {"op": "update_node", "id": "REQ-021-076", "attrs": {"statement": "Only Active locales appear in the Patient, Provider, and Admin interface-language selectors; Inactive and Preparation locales are hidden from them. The spoken-language and notification-template language lists used by FR-032 and FR-030 show Active and Preparation locales."}}
  - {"op": "update_node", "id": "REQ-021-078", "attrs": {"statement": "Exactly one default locale exists; the default locale must be Active and cannot be removed."}}
  - {"op": "update_node", "id": "REQ-021-079", "attrs": {"statement": "An admin holding the Manage Localization permission can also open machine translation for non-English languages when provider credentials are available."}}
  - {"op": "update_node", "id": "REQ-021-094", "attrs": {"statement": "Unknown keys are blocked unless Admin has explicit permission to create new registry keys through import. A new key created through import must carry an English value in the same file; a row without one is an error."}}
  - {"op": "update_node", "id": "REQ-021-095", "attrs": {"statement": "When a JSON import has row-level errors or warnings, Admin chooses whether to import valid rows only, as a draft, or cancel for correction. When any row is skipped for an error, only Import as Draft is offered; publishing is a separate later action."}}
  - {"op": "update_node", "id": "REQ-021-099", "attrs": {"statement": "Admin cannot publish if required validation errors exist, such as malformed ICU syntax or placeholder mismatch. Review Needed values do not block publish (REQ-021-124)."}}
  - {"op": "update_node", "id": "REQ-021-105", "attrs": {"statement": "All machine-generated values are marked Review Needed until Admin saves a reviewed value or selects Accept as reviewed on Screen 7."}}
  - {"op": "update_node", "id": "REQ-021-109", "attrs": {"statement": "When Admin adds a provider, the system stores the encrypted credential and verifies the connection. A failed connection sets the provider status to Error and stops; no job starts unless the provider is Connected. Admin can enable or disable a provider; a Disabled provider cannot start a job, and enabling it verifies the connection again."}}
  - {"op": "update_node", "id": "REQ-021-110", "attrs": {"statement": "Generate draft action: Requires a Connected and enabled provider, preview, confirmation, and the Manage Localization permission. Preview counts and a confirmation reason are required before generation."}}
  - {"op": "update_node", "id": "REQ-021-111", "attrs": {"statement": "Provider errors, quota limits, unsupported languages, placeholder mismatches, or malformed outputs are recorded in job history; accepted results remain draft and cannot publish until validation passes. Job status is one of Queued, Running, Completed, Partially failed, or Failed."}}
  - {"op": "update_node", "id": "REQ-021-115", "attrs": {"statement": "Use the fallback locale template/content when the recipient locale is missing. FR-021 supplies the locale catalog and fallback order to FR-030; notification wording lives only in FR-030 templates, not in a translation bundle."}}
  - {"op": "update_node", "id": "REQ-021-119", "attrs": {"statement": "When free-text translation is switched on, free text written by one user for another (messages, free-text fields in an inquiry, provider-authored package names and descriptions, support messages and notes, and reviews) MUST be machine-translated into the reader's own language using the active machine-translation provider. Uploaded documents MUST NOT be translated. The switch is one platform-wide setting controlled by Admin from the Free-text translation panel on Screen 10 and MUST be off by default."}}
  - {"op": "update_node", "id": "REQ-021-120", "attrs": {"statement": "Admin MUST be able to configure a monthly budget for free-text translation in the Free-text translation panel on Screen 10 (no default figure); when the monthly limit is reached, free text MUST be shown untranslated."}}
  - {"op": "update_node", "id": "REQ-021-121", "attrs": {"statement": "Only an admin holding the Manage Localization permission MUST be able to use the machine-translation route for translation drafts."}}
