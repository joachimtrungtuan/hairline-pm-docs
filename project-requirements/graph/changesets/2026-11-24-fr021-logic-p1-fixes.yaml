reason: "FR-021 logic review pass 1: Manage Localization permission and the four Super Admin operations, import into the source locale, draft-only import when rows are skipped, fallback chain and Screen 5 control, Review Needed handling, one machine-translation flow with connection check, preview and confirm, job statuses and enable/disable, Free-text translation panel, locale-aware formatting rule, interface versus spoken-language lists, library text key groups, notification surface retired, Preparation to Active rule, and flow wiring."
