  - {"op": "add_node", "id": "REQ-006-001", "type": "Rule", "owner_fr": "FR-006", "title": "Proceed to payment from the accepted subquote without reselection", "attrs": {"statement": "Patients MUST be able to proceed to payment after accepting one subquote; FR-006 MUST consume its package, date range, appointment, price, promotion, and inherited parent context without reselection."}}
  - {"op": "add_node", "id": "REQ-006-002", "type": "Rule", "owner_fr": "FR-006", "title": "Booking confirmed only after successful first payment", "attrs": {"statement": "System MUST confirm booking only after successful deposit/initial installment and unmask patient identity to provider.", "rationale": "Restated by Main Flow steps 5 and 6, General Module Rules (first rule) and the Confirmation entry point."}}
  - {"op": "add_node", "id": "REQ-006-003", "type": "Rule", "owner_fr": "FR-006", "title": "Exclusive appointment hold owned before payment", "attrs": {"statement": "System MUST require an exclusive appointment hold, keyed by provider, appointment date/time, and time zone, created atomically with FR-005 acceptance; reject any handoff that does not own the valid hold before payment initiation; and create the appointment record and convert the hold into a provider calendar block only after successful payment confirmation.", "rationale": "Restated by General Module Rules (Overlapping Appointment Prevention), Business Rules (Post-Acceptance Hold), Screen 3 business rules and Key Entities (Calendar Slot relationships)."}}
  - {"op": "add_node", "id": "REQ-006-004", "type": "Rule", "owner_fr": "FR-006", "title": "Admin-only cancellation with scheduled refunds", "attrs": {"statement": "System MUST enforce cancellation policy with scheduled refunds per policy (rescheduling deferred to V2). Only an admin MAY cancel a booking, from `Accepted`, `Payment Window Expired`, `Confirmed`, `In Progress`, or `Aftercare`, with a mandatory reason, confirmation, and audit entry; the booking and inquiry MUST become `Cancelled`, the accepted quote MUST stay `accepted`, and `booking.cancelled` MUST be sent. The patient MUST NOT have an in-app cancel action from acceptance onward and MUST be offered \"Contact support\" instead.", "rationale": "Restated by Alternative Flows B2 and B3, Admin Status and Date Intervention Rules (Cancel booking) and Screen 9 business rules."}}
  - {"op": "add_node", "id": "REQ-006-005", "type": "Rule", "owner_fr": "FR-006", "title": "One fixed slot hold; Payment Window Expired on hold expiry", "attrs": {"statement": "System MUST hold the accepted subquote's appointment slot with one fixed hold that starts at subquote acceptance and lasts the FR-026 slot-hold duration (default 48 hours); payment failure MUST NOT extend or restart it. If the hold expires before the first payment succeeds, System MUST set the booking to `Payment Window Expired`, release the hold, create no appointment record, block payment against that accepted selection, and preserve the immutable AcceptanceEvent/snapshot without reopening the prior parent quote or accepted subquote. Recovery is by the audited admin revive, or by admin cancellation on a support request followed by a new inquiry.", "rationale": "Restated by Business Rules (Post-Acceptance Hold, Payment Window Expired, Payment Window Expired Recovery, Payment Failure Handling), Alternative Flow B1 and Key Entities (Calendar Slot)."}}
  - {"op": "add_node", "id": "REQ-006-006", "type": "Rule", "owner_fr": "FR-006", "title": "Booking, payment and audit records kept 7 years", "attrs": {"statement": "System MUST store booking reference, slot, status history, payment state, refund state, and audit trail ≥7 years.", "rationale": "Restated by Data & Privacy Rules (7-year retention, hard deletes prohibited)."}}
  - {"op": "add_node", "id": "REQ-006-007", "type": "Rule", "owner_fr": "FR-006", "title": "Booking links to one acceptance with matching versions", "attrs": {"statement": "System MUST link each booking to exactly one FR-005 AcceptanceEvent, accepted parent quote identifier/version, accepted subquote identifier/version, immutable acceptance snapshot, and provider calendar slot. `acceptedSubquoteVersion` MUST equal `acceptedParentQuoteVersion`."}}
  - {"op": "add_node", "id": "REQ-006-008", "type": "Rule", "owner_fr": "FR-006", "title": "Patient identity masked until payment; PII encrypted", "attrs": {"statement": "System MUST keep patient identity masked until payment confirmation; encrypt PII at rest and in transit.", "rationale": "Restated by Data & Privacy Rules, Fixed in Codebase (identity unmasking tied to payment confirmation), Screen 3 and Screen 4 business rules."}}
  - {"op": "add_node", "id": "REQ-006-009", "type": "Rule", "owner_fr": "FR-006", "title": "All booking state changes and accesses logged", "attrs": {"statement": "System MUST log all booking state changes and accesses with user, timestamp, and reason.", "rationale": "Restated by Data & Privacy Rules (immutable audit logs) and Fixed in Codebase (audit logging enablement)."}}
  - {"op": "add_node", "id": "REQ-006-010", "type": "Rule", "owner_fr": "FR-006", "title": "Payment Service integration with the locked exchange rate", "attrs": {"statement": "System MUST integrate with Payment Service for deposits, installments, and refunds, and MUST use the exchange rate locked in the acceptance snapshot without relocking it."}}
  - {"op": "add_node", "id": "REQ-006-011", "type": "Rule", "owner_fr": "FR-006", "title": "Booking notification events", "attrs": {"statement": "System MUST integrate with Notification Service for confirmations, reminders, and policy notices, and MUST trigger these FR-030 events: `booking.scheduled` (displayed as \"Booking Accepted — Slot Held (Pending Payment)\"; mandatory, patient only, sent on patient acceptance and on an admin-authored replacement acceptance; the provider is told by `quote.accepted`), `booking.rescheduled` (mandatory, patient and provider, sent on an admin appointment change with the old and new appointment), `booking.cancelled` (patient and provider, sent on admin cancellation with the reason), `booking.hold_expiring_soon` (patient reminder, and admin exception alert), `booking.payment_window_expired` (mandatory, patient and provider, and admin exception alert), `booking.revived` (mandatory, patient and provider), and `booking.provider_fault_replacement` (mandatory, patient and admin exception alert). FR-004 is the only producer of `quote.withdrawn`; FR-006 does not emit it and reacts to it by starting the provider-fault transfer in Alternative Flow B5."}}
  - {"op": "add_node", "id": "REQ-006-012", "type": "Rule", "owner_fr": "FR-006", "title": "Deposit percentage configured in FR-029", "attrs": {"statement": "Admin MUST be able to configure deposit percentage (default: 20-30% range) via **FR-029: Payment System Configuration** (Module A-09: System Settings & Configuration).", "rationale": "Restated by Admin Editability Rules (Deposit Rate) and Payment & Billing Rules (Deposit Rate)."}}
  - {"op": "add_node", "id": "REQ-006-013", "type": "Rule", "owner_fr": "FR-006", "title": "Slot-hold duration and reminder lead time read from FR-026", "attrs": {"statement": "System MUST read the slot-hold duration (default: 48 hours) and the \"hold expiring soon\" reminder lead time from FR-026 and MUST NOT keep a separate FR-006 hold setting.", "rationale": "Restated by Admin Editability Rules (slot-hold duration and reminder lead time)."}}
  - {"op": "add_node", "id": "REQ-006-014", "type": "Rule", "owner_fr": "FR-006", "title": "Cancelled inquiry blocks entry to booking and payment", "attrs": {"statement": "System MUST verify the parent inquiry is not in \"Cancelled\" status before allowing entry to the booking/payment flow. If cancelled, system MUST block entry and display a read-only blocked state (Screen 1 blocked state) with clear messaging."}}
  - {"op": "add_node", "id": "REQ-006-015", "type": "Rule", "owner_fr": "FR-006", "title": "Provider suspension or deactivation cancels pre-treatment bookings", "attrs": {"statement": "When a provider's suspension or deactivation becomes effective, System MUST cancel that provider's `Accepted` and `Confirmed` bookings with cause `ProviderSuspended` or `ProviderDeactivated` and an independent `supportRequired` marker, release holds/reservations/slots, block further payment, revalidate provider eligibility at booking-confirming payment, treat any racing capture as paid money under the B5 payment placeholder, retain the accepted snapshot and booking/payment history, write the supersession record only at the replacement acceptance, and let an admin rehome the patient to a replacement provider in the same inquiry through Alternative Flow B5, without restoration on reactivation (Alternative Flow B4; FR-015 A5/Screen 4). `In Progress` and `Aftercare` bookings MUST keep their status and receive the cause and `supportRequired` (Alternative Flows B7 and B6).", "rationale": "Restated by Alternative Flows B4 to B7 and Payment & Billing Rules (Provider-Status Cancellation)."}}
  - {"op": "add_node", "id": "REQ-006-016", "type": "Rule", "owner_fr": "FR-006", "title": "Payment Window Expired applies only to the first payment step", "attrs": {"statement": "`Payment Window Expired` MUST apply only to the first payment step (acceptance to deposit or first installment). A missed later installment or final payment MUST NOT cause `Payment Window Expired`, booking cancellation, or inquiry cancellation.", "rationale": "Restated by Payment & Billing Rules (First-Payment Boundary) and the Alternative Flow B1 boundary."}}
  - {"op": "add_node", "id": "REQ-006-017", "type": "Rule", "owner_fr": "FR-006", "title": "Admin revive and appointment change; no other manual status change", "attrs": {"statement": "Admin MAY revive a `Payment Window Expired` booking to `Accepted` only through Screen 7 with a mandatory reason, a slot availability re-check, a new hold of the FR-026 duration, one promotion use taken again where the accepted promotion has a usage limit (re-reserved for a provider-selected promotion or patient code, taken again for an automatic promotion; the revive is rejected if the limit has no room), an audit entry, an unchanged AcceptanceEvent, and a mandatory \"booking revived\" notice to patient and provider. Appointment date changes MUST be made through Screen 8, MUST pass a slot availability check, MUST update the booking's current appointment while the acceptance snapshot keeps the accepted baseline, MUST send `booking.rescheduled`, and MUST trigger an FR-008 travel review for any travel records already linked to the booking. No other manual status change is allowed.", "rationale": "Restated by Admin Status and Date Intervention Rules (Revive, Change appointment date/time, No other status jumps) and Screens 7 and 8 business rules."}}
  - {"op": "add_node", "id": "REQ-006-018", "type": "Rule", "owner_fr": "FR-006", "title": "Provider withdrawal after acceptance cancels with ProviderFault; admin transfer", "attrs": {"statement": "When the provider withdraws or drops out after acceptance and before treatment starts, System MUST cancel the booking with cause `ProviderFault`, release the hold or calendar block, keep the AcceptanceEvent unchanged, and let an admin transfer the patient to a replacement provider in the same inquiry through an admin-authored replacement quote and a new admin-authored acceptance that points to that quote, option, and date-price row (Alternative Flow B5, Screen 10; FR-004 Workflow 7 and Screen 8). A replacement quote that is not accepted MUST expire under the normal quote expiry, the inquiry MUST stay `supportRequired` without automatic cancellation, and the admin MAY author another replacement quote or cancel the inquiry and booking. System MUST write the single supersession record linking the original AcceptanceEvent to the new one at the replacement acceptance, as one append-only insert; the B4 or B5 closure is recorded on the booking as its cause. A provider fault during `Aftercare` MUST NOT create a new quote, acceptance, or payment; the booking stays `Aftercare` and an admin reassigns the aftercare provider or team through FR-011 (Alternative Flow B6); the replacement booking MUST receive the carried-over passport and copied flight and hotel records flagged \"travel-date review required\" per FR-008, with the originals kept read-only on the closed booking.", "rationale": "Restated by Alternative Flow B5, Admin Status and Date Intervention Rules (Provider-fault transfer) and Screen 10 business rules."}}
  - {"op": "add_node", "id": "REQ-006-019", "type": "Rule", "owner_fr": "FR-006", "title": "Provider fault while In Progress keeps the booking In Progress", "attrs": {"statement": "When a provider fault occurs while the booking is `In Progress`, System MUST keep the booking `In Progress`, MUST NOT cancel it automatically or create a replacement quote or acceptance, and MUST flag it `supportRequired` with the cause. Only an admin MAY resolve it on Screen 11 (Alternative Flow B7), with a mandatory reason, confirmation, and audit entry, by either moving the booking to `Aftercare` and reassigning the aftercare provider or team through FR-011 Screen 19, or cancelling the booking through Screen 9.", "rationale": "Restated by Alternative Flow B7, Admin Status and Date Intervention Rules (In-Progress provider fault) and Screen 11 business rules."}}
  - {"op": "add_node", "id": "REQ-006-020", "type": "Rule", "owner_fr": "FR-006", "title": "Admin actions blocked for a suspended or deactivated provider", "attrs": {"statement": "System MUST block an admin revive (Screen 7), an admin appointment change (Screen 8), and an admin-authored replacement acceptance (Screen 10) when the provider concerned is `Suspended` or `Deactivated` at submit, MUST change nothing, and MUST show the action-specific message that directs the admin to the provider-fault transfer or to another replacement provider (Admin Status and Date Intervention Rules; FR-015 Rule 9).", "rationale": "Restated by Admin Status and Date Intervention Rules (Provider must be Active for admin booking actions) and Screens 7, 8 and 10 business rules."}}
  - {"op": "add_node", "id": "REQ-006-021", "type": "Rule", "owner_fr": "FR-006", "title": "Entry points to booking", "attrs": {"statement": "Patient-initiated via mobile from the Accepted Subquote detail view. Activation: Becomes available immediately after FR-005 subquote acceptance. Confirmation: Occurs after successful deposit (or first installment) per FR-007/FR-007B, which also unmask patient identity and blocks provider calendar."}}
  - {"op": "add_node", "id": "REQ-006-022", "type": "Rule", "owner_fr": "FR-006", "title": "Provider bookings shown as a table list, no calendar view", "attrs": {"statement": "View accepted/confirmed bookings in table list format (no calendar view)", "rationale": "Restated by Screen 3 business rules and notes."}}
  - {"op": "add_node", "id": "REQ-006-023", "type": "Rule", "owner_fr": "FR-006", "title": "Confirmed bookings read-only for patients and providers", "attrs": {"statement": "Confirmed bookings are **read-only for patients and providers**.", "rationale": "Restated by Screen 4 business rules (all booking data is read-only; cannot be edited by provider)."}}
  - {"op": "add_node", "id": "REQ-006-024", "type": "Rule", "owner_fr": "FR-006", "title": "Admin interventions are append-only versioned events", "attrs": {"statement": "Admins MAY perform emergency modifications limited to the Admin Status and Date Intervention rules below, but MUST do so as **append-only, versioned intervention events** (who/when/what/why) rather than overwriting historical records."}}
  - {"op": "add_node", "id": "REQ-006-025", "type": "Rule", "owner_fr": "FR-006", "title": "Payments and refunds immutable once confirmed", "attrs": {"statement": "Financial transactions (payments/refunds) remain immutable once confirmed; admin actions reference the original transaction IDs and create new adjustment/refund events as needed."}}
  - {"op": "add_node", "id": "REQ-006-026", "type": "Rule", "owner_fr": "FR-006", "title": "Booking notice channels", "attrs": {"statement": "Email/push confirmations for booking creation, payment receipt, reminders, reschedule outcomes, cancellation outcomes. In-app notifications for booking state changes and reminders."}}
  - {"op": "add_node", "id": "REQ-006-027", "type": "Rule", "owner_fr": "FR-006", "title": "No SMS booking notifications in MVP", "attrs": {"statement": "SMS optionality is handled by S-03 settings and **does not exist in MVP (no SMS booking notifications are sent until a future phase explicitly enables SMS in S-03/FR-020/FR-030)**"}}
  - {"op": "add_node", "id": "REQ-006-028", "type": "Rule", "owner_fr": "FR-006", "title": "Booking created as Accepted with the acceptance and the hold", "attrs": {"statement": "The booking record is created with status `Accepted` in the same transaction as the FR-005 AcceptanceEvent and the exclusive slot hold. The appointment record (`schedules`) is not created at acceptance; it is created only at the first successful payment (step 7)."}}
  - {"op": "add_node", "id": "REQ-006-029", "type": "Rule", "owner_fr": "FR-006", "title": "Accepted selection and hold revalidated before the payment flow", "attrs": {"statement": "The accepted subquote and parent quote are still in \"Accepted\" status, their versions match the FR-005 AcceptanceEvent, and the AcceptanceEvent owns the slot's valid exclusive payment-window hold."}}
  - {"op": "add_node", "id": "REQ-006-030", "type": "Rule", "owner_fr": "FR-006", "title": "Deposit calculated from the FR-029 percentage", "attrs": {"statement": "System queries FR-029 payment settings and calculates required deposit (admin-configurable percentage, default 20–30% range) and presents cancellation policy."}}
  - {"op": "add_node", "id": "REQ-006-031", "type": "Rule", "owner_fr": "FR-006", "title": "Deposit rate changes apply to new bookings only", "attrs": {"statement": "Deposit and installment settings are locked at booking confirmation (FR-029). Changes apply to new bookings only (existing bookings retain original deposit rate)."}}
  - {"op": "add_node", "id": "REQ-006-032", "type": "Rule", "owner_fr": "FR-006", "title": "Timestamps shown in local time zones", "attrs": {"statement": "All timestamps shown in patient's local timezone; provider view shows both local and clinic time."}}
  - {"op": "add_node", "id": "REQ-006-033", "type": "Rule", "owner_fr": "FR-006", "title": "Only feasible installment options offered; Pay-in-Full fallback", "attrs": {"statement": "Only show installment options returned as feasible per FR-029 configuration + FR-007B schedule rules; if none are feasible, allow Pay-in-Full only with a clear explanation.", "rationale": "Restated by Alternative Flow A1 step 1 (feasible installment options from FR-029 split payment settings)."}}
  - {"op": "add_node", "id": "REQ-006-034", "type": "Rule", "owner_fr": "FR-006", "title": "Installments complete 30 days before the procedure", "attrs": {"statement": "Installments must complete ≥30 days before procedure; failures trigger retries, then flag for admin."}}
  - {"op": "add_node", "id": "REQ-006-035", "type": "Rule", "owner_fr": "FR-006", "title": "Payment retry only while the original hold is active", "attrs": {"statement": "The patient can retry payment from the Accepted Subquote view only while the original hold is active.", "rationale": "Restated by Alternative Flow B1 steps 2 and 3."}}
  - {"op": "add_node", "id": "REQ-006-036", "type": "Rule", "owner_fr": "FR-006", "title": "Hold-expiring-soon reminder to the patient", "attrs": {"statement": "Before the hold expires, the patient receives a \"hold expiring soon\" reminder; the lead time is set by admin in FR-026."}}
  - {"op": "add_node", "id": "REQ-006-037", "type": "Rule", "owner_fr": "FR-006", "title": "Blocked layout for Payment Window Expired and other closures", "attrs": {"statement": "If the booking is `Payment Window Expired` or `Cancelled` for any other cause (provider withdrawal or fault, provider suspension or deactivation), the screen shows the same read-only blocked layout with a banner that names the cause; all payment fields and actions are hidden."}}
  - {"op": "add_node", "id": "REQ-006-038", "type": "Rule", "owner_fr": "FR-006", "title": "Pay disabled until acknowledgments are checked", "attrs": {"statement": "Disable Pay button until all required acknowledgments (cancellation policy, T&C) are checked."}}
  - {"op": "add_node", "id": "REQ-006-039", "type": "Rule", "owner_fr": "FR-006", "title": "Payment breakdown shown before payment", "attrs": {"statement": "Show clear breakdown: total amount, deposit amount, remaining balance, currency."}}
  - {"op": "add_node", "id": "REQ-006-040", "type": "Rule", "owner_fr": "FR-006", "title": "Provider contact shown after payment confirmation", "attrs": {"statement": "Include provider contact information (now unmasked after payment confirmation)."}}
  - {"op": "add_node", "id": "REQ-006-041", "type": "Rule", "owner_fr": "FR-006", "title": "Add to Calendar file download", "attrs": {"statement": "Provide \"Add to Calendar\" functionality (ICS file download)."}}
  - {"op": "add_node", "id": "REQ-006-042", "type": "Rule", "owner_fr": "FR-006", "title": "Link to FR-008 travel booking when available", "attrs": {"statement": "Link to travel booking (FR-008) when available."}}
  - {"op": "add_node", "id": "REQ-006-043", "type": "Rule", "owner_fr": "FR-006", "title": "Check In available only for a Confirmed, fully paid booking", "attrs": {"statement": "Check In button only available if status is \"Confirmed\", appointment date is today or past, and Payment Status is \"Full paid\" (no outstanding balance)."}}
  - {"op": "add_node", "id": "REQ-006-044", "type": "Rule", "owner_fr": "FR-006", "title": "Provider booking filter and sort", "attrs": {"statement": "Filtering options: Status, Date Range, Treatment Type, Payment Status. Sorting options: Date, Amount, Status, Created Date."}}
  - {"op": "add_node", "id": "REQ-006-045", "type": "Rule", "owner_fr": "FR-006", "title": "Admin booking search and filter", "attrs": {"statement": "Search functionality: by booking reference, patient name, patient email, provider name. Filtering: Status, Provider, Date Range, Treatment Type, Payment Status."}}
  - {"op": "add_node", "id": "REQ-006-046", "type": "Rule", "owner_fr": "FR-006", "title": "No card details shown", "attrs": {"statement": "Show payment summary figures without revealing card details.", "rationale": "Restated by Screen 4 notes, Screen 6 notes (PCI compliance) and Security Considerations (no storage of card PANs)."}}
  - {"op": "add_node", "id": "REQ-006-047", "type": "Rule", "owner_fr": "FR-006", "title": "Booking detail aggregates earlier stages in order", "attrs": {"statement": "All sections display data from previous stages (inquiry → parent quote/subquote → acceptance → booking) in chronological order.", "rationale": "Restated by Screen 6 business rules."}}
  - {"op": "add_node", "id": "REQ-006-048", "type": "Rule", "owner_fr": "FR-006", "title": "Admin sees all patient and provider data unmasked", "attrs": {"statement": "Admin has full visibility to all patient and provider information (no masking)."}}
  - {"op": "add_node", "id": "REQ-006-049", "type": "Rule", "owner_fr": "FR-006", "title": "Internal notes visible to admin only", "attrs": {"statement": "Admin can add internal notes to booking (not visible to patient/provider)."}}
  - {"op": "add_node", "id": "REQ-006-050", "type": "Rule", "owner_fr": "FR-006", "title": "Mandatory reason of 10 to 500 characters for admin actions", "attrs": {"statement": "Reason (Screens 7 to 11): \"Mandatory; 10 to 500 characters\""}}
  - {"op": "add_node", "id": "REQ-006-051", "type": "Rule", "owner_fr": "FR-006", "title": "Cancellation releases the hold and blocks payment", "attrs": {"statement": "System releases any active hold or calendar block and blocks further payment against the accepted selection."}}
  - {"op": "add_node", "id": "REQ-006-052", "type": "Rule", "owner_fr": "FR-006", "title": "Cancelled and Completed bookings are terminal", "attrs": {"statement": "`Cancelled` and `Completed` are terminal and cannot be cancelled again."}}
  - {"op": "add_node", "id": "REQ-006-053", "type": "Rule", "owner_fr": "FR-006", "title": "Refunds and fees follow the payment placeholder", "attrs": {"statement": "Refunds per cancellation policy example in `system-prd.md`. Provider withdrawal or drop-out after acceptance follows Alternative Flow B5 and its payment placeholder before treatment starts, or Alternative Flow B7 while `In Progress`; the patient pays no cancellation fee.", "rationale": "Restated by Alternative Flow B2 step 6, Screen 9 business rules and Screen 6 business rules."}}
  - {"op": "add_node", "id": "REQ-006-054", "type": "Rule", "owner_fr": "FR-006", "title": "Provider-status cancellation money follows the B5 placeholder", "attrs": {"statement": "Bookings cancelled by an effective provider suspension/deactivation (Alternative Flow B4) are rehomed by admin to a replacement provider in the same inquiry through the Alternative Flow B5 transfer. Its payment placeholder applies: paid amounts move with the patient as credit, any unused part is refunded, and the patient pays no fee; exact mechanics are defined later in FR-007, FR-007B, and FR-017. Provider eligibility is revalidated at booking-confirming payment (FR-015 Rule 9). A payment captured while suspension/deactivation becomes effective is recorded and treated as paid money under the B5 payment placeholder; it never confirms or revives the booking.", "rationale": "Restated by Alternative Flows B4 step 4, B5 payment placeholder and B7 payment placeholder."}}
  - {"op": "add_node", "id": "REQ-006-055", "type": "Rule", "owner_fr": "FR-006", "title": "No patient cancel or retry message for provider-status cascades", "attrs": {"statement": "Patient and admin notifications and the admin support handoff follow FR-015 Screen 4; FR-006 does not send a patient-cancellation or payment-retry message for these bookings."}}
  - {"op": "add_node", "id": "REQ-006-056", "type": "Rule", "owner_fr": "FR-006", "title": "Aftercare provider fault keeps the booking in Aftercare", "attrs": {"statement": "The booking stays `Aftercare` and the treatment record stays unchanged. No new quote, no new acceptance, and no new payment are created, and the AcceptanceEvent is not superseded. When entered from B4, the booking carries the provider-status cause and the `supportRequired` marker; the original provider loses aftercare actions on the case."}}
  - {"op": "add_node", "id": "REQ-006-057", "type": "Rule", "owner_fr": "FR-006", "title": "Travel records carry over to the replacement booking", "attrs": {"statement": "Travel carries over through FR-008: when the replacement booking's travel context is created, the patient's passport record carries over to it, and the flight and hotel records are copied to it and flagged \"travel-date review required\" for admin review. The original travel records stay read-only on the closed booking, and the patient re-enters nothing."}}
  - {"op": "add_node", "id": "REQ-006-058", "type": "Rule", "owner_fr": "FR-006", "title": "Transfer cancels the original booking with ProviderFault first", "attrs": {"statement": "If the original booking is not yet cancelled, submit first cancels it with cause `ProviderFault` and releases its hold or calendar block."}}
  - {"op": "add_node", "id": "REQ-006-059", "type": "Rule", "owner_fr": "FR-006", "title": "Appointment change keeps the original hold expiry", "attrs": {"statement": "An `Accepted` booking keeps its original hold expiry."}}
  - {"op": "add_node", "id": "REQ-006-060", "type": "Rule", "owner_fr": "FR-006", "title": "Booking status lifecycle", "attrs": {"statement": "`Accepted` (subquote accepted, awaiting payment) → `Confirmed` (deposit paid) → `In Progress` (procedure started, via FR-010) → `Aftercare` (treatment complete; aftercare active via FR-011) → `Completed` (aftercare complete / final review submitted). An `In Progress` booking with a provider fault moves to `Aftercare` only through the admin decision on Screen 11 (Alternative Flow B7). From `Accepted`, hold expiry transitions to `Payment Window Expired`. From `Payment Window Expired`, only the audited admin revive returns the booking to `Accepted` with a new hold. `Confirmed` is a booking status only, never a quote status. `supportRequired` is a marker, not a status."}}
  - {"op": "add_node", "id": "REQ-006-061", "type": "Rule", "owner_fr": "FR-006", "title": "Cancelled booking entries", "attrs": {"statement": "**Cancelled entries** (source state, actor, cause): (1) `Accepted`, `Payment Window Expired`, `Confirmed`, `In Progress`, or `Aftercare` → `Cancelled` by admin cancellation (Screen 9), including support-routed patient requests, with the admin's reason; the inquiry also becomes `Cancelled` and the accepted quote stays `accepted` (Alternative Flows B2 and B3). (2) `Accepted` or `Confirmed` → `Cancelled` by the provider-fault transfer, cause `ProviderFault` (Alternative Flow B5). (3) `Accepted` or `Confirmed` → `Cancelled` by the system on an effective provider suspension or deactivation, cause `ProviderSuspended` or `ProviderDeactivated` with `supportRequired = true` (Alternative Flow B4), followed by the B5 transfer. A provider fault or provider-status event while `In Progress` does not cancel the booking; it stays `In Progress` with `supportRequired` until the admin moves it to `Aftercare` with an aftercare reassignment or cancels it through entry (1) (Alternative Flow B7). A provider fault or provider-status event during `Aftercare` does not cancel the booking; it stays `Aftercare` and follows the aftercare reassignment (Alternative Flow B6). `Completed` and `Cancelled` are terminal."}}
  - {"op": "add_node", "id": "REQ-006-062", "type": "Rule", "owner_fr": "FR-006", "title": "Slot release triggers", "attrs": {"statement": "(1) Post-acceptance hold expiry without successful first payment (FR-026 duration, 48h default), (2) Admin cancellation during the hold period, including a support-routed patient request (immediate release per B3 flow), (3) Admin booking cancellation per B2 flow, (4) Provider suspension/deactivation cascade per B4 flow (immediate release, including holds with time remaining), (5) Provider fault before treatment starts per B5 flow, (6) Admin appointment change per Screen 8 (the hold or block moves to the new appointment)."}}
  - {"op": "add_node", "id": "REQ-006-063", "type": "Rule", "owner_fr": "FR-006", "title": "Promotion and price frozen; commission fixed at confirmation", "attrs": {"statement": "The promotion and accepted price are frozen at subquote acceptance and never change in FR-006, except through a new linked acceptance record in Alternative Flow B5. Commission is fixed at booking confirmation on the accepted price after promotion, in the quote currency, read from the acceptance snapshot (FR-029). The commission figure shown on the FR-004 quote screen is indicative only.", "rationale": "Restated by Assumptions (Business Process Assumptions)."}}
  - {"op": "add_node", "id": "REQ-006-064", "type": "Rule", "owner_fr": "FR-006", "title": "Cancellation policy schedule is admin-configured and shown to the patient", "attrs": {"statement": "Cancellation policy schedule (thresholds and refund percentages).", "rationale": "Screen 1 shows the policy summary with its refund schedule (admin-configured) and Screen 2 links to the full policy."}}
  - {"op": "add_node", "id": "REQ-006-065", "type": "Rule", "owner_fr": "FR-006", "title": "Booking notification templates are admin-configured", "attrs": {"statement": "Notification templates for booking confirmations/reminders; booking confirmation content (configured via **FR-030: Notification Rules & Configuration**)."}}
  - {"op": "add_node", "id": "REQ-006-066", "type": "Rule", "owner_fr": "FR-006", "title": "Payment options availability per region and currency", "attrs": {"statement": "Payment options availability per region/currency (cannot alter gateway compliance requirements)."}}
  - {"op": "add_node", "id": "REQ-006-067", "type": "Rule", "owner_fr": "FR-006", "title": "Rescheduling deferred to V2", "attrs": {"statement": "The provider pre-schedules the appointment in the subquote; acceptance fixes the chosen appointment and reserves its slot, and successful payment confirms the booking. Rescheduling functionality will be evaluated for V2 based on business needs. The patient cannot reschedule. Date changes require the audited admin appointment change (Screen 8), which sends `booking.rescheduled`, or an admin cancellation per cancellation policy.", "rationale": "Restated by Alternative Flow A2 and REQ-006-004."}}
  - {"op": "add_node", "id": "REQ-006-068", "type": "Rule", "owner_fr": "FR-006", "title": "Confirmed bookings auto-block provider calendar times", "attrs": {"statement": "Provider calendars must be accurate; confirmed bookings auto-block times at database level; overlapping appointments are prevented.", "rationale": "Restated by Screen 3 business rules (auto-block at database level) and Fixed in Codebase (overlap prevention)."}}
  - {"op": "add_node", "id": "REQ-006-069", "type": "Rule", "owner_fr": "FR-006", "title": "Booking creation is idempotent; confirm and appointment record are atomic", "attrs": {"statement": "Idempotent booking creation with slot holds to prevent race conditions; atomic confirm and appointment-record creation on payment success."}}
  - {"op": "add_node", "id": "REQ-006-070", "type": "Rule", "owner_fr": "FR-006", "title": "Remaining balance is total minus deposit", "attrs": {"statement": "Remaining Balance (Screen 1 data field): \"Total - Deposit\", calculated automatically.", "rationale": "Restated by Screen 2, Screen 4 and Screen 6 field tables (Remaining Balance, calculated)."}}
