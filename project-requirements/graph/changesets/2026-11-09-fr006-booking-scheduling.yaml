  - {"op": "update_node", "id": "ENT-slot-hold", "title": "Calendar slot hold", "attrs": {"description": "A provider's pre-scheduled appointment time (the PRD's Calendar Slot). Acceptance places a temporary exclusive hold keyed by provider, appointment date/time and time zone; the appointment record is created only on successful payment and the hold becomes a provider calendar block. At most one pending or confirmed booking can hold or block one provider, date/time and time zone."}}
