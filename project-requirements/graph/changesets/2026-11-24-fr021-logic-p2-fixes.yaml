  - {"op": "update_node", "id": "REQ-021-006", "title": "Admin manages locales, deactivation, fallback locale, names and direction; Super Admin changes the default and moves a locale to Active", "attrs": {"statement": "Admin MUST be able to manage supported locales, deactivation, fallback locale, native names, and locale direction metadata; only a Super Admin can change the default locale or move a locale to Active."}}
  - {"op": "update_node", "id": "REQ-021-025", "attrs": {"statement": "System MUST provide language/locale catalog data consumable by FR-032 provider spoken-language profile selection and FR-030 template-language selection, without conflating it with provider UI language preference. Interface-language selectors show Active locales only; the spoken-language and template-language lists show all catalog locales (Active, Preparation and Inactive), and an existing entry or template in a locale that becomes Inactive is kept."}}
  - {"op": "update_node", "id": "REQ-021-036", "attrs": {"statement": "Inline text edits save draft changes only; JSON imports default to Import as Draft, with Import and Publish Version allowed only when no row was skipped for an error and the target is not the English source locale, after full validation preview, publish-summary entry, and Super Admin authorization. When any row is skipped for an error, or the target is the English source locale, only Import as Draft is offered."}}
  - {"op": "update_node", "id": "REQ-021-046", "attrs": {"statement": "Editable by Admin: Supported locales, native names, deactivation, fallback locale, and locale direction metadata; Translation values for non-source locales; Translation key metadata such as description/context and group where allowed; Draft translation changes and import confirmations (publish and rollback are Super Admin only); Machine-translation draft generation jobs; Currency display configuration where already owned by A-09/S-02. Not in this list, Super Admin only: machine-translation provider credentials and activation, the free-text translation switch and its monthly budget, and moving a locale to Active."}}
  - {"op": "update_node", "id": "REQ-021-049", "attrs": {"statement": "Default locale changes require approval by the Super Admin alone (no second approver); the new default locale must be Active, and English always remains the last-resort fallback. The default locale is the language shown to a user who has no stored language preference and whose device language is not a supported locale."}}
  - {"op": "update_node", "id": "REQ-021-051", "attrs": {"statement": "Elevated authorization means the Super Admin role as defined in FR-031. Only Super Admin role holders may edit English source values (including by import into the English locale), change the default locale, publish translation versions, and perform rollback operations. These four protected operations cannot be delegated. Moving any locale to Active (REQ-021-125), the free-text translation switch and its budget, and machine-translation provider credentials and activation (REQ-021-122) are also Super Admin only. The exact per-operation permission scope must be aligned with FR-031 configuration at implementation time."}}
  - {"op": "update_node", "id": "REQ-021-072", "attrs": {"statement": "Admin can deactivate languages; deactivation hides the language from the interface-language selectors but preserves translations, versions, and audit history."}}
  - {"op": "update_node", "id": "REQ-021-076", "attrs": {"statement": "Only Active locales appear in the Patient, Provider, and Admin interface-language selectors; Inactive and Preparation locales are hidden from them. The spoken-language and notification-template language lists used by FR-032 and FR-030 show all catalog locales (Active, Preparation and Inactive); an existing entry or template in a locale that becomes Inactive is kept."}}
  - {"op": "update_node", "id": "REQ-021-094", "title": "Unknown keys are blocked; a new key comes only from an English source import", "attrs": {"statement": "Unknown keys are blocked. A new key can be created only by an import into the English source locale, with its English value in that file (library text from the FR-024 treatment form is the one other route, REQ-021-127); an unknown key in any other locale's file is an error."}}
  - {"op": "update_node", "id": "REQ-021-109", "attrs": {"statement": "When the Super Admin adds a provider, the system stores the encrypted credential and verifies the connection. A failed connection sets the provider status to Error and stops; no job starts unless the provider is Connected. The Super Admin can enable or disable a provider; a Disabled provider cannot start a job, and enabling it verifies the connection again."}}
  - {"op": "update_node", "id": "REQ-021-111", "attrs": {"statement": "Provider errors, quota limits, unsupported languages, placeholder mismatches, or malformed outputs are recorded in job history; accepted results remain draft and cannot publish until validation passes. Job status is one of Queued, Running, Completed, Partially failed, or Failed. Only one job per language runs at a time; a new job is refused while one is Queued or Running."}}
  - {"op": "update_node", "id": "REQ-021-114", "title": "Bundle fetch falls back to the cached bundle, else the English source bundle", "attrs": {"statement": "When a bundle fetch fails, use the cached bundle, else the English source bundle."}}
  - {"op": "update_node", "id": "REQ-021-115", "attrs": {"statement": "When the recipient's locale template is missing, follow the Rule 9 order: that locale's fallback locale, then English. FR-021 supplies the locale catalog and fallback locale to FR-030; notification wording lives only in FR-030 templates, not in a translation bundle."}}
  - {"op": "update_node", "id": "REQ-021-119", "attrs": {"statement": "When free-text translation is switched on, free text written by one user for another (messages, free-text fields in an inquiry, provider-authored package names and descriptions, support messages and notes, and reviews) MUST be machine-translated into the reader's own language using the provider the Super Admin chooses for free text, or the single Connected provider when none is chosen; when no provider is Connected, free text MUST be shown untranslated. Uploaded documents MUST NOT be translated. The switch is one platform-wide setting controlled by the Super Admin from the Free-text translation panel on Screen 10 and MUST be off by default."}}
  - {"op": "update_node", "id": "REQ-021-120", "attrs": {"statement": "The Super Admin MUST be able to configure a monthly budget for free-text translation in the Free-text translation panel on Screen 10 (no default figure), in the platform currency and counted per calendar month in UTC; a blank budget means free text is shown untranslated, a budget of zero stops translation, and when the monthly limit is reached the Super Admin MUST be notified once and free text MUST be shown untranslated until the next month."}}
  - {"op": "update_node", "id": "REQ-021-121", "title": "Only an admin holding the Manage Localization permission may use the machine-translation route"}
  - {"op": "update_node", "id": "REQ-021-122", "title": "Manage Localization permission covers every Admin-editable item; Super Admin only items stay with the Super Admin", "attrs": {"statement": "The Manage Localization permission MUST cover every item editable by Admin in REQ-021-046: editing non-English translation values, importing JSON as a draft, generating machine-translation drafts, and managing locales other than the Super Admin-only changes. The Super Admin holds it and MAY grant it to another admin role in the FR-031 permission matrix. Editing the English source, changing the default locale, moving a locale to Active, publishing, rollback, the free-text translation switch and its budget, and provider credentials and activation MUST stay Super Admin only."}}
  - {"op": "update_node", "id": "REQ-021-123", "attrs": {"statement": "An import into the English source locale MUST be treated as an English source edit with the REQ-021-020 controls: Super Admin only, with a change reason, and only Import as Draft is offered (publish later from Screen 9). A new key can be created only by such an import, and its row MUST carry the English value or the row is an error."}}
  - {"op": "update_node", "id": "REQ-021-125", "title": "Moving a locale to Active is Super Admin only and needs a published bundle for every surface", "attrs": {"statement": "Moving a locale to Active, from Preparation or from Inactive, MUST be Super Admin only and MUST require a published bundle for every surface (Patient App, Provider Dashboard, Admin Platform); Active to Preparation is not offered. The default locale MUST be Active."}}
  - {"op": "update_node", "id": "REQ-021-126", "attrs": {"statement": "Provider and admin screens MUST format dates and numbers by the selected locale. Provider screens MUST use the provider timezone set in FR-032 (a value from the FR-026 GMT list); admin screens MUST use the admin's local timezone (REQ-026-050)."}}
  - {"op": "update_node", "id": "REQ-021-127", "attrs": {"statement": "Admin-authored library text (treatment type descriptions and technique specifications) MUST be registered as translation key groups on the Patient App and Provider Dashboard inventories. The FR-024 treatment form is the authoring screen for this English text: saving it MUST write the key's English source value (creating the key if new) and mark dependent translations Review Needed; it is exempt from the Super Admin-only source-edit rule because it is not a registry edit, and translation and publish stay in FR-021. Provider-authored package names and descriptions are free text under REQ-021-119 and are not keys."}}
  - {"op": "update_node", "id": "REQ-021-027", "attrs": {"statement": "The Super Admin MUST be able to configure machine-translation provider credentials for draft generation, with notable provider options including Google Cloud Translation, DeepL, Microsoft Azure Translator, and Amazon Translate. (REQ-021-027)"}}
