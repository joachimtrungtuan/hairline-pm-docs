  - {"op": "update_node", "id": "SET-free-text-translation-enabled", "attrs": {"description": "One platform-wide switch, controlled by the Super Admin only, that turns machine translation of free text between users on or off for the reader (PRD General Module Rule 15, REQ-021-119). It uses the provider the Super Admin chooses for free text, or the single Connected provider; with no Connected provider, free text is shown untranslated."}}
  - {"op": "update_node", "id": "SET-free-text-translation-monthly-budget", "attrs": {"description": "Monthly budget the Super Admin configures for free-text translation, in the platform currency and counted per calendar month in UTC; the PRD gives no default figure. A blank budget means free text is shown untranslated and zero stops translation. At the limit the Super Admin is notified once and free text is shown untranslated until the next month (PRD General Module Rule 16, REQ-021-120).", "unit": "platform currency per calendar month (UTC)"}}
