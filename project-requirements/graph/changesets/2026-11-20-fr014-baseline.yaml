- op: update_node
  id: REQ-014-001
  attrs: {rationale: 'PRD Functional Requirements Summary, REQ-014-001. States the Screen 1 lock; the Screen 1 Rules REQ-014-002 to REQ-014-032 follow it individually. Restated by the Screen 1 lock notice (PO formula/metric-label-only exceptions, Qualified stage removed, TTFQ from distribution, only the New row badge kept).'}
- op: update_node
  id: REQ-014-066
  attrs: {statement: 'System MUST display provider engagement rate, activity-based Dormant provider count, and separately labelled Non-responding provider count (0 first-submitted parent quotes within the Dormant threshold window)'}
- op: update_node
  id: REQ-014-095
  attrs: {statement: 'System MUST display upcoming provider payout obligations table (amount, provider, date, cadence as defined in Assumption 5)'}
- op: update_node
  id: REQ-014-096
  attrs: {statement: 'System MUST display installment plan health donut using FR-007B Plan Status labels (Active / Canceled / Completed / Defaulted); Overdue is a flag on a plan, not a status segment'}
- op: update_node
  id: REQ-014-111
  attrs: {statement: 'System MUST preserve accepted price/currency/locked-rate provenance and historical reporting-conversion provenance; accepted historical prices MUST NOT be overwritten by library changes, cancellation, hold expiry, or later financial adjustments; missing canonical history MUST NOT be filled with an invented alternative price or today''s package/FX value.'}
- op: update_node
  id: REQ-014-153
  attrs: {statement: 'All currency amounts converted using the daily FX rates (the Currency Exchange Rate record owned by FR-029: one fetched rate per pair per day) cached from the currency conversion API; rates locked at the transaction date for historical data. On API failure, fall back to the previous day''s cached rate up to a maximum of 48 hours; beyond 48 hours, affected widgets show "FX data unavailable" instead of rendering with stale rates; Accepted-price observations preserve the FR-005 acceptance snapshot''s original currency, total price, locked exchange rate, and acceptance time. If a different reporting currency needs an additional conversion, use a historical acceptance-date reporting rate and retain its provenance; do not replace the commercial locked rate with today''s rate. Payment/payout records retain their own existing historical financial FX basis. Missing historical provenance yields an unavailable affected amount metric, not an inferred currency, current package price, or current FX value.'}
- op: update_node
  id: REQ-014-161
  attrs: {statement: 'Default provider-role access to the provider analytics screens, using the FR-009 roles. The matrix states the default data-domain grants only; actual visibility is always resolved through Rules 15A and 15B, so a role whose permissions are changed sees whatever its granted data domains allow. Screens or sections a role cannot see are hidden from navigation, not shown as locked. Screen 1 Main Dashboard — Sections A and B (inbox and performance): Owner: Full; Manager: Full; Billing Staff: Hidden; Clinical Staff: Hidden; Screen 1 Main Dashboard — Section C (financials): Owner: Full; Manager: Only with financial permission; Billing Staff: Full; Clinical Staff: Hidden; Screen 2 Performance & Conversion: Owner: Full; Manager: Full; Billing Staff: Hidden; Clinical Staff: Hidden; Screen 3 Patient Analytics: Owner: Full; Manager: Full; Billing Staff: Hidden; Clinical Staff: Satisfaction and aftercare widgets only; Screen 4 Finance & Payouts: Owner: Full; Manager: Only with financial permission; Billing Staff: Full; Clinical Staff: Hidden; Screen 5 Pricing & Benchmarks: Owner: Full; Manager: Full; Billing Staff: Full; Clinical Staff: Hidden; Screen 6 Export Report Configuration: Owner: Full; Manager: Exports limited to the screens and widgets the user can see; Billing Staff: Exports limited to the screens and widgets the user can see; Clinical Staff: Exports limited to the screens and widgets the user can see (Screen 3 exports contain only the satisfaction and aftercare widgets)'}
- op: update_node
  id: REQ-014-177
  attrs: {statement: 'There is no per-clinic payout frequency. Payout cadence, wherever shown in this FR, means how the payout is released: automatic release on the Stripe Connect rail, or on the manual rail the single settlement-period setting owned by FR-029 (default weekly, Sunday cutoff, Wednesday payout) that applies to all manually paid clinics'}
- op: update_node
  id: REQ-014-193
  attrs: {statement: 'Chart: Column bar (monthly, last 6–12 months) + inline table (2–3 rows); Inline table columns: Type, Period, Amount, Scheduled Date, Cadence; Type = the provider display status from the Screen 4 Widget 8 FR-017 mapping (Upcoming / Processing / Paid / Failed; Voided is never shown). Rows: the next Upcoming payout, any Processing or Failed payout, then the most recent Paid payout, up to 3 rows. Scheduled Date = FR-017 scheduled payout date; for Paid rows it shows the paid date. Cadence = how the payout is released (see Assumption 5), not a per-clinic frequency. Definition only; columns and layout unchanged; Drill-down: click bar → Payout statements list (CSV/PDF export)'}
- op: update_node
  id: REQ-014-216
  attrs: {statement: 'Chart type: Donut + KPI summary; Segments: Installment payments · Full payments; KPI: Avg number of installments for installment plans; Trend: Monthly installment adoption rate = bookings first confirmed in the month whose payment is an FR-007B installment plan ÷ all bookings first confirmed in the month (one observation per booking); Drill-down: Click segment → Payments list filtered by payment type; Data source: the payment type (`payments.payment_type`, value `installment` versus full payment) for the payment split; FR-007B installment plan records for the average installment count and the adoption rate. The donut counts payment records; the adoption rate counts bookings, so the two values are not interchangeable.'}
- op: update_node
  id: REQ-014-218
  attrs: {statement: 'Chart type: Column bar chart (monthly, full history) + paginated table below; Bar chart: Last 12 months of disbursed payouts; Table columns: Period · Amount · Status (Upcoming / Processing / Paid / Failed) · Paid date · Cadence (how the payout is released, see Assumption 5); All rows: Full history (not limited to the 2–3 rows shown in the Main Dashboard Section C4 inline table); Drill-down: Click bar or row → Payout statement detail (CSV/PDF export); Payout status mapping (FR-017): Upcoming: No statement yet for the period, or Pending Approval, Approved, or Overdue (internal admin review states are not shown to providers); Processing: Processing (Stripe transfer initiated); Paid: Paid (`transfer.paid`); Paid date = webhook time; Failed: Failed (`transfer.failed`); returns to Processing when admin retries; (not shown): Voided — excluded from the provider''s payout chart, table, totals, and exports. Voided is an internal admin audit state; the period appears as Upcoming again once FR-017 re-generates a statement on the next payout cycle'}
- op: update_node
  id: REQ-014-221
  title: Payout history shows each payout period with its display status
  attrs: {statement: 'Payout history shows each payout period with its provider display status (Upcoming, Processing, Paid or Failed) per the Payout status mapping above; future payouts beyond the next scheduled one are not projected'}
- op: update_node
  id: REQ-014-249
  attrs: {statement: 'Value: % of active providers who first submitted at least 1 parent quote within the Dormant threshold window (FR-026 Analytics Configuration, default 30 days) ending at the period end. "Active providers" here means account `status = active` (the Tile 1 definition, FR-015), not the activity-based Active engagement status in Screen 8 Widget 3; Sub-values: Dormant providers (engagement status from Screen 8 Widget 3, based on provider activity) and Non-responding providers (0 first-submitted parent quotes within the same Dormant threshold window; drafts, child records, edits, and resends do not count as new submissions). These are separate counts; a provider can be active but non-responding. Tap → Screen 8 engagement section filtered to dormant'}
- op: update_node
  id: REQ-014-259
  attrs: {statement: 'All three sections respect the time range filter. In Section A: Tile 1 shows providers with `status = active` at the end of the selected period plus those onboarded within it; Tiles 2 and 3 count records created within the period, compared with the prior equivalent period; Tile 4 tiers providers from TTFQ observations in the period; Tile 5 uses the trailing Dormant threshold window (default 30 days) ending at the period end, with engagement status as at the period end'}
- op: update_node
  id: REQ-014-286
  attrs: {rationale: PRD Screen 11 Widget 6 (widget specification) and its Functional Requirements Summary line REQ-014-286.}
- op: update_node
  id: REQ-014-294
  attrs: {statement: 'Chart type: KPI tile + table; KPI: Total upcoming payout amount (next 30 days); Table columns: Provider · Amount · Payout date · Cadence (how the payout is released, see Assumption 5) · Status (FR-017: Pending Approval / Approved / Overdue / Processing); Sort: Payout date ascending; Drill-down: Click row → provider payout detail in FR-017'}
- op: update_node
  id: REQ-014-295
  attrs: {statement: 'Chart type: Donut + KPI; Segments: Active · Canceled · Completed · Defaulted (FR-007B Plan Status labels; Overdue is a flag on a plan, not a status segment); KPI: Total outstanding installment balance (Active plans, including those flagged Overdue, and Defaulted plans); Data source: `installment_plans` table status, using the FR-007B Plan Status values unchanged; Drill-down: Click segment → Installment plans list filtered by status'}
