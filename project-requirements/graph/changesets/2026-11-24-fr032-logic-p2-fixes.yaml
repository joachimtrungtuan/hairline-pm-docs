  - {"op": "update_node", "id": "REQ-032-061", "attrs": {"statement": "Account Name field is read-only for Owner role; it automatically syncs when clinic name is updated in Tab 1; If Owner updates clinic name in Tab 1, Account Name in Tab 2 updates automatically (within 1 minute); when the Owner role is handed over (REQ-009-174) the new Owner's Account Name is set to the clinic name and the previous Owner's is reset to First Name + Last Name"}}
