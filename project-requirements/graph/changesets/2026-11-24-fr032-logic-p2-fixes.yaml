  - {"op": "update_node", "id": "REQ-032-071", "attrs": {"statement": "System creates account closure request record with status \"Pending Admin Review\" (only one pending request per provider; no booking or payout check blocks submission). While a request is Pending Admin Review the closure card shows \"Closure requested on DD-MM-YYYY, awaiting admin review\" (plus \"Deactivation scheduled for DD-MM-YYYY\" when the admin scheduled a date) with the button disabled, and returns to normal when the request is Rejected; a second submission while one is pending is refused with \"A closure request is already pending.\""}}
  - {"op": "update_node", "id": "REQ-032-073", "title": "Closure confirmation states the 5-business-day review target", "attrs": {"statement": "System displays confirmation to provider \"Account closure request submitted. We aim to review and process your request within 5 business days. You will receive an email once your account is deactivated.\""}}
  - {"op": "update_node", "id": "REQ-032-102", "attrs": {"statement": "Support Request Form - Subject: Min 10, max 200 chars (FR-034 REQ-034-130); Support Request Form - Message: Max 5000 chars, min 20 chars; Support Request Form - Priority: Default: Medium; Support Request Form - Attachments: Up to 5 files, 10MB each, formats JPG, PNG, PDF, DOC, DOCX (FR-034 REQ-034-036, REQ-034-037)"}}
  - {"op": "update_node", "id": "REQ-032-104", "attrs": {"statement": "Feedback Form - Title: Min 10, max 100 chars (FR-034 REQ-034-130); Feedback Form - Description: Max 5000 chars, min 20 chars; Feedback Form - Priority: Default: Low"}}
  - {"op": "update_node", "id": "REQ-032-114", "attrs": {"statement": "The reopen request is sent to FR-034 as a flagged message in the case thread; the case stays Closed until the admin reopens it; the provider sees \"Request sent, awaiting admin\" with the reply box disabled; FR-034 notifies the admin through the user-reply notice (support.case_user_reply, REQ-034-178). When an admin accepts the request, the admin reopens the case in FR-034 (status Open, REQ-034-145), which enables the reply box again; when an admin answers but keeps the case Closed, the \"Request sent, awaiting admin\" banner clears and the Request Reopen button returns, so the provider may ask again"}}
  - {"op": "update_node", "id": "REQ-032-125", "title": "Phone number and country code are required; the number is unique and a changed number is verified", "attrs": {"statement": "A phone number with its country code is required on Account Settings: it can be replaced but not removed; it is unique per user within the provider, and a changed number is verified as in FR-009 (REQ-009-113)."}}
  - {"op": "update_node", "id": "REQ-032-141", "attrs": {"statement": "System MUST apply the who-edits-what table in Screen 1 (General Business Rules): clinic profile, languages, awards and documents are edited by the Owner and a Manager by default, gated by the FR-031 permission \"Edit Profile\"; notification settings are gated by \"Edit Notification Settings\" (REQ-032-142); the account closure request by the Owner only; personal account settings by every role for their own account only; billing settings need the permission \"View and Edit Billing Settings\", held by FR-031 with the default Owner only (REQ-031-005)."}}
  - {"op": "update_node", "id": "REQ-032-142", "title": "Holders of Edit Notification Settings change the notification settings", "attrs": {"statement": "System MUST let only the holders of the FR-031 permission \"Edit Notification Settings\" (by default the Owner and a Manager) change the clinic's notification settings; other roles see them read-only; every change is audit-logged with the user who made it."}}
  - {"op": "update_node", "id": "REQ-032-145", "title": "Timezone is saved per person and set silently at first login", "attrs": {"statement": "System MUST save the timezone per person; at a person's first login System MUST set it without a prompt to the listed whole-hour offset nearest to the browser time zone (UTC when the browser zone cannot be read), and the person can change it on Screen 2 at any time; dates display with the fixed offsets of the FR-026 timezone list (REQ-026-121)."}}
  - {"op": "update_node", "id": "ENT-team-member.timezone", "attrs": {"description": "This person's local timezone for date/time display; fixed-offset option from the FR-026 list (GMT-12 to GMT+14). Empty only before the person's first login; at first login it is set without a prompt to the listed whole-hour offset nearest to the browser time zone, or UTC when the browser zone cannot be read, and the person can change it at any time."}}
