  - {"op": "add_node", "id": "REQ-010-116", "type": "Rule", "title": "Early close of an In Progress case without a fault, record becomes Closed Early", "owner_fr": "FR-010", "attrs": {"statement": "System MUST let an admin close an In Progress case early on FR-006 Screen 11 when the provider is not at fault, set the treatment record to Closed Early, stop reminders and the Overdue Documentation flag, and never have the admin fill the End of Treatment fields (Rule 17; Alternative Flow B4)", "rationale": "Business Rules, Rule 17. FR-006 owns the decision screen; the FR-010 side is the record status and the reminders."}}
