reason: FR-010 logic review round 1 - early close and Closed Early, End Treatment gate and deadline start, completion handoff (FR-006 status change, FR-007 window), one Check In rule with late Check In, admin-recorded provider fault, plan-detail lock at treatment end, dashboard flags in place of admin notices, and Step routing to the FR-006 Screen 11 decision
by: docs-manager
operations:
  - {"op": "update_node", "id": "REQ-010-006", "title": "Completion signalled to FR-011; FR-006 moves the booking to Aftercare at the End Treatment save", "attrs": {"statement": "System MUST signal treatment completion to FR-011 upon provider saving the End of Treatment modal. FR-006 owns the status change to \"Aftercare\", made at that save; FR-011 owns aftercare plan activation"}}
  - {"op": "update_node", "id": "REQ-010-010", "title": "Documentation due within the deadline from when End Treatment becomes available, with reminders", "attrs": {"statement": "System MUST send the first documentation reminder at the reminder-timing setting (default 12 hours after the End Treatment gate is first met) and the second at the configured completion deadline (default 24 hours) while documentation is incomplete, then flag the case as Overdue Documentation on the admin dashboard; the reminder time must be earlier than the deadline, and reminders stop when the case is Closed Early or blocked; enforcement is reminders plus the flag only and nothing is blocked"}}
  - {"op": "update_node", "id": "REQ-010-027", "attrs": {"statement": "System MUST make FR-010 the only path for post-acceptance changes to treatment plan days, clinician set, and estimated graft count (apart from the admin edit of the accepted quote, REQ-005-023), blocked while the booking is `Accepted` and limited to the clinic (Owner, Manager, or Clinical Staff, from `Confirmed` until Check In) and admins (from `Confirmed` until the treatment ends); each change MUST require a reason, be audited with before/after values, notify the patient through the FR-030 `treatment.plan_changed` event, leave the accepted snapshot unchanged, and never change money fields (Rule 13; Alternative Flow A2)"}}
  - {"op": "update_node", "id": "REQ-010-030", "title": "Admin Change Treatment Details screen from Confirmed until the treatment ends", "attrs": {"statement": "System MUST give admins the Change Treatment Details screen (Screen 9) for any booking from `Confirmed` until the treatment ends, with mandatory reason, a before and after confirmation step, a Treatment Detail Change record, an audit entry, and the `treatment.plan_changed` event; the clinic form follows the same rules but closes at Check In"}}
  - {"op": "update_node", "id": "REQ-010-031", "attrs": {"statement": "System MUST NOT let any user set a booking or case status by hand in FR-010; provider Cancel / Close Case requests and admin case closures resolve only through the FR-006 governed actions (change appointment, cancel booking before Check In, provider-fault transfer, the Screen 11 In Progress decision)"}}
  - {"op": "update_node", "id": "REQ-010-036", "attrs": {"statement": "System MUST allow at most one treatment In Progress per patient; the limit is enforced in the Check In rule, and a case with the `supportRequired` marker or Closed Early does not count as In Progress (Rule 3, Rule 7)"}}
  - {"op": "update_node", "id": "REQ-010-037", "title": "Plan days, clinician set and estimated graft count locked for providers after Check In and for everyone once the treatment ends", "attrs": {"statement": "Plan day descriptions, the assigned clinician set, and the estimated graft count are locked for providers once Check In is performed; locked for everyone while the booking is `Accepted`; changeable by the clinic from `Confirmed` until Check In and by an admin from `Confirmed` until the treatment ends (End Treatment saved or Closed Early), only through the treatment-detail change (Rule 13); from the end of the treatment they are locked for everyone and the actual graft count is the correction path (Rule 8)"}}
  - {"op": "update_node", "id": "REQ-010-051", "attrs": {"statement": "Admin can configure the documentation completion deadline (default 24 hours, range 12-48 hours, counted from the moment the End Treatment gate is first met) and the first reminder timing (default 12 hours; must be earlier than the deadline); reminders stop when the case is Closed Early or blocked"}}
  - {"op": "update_node", "id": "REQ-010-057", "title": "Completion timestamp used for billing reconciliation; shown on the admin dashboard", "attrs": {"statement": "Treatment completion timestamp is used for billing reconciliation and reporting; the completed treatment shows on the admin dashboard"}}
  - {"op": "update_node", "id": "REQ-010-076", "title": "Patient no-show: Report Issue Before Check In flags the case for the admin; booking stays Confirmed", "attrs": {"rationale": "Alternative Flow B1. The outcome states no financial penalty; the admin decides rebook or cancel.", "statement": "A provider reports a patient no-show with Report Issue Before Check In after trying to reach the patient (no fixed waiting time); the system flags the case for the admin on the dashboard, the booking stays Confirmed, and the admin decides case by case whether to rebook or cancel; any refund follows the FR-006 refund rules; No-Show stays an admin case label (Alternative Flow B1)"}}
  - {"op": "update_node", "id": "REQ-010-077", "title": "Medical postponement: Report Issue Before Check In flags the case for the admin; booking stays Confirmed"}
  - {"op": "update_node", "id": "REQ-010-079", "title": "Provider closes an In Progress case with a reason; the admin sees a dashboard flag and closes it early on FR-006 Screen 11", "attrs": {"statement": "A provider close request on an In Progress case flags the case for the admin on the dashboard with reason and note; the case stays In Progress until the admin closes it early on FR-006 Screen 11 without a fault, or resolves a provider fault through the Screen 11 decision (Rule 17, Alternative Flow B4)"}}
  - {"op": "update_node", "id": "REQ-010-086", "title": "If the FR-011 signal fails, the treatment stays complete, the booking stays in Aftercare, and the admin retries the signal", "attrs": {"statement": "If the signal to FR-011 fails, the treatment is still marked complete in FR-010 and FR-006 still moves the booking to Aftercare; the admin dashboard shows a failed-signal flag and the admin action is a retry of the signal (Rule 18, Integration 4)"}}
  - {"op": "update_node", "id": "REQ-010-104", "title": "End Treatment enabled when every day is terminal, at least one day is finished, and the case is not on hold", "attrs": {"statement": "End Treatment is enabled only when every day record is in a terminal status (Finished, Need caution/attention, or Cancelled/Deferred), at least one day is Finished or Need caution/attention, and the booking carries no `supportRequired` marker; a case with every day Cancelled/Deferred goes to the early close (Rule 17); the documentation deadline starts when the gate is first met"}}
  - {"op": "update_node", "id": "REQ-010-106", "title": "Check In allowed only when Confirmed, procedure date reached, fully paid, not on hold, and no other case In Progress", "attrs": {"statement": "System MUST allow Check In only when the booking is Confirmed, the procedure date is today or in the past in the appointment timezone, the booking is fully paid with no Defaulted installment, it has no `supportRequired` marker, and the patient has no other treatment In Progress; otherwise Check In is disabled and a generic reason is shown to the provider. This is the one merged Check In rule (Rule 3; Payment Rule 2)"}}
  - {"op": "update_node", "id": "REQ-010-107", "title": "Report Issue Before Check In control for No-show and Medical postponement; flags the case for the admin only", "attrs": {"statement": "System MUST give providers a Report Issue Before Check In control on a Confirmed case, with the reasons No-show and Medical postponement, that only flags the case for the admin and leaves the booking Confirmed; Cancel / Close Case remains available only while the case is In Progress, with the Alternative Flow B4 reason list (Alternative Flows B1, B2 and B4; Screen 4)"}}
  - {"op": "update_node", "id": "REQ-010-070", "title": "Check In unavailable shows a generic reason; the admin sees the payment detail and can assist"}
  - {"op": "update_node", "id": "REQ-010-042", "attrs": {"statement": "After subquote acceptance, FR-010 is the only path for changing the treatment plan days, the assigned clinician set, and the estimated graft count, apart from the admin edit of the accepted quote (REQ-005-023); the rest of this rule governs the FR-010 path. No change is allowed while the booking is `Accepted` (unpaid); changes are allowed only from `Confirmed`. Only the clinic (Owner, Manager, or Clinical Staff, from `Confirmed` until Check In) or an admin (from `Confirmed` until the treatment ends) may make the change. Each change MUST record actor, role, reason, timestamp, and before/after values; MUST notify the patient through the FR-030 `treatment.plan_changed` event; MUST leave the accepted snapshot unchanged as the original record; and MUST NOT change price, currency, date range, appointment, or promotion (Alternative Flow A2). Admin changes use FR-010 Screen 9."}}
  - {"op": "update_node", "id": "REQ-010-073", "title": "Admin treatment-detail change available from Confirmed until the treatment ends, never while Accepted, Expired or Cancelled", "attrs": {"statement": "The admin may use this screen from `Confirmed` until the treatment ends (End Treatment saved or the case Closed Early), including after Check In; it is never available while the booking is `Accepted`, `Payment Window Expired`, or `Cancelled`, nor once the treatment has ended; the actual graft count stays the correction path afterwards."}}
  - {"op": "update_node", "id": "REQ-010-095", "attrs": {"statement": "System sends the first reminder to the provider at the reminder-timing setting (default 12 hours after the End Treatment gate is first met) if documentation is still incomplete; the second reminder follows at the configured completion deadline (default 24 hours); the admin dashboard then flags the treatment as \"Overdue Documentation\" for manual follow-up. Reminders and the flag stop when the case is Closed Early or blocked. Enforcement is reminders plus the flag only; nothing is blocked."}}
  - {"op": "update_node", "id": "REQ-010-059", "title": "No-Show: the booking stays Confirmed and any refund follows the FR-006 refund rules", "attrs": {"statement": "If a case is flagged as No-Show, the booking stays Confirmed and any refund follows the FR-006 refund rules (EC-004)."}}
  - {"op": "update_node", "id": "SCR-010-09", "attrs": {"description": "Let an admin change a case's current treatment plan days, assigned clinician set, and estimated graft count from `Confirmed` until the treatment ends (Alternative Flow A2). The clinic uses the same form from Screen 4, but only from `Confirmed` until Check In."}}
  - {"op": "update_node", "id": "REQ-010-043", "attrs": {"statement": "Price, currency, date range, accepted appointment baseline, and promotion are read only from the accepted snapshot, reached through the FR-006 booking's AcceptanceEvent. The operative procedure date (Check In gate and displays) is the current FR-006 booking appointment, which equals the snapshot appointment unless an approved FR-006 admin date change or an admin edit of the accepted quote's date range or appointment (REQ-005-023) applies. FR-010 never edits the snapshot or reads these values from live FR-004 records. The case's current treatment details are seeded from the same snapshot and then change only under Rule 13. An admin emergency edit changes only the appointment time on the same date and the booking notes, so it never moves the Check In date; date changes go through the FR-006 Change Appointment action (FR-006 Screen 8)."}}
  - {"op": "update_node", "id": "SET-documentation-completion-deadline", "attrs": {"description": "Treatment documentation completion deadline, counted from the moment the End Treatment gate is first met; admin can adjust within 12 to 48 hours. Owner is FR-010 because only the FR-010 PRD states it (ownership question for FR-026)."}}
  - {"op": "update_node", "id": "SET-documentation-reminder-timing", "attrs": {"description": "Timing of the first reminder when documentation is not completed, counted from the moment the End Treatment gate is first met; must be earlier than the deadline; admin configurable. Owner is FR-010 because only the FR-010 PRD states it."}}
  - {"op": "add_node", "id": "REQ-010-115", "type": "Rule", "title": "Admin notices from FR-010 are dashboard flags, not FR-030 events", "owner_fr": "FR-010", "attrs": {"statement": "System MUST show the admin notices raised by FR-010 (report issue before Check In, close request, Late Check In, Overdue Documentation, failed completion signal) as dashboard flags, not FR-030 events; the action on a failed completion signal is a retry (Rule 18)", "rationale": "Business Rules, Rule 18. No FR-030 event exists for these notices."}}
