  - {"op": "add_node", "id": "REQ-010-118", "type": "Rule", "title": "Late Check In after the appointment date needs a provider confirmation and shows an admin flag", "owner_fr": "FR-010", "attrs": {"statement": "System MUST allow Check In after the appointment date with no upper limit, require the provider to confirm a late Check In prompt, and show the admin a Late Check In flag (Alternative Flow A3)", "rationale": "Alternative Flow A3. Dates are compared in the booking's appointment timezone."}}
