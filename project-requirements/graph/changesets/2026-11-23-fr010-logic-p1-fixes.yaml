  - {"op": "add_node", "id": "REQ-010-117", "type": "Rule", "title": "End Treatment save marks completion, moves the booking to Aftercare under FR-006, and starts the confirmation window", "owner_fr": "FR-010", "attrs": {"statement": "System MUST mark the treatment Completed at End Treatment save, have FR-006 move the booking to Aftercare in the same step whether or not the FR-011 signal is delivered, and start the FR-007 patient confirmation window at that moment (Integration 5)", "rationale": "Business Rules, Integration 5. FR-006 owns the booking status change; FR-007 owns the confirmation window."}}
