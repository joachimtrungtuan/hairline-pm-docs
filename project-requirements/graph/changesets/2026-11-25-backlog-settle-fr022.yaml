  - {"op": "update_node", "id": "REQ-022-040", "attrs": {"statement": "System MUST allow providers to filter their analytics dashboard by date range and country on its header (FR-014 / Screen 1) and to filter the Performance & Conversion screen (FR-014 / Screen 2) by treatment type as well; the filters are owned by FR-014 (REQ-014-181)"}}
  - {"op": "update_node", "id": "REQ-022-079", "attrs": {"statement": "FR-014 / Screen 1: Provider Analytics Dashboard [P1 — MVP]. Provider filters analytics reports by date range and country. Filters: Date Range (Type: Segmented + custom picker; Options: Today, This week, Last 4 weeks, Last 12 weeks, Custom; Default: Last 4 weeks; Logic: Single selection) / Country (Type: Multi-select; Options: All countries; Default: All countries; Logic: OR (within field)). Notes: No search input on this screen — filtering only. Treatment type is not a filter on this screen: FR-014 / Screen 2 (Performance & Conversion) filters by it, and FR-014 owns the filters (the Screen 1 header filters are REQ-014-181)."}}
  - {"op": "update_node", "id": "REQ-022-059", "attrs": {"statement": "Patient Platform: [P2] Provider Search is accessed when the patient begins the quote request flow and needs to select destination/providers, is triggered from the \"Choose Destination\" or \"Select Providers\" screens, and is available throughout the quote request journey for comparison; [P1] Messaging search is accessed from the patient communications inbox; [P1] Help & Support search is accessed from the Help & Support hub, Help Center, and My Support Tickets screens. Provider Platform: PR-01 (Team) from Provider Dashboard → Team tab → Team Management Dashboard (FR-009/Screen 1); PR-02 (Inquiries/Quotes) from Provider Dashboard → Inquiries tab → Inquiry List (FR-003/Screen 9) and Quotes List (FR-004/Screen 2); PR-03 (Treatment) from Provider Dashboard → Treatments tab → In Progress Cases (FR-010/Screen 3); PR-04 (Aftercare) from Provider Dashboard → Aftercare tab → Aftercare Cases List (FR-011/Screen 8); PR-05 (Analytics) from Provider Dashboard → Analytics tab → Analytics Dashboard (FR-014/Screen 1); PR-06 (Profile/Settings) from Provider Dashboard → Profile/Settings section — Packages (FR-024/Screen 4), Help Centre (FR-032/Screen 5), Reviews (FR-032/Screen 1 Tab 5), Support Cases (FR-032/Screen 5.7); PR-07 (Messaging) [P1 - MVP] from the provider secure messaging inbox. Admin Platform [P1 - MVP]: each admin module (A-01 through A-10) provides context-specific search and filtering within its own interface."}}
  - {"op": "update_node", "id": "REQ-022-103", "attrs": {"statement": "FR-017 / Screen 7 / Tab 1: Transaction Search [P1 — MVP]. Admin searches for any financial transaction using multiple lookup fields and narrows results by type, date, and status. Search: Search By (type selector) (Dropdown; Booking Reference, Invoice Number, Patient Name/ID, Provider Name/ID, Affiliate Name/ID; Booking Reference; Determines search context) / Search Input (Type: text; Placeholder: Auto-updates per \"Search By\" selection; Debounce: 500ms; Notes: Free-text; case-insensitive; scoped to selected type). Filters: Record Type (Type: Multi-select; Options: Invoice, Provider Payout, Installment, Refund, Affiliate Commission; Default: All; Logic: OR (within field)) / Date Range (Type: Date range picker; Options: Custom; Default: All dates; Logic: Filters by transaction date) / Status (Type: Multi-select; Options: Dynamically scoped to selected Record Type(s) — see enumeration below; Default: All; Logic: OR (within field)). Notes: Status options by Record Type (when multiple Record Types are selected, the union of all applicable statuses is shown): Invoice: Pending, Partial, Paid, Overdue, Refunded, At Risk. Provider Payout: Pending, Approved, Paid, Voided, Failed. Installment: Active, Completed, Canceled, Defaulted (Overdue is a calculated flag with its own yes/no filter, not a status). Refund: Processing, Completed, Failed. Affiliate Commission: Pending, Paid, Failed, Cancelled."}}
