  - {"op": "add_edge", "from": "SCR-028-02", "verb": "shows", "to": "ENT-location-starting-price.country_code", "attrs": {"provenance": "user input", "label": "Fallback Patient Country", "editable": true}}
  - {"op": "add_edge", "from": "REQ-028-007", "verb": "applies to", "to": "ENT-location-starting-price.country_code"}
