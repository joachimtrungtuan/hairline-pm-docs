reason: "Requirements graph programme baseline 2026-11-20: owner rulings applied (FR-028)"
by: controller
operations:
  - {"op": "add_node", "id": "SET-system-wide-default-starting-price", "type": "Setting", "owner_fr": "FR-028", "title": "System-wide default starting price", "attrs": {"description": "One default starting price (one amount and its currency), set by admins on the pricing screen (Screen 2); empty until an admin sets it. Shown when no specific or fallback price applies, before any converted price is used."}}
  - {"op": "add_node", "id": "REQ-028-087", "type": "Rule", "owner_fr": "FR-028", "title": "Price stops showing after its expiry date; fallback then system-wide default shows", "attrs": {"statement": "After a starting price's expiry date has passed, patients MUST no longer see that price; they see the fallback price for their country, then the system-wide default starting price. Prices with no expiry date stay active until an admin changes them", "rationale": "Screen 2 Price Expiry business rule and Functional Requirements Summary. Prices with no expiry date are REQ-028-062."}}
  - {"op": "add_edge", "from": "REQ-028-087", "verb": "applies at", "to": "STG-main-01-inquiry"}
  - {"op": "add_node", "id": "REQ-028-088", "type": "Rule", "owner_fr": "FR-028", "title": "System-wide default starting price, set on the pricing screen, empty at launch", "attrs": {"statement": "System MUST provide one system-wide default starting price (one amount and its currency), set by admins on the pricing screen; it is empty until an admin sets it", "rationale": "Screen 2 field System-Wide Default Starting Price and Functional Requirements Summary. Where it sits in the price lookup is REQ-028-039 and REQ-028-040."}}
  - {"op": "add_edge", "from": "REQ-028-088", "verb": "applies at", "to": "STG-main-01-inquiry"}
