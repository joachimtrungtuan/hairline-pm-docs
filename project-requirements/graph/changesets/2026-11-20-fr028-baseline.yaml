  - {"op": "update_node", "id": "ENT-location-starting-price.location_id", "attrs": {"description": "Treatment destination: a provider location (country / city); must be a valid location in the system."}}
  - {"op": "update_node", "id": "REQ-028-004", "title": "Starting price in the patient's currency, else fallback for the patient's country, then system-wide default, then converted location default currency", "attrs": {"statement": "System MUST display starting prices in patient's preferred currency; if the specific currency is not configured, it falls back to the fallback price for the patient's country, then to the system-wide default starting price, then to the price in the location's default currency with conversion"}}
  - {"op": "update_node", "id": "REQ-028-007", "title": "Fallback pricing chosen by the patient's country when the patient's currency is not configured", "attrs": {"statement": "System MUST support fallback pricing for locations when patient's specific currency is not configured; the fallback price is chosen by the patient's country"}}
  - {"op": "update_node", "id": "REQ-028-010", "title": "Starting price stored with location, currency, amount, dates, fallback flag and fallback patient country", "attrs": {"statement": "System MUST store starting price configuration with location, currency, amount, effective date, expiry date, fallback flag, and (for a fallback price) the patient country it applies to"}}
  - {"op": "update_node", "id": "REQ-028-039", "attrs": {"statement": "For each displayed location System looks up the starting price for the location and currency combination: if specific pricing exists, display that price; if not, display the fallback price for the location chosen by the patient's country (if configured); if there is no fallback, display the system-wide default starting price (if an admin has set one)."}}
  - {"op": "update_node", "id": "REQ-028-040", "title": "Missing price in the patient's currency: fallback for the patient's country, else system-wide default, else converted location default price", "attrs": {"statement": "When the patient's currency has no pricing for the location, System checks for fallback pricing for the patient's country; if none, it displays the system-wide default starting price when an admin has set one; if there is no system-wide default, it displays the price in the location's default currency with a conversion note (\"Starting from €2,200 (approx. £2,500)\") using the real-time exchange rate from the FR-029 currency service."}}
  - {"op": "update_node", "id": "REQ-028-041", "attrs": {"statement": "When no fallback or system-wide default is configured and currency conversion is unavailable, System displays the location without a starting price, shows the text \"Price available on request\" to the patient and logs an error for admin review; the admin dashboard shows \"[Location] missing fallback pricing - patients seeing no price estimate.\""}}
  - {"op": "update_node", "id": "REQ-028-045", "title": "Future phase: admin can enable or disable specific destinations for specific patient regions"}
  - {"op": "update_node", "id": "REQ-028-046", "title": "Admin notified when a regional grouping or starting price change is saved", "attrs": {"statement": "System sends the admin who saves a regional grouping change or a starting price change a system notification that the save went through.", "rationale": "Communication Structure, In Scope."}}
  - {"op": "update_node", "id": "REQ-028-049", "attrs": {"statement": "Admin reaches the configuration at Settings > General Settings, on the Location Presentation by Country tab or the Location Pricing tab, with the System Configuration permission (per FR-031), and changes take effect on save within the 1-minute cache propagation. Patient reaches it through the \"Choose Your Destination\" screen of the quote request flow, where System determines the patient's location from profile or IP geolocation, applies the regional configuration to filter and order the destinations, and shows starting prices in the patient's preferred currency.", "rationale": "Entry Points; the PRD now names the two tabs."}}
  - {"op": "update_node", "id": "REQ-028-050", "attrs": {"statement": "After a successful save System confirms: \"Regional grouping saved. Changes will be live for patients within 1 minute.\" for a grouping; \"Starting price for [Location] in [Currency] set to [Amount].\" for a price; \"Fallback pricing enabled for [Location]. Patients from [Country] without specific pricing will see these prices.\" for fallback pricing; \"[X] currency prices updated for [Location].\" for a bulk update."}}
  - {"op": "update_node", "id": "REQ-028-056", "attrs": {"statement": "To set fallback pricing the admin goes to Location Pricing > Fallback Pricing, selects the destination, enables the fallback pricing option, selects the patient country the fallback price applies to, enters the fallback price per currency and a change reason; System saves the fallback configuration."}}
  - {"op": "update_node", "id": "REQ-028-059", "title": "Bulk update action visible on the pricing screen, enabled only with a destination or rows selected", "attrs": {"statement": "The Bulk Update Pricing action is visible on the pricing screen and enabled only when a destination is selected or at least one pricing row is checked; the bulk update modal (percentage or fixed adjustment, no CSV import or export) requires a change reason before apply."}}
