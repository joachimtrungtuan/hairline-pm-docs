  - {"op": "update_node", "id": "REQ-008-005", "attrs": {"statement": "The system MUST automatically request passport details from the patient once when the linked FR-006 booking becomes **Confirmed** and the accepted option snapshot yields Path A, except for items already carried over to a replacement booking under REQ-008-032. No provider or admin trigger is required."}}
  - {"op": "update_node", "id": "REQ-008-034", "attrs": {"statement": "The system MUST automatically request flight and hotel details (no passport) from the patient once when the linked FR-006 booking becomes **Confirmed** and the accepted option snapshot yields Path B, except for items already carried over to a replacement booking under REQ-008-032. No provider or admin trigger is required."}}
  - {"op": "update_node", "id": "REQ-008-018", "attrs": {"statement": "The binary travel path MUST be derived from `included_services` in the accepted FR-004 Quote Option snapshot carried by the FR-005 AcceptanceEvent, not selected by the provider in FR-008. `flight` or `hotel` (the FR-004 `accommodation` item type) yields `provider_included` (Path A); neither yields `patient_self_booked` (Path B), including transport-only options. FR-008 MUST persist the derived path and accepted inclusions in TravelContext at booking confirmation. Path A allows provider entry only for included flight/hotel services and never patient entry; Path B allows patient entry only and never provider entry. An omitted Path A flight/hotel service is \"Not included\" and is not collected in MVP. The reusable package preset and parent quote are not the authority for this choice."}}
  - {"op": "update_node", "id": "REQ-008-028", "attrs": {"statement": "When a confirmed booking is cancelled, FR-008 MUST set the TravelContext to `closed` and close pending travel requests while retaining submitted travel records and audit history. When FR-006 confirms an admin-approved appointment change and sends its `booking.rescheduled` event (REQ-006-011), FR-008 MUST flag existing travel dates for audited revalidation; external travel is not automatically rebooked."}}
  - {"op": "update_node", "id": "REQ-008-032", "attrs": {"statement": "When FR-006 Alternative Flow B5 transfers a patient to a replacement booking, the system MUST keep the original TravelContext closed with its records read-only; only when the replacement booking's travel path (A or B) matches the original's, MUST carry the passport record over to the replacement TravelContext as a new locked booking-linked record, MUST copy the current flight and hotel records to it with a copy-source reference and the flag \"travel-date review required\", MUST NOT request carried-over items from the patient again, and MUST set the replacement TravelContext to `travel-date-review-required` until an admin clears the review under REQ-008-030. When the paths differ, nothing is carried over or copied, the replacement TravelContext starts `active`, and the initial requests for its own path are sent. Each copied record (passport, flight, hotel) keeps its original submitter plus the copy-source reference; any correction to a copy goes through the admin."}}
  - {"op": "update_node", "id": "REQ-008-044", "attrs": {"statement": "Included travel items of the accepted option (for example hotel, airport transfer, or another travel service such as a city tour) MUST be listed as Package Travel Items on the patient itinerary whenever they exist, in Path A or Path B, named from the accepted option's included-services list as saved with the TravelContext at confirmation. Services not included are shown as Not included and are not collected in MVP."}}
  - {"op": "update_node", "id": "REQ-008-050", "attrs": {"statement": "Provider access to passport data MUST be logged (timestamp, provider user ID), and a provider MUST NOT be able to view passport data of patients not assigned to its clinic. The provider sees the passport number in full and the passport view is read-only; incorrect data is corrected by contacting admin. Once the TravelContext is closed (booking cancelled after confirmation, or closed by a provider-fault transfer), the original provider MUST lose access to the passport record; flight and hotel details stay read-only for that provider, and admins keep access."}}
  - {"op": "update_node", "id": "REQ-008-052", "attrs": {"statement": "Once a passport, flight or hotel record is submitted, an attempt by the patient or provider to edit, delete or re-submit it MUST be blocked and the submitter MUST be shown a message that corrections are requested through admin. The provider has no edit or flag capability on a patient-submitted record and contacts admin when it looks incorrect. The exceptions are an admin soft-delete of a passport record, after which the patient may submit one new passport (REQ-008-076); an admin Incomplete mark on a submitted passport, after which the patient may submit one new passport that supersedes the earlier record (REQ-008-065); and an admin soft-delete of a flight or hotel record, after which its owner may enter one replacement (REQ-008-067)."}}
  - {"op": "update_node", "id": "REQ-008-058", "attrs": {"statement": "On the travel requirement check (Path B only), the patient MUST state whether travel is needed. Yes leads to flight and then hotel submission. No MUST set the TravelContext travel_required flag to false (no_travel_required), stop further travel submission requests and the admin Re-notify action for the booking, skip the flight and hotel steps, and show the itinerary as 'No travel required'. The check is not shown for Path A."}}
  - {"op": "update_node", "id": "REQ-008-060", "attrs": {"statement": "Admin 'Re-notify patient' MUST send a manual notification only for a patient-owned pending item: the passport in Path A, or flight or hotel in Path B unless the booking is marked no_travel_required or the item is marked Not needed. Provider-owned Path A flight and hotel items MUST NOT create patient submission notifications. There are no automatic reminders at MVP; after the initial request this admin action is the only follow-up."}}
  - {"op": "update_node", "id": "REQ-008-061", "attrs": {"statement": "A closed TravelContext MUST reject new passport, flight and hotel records, patient re-notification and admin corrections; its records stay read-only with their audit history, and Enter Flight, Enter Hotel, Re-notify patient, Override no-travel declaration, Confirm Travel Dates and Apply Correction are not available. The patient itinerary is then read-only and shows no submission links. The original provider loses access to the passport record, while flight and hotel details stay read-only for them; admins keep access (REQ-008-050). Any external flight or hotel cancellation is coordinated outside the platform under the governing booking policy; FR-008 MUST NOT calculate refunds or cancellation fees."}}
  - {"op": "update_node", "id": "REQ-008-062", "attrs": {"statement": "When an approved admin intervention changes the appointment date after confirmation and FR-006 sends its booking.rescheduled event (REQ-006-011), the system MUST preserve the immutable accepted appointment baseline, show the current booking appointment alongside it, and revalidate the existing flight and hotel dates before the itinerary is treated as current. Patients and providers see 'Travel dates under admin review' on the affected sections but cannot clear it. FR-008 MUST NOT automatically rebook external travel."}}
  - {"op": "update_node", "id": "REQ-008-065", "attrs": {"statement": "'Incomplete' MUST be a passport status set by an admin from the admin travel record screen, with a mandatory reason, when a submitted passport record is deemed unusable or incorrect. The patient MUST be notified, and the mark clears when the patient submits one new passport (which supersedes the earlier record) or when an admin correction is saved. Otherwise a locked record cannot be re-submitted, except after an admin soft-delete returns the passport to Awaiting (REQ-008-076)."}}
  - {"op": "update_node", "id": "REQ-008-067", "attrs": {"statement": "Admin MAY soft-delete any travel record with a mandatory reason; deletion is not permanent and is retained in the backend audit trail. After a flight or hotel soft-delete the status returns to Awaiting and the item's owner (provider in Path A, patient in Path B) MAY enter one replacement, following the passport pattern (REQ-008-076); until then the item counts as not submitted."}}
  - {"op": "update_node", "id": "REQ-008-071", "attrs": {"statement": "All travel notifications MUST be sent by email and in-app. Each travel notice is an MVP notice that needs an entry in the FR-030 notification catalogue."}}
  - {"op": "update_node", "id": "REQ-008-077", "attrs": {"statement": "The system MUST work out the booking's Overall Status shown on the admin travel record screen as follows. Pending: nothing has been submitted. Partially submitted: some required items are in, or the passport is marked Incomplete by an admin. Complete: all required items are in and the passport is not marked Incomplete. Required items: in Path A, the passport plus each of the flight and the hotel that the accepted option includes; in Path B, the outbound flight, the return flight and the hotel, except any item marked Not needed. A booking marked no_travel_required is Complete. A soft-deleted flight or hotel record counts as not submitted until re-entered."}}
  - {"op": "update_node", "id": "STP-008-009", "title": "Patient submits the outbound flight or marks it Not needed"}
  - {"op": "update_node", "id": "STP-008-010", "title": "Patient submits the return flight or marks it Not needed"}
  - {"op": "update_node", "id": "STP-008-011", "title": "Patient submits the hotel stay or marks it Not needed"}
  - {"op": "update_node", "id": "STP-008-031", "title": "System copies the passport record to the replacement TravelContext when the replacement path matches the original path"}
  - {"op": "update_node", "id": "STP-008-032", "title": "System copies the flight and hotel records to the replacement TravelContext when the replacement path matches the original path"}
