reason: "FR-030 logic review pass 2 fixes: a locked notice overrides the patient's channel toggles; escalation only for locked notices; inquiry.cancelled, booking.cancelled, system.alert and system.escalation join the locked list; payment reminders have no fixed hour; the legal acceptance reminder reaches the user despite opt-out; SMS and critical wording aligned; Not opened applies to email only; in-app text source; one Retry action on failed deliveries; appointment reminder defaults of 7 days and 1 day before; delivery log is a read view; rate limit setting described; references to FR-013, FR-014, FR-023, FR-027 and FR-034; email change code rule."
by: docs-manager
operations:
  - {"op": "add_node", "id": "STP-030-072", "type": "Step", "owner_fr": "FR-030", "title": "Admin selects Retry on a failed notice in the Failed Deliveries list; S-03 sends it again (allowed only for status Failed) and logs the retry", "attrs": {"prd_ref": "B1: Notification Delivery Fails (Email Bounce) step 10"}}
  - {"op": "add_node", "id": "REQ-030-253", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Email Change Code", "attrs": {"statement": "Email Change Code (account.email_change_code) is an admin-configurable notification event. Primary recipients: Patient. 6-digit code sent to the new address when a patient changes the profile email (FR-001); its own event, separate from the registration code; security-critical and non-disableable by default", "rationale": "Event Catalog table, row account.email_change_code. Category: Account/Auth. Event nodes: EVT-email-change-otp-sent. Lock rule: Account/Auth notifications (OTP verification, email change code, password reset) are security-critical and non-disableable by default."}}
  - {"op": "update_node", "id": "REQ-030-094", "attrs": {"statement": "Provider-Caused Cancellation / Offer Unavailable (provider.status_cancellation_patient) is an admin-configurable notification event. Primary recipients: Patient. FR-015 Alternative Flow A5 / Screen 4 (FR-020 REQ-020-013). One per affected inquiry/case when provider suspension (`ProviderSuspended`) or deactivation (`ProviderDeactivated`) cancels the patient's case or the provider's offer before acceptance. For a case already accepted, the patient instead receives `booking.provider_fault_replacement`. Before acceptance, three variants apply, checked in this order (FR-003 Workflow 2 Alternative Flow B4, REQ-003-021): (1) when other live offers remain open, the notice says \"[Clinic] is no longer available. Your other offers are still open.\"; (2) when no live offer remains and the patient had explicitly selected the affected provider, the notice asks the patient to confirm the redistribution first, with Confirm and Decline deep links to FR-003 Screen 8 (REQ-003-128); (3) when no live offer remains and the patient had not selected the provider, the inquiry is redistributed automatically and the notice says \"[Clinic] is no longer available. We are finding new offers for you.\" An unanswered confirm variant is followed by `provider.status_redistribution_reminder`. Includes inquiry/case reference and a Contact Admin/Support action. MUST NOT say the patient cancelled, instruct payment against the cancelled selection, or expose confidential suspension/deactivation reasons. Mandatory — admin cannot disable this event (see Non-Disableable by Default section); sent regardless of FR-015's \"Notify Provider\" checkbox. MVP default channels: Email + Push + in-app (a locked notice overrides the patient's channel toggles, see Non-Disableable by Default; in-app record always created). Retries de-duplicated per provider-status event + affected record + recipient"}}
  - {"op": "update_node", "id": "REQ-030-114", "attrs": {"statement": "Admins manage notification escalation rules for locked notices"}, "title": "Admins manage escalation rules for locked notices"}
  - {"op": "update_node", "id": "REQ-030-075", "attrs": {"statement": "Aftercare Escalation / Red Flag Triggered (aftercare.escalation_triggered) is an admin-configurable notification event. Primary recipients: Provider, Admin, Patient (optional). Red-flag alert sent to the recipients set on the rule"}}
  - {"op": "update_node", "id": "REQ-030-192", "attrs": {"statement": "Editable by admin: Event-to-notification mappings (which events trigger which notifications); Notification templates (subject, body, formatting, variables) for all channels; Recipient targeting rules (who receives notifications based on role, relationship, event context); Channel preferences per event type (enable/disable email, push, SMS); Delivery timing configuration (immediate, scheduled, delayed); Retry logic parameters (max attempts, interval between retries) for an individual notification, overriding the platform default; Notification rate limit per recipient (default 10 per hour; critical notifications exempt); Transplant progress reminder schedule (default once a month for 12 months after treatment); Escalation rules for locked notices; Quiet hours: one platform-wide period for non-urgent notifications (default 10 PM to 7 AM recipient local time), set by admins only."}}
  - {"op": "update_node", "id": "REQ-030-031", "attrs": {"statement": "Inquiry Cancelled (inquiry.cancelled) is an admin-configurable notification event. Primary recipients: Patient, Admin (optional). Fires when the patient cancels the inquiry in the Inquiry or Quoted stage (FR-003 Workflow 5) and when an admin closes the inquiry (FR-006 Close inquiry). The patient receives a mandatory cancellation confirmation (aligns with FR-003 Workflow 5 step 4 and Screen 8b), and the event's toggle is locked; a cancellation caused by an approved account deletion sends the patient no notice. The patient's cancellation reason is private to the patient. The admin-close notice says the inquiry was closed by Hairline, gives the reason entered in FR-006, says no replacement follows, and carries the Contact Admin/Support action. MVP default channels: Email + Push. Template variables: `inquiry.id`, `inquiry.cancellation_reason`, `inquiry.cancelled_at`. Providers are not recipients: a provider that holds a draft, sent or expired quote on the inquiry receives only `quote.cancelled_inquiry`, and a provider that never quoted is told nothing."}}
  - {"op": "update_node", "id": "REQ-030-047", "attrs": {"statement": "Booking Cancelled (booking.cancelled) is an admin-configurable notification event. Primary recipients: Patient, Provider, Admin (optional). Fires for an Admin cancellation, a provider drop-out at the FR-006 Screen 10 submit, and a system cancellation for an unpaid balance (including an installment plan default). A provider suspension or deactivation closure sends `booking.provider_fault_replacement` instead. The notice states the cancellation reason in the wording FR-006 defines (REQ-006-011); the system fills in any fee and refund amounts. Mandatory — admin cannot disable this event: the patient and the provider must always learn of the cancellation (see Non-Disableable by Default section)"}}
  - {"op": "update_node", "id": "REQ-030-134", "attrs": {"statement": "Locks: `quote.withdrawn`, the selected-provider and not-selected-provider outcomes of `quote.accepted`, `booking.payment_window_expired`, `booking.revived`, `booking.provider_fault_replacement`, `booking.scheduled`, `booking.rescheduled`, `booking.cancelled` and `treatment.plan_changed` are mandatory. `quote.expiring_soon` and `booking.hold_expiring_soon` are admin-configurable. No mandatory provider event (`quote.cancelled_inquiry`, the selected-provider and not-selected-provider outcomes of `quote.accepted`, `booking.payment_window_expired`, `booking.revived`, `booking.rescheduled` and `booking.cancelled`) is subject to FR-032 provider notification preferences."}}
  - {"op": "update_node", "id": "REQ-030-138", "attrs": {"statement": "Preference exemption for mandatory provider events: every event that is mandatory for providers (`quote.cancelled_inquiry`, the selected-provider and not-selected-provider outcomes of `quote.accepted`, `booking.payment_window_expired`, `booking.revived`, `booking.rescheduled` and `booking.cancelled`) is delivered regardless of FR-032 provider notification preferences. A provider's category toggles in FR-032 never suppress these events."}}
  - {"op": "update_node", "id": "REQ-030-145", "attrs": {"statement": "Trigger: 3 days (72 hours) before installment due date (example only; the payment reminder schedule itself is the single payment reminder timing setting owned by FR-007) Delivery time: no fixed hour; the reminder is sent on its day, and quiet hours hold it until they end if it falls overnight Skip If Too Late (optional): when the send time has already passed as the event occurs, the notice is not sent Retry logic: the platform default retry rule (retry on, up to 3 retries, 1 hour apart), or different values set for this notification"}}
  - {"op": "update_node", "id": "REQ-030-206", "attrs": {"statement": "System automatically adjusts delivery timing based on recipient's current timezone setting at time of delivery If recipient travels to different timezone and updates profile, future notifications use new timezone Scheduled notifications (e.g., a Schedule Time in recipient local time) calculated dynamically at delivery time, not statically when notification scheduled"}}
  - {"op": "update_node", "id": "REQ-030-208", "attrs": {"statement": "System respects recipient opt-out for notifications that are not locked (marketing, general updates) and does not deliver. A locked notice is critical: it is sent at once, is exempt from quiet hours, the hourly rate limit and coalescing, and overrides the recipient's opt-out, delivering via at least one channel (the app displays a banner explaining why the notice was delivered despite opt-out). The one exception is legal.acceptance_reminder, which is locked but not critical: it respects quiet hours and the rate limit, and, like every locked notice, still reaches the user through at least one channel despite opt-out. The locked list is fixed in the codebase: an admin cannot mark any other notice as critical"}, "title": "Locked notices override recipient opt-out and show an in-app banner"}
  - {"op": "update_node", "id": "REQ-030-019", "attrs": {"statement": "System MUST respect recipient opt-out preferences for notifications that are not locked (marketing, general updates); locked notices override opt-out with in-app explanation"}}
  - {"op": "update_node", "id": "REQ-030-241", "attrs": {"statement": "Legal Acceptance Reminder (legal.acceptance_reminder) is an admin-configurable notification event. Primary recipients: Patient, Provider (team members in the Pending set). One reminder to each user in the Pending set; FR-027 owns the cadence (REQ-027-063). Locked: the toggle cannot be switched off. It is the one locked notice that is not critical: it respects quiet hours and the rate limit, but it still reaches the user through at least one channel despite opt-out"}}
  - {"op": "update_node", "id": "REQ-030-227", "attrs": {"statement": "Critical - Cannot Opt Out is a read-only indicator that shows Yes for every event on the locked list: a locked notice is delivered through at least one channel even when the recipient has opted out. Critical notices (all locked notices except legal.acceptance_reminder) are also exempt from quiet hours and the rate limit (REQ-030-208). An admin cannot mark an event critical; the indicator follows the locked list."}}
  - {"op": "update_node", "id": "REQ-030-005", "attrs": {"statement": "System MUST support optional SMS notifications for selected events (payment reminders, appointment alerts) with admin approval and cost tracking in post‑MVP phases; MVP does not send SMS."}, "title": "Optional SMS for selected events, not in MVP"}
  - {"op": "update_node", "id": "REQ-030-103", "attrs": {"statement": "System Escalation (system.escalation) is an admin-configurable notification event. Primary recipients: Admin. Operational escalation events requiring admin action; also the escalation notice S-03 sends to the escalation recipients when a locked notice meets its escalation condition (Not delivered or Not opened after the wait time). Mandatory — admin cannot disable this event; toggle locked"}}
  - {"op": "update_node", "id": "REQ-030-104", "attrs": {"statement": "System Alert (system.alert) is an admin-configurable notification event. Primary recipients: Admin. System health/monitoring alerts surfaced via notifications; also raised when a locked notice fails permanently, in-app and by a channel other than the failing one. Mandatory — admin cannot disable this event; toggle locked"}}
  - {"op": "update_node", "id": "REQ-030-173", "attrs": {"statement": "Escalation is available only for locked notices. The condition is picked from a fixed list (Not delivered, Not opened; Not opened applies to email only) with a wait time; when it holds after the wait time, S-03 sends the escalation notice to the escalation recipients"}}
  - {"op": "update_node", "id": "REQ-030-146", "attrs": {"statement": "Escalation is offered only for locked notices. The admin picks a condition from a fixed list (Not delivered, Not opened; Not opened applies to email only) and a wait time, for example Payment Failed, Not opened, wait 24 hours, escalate to the admin billing team"}}
  - {"op": "update_node", "id": "ENT-notification-rule.escalation_conditions", "attrs": {"description": "Key Entities: escalation_conditions. Screen 2 Escalation Condition select with a fixed list: Not delivered, Not opened (Not opened applies to email only). Required if escalation is enabled."}}
  - {"op": "update_node", "id": "REQ-030-117", "attrs": {"statement": "Tracks delivery status (sent, delivered, failed) per channel, and opened for email only"}}
  - {"op": "update_node", "id": "REQ-030-177", "attrs": {"statement": "Rule Editor fields: Rule Name: Max 100 chars, unique per event; Event Type: Predefined event list from backend; admin cannot create or rename event types here; Recipient Type: At least one recipient type required; Recipient Filter Rules: Valid JSON schema; Email Channel: Default: on; Email Template: Must select template if channel enabled; Push Notification Channel: Default: on for patients/providers; Push Template: Must select template if channel enabled; SMS Channel: Future phase, not offered until that phase; Default: off; admin approval required; SMS Template: Must select template if channel enabled; Delivery Timing: Predefined options; Schedule Time: Future datetime only; Delay Duration: Min 1 hour, max 90 days; Delivery Timezone: Default: Recipient Local Time; Retry Configuration: Default: on; Max Retry Attempts: Min 1, max 5, default 3; Retry Interval: One fixed interval, min 1 hour, max 24 hours, default 1 hour; Escalation Rules: Default: off; offered only for locked notices; Escalation Condition: Fixed list only (Not delivered, Not opened; Not opened applies to email only); Escalation Recipients: Required if escalation enabled; Critical - Cannot Opt Out: Read-only indicator, display only; Rule Status: Default: Draft for new rules; Paused is not allowed for events on the Non-Disableable list."}}
  - {"op": "update_node", "id": "REQ-030-234", "attrs": {"statement": "When a recipient has both Email and Push switched off, nothing is sent by email or push, and the in-app entry is still always created; it is built from the push title and body of the rule's push template, or from the event's catalogue default title and body when the rule has no push template, and there is no separate in-app template; dsr.fulfilled creates no in-app entry"}}
  - {"op": "update_node", "id": "REQ-030-226", "attrs": {"statement": "Notification Analytics shows delivery metrics for the selected period: total sent, delivered, failed, opened (email) and clicked (email), grouped by event type, channel and recipient type; display only, with a date range filter, read from the delivery logs. Failed Deliveries opens from the failed count and lists each failed delivery with masked recipient, event type, channel, failure reason, status (Failed - Permanent or Failed - Service Outage) and timestamp; admin can filter by failure reason and export to CSV. Each row has one action, Retry, which sends that failed notice again, is allowed only for status Failed and is logged. Recipient contact is masked."}}
  - {"op": "update_node", "id": "REQ-030-209", "attrs": {"statement": "System holds notifications for up to 24 hours and retries them at the retry interval If service restored within 24 hours, queued notifications delivered (may result in burst of deliveries) If outage exceeds 24 hours, system marks notifications as \"Failed - Service Outage\" without using up their retries, and alerts admin After service is restored, admin uses Retry on the failed notices in the Failed Deliveries list, or switches to backup notification provider if configured"}}
  - {"op": "update_node", "id": "REQ-030-048", "attrs": {"statement": "Appointment Reminder (booking.appointment_reminder) is an admin-configurable notification event. Primary recipients: Patient, Provider. Two reminders by default, 7 days and 1 day before the appointment; the anchor is the appointment date. Admin-switchable: it is not a locked notice"}}
  - {"op": "update_node", "id": "EVT-booking-appointment-reminder", "attrs": {"description": "booking.appointment_reminder: notification catalog event (FR-030 catalog, PRD line 144). Two reminders by default, 7 days and 1 day before the appointment; the anchor is the appointment date."}}
  - {"op": "update_node", "id": "ENT-notification-delivery-log", "title": "Notification delivery log (read view)", "attrs": {"description": "Read view over the FR-020 notification record and attempt rows, not a stored table: one row per notification attempt, recipient contact masked in admin interfaces (PRD Key Entities, Entity 3)."}}
  - {"op": "update_node", "id": "SET-notification-throttling-thresholds", "attrs": {"description": "Maximum number of notifications one recipient receives per hour (REQ-030-017): notices over the limit are held and sent in order in the next hour, and locked critical notices are never held. Also holds the thresholds that decide when excessive events in a short window are coalesced, deferred or suppressed (FR-020 REQ-020-006, Alternative Flow B1). Editable by Admin.", "default": "10 notifications per hour per recipient", "unit": "notifications per hour"}}
  - {"op": "update_node", "id": "REQ-030-137", "attrs": {"statement": "Account/Auth notifications (OTP verification, email change code, password reset) are security-critical and MUST be non-disableable by default in the admin UI (toggle locked; no pause)."}}
  - {"op": "update_node", "id": "REQ-030-141", "attrs": {"statement": "If toggled Off (its rules paused), S-03 sends no notification for events that occur meanwhile; a locked notice cannot be paused and its toggle is locked. Security-critical events (OTP verification, email change code, password reset) are non-disableable by default and show a locked toggle. If toggled On, S-03 uses the event's Active rule; an On event with no Active rule is sent with the catalogue defaults (default channels and the standard template). Every event ships with one seeded Active rule."}}
