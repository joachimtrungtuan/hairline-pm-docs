reason: 'Requirements graph programme baseline 2026-11-20: owner rulings applied (FR-021)'
by: controller
operations:
- op: add_node
  id: SET-free-text-translation-enabled
  type: Setting
  owner_fr: FR-021
  title: Free-text translation switch
  attrs: {description: 'One platform-wide switch, controlled by Admin, that turns machine translation of free text between users on or off for the reader (PRD General Module Rule 15, REQ-021-119).', default: 'Off'}
- op: add_node
  id: SET-free-text-translation-monthly-budget
  type: Setting
  owner_fr: FR-021
  title: Free-text translation monthly budget
  attrs: {description: 'Monthly budget Admin configures for free-text translation; the PRD gives no default figure. When the monthly limit is reached, free text is shown untranslated (PRD General Module Rule 16, REQ-021-120).'}
- op: add_node
  id: REQ-021-118
  type: Rule
  owner_fr: FR-021
  title: Fallback notice is shown only when a fallback has occurred
  attrs: {statement: The fallback notice on Patient App Language & Region Settings MUST be shown only when a fallback has occurred., rationale: 'PRD Functional Requirements Summary (prd.md line 1067). PRD id REQ-021-118. Restated at: Screen 1 rules (line 249).'}
- {op: add_edge, from: REQ-021-118, verb: applies at, to: STG-patient-03-active}
- op: add_node
  id: REQ-021-119
  type: Rule
  owner_fr: FR-021
  title: Free text between users is machine-translated for the reader when the Admin switch is on
  attrs: {statement: 'When free-text translation is switched on, free text written by one user for another (messages, free-text fields in an inquiry, support messages and notes, and reviews) MUST be machine-translated into the reader''s own language. Uploaded documents MUST NOT be translated. The switch is one platform-wide setting controlled by Admin and MUST be off by default.', rationale: 'PRD Functional Requirements Summary (prd.md line 1068). PRD id REQ-021-119. Restated at: General Module Rule 15 (line 664); Module Scope (lines 46, 62, 82, 86).'}
- {op: add_edge, from: REQ-021-119, verb: applies at, to: STG-admin-01-configuration}
- op: add_node
  id: REQ-021-120
  type: Rule
  owner_fr: FR-021
  title: Free-text translation has a monthly budget; at the limit text is shown untranslated
  attrs: {statement: 'Admin MUST be able to configure a monthly budget for free-text translation (no default figure); when the monthly limit is reached, free text MUST be shown untranslated.', rationale: 'PRD Functional Requirements Summary (prd.md line 1069). PRD id REQ-021-120. Restated at: General Module Rule 16 (line 665).'}
- {op: add_edge, from: REQ-021-120, verb: applies at, to: STG-admin-01-configuration}
- op: add_node
  id: REQ-021-121
  type: Rule
  owner_fr: FR-021
  title: Only Platform Admin and Super Admin may use the machine-translation route
  attrs: {statement: Only Platform Admin and Super Admin MUST be able to use the machine-translation route for translation drafts., rationale: 'PRD Functional Requirements Summary (prd.md line 1070). PRD id REQ-021-121. Restated at: Screen 10 business rules (line 628).'}
- {op: add_edge, from: REQ-021-121, verb: applies at, to: STG-admin-01-configuration}
- {op: add_edge, from: REQ-021-119, verb: governed by, to: SET-free-text-translation-enabled}
- {op: add_edge, from: REQ-021-120, verb: governed by, to: SET-free-text-translation-monthly-budget}
- {op: add_edge, from: REQ-021-118, verb: applies to, to: SCR-021-01}
- {op: add_edge, from: REQ-021-121, verb: applies to, to: SCR-021-10}
- {op: merge_node, survivor: REQ-021-059, loser: REQ-021-065}
- {op: merge_node, survivor: REQ-021-059, loser: REQ-021-068}
- op: update_node
  id: REQ-021-059
  title: Each runtime surface loads the latest published bundle for the user's locale and its own surface
  attrs: {statement: 'Each runtime surface loads the latest published bundle for the user''s selected locale and for its own surface: the Patient App loads the patient-app bundle, the Provider Dashboard the provider-dashboard bundle, and the Admin Platform the admin-platform bundle.', rationale: 'PRD General Module Rule 14 (prd.md line 663). Restated at: Screens 1, 2 and 3 bundle-loading bullets. Merged: REQ-021-065 (Provider Dashboard) and REQ-021-068 (Admin Platform).'}
- op: update_node
  id: REQ-021-056
  title: User-generated content is not automatically translated, except the free text covered by REQ-021-119
  attrs: {statement: 'Out of scope: Machine translation of uploaded documents, and of any user-generated content other than the free text listed in General Module Rule 15.', rationale: 'PRD Module Scope, Out of Scope (prd.md line 86). The covered free text is set by REQ-021-119.'}
- op: update_node
  id: REQ-021-064
  title: Author's text stays in the language entered; the reader may see a translation
  attrs: {statement: 'Patient App continues to show user-generated content in the language originally entered by the user; when free-text translation is on, free text written by others is shown translated into the patient''s own language (General Module Rule 15).', rationale: 'PRD Module Scope (prd.md line 46). Restated at: Screen 1 note (line 260).'}
- op: update_node
  id: REQ-021-103
  title: Machine translation of system text is a draft-generation tool, not a runtime path; free-text translation is separate
  attrs: {statement: 'Machine translation of system-controlled text is a draft-generation tool, not a runtime translation path. Free-text translation for the reader is the separate case in General Module Rule 15.', rationale: 'PRD Screen Specifications, Screen 10 (prd.md line 627). Restated at: Out of Scope (line 89).'}
- op: update_node
  id: REQ-021-030
  title: Machine translation requests for drafts exclude private, medical, user-generated and legal content
  attrs: {statement: 'Machine translation requests for translation drafts MUST exclude patient medical data, private account data, user-generated free text, legal content, support messages, and uploaded documents unless another owning FR explicitly permits the content. Free-text translation for the reader follows REQ-021-119 instead.', rationale: 'PRD Functional Requirements Summary (prd.md line 1086). PRD id REQ-021-022a. Renumbered from REQ-021-022a (id must be digits only). Restated at: Privacy Rule 3 (line 671); Screen 10 rule: no private content (line 634).'}
- op: update_node
  id: REQ-021-020
  title: English source edits need elevated authorization, reason, audit and review-needed marking, unless confirmed non-semantic
  attrs: {statement: 'English source value edits MUST require elevated authorization, reason capture, audit logging, and review-needed marking for dependent locale values, unless Admin explicitly confirms the source change is non-semantic.', rationale: 'PRD Functional Requirements Summary (prd.md line 1083). PRD id REQ-021-020. Restated at: Configurable with restrictions: English source.'}
- op: update_node
  id: REQ-021-087
  title: Change reason is required for English source edits and for every publish
  attrs: {statement: 'Change reason: Required when editing English source and on every publish', rationale: 'PRD Screen Specifications, Screen 7 (prd.md line 508).'}
- op: update_node
  id: REQ-021-062
  title: Patient timezone must be a value from the FR-026 GMT list
  attrs: {statement: Patient timezone preference must be a value from the FR-026 GMT list; fixed offsets do not follow daylight saving, rationale: 'PRD Screen Specifications, Screen 1 (prd.md line 238).'}
- op: update_node
  id: REQ-021-010
  title: Admin exports translation JSON by locale, surface, group and version, and identifies draft or published
  attrs: {statement: 'Admin MUST be able to export translation JSON files by locale, tenant/surface, group, and version, and MUST identify whether the export is draft or published.', rationale: PRD Functional Requirements Summary (prd.md line 1060). PRD id REQ-021-010.}
- op: update_node
  id: REQ-021-073
  title: A language with history is never hard-deleted
  attrs: {statement: Hard deletion of a language is not allowed once translation history or published versions exist; use Inactive state instead., rationale: 'PRD Screen Specifications, Screen 4 (prd.md line 343).'}
- op: update_node
  id: REQ-021-049
  title: Default locale change needs Super Admin approval alone and cannot deactivate the source locale
  attrs: {statement: Default locale changes require approval by the Super Admin alone (no second approver) and must not deactivate the source locale., rationale: 'PRD Business Rules, Admin Editability (prd.md line 700).'}
