  - {"op": "add_node", "id": "SCR-032-01", "type": "Screen", "owner_fr": "FR-032", "title": "Provider Profile: Basic Information", "attrs": {"platform": "provider", "description": "Provider Platform, Settings > Profile, Tab 1 (PRD Screen 1). Inline edit per field; Edit Profile button opens bulk edit mode for all fields with Save All / Cancel All. UI controls, not fields: Edit Profile button, crop/resize tool, save/cancel buttons. Rules: REQ-032-001, REQ-032-004, REQ-032-014 and the profile field rules."}}
  - {"op": "add_node", "id": "SCR-032-02", "type": "Screen", "owner_fr": "FR-032", "title": "Provider Profile: Languages", "attrs": {"platform": "provider", "description": "Provider Platform, Settings > Profile, Tab 2 (PRD Screen 1). Chip list with \"+ Add Language\" searchable dropdown, x to remove (confirmation on the last chip), drag-and-drop reordering. UI controls, not fields: add-language dropdown, chip remove button."}}
  - {"op": "add_node", "id": "SCR-032-03", "type": "Screen", "owner_fr": "FR-032", "title": "Provider Profile: Awards", "attrs": {"platform": "provider", "description": "Provider Platform, Settings > Profile, Tab 4 (PRD Screen 1). Award cards with Add / Edit / Delete and drag-and-drop reordering. Tab 3 (Staff List) is not a screen of this FR: it displays FR-009 Screen 1. UI controls, not fields: Add Award button, Edit and Delete actions, delete confirmation dialog."}}
  - {"op": "add_node", "id": "SCR-032-04", "type": "Screen", "owner_fr": "FR-032", "title": "Provider Profile: Reviews", "attrs": {"platform": "provider", "description": "Provider Platform, Settings > Profile, Tab 5 (PRD Screen 1). Read-only reviews from the Reviews module with rating summary, distribution, filters, sort and pagination (10/20/50 per page); responses through the FR-013 Screen 6 composer. Empty state: \"No reviews yet\". UI controls, not fields: Rating Filters, Sort Dropdown, Pagination Controls, \"Read more\" link."}}
  - {"op": "add_node", "id": "SCR-032-05", "type": "Screen", "owner_fr": "FR-032", "title": "Provider Profile: Documents", "attrs": {"platform": "provider", "description": "Provider Platform, Settings > Profile, Tab 6 (PRD Screen 1). Upload, view/download, replace and delete credential documents; Admin badge and \"View Only\" for admin uploads. Empty state invites the first upload. UI controls, not fields: Upload Document, View/Download, Replace and Delete buttons, Document List container, delete confirmation dialog."}}
  - {"op": "add_node", "id": "SCR-032-06", "type": "Screen", "owner_fr": "FR-032", "title": "Account Information", "attrs": {"platform": "provider", "description": "Provider Platform, Settings > Account Settings (PRD Screen 2), including the password change section and the Account Closure card with its warning dialog. UI controls, not fields: Current Password and Confirm New Password inputs (verification only, not stored), Save button, \"Request Account Closure\" button, acknowledgement checkbox, Submit / Cancel in the closure dialog. Account Name is read-only for the Owner role and editable for staff roles."}}
  - {"op": "add_node", "id": "SCR-032-07", "type": "Screen", "owner_fr": "FR-032", "title": "Notification Preferences", "attrs": {"platform": "provider", "description": "Provider Platform, Settings > Notifications (PRD Screen 3). Six notification-type toggles and two channel toggles, organization-wide. No toggle for mandatory notices (REQ-032-031). UI controls, not fields: Save button, Disable-all confirmation dialog."}}
  - {"op": "add_node", "id": "SCR-032-08", "type": "Screen", "owner_fr": "FR-032", "title": "Billing Settings (Owner only)", "attrs": {"platform": "provider", "description": "Provider Platform, Settings > Billing, visible to the Owner role only (PRD Screen 4): bank account details for payouts and the read-only Commission & Payout panel. UI controls, not fields: Edit / Save / Cancel buttons."}}
  - {"op": "add_node", "id": "EVT-provider-closure-requested", "type": "Event", "owner_fr": "FR-032", "title": "Provider closure requested", "attrs": {"description": "FR-020 `provider.closure_requested`: mandatory notification to admins when a provider submits an account closure request (Closure Main Flow step 10)."}}
  - {"op": "add_node", "id": "EVT-provider-closure-rejected", "type": "Event", "owner_fr": "FR-032", "title": "Provider closure rejected", "attrs": {"description": "FR-020 `provider.closure_rejected`: mandatory email to the provider with the review notes when an admin rejects the closure request (Closure Main Flow step 16)."}}
  - {"op": "add_node", "id": "EVT-provider-password-changed", "type": "Event", "owner_fr": "FR-032", "title": "Provider password changed", "attrs": {"description": "Security alert email to the provider after a password change: \"Your password was changed on [date] at [time]\" (Account Settings Main Flow step 22; REQ-032-021)."}}
  - {"op": "add_node", "id": "EVT-provider-bank-details-updated", "type": "Event", "owner_fr": "FR-032", "title": "Provider bank details updated", "attrs": {"description": "Email confirmation sent to the Owner after bank account details are updated (Billing Main Flow step 14)."}}
