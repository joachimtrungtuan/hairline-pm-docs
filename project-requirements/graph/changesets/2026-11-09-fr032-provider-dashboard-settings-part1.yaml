reason: "FR-032 Provider Dashboard Settings & Profile Management migration, part 1 of 2: provider profile, documents, account settings, account closure, Rule 6 status behaviour, notification preferences and billing, with all PRD REQ ids (migrate-fr checklist v1.1, from the frozen PRD)."
by: "docs-manager"
# Operations marked '# stub' create a node or field owned by another FR; the controller converts a collision into an update.
# Operations marked '# shared edge' touch a Stage or Actor shared with other FRs.
# Requires FR-029 change-sets (2026-11-09-fr029-payment-system-config-part1/part2) applied first: SCR-032-08 shows ENT-commission-rate-config fields and REQ-029-116 gains an applies-at edge.
operations:
  - {"op": "add_node", "id": "ENT-provider-profile", "type": "Entity", "owner_fr": "FR-032", "title": "Provider profile", "attrs": {"description": "Clinic public-facing profile information. One provider has one profile; one profile has many awards; profile displayed to many patients during quote comparison (PRD Key Entities, Entity 1)."}}
  - {"op": "add_node", "id": "ENT-provider-award", "type": "Entity", "owner_fr": "FR-032", "title": "Provider award", "attrs": {"description": "One award on a provider profile (the \"awards (array of award objects)\" attribute of Entity 1). One profile has many awards (PRD Key Entities, Entity 1; Screen 1 Tab 4)."}}
  - {"op": "add_node", "id": "ENT-provider-account-settings", "type": "Entity", "owner_fr": "FR-032", "title": "Provider account settings", "attrs": {"description": "Provider account configuration. One provider has one account settings record; account settings linked to provider profile (PRD Key Entities, Entity 2)."}}
  - {"op": "add_node", "id": "ENT-provider-notification-preferences", "type": "Entity", "owner_fr": "FR-032", "title": "Provider notification preferences", "attrs": {"description": "Provider notification configuration. One provider has one notification preferences record; notification preferences enforced by S-03 Notification Service (PRD Key Entities, Entity 3)."}}
  - {"op": "add_node", "id": "ENT-provider-billing-settings", "type": "Entity", "owner_fr": "FR-032", "title": "Provider billing settings", "attrs": {"description": "Provider bank account details for payouts. One provider has one billing settings record (accessible only to Owner role); billing settings used by FR-017 for provider payouts (PRD Key Entities, Entity 4)."}}
  - {"op": "add_node", "id": "ENT-provider-closure-request", "type": "Entity", "owner_fr": "FR-032", "title": "Provider account closure request", "attrs": {"description": "Provider account closure request workflow. One provider can have multiple closure requests (but only one \"Pending\" at a time); closure request reviewed by one admin; an approved request links to one FR-015 deactivation status event (PRD Key Entities, Entity 5)."}}
  - {"op": "add_node", "id": "ENT-provider-document", "type": "Entity", "owner_fr": "FR-032", "title": "Provider document", "attrs": {"description": "A credential or compliance document uploaded by the provider or by an admin (PRD Screen 1 Tab 6; not listed in Key Entities). Admin view is FR-015 Tab 6."}}
  - {"op": "add_node", "id": "ENT-review", "type": "Entity", "owner_fr": "FR-013", "title": "Patient review", "attrs": {"description": "One patient review of a provider as shown in the provider Reviews tab (\"reviews array\" of PRD Key Entities, Entity 7). Stub created during FR-032 migration with only the fields FR-032 shows."}}  # stub
  - {"op": "add_node", "id": "SET-password-policy", "type": "Setting", "owner_fr": "FR-026", "title": "Password policy", "attrs": {"description": "Provider password complexity: min 12 chars, 1 uppercase, 1 lowercase, 1 digit, 1 special char. Complexity is fixed in codebase, not admin-editable; FR-026 password policy parameters (max login attempts, lockout duration, OTP expiry, resend cooldown) are admin-configurable. Stub created during FR-032 migration."}}  # stub
  - {"op": "add_node", "id": "SET-country-calling-codes", "type": "Setting", "owner_fr": "FR-026", "title": "Country calling codes", "attrs": {"description": "Worldwide country calling codes for phone number entry (e.g., +1 USA, +44 UK, +90 Turkey). Stub created during FR-032 migration."}}  # stub
  - {"op": "add_node", "id": "SET-timezone-options", "type": "Setting", "owner_fr": "FR-026", "title": "Timezone options", "attrs": {"description": "Timezone options GMT-12 to GMT+14 with offset and city examples, e.g. \"(GMT+3) Istanbul\". Stub created during FR-032 migration."}}  # stub
  - {"op": "add_node", "id": "SET-country-list", "type": "Setting", "owner_fr": "FR-026", "title": "Country list", "attrs": {"description": "Centrally managed country list used for clinic location. Stub created during FR-032 migration."}}  # stub
  - {"op": "add_node", "id": "SET-language-catalog", "type": "Setting", "owner_fr": "FR-021", "title": "Language/locale catalog", "attrs": {"description": "System language options providers choose their supported languages from (FR-021 catalog; FR-026 may surface it through the settings shell). Stub created during FR-032 migration."}}  # stub
  - {"op": "add_node", "id": "SET-provider-notification-types", "type": "Setting", "owner_fr": "FR-026", "title": "Provider notification types", "attrs": {"description": "The notification types offered in provider notification preferences. Admins can add/remove types via system configuration, but core types (quote, schedule, treatment, aftercare, review) are required. Owner FR-026 is provisional: the PRD says only \"system configuration\". Stub created during FR-032 migration."}}  # stub
  - {"op": "add_node", "id": "REQ-032-001", "type": "Rule", "owner_fr": "FR-032", "title": "Upload clinic logo", "attrs": {"statement": "System MUST allow providers to upload and update clinic logo/profile picture (max 5MB, JPEG/PNG, min 200x200px)", "rationale": "Screen 1 Tab 1 Profile Picture validation adds \"recommended 500x500px\". Alternative flow B1 and Edge Cases: an oversized image is rejected with \"Image too large. Maximum size is 5MB. Please compress or choose a smaller image.\" Screen: SCR-032-01."}}
  - {"op": "add_node", "id": "REQ-032-002", "type": "Rule", "owner_fr": "FR-032", "title": "Select supported languages from the central list", "attrs": {"statement": "System MUST allow providers to select supported languages using the centrally managed system language options owned by FR-021 (Multi-Language & Localization), which are surfaced via FR-026 App Settings.", "rationale": "Restated by Module Scope (\"Providers select supported languages from system language options\"), Main Flow step 6 and Alternative Flow A3 (\"System displays all available languages from the FR-021 language/locale catalog surfaced through settings\"). Screen: SCR-032-02."}}
  - {"op": "add_node", "id": "REQ-032-003", "type": "Rule", "owner_fr": "FR-032", "title": "Manage awards with image upload", "attrs": {"statement": "System MUST allow providers to add, edit, delete awards with direct image upload (name, description, year, award image max 2MB)", "rationale": "Alternative flows A1 (edit award) and A2 (delete award with confirmation \"Are you sure you want to delete this award?\"). Screen: SCR-032-03."}}
  - {"op": "add_node", "id": "REQ-032-004", "type": "Rule", "owner_fr": "FR-032", "title": "Update basic clinic information", "attrs": {"statement": "System MUST allow providers to update basic clinic information (name, description, contact email)", "rationale": "Module Scope: \"Providers update basic clinic information (name, description, contact)\". Main Flow step 7 adds Location - City. Screen: SCR-032-01."}}
  - {"op": "add_node", "id": "REQ-032-005", "type": "Rule", "owner_fr": "FR-032", "title": "Phone number with country code", "attrs": {"statement": "System MUST allow providers to configure phone number with worldwide country code selection (FR-026 country codes)", "rationale": "Main Flow step 7: \"System validates phone number format for selected country code\"; Alternative Flow B5 example error \"Invalid phone number for United States. Expected format: (XXX) XXX-XXXX\". Screen: SCR-032-06."}}
  - {"op": "add_node", "id": "REQ-032-006", "type": "Rule", "owner_fr": "FR-032", "title": "Select timezone", "attrs": {"statement": "System MUST allow providers to select timezone from multiple timezone options (GMT-12 to GMT+14)", "rationale": "Screen 2 notes: timezone options show offset and city examples, e.g. \"(GMT+3) Istanbul\". Screen: SCR-032-06."}}
  - {"op": "add_node", "id": "REQ-032-007", "type": "Rule", "owner_fr": "FR-032", "title": "Change password with verification", "attrs": {"statement": "System MUST allow providers to change password with current password verification and security policy validation (FR-026)", "rationale": "Screen 2: \"New password must meet password policy from FR-026 (FIXED in codebase, not admin-editable)\". Alternative flows B6 (\"Current password is incorrect\") and B7 (policy error message). Screen: SCR-032-06."}}
  - {"op": "add_node", "id": "REQ-032-008", "type": "Rule", "owner_fr": "FR-032", "title": "Configure notification preferences", "attrs": {"statement": "System MUST allow providers to configure unified notification preferences (individual notification type toggles for quote, schedule, treatment start, aftercare, review, and promotion/discount notifications + global channel preferences: email, push)", "rationale": "Main Flow \"Configure Notification Preferences\" steps 4-5 and Screen 3 list the six type toggles and two channel toggles, all default enabled. Screen: SCR-032-07."}}
  - {"op": "add_node", "id": "REQ-032-009", "type": "Rule", "owner_fr": "FR-032", "title": "S-03 enforces notification preferences", "attrs": {"statement": "System MUST enforce notification preferences via S-03 Notification Service (FR-020 integration)", "rationale": "Business Rule 2 restates this with the exemptions in REQ-032-031 and REQ-032-071. Dependencies: \"S-03 checks preferences before sending each notification\"."}}
  - {"op": "add_node", "id": "REQ-032-010", "type": "Rule", "owner_fr": "FR-032", "title": "Owner manages billing settings", "attrs": {"statement": "System MUST allow provider Owners to manage billing settings (bank account details for payouts, FR-017 integration)", "rationale": "Billing Rule 2: \"Bank account details used by FR-017 billing workflow for provider payouts (admin-triggered after treatment completion)\". Screen: SCR-032-08."}}
  - {"op": "add_node", "id": "REQ-032-011", "type": "Rule", "owner_fr": "FR-032", "title": "Billing settings restricted to Owner", "attrs": {"statement": "System MUST restrict billing settings access to Owner role only (FR-009 role permissions)", "rationale": "Restated by Business Rule 4, Billing Rule 3, Screen 4 and Alternative Flow B9 (non-Owner roles Manager, Clinical Staff, Billing Staff). Same rule as REQ-032-022. Screen: SCR-032-08."}}
  - {"op": "add_node", "id": "REQ-032-012", "type": "Rule", "owner_fr": "FR-032", "title": "Access the admin-managed Help Centre", "attrs": {"statement": "System MUST allow providers to access Help Centre with admin-managed content (FR-033 integration)", "rationale": "Screen 5: \"All Help Centre content is read-only for providers (content managed exclusively by admins via FR-033)\". Screen: SCR-032-09."}}
  - {"op": "add_node", "id": "REQ-032-013", "type": "Rule", "owner_fr": "FR-032", "title": "Request account closure", "attrs": {"statement": "System MUST allow providers to request account closure; the request is processed by an admin, who deactivates the provider through FR-015 (no self-service deactivation)", "rationale": "Module Scope (Provider and Admin platform bullets) and Admin Editability \"Fixed in Codebase\": \"Account closure workflow: admin deactivation through FR-015 only (no \"Deleted\" status)\". Screen: SCR-032-06 (Account Closure card)."}}
  - {"op": "add_node", "id": "REQ-032-014", "type": "Rule", "owner_fr": "FR-032", "title": "Persist and propagate provider profile", "attrs": {"statement": "System MUST persist provider profile data (logo, name, description, languages, awards) and propagate to patient quote comparison view within 1 minute", "rationale": "Business Rule 1 restates it. Module Scope: patients view provider profiles \"which may be initially curated by admin but subsequent provider-made changes propagate directly\". Screen 1: \"Profile updates propagate to patient app within 1 minute\"."}}
  - {"op": "add_node", "id": "REQ-032-015", "type": "Rule", "owner_fr": "FR-032", "title": "Persist account settings", "attrs": {"statement": "System MUST persist account settings (phone number in international format, timezone, password hash)", "rationale": "Screen 2: \"Phone number country code and number stored together in international format (e.g., +44 7700 900123)\"."}}
  - {"op": "add_node", "id": "REQ-032-016", "type": "Rule", "owner_fr": "FR-032", "title": "Persist and sync notification preferences", "attrs": {"statement": "System MUST persist notification preferences and synchronize with S-03 Notification Service within 1 minute", "rationale": "Screen 3: \"Preference updates propagate to S-03 within 1 minute\". Failure handling in REQ-032-074."}}
  - {"op": "add_node", "id": "REQ-032-017", "type": "Rule", "owner_fr": "FR-032", "title": "Bank details encrypted and masked", "attrs": {"statement": "System MUST persist bank account details encrypted at rest (AES-256) and mask in UI (last 4 digits visible)", "rationale": "Restated by Privacy Rule 1, Billing Rule 4 and Screen 4. Screen: SCR-032-08."}}
  - {"op": "add_node", "id": "REQ-032-018", "type": "Rule", "owner_fr": "FR-032", "title": "Encrypt bank account details", "attrs": {"statement": "System MUST encrypt bank account details at rest using AES-256", "rationale": "Restated by Privacy Rule 1 and Admin Editability \"Fixed in Codebase: Encryption algorithms: AES-256 for data at rest\"."}}
  - {"op": "add_node", "id": "REQ-032-019", "type": "Rule", "owner_fr": "FR-032", "title": "Hash passwords with bcrypt", "attrs": {"statement": "System MUST hash passwords using bcrypt (cost factor 12+) and never store plain text passwords", "rationale": "Restated by Privacy Rule 2 and Admin Editability \"Fixed in Codebase: Password hash algorithm: bcrypt with cost factor 12+\"."}}
  - {"op": "add_node", "id": "REQ-032-020", "type": "Rule", "owner_fr": "FR-032", "title": "Audit log of settings changes", "attrs": {"statement": "System MUST log all profile changes, account settings changes, billing settings changes, and account closure requests in audit trail (timestamp, user ID, IP address, action, and appropriately masked old/new values where sensitive data is involved)", "rationale": "Restated by the Audit Rule (adds old value and new value), Business Rule 3 (account settings changes with timestamp, user ID, IP address), the per-screen audit lines on Screens 1-4 and closure Main Flow step 9 (user, timestamp, reason)."}}
  - {"op": "add_node", "id": "REQ-032-021", "type": "Rule", "owner_fr": "FR-032", "title": "Password change security email", "attrs": {"statement": "System MUST send email notification to provider after password change (security alert)", "rationale": "Account Settings Main Flow step 22: email text \"Your password was changed on [date] at [time]\"."}}
  - {"op": "add_node", "id": "REQ-032-022", "type": "Rule", "owner_fr": "FR-032", "title": "Role-based access to billing settings", "attrs": {"statement": "System MUST enforce role-based access control for billing settings (Owner role only; non-owners cannot see or access billing settings tab)", "rationale": "Same rule as REQ-032-011 (Security & Privacy restatement), kept because the PRD numbers it separately. Edge case on Owner role change: REQ-032-079."}}
  - {"op": "add_node", "id": "REQ-032-023", "type": "Rule", "owner_fr": "FR-032", "title": "Approved closure is FR-015 deactivation", "attrs": {"statement": "System MUST process approved account-closure requests as FR-015 deactivation (account status = \"Deactivated\", standard FR-015 cascade, data archived per FR-023 minimum 7 years)", "rationale": "Restated by Privacy Rule 3. Closure Main Flow step 14 lists the FR-015 cascade: status Deactivated, login blocked with the Rule 6 message, profile hidden from patients and new inquiries, non-terminal inquiries, quotes and bookings cancelled with notifications, captured payments reconciled by FR-017, data archived per FR-023 (minimum 7 years), bank account details encrypted and archived."}}
  - {"op": "add_node", "id": "REQ-032-024", "type": "Rule", "owner_fr": "FR-032", "title": "Integrate with S-03 for preferences", "attrs": {"statement": "System MUST integrate with S-03 Notification Service to enforce provider notification preferences (FR-020)", "rationale": "Integration restatement of REQ-032-009."}}
  - {"op": "add_node", "id": "REQ-032-025", "type": "Rule", "owner_fr": "FR-032", "title": "S-02 validates bank details format", "attrs": {"statement": "System MUST integrate with S-02 Payment Service to validate bank account details format before saving", "rationale": "Billing Rule 1: \"format validation only, no funds verification\". Admin Editability: \"S-02 Payment Service validates bank account format per country, admin cannot modify validation logic\". Screen: SCR-032-08."}}
  - {"op": "add_node", "id": "REQ-032-026", "type": "Rule", "owner_fr": "FR-032", "title": "Language options from FR-026/FR-021", "attrs": {"statement": "System MUST integrate with FR-026/FR-021 language configuration to provide centrally managed language options in profile language selection (FR-021 is canonical for supported locales; FR-026 surfaces these via App Settings)", "rationale": "Screen 1 Tab 2 notes: \"Language list consumed from FR-021; FR-026 may surface the list through the broader settings shell but does not own provider language-capacity semantics.\""}}
  - {"op": "add_node", "id": "REQ-032-027", "type": "Rule", "owner_fr": "FR-032", "title": "Country codes and timezones from FR-026", "attrs": {"statement": "System MUST integrate with FR-026 to provide country codes and timezone options in account settings", "rationale": "Integration restatement of REQ-032-005 and REQ-032-006."}}
  - {"op": "add_node", "id": "REQ-032-028", "type": "Rule", "owner_fr": "FR-032", "title": "Help Centre content from FR-033", "attrs": {"statement": "System MUST integrate with FR-033 to display admin-managed Help Centre content", "rationale": "Integration restatement of REQ-032-012."}}
  - {"op": "add_node", "id": "REQ-032-029", "type": "Rule", "owner_fr": "FR-032", "title": "Read-only Commission & Payout panel", "attrs": {"statement": "System MUST show provider Owners a read-only Commission & Payout panel in Screen 4 with commission model, value, Flat Rate Currency, Effective Date, any scheduled configuration, and payout frequency sourced from FR-015 Tab 7 / FR-029", "rationale": "Screen 4 Commission & Payout panel fields: Commission Model, Commission Value, Effective Date, Scheduled Configuration (hidden when none pending), Payout Frequency. Screen: SCR-032-08."}}
  - {"op": "add_node", "id": "REQ-032-030", "type": "Rule", "owner_fr": "FR-032", "title": "Rule 6 provider status behaviour", "attrs": {"statement": "System MUST apply Rule 6: show a persistent Account Suspended banner with the admin reason to all provider users while suspended, restrict editing to the listed exceptions, and block login with a deactivation message once deactivated", "rationale": "Summary of Business Rule 6; the Suspended, Deactivated and Reactivated sub-rules are REQ-032-045, REQ-032-046 and REQ-032-047."}}
  - {"op": "add_node", "id": "REQ-032-031", "type": "Rule", "owner_fr": "FR-032", "title": "Mandatory notices have no toggle", "attrs": {"statement": "System MUST NOT offer a provider notification preference toggle for the inquiry-cancelled quote notice (FR-020 `quote.cancelled_inquiry`) and MUST deliver that notice to each affected provider regardless of notification type and channel preferences. The same applies to every other mandatory provider notice in FR-030 Non-Disableable by Default: the selected-provider and not-selected-provider outcomes of `quote.accepted`, `booking.payment_window_expired`, `booking.revived`, `booking.rescheduled` and the aftercare reassignment notice (FR-020 `aftercare.provider_reassigned`, sent to the new aftercare provider)", "rationale": "Restated by Business Rule 2, Screen 3 (no toggle; neither the Quote or Schedule toggles, \"Disable All\" nor channel preferences can suppress them), Main Flow step 4 toggle notes and Alternative Flow A5 step 6. Product owner decision log mtg002-quote-model-decisions-2026-10-16 Q12, Q42 and Q47 record these notices as mandatory. Screen: SCR-032-07."}}
  - {"op": "add_node", "id": "REQ-032-032", "type": "Rule", "owner_fr": "FR-032", "title": "Entry points to provider settings, Help Centre and billing", "attrs": {"statement": "Provider navigates to \"Settings & Support > Settings\" from main dashboard navigation; Provider clicks on notification icon to configure preferences; Provider accesses Help Centre from footer or help icon; Provider Owner role accesses billing settings from financial dashboard; System prompts provider to complete profile setup during onboarding; System sends notification approval requests when admin creates platform-wide discount", "rationale": "Entry Points section. The onboarding prompt applies at the onboarding stage."}}
  - {"op": "add_node", "id": "REQ-032-033", "type": "Rule", "owner_fr": "FR-032", "title": "Profile required fields and length limits", "attrs": {"statement": "System validates all required fields for the current tab (clinic name, description); Clinic Name: Max 200 chars, min 3 chars; About/Description: Max 500 chars, min 50 chars; Location - City: Max 100 chars", "rationale": "Alternative Flow B2: missing clinic name is highlighted with \"Clinic name is required\" and the save is blocked. Screen: SCR-032-01."}}
  - {"op": "add_node", "id": "REQ-032-034", "type": "Rule", "owner_fr": "FR-032", "title": "Cover image banner and limits", "attrs": {"statement": "Cover image displayed as a banner on the top of the provider profile in patient app; Cover Image: Max 10MB, JPEG/PNG only, recommended 1920x300px", "rationale": "Screen: SCR-032-01."}}
  - {"op": "add_node", "id": "REQ-032-035", "type": "Rule", "owner_fr": "FR-032", "title": "Initials fallback when no logo", "attrs": {"statement": "If no logo uploaded, system displays clinic name initials as fallback", "rationale": "Screen: SCR-032-01."}}
  - {"op": "add_node", "id": "REQ-032-036", "type": "Rule", "owner_fr": "FR-032", "title": "Contact email uniqueness among providers", "attrs": {"statement": "Contact Email: Valid email format; must be unique among Active and Suspended providers if changed (Deactivated records ignored, per FR-015 Rule 4)", "rationale": "Screen: SCR-032-01. The uniqueness rule is FR-015 Rule 4."}}
  - {"op": "add_node", "id": "REQ-032-037", "type": "Rule", "owner_fr": "FR-032", "title": "Public clinic phone format", "attrs": {"statement": "Contact Phone (Public): Contains `Country Code` (dropdown, FR-026) and `Number` (text, numeric only, length validated per country code)", "rationale": "Screen: SCR-032-01. Public-facing phone shown in the profile \"About\" section."}}
  - {"op": "add_node", "id": "REQ-032-038", "type": "Rule", "owner_fr": "FR-032", "title": "Clinic country from central country list", "attrs": {"statement": "Location - Country: Values from centrally managed country list (FR-026); optional but recommended", "rationale": "Screen: SCR-032-01."}}
  - {"op": "add_node", "id": "REQ-032-039", "type": "Rule", "owner_fr": "FR-032", "title": "Website URL format", "attrs": {"statement": "Website URL: Valid URL format (http/https); auto-prepends https:// if protocol missing", "rationale": "Screen: SCR-032-01."}}
  - {"op": "add_node", "id": "REQ-032-040", "type": "Rule", "owner_fr": "FR-032", "title": "Per-tab save and unsaved-changes reminder", "attrs": {"statement": "Each tab can be saved independently; System displays unsaved changes indicator (e.g., dot or asterisk) on tabs with unsaved edits; when provider attempts to navigate away or quit, system displays reminder dialog \"You have unsaved changes. Are you sure you want to leave?\" with options to save, discard, or cancel; If provider navigates away with unsaved message content, system prompts: \"You have unsaved changes. Discard?\"", "rationale": "Unsaved Changes Rule (Data & Privacy Rules), restated under Screen 1 General Business Rules, Screen 2 notes and Screen 3. The last part is the Screen 5.8 support reply variant. Screens: SCR-032-01 to SCR-032-08 and SCR-032-16."}}
  - {"op": "add_node", "id": "REQ-032-041", "type": "Rule", "owner_fr": "FR-032", "title": "Provider-editable fields versus read-only module views", "attrs": {"statement": "Rule 5: All profile, language, awards, account, and notification fields documented in this FR are provider-editable within the Provider Dashboard (subject to role restrictions noted); reviews content and Help Centre articles are read-only views fed by their respective modules (staff roster managed by FR-009); providers may post responses to reviews via FR-013 Screen 6 response composer but cannot edit or delete review records", "rationale": "Screen 1 General Business Rules \"Tab Editability\": Tabs 1, 2, 4 and 6 fully editable; Tab 3 (Staff List) displays FR-009 Screen 1; Tab 5 (Reviews) read/respond."}}
  - {"op": "add_node", "id": "REQ-032-042", "type": "Rule", "owner_fr": "FR-032", "title": "Last save wins on concurrent profile edits", "attrs": {"statement": "Concurrent Edits Rule: Provider profile saves are last-save-wins. If a provider user and an admin (FR-015), or two provider users, edit the same fields at the same time, the later save overwrites the earlier one; there is no conflict check and no conflict message. A save applies only the fields the user changed; untouched fields are not rewritten, so last save wins only when two people change the same field. Every save is logged in the audit trail with old and new values", "rationale": "Data & Privacy Rules."}}
  - {"op": "add_node", "id": "REQ-032-043", "type": "Rule", "owner_fr": "FR-032", "title": "At least one supported language", "attrs": {"statement": "At least 1 language must be selected (validation prevents removing last language)", "rationale": "Screen 1 Tab 2; removing the last chip requires confirmation. Screen: SCR-032-02."}}
  - {"op": "add_node", "id": "REQ-032-044", "type": "Rule", "owner_fr": "FR-032", "title": "Language priority order", "attrs": {"statement": "Chips support drag-and-drop reordering to prioritize languages (most important first)", "rationale": "Screen: SCR-032-02."}}
  - {"op": "add_node", "id": "REQ-032-045", "type": "Rule", "owner_fr": "FR-032", "title": "Award field limits", "attrs": {"statement": "Awards List: Each award: name (max 100 chars), issuer/organization (max 150 chars, optional), description (max 300 chars), year (1900-current year), award image (max 2MB, JPEG/PNG)", "rationale": "Screen: SCR-032-03."}}
  - {"op": "add_node", "id": "REQ-032-046", "type": "Rule", "owner_fr": "FR-032", "title": "Award deletion is a soft delete", "attrs": {"statement": "System removes award from profile (soft-delete, retained in archive)", "rationale": "Alternative Flow A2, after confirmation \"Are you sure you want to delete this award?\". Screen: SCR-032-03."}}
  - {"op": "add_node", "id": "REQ-032-047", "type": "Rule", "owner_fr": "FR-032", "title": "Award priority order", "attrs": {"statement": "Awards support drag-and-drop reordering to prioritize most important awards", "rationale": "Screen: SCR-032-03."}}
  - {"op": "add_node", "id": "REQ-032-048", "type": "Rule", "owner_fr": "FR-032", "title": "Malicious image upload is blocked", "attrs": {"statement": "System scans uploaded image using anti-virus/malware scanning service (e.g., ClamAV), detects malicious content, deletes uploaded file, displays error \"Image upload blocked due to security concerns. Please try a different image or contact support if this was a mistake.\", logs security event for admin review, and prevents award image from being saved", "rationale": "Edge Cases."}}
  - {"op": "add_node", "id": "REQ-032-049", "type": "Rule", "owner_fr": "FR-032", "title": "Upload and password-change rate limits", "attrs": {"statement": "Rate limiting on password change endpoint (max 5 attempts/hour/user) to prevent brute force attacks; rate limiting on image upload endpoint (max 10 uploads/hour/user) to prevent abuse", "rationale": "Promoted from Implementation Notes, Security Considerations (threat mitigation)."}}
  - {"op": "add_node", "id": "REQ-032-050", "type": "Rule", "owner_fr": "FR-032", "title": "Reviews are read-only with FR-013 responses", "attrs": {"statement": "Review content (ratings, feedback, photos) is read-only — providers cannot edit or delete patient-submitted reviews; Providers may post a public response to any published review via the inline response composer defined in FR-013 Screen 6; see FR-013 for response rules and immutability", "rationale": "Screen 1 Tab 5. Screen: SCR-032-04."}}
  - {"op": "add_node", "id": "REQ-032-051", "type": "Rule", "owner_fr": "FR-032", "title": "Review filters and sort persist per session", "attrs": {"statement": "Filters and sort selections persist per user session; Sort Dropdown: Sort order options: \"Most recent\" (default), \"Highest rated\", \"Lowest rated\", \"Oldest first\"", "rationale": "Screen: SCR-032-04. Rating filters allow multiple selections; page size 10/20/50."}}
  - {"op": "add_node", "id": "REQ-032-052", "type": "Rule", "owner_fr": "FR-032", "title": "Review notification highlights the review", "attrs": {"statement": "Clicking a review notification (from notifications) opens this tab with relevant review auto-highlighted", "rationale": "Supporting Flow \"Browse Reviews\" step 5. Screen: SCR-032-04."}}
  - {"op": "add_node", "id": "REQ-032-053", "type": "Rule", "owner_fr": "FR-032", "title": "Provider document ownership and permissions", "attrs": {"statement": "Provider Document Management: Providers can upload, replace, delete, and view their own documents; Document Permissions: Providers can only delete/replace documents they uploaded; Admin-uploaded documents display \"View Only\" (providers cannot delete/replace, but can download)", "rationale": "Screen 1 Tab 6. Screen: SCR-032-05."}}
  - {"op": "add_node", "id": "REQ-032-054", "type": "Rule", "owner_fr": "FR-032", "title": "Admin-uploaded provider documents", "attrs": {"statement": "Admin Oversight: Admins can upload additional documents via FR-015 Tab 6 (e.g., documents received via email, external verifications). Admin-uploaded documents display \"Admin\" badge", "rationale": "Screen: SCR-032-05."}}
  - {"op": "add_node", "id": "REQ-032-055", "type": "Rule", "owner_fr": "FR-032", "title": "Document sync to admin within 1 minute", "attrs": {"statement": "Document Sync: Documents uploaded by provider in FR-032 sync to FR-015 within 1 minute for admin visibility", "rationale": "Screen: SCR-032-05."}}
  - {"op": "add_node", "id": "REQ-032-056", "type": "Rule", "owner_fr": "FR-032", "title": "Document replace archives the old version", "attrs": {"statement": "Replace Document: Clicking \"Replace\" on a document card opens file picker; uploading new file replaces current version; old version archived (soft delete) with timestamp", "rationale": "Notes: old versions are not shown to the provider; admin can view them in FR-015. Screen: SCR-032-05."}}
  - {"op": "add_node", "id": "REQ-032-057", "type": "Rule", "owner_fr": "FR-032", "title": "Document delete is a soft delete", "attrs": {"statement": "Delete Document: Clicking \"Delete\" opens confirmation dialog; on confirm, document soft-deleted (not permanently removed); admin can view deleted documents in FR-015 for audit purposes", "rationale": "Screen: SCR-032-05."}}
  - {"op": "add_node", "id": "REQ-032-058", "type": "Rule", "owner_fr": "FR-032", "title": "Document actions audit log", "attrs": {"statement": "Audit Logging: All document actions (upload/replace/delete/view/download) logged with timestamp, user, action type, and IP address (visible in FR-015 Tab 8: Activity Log)", "rationale": "Screen: SCR-032-05."}}
  - {"op": "add_node", "id": "REQ-032-059", "type": "Rule", "owner_fr": "FR-032", "title": "Document links are signed and time-limited", "attrs": {"statement": "Security: Document URLs are secure, time-limited signed URLs; direct file access not allowed", "rationale": "Screen: SCR-032-05."}}
  - {"op": "add_node", "id": "REQ-032-060", "type": "Rule", "owner_fr": "FR-032", "title": "Document file validation and virus scan", "attrs": {"statement": "Accepted formats: PDF, JPG, PNG, DOCX, XLSX; Max file size: 10MB per document; File name sanitization: Remove special characters, limit to 200 chars; Virus scanning: All uploaded files scanned before storage; Notes: Max 500 chars; editable", "rationale": "Screen 1 Tab 6 File Validation. Screen: SCR-032-05."}}
  - {"op": "add_node", "id": "REQ-032-061", "type": "Rule", "owner_fr": "FR-032", "title": "Owner account name synced from clinic name", "attrs": {"statement": "Account Name field is read-only for Owner role; it automatically syncs when clinic name is updated in Tab 1; If Owner updates clinic name in Tab 1, Account Name in Tab 2 updates automatically (within 1 minute)", "rationale": "Screen 2: \"Owner account represents the clinic organization, so account name should match clinic name for consistency across the platform\". Screen: SCR-032-06."}}
  - {"op": "add_node", "id": "REQ-032-062", "type": "Rule", "owner_fr": "FR-032", "title": "Staff account name is a personal display name", "attrs": {"statement": "For Staff roles (Manager, Clinical Staff, Billing Staff): Account Name is editable and independent from clinic name; Default Account Name for staff is \"First Name + Last Name\" (e.g., \"John Smith\"); Staff Account Name changes do not affect clinic name or other staff members' account names", "rationale": "Screen 2: staff account name is used in dashboard, notifications, activity logs and team member listings. Screen: SCR-032-06."}}
  - {"op": "add_node", "id": "REQ-032-063", "type": "Rule", "owner_fr": "FR-032", "title": "Account name, user name and login email validation", "attrs": {"statement": "Account Name: Max 200 chars; First Name: Max 50 chars, letters and spaces only; Account Email: Valid email format, unique in system", "rationale": "Screen 2. First Name and Last Name share the same limit. Screen: SCR-032-06."}}
  - {"op": "add_node", "id": "REQ-032-064", "type": "Rule", "owner_fr": "FR-032", "title": "Timezone drives display, storage stays UTC", "attrs": {"statement": "Timezone preference applies to all date/time displays in provider dashboard; Existing timestamps in database remain in UTC, converted to provider's timezone for display", "rationale": "Alternative Flow A7. Screen: SCR-032-06."}}
  - {"op": "add_node", "id": "REQ-032-065", "type": "Rule", "owner_fr": "FR-032", "title": "Password confirmation and change checks", "attrs": {"statement": "Confirm New Password: Must match New Password field; System validates new password ≠ current password, detects match, displays error \"New password must be different from current password\", and prevents password change until different password entered", "rationale": "Alternative Flow B8 (\"Password confirmation does not match\") and Edge Cases. Screen: SCR-032-06."}}
  - {"op": "add_node", "id": "REQ-032-066", "type": "Rule", "owner_fr": "FR-032", "title": "Password complexity fixed in code", "attrs": {"statement": "Password policy complexity requirements: min 12 chars, 1 uppercase, 1 lowercase, 1 digit, 1 special char (!@#$%^&(),.?\\\":{}|<>) (FR-026)", "rationale": "Admin Editability \"Fixed in Codebase\". FR-026 password policy parameters (max login attempts, lockout duration, OTP expiry, resend cooldown) are admin-configurable; complexity is not."}}
  - {"op": "add_node", "id": "REQ-032-067", "type": "Rule", "owner_fr": "FR-032", "title": "Suspended provider: banner and view-only access", "attrs": {"statement": "Suspended: The Owner and every FR-009 team member can still log in and see a persistent, non-dismissible banner on every Provider Platform page: \"Your account is temporarily suspended. Reason: [admin-provided reason]. Contact support@hairlineapp.com for assistance.\" The reason is the Screen 4 reason recorded in FR-015. While suspended, the provider cannot receive new inquiries, submit quotes, or accept new work (FR-015 Rule 9); profile, documents, reviews, billing, and team management (FR-009 Rule 10) are view-only. Account security (password change), notification preferences, Help Centre, and support cases (Screens 5.5–5.9) remain available so the provider can contact admins. Chat with patients on the provider's open `In Progress` and `Aftercare` cases also stays available. Clinical notes, photos, and aftercare answers and actions are blocked until the admin reassigns or decides the case (FR-015 Screen 4).", "rationale": "Business Rule 6 (provider account status is owned by FR-015)."}}
  - {"op": "add_node", "id": "REQ-032-068", "type": "Rule", "owner_fr": "FR-032", "title": "Deactivated provider: login blocked", "attrs": {"statement": "Deactivated: Login is disabled for the Owner and all team members. A login attempt shows \"This account has been deactivated. Contact support@hairlineapp.com for assistance.\" and no session is created.", "rationale": "Business Rule 6."}}
  - {"op": "add_node", "id": "REQ-032-069", "type": "Rule", "owner_fr": "FR-032", "title": "Reactivated provider: banner removed", "attrs": {"statement": "Reactivated: The banner is removed on the next page load and normal editing returns; nothing cancelled by the suspension is restored (FR-015 Screen 5).", "rationale": "Business Rule 6."}}
  - {"op": "add_node", "id": "REQ-032-070", "type": "Rule", "owner_fr": "FR-032", "title": "Closure request needs explicit acknowledgement", "attrs": {"statement": "[Checkbox] \"I understand that closing my account is permanent and my account data will be archived.\"; Reason for closure: [textarea] (optional); System closes dialog without creating closure request", "rationale": "Closure Main Flow steps 4-5 (warning dialog text: permanent deactivation, cannot be reversed, open inquiries/quotes/bookings cancelled and patients notified, captured payments reconciled, data archived) and Alternative Flow A13 (cancel). Screen: SCR-032-06."}}
  - {"op": "add_node", "id": "REQ-032-071", "type": "Rule", "owner_fr": "FR-032", "title": "One pending closure request per provider", "attrs": {"statement": "System creates account closure request record with status \"Pending Admin Review\" (only one pending request per provider; no booking or payout check blocks submission)", "rationale": "Key Entities Entity 5: \"only one \"Pending\" at a time\"."}}
  - {"op": "add_node", "id": "REQ-032-072", "type": "Rule", "owner_fr": "FR-032", "title": "Closure request notifies admins", "attrs": {"statement": "System sends the FR-020 `provider.closure_requested` notification to admins (mandatory), and FR-015 Screen 1 shows the provider with the Closure Requested marker and filter", "rationale": "Closure Main Flow step 10."}}
  - {"op": "add_node", "id": "REQ-032-073", "type": "Rule", "owner_fr": "FR-032", "title": "Closure confirmation promises review in 5 business days", "attrs": {"statement": "System displays confirmation to provider \"Account closure request submitted. Our team will review and process your request within 5 business days. You will receive an email once your account is deactivated.\"", "rationale": "Business Process Assumption 2: \"Admins review and process provider account closure requests within 5 business days\"."}}
  - {"op": "add_node", "id": "REQ-032-074", "type": "Rule", "owner_fr": "FR-032", "title": "Account stays active while closure is pending", "attrs": {"statement": "Provider account remains Active until admin processes the request. If the admin schedules the deactivation for a future date, the request stays \"Pending Admin Review\" until the deactivation takes effect; if the scheduled deactivation is cancelled, the request stays \"Pending Admin Review\" and no rejection email is sent", "rationale": "Closure Main Flow steps 12-13 (admin processes per FR-015 Alternative Flow A7 via FR-015 Screen 4)."}}
  - {"op": "add_node", "id": "REQ-032-075", "type": "Rule", "owner_fr": "FR-032", "title": "Closure approved when deactivation takes effect", "attrs": {"statement": "When the deactivation takes effect, the system sets the closure request status to \"Approved\", links it to the FR-015 deactivation status event, and sends the FR-015 deactivation email (`provider.deactivated`, FR-020). FR-015 locks \"Notify Provider\" on for closure deactivations, so this email is always sent, as step 11 promises", "rationale": "Closure Main Flow step 15."}}
  - {"op": "add_node", "id": "REQ-032-076", "type": "Rule", "owner_fr": "FR-032", "title": "Closure rejection keeps account active", "attrs": {"statement": "If the admin rejects the request instead (e.g., the provider asks to withdraw it), the system sets the request status to \"Rejected\" with review notes, the provider account remains Active, and the provider receives the FR-020 `provider.closure_rejected` email with the review notes (mandatory). The provider may submit a new request later", "rationale": "Closure Main Flow step 16."}}
  - {"op": "add_node", "id": "REQ-032-077", "type": "Rule", "owner_fr": "FR-032", "title": "Closure request is the erasure path", "attrs": {"statement": "GDPR Compliance: Provider account closure request gives the provider a path to request erasure (FR-015 deactivation with data archival per FR-023, not permanent deletion)", "rationale": "Data & Privacy Rules; Implementation Notes Compliance restates it."}}
  - {"op": "add_node", "id": "REQ-032-078", "type": "Rule", "owner_fr": "FR-032", "title": "Notification preferences apply to the whole organization", "attrs": {"statement": "Notification preferences are profile-specific (apply to entire provider organization, not individual team members)", "rationale": "Screen: SCR-032-07."}}
  - {"op": "add_node", "id": "REQ-032-079", "type": "Rule", "owner_fr": "FR-032", "title": "Disable-all needs confirmation", "attrs": {"statement": "If all notification types disabled, show confirmation dialog warning provider may miss important updates", "rationale": "Alternative Flow A5 dialog: \"Warning: You have disabled all notifications. You may miss important updates about inquiries, appointments, and reviews. Are you sure?\" Screen: SCR-032-07."}}
  - {"op": "add_node", "id": "REQ-032-080", "type": "Rule", "owner_fr": "FR-032", "title": "Channel preferences override type toggles", "attrs": {"statement": "Global channel preferences override individual notification types (e.g., if Email disabled, no notifications sent via email regardless of individual toggles)", "rationale": "Screen: SCR-032-07."}}
  - {"op": "add_node", "id": "REQ-032-081", "type": "Rule", "owner_fr": "FR-032", "title": "Critical system alerts bypass preferences", "attrs": {"statement": "Critical system alerts (e.g., payment failure, security breach) bypass preferences and always sent via all available channels", "rationale": "Screen 3; Business Rule 2."}}
  - {"op": "add_node", "id": "REQ-032-082", "type": "Rule", "owner_fr": "FR-032", "title": "Notification preference changes are audited", "attrs": {"statement": "Preference changes logged in audit trail", "rationale": "Screen 3 and Main Flow step 10."}}
  - {"op": "add_node", "id": "REQ-032-083", "type": "Rule", "owner_fr": "FR-032", "title": "Preference sync retry when S-03 is down", "attrs": {"statement": "System attempts to update S-03 with new preferences, detects S-03 unavailable (timeout or 5xx error), queues preference update for retry (exponential backoff), displays success message to provider \"Notification preferences updated\" (optimistic UI), logs error for admin monitoring, and retries preference update every 1 minute for up to 5 minutes; if S-03 still unavailable after 5 minutes, admin receives alert", "rationale": "Edge Cases; External Dependencies S-03 failure handling (\"preferences may take up to 5 minutes to propagate\")."}}
  - {"op": "add_node", "id": "REQ-032-084", "type": "Rule", "owner_fr": "FR-032", "title": "Core notification types cannot be removed", "attrs": {"statement": "Notification preference options: admins can add/remove notification types via system configuration, but core notification types (quote, schedule, treatment, aftercare, review) are required", "rationale": "Admin Editability \"Configurable with Restrictions\"."}}
  - {"op": "add_node", "id": "REQ-032-085", "type": "Rule", "owner_fr": "FR-032", "title": "Billing field formats", "attrs": {"statement": "Account Holder Name: Max 200 chars, alphabetic and spaces only; Routing/SWIFT Code: 8-11 chars for SWIFT, 9 digits for USA routing; IBAN: Format validated per country (e.g., Turkey = 26 chars)", "rationale": "Screen 4; Alternative Flow B10 example \"Invalid IBAN format. Turkey IBAN must be 26 characters\". Bank Name max 200 chars. Screen: SCR-032-08."}}
  - {"op": "add_node", "id": "REQ-032-086", "type": "Rule", "owner_fr": "FR-032", "title": "Account number unmasked only in edit mode", "attrs": {"statement": "Account number masked in read-only view (e.g., ●●●●●●1234), unmasked in edit mode", "rationale": "Screen 4; Main Flow step 5. Screen: SCR-032-08."}}
  - {"op": "add_node", "id": "REQ-032-087", "type": "Rule", "owner_fr": "FR-032", "title": "Failed S-02 validation blocks the save", "attrs": {"statement": "If bank account validation fails, display error message from S-02 and prevent saving", "rationale": "Alternative Flow B11: \"Bank account validation failed: [error detail from S-02]. Please verify your bank details and try again.\" Screen: SCR-032-08."}}
  - {"op": "add_node", "id": "REQ-032-088", "type": "Rule", "owner_fr": "FR-032", "title": "Bank detail change confirmation email", "attrs": {"statement": "Email confirmation sent to Owner after bank account details updated", "rationale": "Main Flow step 14. Screen: SCR-032-08."}}
  - {"op": "add_node", "id": "REQ-032-089", "type": "Rule", "owner_fr": "FR-032", "title": "Bank details survive an Owner role change", "attrs": {"statement": "existing bank account details remain saved and accessible to new Owner role user", "rationale": "Edge Cases: when the Owner role changes via FR-009, the Billing tab is hidden for the former Owner on next navigation."}}
  - {"op": "add_node", "id": "REQ-032-090", "type": "Rule", "owner_fr": "FR-032", "title": "Commission panel is read-only", "attrs": {"statement": "Commission & Payout panel: Read-only; values are set by admins in FR-015 Tab 7 and synchronized with FR-029. Providers cannot edit them and must contact support to discuss changes. The panel notes that existing confirmed bookings keep the commission snapshot taken at their confirmation (FR-029)", "rationale": "Screen 4. Commission snapshot rule is REQ-029-045; at most one pending configuration is REQ-029-116. Screen: SCR-032-08."}}
  - {"op": "add_field", "id": "ENT-provider-profile.provider_id", "entity_id": "ENT-provider-profile", "name": "provider_id", "data_type": "id", "title": "Provider ID", "owner_fr": "FR-032", "required": true, "attrs": {"description": "Provider the profile belongs to (Key Entities, Entity 1)."}}
  - {"op": "add_field", "id": "ENT-provider-profile.logo_url", "entity_id": "ENT-provider-profile", "name": "logo_url", "data_type": "media", "title": "Clinic logo", "owner_fr": "FR-032", "required": false, "attrs": {"description": "Clinic branding image displayed in patient app. Max 5MB, JPEG/PNG only, min 200x200px, recommended 500x500px"}}
  - {"op": "add_field", "id": "ENT-provider-profile.cover_image_url", "entity_id": "ENT-provider-profile", "name": "cover_image_url", "data_type": "media", "title": "Cover image", "owner_fr": "FR-032", "required": false, "attrs": {"description": "Large banner image for clinic profile. Max 10MB, JPEG/PNG only, recommended 1920x300px"}}
  - {"op": "add_field", "id": "ENT-provider-profile.clinic_name", "entity_id": "ENT-provider-profile", "name": "clinic_name", "data_type": "text", "title": "Clinic name", "owner_fr": "FR-032", "required": true, "attrs": {"description": "Official clinic name. Max 200 chars, min 3 chars"}}
  - {"op": "add_field", "id": "ENT-provider-profile.clinic_description", "entity_id": "ENT-provider-profile", "name": "clinic_description", "data_type": "text", "title": "Clinic description", "owner_fr": "FR-032", "required": true, "attrs": {"description": "Brief clinic description for patients. Max 500 chars, min 50 chars"}}
  - {"op": "add_field", "id": "ENT-provider-profile.contact_email", "entity_id": "ENT-provider-profile", "name": "contact_email", "data_type": "text", "title": "Contact email", "owner_fr": "FR-032", "required": true, "attrs": {"description": "Clinic contact email shown on provider public profile and used for communications. Valid email format; must be unique among Active and Suspended providers if changed (Deactivated records ignored, per FR-015 Rule 4)"}}
  - {"op": "add_field", "id": "ENT-provider-profile.public_phone", "entity_id": "ENT-provider-profile", "name": "public_phone", "data_type": "json", "title": "Public clinic phone", "owner_fr": "FR-032", "required": false, "attrs": {"description": "Public-facing clinic phone number shown in profile \"About\" section. Contains `Country Code` (dropdown, FR-026) and `Number` (text, numeric only, length validated per country code)"}}
  - {"op": "add_field", "id": "ENT-provider-profile.website_url", "entity_id": "ENT-provider-profile", "name": "website_url", "data_type": "text", "title": "Clinic website URL", "owner_fr": "FR-032", "required": false, "attrs": {"description": "Public-facing clinic website shown in profile \"About\" section. Valid URL format (http/https); auto-prepends https:// if protocol missing"}}
  - {"op": "add_field", "id": "ENT-provider-profile.country", "entity_id": "ENT-provider-profile", "name": "country", "data_type": "text", "title": "Clinic country", "owner_fr": "FR-032", "required": false, "attrs": {"description": "Country where clinic is located. Values from centrally managed country list (FR-026); optional but recommended"}}
  - {"op": "add_field", "id": "ENT-provider-profile.city", "entity_id": "ENT-provider-profile", "name": "city", "data_type": "text", "title": "Clinic city", "owner_fr": "FR-032", "required": false, "attrs": {"description": "City where clinic is located. Max 100 chars"}}
  - {"op": "add_field", "id": "ENT-provider-profile.supported_languages", "entity_id": "ENT-provider-profile", "name": "supported_languages", "data_type": "text[]", "title": "Supported languages", "owner_fr": "FR-032", "required": true, "attrs": {"description": "Languages spoken at clinic. At least 1 language required; consumes the FR-021 language/locale catalog surfaced through settings"}}
  - {"op": "add_field", "id": "ENT-provider-profile.last_updated_at", "entity_id": "ENT-provider-profile", "name": "last_updated_at", "data_type": "datetime", "title": "Last updated", "owner_fr": "FR-032", "required": false, "attrs": {"description": "Last updated timestamp (Key Entities, Entity 1)."}}
  - {"op": "add_field", "id": "ENT-provider-profile.updated_by_user_id", "entity_id": "ENT-provider-profile", "name": "updated_by_user_id", "data_type": "id", "title": "Updated by", "owner_fr": "FR-032", "required": false, "attrs": {"description": "User who last updated the profile (Key Entities, Entity 1)."}}
  - {"op": "add_field", "id": "ENT-provider-award.name", "entity_id": "ENT-provider-award", "name": "name", "data_type": "text", "title": "Award name", "owner_fr": "FR-032", "required": true, "attrs": {"description": "Award name, max 100 chars (Screen 1 Tab 4)."}}
  - {"op": "add_field", "id": "ENT-provider-award.issuer", "entity_id": "ENT-provider-award", "name": "issuer", "data_type": "text", "title": "Issuer or organization", "owner_fr": "FR-032", "required": false, "attrs": {"description": "Issuer/organization, max 150 chars, optional (Screen 1 Tab 4)."}}
  - {"op": "add_field", "id": "ENT-provider-award.description", "entity_id": "ENT-provider-award", "name": "description", "data_type": "text", "title": "Award description", "owner_fr": "FR-032", "required": false, "attrs": {"description": "Max 300 chars (Screen 1 Tab 4)."}}
  - {"op": "add_field", "id": "ENT-provider-award.year", "entity_id": "ENT-provider-award", "name": "year", "data_type": "int", "title": "Award year", "owner_fr": "FR-032", "required": true, "attrs": {"description": "Year 1900 to current year (Screen 1 Tab 4)."}}
  - {"op": "add_field", "id": "ENT-provider-award.image_url", "entity_id": "ENT-provider-award", "name": "image_url", "data_type": "media", "title": "Award image", "owner_fr": "FR-032", "required": false, "attrs": {"description": "Award image, max 2MB, JPEG/PNG (Screen 1 Tab 4)."}}
  - {"op": "add_field", "id": "ENT-provider-account-settings.provider_id", "entity_id": "ENT-provider-account-settings", "name": "provider_id", "data_type": "id", "title": "Provider ID", "owner_fr": "FR-032", "required": true, "attrs": {"description": "Key Entities, Entity 2."}}
  - {"op": "add_field", "id": "ENT-provider-account-settings.account_name", "entity_id": "ENT-provider-account-settings", "name": "account_name", "data_type": "text", "title": "Account name", "owner_fr": "FR-032", "required": true, "attrs": {"description": "Display name for the account. Max 200 chars"}}
  - {"op": "add_field", "id": "ENT-provider-account-settings.phone_number", "entity_id": "ENT-provider-account-settings", "name": "phone_number", "data_type": "text", "title": "Phone number", "owner_fr": "FR-032", "required": false, "attrs": {"description": "Provider phone number. Numeric only, length validated per country code format"}}
  - {"op": "add_field", "id": "ENT-provider-account-settings.country_code", "entity_id": "ENT-provider-account-settings", "name": "country_code", "data_type": "text", "title": "Phone country code", "owner_fr": "FR-032", "required": false, "attrs": {"description": "Worldwide country calling code. Consumes FR-026 country calling codes list (e.g., +1, +44, +90, +234)"}}
  - {"op": "add_field", "id": "ENT-provider-account-settings.timezone", "entity_id": "ENT-provider-account-settings", "name": "timezone", "data_type": "text", "title": "Timezone", "owner_fr": "FR-032", "required": true, "attrs": {"description": "Provider's local timezone for date/time display. Multiple timezone options (GMT-12 to GMT+14)"}}
  - {"op": "add_field", "id": "ENT-provider-account-settings.password_hash", "entity_id": "ENT-provider-account-settings", "name": "password_hash", "data_type": "text", "title": "Password hash", "owner_fr": "FR-032", "required": true, "attrs": {"description": "New password. Min 12 chars, 1 uppercase, 1 lowercase, 1 digit, 1 special char (!@#$%^&(),.?\\\":{}<>) per FR-026"}}
  - {"op": "add_field", "id": "ENT-provider-account-settings.password_changed_at", "entity_id": "ENT-provider-account-settings", "name": "password_changed_at", "data_type": "datetime", "title": "Last password change date", "owner_fr": "FR-032", "required": false, "attrs": {"description": "Last password change date (Key Entities, Entity 2)."}}
  - {"op": "add_field", "id": "ENT-provider-account-settings.password_change_history", "entity_id": "ENT-provider-account-settings", "name": "password_change_history", "data_type": "json", "title": "Password change history", "owner_fr": "FR-032", "required": false, "attrs": {"description": "Password change history (timestamps) (Key Entities, Entity 2)."}}
  - {"op": "add_field", "id": "ENT-provider-account-settings.last_updated_at", "entity_id": "ENT-provider-account-settings", "name": "last_updated_at", "data_type": "datetime", "title": "Last updated", "owner_fr": "FR-032", "required": false, "attrs": {"description": "Last updated timestamp (Key Entities, Entity 2)."}}
