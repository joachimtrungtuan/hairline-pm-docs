# Operations ordered so new nodes come first, then edge removals, then updates, then new edges. Neighbour needs (FR-010, FR-022, FR-030) are queued in the ledger, not in this file. ENT-review.last_edited_at is already linked to REQ-013-033 by an applies-to edge; its calculated-by rule stays REQ-013-032.
reason: 'FR-013 logic review pass 2 (closing): provider list and detail show the treatment name only and filter by alias search, treatment, rating, date, response status and source type; an admin removal that closes a Pending takedown records the admin, time and removal reason and sends one notice; redact and removal clear the flag; Respond is hidden once a replacement was published; the provider gets one notice with the reason when an admin removes its response; two reviews per case in total; only cases marked Completed in FR-010 can be reviewed, counted from that day; aggregates count Published or Flagged reviews; admin Edit and Remove only for Published or Flagged reviews; latest takedown request shown; alias always public with admin unmask as an RBAC view; takedown flow hands over to the admin decision flow; audit admin id optional; rule and step titles aligned.'
by: docs-manager
operations:
