operations:
  - {"op": "update_node", "id": "REQ-003-110", "attrs": {"statement": "From acceptance onward, only an admin can cancel, through the FR-006 booking cancellation, from any booking state, with a mandatory reason and an audit entry. The booking and the inquiry become Cancelled, any active appointment hold is released, and the accepted quote keeps the status accepted. Refunds and fees follow the refund rules in FR-006 (Payment & Billing Rules: the refund ladder set in FR-029, or the provider-fault terms where the provider is at fault)."}}
  - {"op": "update_node", "id": "REQ-011-075", "attrs": {"statement": "A reassignment changes only the aftercare provider or team; the plan, milestones, scans, questionnaire responses, medications and communication history stay with the case, the new assignee gets the aftercare actions from the moment of confirmation, the previous provider loses them and keeps read-only access to history it recorded, and money effects, if any, follow the refund rules in FR-006 (Payment & Billing Rules: the refund ladder set in FR-029, or the provider-fault terms where the provider is at fault)."}}
  - {"op": "update_node", "id": "REQ-010-044", "attrs": {"rationale": "Restates REQ-010-029 and adds the refund rules in FR-006 (Payment & Billing Rules: the refund ladder set in FR-029, or the provider-fault terms where the provider is at fault); possible duplicate within this FR. Archived FR-010 PRD baseline, lines 567."}}
  - {"op": "update_node", "id": "REQ-010-076", "attrs": {"statement": "Provider clicks Report Issue Before Check In; selects reason: No-show; adds note System notifies admin; the booking stays Confirmed. The admin rebooks through the FR-006 Change Appointment action (FR-006 Screen 8) or cancels through the FR-006 Cancel Booking action (FR-006 Screen 9); deposit retention follows the refund rules in FR-006 (Payment & Billing Rules: the refund ladder set in FR-029, or the provider-fault terms where the provider is at fault). No-Show is an admin-managed case label, not a system-defined booking pipeline status"}}
  - {"op": "update_node", "id": "REQ-010-078", "attrs": {"statement": "Provider documents interruption reason in the affected day's note field Provider sets day status to Cancelled/Deferred; clicks Cancel/Close Case; documents reason System notifies admin; the case stays In Progress until the admin acts. The admin lets the case resume later, changes treatment details through Screen 9, or cancels the booking through the FR-006 Cancel Booking action (FR-006 Screen 9); financial reconciliation follows the refund rules in FR-006 (Payment & Billing Rules: the refund ladder set in FR-029, or the provider-fault terms where the provider is at fault)"}}
  - {"op": "update_node", "id": "REQ-010-092", "attrs": {"statement": "Case cancellation is performed by an admin through the FR-006 Cancel Booking action; financial reconciliation follows the refund rules in FR-006 (Payment & Billing Rules: the refund ladder set in FR-029, or the provider-fault terms where the provider is at fault) and the platform does not perform automatic financial resolution."}}
  - {"op": "update_node", "id": "REQ-016-032", "attrs": {"rationale": "Stated in prd.md, Admin Intervention Requirements (line 1121). Restated: prd.md line 248: \"System cancels each active booking through the FR-006 admin booking cancellation, using the suspension justification as the cancellation reason; refunds follow the refund rules in FR-006 (Payment & Billing Rules: the refund ladder set in FR-029, or the provider-fault terms where the provider is at fault)\" prd.md line 265: \"Outcome: Every post-acceptance cancellation or change goes through one audited FR-006 action, and the patient's request has a recorded outcome\""}}
  - {"op": "update_node", "id": "REQ-016-078", "attrs": {"rationale": "Stated in prd.md, Admin Editability Rules (line 708). Restated: prd.md line 261: \"For a cancellation request, admin opens the FR-006 Cancel Booking action (FR-006 Screen 9), which applies to any booking state from `Accepted` to `Aftercare`, enters the mandatory reason, and confirms; the booking and inquiry become `Cancelled`, the accepted quote stays accepted, the patient and provider receive `booking.cancelled`, and refunds follow the refund rules in FR-006 (Payment & Billing Rules: the refund ladder set in FR-029, or the provider-fault terms where the provider is at fault)\""}}
  - {"op": "update_node", "id": "REQ-016-179", "attrs": {"statement": "Refund amounts and cancellation fees are not set here; they follow the refund rules in FR-006 (Payment & Billing Rules: the refund ladder set in FR-029, or the provider-fault terms where the provider is at fault)"}}
  - {"op": "update_node", "id": "REQ-007B-053", "attrs": {"statement": "The patient requests cancellation through Contact Support; after subquote acceptance the patient cannot cancel in the app (FR-006) and the request reaches the admin queue in FR-016. The admin reviews the request and cancels the booking through the FR-006 Cancel Booking action with a mandatory reason and audit entry; the refund amount follows the refund rules in FR-006 (Payment & Billing Rules: the refund ladder set in FR-029, or the provider-fault terms where the provider is at fault)."}}
