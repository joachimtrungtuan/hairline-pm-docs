  - {"op": "add_node", "id": "REQ-009-007", "type": "Rule", "owner_fr": "FR-009", "title": "System MUST send email notifications for team management events (invitation, role change, removal)", "attrs": {"statement": "System MUST send email notifications for team management events (invitation, role change, removal)"}}
  - {"op": "add_node", "id": "REQ-009-008", "type": "Rule", "owner_fr": "FR-009", "title": "System MUST enforce the global provider email identity rule (Rule 3): an email can belong to...", "attrs": {"statement": "System MUST enforce the global provider email identity rule (Rule 3): an email can belong to only one provider organization at a time as Owner, team member, or pending invitation; invitations, FR-015 provider creation, and FR-015 owner login-email edits that use an email tied to another non-Deactivated provider must be blocked; emails of Deactivated providers are freed for reuse while their records stay archived", "rationale": "Rule 3 (Global Provider Email Identity): An email belongs to at most one provider organization at a time, across all forms of membership: Owner (created via FR-015), team member, or pending invitation. When a provider is Deactivated (FR-015), its Owner, team member, and pending-invitation emails are freed for reuse; the old records stay archived and are not reactivated by reuse. FR-015 provider creation and owner login-email edits apply this same rule."}}
