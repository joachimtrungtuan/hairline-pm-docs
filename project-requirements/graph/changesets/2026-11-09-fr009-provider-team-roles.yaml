  - {"op": "add_node", "id": "REQ-009-044", "type": "Rule", "owner_fr": "FR-009", "title": "Account creation form pre-filled from the invitation", "attrs": {"statement": "System presents account creation form pre-filled with email, first name, last name"}}
  - {"op": "add_node", "id": "REQ-009-045", "type": "Rule", "owner_fr": "FR-009", "title": "Acceptance creates the team member and marks invitation Accepted", "attrs": {"statement": "New Team Member sets password and accepts terms of service System creates the team member record (status Active) and links it to the provider organization with the assigned role. This is the first point at which the invitee becomes a team member System marks invitation as \"Accepted\""}}
  - {"op": "add_node", "id": "REQ-009-046", "type": "Rule", "owner_fr": "FR-009", "title": "Acceptance confirmation email to Owner and new member", "attrs": {"statement": "System sends confirmation email to both Provider Owner and new team member"}}
