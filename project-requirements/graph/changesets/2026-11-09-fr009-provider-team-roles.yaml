  - {"op": "add_node", "id": "REQ-009-030", "type": "Rule", "owner_fr": "FR-009", "title": "Notification, authentication and audit services used by team management", "attrs": {"statement": "S-03: Notification Service sends invitation and team-management emails with secure signup links Provider Auth Service (PR-01) handles team member account creation, login, password reset, and session management while enforcing PR-01/FR-031 permission checks S-06: Audit Log Service records all team management actions for compliance"}}
  - {"op": "add_node", "id": "REQ-009-031", "type": "Rule", "owner_fr": "FR-009", "title": "Owner role: single main account holder", "attrs": {"statement": "Owner (Main Account Holder): Single primary account per provider organization. Responsible for bank details and payouts, contract acceptance, and high-risk configuration. Mapped to the \"provider admin / main account holder\" described in the client transcription."}}
  - {"op": "add_node", "id": "REQ-009-032", "type": "Rule", "owner_fr": "FR-009", "title": "Manager role: clinic manager and operations", "attrs": {"statement": "Manager (Clinic Manager / Operations): Operational lead and front-of-staff representative. Can see and manage the full patient journey in the provider portal (inquiries, quotes, schedules, day-to-day operations), coordinate staff work, and manage most team settings, but cannot change bank details or assign/change the Owner role."}}
  - {"op": "add_node", "id": "REQ-009-033", "type": "Rule", "owner_fr": "FR-009", "title": "Clinical Staff role: medical staff", "attrs": {"statement": "Clinical Staff: Medical staff who perform procedures and aftercare (surgeons, clinicians, nurses). Focused on in-progress and aftercare sections, treatment documentation, scans, and medical notes. Default: limited or no access to billing or sensitive configuration (final per-feature permissions are configured centrally in FR-031 and may deviate from this default)."}}
  - {"op": "add_node", "id": "REQ-009-034", "type": "Rule", "owner_fr": "FR-009", "title": "Billing Staff role: finance-oriented staff", "attrs": {"statement": "Billing Staff: Finance-oriented staff who work with quotes and payouts (\"how much they're making\"). Can view and reconcile financial information but cannot alter clinical records or manage team structure or assign/change the Owner role."}}
  - {"op": "add_node", "id": "REQ-009-035", "type": "Rule", "owner_fr": "FR-009", "title": "Communication in scope: emails and in-platform notifications", "attrs": {"statement": "Email invitations to new team members with secure signup link Email notifications when team member role changes Email notifications when team member is removed or suspended In-platform notifications for team management events"}}
  - {"op": "add_node", "id": "REQ-009-036", "type": "Rule", "owner_fr": "FR-009", "title": "Communication out of scope: SMS, tutorials, team chat", "attrs": {"statement": "SMS notifications for team management (handled by S-03: Notification Service if needed; no SMS is sent in MVP and this channel is reserved for future phases) Video tutorials for team onboarding (handled by separate content module) Chat/messaging between team members (separate collaboration feature)"}}
  - {"op": "add_node", "id": "REQ-009-037", "type": "Rule", "owner_fr": "FR-009", "title": "Entry points to team management by actor", "attrs": {"statement": "Provider Owner: Accesses team management from provider dashboard main navigation (\"Team\" tab) Provider Manager: Accesses operational team management features from settings menu (within Owner-defined limits) New Team Member: Receives email invitation with signup link, creates account, automatically assigned to provider organization with specified role Admin Platform: System administrators access team management oversight from admin dashboard provider detail view"}}
  - {"op": "add_node", "id": "REQ-009-038", "type": "Rule", "owner_fr": "FR-009", "title": "Invite: non-Owner role selection, Owner never assignable", "attrs": {"statement": "Provider Owner enters team member details and selects a non-Owner system role or an active global custom provider role from FR-031. Owner is not assignable from this flow and is reserved for the single primary account holder."}}
