  - {"op": "add_node", "id": "ACT-provider-manager", "type": "Actor", "title": "Provider Manager", "attrs": {"group": "provider", "description": "Provider team member with the Manager role (clinic manager, operations)."}}
  - {"op": "add_node", "id": "ACT-provider-clinical-staff", "type": "Actor", "title": "Provider Clinical Staff", "attrs": {"group": "provider", "description": "Provider team member with the Clinical Staff role."}}
  - {"op": "add_node", "id": "ACT-provider-billing-staff", "type": "Actor", "title": "Provider Billing Staff", "attrs": {"group": "provider", "description": "Provider team member with the Billing Staff role."}}
  - {"op": "add_node", "id": "ACT-provider-custom-role", "type": "Actor", "title": "Provider Custom Role", "attrs": {"group": "provider", "description": "Provider team member holding a Super Admin-defined global custom provider role."}}
