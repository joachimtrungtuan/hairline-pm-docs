  - {"op": "add_node", "id": "REQ-009-059", "type": "Rule", "owner_fr": "FR-009", "title": "Role dialog: Owner record disabled with callout", "attrs": {"statement": "Owner records show disabled form with callout: \"Primary Owner role cannot be changed.\""}}
  - {"op": "add_node", "id": "REQ-009-060", "type": "Rule", "owner_fr": "FR-009", "title": "Role dialog: target roles include global custom roles; comparison uses current permissions", "attrs": {"statement": "Target roles include active global custom provider roles defined in FR-031. The comparison uses current permissions, not a fixed list for the four protected roles."}}
  - {"op": "add_node", "id": "REQ-009-061", "type": "Rule", "owner_fr": "FR-009", "title": "Cannot change own role", "attrs": {"statement": "Cannot change own role."}}
