  - {"op": "add_node", "id": "REQ-009-012", "type": "Rule", "owner_fr": "FR-009", "title": "System MUST maintain team member-to-provider organization relationships with role assignment per...", "attrs": {"statement": "System MUST maintain team member-to-provider organization relationships with role assignment per organization"}}
  - {"op": "add_node", "id": "REQ-009-013", "type": "Rule", "owner_fr": "FR-009", "title": "System MUST log all team management actions in audit trail with: timestamp, actor, action type,...", "attrs": {"statement": "System MUST log all team management actions in audit trail with: timestamp, actor, action type, target team member, old values, new values, IP address", "rationale": "Rule 4: All team management actions (invite, role change, removal) are logged in audit trail with timestamp, actor, and action details. System logs all actions in audit trail System logs role change in audit trail with timestamp, actor, old role, new role"}}
  - {"op": "add_node", "id": "REQ-009-014", "type": "Rule", "owner_fr": "FR-009", "title": "System MUST apply a team member's role change to their active sessions within 5 seconds without...", "attrs": {"statement": "System MUST apply a team member's role change to their active sessions within 5 seconds without forcing logout: the previous permissions stop applying, and the member's next request uses the refreshed permissions. System MUST invalidate all active sessions for a team member within 5 seconds of removal"}}
  - {"op": "add_node", "id": "REQ-009-015", "type": "Rule", "owner_fr": "FR-009", "title": "System MUST validate actor permissions before allowing any team management action (invite, role...", "attrs": {"statement": "System MUST validate actor permissions before allowing any team management action (invite, role change, removal)", "rationale": "System validates actor has permission to assign selected role System validates actor has permission to remove target team member"}}
