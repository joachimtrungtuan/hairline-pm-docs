  - {"op": "add_node", "id": "REQ-009-052", "type": "Rule", "owner_fr": "FR-009", "title": "Invite form: global email uniqueness and View member / Resend CTA", "attrs": {"statement": "Email uniqueness is global (global provider email identity rule, REQ-009-008). An email already on this team or pending here prompts the \"View member / Resend invitation\" CTA (B2). An email used by another provider organization (Owner, member, or pending invitation) shows the A3 blocking error; emails freed by a Deactivated provider can be invited."}}
  - {"op": "add_node", "id": "REQ-009-053", "type": "Rule", "owner_fr": "FR-009", "title": "B3: used invitation link shows message and login link", "attrs": {"statement": "System displays message: \"This invitation has already been used. Please log in with your existing credentials.\" System provides login link"}}
  - {"op": "add_node", "id": "REQ-009-054", "type": "Rule", "owner_fr": "FR-009", "title": "B4: failed send retries then stays Pending Send and holds a seat", "attrs": {"statement": "System logs error and retries up to 3 times with exponential backoff If all retries fail, the invitation stays Pending and the system sets its delivery state to \"Pending Send\". \"Pending Send\" is a delivery state, not an invitation status, and the invitation takes a seat while it is Pending (Rule 6) System displays warning to Provider Owner: \"Invitation created but email failed. We'll retry automatically.\" Background job retries sending every 10 minutes for 24 hours"}}
