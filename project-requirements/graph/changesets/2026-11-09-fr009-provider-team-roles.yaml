  - {"op": "add_node", "id": "REQ-009-070", "type": "Rule", "owner_fr": "FR-009", "title": "Removal: active work items reassigned to the selected member", "attrs": {"statement": "System reassigns all active work items to selected team member"}}
  - {"op": "add_node", "id": "REQ-009-071", "type": "Rule", "owner_fr": "FR-009", "title": "Removal: historical records archived for audit", "attrs": {"statement": "System archives team member's historical records (maintains for audit)"}}
  - {"op": "add_node", "id": "REQ-009-072", "type": "Rule", "owner_fr": "FR-009", "title": "Removal: email to the removed member", "attrs": {"statement": "System sends email to removed team member: \"Your access to [Provider Name] has been removed\""}}
  - {"op": "add_node", "id": "REQ-009-073", "type": "Rule", "owner_fr": "FR-009", "title": "Removal: audit entry with reason if provided", "attrs": {"statement": "System logs removal in audit trail with reason (if provided)"}}
  - {"op": "add_node", "id": "REQ-009-074", "type": "Rule", "owner_fr": "FR-009", "title": "Removed member's next login shows no-access message", "attrs": {"statement": "Removed team member's next login attempt shows: \"You no longer have access to this organization\""}}
  - {"op": "add_node", "id": "REQ-009-075", "type": "Rule", "owner_fr": "FR-009", "title": "A6: Owner cannot remove their own account", "attrs": {"statement": "System immediately blocks request with error: \"Owners cannot remove their own accounts.\" Error is logged in audit trail for compliance Outcome: Self-removal is blocked"}}
  - {"op": "add_node", "id": "REQ-009-076", "type": "Rule", "owner_fr": "FR-009", "title": "A7: removal without active work skips reassignment", "attrs": {"statement": "System detects no active work items System skips reassignment step Removal proceeds immediately after confirmation"}}
  - {"op": "add_node", "id": "REQ-009-077", "type": "Rule", "owner_fr": "FR-009", "title": "B6: active patient conversations rerouted with patient message", "attrs": {"statement": "System displays warning: \"This member has active patient conversations\" System prompts: \"New messages from patients will be routed to [reassigned team member]\" System updates message routing System sends automated message to patients: \"Your inquiry is now being handled by [new team member]\""}}
  - {"op": "add_node", "id": "REQ-009-078", "type": "Rule", "owner_fr": "FR-009", "title": "Edge: removal during quote submission completes it, then invalidates session", "attrs": {"statement": "System allows in-progress transaction to complete (quote submission succeeds). However, after submission completes, session is invalidated on next request. Team member sees: \"Your access has been removed. Please contact clinic owner.\""}}
  - {"op": "add_node", "id": "REQ-009-079", "type": "Rule", "owner_fr": "FR-009", "title": "Remove modal unavailable for Owners", "attrs": {"statement": "Modal unavailable for Owners; no provider-facing workflow can remove or suspend the primary Owner."}}
  - {"op": "add_node", "id": "REQ-009-080", "type": "Rule", "owner_fr": "FR-009", "title": "Remove modal: reassignment required when outstanding work exists", "attrs": {"statement": "Reassignment required when outstanding work exists; otherwise option to archive."}}
  - {"op": "add_node", "id": "REQ-009-081", "type": "Rule", "owner_fr": "FR-009", "title": "Remove modal: notifications to removed member and Owner plus audit event", "attrs": {"statement": "Removal triggers notifications to removed member and provider owner, plus audit event."}}
  - {"op": "add_node", "id": "REQ-009-082", "type": "Rule", "owner_fr": "FR-009", "title": "Suspensions use the removal modal with a different final state", "attrs": {"statement": "Suspensions use same modal with different final state."}}
  - {"op": "add_node", "id": "REQ-009-083", "type": "Rule", "owner_fr": "FR-009", "title": "Remove modal: removal reason required; session revocation locked on", "attrs": {"statement": "Screen 4 Removal Reason: Categorized reason + optional notes, required, predefined reasons. Session Revocation Toggle: Force logout all sessions, required, locked to true. Reassignment Dropdown: Select team member for outstanding work, required if outstanding work, filters by role compatibility."}}
  - {"op": "add_node", "id": "REQ-009-084", "type": "Rule", "owner_fr": "FR-009", "title": "Remove modal: bulk reassignment over 10 inquiries and transfer SLA", "attrs": {"statement": "Provide bulk reassignment for >10 inquiries (wizard launches Screen 5). Show SLA: \"Transfers must complete before confirming removal.\""}}
  - {"op": "add_node", "id": "REQ-009-085", "type": "Rule", "owner_fr": "FR-009", "title": "Task Transfer Wizard steps", "attrs": {"statement": "Select Workloads: Breakdown by entity type with counts (inquiries, quotes, appointments, messages). Assign Targets: Map each workload type to a target member (supports split assignments). Review & Confirm: Summary of transfers, notifications to recipients, and audit preview."}}
  - {"op": "add_node", "id": "REQ-009-086", "type": "Rule", "owner_fr": "FR-009", "title": "Task Transfer Wizard: auto-suggest, permission check, completion before removal", "attrs": {"statement": "Wizard auto-suggests targets based on role + current workload. Transfers blocked if target lacks required permissions; prompts to update role first. Completion required before removal modal allows final confirmation."}}
  - {"op": "add_node", "id": "REQ-009-087", "type": "Rule", "owner_fr": "FR-009", "title": "Dashboard access: Owners and authorized Manager-base users", "attrs": {"statement": "Only Owners and authorized Manager-base users can access the dashboard; non-Owner users have read-only visibility into Owner rows."}}
  - {"op": "add_node", "id": "REQ-009-088", "type": "Rule", "owner_fr": "FR-009", "title": "Owner rows show lock badge and no edit action", "attrs": {"statement": "Owner rows display lock badge with tooltip: \"Primary Owner role cannot be changed.\" Owner rows show lock badge on role field with tooltip: \"Primary Owner role cannot be changed.\""}}
  - {"op": "add_node", "id": "REQ-009-089", "type": "Rule", "owner_fr": "FR-009", "title": "Pending invitation rows offer Resend and Cancel", "attrs": {"statement": "Pending invitation rows (badge \"Invited\") show \"Resend Invitation\" and \"Cancel Invitation.\""}}
  - {"op": "add_node", "id": "REQ-009-090", "type": "Rule", "owner_fr": "FR-009", "title": "Suspended member rows offer Reactivate", "attrs": {"statement": "\"Suspended\" rows show \"Reactivate.\""}}
  - {"op": "add_node", "id": "REQ-009-091", "type": "Rule", "owner_fr": "FR-009", "title": "Current user's row highlighted with (You)", "attrs": {"statement": "Current logged-in user's row highlighted with \"(You).\""}}
  - {"op": "add_node", "id": "REQ-009-092", "type": "Rule", "owner_fr": "FR-009", "title": "Dashboard sorting: Owners first, then roles alphabetically", "attrs": {"statement": "Sorting: Owners (locked) first, then other roles alphabetically."}}
  - {"op": "add_node", "id": "REQ-009-093", "type": "Rule", "owner_fr": "FR-009", "title": "Dashboard search and filter by name, email, role, status", "attrs": {"statement": "Search/filter by name, email, role, status."}}
  - {"op": "add_node", "id": "REQ-009-094", "type": "Rule", "owner_fr": "FR-009", "title": "Team-size banner with Request More Seats support case", "attrs": {"statement": "Banner surfaces central team-size policy and provides link to \"Request More Seats\", which opens an FR-034 support case pre-filled as a seat-increase request; the admin applies an approved increase by editing Seat Limit in FR-015 Screen 3 Tab 1."}}
  - {"op": "add_node", "id": "REQ-009-095", "type": "Rule", "owner_fr": "FR-009", "title": "Team size meter turns amber at 90 percent and red at 100 percent", "attrs": {"statement": "Screen 1 Team Size Meter: Progress bar of seat usage vs centrally approved limit. Turns amber at 90%, red at 100%."}}
  - {"op": "add_node", "id": "REQ-009-096", "type": "Rule", "owner_fr": "FR-009", "title": "Dashboard pagination for more than 50 members", "attrs": {"statement": "Pagination/infinite scroll for >50 members."}}
  - {"op": "add_node", "id": "REQ-009-097", "type": "Rule", "owner_fr": "FR-009", "title": "Dashboard quick stats", "attrs": {"statement": "Quick stats: Total, Active, Pending Invitations (count of invitations with status Pending), Suspended, Seats Remaining."}}
  - {"op": "add_node", "id": "REQ-009-098", "type": "Rule", "owner_fr": "FR-009", "title": "Dashboard CSV export for audit", "attrs": {"statement": "CSV export for audit."}}
  - {"op": "add_node", "id": "REQ-009-099", "type": "Rule", "owner_fr": "FR-009", "title": "Workload summary counts per member", "attrs": {"statement": "Current Workload Summary: Active inquiries (count), Draft quotes (count), Upcoming appointments (count), Unread messages (count). Screen 1 Workload Summary: Counts of inquiries/quotes assigned."}}
  - {"op": "add_node", "id": "REQ-009-100", "type": "Rule", "owner_fr": "FR-009", "title": "Invite form: role dropdown with permission summary, Owner disabled", "attrs": {"statement": "Role dropdown includes inline permission summary from FR-031's current matrix; Owner option is always disabled in this screen and annotated: \"Primary Owner cannot be set or changed from this screen.\""}}
  - {"op": "add_node", "id": "REQ-009-101", "type": "Rule", "owner_fr": "FR-009", "title": "Invite form blocked at the seat limit; CTA Request more seats", "attrs": {"statement": "Form blocked when seat limit reached; CTA changes to \"Request more seats\", which opens an FR-034 support case pre-filled as a seat-increase request (FR-015 Rule 7); the admin edits Seat Limit in FR-015 Screen 3 Tab 1."}}
  - {"op": "add_node", "id": "REQ-009-102", "type": "Rule", "owner_fr": "FR-009", "title": "Invite form future items: photo upload, CSV bulk invite, draft invitations", "attrs": {"statement": "Optional profile photo upload (future). CSV bulk invite (future). Draft invitations backlog (future)."}}
  - {"op": "add_node", "id": "REQ-009-103", "type": "Rule", "owner_fr": "FR-009", "title": "Member detail page access: Owners and Admins only", "attrs": {"statement": "Access Control: Accessible by Owners and Admins only. Team members cannot view other members' detail pages (except their own profile in account settings)."}}
  - {"op": "add_node", "id": "REQ-009-104", "type": "Rule", "owner_fr": "FR-009", "title": "Edit Role action only for permitted actors", "attrs": {"statement": "\"Edit Role\" action only available if actor has permission (Owners can edit all non-Owners; Admins cannot edit Owners)."}}
  - {"op": "add_node", "id": "REQ-009-105", "type": "Rule", "owner_fr": "FR-009", "title": "Remove Member action shows impact summary", "attrs": {"statement": "\"Remove Member\" action shows confirmation with impact summary (pulls data from Screen 4)."}}
  - {"op": "add_node", "id": "REQ-009-106", "type": "Rule", "owner_fr": "FR-009", "title": "Own detail page hides Remove Member and Edit Role", "attrs": {"statement": "If viewing own detail page, \"Remove Member\" and \"Edit Role\" actions are hidden (cannot self-modify)."}}
  - {"op": "add_node", "id": "REQ-009-107", "type": "Rule", "owner_fr": "FR-009", "title": "Suspended member shows reactivate banner", "attrs": {"statement": "Suspended members show banner: \"This member is suspended. Reactivate to restore access.\""}}
  - {"op": "add_node", "id": "REQ-009-108", "type": "Rule", "owner_fr": "FR-009", "title": "Pending invitation detail shows limited data", "attrs": {"statement": "A pending invitation (badge \"Invited\") is not yet a team member and shows limited data: only the Overview tab with invitation status and \"Resend Invitation\" / \"Cancel Invitation\" actions."}}
  - {"op": "add_node", "id": "REQ-009-109", "type": "Rule", "owner_fr": "FR-009", "title": "Department editable by Owner or Admin; phone number masked", "attrs": {"statement": "Screen 6 Department/Specialty: Optional organizational label (e.g., Surgeon, Reception), max 50 chars; editable by Owner/Admin. Phone Number: Contact phone (if provided during setup), masked for privacy."}}
  - {"op": "add_node", "id": "REQ-009-110", "type": "Rule", "owner_fr": "FR-009", "title": "Provider activity log defaults to the last 30 days", "attrs": {"statement": "Screen 6 Activity Log Date Range Filter: Filter by start/end date, defaults to last 30 days. Action Type Filter categories: Login, Inquiry, Quote, Treatment, Patient Communication, Settings."}}
  - {"op": "add_node", "id": "REQ-009-111", "type": "Rule", "owner_fr": "FR-009", "title": "Assigned Work bulk reassign opens the Task Transfer Wizard", "attrs": {"statement": "Screen 6 Tab 3 Assigned Work: Inquiries, Quotes, Appointments, Messages sub-tabs with counts. Bulk Reassign: Select multiple items and reassign to another member; opens Screen 5 (Task Transfer Wizard)."}}
  - {"op": "add_node", "id": "REQ-009-112", "type": "Rule", "owner_fr": "FR-009", "title": "Invitation landing content and call to action", "attrs": {"statement": "Provider branding (name, logo), role summary, invitation expiry countdown. CTA: \"Accept & Create Account\" (new user) with secondary link \"Already have an account with this provider? Log in to continue.\" Security notice referencing central policies (strong password requirements, audit logging; MFA to be introduced in a future release—see Future Improvements: MFA/2FA)."}}
  - {"op": "add_node", "id": "REQ-009-113", "type": "Rule", "owner_fr": "FR-009", "title": "Account setup field validation", "attrs": {"statement": "Screen 8 Account Setup: Email pre-filled from invitation, locked, must match invitation token. First Name and Last Name required, 2-50 characters, letters/spaces/hyphen. Phone Number required, E.164 format, uniqueness per user within provider, must be verified via one-time code where possible. Password required, must satisfy FR-026 policy (length + complexity). Confirm Password must match Password. Accept Terms required, must be checked before submission."}}
  - {"op": "add_node", "id": "REQ-009-114", "type": "Rule", "owner_fr": "FR-009", "title": "Password setup must succeed before activation", "attrs": {"statement": "Password setup must succeed before account is activated."}}
  - {"op": "add_node", "id": "REQ-009-115", "type": "Rule", "owner_fr": "FR-009", "title": "Existing Hairline account switches to login-only acceptance", "attrs": {"statement": "If invitee already has global Hairline account, screen switches to login-only acceptance flow."}}
  - {"op": "add_node", "id": "REQ-009-116", "type": "Rule", "owner_fr": "FR-009", "title": "First-login permission tour must be acknowledged and is logged", "attrs": {"statement": "Tour must be acknowledged before hitting dashboard. Logs acceptance in audit trail."}}
  - {"op": "add_node", "id": "REQ-009-117", "type": "Rule", "owner_fr": "FR-009", "title": "Admin directory row actions and permissions", "attrs": {"statement": "Screen 10 Actions: Force suspend, reset invitation, view audit log, impersonate. Buttons enabled based on admin permissions; Impersonate is Super Admin only and follows the FR-015 Login as Provider rules."}}
  - {"op": "add_node", "id": "REQ-009-118", "type": "Rule", "owner_fr": "FR-009", "title": "Admin member detail access: platform administrators only", "attrs": {"statement": "Access Control: Accessible by platform administrators only. Supports a Super Admin-only impersonation session for support and troubleshooting, governed by the FR-015 \"Login as Provider\" rules (limited write; see Business Rules below)."}}
  - {"op": "add_node", "id": "REQ-009-119", "type": "Rule", "owner_fr": "FR-009", "title": "Flagged status when a compliance alert exists; inactivity highlight", "attrs": {"statement": "Screen 11 Status Indicator: Active / Suspended / Flagged for team members; Flagged shown if compliance alert exists. Last Active: highlight if >30 days inactive."}}
  - {"op": "add_node", "id": "REQ-009-120", "type": "Rule", "owner_fr": "FR-009", "title": "Admin-only account notes, audit-logged on every edit", "attrs": {"statement": "Screen 11 Account Notes (Admin-Only): Internal admin notes not visible to provider or member, max 2000 chars, audit-logged on every edit."}}
  - {"op": "add_node", "id": "REQ-009-121", "type": "Rule", "owner_fr": "FR-009", "title": "Admin phone reveal needs re-authentication", "attrs": {"statement": "Screen 11 Phone Number: Masked; admin can reveal with MFA (future enhancement; initially standard re-auth only)."}}
  - {"op": "add_node", "id": "REQ-009-122", "type": "Rule", "owner_fr": "FR-009", "title": "Admin audit log defaults to 90 days, up to 2 years, 100 events per page", "attrs": {"statement": "Screen 11 Tab 2 Date Range Filter: Defaults to last 90 days; can query up to 2 years. Pagination: Server-side pagination, 100 events per page. Action Type Filter categories: Login, Patient Access, Data Export, Settings Change, Communication, Treatment."}}
  - {"op": "add_node", "id": "REQ-009-123", "type": "Rule", "owner_fr": "FR-009", "title": "Audit risk level auto-classified High, Medium or Low", "attrs": {"statement": "Screen 11 Tab 2 Risk Level Filter: Filter by risk classification (High, Medium, Low), auto-classified by system."}}
  - {"op": "add_node", "id": "REQ-009-124", "type": "Rule", "owner_fr": "FR-009", "title": "IP tracking shows all IPs with geolocation and flags VPN or proxy", "attrs": {"statement": "Screen 11 Tab 2 IP Address Tracking: Full IP history with geolocation; shows all IPs used; flags VPN/proxy usage."}}
  - {"op": "add_node", "id": "REQ-009-125", "type": "Rule", "owner_fr": "FR-009", "title": "Full audit export in CSV or JSON needs strong re-authentication", "attrs": {"statement": "Screen 11 Tab 2 Export Full Audit: Download complete audit trail, CSV/JSON format, includes all fields, requires strong re-authentication (MFA in future release)."}}
  - {"op": "add_node", "id": "REQ-009-126", "type": "Rule", "owner_fr": "FR-009", "title": "Flag for Investigation creates a case in FR-031", "attrs": {"statement": "Screen 11 Tab 2 Flag for Investigation: Mark activity for compliance review; creates investigation case in FR-031."}}
  - {"op": "add_node", "id": "REQ-009-127", "type": "Rule", "owner_fr": "FR-009", "title": "Admins view assigned work during investigations", "attrs": {"statement": "Admins can view assigned work to understand team member's current responsibilities during investigations All work items link to relevant patient/inquiry/quote records with proper permissions Work item access respects admin permissions defined in FR-031 (Admin Access Control) Provides context for questions like: \"Why did this member access Patient X's data?\" → Check if Patient X is in their assigned work"}}
  - {"op": "add_node", "id": "REQ-009-128", "type": "Rule", "owner_fr": "FR-009", "title": "Overdue work highlighted past SLA", "attrs": {"statement": "\"Overdue\" status highlights items past SLA deadlines, supporting compliance reviews"}}
  - {"op": "add_node", "id": "REQ-009-129", "type": "Rule", "owner_fr": "FR-009", "title": "Admin bulk reassign for emergencies, may override provider restrictions", "attrs": {"statement": "Bulk reassign available for emergency situations (e.g., team member suspended, provider transition)"}}
  - {"op": "add_node", "id": "REQ-009-130", "type": "Rule", "owner_fr": "FR-009", "title": "Admin workload metrics: total items, overdue count, average response time", "attrs": {"statement": "Screen 11 Tab 3 Workload Metrics: Summary stats: Total items, Overdue count, Avg response time. Filter by Priority: Auto-calculated based on SLA deadlines."}}
  - {"op": "add_node", "id": "REQ-009-131", "type": "Rule", "owner_fr": "FR-009", "title": "Screen 11 Tabs 4 and 5 deferred", "attrs": {"statement": "Screen 11 Tab 4 (Security & Sessions) and Tab 5 (Provider Relationship): Implementation of these tabs is deferred for a later improvement phase and is not required for the current build."}}
  - {"op": "add_node", "id": "REQ-009-132", "type": "Rule", "owner_fr": "FR-009", "title": "Admin actions need strong re-authentication", "attrs": {"statement": "All admin actions (suspend, password reset, session logout, etc.) require strong re-authentication before execution; MFA-based re-authentication is planned as a future improvement and is not part of the initial FR-009 scope."}}
  - {"op": "add_node", "id": "REQ-009-133", "type": "Rule", "owner_fr": "FR-009", "title": "Every admin action logs a high-priority entry with required justification", "attrs": {"statement": "Every admin action generates high-priority audit log entry with justification field (required)."}}
  - {"op": "add_node", "id": "REQ-009-134", "type": "Rule", "owner_fr": "FR-009", "title": "Patient data access log: anonymized after 1 year, deleted after 2", "attrs": {"statement": "Patient data access log obeys data retention policies: anonymized after 1 year, deleted after 2 years (unless part of active investigation)."}}
  - {"op": "add_node", "id": "REQ-009-135", "type": "Rule", "owner_fr": "FR-009", "title": "Compliance flags notify the compliance team", "attrs": {"statement": "Compliance flags automatically trigger notification to admin compliance team via FR-020."}}
  - {"op": "add_node", "id": "REQ-009-136", "type": "Rule", "owner_fr": "FR-009", "title": "Admins see full IP addresses", "attrs": {"statement": "IP addresses shown in full for admins (not anonymized) to support security investigations."}}
  - {"op": "add_node", "id": "REQ-009-137", "type": "Rule", "owner_fr": "FR-009", "title": "Activity export records who exported, when, for what case", "attrs": {"statement": "Activity log export includes admin metadata (who exported, when, for what case) for chain of custody."}}
  - {"op": "add_node", "id": "REQ-009-138", "type": "Rule", "owner_fr": "FR-009", "title": "Compare Members is a future enhancement", "attrs": {"statement": "Supports \"Compare Members\" feature: select multiple members and compare activity patterns side-by-side (future enhancement)."}}
  - {"op": "add_node", "id": "REQ-009-139", "type": "Rule", "owner_fr": "FR-009", "title": "Admin single-provider team: view and invite permission", "attrs": {"statement": "Access Control: Platform administrators. Viewing follows admin access to the provider profile; the Invite Staff Member action requires the FR-031 \"Edit Providers\" permission. Impersonate remains Super Admin only."}}
  - {"op": "add_node", "id": "REQ-009-140", "type": "Rule", "owner_fr": "FR-009", "title": "Admin single-provider list shows only that provider", "attrs": {"statement": "The list shows only the selected provider's members and pending invitations; no cross-provider data appears in this view."}}
  - {"op": "add_node", "id": "REQ-009-141", "type": "Rule", "owner_fr": "FR-009", "title": "Admin invitations use the normal invitation flow", "attrs": {"statement": "Admin invitations use the normal FR-009 invitation flow: same invitation email, acceptance flow (Screens 7-9), token rules, and expiry (REQ-009-016), and the same per-provider invitation rate limit (REQ-009-018)."}}
  - {"op": "add_node", "id": "REQ-009-142", "type": "Rule", "owner_fr": "FR-009", "title": "Admins cannot assign Owner in the admin invite form", "attrs": {"statement": "Admins cannot assign the Owner role here. Ownership transfer stays in FR-009's existing Owner flow."}}
  - {"op": "add_node", "id": "REQ-009-143", "type": "Rule", "owner_fr": "FR-009", "title": "Admin invite blocked at the provider's seat limit", "attrs": {"statement": "Invite is blocked when the provider's Seat Limit (FR-015) is reached, with message: \"This provider has reached its seat limit. Increase the Seat Limit in Tab 1 before inviting.\""}}
  - {"op": "add_node", "id": "REQ-009-144", "type": "Rule", "owner_fr": "FR-009", "title": "Admin invite blocked while provider Suspended or Deactivated", "attrs": {"statement": "Invite is blocked when the provider status is Suspended or Deactivated, with message: \"Invitations are unavailable while this provider is [Status].\""}}
  - {"op": "add_node", "id": "REQ-009-145", "type": "Rule", "owner_fr": "FR-009", "title": "Existing admin row actions remain available", "attrs": {"statement": "Existing admin actions (force suspend, reset invitation, view audit log, impersonate) remain available from each row."}}
  - {"op": "add_node", "id": "REQ-009-146", "type": "Rule", "owner_fr": "FR-009", "title": "Exactly one Owner at all times", "attrs": {"statement": "Rule 1: Every provider organization must have exactly one Owner at all times (single primary account holder)."}}
  - {"op": "add_node", "id": "REQ-009-147", "type": "Rule", "owner_fr": "FR-009", "title": "Owner role cannot be created, changed or demoted in the provider UI", "attrs": {"statement": "Rule 2: Owner role assignments cannot be created, changed, or demoted through the provider platform UI."}}
  - {"op": "add_node", "id": "REQ-009-148", "type": "Rule", "owner_fr": "FR-009", "title": "Seat limit, seat usage counting and invitation blocking", "attrs": {"statement": "Rule 6: Maximum team size per provider organization defaults to 100 members and is configured by admins per FR-015. Seat usage counts non-Owner team members with status Active or Suspended plus invitations with status Pending that are not past expires_at, and each person is counted once. The Owner, Removed members, and Expired, Cancelled, or Accepted invitations do not count. A Suspended member keeps the seat; only removal frees it. Providers can request limit increases through support per FR-015; invitations must be blocked when seat usage reaches the limit."}}
  - {"op": "add_node", "id": "REQ-009-149", "type": "Rule", "owner_fr": "FR-009", "title": "Super Admin-defined custom roles assignable to non-Owner staff", "attrs": {"statement": "Rule 8: Super Admin-defined global custom provider roles are assignable to non-Owner staff. Their Manager, Clinical Staff, or Billing Staff base type preserves eligibility for existing role-limited actions; an explicit permission grant is also required. Custom roles never satisfy the primary Owner requirement or gain Owner-only actions.", "rationale": "Custom Provider Role: A Super Admin-defined role based on Manager, Clinical Staff, or Billing Staff. Its explicit permission grants determine access within the selected base type's protected-action limits. It cannot be based on Owner or replace the primary Owner."}}
  - {"op": "add_node", "id": "REQ-009-150", "type": "Rule", "owner_fr": "FR-009", "title": "Invitation is not a team member until accepted", "attrs": {"statement": "An invited person exists only as an invitation (Pending, Accepted, Expired, Cancelled) until they accept. A team member record is created only when the invitation is accepted."}}
  - {"op": "add_node", "id": "REQ-009-151", "type": "Rule", "owner_fr": "FR-009", "title": "Team member statuses Active, Suspended, Removed; Removed takes no seat", "attrs": {"statement": "Team member statuses are Active, Suspended, and Removed, stored as `active`, `suspended`, and `inactive` (`inactive` means Removed and is kept for compatibility). A Removed member never takes a seat. \"Invited\" is only the badge that team lists show for a Pending invitation row; it is not a team member status."}}
  - {"op": "add_node", "id": "REQ-009-152", "type": "Rule", "owner_fr": "FR-009", "title": "Legacy invitee rows migrated into invitations", "attrs": {"statement": "Legacy invitees that the old invite flow stored as team member rows (status `inactive` or `pending`, never accepted and no password set) are migrated into invitations: Pending if their invite or activation link has not expired, otherwise Expired. The placeholder member row is then deleted, so after migration `inactive` means Removed only (CR-FR009-20261028-01)."}}
  - {"op": "add_node", "id": "REQ-009-153", "type": "Rule", "owner_fr": "FR-009", "title": "Suspended provider: team management is view-only", "attrs": {"statement": "Rule 10 (Suspended Provider Team Management): While the provider organization is Suspended (FR-015; banner per FR-032 Rule 6), the provider Team page and team member detail pages are view-only. Provider users cannot invite, resend or cancel an invitation, change a role, suspend, reactivate, or remove a member. The Team page shows \"Your account is suspended. Team changes are unavailable. Please contact support.\" Admin invitations to a Suspended or Deactivated provider are blocked by REQ-009-024.", "rationale": "While the provider organization is Suspended, the dashboard is view-only (Rule 10): invite, resend, cancel invitation, role change, suspend, reactivate, and remove actions are unavailable, and the page shows \"Your account is suspended. Team changes are unavailable. Please contact support.\" Form unavailable while the provider organization is Suspended (Team page view-only, Rule 10); admin invitations are blocked separately (Screen 12, REQ-009-024)."}}
  - {"op": "add_node", "id": "REQ-009-154", "type": "Rule", "owner_fr": "FR-009", "title": "Team member emails visible only within their organization", "attrs": {"statement": "Privacy Rule 1: Team member email addresses are visible only within their own provider organization"}}
  - {"op": "add_node", "id": "REQ-009-155", "type": "Rule", "owner_fr": "FR-009", "title": "Team member activity logs limited to Owners and Admins of the organization", "attrs": {"statement": "Privacy Rule 2: Team member activity logs are accessible only to Owners and Admins within same organization"}}
  - {"op": "add_node", "id": "REQ-009-156", "type": "Rule", "owner_fr": "FR-009", "title": "IP addresses in activity logs retained in full", "attrs": {"statement": "Privacy Rule 3: IP addresses in team member activity logs are retained in full for security and compliance investigations, subject to the global audit log retention and access rules defined in the Constitution", "rationale": "Activity log respects privacy rules and the global audit retention policy; IP addresses remain visible in full to authorized admins for the duration of the retention period."}}
  - {"op": "add_node", "id": "REQ-009-157", "type": "Rule", "owner_fr": "FR-009", "title": "Removed members' records archived, visible to Owners and platform admins", "attrs": {"statement": "Privacy Rule 4: Removed team members' historical records are archived (not deleted) for compliance—visible only to Owners and platform admins"}}
  - {"op": "add_node", "id": "REQ-009-158", "type": "Rule", "owner_fr": "FR-009", "title": "All access to team member data is logged", "attrs": {"statement": "Audit Rule: All access to team member data must be logged with timestamp, accessing user, and action performed"}}
  - {"op": "add_node", "id": "REQ-009-159", "type": "Rule", "owner_fr": "FR-009", "title": "Team members may request personal data export and account deletion", "attrs": {"statement": "GDPR Compliance: Team members can request data export (personal data only) and account deletion (marks as deleted, archives for compliance period)"}}
  - {"op": "add_node", "id": "REQ-009-160", "type": "Rule", "owner_fr": "FR-009", "title": "Admin-editable limits: team size, invitation expiry, log retention", "attrs": {"statement": "Maximum team size limit per provider (default 100, adjustable 1-500) Invitation expiry period (default 7 days, range 1-30 days) Activity log retention period (default 2 years, minimum 1 year for compliance)"}}
  - {"op": "add_node", "id": "REQ-009-161", "type": "Rule", "owner_fr": "FR-009", "title": "Admin force-suspend of a team member for terms violations", "attrs": {"statement": "Force-suspend individual team member accounts for terms violations"}}
  - {"op": "add_node", "id": "REQ-009-162", "type": "Rule", "owner_fr": "FR-009", "title": "Admin force-remove in emergencies bypasses the Owner-only rule", "attrs": {"statement": "Force-remove team member in emergency situations (bypasses Owner-only rule)"}}
  - {"op": "add_node", "id": "REQ-009-163", "type": "Rule", "owner_fr": "FR-009", "title": "Fixed in codebase: protected roles, one Owner minimum, audit structure, template structure, session security", "attrs": {"statement": "Protected role identities and primary Owner rule. Custom role base type and permissions are configured centrally in FR-031, not by provider organizations. Minimum number of Owners required (always 1) Audit log structure and required fields Email invitation template structure (content editable, structure fixed) Session management security parameters"}}
  - {"op": "add_node", "id": "REQ-009-164", "type": "Rule", "owner_fr": "FR-009", "title": "Admin cannot modify a provider's team without consent except Screens 10-12 actions", "attrs": {"statement": "Admin can view any provider's team structure but cannot modify it without provider consent (audit trail logged), except the admin actions defined in Screens 10-12 (including inviting staff via Screen 12 and actions taken during a Super Admin impersonation session)"}}
  - {"op": "add_node", "id": "REQ-009-165", "type": "Rule", "owner_fr": "FR-009", "title": "Admins may suspend team members but cannot delete accounts", "attrs": {"statement": "Admin can suspend team members but cannot delete accounts (compliance requirement)"}}
  - {"op": "add_node", "id": "REQ-009-166", "type": "Rule", "owner_fr": "FR-009", "title": "Provider subscription billing may later factor in team size", "attrs": {"statement": "Payment & Billing Rules: Not applicable to this module; team management itself has no direct payment flows. Provider subscription billing (future) may factor in team size."}}
  - {"op": "add_node", "id": "REQ-009-167", "type": "Rule", "owner_fr": "FR-009", "title": "MFA and device re-authentication deferred and non-blocking", "attrs": {"statement": "MFA enrollment during team member account setup (Screen 8): phone number capture for MFA, MFA factor selection, and enforcement that \"password + MFA\" must succeed before activation. MFA-gated actions in Screen 11 (Admin Team Member Detail): export full audit requiring MFA, session actions requiring MFA re-auth, MFA Status and MFA Reset controls, and admin-force removal/reset flows that currently mention MFA. Device-level MFA concepts such as \"Linked Devices\" are documented as placeholders only. Where this PRD currently mentions \"re-authentication\" for high-privilege actions, the initial implementation will rely on password-based re-auth only. Upgrading these flows to MFA-backed re-auth is a future enhancement aligned with the platform-wide MFA rollout. Implementation teams MUST treat the above as non-blocking, non-MVP requirements for FR-009 and track them against the corresponding security/MFA epics instead of this feature’s delivery scope."}}
  - {"op": "add_node", "id": "REQ-009-168", "type": "Rule", "owner_fr": "FR-009", "title": "Edge: bounced invitation logged and Owner notified in-platform", "attrs": {"statement": "System logs bounce event, marks invitation status as \"Bounced\", and notifies provider owner via in-app notification: \"Invitation to [email] failed—email address may be invalid. Please verify and resend.\""}}
  - {"op": "add_node", "id": "REQ-009-169", "type": "Rule", "owner_fr": "FR-009", "title": "Edge: invitation rate limit message", "attrs": {"statement": "System enforces rate limit: maximum 10 invitations per hour per provider organization. If limit exceeded, display error: \"You've reached the invitation limit (10 per hour). Please try again later.\" This prevents abuse and email service quota exhaustion."}}
  - {"op": "add_node", "id": "REQ-009-170", "type": "Rule", "owner_fr": "FR-009", "title": "Edge: invitation link and account creation are responsive", "attrs": {"statement": "Invitation link and account creation flow are fully responsive—works on any device. After account creation, mobile user is prompted to \"Download Mobile App\" (if patient platform) or \"Bookmark this page\" (if provider web app)."}}
  - {"op": "add_node", "id": "REQ-009-171", "type": "Rule", "owner_fr": "FR-009", "title": "Edge: optimistic locking on concurrent role change", "attrs": {"statement": "Optimistic locking: last write wins. First admin's change is applied. Second admin's attempt returns conflict error: \"This team member's role was recently changed by [Admin Name]. Please refresh and try again.\""}}
  - {"op": "add_node", "id": "REQ-009-172", "type": "Rule", "owner_fr": "FR-009", "title": "Treatment documentation limited to Clinical Staff and, where appropriate, the Owner", "attrs": {"statement": "Integration point: Treatment workflow checks team member role before allowing procedure documentation (only Clinical Staff and, where appropriate, the Owner can act as documenting providers)"}}
  - {"op": "add_node", "id": "REQ-009-173", "type": "Rule", "owner_fr": "FR-009", "title": "IP location is optional: show the IP address alone when geolocation is unavailable", "attrs": {"statement": "Failure handling: Graceful degradation—if service unavailable, show IP address without location"}}
  # --- Actors (shared, provider group, owned by no FR)
