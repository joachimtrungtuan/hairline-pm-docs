  - {"op": "add_node", "id": "REQ-009-049", "type": "Rule", "owner_fr": "FR-009", "title": "A3: email already in another provider team blocks the invitation", "attrs": {"statement": "Trigger: Invitee email address already belongs to another provider organization as Owner, team member, or pending invitation (global provider email identity rule, REQ-009-008). Memberships and pending invitations of a Deactivated provider (FR-015) do not count System displays blocking error: \"This email already belongs to another provider team. Remove the member from their current provider or invite them with a different email.\" Outcome: Cross-provider duplication prevented; invitee must first be removed from their current provider team before they can be invited here"}}
