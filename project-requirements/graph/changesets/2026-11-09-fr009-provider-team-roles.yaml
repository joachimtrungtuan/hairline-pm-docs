  - {"op": "add_node", "id": "REQ-009-002", "type": "Rule", "owner_fr": "FR-009", "title": "System MUST support the four protected provider roles (Owner, Manager, Clinical Staff, Billing...", "attrs": {"statement": "System MUST support the four protected provider roles (Owner, Manager, Clinical Staff, Billing Staff) and global custom provider roles defined in FR-031; a custom role MUST have a non-Owner base type and be assignable only to non-Owner staff", "rationale": "The provider platform starts with four protected clinic-side roles that directly reflect how real clinics operate, while keeping clear separation from Hairline's own Admin Platform roles. Super Admins may also define global custom provider roles in FR-031; provider organizations can assign them to non-Owner staff but cannot change their definitions. Custom Provider Role: A Super Admin-defined role based on Manager, Clinical Staff, or Billing Staff. Its explicit permission grants determine access within the selected base type's protected-action limits. It cannot be based on Owner or replace the primary Owner."}}
