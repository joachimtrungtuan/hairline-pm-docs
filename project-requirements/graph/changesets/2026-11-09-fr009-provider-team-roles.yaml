  - {"op": "add_node", "id": "REQ-009-023", "type": "Rule", "owner_fr": "FR-009", "title": "System MUST restrict admin impersonation of a provider team member to Super Admins and apply the...", "attrs": {"statement": "System MUST restrict admin impersonation of a provider team member to Super Admins and apply the FR-015 \"Login as Provider\" rules: reason (min 20 chars) and password re-authentication before start, persistent banner with End Session, write actions allowed except changing the user's password, login email, or payout/bank/financial settings, session start/end and every write action logged and attributed to the admin, and automatic end after 30 minutes of inactivity. Impersonation MUST be blocked when the provider is Deactivated and MUST be read-only under FR-032 Rule 6 when the provider is Suspended", "rationale": "Impersonation is blocked when the provider is Deactivated (\"Login as Provider is not available for a deactivated provider.\"). When the provider is Suspended, the session is read-only under FR-032 Rule 6, the same as for the user. Super Admin only. Before starting, the admin enters a reason (min 20 chars) and re-authenticates with password (MFA re-authentication is a future enhancement tied to the platform-wide MFA rollout). The impersonated session shows a persistent banner: \"You are viewing as [Name] — admin session by [Admin Name]\" with an \"End Session\" action. The admin may act on the impersonated user's behalf, except changing that user's password or login email, or changing payout/bank or financial settings; those actions are blocked during the session. Session start (with reason), session end, and every write action performed during the session are logged in the FR-009 audit trail and FR-015 Tab 8: Activity Log, attributed to the admin acting as the user. The session ends automatically after the standard 30-minute admin inactivity timeout."}}
  - {"op": "add_node", "id": "REQ-009-024", "type": "Rule", "owner_fr": "FR-009", "title": "System MUST let admins with the FR-031 \"Edit Providers\" permission invite staff to a single...", "attrs": {"statement": "System MUST let admins with the FR-031 \"Edit Providers\" permission invite staff to a single provider from FR-009 Screen 12 (FR-015 Screen 3, Tab 3) using the normal invitation flow and expiry, assigning only a non-Owner role available to that provider, and blocking the invite when the provider's Seat Limit is reached or the provider is Suspended or Deactivated", "rationale": "Invite staff to a single provider with a non-Owner role (Screen 12; requires FR-031 \"Edit Providers\")"}}
  - {"op": "add_node", "id": "REQ-009-025", "type": "Rule", "owner_fr": "FR-009", "title": "System MUST log each admin-initiated invitation in the FR-009 audit trail and FR-015 Tab 8:...", "attrs": {"statement": "System MUST log each admin-initiated invitation in the FR-009 audit trail and FR-015 Tab 8: Activity Log with the inviting admin as actor", "rationale": "Each admin invitation is logged in the FR-009 audit trail and in FR-015 Tab 8: Activity Log, recording the inviting admin as the actor."}}
