  - {"op": "add_node", "id": "STP-001-136", "type": "Step", "owner_fr": "FR-001", "title": "System keeps a Suspended patient without a session and shows the neutral contact-support message", "attrs": {"prd_ref": "Alternative Flow C4"}}
  - {"op": "add_node", "id": "STP-001-137", "type": "Step", "owner_fr": "FR-001", "title": "System sets a Locked account to Active after the reset", "attrs": {"prd_ref": "Alternative Flow C4"}}
  - {"op": "add_node", "id": "STP-001-138", "type": "Step", "owner_fr": "FR-001", "title": "System shows the neutral check-your-email result and emails the existing owner that an account already exists", "attrs": {"prd_ref": "Screen 4 Business Rules"}}
  - {"op": "add_node", "id": "STP-001-139", "type": "Step", "owner_fr": "FR-001", "title": "System replaces the old unverified record with the new registration and sends a new code", "attrs": {"prd_ref": "Screen 4 Business Rules"}}
  - {"op": "add_node", "id": "STP-001-140", "type": "Step", "owner_fr": "FR-001", "title": "System shows a patient without the general consent the consent prompt after login", "attrs": {"prd_ref": "Workflow 2 step 3, Screen 9 Business Rules", "handoff_to": "FR-027: STP-027-010, patient is shown the legal documents requiring acceptance (REQ-027-062)"}}
  - {"op": "add_node", "id": "STP-001-141", "type": "Step", "owner_fr": "FR-001", "title": "System sends the 6-digit code to the new email address and keeps the old email as the login email until it is confirmed", "attrs": {"prd_ref": "Screen 14 Business Rules"}}
  - {"op": "add_node", "id": "STP-001-142", "type": "Step", "owner_fr": "FR-001", "title": "Patient confirms the code; the new address becomes the login email and the old address gets a notice", "attrs": {"prd_ref": "Screen 14 Business Rules"}}
