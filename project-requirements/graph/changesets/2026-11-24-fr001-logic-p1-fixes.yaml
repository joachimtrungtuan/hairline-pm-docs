  - {"op": "update_node", "id": "REQ-001-025", "title": "Admin can edit all patient profile data, not account status", "attrs": {"statement": "Admin can edit all patient profile data, not account status; account status changes only through the FR-016 flows."}}
  - {"op": "update_node", "id": "REQ-001-026", "title": "Admin can view account status; changes run through FR-016", "attrs": {"statement": "Admin can view patient account status and verification state; status changes run only through the FR-016 flows (suspend A6, lift a suspension, unlock)."}}
  - {"op": "update_node", "id": "REQ-001-027", "attrs": {"statement": "Admin can reset patient passwords; the reset ends every existing session of the patient (REQ-001-182)."}}
  - {"op": "update_node", "id": "REQ-001-028", "title": "Suspend, reactivate and unlock run through FR-016", "attrs": {"statement": "Suspending, reactivating and unlocking patient accounts run through the FR-016 flows (suspension is FR-016 A6, REQ-016-012); a suspension ends every existing session of the patient (REQ-001-182)."}}
  - {"op": "update_node", "id": "REQ-001-029", "attrs": {"statement": "Profile Data: Modify name, email, phone, address, preferences (an email change follows REQ-001-184). Account Status: not edited in FR-001; suspend, lift and unlock run through FR-016. Security: Reset passwords, modify security settings. Preferences: Update language, currency, notification settings."}}
  - {"op": "update_node", "id": "REQ-001-031", "title": "Admin handles account deletion requests; the account is anonymised as FR-023 rules", "attrs": {"statement": "Handle account deletion requests (anonymised as FR-023 rules)"}}
  - {"op": "update_node", "id": "REQ-001-034", "attrs": {"statement": "Patient notified of every admin edit via email; the notice lists the changed fields."}}
  - {"op": "update_node", "id": "REQ-001-035", "title": "The notice lists the changed fields; no review screen", "attrs": {"statement": "The patient receives a notice listing the changed fields; there is no review screen (the admin edit is final; the patient does not accept or reject it)."}}
  - {"op": "update_node", "id": "REQ-001-043", "title": "Continue disabled until names valid and Terms and Privacy Policy accepted", "attrs": {"statement": "Continue button disabled until both name fields are valid and the Terms and Privacy Policy acceptance is checked"}}
  - {"op": "update_node", "id": "REQ-001-044", "title": "Terms and Privacy Policy acceptances recorded at account creation via FR-027", "attrs": {"statement": "One checkbox covers the Terms & Conditions and the Privacy Policy. When the account is created (Screen 4), not before, the app MUST record both acceptances, each with the Current version (FR-027), via FR-027 acceptance tracking (document type, version, locale, acceptedAt, channel)", "rationale": "prd.md Screen 3 and Screen 4; the acceptance record needs the patient identity, which exists only once the account is created."}}
  - {"op": "update_node", "id": "REQ-001-068", "title": "Account state decides the login outcome", "attrs": {"statement": "When the credentials are correct, a Suspended account is blocked with a contact-support message; a Locked account is blocked until the FR-026 lock period ends and then login works again; an account with a deletion request open can log in (FR-023)."}}
  - {"op": "update_node", "id": "REQ-001-069", "title": "Unverified email goes to the verification screen", "attrs": {"statement": "When the credentials are correct and the email is not verified, the patient goes to the verification screen and a new code is sent."}}
  - {"op": "update_node", "id": "REQ-001-076", "title": "Password reset ends all sessions; the new session depends on account status", "attrs": {"statement": "A successful reset ends every existing session of the patient (REQ-001-182), then by account status: Active gets a new session; Locked becomes Active and gets a new session; Suspended has the password updated, gets no session, stays Suspended (REQ-016-223) and sees a neutral contact-support message."}}
  - {"op": "update_node", "id": "REQ-001-081", "attrs": {"statement": "Email change triggers re-verification via 6-digit OTP sent to the new address (REQ-001-183)."}}
  - {"op": "update_node", "id": "REQ-001-090", "attrs": {"statement": "Delete account submits a data deletion request (DSR) queued for Admin review per FR-023. An open inquiry in stage Inquiry or Quoted does not block it and is cancelled when an admin approves the request, not at submission; a refused request cancels nothing (REQ-003-103)."}}
  - {"op": "update_node", "id": "REQ-001-091", "title": "Deletion blocked during active treatment, aftercare or an inquiry at Accepted or later", "attrs": {"statement": "If there is an active treatment or aftercare case, or an inquiry at the Accepted stage or later (REQ-003-103), delete account is blocked with guidance to contact support: the system shows the message \"Account deletion is unavailable during active care; contact support.\", and the blocking message on the Delete Account screen includes a Contact support link."}}
  - {"op": "update_node", "id": "REQ-001-094", "title": "Deletion requests completed within 30 days of submission", "attrs": {"statement": "\"Deletion requests are completed within 30 calendar days of submission\" (REQ-023-041)"}}
  - {"op": "update_node", "id": "REQ-001-101", "attrs": {"statement": "This screen is a shared component reused across all sensitive actions requiring re-auth (currently: Edit Profile Screen 14 when the email changes, and Delete Account Screen 16; extensible to future sensitive actions)"}}
  - {"op": "update_node", "id": "REQ-001-105", "title": "Mandatory notices cannot be disabled", "attrs": {"statement": "Mandatory notices as FR-020 defines them (REQ-020-038) are always sent and are not affected by global toggles"}}
  - {"op": "update_node", "id": "REQ-001-106", "attrs": {"statement": "All other system event notifications (inquiry stage changes including Inquiry Cancelled, quote received, booking confirmed, payment events, aftercare reminders) are sent per FR-020 and follow the channel toggles; user cannot disable individual events in MVP"}}
  - {"op": "update_node", "id": "REQ-001-113", "title": "Legal content read-only and matches the Current version", "attrs": {"statement": "Policy content is read-only and must match the Current version of the Privacy Policy for the patient app (FR-027)"}}
  - {"op": "update_node", "id": "REQ-001-144", "attrs": {"statement": "The Terms and Conditions and Privacy Policy links on the name screen open the Current version of each document (FR-027) and do not disrupt the form state."}}
  - {"op": "update_node", "id": "STP-001-024", "title": "System validates password strength, updates the password, ends all existing sessions and creates a new session unless the account is Suspended"}
  - {"op": "update_node", "id": "STP-001-124", "title": "The notice lists the changed fields (the admin edit is final; no review screen)"}
  - {"op": "update_node", "id": "STP-001-003", "attrs": {"handoff_to": "FR-027: STP-027-011, registration acceptance of the Current Terms and Privacy Policy"}}
  - {"op": "update_node", "id": "ENT-patient.account_status", "attrs": {"description": "Account status shown as a badge: Active, Suspended or Locked. Deactivated stays in the list as a reserved value: nothing sets it, nothing shows it (REQ-001-188)."}}
  - {"op": "remove_edge", "from": "STP-001-002", "verb": "applies", "to": "REQ-001-044"}
