# FR-001 logic review pass 1: ruled fixes applied to the PRD (Patient Authentication and Profile Management). New rules, one field, two flows and steps come first, then edges, then updates, then one edge removal.
# Cross-FR edges (edges only; no other FR's node is updated): STP-001-003 next STP-027-011 and STP-001-140 next STP-027-010 (FR-027 steps); REQ-001-180 governed by SET-max-login-attempts (FR-026 setting); REQ-001-044 applies to five ENT-legal-acceptance fields (FR-027); REQ-001-186 applies to ENT-deletion-request.reason (FR-023); STP-001-136 and STP-001-137 apply REQ-016-223 (FR-016 rule); STP-001-140 applies REQ-027-062 (FR-027 rule).
# Queued for other FRs, not done here: FR-016 (session end on suspension and admin reset, admin email edit notice and confirmation), FR-020 and FR-030 (catalogue events for password changed, account locked, admin profile change, re-verification code), FR-035 (Settings owner label), FR-023 (login with an open request stated explicitly).
# Left alone on purpose: the four events EVT-patient-account-locked, EVT-patient-password-changed, EVT-patient-profile-changed-by-admin and EVT-reauth-otp-sent keep no reader, because a reads edge runs only from a Stage to an Entity; minor observations other than the soft-delete wording.
reason: "FR-001 logic review pass 1: deletion request aligned with FR-003 and FR-023 (inquiries cancelled at approval, Accepted-or-later block, 30 days from submission, Screen 16 conditional blocks), account status only through FR-016 (Deactivated reserved), login and password reset outcomes by account state, sessions end on reset and suspension, wrong-code limit shares the login limit, neutral duplicate-email registration, Current version wording and Terms plus Privacy acceptance at account creation, first-sign-in consent gate, Settings Consent and Language rows, mandatory notices as FR-020 defines them, changed-fields notice, email change and admin email change confirmed by a code to the new address, steps for Screens 13, 14, 15, 18 and Logout."
by: docs-manager
operations:
  - {"op": "add_node", "id": "REQ-001-180", "type": "Rule", "owner_fr": "FR-001", "title": "Wrong codes share the failed-login limit; the code then stops working", "attrs": {"statement": "A wrong 6-digit code (registration, password reset, re-verification) counts toward the same limit as failed logins (the FR-026 max login attempts setting, default 5). After the limit the code stops working and the patient must request a new one; the resend cooldown applies. There is no separate setting.", "rationale": "FR-001 PRD Screens 5, 11 and 18; owner default 255 (other option: a separate new setting)."}}
  - {"op": "add_node", "id": "REQ-001-181", "type": "Rule", "owner_fr": "FR-001", "title": "Duplicate email at registration gets the neutral result; an unverified account may register again", "attrs": {"statement": "A registration with an email that already has a verified account gets the same neutral \"check your email\" result as a new email and reveals nothing on screen; the system emails the existing owner that an account already exists. An unverified account may register again with the same email: the old unverified record is replaced and a new code is sent.", "rationale": "FR-001 PRD Screen 4 and Edge Cases; consistent with the neutral reset message (Workflow 3, C3)."}}
  - {"op": "add_node", "id": "REQ-001-182", "type": "Rule", "owner_fr": "FR-001", "title": "Password reset, admin reset and suspension end every existing session", "attrs": {"statement": "A password reset by the patient, a password reset by an admin and a suspension each end all existing sessions of the patient on every device, as Change Password does (REQ-001-119). After a patient reset a new session starts only where the account status allows it (REQ-001-076).", "rationale": "FR-001 PRD Screen 12 and Login Rules; owner default 256 (other option: sessions end only on Change Password). FR-016 has no session-ending rule for suspension or admin reset."}}
  - {"op": "add_node", "id": "REQ-001-183", "type": "Rule", "owner_fr": "FR-001", "title": "Email change: the code goes to the new address and the old email stays the login email until confirmed", "attrs": {"statement": "When the patient changes the email on the profile, the 6-digit code is sent to the NEW address. The login email stays the old address, and the new one is held as pending (ENT-patient.pending_email), until the code is confirmed. After confirmation the new address becomes the login email, the pending value is cleared and a notice goes to the old address.", "rationale": "FR-001 PRD Screen 14 and Screen 18."}}
  - {"op": "add_node", "id": "REQ-001-184", "type": "Rule", "owner_fr": "FR-001", "title": "Admin email change: notice to the old address, the patient confirms the new address at the next login", "attrs": {"statement": "An admin may change a patient's email. The new address is saved as unverified, a notice goes to the old address, and at the patient's next login a code is sent to the new address and the patient confirms it before the session starts.", "rationale": "FR-001 PRD Admin Editability Rules; owner default 257 (other option: only the patient can change the email). FR-016 only says admins may update the email with justification and audit (REQ-016-013); the FR-016 side is queued."}}
  - {"op": "add_node", "id": "REQ-001-185", "type": "Rule", "owner_fr": "FR-001", "title": "Settings Main has a Consent row and a Language row", "attrs": {"statement": "Settings Main (Screen 15) has a Consent row that opens the general Consent view (FR-027, REQ-027-016) and a Language row that opens the app language choice (FR-021, REQ-021-002, REQ-001-165). FR-001 owns Settings Main and the Notification, Privacy and Terms sub-screens; the two opened views are owned by FR-027 and FR-021.", "rationale": "FR-001 PRD Screen 15."}}
  - {"op": "add_node", "id": "REQ-001-186", "type": "Rule", "owner_fr": "FR-001", "title": "Delete Account screen shows the free-text reason, the extra-verification input and the request status", "attrs": {"statement": "Screen 16 shows three conditional blocks: the optional free-text reason (max 500 characters) when the chosen reason requires an explanation (REQ-026-092); the additional-verification input while the request is in Verification Required (REQ-023-034); and a read-only request status line while a request is open (REQ-023-046). The Request Deletion button is hidden while a request is open (REQ-023-037). No new screen.", "rationale": "FR-001 PRD Screen 16."}}
  - {"op": "add_node", "id": "REQ-001-187", "type": "Rule", "owner_fr": "FR-001", "title": "First sign-in consent gate", "attrs": {"statement": "After a successful login, a patient who has not given the general consent is shown the FR-027 consent prompt before the main app (REQ-027-062). A patient who does not accept stays in the limited state of REQ-027-033.", "rationale": "FR-001 PRD Workflow 2 and Screen 9."}}
  - {"op": "add_node", "id": "REQ-001-188", "type": "Rule", "owner_fr": "FR-001", "title": "Deactivated is a reserved account status value", "attrs": {"statement": "The account status list keeps the value Deactivated as a reserved value: nothing sets it, nothing shows it and it has no behaviour. Account status changes only through the FR-016 flows.", "rationale": "FR-001 PRD Screen 19; owner default 254 (other option: remove the value from the list)."}}
  - {"op": "add_field", "id": "ENT-patient.pending_email", "entity_id": "ENT-patient", "name": "pending_email", "data_type": "text", "title": "Pending email", "owner_fr": "FR-001", "required": false, "attrs": {"description": "New email address typed on Edit Profile, held until the 6-digit code sent to it is confirmed. The login email stays the old address meanwhile; the value is cleared after confirmation (REQ-001-183)."}}
  - {"op": "add_node", "id": "FLW-001-login-outcomes", "type": "Flow", "title": "B3: Login outcome by account state", "attrs": {"kind": "alternative", "description": "B3: Login outcome by account state", "prd_ref": "Alternative Flow B3"}}
  - {"op": "add_node", "id": "FLW-001-reset-by-status", "type": "Flow", "title": "C4: Password reset outcome by account status", "attrs": {"kind": "alternative", "description": "C4: Password reset outcome by account status", "prd_ref": "Alternative Flow C4"}}
