  - {"op": "add_node", "id": "STP-029-164", "type": "Step", "title": "Admin edits the fields and reviews the refund ladder preview", "owner_fr": "FR-029", "attrs": {"prd_ref": "Main Flow: Configure Refund, Fees and Settlement steps 3 and 4"}}
  - {"op": "add_node", "id": "STP-029-165", "type": "Step", "title": "Admin clicks Save", "owner_fr": "FR-029", "attrs": {"prd_ref": "Main Flow: Configure Refund, Fees and Settlement step 5"}}
  - {"op": "add_node", "id": "STP-029-166", "type": "Step", "title": "System validates the changed fields against the Screen 7 ranges and orderings", "owner_fr": "FR-029", "attrs": {"prd_ref": "Main Flow: Configure Refund, Fees and Settlement step 6"}}
  - {"op": "add_node", "id": "STP-029-167", "type": "Step", "title": "System refuses the whole save and names the failing field and rule", "owner_fr": "FR-029", "attrs": {"prd_ref": "Main Flow: Configure Refund, Fees and Settlement step 7"}}
  - {"op": "add_node", "id": "STP-029-168", "type": "Step", "title": "System stores the record without requiring the Not set fields", "owner_fr": "FR-029", "attrs": {"prd_ref": "Main Flow: Configure Refund, Fees and Settlement step 8"}}
  - {"op": "add_node", "id": "STP-029-169", "type": "Step", "title": "System displays the saved confirmation message", "owner_fr": "FR-029", "attrs": {"prd_ref": "Main Flow: Configure Refund, Fees and Settlement step 9"}}
  - {"op": "add_node", "id": "STP-029-170", "type": "Step", "title": "System logs the change to the audit trail and emails the admin", "owner_fr": "FR-029", "attrs": {"prd_ref": "Main Flow: Configure Refund, Fees and Settlement steps 10 and 11"}}
  - {"op": "add_node", "id": "STP-029-171", "type": "Step", "title": "System propagates the record to Payment Processing Service within 5 minutes", "owner_fr": "FR-029", "attrs": {"prd_ref": "Main Flow: Configure Refund, Fees and Settlement step 12"}}
  - {"op": "add_node", "id": "FLW-029-main-currency-management", "type": "Flow", "title": "Main Flow: manage supported currencies", "attrs": {"kind": "main", "description": "Main Flow: manage supported currencies", "prd_ref": "Main Flow: Manage Supported Currencies"}}
  - {"op": "add_node", "id": "STP-029-172", "type": "Step", "title": "Admin opens the Currency Management screen and finds a currency", "owner_fr": "FR-029", "attrs": {"prd_ref": "Main Flow: Manage Supported Currencies step 1"}}
  - {"op": "add_node", "id": "STP-029-173", "type": "Step", "title": "Admin turns a currency on or off, or sets an enabled currency as the default", "owner_fr": "FR-029", "attrs": {"prd_ref": "Main Flow: Manage Supported Currencies step 2"}}
  - {"op": "add_node", "id": "STP-029-174", "type": "Step", "title": "System checks a currency being disabled against the block rules and the warning cases", "owner_fr": "FR-029", "attrs": {"prd_ref": "Main Flow: Manage Supported Currencies step 3"}}
  - {"op": "add_node", "id": "STP-029-175", "type": "Step", "title": "Admin confirms the dialog that names the dependent items", "owner_fr": "FR-029", "attrs": {"prd_ref": "Main Flow: Manage Supported Currencies step 4"}}
  - {"op": "add_node", "id": "STP-029-176", "type": "Step", "title": "System stores the change and existing records keep their currency code", "owner_fr": "FR-029", "attrs": {"prd_ref": "Main Flow: Manage Supported Currencies step 5"}}
  - {"op": "add_node", "id": "STP-029-177", "type": "Step", "title": "System creates a new quote configuration version and asks the admin to re-confirm Screen 7 when the default changed", "owner_fr": "FR-029", "attrs": {"prd_ref": "Main Flow: Manage Supported Currencies step 6"}}
  - {"op": "add_node", "id": "STP-029-178", "type": "Step", "title": "System logs the change, emails the admin and propagates the list within 5 minutes", "owner_fr": "FR-029", "attrs": {"prd_ref": "Main Flow: Manage Supported Currencies steps 7 and 8"}}
  - {"op": "add_node", "id": "REQ-029-150", "type": "Rule", "title": "Admins set the clinic cancellation deduction as a fixed amount with no starting value", "owner_fr": "FR-029", "attrs": {"statement": "System MUST allow admins to set the clinic cancellation deduction on Screen 7: a fixed amount in the Fee Currency with no starting value, which FR-017 reads; no deduction is made while it is not set.", "rationale": "FR-029 PRD, Screen 7 Clinic Cancellation Deduction."}}
  - {"op": "add_node", "id": "REQ-029-151", "type": "Rule", "title": "Screen 7 refuses a save that breaks a range or ordering check", "owner_fr": "FR-029", "attrs": {"statement": "System MUST refuse a Screen 7 save, naming the field, when balance due days are outside 1 to 30, when a set cancellation point is outside 1 to 30 or is not smaller than both the balance due days and the installment cutoff, when the confirmation window is outside 1 to 30, or when the settlement cutoff day and payout day are the same.", "rationale": "FR-029 PRD, Screen 7 validation rules."}}
  - {"op": "add_node", "id": "REQ-029-152", "type": "Rule", "title": "Only live Active accounts are routed on production, and the Global Fallback is Active and Live", "owner_fr": "FR-029", "attrs": {"statement": "System MUST consider Live-mode Stripe accounts only for routing on a production deployment, and the Global Fallback account MUST be Active and Live; an account that is the Global Fallback cannot be set Inactive or Archived, and an override that would leave a non-fallback account with no countries is blocked.", "rationale": "FR-029 PRD, Screen 1 and Boundary Flow B6."}}
  - {"op": "add_node", "id": "REQ-029-153", "type": "Rule", "title": "A routed account that does not support the booking currency is charged in USD at the locked rate", "owner_fr": "FR-029", "attrs": {"statement": "System MUST charge a booking in USD at its locked rate when the routed Stripe account does not support the booking currency.", "rationale": "FR-029 PRD, Payment & Billing Rules."}}
  - {"op": "add_node", "id": "REQ-029-154", "type": "Rule", "title": "A third-currency price goes via USD with the markup applied once, and a locked rate survives pair deletion", "owner_fr": "FR-029", "attrs": {"statement": "System MUST derive a price shown in a currency that is neither the quote currency nor USD via USD, applying the markup once on the pair for the shown currency, and MUST keep a booking's locked rate valid after its currency pair is deleted.", "rationale": "FR-029 PRD, Payment Rule 3 and General Module Rule 1."}}
  - {"op": "add_node", "id": "REQ-029-155", "type": "Rule", "title": "An admin acknowledges a rate-protection warning to clear it", "owner_fr": "FR-029", "attrs": {"statement": "System MUST let an admin acknowledge a pair's rate-protection warning on Screen 2B, log the acknowledgement, and clear the warning only by that action.", "rationale": "FR-029 PRD, Boundary Flow B5 and Screen 2B."}}
  - {"op": "add_node", "id": "REQ-029-156", "type": "Rule", "title": "Fixed fee amounts stay in their Fee Currency until Screen 7 is re-confirmed", "owner_fr": "FR-029", "attrs": {"statement": "System MUST state the fixed fee amounts on Screen 7 in their own Fee Currency and MUST NOT reinterpret them when the Default Currency changes; the admin is asked to re-confirm Screen 7 after a Default Currency change.", "rationale": "FR-029 PRD, Admin Editability Rules and Screen 7 Fee Currency."}}
  - {"op": "update_node", "id": "REQ-029-004", "attrs": {"statement": "System MUST route payment transactions to the appropriate Stripe account based on the country on the patient's profile (not the patient's current physical location), and a booking MUST keep the account that took its first payment for every later charge and refund"}}
  - {"op": "update_node", "id": "REQ-029-039", "attrs": {"statement": "System MUST validate cutoff days is within allowed range (30-90 days) and, when the unpaid balance cancellation point is set, that the cutoff stays larger than it; display an error if either check fails"}}
  - {"op": "update_node", "id": "REQ-029-074", "attrs": {"statement": "If no fallback: System displays error to patient: \"Payment processing not available for your location. Please contact support.\" System sends alert to admin: \"Payment attempted from unsupported country: South Africa. Configure Stripe account for this region.\" The alert is sent once per country per day, however many patients try. A patient whose profile has no country is asked to add one before payment, with no alert."}}
  - {"op": "update_node", "id": "REQ-029-139", "attrs": {"statement": "If enabled: Assigned Countries must be empty, Account Status must be Active and Account Mode must be Live. The flag must be moved to another account before this account can be set Inactive or Archived."}}
  - {"op": "update_node", "id": "REQ-029-010", "attrs": {"statement": "System MUST allow admins to configure a global rate protection threshold (1-50% range). System monitors each auto-fetch pair independently and marks the pair's status as yellow/warning and sends an alert notification when the pair's rate differs from its rate 24 hours earlier by more than the threshold. The warning clears only when an admin acknowledges it"}}
  - {"op": "update_node", "id": "REQ-029-019", "attrs": {"statement": "System MUST allow admins to configure cutoff days (30-90 day range): the last installment is due on or before the cutoff date"}}
  - {"op": "update_node", "id": "REQ-029-021", "attrs": {"statement": "System MUST automatically calculate available installment options based on booking date, procedure date, and cutoff days, with a minimum lead time of cutoff + 30 days, and MUST show the minimum lead time on the configuration screen"}}
  - {"op": "update_node", "id": "REQ-029-023", "attrs": {"statement": "System MUST allow admins to configure the late payment grace period (0-14 days), counted from the installment due date. The late fee is charged once, after the grace period and the automatic retries have ended"}}
  - {"op": "update_node", "id": "REQ-029-040", "title": "Prevent deletion of a Stripe account still used by an open booking or active plan", "attrs": {"statement": "System MUST prevent deletion of a Stripe account that an open booking or active installment plan still uses (set it to Archived instead)"}}
  - {"op": "update_node", "id": "REQ-029-042", "attrs": {"statement": "System MUST always show the installment minimum lead time (cutoff + 30 days) on the split payment screen and display a warning when the cutoff is above 60 days"}}
  - {"op": "update_node", "id": "REQ-029-049", "attrs": {"statement": "System MUST lock payment configuration only at its named lock points: the currency conversion rate at FR-005 subquote acceptance; the commission configuration, deposit rate, split payment settings, refund ladder, rescheduling fee, late payment fee, grace period, unpaid balance cancellation point and installment cutoff at FR-006 booking confirmation; nothing at quote creation or sending. Hairline's share of a cancellation fee, the clinic cancellation deduction and the patient confirmation window apply on the day of the event"}}
  - {"op": "update_node", "id": "REQ-029-052", "attrs": {"statement": "System MUST block disabling a currency while any non-terminal sent quote, unpaid accepted booking, or open booking or instalment plan uses it, or while it is the Default Currency of an active Stripe account, and MUST show the admin the count of records still using that currency (or the account name)."}}
  - {"op": "update_node", "id": "REQ-029-075", "attrs": {"statement": "How to manage admin accidentally entering incorrect Stripe secret key that initially validates but later fails during actual payment processing? During configuration, system validates Stripe credentials by making test API call to Stripe. If credentials are syntactically correct but have insufficient permissions or are later revoked by Stripe, first payment attempt will fail. Payment Processing Service logs error: \"Stripe authentication failed for account [name].\" System sends urgent alert to admin: \"Stripe account [name] failed authentication. Verify API keys are active and have required permissions.\" System temporarily routes new bookings to Global Fallback (if configured) and displays error banner to admin; a booking already taken on the failing account keeps that account and its charges are retried once the keys are fixed."}}
  - {"op": "update_node", "id": "REQ-029-087", "attrs": {"statement": "Status badges update automatically: green when last fetch succeeded and rate change is within threshold; yellow when the last sync breached the rate protection threshold or the source is degraded; red when last fetch failed or source is down. A yellow rate-protection badge clears only when an admin clicks \"Acknowledge\" on the pair; a later normal sync does not clear it. A yellow badge caused by a degraded source clears when the source is healthy again."}}
  - {"op": "update_node", "id": "REQ-029-097", "attrs": {"statement": "How does system handle rapid currency fluctuation exceeding rate protection threshold multiple times in single day for one pair (e.g., USD/EUR changes 3% at 8am, another 3% at 2pm, another 3% at 8pm)? System compares each sync with the pair's rate 24 hours earlier. It sends the first alert at 8am when the 3% threshold is crossed and marks the pair's status as yellow/warning on the pair list. System applies rate-limiting to alerts (maximum one alert per currency pair per 6 hours) to prevent alert fatigue, and sends the second alert at 2pm showing the change against the rate 24 hours earlier: \"USD/EUR changed 6% in 24 hours.\" The yellow badge stays until an admin clicks Acknowledge; a later normal sync does not clear it. Admin receives summary of all rate changes across all pairs in daily digest email."}}
  - {"op": "update_node", "id": "REQ-029-101", "attrs": {"statement": "Rule 1: Payment configuration changes never alter a value that has already been locked. Each configuration is locked at a named point: (a) the currency conversion rate (including markup) is locked when the patient accepts a subquote in FR-005 and is stored in the acceptance snapshot; (b) the effective commission configuration, the deposit rate, and the split payment (installment) settings are locked at FR-006 booking confirmation and stored with the booking; (c) no payment configuration is frozen when a parent quote or subquote is created or sent in FR-004; (d) the refund ladder, the rescheduling fee, the late payment fee, the late payment grace period, the unpaid balance cancellation point and the installment cutoff are locked at FR-006 booking confirmation, while Hairline's share of a patient cancellation fee, the clinic cancellation deduction and the patient confirmation window are read on the day the event happens and are not locked; (e) the Stripe account that takes a booking's first payment is stored with the booking and used for every later charge and refund of that booking; (f) a locked currency rate survives the deletion of its currency pair. Before its lock point, a quote or accepted-but-unconfirmed subquote follows the configuration that is effective at that moment, and an active installment plan keeps the settings locked at its booking confirmation. When FR-019 expresses a fixed-amount promotion in the quote currency at quote send, it uses the currency conversion rate (including markup) in effect at send; this sets the promotion amount on the quote only and does not lock the conversion rate for payment, which stays locked at acceptance under (a)."}}
  - {"op": "update_node", "id": "REQ-029-103", "attrs": {"statement": "Payment Rule 3: Currency conversion markup applies to all transactions involving currency conversion (protects against bank rate differences). A price shown in a currency that is neither the quote currency nor USD is derived via USD with the markup applied once, on the pair for the shown currency"}}
  - {"op": "update_node", "id": "REQ-029-104", "attrs": {"statement": "Currency Rule 1: Prices always displayed to patients in their selected currency using admin-configured conversion rates with markup; a price in a currency that is neither the quote currency nor USD goes via USD with the markup applied once"}}
  - {"op": "update_node", "id": "REQ-029-105", "title": "A missed installment brings reminders, retries and an admin flag; the cancellation point cancels an unpaid booking", "attrs": {"statement": "Payment Rule 6: A missed installment is followed by reminders and automatic payment retries (timing owned by FR-007B); when the retries have failed, an admin is flagged to follow up. The late payment fee is charged once, after the grace period and the retries have ended (Late Fee Rule). A booking whose balance is still unpaid at the unpaid balance cancellation point (Screen 7, counted in days after the first missed due date) is cancelled: this wins over pending retries and the Defaulted state, covers any unpaid balance (deposit and balance, or installments), applies only to bookings confirmed after the point was set, and does nothing while the point is not set"}}
  - {"op": "update_node", "id": "REQ-029-106", "title": "No installment option is offered below cutoff plus 30 days", "attrs": {"statement": "What happens when a patient books 35 days before the procedure with a 30-day cutoff enabled? The installment schedule starts on the booking day and then falls due every 30 days, so 2 installments need at least 60 days (cutoff + 30) and none fits at 35 days. No installment option is offered; the patient sees the other payment options (pay in full now, or deposit now and balance later) and no message offers installments. The same booking would be offered installments only from 60 days out (2 installments), 90 days (3), and so on."}}
  - {"op": "update_node", "id": "REQ-029-109", "attrs": {"statement": "If time between booking and procedure is insufficient for an installment count given the cutoff, that count is not offered; if even 2 installments do not fit, the patient sees the other payment options only"}}
  - {"op": "update_node", "id": "REQ-029-110", "attrs": {"statement": "Refund Rule: Refunds on a cancelled booking follow the refund ladder set on Screen 7 and locked at booking confirmation: the refund percentage depends on how many days before the procedure date the booking is cancelled. The launch default is more than 30 days, 90 percent; 15 to 30 days, 50 percent; under 15 days, 0 percent. It is one global setting that FR-006, FR-007, FR-007B and FR-017 read; each provider's own cancellation terms do not replace it"}}
  - {"op": "update_node", "id": "REQ-029-129", "title": "A cutoff above 60 days shows a warning", "attrs": {"statement": "What occurs if admin configures a high cutoff (e.g., 90 days)? Screen 4 shows the minimum lead time at all times (cutoff + 30 days, here 120 days) and, because the cutoff is above 60 days, displays warning: \"With a cutoff of [90 days], only bookings made [120] or more days before the procedure can use installments.\" Admin can choose to proceed or adjust to a lower value (e.g., 30 days). System logs warning to admin activity log."}}
  - {"op": "update_node", "id": "REQ-029-140", "attrs": {"statement": "System MUST compare the booking total with the Minimum Booking Amount for installments in USD: a booking total in another currency is converted to USD at the conversion rate locked at FR-005 subquote acceptance, using the base rate without markup, before the comparison."}}
  - {"op": "update_node", "id": "REQ-029-142", "title": "Admins edit the refund ladder, locked at confirmation", "attrs": {"statement": "System MUST allow admins to edit the refund ladder (refund percentage by how many days before the procedure date the booking is cancelled) on Screen 7. The launch default is: more than 30 days, 90 percent; 15 to 30 days, 50 percent; under 15 days, 0 percent. The ladder is locked at booking confirmation. FR-006, FR-007, FR-007B and FR-017 read this setting."}}
  - {"op": "update_node", "id": "REQ-029-143", "title": "Admins set the late payment fee and the rescheduling fee, locked at confirmation", "attrs": {"statement": "System MUST allow admins to set a late payment fee and a rescheduling fee on Screen 7. For each fee the admin chooses the type (fixed amount or percentage) and enters the value. A fixed amount is stated in the Fee Currency and converted at the rate accepted on the booking; the late fee percentage is of the late installment. Both fees are locked at booking confirmation. Hairline keeps both fees; they change no provider payout. The rescheduling fee never applies to a change an admin makes in V1."}}
  - {"op": "update_node", "id": "REQ-029-144", "title": "Late payment fee is charged once, after the grace period and the retries", "attrs": {"statement": "System MUST charge the late payment fee once, when the late payment grace period (counted from the due date) has passed with the installment unpaid and the automatic retries have ended; it is collected with the next successful charge and stays outside the clinic share and the refund base."}}
  - {"op": "update_node", "id": "REQ-029-145", "title": "One weekly settlement period for all manually paid clinics", "attrs": {"statement": "System MUST allow admins to set the settlement cutoff day and payout day for all manually paid clinics on Screen 7. The period is weekly only in V1, defaulting to a Sunday cutoff and a Wednesday payout; the two days must differ. There is no per-clinic payout frequency; on the Stripe Connect rail release is automatic. FR-015 and FR-017 point to this setting."}}
  - {"op": "update_node", "id": "REQ-029-146", "title": "Balance due days default to 7 and range from 1 to 30", "attrs": {"statement": "System MUST treat the balance of the deposit-now, balance-later option as due 7 days before treatment by default, and MUST allow admins to edit it on Screen 7 within 1 to 30 days. A booking confirmed with fewer days left than the balance due days gets full payment only."}}
  - {"op": "update_node", "id": "REQ-029-147", "title": "Unpaid balance cancellation point is 1 to 30 days and may be Not set", "attrs": {"statement": "System MUST allow admins to set, on Screen 7, the unpaid balance cancellation point: 1 to 30 days after the first missed due date, at which a booking with any unpaid balance (deposit and balance, or installments) is cancelled. It applies only to bookings confirmed after it is set, wins over pending retries and the Defaulted state, and does nothing while it is not set. It must be smaller than the balance due days and smaller than the installment cutoff."}}
  - {"op": "update_node", "id": "REQ-029-148", "title": "Hairline's share of a patient cancellation fee may be Not set", "attrs": {"statement": "System MUST allow admins to set Hairline's share of a patient cancellation fee on Screen 7. It has no starting value and may be Not set; while it is not set Hairline keeps the whole fee and billing admins are flagged."}}
  - {"op": "update_node", "id": "REQ-029-149", "title": "Patient confirmation window is 1 to 30 days, default 7", "attrs": {"statement": "System MUST allow admins to set the patient confirmation window on Screen 7 (1 to 30 days, default 7)."}}
  - {"op": "update_node", "id": "SET-deposit-plan-balance-due-days", "title": "Balance due days", "attrs": {"description": "How many days before the treatment date the balance of the deposit-now, balance-later option is due; whole number of days from 1 to 30, admin-editable on Screen 7 (PRD Screen 7, Balance Due Days). A booking confirmed with fewer days left than this gets full payment only. Read by FR-006 and FR-007."}}
  - {"op": "update_node", "id": "SET-unpaid-balance-cancellation-point", "attrs": {"description": "The number of days after the first missed due date at which a booking that still has any unpaid balance (the deposit and balance option, or installments) is cancelled (FR-006 Alternative Flow B8). Whole number from 1 to 30, smaller than both the balance due days and the installment cutoff; Screen 7 refuses a save that breaks this. It has no starting value and may be Not set; while it is not set nothing is cancelled for non-payment. It applies only to bookings confirmed after it is set and is locked at booking confirmation."}}
  - {"op": "update_node", "id": "SET-installment-late-payment-grace-period", "attrs": {"description": "Late payment grace period (0-14 days, FR-029 Screen 4), counted from the installment due date: reminders and automatic retries run during it, and the late payment fee is charged once after it has passed and the retries have ended. A missed installment never cancels the booking by itself; the unpaid balance cancellation point does. Locked at booking confirmation."}}
  - {"op": "update_node", "id": "SET-late-payment-fee", "attrs": {"description": "Fee charged once when the grace period (counted from the due date) has passed with the installment unpaid and the automatic retries have ended; collected with the next successful charge and kept outside the clinic share and the refund base. A type (fixed amount in the Fee Currency, converted at the rate accepted on the booking, or a percentage 0-100 of the late installment) plus a value, admin-editable on Screen 7 and locked at booking confirmation. Hairline keeps it; it changes no provider payout. The PRD gives no default."}}
  - {"op": "update_node", "id": "SET-rescheduling-fee", "attrs": {"description": "Fee for rescheduling a booking: a type (fixed amount in the Fee Currency, converted at the rate accepted on the booking, or percentage 0-100) plus a value, admin-editable on Screen 7 and locked at booking confirmation. Hairline keeps it; it changes no provider payout. It never applies to a change an admin makes in V1; what a percentage is taken of is decided together with patient-side rescheduling. The PRD gives no default."}}
  - {"op": "update_node", "id": "SET-split-payment-config", "attrs": {"description": "Split payment (installment) configuration of Screen 4: feature enabled switch, offered installment counts (2 to 9), cutoff days (30-90, default 30), minimum booking amount ($100-$10,000, stated in USD) and late payment grace period (0-14 days, 0 = none, counted from the due date). Installment frequency is fixed at monthly (30-day intervals): the first installment is due on the booking day and the next ones every 30 days, so the minimum lead time for installments is cutoff + 30 days. The PRD names no defaults other than 30 cutoff days."}}
  - {"op": "update_node", "id": "SET-patient-cancellation-fee-split", "attrs": {"description": "Percentage 0-100 of a patient cancellation fee kept by Hairline; the rest goes to the clinic (FR-017 Release Rule 7, FR-007 REQ-007-092). Set on Screen 7 with no starting value; it may be Not set, and while it is not set Hairline keeps the whole fee and billing admins are flagged. Applies on the day of the cancellation."}}
  - {"op": "update_node", "id": "SET-patient-confirmation-window", "attrs": {"description": "Time the patient has to confirm or dispute a procedure the clinic marked complete; no answer means automatic release (FR-017 Release Rule 1). Editable admin setting on Screen 7, whole number of days from 1 to 30; applies on the day of the event."}}
  - {"op": "update_node", "id": "SET-settlement-period", "attrs": {"description": "The one settlement period that applies to all manually paid clinics (manual bank transfer rail); there is no per-clinic value and it does not apply on the Stripe Connect rail (PRD Screen 7, Settlement Period). Weekly only in V1, because FR-017 runs a weekly cycle; admins edit only the cutoff day and the payout day, which are SET-payout-cutoff-day and SET-payout-day."}}
  - {"op": "update_node", "id": "SET-payout-cutoff-day", "attrs": {"description": "Day of the week on which the settlement statement is generated for manual-rail clinics; one platform-wide value (FR-017 Fund Release and Payout Rules, Release Rule 3). Admin-editable; must differ from the payout day, and Screen 7 refuses a save that sets both to the same day."}}
  - {"op": "update_node", "id": "SET-payout-day", "attrs": {"description": "Day of the week on which approved settlement statements are paid for manual-rail clinics; one platform-wide value (FR-017 Fund Release and Payout Rules, Release Rule 3). Admin-editable; must differ from the cutoff day, and Screen 7 refuses a save that sets both to the same day."}}
  - {"op": "update_node", "id": "SET-refund-ladder", "attrs": {"description": "Refund percentage by how many days before the procedure date the booking is cancelled; one global band table, percentage 0-100 per band, admin-editable on Screen 7 and locked at booking confirmation. Read by FR-006, FR-007, FR-007B and FR-017. The base amount the percentage applies to is not defined in the PRD."}}
  - {"op": "update_node", "id": "SET-rate-protection-threshold", "attrs": {"description": "Percentage by which an auto-fetch pair's rate may differ from its rate 24 hours earlier before the pair is flagged yellow and admins are alerted; the flag clears only when an admin acknowledges it. Range 1-50%, precision 0.1%. The PRD names no default (3% appears only as an example)."}}
  - {"op": "update_node", "id": "SET-installment-first-installment-type", "attrs": {"description": "The first installment is an equal split of the total, as FR-007B sets; there is no deposit-or-equal choice, so this setting is retired."}}
  - {"op": "update_node", "id": "SET-clinic-cancellation-deduction", "owner_fr": "FR-029", "attrs": {"description": "Fixed amount deducted from the clinic's next payout when the clinic cancels (FR-017 Release Rule 7). Set by admins on Screen 7 (FR-029), stated in the Fee Currency, with no starting value; while it is not set no deduction is made. FR-017 reads it. Applies on the day of the cancellation."}}
  - {"op": "update_node", "id": "ENT-refund-fee-settings.deposit_plan_balance_due_days", "attrs": {"description": "Days before the treatment date that the balance of the deposit-now, balance-later option is due. Default 7. Whole number, 1 to 30."}}
  - {"op": "update_node", "id": "ENT-refund-fee-settings.hairline_cancellation_fee_share", "attrs": {"description": "Percentage 0-100 of a patient cancellation fee kept by Hairline; the rest goes to the clinic. No starting value; may be Not set, in which case Hairline keeps the whole fee and billing admins are flagged. Applies on the day of the cancellation."}}
  - {"op": "update_field", "id": "ENT-refund-fee-settings.hairline_cancellation_fee_share", "required": false}
  - {"op": "update_node", "id": "ENT-refund-fee-settings.late_payment_fee_value", "attrs": {"description": "Value of the late payment fee. Fixed amount in the Fee Currency, precision per its minor units, converted at the rate accepted on the booking; percentage 0-100 of the late installment. Locked at booking confirmation."}}
  - {"op": "update_node", "id": "ENT-refund-fee-settings.patient_confirmation_window_days", "attrs": {"description": "Days after a clinic marks a procedure complete during which the patient may raise a problem before the clinic share is released. Default 7; whole number from 1 to 30. Applies on the day of the event."}}
  - {"op": "update_node", "id": "ENT-refund-fee-settings.refund_ladder", "attrs": {"description": "Bands of days before the procedure date and the refund percentage for each (0-100). Launch default: more than 30 days 90, 15 to 30 days 50, under 15 days 0. Every number of days falls in exactly one band. Locked at booking confirmation."}}
  - {"op": "update_node", "id": "ENT-refund-fee-settings.rescheduling_fee_value", "attrs": {"description": "Value of the rescheduling fee. Fixed amount in the Fee Currency, precision per its minor units, converted at the rate accepted on the booking; percentage 0-100. Locked at booking confirmation. Never applies to a change an admin makes in V1."}}
  - {"op": "update_node", "id": "ENT-refund-fee-settings.settlement_period", "attrs": {"description": "The one settlement period for all manually paid clinics. Weekly only in V1; no per-clinic value exists."}}
  - {"op": "update_node", "id": "ENT-refund-fee-settings.settlement_cutoff_day", "attrs": {"description": "Day of the week the settlement period closes. Default Sunday. Must differ from the payout day."}}
  - {"op": "update_node", "id": "ENT-refund-fee-settings.settlement_payout_day", "attrs": {"description": "Day of the week the settlement statement is paid out. Default Wednesday. Must differ from the cutoff day."}}
  - {"op": "update_node", "id": "ENT-refund-fee-settings.unpaid_balance_cancellation_point", "attrs": {"description": "Days after the first missed due date at which a booking that still has an unpaid balance is cancelled. Whole number from 1 to 30, smaller than the balance due days and the installment cutoff. No default; may be Not set, in which case nothing is cancelled for non-payment. Locked at booking confirmation."}}
  - {"op": "update_field", "id": "ENT-refund-fee-settings.unpaid_balance_cancellation_point", "data_type": "int", "required": false}
  - {"op": "add_edge", "from": "SCR-029-08", "verb": "shows", "to": "ENT-refund-fee-settings.clinic_cancellation_deduction", "attrs": {"provenance": "user input", "label": "Clinic cancellation deduction", "editable": true}}
  - {"op": "add_edge", "from": "SCR-029-08", "verb": "shows", "to": "ENT-refund-fee-settings.fee_currency", "attrs": {"provenance": "system calculated", "label": "Fee currency"}}
  - {"op": "update_node", "id": "ENT-split-payment-config.cutoff_days", "attrs": {"description": "Days before the procedure date by which the last installment must be due. Range 30-90 days, integer only; when the unpaid balance cancellation point is set it must stay smaller than this value."}}
  - {"op": "update_node", "id": "ENT-split-payment-config.late_payment_grace_period_days", "attrs": {"description": "Days after a missed installment due date, counted from the due date, during which reminders and automatic retries run; the late payment fee is charged once after it has passed and the retries have ended. Range 0-14 days, integer only; 0 = no grace period. A missed installment never cancels the booking by itself."}}
  - {"op": "update_node", "id": "ENT-stripe-account.status", "attrs": {"description": "Active, Inactive or Archived (active = enabled for processing). An account that an open booking or active installment plan still uses cannot be deleted; it is set to Archived, which takes it out of use for new bookings. The Global Fallback account cannot be set Inactive or Archived."}}
  - {"op": "add_enum_value", "field_id": "ENT-stripe-account.status", "value": "archived", "label": "Archived", "sort_order": 2}
  - {"op": "update_node", "id": "ENT-stripe-account.is_global_fallback", "attrs": {"description": "If enabled, this Stripe account is used when no country or regional grouping mapping exists for the patient. At most one account can be the Global Fallback. If enabled: Assigned Countries must be empty, Account Status must be Active and Account Mode must be Live. The flag must be moved to another account before this account can be set Inactive or Archived."}}
  - {"op": "update_node", "id": "ENT-currency-conversion-settings.rate_protection_threshold", "attrs": {"description": "Alert if a pair's rate differs from its rate 24 hours earlier by more than this percentage. Range 1-50%, decimal precision 0.1%. The pair's warning clears only when an admin acknowledges it."}}
  - {"op": "update_node", "id": "SCR-029-01", "attrs": {"description": "Admin Platform. Add, edit and manage multiple Stripe accounts and assign them to countries or regional groupings (PRD Screen 1). UI controls, not fields: Test Connection button and its modal (shows account name, mode and endpoint, calls Stripe with the keys and webhook secret, shows success or failure with error details, logs the attempt and updates Last Tested), Show toggle on the secret fields, Retry Connection, Save & Activate. Also shown: inline help on Test versus Live Mode, a warning icon when the account was not tested for over 30 days, and transaction count and total volume per account for the last 30 days (reference only; read from payment transactions owned by FR-007). Account Status is Active, Inactive or Archived: an account an open booking or active installment plan still uses cannot be deleted, only archived. On a production deployment only Live accounts are routed, and the Global Fallback account must be Active and Live."}}
  - {"op": "update_node", "id": "SCR-029-02", "attrs": {"description": "Admin Platform. Screen 2A: Section 1 Global Settings, Section 2 Rate Sources (Add, Edit, Delete, Test Connection), Section 3 Currency Pair List (PRD Screen 2A). The pair list supports sorting and filtering by pair name, mode, status and last updated, shows total pair count and counts by mode, an alert badge count in the header when any pair is yellow or red, a banner that currencies not configured default to USD, and actions Add Pair, Edit Pair, Delete Pair and Sync Now per auto-fetch pair. Source Status and Last Tested are display-only. A yellow rate-protection badge compares the pair with its rate 24 hours earlier and stays until an admin acknowledges it on Screen 2B; a later normal sync does not clear it."}}
  - {"op": "update_node", "id": "SCR-029-03", "attrs": {"description": "Admin Platform. Screen 2B: form to create or edit a pair (PRD Screen 2B). UI controls, not fields: Test Connection & Fetch Rate (mandatory before saving a new auto-fetch pair), Save, Cancel, the Rate History link (chart and table of rate changes over the last 30 days when editing), inline help text on Base Rate, the source status indicator beside the Source dropdown, the estimated conversion impact example, and last and next sync timestamps below the form. The Acknowledge button clears a pair's rate-protection warning and logs the acknowledgement with admin and time."}}
  - {"op": "update_node", "id": "SCR-029-05", "attrs": {"description": "Admin Platform. Configure available installment options and cutoff rules (PRD Screen 4). UI controls, not fields: Preview Installment Schedule button, Save Split Payment Configuration. Also shown: a preview calculator and example scenarios, a warning when cutoff days are very aggressive (over 60), and installment usage statistics for the last 30 days (reference only). The minimum lead time (cutoff + 30 days) and the minimum for each enabled installment count are always shown; the warning appears when the cutoff is above 60 days."}}
  - {"op": "update_node", "id": "SCR-029-07", "attrs": {"description": "Admin Platform. Manage the enabled subset of the master currency catalog and the system default currency (PRD Screen 6). UI controls, not fields: Search filter by code or name, Enable common set (e.g., USD/EUR/GBP) and Set Default quick actions. It is the source of truth for currency dropdowns across Admin, Provider and Patient experiences. A currency that is the Default Currency of an active Stripe account cannot be disabled; after the default currency changes a banner on Screen 7 asks the admin to re-confirm the fixed fee amounts."}}
  - {"op": "update_node", "id": "SCR-029-08", "attrs": {"description": "Admin Platform. One global record of the refund ladder, the late payment fee, the rescheduling fee, the deposit plan balance due days, the unpaid balance cancellation point, Hairline's share of a patient cancellation fee, the patient confirmation window and the settlement period, cutoff day and payout day for manually paid clinics (PRD Screen 7). Not set per provider, region or currency. Also the clinic cancellation deduction and the read-only Fee Currency. The cancellation point, Hairline's share and the deduction show Not set until an admin sets them. A save that breaks a range or ordering check is refused with the failing field named."}}
  - {"op": "update_node", "id": "STP-029-059", "title": "Admin enables or disables the installment options (2 to 9), each showing its minimum lead time"}
  - {"op": "update_node", "id": "STP-029-062", "title": "Admin configures the late payment grace period (0-14 days, counted from the due date)"}
  - {"op": "update_node", "id": "STP-029-063", "title": "Admin reviews the preview of the computed installment schedule and maximum count"}
  - {"op": "update_node", "id": "STP-029-065", "title": "System validates the cutoff is within 30-90 days and above the cancellation point when it is set"}
  - {"op": "update_node", "id": "STP-029-068", "title": "System shows the minimum lead time (cutoff + 30 days) and the installment options a sample booking would be offered"}
  - {"op": "update_node", "id": "STP-029-135", "title": "Admin sets a high cutoff date (for example 90 days before the procedure)"}
  - {"op": "update_node", "id": "STP-029-137", "title": "System shows the minimum lead time (cutoff + 30 days) and the minimum for each enabled count"}
  - {"op": "update_node", "id": "STP-029-138", "title": "System displays the high-cutoff warning when the cutoff is above 60 days"}
  - {"op": "update_node", "id": "STP-029-143", "title": "System compares the new rate to the pair's rate 24 hours earlier"}
  - {"op": "update_node", "id": "STP-029-151", "title": "Admin clicks Acknowledge and the pair status badge returns to green"}
  - {"op": "update_node", "id": "STP-029-152", "title": "Payment Processing Service reads the country on the patient's profile when the patient pays"}
  - {"op": "update_node", "id": "STP-029-153", "title": "Payment Processing Service queries the payment configuration for the profile country"}
  - {"op": "update_node", "id": "STP-029-155", "title": "System checks for a live, Active Stripe account marked as Global Fallback"}
  - {"op": "update_node", "id": "STP-029-158", "title": "System sends the unsupported-country alert to the admin, once per country per day"}
