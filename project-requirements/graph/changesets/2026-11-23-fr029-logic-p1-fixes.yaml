reason: "FR-029 logic review pass 1: align the graph with the corrected PRD (installment schedule and cutoff, balance due days, cancellation point, share, ladder and fee locks, settlement days, clinic cancellation deduction on Screen 7, USD fallback, third-currency pricing, rate protection compared with 24 hours earlier and Acknowledge, Archived accounts, live-only routing)"
by: docs-manager
operations:
  - {"op": "add_field", "id": "ENT-refund-fee-settings.clinic_cancellation_deduction", "entity_id": "ENT-refund-fee-settings", "name": "clinic_cancellation_deduction", "data_type": "money", "title": "Clinic cancellation deduction", "owner_fr": "FR-029", "required": false, "attrs": {"description": "Fixed amount deducted from a clinic's next payout when the clinic cancels, stated in the Fee Currency. No starting value; may be Not set, in which case no deduction is made. FR-017 reads it. Applies on the day of the cancellation."}}
  - {"op": "add_field", "id": "ENT-refund-fee-settings.fee_currency", "entity_id": "ENT-refund-fee-settings", "name": "fee_currency", "data_type": "text", "title": "Fee currency", "owner_fr": "FR-029", "required": false, "attrs": {"description": "Currency in which the fixed late payment fee, the fixed rescheduling fee and the clinic cancellation deduction are stated. It is the system default currency at the time an admin last saved Screen 7; it changes only when an admin saves Screen 7 after a Default Currency change, and never reinterprets stored amounts."}}
  - {"op": "add_node", "id": "STP-029-159", "type": "Step", "title": "System logs the acknowledgement with admin ID and timestamp", "owner_fr": "FR-029", "attrs": {"prd_ref": "Boundary Flow B5 step 10"}}
  - {"op": "add_node", "id": "STP-029-160", "type": "Step", "title": "System asks a patient whose profile has no country to add one before payment, with no alert", "owner_fr": "FR-029", "attrs": {"prd_ref": "Boundary Flow B6 step 2"}}
  - {"op": "add_node", "id": "STP-029-161", "type": "Step", "title": "System stores the account that took the first payment and uses it for every later charge and refund", "owner_fr": "FR-029", "attrs": {"prd_ref": "Boundary Flow B6 step 8"}}
  - {"op": "add_node", "id": "FLW-029-main-refund-fees-settlement", "type": "Flow", "title": "Main Flow: configure refund, fees and settlement", "attrs": {"kind": "main", "description": "Main Flow: configure refund, fees and settlement", "prd_ref": "Main Flow: Configure Refund, Fees and Settlement"}}
