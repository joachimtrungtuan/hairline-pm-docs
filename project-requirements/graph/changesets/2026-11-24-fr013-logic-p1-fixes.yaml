# ---- Rule updates (statements mirror the PRD wording) -----------------------
- op: update_node
  id: REQ-013-002
  attrs:
    statement: |-
      System MUST enforce time gating (≥ 3 months) and one published review per treatment case. After a removal (approved takedown or admin policy removal) the patient MAY submit one further review for the case. Removed reviews are kept in the archive and are never restored.
- op: update_node
  id: REQ-013-008
  attrs:
    statement: |-
      System MUST calculate and display provider average rating, count, and distribution over Published reviews, including admin-seeded `Verified Off-platform` reviews.
- op: update_node
  id: REQ-013-014
  attrs:
    statement: |-
      System MUST always alias reviewer identity and prevent exposure of PII in public views.
- op: update_node
  id: REQ-013-016
  attrs:
    statement: |-
      System MUST support unpublish + archival for compliance removals and approved takedown requests; an admin removal of a review also closes any Pending takedown request on it as Approved. There is no Restore action.
- op: update_node
  id: REQ-013-017
  attrs:
    statement: |-
      The review module raises a notification on each of these events: new published review, provider reply, admin removal, takedown decision, review edited by the patient (to the provider, informational only), review edited by an admin (to the reviewing patient), takedown requested (to admins), and takedown overdue (to admins). Notices that would go to the placeholder patient of an admin-seeded review are not sent. The invitation fires on the eligibility date (3 months after confirmed procedure completion) and reminder timing counts from that date; reminder cadence is owned by FR-030. Delivery, recipients, content and opt-out follow the notification-service Rule in FR-020 and the FR-030 notification catalogue.
- op: update_node
  id: REQ-013-022
  attrs:
    statement: |-
      Admin Review Settings MUST support review category labels, photo guidelines, removal reason catalog, restricted flagging/SLA settings, and RBAC-restricted export actions with audit logging. Reviewer identity is always shown as the alias, so there is no display-policy setting. Review reminder cadence is owned by FR-030 (Notification Rules & Configuration); Screen 10 provides link-outs only.
- op: update_node
  id: REQ-013-023
  attrs:
    statement: |-
      System MUST additionally expose a per-treatment aggregated sub-scores endpoint that returns, for a given provider, `{treatment_id → {avg_overall, avg_facility, avg_staff, avg_results, avg_value, review_count, distribution}}` over Published reviews only. This endpoint is the data contract consumed by FR-014 "review sub-scores per treatment" analytics; cache invalidation MUST be triggered on every change of a review's visibility or rating (publish, edit republish, admin add, admin edit of a rating, removal, unpublish from flag resolution, and approved takedown).
- op: update_node
  id: REQ-013-024
  attrs:
    statement: |-
      The review invitation fires on the eligibility date (3 months after confirmed procedure completion) and triggers the review flow; reminders count from that date. Patient navigates to “Write a Review” from provider history. Patient views published reviews from provider profile/offer evaluation surfaces. Patient navigates to “Submitted Reviews” to view review history and request takedown from detail page. Providers access “Reviews” in dashboard to list/filter/detail reviews and respond. Admins access “Review Management”, “Takedown Requests”, and “Review Settings” from Admin platform navigation.
- op: update_node
  id: REQ-013-030
  attrs:
    statement: |-
      Patient can edit their published review at any time except while a takedown request on it is `Pending`. `Edit Review` opens pre-filled form fields; saved edits are published immediately (no moderation gate).
- op: update_node
  id: REQ-013-031
  attrs:
    statement: |-
      System publishes (or republishes, on edit) the review immediately and recalculates provider rating metrics (average, count, distribution) with associated cache invalidation. Recalculation applies whether the action is an initial submission or an edit to an already-published review, and, under the same rule, to every other change of a review's visibility or rating (REQ-013-031): admin add, admin edit of a rating, admin removal, unpublish from flag resolution, and approved takedown. Admin-seeded reviews count in the average and distribution and are labelled Verified Off-platform.
- op: update_node
  id: REQ-013-032
  attrs:
    statement: |-
      On edit (republish), system also: (a) re-runs B2 automated flagging (keyword/duplicate/rate-limit checks) against the new payload, including a comparison with the last admin redaction so an edit cannot restore redacted content, (b) sets `last_edited_at` and increments `edit_count`, (c) writes a full audit record (before/after values, actor=patient), and (d) notifies the provider, for information only, that a review they may have responded to was edited; the provider has no action on the notice because responses are immutable (REQ-013-055).
- op: update_node
  id: REQ-013-033
  attrs:
    statement: |-
      Edited reviews (patient or admin edit) surface an "Edited {relative_time}" marker on all public surfaces (Patient list, Patient detail, Provider list/detail, Provider Profile Reviews Section) so readers can distinguish current content from the original publish.
- op: update_node
  id: REQ-013-034
  attrs:
    statement: |-
      Patient sees confirmation; review is live on provider profile and appears in Patient “Submitted Reviews” list. If the submission or edit matches a flagging rule, the review is also queued as B2.
- op: update_node
  id: REQ-013-035
  attrs:
    statement: |-
      Admin-imported authenticated reviews must be flagged as "Verified Off‑platform" with verification source and date. These are published directly by admin (no patient submission flow). Each is linked to a placeholder patient and a placeholder procedure. They count in the provider average and distribution.
- op: update_node
  id: REQ-013-038
  attrs:
    statement: |-
      Every admin add/edit/remove action records admin identity, timestamp, reason, and before/after changes. Audit records of patient edits and provider responses use the same entity, with an actor type and actor id.
- op: update_node
  id: REQ-013-042
  attrs:
    statement: |-
      For `Published` status (a `Flagged` review counts as `Published`, REQ-013-079), `Edit Review` is available unless a takedown request is `Pending`, and `Request Takedown` is available unless a request is `Pending` or the one further request after a rejection has been used. For `Removed` status, detail is read-only and shows admin removal reason; edit/takedown actions are hidden.
- op: update_node
  id: REQ-013-043
  attrs:
    statement: |-
      A review has at most one `Pending` takedown request. While a request is `Pending`, review remains `Published` unless manually removed by admin (which closes the request as `Approved`), and the patient cannot edit it. After a rejection the patient may file one further request with a new reason.
- op: update_node
  id: REQ-013-052
  attrs:
    statement: |-
      Reviewer alias algorithm (canonical, applied uniformly across Patient, Provider, and Admin public surfaces): `{first_name} {last_initial}.` (e.g., "Sarah M."); collisions within the same provider's review list are deduplicated with a numeric suffix (`Sarah M. 2`, `Sarah M. 3`, …). Admin views may unmask to full identity per RBAC. Admin-seeded reviews use an admin-entered `reviewer_display_name` field (free text, subject to the same PII-safety policy — no full last name, no contact info) instead of the algorithmic alias; the `Verified Off-platform` badge accompanies the display name. The alias is always used: there is no full-name option for patients or admins, and no display-policy setting.
- op: update_node
  id: REQ-013-057
  attrs:
    statement: |-
      Respond as Provider is visible only when the review is published (a Flagged review counts as published), the provider account is active, and the review has no active response (a removed response does not count). Submission records provider identity and timestamp and triggers patient notification (not sent when the review is an admin-seeded review linked to a placeholder patient, REQ-013-077). A suspended provider sees the review view-only, with no Respond control.
- op: update_node
  id: REQ-013-059
  attrs:
    statement: |-
      Only `Published` reviews (a `Flagged` review counts as `Published`, REQ-013-079) are visible on patient-facing provider/clinic profile surfaces. Only published reviews (including a `Flagged` review) appear in provider list surfaces.
- op: update_node
  id: REQ-013-069
  attrs:
    statement: |-
      Configurable with Restrictions: Flagging thresholds and auto-flag rules for admin review (within safe bounds approved by policy). Takedown decision SLA/queue prioritization parameters; the takedown decision deadline runs from 12 hours to 7 days and defaults to 48 hours.
- op: update_node
  id: REQ-013-070
  attrs:
    statement: |-
      Editable by Admin: review category labels (canonical keys remain fixed); photo guidelines text; removal reasons catalogue.
- op: update_node
  id: REQ-013-073
  attrs:
    statement: |-
      Trigger: Content flagged by system-automated detection (keyword matching, duplicate submission patterns, rate-limit triggers). User-initiated flagging is a future enhancement. Steps: System sets the review status to Flagged and queues the content for admin review; Admin resolves the flag on Screen 8 with a reason: uphold (the review returns to Published and the flag reason is cleared), redact (an admin edit) or unpublish (an admin removal). Outcome: Policy-compliant content remains; violations are removed with audit record. A flagged review stays publicly visible (shown as Published) until an admin removes it.
- op: update_node
  id: REQ-013-077
  attrs:
    statement: |-
      Each admin-seeded (off-platform) review MUST be linked to a placeholder patient and a placeholder procedure, so REQ-013-010 holds for every review. The admin add form takes the provider, treatment, ratings, text and review date, and a reason. The placeholder patient is not a person, so notices addressed to it are suppressed.
- op: update_node
  id: REQ-013-078
  attrs:
    statement: |-
      Admin Review Settings MUST include a takedown decision deadline setting, from 12 hours to 7 days, that defaults to 48 hours. When the deadline passes on a Pending request, the queue shows it as Overdue and admins are notified; no request is approved or rejected automatically.
- op: update_node
  id: REQ-013-079
  attrs:
    statement: |-
      A review with status Flagged MUST stay publicly visible until an admin removes it; patients and the public see it as Published. Every rule keyed on Published (visibility, patient Edit and Request Takedown, and provider Respond) also covers Flagged. An admin resolves a flag as uphold (back to Published, flag reason cleared), redact or unpublish.

# ---- Step and field updates -------------------------------------------------
- {op: update_node, id: STP-013-004, title: 'System re-runs flagging against the last admin redaction too, tracks the edit, writes the audit record and notifies the provider for information only'}
- {op: update_node, id: STP-013-011, title: 'Admin enters the review payload (provider, treatment, ratings, text, review date, reason) with source evidence'}
- {op: update_node, id: STP-013-022, title: 'System records before and after values, reason and admin identity, sets the Edited marker and notifies the reviewing patient'}
- {op: update_node, id: STP-013-061, title: 'System sets the status to Flagged and queues the content for admin review'}
- {op: update_node, id: STP-013-062, title: 'Admin resolves the flag with a reason: uphold, redact or unpublish'}
- op: update_node
  id: ENT-admin-action
  attrs:
    description: 'Immutable audit record of an action on a review, response, takedown request or setting: action type, reason, actor type and id (patient, provider or admin), timestamp and the changes made.'
- op: update_node
  id: ENT-admin-action.admin_id
  attrs:
    description: 'The admin who acted; set when the actor type is admin.'
- op: update_node
  id: ENT-review.response_status
  attrs:
    description: 'Whether the provider has an active response (Response status on Screens 5, 6 and 7). Shows No response again when the only response was removed by an admin.'
- op: update_node
  id: ENT-review-settings.takedown_sla
  attrs:
    description: 'Queue priority, SLA target and the takedown decision deadline (12 hours to 7 days, default 48 hours).'
- op: update_node
  id: SET-review-takedown-sla
  attrs:
    description: 'Queue priority and SLA target for takedown decisions, plus the takedown decision deadline, from 12 hours to 7 days. The deadline defaults to 48 hours; a breach shows Overdue and notifies admins.'

