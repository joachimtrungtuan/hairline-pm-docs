  - {"op": "update_node", "id": "REQ-026-116", "attrs": {"statement": "System MUST store the admin session Settings: concurrent sessions per admin user (1 to 5, default 3) and the admin inactivity timeout (whole minutes from 5 to 240, default 30). Failed admin sign-ins use the shared Max Login Attempts Setting of Screen 2 and there is no separate admin Setting; the fixed FR-031 endpoint throttle of 5 attempts per 15 minutes (REQ-031-100) applies in addition, whichever trips first. A Login as Provider session ends after its own fixed 30 minutes of inactivity (REQ-015-026) or when the admin's own session ends under the admin inactivity timeout, whichever comes first. When an admin signs in while already at the concurrent-session limit, the oldest session is ended and the new one opens. A change to the session limit or the inactivity timeout applies from each open session's next request; sessions above a lowered limit are ended oldest first (owner default 267; other option: refuse the new sign-in until an older session is closed). Consumer: FR-031."}}
  - {"op": "update_node", "id": "REQ-026-072", "attrs": {"statement": "Single global OTP expiry: the configured OTP Expiry Time applies uniformly to registration email verification and password reset OTP flows (no separate per-flow expiry). Re-verification and email-change codes follow FR-001 (fixed 15 minutes, REQ-001-098), are outside this setting, and are sent with the email verification template. In the email, {expiry_minutes} is the lifetime of the code being sent: the OTP Expiry Time for registration verification and password reset, the fixed 15 minutes for re-verification and email-change codes."}}
  - {"op": "update_node", "id": "REQ-026-073", "attrs": {"statement": "OTP configuration changes apply only to NEW OTP generation requests; existing OTP codes in users' inboxes retain their original expiry time. A resend always issues a new code under the expiry value in force at the moment of the resend; a code already sent keeps the lifetime it was sent with."}}
  - {"op": "update_node", "id": "REQ-026-106", "attrs": {"statement": "Template changes apply only to NEW OTP generation requests; users already in a verification flow continue with the previous template version and existing emails are unchanged. A resend is a new code and is sent with the template version and expiry value in force at the moment of the resend; only emails and codes already sent keep their original content."}}
  - {"op": "update_node", "id": "REQ-026-050", "attrs": {"statement": "All timestamps MUST be stored in UTC. Admin screens show times in the admin's browser timezone, with the zone named beside the time; the Timezone Options list (SET-timezone-options, REQ-026-121) is the choice offered to patients and providers only, never to admins.", "rationale": "General Module Rule 5; owner default 268 (other option: one platform-wide admin timezone set in settings)."}}
  - {"op": "update_node", "id": "REQ-026-143", "attrs": {"statement": "System MUST refuse a save that changes the Support Emergency Contact Phone or Email when it leaves both blank, with the message \"Set at least one emergency contact (phone or email).\"; a save that changes neither value is not checked, so other Screen 8 rows can be saved while both are blank, as at launch. While both are blank the patient Help & Support Hub hides the emergency contact section (REQ-035-040).", "rationale": "Logic review of the FR-026 PRD; owner default 269 (other option: block every Screen 8 save until one contact is set)."}}
  - {"op": "update_node", "id": "REQ-026-128", "attrs": {"statement": "Screen 4 MUST offer bulk import of countries from a CSV file with the columns Country Name, ISO Code, Calling Code and Display Order (optional) and no flag column, with validation of every row before anything is saved. An imported country is saved Inactive with the state \"flag missing\", which means its flag (ENT-country.flag_url) is empty, and cannot be activated until the admin uploads its flag."}}
  - {"op": "update_node", "id": "REQ-026-011", "attrs": {"statement": "System MUST store centrally managed country list: country name, ISO code, calling code, country flag asset URL (stored via S-05 Media Storage; required when an admin adds a country, the admin uploads the flag on Screen 4; a seeded country may have none and an imported country has none until uploaded), display order, active status"}}
  - {"op": "update_field", "id": "ENT-country.flag_url", "required": false}
  - {"op": "update_node", "id": "ENT-country.flag_url", "attrs": {"description": "Flag asset URL. Required when an admin adds a country by hand (REQ-026-011); a seeded country may have it empty and an imported country has it empty until the flag is uploaded. \"Flag missing\" means exactly this empty state, and a country with an empty flag cannot be set Active (REQ-026-128)."}}
