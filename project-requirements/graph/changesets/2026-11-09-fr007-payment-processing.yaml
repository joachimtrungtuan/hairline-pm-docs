  - {"op": "add_node", "id": "REQ-007-002", "type": "Rule", "title": "Card and bank transfer supported", "owner_fr": "FR-007", "attrs": {"statement": "System MUST support card and bank transfer methods for payments"}}
  - {"op": "add_node", "id": "REQ-007-003", "type": "Rule", "title": "Multiple currencies supported with accurate totals", "owner_fr": "FR-007", "attrs": {"statement": "System MUST support multiple currencies (at minimum USD, EUR, GBP, TRY) and display accurate totals"}}
  - {"op": "add_node", "id": "REQ-007-004", "type": "Rule", "title": "Receipts and invoices for successful payments and refunds", "owner_fr": "FR-007", "attrs": {"statement": "System MUST generate and deliver receipts/invoices for successful payments and refunds"}}
  - {"op": "add_node", "id": "REQ-007-005", "type": "Rule", "title": "Booking confirmed only on a successful initial charge; callbacks idempotent", "owner_fr": "FR-007", "attrs": {"statement": "System MUST confirm the existing accepted-selection booking only on a successful initial charge (deposit, eligible first installment, or full payment), mark it fully paid when its balance is settled, and process duplicate callbacks idempotently.", "rationale": "Scheduling installments alone is not confirmation. Eligible installment selection is owned by FR-007B and confirms booking only after its first successful charge. A retry or duplicate callback cannot create a second booking or change the accepted selection. Duplicate or late processor callbacks must not create another booking, replace the accepted choice, or bypass FR-006's confirmation rules; reconcile financial events under the existing payment/booking owners"}}
  - {"op": "add_node", "id": "REQ-007-006", "type": "Rule", "title": "Complete payment history per booking", "owner_fr": "FR-007", "attrs": {"statement": "System MUST maintain complete payment history per booking, including refunds and payout references"}}
  - {"op": "add_node", "id": "REQ-007-007", "type": "Rule", "title": "Platform commission computed per transaction and linked to payout", "owner_fr": "FR-007", "attrs": {"statement": "System MUST compute platform commission per transaction and link to provider payout records"}}
  - {"op": "add_node", "id": "REQ-007-008", "type": "Rule", "title": "No card numbers stored by the platform", "owner_fr": "FR-007", "attrs": {"statement": "System MUST ensure no card numbers are stored by the platform; only the processor handles them"}}
  - {"op": "add_node", "id": "REQ-007-009", "type": "Rule", "title": "All financial events logged", "owner_fr": "FR-007", "attrs": {"statement": "System MUST log all financial events with actor, timestamp, booking ID, and outcomes", "rationale": "All payment lifecycle events are logged for a tamper-evident audit trail Full audit trail for financial events and administrative actions affecting payouts and refunds"}}
  - {"op": "add_node", "id": "REQ-007-010", "type": "Rule", "title": "Additional authentication when required", "owner_fr": "FR-007", "attrs": {"statement": "System MUST support additional authentication for payments when required by issuer/regulation"}}
  - {"op": "add_node", "id": "REQ-007-011", "type": "Rule", "title": "Processor-driven authorization, capture and refund", "owner_fr": "FR-007", "attrs": {"statement": "System MUST support processor-driven payment flows for authorization, capture, and refund"}}
  - {"op": "add_node", "id": "REQ-007-012", "type": "Rule", "title": "Payout execution with commission deduction and statement generation", "owner_fr": "FR-007", "attrs": {"statement": "System MUST support payout execution with commission deduction and statement generation"}}
  - {"op": "add_node", "id": "REQ-007-013", "type": "Rule", "title": "Platform is Merchant of Record", "owner_fr": "FR-007", "attrs": {"statement": "Platform is Merchant of Record; platform issues patient invoices, manages refunds and tax implications, and pays out net to providers"}}
  - {"op": "add_node", "id": "REQ-007-014", "type": "Rule", "title": "Commission on the accepted price after promotion, deducted at payout", "owner_fr": "FR-007", "attrs": {"statement": "Commission is calculated on the accepted price after promotion (the FR-029 booking total) using the commission type (Percentage or Flat Rate) and value from the snapshot taken at booking confirmation, and is deducted at the time of provider payout after treatment completion (admin‑triggered); not pro‑rata across deposit/final", "rationale": "Commission is deducted at time of payout after treatment completion (admin-triggered), consistent with FR-007 Payment Flow V1 read from the commission snapshot taken at booking confirmation (FR-029), never from live configuration"}}
  - {"op": "add_node", "id": "REQ-007-015", "type": "Rule", "title": "Refunds need admin approval within two business days", "owner_fr": "FR-007", "attrs": {"statement": "Refunds require Admin approval with an SLA to approve/deny within 2 business days; the decision and reason are logged and notifications sent", "rationale": "Admin approval required for all refunds"}}
  - {"op": "add_node", "id": "REQ-007-016", "type": "Rule", "title": "Accepted snapshot is the commercial base for every payment view", "owner_fr": "FR-007", "attrs": {"statement": "All payment, receipt/invoice, provider/admin financial-detail, and refund views MUST use one FR-006 Booking's immutable accepted subquote snapshot as the commercial base; exclude sibling alternatives/live library prices and prevent component double-counting. The accepted promotion and discounted price are read from the snapshot and never recomputed; no promotion code can be entered, removed, or replaced at checkout or payment.", "rationale": "Payment amounts derive from the accepted subquote's offered price after the accepted promotion, as frozen in the acceptance snapshot, and are never recomputed. Do not price from a parent range, sum alternative packages/date rows, reload library prices, or add informational price components to an already complete offered total. The accepted promotion and discounted price are frozen at acceptance (FR-019). Checkout and payment offer no code entry, removal, replacement, or price-changing revalidation; do not mutate the AcceptanceEvent or reapply current promotion settings to payments."}}
  - {"op": "add_node", "id": "REQ-007-017", "type": "Rule", "title": "Initial payment guard before processor submission", "owner_fr": "FR-007", "attrs": {"statement": "Before initial processor submission, system MUST validate FR-006 selection eligibility, accepted versions, and exclusive unexpired hold ownership; invalid handoffs are blocked and hold expiry follows `Payment Window Expired`, without hold extension or quote reopening. Payment failure MUST NOT extend or restart the hold; only the FR-006 audited admin revive creates a new hold. Later confirmed-booking payments do not acquire a new acceptance hold.", "rationale": "**Initial Payment Guard**: Before calling the payment processor, validate the FR-006 handoff (FR-006 owns these checks): the booking is `Accepted`; the parent inquiry is not `Cancelled`; the parent quote and accepted subquote are still `Accepted`; the provider is still Active (FR-015); parent/subquote versions match the AcceptanceEvent (`acceptedSubquoteVersion = acceptedParentQuoteVersion`); and that event owns the unexpired exclusive appointment hold. Payment cannot select a different package, option/date-price record, appointment, or quote price. This hold guard applies to the first confirming charge, not to later installments/final payments on an already confirmed booking."}}
  - {"op": "add_node", "id": "REQ-007-018", "type": "Rule", "title": "Amount and currency read from the accepted snapshot", "owner_fr": "FR-007", "attrs": {"statement": "System MUST read the payment amount and the accepted patient currency/exchange-rate from the FR-005 accepted snapshot for initial and subsequent payments, never recomputed; checkout cannot change these values or reselect package/date/appointment/quote price.", "rationale": "Patient payment currency and applicable exchange rates come from the accepted snapshot and remain read-only throughout checkout and later payments Patient locale/system currency or market exchange rate changes after acceptance; payment currency/rates remain the accepted values, not a new checkout selection"}}
  - {"op": "add_node", "id": "REQ-007-019", "type": "Rule", "title": "Payment history resolves to the AcceptanceEvent and snapshot", "owner_fr": "FR-007", "attrs": {"statement": "Payment history MUST resolve through its booking to the AcceptanceEvent, accepted parent/subquote IDs, equal aggregate versions, selected option/date-price provenance, and original snapshot; subsequent authorized admin interventions (FR-006 revive, appointment change, cancellation, and provider-fault transfer) remain separately recorded."}}
  - {"op": "add_node", "id": "REQ-007-020", "type": "Rule", "title": "First successful initial payment confirms booking and consumes the promotion use", "owner_fr": "FR-007", "attrs": {"statement": "On the first successful initial payment, System MUST confirm the booking, create its appointment record from the hold (FR-006), and, for a provider-selected promotion or patient-entered code, consume the promotion use reserved at acceptance (FR-019 REQ-019-014). An automatic promotion's use is consumed at acceptance and follows FR-019 REQ-019-015.", "rationale": "The appointment record is created only on successful initial payment; before that, only the temporary hold keyed by provider, appointment date/time, and time zone exists (FR-006)."}}
  - {"op": "add_node", "id": "REQ-007-021", "type": "Rule", "title": "Payment Window Expired applies only to the first payment step", "owner_fr": "FR-007", "attrs": {"statement": "`Payment Window Expired` MUST apply only to the first payment step, as stated in FR-006 (REQ-006-016). A missed later installment or final payment MUST NOT cause `Payment Window Expired`, booking cancellation, or inquiry cancellation.", "rationale": "A missed later installment or final payment never causes `Payment Window Expired`, booking cancellation, or inquiry cancellation; it is flagged and notified."}}
  - {"op": "add_node", "id": "REQ-007-022", "type": "Rule", "title": "Provider fault after acceptance blocks payment and credits or refunds paid money", "owner_fr": "FR-007", "attrs": {"statement": "When a provider fault after acceptance closes a booking (FR-006 Alternative Flow B5), System MUST block further payment against it and treat money already paid under the B5 placeholder: credit toward the replacement booking, refund of any unused part, and no patient fee. Detailed mechanics are defined in the payment pass.", "rationale": "Provider fault after acceptance follows FR-006 Alternative Flow B5 (Alternative Flow B4 above); paid money follows its placeholder, with detailed mechanics deferred to the payment pass."}}
  - {"op": "add_node", "id": "REQ-007-023", "type": "Rule", "title": "Provider sees booking payment status, progress, payouts and statements", "owner_fr": "FR-007", "attrs": {"statement": "View booking payment status (unpaid/deposit paid/final paid/refunded); View patient payment progress (deposit status, installment progress, final payment status); View upcoming and completed payouts with commission deducted (payout execution managed in FR-017); Access payout statements for accounting (generated in FR-017)"}}
  - {"op": "add_node", "id": "REQ-007-024", "type": "Rule", "title": "Admin monitors payment progress, details and reminders across bookings", "owner_fr": "FR-007", "attrs": {"statement": "View patient payment progress across all bookings (deposit status, installment progress, final payment status) as part of patient management oversight; View payment details with full context from inquiry/quote/booking stages for patient journey tracking; Monitor payment status and send payment reminders to patients; Access payment information when managing patient accounts and resolving disputes", "rationale": "Admin can send payment reminders to patients"}}
  - {"op": "add_node", "id": "REQ-007-025", "type": "Rule", "title": "Admin reconciliation dashboards and payment/commission report export", "owner_fr": "FR-007", "attrs": {"statement": "View reconciliation dashboards and export payment/commission reports; Monitor financial reconciliation data and payment operations"}}
  - {"op": "add_node", "id": "REQ-007-026", "type": "Rule", "title": "Patient views receipts, invoices and payment history", "owner_fr": "FR-007", "attrs": {"statement": "View receipts/invoices and payment history"}}
  - {"op": "add_node", "id": "REQ-007-027", "type": "Rule", "title": "Payment notices in scope: confirmations, reminders, refund and payout notices", "owner_fr": "FR-007", "attrs": {"statement": "Payment confirmations (deposit, final) to patient; Payment reminders for upcoming final payment; Refund confirmations to patient and provider; Payout notifications to provider after execution", "rationale": "sends confirmation to patient and provider Triggers on payment lifecycle events"}}
  - {"op": "add_node", "id": "REQ-007-028", "type": "Rule", "title": "SMS payment notifications not available in MVP", "owner_fr": "FR-007", "attrs": {"statement": "SMS payment notifications are not available in MVP and will only be enabled in a future phase via S-03/FR-020/FR-030"}}
  - {"op": "add_node", "id": "REQ-007-029", "type": "Rule", "title": "Entry points to payment and refund", "owner_fr": "FR-007", "attrs": {"statement": "Patient initiates payment in booking confirmation flow (deposit required); Patient initiates final payment from booking details prior to procedure date; Admin processes refunds per cancellation policy (refund amounts per FR-006)"}}
  - {"op": "add_node", "id": "REQ-007-030", "type": "Rule", "title": "Only authenticated patients can pay and view receipts", "owner_fr": "FR-007", "attrs": {"statement": "Only authenticated patients can pay and view receipts"}}
  - {"op": "add_node", "id": "REQ-007-031", "type": "Rule", "title": "Patient reviews the accepted summary, payable total, deposit and remaining balance before paying", "owner_fr": "FR-007", "attrs": {"statement": "Patient reviews the accepted subquote summary (selected package/services, date range, appointment/timezone, offered price, accepted promotion and discounted price, locked currency), payable booking total, deposit amount, and remaining balance."}}
  - {"op": "add_node", "id": "REQ-007-032", "type": "Rule", "title": "Supported payment methods and applicable fees shown at checkout", "owner_fr": "FR-007", "attrs": {"statement": "System displays supported payment methods and any applicable fees/requirements"}}
  - {"op": "add_node", "id": "REQ-007-033", "type": "Rule", "title": "Checkout breakdown of total, deposit, remaining balance and currency", "owner_fr": "FR-007", "attrs": {"statement": "Show clear breakdown: total, deposit, remaining balance, currency", "rationale": "View the locked accepted currency; see clear totals, fees, and remaining balance"}}
  - {"op": "add_node", "id": "REQ-007-034", "type": "Rule", "title": "Deposit is a configurable percentage of the booking total collected at booking confirmation", "owner_fr": "FR-007", "attrs": {"statement": "Deposit payment is collected at booking confirmation (admin-configurable percentage, default 20-30% range, configured via FR-029); final payment before or on procedure day", "rationale": "Admin-configurable percentage (default 20-30% range, configured via FR-029) of the booking total (accepted price after promotion, from the acceptance snapshot); within allowed range Default deposit set to 20-30% range (admin-configurable via FR-029) unless provider-specific override exists The FR-029 booking total (accepted price after promotion, from the acceptance snapshot) is the single base for the deposit percentage, instalment amounts, and commission."}}
  - {"op": "add_node", "id": "REQ-007-035", "type": "Rule", "title": "Full payment always available as an alternative to split payments", "owner_fr": "FR-007", "attrs": {"statement": "Full payment option is always available as an alternative to split payments"}}
  - {"op": "add_node", "id": "REQ-007-036", "type": "Rule", "title": "Final payment due before or on procedure date; overdue payments flagged and notified", "owner_fr": "FR-007", "attrs": {"statement": "Final payment is due before or on procedure date; overdue payments are flagged and notified", "rationale": "If payment overdue, flag booking and notify admin; an overdue final payment never causes `Payment Window Expired` or booking cancellation (FR-006)"}}
  - {"op": "add_node", "id": "REQ-007-037", "type": "Rule", "title": "Final payment screen shows due date and countdown to procedure date", "owner_fr": "FR-007", "attrs": {"statement": "Display due date and countdown to procedure date"}}
  - {"op": "add_node", "id": "REQ-007-038", "type": "Rule", "title": "Final payment reminders three days before and on the due date", "owner_fr": "FR-007", "attrs": {"statement": "Send reminder 3 days before due date and on due date"}}
  - {"op": "add_node", "id": "REQ-007-039", "type": "Rule", "title": "One invoice record per booking, updated for later payments", "owner_fr": "FR-007", "attrs": {"statement": "Receipts and invoice/payment documents are generated for every successful transaction; FR-017 retains one invoice record per booking, updated for later payments rather than duplicating it per option/charge.", "rationale": "generates receipt and invoice from that booking's recorded terms"}}
  - {"op": "add_node", "id": "REQ-007-040", "type": "Rule", "title": "Provider payout only after treatment completion and admin-triggered execution", "owner_fr": "FR-007", "attrs": {"statement": "Provider payout occurs only after treatment completion and admin-triggered execution", "rationale": "After treatment completion, provider payout becomes eligible (payout execution handled in FR-017: Admin Billing & Financial Management) Admin marks treatment completion; provider cannot self-execute payouts (payout execution in FR-017)"}}
  - {"op": "add_node", "id": "REQ-007-041", "type": "Rule", "title": "Up to three automatic retries with backoff for transient failures", "owner_fr": "FR-007", "attrs": {"statement": "**Retry Policy (Constitution-aligned)**: For transient processor/network failures, Payment Service MUST perform up to 3 automatic retries using exponential backoff with jitter (and idempotency) before marking a payment attempt failed; hard declines require explicit patient action to retry.", "rationale": "System classifies failure type (hard decline vs transient error). surface progress and final failure to patient if retries exhaust"}}
  - {"op": "add_node", "id": "REQ-007-042", "type": "Rule", "title": "Hard decline shows a clear error; patient retries or picks another method against the same snapshot", "owner_fr": "FR-007", "attrs": {"statement": "For hard declines, System displays clear error and suggested next steps (retry, use different method). Patient retries or selects another method against the same accepted snapshot while the original FR-006 hold remains valid.", "rationale": "Display clear error messaging and retry options on failure Booking remains unconfirmed until successful initial payment; failure/retry does not change the accepted selection."}}
  - {"op": "add_node", "id": "REQ-007-043", "type": "Rule", "title": "Failed or abandoned authentication leaves payment incomplete; retry only while the original hold is active", "owner_fr": "FR-007", "attrs": {"statement": "Payment remains incomplete until successful authentication; booking not confirmed. Retrying is allowed only while the original FR-006 hold remains active; an authentication challenge does not restart the payment window.", "rationale": "System informs patient of the authentication requirement and guides action If challenge fails or times out, System presents retry and alternative method options Hold expires during an authentication challenge; retry cannot extend/recreate the hold or bypass FR-006 eligibility; only an FR-006 audited admin revive starts a new hold"}}
  - {"op": "add_node", "id": "REQ-007-044", "type": "Rule", "title": "Expired selection stays blocked; AcceptanceEvent retained; recovery by new inquiry or admin revive", "owner_fr": "FR-007", "attrs": {"statement": "On hold expiry, FR-006 releases the hold, creates no appointment record, and records `Payment Window Expired`; payment against that accepted selection remains blocked. Retain the AcceptanceEvent and snapshot unchanged. Do not reopen the parent quote or make the accepted subquote selectable again; recovery is by cancelling the inquiry and starting a new inquiry, or by the FR-006 audited admin revive.", "rationale": "`Payment Window Expired` blocks further payment against that selection without reopening its parent/subquote; only the FR-006 audited admin revive creates a new hold."}}
  - {"op": "add_node", "id": "REQ-007-045", "type": "Rule", "title": "Admin revive starts a new hold and re-takes a promotion use", "owner_fr": "FR-007", "attrs": {"statement": "An admin revive does not extend the expired hold. It starts a new hold of the FR-026 slot-hold duration at the revive time and, where the accepted promotion has a usage limit, takes one use again (re-reserved for a provider-selected promotion or patient-entered code, taken again for an automatic promotion; the revive is rejected if the limit has no room); initial payment then runs the Initial Payment Guard against that new hold."}}
  - {"op": "add_node", "id": "REQ-007-046", "type": "Rule", "title": "Replacement booking takes its amount and currency from the replacement quote's snapshot", "owner_fr": "FR-007", "attrs": {"statement": "The replacement booking takes its payable amount and currency from the replacement quote's acceptance snapshot and follows the main flow."}}
  - {"op": "add_node", "id": "REQ-007-047", "type": "Rule", "title": "Provider direct contact details hidden until booking confirmed", "owner_fr": "FR-007", "attrs": {"statement": "Do not reveal provider direct contact details until booking confirmed"}}
  - {"op": "add_node", "id": "REQ-007-048", "type": "Rule", "title": "Checkout gives processing feedback, keeps entered details and blocks payment until fields are valid", "owner_fr": "FR-007", "attrs": {"statement": "Disable payment button until all required fields are valid; Show progress indicator during processing; avoid blocking UI for more than a few seconds without feedback; Preserve entered details if payment attempt fails to allow quick retry"}}
  - {"op": "add_node", "id": "REQ-007-049", "type": "Rule", "title": "Checkout shows a hold countdown and disables payment after expiry", "owner_fr": "FR-007", "attrs": {"statement": "display countdown and disable payment after expiry"}}
  - {"op": "add_node", "id": "REQ-007-050", "type": "Rule", "title": "Payment and payout data is read-only for the provider", "owner_fr": "FR-007", "attrs": {"statement": "Provider can see payment progress but cannot modify payment information; All payment data is read-only for provider; All payout data is read-only for provider (payout execution is admin-controlled in FR-017)"}}
  - {"op": "add_node", "id": "REQ-007-051", "type": "Rule", "title": "Payment status reflects real-time payment progress", "owner_fr": "FR-007", "attrs": {"statement": "Payment status reflects real-time payment progress (deposit, installments, final payment)", "rationale": "Payment status updates in real-time as patient makes payments"}}
  - {"op": "add_node", "id": "REQ-007-052", "type": "Rule", "title": "Payment views show data from previous stages in chronological order", "owner_fr": "FR-007", "attrs": {"statement": "All sections display data from previous stages (inquiry → quote → booking → payment) in chronological order"}}
  - {"op": "add_node", "id": "REQ-007-053", "type": "Rule", "title": "Payment details shown without card information", "owner_fr": "FR-007", "attrs": {"statement": "Payment details shown without card information (PCI compliance)"}}
  - {"op": "add_node", "id": "REQ-007-054", "type": "Rule", "title": "Payout visible only after treatment marked complete by admin", "owner_fr": "FR-007", "attrs": {"statement": "Payout visible only after treatment marked complete by admin"}}
  - {"op": "add_node", "id": "REQ-007-055", "type": "Rule", "title": "Payout calculated on the total paid amount, not just the deposit", "owner_fr": "FR-007", "attrs": {"statement": "Payout calculation based on total paid amount (not just deposit)"}}
  - {"op": "add_node", "id": "REQ-007-056", "type": "Rule", "title": "Net payout is gross minus commission", "owner_fr": "FR-007", "attrs": {"statement": "Gross minus commission"}}
  - {"op": "add_node", "id": "REQ-007-057", "type": "Rule", "title": "Payout history accessible for accounting", "owner_fr": "FR-007", "attrs": {"statement": "History of payouts accessible for accounting"}}
  - {"op": "add_node", "id": "REQ-007-058", "type": "Rule", "title": "Payout blocked until completion status is resolved by admin", "owner_fr": "FR-007", "attrs": {"statement": "Payout blocked due to missing completion status; admin resolves before execution"}}
  - {"op": "add_node", "id": "REQ-007-059", "type": "Rule", "title": "Provider payout currency follows existing configuration and the locked conversion contract", "owner_fr": "FR-007", "attrs": {"statement": "provider payout currency follows existing configuration and the locked conversion contract"}}
  - {"op": "add_node", "id": "REQ-007-060", "type": "Rule", "title": "Admin dashboard lists payment progress for all bookings and providers with filters", "owner_fr": "FR-007", "attrs": {"statement": "Admin can view payment progress for all bookings across all providers; Filtering options: Payment Status, Provider, Date Range, Overdue Payments"}}
  - {"op": "add_node", "id": "REQ-007-061", "type": "Rule", "title": "Admin payment data is read-only except refund processing and reminders", "owner_fr": "FR-007", "attrs": {"statement": "All payment data is read-only except for refund processing and reminder actions", "rationale": "All payment data in dashboard is read-only"}}
  - {"op": "add_node", "id": "REQ-007-062", "type": "Rule", "title": "Links to inquiry, snapshot, parent revision and booking preserve the audit trail", "owner_fr": "FR-007", "attrs": {"statement": "Links to the inquiry, accepted subquote snapshot, parent revision, and booking preserve the audit trail; the current editable quote is not the pricing source."}}
  - {"op": "add_node", "id": "REQ-007-063", "type": "Rule", "title": "Refunds follow the cancellation policy ladder", "owner_fr": "FR-007", "attrs": {"statement": "Refunds follow FR-006 cancellation policy: >30 days before = 90% refund; 15-30 days before = 50% refund; <15 days before = no refund (unless medical emergency with documentation)", "rationale": "Refund amount calculation is based on FR-006 cancellation policy"}}
  - {"op": "add_node", "id": "REQ-007-064", "type": "Rule", "title": "Refund exceptions need secondary admin approval and documentation", "owner_fr": "FR-007", "attrs": {"statement": "Exceptions to policy (e.g., medical emergency) require secondary admin approval and documentation upload; Refund requested outside policy window; admin records exception with documentation", "rationale": "Refund exceptions (e.g., medical emergency) require documentation and admin approval; refund amounts per FR-006 cancellation policy"}}
  - {"op": "add_node", "id": "REQ-007-065", "type": "Rule", "title": "Refund goes to the original payment method unless admin selects another", "owner_fr": "FR-007", "attrs": {"statement": "Refund processed to original payment method by default; admin can select alternative method"}}
  - {"op": "add_node", "id": "REQ-007-066", "type": "Rule", "title": "Refund cannot exceed the total paid amount", "owner_fr": "FR-007", "attrs": {"statement": "Refund amount cannot exceed total paid amount"}}
  - {"op": "add_node", "id": "REQ-007-067", "type": "Rule", "title": "Refund actions audited with timestamp, actor, reason and approval chain", "owner_fr": "FR-007", "attrs": {"statement": "All refund actions are auditable with timestamp, actor, reason, and approval chain"}}
  - {"op": "add_node", "id": "REQ-007-068", "type": "Rule", "title": "Refund reason is mandatory, at least 20 characters", "owner_fr": "FR-007", "attrs": {"statement": "Mandatory audit field; min 20 characters"}}
  - {"op": "add_node", "id": "REQ-007-069", "type": "Rule", "title": "Refund updates booking status and notifies patient and provider", "owner_fr": "FR-007", "attrs": {"statement": "Refund processing updates booking status and notifies patient and provider", "rationale": "Refund processed according to FR-006 cancellation policy; provider payout eligibility updated"}}
  - {"op": "add_node", "id": "REQ-007-070", "type": "Rule", "title": "Payment PII protected and encrypted at rest and in transit", "owner_fr": "FR-007", "attrs": {"statement": "All payment-related PII is protected per privacy standards and encrypted at rest and in transit"}}
  - {"op": "add_node", "id": "REQ-007-071", "type": "Rule", "title": "Payment data access by role: patients own, providers payout-related, admins system-wide", "owner_fr": "FR-007", "attrs": {"statement": "Access to payment data follows RBAC: patients see their own transactions; providers see payout-related booking financials; admins see system-wide financials", "rationale": "RBAC enforced across tenants; providers see only payout-related financials for their bookings"}}
  - {"op": "add_node", "id": "REQ-007-072", "type": "Rule", "title": "PCI-DSS, GDPR and HIPAA-aligned handling; no cross-tenant database sharing", "owner_fr": "FR-007", "attrs": {"statement": "Compliance: PCI-DSS (via processor), GDPR/HIPAA-aligned handling of personal and medical data; no direct database sharing across tenants"}}
  - {"op": "add_node", "id": "REQ-007-073", "type": "Rule", "title": "Supported payment methods and currencies enabled or disabled in FR-029", "owner_fr": "FR-007", "attrs": {"statement": "Supported payment methods and currencies (enable/disable) - managed via FR-029"}}
  - {"op": "add_node", "id": "REQ-007-074", "type": "Rule", "title": "Admin editable: refund approvals and reasons within the cancellation policy", "owner_fr": "FR-007", "attrs": {"statement": "Refund approvals and reasons (within FR-006 cancellation policy)"}}
  - {"op": "add_node", "id": "REQ-007-075", "type": "Rule", "title": "Security controls, financial audit scope and duplicate-charge protections are fixed in code", "owner_fr": "FR-007", "attrs": {"statement": "Fixed in Codebase (Not Editable): Core security controls and encryption standards; Audit logging scope for financial events; Idempotency and duplicate-charge protections", "rationale": "All financial events require idempotent handling to prevent duplicates"}}
  - {"op": "add_node", "id": "REQ-007-076", "type": "Rule", "title": "Reminder timing and payout execution windows configurable with restrictions", "owner_fr": "FR-007", "attrs": {"statement": "Configurable with Restrictions: Payment reminder timing templates (e.g., 3 days before due date); Payout execution timing windows (e.g., business days)"}}
  - {"op": "add_node", "id": "REQ-007-077", "type": "Rule", "title": "One booking's payments resolve one accepted subquote; no fan-out into sibling bookings", "owner_fr": "FR-007", "attrs": {"statement": "One booking's payments resolve one accepted subquote and its AcceptanceEvent; payment attempts and callbacks cannot fan out into sibling-option bookings."}}
  - {"op": "add_node", "id": "REQ-007-078", "type": "Rule", "title": "Confirmed payments, refunds and payouts are immutable; adjustments by corrective entry", "owner_fr": "FR-007", "attrs": {"statement": "Payment records, refunds, and payouts must be immutable once confirmed, with corrective entries for adjustments"}}
  - {"op": "add_node", "id": "REQ-007-079", "type": "Rule", "title": "Show the complete offered price when component itemization is missing", "owner_fr": "FR-007", "attrs": {"statement": "Accepted pricing lacks optional component itemization; show the complete offered price without inventing treatment/package components"}}
  - {"op": "add_node", "id": "REQ-007-080", "type": "Rule", "title": "Payment challenge resumes gracefully when the device loses focus", "owner_fr": "FR-007", "attrs": {"statement": "Payment challenge required but device/app loses focus; flow must resume gracefully"}}
  - {"op": "add_node", "id": "REQ-007-081", "type": "Rule", "title": "Remaining balance is the payable total less successful payments and authorized adjustments", "owner_fr": "FR-007", "attrs": {"statement": "reconciled payable total less recorded successful payments and authorized adjustments"}}
  - {"op": "add_node", "id": "REQ-007-082", "type": "Rule", "title": "Total paid is the sum of all payments made", "owner_fr": "FR-007", "attrs": {"statement": "Sum of all payments made"}}
  - {"op": "add_node", "id": "REQ-007-083", "type": "Rule", "title": "Final payment marks the booking fully paid and issues the final receipt", "owner_fr": "FR-007", "attrs": {"statement": "System processes final payment and updates booking to fully paid; issues final receipt/invoice; sends confirmations"}}
  - {"op": "add_node", "id": "REQ-007-084", "type": "Rule", "title": "Full payment confirms the same booking and marks it fully paid", "owner_fr": "FR-007", "attrs": {"statement": "Patient selects full payment for the same accepted subquote's booking; the Initial Payment Guard still applies. System processes that booking's payable full amount and marks the same booking Confirmed and fully paid."}}
  - {"op": "add_node", "id": "REQ-007-085", "type": "Rule", "title": "Duplicate submission from rapid taps produces a single charge", "owner_fr": "FR-007", "attrs": {"statement": "Duplicate submission from rapid taps; idempotency ensures single charge", "rationale": "Given a payment failure, When the patient retries with a different method, Then the system prevents duplicate charges and confirms only a single successful payment."}}
  - {"op": "add_node", "id": "REQ-007-086", "type": "Rule", "title": "Admin refund denial is recorded with reason and the patient is notified", "owner_fr": "FR-007", "attrs": {"statement": "When admin denies refund per policy, Then the system records the decision with reason and notifies the patient"}}
