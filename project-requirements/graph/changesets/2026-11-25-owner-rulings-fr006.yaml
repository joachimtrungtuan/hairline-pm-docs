  - {"op": "add_node", "id": "REQ-006-086", "type": "Rule", "owner_fr": "FR-006", "title": "Admin closes an In Progress case early with no fault on Screen 11", "attrs": {"statement": "When an `In Progress` case cannot be completed and the provider is not at fault, an admin MAY close it early on Screen 11 with the route \"Move to Aftercare, no fault\" (Alternative Flow B9; FR-010 Rule 17, REQ-010-079, REQ-010-116), with a mandatory reason, confirmation and audit entry. System MUST move the booking to `Aftercare` from the decision date (the aftercare start date handed to FR-011), record the closure cause `NoFaultEarlyClose`, set no `supportRequired` marker and hold no payout, apply the admin-set patient refund amount (zero up to the full amount paid) as an exception refund under the FR-007 approval rule, make the provider's share (what is left after the refund and the Hairline commission) eligible for payout on the decision date with no waiting window, and signal FR-010 and FR-011 for the Closed Early record status and the post-op instructions.", "rationale": "Screen 11 route Move to Aftercare, no fault, and Screen 6 action Close Case Early, No Fault. FR-010 REQ-010-116 and Rule 17 own the record status, the reminders and the payout trigger; FR-006 owns the decision screen."}}
