reason: "FR-029 logic review pass 2: align the graph with PRD v1.18 (rate set locked at quote acceptance and the USD fallback from it, fee amounts stored with their currency code and re-entered after a Default Currency change, Not set starting values for the fees and a 0-day grace period, balance due days locked at confirmation, cancellation point counted from the oldest unpaid due date with a warning before the late fee day, countries of Inactive or Archived accounts treated as unassigned, Live on production and Test elsewhere, payment methods checked against the charge currency, Acknowledge baseline for rate protection, Reset to global default for provider deposit rates, dashboard banner for an unset share, procedure date wording)"
by: docs-manager
operations:
  - {"op": "update_node", "id": "REQ-029-055", "title": "Global Fallback account covers unmapped countries and a failing mapped account", "attrs": {"statement": "System MUST support an optional Stripe account marked as Global Fallback used when no country/regional grouping mapping exists, or when the mapped account fails authentication (at most 1 Global Fallback account) (REQ-029-055)"}}
  - {"op": "update_node", "id": "REQ-029-010", "attrs": {"statement": "System MUST allow admins to configure a global rate protection threshold (1-50% range). System monitors each auto-fetch pair independently and marks the pair's status as yellow/warning and sends an alert notification when the pair's rate differs from its rate 24 hours earlier by more than the threshold. The warning clears only when an admin acknowledges it. After an acknowledgement the pair is compared with the rate at that moment until the change against the rate 24 hours earlier is again within the threshold, and no comparison runs for 24 hours after a pair is created or switched between modes"}}
  - {"op": "update_node", "id": "REQ-029-058", "title": "A currency with no pair is collected in USD from the locked rate set", "attrs": {"statement": "For any currency not configured as a pair, the system MUST fall back to collecting payment in USD, converted at the quote-to-USD rate in the rate set locked at quote acceptance, with the markup per Payment Rule 3. The admin dashboard MUST display a note informing admins of this fallback behavior. (REQ-029-058)"}}
  - {"op": "update_node", "id": "REQ-029-023", "attrs": {"statement": "System MUST allow admins to configure the late payment grace period (0-14 days, starting at 0), counted from the installment due date. The late fee is charged once, after the grace period and the automatic retries have ended"}}
  - {"op": "update_node", "id": "REQ-029-049", "attrs": {"statement": "System MUST lock payment configuration only at its named lock points: the currency conversion rate set at FR-005 subquote acceptance; the commission configuration, deposit rate, split payment settings, refund ladder, rescheduling fee, late payment fee (a fixed amount with its currency code), grace period, balance due days (as a balance due date stored on the booking), unpaid balance cancellation point and installment cutoff at FR-006 booking confirmation; nothing at quote creation or sending. Hairline's share of a cancellation fee, the clinic cancellation deduction and the patient confirmation window apply on the day of the event"}}
  - {"op": "update_node", "id": "REQ-029-140", "attrs": {"statement": "System MUST compare the booking total with the Minimum Booking Amount for installments in USD: a booking total in another currency is converted to USD with the quote-to-USD base rate in the rate set locked at FR-005 subquote acceptance, without markup, before the comparison."}}
  - {"op": "update_node", "id": "REQ-029-143", "attrs": {"statement": "System MUST allow admins to set a late payment fee and a rescheduling fee on Screen 7. For each fee the admin chooses the type (fixed amount or percentage) and enters the value; both fees start as Not set, and no such fee is charged while it is not set. A fixed amount must be above 0, is stated in the Fee Currency and is converted via USD with the rate set locked at quote acceptance; the late fee percentage is of the late installment. Both fees are locked at booking confirmation (a fixed amount with its currency code; a booking confirmed while a fee is Not set keeps no such fee). Hairline keeps both fees; they change no provider payout. The rescheduling fee never applies to a change an admin makes in V1."}}
  - {"op": "update_node", "id": "REQ-029-144", "attrs": {"statement": "System MUST charge the late payment fee once, when the late payment grace period (counted from the due date) has passed with the installment unpaid and the automatic retries have ended; it is collected with the next successful charge and stays outside the clinic share and the refund base. No fee is charged while the late payment fee is Not set."}}
  - {"op": "update_node", "id": "REQ-029-146", "title": "Balance due days default to 7, range from 1 to 30 and lock at booking confirmation", "attrs": {"statement": "System MUST treat the balance of the deposit-now, balance-later option as due 7 days before the procedure date by default, MUST allow admins to edit it on Screen 7 within 1 to 30 days, and MUST lock it at booking confirmation as a balance due date stored on the booking (FR-007), so a later change never moves it. A booking confirmed with this many days left, or fewer, gets full payment only.", "rationale": "FR-029 PRD, Screen 7 Balance Due Days."}}
  - {"op": "update_node", "id": "REQ-029-147", "attrs": {"statement": "System MUST allow admins to set, on Screen 7, the unpaid balance cancellation point: 1 to 30 days after the oldest unpaid due date (the due date of the oldest installment or balance that is unpaid right now; paying it late restarts the count from the next unpaid one), at which a booking with any unpaid balance (deposit and balance, or installments) is cancelled. It applies only to bookings confirmed after it is set, wins over pending retries and the Defaulted state, and does nothing while it is not set. It must be smaller than the balance due days and smaller than the installment cutoff."}}
  - {"op": "update_node", "id": "REQ-029-148", "attrs": {"statement": "System MUST allow admins to set Hairline's share of a patient cancellation fee on Screen 7. It has no starting value and may be Not set; while it is not set Hairline keeps the whole fee and holders of the Screen 7 permission see a banner on the admin dashboard asking them to set it, which clears when the share is saved."}}
  - {"op": "update_node", "id": "REQ-029-150", "attrs": {"statement": "System MUST allow admins to set the clinic cancellation deduction on Screen 7: a fixed amount above 0 in the Fee Currency with no starting value, which FR-017 reads; no deduction is made while it is not set."}}
  - {"op": "update_node", "id": "REQ-029-152", "title": "Only accounts of the deployment mode are routed, and the Global Fallback is Active", "attrs": {"statement": "System MUST consider only Live-mode Stripe accounts for routing on a production deployment and only Test-mode accounts elsewhere. The Global Fallback account MUST be Active and Live on production (Test elsewhere) and cannot be set Inactive or Archived. A country held by an Inactive or Archived account MUST be treated as unassigned for routing, and such an account may hold no countries. An override that would leave a non-fallback account with no countries MUST be refused at the confirmation step of Alternative Flow A1.", "rationale": "FR-029 PRD, Screen 1, Business Rules and Boundary Flow B6."}}
  - {"op": "update_node", "id": "REQ-029-153", "title": "A routed account that does not support the booking currency is charged in USD from the locked rate set", "attrs": {"statement": "System MUST charge a booking in USD when the routed Stripe account does not support the booking currency, converting at the quote-to-USD rate in the booking's locked rate set with the markup per Payment Rule 3, and MUST check the payment methods against the charge currency after that fallback."}}
  - {"op": "update_node", "id": "REQ-029-155", "attrs": {"statement": "System MUST let an admin acknowledge a pair's rate-protection warning on Screen 2B, log the acknowledgement, and clear the warning only by that action; afterwards the pair is compared with the rate at that moment until the change against the rate 24 hours earlier is again within the threshold."}}
  - {"op": "update_node", "id": "REQ-029-156", "title": "Fixed fee amounts are stored with their currency and re-entered when the Default Currency changes", "attrs": {"statement": "System MUST state each fixed fee amount on Screen 7 (late payment fee, rescheduling fee, clinic cancellation deduction) in the Fee Currency, store and lock it together with its currency code, and MUST NOT reinterpret it when the Default Currency changes: after a Default Currency change Screen 7 cannot be saved until each fixed amount that is set has been re-entered in the new currency, and a currency in use as the Fee Currency cannot be disabled."}}
  - {"op": "update_node", "id": "REQ-029-101", "attrs": {"statement": "Rule 1: Payment configuration changes never alter a value that has already been locked. Each configuration is locked at a named point: (a) the currency conversion rate set (base rates and markups, each with its timestamp) is locked when the patient accepts a subquote in FR-005 and is stored in the acceptance snapshot (Currency Rule 2); (b) the effective commission configuration, the deposit rate, and the split payment (installment) settings are locked at FR-006 booking confirmation and stored with the booking; (c) no payment configuration is frozen when a parent quote or subquote is created or sent in FR-004; (d) the refund ladder, the rescheduling fee, the late payment fee (a fixed amount together with its currency code; Not set stays Not set), the late payment grace period, the balance due days (kept as a balance due date stored on the booking), the unpaid balance cancellation point and the installment cutoff are locked at FR-006 booking confirmation, while Hairline's share of a patient cancellation fee, the clinic cancellation deduction and the patient confirmation window are read on the day the event happens and are not locked; (e) the Stripe account that takes a booking's first payment is stored with the booking and used for every later charge and refund of that booking; (f) a locked rate set survives the deletion of any of its currency pairs. Before its lock point, a quote or accepted-but-unconfirmed subquote follows the configuration that is effective at that moment, and an active installment plan keeps the settings locked at its booking confirmation. When FR-019 expresses a fixed-amount promotion in the quote currency at quote send, it uses the currency conversion rate (including markup) in effect at send; this sets the promotion amount on the quote only and does not lock the conversion rate for payment, which stays locked at acceptance under (a). (REQ-029-101)"}}
  - {"op": "update_node", "id": "REQ-029-103", "attrs": {"statement": "Payment Rule 3: Currency conversion markup applies to all transactions involving currency conversion, including the USD fallback charge (protects against bank rate differences). A price shown in a currency that is neither the quote currency nor USD is derived via USD with the markup applied once, on the pair for the shown currency (REQ-029-103)"}}
  - {"op": "update_node", "id": "REQ-029-105", "attrs": {"statement": "Payment Rule 6: A missed installment is followed by reminders and automatic payment retries (timing owned by FR-007B); when the retries have failed, an admin is flagged to follow up. The late payment fee is charged once, after the grace period and the retries have ended (Late Fee Rule). A booking whose balance is still unpaid at the unpaid balance cancellation point (Screen 7, counted in days after the oldest unpaid due date) is cancelled: this wins over pending retries and the Defaulted state, covers any unpaid balance (deposit and balance, or installments), applies only to bookings confirmed after the point was set, and does nothing while the point is not set (REQ-029-105)"}}
  - {"op": "update_node", "id": "REQ-029-100", "attrs": {"statement": "Booking Total Rule: Throughout this FR, \"booking total\" means the accepted subquote price after any promotion, in the quote currency, read from the FR-005 acceptance snapshot. The same rule applies to every discount type, including discounts funded only by Hairline: commission is always calculated on the price after promotion. It is never recomputed from the live quote, option, or date-range price. This single figure is the base for the Percentage commission, the deposit amount, and the installment split; any display or charge in another currency uses the rate set locked under Currency Rule 2. (REQ-029-100)"}}
  - {"op": "update_node", "id": "REQ-029-044", "attrs": {"statement": "System MUST lock the currency conversion rate set at FR-005 subquote acceptance (the base rate and the markup, each with its timestamp, for the quote currency, the currency shown to the patient and the Fee Currency), store it in the acceptance snapshot, and copy it to the booking and its transactions (no rate fluctuation after subquote acceptance). If a cached rate is older than 24 hours, acceptance still proceeds and the snapshot records the rate and its timestamp"}}
  - {"op": "update_node", "id": "REQ-029-041", "attrs": {"rationale": "Restates Screen 3 and Screen 4 rules on bookings with active references, Rule 5 and the Screen 3 rule on resetting a provider-specific rate to the global default."}}
  - {"op": "update_node", "id": "REQ-029-087", "attrs": {"statement": "Status badges update automatically: green when last fetch succeeded and rate change is within threshold; yellow when the last sync breached the rate protection threshold or the source is degraded; red when last fetch failed or source is down. A yellow rate-protection badge clears only when an admin clicks \"Acknowledge\" on the pair; a later normal sync does not clear it, and after the acknowledgement the badge returns only if the rate moves above the threshold from the acknowledged rate. A yellow badge caused by a degraded source clears when the source is healthy again."}}
  - {"op": "update_node", "id": "REQ-029-097", "attrs": {"statement": "How does system handle rapid currency fluctuation exceeding rate protection threshold multiple times in single day for one pair (e.g., USD/EUR changes 3% at 8am, another 3% at 2pm, another 3% at 8pm)? System compares each sync with the pair's rate 24 hours earlier. It sends the first alert at 8am when the 3% threshold is crossed and marks the pair's status as yellow/warning on the pair list. System applies rate-limiting to alerts (maximum one alert per currency pair per 6 hours) to prevent alert fatigue, and sends the second alert at 2pm showing the change against the rate 24 hours earlier: \"USD/EUR changed 6% in 24 hours.\" The yellow badge stays until an admin clicks Acknowledge; a later normal sync does not clear it. After the acknowledgement the pair is compared with the rate at that moment until the change against the rate 24 hours earlier is again within the threshold. Admin receives summary of all rate changes across all pairs in daily digest email."}}
  - {"op": "update_node", "id": "REQ-029-139", "attrs": {"statement": "If enabled: Assigned Countries must be empty, Account Status must be Active and Account Mode must be Live on a production deployment and Test elsewhere. The flag must be moved to another account before this account can be set Inactive or Archived."}}
  - {"op": "update_node", "id": "REQ-029-071", "attrs": {"statement": "| Assigned Countries | multi-select | Conditional | Countries or regional groupings served by this account (mutually exclusive per record: choose groups or countries, not both) | Required unless Global Fallback is enabled or the account is Inactive or Archived (such an account may hold no countries, and any it holds are ignored for routing). Each country/grouping can map to only one Stripe account (overrides required to reassign). If a country mapping exists, it overrides any group-level account for that country. |"}}
  - {"op": "update_node", "id": "REQ-029-075", "attrs": {"statement": "How to manage admin accidentally entering incorrect Stripe secret key that initially validates but later fails during actual payment processing? During configuration, system validates Stripe credentials by making test API call to Stripe. If credentials are syntactically correct but have insufficient permissions or are later revoked by Stripe, first payment attempt will fail. Payment Processing Service logs error: \"Stripe authentication failed for account [name].\" System sends urgent alert to admin: \"Stripe account [name] failed authentication. Verify API keys are active and have required permissions.\" System temporarily routes new bookings to Global Fallback (if configured) and displays error banner to admin; a booking already taken on the failing account keeps that account and its charges are retried once the keys are fixed. Routing returns to the account when its next Test Connection passes; if the failing account is the Global Fallback itself, or no fallback exists, payment is blocked with the Boundary Flow B6 error and alert."}}
  - {"op": "update_node", "id": "REQ-029-141", "attrs": {"statement": "System MUST allow admins to enable or disable the payment methods offered to patients, per region and currency (Screen 1), and FR-007 offers a patient only the methods enabled for the patient's region and the charge currency (USD when the USD fallback applies, checked after the fallback); FR-007 reads this setting, and FR-007B owns the payment-method records."}}
  - {"op": "update_node", "id": "REQ-029-154", "title": "A third-currency price goes via USD with the markup applied once, and a locked rate set survives pair deletion", "attrs": {"statement": "System MUST derive a price shown in a currency that is neither the quote currency nor USD via USD, applying the markup once on the pair for the shown currency, and MUST keep a booking's locked rate set valid after any of its currency pairs is deleted."}}
  - {"op": "update_node", "id": "REQ-029-052", "attrs": {"statement": "System MUST block disabling a currency while any non-terminal sent quote, unpaid accepted booking, or open booking or instalment plan uses it, while it is the Default Currency of an active Stripe account, or while it is the Fee Currency of fixed fee amounts stored on Screen 7, and MUST show the admin the count of records still using that currency (or the account name)."}}
  - {"op": "add_node", "id": "REQ-029-157", "type": "Rule", "title": "A cancellation point that falls before the late fee day is warned about, not blocked", "owner_fr": "FR-029", "attrs": {"statement": "System MUST warn, without blocking the save, on Screen 4 and on Screen 7 when a set unpaid balance cancellation point is smaller than the day the late payment fee would be charged (the later of the end of the grace period and the day the last automatic retry runs, as set by FR-007B), because a booking cancelled at the point never pays the fee.", "rationale": "FR-029 PRD, Screen 4 late payment fee note and Main Flow: Configure Refund, Fees and Settlement."}}
  - {"op": "add_node", "id": "REQ-029-158", "type": "Rule", "title": "A provider-specific deposit rate is reset to the global default, never deleted", "owner_fr": "FR-029", "attrs": {"statement": "System MUST let an admin remove a provider-specific deposit rate with the action \"Reset to global default\" on Screen 3, with a confirmation and an audit entry; the provider then follows the global rate for new bookings and existing bookings keep their own rate.", "rationale": "FR-029 PRD, Screen 3 and Alternative Flow A2b."}}
