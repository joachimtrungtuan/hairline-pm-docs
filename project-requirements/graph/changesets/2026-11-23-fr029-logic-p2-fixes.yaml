  - {"op": "update_node", "id": "SET-late-payment-fee", "attrs": {"description": "Fee charged once when the grace period (counted from the due date) has passed with the installment unpaid and the automatic retries have ended; collected with the next successful charge and kept outside the clinic share and the refund base. A type (fixed amount above 0 in the Fee Currency, converted via USD with the rate set locked at quote acceptance, or a percentage above 0 and up to 100 of the late installment) plus a value, admin-editable on Screen 7. It starts as Not set and no fee is charged while it is not set. Locked at booking confirmation, a fixed amount together with its currency code; a booking confirmed while it is not set keeps no late fee. Hairline keeps it; it changes no provider payout."}}
  - {"op": "update_node", "id": "SET-rescheduling-fee", "attrs": {"description": "Fee for rescheduling a booking: a type (fixed amount above 0 in the Fee Currency, converted via USD with the rate set locked at quote acceptance, or a percentage above 0 and up to 100) plus a value, admin-editable on Screen 7. It starts as Not set and no fee is charged while it is not set. Locked at booking confirmation, a fixed amount together with its currency code; a booking confirmed while it is not set keeps no rescheduling fee. Hairline keeps it; it changes no provider payout. It never applies to a change an admin makes in V1; what a percentage is taken of is decided together with patient-side rescheduling."}}
  - {"op": "update_node", "id": "SET-installment-late-payment-grace-period", "attrs": {"description": "Late payment grace period (0-14 days, starting at 0, FR-029 Screen 4), counted from the installment due date: reminders and automatic retries run during it, and the late payment fee is charged once after it has passed and the retries have ended. A missed installment is cancelled only by the unpaid balance cancellation point, never by this setting. Locked at booking confirmation."}}
  - {"op": "update_node", "id": "SET-unpaid-balance-cancellation-point", "attrs": {"description": "The number of days after the oldest unpaid due date (the due date of the oldest installment or balance that is unpaid right now; paying it late restarts the count from the next unpaid one) at which a booking that still has any unpaid balance (the deposit and balance option, or installments) is cancelled (FR-006 Alternative Flow B8). Whole number from 1 to 30, smaller than both the balance due days and the installment cutoff; Screen 7 refuses a save that breaks this and warns, without refusing, when the point falls before the day the late payment fee would be charged. It has no starting value and may be Not set; while it is not set nothing is cancelled for non-payment. It applies only to bookings confirmed after it is set and is locked at booking confirmation."}}
  - {"op": "update_node", "id": "SET-patient-cancellation-fee-split", "attrs": {"description": "Percentage 0-100 of a patient cancellation fee kept by Hairline; the rest goes to the clinic (FR-017 Release Rule 7, FR-007 REQ-007-092). Set on Screen 7 with no starting value; it may be Not set, and while it is not set Hairline keeps the whole fee and holders of the Screen 7 permission see a banner on the admin dashboard asking them to set it, which clears when the share is saved. Applies on the day of the cancellation."}}
  - {"op": "update_node", "id": "SET-clinic-cancellation-deduction", "attrs": {"description": "Fixed amount deducted from the clinic's next payout when the clinic cancels (FR-017 Release Rule 7). Set by admins on Screen 7 (FR-029) as a fixed amount above 0, stated in the Fee Currency and stored together with its currency code, with no starting value; while it is not set no deduction is made. After a Default Currency change it is re-entered in the new currency before Screen 7 can be saved. FR-017 reads it. Applies on the day of the cancellation."}}
  - {"op": "update_node", "id": "SET-deposit-plan-balance-due-days", "attrs": {"description": "How many days before the procedure date the balance of the deposit-now, balance-later option is due; whole number of days from 1 to 30, admin-editable on Screen 7 (PRD Screen 7, Balance Due Days). A booking confirmed with this many days left, or fewer, gets full payment only. Locked at booking confirmation: FR-007 stores the balance due date on the booking then, so a later change never moves it. Read by FR-006 and FR-007."}}
  - {"op": "update_node", "id": "SET-rate-protection-threshold", "attrs": {"description": "Percentage by which an auto-fetch pair's rate may differ from its rate 24 hours earlier before the pair is flagged yellow and admins are alerted; the flag clears only when an admin acknowledges it, after which the pair is compared with the rate at the acknowledgement until the 24-hour change is again within the threshold. No comparison runs for 24 hours after a pair is created or switched between modes. Range 1-50%, precision 0.1%. The PRD names no default (3% appears only as an example)."}}
  - {"op": "update_node", "id": "SET-supported-payment-methods", "attrs": {"description": "Payment methods enabled or disabled by admin per region and currency (FR-029 Screen 1, Enabled Payment Methods). A method is offered only in a currency the account supports, checked against the charge currency (USD when the USD fallback applies). FR-007 reads it; FR-007B owns the payment-method records."}}
  - {"op": "update_node", "id": "SET-split-payment-config", "attrs": {"description": "Split payment (installment) configuration of Screen 4: feature enabled switch, offered installment counts (2 to 9), cutoff days (30-90, default 30), minimum booking amount ($100-$10,000, stated in USD) and late payment grace period (0-14 days, starting at 0 = none, counted from the due date). Installment frequency is fixed at monthly (30-day intervals): the first installment is due on the booking day and the next ones every 30 days, so the minimum lead time for installments is cutoff + 30 days. The PRD names no defaults other than 30 cutoff days."}}
  - {"op": "update_node", "id": "SET-deposit-percentage", "attrs": {"description": "Deposit percentage of the booking total, configured globally or per provider (Screen 3); a provider-specific rate is reset to the global default, never deleted. Allowed range 20-30%, precision 0.1%, fixed in code. The PRD names no default (25% appears only as an example). New bookings only: existing bookings keep their rate."}}
  - {"op": "update_node", "id": "ENT-refund-fee-settings.late_payment_fee_type", "attrs": {"description": "How the late payment fee is calculated: fixed amount or percentage. Not set until a value is set; required once a value is set."}}
  - {"op": "update_field", "id": "ENT-refund-fee-settings.late_payment_fee_type", "required": false}
  - {"op": "update_node", "id": "ENT-refund-fee-settings.late_payment_fee_value", "attrs": {"description": "Value of the late payment fee. Starts as Not set; no fee is charged while it is not set. Fixed amount above 0 in the Fee Currency, stored and locked together with its currency code, precision per its minor units, converted via USD with the rate set locked at quote acceptance; or a percentage above 0 and up to 100 of the late installment. Locked at booking confirmation."}}
  - {"op": "update_field", "id": "ENT-refund-fee-settings.late_payment_fee_value", "required": false}
  - {"op": "update_node", "id": "ENT-refund-fee-settings.rescheduling_fee_type", "attrs": {"description": "How the rescheduling fee is calculated: fixed amount or percentage. Not set until a value is set; required once a value is set."}}
  - {"op": "update_field", "id": "ENT-refund-fee-settings.rescheduling_fee_type", "required": false}
  - {"op": "update_node", "id": "ENT-refund-fee-settings.rescheduling_fee_value", "attrs": {"description": "Value of the rescheduling fee. Starts as Not set; no fee is charged while it is not set. Fixed amount above 0 in the Fee Currency, stored and locked together with its currency code, precision per its minor units, converted via USD with the rate set locked at quote acceptance; or a percentage above 0 and up to 100. Locked at booking confirmation. Never applies to a change an admin makes in V1."}}
  - {"op": "update_field", "id": "ENT-refund-fee-settings.rescheduling_fee_value", "required": false}
  - {"op": "update_node", "id": "ENT-refund-fee-settings.fee_currency", "attrs": {"description": "Currency in which the fixed late payment fee, the fixed rescheduling fee and the clinic cancellation deduction are stated. It is set to the system default currency when the first fixed amount is saved, and every stored fixed amount keeps its own currency code from then on. After a Default Currency change it moves to the new default only in a save in which every fixed amount that is set has been re-entered in the new currency; until then Screen 7 cannot be saved. A currency in use as the Fee Currency cannot be disabled."}}
  - {"op": "update_node", "id": "ENT-refund-fee-settings.clinic_cancellation_deduction", "attrs": {"description": "Fixed amount above 0 deducted from a clinic's next payout when the clinic cancels, stated in the Fee Currency and stored together with its currency code. No starting value; may be Not set, in which case no deduction is made. Re-entered in the new currency after a Default Currency change. FR-017 reads it. Applies on the day of the cancellation."}}
  - {"op": "update_node", "id": "ENT-refund-fee-settings.deposit_plan_balance_due_days", "title": "Balance due days", "attrs": {"description": "Days before the procedure date that the balance of the deposit-now, balance-later option is due. Default 7. Whole number, 1 to 30. Locked at booking confirmation as a balance due date stored on the booking."}}
  - {"op": "update_node", "id": "ENT-refund-fee-settings.unpaid_balance_cancellation_point", "attrs": {"description": "Days after the oldest unpaid due date (the oldest installment or balance that is unpaid right now) at which a booking that still has an unpaid balance is cancelled. Whole number from 1 to 30, smaller than the balance due days and the installment cutoff. No default; may be Not set, in which case nothing is cancelled for non-payment. Locked at booking confirmation."}}
  - {"op": "update_node", "id": "ENT-refund-fee-settings.hairline_cancellation_fee_share", "attrs": {"description": "Percentage 0-100 of a patient cancellation fee kept by Hairline; the rest goes to the clinic. No starting value; may be Not set, in which case Hairline keeps the whole fee and holders of the Screen 7 permission see a banner on the admin dashboard asking them to set it, which clears when the share is saved. Applies on the day of the cancellation."}}
  - {"op": "update_node", "id": "ENT-split-payment-config.late_payment_grace_period_days", "attrs": {"description": "Days after a missed installment due date, counted from the due date, during which reminders and automatic retries run; the late payment fee is charged once after it has passed and the retries have ended. Range 0-14 days, integer only; starts at 0 = no grace period. A missed installment is cancelled only by the unpaid balance cancellation point, never by this setting."}}
  - {"op": "update_node", "id": "ENT-refund-fee-settings", "attrs": {"description": "One global record (Screen 7): refund ladder bands, late payment fee, rescheduling fee, balance due days, unpaid balance cancellation point, Hairline share of a patient cancellation fee, patient confirmation window, and the settlement period with its cutoff day and payout day for manually paid clinics. Read by FR-006, FR-007, FR-007B, FR-015 and FR-017."}}
  - {"op": "update_node", "id": "ENT-currency-conversion-settings.rate_protection_threshold", "attrs": {"description": "Alert if a pair's rate differs from its rate 24 hours earlier by more than this percentage. Range 1-50%, decimal precision 0.1%. The pair's warning clears only when an admin acknowledges it; afterwards the pair is compared with the rate at the acknowledgement until the 24-hour change is again within the threshold, and no comparison runs for 24 hours after a pair is created or switched between modes."}}
  - {"op": "update_node", "id": "ENT-currency.enabled", "attrs": {"description": "Whether the currency is available for selection across the system. At least 1 must stay enabled; cannot be turned off while quotes, bookings, or instalment plans still use it, or while it is the Fee Currency of fixed fee amounts on Screen 7."}}
  - {"op": "update_node", "id": "ENT-stripe-account", "attrs": {"description": "A Stripe account the platform uses to collect patient payments, assigned to countries or regional groupings. One account per country or regional grouping; at most one account is the Global Fallback used when no mapping exists or when the mapped account fails authentication (PRD Key Entities, Entity 1)."}}
  - {"op": "update_node", "id": "ENT-stripe-account.status", "attrs": {"description": "Active, Inactive or Archived (active = enabled for processing). An account that an open booking or active installment plan still uses cannot be deleted; it is set to Archived, which takes it out of use for new bookings. The countries of an Inactive or Archived account are treated as unassigned for routing: those patients pay through the Global Fallback or, with none, are blocked with the missing-account alert. The Global Fallback account cannot be set Inactive or Archived."}}
  - {"op": "update_node", "id": "ENT-stripe-account.is_global_fallback", "attrs": {"description": "If enabled, this Stripe account is used when no country or regional grouping mapping exists for the patient, or when the mapped account fails authentication. At most one account can be the Global Fallback. If enabled: Assigned Countries must be empty, Account Status must be Active and Account Mode must be Live on a production deployment and Test elsewhere. The flag must be moved to another account before this account can be set Inactive or Archived."}}
  - {"op": "update_node", "id": "ENT-stripe-account.assigned_countries", "attrs": {"description": "Countries or regional groupings served by this account (mutually exclusive per record: choose groups or countries, not both). Required unless Global Fallback is enabled or the account is Inactive or Archived (such an account may hold no countries, and any it holds are ignored for routing). Each country or grouping maps to only one Stripe account (overrides required to reassign). A country mapping overrides any group-level account for that country."}}
  - {"op": "update_node", "id": "SCR-029-01", "attrs": {"description": "Admin Platform. Add, edit and manage multiple Stripe accounts and assign them to countries or regional groupings (PRD Screen 1). UI controls, not fields: Test Connection button and its modal (shows account name, mode and endpoint, calls Stripe with the keys and webhook secret, shows success or failure with error details, logs the attempt and updates Last Tested), Show toggle on the secret fields, Retry Connection, Save & Activate. Also shown: inline help on Test versus Live Mode, a warning icon when the account was not tested for over 30 days, and transaction count and total volume per account for the last 30 days (reference only; read from payment transactions owned by FR-007). Account Status is Active, Inactive or Archived: an account an open booking or active installment plan still uses cannot be deleted, only archived. The countries of an Inactive or Archived account are treated as unassigned for routing, and such an account may hold no countries. On a production deployment only Live accounts are routed and elsewhere only Test accounts, and the Global Fallback account must be Active and in the mode of the deployment. Payment methods are checked against the charge currency."}}
  - {"op": "update_node", "id": "SCR-029-02", "attrs": {"description": "Admin Platform. Screen 2A: Section 1 Global Settings, Section 2 Rate Sources (Add, Edit, Delete, Test Connection), Section 3 Currency Pair List (PRD Screen 2A). The pair list supports sorting and filtering by pair name, mode, status and last updated, shows total pair count and counts by mode, an alert badge count in the header when any pair is yellow or red, a banner that currencies not configured default to USD, and actions Add Pair, Edit Pair, Delete Pair and Sync Now per auto-fetch pair. Source Status and Last Tested are display-only. A yellow rate-protection badge compares the pair with its rate 24 hours earlier and stays until an admin acknowledges it on Screen 2B; a later normal sync does not clear it. After the acknowledgement the pair is compared with the rate at that moment, and no comparison runs for 24 hours after a pair is created or switched between modes."}}
  - {"op": "update_node", "id": "SCR-029-03", "attrs": {"description": "Admin Platform. Screen 2B: form to create or edit a pair (PRD Screen 2B). UI controls, not fields: Test Connection & Fetch Rate (mandatory before saving a new auto-fetch pair), Save, Cancel, the Rate History link (chart and table of rate changes over the last 30 days when editing), inline help text on Base Rate, the source status indicator beside the Source dropdown, the estimated conversion impact example, and last and next sync timestamps below the form. The Acknowledge button clears a pair's rate-protection warning and logs the acknowledgement with admin and time; afterwards the pair is compared with the rate at that moment until the 24-hour change is again within the threshold."}}
  - {"op": "update_node", "id": "SCR-029-04", "attrs": {"description": "Admin Platform. Configure the deposit percentage globally or per provider (PRD Screen 3). UI controls, not fields: Provider Search by name or ID, bulk edit of several providers, Apply Deposit Rate. Also shown: a preview calculation, a sortable list of providers with custom rates, a badge next to providers with custom rates on provider list screens, and the historical deposit rate changes from the audit log. A provider-specific rate is removed with the Reset to global default action (confirmation and audit entry), never deleted."}}
  - {"op": "update_node", "id": "SCR-029-05", "attrs": {"description": "Admin Platform. Configure available installment options and cutoff rules (PRD Screen 4). UI controls, not fields: Preview Installment Schedule button, Save Split Payment Configuration. Also shown: a preview calculator and example scenarios, a warning when cutoff days are very aggressive (over 60), and installment usage statistics for the last 30 days (reference only). The minimum lead time (cutoff + 30 days) and the minimum for each enabled installment count are always shown; the warning appears when the cutoff is above 60 days. A second warning, which does not block the save, appears when a set cancellation point falls before the day the late payment fee would be charged."}}
  - {"op": "update_node", "id": "SCR-029-07", "attrs": {"description": "Admin Platform. Manage the enabled subset of the master currency catalog and the system default currency (PRD Screen 6). UI controls, not fields: Search filter by code or name, Enable common set (e.g., USD/EUR/GBP) and Set Default quick actions. It is the source of truth for currency dropdowns across Admin, Provider and Patient experiences. A currency that is the Default Currency of an active Stripe account, or the Fee Currency of stored fixed fee amounts, cannot be disabled; after the default currency changes a banner on Screen 7 asks the admin to re-enter the fixed fee amounts, and Screen 7 cannot be saved until they are."}}
  - {"op": "update_node", "id": "SCR-029-08", "attrs": {"description": "Admin Platform. One global record of the refund ladder, the late payment fee, the rescheduling fee, the balance due days, the unpaid balance cancellation point, Hairline's share of a patient cancellation fee, the patient confirmation window and the settlement period, cutoff day and payout day for manually paid clinics (PRD Screen 7). Not set per provider, region or currency. Also the clinic cancellation deduction and the read-only Fee Currency. The late payment fee, the rescheduling fee, the cancellation point, Hairline's share and the deduction show Not set until an admin sets them. A fixed amount must be above 0 and, after a Default Currency change, re-entered in the new currency before a save is accepted. A warning, not a refusal, shows when the cancellation point falls before the day the late payment fee would be charged. A save that breaks a range or ordering check is refused with the failing field named."}}
  - {"op": "update_node", "id": "EVT-payment-unsupported-country", "attrs": {"description": "Alert to admins that a payment was attempted or blocked for a country with no Stripe account and no Global Fallback (a country held only by an Inactive or Archived account counts as having no account)."}}
  - {"op": "update_node", "id": "STP-029-062", "title": "Admin configures the late payment grace period (0-14 days, starting at 0, counted from the due date)"}
  - {"op": "update_node", "id": "STP-029-065", "title": "System validates the cutoff is within 30-90 days and above the cancellation point when it is set, and warns when the cancellation point falls before the late fee day"}
  - {"op": "update_node", "id": "STP-029-163", "title": "System displays the current record with Not set shown for the unset fees, cancellation point, share and deduction"}
  - {"op": "update_node", "id": "STP-029-166", "title": "System validates the changed fields against the Screen 7 ranges and orderings, each fixed amount above 0 and re-entered in the new currency after a default currency change"}
  - {"op": "update_node", "id": "STP-029-168", "title": "System stores the record without requiring the Not set fields, and warns when the cancellation point falls before the late fee day"}
  - {"op": "update_node", "id": "STP-029-174", "title": "System checks a currency being disabled against the block rules (including the Fee Currency) and the warning cases"}
  - {"op": "update_node", "id": "STP-029-177", "title": "System creates a new quote configuration version and asks the admin to re-enter the fixed fee amounts in the new currency when the default changed"}
  - {"op": "update_node", "id": "STP-029-096", "title": "System stores the pair, schedules the recurring sync from the save time, logs the change and skips the rate protection comparison for 24 hours"}
  - {"op": "update_node", "id": "STP-029-143", "title": "System compares the new rate to the pair's rate 24 hours earlier (after an Acknowledge, to the rate at the acknowledgement)"}
  - {"op": "update_node", "id": "STP-029-159", "title": "System logs the acknowledgement with admin ID and timestamp and compares the pair with the rate at that moment from then on"}
  - {"op": "update_node", "id": "STP-029-154", "title": "System finds no Stripe account assigned to the country (a country held only by an Inactive or Archived account counts as unassigned)"}
  - {"op": "update_node", "id": "STP-029-155", "title": "System checks for an Active Stripe account marked as Global Fallback in the mode of the deployment (Live on production, Test elsewhere)"}
