  - {"op": "update_node", "id": "REQ-030-093", "attrs": {"rationale": "prd.md line 196. Category: Provider/Compliance. Event nodes: EVT-provider-document-expiration-warning (new stub owned by FR-015)."}}
  - {"op": "update_node", "id": "REQ-030-094", "attrs": {"rationale": "prd.md line 197. Category: Provider/Compliance. Event nodes: EVT-provider-status-cancellation-patient (existing node). Lock rule (prd.md line 551): Provider-Caused Cancellation (`provider.status_cancellation_patient`) and Admin Support Required (`provider.status_cancellation_admin_support`) are mandatory notifications for each inquiry/case affected by an FR-015 provider suspension or deactivation. Affected patients and admins MUST be informed regardless of FR-015's \"Notify Provider\" checkbox; toggles are locked for both events. Failed deliveries retry per FR-020 without duplicates (de-duplicated per provider-status event + affected record + recipient) and never restore cancelled records. Before acceptance, the patient notice uses the FR-003 variants (Workflow 2 Alternative Flow B4, REQ-003-021): \"[Clinic] is no longer available. Your other offers are still open.\" when other offers remain open; \"[Clinic] is no longer available. We are finding new offers for you.\" when the inquiry is redistributed automatically, or a request to confirm redistribution first when the patient had explicitly selected the affected provider. The admin-support alert goes to admins with the FR-031 Respond to Support permission."}}
  - {"op": "update_node", "id": "REQ-030-095", "attrs": {"rationale": "prd.md line 198. Category: Provider/Compliance. Event nodes: EVT-provider-status-cancellation-admin-support (existing node). Lock rule (prd.md line 551): Provider-Caused Cancellation (`provider.status_cancellation_patient`) and Admin Support Required (`provider.status_cancellation_admin_support`) are mandatory notifications for each inquiry/case affected by an FR-015 provider suspension or deactivation. Affected patients and admins MUST be informed regardless of FR-015's \"Notify Provider\" checkbox; toggles are locked for both events. Failed deliveries retry per FR-020 without duplicates (de-duplicated per provider-status event + affected record + recipient) and never restore cancelled records. Before acceptance, the patient notice uses the FR-003 variants (Workflow 2 Alternative Flow B4, REQ-003-021): \"[Clinic] is no longer available. Your other offers are still open.\" when other offers remain open; \"[Clinic] is no longer available. We are finding new offers for you.\" when the inquiry is redistributed automatically, or a request to confirm redistribution first when the patient had explicitly selected the affected provider. The admin-support alert goes to admins with the FR-031 Respond to Support permission."}}
  - {"op": "update_node", "id": "REQ-030-096", "attrs": {"rationale": "prd.md line 199. Category: Provider/Compliance. Event nodes: EVT-provider-suspended (existing node); EVT-provider-deactivated (existing node)."}}
  - {"op": "update_node", "id": "REQ-030-097", "attrs": {"rationale": "prd.md line 200. Category: Provider/Compliance. Event nodes: EVT-provider-activation (existing node). Lock rule (prd.md line 553): Provider Account Activation (`provider.activation`) is mandatory and non-disableable: without it a new provider cannot set a password and log in. Provider Reactivated (`provider.reactivated`) and Scheduled Status Change Cancelled (`provider.scheduled_change_cancelled`) follow FR-015's \"Notify Provider\" choice; when triggered they cannot be disabled here. Toggles are locked for all three events. `provider.suspended`, `provider.deactivated`, `provider.reactivated`, and `provider.scheduled_change_cancelled` go to the provider Owner only; for a scheduled suspension or deactivation with \"Notify Provider\" checked, `provider.suspended` / `provider.deactivated` is sent when the change is created and again when it takes effect, and with it unchecked no email is sent at either point. Owner Login Email Changed (`provider.login_email_changed`) is a mandatory security notice to the old and the new login address; its toggle is locked."}}
  - {"op": "update_node", "id": "REQ-030-098", "attrs": {"rationale": "prd.md line 201. Category: Provider/Compliance. Event nodes: EVT-provider-login-email-changed (existing node)."}}
  - {"op": "update_node", "id": "REQ-030-099", "attrs": {"rationale": "prd.md line 202. Category: Provider/Compliance. Event nodes: EVT-provider-reactivated (existing node). Lock rule (prd.md line 553): Provider Account Activation (`provider.activation`) is mandatory and non-disableable: without it a new provider cannot set a password and log in. Provider Reactivated (`provider.reactivated`) and Scheduled Status Change Cancelled (`provider.scheduled_change_cancelled`) follow FR-015's \"Notify Provider\" choice; when triggered they cannot be disabled here. Toggles are locked for all three events. `provider.suspended`, `provider.deactivated`, `provider.reactivated`, and `provider.scheduled_change_cancelled` go to the provider Owner only; for a scheduled suspension or deactivation with \"Notify Provider\" checked, `provider.suspended` / `provider.deactivated` is sent when the change is created and again when it takes effect, and with it unchecked no email is sent at either point. Owner Login Email Changed (`provider.login_email_changed`) is a mandatory security notice to the old and the new login address; its toggle is locked."}}
  - {"op": "update_node", "id": "REQ-030-100", "attrs": {"rationale": "prd.md line 203. Category: Provider/Compliance. Event nodes: EVT-provider-scheduled-change-cancelled (existing node). Lock rule (prd.md line 553): Provider Account Activation (`provider.activation`) is mandatory and non-disableable: without it a new provider cannot set a password and log in. Provider Reactivated (`provider.reactivated`) and Scheduled Status Change Cancelled (`provider.scheduled_change_cancelled`) follow FR-015's \"Notify Provider\" choice; when triggered they cannot be disabled here. Toggles are locked for all three events. `provider.suspended`, `provider.deactivated`, `provider.reactivated`, and `provider.scheduled_change_cancelled` go to the provider Owner only; for a scheduled suspension or deactivation with \"Notify Provider\" checked, `provider.suspended` / `provider.deactivated` is sent when the change is created and again when it takes effect, and with it unchecked no email is sent at either point. Owner Login Email Changed (`provider.login_email_changed`) is a mandatory security notice to the old and the new login address; its toggle is locked."}}
  - {"op": "update_node", "id": "REQ-030-101", "attrs": {"rationale": "prd.md line 204. Category: Provider/Compliance. Event nodes: EVT-provider-closure-requested (existing node). Lock rule (prd.md line 554): Provider Account-Closure Requested (`provider.closure_requested`) and Provider Account-Closure Request Rejected (`provider.closure_rejected`) are mandatory: admins must learn of every closure request, and a provider whose request is rejected must be told the account stays Active. Toggles are locked for both."}}
