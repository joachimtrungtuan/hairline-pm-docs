  - {"op": "update_node", "id": "REQ-030-077", "attrs": {"rationale": "prd.md line 178. Category: Aftercare. Event nodes: EVT-aftercare-provider-reassigned (existing node). Lock rule (prd.md line 552): Aftercare Provider Reassigned (`aftercare.provider_reassigned`) is mandatory: when an admin reassigns an aftercare case through FR-011, the patient and the new aftercare provider MUST learn who now provides aftercare. Toggle is locked, FR-032 provider preferences cannot suppress it, and no admin alert is sent because the admin is the actor."}}
