  - {"op": "update_node", "id": "REQ-030-033", "attrs": {"rationale": "prd.md line 130. Category: Quote. Event nodes: EVT-quote-submitted (existing node)."}}
  - {"op": "update_node", "id": "REQ-030-037", "attrs": {"rationale": "prd.md line 135. Category: Quote. Event nodes: EVT-quote-withdrawn (existing node). Lock rule (prd.md line 546): Quote Withdrawn (`quote.withdrawn`) is mandatory before and after acceptance: the patient MUST always learn that the provider has withdrawn the quote, and the admin MUST be alerted only when the withdrawn quote was already accepted. Toggle is locked."}}
  - {"op": "update_node", "id": "REQ-030-038", "attrs": {"rationale": "prd.md line 136. Category: Quote. Event nodes: EVT-quote-accepted (existing node). Lock rule (prd.md line 543): Preference exemption for mandatory provider events: every event that is mandatory for providers (`quote.cancelled_inquiry`, the selected-provider and not-selected-provider outcomes of `quote.accepted`, `booking.payment_window_expired`, `booking.revived` and `booking.rescheduled`) is delivered regardless of FR-032 provider notification preferences. A provider's category toggles in FR-032 never suppress these events. Lock rule (prd.md line 547): Quote Accepted (`quote.accepted`): the selected-provider outcome and the not-selected-provider outcome are mandatory, because the selected provider must learn that its slot is held and every other provider with a sent parent quote must learn that the quote is no longer active. These outcome toggles are locked. `quote.accepted` has no patient or admin recipient."}}
  - {"op": "update_node", "id": "REQ-030-041", "attrs": {"rationale": "prd.md line 139. Category: Booking/Schedule. Event nodes: EVT-booking-hold-expiring-soon (existing node)."}}
  - {"op": "update_node", "id": "REQ-030-043", "attrs": {"rationale": "prd.md line 141. Category: Booking/Schedule. Event nodes: EVT-booking-revived (existing node). Lock rule (prd.md line 543): Preference exemption for mandatory provider events: every event that is mandatory for providers (`quote.cancelled_inquiry`, the selected-provider and not-selected-provider outcomes of `quote.accepted`, `booking.payment_window_expired`, `booking.revived` and `booking.rescheduled`) is delivered regardless of FR-032 provider notification preferences. A provider's category toggles in FR-032 never suppress these events. Lock rule (prd.md line 548): Payment Window Expired (`booking.payment_window_expired`) and Booking Revived (`booking.revived`) are mandatory for patient and provider: both must know whether the slot is released or held again and what the payment deadline is. Toggles are locked."}}
  - {"op": "update_node", "id": "REQ-030-044", "attrs": {"rationale": "prd.md line 142. Category: Booking/Schedule. Event nodes: EVT-booking-provider-fault-replacement (existing node). Lock rule (prd.md line 549): Provider Unable to Proceed — Replacement Being Arranged (`booking.provider_fault_replacement`) is mandatory: the patient MUST learn that an admin will arrange a replacement provider. Toggle is locked."}}
  - {"op": "update_node", "id": "REQ-030-050", "attrs": {"rationale": "prd.md line 148. Category: Treatment. Event nodes: EVT-treatment-plan-changed (existing node). Lock rule (prd.md line 550): Treatment Details Changed After Acceptance (`treatment.plan_changed`) is mandatory: every audited change to plan, clinicians or grafts from booking confirmation (`Confirmed`) onward MUST be notified to the patient. Toggle is locked."}}
