  - {"op": "update_node", "id": "REQ-030-027", "attrs": {"rationale": "prd.md line 124. Category: Account/Auth. Event nodes: EVT-verification-otp-sent (existing node). Lock rule (prd.md line 541): Account/Auth notifications (OTP verification, password reset) are security-critical and MUST be non-disableable by default in the admin UI (toggle locked; no pause)."}}
