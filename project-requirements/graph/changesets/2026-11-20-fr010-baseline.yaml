reason: "Requirements graph programme baseline 2026-11-20: owner rulings applied (FR-010)"
by: controller
operations:
  # New Rules, statements as the FR-010 PRD Functional Requirements Summary reads now.
  - op: add_node
    id: REQ-010-106
    type: Rule
    owner_fr: FR-010
    title: "Check In allowed only when Confirmed, procedure date today or past, and fully paid"
    attrs:
      statement: "System MUST allow Check In only when the booking is Confirmed, the procedure date is today or in the past, and the booking is fully paid; otherwise Check In is disabled and the reason is shown to the provider. This is the one merged Check In rule (Rule 3; Payment Rule 2)"
      rationale: "Functional Requirements Summary. Screen SCR-010-04. Merges the former FR-006 Check In rule."
  - op: add_node
    id: REQ-010-107
    type: Rule
    owner_fr: FR-010
    title: "Report Issue Before Check In control for No-show and Medical postponement; notifies admin only"
    attrs:
      statement: "System MUST give providers a Report Issue Before Check In control on a Confirmed case, with the reasons No-show and Medical postponement, that only notifies the admin and leaves the booking Confirmed; Cancel / Close Case remains available only while the case is In Progress, with the Alternative Flow B4 reason list (Alternative Flows B1, B2 and B4; Screen 4)"
      rationale: "Functional Requirements Summary. Screen SCR-010-04. Alternative Flows B1, B2 and B4."
  - op: add_node
    id: REQ-010-108
    type: Rule
    owner_fr: FR-010
    title: "Provider In Progress listing filters by treatment start date range"
    attrs:
      statement: "System MUST let providers filter the In Progress listing by treatment start date range, defaulting to the current month (Screen 3)"
      rationale: "Functional Requirements Summary. Screen SCR-010-03."
      distinct_from: "REQ-010-111"
  - op: add_node
    id: REQ-010-109
    type: Rule
    owner_fr: FR-010
    title: "Provider In Progress listing filters by assigned clinician"
    attrs:
      statement: "System MUST let providers filter the In Progress listing by any assigned clinician, chosen from the clinic's active clinicians (Screen 3)"
      rationale: "Functional Requirements Summary. Screen SCR-010-03."
  - op: add_node
    id: REQ-010-110
    type: Rule
    owner_fr: FR-010
    title: "Admin In Progress listing filters by provider or clinic"
    attrs:
      statement: "System MUST let admins filter the admin In Progress listing by provider or clinic (Screen 7)"
      rationale: "Functional Requirements Summary. Screen SCR-010-07."
      distinct_from: "REQ-010-112"
  - op: add_node
    id: REQ-010-111
    type: Rule
    owner_fr: FR-010
    title: "Admin In Progress listing filters by procedure start date range"
    attrs:
      statement: "System MUST let admins filter the admin In Progress listing by procedure start date range, defaulting to the current month (Screen 7)"
      rationale: "Functional Requirements Summary. Screen SCR-010-07."
      distinct_from: "REQ-010-108"
  - op: add_node
    id: REQ-010-112
    type: Rule
    owner_fr: FR-010
    title: "Admin In Progress listing filters by assigned clinician"
    attrs:
      statement: "System MUST let admins filter the admin In Progress listing by any assigned clinician (Screen 7)"
      rationale: "Functional Requirements Summary. Screen SCR-010-07."
      distinct_from: "REQ-010-110"
  - op: add_node
    id: REQ-010-113
    type: Rule
    owner_fr: FR-010
    title: "Case detail page in tabs; the In Progress tab becomes active at Check In"
    attrs:
      statement: "System MUST present the provider case detail page in tabs (Treatment Plan, Note, Book hotel & Book flight, In Progress); the In Progress tab becomes the active tab at Check In and the other tabs stay accessible for reference (Screen 4)"
      rationale: "Functional Requirements Summary. Screen SCR-010-04."

