  - {"op": "add_node", "id": "REQ-003-128", "type": "Rule", "title": "Patient confirmation of a redistribution: confirm, decline, or no answer after 48 hours", "owner_fr": "FR-003", "attrs": {"statement": "When System asks the patient to confirm a redistribution (REQ-003-021), it MUST set `redistribution_state` to `awaiting_patient_confirmation`. On confirm, it MUST set `confirmed` and run normal Workflow 2 matching (Alternative Flow B1 applies when no eligible provider is found). On decline, it MUST set `declined`, leave the inquiry as it is with `supportRequired = true` and the Contact Admin/Support action, and not redistribute. If the patient has not answered after a fixed 48 hours, System MUST send one reminder, set `admin_follow_up`, and show the inquiry in the admin inquiry queue (Screen 11); it MUST NOT send a second reminder. The patient can still confirm or decline after the reminder.", "rationale": "Owner default: ask first, remind once, then hand the case to an admin, so an inquiry never waits with no live offer and no owner."}}
