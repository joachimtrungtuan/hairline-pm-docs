  - {"op": "update_node", "id": "REQ-003-021", "attrs": {"statement": "Before acceptance, when the provider-status cascade cancels a live offer (a sent quote that has not expired) and the patient has no other live offer on the inquiry, System MUST redistribute the inquiry, at most once per provider-status event, to eligible providers that have not yet received it under the normal Workflow 2 distribution rules, keep `supportRequired = true`, and tell the patient \"[Clinic] is no longer available. We are finding new offers for you.\" If the patient had not explicitly selected the affected provider, the redistribution is automatic. If the patient had explicitly selected the affected provider, System MUST ask the patient to confirm and MUST redistribute only after confirmation; confirm, decline and no-answer follow REQ-003-128. System MUST NOT redistribute while another live offer remains (Workflow 2 Alternative Flow B4)."}}
  - {"op": "add_node", "id": "STP-003-093", "type": "Step", "title": "Patient confirms the redistribution and matching runs again", "owner_fr": "FR-003", "attrs": {"prd_ref": "Workflow 2 Alternative Flow B4 step 3"}}
