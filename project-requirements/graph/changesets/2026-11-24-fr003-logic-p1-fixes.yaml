  - {"op": "update_node", "id": "REQ-003-067", "title": "No inquiry expires automatically at launch", "attrs": {"statement": "System MUST NOT expire an unquoted inquiry automatically at launch. An inquiry stays open until the patient cancels it, an admin cancels or archives it, or it is quoted and the patient decides. Draft expiry (REQ-003-004) and quote expiry (FR-004, FR-026) are separate and unchanged."}}
  - {"op": "update_node", "id": "REQ-003-071", "attrs": {"statement": "The automatic fallback is triggered by an explicit provider decline only. Quote expiry (FR-004) does not trigger it, and inquiries do not expire at launch (REQ-003-067)."}}
  - {"op": "update_node", "id": "REQ-003-087", "title": "Admin distribution overrides need confirmation and reason", "attrs": {"statement": "Override distribution with required reason: re-run matching; include/exclude specific providers. All overrides require confirmation and reason entry. There is no expiry override at launch because inquiries do not expire (REQ-003-067)."}}
  - {"op": "update_node", "id": "REQ-003-005", "attrs": {"statement": "Admin MUST be able to view, edit (with warnings), reassign, soft delete (archive), and override distribution with a full audit trail. Inquiries do not expire automatically at launch, so there is no expiry override."}}
  - {"op": "update_node", "id": "STP-003-038", "title": "Admin overrides distribution with confirmation and reason"}
  - {"op": "update_node", "id": "ENT-inquiry.response_deadline", "attrs": {"description": "Provider response deadline shown in the Screen 1 Deadlines field (REQ-003-066). It is informational: nothing expires or changes state when it passes."}}

  # P1-06 (owner default 63): account-deletion cancellation happens at admin approval
  - {"op": "update_node", "id": "REQ-003-103", "attrs": {"statement": "When an admin approves a patient's account-deletion request (FR-023), System MUST cancel the patient's open inquiry in stage Inquiry or Quoted. The cancellation happens at approval, not when the request is submitted, and a refused request cancels nothing. A deletion request is blocked while the patient has an inquiry at the Accepted stage or later (FR-001). System MUST set the system-generated cancellation reason \"Account Deleted (System)\" and `cancelled_by = system` and MUST NOT prompt the patient for a cancellation reason. Draft, sent, and expired quotes are auto-cancelled as in Workflow 5, other quotes keep their status and cause; only providers whose quotes were cancelled are notified and MUST NOT see the cancellation reason; inquiry becomes read-only."}}
  - {"op": "update_node", "id": "STP-003-085", "title": "Admin approval of the account-deletion request cancels the open inquiry with a system reason"}

