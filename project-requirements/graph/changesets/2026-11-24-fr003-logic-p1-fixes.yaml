  - {"op": "update_node", "id": "REQ-003-125", "attrs": {"statement": "On the cancel confirmation modal (Screen 8a) the Impact Summary reads \"X quotes will be cancelled\" when the inquiry has quotes to cancel (draft, sent or expired) and \"No quotes to cancel\" when it has none, taken from `preview_quote_count`, counted when the modal opens. The note \"Providers of the quotes being cancelled will be notified of this cancellation within 5 minutes\" is shown only when there are quotes to cancel. Go Back closes the modal with no change of state."}}
  - {"op": "update_node", "id": "REQ-003-126", "attrs": {"statement": "On the cancellation success screen (Screen 8b) the Impact Summary reads \"Your inquiry was cancelled.\" when no quote was cancelled and \"Your inquiry and X quote(s) were cancelled.\" otherwise, where X is the committed `cascade_quote_count`. The line \"The providers of the cancelled quotes have been notified of this cancellation.\" is shown only when at least one quote was cancelled."}}
