  # P1-03: admin cancel and Close inquiry cover the replacement draft
  - {"op": "add_node", "id": "REQ-003-127", "type": "Rule", "title": "Admin cancellation or Close inquiry also cancels a replacement draft, with no provider notice", "owner_fr": "FR-003", "attrs": {"statement": "When an admin cancels the booking through FR-006 Screen 9 or closes the inquiry through Close inquiry on FR-006 Screen 6, System MUST move any draft replacement quote of that inquiry to `Cancelled (Inquiry Cancelled)`, MUST NOT send `quote.cancelled_inquiry` to the replacement provider, and no `quote.expired` follows. The quote-side behaviour is owned by FR-004 (REQ-004-111). The patient cancellation path has no replacement draft, because a replacement exists only after acceptance.", "rationale": "The rule that owns the cascade trigger (REQ-003-013) covers the patient and account-deletion paths only, so the admin paths needed their own trigger in this FR.", "distinct_from": "REQ-004-111"}}
  - {"op": "add_edge", "from": "REQ-003-127", "verb": "applies at", "to": "STG-main-03-acceptance"}
  - {"op": "add_edge", "from": "REQ-003-127", "verb": "applies at", "to": "STG-main-04-booking"}
  - {"op": "add_edge", "from": "REQ-003-127", "verb": "applies to", "to": "ENT-quote.status"}
  - {"op": "add_edge", "from": "REQ-003-127", "verb": "applies to", "to": "ACT-platform-admin"}
  - {"op": "add_edge", "from": "REQ-003-127", "verb": "decided by", "to": "SRC-PRD-003"}
  - {"op": "add_edge", "from": "STP-003-084", "verb": "applies", "to": "REQ-003-127"}
  - {"op": "add_edge", "from": "STP-003-084", "verb": "next", "to": "STP-004-126", "attrs": {"label": "any replacement draft is cancelled with no notice"}}
  - {"op": "update_node", "id": "REQ-003-013", "attrs": {"statement": "System MUST auto-cancel only the draft, sent, and expired quotes when an inquiry is cancelled by the patient or by an approved account deletion, with distinct cancellation status \"Cancelled (Inquiry Cancelled)\"; quotes in any other status MUST keep their status and cause, and `quote.cancelled_inquiry` (FR-020) MUST go only to providers whose quotes were cancelled by this cascade, never to the provider of a replacement draft (REQ-003-127)."}}
  - {"op": "update_node", "id": "REQ-003-014", "attrs": {"statement": "When an admin cancels a booking through FR-006, System MUST set the inquiry to `Cancelled`, release any active appointment slot hold (FR-006 hold of the FR-026 configured duration) immediately, and leave the accepted quote with the status `accepted`. Any draft replacement quote follows REQ-003-127."}}

  # P1-04 (owner default 61): admin archive guard
  - {"op": "update_node", "id": "REQ-003-088", "title": "Admin soft delete only, with reason, Archived badge and a live-quote guard", "attrs": {"statement": "Soft delete only (no hard deletes). Archive requires reason and confirmation; retains data for audit; prevents further edits; read-only view after deletion; display badge \"Archived\" across all admin views. Archive is refused with a message when the inquiry has a live quote (a sent quote that has not expired) or an accepted quote or booking; otherwise it proceeds. Archiving sends no patient or provider notice."}}
