  - {"op": "add_node", "id": "REQ-015-133", "type": "Rule", "owner_fr": "FR-015", "title": "Document upload failure shows an error and retries automatically", "attrs": {"statement": "If a document upload fails, the admin sees the error \"Document upload failed. Please retry.\" The upload is retried automatically up to 3 times before it fails, and an interrupted upload (for example a network interruption) can be retried by the admin; the system supports resumable uploads and may resume from the last successful chunk if implemented, otherwise it restarts the upload.", "rationale": "prd.md lines 972, 1168 (External Service 3 failure handling; edge case upload fails mid-upload)."}}
