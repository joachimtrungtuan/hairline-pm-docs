reason: "FR-015 completeness re-check 2026-11-21: required flags back to optional (ruling A8), Featured Filter, reactivation reason limits, Edit Profile, Tab 1 read-only commission, phone format, reorder, document sort and filter, upload failure, unresolved support count, payout readiness display, and references to FR-009 and FR-013 Rules"
by: controller
operations:
  - {"op": "update_field", "id": "ENT-provider.email", "required": false}
  - {"op": "update_field", "id": "ENT-provider.phone", "required": false}
  - {"op": "update_field", "id": "ENT-provider.specialty", "required": false}
  - {"op": "update_node", "id": "REQ-015-089", "attrs": {"statement": "Dashboard displays all providers with status = \"Active\" by default on initial load Search queries match against provider name, clinic name, email, medical license number (case-insensitive) Search Bar accepts at most 200 characters; Status Filter allows multiple selections; Featured Filter, when switched on, shows only featured providers; Commission Type Filter is Percentage, Flat Rate or All; Closure Requested Filter shows providers with a pending FR-032 closure request."}}
  - {"op": "update_node", "id": "REQ-015-080", "attrs": {"statement": "Available only when provider status = Suspended; Deactivated providers can never be reactivated (Rule 4) The reason is required, 20 to 500 characters; the admin re-authenticates with the acting admin's password (MFA once the FR-026 and FR-031 MFA stack is delivered) and must check \"I confirm this action\" to enable submit; Notify Provider is checked by default and sends the reactivation email to the provider Owner including the reason On submit, status changes to Active immediately; the status event (reason, admin, timestamp) is logged in Tab 8 On submit, any pending scheduled suspension or deactivation is cancelled automatically; the cancellation is logged in Tab 8 with the reactivation reason and admin, and the reactivation email states that the scheduled change no longer applies (if the provider had been notified of it)"}}
  - {"op": "update_node", "id": "REQ-015-122", "title": "Header quick actions: Edit Profile opens all tabs in edit mode; the others are shown only for the matching status", "attrs": {"statement": "\"Edit Profile\" opens all tabs in edit mode. \"Reactivate\" (visible only if Suspended; opens Screen 5) \"Cancel Scheduled Change\" (visible only if a scheduled suspension/deactivation is pending; see Screen 4)"}}
  - {"op": "update_node", "id": "REQ-015-108", "title": "Tab 7 is the single-provider commission surface; Tab 1 shows commission read-only", "attrs": {"statement": "FR-029 / A-09 owns the central commission-settings screen (global default + provider-specific commission scopes) and the booking-time snapshot policy; this tab remains the single-provider management surface for provider-specific commission configuration. Commission is edited only in Tab 7; Tab 1 shows it read-only as the Commission Summary, with a \"Manage in Commission & Financials\" link to Tab 7."}}
  - {"op": "add_node", "id": "REQ-015-129", "type": "Rule", "owner_fr": "FR-015", "title": "Phone numbers must be valid; the public phone is a country code plus a numeric number", "attrs": {"statement": "The provider Phone Number MUST be a valid phone number with country code (Screen 2 Step 1, Tab 1). The public Contact Phone has a Country Code (dropdown from FR-026) and a Number (numeric only, length validated per country code).", "rationale": "prd.md lines 314, 337, 423, 432 (Phone Number valid format with country code; Contact Phone (Public) country code dropdown plus numeric number)."}}
