  - {"op": "add_node", "id": "REQ-015-134", "type": "Rule", "owner_fr": "FR-015", "title": "Reactivation modal shows the count of unresolved support items", "attrs": {"statement": "Screen 5 shows the number of this provider's affected inquiries and cases (bookings, In Progress or Aftercare cases, standalone aftercare) still marked Admin Support Required. Each affected record counts once, matching the FR-020 `provider.status_cancellation_admin_support` unit (one per affected inquiry or case). The count links to the FR-016 list filtered to this provider and Admin Support Required. It is informational and does not block reactivation.", "rationale": "prd.md lines 757 (Screen 5 Unresolved Support Items row)."}}
