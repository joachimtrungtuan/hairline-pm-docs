# Cross-FR alignment for the payment, installment, provider team, treatment execution and aftercare requirements.
reason: "Align payment and installment notice recipients and admin permissions, provider invitation acceptance and Owner handover, treatment record clinician replacement and template copies, and the aftercare medication pick with the neighbouring requirements."
by: docs-manager
operations:
  - {"op": "add_node", "id": "REQ-010-123", "type": "Rule", "owner_fr": "FR-010", "title": "A team member who leaves the case is replaced in the clinician set of open treatment records", "attrs": {"statement": "System MUST, when a team member is removed or suspended, has a role change that takes away the rights needed to work their open items, or is force-suspended or force-removed by an admin, rewrite the clinician set (clinician_ids) of every open treatment record (Awaiting Check In or In Progress) that names the member to the replacement clinician chosen at that moment, as a system change recorded in the treatment record's audit history and not as a treatment-detail change (Alternative Flow A2); the other clinicians on the record stay and at least one remains; Completed, Closed Early and Cancelled records keep their clinician set; reactivating the member does not give the records back (FR-009 REQ-009-191)"}}
  - {"op": "add_edge", "from": "STP-007-003", "verb": "applies", "to": "REQ-027-033"}
  - {"op": "add_edge", "from": "FR-007", "verb": "references", "to": "REQ-027-033"}
  - {"op": "add_edge", "from": "STP-009-006", "verb": "applies", "to": "REQ-027-062"}
  - {"op": "add_edge", "from": "STP-009-006", "verb": "applies", "to": "REQ-027-019"}
  - {"op": "add_edge", "from": "REQ-010-123", "verb": "applies at", "to": "STG-main-06-treatment"}
  - {"op": "add_edge", "from": "REQ-010-123", "verb": "applies to", "to": "ENT-treatment-record.clinician_ids"}
  - {"op": "add_edge", "from": "REQ-010-123", "verb": "applies to", "to": "ENT-treatment-record"}
  - {"op": "add_edge", "from": "REQ-010-123", "verb": "decided by", "to": "SRC-PRD-010"}
  - {"op": "update_node", "id": "REQ-007-017", "attrs": {"statement": "Before initial processor submission, system MUST validate FR-006 selection eligibility, accepted versions, and exclusive unexpired hold ownership; invalid handoffs are blocked and hold expiry follows `Payment Window Expired`, without hold extension or quote reopening. Payment failure MUST NOT extend or restart the hold; only the FR-006 audited admin revive creates a new hold. Later confirmed-booking payments do not acquire a new acceptance hold. A patient who has not accepted the Current Terms and Privacy Policy cannot start a payment (REQ-027-033); a scheduled installment charge is not blocked by it."}}
  - {"op": "update_node", "id": "REQ-007-099", "attrs": {"statement": "Unpaid: nothing is paid. Deposit only: the deposit is paid and the balance is not. Installments active: an installment plan has started and is not fully paid. Full paid: the whole payable total is paid. Refunded: all money paid has been returned; a part refund leaves the previous status and shows in the refund history. Deposit status Partial: only part of the deposit amount has been received and the rest is still due; the booking is not confirmed until the full deposit is paid, Payment Status stays Unpaid (there is no Pending value), and the partial deposit is refunded in full automatically when the hold expires (REQ-007-096). At Risk is not a status. The moment the booking becomes Full paid, whichever option settled it (pay in full, the final balance or the last installment), is the fully-paid event other modules read; FR-018 reads it for affiliate accrual (REQ-018-309)."}}
  - {"op": "update_node", "id": "REQ-007-036", "attrs": {"statement": "The final payment is due the number of days before the procedure date that FR-029 sets as the deposit plan balance due days (launch default 7; an admin edits it in FR-029). The booking's Final Payment Status is stored and moved by a scheduled job, by calendar day in the clinic's timezone: Not Due, then Due on the due date, then Overdue the day after the due date with a balance unpaid. On entering Overdue the job flags the booking once, notifies billing admins and sends the patient one overdue notice (notification catalogue event `payment.overdue_notice`, FR-030). The Overdue flag is read from that status; it is cleared and reminders stop when the booking is Cancelled or Completed. An overdue balance never causes Payment Window Expired and cancels the booking only through the FR-006 unpaid balance cancellation (REQ-007-021)."}}
  - {"op": "update_node", "id": "REQ-007-015", "attrs": {"statement": "Admin approval applies only to an exception refund and a manually entered refund. The approver is any other admin who holds the Issue Refunds permission (FR-031), never the requester, who finds the request in the Awaiting approval view and approves or denies within 2 business days; until then the refund is awaiting approval. While only one admin holds the Issue Refunds permission, a refund that needs approval stays awaiting approval until a second holder exists (REQ-031-069). When 2 business days pass with no decision, System sends an escalation notice to a super-admin (notification catalogue event `refund.approval_escalated`, FR-030), who decides in the same view, never as the requester; System never approves or denies on its own. A closure-case refund (REQ-006-053) runs with no second approval. The sum of all refunds on a booking never exceeds the amount paid (REQ-007-066). The requester, approver, decision and reason are logged and notifications sent."}}
  - {"op": "update_node", "id": "REQ-007-064", "attrs": {"statement": "An exception to the policy (for example a medical emergency) needs documentation upload and the approval of a different admin who holds the Issue Refunds permission (REQ-007-015); the requester cannot approve it. The refund stays awaiting approval until the decision."}}
  - {"op": "update_node", "id": "REQ-007-100", "attrs": {"statement": "For a standalone aftercare payment (REQ-007-088) no refund ladder applies: an admin decides any refund beyond FR-011's own refund cases with a reason on Screen 6, opened from the aftercare payment record, as a manual refund (REQ-007-015). FR-011's own cases are the automatic refund in REQ-011-037 and the pro-rata refund of the unused full months when a plan paid in full is cancelled (REQ-011-097); the system starts them, and the commission and the provider's payout (FR-017) fall in the same proportion. The provider's money is released after the same patient confirmation window as a booking, counted from the date of the payment instead of procedure completion."}}
  - {"op": "update_node", "id": "REQ-007-012", "attrs": {"statement": "System MUST support release of the clinic's share and its payout with commission deduction and statement generation, per Fund Release & Money Routing Rules (payout execution is owned by FR-017). A handover fee for aftercare handed to the Hairline team (REQ-011-057) is paid to the provider from Hairline's own revenue and is never taken from a price"}}
  - {"op": "update_node", "id": "REQ-007-097", "attrs": {"statement": "Every refund is executed on Screen 6. A closure-case refund follows the booking's recorded closure cause (REQ-006-053) and is started by the system, never by an admin. An admin submits only an exception to the policy or a manual refund, the only cases offered when no closure cause is recorded or the cause is not listed. An exception or manual refund is admin-set: any amount from zero up to the amount still refundable, with a mandatory reason, and the ladder amount is shown beside it. FR-006 Process Refund and the FR-017 refund action open this screen instead of running their own refund. FR-017 opens it from its refund launcher (Screen 4b) and from its completion problem outcomes (Screen 7) with the invoice and booking prefilled and, where an admin has already set the amount there, that amount shown; the amount stays within the amount still refundable."}}
  - {"op": "update_node", "id": "ENT-payment.approved_by", "attrs": {"description": "The other admin holding the Issue Refunds permission who approved or denied; never the requester."}}
  - {"op": "update_node", "id": "EVT-payment-overdue", "attrs": {"description": "payment.overdue_notice: a scheduled job raises this once when a balance is still unpaid the day after its due date: Final Payment Status becomes Overdue, the booking is flagged, billing admins are notified and the patient gets one overdue notice. It stops when the booking is Cancelled or Completed."}}
  - {"op": "update_node", "id": "EVT-refund-approval-escalated", "attrs": {"description": "refund.approval_escalated: escalation notice to a super-admin when an exception or manual refund has had no decision for 2 business days; the refund stays awaiting approval."}}
  - {"op": "update_node", "id": "STP-007-025", "title": "Another admin who holds the Issue Refunds permission finds the request in the Awaiting approval view and approves or denies within 2 business days; the requester can never decide their own request; requester, approver and decision are recorded in the audit entry"}
  - {"op": "update_node", "id": "REQ-007B-016", "attrs": {"statement": "System MUST send the patient a confirmation notification after a successful installment charge"}}
  - {"op": "update_node", "id": "REQ-007B-093", "attrs": {"statement": "A booking status change notification is sent to the patient when the final installment completes."}}
  - {"op": "update_node", "id": "EVT-installment-plan-completed", "attrs": {"description": "Booking status change notification sent to the patient when the final installment completes (communication scope, final installment)."}}
  - {"op": "update_node", "id": "REQ-007B-049", "attrs": {"statement": "When the final installment is paid, normally by the cutoff date, the system marks the installment plan as completed (shown as \"Fully Paid\"); the booking status continues to follow FR-006. The booking's Payment Status becomes Full paid at that moment (FR-007 REQ-007-099), the fully-paid event FR-018 reads (REQ-018-309)."}}
  - {"op": "update_node", "id": "REQ-007B-059", "attrs": {"statement": "When a patient disputes a charge for a partial-installment refund, the admin reviews the dispute and the refund is processed per the resolution through the FR-007 approval (another admin who holds the Issue Refunds permission, escalating to a super-admin, never self-approved); the admin may cancel the booking where its state allows it, or allow continuation."}}
  - {"op": "update_node", "id": "REQ-007B-081", "attrs": {"statement": "The admin can Mark as Resolved an unpaid installment only for a bank transfer into Hairline's account: the admin enters the amount, date, receiving account and reference, and a second admin who holds the Resolve Installments permission approves it (REQ-007B-109). On approval the system sets the installment Paid with payment source manual and passes the payment to FR-007; the plan then follows REQ-007B-108."}}
  - {"op": "update_node", "id": "REQ-007B-090", "attrs": {"statement": "Only an admin who holds the matching permission can run an installment action: Retry Charge for Retry Charge, and Resolve Installments for Mark as Resolved and for approving it (FR-031)."}}
  - {"op": "update_node", "id": "REQ-007B-109", "attrs": {"statement": "Mark as Resolved is used only for a bank transfer into Hairline's account. The admin enters the amount, date, receiving account and reference, and a second admin who holds the Resolve Installments permission (FR-031) approves it, never the same admin; only then is the installment Paid with payment source manual. FR-007 owns the manual payment record, the refund of a manual payment and the clinic-share movement for it."}}
  - {"op": "update_node", "id": "SCR-007B-06", "attrs": {"description": "Actionable view of one booking's installment plan with the Admin Action Panel (Retry Charge, Mark as Resolved), each with a justification of at least 20 characters. Mark as Resolved is only for a recorded bank transfer (amount, date, receiving account, reference) that a second admin who holds the Resolve Installments permission approves. The panel is a UI control group; its justification is written to the audit log (S-06), not to a graph entity. Cancelling a booking is not a plan action: it uses the FR-006 Cancel Booking action."}}
  - {"op": "update_node", "id": "ENT-installment-payment.payment_source", "attrs": {"description": "How a Paid installment was settled: an automatic charge, or manual when an admin marked a recorded bank transfer resolved after a second admin who holds the Resolve Installments permission approved it (REQ-007B-109)."}}
  - {"op": "update_node", "id": "STP-007B-413", "title": "After treatment has started, the admin resolves a Defaulted plan by payment only, with Retry Charge or Mark as Resolved (a recorded bank transfer a second admin who holds the Resolve Installments permission approves) and no cancel route"}
  - {"op": "update_node", "id": "STP-007B-418", "title": "To settle an installment outside the card the admin enters the amount, date, receiving account and reference of a bank transfer with Mark as Resolved; a second admin who holds the Resolve Installments permission approves it before the installment is Paid with source manual"}
  - {"op": "update_node", "id": "REQ-009-045", "attrs": {"statement": "New Team Member enters a phone number, sets a password under the platform password policy (REQ-SYS-007) and accepts the Current Terms & Conditions and the Current Privacy Policy; this writes the member's first legal acceptance ledger rows (FR-027 REQ-027-062, REQ-027-019) System creates a new team member record (status Active) and links it to the provider organization with the assigned role and an Account Name of First Name + Last Name (FR-032 REQ-032-062). This is the first point at which the invitee becomes a team member; an archived record of a Removed member stays archived System marks invitation as \"Accepted\""}}
  - {"op": "update_node", "id": "REQ-009-113", "attrs": {"statement": "Screen 8 Account Setup: Email pre-filled from invitation, locked, must match invitation token. First Name and Last Name required, 2-50 characters, letters/spaces/hyphen. Phone Number required, E.164 format, uniqueness per user within provider, must be verified via one-time code where possible. Password required, must satisfy the platform password policy (REQ-SYS-007). Confirm Password must match Password. Accept Terms required, must be checked before submission; it confirms the Current Terms & Conditions and the Current Privacy Policy and writes the member's first legal acceptance ledger rows (FR-027 REQ-027-062, REQ-027-019)."}}
  - {"op": "update_node", "id": "REQ-009-008", "attrs": {"statement": "System MUST enforce the global provider email identity rule (Rule 3): an email can belong to only one provider organization at a time as Owner, team member, or pending invitation; invitations, FR-015 provider creation, and FR-015 owner login-email edits that use an email tied to another non-Deactivated provider must be blocked; emails of Deactivated providers are freed for reuse while their records stay archived; a Removed member's email is free for any provider; a team member's email is not editable on the provider platform; support changes it on request (FR-032 REQ-032-144)"}}
  - {"op": "update_node", "id": "REQ-009-077", "attrs": {"statement": "System leaves the clinic's patient conversations unchanged by a removal: each conversation belongs to the clinic (one conversation per patient and provider, FR-012), so no routing changes and no patient message is sent. Colleagues keep reading and replying in the same conversation: a colleague's messages show the colleague's name, and one unread count is kept per clinic (FR-012 REQ-012-001, REQ-012-060)."}}
  - {"op": "update_node", "id": "REQ-009-174", "attrs": {"statement": "System MUST let only a Hairline admin hand the Owner role of a provider organization to another person (Rule 11). The provider organization keeps exactly one Owner before, during, and after the handover, and no provider-side user can start a handover. The new Owner MUST already be an active team member of that organization; the previous Owner becomes a Manager; the action requires a reason; and the new and the previous Owner are both notified by email. The admin starts it from Screen 12. The handover is allowed while the provider is Suspended and unavailable while it is Deactivated. The new Owner's login email follows the FR-015 login email steps (REQ-015-114): notices to the old and the new address, the previous Owner signed out, and an automatic activation email when the new Owner's password is not set."}}
  - {"op": "update_node", "id": "ENT-team-member.password", "attrs": {"description": "Credential set at account setup under the platform password policy (REQ-SYS-007); held by the provider authentication service and never displayed."}}
  - {"op": "update_node", "id": "ENT-team-member.phone_number", "attrs": {"description": "E.164 format; required at account setup (Screen 8); shown masked on Screens 6 and 11."}}
  - {"op": "update_node", "id": "ENT-team-member.terms_accepted_at", "attrs": {"description": "Records the Accept Terms checkbox at account setup; the accepted versions are held in the FR-027 legal acceptance ledger."}}
  - {"op": "update_node", "id": "ENT-team-member.unread_messages_count", "attrs": {"description": "Not kept per team member: the unread count is kept once per clinic (FR-012 REQ-012-001)."}}
  - {"op": "update_node", "id": "STP-009-006", "title": "New team member enters a phone number, sets a password and accepts the Current Terms and Privacy Policy"}
  - {"op": "update_node", "id": "REQ-010-027", "attrs": {"statement": "System MUST make FR-010 the only path for post-acceptance changes to treatment plan days, clinician set, and estimated graft count (apart from the admin edit of the accepted quote, REQ-005-023, and the replacement-clinician rewrite when a team member leaves the case, REQ-010-123), blocked while the booking is `Accepted` and limited to the clinic (Owner, Manager, or Clinical Staff, from `Confirmed` until Check In) and admins (from `Confirmed` until the treatment ends); each change MUST require a reason, be audited with before/after values, notify the patient through the FR-030 `treatment.plan_changed` event, leave the accepted snapshot unchanged, and never change money fields (Rule 13; Alternative Flow A2)"}}
  - {"op": "update_node", "id": "REQ-010-042", "attrs": {"statement": "After subquote acceptance, FR-010 is the only path for changing the treatment plan days, the assigned clinician set, and the estimated graft count, apart from the admin edit of the accepted quote (REQ-005-023) and the replacement-clinician rewrite when a team member leaves the case (REQ-010-123); the rest of this rule governs the FR-010 path. No change is allowed while the booking is `Accepted` (unpaid); changes are allowed only from `Confirmed`. Only the clinic (Owner, Manager, or Clinical Staff, from `Confirmed` until Check In) or an admin (from `Confirmed` until the treatment ends) may make the change. Each change MUST record actor, role, reason, timestamp, and before/after values; MUST notify the patient through the FR-030 `treatment.plan_changed` event; MUST leave the accepted snapshot unchanged as the original record; and MUST NOT change price, currency, date range, appointment, or promotion (Alternative Flow A2). Admin changes use FR-010 Screen 9."}}
  - {"op": "update_node", "id": "REQ-010-004", "attrs": {"statement": "System MUST require minimum documentation before allowing treatment completion: conclusion notes, prescription, advice, medication (one text box, must not be empty), actual graft count, final head scan photo set (V1). Medication and advice text can be picked from the Active medication and post-op instruction templates and customised; the record keeps its own copy, so a later template edit or deactivation does not change it (FR-024 REQ-024-085)."}}
  - {"op": "update_node", "id": "ENT-treatment-record.clinician_ids", "attrs": {"description": "One or more clinicians, seeded from the accepted snapshot's clinicianIds; changed only through a treatment-detail change; at least one must remain. Also rewritten to the replacement clinician when a team member leaves the case (REQ-010-123). Actual FR-010 execution record."}}
  - {"op": "update_node", "id": "ENT-treatment-record.medication_instructions", "attrs": {"description": "Free text, which can be picked from the Active medication templates and customised (the record keeps its own copy); required to complete treatment. Also listed as Entity 3 in Key Entities; the duplication is a modelling question."}}
  - {"op": "update_node", "id": "ENT-treatment-record.advice", "attrs": {"description": "Can be picked from the Active post-op instruction templates and customised (the record keeps its own copy); required to complete treatment."}}
  - {"op": "update_node", "id": "REQ-011-089", "attrs": {"statement": "The provider MUST pick each aftercare medication only from the Active templates of the admin-managed medication list (the FR-024 medication templates); free-text medication names are not allowed. The plan keeps its own copy of the text, so a later template edit or deactivation does not change it."}}
  - {"op": "update_node", "id": "REQ-011-080", "attrs": {"statement": "Direct patient to provider chat is out of scope (handled by FR-012; that conversation stays open while the pair has live aftercare and becomes read-only once nothing live is left between them (FR-012 REQ-012-018)) and payment flows beyond standalone activation are out of scope (Payment FR)."}}
  - {"op": "update_node", "id": "ENT-aftercare-medication.name", "attrs": {"description": "Picked only from the Active medication templates (FR-024); the plan keeps its own copy of the text."}}
