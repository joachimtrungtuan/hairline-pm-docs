# ---- Rule updates ----------------------------------------------------------
- op: update_node
  id: REQ-025-024
  attrs:
    statement: 'All Active questions must pass completeness validation before the parent set can be published. Saving accepts an incomplete question and keeps its status; publish lists the incomplete questions, and the Admin completes them or sets them Inactive'
- op: update_node
  id: REQ-025-028
  title: 'A category is deleted only when no set is assigned, otherwise it is deactivated'
  attrs:
    statement: 'A category can be deleted only when no set of any status (Draft, Active or Archived) is assigned to it; otherwise the Admin deactivates it, which hides it from the category picker for new sets'
- op: update_node
  id: REQ-025-038
  attrs:
    statement: 'Any earlier version must be restorable as a new Draft, which is then published; there is no one-step rollback, and the Active version is unaffected until the restored Draft is published; Restore is refused while the set has an open Draft; on an Archived set the set shows status Draft from the restore until the restored Draft is published'
- op: update_node
  id: REQ-025-045
  attrs:
    statement: 'A set designated for Inquiry cannot be deleted, only archived; a set assigned to a milestone can be neither deleted nor archived until those milestones are reassigned; Archived is terminal, and the way back is Restore as New Draft then publish. Archiving a set discards its open Draft, and the archive confirmation warns of this; a restored set comes back as a new Draft built from the selected version, with no Inquiry designation and no earlier draft, and is Active again when published'
- op: update_node
  id: REQ-025-046
  attrs:
    statement: 'Delete is allowed only for a set that was never published and has no usages; a set that has been published can only be archived. Delete permanently removes the set and its questions; the audit entries of a deleted set stay in storage (REQ-025-040) and have no screen at launch'
- op: update_node
  id: REQ-025-050
  attrs:
    statement: 'At most one set may be designated as the active Inquiry questionnaire at a time. Clicking "Set as Active for Inquiry" on a second set shows a confirmation dialog and, upon confirmation, transfers the designation from the previous set to the new one; every patient inquiry started after the change uses the new set immediately, and a resumed draft keeps its version'
    rationale: 'Workflow 4: System shows confirmation ''This will replace [Current Set Name] as the active Inquiry questionnaire. Continue?''; cancel leaves the previous set active; on confirm every patient inquiry (FR-003) started afterwards uses the new set immediately, and a resumed draft keeps its version.'
- op: update_node
  id: REQ-025-051
  attrs:
    statement: 'The "Set as Active for Inquiry" action is only available on sets with Status = Active (published) and Context Type = Inquiry or Multi-Context. It is hidden for Draft, Archived, and Aftercare-only sets and on the set that already carries the designation; the block message appears only when the set changed after the screen loaded'
- op: update_node
  id: REQ-025-056
  attrs:
    statement: 'Version consistency must be maintained across all platforms; questionnaire changes must propagate immediately to the patient platform for a new start, and a resumed draft keeps its version'
# ---- Step titles and field description -------------------------------------
- op: update_node
  id: STP-025-015
  title: 'Admin is told publish is blocked and sees the list of incomplete questions, unfit uses or the missing Active category'
- op: update_node
  id: STP-025-059
  title: 'Admin archives a set; the confirmation warns that its open Draft is discarded'
- op: update_node
  id: ENT-questionnaire-question.status
  attrs:
    description: 'Active / Inactive; Deleted for a soft-deleted question, which is not listed. Default Active.'
