# Operations ordered so removals come first, then updates, then new edges; no add_node, add_field or add_enum_value is needed. Stage data-flow edges on shared stages are touched only where the entity or event is owned by FR-025. Needs on other FRs are queued in the ledger, not in this file.
reason: 'FR-025 logic review pass 2: Draft and Archived sets can be opened and an Archived set restored; archiving discards the open Draft (owner default 105) and a restored set returns as a new Draft without the designation; archive path from the designation step runs through the archive rules and its outcomes are exclusive; Set as Active for Inquiry reachable from the catalog; publish confirmation has its cancel exit and the publish block covers unfit Context Type and the inactive category; question edit reaches the text step for every set type; questionnaire writers and the publish event sit on the configuration stage; REQ-025-084 and REQ-025-017 regain their patient-side and provider-side anchors; immediately means a new start, a resumed draft keeps its version; incomplete question is saved and caught at publish; Set as Active for Inquiry hidden on the designated set; category deleted only when no set at all is assigned, otherwise deactivated (owner default 106); audit entries of a deleted set stay in storage with no screen at launch (owner default 107); preview no longer carries the provider alert display rule; question status field description lists Deleted.'
by: docs-manager
operations:
