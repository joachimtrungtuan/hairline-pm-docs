  type: Rule
  owner_fr: FR-013
  title: Flagged review stays publicly visible, shows as Published
  attrs:
    statement: A review with status Flagged MUST stay publicly visible until an admin removes it; patients and the public see it as Published.
    rationale: Security and Privacy Requirements, workflow B2 outcome and Edge Cases (duplicate or spam). Admins see the Flagged status; the public view does not change until a removal.
