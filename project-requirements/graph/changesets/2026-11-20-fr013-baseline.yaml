reason: 'Requirements graph programme baseline 2026-11-20: owner rulings applied (FR-013)'
by: controller
operations:
- op: update_node
  id: REQ-013-002
  title: Review needs 3 months since completion; one published review per procedure
  attrs:
    statement: System MUST enforce time gating (≥ 3 months) and one published review per completed procedure. After an approved takedown the patient MAY submit one new review for the same procedure; both reviews are kept in the archive.
- op: update_node
  id: REQ-013-017
  title: Review events raise notifications; delivery follows FR-020 and FR-030
  attrs:
    statement: 'The review module raises a notification on each of these events: new published review, provider reply, admin removal, takedown decision. Invitation and reminder timing is owned by FR-030. Delivery, recipients, content and opt-out follow the notification-service Rule in FR-020 and the FR-030 notification catalogue.'
    rationale: Restated by Main Flow step 4(d), workflows A3 step 4, A4 step 4 and B1 outcome, the Provider Platform scope (receive notification on new published reviews) and Shared Services. Invite and reminder timing is owned by FR-030; delivery, recipients, content and opt-out are owned by FR-020 and the FR-030 catalogue.
- op: update_node
  id: REQ-013-020
  title: Takedown modal with required reason and 10-year retention notice
  attrs:
    statement: Takedown request submission MUST use a confirmation modal/bottom-sheet with required patient reason and explicit 10-year retention-policy notice before submission.
    rationale: 'Screen 3 rules: the takedown request is submitted from a bottom sheet/modal with required reason and mandatory retention-policy notice. The notice text is display-only policy text: "Review content will be removed from public view but archived for 10 years. Audit records of this takedown are kept for the same 10 years." Change Log 1.14 makes the reason required.'
- op: update_node
  id: REQ-013-035
  attrs:
    statement: Admin-imported authenticated reviews must be flagged as "Verified Off‑platform" with verification source and date. These are published directly by admin (no patient submission flow). Each is linked to a placeholder patient and a placeholder procedure.
- op: update_node
  id: REQ-013-040
  attrs:
    statement: 'Review status badge uses app-facing labels: `Published`, `Removed`. A review with status `Flagged` stays publicly visible and shows as `Published` to the patient. `Submitted` is not a review status in V1; successful review submission immediately creates a `Published` review. Takedown request state is displayed separately from review status when applicable (`Pending`, `Approved`, `Rejected`). `Removed` means no longer publicly visible due to admin action or approved takedown.'
    rationale: Screen 2 business rules. Key Entities give the review a third status, Flagged, which admins see and patients and the public see as Published (REQ-013-079). Change Log 1.10.
- op: update_node
  id: REQ-013-046
  attrs:
    statement: 'Admin reviews request reason, review content, and compliance context. Admin approves or rejects request with decision note. System applies decision: approved -> review unpublished/archived and provider rating metrics recalculated; rejected -> review remains published. System notifies patient of decision and reason; the decision note is also shown on Review Detail (Screen 3).'
    rationale: Workflow A4. Edge Cases add that on a rejected request the review stays published and the decision reason is visible to the patient on Review Detail (Screen 3).
- op: update_node
  id: REQ-013-048
  title: Review content retained for the 10-year period; takedowns archive, never hard-delete
  attrs:
    statement: 'Review content (review record + photos + provider responses + takedown requests) retained per the system PRD, Platform-Wide Rules: One 10-year retention period; approved takedown requests are processed by unpublish + archival with restricted access — never hard-deleted.'
- op: update_node
  id: REQ-013-049
  title: Audit records immutable and retained for the 10-year period
  attrs:
    statement: '`AdminAction` and all audit-log records (patient self-edits, admin edits/removals/seeded reviews, takedown decisions, settings changes, provider responses) are immutable (Constitution §VI, Audit Trail); retention follows the system PRD, Platform-Wide Rules: One 10-year retention period.'
    rationale: Data & Privacy Rules; Change Log 1.13 item 1. Retention follows the one 10-year period of the system PRD.
- op: update_node
  id: REQ-013-069
  attrs:
    statement: 'Configurable with Restrictions: Flagging thresholds and auto-flag rules for admin review (within safe bounds approved by policy). Takedown decision SLA/queue prioritization parameters (within policy bounds); the takedown decision deadline defaults to 48 hours.'
- op: update_node
  id: REQ-013-070
  attrs:
    rationale: Composed from the Admin Editability Rules (Editable by Admin) and the Screen 10 row Review categories/labels (Admin-editable labels; canonical keys remain fixed). Invitation timing and reminders are configured in FR-030, not here (REQ-013-022, Screen 10 and Change Logs 1.12 and 1.14).
- op: update_node
  id: REQ-013-073
  attrs:
    statement: 'Trigger: Content flagged by system-automated detection (keyword matching, duplicate submission patterns, rate-limit triggers). User-initiated flagging is a future enhancement. Steps: System queues flagged content for admin review; Admin may redact, unpublish, or uphold. Outcome: Policy-compliant content remains; violations are removed with audit record. A flagged review stays publicly visible (shown as Published) until an admin removes it.'
- op: update_node
  id: REQ-013-075
  attrs:
    statement: Review content will be removed from public view but archived for 10 years. Audit records of this takedown are kept for the same 10 years.
    rationale: Screen 3 Retention notice. REQ-013-020 requires the notice; this Rule carries its text, which reflects the one 10-year retention period.
- op: add_node
  id: REQ-013-077
  type: Rule
  owner_fr: FR-013
  title: Admin-seeded reviews use a placeholder patient and procedure
  attrs:
    statement: Each admin-seeded (off-platform) review MUST be linked to a placeholder patient and a placeholder procedure, so REQ-013-010 holds for every review.
    rationale: Admin-Seeded Review Policy and Data Requirements. Closes the gap that seeded reviews have no real patient or procedure while REQ-013-010 requires both links.
