  - {"op": "update_node", "id": "REQ-032-063", "attrs": {"statement": "Account Name: Max 200 chars; First Name and Last Name: 2-50 characters, letters, spaces, hyphens (same as FR-009); Account Email: Valid email format, unique per FR-009 Rule 3 (an email belongs to at most one provider organization at a time); Account Email is read-only for every role (REQ-032-144)"}}
  - {"op": "update_node", "id": "REQ-032-064", "attrs": {"statement": "Timezone is saved per person and applies to all date/time displays in that person's provider dashboard session; the browser timezone is offered at first login, otherwise UTC (REQ-032-145); existing timestamps in the database remain in UTC, converted for display with the fixed offsets of the FR-026 timezone list (REQ-026-121)"}}
  - {"op": "update_node", "id": "REQ-032-067", "attrs": {"statement": "Suspended: The Owner and every FR-009 team member can still log in and see a persistent, non-dismissible banner on every Provider Platform page: \"Your account is temporarily suspended. Reason: [admin-provided reason]. Contact support@hairlineapp.com for assistance.\" The reason is the Screen 4 reason recorded in FR-015. While suspended, the provider cannot receive new inquiries, submit quotes, or accept new work (FR-015 Rule 9); profile, documents, reviews, billing, and team management (FR-009 Rule 10) are view-only, except that the Owner can still update the bank details (audit-logged). Account security (password change), notification preferences, Help Centre, and support cases (Screens 5.5–5.9) remain available so the provider can contact admins, and the Owner can still submit the account closure request. A Suspended Owner who has not yet set a password can still use the activation link; the status stays Suspended afterwards (FR-015). Chat with patients on the provider's open `In Progress` and `Aftercare` cases also stays available. Clinical notes, photos, and aftercare answers and actions are blocked until the admin reassigns or decides the case (FR-015 Screen 4)."}}
  - {"op": "update_node", "id": "REQ-032-074", "title": "Account keeps its status while closure is pending", "attrs": {"statement": "Provider account keeps its current status until admin processes the request. If the admin schedules the deactivation for a future date, the request stays \"Pending Admin Review\" until the deactivation takes effect; if the scheduled deactivation is cancelled, the request stays \"Pending Admin Review\" and no rejection email is sent"}}
  - {"op": "update_node", "id": "REQ-032-076", "title": "Closure rejection keeps the account status", "attrs": {"statement": "If the admin rejects the request instead (e.g., the provider asks to withdraw it), the system sets the request status to \"Rejected\" with review notes, the provider account keeps its current status, and the provider receives the FR-020 `provider.closure_rejected` email with the review notes (mandatory). The provider may submit a new request later"}}
  - {"op": "update_node", "id": "REQ-032-078", "attrs": {"statement": "Notification preferences are profile-specific (apply to entire provider organization, not individual team members); only the Owner and a Manager can change them, other roles see them read-only (REQ-032-142)"}}
  - {"op": "update_node", "id": "REQ-032-079", "attrs": {"statement": "If all notification types are disabled, the system shows a confirmation dialog \"Warning: You have disabled all notifications. You may miss important updates about inquiries, appointments, and reviews. Are you sure?\" before saving. Email and Push may both be off for a type, and mandatory notices ignore the setting (REQ-032-143)"}}
  - {"op": "update_node", "id": "REQ-032-080", "attrs": {"statement": "Global channel preferences override individual notification types (e.g., if Email disabled, no notifications sent via email regardless of individual toggles); mandatory notices ignore the setting (REQ-032-143)"}}
  - {"op": "update_node", "id": "REQ-032-082", "attrs": {"statement": "Preference changes are logged in the audit trail with the user who made them (REQ-032-142)"}}
  - {"op": "update_node", "id": "REQ-032-089", "attrs": {"statement": "Existing bank account details stay with the clinic and are accessible to the new Owner after a role change"}}
  - {"op": "update_node", "id": "REQ-032-103", "attrs": {"statement": "Support request confirmation displayed: \"Support request submitted. Case #[number]. We aim to respond within 24 hours on business days.\""}}
  - {"op": "update_node", "id": "REQ-032-105", "attrs": {"statement": "Status updates follow unified workflow: Open → In Progress → Resolved → Closed (feedback resolution outcome—Implemented, Planned, Declined, Under Review—tracked separately in FR-034)"}}
  - {"op": "update_node", "id": "REQ-032-109", "title": "Replies allowed on Open, In Progress and Resolved cases", "attrs": {"statement": "Providers can reply to admin messages for Open, In Progress and Resolved cases via Reply Message Box; a reply to a Resolved case reopens it (banner: \"This case was marked as resolved. Replying will reopen it.\"); for Closed cases, Reply Message Box is disabled; provider can only click \"Request Reopen\" button"}}
  - {"op": "update_node", "id": "REQ-032-110", "attrs": {"statement": "Reply Message Box: Max 5000 chars; enabled for Open, In Progress and Resolved cases, disabled for Closed cases; Character counter displayed; Attach Files Button: Max 5 files, 10MB per file, formats: JPG, PNG, PDF, DOC, DOCX; Attachment files validated before upload (file type, size, virus scan)"}}
  - {"op": "update_node", "id": "REQ-032-112", "attrs": {"statement": "System opens the provider platform and opens the case directly on Screen 5.8, whatever the filters of the case list, with the new reply in the Communication Thread"}}
  - {"op": "update_node", "id": "REQ-032-113", "attrs": {"statement": "Modal only accessible from Screen 5.8 when viewing Closed cases; Reopening reason required (min 20 chars) to prevent accidental/spam reopening; Reopening Reason: Min 20 chars, max 500 chars; the reason and, optionally, the requested priority are sent to FR-034 as a flagged reopen-request message in the case thread (text)"}}
  - {"op": "update_node", "id": "REQ-032-114", "title": "Reopen request is sent to the admin and the case stays Closed", "attrs": {"statement": "The reopen request is sent to FR-034 as a flagged message in the case thread; the case stays Closed until the admin reopens it; the provider sees \"Request sent, awaiting admin\" with the reply box disabled; FR-034 notifies the admin through the user-reply notice (support.case_user_reply, REQ-034-178)"}}
  - {"op": "update_node", "id": "REQ-032-115", "title": "Service status updates; subscription is a future enhancement", "attrs": {"statement": "Status updates automatically when admin updates status via admin platform; status update notifications by email are a future enhancement, not in this release (FR-033 REQ-033-032)"}}
  - {"op": "update_node", "id": "REQ-032-117", "title": "My Support Cases Quick Stats bar is independent of the current filters", "attrs": {"statement": "Quick Stats bar shows the counts Open, In Progress, Resolved and Unread Messages over all of the clinic's cases, independent of the current filters"}}
  - {"op": "update_node", "id": "STP-032-025", "title": "Display the Active and Preparation locales from the language catalog and every saved locale"}
  - {"op": "update_node", "id": "STP-032-087", "title": "Save the timezone preference for this person"}
  - {"op": "update_node", "id": "STP-032-102", "title": "Save the timezone preference for this person"}
  - {"op": "update_node", "id": "STP-032-139", "title": "Validate that the user holds the View and Edit Billing Settings permission"}
  - {"op": "update_node", "id": "STP-032-164", "title": "Detect that the user does not hold the View and Edit Billing Settings permission"}
  - {"op": "update_node", "id": "STP-032-140", "title": "Display the bank form with existing bank details when the payout method is Manual bank transfer"}
  - {"op": "update_node", "id": "STP-032-159", "title": "Fill in all bank account fields (Manual bank transfer only)"}
  - {"op": "update_node", "id": "STP-032-193", "title": "Record the vote through the FR-033 vote write for admin analytics"}
  - {"op": "update_node", "id": "STP-032-224", "title": "Display the overall platform status indicator, or Status not available when no status can be read"}
  - {"op": "update_node", "id": "STP-032-228", "title": "Note that subscribing to status update notifications is a future enhancement, not in this release"}
  - {"op": "update_node", "id": "STP-032-267", "title": "Validate the message and that the case is Open, In Progress or Resolved"}
  - {"op": "update_node", "id": "STP-032-283", "title": "Validate the reason (min 20 chars) and send it to FR-034 as a flagged reopen-request message"}
  - {"op": "update_node", "id": "STP-032-284", "title": "FR-034 notifies the admin through the user-reply notice (support.case_user_reply)"}
  - {"op": "update_node", "id": "STP-032-285", "title": "Display the reopen-request-submitted confirmation and Request sent, awaiting admin"}
  - {"op": "update_node", "id": "STP-032-286", "title": "Keep the case Closed until the admin decides on the reopen request"}
  - {"op": "update_node", "id": "STP-032-301", "title": "Open the provider platform directly on the case in Support Case Detail"}
  - {"op": "update_node", "id": "STP-032-302", "title": "Show the case with the new reply in the Communication Thread"}
  - {"op": "update_node", "id": "STP-032-312", "title": "Create the closure request with status Pending Admin Review (the Owner only)"}
  - {"op": "update_node", "id": "STP-032-316", "title": "Provider account keeps its current status until the admin processes the request"}
  - {"op": "update_node", "id": "STP-032-320", "title": "Set the closure request to Rejected if the admin rejects it; the account keeps its status"}
  - {"op": "update_node", "id": "SCR-032-02", "attrs": {"description": "Provider Platform, Settings > Profile, Tab 2 (PRD Screen 1). Chip list with \"+ Add Language\" searchable dropdown, x to remove (confirmation on the last chip), drag-and-drop reordering. UI controls, not fields: add-language dropdown, chip remove button. The list offers Active and Preparation locales and keeps a saved entry when its locale becomes Inactive (REQ-032-147)."}}
  - {"op": "update_node", "id": "SCR-032-04", "attrs": {"description": "Provider Platform, Settings > Profile, Tab 5 (PRD Screen 1). Read-only reviews from the Reviews module with rating summary, distribution, filters, sort and pagination (10/20/50 per page); responses through the FR-013 Screen 6 composer. Empty state: \"No reviews yet\". UI controls, not fields: Rating Filters, Sort Dropdown, Pagination Controls, \"Read more\" link. Filter, sort and paging run on the server; reviews carry an Edited marker and link to the FR-013 review screens (REQ-032-148)."}}
  - {"op": "update_node", "id": "SCR-032-06", "attrs": {"description": "Provider Platform, Settings > Account Settings (PRD Screen 2), including the password change section and the Account Closure card with its warning dialog. UI controls, not fields: Current Password and Confirm New Password inputs (verification only, not stored), Save button, \"Request Account Closure\" button, acknowledgement checkbox, Submit / Cancel in the closure dialog. Personal settings belong to the signed-in person and are saved on the team member record. Account Name is read-only for the Owner role and editable for staff roles. Account Email is read-only for every role (REQ-032-144). The Account Closure card is shown to the Owner only (REQ-032-141)."}}
  - {"op": "update_node", "id": "SCR-032-07", "attrs": {"description": "Provider Platform, Settings > Notifications (PRD Screen 3). Six notification-type toggles and two channel toggles, organization-wide. No toggle for mandatory notices (REQ-032-031). UI controls, not fields: Save button, Disable-all confirmation dialog. Only the Owner and a Manager can change them; other roles see them read-only (REQ-032-142)."}}
  - {"op": "update_node", "id": "SCR-032-08", "attrs": {"description": "Provider Platform, Settings > Billing, visible to the holder of the View and Edit Billing Settings permission, the Owner by default (PRD Screen 4): bank account details for payouts (form only when the payout method is Manual bank transfer; a Stripe Connect status panel with a Complete Stripe sign-up link otherwise) and the read-only Commission & Payout panel. UI controls, not fields: Edit / Save / Cancel buttons."}}
  - {"op": "update_node", "id": "SCR-032-12", "attrs": {"description": "Help Centre downloadable resources (PRD Screen 5.3). UI controls, not fields: Preview button (PDF and images), Download button, filters. The category filter maps to the resource category."}}
  - {"op": "update_node", "id": "SCR-032-16", "attrs": {"description": "Provider list of support and feedback cases (PRD Screen 5.7). Empty state when no cases match. UI controls, not fields: Filter Bar (status, type, date range), Search Bar, Quick Stats Bar (counts per status and unread over all of the clinic's cases, independent of the list filters), Pagination Controls."}}
  - {"op": "update_node", "id": "SCR-032-17", "attrs": {"description": "Provider view of one support case (PRD Screen 5.8) with thread (oldest first) and timeline (newest first). UI controls, not fields: Send Reply, Request Reopen and Back to List buttons. The reply box is enabled for Open, In Progress and Resolved cases; a reply to a Resolved case reopens it."}}
  - {"op": "update_node", "id": "SCR-032-18", "attrs": {"description": "Modal opened from Case Detail for Closed cases only (PRD Screen 5.9). The reason and the optional requested priority go to FR-034 as a flagged reopen-request message; the case stays Closed until the admin decides. UI controls, not fields: Priority selector, Submit Reopen Request and Cancel buttons."}}
  - {"op": "update_node", "id": "SCR-032-19", "attrs": {"description": "Platform status page (PRD Screen 5.10). Shows Status not available when no status can be read; status update notifications are a future enhancement."}}
  - {"op": "update_node", "id": "ENT-provider-account-settings", "attrs": {"description": "Clinic-level account configuration. One provider has one account settings record, linked to the provider profile. Personal settings (phone number, timezone, password, account name) live on the team member record, not here."}}
