  - {"op": "add_node", "id": "SCR-011-02", "type": "Screen", "owner_fr": "FR-011", "title": "Scan Upload (V1 Photo Set)", "attrs": {"platform": "patient", "description": "Guided capture and upload of the head scan photo set for a due scan, with real-time quality feedback, retake, upload progress and access to previous scans. True 3D scanning is V2."}}
  - {"op": "add_node", "id": "SCR-011-03", "type": "Screen", "owner_fr": "FR-011", "title": "Questionnaire Completion", "attrs": {"platform": "patient", "description": "Completion of the milestone questionnaire rendered from the assigned FR-025 Questionnaire Set, with draft save, submit and a warning when responses raise the urgent flag."}}
  - {"op": "add_node", "id": "SCR-011-04", "type": "Screen", "owner_fr": "FR-011", "title": "Medication Schedule", "attrs": {"platform": "patient", "description": "Today's doses and the provider-prescribed medications with a mark-as-taken action, missed-dose indicator, weekly adherence, missed count and adherence history."}}
  - {"op": "add_node", "id": "SCR-011-05", "type": "Screen", "owner_fr": "FR-011", "title": "Educational Resources", "attrs": {"platform": "patient", "description": "Milestone educational resources by category (videos, guides, FAQs, help) with view or download, viewed tracking and completion percentage."}}
  - {"op": "add_node", "id": "SCR-011-06", "type": "Screen", "owner_fr": "FR-011", "title": "Aftercare Service Purchase", "attrs": {"platform": "patient", "description": "Patient picks post-treatment add-on or standalone service, enters external treatment details where needed, browses purchasable templates with pricing in local currency, picks fixed or subscription and proceeds to payment."}}
  - {"op": "add_node", "id": "SCR-011-07", "type": "Screen", "owner_fr": "FR-011", "title": "Aftercare Payment & Checkout", "attrs": {"platform": "patient", "description": "Order summary with subtotal, platform fee, tax and total (and monthly breakdown for subscriptions), payment method choice, billing address and terms acceptance; payment is processed by FR-007."}}
  - {"op": "add_node", "id": "SCR-011-08", "type": "Screen", "owner_fr": "FR-011", "title": "Aftercare Cases List", "attrs": {"platform": "provider", "description": "Provider list of assigned aftercare cases with patient, treatment, current milestone, progress, medication alerts and last activity, with search and filters."}}
  - {"op": "add_node", "id": "SCR-011-09", "type": "Screen", "owner_fr": "FR-011", "title": "Patient Aftercare Details", "attrs": {"platform": "provider", "description": "Provider view of one case with plan, progress, scan history, questionnaire responses, medication adherence history and communication log, plus actions to adjust the plan, request a scan, contact the team and escalate."}}
  - {"op": "add_node", "id": "SCR-011-10", "type": "Screen", "owner_fr": "FR-011", "title": "Aftercare Setup (Multi-Step)", "attrs": {"platform": "provider", "description": "Five-step provider wizard: select a template, customize milestones, set up medications, add custom instructions, review and confirm before activation."}}
  - {"op": "add_node", "id": "SCR-011-11", "type": "Screen", "owner_fr": "FR-011", "title": "Aftercare Plan Edit", "attrs": {"platform": "provider", "description": "Provider (and admin) edit of an active plan: template, milestones, medications and instructions, with a mandatory change reason, approval status for major changes and change history."}}
  - {"op": "add_node", "id": "SCR-011-12", "type": "Screen", "owner_fr": "FR-011", "title": "Aftercare Progress Tracking (Provider)", "attrs": {"platform": "provider", "description": "Provider progress view of an assigned patient: timeline, overdue tasks, scan and questionnaire status, adherence, compliance and a recent activity feed."}}
  - {"op": "add_node", "id": "SCR-011-13", "type": "Screen", "owner_fr": "FR-011", "title": "Aftercare Cases List (Admin)", "attrs": {"platform": "admin", "description": "Admin list of every aftercare case across providers with provider, type, milestone, progress, medication alerts and status, with search, filters and actions."}}
  - {"op": "add_node", "id": "SCR-011-14", "type": "Screen", "owner_fr": "FR-011", "title": "Aftercare Case Details (Admin)", "attrs": {"platform": "admin", "description": "Four-tab admin case view: overview, progress tracking, communication log and admin actions (edit plan, reassign via Screen 19, escalate, add notes, change history)."}}
  - {"op": "add_node", "id": "SCR-011-15", "type": "Screen", "owner_fr": "FR-011", "title": "Standalone Aftercare Requests", "attrs": {"platform": "admin", "description": "Admin intake of paid standalone requests: patient and treatment details, documentation, concerns, photos, provider choice by specialization and availability, assign or reject with reason."}}
  - {"op": "add_node", "id": "SCR-011-16", "type": "Screen", "owner_fr": "FR-011", "title": "Milestone Template Management", "attrs": {"platform": "admin", "description": "Admin template list and editor: milestones, scan and questionnaire schedule per milestone, educational resources, resource files, and pricing configuration per currency (purchase availability, pricing model, default payment method, discounts)."}}
  - {"op": "add_node", "id": "SCR-011-17", "type": "Screen", "owner_fr": "FR-011", "title": "Provider Performance Dashboard (Backlog)", "attrs": {"platform": "admin", "description": "Backlog (post-MVP analytics): provider list and performance metrics, case drill-down and actions (feedback, reassign, suspend). Its data fields are aggregate metrics with no entity; only the provider name is mapped."}}
  - {"op": "add_node", "id": "SCR-011-18", "type": "Screen", "owner_fr": "FR-011", "title": "Aftercare Progress Tracking (Admin, Backlog)", "attrs": {"platform": "admin", "description": "Backlog (post-MVP analytics): system-wide progress overview, provider performance grid, status distribution and real-time alerts. Its data fields are aggregate metrics with no entity; only the case status and milestone phase are mapped."}}
  - {"op": "add_node", "id": "SCR-011-19", "type": "Screen", "owner_fr": "FR-011", "title": "Reassign Aftercare Provider (Admin)", "attrs": {"platform": "admin", "description": "Admin reassigns the aftercare provider or Hairline aftercare team of a case (including a treatment-linked case whose booking stays Aftercare) with mandatory reason and confirmation."}}
