  - {"op": "add_node", "id": "REQ-030-223", "type": "Rule", "title": "Catalog event: Monitoring Aftercare Conversion Started", "owner_fr": "FR-030", "attrs": {"statement": "Monitoring Aftercare Conversion Started (monitoring.aftercare_conversion_started) is an admin-configurable notification event. Primary recipients: Patient. Fired by FR-038 when the patient selects Switch to Aftercare Package on a transplant-progress case, before the aftercare request is created; tells the patient the switch has started. Patient only; sent immediately", "rationale": "Event Catalog table, Monitoring category. Event node: EVT-transplant-progress-conversion-started."}}
