  - {"op": "update_node", "id": "REQ-030-008", "title": "General retry rule for failed notification deliveries", "attrs": {"statement": "System MUST automatically retry failed notification deliveries using the general retry rule (General Module Rule 7): by default up to 3 retries at one interval of 1 hour; an admin may set 1 to 5 attempts and a different interval for an individual notification", "rationale": "Functional Requirements Summary and General Module Rule 7. The general retry rule is written once; the separate 1, 3 and 6 hour sequence rule is merged here."}}
  - {"op": "update_node", "id": "REQ-030-017", "title": "Rate limit notifications per recipient, limit set by admins", "attrs": {"statement": "System MUST enforce rate limiting to prevent notification spam: a maximum number of notifications per hour per recipient, set by admins with a default of 10 (critical notifications exempt from rate limiting)", "rationale": "Functional Requirements Summary and General Module Rule 6. The limit is admin-editable (Screen 1 field Notification Rate Limit); it is no longer on the Fixed list."}}
  - {"op": "update_node", "id": "REQ-030-020", "title": "Audit trail of every notification rule change", "attrs": {"statement": "System MUST record every notification rule change in the audit trail with admin user ID, timestamp, change summary, old and new configuration, IP address and reason (if provided); audit log retention follows the system PRD, Platform-Wide Rules: One 10-year retention period", "rationale": "Functional Requirements Summary. General Module Rule 1 and the Security Considerations audit trail point here; the separate old and new configuration and reason Rules are merged into this one."}}
  - {"op": "update_node", "id": "REQ-030-024", "attrs": {"statement": "System MUST receive delivery status updates (bounces, opens, clicks) from external services via webhooks; webhook signature verification: See system PRD, Platform-Wide Rules: No card numbers stored", "rationale": "Functional Requirements Summary. The webhook signature part is stated once in the system PRD; delivery status updates stay here."}}
  - {"op": "update_node", "id": "REQ-030-118", "title": "Entry point: Settings, Alerts and Notifications", "attrs": {"statement": "Admin Dashboard → Settings → Alerts & Notifications: Primary entry point for notification rule management and notification template setup", "rationale": "Entry Points. There is one entry point; the duplicate second item was dropped and the list renumbered."}}
  - {"op": "update_node", "id": "REQ-030-119", "title": "A new rule starts as Draft and activates only when an admin activates it; template changes apply to new notifications", "attrs": {"statement": "Activation method: A new notification rule starts as Draft and is not executed until an admin activates it; activation takes effect immediately after the confirmation prompt. Changes saved to an already active rule apply immediately to future events. Template changes apply to new notifications immediately; in-flight notifications use the template version active at creation time.", "rationale": "Entry Points, Activation method."}}
  - {"op": "update_node", "id": "REQ-030-124", "title": "Catalog event keys are the final canonical keys and stay stable", "attrs": {"statement": "Backend event keys below are the final canonical keys. They MUST remain stable identifiers exposed via the event catalog API.", "rationale": "Core Rule on catalog keys; both catalogue table headers read Backend Event Key."}}
  - {"op": "update_node", "id": "REQ-030-159", "title": "An event can have several rules; Rule Name is unique per event", "attrs": {"statement": "Rule 3: An event type can have several notification rules. Rule Name must be unique among the rules of one event; an admin adds another rule for an event with Add Rule", "rationale": "General Module Rule 3 and Workflow B3, Admin Adds Another Rule for the Same Event."}}
  - {"op": "update_node", "id": "REQ-030-194", "title": "Future phase: SMS availability is per event with cost; high-volume events need budget approval", "attrs": {"statement": "Future phase: SMS channel availability: Admin can enable SMS for specific event types, but each SMS incurs cost; requires budget approval for high-volume events", "rationale": "Configurable with Restrictions, SMS bullet. SMS is not offered until the later phase."}}
  - {"op": "update_node", "id": "REQ-030-145", "attrs": {"statement": "Trigger: 3 days (72 hours) before installment due date (example only; the payment reminder schedule itself is the single payment reminder timing setting owned by FR-007) Delivery time: 9:00 AM in recipient's local timezone Retry logic: the platform default retry rule (retry on, up to 3 retries, 1 hour apart), or different values set for this notification", "rationale": "Workflow step 10 (admin configures delivery timing). Example values only."}}
  - {"op": "update_node", "id": "REQ-030-155", "attrs": {"statement": "System logs failed delivery with error code and timestamp If retry enabled, system queues a retry after the retry interval (platform default 1 hour; see General Module Rule 7) After retries are exhausted (platform default 3; an admin may set 1 to 5), system marks notification as \"Failed - Permanent\"", "rationale": "Workflow B1, Notification Delivery Fails (Email Bounce), steps 3 to 6."}}
  - {"op": "update_node", "id": "REQ-030-167", "attrs": {"statement": "Rules Dashboard fields: Event Category: Predefined categories matching event catalog; Rule Status: Predefined statuses only; Search Rules: Max 100 characters; Rules List: Sortable by event name, status, last modified; each row is a “Rule Row” described by the fields below; Event Name: Sourced from backend event catalog; click opens this event's Rule Editor; Last Modified: Display in admin's local timezone; Actions: Configure, Test, Pause/Activate with permission-based visibility; there is no Delete action, and Pause is not offered for events on the Non-Disableable list.", "rationale": "Screen 1 field table. A rule is only switched off, never deleted. UI controls are not Fields except where the Rule entity holds the value."}}
  - {"op": "update_node", "id": "REQ-030-169", "title": "Time-sensitive events use the general retry rule", "attrs": {"statement": "If event is time-sensitive (payment reminder, appointment reminder), retry follows the platform default (General Module Rule 7) unless the admin sets different values for this notification", "rationale": "Screen 2 Business Rules."}}
  - {"op": "update_node", "id": "REQ-030-174", "title": "A new rule always starts as Draft; Draft rules are not executed until Active", "attrs": {"statement": "A new rule always starts as Draft. Draft rules are not executed by the system until the status is changed to Active", "rationale": "Screen 2 Business Rules."}}
  - {"op": "update_node", "id": "REQ-030-177", "attrs": {"statement": "Rule Editor fields: Rule Name: Max 100 chars, unique per event; Event Type: Predefined event list from backend; admin cannot create or rename event types here; Recipient Type: At least one recipient type required; Recipient Filter Rules: Valid JSON schema; Email Channel: Default: on; Email Template: Must select template if channel enabled; Push Notification Channel: Default: on for patients/providers; Push Template: Must select template if channel enabled; SMS Channel: Future phase, not offered until that phase; Default: off; admin approval required; SMS Template: Must select template if channel enabled; Delivery Timing: Predefined options; Schedule Time: Future datetime only; Delay Duration: Min 1 hour, max 90 days; Delivery Timezone: Default: Recipient Local Time; Retry Configuration: Default: on; Max Retry Attempts: Min 1, max 5, default 3; Retry Interval: One fixed interval, min 1 hour, max 24 hours, default 1 hour; Escalation Rules: Default: off for non-critical events; Escalation Condition: Free text, max 500 chars; Escalation Recipients: Required if escalation enabled; Critical - Cannot Opt Out: Default: off; admin only; Rule Status: Default: Draft for new rules; Paused is not allowed for events on the Non-Disableable list.", "rationale": "Screen 2 field table."}}
  - {"op": "update_node", "id": "REQ-030-186", "attrs": {"statement": "Template Editor fields: Template Name: Max 100 chars, unique per event, channel and language; Event Type: Predefined event list; Channel Type: Fixed at creation (cannot change); Language: Must be in supported locales list (FR-021); can create multiple language versions; Email Subject: Max 200 chars, supports variables; Email Body: Max 10,000 chars, supports HTML/variables; Push Title: Max 100 chars, supports variables; Push Body: Max 500 chars, supports variables; SMS Body: Max 160 chars (1 SMS segment), supports variables; Available Variables: Display only; click to insert; Variable Preview Values: Valid JSON; used only for preview; Template Status: Default: Draft.", "rationale": "Screen 3 field table. Variable Preview Values is a transient preview input, not stored."}}
  - {"op": "update_node", "id": "REQ-030-192", "attrs": {"statement": "Editable by admin: Event-to-notification mappings (which events trigger which notifications); Notification templates (subject, body, formatting, variables) for all channels; Recipient targeting rules (who receives notifications based on role, relationship, event context); Channel preferences per event type (enable/disable email, push, SMS); Delivery timing configuration (immediate, scheduled, delayed); Retry logic parameters (max attempts, interval between retries) for an individual notification, overriding the platform default; Notification rate limit per recipient (default 10 per hour; critical notifications exempt); Transplant progress reminder schedule (default once a month for 12 months after treatment); Escalation rules for time-sensitive notifications; Quiet hours: one platform-wide period for non-urgent notifications (default 10 PM to 7 AM recipient local time), set by admins only.", "rationale": "Admin Editability Rules, Editable by Admin list. Quiet hours replace the earlier delivery hours item."}}
  - {"op": "update_node", "id": "REQ-030-193", "attrs": {"statement": "Fixed in codebase, not editable: Core event definitions (system events that can trigger notifications - e.g., \"Quote Submitted / Ready\", \"Payment Received / Receipt\"); Variable schema per event type (which variables available in notification templates per event); Maximum retry attempts (hard limit: 5 retries to prevent infinite loops); Encryption algorithms for notification content (AES-256 at rest, TLS 1.3 in transit); Delivery channel integrations (SMTP provider, push notification service, SMS gateway API).", "rationale": "Admin Editability Rules, Fixed in Codebase list. The rate limit moved to the Editable list; the hard limit of 5 retries stays fixed."}}
  - {"op": "update_node", "id": "REQ-030-209", "attrs": {"statement": "System queues notifications for retry at the retry interval (up to 24-hour window) If service restored within 24 hours, queued notifications delivered (may result in burst of deliveries) If outage exceeds 24 hours, system marks notifications as \"Failed - Service Outage\" and alerts admin Admin can manually re-trigger notifications after service restored or switch to backup notification provider if configured", "rationale": "Edge case, prolonged external service outage. No exponential backoff; retries use the one retry interval."}}
  - {"op": "update_node", "id": "REQ-030-031", "attrs": {"statement": "Inquiry Cancelled (inquiry.cancelled) is an admin-configurable notification event. Primary recipients: Patient, Provider, Admin (optional). Patient-initiated inquiry cancellation (FR-003 Workflow 5). Fires when patient cancels inquiry in Inquiry, Quoted, or Accepted stages. Patient receives mandatory cancellation confirmation (aligns with FR-003 Workflow 5 step 4 and Screen 8b). Cancellation reason is patient-private — provider notification says only \"Inquiry cancelled by patient\". MVP default channels: Email + Push. Available template variables differ by recipient: Patient receives `inquiry.id`, `inquiry.cancellation_reason`, `inquiry.cancelled_at`; Provider receives `inquiry.id`, `inquiry.cancelled_at` only (reason excluded per privacy rule). Provider exclusion: a provider that has a live quote on the inquiry does not receive inquiry.cancelled; that provider receives only quote.cancelled_inquiry. A provider without a quote on the inquiry still receives inquiry.cancelled."}}
  - {"op": "update_node", "id": "REQ-030-039", "attrs": {"statement": "Quote Cancelled (Inquiry Cancelled) (quote.cancelled_inquiry) is an admin-configurable notification event. Primary recipients: Provider. Auto-cancelled quote due to patient inquiry cancellation (FR-003 Workflow 5). Provider receipt is mandatory — admin cannot disable this event (see Non-Disableable by Default section). Cancellation reason is patient-private; provider notification says only \"Inquiry cancelled by patient\". MVP default channels: Email + Push. Not subject to FR-032 provider notification preferences; FR-032 offers no toggle for this event. Available template variables: `quote.id`, `quote.provider_id`, `inquiry.id`, `inquiry.cancelled_at`; `inquiry.cancellation_reason` is excluded per privacy rule. A provider with a live quote receives this notice only, never also inquiry.cancelled; a provider without a quote still receives inquiry.cancelled."}}
  - {"op": "update_node", "id": "REQ-030-052", "attrs": {"statement": "Treatment Completed (Post‑Op Instructions) (treatment.completed) is an admin-configurable notification event. Primary recipients: Patient, Provider, Admin (optional). Completion confirmation; triggers post-op and aftercare next steps. The patient copy also states the deadline to raise a problem with the treatment and links to the support request; the provider and admin copies keep their wording without the deadline. No separate event is created for this"}}
  - {"op": "update_node", "id": "REQ-030-057", "attrs": {"statement": "Payment Due Reminder (Installment / Balance) (payment.due_reminder) is an admin-configurable notification event. Primary recipients: Patient. “Installment reminder” (split-pay compatible). When the reminder goes out is the single payment reminder timing setting owned by FR-007; this entry does not keep a second reminder schedule"}}
  - {"op": "update_node", "id": "REQ-030-058", "attrs": {"statement": "Provider Payout Processed (payout.provider_processed) is an admin-configurable notification event. Primary recipients: Provider, Admin (optional). “They’ve been paid” notification to provider. Also sent when a manual statement is marked paid, not only for Stripe payouts; no separate event exists for manual statements"}}
  - {"op": "update_node", "id": "REQ-030-085", "title": "Catalog event: Monitoring Converted to Inquiry (monitoring.converted_to_inquiry)", "attrs": {"statement": "Monitoring Converted to Inquiry (monitoring.converted_to_inquiry) is an admin-configurable notification event. Primary recipients: Patient. Monitoring case successfully converts into a distinct FR-003 inquiry (FR-037/FR-038)"}}
  - {"op": "update_node", "id": "REQ-030-086", "attrs": {"statement": "Review Request (review.requested) is an admin-configurable notification event. Primary recipients: Patient. “Review notifications” (typically post-treatment). The admin sets when the review invitation and any reminder are sent through this event's delivery timing; FR-013 does not set its own invitation timing"}}
  - {"op": "update_node", "id": "REQ-030-092", "attrs": {"statement": "Provider Onboarding Requested (provider.onboarding_requested) is an admin-configurable notification event. Primary recipients: Admin. New provider onboarding request awaiting review/approval. Not triggered at launch (future)"}}
  - {"op": "update_node", "id": "REQ-030-093", "attrs": {"statement": "Provider Document Expiration Warning (provider.document_expiration_warning) is an admin-configurable notification event. Primary recipients: Admin, Provider (optional). License/credential expiry warnings; timing is policy-driven. Not triggered at launch (future)"}}
