  - {"op": "add_node", "id": "REQ-030-218", "type": "Rule", "title": "Catalog event: Quote Restored", "owner_fr": "FR-030", "attrs": {"statement": "Quote Restored (quote.restored) is an admin-configurable notification event. Primary recipients: Patient, Provider. Fired by FR-004 when an admin restores an expired quote (a reason is required). The quote returns to sent status with a fresh full expiry window: the restore time plus the FR-026 quote validity window in force. The patient is told the quote is available again with its new expiry date; the provider is told the quote was restored and its new expiry date. MVP default channels: Email + Push", "rationale": "Event Catalog table, Quote category. Event node: EVT-quote-restored."}}
