  - {"op": "add_node", "id": "REQ-030-220", "type": "Rule", "title": "Catalog event: Payout Paused, Problem Raised", "owner_fr": "FR-030", "attrs": {"statement": "Payout Paused — Problem Raised (payout.paused_problem_raised) is an admin-configurable notification event. Primary recipients: Admin. Fired when a problem is raised on a completed treatment and the clinic's money for that booking is paused; tells admins which booking and clinic are affected, with a link to the support request. MVP default channels: Email + Push", "rationale": "Event Catalog table, Billing/Payouts category. No Event node: the PRD names no producer stage, so the Rule sits at the Stage where the catalogue rules without a producer sit."}}
