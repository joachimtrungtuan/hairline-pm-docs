# FR-024 logic review pass 2: ruled fixes applied to the PRD (Treatment and Package Management). New nodes, fields and enum values come first, then edges (a relabel or move is remove_edge then add_edge), then rule, step, screen and field updates.
# Cross-FR edges: REQ-024-101 applies at STG-main-02-quote (a FR-004 stage; edge only, no FR-004 node is updated). No other node owned by another FR is touched.
# Queued for other FRs, not done here: FR-011 and FR-010 (aftercare template Active or Inactive, copy of given text), FR-023 (retention of discarded drafts), FR-004 (REQ-024-101 stage wording), FR-026 (setting counting rule), FR-022 (package list order with Draft), FR-030 (update-notice catalogue row, only if listed).
# Left alone on purpose: minor observations (Base Price wording, repeated confirmation sentence in REQ-024-072, an actor missing on one provider-permission bullet, renaming a treatment type versus past versions).
reason: "FR-024 logic review pass 2: Draft tied to never saved as Active or Inactive (treatment) and no version (package); creation limit counts once on first Active or Inactive save; every route to Inactive uses the warning, confirmation and notices; setting Inactive on the edit form is a versioned Update; quick price edit uses the package price rule; failed uploads keep previous media and status for any treatment; update notice only for Active treatments; back-to-Active notice only after a first Active; two new treatment fields; aftercare templates Active or Inactive; rule wiring and Export to CSV step."
by: docs-manager
