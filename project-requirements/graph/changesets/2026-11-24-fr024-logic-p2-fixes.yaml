  - {"op": "update_node", "id": "REQ-024-003", "attrs": {"statement": "System MUST allow admins to activate or deactivate treatments, affecting availability for new quotes and draft quotes only; sent quotes and bookings are not affected. Deactivate is offered only on Active treatments; an Inactive treatment is reactivated through Edit, which is versioned and sends the notice of REQ-024-042 when the treatment has been Active before, or of REQ-024-041 when it has never been Active; Draft and Pending Media Upload treatments have no Deactivate action."}}
  - {"op": "update_node", "id": "REQ-024-007", "attrs": {"statement": "System MUST allow providers to create packages with name, description, included items, included travel services, relative-day treatment plan, standard price, images, and status (Draft, Active, or Inactive); Draft applies only to a package that has no version yet."}}
  - {"op": "update_node", "id": "REQ-024-008", "attrs": {"statement": "System MUST allow providers to edit existing packages in the package library; each successful Update of an Active or Inactive package MUST create a new package version (v1, v2, and so on), keep earlier versions read-only, and never change existing quotes. Auto-save overwrites the working draft and creates no version, and neither the Deactivate button nor the bulk Deactivate creates one; setting Inactive on the edit form is an Update and creates a version."}}
  - {"op": "update_node", "id": "REQ-024-041", "attrs": {"statement": "The first time a treatment becomes Active, by any route (saved as Active, an edit that activates a Draft or a never-Active Inactive treatment, or a media upload retry that ends Active), System sends all active providers the notification \"New treatment available in catalog\", and providers can then configure pricing for it. A treatment saved as Draft or Inactive sends nothing until it first becomes Active. System records on the treatment that it has been Active."}}
  - {"op": "update_node", "id": "REQ-024-042", "attrs": {"statement": "When an admin updates a treatment that is Active after the save, System notifies the providers who currently offer that treatment about the update (for example \"Treatment [FUE] video has been updated\"). An edit of a Draft, Inactive, or Pending Media Upload treatment sends no update notice. When the update switches an Inactive treatment that has been Active before back to Active, the notice reads \"treatment available again\" and goes only to providers that have a pricing configuration for it; a treatment that has never been Active follows REQ-024-041 instead; the same treatment-updated event is used and no new event is added."}}
  - {"op": "update_node", "id": "REQ-024-043", "attrs": {"statement": "When an admin deactivates a treatment, by the Deactivate button or by setting Inactive on the edit form, System notifies the providers who offer the treatment with the message \"Treatment [Name] has been deactivated\"."}}
  - {"op": "update_node", "id": "REQ-024-051", "attrs": {"statement": "Before a treatment becomes Inactive, by the Deactivate button or by setting Inactive on the edit form, System checks the open quotes (draft or sent) and the open FR-006 bookings (Accepted, Confirmed, In Progress, Aftercare) that use it, shows a warning with the number of providers offering it (Offered configurations of Active providers, the Number of Providers count), of active quotes, and of open bookings, and requires the admin to confirm; on confirmation the status becomes Inactive."}}
  - {"op": "update_node", "id": "REQ-024-052", "attrs": {"statement": "Providers cannot select a deactivated treatment (Inactive by any route) in new quotes. If a treatment is deactivated while a provider has a draft quote open, System refreshes the available treatments and warns \"Treatment [Name] is no longer available. Please select a different treatment.\" Sent quotes and bookings using the treatment keep the treatment version they recorded and continue unaffected; a draft quote that uses it must pick another treatment before it can be sent."}}
  - {"op": "update_node", "id": "REQ-024-048", "attrs": {"statement": "A treatment's status is Draft, Active, Inactive, or Pending Media Upload. The admin chooses Active or Inactive on save (default Active); Draft is set by Save as Draft, only for a treatment never saved as Active or Inactive; Pending Media Upload is set by the system when a media upload fails. Only Active treatments are visible to providers; Inactive, Draft and Pending Media Upload treatments are hidden from provider view."}}
  - {"op": "update_node", "id": "REQ-024-049", "attrs": {"statement": "When a media upload to S-05 fails (a video, an image, or an educational PDF), System retries up to 3 times with exponential backoff. If all retries fail it shows an error (\"Media upload failed, please try again\"), saves the treatment record without media marked \"Pending Media Upload\", stores the status the admin chose on the form (Active, Inactive, or Draft) with the record, and the admin can retry the upload separately by editing the treatment, or save the form again without the failed file; once the upload succeeds or the failed file is dropped the record leaves Pending Media Upload. Providers do not see or use a treatment in Pending Media Upload status until media is added. If an upload fails while any treatment is being edited, the edit is not saved: the previous saved media and status stay as they were (an Active treatment's previous version stays live) and the failed file is reported to the admin."}}
  - {"op": "update_node", "id": "REQ-024-054", "attrs": {"statement": "The admin treatment list shows Active treatments first, then Pending Media Upload, then Draft, with Inactive last; filters by treatment name in real time and by treatment type; shows \"Create New Treatment\" at all times; shows Deactivate only on Active treatments and Discard Draft only on Draft treatments; allows Edit on every treatment regardless of status; and shows 20 treatments per page."}}
  - {"op": "update_node", "id": "REQ-024-057", "attrs": {"statement": "The admin treatment form and the package form each auto-save a draft every 30 seconds to prevent data loss and offer Save as Draft. A saved draft has status Draft: a treatment draft is visible to admins only; a package draft is visible only to the provider's own team and cannot be selected in a quote. Status Draft applies to a treatment only while it has never been saved as Active or Inactive, and to a package only while it has no version. On a treatment already saved as Active or Inactive, or a package that has a version, auto-save and Save as Draft keep a working draft and change neither the live version nor the status until Update. Auto-save overwrites the working draft and creates no version. A draft needs a name to be saved. Cancel on either form discards unsaved changes and returns to the list. The admin who created a treatment draft, or the provider team that owns a package draft, can discard a draft that was never saved as Active or Inactive; the draft is removed and the removal is audited (REQ-024-022).", "rationale": "Screen 2 and Screen 5 rules and notes; Main Flow step 8; Provider package flow step 10."}}
  - {"op": "update_node", "id": "REQ-024-065", "attrs": {"statement": "On Save Package, System validates: name not empty (max 100); description required (max 2,000); standard price > 0 with up to 2 decimal places; at least one included item with an allowed service type and component price >= 0; plan days consecutive from Day 1 with a description; duration max 50 characters in common patterns (\"X nights\", \"X days\", \"X hours\", \"X sessions\"); terms max 1,000 characters. Errors are shown next to the invalid fields and the package is created only after validation passes. The quick price edit on the package list applies the same price rule (above 0, up to 2 decimals)."}}
  - {"op": "update_node", "id": "REQ-024-072", "attrs": {"statement": "Before a package becomes Inactive, by any route (Deactivate, setting the status to Inactive on the edit form, or the bulk Deactivate Selected), System counts the open quotes (draft or sent) that contain a quote option copied from the package, warns \"This package is used in N open quotes. Deactivating hides it from new quotes; existing quotes are not changed.\", and requires the provider to confirm; if the package is used in open quotes, confirmation is required. The bulk action shows one combined count and asks for one confirmation. On confirmation the status becomes Inactive. The Deactivate button and the bulk action create no version; on the edit form the same Update saves the new version with the status Inactive."}}
  - {"op": "update_node", "id": "REQ-024-076", "attrs": {"statement": "The provider package list shows Active packages first, then Draft packages, and Inactive last, shows Discard Draft only on a Draft package, filters by package name in real time and by status, can be sorted by name, price, or usage count, shows \"Create New Package\" at all times, and shows 20 packages per page."}}
  - {"op": "update_node", "id": "REQ-024-077", "attrs": {"statement": "The package list offers the bulk actions \"Deactivate Selected\" (one combined count of open quotes and one confirmation) and \"Export to CSV\". A quick price edit from the list (a pencil icon shows on hover, except on a Draft package, which has no version yet) is a library edit that applies the price rule of REQ-024-065 and saves a new package version."}}
  - {"op": "update_node", "id": "REQ-024-078", "attrs": {"statement": "There is no total limit on how many packages a provider can create; package creation is limited to 50 per hour per provider by default (admin setting). A new package counts once, when it is first saved as Active or Inactive (Save Package, including a clone); saving as a draft, auto-save, edits, and media upload retries do not count. When the limit is reached the save is refused with \"You have reached the limit of [N] new packages per hour. Please try again later.\", where N is the setting value."}}
  - {"op": "update_node", "id": "REQ-024-098", "attrs": {"statement": "Treatment creation is limited to 10 per hour per admin by default; the limit is an admin setting and a whole number of 1 or more. A new treatment counts once, when it is first saved as Active or Inactive (Save Treatment); saving as a draft, auto-save, edits, and media upload retries do not count. When the limit is reached the save is refused with \"You have reached the limit of [N] new treatments per hour. Please try again later.\", where N is the setting value."}}
  - {"op": "update_node", "id": "REQ-024-085", "attrs": {"statement": "System MUST allow admins to manage the medication templates (common post-op medication presets that speed up prescribing) and the post-op instruction templates (standard instruction text that providers can customize). The medication templates are the one admin medication list providers pick medication from; the FR-011 medication catalogue is this same list. Each template is Active or Inactive; an admin can Deactivate and Reactivate it, an Inactive template is not offered to providers, and prescriptions and plans already given keep a copy of their text, so an edit or a change of status affects only future use"}}
  - {"op": "update_node", "id": "REQ-024-100", "attrs": {"statement": "The status the admin chose on the form (Active, Inactive, or Draft) is stored with a treatment record saved as Pending Media Upload and restored when a media upload retry succeeds or the form is saved again without the failed file; the same applies to an image or an educational PDF."}}
  - {"op": "update_node", "id": "STP-024-008", "title": "Admin sets the treatment status Active or Inactive (default Active), or saves the treatment as a draft (only for a treatment never saved as Active or Inactive); the form also auto-saves a draft every 30 seconds"}
  - {"op": "update_node", "id": "STP-024-025", "title": "Admin modifies description, video, images, technique specifications or status; setting an Active treatment to Inactive here triggers the warning, confirmation and notices of the deactivation"}
  - {"op": "update_node", "id": "STP-024-029", "title": "When the treatment is Active after the save, System notifies providers about the update; an Inactive treatment that has been Active before, switched back to Active, sends the treatment-available-again notice only to providers with a pricing configuration, and a never-Active treatment made Active sends the new-treatment notice"}
  - {"op": "update_node", "id": "STP-024-064", "title": "System displays the error Media upload failed, please try again"}
  - {"op": "update_node", "id": "STP-024-065", "title": "System saves the treatment record without media marked Pending Media Upload and stores the status the admin chose (Active, Inactive or Draft)"}
  - {"op": "update_node", "id": "STP-024-067", "title": "System updates the treatment record and restores the stored status once the upload succeeds or the form is saved again without the failed file"}
  - {"op": "update_node", "id": "STP-024-145", "title": "If the upload fails while a treatment is being edited, System does not save the edit, keeps the previous saved media and status (an Active treatment's previous version stays live), and reports the failed file"}
  - {"op": "update_node", "id": "STP-024-080", "title": "Provider sets the package status Active or Inactive (default Active), or saves the package as a draft (only while the package has no version yet); the form also auto-saves a draft every 30 seconds without creating a version"}
  - {"op": "update_node", "id": "STP-024-095", "title": "Provider modifies package fields, including the status Active or Inactive (Draft only while the package has no version yet); setting Inactive shows the open-quote warning and confirmation"}
  - {"op": "update_node", "id": "STP-024-097", "title": "System saves the changes as a new package version; only a successful Update of an Active or Inactive package creates one, including an Update that sets Inactive"}
  - {"op": "update_node", "id": "STP-024-106", "title": "System changes the package status to Inactive without creating a version (the Deactivate button)"}
  - {"op": "update_node", "id": "STP-024-136", "title": "Admin adds or edits a medication or post-op instruction template and saves it, or sets it Inactive with Deactivate or Active again with Reactivate"}
  - {"op": "update_node", "id": "STP-024-137", "title": "System makes an Active template available to providers in aftercare documentation and does not offer an Inactive one; prescriptions and plans already given keep a copy of their text"}
  - {"op": "update_node", "id": "STP-024-141", "title": "On the package list, provider either clicks the pencil icon and enters a new standard price, selects Active packages and clicks Deactivate Selected, or clicks Export to CSV"}
  - {"op": "update_node", "id": "STP-024-142", "title": "System checks the price is above 0 with up to 2 decimals, then saves it as a new package version, because a quick price edit is a library edit"}
  - {"op": "update_node", "id": "SCR-024-01", "attrs": {"description": "Admin list of every treatment with search by name, filter by type, Active-first order (then Pending Media Upload, Draft, Inactive) and 20 per page; entry to create, edit, view details, deactivate (shown only on Active treatments), and discard a draft (shown only on Draft treatments)."}}
  - {"op": "update_node", "id": "SCR-024-02", "attrs": {"description": "Admin form to create or edit a treatment: name, type, description, technique specifications, recovery time, duration, video, images, educational resources and status. Auto-saves a draft every 30 seconds; Draft only for a treatment never saved as Active or Inactive; setting Inactive here is a versioned Update with the deactivation warning."}}
  - {"op": "update_node", "id": "SCR-024-04", "attrs": {"description": "Provider list of own packages with search, status filter, sort, Active-first order (then Draft, then Inactive), 20 per page, Clone, Deactivate (shown only on Active packages), bulk deactivate with one combined open-quote count and one confirmation, Discard Draft (Draft packages only), no quick-edit pencil on a Draft package, and CSV export."}}
  - {"op": "update_node", "id": "SCR-024-08", "attrs": {"description": "Admin screen to create, edit, deactivate and reactivate the medication templates and the post-op instruction templates that providers use in aftercare documentation."}}
  - {"op": "update_node", "id": "SET-treatment-creation-rate-limit", "attrs": {"description": "Maximum new treatments per admin per hour; a whole number of 1 or more. A new record counts once, when it is first saved as Active or Inactive; saving as a draft does not count (Admin Editability Rules, Security Considerations)."}}
  - {"op": "update_node", "id": "SET-package-creation-rate-limit", "attrs": {"description": "Maximum new packages per provider per hour; a whole number of 1 or more. A new record counts once, when it is first saved as Active or Inactive, and a clone counts; saving as a draft does not count. There is no total limit on how many packages a provider can create (Admin Editability Rules, Provider Editability Rules)."}}
  - {"op": "update_node", "id": "EVT-treatment-updated", "attrs": {"description": "treatment.updated: sent to providers who currently offer the treatment when an admin updates it, only when the treatment is Active after the save; also used with \"treatment available again\" wording when an Inactive treatment that has been Active before returns to Active, sent only to providers with a pricing configuration."}}
  - {"op": "update_node", "id": "ENT-treatment.status", "attrs": {"description": "Draft (saved as draft, visible to admins only), Active (visible to providers and selectable in new quotes), Inactive (hidden), or Pending Media Upload (set by the system when a media upload fails; the status the admin chose is stored and restored on a successful retry; providers do not see or use the treatment until media is added). The admin chooses Active or Inactive on save; Draft applies only to a treatment never saved as Active or Inactive."}}
  - {"op": "update_node", "id": "ENT-package.status", "attrs": {"description": "Draft (unfinished, only while the package has no version yet; visible only to the provider's own team and not selectable in quotes), Active or Inactive; Tab 7 warns when a source package was edited or deactivated."}}
