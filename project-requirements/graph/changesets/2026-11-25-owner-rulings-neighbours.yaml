# Owner rulings of 2026-11-25: wording follow-ups in neighbour FRs (replacement quote draft or sent, mandatory notices by email, affiliate portal as fourth application, patient email delivery issue flag on the admin patient overview, TTFQ exclusion).
reason: "Owner rulings 2026-11-25: neighbour FR wording aligned to the applied rulings."
by: controller
source_id: SRC-PRD-004
operations:
  - {"op": "update_node", "id": "REQ-003-127", "attrs": {"statement": "When an admin cancels the booking through FR-006 Screen 9 or closes the inquiry through Close inquiry on FR-006 Screen 6, System MUST move any open replacement quote (draft or sent) of that inquiry to `Cancelled (Inquiry Cancelled)`, MUST NOT send `quote.cancelled_inquiry` to any provider (an admin cancellation or close sends no provider notice, REQ-020-020; the replacement provider is not told), and no `quote.expired` follows. The quote-side behaviour is owned by FR-004 (REQ-004-111). The patient cancellation path has no replacement quote, because a replacement exists only after acceptance."}}
  - {"op": "update_node", "id": "REQ-003-013", "attrs": {"statement": "System MUST auto-cancel only the draft, sent, and expired quotes when an inquiry is cancelled by the patient or by an approved account deletion, with distinct cancellation status \"Cancelled (Inquiry Cancelled)\"; quotes in any other status MUST keep their status and cause, and `quote.cancelled_inquiry` (FR-020) MUST go only to providers whose quotes were cancelled by this cascade, never to the provider of a replacement quote (REQ-003-127)."}}
  - {"op": "update_node", "id": "REQ-003-014", "attrs": {"statement": "When an admin cancels a booking through FR-006, or closes the inquiry through Close inquiry on FR-006 Screen 6, System MUST set the inquiry to `Cancelled` with `cancelled_by = admin`, leave `cancellation_reason` empty (the admin's reason is the booking's cancellation reason in FR-006, shown to the patient and the provider as FR-006 defines), release any active appointment slot hold (FR-006 hold of the FR-026 configured duration) immediately, and leave the accepted quote with the status `accepted`. Any open replacement quote (draft or sent) follows REQ-003-127."}}
  - {"op": "update_node", "id": "REQ-006-082", "attrs": {"statement": "An admin MAY close the inquiry of a `Cancelled` booking that still carries the `supportRequired` marker, through the Close inquiry action on Screen 6 with a mandatory reason; System MUST set the inquiry to `Cancelled`, clear the marker with an audited resolution, and send the patient the admin-close variant of `inquiry.cancelled` (REQ-020-076) saying that no replacement will follow. System MUST NOT notify any provider of the close (REQ-020-020) and MUST cancel any open replacement quote (draft or sent) of the inquiry without notice (REQ-004-111, REQ-003-127)."}}
  - {"op": "update_node", "id": "REQ-020-020", "attrs": {"statement": "System MUST always send quote.cancelled_inquiry, and only that notice, to each provider holding a quote for the inquiry in draft, sent or expired state when a patient cancels the inquiry or the system cancels it at the approval of an account deletion (FR-023 REQ-023-042) (never to the provider of a replacement quote (draft or sent), REQ-003-127); a provider that never quoted is told nothing; an admin Close inquiry sends no provider notice; neither FR-030 toggles nor FR-032 provider notification preferences may suppress it. The reason is patient-private: a patient cancellation says only Inquiry cancelled by patient; the deletion cancellation shows no reason. The notice is critical (REQ-020-158): its target is a first send attempt within 5 minutes, and a failed first attempt is retried under the FR-030 retry rule (up to 3 retries, 1 hour apart by default), so 5 minutes is a target, not a guarantee."}}
  - {"op": "update_node", "id": "REQ-030-039", "attrs": {"statement": "Quote Cancelled (Inquiry Cancelled) (quote.cancelled_inquiry) is an admin-configurable notification event. Primary recipients: Provider. Sent to each provider that holds a draft, sent or expired quote when the patient cancels the inquiry (FR-003 Workflow 5) and when an approved account deletion cancels it; never to the provider of a replacement quote (draft or sent), and no provider notice is sent for an admin Close inquiry. A provider that never quoted is told nothing, and a provider that receives this notice never also receives `inquiry.cancelled`. Provider receipt is mandatory — admin cannot disable this event (see Non-Disableable by Default section); it is sent at once as a locked notice (FR-020 sets the 5-minute first-send target). The reason shows only as \"Inquiry cancelled by patient\"; the deletion cancellation shows none. MVP default channels: Email + Push. Not subject to FR-032 provider notification preferences; FR-032 offers no toggle for this event. Available template variables: `quote.id`, `quote.provider_id`, `inquiry.id`, `inquiry.cancelled_at`; `inquiry.cancellation_reason` is excluded per privacy rule."}}
  - {"op": "update_node", "id": "REQ-001-105", "attrs": {"statement": "Mandatory notices as FR-020 defines them (REQ-020-038) are always sent and are not affected by global toggles by email; push for these notices follows the patient's push setting (owner ruling 2026-11-25)"}}
  - {"op": "update_node", "id": "REQ-014-183", "attrs": {"statement": "Value: p50 and p90 vs SLA (compact dual-bullet); Color: Green (p50 ≤ SLA and p90 ≤ 2×SLA) · Amber (p50 ≤ SLA and p90 > 2×SLA) · Red (p50 > SLA); Tap → the FR-003 provider inquiry list filtered to the inquiries in the period; response time is per provider, not per team member; admin-authored replacement quotes (FR-004 Workflow 7) are not counted"}}
  - {"op": "update_node", "id": "REQ-018-298", "attrs": {"statement": "The affiliate portal (Screens 9 and 10) is a fourth application, separate from the Patient, Provider and Admin platforms (owner ruling 2026-11-25; constitution C-I-0a); it has its own authentication and authorization scope and affiliate-only data access"}}
  - {"op": "add_edge", "from": "SCR-016-02", "verb": "shows", "to": "ENT-patient.email_delivery_issue", "attrs": {"provenance": "inherited from another FR", "label": "Email Delivery Issue", "editable": false}}
  - {"op": "add_edge", "from": "FR-016", "verb": "references", "to": "REQ-030-156"}
