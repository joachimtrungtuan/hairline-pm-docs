reason: "Requirements graph programme baseline 2026-11-20: owner rulings applied (FR-015)"
by: controller
operations:
  - {"op": "add_field", "id": "ENT-provider.payout_method", "entity_id": "ENT-provider", "name": "payout_method", "data_type": "enum", "title": "Payout method", "owner_fr": "FR-015", "required": false, "attrs": {"description": "How the clinic's share is paid out: Stripe Connect or Manual bank transfer. Chosen by an admin at creation (Screen 2 Step 5); only an admin changes it afterwards (Tab 7)."}}
  - {"op": "add_enum_value", "field_id": "ENT-provider.payout_method", "value": "stripe_connect", "label": "Stripe Connect"}
  - {"op": "add_enum_value", "field_id": "ENT-provider.payout_method", "value": "manual_bank_transfer", "label": "Manual bank transfer"}
  - {"op": "add_field", "id": "ENT-provider.timezone", "entity_id": "ENT-provider", "name": "timezone", "data_type": "text", "title": "Time zone", "owner_fr": "FR-015", "required": false, "attrs": {"description": "The provider's own time zone, set by the provider in FR-032 account settings."}}
  - {"op": "update_node", "id": "ENT-provider", "attrs": {"description": "A hair transplant provider organization account created by an admin: identity and login email, professional details, status (Active, Suspended, Deactivated), featured flag, seat limit, payout method, and copies of the clinic address, country and logo. Commission settings live in ENT-commission-rate-config (FR-029); clinic data in ENT-clinic-information."}}
  - {"op": "update_node", "id": "ENT-provider.address", "attrs": {"description": "Copy of the clinic address (Key Entity 3 Clinic Information), held on the Provider record."}}
  - {"op": "update_node", "id": "ENT-provider.country", "attrs": {"description": "Copy of the clinic Location - Country (Key Entity 3 Clinic Information), held on the Provider record."}}
  - {"op": "update_node", "id": "ENT-provider.avatar", "attrs": {"description": "Copy of the clinic Profile Picture / Logo, held on the Provider record; shown in the provider row of Patient Screens 2 and 3 (FR-013)."}}
  - {"op": "update_node", "id": "ENT-provider.starting_price", "attrs": {"description": "Calculated, not typed in: the lowest standard price (ENT-package.standard_price, FR-024) among the provider's active packages, converted to the patient's currency. Shown read-only in Screen 3 Tab 1."}}
  - {"op": "update_node", "id": "REQ-015-011", "attrs": {"statement": "System MUST store activation token (one-time password setup link), token expiry timestamp (24 hours from generation), and the password_set status of the provider owner's login, all on the Provider record. System MUST invalidate previous tokens when new token is generated.", "rationale": "Key Entity 1 and REQ-015-011: password_set and the activation token stay on the Provider record."}}
  - {"op": "update_node", "id": "REQ-015-015", "attrs": {"statement": "System MUST enforce the platform-wide password policy (see system PRD, Platform-Wide Rules: Password and one-time-code policy). Passwords MUST be hashed using bcrypt with a minimum cost factor of 12."}}
  - {"op": "update_node", "id": "REQ-015-019", "attrs": {"statement": "System MUST notify affected patients and alert admins when a provider status change cancels or flags their cases, regardless of the optional Notify Provider checkbox. Recipients, content, variants and whether a notice can be switched off are defined once, in the FR-030 notification catalogue (`provider.status_cancellation_patient`, `booking.provider_fault_replacement`, `provider.status_cancellation_admin_support`). Support resolution MUST be audited before clearing the marker."}}
  - {"op": "update_node", "id": "REQ-015-030", "attrs": {"statement": "Provider creation (and therefore activation) requires every field marked Required in the Screen 2 wizard: First Name, Last Name, Email, Phone Number, Bio/Description (50-500 chars), Specialty, Medical License Number, Years of Experience, at least 1 Language, Clinic Name, Clinic Address, Contact Email, Medical License file, Commission Model and Value, Flat Rate Currency (when Commission Model = Flat Rate), Payout Method, and Commission Start Date. The Medical License file is a record-keeping baseline only; document authenticity or later document changes never block activation or change status. Payout readiness (the clinic's own Stripe sign-up being Ready) is not required for creation or activation (Payout Readiness Rule). A field marked \"Required\" in a screen table means it is needed to submit or save that screen only; it does not by itself make the stored provider attribute mandatory."}}
  - {"op": "update_node", "id": "REQ-015-036", "attrs": {"statement": "Screen 4 and Alternative Flow A5 own provider-status cancellation and support effects; FR-006 Alternative Flow B5 owns the replacement-provider transfer for accepted bookings before treatment starts, FR-006 Alternative Flow B7 (on Screen 6) owns the admin decision for `In Progress` bookings (move to Aftercare with reassignment, or cancel), and FR-006 Alternative Flow B6 with FR-011 owns only the aftercare reassignment. The cascade is provider-scoped, preserves immutable accepted context, and must not count alternatives as independent treatments or cancel unrelated providers' unaccepted offers."}}
  - {"op": "update_node", "id": "REQ-015-043", "attrs": {"statement": "Suspension or deactivation closes affected bookings and blocks further patient payment to that provider, but payment/refund/commission records remain intact. For a closed accepted booking, money follows the FR-006 Alternative Flow B5 payment placeholder: paid amounts move with the patient as credit toward the replacement booking, any unused part is refunded, and the patient pays no fee. Exact refund, fund-release, and allocation mechanics belong to FR-007, FR-007B, and FR-017; no new refund percentage or fee is defined here, and the payout method and payout-readiness rules below concern only a clinic's payout setup."}}
  - {"op": "update_node", "id": "REQ-015-044", "title": "No per-clinic payout frequency; automatic release on Stripe Connect, one settlement period on the manual rail", "attrs": {"statement": "There is no per-clinic payout frequency. On the Stripe Connect rail, release to the clinic is automatic through FR-017. A clinic paid by manual bank transfer follows the one settlement-period setting owned by FR-029 (default weekly, Sunday cutoff, Wednesday payout), which applies to all manually paid clinics."}}
  - {"op": "update_node", "id": "REQ-015-047", "attrs": {"statement": "Providers view their own profile (synced with A-02). Providers see uploaded documents (for reference). Providers view configured commission rates (read-only) in the FR-032 Screen 4 Commission & Payout panel. Providers can edit profile fields (Bio, Languages, Awards, Profile Picture, Contact details) via FR-032: Provider Dashboard Settings & Profile Management, which updates the A-02 record. All editable fields must align between FR-015 and FR-032 to ensure consistency."}}
  - {"op": "update_node", "id": "REQ-015-048", "attrs": {"statement": "System retries the delivery under the FR-030 notification retry rule; admin sees warning message: \"Notification queued but not yet delivered.\" Admin can manually resend via the \"Resend Activation Email\" button in Screen 3.", "rationale": "Dependencies External Service 1 and the failed-email edge case: retry follows the FR-030 notification retry rule; the warning and manual resend are the same for activation and provider status emails."}}
  - {"op": "update_node", "id": "REQ-015-049", "title": "Provider status email recipients come from the notification catalogue", "attrs": {"statement": "Recipients of the provider status emails (`provider.suspended`, `provider.deactivated`, `provider.reactivated`, and `provider.scheduled_change_cancelled`) are set in the FR-030 notification catalogue. Team members learn of the status through the FR-032 Rule 6 banner or the deactivated-login message."}}
  - {"op": "update_node", "id": "REQ-015-050", "attrs": {"statement": "For an immediate change the email is sent once. For a scheduled change with \"Notify Provider\" checked, the email is sent when the scheduled change is created (with the Effective Date) and again when it takes effect. If \"Notify Provider\" is unchecked, no provider email is sent at either point; patient messages and admin-support alerts are still mandatory. If \"Notify Provider\" checkbox enabled (default), system sends email (FR-020 `provider.suspended` or `provider.deactivated`). Its content is defined in the FR-030 notification catalogue."}}
  - {"op": "update_node", "id": "REQ-015-053", "attrs": {"statement": "System sends the account activation email (FR-020 `provider.activation`; mandatory and cannot be disabled) to the provider with a secure one-time link to set the password (expires in 24 hours). The rest of its content is defined in the FR-030 notification catalogue.", "rationale": "Main Flow step 13: the email content beyond the one-time link (24 hours) is defined in the FR-030 notification catalogue."}}
  - {"op": "update_node", "id": "REQ-015-068", "attrs": {"statement": "Deactivated providers' data is retained for legal/audit purposes (retention follows the system PRD, Platform-Wide Rules: One 10-year retention period), then archived; it is never hard-deleted. GDPR/data deletion requests are handled via separate data privacy workflows (not in-scope for A-02)"}}
  - {"op": "update_node", "id": "REQ-015-070", "attrs": {"statement": "Login email follows the FR-009 global provider email identity rule (Rule 3, REQ-009-008); Deactivated providers' emails are freed (see Rule 4). If another provider organization uses the email as Owner, team member, or pending invitation, system displays validation error: \"Email address already in use by another provider (Provider Name: [existing provider]). Please use a different email or edit the existing provider.\" Provider creation blocked until unique email provided."}}
  - {"op": "update_node", "id": "REQ-015-100", "title": "Commission and payout inputs: model, value, currency, start date, payout method", "attrs": {"statement": "Commission Model is Percentage (default) or Flat Rate. Percentage value is 0-100 with 0.1% precision; Flat Rate value is greater than 0 in the Flat Rate Currency's minor units, per FR-029. Flat Rate Currency is required for Flat Rate, taken from the FR-029 enabled currency list and defaulting to the system default currency. Commission Start Date is required, today (current UTC date) or a future date. Payout Method is required (Stripe Connect or Manual bank transfer) with no preselected value. System displays client-side validation error immediately: \"Percentage must be between 0-100%\" or \"Flat rate must be greater than 0.\" Server-side validation also enforces rules; the API returns a 422 validation error whose field message uses the same PRD wording if an invalid rate is submitted."}}
  - {"op": "update_node", "id": "REQ-015-102", "attrs": {"statement": "Commission settings can be edited for Active and Suspended providers (so terms can be fixed before reactivation). For Deactivated providers Tab 7 is read-only; history stays visible. FR-029 Screen 5 applies the same rule (CR-FR029-20261015-02). When a deactivation takes effect, the system automatically cancels any pending Scheduled Configuration and logs the cancellation in Commission History"}}
  - {"op": "update_node", "id": "REQ-015-106", "attrs": {"statement": "All changes to commission and payout settings logged in history with timestamp, admin user, old/new values"}}
  - {"op": "update_node", "id": "REQ-015-108", "attrs": {"statement": "FR-029 / A-09 owns the central commission-settings screen (global default + provider-specific commission scopes) and the booking-time snapshot policy; this tab remains the single-provider management surface for provider-specific commission configuration"}}
  - {"op": "update_node", "id": "REQ-015-110", "attrs": {"statement": "Admin can edit commission settings (requires re-authentication). In MVP this is implemented as password re-entry; once the shared MFA stack from FR-026 / FR-031 is delivered, these actions MUST use MFA-based re-authentication and any MFA references in this FR are to be understood as future (non-MVP) behavior."}}
