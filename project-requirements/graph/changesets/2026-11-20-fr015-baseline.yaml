  - {"op": "add_node", "id": "REQ-015-127", "type": "Rule", "owner_fr": "FR-015", "title": "A share due to a clinic that is not Ready stays with Hairline until Ready", "attrs": {"statement": "When a booking's share is due to move to a clinic whose Stripe payout setup is not Ready, the share MUST stay with Hairline, the clinic and the admin MUST be told, and the share MUST move once the clinic becomes Ready. Nothing is paid out to the clinic before then, even after treatment.", "rationale": "Payout Readiness Rule; Tab 7 Payout Readiness field."}}
