  - {"op": "add_node", "id": "REQ-014-262", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 8 Widget 3 Provider Activity Table and engagement status", "attrs": {"statement": "Provider: Name + country; Last active: `MAX(action_at)` from `provider_activity_logs` for that `provider_id`; for last login specifically use `MAX(action_at) WHERE action_type = 'login'`; Quotes this month: Distinct parent quotes first submitted in current calendar month; no extra counts for options, date-price records, versions, or resends; Inquiry response rate: Distinct distributed inquiries answered ÷ distinct inquiries distributed to this provider (last 30-day distribution cohort); Status: Based on Last active: Active (activity within the At Risk threshold, default 7d) · At Risk (between the At Risk and Dormant thresholds, default 7–30d) · Dormant (no activity beyond the Dormant threshold, default 30d). Thresholds come from FR-026 Screen 5e; Filter by status (Active / At Risk / Dormant); Drill-down: click row → provider detail in FR-015", "rationale": "PRD lines 895-904."}}
  - {"op": "add_node", "id": "REQ-014-263", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 8 Widget 4 New Provider Ramp", "attrs": {"statement": "Chart type: Line chart (multiple series); X axis: Days since onboarding (0–90 days); Y axis: Cumulative distinct parent quotes first submitted; Series: Each provider onboarded in the selected period (one line each, labelled with provider name per Rule 14); Reference line: Platform average ramp curve; Purpose: Identify new providers who are struggling to get started; Data source: Providers with `created_at` within the selected period; parent `first_sent_at − providers.created_at` (`first_sent_at` is set by FR-004 on first send and never changed by a re-send) for days-since-onboarding offset. Count each parent identity once, regardless of later versions, resends, or child record counts.", "rationale": "PRD lines 910-917."}}
  - {"op": "add_node", "id": "REQ-014-264", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 8 Widget 5 Engagement Health Summary", "attrs": {"statement": "Chart type: Three KPI tiles; Tile 1: Active providers count (Screen 8 Widget 3 status; default activity in last 7 days); Tile 2: At-risk providers count (Screen 8 Widget 3 status; default 7–30 days no activity); Tile 3: Dormant providers count (Screen 8 Widget 3 status; default >30 days no activity)", "rationale": "PRD lines 923-926."}}
  - {"op": "add_node", "id": "REQ-014-265", "type": "Rule", "owner_fr": "FR-014", "title": "Last-activity data from provider_activity_logs.action_at", "attrs": {"statement": "Last-activity data is sourced from `provider_activity_logs.action_at` (canonical activity log); last active = `MAX(action_at)` per provider; last login = `MAX(action_at) WHERE action_type = 'login'` per provider user. Do not use `provider_users.last_login_at` — this field does not exist in the schema.", "rationale": "PRD line 933. Screen 8 Business Rules."}}
  - {"op": "add_node", "id": "REQ-014-266", "type": "Rule", "owner_fr": "FR-014", "title": "Inquiry response rate bounded 0-100%; unavailable when distribution missing", "attrs": {"statement": "\"Inquiry response rate\" follows the shared distinct-inquiry distribution cohort definition and MUST stay between 0% and 100%. If authoritative distribution records are unavailable, display \"Response rate unavailable — distribution data missing\"; do not substitute parent quote count or total platform inquiries as the denominator.", "rationale": "PRD line 934. Screen 8 Business Rules."}}
  - {"op": "add_node", "id": "REQ-014-267", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 9 Widget 1 Inquiry Volume Trend", "attrs": {"statement": "Chart type: Area line chart; X axis: Week or month (toggle); Y axis: Inquiry count; Comparison overlay: Prior equivalent period (dashed line); Drill-down: Click period → admin Inquiries list for that period", "rationale": "PRD lines 954-958."}}
  - {"op": "add_node", "id": "REQ-014-268", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 9 Widget 2 Platform Funnel Trend", "attrs": {"statement": "Chart type: Multi-line chart (one line per stage); X axis: Month; Y axis: Conversion % to that stage from Inquiries; Lines: Quoted % · Accepted % · Confirmed booking %; Purpose: Show whether platform-wide conversion is improving or declining; Drill-down: Click line point → admin Inquiries list filtered to that stage + month", "rationale": "PRD lines 966-971."}}
  - {"op": "add_node", "id": "REQ-014-269", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 9 Widget 3 New vs Returning Patients (platform-wide)", "attrs": {"statement": "Chart type: Stacked bar chart (monthly) + KPI tiles; Bars: New patient count + Returning patient count per month; Tile 1: New patient rate (period); Tile 2: Returning patient rate (period); Definition: New = first inquiry ever · Returning = has prior inquiry on record; Drill-down: Click bar segment → Patient list filtered by type and period", "rationale": "PRD lines 979-984."}}
  - {"op": "add_node", "id": "REQ-014-270", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 9 Widget 4 Platform Patient Journey Time", "attrs": {"statement": "Chart type: Two KPI tiles + distribution histogram; Tile 1: Platform median days inquiry → payment (p50); Tile 2: Platform p90 days inquiry → payment; Histogram: Distribution across all converting patients (same bins as Screen 3 Widget 3); Calculation: Same first successful booking-confirming payment and one-observation-per-inquiry rule as Screen 3 Widget 3, across the platform; distribution to multiple providers or later installments does not multiply observations.", "rationale": "PRD lines 992-997."}}
  - {"op": "add_node", "id": "REQ-014-271", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 9 Widget 5 Inquiry Seasonality", "attrs": {"statement": "Chart type: Month × weekday heatmap (intensity = weekday average vs. monthly daily average); Layout: 12 rows (months) × 7 columns (Mon→Sun); Intensity: `average daily inquiries on that weekday in that month ÷ that month's overall daily average × 100`; Purpose: Identify seasonal peaks and campaign-worthy slow periods; Cell tooltip: `Inquiries on this weekday: N • Weekday avg: w • Month daily avg: m • Index: X%`", "rationale": "PRD lines 1005-1009."}}
  - {"op": "add_node", "id": "REQ-014-272", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 9 Widget 6 Affiliate Acquisition", "attrs": {"statement": "Chart type: Three KPI tiles + ranked table; Tile 1: Affiliate-sourced bookings (count in period); Tile 2: Affiliate contribution rate = affiliate bookings ÷ total bookings; Tile 3: Avg affiliate booking value = sum of FR-018 Entity 3 `Booking Total` for the affiliate-sourced bookings counted in Tile 1 ÷ that booking count, in platform base currency (USD, Rule 10); Table columns: Affiliate name · Bookings · Revenue · Commission owed · Conversion rate (FR-018 definition: checkouts where the code was applied and resulted in a booking ÷ checkouts where the code was applied); Drill-down: Click affiliate row → affiliate detail in FR-018; Data source: FR-018 Entity 3 `Booking with Affiliate Attribution`. Affiliate-sourced = payment-confirmed booking with a validly captured affiliate-bound code or affiliate auto-apply referral link, per FR-018 Rule 11. Attribution is counted even when a higher-priority patient or provider discount controlled the final price, so bookings, revenue, and commission owed reconcile with FR-018 referral credit. The final discount applied is not the attribution source. Limitation note: Affiliate tracking begins when the affiliate code or referral link is captured in the booking journey, not at the inquiry stage. It is not possible to attribute an inquiry to an affiliate source.", "rationale": "PRD lines 1017-1026. FR-018 dependency (line 1573)."}}
  - {"op": "add_node", "id": "REQ-014-273", "type": "Rule", "owner_fr": "FR-014", "title": "Seasonality heatmap always rolling 12 months", "attrs": {"statement": "Seasonality heatmap always shows a rolling 12-month view regardless of time range filter (for pattern recognition)", "rationale": "PRD line 1032. Screen 9 Business Rules."}}
  - {"op": "add_node", "id": "REQ-014-274", "type": "Rule", "owner_fr": "FR-014", "title": "Affiliate rows only for affiliates with a booking in period", "attrs": {"statement": "Affiliate rows show only affiliates with at least 1 booking in the selected period; inactive affiliates are filtered out", "rationale": "PRD line 1033. Screen 9 Business Rules."}}
  - {"op": "add_node", "id": "REQ-014-275", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 10 Widget 1 Patient Demand Map", "attrs": {"statement": "Chart type: Choropleth map OR ranked table with flag icons (implementation choice); Value mapped: Inquiry count per patient country (in selected period); Color scale: 5-bin scale from low (cool) to high (warm); Tooltip: `Country · Inquiries: N · Confirmed bookings: B · Conversion rate: R%` (Confirmed booking stage per Analytics Counting & Time Basis); Drill-down: Click country → filtered admin Inquiries list", "rationale": "PRD lines 1049-1053."}}
  - {"op": "add_node", "id": "REQ-014-276", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 10 Widget 2 Provider Coverage by Country", "attrs": {"statement": "Chart type: Ranked horizontal bar chart; Y axis: Country (provider country); X axis: Active provider count; Drill-down: Click bar → Provider list filtered to that country", "rationale": "PRD lines 1061-1064."}}
  - {"op": "add_node", "id": "REQ-014-277", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 10 Widget 3 Demand vs Supply Gap", "attrs": {"statement": "Chart type: Ranked table; Columns: Patient country · Inquiry count · Provider count (in that country) · Inquiries per provider · Gap flag; Gap flag: \"No coverage\" if the country has 0 active providers (inquiries per provider is shown as \"—\", not N/A); otherwise flagged if inquiries per provider > platform median by ≥50%; Sort: Default: \"No coverage\" countries first (by inquiry count descending), then inquiries per provider descending (highest gap first); Purpose: Identify countries to target for provider recruitment; Note: \"Provider country\" = provider's registered location. The gap metric is an approximation — patients may travel internationally, so a high inquiries-per-provider ratio in one country does not necessarily mean patients cannot be served.", "rationale": "PRD lines 1072-1078."}}
  - {"op": "add_node", "id": "REQ-014-278", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 10 Widget 4 Conversion Rate by Patient Country", "attrs": {"statement": "Chart type: Horizontal ranked bar chart; Y axis: Patient country (top 15 by inquiry volume); X axis: Booking conversion rate (Inquiries → Confirmed booking); Secondary bar: Inquiry count (for context); Reference line: Platform median conversion rate; Drill-down: Click bar → admin Inquiries list filtered to that country", "rationale": "PRD lines 1086-1091."}}
  - {"op": "add_node", "id": "REQ-014-279", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 10 Widget 5 Emerging Patient Origins", "attrs": {"statement": "Chart type: Ranked table; Columns: Country · Inquiry count (current period) · Inquiry count (prior period) · Growth %; Filter: Countries with >10 inquiries in current period and >20% growth vs prior period; Purpose: Spot new markets before they become dominant", "rationale": "PRD lines 1099-1102."}}
  - {"op": "add_node", "id": "REQ-014-280", "type": "Rule", "owner_fr": "FR-014", "title": "Patient country from patients.location_id with legacy fallback", "attrs": {"statement": "Country data is sourced canonically from `patients.location_id → countries.name`; if `location_id` is null for legacy rows, the UI may temporarily fall back to `patients.location` until migration cleanup is complete. No IP-geolocation fallback is assumed in this version.", "rationale": "PRD line 1108. Screen 10 Business Rules. Restated by Assumption 6 (line 1613) and the data source lines of Screen 2 Widget 3 (line 304), Screen 3 Widget 1 (line 385) and Screen 4 Widget 3 (line 509)."}}
  - {"op": "add_node", "id": "REQ-014-281", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 11 Widget 1 Treatment Completion Rate", "attrs": {"statement": "Chart type: Bar chart; X axis: Treatment type; Y axis: Completion rate = Confirmed bookings (FR-006) in the confirmation cohort whose procedure reached FR-010 completion by the reporting cutoff ÷ all Confirmed bookings in that cohort, by the accepted parent's treatment; Reference line: Platform average completion rate; Drill-down: Click bar → admin Bookings list filtered to that treatment", "rationale": "PRD lines 1126-1130."}}
  - {"op": "add_node", "id": "REQ-014-282", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 11 Widget 2 Cancellation and No-Show by Treatment", "attrs": {"statement": "Chart type: Grouped bar chart; X axis: Treatment type; Y axis: Rate %; Groups: Cancellation rate · No-show rate; Drill-down: Click Cancellation bar → admin Bookings list filtered to post-confirmation cancellations (FR-006) for that treatment; click No-show bar → admin Cases list filtered to FR-010 closure reason `No-show` for that treatment", "rationale": "PRD lines 1138-1142."}}
  - {"op": "add_node", "id": "REQ-014-283", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 11 Widget 3 Treatment Volume Trend", "attrs": {"statement": "Chart type: Stacked area chart; X axis: Month; Y axis: Booking count; Areas: One per treatment type (dynamic, top 5 + Other); Purpose: Track which treatments are growing or declining in demand; Drill-down: Click area segment → admin Bookings list filtered to treatment + month", "rationale": "PRD lines 1150-1155."}}
  - {"op": "add_node", "id": "REQ-014-284", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 11 Widget 4 Average Review Scores by Treatment", "attrs": {"statement": "Chart type: Grouped bar chart; X axis: Treatment type; Y axis: Score (1–5); Groups: Overall · Results · Staff · Facility · Value; Data source: FR-013 per-treatment sub-scores endpoint (REQ-013-018a), keyed by `treatment_id`, Published reviews only; Provider filter: Required. The endpoint returns one provider's sub-scores, so the widget renders only when a single provider is selected; with \"All providers\" it shows \"Select a provider to view review scores by treatment\"; Drill-down: Click bar → Reviews list filtered to that provider and treatment", "rationale": "PRD lines 1163-1169. FR-013 dependency (line 1569: the sub-scores endpoint is per provider)."}}
  - {"op": "add_node", "id": "REQ-014-285", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 11 Widget 5 Aftercare Activation Rate", "attrs": {"statement": "Chart type: KPI tile + trend line + bar by treatment type; KPI: Platform-wide aftercare activation rate = FR-011 aftercare records created for procedures completed in the period ÷ FR-010 completed procedures in the period, by the accepted parent's treatment; Bar chart: Activation rate broken down by treatment type; Drill-down: Click bar → Aftercare records list", "rationale": "PRD lines 1177-1180."}}
  - {"op": "add_node", "id": "REQ-014-286", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 11 Widget 6 Provider Distribution by Treatment Specialisation", "attrs": {"statement": "Chart type: Stacked horizontal bar chart; Y axis: Treatment type; X axis: Provider count offering that treatment; Drill-down: Click bar → Provider list filtered to that treatment; Data source: Submitted parent quotes (FR-004) grouped by treatment and `provider_id`; a provider \"offers\" a treatment if they have first-submitted at least 1 parent quote for it in the last 12 months.", "rationale": "PRD lines 1188-1193. No REQ id in the Functional Requirements Summary covers this widget."}}
  - {"op": "add_node", "id": "REQ-014-287", "type": "Rule", "owner_fr": "FR-014", "title": "Completion rate needs at least 5 Confirmed bookings per bar", "attrs": {"statement": "Completion rate needs at least 5 Confirmed bookings in the confirmation cohort for each bar, to avoid single-event noise. With a single provider selected, a treatment bar needs ≥5 of that provider's Confirmed bookings for the treatment. With all providers, each treatment bar and the platform average pool every provider's bookings and need ≥5 pooled bookings; low-volume providers are not dropped from the pooled rate. Below the minimum, the bar is marked as not enough data per Rule 8; the exact visual treatment of low-sample bars is a UX design decision", "rationale": "PRD line 1199. Screen 11 Business Rules."}}
  - {"op": "add_node", "id": "REQ-014-288", "type": "Rule", "owner_fr": "FR-014", "title": "No-show and cancellation rate sources", "attrs": {"statement": "No-show rate uses FR-010 case closures with closure reason `No-show` (admin-managed case closure label, not a booking pipeline status) over confirmed bookings in the period; cancellation rate uses post-confirmation cancellations from the FR-006 Booking lifecycle. A booking closed as No-show counts as a no-show, not a cancellation", "rationale": "PRD line 1200. Screen 11 Business Rules."}}
  - {"op": "add_node", "id": "REQ-014-289", "type": "Rule", "owner_fr": "FR-014", "title": "Estimated Grafts never presented as a clinical result", "attrs": {"statement": "Do NOT add any clinical outcome metrics (achieved graft count, hair density, success rates). FR-004 Estimated Grafts is a provider's quote estimate, not a clinical outcome, and must not be presented as a result", "rationale": "PRD line 1201. Screen 11 Business Rules; overlaps REQ-014-090."}}
  - {"op": "add_node", "id": "REQ-014-290", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 12 Widget 1 Platform GMV and Net Revenue", "attrs": {"statement": "Chart type: Dual-line area chart; X axis: Month; Y₁ series: Platform GMV (gross payment volume); Y₂ series: Net revenue (platform commission earned in period, accrual basis); Tooltip: GMV · Refunds completed in period · Net GMV (GMV − refunds) · Net revenue; Drill-down: Click period → detailed payment records; Calculation: GMV = `SUM(payments.amount)` where `payment_type ≠ 'refund'` and `payment_status IN ('completed', 'refunded')` (gross captured volume; refund rows are neither added nor subtracted, and a later refund does not remove the original payment). Net GMV = GMV − completed refund rows in the same period, per the Refund Source of Truth rule, so each refund is subtracted exactly once. Net revenue = platform commission earned in the period, using the Widget 2 formula (percentage per completed payment; flat rate once per completed procedure). Payout timing does not affect net revenue.", "rationale": "PRD lines 1217-1224."}}
  - {"op": "add_node", "id": "REQ-014-291", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 12 Widget 2 Commission Earned Trend", "attrs": {"statement": "Chart type: Bar chart (monthly); X axis: Month; Y axis: Commission earned = sum of effective provider commission deductions in period, using each booking's confirmation-time commission snapshot (FR-015 REQ-015-022): percentage per completed payment; flat rate once per completed procedure (FR-015); Reference line: Target monthly commission (admin-configurable in FR-026; hidden until a target is set); Drill-down: Click bar → filtered payment records with commission breakdown", "rationale": "PRD lines 1232-1236."}}
  - {"op": "add_node", "id": "REQ-014-292", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 12 Widget 3 Refund and Failed Payment Health", "attrs": {"statement": "Chart type: Four KPI tiles + trend; Tile 1: Refund volume (amount, period); Tile 2: Refund rate = refund count ÷ captured payment count (both per the Refund Source of Truth rule); Tile 3: Failed payment count (period); Tile 4: Failed payment rate = failed ÷ total attempted payments. Attempted = non-refund `payments` rows (`payment_type ≠ 'refund'`) created in the period with `payment_status IN ('completed', 'refunded', 'failed')`; failed = those rows with `payment_status = 'failed'`. `pending` rows are excluded until resolved. Each row counts once, so a retry that creates a new payment row is a new attempt; Trend: Monthly refund rate + failed rate (dual line); Drill-down: Click tile → filtered Payments list", "rationale": "PRD lines 1244-1250."}}
  - {"op": "add_node", "id": "REQ-014-293", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 12 Widget 4 Platform-Wide Cash-at-Risk Aging", "attrs": {"statement": "Chart type: Stacked horizontal bar chart (same as provider C3, but all providers); Buckets: 0–24h · 1–3d · 4–7d · 8–14d · >14d; X axis: Distinct accepted selections awaiting initial payment with a valid payment-window hold (all providers); Optional legend: By provider country; Drill-down: Click bucket → admin Quotes list resolved to accepted subquote + pending booking and filtered by active hold + aging bucket; Calculation: Age from immutable `AcceptanceEvent.acceptedAt`, using the actual configured hold deadline and the Screen 1 C3 exclusions. Expired, superseded, and cancelled selections are retained in lifecycle history but excluded from active cash risk.", "rationale": "PRD lines 1258-1264."}}
  - {"op": "add_node", "id": "REQ-014-294", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 12 Widget 5 Upcoming Provider Payout Obligations", "attrs": {"statement": "Chart type: KPI tile + table; KPI: Total upcoming payout amount (next 30 days); Table columns: Provider · Amount · Payout date · Cadence · Status (FR-017: Pending Approval / Approved / Overdue / Processing); Sort: Payout date ascending; Drill-down: Click row → provider payout detail in FR-017", "rationale": "PRD lines 1272-1276."}}
  - {"op": "add_node", "id": "REQ-014-295", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 12 Widget 6 Installment Plan Health", "attrs": {"statement": "Chart type: Donut + KPI; Segments: Active · Completed · Overdue · Defaulted (FR-007B Plan Status labels); KPI: Total outstanding installment balance (Active, Overdue, and Defaulted plans); Data source: `installment_plans` table status, using the FR-007B Plan Status values unchanged; Drill-down: Click segment → Installment plans list filtered by status", "rationale": "PRD lines 1284-1288. FR-007B dependency (line 1565)."}}
  - {"op": "add_node", "id": "REQ-014-296", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 12 Widget 7 Affiliate Commission Obligations", "attrs": {"statement": "Chart type: KPI tile + upcoming table; KPI: Total affiliate commission owed (pending payout); Table: Affiliate · Commission owed · Next payout date; Drill-down: Click row → FR-017 affiliate billing", "rationale": "PRD lines 1296-1299."}}
  - {"op": "add_node", "id": "REQ-014-297", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 12 Widget 8 Revenue by Currency", "attrs": {"statement": "Chart type: Donut; Segments: Per currency code (`payments.currency`); Value: GMV by currency; Purpose: FX exposure visibility — how much revenue is in non-base currencies", "rationale": "PRD lines 1307-1310."}}
  - {"op": "add_node", "id": "REQ-014-298", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 12 amounts converted to fixed USD base currency", "attrs": {"statement": "All amounts converted to the platform base currency, USD, which is fixed by FR-029 / A-09 Currency Management (not admin-editable), using daily FX rates under Rule 10; raw currency amounts shown in tooltips", "rationale": "PRD line 1316. Screen 12 Business Rules. FR-029 dependency (line 1575)."}}
  - {"op": "add_node", "id": "REQ-014-299", "type": "Rule", "owner_fr": "FR-014", "title": "Net revenue is accrual-based", "attrs": {"statement": "Net revenue is accrual-based (commission earned in the period) and does not depend on when payouts are disbursed", "rationale": "PRD line 1317. Screen 12 Business Rules."}}
  - {"op": "add_node", "id": "REQ-014-300", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 12 only for admin roles with financial data permission", "attrs": {"statement": "This screen is only accessible to admin roles with financial data permissions", "rationale": "PRD line 1318. Screen 12 Business Rules. FR-031 dependency (line 1576)."}}
  - {"op": "add_node", "id": "REQ-014-301", "type": "Rule", "owner_fr": "FR-014", "title": "Accepted quote amount never replaces financial transactions", "attrs": {"statement": "Payment, refund, commission, installment, and payout metrics aggregate their owning records once before joining the accepted selection. The accepted quote amount is not captured revenue and MUST NOT replace actual financial transactions.", "rationale": "PRD line 1319. Screen 12 Business Rules."}}
  - {"op": "add_node", "id": "REQ-014-302", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 13 Widget 1 Average Accepted Price by Treatment", "attrs": {"statement": "Chart type: Bar chart; X axis: Treatment type; Y axis: Average accepted subquote total price (platform base currency); Error bars: p25–p75 range per treatment; Drill-down: Click bar → Quotes list filtered to accepted selections for that treatment and acceptance period", "rationale": "PRD lines 1335-1339."}}
  - {"op": "add_node", "id": "REQ-014-303", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 13 Widget 2 Accepted Price Range per Treatment", "attrs": {"statement": "Chart type: Range bar chart (or box plot if supported); X axis: Treatment type; Ranges shown: Min · p25 · Median · p75 · Max; Purpose: Show the observed spread of accepted selection prices for each treatment, not the full offered-price market; Reference line: Platform median per treatment; Drill-down: Click bar → Quotes list of accepted selections for that treatment sorted by accepted price", "rationale": "PRD lines 1347-1352."}}
  - {"op": "add_node", "id": "REQ-014-304", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 13 Widget 3 Accepted Price by Provider Country", "attrs": {"statement": "Chart type: Grouped bar chart; X axis: Provider country; Y axis: Average accepted subquote total price; Groups: Per treatment type (top 3 by volume); Purpose: Surface geographic pricing differences (e.g., Turkish providers vs. UK providers); Drill-down: Click bar → Quotes list filtered to accepted selections by provider country + treatment", "rationale": "PRD lines 1360-1365."}}
  - {"op": "add_node", "id": "REQ-014-305", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 13 Widget 4 Accepted Selections by Price Bracket", "attrs": {"statement": "Chart type: Bar chart; X axis: Accepted subquote total price bracket (dynamic bins based on accepted-price distribution); Y axis: Accepted selection count; tooltip also shows share of all accepted selections in the filtered acceptance-time cohort; Reference line: None — this is a price distribution, not a conversion-rate chart; Purpose: Show which price brackets patients accepted, without assigning unaccepted parents an invented single price; Drill-down: Click bar → Quotes list filtered to accepted selections in that price bracket and acceptance period; Boundary: Offered-price conversion by bracket is deferred. It requires a separately approved price attribution/denominator policy for multi-option parents; dividing accepted selections by accepted selections would misleadingly produce 100% and is prohibited.", "rationale": "PRD lines 1373-1380."}}
  - {"op": "add_node", "id": "REQ-014-306", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 13 Widget 5 Price Trend per Treatment", "attrs": {"statement": "Chart type: Multi-line chart; X axis: Month (last 12 months); Y axis: Average accepted subquote total price; Lines: One per treatment type (top 5 by volume + Other as grey line); Purpose: Track whether observed accepted prices are rising or falling; Drill-down: Click line point → Quotes list filtered to accepted selections for that treatment + acceptance month", "rationale": "PRD lines 1388-1393."}}
  - {"op": "add_node", "id": "REQ-014-307", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 13 Widget 6 Price Outlier Providers", "attrs": {"statement": "Chart type: Ranked table; Columns: Provider · Treatment · Average accepted price · Platform accepted-price median · Variance % · Direction; Filter: Providers whose average accepted price is ≥30% above or below the platform accepted-price median for any treatment; Direction: \"High\" (priced above) or \"Low\" (priced below); Purpose: Flag descriptive deviations in accepted prices for review; does not conclude that a provider is pricing itself out of the market; Drill-down: Click row → that provider's detail in FR-015", "rationale": "PRD lines 1401-1406."}}
  - {"op": "add_node", "id": "REQ-014-308", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 13 accepted prices converted to base currency with provenance", "attrs": {"statement": "All accepted prices converted to platform base currency under Rule 10, preserving immutable accepted currency/locked-rate provenance; raw accepted amounts and sample sizes shown in tooltips", "rationale": "PRD line 1412. Screen 13 Business Rules."}}
  - {"op": "add_node", "id": "REQ-014-309", "type": "Rule", "owner_fr": "FR-014", "title": "Only accepted subquote prices from immutable AcceptanceEvents", "attrs": {"statement": "Only accepted subquote prices from immutable AcceptanceEvents are included, one observation per accepted parent quote; current quote status or current package-library prices are not price sources. Use acceptance time for price ranges, trends, distributions, and outliers.", "rationale": "PRD line 1414. Screen 13 Business Rules."}}
  - {"op": "add_node", "id": "REQ-014-310", "type": "Rule", "owner_fr": "FR-014", "title": "Minimum 5 accepted selections per treatment per provider for outliers", "attrs": {"statement": "Minimum 5 accepted selections per treatment per provider required to include that provider in outlier detection; unaccepted parents do not satisfy this amount-sample threshold", "rationale": "PRD line 1415. Screen 13 Business Rules; overlaps REQ-014-104."}}
  - {"op": "add_node", "id": "REQ-014-311", "type": "Rule", "owner_fr": "FR-014", "title": "Unaccepted parents never assigned zero or an alternative's amount", "attrs": {"statement": "Unaccepted parents still count once in parent response volume and parent acceptance-rate denominators; they MUST NOT be assigned zero or an arbitrary alternative's amount for price charts.", "rationale": "PRD line 1416. Screen 13 Business Rules."}}
