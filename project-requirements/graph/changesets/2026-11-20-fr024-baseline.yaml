  # Rules changed by today's PRD edits
  - {"op": "update_node", "id": "REQ-024-003", "attrs": {"statement": "System MUST allow admins to activate or deactivate treatments, affecting availability for new quotes and draft quotes only; sent quotes and bookings are not affected", "rationale": "Functional Requirements Summary; Alternative Flow A2 step 9."}}
  - {"op": "update_node", "id": "REQ-024-007", "attrs": {"statement": "System MUST allow providers to create packages with name, description, included items, included travel services, relative-day treatment plan, standard price, images, and status (Draft, Active, or Inactive)", "rationale": "Functional Requirements Summary; Main Flow: Provider Creates Package step 10."}}
  - {"op": "update_node", "id": "REQ-024-035", "attrs": {"statement": "System MUST treat the provider treatment Base Price as a reference-only, non-binding value. It is not the clinic starting price: a clinic starting price is the lowest standard price among its active packages. Base Price MUST NOT be binding and MUST NOT be read after a quote is sent. Whether it prefills a new quote price row is owned by FR-004 (REQ-004-044)", "rationale": "Functional Requirements Summary; Screen 3 rules; Key Entities."}}
  - {"op": "update_node", "id": "REQ-024-041", "attrs": {"statement": "When an admin saves a new treatment as Active, System sends all active providers the notification \"New treatment available in catalog\", and providers can then configure pricing for it.", "rationale": "Communication Structure and Main Flow: Admin Creates Treatment step 14 (notice only when saved Active)."}}
  - {"op": "update_node", "id": "REQ-024-043", "attrs": {"statement": "When an admin deactivates a treatment, System notifies the providers who offer the treatment with the message \"Treatment [Name] has been deactivated\".", "rationale": "Communication Structure and Alternative Flow A2 step 8."}}
  - {"op": "update_node", "id": "REQ-024-048", "attrs": {"statement": "A treatment's status is Draft, Active, Inactive, or Pending Media Upload. The admin chooses Active or Inactive on save (default Active); Draft is set by Save as Draft; Pending Media Upload is set by the system when a media upload fails. Only Active treatments are visible to providers; Inactive, Draft and Pending Media Upload treatments are hidden from provider view.", "rationale": "Main Flow: Admin Creates Treatment steps 8 and 13; Screen 2 Status; Screen 3 rules."}}
  - {"op": "update_node", "id": "REQ-024-049", "attrs": {"statement": "When a media upload to S-05 fails, System retries up to 3 times with exponential backoff. If all retries fail it shows an error (\"Media upload failed, please try again\"), saves the treatment record without media marked \"Pending Media Upload\", and the admin can retry the upload separately by editing the treatment; once the upload succeeds the record is updated. Providers do not see or use a treatment in Pending Media Upload status until media is added.", "rationale": "Alternative Flow B2; Edge Cases (media upload failure)."}}
  - {"op": "update_node", "id": "REQ-024-052", "attrs": {"statement": "Providers cannot select a deactivated treatment in new quotes. If a treatment is deactivated while a provider has a draft quote open, System refreshes the available treatments and warns \"Treatment [Name] is no longer available. Please select a different treatment.\" Sent quotes and bookings using the treatment continue unaffected; a draft quote that uses it must pick another treatment before it can be sent.", "rationale": "Alternative Flow A2 steps 7 and 9; Edge Cases; General Module Rule 4."}}
  - {"op": "update_node", "id": "REQ-024-054", "attrs": {"statement": "The admin treatment list shows Active treatments first and Inactive last, filters by treatment name in real time and by treatment type, shows \"Create New Treatment\" at all times, keeps Deactivate always available, allows Edit on every treatment regardless of status, and shows 20 treatments per page.", "rationale": "Screen 1 business rules and notes."}}
  - {"op": "update_node", "id": "REQ-024-056", "attrs": {"statement": "All timestamps are displayed in the user's local timezone. Last Updated on every screen is the database updated_at timestamp, displayed in the user's local timezone.", "rationale": "General Module Rule 6 and Field Calculation Rules."}}
  - {"op": "update_node", "id": "REQ-024-057", "attrs": {"statement": "The admin treatment form and the package form each auto-save a draft every 30 seconds to prevent data loss and offer Save as Draft. A saved draft has status Draft: a treatment draft is visible to admins only; a package draft is visible only to the provider's own team and cannot be selected in a quote. Cancel on either form discards unsaved changes and returns to the list.", "rationale": "Screen 2 and Screen 5 rules and notes."}}
  - {"op": "update_node", "id": "REQ-024-069", "attrs": {"statement": "System saves a new package as version 1, linked to the provider account. Whether it can be used in quote creation follows FR-004.", "rationale": "Main Flow: Provider Creates Package steps 14 and 16; Screen 5 rules."}}
  - {"op": "update_node", "id": "REQ-024-078", "attrs": {"statement": "There is no total limit on how many packages a provider can create; package creation is limited to 50 per hour per provider by default (admin setting).", "rationale": "Provider Editability Rules, Business Rules for Providers; Admin Editability Rules."}}
  - {"op": "update_node", "id": "REQ-024-039", "attrs": {"statement": "Admins maintain the treatment types (initially FUE, FUT, DHI, Sapphire FUE, Robotic, Other) as a managed list on the Admin Treatment Types screen; admins add new types and edit type names with no code change, and the Treatment Type field on Screens 1 and 2 chooses from exactly this list.", "rationale": "Module Scope (Admin Platform); Screen 6; Admin Editability Rules."}}
  - {"op": "update_node", "id": "REQ-024-040", "attrs": {"rationale": "Module Scope (Admin Platform), Privacy Rule 2, Screen 7 (Admin Provider Packages, read-only view)."}}
  - {"op": "update_node", "id": "REQ-024-037", "attrs": {"statement": "Admin reaches treatment management from \"Settings > Treatment Settings\" (\"Create New Treatment\", or edit from the treatment list), and opens the treatment type list, the read-only provider packages view and the aftercare templates from the same treatment settings area. Provider reaches treatment pricing from \"Products & Services > Treatments\" (\"Treatment Pricing\") and the package catalog from \"Products & Services > Packages\" (\"Create Package\"). During quote creation the provider selects a treatment and one to five Active packages. Patients have view-only access through provider quotes.", "rationale": "Entry Points; User Story 1 scenario 3."}}

