  # New Rule REQ-024-085 (moved from REQ-010-050; the FR-010 cross file merges the old id into it)
  - {"op": "add_node", "id": "REQ-024-085", "type": "Rule", "owner_fr": "FR-024", "title": "Admin edits medication and post-op instruction templates", "attrs": {"statement": "System MUST allow admins to manage the medication templates (common post-op medication presets that speed up prescribing) and the post-op instruction templates (standard instruction text that providers can customize). The medication templates are the one admin medication list providers pick medication from; the FR-011 medication catalogue is this same list", "rationale": "Functional Requirements Summary and Screen 8 (Admin Aftercare Templates)."}}
  - {"op": "add_edge", "from": "REQ-024-085", "verb": "applies at", "to": "STG-admin-01-configuration"}

  # New Settings
  - {"op": "add_node", "id": "SET-treatment-creation-rate-limit", "type": "Setting", "owner_fr": "FR-024", "title": "Treatment creation rate limit", "attrs": {"description": "Maximum treatment creations per admin per hour; a whole number of 1 or more (Admin Editability Rules, Security Considerations).", "default": "10", "unit": "creations per admin per hour"}}
  - {"op": "add_node", "id": "SET-package-creation-rate-limit", "type": "Setting", "owner_fr": "FR-024", "title": "Package creation rate limit", "attrs": {"description": "Maximum package creations per provider per hour; a whole number of 1 or more. There is no total limit on how many packages a provider can create (Admin Editability Rules, Provider Editability Rules).", "default": "50", "unit": "creations per provider per hour"}}
  - {"op": "add_node", "id": "SET-treatment-type-options", "type": "Setting", "owner_fr": "FR-024", "title": "Treatment type options", "attrs": {"description": "Managed list of treatment types maintained by admins on Screen 6; the Treatment Type field on Screens 1 and 2 chooses from exactly this list. Initial values: FUE, FUT, DHI, Sapphire FUE, Robotic, Other."}}
