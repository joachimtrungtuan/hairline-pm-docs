  - {"op": "update_node", "id": "REQ-007-097", "title": "Screen 6 is the single refund control: the system starts closure-case refunds, an admin submits only exception or manual refunds, admin-set up to the amount still refundable", "attrs": {"statement": "Every refund is executed on Screen 6. A closure-case refund follows the booking's recorded closure cause (REQ-006-053) and is started by the system, never by an admin. An admin submits only an exception to the policy or a manual refund, the only cases offered when no closure cause is recorded or the cause is not listed. An exception or manual refund is admin-set: any amount from zero up to the amount still refundable, with a mandatory reason, and the ladder amount is shown beside it. FR-006 Process Refund and the FR-017 refund action open this screen instead of running their own refund."}}
  - {"op": "update_node", "id": "REQ-007-015", "title": "Exception and manual refunds need another billing admin's approval within two business days, escalate to a super-admin and are never self-approved; closure-case refunds need none", "attrs": {"statement": "Admin approval applies only to an exception refund and a manually entered refund. The approver is any other admin with billing permission, never the requester, who finds the request in the Awaiting approval view and approves or denies within 2 business days; until then the refund is awaiting approval. When 2 business days pass with no decision, System sends an escalation notice to a super-admin, who decides in the same view, never as the requester; System never approves or denies on its own. A closure-case refund (REQ-006-053) runs with no second approval. The sum of all refunds on a booking never exceeds the amount paid (REQ-007-066). The requester, approver, decision and reason are logged and notifications sent."}}
  - {"op": "add_edge", "from": "REQ-007-015", "verb": "applies to", "to": "ACT-super-admin"}
  - {"op": "update_node", "id": "REQ-007-066", "title": "The sum of refunds on one booking cannot exceed the amount paid", "attrs": {"statement": "The sum of all refunds on a booking cannot exceed the amount paid."}}
  - {"op": "update_node", "id": "EVT-refund-approval-escalated", "attrs": {"description": "Escalation notice to a super-admin when an exception or manual refund has had no decision for 2 business days; the refund stays awaiting approval."}}
