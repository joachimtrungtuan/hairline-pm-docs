  - {"op": "update_node", "id": "REQ-007-096", "title": "A payment captured when the booking is not payable, or a partial deposit left when the hold expires, is refunded in full automatically", "attrs": {"statement": "A payment captured after the hold expired, or after the booking was cancelled for a cause other than a provider fault, is recorded and does not confirm or revive the booking. A partial deposit still held when the hold expires is treated the same way. System MUST refund it in full automatically, write an audit entry and notify the patient, with no admin approval."}}
  - {"op": "add_edge", "from": "REQ-007-096", "verb": "applies to", "to": "ENT-booking.deposit_status"}
  - {"op": "update_node", "id": "REQ-007-099", "attrs": {"statement": "Unpaid: nothing is paid. Deposit only: the deposit is paid and the balance is not. Installments active: an installment plan has started and is not fully paid. Full paid: the whole payable total is paid. Refunded: all money paid has been returned; a part refund leaves the previous status and shows in the refund history. Deposit status Partial: only part of the deposit amount has been received and the rest is still due; the booking is not confirmed until the full deposit is paid, Payment Status stays Unpaid (there is no Pending value), and the partial deposit is refunded in full automatically when the hold expires (REQ-007-096). At Risk is not a status."}}
  - {"op": "update_node", "id": "STP-007-009", "title": "System moves the clinic's share to the clinic's locked balance at the 60-day mark (30 days for an installment plan once fully paid): the part paid above Hairline's commission, topped up by each later payment, or right away when less time remains"}
