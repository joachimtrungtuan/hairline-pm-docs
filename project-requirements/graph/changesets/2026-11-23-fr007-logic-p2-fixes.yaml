  - {"op": "update_node", "id": "REQ-007-100", "attrs": {"statement": "For a standalone aftercare payment (REQ-007-088) no refund ladder applies: an admin decides any refund beyond FR-011's automatic cases with a reason on Screen 6, opened from the aftercare payment record, as a manual refund (REQ-007-015). The provider's money is released after the same patient confirmation window as a booking, counted from the date of the payment instead of procedure completion."}}
