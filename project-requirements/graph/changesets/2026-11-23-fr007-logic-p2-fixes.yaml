  - {"op": "update_node", "id": "REQ-007-098", "title": "The patient has three payment options chosen on FR-006 and changeable only before the first successful payment; FR-007 shows the amount due now", "attrs": {"statement": "The patient chooses one of three payment options on FR-006 Screen 1: pay in full now, a deposit now with the balance later, or installments (2 to 9, FR-007B). FR-007 Screen 1 shows the chosen option read-only, with the amount due now. The option can change only before the first successful payment, by returning to FR-006. The first successful charge of the chosen option confirms the booking."}}
