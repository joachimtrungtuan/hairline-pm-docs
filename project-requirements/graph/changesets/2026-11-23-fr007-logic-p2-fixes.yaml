  - {"op": "add_node", "id": "REQ-007-102", "type": "Rule", "title": "A standalone aftercare payment is recorded on an aftercare payment record with retry and a 48-hour expiry", "owner_fr": "FR-007", "attrs": {"statement": "A standalone aftercare payment (REQ-007-088) has no booking, so System MUST record it on an aftercare payment record with its own id, the patient, the provider, the amount, the currency and the payout snapshot; Screens 5B and 6 open from that record. A failed payment can be retried with another method and the request expires after 48 hours without a successful payment (FR-011 Alternative Flow B1). FR-011's automatic refund (REQ-011-037) stays for its own failure cases; any other refund is an admin refund (REQ-007-100)."}}
