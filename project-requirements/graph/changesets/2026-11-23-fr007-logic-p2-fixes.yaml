reason: "FR-007 logic review pass 2: the cancellation rule reworded to the FR-029 point only; short-notice bookings pay in full; one stored Final Payment Status with a patient overdue notice; admin-set exception and manual refund amounts, system-started closure refunds, an awaiting-approval view with super-admin escalation and a cap on the sum of refunds; partial deposit and late capture refunded automatically; share movement reached from full payment and installments; payment option chosen on FR-006 with an amount due now; aftercare payment record with retry and expiry; payment option enum order."
by: docs-manager
operations:
  - {"op": "update_node", "id": "ENT-booking.is_overdue", "attrs": {"description": "Read from the stored Final Payment Status: true while it is Overdue, cleared when the booking is Cancelled or Completed. Shown and filterable beside the payment status, which is a separate list that does not include Overdue."}}
  - {"op": "update_node", "id": "ENT-booking.final_payment_status", "attrs": {"description": "The one stored value (Not Due, Due, Paid, Overdue). A scheduled job moves it by calendar day in the clinic's timezone: Due on the due date, Overdue the day after the due date with a balance unpaid."}}
  - {"op": "update_node", "id": "REQ-007-036", "title": "The final payment is due the FR-029 balance-due days before the procedure; one stored status moves Not Due, Due, Overdue and the Overdue flag reads from it", "attrs": {"statement": "The final payment is due the number of days before the procedure date that FR-029 sets as the deposit plan balance due days (launch default 7; an admin edits it in FR-029). The booking's Final Payment Status is stored and moved by a scheduled job, by calendar day in the clinic's timezone: Not Due, then Due on the due date, then Overdue the day after the due date with a balance unpaid. On entering Overdue the job flags the booking once, notifies billing admins and sends the patient one overdue notice. The Overdue flag is read from that status; it is cleared and reminders stop when the booking is Cancelled or Completed. An overdue balance never causes Payment Window Expired and cancels the booking only through the FR-006 unpaid balance cancellation (REQ-007-021)."}}
  - {"op": "update_node", "id": "EVT-payment-overdue", "attrs": {"description": "A scheduled job raises this once when a balance is still unpaid the day after its due date: Final Payment Status becomes Overdue, the booking is flagged, billing admins are notified and the patient gets one overdue notice. It stops when the booking is Cancelled or Completed."}}
  - {"op": "add_node", "id": "EVT-patient-payment-overdue-notice", "type": "Event", "title": "Patient payment overdue notice", "owner_fr": "FR-007", "attrs": {"description": "One notice to the patient on the day after the final payment due date when the balance is still unpaid."}}
  - {"op": "add_edge", "from": "STG-main-05-payment", "verb": "emits", "to": "EVT-patient-payment-overdue-notice"}
  - {"op": "add_edge", "from": "REQ-007-036", "verb": "applies to", "to": "EVT-patient-payment-overdue-notice"}
  - {"op": "update_node", "id": "STP-007-014", "title": "System sends the payment reminders set in the admin timing setting; on the due date it sets Final Payment Status Due and the day after, with a balance unpaid, Overdue, flags the booking once, notifies billing admins and sends the patient one overdue notice; reminders stop when the booking is Cancelled or Completed"}
  - {"op": "add_node", "id": "REQ-007-101", "type": "Rule", "title": "A booking confirmed on short notice pays in full at confirmation", "owner_fr": "FR-007", "attrs": {"statement": "A booking confirmed with fewer days left before the procedure than the FR-029 balance due days MUST take the full amount at confirmation. The deposit-and-balance and installment options are not offered, so no balance can fall due in the past."}}
