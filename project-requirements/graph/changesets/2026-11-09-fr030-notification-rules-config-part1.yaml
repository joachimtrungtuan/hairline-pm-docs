  - {"op": "add_node", "id": "REQ-030-186", "type": "Rule", "owner_fr": "FR-030", "title": "Screen 3 field validations", "attrs": {"statement": "Template Editor fields: Template Name: Max 100 chars, unique per event + channel; Event Type: Predefined event list; Channel Type: Fixed at creation (cannot change); Language: Must be in supported locales list (FR-021); can create multiple language versions; Email Subject: Max 200 chars, supports variables; Email Body: Max 10,000 chars, supports HTML/variables; Push Title: Max 100 chars, supports variables; Push Body: Max 500 chars, supports variables; SMS Body: Max 160 chars (1 SMS segment), supports variables; Available Variables: Display only; click to insert; Variable Preview Values: Valid JSON; used only for preview; Template Status: Default: Draft.", "rationale": "prd.md lines 460, 461, 462, 463, 464, 465, 466, 467, 468, 469, 470, 471. Variable Preview Values is a transient preview input, not stored."}}
  - {"op": "add_edge", "from": "REQ-030-186", "verb": "applies at", "to": "STG-main-01-inquiry"}
