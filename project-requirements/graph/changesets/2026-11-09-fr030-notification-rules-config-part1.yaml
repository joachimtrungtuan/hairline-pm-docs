  - {"op": "add_node", "id": "REQ-030-126", "type": "Rule", "owner_fr": "FR-030", "title": "Post-MVP events are hidden from the admin UI until supported", "attrs": {"statement": "These event types may exist in backend roadmap but MUST NOT appear in admin UI until the backend supports them end-to-end and product enables them.", "rationale": "prd.md line 217. The five post-MVP rows (prd.md lines 221-225) are not Event nodes; they stay as this rule."}}
