  - {"op": "add_node", "id": "REQ-030-189", "type": "Rule", "owner_fr": "FR-030", "title": "Notification content excludes sensitive medical information unless encrypted", "attrs": {"statement": "Privacy Rule 2: Notification content must not include sensitive medical information unless encrypted (email encryption via TLS, SMS not used for sensitive data)", "rationale": "prd.md line 509 (Privacy Rule 2)."}}
  - {"op": "add_edge", "from": "REQ-030-189", "verb": "applies at", "to": "STG-main-01-inquiry"}
  - {"op": "add_node", "id": "REQ-030-190", "type": "Rule", "owner_fr": "FR-030", "title": "Provider notifications follow patient-identity masking until treatment is confirmed", "attrs": {"statement": "Privacy Rule 5: Provider-facing notifications MUST follow the existing patient-identity masking rules used across the platform: until treatment is confirmed via completed payment, patient identifiers remain masked/hidden (examples in FR-003 and FR-006). Provider templates MUST NOT be able to reference unmasked patient name/email/phone pre-confirmation; they may only use the same masked display fields used elsewhere (e.g., `patient.display_name` which renders masked pre-confirmation and unmasked post-confirmation). PII Redaction (Provider Pre-Confirmation): When the recipient is a provider and treatment is not yet confirmed via completed payment, S-03 MUST apply the same patient-identity masking rules used elsewhere in the platform (e.g., FR-003/FR-006) and MUST NOT include unmasked patient identifiers (full name, email, phone) in the provider recipient payload.", "rationale": "prd.md lines 512, 784 (Privacy Rule 5 and security considerations). Masking rules are defined in FR-003 and FR-006."}}
  - {"op": "add_edge", "from": "REQ-030-190", "verb": "applies at", "to": "STG-main-01-inquiry"}
  - {"op": "add_node", "id": "REQ-030-191", "type": "Rule", "owner_fr": "FR-030", "title": "Recipients can export all notifications sent to them (GDPR)", "attrs": {"statement": "GDPR: Recipients can request export of all notifications sent to them; system provides notification history in machine-readable format (JSON/CSV)", "rationale": "prd.md line 515."}}
  - {"op": "add_edge", "from": "REQ-030-191", "verb": "applies at", "to": "STG-main-01-inquiry"}
  - {"op": "add_node", "id": "REQ-030-192", "type": "Rule", "owner_fr": "FR-030", "title": "Editable by admin", "attrs": {"statement": "Editable by admin: Event-to-notification mappings (which events trigger which notifications); Notification templates (subject, body, formatting, variables) for all channels; Recipient targeting rules (who receives notifications based on role, relationship, event context); Channel preferences per event type (enable/disable email, push, SMS); Delivery timing configuration (immediate, scheduled, delayed); Retry logic parameters (max attempts, interval between retries); Escalation rules for time-sensitive notifications; Notification delivery hours (e.g., no non-urgent notifications between 10 PM - 7 AM recipient local time).", "rationale": "prd.md lines 521, 522, 523, 524, 525, 526, 527, 528. Notification delivery hours (line 528) has no screen field or scope: open question."}}
  - {"op": "add_edge", "from": "REQ-030-192", "verb": "applies at", "to": "STG-main-01-inquiry"}
  - {"op": "add_node", "id": "REQ-030-193", "type": "Rule", "owner_fr": "FR-030", "title": "Fixed in codebase", "attrs": {"statement": "Fixed in codebase, not editable: Core event definitions (system events that can trigger notifications - e.g., \"Quote Submitted / Ready\", \"Payment Received / Receipt\"); Variable schema per event type (which variables available in notification templates per event); Maximum retry attempts (hard limit: 5 retries to prevent infinite loops); Rate limiting thresholds (max 10 notifications per hour per recipient); Encryption algorithms for notification content (AES-256 at rest, TLS 1.3 in transit); Delivery channel integrations (SMTP provider, push notification service, SMS gateway API).", "rationale": "prd.md lines 532, 533, 534, 535, 536, 537. The hard limit of 5 retries and the 10-per-hour rate limit are the fixed values."}}
  - {"op": "add_edge", "from": "REQ-030-193", "verb": "applies at", "to": "STG-main-01-inquiry"}
  - {"op": "add_node", "id": "REQ-030-194", "type": "Rule", "owner_fr": "FR-030", "title": "SMS availability is per event with cost; high-volume events need budget approval", "attrs": {"statement": "SMS channel availability: Admin can enable SMS for specific event types, but each SMS incurs cost; requires budget approval for high-volume events", "rationale": "prd.md line 569."}}
  - {"op": "add_edge", "from": "REQ-030-194", "verb": "applies at", "to": "STG-main-01-inquiry"}
  - {"op": "add_node", "id": "REQ-030-195", "type": "Rule", "owner_fr": "FR-030", "title": "Test notifications go only to admins or designated test accounts", "attrs": {"statement": "Notification testing: Admins can send test notifications to themselves or designated test accounts; cannot send to production recipients without rule activation", "rationale": "prd.md line 570."}}
  - {"op": "add_edge", "from": "REQ-030-195", "verb": "applies at", "to": "STG-main-01-inquiry"}
  - {"op": "add_node", "id": "REQ-030-196", "type": "Rule", "owner_fr": "FR-030", "title": "Admins cannot impersonate recipients for notification testing", "attrs": {"statement": "Authentication: Admin access to notification configuration requires authentication via FR-031 admin authentication system; admins cannot impersonate recipients for notification testing", "rationale": "prd.md line 782 (security considerations)."}}
  - {"op": "add_edge", "from": "REQ-030-196", "verb": "applies at", "to": "STG-main-01-inquiry"}
  - {"op": "add_node", "id": "REQ-030-197", "type": "Rule", "owner_fr": "FR-030", "title": "Rule configuration requires granular admin permissions from FR-031", "attrs": {"statement": "Authorization: Granular permission checks enforced via FR-031 permission matrix; some admins can configure rules, others only view analytics", "rationale": "prd.md lines 783, 634, 635, 636. FR-031 owns the permission matrix."}}
