  - {"op": "add_node", "id": "REQ-030-121", "type": "Rule", "owner_fr": "FR-030", "title": "Only catalog events appear in the UI and can be configured", "attrs": {"statement": "The list of notification events that appear in `Settings → Alerts & Notifications` is a preset backend event catalog. Admins can only configure events that appear in this catalog UI (enable/disable, channels, timing, templates, retries, escalation). If an event does not appear in the catalog UI, it cannot be configured (it is either not implemented, not enabled for the current environment, or intentionally not exposed).", "rationale": "prd.md line 109. Restating: prd.md lines 107, 108, 119 (events absent from the table do not appear in Settings and cannot be configured). Configurable: enable/disable, channels, timing, templates, retries, escalation."}}
