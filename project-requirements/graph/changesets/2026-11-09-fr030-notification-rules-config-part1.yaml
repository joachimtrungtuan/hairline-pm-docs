  - {"op": "add_node", "id": "REQ-030-050", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Treatment Details Changed After Acceptance", "attrs": {"statement": "Treatment Details Changed After Acceptance (treatment.plan_changed) is an admin-configurable notification event. Primary recipients: Patient. Fired by FR-010 when the clinic or an admin makes an audited change to the treatment plan, assigned clinicians or graft count from booking confirmation (`Confirmed`) onward. States what changed; price, currency and other money terms never change through this path. Mandatory — admin cannot disable this event", "rationale": "prd.md line 146. Category: Treatment. Event nodes: EVT-treatment-plan-changed (existing node). Lock rule (prd.md line 550): Treatment Details Changed After Acceptance (`treatment.plan_changed`) is mandatory: every audited change to plan, clinicians or grafts from booking confirmation (`Confirmed`) onward MUST be notified to the patient. Toggle is locked."}}
