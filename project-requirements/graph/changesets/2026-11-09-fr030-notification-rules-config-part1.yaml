  - {"op": "add_node", "id": "REQ-030-037", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Quote Withdrawn", "attrs": {"statement": "Quote Withdrawn (quote.withdrawn) is an admin-configurable notification event. Primary recipients: Patient, Admin (only when the quote was already accepted). Fired by FR-004 when a provider withdraws a sent parent quote, before or after acceptance. The patient is always told. Admins receive it as an exception alert only when the withdrawn quote was already accepted; a withdrawal before acceptance is a normal provider action and does not alert admins. After acceptance, FR-006 hands the case to the provider-fault transfer and the patient also receives `booking.provider_fault_replacement`. Mandatory before and after acceptance — admin cannot disable this event (see Non-Disableable by Default section)", "rationale": "prd.md line 133. Category: Quote. Event nodes: EVT-quote-withdrawn (existing node). Lock rule (prd.md line 546): Quote Withdrawn (`quote.withdrawn`) is mandatory before and after acceptance: the patient MUST always learn that the provider has withdrawn the quote, and the admin MUST be alerted only when the withdrawn quote was already accepted. Toggle is locked."}}
  - {"op": "add_edge", "from": "REQ-030-037", "verb": "applies at", "to": "STG-main-02-quote"}
  - {"op": "add_node", "id": "REQ-030-038", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Quote Accepted / Subquote Outcomes", "attrs": {"statement": "Quote Accepted / Subquote Outcomes (quote.accepted) is an admin-configurable notification event. Primary recipients: Provider. FR-005 uses the existing event with `outcome` = `selected_subquote_accepted`, `sibling_subquote_not_selected`, or `competing_parent_cancelled_other_subquote_accepted`. Selected-provider templates may use accepted-subquote details. Non-selected-provider templates are restricted to that provider's own parent quote/subquote references, outcome, and reason; selected provider identity and accepted price are unavailable. Each provider receives one notice per sent parent quote: the provider of the accepted parent quote receives `selected_subquote_accepted`, with that parent's sibling subquotes listed in the same notice as `sibling_subquote_not_selected`; each other sent parent quote produces one not-selected notice (`competing_parent_cancelled_other_subquote_accepted`) to its provider, including another parent quote of the selected provider. Unsent drafts cancelled by FR-004 produce no notice. The selected-provider and not-selected-provider outcomes are mandatory — admin cannot disable them (see Non-Disableable by Default section). The patient is not a recipient: at acceptance the patient receives only `booking.scheduled`. No admin notification is sent for an acceptance; admins follow acceptances on their dashboards", "rationale": "prd.md line 134. Category: Quote. Event nodes: EVT-quote-accepted (existing node). Lock rule (prd.md line 543): Preference exemption for mandatory provider events: every event that is mandatory for providers (`quote.cancelled_inquiry`, the selected-provider and not-selected-provider outcomes of `quote.accepted`, `booking.payment_window_expired`, `booking.revived` and `booking.rescheduled`) is delivered regardless of FR-032 provider notification preferences. A provider's category toggles in FR-032 never suppress these events. Lock rule (prd.md line 547): Quote Accepted (`quote.accepted`): the selected-provider outcome and the not-selected-provider outcome are mandatory, because the selected provider must learn that its slot is held and every other provider with a sent parent quote must learn that the quote is no longer active. These outcome toggles are locked. `quote.accepted` has no patient or admin recipient."}}
  - {"op": "add_edge", "from": "REQ-030-038", "verb": "applies at", "to": "STG-main-03-acceptance"}
  - {"op": "add_edge", "from": "REQ-030-038", "verb": "decided by", "to": "SRC-MTG-002-D03"}
  - {"op": "add_node", "id": "REQ-030-039", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Quote Cancelled (Inquiry Cancelled)", "attrs": {"statement": "Quote Cancelled (Inquiry Cancelled) (quote.cancelled_inquiry) is an admin-configurable notification event. Primary recipients: Provider. Auto-cancelled quote due to patient inquiry cancellation (FR-003 Workflow 5). Provider receipt is mandatory — admin cannot disable this event (see Non-Disableable by Default section). Cancellation reason is patient-private; provider notification says only \"Inquiry cancelled by patient\". MVP default channels: Email + Push. Not subject to FR-032 provider notification preferences; FR-032 offers no toggle for this event. Available template variables: `quote.id`, `quote.provider_id`, `inquiry.id`, `inquiry.cancelled_at`; `inquiry.cancellation_reason` is excluded per privacy rule.", "rationale": "prd.md line 135. Category: Quote. Event nodes: EVT-quote-cancelled-inquiry (existing node). Lock rule (prd.md line 542): Quote Cancelled — Inquiry Cancelled (`quote.cancelled_inquiry`) is a mandatory provider notification. Provider MUST be notified when their quote is auto-cancelled due to inquiry cancellation. Admin cannot disable this event because the provider needs to know the slot is released and the quote is no longer active. Toggle is locked for this event, and FR-032 provider notification preferences cannot suppress it. Lock rule (prd.md line 543): Preference exemption for mandatory provider events: every event that is mandatory for providers (`quote.cancelled_inquiry`, the selected-provider and not-selected-provider outcomes of `quote.accepted`, `booking.payment_window_expired`, `booking.revived` and `booking.rescheduled`) is delivered regardless of FR-032 provider notification preferences. A provider's category toggles in FR-032 never suppress these events."}}
  - {"op": "add_edge", "from": "REQ-030-039", "verb": "applies at", "to": "STG-main-02-quote"}
  - {"op": "add_node", "id": "REQ-030-040", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Booking Accepted — Slot Held (Pending Payment)", "attrs": {"statement": "Booking Accepted — Slot Held (Pending Payment) (booking.scheduled) is an admin-configurable notification event. Primary recipients: Patient. Fired by FR-006 when subquote acceptance creates the slot hold, or when an admin-authored replacement acceptance in the FR-006 provider-fault transfer creates the replacement booking, before the first payment is confirmed; states the payment deadline (hold expiry). The provider is not a recipient: the accepted or replacement provider learns of the booking through `quote.accepted` (`selected_subquote_accepted`). Mandatory — admin cannot disable this event", "rationale": "prd.md line 136. Category: Booking/Schedule. Event nodes: EVT-booking-scheduled (existing node). Lock rule (prd.md line 544): Booking Accepted — Slot Held (`booking.scheduled`) is mandatory for the patient, because it is the patient's only acceptance notice and states the payment deadline. It also fires for an admin-authored replacement acceptance. Toggle is locked."}}
  - {"op": "add_edge", "from": "REQ-030-040", "verb": "applies at", "to": "STG-main-03-acceptance"}
  - {"op": "add_edge", "from": "REQ-030-040", "verb": "governed by", "to": "SET-booking-notification-templates"}
  - {"op": "add_node", "id": "REQ-030-041", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Hold Expiring Soon (Payment Reminder)", "attrs": {"statement": "Hold Expiring Soon (Payment Reminder) (booking.hold_expiring_soon) is an admin-configurable notification event. Primary recipients: Patient, Admin. Fired by FR-006 once per slot hold when the time left before the hold expires reaches the hold-expiring-soon lead time set by admin in FR-026 and the first payment is still outstanding. Reminds the patient to pay before the slot is released; admins receive it as an exception alert (slot hold expiring while unpaid). Admin-configurable", "rationale": "prd.md line 137. Category: Booking/Schedule. Event nodes: EVT-booking-hold-expiring-soon (existing node)."}}
  - {"op": "add_edge", "from": "REQ-030-041", "verb": "applies at", "to": "STG-main-04-booking"}
  - {"op": "add_edge", "from": "REQ-030-041", "verb": "governed by", "to": "SET-hold-expiring-soon-lead-time"}
  - {"op": "add_node", "id": "REQ-030-042", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Payment Window Expired", "attrs": {"statement": "Payment Window Expired (booking.payment_window_expired) is an admin-configurable notification event. Primary recipients: Patient, Provider, Admin. Fired by FR-006 when the slot hold expires before the first payment (deposit or first instalment) succeeds; applies only to that first payment step. Patient is told the booking lapsed and given the recovery routes (cancel and start a new inquiry, or contact support); provider is told the slot is free; admins receive it as an exception alert. Mandatory — admin cannot disable this event", "rationale": "prd.md line 138. Category: Booking/Schedule. Event nodes: EVT-booking-payment-window-expired (existing node). Lock rule (prd.md line 543): Preference exemption for mandatory provider events: every event that is mandatory for providers (`quote.cancelled_inquiry`, the selected-provider and not-selected-provider outcomes of `quote.accepted`, `booking.payment_window_expired`, `booking.revived` and `booking.rescheduled`) is delivered regardless of FR-032 provider notification preferences. A provider's category toggles in FR-032 never suppress these events. Lock rule (prd.md line 548): Payment Window Expired (`booking.payment_window_expired`) and Booking Revived (`booking.revived`) are mandatory for patient and provider: both must know whether the slot is released or held again and what the payment deadline is. Toggles are locked."}}
  - {"op": "add_edge", "from": "REQ-030-042", "verb": "applies at", "to": "STG-main-04-booking"}
  - {"op": "add_node", "id": "REQ-030-043", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Booking Revived", "attrs": {"statement": "Booking Revived (booking.revived) is an admin-configurable notification event. Primary recipients: Patient, Provider. Fired by FR-006 when an admin revives a booking after Payment Window Expired. Patient receives the new payment deadline; provider is told the slot is held again. Mandatory — admin cannot disable this event", "rationale": "prd.md line 139. Category: Booking/Schedule. Event nodes: EVT-booking-revived (existing node). Lock rule (prd.md line 543): Preference exemption for mandatory provider events: every event that is mandatory for providers (`quote.cancelled_inquiry`, the selected-provider and not-selected-provider outcomes of `quote.accepted`, `booking.payment_window_expired`, `booking.revived` and `booking.rescheduled`) is delivered regardless of FR-032 provider notification preferences. A provider's category toggles in FR-032 never suppress these events. Lock rule (prd.md line 548): Payment Window Expired (`booking.payment_window_expired`) and Booking Revived (`booking.revived`) are mandatory for patient and provider: both must know whether the slot is released or held again and what the payment deadline is. Toggles are locked."}}
  - {"op": "add_edge", "from": "REQ-030-043", "verb": "applies at", "to": "STG-main-04-booking"}
  - {"op": "add_node", "id": "REQ-030-044", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Provider Unable to Proceed — Replacement Being Arranged", "attrs": {"statement": "Provider Unable to Proceed — Replacement Being Arranged (booking.provider_fault_replacement) is an admin-configurable notification event. Primary recipients: Patient, Admin. Fired by FR-006 when an accepted booking is closed for provider fault: the provider withdraws after acceptance, drops out before treatment starts, or is suspended or deactivated after acceptance and before treatment starts (FR-015). An `In Progress` booking is not closed for provider fault and never fires this event; it stays `In Progress` with `supportRequired` for an admin decision. Tells the patient that an admin will arrange a replacement provider within the same inquiry and that the patient pays no cancellation fee; MUST NOT expose confidential suspension or deactivation reasons. Admins receive it as an exception alert so they can arrange the replacement. Providers are not recipients: the replacement provider learns through the normal new-booking and acceptance notice, and the faulted provider is not notified by this event. Mandatory — admin cannot disable this event", "rationale": "prd.md line 140. Category: Booking/Schedule. Event nodes: EVT-booking-provider-fault-replacement (existing node). Lock rule (prd.md line 549): Provider Unable to Proceed — Replacement Being Arranged (`booking.provider_fault_replacement`) is mandatory: the patient MUST learn that an admin will arrange a replacement provider. Toggle is locked."}}
  - {"op": "add_edge", "from": "REQ-030-044", "verb": "applies at", "to": "STG-main-04-booking"}
  - {"op": "add_node", "id": "REQ-030-045", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Booking Confirmed", "attrs": {"statement": "Booking Confirmed (booking.confirmed) is an admin-configurable notification event. Primary recipients: Patient, Provider. Critical", "rationale": "prd.md line 141. Category: Booking/Schedule. Event nodes: EVT-booking-confirmed (new stub owned by FR-006)."}}
