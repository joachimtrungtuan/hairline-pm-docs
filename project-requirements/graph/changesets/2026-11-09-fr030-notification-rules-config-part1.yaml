  - {"op": "add_node", "id": "REQ-030-188", "type": "Rule", "owner_fr": "FR-030", "title": "Retries use exponential backoff: 1 hour, 3 hours, 6 hours, configurable per rule", "attrs": {"statement": "Rule 7: Notification delivery retries follow exponential backoff: 1st retry after 1 hour, 2nd retry after 3 hours, 3rd retry after 6 hours (configurable per rule)", "rationale": "prd.md line 504 (General Rule 7). Conflicts with the single Retry Interval field and the 1-hour examples: open question."}}
