  - {"op": "add_node", "id": "REQ-030-031", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Inquiry Cancelled", "attrs": {"statement": "Inquiry Cancelled (inquiry.cancelled) is an admin-configurable notification event. Primary recipients: Patient, Provider, Admin (optional). Patient-initiated inquiry cancellation (FR-003 Workflow 5). Fires when patient cancels inquiry in Inquiry, Quoted, or Accepted stages. Patient receives mandatory cancellation confirmation (aligns with FR-003 Workflow 5 step 4 and Screen 8b). Cancellation reason is patient-private — provider notification says only \"Inquiry cancelled by patient\". MVP default channels: Email + Push. Available template variables differ by recipient: Patient receives `inquiry.id`, `inquiry.cancellation_reason`, `inquiry.cancelled_at`; Provider receives `inquiry.id`, `inquiry.cancelled_at` only (reason excluded per privacy rule).", "rationale": "prd.md line 127. Category: Inquiry. Event nodes: EVT-inquiry-cancelled (existing node)."}}
  - {"op": "add_edge", "from": "REQ-030-031", "verb": "applies at", "to": "STG-main-01-inquiry"}
  - {"op": "add_node", "id": "REQ-030-032", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Inquiry Response SLA Breached", "attrs": {"statement": "Inquiry Response SLA Breached (inquiry.ttfq_sla_breached) is an admin-configurable notification event. Primary recipients: Provider. FR-014 REQ-014-113. Fires once per distributed inquiry/provider pair when the provider has not submitted a parent quote within the FR-026 Analytics Configuration TTFQ SLA target (default 120 minutes) from distribution. Recipients: provider users permitted to respond to inquiries (FR-009). Not sent if the inquiry is cancelled, the distribution is withdrawn, or the provider responds first; never repeated for the same pair. MVP default channel: in-app only; email/push off by default and admin-configurable", "rationale": "prd.md line 128. Category: Inquiry. Event nodes: EVT-inquiry-ttfq-sla-breached (created by another FR migration not yet applied; not linked from here)."}}
  - {"op": "add_edge", "from": "REQ-030-032", "verb": "applies at", "to": "STG-main-02-quote"}
  - {"op": "add_node", "id": "REQ-030-033", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Quote Submitted / Ready (Patient notified)", "attrs": {"statement": "Quote Submitted / Ready (Patient notified) (quote.submitted) is an admin-configurable notification event. Primary recipients: Patient. Fired by FR-004 when the provider sends the parent quote; the quote expiry is set and governed by FR-004. The notice shows the \"From\" price (the lowest subquote price in the parent quote, in the quote currency), the option count, the treatment and the expiry date. Exact subquote prices are not shown before acceptance (see Quote, Booking and Treatment-Change Event Rules)", "rationale": "prd.md line 129. Category: Quote. Event nodes: EVT-quote-submitted (existing node)."}}
