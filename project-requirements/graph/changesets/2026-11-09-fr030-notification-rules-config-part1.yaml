  - {"op": "add_node", "id": "REQ-030-046", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Booking Rescheduled", "attrs": {"statement": "Booking Rescheduled (booking.rescheduled) is an admin-configurable notification event. Primary recipients: Patient, Provider. Fired by FR-006 when an admin changes the appointment date or time of an `Accepted` or `Confirmed` booking (FR-006 Change Appointment). States the previous and the new appointment, read from the booking's current appointment. Mandatory — admin cannot disable this event; not subject to FR-032 provider notification preferences", "rationale": "prd.md line 142. Category: Booking/Schedule. Event nodes: EVT-booking-rescheduled (existing node). Lock rule (prd.md line 543): Preference exemption for mandatory provider events: every event that is mandatory for providers (`quote.cancelled_inquiry`, the selected-provider and not-selected-provider outcomes of `quote.accepted`, `booking.payment_window_expired`, `booking.revived` and `booking.rescheduled`) is delivered regardless of FR-032 provider notification preferences. A provider's category toggles in FR-032 never suppress these events. Lock rule (prd.md line 545): Booking Rescheduled (`booking.rescheduled`) is mandatory for patient and provider: both must learn the new appointment after an admin changes it. Toggle is locked."}}
