  - {"op": "add_node", "id": "REQ-030-105", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Analytics Export Ready", "attrs": {"statement": "Analytics Export Ready (analytics.export_ready) is an admin-configurable notification event. Primary recipients: Provider. FR-014 REQ-014-062/063. A one-off or scheduled provider analytics export (PDF or CSV) has finished generating. Sent to the provider's registered email and each selected recipient; email carries the PDF attachment where applicable plus a secure download link that expires after 48 hours; in-app notification links to Report History. Default channels: email + in-app", "rationale": "prd.md line 201. Category: System/Operations. Event nodes: EVT-analytics-export-ready (created by another FR migration not yet applied; not linked from here)."}}
