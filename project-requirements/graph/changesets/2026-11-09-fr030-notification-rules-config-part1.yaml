  - {"op": "add_edge", "from": "REQ-030-198", "verb": "applies at", "to": "STG-main-01-inquiry"}
  - {"op": "add_node", "id": "REQ-030-199", "type": "Rule", "owner_fr": "FR-030", "title": "SMS is sent only with explicit consent and honours STOP", "attrs": {"statement": "TCPA (US): SMS notifications only sent with explicit recipient consent; opt-out via \"STOP\" keyword supported", "rationale": "prd.md line 795 (post-MVP)."}}
  - {"op": "add_edge", "from": "REQ-030-199", "verb": "applies at", "to": "STG-main-01-inquiry"}
  - {"op": "add_node", "id": "REQ-030-200", "type": "Rule", "owner_fr": "FR-030", "title": "Critical notifications have higher priority and stricter SLAs", "attrs": {"statement": "Assumption 1: Critical notifications (payment confirmations, appointment reminders, medical escalations) must be delivered with higher priority and stricter SLAs than non-critical notifications (marketing, general updates)", "rationale": "prd.md line 733 (Business Process Assumption 1)."}}
  - {"op": "add_edge", "from": "REQ-030-200", "verb": "applies at", "to": "STG-main-01-inquiry"}
  - {"op": "add_node", "id": "REQ-030-201", "type": "Rule", "owner_fr": "FR-030", "title": "Outage handling: alert admin after 15 minutes, push notifications expire after 24 hours", "attrs": {"statement": "If the SMTP service is unavailable, queue emails for retry and alert admin if the outage exceeds 15 minutes; fallback to a secondary SMTP provider if configured. If the push service is unavailable, queue notifications for retry, alert admin if the outage exceeds 15 minutes, and expire notifications after 24 hours (the recipient sees notification history in-app instead).", "rationale": "prd.md lines 675, 680 (external dependency failure handling)."}}
  - {"op": "add_edge", "from": "REQ-030-201", "verb": "applies at", "to": "STG-main-01-inquiry"}
  - {"op": "add_node", "id": "REQ-030-202", "type": "Rule", "owner_fr": "FR-030", "title": "Fallback notification when template rendering or profile lookup fails", "attrs": {"statement": "If template rendering fails due to invalid template syntax, log the error, alert admin, and fall back to a plain text notification template. If the profile API is unavailable, fall back to a basic notification template without personalization and retry the profile fetch before the next delivery attempt.", "rationale": "prd.md lines 690, 761 (external dependency failure handling)."}}
  - {"op": "add_edge", "from": "REQ-030-202", "verb": "applies at", "to": "STG-main-01-inquiry"}
  - {"op": "add_node", "id": "REQ-030-203", "type": "Rule", "owner_fr": "FR-030", "title": "Late trigger: send immediately or skip when the delivery timing has already passed", "attrs": {"statement": "System evaluates notification rule when event created; if delivery timing already passed, system triggers notification immediately with note \"Delivery timing adjusted due to short notice\" in admin logs Alternatively, admin can configure rule to skip notification if timing not feasible (e.g., don't send \"3 days before\" reminder if event is tomorrow)", "rationale": "prd.md lines 860, 861, 862. Field skip_if_timing_passed records the skip option."}}
  - {"op": "add_edge", "from": "REQ-030-203", "verb": "applies at", "to": "STG-main-01-inquiry"}
  - {"op": "add_node", "id": "REQ-030-204", "type": "Rule", "owner_fr": "FR-030", "title": "Missing template variable renders a placeholder, logs a warning and alerts admin for critical notifications", "attrs": {"statement": "System renders template with placeholder text for missing variable (e.g., \"[Phone number not provided]\") or omits section containing missing variable if template designed with conditional logic System logs warning in admin notification logs: \"Variable `patient.phone` not available for notification [notification_id]; rendered with placeholder\" Admin receives alert if missing variable affects critical notification (e.g., appointment reminder missing appointment time)", "rationale": "prd.md lines 864, 865, 866, 867."}}
  - {"op": "add_edge", "from": "REQ-030-204", "verb": "applies at", "to": "STG-main-01-inquiry"}
  - {"op": "add_node", "id": "REQ-030-205", "type": "Rule", "owner_fr": "FR-030", "title": "Notifications go to the primary contact; optional retry with secondary and send-to-both", "attrs": {"statement": "System prioritizes primary contact info (primary email, primary phone); delivers to primary only If delivery to primary fails, system can optionally retry with secondary contact info (configurable per notification rule via \"Retry with secondary contact\" toggle) Admin can configure notification rule to send to both primary and secondary simultaneously for critical events (e.g., payment confirmation sent to both primary and secondary email)", "rationale": "prd.md lines 869, 870, 871, 872. Fields retry_with_secondary_contact and send_to_both_contacts record the per-rule options."}}
  - {"op": "add_edge", "from": "REQ-030-205", "verb": "applies at", "to": "STG-main-01-inquiry"}
  - {"op": "add_node", "id": "REQ-030-206", "type": "Rule", "owner_fr": "FR-030", "title": "Scheduled notifications are calculated at delivery time using the recipient's current timezone", "attrs": {"statement": "System automatically adjusts delivery timing based on recipient's current timezone setting at time of delivery If recipient travels to different timezone and updates profile, future notifications use new timezone Scheduled notifications (e.g., \"9:00 AM recipient local time\") calculated dynamically at delivery time, not statically when notification scheduled", "rationale": "prd.md lines 874, 875, 876, 877."}}
  - {"op": "add_edge", "from": "REQ-030-206", "verb": "applies at", "to": "STG-main-01-inquiry"}
  - {"op": "add_node", "id": "REQ-030-207", "type": "Rule", "owner_fr": "FR-030", "title": "Deactivating a rule keeps queued notifications unless the admin purges the queue", "attrs": {"statement": "System immediately stops adding new notifications to queue for deactivated rule Notifications already queued (not yet delivered) remain in queue and delivered as scheduled If admin wants to cancel queued notifications, admin must explicitly \"Purge Queue\" (with confirmation prompt: \"This will cancel X pending notifications. Continue?\")", "rationale": "prd.md lines 879, 880, 881, 882."}}
  - {"op": "add_edge", "from": "REQ-030-207", "verb": "applies at", "to": "STG-main-01-inquiry"}
  - {"op": "add_node", "id": "REQ-030-208", "type": "Rule", "owner_fr": "FR-030", "title": "Critical notifications override recipient opt-out and show an in-app banner", "attrs": {"statement": "System respects recipient opt-out for non-critical notifications (marketing, general updates) and does not deliver For critical notifications (payment confirmations, appointment reminders), system overrides opt-out and delivers via at least one channel (displays banner in-app explaining why critical notification delivered despite opt-out) Admin can designate notification types as \"Critical - Cannot Opt Out\" in rule configuration", "rationale": "prd.md lines 884, 885, 886, 887. Field critical_cannot_opt_out records the per-rule designation."}}
  - {"op": "add_edge", "from": "REQ-030-208", "verb": "applies at", "to": "STG-main-01-inquiry"}
  - {"op": "add_node", "id": "REQ-030-209", "type": "Rule", "owner_fr": "FR-030", "title": "Prolonged outage: retry for 24 hours then mark Failed - Service Outage and alert admin", "attrs": {"statement": "System queues notifications for retry with exponential backoff (up to 24-hour window) If service restored within 24 hours, queued notifications delivered (may result in burst of deliveries) If outage exceeds 24 hours, system marks notifications as \"Failed - Service Outage\" and alerts admin Admin can manually re-trigger notifications after service restored or switch to backup notification provider if configured", "rationale": "prd.md lines 889, 890, 891, 892, 893."}}
  - {"op": "add_edge", "from": "REQ-030-209", "verb": "applies at", "to": "STG-main-01-inquiry"}
