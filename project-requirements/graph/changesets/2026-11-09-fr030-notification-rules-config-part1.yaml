  - {"op": "add_node", "id": "REQ-030-094", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Provider-Caused Cancellation / Offer Unavailable", "attrs": {"statement": "Provider-Caused Cancellation / Offer Unavailable (provider.status_cancellation_patient) is an admin-configurable notification event. Primary recipients: Patient. FR-015 Alternative Flow A5 / Screen 4 (FR-020 REQ-020-013). One per affected inquiry/case when provider suspension (`ProviderSuspended`) or deactivation (`ProviderDeactivated`) cancels the patient's case or the provider's offer before acceptance. For a case already accepted, the patient instead receives `booking.provider_fault_replacement`. Before acceptance, three variants apply (FR-003 Workflow 2 Alternative Flow B4, REQ-003-021): when other offers remain open, the notice says \"[Clinic] is no longer available. Your other offers are still open.\"; when no other live offer remains and the inquiry is redistributed automatically, the notice says \"[Clinic] is no longer available. We are finding new offers for you.\"; when the patient had explicitly selected the affected provider, the notice asks the patient to confirm the redistribution first. Includes inquiry/case reference and a Contact Admin/Support action. MUST NOT say the patient cancelled, instruct payment against the cancelled selection, or expose confidential suspension/deactivation reasons. Mandatory — admin cannot disable this event (see Non-Disableable by Default section); sent regardless of FR-015's \"Notify Provider\" checkbox. MVP default channels: Email + Push + in-app (global patient toggles still apply to Email/Push; in-app record always created). Retries de-duplicated per provider-status event + affected record + recipient", "rationale": "prd.md line 190. Category: Provider/Compliance. Event nodes: EVT-provider-status-cancellation-patient (existing node). Lock rule (prd.md line 551): Provider-Caused Cancellation (`provider.status_cancellation_patient`) and Admin Support Required (`provider.status_cancellation_admin_support`) are mandatory notifications for each inquiry/case affected by an FR-015 provider suspension or deactivation. Affected patients and admins MUST be informed regardless of FR-015's \"Notify Provider\" checkbox; toggles are locked for both events. Failed deliveries retry per FR-020 without duplicates (de-duplicated per provider-status event + affected record + recipient) and never restore cancelled records. Before acceptance, the patient notice uses the FR-003 variants (Workflow 2 Alternative Flow B4, REQ-003-021): \"[Clinic] is no longer available. Your other offers are still open.\" when other offers remain open; \"[Clinic] is no longer available. We are finding new offers for you.\" when the inquiry is redistributed automatically, or a request to confirm redistribution first when the patient had explicitly selected the affected provider. The admin-support alert goes to admins with the FR-031 Respond to Support permission."}}
  - {"op": "add_edge", "from": "REQ-030-094", "verb": "applies at", "to": "STG-provider-04-suspended"}
  - {"op": "add_node", "id": "REQ-030-095", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Provider-Caused Cancellation — Admin Support Required", "attrs": {"statement": "Provider-Caused Cancellation — Admin Support Required (provider.status_cancellation_admin_support) is an admin-configurable notification event. Primary recipients: Admin. Same trigger (FR-020 REQ-020-013), and also when a provider-status event leaves an `In Progress` booking open and flagged `supportRequired` for an admin decision (move the booking to `Aftercare` with aftercare reassignment, or cancel it with a reason), or leaves an `Aftercare` booking or FR-011 standalone aftercare case flagged for admin aftercare reassignment (FR-006 Alternative Flow B6). Mandatory admin-support alert per affected inquiry/case with patient, inquiry/case reference, prior stage, cause, and FR-016 deep link (Admin Support Required filter). Sent to admins with the FR-031 Respond to Support permission (default roles Super Admin, Aftercare Specialist, and Support Staff); opening the FR-016 list also requires View Patients. Mandatory — admin cannot disable this event; sent regardless of \"Notify Provider\"; pinned as critical in the admin dropdown. No FR-034 ticket is auto-created. Retries de-duplicated per provider-status event + affected record + recipient", "rationale": "prd.md line 191. Category: Provider/Compliance. Event nodes: EVT-provider-status-cancellation-admin-support (existing node). Lock rule (prd.md line 551): Provider-Caused Cancellation (`provider.status_cancellation_patient`) and Admin Support Required (`provider.status_cancellation_admin_support`) are mandatory notifications for each inquiry/case affected by an FR-015 provider suspension or deactivation. Affected patients and admins MUST be informed regardless of FR-015's \"Notify Provider\" checkbox; toggles are locked for both events. Failed deliveries retry per FR-020 without duplicates (de-duplicated per provider-status event + affected record + recipient) and never restore cancelled records. Before acceptance, the patient notice uses the FR-003 variants (Workflow 2 Alternative Flow B4, REQ-003-021): \"[Clinic] is no longer available. Your other offers are still open.\" when other offers remain open; \"[Clinic] is no longer available. We are finding new offers for you.\" when the inquiry is redistributed automatically, or a request to confirm redistribution first when the patient had explicitly selected the affected provider. The admin-support alert goes to admins with the FR-031 Respond to Support permission."}}
  - {"op": "add_edge", "from": "REQ-030-095", "verb": "applies at", "to": "STG-provider-04-suspended"}
  - {"op": "add_node", "id": "REQ-030-096", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Provider Suspended / Deactivated", "attrs": {"statement": "Provider Suspended / Deactivated (provider.suspended, provider.deactivated) is an admin-configurable notification event. Primary recipients: Provider (Owner only). FR-015 Screen 4 (FR-020 REQ-020-014). Sent only when \"Notify Provider\" is checked (default); always sent for a deactivation that processes an FR-032 account-closure request (FR-015 A7 locks Notify Provider on; FR-020 REQ-020-016). For a scheduled change it is sent when the scheduled change is created (with the effective date) and again when it takes effect; with \"Notify Provider\" unchecked it is sent at neither point. Team members are not emailed. Email with action taken, admin-provided reason, effective date (if scheduled), and admin support contact. Unaffected by provider FR-032 category preferences (account notice)", "rationale": "prd.md line 192. Category: Provider/Compliance. Event nodes: EVT-provider-suspended (existing node); EVT-provider-deactivated (existing node)."}}
  - {"op": "add_edge", "from": "REQ-030-096", "verb": "applies at", "to": "STG-provider-04-suspended"}
  - {"op": "add_edge", "from": "REQ-030-096", "verb": "applies at", "to": "STG-provider-05-offboarded"}
  - {"op": "add_node", "id": "REQ-030-097", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Provider Account Activation (Welcome / Set Password)", "attrs": {"statement": "Provider Account Activation (Welcome / Set Password) (provider.activation) is an admin-configurable notification event. Primary recipients: Provider. FR-015 Main Flow step 13 and Alternative Flow A1 (FR-020 REQ-020-015). Welcome email with login email, first-login instructions, and the one-time set-password link (expires in 24 hours); re-sent on A1 resend. Mandatory; toggle locked. Email only", "rationale": "prd.md line 193. Category: Provider/Compliance. Event nodes: EVT-provider-activation (existing node). Lock rule (prd.md line 553): Provider Account Activation (`provider.activation`) is mandatory and non-disableable: without it a new provider cannot set a password and log in. Provider Reactivated (`provider.reactivated`) and Scheduled Status Change Cancelled (`provider.scheduled_change_cancelled`) follow FR-015's \"Notify Provider\" choice; when triggered they cannot be disabled here. Toggles are locked for all three events. `provider.suspended`, `provider.deactivated`, `provider.reactivated`, and `provider.scheduled_change_cancelled` go to the provider Owner only; for a scheduled suspension or deactivation with \"Notify Provider\" checked, `provider.suspended` / `provider.deactivated` is sent when the change is created and again when it takes effect, and with it unchecked no email is sent at either point. Owner Login Email Changed (`provider.login_email_changed`) is a mandatory security notice to the old and the new login address; its toggle is locked."}}
  - {"op": "add_edge", "from": "REQ-030-097", "verb": "applies at", "to": "STG-provider-01-invited"}
  - {"op": "add_node", "id": "REQ-030-098", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Owner Login Email Changed", "attrs": {"statement": "Owner Login Email Changed (provider.login_email_changed) is an admin-configurable notification event. Primary recipients: Provider (old and new login address). FR-015 Screen 3 Tab 1 Owner login email change by an admin (FR-020 REQ-020-015). One email to the old address (the login email for [clinic] was changed to [new address, partly masked] by a Hairline admin on [date/time]; contact support if unexpected) and one to the new address (this address is now the login email for [clinic]). `provider.activation` is also sent to the new address when `password_set` is false. Mandatory security notice; toggle locked. Unaffected by FR-032 category preferences. Email only", "rationale": "prd.md line 194. Category: Provider/Compliance. Event nodes: EVT-provider-login-email-changed (existing node)."}}
  - {"op": "add_edge", "from": "REQ-030-098", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-030-099", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Provider Reactivated", "attrs": {"statement": "Provider Reactivated (provider.reactivated) is an admin-configurable notification event. Primary recipients: Provider (Owner only). FR-015 Alternative Flow A6 / Screen 5 (FR-020 REQ-020-015). Sent only when \"Notify Provider\" is checked (default). Email with reactivation notice, admin-provided reason, admin support contact, and a note that cancelled cases are not restored (and that any notified scheduled change no longer applies). Mandatory when triggered; toggle locked. Unaffected by FR-032 category preferences", "rationale": "prd.md line 195. Category: Provider/Compliance. Event nodes: EVT-provider-reactivated (existing node). Lock rule (prd.md line 553): Provider Account Activation (`provider.activation`) is mandatory and non-disableable: without it a new provider cannot set a password and log in. Provider Reactivated (`provider.reactivated`) and Scheduled Status Change Cancelled (`provider.scheduled_change_cancelled`) follow FR-015's \"Notify Provider\" choice; when triggered they cannot be disabled here. Toggles are locked for all three events. `provider.suspended`, `provider.deactivated`, `provider.reactivated`, and `provider.scheduled_change_cancelled` go to the provider Owner only; for a scheduled suspension or deactivation with \"Notify Provider\" checked, `provider.suspended` / `provider.deactivated` is sent when the change is created and again when it takes effect, and with it unchecked no email is sent at either point. Owner Login Email Changed (`provider.login_email_changed`) is a mandatory security notice to the old and the new login address; its toggle is locked."}}
  - {"op": "add_edge", "from": "REQ-030-099", "verb": "applies at", "to": "STG-provider-04-suspended"}
  - {"op": "add_node", "id": "REQ-030-100", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Scheduled Status Change Cancelled", "attrs": {"statement": "Scheduled Status Change Cancelled (provider.scheduled_change_cancelled) is an admin-configurable notification event. Primary recipients: Provider (Owner only). FR-015 Screen 4 Cancel Scheduled Change (FR-020 REQ-020-015). Sent when an admin cancels a pending scheduled suspension/deactivation that had \"Notify Provider\" checked; states the cancelled change and its former effective date. Mandatory when triggered; toggle locked. Unaffected by FR-032 category preferences", "rationale": "prd.md line 196. Category: Provider/Compliance. Event nodes: EVT-provider-scheduled-change-cancelled (existing node). Lock rule (prd.md line 553): Provider Account Activation (`provider.activation`) is mandatory and non-disableable: without it a new provider cannot set a password and log in. Provider Reactivated (`provider.reactivated`) and Scheduled Status Change Cancelled (`provider.scheduled_change_cancelled`) follow FR-015's \"Notify Provider\" choice; when triggered they cannot be disabled here. Toggles are locked for all three events. `provider.suspended`, `provider.deactivated`, `provider.reactivated`, and `provider.scheduled_change_cancelled` go to the provider Owner only; for a scheduled suspension or deactivation with \"Notify Provider\" checked, `provider.suspended` / `provider.deactivated` is sent when the change is created and again when it takes effect, and with it unchecked no email is sent at either point. Owner Login Email Changed (`provider.login_email_changed`) is a mandatory security notice to the old and the new login address; its toggle is locked."}}
  - {"op": "add_edge", "from": "REQ-030-100", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-030-101", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Provider Account-Closure Requested", "attrs": {"statement": "Provider Account-Closure Requested (provider.closure_requested) is an admin-configurable notification event. Primary recipients: Admin. FR-032 Request Account Closure / FR-015 A7 (FR-020 REQ-020-016). Sent to admins with View Providers permission when a provider submits a closure request; includes provider, clinic, request date, optional reason, and a deep link to the request in the FR-015 provider profile. Mandatory; toggle locked. Email + in-app", "rationale": "prd.md line 197. Category: Provider/Compliance. Event nodes: EVT-provider-closure-requested (existing node). Lock rule (prd.md line 554): Provider Account-Closure Requested (`provider.closure_requested`) and Provider Account-Closure Request Rejected (`provider.closure_rejected`) are mandatory: admins must learn of every closure request, and a provider whose request is rejected must be told the account stays Active. Toggles are locked for both."}}
  - {"op": "add_edge", "from": "REQ-030-101", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-030-102", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Provider Account-Closure Request Rejected", "attrs": {"statement": "Provider Account-Closure Request Rejected (provider.closure_rejected) is an admin-configurable notification event. Primary recipients: Provider. FR-015 A7 step 6 (FR-020 REQ-020-016). Sent when an admin rejects a closure request; states that the account stays Active and gives the admin review notes and support contact. Mandatory; toggle locked. Unaffected by FR-032 category preferences. Email only", "rationale": "prd.md line 198. Category: Provider/Compliance. Event nodes: EVT-provider-closure-rejected (existing node). Lock rule (prd.md line 554): Provider Account-Closure Requested (`provider.closure_requested`) and Provider Account-Closure Request Rejected (`provider.closure_rejected`) are mandatory: admins must learn of every closure request, and a provider whose request is rejected must be told the account stays Active. Toggles are locked for both."}}
