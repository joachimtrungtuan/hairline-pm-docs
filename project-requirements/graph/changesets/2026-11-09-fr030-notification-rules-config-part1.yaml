  - {"op": "add_node", "id": "REQ-030-127", "type": "Rule", "owner_fr": "FR-030", "title": "Hidden post-MVP events: SMS delivery, aftercare reminders, travel, quote declined", "attrs": {"statement": "Hidden until enabled: SMS Delivery Enabled `channel.sms_enabled` SMS is future; not available in MVP; Medication / Washing / Activity Reminders `aftercare.medication_reminder` / `aftercare.washing_reminder` / `aftercare.activity_reminder` Scheduled reminders referenced in system PRD; enable when milestone engine supports schedules; Passport / Travel Document Required `travel.passport_required` Only show once travel module + event publishing exists; Flight / Hotel Itinerary Updates `travel.itinerary_updated` Post‑release travel roadmap; Quote Declined `quote.declined` Reserved for an explicit governed decline flow; no MVP producer exists because patients have no explicit decline action (FR-005). FR-005 sibling Not Selected and competing-parent cancellation outcomes do not use this event.", "rationale": "prd.md lines 221, 222, 223, 224, 225. None has a producer stage; no Event node created. Keys: channel.sms_enabled, aftercare.medication_reminder, aftercare.washing_reminder, aftercare.activity_reminder, travel.passport_required, travel.itinerary_updated, quote.declined."}}
  - {"op": "add_edge", "from": "REQ-030-127", "verb": "applies at", "to": "STG-main-01-inquiry"}
  - {"op": "add_node", "id": "REQ-030-128", "type": "Rule", "owner_fr": "FR-030", "title": "Quote, booking and treatment events have named producer FRs", "attrs": {"statement": "Producers: FR-004 produces `quote.submitted`, `quote.updated`, `quote.expiring_soon`, `quote.expired` and `quote.withdrawn`. FR-005 produces `quote.accepted` and its outcomes. FR-006 produces `booking.scheduled`, `booking.hold_expiring_soon`, `booking.payment_window_expired`, `booking.revived`, `booking.rescheduled` and `booking.provider_fault_replacement`. FR-010 produces `treatment.plan_changed`.", "rationale": "prd.md line 205"}}
  - {"op": "add_edge", "from": "REQ-030-128", "verb": "applies at", "to": "STG-main-01-inquiry"}
  - {"op": "add_node", "id": "REQ-030-129", "type": "Rule", "owner_fr": "FR-030", "title": "quote.accepted sends one provider notice per sent parent quote", "attrs": {"statement": "Recipient grain for `quote.accepted`: one provider notice per sent parent quote, never one per subquote. The de-duplication key is acceptance record + parent quote + recipient. Drafts produce no notice.", "rationale": "prd.md line 206"}}
  - {"op": "add_edge", "from": "REQ-030-129", "verb": "applies at", "to": "STG-main-01-inquiry"}
  - {"op": "add_edge", "from": "REQ-030-129", "verb": "decided by", "to": "SRC-MTG-002-D03"}
  - {"op": "add_node", "id": "REQ-030-130", "type": "Rule", "owner_fr": "FR-030", "title": "Pre-acceptance notices use parent-level price variables only", "attrs": {"statement": "Pre-acceptance price variables: `quote.submitted`, `quote.updated`, `quote.expiring_soon`, `quote.expired` and `quote.withdrawn` may use only parent-level variables: the \"From\" price (lowest subquote price in the parent quote) with its currency, option count, treatment, expiry date, provider name and the parent quote reference. A single quote total does not exist and MUST NOT be offered as a variable.", "rationale": "prd.md line 207"}}
  - {"op": "add_edge", "from": "REQ-030-130", "verb": "applies at", "to": "STG-main-01-inquiry"}
  - {"op": "add_edge", "from": "REQ-030-130", "verb": "decided by", "to": "SRC-MTG-002-D03"}
  - {"op": "add_node", "id": "REQ-030-131", "type": "Rule", "owner_fr": "FR-030", "title": "Post-acceptance money variables come from the accepted snapshot", "attrs": {"statement": "Post-acceptance money variables: on `quote.accepted` (selected-provider outcome) and on every `booking.*` event, price, currency, date range and promotion variables resolve from the accepted snapshot recorded at acceptance, never from the live parent quote, Quote Option or package. Appointment variables on `booking.*` events resolve from the booking's current appointment, which an admin may change through FR-006; the snapshot keeps the accepted appointment as the baseline. `booking.rescheduled` carries both the previous and the new appointment. Allowed references are the parent quote, accepted subquote, quote version and acceptance record identifiers.", "rationale": "prd.md line 208"}}
  - {"op": "add_edge", "from": "REQ-030-131", "verb": "applies at", "to": "STG-main-01-inquiry"}
  - {"op": "add_node", "id": "REQ-030-132", "type": "Rule", "owner_fr": "FR-030", "title": "Treatment events may use the current plan but never changed money values", "attrs": {"statement": "Treatment-detail variables: `treatment.plan_changed` and other treatment events may use the current treatment plan, clinicians and graft count maintained through FR-010; they MUST NOT carry changed money values.", "rationale": "prd.md line 209"}}
  - {"op": "add_edge", "from": "REQ-030-132", "verb": "applies at", "to": "STG-main-01-inquiry"}
  - {"op": "add_node", "id": "REQ-030-133", "type": "Rule", "owner_fr": "FR-030", "title": "Not-selected provider notices use a restricted variable allowlist", "attrs": {"statement": "Not-selected allowlist: not-selected notices may use only that provider's own parent quote and subquote references, the outcome and the reason; selected provider identity and accepted price are unavailable.", "rationale": "prd.md line 210"}}
  - {"op": "add_edge", "from": "REQ-030-133", "verb": "applies at", "to": "STG-main-01-inquiry"}
  - {"op": "add_node", "id": "REQ-030-134", "type": "Rule", "owner_fr": "FR-030", "title": "Locked and configurable quote, booking and treatment events", "attrs": {"statement": "Locks: `quote.withdrawn`, the selected-provider and not-selected-provider outcomes of `quote.accepted`, `booking.payment_window_expired`, `booking.revived`, `booking.provider_fault_replacement`, `booking.scheduled`, `booking.rescheduled` and `treatment.plan_changed` are mandatory. `quote.expiring_soon` and `booking.hold_expiring_soon` are admin-configurable. No mandatory provider event (`quote.cancelled_inquiry`, the selected-provider and not-selected-provider outcomes of `quote.accepted`, `booking.payment_window_expired`, `booking.revived` and `booking.rescheduled`) is subject to FR-032 provider notification preferences.", "rationale": "prd.md line 211"}}
  - {"op": "add_edge", "from": "REQ-030-134", "verb": "applies at", "to": "STG-main-01-inquiry"}
  - {"op": "add_node", "id": "REQ-030-135", "type": "Rule", "owner_fr": "FR-030", "title": "At acceptance the patient receives booking.scheduled; quote.accepted goes to providers only", "attrs": {"statement": "Acceptance recipients: at acceptance the patient receives only `booking.scheduled`; `quote.accepted` goes to providers only (the accepted provider and each not-selected provider). No admin notification is sent for an acceptance. The same applies to an admin-authored replacement acceptance in the FR-006 provider-fault transfer: the patient receives `booking.scheduled` with the replacement payment deadline, and the replacement provider receives `quote.accepted` (`selected_subquote_accepted`).", "rationale": "prd.md line 212"}}
  - {"op": "add_edge", "from": "REQ-030-135", "verb": "applies at", "to": "STG-main-01-inquiry"}
  - {"op": "add_node", "id": "REQ-030-136", "type": "Rule", "owner_fr": "FR-030", "title": "Admins are alerted only for exceptions on the quote-to-booking path", "attrs": {"statement": "Admin exception alerts: admins are alerted only for exceptions on the quote-to-booking path: a slot hold expiring while the first payment is unpaid (`booking.hold_expiring_soon`), Payment Window Expired (`booking.payment_window_expired`), provider fault (`booking.provider_fault_replacement`) and a provider withdrawing a quote that was already accepted (`quote.withdrawn`). Routine acceptances are visible on admin dashboards only.", "rationale": "prd.md line 213. Open question: quote.withdrawn is mandatory but alerts admins only after acceptance."}}
