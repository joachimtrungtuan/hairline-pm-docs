  - {"op": "update_node", "id": "REQ-009-005", "attrs": {"statement": "System MUST allow the Owner to remove or suspend any non-Owner team member and a Manager to remove or suspend only Clinical Staff and Billing Staff, with immediate access revocation"}}
  - {"op": "update_node", "id": "REQ-009-007", "attrs": {"statement": "System MUST send email notifications for team management events (invitation, role change, removal, suspension, reactivation, Owner handover); these notices need matching FR-030 catalogue entries"}}
  - {"op": "update_node", "id": "REQ-009-035", "attrs": {"statement": "Email invitations to new team members with secure signup link Email notifications when team member role changes Email notifications when team member is removed, suspended, or reactivated In-platform notifications for team management events"}}
  - {"op": "update_node", "id": "REQ-009-037", "attrs": {"statement": "Provider Owner: Accesses team management from provider dashboard main navigation (\"Team\" tab) Provider Manager: Accesses operational team management features from settings menu (within the Manager permissions defined in FR-031) New Team Member: Receives email invitation with signup link, creates account, automatically assigned to provider organization with specified role Admin Platform: System administrators access team management oversight from admin dashboard provider detail view"}}
  - {"op": "update_node", "id": "REQ-009-043", "attrs": {"statement": "System validates invitation token (not expired, not already used) Token validity, and invitation status (Pending and not past expires_at only), which means the invitation is still Pending and its seat is held; this is not a fresh seat availability test."}}
  - {"op": "update_node", "id": "REQ-009-048", "attrs": {"statement": "System checks that a seat is free and blocks the resend with the Screen 2 seat limit message when none is (the invitation stays Expired); otherwise System generates new invitation token and sends new email Old invitation token invalidated Outcome: Team member receives fresh invitation with new 7-day expiry"}}
  - {"op": "update_node", "id": "REQ-009-062", "attrs": {"statement": "Confirmation modal summarises risk (e.g., losing billing access). Provide impact summary (# of quotes and appointments naming the member as responsible clinician). Display last role change timestamp + actor."}}
  - {"op": "update_node", "id": "REQ-009-067", "attrs": {"statement": "System presents confirmation dialog with warning about handing over open items System displays the open items that name the team member as responsible clinician: Draft quotes in progress Open treatment records Upcoming scheduled appointments System prompts: \"Replacement clinician:\" with dropdown of remaining team members"}}
  - {"op": "update_node", "id": "REQ-009-070", "attrs": {"statement": "System replaces the removed member with the selected replacement clinician as responsible clinician on the open items"}}
  - {"op": "update_node", "id": "REQ-009-076", "attrs": {"statement": "System detects no open items System skips the replacement clinician step Removal proceeds immediately after confirmation"}}
  - {"op": "update_node", "id": "REQ-009-077", "attrs": {"statement": "System leaves the clinic's patient conversations unchanged by a removal: each conversation belongs to the clinic (one conversation per patient and provider, FR-012), so no routing changes and no patient message is sent."}}
  - {"op": "update_node", "id": "REQ-009-084", "attrs": {"statement": "Provide bulk reassignment for >10 open items (wizard launches Screen 5). Show SLA: \"Transfers must complete before confirming removal.\""}}
  - {"op": "update_node", "id": "REQ-009-085", "attrs": {"statement": "Select Workloads: Breakdown by item type with counts (quotes, treatment records, appointments). Assign Targets: Map each workload type to a target member (supports split assignments). Review & Confirm: Summary of transfers, notifications to recipients, and audit preview."}}
  - {"op": "update_node", "id": "REQ-009-082", "attrs": {"statement": "Suspensions use same modal with different final state. A suspension emits the team member suspended event and records who set it (REQ-009-192)."}}
  - {"op": "update_node", "id": "REQ-009-090", "attrs": {"statement": "\"Suspended\" rows show \"Reactivate\", except a suspension set by Hairline, which only a Hairline admin can lift (REQ-009-192)."}}
  - {"op": "update_node", "id": "REQ-009-099", "attrs": {"statement": "Current Workload Summary: Draft quotes (count) and Upcoming appointments (count) that name the member as responsible clinician. Screen 1 Workload Summary: Draft quotes count."}}
  - {"op": "update_node", "id": "REQ-009-107", "attrs": {"statement": "Suspended members show banner: \"This member is suspended. Reactivate to restore access.\" The banner and the Reactivate action apply only to a suspension set by the clinic; a suspension set by Hairline shows no Reactivate."}}
  - {"op": "update_node", "id": "REQ-009-111", "attrs": {"statement": "Screen 6 Tab 3 Assigned Work: Quotes, Treatment records, Appointments sub-tabs with counts. Bulk Reassign: Select multiple items and reassign to another member; opens Screen 5 (Task Transfer Wizard)."}}
  - {"op": "update_node", "id": "REQ-009-117", "attrs": {"statement": "Screen 10 Actions: Force suspend, Reactivate, resend invitation, view audit log, impersonate. Buttons enabled based on admin permissions; Force suspend is not offered on the Owner row; resend invitation is the A2 resend; Impersonate is Super Admin only and follows the FR-015 Login as Provider rules."}}
  - {"op": "update_node", "id": "REQ-009-145", "attrs": {"statement": "Existing admin actions (force suspend, reactivate, resend invitation, view audit log, impersonate) remain available from each row. Resend invitation is the A2 resend, including its seat check."}}
  - {"op": "update_node", "id": "REQ-009-159", "attrs": {"statement": "GDPR Compliance: Team members can request data export (personal data only) and account deletion through support (FR-034). A Hairline admin removes the account (status Removed) and anonymizes the member's personal data; audit entries keep an anonymous label for the existing audit retention period. An Owner must go through the Owner handover first."}}
  - {"op": "update_node", "id": "REQ-009-160", "attrs": {"statement": "Maximum team size limit per provider (default 100, adjustable 1-500). Invitation expiry is fixed at 7 days and is not a setting."}}
  - {"op": "update_node", "id": "REQ-009-161", "attrs": {"statement": "Force-suspend individual team member accounts for terms violations; not offered on the Owner row"}}
  - {"op": "update_node", "id": "REQ-009-162", "attrs": {"statement": "Force-remove team member in emergency situations (any member except the Owner, who changes only through the Owner handover)"}}
  - {"op": "update_node", "id": "REQ-009-165", "attrs": {"statement": "Admin can suspend team members but cannot hard-delete accounts (compliance requirement); on a deletion request the admin removes the account and anonymizes personal data"}}
  - {"op": "update_node", "id": "REQ-009-168", "attrs": {"statement": "System logs the bounce event, keeps the invitation status Pending with delivery state \"Pending Send\" (there is no Bounced status), and notifies provider owner via in-app notification: \"Invitation to [email] failed—email address may be invalid. Please cancel the invitation and invite again with the correct address.\""}}
  - {"op": "update_node", "id": "REQ-009-179", "attrs": {"statement": "Screen 11 Tab 3 (Assigned Work, admin view): the work category tabs (Quotes, Treatment records, Appointments) each show a badge with the number of items in the category."}}
  - {"op": "update_node", "id": "REQ-009-174", "attrs": {"statement": "System MUST let only a Hairline admin hand the Owner role of a provider organization to another person (Rule 11). The provider organization keeps exactly one Owner before, during, and after the handover, and no provider-side user can start a handover. The new Owner MUST already be an active team member of that organization; the previous Owner becomes a Manager; the action requires a reason; and the new and the previous Owner are both notified by email. The admin starts it from Screen 12."}}
