  - {"op": "add_node", "id": "STP-009-076", "type": "Step", "owner_fr": "FR-009", "title": "System invalidates the token, sets the invitation to Cancelled, frees the seat and logs it in the audit trail", "attrs": {"prd_ref": "Alternative Flow A8 step 2"}}
  - {"op": "add_node", "id": "STP-009-077", "type": "Step", "owner_fr": "FR-009", "title": "Provider Owner or Manager clicks Suspend or Reactivate on a team member row", "attrs": {"prd_ref": "Alternative Flow A9 step 1"}}
  - {"op": "add_node", "id": "STP-009-078", "type": "Step", "owner_fr": "FR-009", "title": "System sets the member to Suspended (recording who set it, revoking sessions) or back to Active, emails the member and logs it in the audit trail", "attrs": {"prd_ref": "Alternative Flow A9 step 2"}}
