# FR-009 logic review pass 1: ruled fixes applied to the PRD (Provider Team Roles). New rules, flows and steps come first, then new edges, then updates, retirements and edge removals.
# Cross-FR edges (FR-009 rules and screens pointing at other FRs' nodes, no other FR node is updated or retired): REQ-009-191 applies to ENT-quote.clinician_ids (FR-004) and ENT-treatment-record.clinician_ids (FR-010); REQ-009-196 applies to ENT-provider.email (FR-015).
# Queued for other FRs, not done here: FR-031 (Owner-only removal row), FR-004 and FR-010 (clinician lists on records), FR-015 (Owner onboarding records, login email, deactivation cascade), FR-030 and FR-020 (catalogue rows for the team notices), FR-032 (REQ-032-089 wording).
# Retired because no other FR governs, reads or shows them: SET-invitation-expiry-period, EVT-team-patient-handler-changed, ENT-team-member.active_inquiries_count, ENT-team-member.unread_messages_count, and the B6 routing steps STP-009-012, 071, 072, 073.
# Left alone on purpose: stage pinning of every FR-009 rule and step, FR-024 role gating, B4 ordering, invitation rate limit scope, Accepted/Active wording.
reason: "FR-009 logic review pass 1: work belongs to the clinic with a replacement clinician for open items, Manager limit on remove and suspend, Suspend and Reactivate flow with who set the suspension, no Force actions on the Owner row, admin Owner handover with the login email, fixed 7-day invitation expiry, seat check on resend, Cancel Invitation flow, provider-status checks and cancellation of Pending invitations for a Deactivated provider, admin invite form names, account deletion through support, and a removal that leaves clinic conversations unchanged."
by: docs-manager
operations:
  - {"op": "add_node", "id": "REQ-009-191", "type": "Rule", "owner_fr": "FR-009", "title": "Work belongs to the clinic; a named person is only the responsible clinician", "attrs": {"statement": "Inquiries, bookings, and messages belong to the clinic as a whole. A named person is recorded only as the responsible clinician on quotes and treatment records (clinician_ids) and on appointments. Removal and suspension list only those items and require a replacement clinician for the open ones.", "rationale": "General Module Rule 12; owner ruling on whose work a team member holds."}}
  - {"op": "add_node", "id": "REQ-009-192", "type": "Rule", "owner_fr": "FR-009", "title": "Who may suspend, remove or reactivate, and who set a suspension", "attrs": {"statement": "The Owner can suspend or remove any non-Owner team member; a Manager can suspend or remove only Clinical Staff and Billing Staff. A suspension records who set it, the clinic or the platform. A suspension set by the platform can be lifted only by a Hairline admin; the clinic sees no Reactivate on it.", "rationale": "General Module Rule 13; Alternative Flow A9; Screens 1, 4 and 6; owner ruling on the Manager limit and on platform suspensions."}}
  - {"op": "add_node", "id": "REQ-009-193", "type": "Rule", "owner_fr": "FR-009", "title": "Cancel a pending invitation", "attrs": {"statement": "The Owner can cancel any Pending invitation and a Manager only those for Clinical Staff and Billing Staff. Cancelling invalidates the token, sets the invitation status to Cancelled, frees the seat, and is logged in the audit trail.", "rationale": "Alternative Flow A8; Screen 1 and Screen 6 invitation rows."}}
  - {"op": "add_node", "id": "REQ-009-194", "type": "Rule", "owner_fr": "FR-009", "title": "A Deactivated provider cancels its Pending invitations", "attrs": {"statement": "When a provider is Deactivated (FR-015), the system cancels every Pending invitation of that provider: the status becomes Cancelled and an audit entry is written.", "rationale": "General Module Rule 14; Screen 7 provider-status checks."}}
  - {"op": "add_node", "id": "REQ-009-195", "type": "Rule", "owner_fr": "FR-009", "title": "The invitation page checks the provider status", "attrs": {"statement": "Before an invitation is accepted, Screen 7 checks the provider status. For a Deactivated provider it shows \"This invitation is no longer valid.\"; for a Suspended provider it shows \"This clinic is temporarily unavailable\", the invitation stays Pending, and its expiry keeps running.", "rationale": "General Module Rule 14; Screen 7 validation."}}
  - {"op": "add_node", "id": "REQ-009-196", "type": "Rule", "owner_fr": "FR-009", "title": "The login email follows the new Owner; the Owner has onboarding records", "attrs": {"statement": "After an Owner handover the provider record's Owner login email becomes the new Owner's email. The Owner already has a team member record and an org-role record created with the provider account at onboarding (FR-015), so the handover changes roles on existing records.", "rationale": "Rule 11; Admin Flow: Hand Over the Owner Role; Screen 12 business rules."}}
  - {"op": "add_node", "id": "STP-009-074", "type": "Step", "owner_fr": "FR-009", "title": "System checks that a seat is free and blocks the resend with the Screen 2 seat limit message when none is", "attrs": {"prd_ref": "Alternative Flow A2 step 4"}}
