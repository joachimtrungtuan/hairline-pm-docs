  - {"op": "add_node", "id": "STP-009-080", "type": "Step", "owner_fr": "FR-009", "title": "System makes the picked member the Owner, the previous Owner a Manager, and sets the provider Owner login email to the new Owner's email", "attrs": {"prd_ref": "Admin Flow: Hand Over the Owner Role step 2"}}
