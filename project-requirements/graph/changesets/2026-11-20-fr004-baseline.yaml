operations:
  - {"op": "add_node", "id": "REQ-004-102", "type": "Rule", "owner_fr": "FR-004", "title": "Validation Summary checklist on Review & Submit", "attrs": {"statement": "Tab 7 (Review & Submit) MUST show a read-only Validation Summary checklist of every tab's completion, linking each unresolved issue to its owning tab; Submit Quote MUST stay blocked while any blocking issue is unresolved."}}
  - {"op": "add_node", "id": "REQ-004-103", "type": "Rule", "owner_fr": "FR-004", "title": "Patient Quote Review shows new, updated and expired indicators", "attrs": {"statement": "The patient Quote Review screen MUST show read-only indicators that a quote is new, updated, or expired."}}
  - {"op": "add_node", "id": "REQ-004-104", "type": "Rule", "owner_fr": "FR-004", "title": "Admin Quote List flags an inquiry with more than one quote", "attrs": {"statement": "The admin Quote List MUST show a badge or icon, with a count or indicator, on an inquiry that holds more than one quote."}}
  - {"op": "add_node", "id": "REQ-004-105", "type": "Rule", "owner_fr": "FR-004", "title": "Admin restores an expired quote with a fresh window", "attrs": {"statement": "Only an admin, with a mandatory reason, MAY restore an expired quote, and not when the inquiry already has an accepted subquote. The restored quote MUST return to `sent` with a fresh full window: its new expiry is the restore time plus the FR-026 quote expiry window in force at that time. This is the only case in which a quote's expiry is renewed."}}
  - {"op": "add_node", "id": "REQ-004-106", "type": "Rule", "owner_fr": "FR-004", "title": "quote.restored notice to patient and provider", "attrs": {"statement": "When an admin restores an expired quote, System MUST notify both the patient and the provider through `quote.restored`; FR-004 is the only producer. Drafted default channels are Email and Push; recipients, content, and whether the notice can be switched off are set in the FR-030 catalogue, where the event is to be added."}}
  - {"op": "add_node", "id": "REQ-004-107", "type": "Rule", "owner_fr": "FR-004", "title": "A sent quote opens or updates the FR-012 conversation", "attrs": {"statement": "When a provider sends a quote, the patient and that provider MUST be able to message each other: the first quote from a provider to a patient opens their FR-012 conversation, and a later quote from the same provider is added to it. FR-012 owns the conversation itself."}}
