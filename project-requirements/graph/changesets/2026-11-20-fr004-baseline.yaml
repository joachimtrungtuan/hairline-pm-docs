  - {"op": "update_node", "id": "REQ-004-002", "attrs": {"statement": "System MUST enforce the admin-controlled FR-026 expiry window (default 48h), captured at first send, and compute the deadline per sent quote. The only renewal is the admin restore of an expired quote (REQ-004-105)."}}
  - {"op": "update_node", "id": "REQ-004-005", "title": "Admin inline edit of quotes, after acceptance except price, currency and promotion", "attrs": {"statement": "Admin MUST be able to inline edit policy-bound fields of `draft` and `sent` quotes with required reason and re-notifications. After a subquote is accepted, an admin MUST still be able to change any quote field except price, currency, and promotion (the date range and treatment details can be changed), with a mandatory reason and full before and after history; the change MUST be stored as a new version beside the acceptance snapshot, which stays unchanged, and payment records MUST NOT change."}}
  - {"op": "update_node", "id": "REQ-004-016", "attrs": {"statement": "Each Quote Option MUST retain the selected provider package ID/version and a stable, versioned quote-owned snapshot of its inclusions and standard values. The parent quote MUST retain the Treatment ID/version that every option belongs to."}}
  - {"op": "update_node", "id": "REQ-004-017", "attrs": {"statement": "Providers MUST be able to customize every selected package inline for the current quote without updating or creating reusable package-library records, and without creating a new package version."}}
  - {"op": "update_node", "id": "REQ-004-028", "attrs": {"statement": "Graft description MUST be generated from the fixed template text written in this PRD (Business Rules, \"Graft Description template\") and the estimated graft count, displayed read-only, and versioned with the quote. There is no admin setting for the template."}}
  - {"op": "update_node", "id": "REQ-004-030", "attrs": {"statement": "Quote-amount analytics MUST be computed from the accepted option/date price only. Unaccepted quotes MUST be excluded from amount metrics and counted once as a parent response in volume and conversion metrics; Quote Options MUST NOT be counted as responses. The counting boundary is the parent quote: each submitted parent quote MUST be counted once, on its first successful submission; several parent quotes from one provider are separate responses; and drafts, edits, re-sends, aggregate versions, Quote Options, and option/date-price records MUST NOT add responses. Response, option, subquote, acceptance, and confirmed-booking counts are different grains and MUST NOT be interchanged. FR-014 reads this Rule and keeps its references to it."}}
  - {"op": "update_node", "id": "REQ-004-033", "attrs": {"statement": "A quote MUST be built from one treatment plus one to five Active packages. Each selected Active package MUST seed exactly one alternative Quote Option (maximum five per parent quote), never summed with another package. The package standard price MUST prefill each applicable option/date-price row, and the package's relative day plan MUST prefill the option plan."}}
  - {"op": "update_node", "id": "REQ-004-036", "attrs": {"statement": "System MUST capture the quote expiry and quote currency read-only at first send from the FR-026 quote configuration. Drafts MUST carry neither, and there MUST be no per-quote expiry extension other than the admin restore of an expired quote (REQ-004-105)."}}
  - {"op": "update_node", "id": "REQ-004-037", "title": "No provider quote edits or new quotes after acceptance", "attrs": {"statement": "After a subquote is accepted, System MUST block every FR-004 quote edit by providers; their treatment-detail changes (plan, clinicians, grafts) MUST go through FR-010. Admin edits after acceptance follow REQ-004-005. Price, currency, and promotion MUST never change after acceptance. An accepted parent quote MUST never be reopened, expired, or restored to an acceptable state, including after `Payment Window Expired`, and no new parent quote MAY be created or sent for an inquiry with an accepted subquote, except the admin-authored replacement quote of REQ-004-048."}}
  - {"op": "update_node", "id": "REQ-004-046", "attrs": {"statement": "System MUST emit `quote.submitted` on the first send of a parent quote and `quote.expired` when expiry processing moves a sent parent quote to `expired`. Recipients, content, and whether the notice can be switched off are set in the FR-030 notification Rules (REQ-030-033 and REQ-030-036)."}}
  - {"op": "update_node", "id": "REQ-004-060", "attrs": {"statement": "Package-library changes after snapshot creation MUST NOT alter existing draft or sent options unless the provider explicitly replaces the source package and confirms a new snapshot; replacing the package requires a new snapshot and audit entry. Patients see only the option's own copy of the package content, never the live library package."}}
  - {"op": "update_node", "id": "REQ-004-068", "attrs": {"statement": "Expiry applies only to `sent` parent quotes. Upon expiry, system updates the parent quote to `expired` and every child subquote becomes ineligible for acceptance. `accepted` quotes and every cancelled, withdrawn, or archived quote are never moved to `expired`. The `quote.expired` notice is set by REQ-004-046."}}
  - {"op": "update_node", "id": "REQ-004-084", "attrs": {"statement": "After acceptance, price, currency, and promotion never change; the booking's appointment changes only through the FR-006 admin appointment change, which emits `booking.rescheduled`, while the acceptance snapshot keeps the accepted appointment as the baseline."}}
  - {"op": "update_node", "id": "REQ-004-085", "title": "Edits only while draft or sent, admin exception after acceptance", "attrs": {"statement": "Providers may edit a quote only while it is `draft` or `sent`; admins may edit `draft` and `sent` quotes, and after acceptance any field except price, currency, and promotion (REQ-004-005). Edits on expired, withdrawn, archived, or cancelled quotes are prohibited for providers and admins, and a late edit or deletion is disallowed with a user message."}}
  - {"op": "update_node", "id": "REQ-004-092", "title": "Quote objects archived for the platform retention period", "attrs": {"statement": "GDPR/data compliance: all quote objects are archived; retention follows the system PRD, Platform-Wide Rules: One 10-year retention period."}}
  - {"op": "update_node", "id": "SCR-004-07", "attrs": {"description": "Admin performs inline edits with audit on draft, sent, and accepted quotes, with a mandatory reason; price, currency, and promotion stay read-only once accepted, and an edit after acceptance is stored as a new version beside the unchanged acceptance snapshot."}}
