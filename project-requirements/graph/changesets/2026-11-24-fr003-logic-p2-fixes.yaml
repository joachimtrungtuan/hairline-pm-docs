  - {"op": "add_edge", "from": "STP-003-085", "verb": "applies", "to": "REQ-003-128"}
  - {"op": "add_edge", "from": "STP-003-084", "verb": "applies", "to": "REQ-003-128"}
  - {"op": "add_edge", "from": "STP-003-037", "verb": "applies", "to": "REQ-003-128"}
  - {"op": "add_edge", "from": "STP-003-038", "verb": "applies", "to": "REQ-003-128"}

  # P2-05: Screen 8 shows the redistribution state and carries the Confirm and Decline actions
  - {"op": "add_edge", "from": "SCR-003-09", "verb": "shows", "to": "ENT-inquiry.redistribution_state", "attrs": {"provenance": "system calculated", "label": "Redistribution Confirmation"}}

  # P2-06: admin cancel and Close inquiry set cancelled_by = admin and leave cancellation_reason empty; cancelled_by is shown on Screen 12
  - {"op": "update_node", "id": "REQ-003-014", "title": "Admin booking cancellation or Close inquiry cancels the inquiry as admin and releases hold", "attrs": {"statement": "When an admin cancels a booking through FR-006, or closes the inquiry through Close inquiry on FR-006 Screen 6, System MUST set the inquiry to `Cancelled` with `cancelled_by = admin`, leave `cancellation_reason` empty (the admin's reason is the booking's cancellation reason in FR-006, shown to the patient and the provider as FR-006 defines), release any active appointment slot hold (FR-006 hold of the FR-026 configured duration) immediately, and leave the accepted quote with the status `accepted`. Any draft replacement quote follows REQ-003-127."}}
  - {"op": "update_node", "id": "REQ-003-012", "attrs": {"statement": "System MUST allow patients to cancel their own inquiry in Inquiry or Quoted stages with a required cancellation reason; cancellation is immediate and irreversible. From the Accepted stage onward, System MUST NOT offer patient cancellation; it MUST show \"Contact support\", and cancellation is performed only by an admin through FR-006. System MUST record who cancelled in `cancelled_by` (patient, system or admin)."}}
  - {"op": "update_node", "id": "ENT-inquiry.cancellation_reason", "attrs": {"description": "Patient-private; the label of one of the Admin-configured reasons the patient picked (checked against the options active at the time), or the system reason \"Account Deleted (System)\". Empty when cancelled_by is admin: the admin's reason is the booking's cancellation reason in FR-006. The cause of the cancellation is kept in cancelled_by."}}
  - {"op": "update_node", "id": "ENT-inquiry.cancelled_by", "attrs": {"description": "Who cancelled the inquiry: the patient, the system (account deletion) or an admin (FR-006 booking cancellation or Close inquiry). Provider-status causes stay on ENT-provider-inquiry.cancellation_cause."}}
  - {"op": "add_edge", "from": "SCR-003-15", "verb": "shows", "to": "ENT-inquiry.cancelled_by", "attrs": {"provenance": "system calculated", "label": "Full Inquiry"}}

  # P2-07: ProviderInquiry quoted and viewed have stated triggers
  - {"op": "update_node", "id": "REQ-003-129", "title": "Quotes count, responses count and the ProviderInquiry viewed and quoted status come from current data", "attrs": {"statement": "`quotes_count` is the number of the inquiry's quotes in sent, accepted or expired status (FR-004) and is shown on the admin overview. `responses_count` is the number of the inquiry's ProviderInquiry rows with status `quoted` or `declined` and is shown on the patient dashboard. Both are recomputed from current data each time they are shown. A ProviderInquiry row becomes `viewed` when the provider first opens the inquiry detail (Screen 10). It becomes `quoted` when the provider first sends a quote for the inquiry (FR-004) and stays `quoted` afterwards, even if that quote later expires or is withdrawn; a quote that is only a draft does not count."}}
  - {"op": "update_node", "id": "ENT-provider-inquiry.status", "attrs": {"description": "Distributed (received, not yet opened), Viewed (the provider first opened the inquiry detail), Quoted (the provider has sent a quote for this inquiry in FR-004; it stays Quoted if that quote later expires or is withdrawn), Declined (the exclusive monitoring-conversion provider declined), Cancelled (the cause is kept on cancellation_cause). No inquiry expiry exists at launch, so there is no Expired value."}}
  - {"op": "add_edge", "from": "REQ-003-129", "verb": "applies to", "to": "ENT-provider-inquiry.status"}
  - {"op": "add_edge", "from": "STP-003-027", "verb": "applies", "to": "REQ-003-129"}
