reason: "FR-003 logic review pass 2: archive only a Completed or Cancelled inquiry (owner default 66), scope and complete the redistribution confirmation chain, show the confirm and decline actions on Screen 8, set cancelled_by for admin cancellation and Close inquiry, and give the ProviderInquiry viewed and quoted statuses a trigger"
by: "docs-manager"
operations:
  # P2-01 and P2-02 (owner default 66): archive only when the stage is Completed or Cancelled; archive hides the inquiry in admin list views and changes no status
  - {"op": "update_node", "id": "REQ-003-088", "title": "Admin soft delete only, with reason, Archived badge and a Completed or Cancelled guard", "attrs": {"statement": "Soft delete only (no hard deletes). Archive requires reason and confirmation; retains data for audit; prevents further edits; read-only view after deletion; display badge \"Archived\" wherever an archived inquiry is shown in admin views. An admin may archive an inquiry only when its stage is Completed or Cancelled; any other stage is refused with a message and nothing changes. Archive hides the inquiry in admin list views, sends no patient or provider notice and changes no status."}}
  - {"op": "update_node", "id": "STP-003-092", "title": "Archive is refused with a message because the inquiry stage is not Completed or Cancelled"}
  - {"op": "remove_edge", "from": "STP-003-039", "verb": "next", "to": "STP-003-092"}
  - {"op": "add_edge", "from": "STP-003-039", "verb": "next", "to": "STP-003-092", "attrs": {"label": "stage is not Completed or Cancelled"}}
  - {"op": "update_node", "id": "ENT-inquiry.is_archived", "attrs": {"description": "Admin soft delete flag; shown as an Archived badge. It is set only when the stage is Completed or Cancelled; it hides the inquiry in admin list views and changes no status."}}
  - {"op": "update_node", "id": "REQ-003-067", "attrs": {"statement": "System MUST NOT expire an unquoted inquiry automatically at launch. An inquiry stays open until the patient or an admin cancels it, or it is quoted and the patient decides. Draft expiry (REQ-003-004) and quote expiry (FR-004, FR-026) are separate and unchanged."}}

  # P2-03: confirmation scoped to the last live offer with a patient-selected provider; new step sets awaiting_patient_confirmation
  - {"op": "update_node", "id": "REQ-003-021", "attrs": {"statement": "Before acceptance, when the provider-status cascade cancels the last live offer on the inquiry (a sent quote that has not expired, with no other live offer remaining), System MUST redistribute the inquiry, at most once per provider-status event, to eligible providers that have not yet received it under the normal Workflow 2 distribution rules, keep `supportRequired = true`, and tell the patient \"[Clinic] is no longer available. We are finding new offers for you.\" If the patient had not explicitly selected the affected provider, the redistribution is automatic. Only if the patient had explicitly selected the affected provider, System MUST first ask the patient to confirm and MUST redistribute only after confirmation; confirm, decline and no-answer follow REQ-003-128. System MUST NOT redistribute while another live offer remains (Workflow 2 Alternative Flow B4)."}}
  - {"op": "update_node", "id": "REQ-003-117", "attrs": {"statement": "A provider-caused status change (ProviderSuspended or ProviderDeactivated) never shows patient-cancellation copy. For a still-comparing inquiry (Inquiry or Quoted stage), the dashboard shows a provider-unavailable banner with a Contact Admin/Support action, the affected provider's offers show as unavailable while other offers remain actionable, and when no live offer remains and the patient had explicitly selected the affected provider the dashboard first asks the patient to confirm the redistribution with Confirm and Decline actions (REQ-003-128). After acceptance, the dashboard keeps the current stage and tells the patient that an admin will arrange a replacement provider within the same inquiry."}}
  - {"op": "add_node", "id": "STP-003-100", "type": "Step", "title": "System asks the patient to confirm the redistribution and sets the state to awaiting patient confirmation", "owner_fr": "FR-003", "attrs": {"prd_ref": "Workflow 2 Alternative Flow B4 step 3; Screen 8"}}
  - {"op": "add_edge", "from": "STP-003-100", "verb": "done by", "to": "ACT-system"}
