  - {"op": "update_node", "id": "SET-support-urgent-unassigned-escalation-threshold", "attrs": {"description": "Hours before an urgent case that is still unassigned auto-escalates to Super Admin (a fixed alert email goes to admins after 1 hour first). Editable by Super Admin on Screen 7 within 1 to 48 hours."}}
  - {"op": "update_node", "id": "REQ-034-070", "attrs": {"statement": "Patients access Contact Support and Feedback submission forms from patient app Help Center (FR-035: Patient Help Center & Support Submission); Providers access Contact Support form from Help Centre (FR-032 Screen 5.5) to submit support requests; Providers access Feedback & Suggestions form from Help Centre (FR-032 Screen 5.6) to submit feedback; Admin staff access Support Center module from main admin navigation menu; Default view shows case listing screen with all cases (Open and In Progress by default); Admin can create new support case manually from case listing screen via \"Create New Case\" button; Super Admin accesses Support Center Configuration via Settings > Support Center path to manage centralized lists (categories, priorities, resolution categories, root causes, tags)", "rationale": "Entry Points (prd.md lines 131 to 162), including the Admin Platform, patient app, provider Help Centre and Settings routes; Support Center Configuration is Super Admin only (prd.md line 152). The case-listing default view is also stated on Screen 1 (prd.md line 395)."}}
  - {"op": "update_node", "id": "REQ-034-083", "attrs": {"statement": "Internal Notes visible to every admin staff member with the \"View Support Center\" permission (not visible to patients/providers)", "rationale": "Data and Privacy Rules, Privacy Rule 4 (prd.md line 779). REQ-034-046 states the admin-only part without the permission name."}}
  - {"op": "update_node", "id": "REQ-034-086", "attrs": {"statement": "Editable by Admin (via Admin Platform UI): Case category, priority, status, title, description (per-case editing in Screen 2); Case assignment (transfer to another admin user via Screen 5); Internal notes and admin-only comments (in Screen 3); Patient/provider linkage (add, modify, or remove linked records in Screen 2); Case tags and labels (per-case in Screen 2); Resolution summary and resolution category (in Screen 4); Auto-close period (Immediately, 3, 7, or 14 days after resolution in Screen 4)", "rationale": "Business Rules, Admin Editability (prd.md lines 787 to 795). Screens 2, 3, 4 and 5 are named in the line items."}}
  - {"op": "update_node", "id": "REQ-034-091", "attrs": {"statement": "Providers receive email notifications when: Support case created for their inquiry; Case status changes; Admin sends message/reply to provider; Case marked \"Resolved\" with resolution summary; Case closed", "rationale": "Business Rules, Notification Rule 2 (prd.md lines 841 to 846)."}}
  - {"op": "update_node", "id": "REQ-034-092", "attrs": {"statement": "Admin staff receive email notifications when: Case assigned to them; Case escalated to them (escalations go to Super Admin); Patient/provider replies to a case (one email per reply); A case is reopened (a separate reopening notice, in addition to the reply email); Urgent case created and still unassigned after 1 hour (a fixed alert email to admins; if the case is still unassigned at the Urgent Case Unassigned Threshold in Screen 7, default 24 hours, it escalates to Super Admin)", "rationale": "Business Rules, Notification Rule 3 (prd.md lines 847 to 852). The 1-hour alert is fixed; the Screen 7 threshold (prd.md line 710) is the point where the case escalates to Super Admin."}}
  - {"op": "update_node", "id": "REQ-034-094", "attrs": {"statement": "Support Staff: Create, view, edit, reassign, and resolve cases (assignment is informational only and does not restrict access); Super Admin: Full access including Support Center configuration management, receipt of escalations, and audit log export (no hard delete; archive only); There is no Support Manager role and no \"Manage Support Configuration\" permission", "rationale": "Implementation Notes, Security Considerations, Authorization (prd.md lines 1029 to 1032). REQ-034-042 names the two roles; FR-031 owns the role definitions."}}
  - {"op": "update_node", "id": "REQ-034-099", "attrs": {"statement": "System sends confirmation email to patient with case reference number (via S-03); System sends confirmation email to provider with case reference number (via S-03); System sends notification to the Support Staff pool"}}
  - {"op": "update_node", "id": "REQ-034-100", "attrs": {"statement": "System sets case status to \"Open\" and routes it to the Support Staff pool for patient, provider and feedback submissions (team is a routing label only)", "rationale": "Alternative Flows A5, A3 and A4 step 8 (prd.md lines 283, 243, 263). Assignment is informational only (Business Rule 9); the team is a routing label, not an assignee."}}
  - {"op": "update_node", "id": "REQ-034-101", "attrs": {"statement": "System sets case category based on patient's selection (Technical Issue, Account Access, Payment Question, Booking Issue, General Inquiry, Feature Request, Bug Report, Feedback: the eight patient categories); System sets case priority based on patient's selection (Low, Medium, High, Urgent); System sets case category based on provider's selection (Technical Issue, Account Access, Payment Question, Booking Issue, General Inquiry, Provider Support: the six provider categories); System sets case priority based on provider's selection (Low, Medium, High, Urgent); System sets case category from the feedback type: Feature Request and Bug Report keep their own categories, Suggestion and Other are filed under category Feedback (no new categories); System sets case priority based on provider's suggested priority (Low, Medium, High, Urgent)", "rationale": "Alternative Flows A5, A3 and A4 steps 6 and 7 (prd.md lines 281, 282, 241, 242, 261, 262). Patient and provider categories are subsets of the ten-category master list (Screen 7, prd.md line 682)."}}
  - {"op": "update_node", "id": "REQ-034-108", "attrs": {"statement": "System automatically detects deactivated admin accounts and marks their assigned cases as \"Unassigned\"; Support Staff receive notification to reassign orphaned cases; Case timeline logs admin account deactivation event", "rationale": "Edge Cases (prd.md lines 1150 to 1153). The timeline event list includes Admin Deactivated (prd.md line 529)."}}
  - {"op": "update_node", "id": "REQ-034-123", "attrs": {"statement": "Patient Identifier: HPID, email, or phone to link case to patient record (Must match existing patient if provided; optional field; Required if Submitter Type = Patient, unless No Patient Link is chosen); Provider Identifier: Provider ID or clinic name (if case is provider-related) (Must match existing provider if provided; optional field; Required if Submitter Type = Provider); If patient identifier provided, system displays patient name and HPID for confirmation; If provider identifier provided, system displays provider clinic name and ID for confirmation; Linking case to patient/provider record enables \"View Patient Record\" or \"View Provider Record\" button for deep-linking to A-01 or A-02", "rationale": "Screen 2 data fields and business rules (prd.md lines 429, 430, 443 to 446). Alternative flow B1 (create without a patient link) is the stated exception to the required-if rule."}}
  - {"op": "update_node", "id": "REQ-034-133", "attrs": {"statement": "Case Created: Shows who created it, initial description, category, priority, and linked patient/provider; Status Changed: Shows old status → new status, who changed it, and reason/context if provided; Feedback Resolution Updated: Shows old resolution → new resolution, who updated it, and notes; Case Assigned: Shows previous assignee → new assignee, who performed assignment, and reason; Case Reassigned: Shows reassignment details with full reason and context; Internal Note Added: Shows full note content (admin-only), who added it, marked with \"Admin Only\" badge; Message Sent: Shows full message content, sender (admin/patient/provider), recipient type; Message Received: Shows full message content from patient/provider in response to admin; Attachment Uploaded: Shows attachment name, size, who uploaded it, download link; Account Intervention: Shows what intervention was performed (password reset, account unlock, etc.), who performed it, link to patient/provider record; Case Resolved: Shows resolution summary, resolution category, feedback resolution (if applicable), who resolved it; Case Reopened: Shows who reopened it (an admin, or System for an automatic reopen), reason for reopening, previous resolution summary; Case Closed: Shows who closed it, auto-close vs manual close indicator; Case Escalated: Shows the reassignment marked as an escalation, the reason, and the raised priority; Notification Sent / Notification Failed: Shows the notification, its recipient, and its delivery result; Admin Deactivated: Shows that the assigned admin account was deactivated and the case became unassigned", "rationale": "Screen 3 timeline event types (prd.md lines 514 to 529)."}}
  - {"op": "update_node", "id": "REQ-034-139", "attrs": {"statement": "System automatically closes a Resolved case after the specified auto-close period if the patient/provider doesn't respond; If the patient/provider replies while the case is Resolved (before the auto-close period expires), the case is reopened automatically and the system records a Reopening by System with the reason \"User replied\"; A reply to a Closed case does not reopen it automatically: it goes to an admin, who decides whether to reopen it", "rationale": "Screen 4 business rules (prd.md lines 586 to 588). Admins reopen Closed cases (REQ-034-017); the automatic reopen applies only while the case is Resolved (REQ-034-165)."}}
  - {"op": "update_node", "id": "REQ-034-149", "attrs": {"statement": "Only Super Admin can access this screen (there is no Support Manager role and no \"Manage Support Configuration\" permission); Configuration screen accessible via Settings > Support Center path in admin navigation", "rationale": "Screen 7 business rules (prd.md lines 722, 723). FR-031 owns the role definitions."}}
  - {"op": "update_node", "id": "REQ-034-151", "attrs": {"statement": "Cannot delete categories, priorities, or resolution categories that are currently used by active cases (status = Open or In Progress); resolution categories, root causes, and reopen reason templates also cannot be deleted while in use, and Deactivate is offered instead; Can deactivate items instead of deleting; deactivated items hidden from dropdowns but preserved for historical data; Tag List Table: Sortable by tag name; can delete tags even if used (removes from cases)", "rationale": "Screen 7 business rules, tag table and reopen template table (prd.md lines 705, 714, 725, 728)."}}
  - {"op": "update_node", "id": "REQ-034-155", "attrs": {"statement": "Auto-escalation thresholds configurable within defined ranges to prevent overly aggressive or too lenient escalation; Urgent Case Unassigned Threshold: Hours before an urgent case that is still unassigned auto-escalates to Super Admin, after a fixed alert email to admins at 1 hour (Min: 1, Max: 48, Default: 24 hours); High Priority Case Threshold: Hours before high priority case auto-escalates if no status change (Min: 12, Max: 72, Default: 48 hours); Case Inactivity Threshold: Days before case with no activity flagged for admin review, also the one clock behind the inactivity warnings in the case list and case detail view (Min: 7, Max: 90, Default: 14 days)", "rationale": "Screen 7 section 6 (prd.md lines 709 to 712). Notification Rule 3 states the 1-hour alert and the escalation to Super Admin (prd.md line 852); Assumption 3 repeats the 24-hour default (prd.md line 985)."}}
  - {"op": "add_node", "id": "REQ-034-171", "type": "Rule", "owner_fr": "FR-034", "title": "Built-in case categories are fixed (label and display order editable)", "attrs": {"statement": "The ten built-in case categories (Technical Issue, Account Access, Payment Question, Booking Issue, General Inquiry, Provider Support, Patient Support, Feature Request, Bug Report, Feedback) are fixed: Super Admin cannot add, delete or switch off a category, and only the category label and display order can be edited", "rationale": "prd.md lines 680 to 684, 727 (Screen 7 Case Categories section and business rules)."}}
