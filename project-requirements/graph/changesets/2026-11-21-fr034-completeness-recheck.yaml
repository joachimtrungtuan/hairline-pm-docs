reason: "FR-034 completeness re-check: wording that still used the old Support Manager, Support Agent and team-assignee text is brought in line with PRD v2.5, two Screen 7 lock Rules are added, the case-level timeline Field is replaced by the timeline-event Fields, and the Auto-Close After field becomes a four-option dropdown as the Screen 4 table states."
by: controller
