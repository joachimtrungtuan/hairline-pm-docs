operations:
  # --- Rules: Functional Requirements Summary IDs (REQ-005-001..030, verbatim) and prose rules given new IDs (REQ-005-031..064)
  - {"op": "add_node", "id": "REQ-005-001", "type": "Rule", "owner_fr": "FR-005", "title": "Every parent quote shown; each subquote a complete selectable choice", "attrs": {"statement": "System MUST show every parent quote received for an inquiry, including multiple parent quotes from the same provider, and MUST expose each child subquote as a complete patient-selectable commercial choice.", "rationale": "Restated by Main Flow steps 1-2 and the Patient Platform scope: the patient views parent quotes grouped by provider and quote response within the Inquiry Dashboard, and each subquote presents its package, date range, appointment details, pricing, and inherited parent information as one complete choice."}}
  - {"op": "add_node", "id": "REQ-005-002", "type": "Rule", "owner_fr": "FR-005", "title": "Exactly one subquote acceptance per inquiry; no parent acceptance", "attrs": {"statement": "System MUST allow the patient to accept exactly one valid subquote per inquiry and MUST NOT allow direct acceptance of a parent quote or any upper-level inherited record.", "rationale": "Restated by Business Rule 1 (a parent quote cannot be accepted directly; subsequent attempts are blocked with guidance, including after Payment Window Expired), Alternative Flow A2 (a second acceptance is prevented with guidance referencing the accepted subquote), the Screen 1 business rules (parent quotes are grouping and inheritance boundaries, not patient-selectable acceptance items; a subquote is the lowest-level complete commercial choice and the only selectable acceptance item; exactly one subquote acceptance is permitted per inquiry), the Communication Structure (Patient to System: accept action on one eligible subquote), the fixed-in-codebase subquote acceptance uniqueness constraint, Screen 4 (exactly one Accepted across the inquiry), the edge case on simultaneous accept attempts across devices (first valid acceptance wins; others see an informative message), and the implementation note that concurrency control prevents races across subquotes of the same inquiry."}}
  - {"op": "add_node", "id": "REQ-005-003", "type": "Rule", "owner_fr": "FR-005", "title": "Siblings Not Selected and competing parent quotes auto-cancelled", "attrs": {"statement": "On acceptance, System MUST mark sibling subquotes in the accepted parent quote Not Selected and MUST auto-cancel all competing parent quotes for the same inquiry with reasons and notifications.", "rationale": "Restated by the Provider Platform scope (competing parent quotes auto-cancelled with reason \"Other subquote accepted\"; sibling subquotes in the accepted parent quote become \"Not Selected\"), Business Rule 2 (a valid acceptance atomically acquires the slot hold, locks the subquote and its inherited parent context, marks siblings Not Selected and auto-cancels competing parent quotes with clear reasons and notifications; if the slot is already held or blocked, the attempt fails before any of those state changes), and Main Flow step 8."}}
  - {"op": "add_node", "id": "REQ-005-004", "type": "Rule", "owner_fr": "FR-005", "title": "Ineligible subquotes blocked from acceptance", "attrs": {"statement": "System MUST block subquote acceptance when the subquote or its parent quote is expired, withdrawn, cancelled, archived, superseded, or stale, with clear messaging.", "rationale": "Restated by Business Rule 5 (a subquote is ineligible if it or its parent quote is expired, withdrawn, cancelled, archived, superseded, or no longer the version presented to the patient, or if its owning provider is Suspended or Deactivated under FR-015), the Entry Points (acceptance is available only while the target subquote and its parent quote are eligible), Screen 1 (expired or withdrawn parent quotes make all child subquotes ineligible; terminal child subquotes are visually disabled), Screen 2 (Accept is disabled if the subquote or parent quote is expired, withdrawn, cancelled, superseded, or stale, or another subquote is already accepted), and Alternative Flow A3 with its edge case (a parent quote withdrawn just before confirmation blocks acceptance with explanation, and the patient returns to the inquiry dashboard to select another eligible subquote)."}}
  - {"op": "add_node", "id": "REQ-005-005", "type": "Rule", "owner_fr": "FR-005", "title": "Booking/payment handoff prepared without collecting funds", "attrs": {"statement": "System MUST prepare the booking/payment handoff from the accepted subquote without collecting funds in this module.", "rationale": "Restated by Payment & Billing (acceptance prepares the booking/payment handoff; no funds are collected in this module), Main Flow step 10, the Patient Platform scope (after acceptance, proceed to the booking/payment entry point), and the Out of Scope list (payment collection and invoice issuance are handled in Booking & Payment)."}}
  - {"op": "add_node", "id": "REQ-005-006", "type": "Rule", "owner_fr": "FR-005", "title": "Immutable acceptance snapshot with binding fields", "attrs": {"statement": "System MUST preserve an immutable acceptance snapshot containing the accepted subquote identifier/version, the underlying Quote Option ID and Option/date-price ID, the source package ID/version, the parent quote identifier/version and expiry, provider and inquiry references, treatment ID/version, package and service snapshot, date range, appointment date/time/timezone, offered price, any patient-applied promotion code and the resulting discounted price, promotion, currency, exchange rate and its timestamp, treatment plan, estimated grafts, graft description, visual plan, clinician IDs, notes, requirements, attachment IDs with versions, actor, and timestamp; `acceptedSubquoteVersion` MUST equal `acceptedParentQuoteVersion` because both identify the same FR-004 aggregate revision; all resulting state changes MUST be audited. Price, currency, date range, appointment, and promotion are the binding fields that downstream modules MUST read from the snapshot; the snapshot appointment is the accepted baseline, and booking notices MUST read the booking's current appointment, which only an FR-006 admin appointment change can alter. The treatment details are the original record at acceptance; later changes to plan, clinicians, or grafts are made only through FR-010 with audit and patient notice, and never edit the snapshot.", "rationale": "Restated by Payment & Billing binding snapshot fields (price, currency, date range, appointment, and promotion are read from the snapshot by every downstream module and the snapshot never changes after acceptance; an admin may later change the booking's appointment through FR-006, which emits booking.rescheduled, and every booking notice reads the booking's current appointment; after acceptance only the clinic or an admin may change the plan, clinicians, or grafts, through FR-010 only, with audit and patient notice, and the snapshot itself is never edited), Payment & Billing pricing (the resulting price and promotion are frozen into the snapshot; only the provider-fault transfer creates a new linked record), and Key Entities (acceptedSubquoteVersion MUST equal acceptedParentQuoteVersion; acceptanceSnapshot preserves the complete subquote plus inherited parent context, including the exchange rate and its timestamp and any patient-applied promotion code)."}}
  - {"op": "add_node", "id": "REQ-005-007", "type": "Rule", "owner_fr": "FR-005", "title": "Acceptance records retained for at least 7 years", "attrs": {"statement": "System MUST retain acceptance and related parent quote/subquote records for ≥ 7 years.", "rationale": "Restated by Data & Privacy Rule 4 (acceptance and related quote/subquote records retained at least 7 years)."}}
  - {"op": "add_node", "id": "REQ-005-008", "type": "Rule", "owner_fr": "FR-005", "title": "Patient identity masked to providers until payment confirmation", "attrs": {"statement": "System MUST keep patient identity masked to providers until payment confirmation.", "rationale": "Restated by Business Rule 3 (acceptance does not reveal patient full identity; full PII becomes accessible only after successful payment confirmation, per constitution), Data & Privacy Rule 1, the Provider Platform scope, the fixed-in-codebase patient identity reveal policy, the Out of Scope list, the business process assumption, and the security note (no PII reveal on acceptance)."}}
  - {"op": "add_node", "id": "REQ-005-009", "type": "Rule", "owner_fr": "FR-005", "title": "Encryption at rest and in transit; RBAC for actions", "attrs": {"statement": "System MUST encrypt data at rest and in transit and enforce RBAC for actions.", "rationale": "Restated by Data & Privacy Rule 2 (all data in transit and at rest is protected according to platform policies) and the security note (RBAC for all actors; encryption at rest and in transit)."}}
  - {"op": "add_node", "id": "REQ-005-010", "type": "Rule", "owner_fr": "FR-005", "title": "Integration with FR-004 and FR-020", "attrs": {"statement": "System MUST integrate with FR-004 for parent quote, Quote Option, option/date-price, lifecycle, aggregate `QuoteVersion`, and audit contracts and with FR-020 for notifications.", "rationale": "Restated by the integration-points note: FR-005 consumes parent quote and subquote data from FR-004, updates inquiry, parent quote, and subquote states, and triggers the notification service."}}
  - {"op": "add_node", "id": "REQ-005-011", "type": "Rule", "owner_fr": "FR-005", "title": "Booking handoff built from the accepted subquote", "attrs": {"statement": "System MUST emit a booking handoff whose atomic commercial input is the accepted subquote and whose inherited context is resolved from its parent quote.", "rationale": "Restated by Payment & Billing (the accepted subquote is the complete handoff unit; it carries the selected package, date range, appointment date/time/timezone, offered price, promotion when applicable, and references to the inherited parent quote, provider, and treatment context), Main Flow step 10, and the Entry Points (upon acceptance the system locks the selection, resolves sibling and competing outcomes, and triggers booking handoff)."}}
  - {"op": "add_node", "id": "REQ-005-012", "type": "Rule", "owner_fr": "FR-005", "title": "Filter and sort subquotes on subquote and inherited criteria", "attrs": {"statement": "System MUST allow patients to filter and sort subquotes using both subquote-owned and inherited comparison criteria.", "rationale": "Restated by the Screen 1 business rules (patient can sort/filter subquotes). The sort and filter options are REQ-005-053."}}
  - {"op": "add_node", "id": "REQ-005-013", "type": "Rule", "owner_fr": "FR-005", "title": "Side-by-side comparison of up to three subquotes", "attrs": {"statement": "System MUST support side-by-side comparison of up to three subquotes, regardless of whether they belong to the same or different parent quotes/providers.", "rationale": "Restated by Main Flow step 3, the Screen 1 business rules (compare up to three side-by-side, including siblings under one parent quote or subquotes from different parent quotes/providers), and the Compare Selection field (maximum three eligible subquotes, regardless of parent quote or provider grouping)."}}
  - {"op": "add_node", "id": "REQ-005-014", "type": "Rule", "owner_fr": "FR-005", "title": "Subquote comparison differentiators", "attrs": {"statement": "System MUST display these subquote comparison differentiators: package, included/custom services, date range, appointment details, total price, currency, promotion, price per graft, treatment plan, inherited graft count, provider review rating/count, and provider credentials summary. Estimated travel costs remain deferred pending an approved FR-008 source.", "rationale": "Restated by the Screen 1 Comparison Differentiators field, which lists the same rows."}}
  - {"op": "add_node", "id": "REQ-005-015", "type": "Rule", "owner_fr": "FR-005", "title": "Quote questions through FR-012 Messages/Inbox; no embedded chat", "attrs": {"statement": "Patients MUST be able to ask providers questions about quotes through the dedicated FR-012 Messages/Inbox; quote screens MAY navigate to the existing provider conversation but MUST NOT embed a chat surface.", "rationale": "Restated by the Communication Structure (Patient to Provider questions through the dedicated FR-012 Messages/Inbox conversation; direct patient-provider chat is out of scope) and the Screen 1 Message Provider button (opens that provider's conversation in FR-012; does not embed chat in the quote screen)."}}
  - {"op": "add_node", "id": "REQ-005-016", "type": "Rule", "owner_fr": "FR-005", "title": "Provider notified of quote questions within 5 minutes", "attrs": {"statement": "System MUST notify the provider of patient quote questions within 5 minutes.", "rationale": "Restated by the Communication Structure (System to Provider: notify the provider of patient quote questions within 5 minutes)."}}
  - {"op": "add_node", "id": "REQ-005-017", "type": "Rule", "owner_fr": "FR-005", "title": "Exchange rate locked at acceptance", "attrs": {"statement": "System MUST lock quote exchange rate at time of patient acceptance (per FR-004 pricing rules) and MUST record the rate and its timestamp in the acceptance snapshot. When the cached rate is older than 24 hours, acceptance MUST proceed on the cached rate and record it with its timestamp, without adding a review state.", "rationale": "Restated by Payment & Billing (the exchange rate is locked at acceptance per FR-004 and the System PRD pricing rules; when the cached rate is older than 24 hours acceptance proceeds on it and records its timestamp; no review state is added, and operations may review afterwards)."}}
  - {"op": "add_node", "id": "REQ-005-018", "type": "Rule", "owner_fr": "FR-005", "title": "Subquote resolves one Quote Option and one Option/date-price", "attrs": {"statement": "A subquote MUST resolve exactly one FR-004 Quote Option and one applicable Option/date-price record into one complete package, date range, appointment, and offered-price selection. It MUST inherit shared provider, treatment, graft, visual-plan, clinician, note, requirement, attachment, currency, expiry, and audit context from exactly one parent quote. FR-005 owns the subquote identifier and state: the identifier is derived deterministically from the Quote Option ID and Option/date-price ID, so it stays the same across parent re-versions while both records exist. A parent quote offers up to (number of Quote Options × number of date ranges) subquotes, because a provider may leave out pairings it cannot offer.", "rationale": "Restated by the Executive Summary (the subquote is the atomic patient comparison and acceptance unit; one Quote Option package snapshot together with exactly one Option/date-price record; neither is accepted independently), Screen 1 (a parent quote offers up to Quote Options x date ranges subquotes and every Quote Option has at least one date range; a selectable subquote has exactly one date range, and its appointment must fall within that range), and Key Entities (FR-005 owns id and state; id is derived deterministically from quoteOptionId and optionDatePriceId)."}}
  - {"op": "add_node", "id": "REQ-005-019", "type": "Rule", "owner_fr": "FR-005", "title": "Confirmation validates the current parent QuoteVersion", "attrs": {"statement": "Acceptance confirmation MUST validate the current parent aggregate `QuoteVersion`, MUST require the derived `subquoteVersion` to equal it, and MUST reject stale selections before creating an AcceptanceEvent.", "rationale": "Restated by the Executive Summary and Key Entities (subquoteVersion is the owning parent quote's QuoteVersion, not a separate revision counter), Main Flow step 6, Screen 2 (confirmation rejects a stale version; the accepted subquote and inherited context lock on acceptance), Screen 3 (the summary must reflect the latest subquote and parent versions), the implementation note on version validation before locking the snapshot, and the edge case where the provider edits the parent quote or selected subquote after the patient opens confirmation (the stale confirmation is rejected and the current version must be reviewed)."}}
  - {"op": "add_node", "id": "REQ-005-020", "type": "Rule", "owner_fr": "FR-005", "title": "Parent quote and subquote analytics remain distinct", "attrs": {"statement": "Parent quote and subquote analytics MUST remain distinct: one provider response counts once at parent level (metric: Parent Quote Responses), while comparison and selection behavior is recorded at subquote level (metrics: Subquote Comparisons and Subquote Selections)."}}
  - {"op": "add_node", "id": "REQ-005-021", "type": "Rule", "owner_fr": "FR-005", "title": "Acceptance atomically acquires an exclusive slot hold", "attrs": {"statement": "Acceptance MUST atomically acquire an exclusive hold on the selected appointment slot and MUST reject a second acceptance for a slot already held or blocked by another pending or confirmed booking, including a concurrent acceptance that finds an active hold already exists, before creating an AcceptanceEvent, changing quote/inquiry states, or emitting a booking handoff. The rejected patient MUST be told the slot was just taken.", "rationale": "Restated by Business Rule 2, Main Flow step 6 (one fixed, exclusive slot hold keyed by provider, appointment date/time, and time zone; if another pending or confirmed booking holds or blocks the slot, acceptance is rejected before an AcceptanceEvent or booking handoff is created), Alternative Flow A5 and Screen 3 (error state \"This appointment slot was just taken. Please choose another subquote.\"; no acceptance is recorded; the patient returns to the inquiry dashboard; the existing reservation is unchanged), and Payment & Billing post-acceptance hold (acceptance and exclusive slot reservation are one atomic operation; a second acceptance targeting the held or blocked slot is rejected)."}}
  - {"op": "add_node", "id": "REQ-005-022", "type": "Rule", "owner_fr": "FR-005", "title": "Provider status revalidated at acceptance", "attrs": {"statement": "System MUST revalidate the owning provider's status at acceptance and MUST block acceptance of any subquote whose provider is `Suspended` or `Deactivated` from the effective time, including in-flight confirmations. For a still-comparing inquiry, System MUST keep other providers' subquotes acceptable. When the status takes effect after acceptance, System MUST release any active hold, retain the AcceptanceEvent and acceptance snapshot without rewriting, record cause `ProviderSuspended` or `ProviderDeactivated` with `supportRequired` on the FR-006 booking and the FR-003 ProviderInquiry (the supersession record is written only when the replacement acceptance is recorded), route the case to the FR-006 provider-fault transfer within the same inquiry, and tell the patient that an admin will arrange a replacement provider instead of showing the patient-cancellation message.", "rationale": "Restated by Business Rule 8 (cause ProviderSuspended or ProviderDeactivated with an independent supportRequired marker; distinct from patient inquiry cancellation and Payment Window Expired; does not reclassify Completed or already-terminal history), Alternative Flow A6 (from the effective time Accept is blocked and an in-flight confirmation is rejected before an AcceptanceEvent or hold is created; FR-004 cancels that provider's parent quotes once each, while other providers' subquotes stay acceptable and the inquiry keeps its stage with supportRequired = true), Payment & Billing provider status change during hold (the hold is released even if time remains; the acceptance snapshot and locked price/exchange rate are retained unchanged), and the edge case of a status change while the patient is on the confirmation modal."}}
  - {"op": "add_node", "id": "REQ-005-023", "type": "Rule", "owner_fr": "FR-005", "title": "AcceptanceEvent immutable; admin annotations only", "attrs": {"statement": "System MUST NOT allow an AcceptanceEvent, accepted subquote, or its parent quote to be deleted, restored, or edited. Admins MAY add audited notes or corrections as annotations next to an AcceptanceEvent; an annotation MUST NOT change the event, its snapshot, or any quote, subquote, or inquiry state.", "rationale": "Restated by the Admin Platform scope, Admin Editability (an annotation never alters the AcceptanceEvent, its snapshot, the accepted IDs/versions, or any quote, subquote, or inquiry state; AcceptanceEvent immutability is fixed in codebase), Business Rule 6 (AcceptanceEvents, accepted subquotes, and their parent quotes are never deleted or restored; admins may only add audited annotations next to them), Screen 5 (annotations are append-only, each showing author, time, and reason; no delete or restore action exists), and Key Entities (AcceptanceAnnotation is an audited, append-only admin note)."}}
  - {"op": "add_node", "id": "REQ-005-024", "type": "Rule", "owner_fr": "FR-005", "title": "Only additional acceptance is the provider-fault replacement", "attrs": {"statement": "System MUST allow exactly one patient acceptance per inquiry. The only additional acceptance record is the admin-authored record created by an FR-006 provider-fault transfer before treatment starts; it MUST point to an admin-authored FR-004 replacement quote, Quote Option, and option/date-price row, and the original MUST be marked superseded by one supersession record inserted at the replacement acceptance rather than by editing it.", "rationale": "Restated by Business Rule 1 (applies only before treatment starts; the closure is recorded on the booking as its cause; one supersession record with cause ProviderFault, ProviderSuspended, or ProviderDeactivated links the closed acceptance to the new one; the patient keeps the same inquiry and re-enters nothing; money already paid moves with the patient as credit toward the replacement booking, any unused part refunded, with no cancellation fee, the mechanics being defined by FR-007, FR-007b, and FR-017), Alternative Flows A3, A6, and A9 (FR-006 owns the provider-fault case; the admin authors the replacement quote on FR-004 Screen 8 and records a new AcceptanceEvent with actorType = admin; the AcceptanceSupersession record is inserted once and never updated; the original AcceptanceEvent and snapshot stay unchanged as history), Admin Editability, and Key Entities (AcceptanceSupersession)."}}
  - {"op": "add_node", "id": "REQ-005-025", "type": "Rule", "owner_fr": "FR-005", "title": "One fixed slot hold for the FR-026 duration", "attrs": {"statement": "Acceptance MUST place one fixed slot hold keyed by provider, appointment date/time, and time zone for the FR-026 slot-hold duration, starting at acceptance. Payment failure MUST NOT extend the hold, and the appointment record MUST be created by FR-006 only on successful first payment. After `Payment Window Expired`, the accepted subquote MUST NOT be reopened; the patient's recovery route is \"Contact support\", through which an admin performs the FR-006 revive or an FR-006 booking cancellation.", "rationale": "Restated by Main Flow steps 6-7 (default 48 hours; no appointment record is created at acceptance), Alternative Flow A7 (the hold is released; the accepted subquote is never reopened, siblings stay Not Selected, competing parent quotes stay cancelled, and the AcceptanceEvent and snapshot stay unchanged; a revive is performed by FR-006 with a fresh slot-availability check and a new hold, and FR-005 creates no second acceptance; missed later instalments never cause Payment Window Expired), and Payment & Billing post-acceptance hold (payment failures or retries never extend the hold)."}}
  - {"op": "add_node", "id": "REQ-005-026", "type": "Rule", "owner_fr": "FR-005", "title": "Patient promotion code on one named subquote before acceptance", "attrs": {"statement": "System MUST let the patient apply a promotion code to one named subquote before acceptance, validated through FR-019, and MUST freeze the discounted price and promotion into the acceptance snapshot. The code MUST NOT be written to the provider's quote or promotion records, and the price and promotion MUST NOT change after acceptance except through an FR-006 provider-fault transfer.", "rationale": "Restated by Alternative Flow A8 (the discounted price is shown next to the offered price and carried into the confirmation summary; an invalid code shows the reason and leaves the offered price unchanged; the code does not carry over to another subquote; after acceptance the promotion and price cannot be removed, replaced, re-entered at checkout, or changed by revalidation, including an admin void), the Screen 2 Promotion Code field and business rule (not available after acceptance), and Payment & Billing pricing."}}
  - {"op": "add_node", "id": "REQ-005-027", "type": "Rule", "owner_fr": "FR-005", "title": "Price sort converts to display currency for ordering only", "attrs": {"statement": "When sorting subquotes by price, System MUST convert each price to the patient's display currency at the current rate for ordering only, MUST keep showing each subquote in its own quote currency, and MUST label the price order approximate when the listed subquotes use more than one currency."}}
  - {"op": "add_node", "id": "REQ-005-028", "type": "Rule", "owner_fr": "FR-005", "title": "Auto-applied promotion use consumed or released at acceptance", "attrs": {"statement": "On acceptance, System MUST consume the auto-applied promotion use reserved at send for the accepted parent quote and MUST release the reservations of every parent quote that ends Not Selected or auto-cancelled, as defined by FR-019. When the accepted subquote does not carry the automatic promotion reserved for its parent quote, System MUST release that reservation with reason `not_applied`.", "rationale": "Restated by Main Flow step 8 and Payment & Billing auto-applied promotion use (a sent parent quote holds at most one reserved use; re-sending keeps it, creates one only if the new version newly carries the promotion, and releases it if not; Payment Window Expired or cancellation before the first payment returns the consumed use to the limit; provider-selected promotions and patient-entered codes reserve at acceptance and consume at first payment; usage limits count reservations plus consumed uses). The reservation lifecycle itself is defined by FR-019."}}
  - {"op": "add_node", "id": "REQ-005-029", "type": "Rule", "owner_fr": "FR-005", "title": "booking.scheduled to the patient; quote.accepted to providers", "attrs": {"statement": "At acceptance, System MUST send the patient only `booking.scheduled` (\"Booking Accepted — Slot Held (Pending Payment)\"); `quote.accepted` outcome notices MUST go to providers only. `booking.scheduled` MUST go to the patient only, MUST be mandatory (not disableable), and MUST also fire on an admin-authored replacement acceptance.", "rationale": "Restated by Main Flow step 9 and Alternative Flow A9 (at the replacement acceptance the patient receives the mandatory booking.scheduled notice and the replacement provider receives quote.accepted)."}}
  - {"op": "add_node", "id": "REQ-005-030", "type": "Rule", "owner_fr": "FR-005", "title": "No patient inquiry cancel after acceptance; Contact support", "attrs": {"statement": "After acceptance, System MUST NOT offer the patient an inquiry cancel action and MUST show \"Contact support\" instead; booking cancellation from acceptance onward is performed only by an admin through FR-006.", "rationale": "Restated by Alternative Flows A4 and A7 (after acceptance the patient sees \"Contact support\"; an admin booking cancellation through FR-006 moves the booking and the inquiry to Cancelled, releases any active slot hold immediately, and leaves the accepted subquote and its parent quote accepted; refunds and fees follow the FR-006 payment placeholder), Admin Editability (cancel a booking after acceptance, from any booking state, through FR-006 with a mandatory reason and audit), Payment & Billing cancellation during hold, and the edge case of a patient who wants to cancel immediately after accepting."}}
  - {"op": "add_node", "id": "REQ-005-031", "type": "Rule", "owner_fr": "FR-005", "title": "Entry points to quote comparison", "attrs": {"statement": "Patient accesses quote comparison from the Inquiry Dashboard (FR-003 Screen 8), where quotes are displayed within the inquiry context, or via push/email notification."}}
  - {"op": "add_node", "id": "REQ-005-032", "type": "Rule", "owner_fr": "FR-005", "title": "Providers see acceptance outcomes read-only", "attrs": {"statement": "Providers have read-only visibility of the accepted or non-selected outcome for their parent quotes and subquotes; the provider platform is read-only in this module."}}
  - {"op": "add_node", "id": "REQ-005-033", "type": "Rule", "owner_fr": "FR-005", "title": "Flagged acceptance races investigated; first valid acceptance stands", "attrs": {"statement": "Flagged acceptance races or errors are investigated by an admin: the first valid acceptance stands, and the admin records findings as an annotation.", "rationale": "Stated in the Admin Platform scope, Admin Editability, and the Screen 5 Conflicts field."}}
  - {"op": "add_node", "id": "REQ-005-034", "type": "Rule", "owner_fr": "FR-005", "title": "Acceptance-related transitions immutably audited", "attrs": {"statement": "All acceptance-related state transitions are immutably audited (who, when, what, reason). Audit logs must record the accepted subquote, inherited parent snapshot, actor, presented versions, and every affected parent quote and sibling subquote.", "rationale": "Stated by Business Rule 4 and Data & Privacy Rule 3; restated by Main Flow step 11, the Shared Services scope, and the implementation note (append-only audit trail covering acceptance, sibling Not Selected outcomes, and competing parent quote cancellations)."}}
  - {"op": "add_node", "id": "REQ-005-035", "type": "Rule", "owner_fr": "FR-005", "title": "Terms acknowledgment required before acceptance", "attrs": {"statement": "The terms acknowledgment checkbox must be checked before the Accept button is enabled; the patient confirms the exact subquote with terms acknowledgment and a complete selection summary, and the confirmation modal requires the acknowledgment if it is not already checked.", "rationale": "Stated in Main Flow step 5, the Screen 2 Terms Acknowledgment field and business rule, and the Screen 3 Terms Acknowledgment field."}}
  - {"op": "add_node", "id": "REQ-005-036", "type": "Rule", "owner_fr": "FR-005", "title": "Inquiry status checked at confirmation", "attrs": {"statement": "System checks inquiry status at confirmation; if the inquiry has been cancelled, acceptance is blocked with the message \"This inquiry has been cancelled.\"", "rationale": "Main Flow step 6 revalidates the inquiry atomically at confirmation; the edge case covers an inquiry cancellation being processed while the patient accepts."}}
  - {"op": "add_node", "id": "REQ-005-037", "type": "Rule", "owner_fr": "FR-005", "title": "Acceptance sets parent quote and inquiry to Accepted and writes the accepted total", "attrs": {"statement": "After the exclusive hold succeeds, System records the selected subquote as Accepted, locks its inherited parent context and commercial details, sets the parent quote and inquiry to Accepted, records the acceptance snapshot (including the exchange rate and its timestamp) and the slot-hold reference, and writes the accepted subquote price as the parent quote's accepted total (FR-004 acceptedTotal), read from the snapshot. No appointment record is created at acceptance; FR-006 creates it only on successful first payment.", "rationale": "Main Flow step 7 and the Main Flow outcome (inquiry transitions to Accepted; one subquote and its inherited parent context are locked as the accepted selection)."}}
  - {"op": "add_node", "id": "REQ-005-038", "type": "Rule", "owner_fr": "FR-005", "title": "One outcome notice per sent parent quote; no quote.declined", "attrs": {"statement": "Each provider receives one notice per sent parent quote (selected or not selected); an unsent draft quote cancelled by FR-004 because another quote was accepted produces no notice. No quote.declined event is emitted for these outcomes.", "rationale": "Main Flow step 9; delivery is through FR-020."}}
  - {"op": "add_node", "id": "REQ-005-039", "type": "Rule", "owner_fr": "FR-005", "title": "Non-selected notices reveal no winner or price", "attrs": {"statement": "Notifications sent to non-selected providers (due to auto-cancellation) MUST NOT reveal the identity of the selected provider or the accepted price. The non-selected reason reads \"Other subquote accepted\" or \"Inquiry cancelled by patient\".", "rationale": "Business Rule 7, Main Flow step 9, and the Screen 4 Reason field (must not identify another provider or disclose the accepted price)."}}
  - {"op": "add_node", "id": "REQ-005-040", "type": "Rule", "owner_fr": "FR-005", "title": "Parent quote expiry during review", "attrs": {"statement": "When the parent quote countdown reaches zero while the patient is viewing details, System disables the Accept button and shows an \"Expired\" badge with guidance to choose another quote; every subquote under that parent quote becomes ineligible. The expiry timer applies to every child subquote and shows a static \"Expired on [date]\" when expired. If no eligible subquote remains, the patient may cancel the inquiry and submit a new one, or contact support.", "rationale": "Alternative Flow A1, the Screen 1 Expiry Timer field, and the Patient Platform scope (the patient sees the parent quote expiry countdown)."}}
  - {"op": "add_node", "id": "REQ-005-041", "type": "Rule", "owner_fr": "FR-005", "title": "Cancelled inquiry makes the dashboard read-only", "attrs": {"statement": "If the inquiry stage is \"Cancelled\", all Accept buttons and Compare checkboxes are disabled and the dashboard is read-only with a \"Cancelled\" badge; quote data remains visible for reference. If the patient cancels the inquiry while on the acceptance confirmation modal, the modal is dismissed and the inquiry dashboard refreshes to show the \"Cancelled\" badge with all actions disabled.", "rationale": "Screen 1 business rules, Alternative Flow A4 (the cancellation itself and the quote cascade belong to FR-003 Workflow 5 and FR-004; the patient can create a new inquiry immediately), and the confirmation-modal edge case."}}
  - {"op": "add_node", "id": "REQ-005-042", "type": "Rule", "owner_fr": "FR-005", "title": "Admin booking cancellation keeps the acceptance; no supersession record", "attrs": {"statement": "If an admin cancels the booking after acceptance, the AcceptanceEvent is retained unchanged and no AcceptanceSupersession record is written; the accepted subquote and parent Quote stay accepted.", "rationale": "Key Entities (AcceptanceEvent and AcceptanceSupersession), Alternative Flow A4, Payment & Billing cancellation during hold, and the Screen 5 Supersession Indicator (no supersession record exists for a cancellation). The edge case on a patient who wants to cancel immediately after accepting says the cancellation writes a linked supersession record; that conflict is flagged for the product owner."}}
  - {"op": "add_node", "id": "REQ-005-043", "type": "Rule", "owner_fr": "FR-005", "title": "Provider-unavailable inline errors", "attrs": {"statement": "Before acceptance, when Accept is blocked because the provider became Suspended or Deactivated, the patient sees the inline error \"This provider is no longer available. Please contact support.\" with a Contact Admin/Support action, not the patient-cancellation messaging. After acceptance, when the deposit or booking-confirming payment is blocked for the same reason, the patient sees the inline error \"This clinic can no longer perform your treatment. An admin will arrange a replacement clinic within the same inquiry.\" and is not asked to start a new inquiry or re-enter anything. Both are on-screen errors shown in the app, not FR-020 notifications, and are localized through FR-021 like other UI text.", "rationale": "Alternative Flow A6 outcome and the confirmation-modal edge case. The FR-020 patient notices for the same events are separate and owned elsewhere."}}
  - {"op": "add_node", "id": "REQ-005-044", "type": "Rule", "owner_fr": "FR-005", "title": "Replayed cascades and late requests never revive or duplicate", "attrs": {"statement": "A replayed provider-status cascade or a stale acceptance request arriving afterward creates no duplicate cancellation, notification, AcceptanceEvent, or hold. Late acceptance requests or payment callbacks cannot revive the original selection, and later reactivation does not restore it.", "rationale": "Alternative Flow A6 outcome and the provider-status edge case."}}
  - {"op": "add_node", "id": "REQ-005-045", "type": "Rule", "owner_fr": "FR-005", "title": "Unaccepted replacement quote", "attrs": {"statement": "If no replacement acceptance is recorded, the replacement quote expires under the normal FR-004 quote expiry and no AcceptanceEvent or AcceptanceSupersession record is written. The inquiry stays flagged supportRequired and is not cancelled automatically.", "rationale": "Alternative Flow A9. The admin's follow-up actions (another replacement quote on FR-004 Screen 8, or cancelling the inquiry and booking on the FR-006 admin screen) belong to FR-004 and FR-006."}}
  - {"op": "add_node", "id": "REQ-005-046", "type": "Rule", "owner_fr": "FR-005", "title": "No replacement acceptance once treatment has started", "attrs": {"statement": "If the provider fault happens while the booking is In Progress, or in Aftercare after treatment is done, no replacement acceptance is created.", "rationale": "Alternative Flow A9 boundary and Business Rule 1 (the provider-fault transfer applies only before treatment starts). The admin's In Progress and Aftercare actions (move to Aftercare with reassignment, cancel, or reassign the aftercare provider or team) belong to FR-006."}}
  - {"op": "add_node", "id": "REQ-005-047", "type": "Rule", "owner_fr": "FR-005", "title": "Comparison panel needs at least two selected subquotes", "attrs": {"statement": "The comparison panel renders only when at least two subquotes are selected.", "rationale": "Stated in the Screen 1 list and comparison panel heading and the Comparison View field."}}
  - {"op": "add_node", "id": "REQ-005-048", "type": "Rule", "owner_fr": "FR-005", "title": "Comparison panel follows the current parent version", "attrs": {"statement": "The comparison panel always shows the current parent quote version. If the provider re-versions a parent quote, the panel refreshes to the current version; if a compared subquote no longer exists or becomes ineligible, it drops out of the panel and the patient is told why."}}
  - {"op": "add_node", "id": "REQ-005-049", "type": "Rule", "owner_fr": "FR-005", "title": "Accept available from the dashboard and the detail", "attrs": {"statement": "Patient can view subquote details and accept an eligible subquote directly from the dashboard; Accept is enabled only for a current eligible subquote.", "rationale": "Screen 1 business rules and the per-subquote Actions field (View Details and Accept)."}}
  - {"op": "add_node", "id": "REQ-005-050", "type": "Rule", "owner_fr": "FR-005", "title": "Subquote price display", "attrs": {"statement": "Each subquote shows the offered price as entered by the provider, before any promotion (FR-004), with the price after promotion shown next to it when a promotion applies; a structured promotion attached to the subquote shows its discount separately from the offered price, with its terms when present. Prices use the parent quote currency snapshot and cannot be edited by the patient.", "rationale": "Screen 1 per-subquote Price and Promotion fields."}}
  - {"op": "add_node", "id": "REQ-005-051", "type": "Rule", "owner_fr": "FR-005", "title": "Price per graft", "attrs": {"statement": "Price per graft is the subquote price divided by the inherited graft count; it is calculated and non-editable."}}
  - {"op": "add_node", "id": "REQ-005-052", "type": "Rule", "owner_fr": "FR-005", "title": "Subquote state derived from lifecycle", "attrs": {"statement": "Subquote state is Available, Accepted, Not Selected, Expired, Withdrawn, or Cancelled, derived from the parent and subquote lifecycle; exactly one subquote across the inquiry is Accepted.", "rationale": "Screen 1 per-subquote State field and Screen 4 Subquote Outcome field."}}
  - {"op": "add_node", "id": "REQ-005-053", "type": "Rule", "owner_fr": "FR-005", "title": "Sort and filter options and default", "attrs": {"statement": "Sort options are Price (Low–High), Price (High–Low), Graft Count, Rating, Appointment Date, and Quote Date; subquotes can be filtered by patient-submitted date range; the default sort is Quote Date (most recent). Criteria evaluate the complete subquote plus inherited parent and provider values.", "rationale": "Screen 1 Sort & Filter field; the currency handling for price sorting is REQ-005-027."}}
  - {"op": "add_node", "id": "REQ-005-054", "type": "Rule", "owner_fr": "FR-005", "title": "Subquote detail read-only and current", "attrs": {"statement": "All relevant parent quote and subquote details from FR-004 Screen 4 are displayed read-only on the subquote detail, which reflects the latest provider edits.", "rationale": "Screen 2 business rules and the Inherited Parent Context field."}}
  - {"op": "add_node", "id": "REQ-005-055", "type": "Rule", "owner_fr": "FR-005", "title": "Accept opens the confirmation modal", "attrs": {"statement": "Tapping Accept on a subquote detail screen opens the confirmation modal with the complete subquote summary, inherited context, and next steps.", "rationale": "Screen 2 and Screen 3 business rules; Main Flow step 4."}}
  - {"op": "add_node", "id": "REQ-005-056", "type": "Rule", "owner_fr": "FR-005", "title": "Idempotent confirmation", "attrs": {"statement": "Confirmation is idempotent: duplicate confirmations do nothing, and repeat requests keyed to the inquiry and accepted subquote do not create multiple accepted states; after a network loss during acceptance the system retries safely with no duplicate accept states.", "rationale": "Screen 3 business rules, the network-loss edge case, and the implementation note on idempotent acceptance."}}
  - {"op": "add_node", "id": "REQ-005-057", "type": "Rule", "owner_fr": "FR-005", "title": "Confirmation modal exits", "attrs": {"statement": "After confirmation the modal closes and the patient is directed to the booking/payment entry; the patient can cancel to return to the quote detail screen.", "rationale": "Screen 3 business rules and the Confirm and Cancel actions (Cancel is always available)."}}
  - {"op": "add_node", "id": "REQ-005-058", "type": "Rule", "owner_fr": "FR-005", "title": "Selected provider sees the accepted terms from the snapshot", "attrs": {"statement": "The selected provider sees the package, date range, appointment details, price, currency, and promotion accepted from it, read from the acceptance snapshot; this is shown only to the selected provider and is read-only.", "rationale": "Screen 4 Selected Subquote field."}}
  - {"op": "add_node", "id": "REQ-005-059", "type": "Rule", "owner_fr": "FR-005", "title": "Oversight status derived from booking cancellation and supersession", "attrs": {"statement": "Admin oversight status is active, booking cancelled (derived from the FR-006 booking cancellation, with no supersession record), or superseded (provider fault, including provider suspension or deactivation, derived from linked supersession records). \"Superseded — Provider Fault\" links to the replacement admin-authored acceptance record; \"Booking Cancelled\" is read from the FR-006 booking cancellation and links to its audit trail.", "rationale": "Screen 5 Global Acceptance Table and Supersession Indicator fields."}}
  - {"op": "add_node", "id": "REQ-005-060", "type": "Rule", "owner_fr": "FR-005", "title": "Soft deletes only", "attrs": {"statement": "All deletes are soft deletes; no hard deletes are permitted.", "rationale": "Business Rule 6, the fixed-in-codebase soft delete policy, and the Shared Services retention/archival utilities."}}
  - {"op": "add_node", "id": "REQ-005-061", "type": "Rule", "owner_fr": "FR-005", "title": "Confirmation copy content-managed; legal text central", "attrs": {"statement": "Acceptance confirmation copy and UX notes are content-managed; legal text and terms acknowledgment text are controlled centrally (A-09 system settings).", "rationale": "Admin Editability (configurable with restrictions), the A-09 dependency, and the business process assumption."}}
  - {"op": "add_node", "id": "REQ-005-062", "type": "Rule", "owner_fr": "FR-005", "title": "Acceptance binds the exact appointment and price", "attrs": {"statement": "Patient acceptance of the subquote constitutes acceptance of its exact appointment and price. FR-006 must not ask the patient to select another package, date range, appointment, or quote price."}}
  - {"op": "add_node", "id": "REQ-005-063", "type": "Rule", "owner_fr": "FR-005", "title": "No patient decline action", "attrs": {"statement": "Patients do not have an explicit \"decline\" action; sibling subquotes become Not Selected and competing parent quotes auto-cancel on acceptance or expire by policy.", "rationale": "Promoted from the user behavior assumptions because it is a business rule."}}
  - {"op": "add_node", "id": "REQ-005-064", "type": "Rule", "owner_fr": "FR-005", "title": "Mistaken cancellation has no restore", "attrs": {"statement": "When an admin finds a quote or subquote was cancelled by mistake, no restore action exists: the admin records the finding as an audited annotation, prior acceptance is not overridden, and the patient uses the recovery routes in Alternative Flows A1 and A7."}}
  # --- Settings read from FR-026 (owned by FR-026)
  - {"op": "add_node", "id": "SET-slot-hold-duration", "type": "Setting", "owner_fr": "FR-026", "title": "Slot-hold duration", "attrs": {"description": "Versioned, audited duration of the fixed exclusive slot hold placed at acceptance (keyed by provider, appointment date/time, and time zone), starting at acceptance. Stub created during FR-005 migration; detail arrives when FR-026 migrates.", "default": "48", "unit": "hours"}}
  - {"op": "add_node", "id": "SET-acceptance-terms-text", "type": "Setting", "owner_fr": "FR-026", "title": "Acceptance legal copy and terms acknowledgment text", "attrs": {"description": "Centrally managed legal copy and terms acknowledgment text shown at acceptance (A-09 system settings, which the PRD ties to FR-026). Stub created during FR-005 migration; detail arrives when FR-026 migrates."}}
  # --- FR-005 entities: stub descriptions replaced, new entities added
  - {"op": "update_node", "id": "ENT-subquote", "attrs": {"description": "Atomic unit displayed, compared, and accepted by the patient. Resolves one FR-004 Quote Option and one applicable Option/date-price record; neither underlying record is accepted independently. Its version is the owning parent quote's aggregate QuoteVersion (no independent revision counter). Inherits provider and shared treatment/clinical context from exactly one parent Quote. FR-005 owns id and state."}}
  - {"op": "update_node", "id": "ENT-acceptance-event", "attrs": {"description": "Append-only record of one subquote acceptance: never edited, deleted, or restored. Supersession and admin notes are separate linked records. An admin-authored replacement event (actorType = admin) references an admin-authored FR-004 replacement quote, Quote Option, and option/date-price row like any other event. Belongs to an Inquiry, the accepted parent Quote, and the accepted Subquote."}}
  - {"op": "add_node", "id": "ENT-acceptance-supersession", "type": "Entity", "owner_fr": "FR-005", "title": "Acceptance supersession", "attrs": {"description": "Linked, append-only record that marks an AcceptanceEvent superseded without editing it. Inserted only at a provider-fault replacement acceptance, once, and never updated; no other event (including admin cancellation) writes one."}}
  - {"op": "add_node", "id": "ENT-acceptance-annotation", "type": "Entity", "owner_fr": "FR-005", "title": "Acceptance annotation", "attrs": {"description": "Audited, append-only admin note or correction next to an AcceptanceEvent; never alters the AcceptanceEvent, its snapshot, or any state."}}
  - {"op": "add_node", "id": "ENT-audit-entry", "type": "Entity", "owner_fr": "FR-005", "title": "Audit entry", "attrs": {"description": "Immutable audit entry for an acceptance-related state transition (who, when, what, reason). The PRD lists it under FR-005 Key Entities and names the S-06 audit logging service; no other owner is named."}}
  # --- Entities owned by other FRs that FR-005 reads or writes (stubs)
  - {"op": "add_node", "id": "ENT-slot-hold", "type": "Entity", "owner_fr": "FR-006", "title": "Slot hold", "attrs": {"description": "Fixed exclusive hold on an appointment slot keyed by provider, appointment date/time, and time zone, acquired at acceptance; not an appointment record. Stub created during FR-005 migration; detail arrives when FR-006 migrates."}}
  - {"op": "add_node", "id": "ENT-provider-review-summary", "type": "Entity", "owner_fr": "FR-013", "title": "Provider review summary", "attrs": {"description": "Provider review rating and count shown in comparison. Stub created during FR-005 migration; detail arrives when FR-013 migrates."}}
  # --- Events
  - {"op": "add_node", "id": "EVT-quote-accepted", "type": "Event", "owner_fr": "FR-005", "title": "Quote accepted", "attrs": {"description": "quote.accepted: emitted at acceptance. Outcome notices go to providers only, never to the patient: one notice per sent parent quote (selected or not selected); an unsent draft cancelled because another quote was accepted produces no notice; non-selected notices never reveal the selected provider or accepted price. Also sent to the replacement provider at an admin-authored replacement acceptance. Delivered through FR-020."}}
  - {"op": "add_node", "id": "EVT-booking-handoff", "type": "Event", "owner_fr": "FR-005", "title": "Booking handoff", "attrs": {"description": "Accepted subquote handoff payload sent to FR-006 Booking & Payment at acceptance; the accepted subquote is the atomic commercial input and its inherited context is resolved from its parent quote. No funds are collected in FR-005.", "payload": "AcceptanceEvent, accepted parent quote ID/version, accepted subquote ID/version, immutable acceptance snapshot, and the pre-scheduled slot (slot-hold reference)"}}
  - {"op": "add_node", "id": "EVT-booking-scheduled", "type": "Event", "owner_fr": "FR-006", "title": "Booking scheduled", "attrs": {"description": "booking.scheduled (\"Booking Accepted — Slot Held (Pending Payment)\"): the patient's only notice at acceptance; sent to the patient only and mandatory (cannot be disabled); also fires on an admin-authored replacement acceptance. Stub created during FR-005 migration; detail arrives when FR-006 migrates."}}
  # --- FR-005 stub fields reused (names are immutable): titles, descriptions and derivation updated
  - {"op": "update_node", "id": "ENT-subquote.acceptance_state", "title": "State", "attrs": {"description": "Subquote state (Key Entities `state`; the field name acceptance_state was set during FR-004 migration and is immutable). FR-005 owns it; derived from the parent and subquote lifecycle; exactly one Accepted across the inquiry."}}
  - {"op": "update_field", "id": "ENT-subquote.acceptance_state", "required": true, "calculated_by": "REQ-005-052"}
  - {"op": "update_node", "id": "ENT-acceptance-event.snapshot", "attrs": {"description": "acceptanceSnapshot: immutable copy of the complete subquote plus inherited parent context at acceptance, including the exchange rate and its timestamp and any patient-applied promotion code and discounted price (REQ-005-006). Price, currency, date range, appointment, and promotion are the binding fields read by downstream modules. Shown read-only as reference on FR-004 Screen 8 and on FR-005 Screens 4 and 5."}}
  # --- Fields (defined once, on their Entity)
  - {"op": "add_field", "id": "ENT-subquote.id", "entity_id": "ENT-subquote", "name": "id", "data_type": "id", "title": "Subquote ID", "owner_fr": "FR-005", "required": true, "calculated_by": "REQ-005-018", "attrs": {"description": "Derived deterministically from quoteOptionId and optionDatePriceId, so it stays the same across parent re-versions while both records exist. FR-005 owns it."}}
  - {"op": "add_field", "id": "ENT-subquote.parent_quote_id", "entity_id": "ENT-subquote", "name": "parent_quote_id", "data_type": "id", "title": "Parent quote ID", "owner_fr": "FR-005", "required": true, "attrs": {"description": "The one parent Quote the subquote belongs to and inherits from."}}
  - {"op": "add_field", "id": "ENT-subquote.quote_option_id", "entity_id": "ENT-subquote", "name": "quote_option_id", "data_type": "id", "title": "Quote Option ID", "owner_fr": "FR-005", "required": true, "attrs": {"description": "The one FR-004 Quote Option this subquote resolves."}}
  - {"op": "add_field", "id": "ENT-subquote.option_date_price_id", "entity_id": "ENT-subquote", "name": "option_date_price_id", "data_type": "id", "title": "Option/date-price ID", "owner_fr": "FR-005", "required": true, "attrs": {"description": "The one FR-004 Option/date-price record this subquote resolves."}}
  - {"op": "add_field", "id": "ENT-subquote.version", "entity_id": "ENT-subquote", "name": "version", "data_type": "int", "title": "Subquote version", "owner_fr": "FR-005", "required": true, "calculated_by": "REQ-005-019", "attrs": {"description": "Equals the owning parent quote's aggregate QuoteVersion; no independent revision counter."}}
  - {"op": "add_field", "id": "ENT-subquote.package_snapshot", "entity_id": "ENT-subquote", "name": "package_snapshot", "data_type": "json", "title": "Package snapshot", "owner_fr": "FR-005", "required": true, "attrs": {"description": "Selected package snapshot: package name, description, and source/version provenance."}}
  - {"op": "add_field", "id": "ENT-subquote.included_and_custom_services", "entity_id": "ENT-subquote", "name": "included_and_custom_services", "data_type": "json", "title": "Included and custom services", "owner_fr": "FR-005", "required": true, "attrs": {"description": "Read-only quote-owned snapshot of services included in this subquote."}}
  - {"op": "add_field", "id": "ENT-subquote.date_range", "entity_id": "ENT-subquote", "name": "date_range", "data_type": "date range", "title": "Date range", "owner_fr": "FR-005", "required": true, "attrs": {"description": "Exactly one applicable patient-requested treatment range."}}
  - {"op": "add_field", "id": "ENT-subquote.appointment_at", "entity_id": "ENT-subquote", "name": "appointment_at", "data_type": "datetime", "title": "Appointment date and time", "owner_fr": "FR-005", "required": true, "attrs": {"description": "Provider-defined appointment; must fall within the subquote date range."}}
  - {"op": "add_field", "id": "ENT-subquote.appointment_timezone", "entity_id": "ENT-subquote", "name": "appointment_timezone", "data_type": "text", "title": "Appointment time zone", "owner_fr": "FR-005", "required": true, "attrs": {"description": "Time zone of the provider-defined appointment."}}
  - {"op": "add_field", "id": "ENT-subquote.offered_price", "entity_id": "ENT-subquote", "name": "offered_price", "data_type": "money", "title": "Offered price", "owner_fr": "FR-005", "required": true, "attrs": {"description": "Price entered by the provider, before any promotion (FR-004), in the parent quote currency snapshot; no patient editing."}}
  - {"op": "add_field", "id": "ENT-subquote.promotion_snapshot", "entity_id": "ENT-subquote", "name": "promotion_snapshot", "data_type": "json", "title": "Promotion", "owner_fr": "FR-005", "required": false, "attrs": {"description": "Structured promotion attached to this subquote, with its discount shown separately from the offered price and its terms when present."}}
  - {"op": "add_field", "id": "ENT-subquote.treatment_plan", "entity_id": "ENT-subquote", "name": "treatment_plan", "data_type": "json", "title": "Treatment plan", "owner_fr": "FR-005", "required": true, "attrs": {"description": "Relative day-to-day plan; inherits the appointment as the schedule anchor; no stored calendar dates are derived here."}}
  - {"op": "add_field", "id": "ENT-subquote.price_per_graft", "entity_id": "ENT-subquote", "name": "price_per_graft", "data_type": "money", "title": "Price per graft", "owner_fr": "FR-005", "required": true, "calculated_by": "REQ-005-051", "attrs": {"description": "Subquote price divided by the inherited graft count; calculated, non-editable. Added for the Screen 1 and comparison fields."}}
  - {"op": "add_field", "id": "ENT-subquote.price_after_promotion", "entity_id": "ENT-subquote", "name": "price_after_promotion", "data_type": "money", "title": "Price after promotion", "owner_fr": "FR-005", "required": false, "calculated_by": "REQ-005-050", "attrs": {"description": "Shown next to the offered price when a promotion applies. Added for the Screen 1 Price field."}}
  - {"op": "add_field", "id": "ENT-acceptance-event.id", "entity_id": "ENT-acceptance-event", "name": "id", "data_type": "id", "title": "Acceptance event ID", "owner_fr": "FR-005", "required": true}
  - {"op": "add_field", "id": "ENT-acceptance-event.inquiry_id", "entity_id": "ENT-acceptance-event", "name": "inquiry_id", "data_type": "id", "title": "Inquiry ID", "owner_fr": "FR-005", "required": true}
  - {"op": "add_field", "id": "ENT-acceptance-event.accepted_parent_quote_id", "entity_id": "ENT-acceptance-event", "name": "accepted_parent_quote_id", "data_type": "id", "title": "Accepted parent quote ID", "owner_fr": "FR-005", "required": true}
  - {"op": "add_field", "id": "ENT-acceptance-event.accepted_parent_quote_version", "entity_id": "ENT-acceptance-event", "name": "accepted_parent_quote_version", "data_type": "int", "title": "Accepted parent quote version", "owner_fr": "FR-005", "required": true}
  - {"op": "add_field", "id": "ENT-acceptance-event.accepted_subquote_id", "entity_id": "ENT-acceptance-event", "name": "accepted_subquote_id", "data_type": "id", "title": "Accepted subquote ID", "owner_fr": "FR-005", "required": true}
  - {"op": "add_field", "id": "ENT-acceptance-event.accepted_subquote_version", "entity_id": "ENT-acceptance-event", "name": "accepted_subquote_version", "data_type": "int", "title": "Accepted subquote version", "owner_fr": "FR-005", "required": true, "calculated_by": "REQ-005-006", "attrs": {"description": "MUST equal acceptedParentQuoteVersion: both identify the same FR-004 aggregate revision."}}
  - {"op": "add_field", "id": "ENT-acceptance-event.quote_option_id", "entity_id": "ENT-acceptance-event", "name": "quote_option_id", "data_type": "id", "title": "Quote Option ID", "owner_fr": "FR-005", "required": true}
  - {"op": "add_field", "id": "ENT-acceptance-event.option_date_price_id", "entity_id": "ENT-acceptance-event", "name": "option_date_price_id", "data_type": "id", "title": "Option/date-price ID", "owner_fr": "FR-005", "required": true}
  - {"op": "add_field", "id": "ENT-acceptance-event.reserved_slot_id", "entity_id": "ENT-acceptance-event", "name": "reserved_slot_id", "data_type": "id", "title": "Reserved slot ID", "owner_fr": "FR-005", "required": true, "attrs": {"description": "References the fixed slot hold keyed by provider, appointment date/time, and time zone; it is not an appointment record."}}
  - {"op": "add_field", "id": "ENT-acceptance-event.actor_id", "entity_id": "ENT-acceptance-event", "name": "actor_id", "data_type": "id", "title": "Actor ID", "owner_fr": "FR-005", "required": true}
  - {"op": "add_field", "id": "ENT-acceptance-event.actor_type", "entity_id": "ENT-acceptance-event", "name": "actor_type", "data_type": "enum", "title": "Actor type", "owner_fr": "FR-005", "required": true, "attrs": {"description": "Patient, or admin for a provider-fault transfer record."}}
  - {"op": "add_field", "id": "ENT-acceptance-event.accepted_at", "entity_id": "ENT-acceptance-event", "name": "accepted_at", "data_type": "datetime", "title": "Accepted at", "owner_fr": "FR-005", "required": true}
  - {"op": "add_field", "id": "ENT-acceptance-event.handoff_metadata", "entity_id": "ENT-acceptance-event", "name": "handoff_metadata", "data_type": "json", "title": "Handoff metadata", "owner_fr": "FR-005", "required": false}
  - {"op": "add_field", "id": "ENT-acceptance-event.promotion_code", "entity_id": "ENT-acceptance-event", "name": "promotion_code", "data_type": "text", "title": "Patient-applied promotion code", "owner_fr": "FR-005", "required": false, "attrs": {"description": "Entered by the patient on Screen 2 for one named subquote before acceptance, validated through FR-019, recorded against the patient's selection only (never on the provider's quote or promotion records), and frozen into the acceptance snapshot. Added for the Screen 2 Promotion Code field."}}
