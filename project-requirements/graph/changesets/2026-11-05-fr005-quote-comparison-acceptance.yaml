  # --- Screens
  - {"op": "add_node", "id": "SCR-005-01", "type": "Screen", "owner_fr": "FR-005", "title": "Inquiry Dashboard with Quote Comparison", "attrs": {"platform": "patient", "description": "Extends FR-003 Screen 8. Patient views submitted inquiry status (stage, timeline, summary, medical alerts, deadlines, next actions), browses parent quotes grouped under providers, compares complete subquotes side by side, and accepts one subquote. Parent quote groups show provider, reference, shared clinical information, reviews, credentials, the expiry timer and a Message Provider button that opens the FR-012 conversation. Each subquote card offers View Details and Accept. Sort and filter controls and Compare checkboxes (at most three) sit above the list; the comparison panel renders only when at least two subquotes are selected."}}
  - {"op": "add_node", "id": "SCR-005-02", "type": "Screen", "owner_fr": "FR-005", "title": "Subquote Detail with Accept Action", "attrs": {"platform": "patient", "description": "Extends FR-004 Screen 4 (Quote Review). Patient views one complete subquote with inherited parent context read-only, may enter a promotion code for this subquote, acknowledges the terms, and taps Accept, which opens the confirmation modal."}}
  - {"op": "add_node", "id": "SCR-005-03", "type": "Screen", "owner_fr": "FR-005", "title": "Acceptance Confirmation Modal", "attrs": {"platform": "patient", "description": "Confirms acceptance and shows next steps (Booking & Payment handoff information) before finalizing. Confirm finalizes when eligible; Cancel returns to the subquote detail. Shows the slot-taken error state when the slot is taken first."}}
  - {"op": "add_node", "id": "SCR-005-04", "type": "Screen", "owner_fr": "FR-005", "title": "Quote Outcome Notification", "attrs": {"platform": "provider", "description": "Read-only. Informs the provider of the acceptance outcome for each parent quote and its subquotes; only the selected provider sees the accepted selection; a non-selected reason never identifies another provider or the accepted price; links to version/audit history."}}
  - {"op": "add_node", "id": "SCR-005-05", "type": "Screen", "owner_fr": "FR-005", "title": "Acceptance Oversight Dashboard", "attrs": {"platform": "admin", "description": "Admin monitors all subquote acceptance events with status filters (active, booking cancelled, superseded), views the immutable accepted selection, supersession or booking-cancelled indicator, flagged conflicts, and annotations, and adds audited notes or corrections with a reason. No delete or restore action exists."}}
