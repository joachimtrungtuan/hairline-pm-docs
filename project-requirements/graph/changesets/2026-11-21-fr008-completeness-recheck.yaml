  - {"op": "add_node", "id": "REQ-008-077", "type": "Rule", "title": "Overall Status of the travel record is worked out from the submitted items", "owner_fr": "FR-008", "attrs": {"statement": "The system MUST work out the booking's Overall Status shown on the admin travel record screen as follows. Pending: nothing has been submitted. Partially submitted: some required items are in, or an item is marked Incomplete by an admin. Complete: all required items are in and none is marked Incomplete. Required items are the passport, flight and hotel for Path A, and the flight and hotel for Path B, counting only items the accepted option includes.", "rationale": "prd.md lines 669, 768 (Screen 12 Overall Status badge and its derivation)."}}
