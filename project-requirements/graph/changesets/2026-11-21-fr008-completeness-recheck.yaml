  - {"op": "update_node", "id": "REQ-008-064", "attrs": {"statement": "The provider Travel section MUST show status badges for the passport (Path A only; Awaiting, Submitted or Incomplete), the outbound flight, the return flight and the hotel (Not included, Awaiting or Submitted), updated in real time on submission and on admin correction, and MUST show the Awaiting states immediately when the booking becomes Confirmed. In Path A, View Passport appears, and Enter Flight and Enter Hotel appear only for included services that have not yet been submitted; services not included show 'Not included' with no entry action. In Path B only View Travel Details (read-only) is shown and the provider cannot enter or modify records."}}
  - {"op": "update_node", "id": "REQ-008-061", "attrs": {"statement": "A closed TravelContext MUST reject new passport, flight and hotel records, patient re-notification and admin corrections; its records stay read-only with their audit history, and Enter Flight, Enter Hotel, Re-notify patient, Confirm Travel Dates and Apply Correction are not available. The patient itinerary is then read-only and shows no submission links. Any external flight or hotel cancellation is coordinated outside the platform under the governing booking policy; FR-008 MUST NOT calculate refunds or cancellation fees.", "rationale": "prd.md lines 431, 464, 650, 807 (checked against the PRD text)."}}
