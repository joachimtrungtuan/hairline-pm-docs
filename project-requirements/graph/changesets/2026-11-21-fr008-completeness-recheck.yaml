  - {"op": "add_node", "id": "REQ-008-081", "type": "Rule", "title": "Admin travel record screen shows an empty state and the Re-notify button for a tab with nothing submitted", "owner_fr": "FR-008", "attrs": {"statement": "On the admin travel record screen, a tab with nothing submitted MUST show 'Awaiting submission'. The Passport tab then offers the Re-notify patient button, while the Flight and Hotel tabs offer Re-notify patient only in Path B because Path A flight and hotel entry is provider-owned. When no return flight record exists the Flight tab MUST show 'Return flight not yet submitted'.", "rationale": "prd.md lines 694, 727, 731, 761 (Screen 12 empty states and Re-notify availability)."}}
