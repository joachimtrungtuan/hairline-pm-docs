reason: "FR-035 completeness re-check 2026-11-21: behaviours that lived only in Rule rationale text move into the Rule statement (FAQ topic header and answer display, All default filter, thank-you confirmation, 2 to 4 related items, resource preview and download, transcript view, no-results message, resolution summary condition, title never auto-generated, retry with backoff), and four screen behaviours get their own Rule (Create New Ticket button, empty thread message, attachment thumbnail with remove, text sanitisation)"
by: controller
operations:
  # Statements extended from the PRD as it reads today (rationale text is kept as is)
  - {"op": "update_node", "id": "REQ-035-003", "attrs": {"statement": "System MUST display FAQ content in collapsible accordion sections organized by admin-defined topics (FR-033 REQ-033-006); each topic header shows the topic name and item count and expands or collapses on tap; an FAQ answer expands inline or opens an FAQ detail view, and supports formatted text and inline images"}}
  - {"op": "update_node", "id": "REQ-035-004", "attrs": {"statement": "System MUST display article content with subtype filtering (Tutorial Guides, Troubleshooting Tips); the filter chips are All (the default), Tutorial Guides and Troubleshooting Tips"}}
  - {"op": "update_node", "id": "REQ-035-005", "attrs": {"statement": "System MUST support in-app video playback for video tutorials with play/pause, seek, and fullscreen controls; the transcript link, when present, opens the transcript in a scrollable text view"}}
  - {"op": "update_node", "id": "REQ-035-006", "attrs": {"statement": "System MUST support in-app file preview and download for resource documents; the preview shows at least the first page, and Download shows a progress indicator and saves the file to the device downloads folder"}}
  - {"op": "update_node", "id": "REQ-035-007", "attrs": {"statement": "System MUST provide \"Was this helpful?\" binary feedback on all content types, with feedback aggregated anonymously at the content level (FR-033 Privacy Rule 2); tapping Yes or No shows the confirmation \"Thank you for your feedback\""}}
  - {"op": "update_node", "id": "REQ-035-008", "attrs": {"statement": "System MUST display 2 to 4 related content suggestions (admin-configured via FR-033) that may cross content types"}}
  - {"op": "update_node", "id": "REQ-035-009", "attrs": {"statement": "System MUST allow patients to submit support requests via Contact Support form with title (10-200 chars, entered by the patient and never auto-generated), category, description (20-5000 chars), priority, and optional file attachments (FR-034 REQ-034-020, REQ-034-030, REQ-034-031, REQ-034-035)"}}
  - {"op": "update_node", "id": "REQ-035-021", "attrs": {"statement": "System MUST display resolution summary when the case is Resolved or Closed and admin has provided one (FR-034 REQ-034-059, REQ-034-060)"}}
  - {"op": "update_node", "id": "REQ-035-038", "attrs": {"statement": "Patient taps No on Was this helpful? or sees no search results; System displays Still need help? Contact Support CTA, and the no-results message \"No results for '[query]'. Try different keywords or Contact Support.\"; Patient taps Contact Support; System displays Contact Support form (Screen 5)."}}
  - {"op": "update_node", "id": "REQ-035-062", "attrs": {"statement": "A support request submitted while offline is queued locally and submitted when connectivity is restored, with clear indication to the patient; a submission to FR-034 that fails with a server error (5xx) is retried with exponential backoff."}}
  # New Rules for screen behaviours that were not carried by any Rule
  - {"op": "add_node", "id": "REQ-035-086", "type": "Rule", "owner_fr": "FR-035", "title": "Create New Ticket button always visible and returns to the list", "attrs": {"statement": "The Create New Ticket button on My Support Tickets is always visible and opens the Contact Support form (Screen 5); on successful submission the patient sees the confirmation and then returns to the ticket list (Screen 3).", "rationale": "prd.md lines 357 (Screen 3 Create New Ticket Button: opens Contact Support Form, confirmation then returns to the ticket list, always visible)."}}
