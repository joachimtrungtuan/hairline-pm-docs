  - {"op": "update_node", "id": "ENT-booking.support_required_resolution", "attrs": {"description": "Audited admin resolution of the supportRequired marker. Resolved once, when the chosen route completes: the aftercare reassignment submit (FR-011 Screen 19), the Cancel Booking submit (Screen 9), or the in-progress fault route; the Screen 11 decision only records the choice."}}
  - {"op": "add_edge", "from": "STP-006-606", "verb": "next", "to": "STP-006-001", "attrs": {"label": "the replacement booking is paid through the main flow"}}
  - {"op": "update_node", "id": "REQ-006-060", "attrs": {"statement": "`Accepted` (subquote accepted, awaiting payment) → `Confirmed` (deposit paid) → `In Progress` (procedure started, via FR-010) → `Aftercare` (treatment complete, or closed early by an admin decision on Screen 11; aftercare active via FR-011) → `Completed` (aftercare complete / final review submitted). An `In Progress` booking with a provider fault moves to `Aftercare` only through the admin decision on Screen 11 (Alternative Flow B7), and the decision date is then the aftercare start date handed to FR-011. From `Accepted`, hold expiry transitions to `Payment Window Expired`. From `Payment Window Expired`, only the audited admin revive returns the booking to `Accepted` with a new hold. `Confirmed` is a booking status only, never a quote status. `supportRequired` is a marker, not a status."}}
  - {"op": "update_node", "id": "REQ-006-061", "attrs": {"statement": "**Cancelled entries** (source state, actor, cause): (1) `Accepted`, `Payment Window Expired`, `Confirmed`, `In Progress`, or `Aftercare` → `Cancelled` by admin cancellation (Screen 9), including support-routed patient requests, with the admin's reason; the inquiry also becomes `Cancelled` and the accepted quote stays `accepted` (Alternative Flows B2 and B3). (2) `Accepted` or `Confirmed` → `Cancelled` at the admin submit of the provider-fault transfer, cause `ProviderFault` (Alternative Flow B5). (3) `Accepted` or `Confirmed` → `Cancelled` by the system on an effective provider suspension or deactivation, cause `ProviderSuspended` or `ProviderDeactivated` with `supportRequired = true` (Alternative Flow B4), followed by the B5 transfer. (4) `Confirmed` → `Cancelled` by the system, cause `UnpaidBalance`, when the unpaid balance of a booking paid with the Installments option is still unpaid at the cancellation point set in FR-029; the inquiry also becomes `Cancelled`, the refund ladder applies, and the rule is inactive until that point is set (Alternative Flow B8). A provider fault or provider-status event while `In Progress` does not cancel the booking; it stays `In Progress` with `supportRequired` until the admin moves it to `Aftercare` with an aftercare reassignment or cancels it through entry (1) (Alternative Flow B7). A provider fault or provider-status event during `Aftercare` does not cancel the booking; it stays `Aftercare` and follows the aftercare reassignment (Alternative Flow B6). `Completed` and `Cancelled` are terminal."}}
  - {"op": "update_node", "id": "REQ-006-062", "attrs": {"statement": "(1) Post-acceptance hold expiry without successful first payment (FR-026 duration, 48h default), (2) Admin cancellation during the hold period, including a support-routed patient request (immediate release per B3 flow), (3) Admin booking cancellation per B2 flow, (4) Provider suspension/deactivation cascade per B4 flow (immediate release, including holds with time remaining), (5) Provider fault before treatment starts per B5 flow, released at the admin submit on Screen 10, (6) Admin appointment change per Screen 8 or an admin edit of the accepted quote date (the hold or block moves to the new appointment), (7) System cancellation for an unpaid balance per B8 flow (the calendar block is released)."}}
  - {"op": "update_node", "id": "REQ-006-017", "attrs": {"statement": "Admin MAY revive a `Payment Window Expired` booking to `Accepted` only through Screen 7 with a mandatory reason, a slot availability re-check, a check that the appointment is later than the new payment deadline, a new hold of the FR-026 duration, one promotion use taken again where the accepted promotion has a usage limit (re-reserved for a provider-selected promotion or patient code, taken again for an automatic promotion; the revive is rejected if the limit has no room), an audit entry, an unchanged AcceptanceEvent, and a mandatory \"booking revived\" notice to patient and provider. A revive MUST NOT extend the expired hold; it starts a new one, and the initial payment then MUST pass the Initial Payment Guard (REQ-007-017) against that new hold. Appointment date changes MUST be made through Screen 8 or the admin edit of the accepted quote's date range or appointment (REQ-005-023), both running the same checks (provider `Active`, slot availability, a feasible FR-007B plan recalculation), MUST NOT apply the FR-029 rescheduling fee, MUST update the booking's current appointment while the acceptance snapshot keeps the accepted baseline, MUST send `booking.rescheduled`, and MUST trigger an FR-008 travel review for any travel records already linked to the booking. No other manual status change is allowed."}}
  - {"op": "update_node", "id": "REQ-006-020", "attrs": {"statement": "System MUST block an admin revive (Screen 7), an admin appointment change (Screen 8), and an admin-authored replacement acceptance (Screen 10) when the provider concerned is `Suspended` or `Deactivated` at submit, MUST change nothing, and MUST show the action-specific message that directs the admin to cancel the booking, to the provider-fault transfer, or to another replacement provider (Admin Status and Date Intervention Rules; FR-015 Rule 9). The messages are: revive, \"This provider is suspended or deactivated, so this booking cannot be revived. Cancel the booking instead.\"; appointment change, \"This provider is suspended or deactivated, so this appointment cannot be changed. Use the provider-fault transfer instead.\"; replacement acceptance, \"This provider is suspended or deactivated, so this replacement quote cannot be accepted. Choose another replacement provider.\""}}
  - {"op": "update_node", "id": "REQ-006-067", "attrs": {"statement": "The provider pre-schedules the appointment in the subquote; acceptance fixes the chosen appointment and reserves its slot, and successful payment confirms the booking. Rescheduling functionality will be evaluated for V2 based on business needs. The patient cannot reschedule. Date changes require the audited admin appointment change (Screen 8) or the admin edit of the accepted quote's date range or appointment (REQ-005-023), each of which sends `booking.rescheduled`, or an admin cancellation per cancellation policy. The FR-029 rescheduling fee does not apply to an admin-made change, because the admin, not the patient, initiates it."}}
  - {"op": "update_node", "id": "REQ-006-004", "attrs": {"statement": "System MUST enforce the cancellation policy, with refunds following the refund ladder set in FR-029 (rescheduling deferred to V2). Apart from the unpaid-balance case in REQ-006-016, only an admin MAY cancel a booking, from `Accepted`, `Payment Window Expired`, `Confirmed`, `In Progress`, or `Aftercare`, with a mandatory reason, confirmation, and audit entry; the booking and inquiry MUST become `Cancelled`, the accepted quote MUST stay `accepted`, and `booking.cancelled` MUST be sent. The refund MUST follow REQ-006-053. The patient MUST NOT have an in-app cancel action from acceptance onward and MUST be offered \"Contact support\" instead."}}
  - {"op": "update_node", "id": "REQ-006-011", "attrs": {"statement": "System MUST integrate with Notification Service for confirmations, reminders, and policy notices, and MUST trigger these FR-030 events: `booking.scheduled` (sent on patient acceptance and on an admin-authored replacement acceptance), `booking.rescheduled` (sent on an admin appointment change), `booking.cancelled` (sent on any booking cancellation with the reason or cause: an admin cancellation, a provider drop-out at the Screen 10 submit, and a system cancellation for an unpaid balance; not for a provider withdrawal, which FR-004 announces through `quote.withdrawn`), `booking.hold_expiring_soon`, `booking.payment_window_expired`, `booking.revived`, `booking.provider_fault_replacement`, `booking.confirmed` (sent when the first payment confirms the booking), and `booking.appointment_reminder` (sent ahead of a confirmed appointment). Recipients, message content, and whether each notice is mandatory are owned by the notification Rules in FR-020 (for example REQ-020-021) and FR-030 and are not restated here. FR-004 is the only producer of `quote.withdrawn`; FR-006 does not emit it and reacts to it by starting the provider-fault transfer in Alternative Flow B5."}}
  - {"op": "update_node", "id": "REQ-006-016", "attrs": {"statement": "`Payment Window Expired` MUST apply only to the first payment step (acceptance to deposit or first installment). A missed later installment or final payment MUST NOT cause `Payment Window Expired`, booking cancellation, or inquiry cancellation. The one exception is the unpaid balance of a booking paid with the Installments option on Screen 1 (the \"deposit plan\" of FR-029): when that balance is still unpaid at the cancellation point set in FR-029, System MUST cancel the `Confirmed` booking with closure cause `UnpaidBalance`, cancel the inquiry as in Alternative Flow B2, release the calendar block, send `booking.cancelled`, and apply the refund ladder. The rule is inactive until an admin sets that point, which has no default."}}
  - {"op": "add_enum_value", "field_id": "ENT-booking.closure_cause", "value": "unpaid_balance", "label": "UnpaidBalance", "sort_order": 3}
  - {"op": "update_node", "id": "ENT-booking.closure_cause", "attrs": {"description": "Why the booking was closed. Provider-fault causes named by FR-004: ProviderFault, ProviderSuspended, ProviderDeactivated; and UnpaidBalance for the system cancellation of an Installments booking whose balance is unpaid at the FR-029 cancellation point (Alternative Flow B8)."}}
  - {"op": "update_node", "id": "SET-unpaid-balance-cancellation-point", "attrs": {"description": "The point at which the unpaid balance of a booking paid with the Installments option on Screen 1 (the deposit plan of FR-029) cancels the booking (FR-006 Alternative Flow B8). A separate setting from the balance due days; it has no starting value and an admin must set it before use; until then the cancellation rule is inactive."}}
