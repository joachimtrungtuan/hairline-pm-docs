reason: "FR-006 logic review, pass 1: one refund wording (REQ-006-053, STP-006-306); in-progress fault decision records the choice only and the marker and payout hold resolve when the chosen route completes (REQ-006-019, new STP-006-804 and STP-006-805, STP-006-803, STP-006-704); Aftercare includes a treatment closed early (REQ-006-060); refund and installment edges for the provider-status cascade (STP-006-502); B5 cancels the original booking at the Screen 10 submit (REQ-006-018, REQ-006-058, chain STP-006-604, -605, -601, -602, -603 and its inbound edges); replacement booking enters the main flow (STP-006-606); unpaid balance cancellation (new FLW-006-b8, STP-006-901, STP-006-902, closure cause unpaid_balance, REQ-006-004, -011, -016, -061, -062); missing steps for the hold reminder, revive, appointment change and emergency edit (STP-006-206 to -209) and REQ-006-073 on STP-006-004, with the four waiting hand-offs to the appointment change stitched (STP-010-030, -031, STP-016-094, STP-007B-601); date-change routes and no rescheduling fee (REQ-006-017, -020, -067); blocked payment screen shows (REQ-006-037); provider identity stays unmasked after Confirmed (REQ-006-008, ENT-patient.name); retired-rule edges removed (REQ-006-006, -012, -031) and REQ-006-075 governed by SET-split-payment-config; STG-main-04-booking no longer emits EVT-quote-withdrawn."
by: docs-manager
operations:
  - {"op": "update_node", "id": "REQ-006-053", "attrs": {"statement": "A full refund applies when the provider withdraws, drops out, or is suspended or deactivated before treatment starts; an in-treatment provider fault takes an admin-set refund; every other cancellation follows the refund ladder set in FR-029. When the provider withdraws or drops out after acceptance and before treatment starts (Alternative Flow B5), or the booking is cancelled by a provider suspension or deactivation (Alternative Flow B4), the patient is refunded everything paid, pays no cancellation fee, and a replacement booking takes a new payment. While `In Progress` the case follows Alternative Flow B7: the admin sets the patient refund amount from zero up to the full amount paid, with a mandatory reason and an audit entry, and the provider's payout for the booking is held from the fault until the chosen route completes."}}
  - {"op": "update_node", "id": "REQ-006-019", "attrs": {"statement": "When a provider fault occurs while the booking is `In Progress`, System MUST keep the booking `In Progress`, MUST NOT cancel it automatically or create a replacement quote or acceptance, and MUST flag it `supportRequired` with the cause. Only an admin MAY resolve it on Screen 11 (Alternative Flow B7), with a mandatory reason, confirmation, and audit entry, by either moving the booking to `Aftercare` and reassigning the aftercare provider or team through FR-011 Screen 19, or cancelling the booking through Screen 9. The admin MUST also set the patient refund amount, from zero up to the full amount paid, under the same mandatory reason and audit entry, and System MUST hold the provider's payout for that booking from the fault until the chosen route completes. The decision records the choice only: System MUST resolve the `supportRequired` marker and end the payout hold once the chosen route completes, by the Screen 9 submit or the FR-011 Screen 19 submit."}}
  - {"op": "update_node", "id": "REQ-006-018", "attrs": {"statement": "When the provider withdraws or drops out after acceptance and before treatment starts, System MUST, at the admin submit on Screen 10, cancel the booking with cause `ProviderFault`, release the hold or calendar block, keep the AcceptanceEvent unchanged, and let an admin transfer the patient to a replacement provider in the same inquiry through an admin-authored replacement quote and a new admin-authored acceptance that points to that quote, option, and date-price row (Alternative Flow B5, Screen 10; FR-004 Workflow 7 and Screen 8). A replacement quote that is not accepted MUST expire under the normal quote expiry, the inquiry MUST stay `supportRequired` without automatic cancellation, and the admin MAY author another replacement quote or cancel the inquiry and booking. System MUST write the single supersession record linking the original AcceptanceEvent to the new one at the replacement acceptance, as one append-only insert; the B4 or B5 closure is recorded on the booking as its cause. A provider fault during `Aftercare` MUST NOT create a new quote, acceptance, or payment; the booking stays `Aftercare` and an admin reassigns the aftercare provider or team through FR-011 (Alternative Flow B6); the replacement booking MUST receive the carried-over passport and copied flight and hotel records flagged \"travel-date review required\" per FR-008, with the originals kept read-only on the closed booking."}}
  - {"op": "update_node", "id": "REQ-006-058", "attrs": {"statement": "If the original booking is not already `Cancelled`, the submit first cancels it with cause `ProviderFault` and releases its hold or calendar block; the original booking stays as it is until this submit (Alternative Flow B5 steps 1 and 2)."}}
  - {"op": "update_node", "id": "STP-006-303", "title": "System sets the booking and the inquiry to Cancelled and keeps the accepted quote accepted; when Screen 9 was opened from Screen 11 the submit also resolves the supportRequired marker and ends the payout hold"}
  - {"op": "update_node", "id": "STP-006-306", "title": "Refund follows REQ-006-053: full refund and no fee for a provider withdrawal, drop-out, suspension or deactivation; the amount set on Screen 11 when opened from the in-progress fault flow; otherwise the refund ladder set in FR-029; the refund step and the other money mechanics are owned by FR-007, FR-007B and FR-017"}
  - {"op": "update_node", "id": "STP-006-502", "title": "System releases holds, reservations and calendar slots and blocks further payment; for a Confirmed booking it starts the full refund and the cancellation of the remaining installments"}
