  - {"op": "add_node", "id": "REQ-026-070", "type": "Rule", "owner_fr": "FR-026", "title": "Throttling changes apply immediately, with no staging", "attrs": {"statement": "Authentication throttling changes apply immediately upon save (no staging); new login attempts apply the new throttling policy immediately after propagation.", "rationale": "Screen 2 business rules, restated by Main Flow step 16."}}
  - {"op": "add_node", "id": "REQ-026-071", "type": "Rule", "owner_fr": "FR-026", "title": "Existing lockouts keep their original duration", "attrs": {"statement": "Existing locked-out users continue to serve their existing lockout duration (no retroactive changes); security policy changes apply prospectively only.", "rationale": "Screen 2 business rules and the business process assumption that security policy changes apply prospectively only."}}
  - {"op": "add_node", "id": "REQ-026-072", "type": "Rule", "owner_fr": "FR-026", "title": "One OTP expiry for verification and password reset", "attrs": {"statement": "Single global OTP expiry: the configured OTP Expiry Time applies uniformly to both email verification and password reset OTP flows (no separate per-flow expiry).", "rationale": "Screen 3 business rules and field description."}}
  - {"op": "add_node", "id": "REQ-026-073", "type": "Rule", "owner_fr": "FR-026", "title": "OTP changes apply only to new OTP requests", "attrs": {"statement": "OTP configuration changes apply only to NEW OTP generation requests; existing OTP codes in users' inboxes retain their original expiry time.", "rationale": "Screen 3 business rules."}}
  - {"op": "add_node", "id": "REQ-026-074", "type": "Rule", "owner_fr": "FR-026", "title": "OTP resend needs cooldown elapsed and hourly limit not exceeded", "attrs": {"statement": "The system enforces BOTH resend constraints simultaneously (whichever is more restrictive applies): the user must wait at least Resend Cooldown seconds between consecutive resend requests, and cannot exceed Max Resend Attempts resend requests within a 1-hour window. A user can resend an OTP if and only if the cooldown has elapsed since the last resend AND the hourly limit is not exceeded.", "rationale": "Screen 3, Rate Limiting Interaction Logic. The worked scenarios are examples; see the open question on scenario 3."}}
  - {"op": "add_node", "id": "REQ-026-075", "type": "Rule", "owner_fr": "FR-026", "title": "Hourly OTP resend counter uses a rolling 60-minute window", "attrs": {"statement": "The hourly resend counter is the number of resend requests in the last 60 minutes from the current time (rolling window), not a counter that resets at fixed hourly boundaries, to prevent burst abuse.", "rationale": "Screen 3, Counter Reset Logic. The PRD labels the rolling window \"RECOMMENDED\" and then states \"Implementation: Use rolling window to prevent burst abuse\"; read as the rule."}}
  - {"op": "add_node", "id": "REQ-026-076", "type": "Rule", "owner_fr": "FR-026", "title": "Country names and ISO codes must be unique and valid", "attrs": {"statement": "Country names must be unique (max 100 characters). ISO codes must be unique, exactly 2 uppercase characters, and valid per the ISO 3166-1 alpha-2 standard.", "rationale": "Screen 4 business rules and field validation. Workflow A1 step 7 says the system \"validates country code uniqueness\" without saying which code; see the open question."}}
  - {"op": "add_node", "id": "REQ-026-077", "type": "Rule", "owner_fr": "FR-026", "title": "Calling codes may be shared by countries", "attrs": {"statement": "Calling codes can be duplicated (for example USA and Canada both use +1); the format is +[1-4 digits].", "rationale": "Screen 4 business rules and field validation."}}
  - {"op": "add_node", "id": "REQ-026-078", "type": "Rule", "owner_fr": "FR-026", "title": "Countries are deactivated, never deleted", "attrs": {"statement": "Deactivating a country does NOT delete it (soft delete, archived); a country cannot be hard-deleted; patients who selected a deactivated country retain their selection and the country is hidden from new users.", "rationale": "Screen 4 business rules and the edge case on deleting a country that active patients have selected."}}
  - {"op": "add_node", "id": "REQ-026-079", "type": "Rule", "owner_fr": "FR-026", "title": "Country flag format and size", "attrs": {"statement": "SVG is the preferred format for country flags; PNG is allowed only when SVG is not available. PNG uploads must be at least 128x128 with a square (1:1) aspect ratio; the maximum file size is 1 MB.", "rationale": "Screen 4 business rules and the Country Flag field validation."}}
  - {"op": "add_node", "id": "REQ-026-080", "type": "Rule", "owner_fr": "FR-026", "title": "Discovery answer options must be unique", "attrs": {"statement": "Discovery answer options must be unique (max 100 characters).", "rationale": "Screen 5 business rules and field validation."}}
  - {"op": "add_node", "id": "REQ-026-081", "type": "Rule", "owner_fr": "FR-026", "title": "At least 2 discovery options stay active", "attrs": {"statement": "At least 2 active discovery question options must exist at all times; deactivating one of the last 2 active options is prevented.", "rationale": "Screen 5 business rules and the matching edge case error \"At least 2 active options required. Cannot deactivate this option.\""}}
  - {"op": "add_node", "id": "REQ-026-082", "type": "Rule", "owner_fr": "FR-026", "title": "Deactivating a discovery option keeps historical data", "attrs": {"statement": "Deactivating a discovery question option does NOT delete historical data.", "rationale": "Screen 5 business rules."}}
  - {"op": "add_node", "id": "REQ-026-083", "type": "Rule", "owner_fr": "FR-026", "title": "Cancellation reason labels unique, case-insensitive", "attrs": {"statement": "Inquiry cancellation reason labels must be unique (case-insensitive; max 100 characters).", "rationale": "Screen 5a business rules and field validation."}}
  - {"op": "add_node", "id": "REQ-026-084", "type": "Rule", "owner_fr": "FR-026", "title": "At least 2 cancellation reasons stay active", "attrs": {"statement": "At least 2 active inquiry cancellation reasons must exist at all times.", "rationale": "Screen 5a business rules."}}
  - {"op": "add_node", "id": "REQ-026-085", "type": "Rule", "owner_fr": "FR-026", "title": "\"Other\" cancellation reason is fixed and needs an explanation", "attrs": {"statement": "The \"Other\" cancellation reason is FIXED (cannot be deactivated or deleted) and always requires an explanation.", "rationale": "Screen 5a business rules and the matching edge case error."}}
  - {"op": "add_node", "id": "REQ-026-086", "type": "Rule", "owner_fr": "FR-026", "title": "Deactivating a cancellation reason keeps history", "attrs": {"statement": "Deactivating a cancellation reason does NOT delete historical data; previously captured cancellation reasons retain their original label in audit logs.", "rationale": "Screen 5a business rules."}}
  - {"op": "add_node", "id": "REQ-026-087", "type": "Rule", "owner_fr": "FR-026", "title": "Requires Explanation shows a mandatory free text field in FR-003", "attrs": {"statement": "When Requires Explanation is true for a cancellation reason, FR-003 Screen 8a must show a mandatory free text field (max 500 characters) when that reason is selected.", "rationale": "Screen 5a business rules. Consumer FR-003 Screen 8a reads this list to populate the cancellation reason selector."}}
  - {"op": "add_node", "id": "REQ-026-088", "type": "Rule", "owner_fr": "FR-026", "title": "Deletion reason labels unique, case-insensitive", "attrs": {"statement": "Account deletion reason labels must be unique (case-insensitive; max 100 characters).", "rationale": "Screen 5b business rules and field validation."}}
  - {"op": "add_node", "id": "REQ-026-089", "type": "Rule", "owner_fr": "FR-026", "title": "At least 2 deletion reasons stay active", "attrs": {"statement": "At least 2 active account deletion reasons must exist at all times.", "rationale": "Screen 5b business rules."}}
  - {"op": "add_node", "id": "REQ-026-090", "type": "Rule", "owner_fr": "FR-026", "title": "\"Others\" deletion reason is fixed and needs an explanation", "attrs": {"statement": "The \"Others\" deletion reason is FIXED (cannot be deactivated or deleted) and always requires an explanation.", "rationale": "Screen 5b business rules and the matching edge case error."}}
  - {"op": "add_node", "id": "REQ-026-091", "type": "Rule", "owner_fr": "FR-026", "title": "Deactivating a deletion reason keeps history", "attrs": {"statement": "Deactivating an account deletion reason does NOT delete historical data; previously captured deletion reasons retain their original label in audit logs.", "rationale": "Screen 5b business rules."}}
  - {"op": "add_node", "id": "REQ-026-092", "type": "Rule", "owner_fr": "FR-026", "title": "Requires Explanation shows an optional free text field in FR-001", "attrs": {"statement": "When Requires Explanation is true for a deletion reason, FR-001 Screen 16 must show an optional free text field (max 500 characters) when that reason is selected (the deletion reason field overall remains optional per FR-001 business rules).", "rationale": "Screen 5b business rules. The field description and workflow A5 step 4 say the patient \"must provide free text\"; this rule follows the Screen 5b business rule line. See the open question on mandatory versus optional."}}
  - {"op": "add_node", "id": "REQ-026-093", "type": "Rule", "owner_fr": "FR-026", "title": "Treatment-area options: admin operations and deletion limit", "attrs": {"statement": "Admin may create, edit, reorder, activate, or deactivate treatment-area options. Options referenced by an inquiry cannot be deleted.", "rationale": "Screen 5c business rules and workflow A6."}}
  - {"op": "add_node", "id": "REQ-026-094", "type": "Rule", "owner_fr": "FR-026", "title": "Inactive options hidden from new inquiries; history keeps the snapshot", "attrs": {"statement": "The patient configuration API must not return inactive treatment-area options for new inquiries. Historical inquiry views use the saved option snapshot, and submitted inquiries retain their historical treatment-area snapshot.", "rationale": "Screen 5c business rules and workflow A6 step 7."}}
  - {"op": "add_node", "id": "REQ-026-095", "type": "Rule", "owner_fr": "FR-026", "title": "Lead time applies to the calendar and to submission validation", "attrs": {"statement": "Minimum Inquiry Lead Time applies to both the calendar's disabled-date calculation and backend inquiry submission validation.", "rationale": "Screen 5c business rules."}}
  - {"op": "add_node", "id": "REQ-026-096", "type": "Rule", "owner_fr": "FR-026", "title": "Inquiry Configuration save validation", "attrs": {"statement": "On save, the system validates that active treatment-area option labels are unique (max 100 characters), that an image/icon asset is present and resolves to an approved S-05-managed asset, that display order is a unique integer, and that the lead time is between 0 and 730 days.", "rationale": "Workflow A6 step 5 and Screen 5c field validation."}}
  - {"op": "add_node", "id": "REQ-026-097", "type": "Rule", "owner_fr": "FR-026", "title": "Conversion and exchange-rate locking stay with FR-029", "attrs": {"statement": "Currency conversion and exchange-rate locking remain owned by FR-029 and occur at acceptance; the Quote Configuration screen does not manage conversion rates.", "rationale": "Screen 5d business rules. Boundary recorded as the PRD states it (D10)."}}
  - {"op": "add_node", "id": "REQ-026-098", "type": "Rule", "owner_fr": "FR-026", "title": "Blank monthly commission goal hides the FR-014 reference line", "attrs": {"statement": "When Target Monthly Commission is blank, FR-014 hides the reference line; clearing a previously set value hides it again.", "rationale": "Screen 5e business rules."}}
  - {"op": "add_node", "id": "REQ-026-099", "type": "Rule", "owner_fr": "FR-026", "title": "No per-provider SLA overrides", "attrs": {"statement": "Per-provider SLA overrides are out of scope; all providers are measured against the same platform SLA target.", "rationale": "Screen 5e business rules."}}
  - {"op": "add_node", "id": "REQ-026-100", "type": "Rule", "owner_fr": "FR-026", "title": "Invalid analytics values block save", "attrs": {"statement": "The system validates analytics configuration values (for example, Dormant must be greater than At Risk) and blocks save on error.", "rationale": "Workflow A8 step 3 and the Screen 5e field validation."}}
  - {"op": "add_node", "id": "REQ-026-101", "type": "Rule", "owner_fr": "FR-026", "title": "Template subject and body must include {code}", "attrs": {"statement": "The subject and body of an OTP email template must include the {code} variable; the system warns if {code} is missing.", "rationale": "Screen 6 business rules and Admin Editability Rules."}}
  - {"op": "add_node", "id": "REQ-026-102", "type": "Rule", "owner_fr": "FR-026", "title": "Template HTML body validated on save", "attrs": {"statement": "The HTML body of an OTP email template must be valid HTML; the system validates it on save.", "rationale": "Screen 6 business rules."}}
  - {"op": "add_node", "id": "REQ-026-103", "type": "Rule", "owner_fr": "FR-026", "title": "Plain text body is the fallback version", "attrs": {"statement": "The plain text body is the fallback for email clients that do not support HTML.", "rationale": "Screen 6 business rules."}}
  - {"op": "add_node", "id": "REQ-026-104", "type": "Rule", "owner_fr": "FR-026", "title": "Template variables substituted at send time", "attrs": {"statement": "Template variables ({code}, {email}, {expiry_minutes}, {app_name}) are automatically substituted at send time.", "rationale": "Screen 6 business rules and Available Variables field. Communication Structure lists only {code}, {email} and {expiry_minutes}; this rule follows the Screen 6 list. See the open question on {app_name}."}}
  - {"op": "add_node", "id": "REQ-026-105", "type": "Rule", "owner_fr": "FR-026", "title": "Template preview uses fake sample data", "attrs": {"statement": "Template preview renders a sample email with fake data (for example {code} = \"123456\", {expiry_minutes} = \"15\").", "rationale": "Screen 6 business rules, Notes and workflow A2 step 6."}}
  - {"op": "add_node", "id": "REQ-026-106", "type": "Rule", "owner_fr": "FR-026", "title": "Template changes apply only to new OTP requests", "attrs": {"statement": "Template changes apply only to NEW OTP generation requests; users already in a verification flow continue with the previous template version and existing emails are unchanged.", "rationale": "Screen 6 business rules, Module Scope (Shared Services S-03) and workflow A2 steps 11 and 12."}}
  - {"op": "add_node", "id": "REQ-026-107", "type": "Rule", "owner_fr": "FR-026", "title": "Dashboard access needs the \"Settings Management\" permission", "attrs": {"statement": "Only admins with \"Settings Management\" permission can access the Settings Management Dashboard.", "rationale": "Screen 1 business rules. REQ-026-001 names the roles \"Settings Manager\" and \"Settings Viewer\" instead; see the open question on permission naming."}}
  - {"op": "add_node", "id": "REQ-026-108", "type": "Rule", "owner_fr": "FR-026", "title": "Setting groups organized into four sections", "attrs": {"statement": "Setting groups are organized into sections: Authentication & Security (Authentication Throttling, OTP Configuration, Password Policy), App Data (Countries & Calling Codes, Discovery Questions, Inquiry Cancellation Reasons, Account Deletion Reasons, Provider Specialties, Inquiry Configuration, Quote Configuration), Notifications (OTP Email Templates: Verification Email, Password Reset Email), and Analytics (Analytics Configuration).", "rationale": "Screen 1 business rules and Setting Groups (detailed). Code length is fixed and view-only; Password Policy is fixed in codebase and view-only."}}
  - {"op": "add_node", "id": "REQ-026-109", "type": "Rule", "owner_fr": "FR-026", "title": "Edit disabled for groups fixed in codebase", "attrs": {"statement": "The \"Edit\" button is disabled for setting groups marked as \"Fixed in Codebase\".", "rationale": "Screen 1 business rules."}}
  - {"op": "add_node", "id": "REQ-026-110", "type": "Rule", "owner_fr": "FR-026", "title": "View History always available", "attrs": {"statement": "\"View History\" is always available (read-only).", "rationale": "Screen 1 business rules."}}
  - {"op": "add_node", "id": "REQ-026-111", "type": "Rule", "owner_fr": "FR-026", "title": "Lists show how many users picked each value", "attrs": {"statement": "The list managers show usage counts: how many patients selected each discovery option (and each cancellation and deletion reason, with a date range filter) and how many users selected each country, how many providers hold each specialty, with a warning before deactivating a frequently selected or held value.", "rationale": "Notes on Screens 4, 5, 5a, 5b and 5f. The usage_count fields on the option and reason entities are calculated by this rule."}}
  - {"op": "update_field", "id": "ENT-discovery-question-option.usage_count", "calculated_by": "REQ-026-111"}
  - {"op": "update_field", "id": "ENT-inquiry-cancellation-reason.usage_count", "calculated_by": "REQ-026-111"}
