  - {"op": "add_node", "id": "SCR-026-01", "type": "Screen", "owner_fr": "FR-026", "title": "Settings Management Dashboard (Screen 1)", "attrs": {"platform": "admin", "description": "Lists every setting group in four sections (Authentication & Security, App Data, Notifications, Analytics) with name, current version and last modified; Edit opens the group editor (disabled for groups fixed in codebase) and View History is always available."}}
  - {"op": "add_node", "id": "SCR-026-02", "type": "Screen", "owner_fr": "FR-026", "title": "Authentication Throttling (Screen 2)", "attrs": {"platform": "admin", "description": "Admin edits max login attempts and lockout duration, then supplies a change reason. Changes apply immediately after save and propagation; existing lockouts are untouched."}}
  - {"op": "add_node", "id": "SCR-026-03", "type": "Screen", "owner_fr": "FR-026", "title": "OTP Configuration (Screen 3)", "attrs": {"platform": "admin", "description": "Admin edits OTP expiry, resend cooldown and hourly resend limit; the code length is shown read-only (fixed at 6). Includes the interaction logic note for cooldown and hourly limit."}}
  - {"op": "add_node", "id": "SCR-026-04", "type": "Screen", "owner_fr": "FR-026", "title": "Countries and Calling Codes (Screen 4)", "attrs": {"platform": "admin", "description": "Admin adds, edits, reorders, activates and deactivates countries (name, ISO code, calling code, flag, display order); a usage count of users per country is shown with a warning before deactivating."}}
  - {"op": "add_node", "id": "SCR-026-05", "type": "Screen", "owner_fr": "FR-026", "title": "Discovery Question Options (Screen 5)", "attrs": {"platform": "admin", "description": "Shows the fixed question text and lets admin add, edit, reorder, activate and deactivate answer options, with a usage count per option."}}
  - {"op": "add_node", "id": "SCR-026-06", "type": "Screen", "owner_fr": "FR-026", "title": "Inquiry Cancellation Reasons (Screen 5a)", "attrs": {"platform": "admin", "description": "Admin manages cancellation reasons (label, requires explanation, order, active) with a usage count and date range filter; the \"Other\" reason is fixed."}}
  - {"op": "add_node", "id": "SCR-026-07", "type": "Screen", "owner_fr": "FR-026", "title": "Account Deletion Reasons (Screen 5b)", "attrs": {"platform": "admin", "description": "Admin manages account deletion reasons (label, requires explanation, order, active) with a usage count and date range filter; the \"Others\" reason is fixed."}}
  - {"op": "add_node", "id": "SCR-026-08", "type": "Screen", "owner_fr": "FR-026", "title": "Inquiry Configuration (Screen 5c)", "attrs": {"platform": "admin", "description": "Admin manages treatment-area options (label, image or icon, order, active) and the minimum inquiry lead time in days (0 through 730)."}}
  - {"op": "add_node", "id": "SCR-026-09", "type": "Screen", "owner_fr": "FR-026", "title": "Quote Configuration (Screen 5d)", "attrs": {"platform": "admin", "description": "Admin edits quote expiry window, quote-expiring-soon lead time, slot-hold duration and hold-expiring-soon lead time; the currency is shown read-only from the FR-029 Default Currency."}}
  - {"op": "add_node", "id": "SCR-026-10", "type": "Screen", "owner_fr": "FR-026", "title": "Analytics Configuration (Screen 5e)", "attrs": {"platform": "admin", "description": "Admin edits the TTFQ SLA target, At Risk and Dormant thresholds, price outlier threshold, benchmark refresh frequency and optional target monthly commission consumed by FR-014."}}
  - {"op": "add_node", "id": "SCR-026-11", "type": "Screen", "owner_fr": "FR-026", "title": "Provider Specialties (Screen 5f)", "attrs": {"platform": "admin", "description": "Admin adds, renames, reorders, activates and deactivates provider specialties, with a count of providers holding each; at least one value must stay active and values are never hard-deleted."}}
  - {"op": "add_node", "id": "SCR-026-12", "type": "Screen", "owner_fr": "FR-026", "title": "OTP Email Templates (Screen 6)", "attrs": {"platform": "admin", "description": "Admin edits the subject, HTML body and plain text body of the Verification and Password Reset templates, sees the available variables and previews the email with sample data; template names are fixed."}}
  - {"op": "add_node", "id": "SCR-026-13", "type": "Screen", "owner_fr": "FR-026", "title": "Version History (Screen 7)", "attrs": {"platform": "admin", "description": "Read-only list of versions of a setting group, newest first, with diff highlighting of old and new values, change reason and admin; sensitive values are masked."}}
