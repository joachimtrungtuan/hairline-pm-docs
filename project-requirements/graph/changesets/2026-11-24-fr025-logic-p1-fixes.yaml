# Add ops come first (fields, enum values, nodes), then edges of new nodes, then removals paired with their replacements, then updates.
reason: "FR-025 logic review pass 1: the alert tier belongs to the FR-002 engine and FR-025 owns only the Severity Flag mapping; preview colours each answer by its own flag; Green means no Yes on a Critical or Standard question; archiving the previous version on publish is version-level and the Inquiry designation carries over (new was_inquiry_designated field, owner default 94); a resumed draft keeps its version, all submissions are blocked when no set is designated, and the version is recorded at submit; Context Type read-only on the Active version; archived is terminal and a milestone-assigned set cannot be archived (owner default 95); delete only for a never-published set without usages; one open Draft per set and a stale save is refused; control hidden rather than blocked; every Multi-Context set may be assigned; audit actions and session id extended; inactive, deleted and hidden questions rule; publish confirmation, copy naming and Alert Description clarified; admin screens, rules and the unconfigured event moved to the Configuration stage with steps for categories, version history, archive and delete; flow wiring for edit question, restore and hand-offs."
by: docs-manager
operations:
# ---- New fields and enum values --------------------------------------------
- op: "add_field"
  id: "ENT-questionnaire-version.was_inquiry_designated"
  entity_id: "ENT-questionnaire-version"
  name: "was_inquiry_designated"
  data_type: "bool"
  title: "Was designated for Inquiry"
  owner_fr: "FR-025"
  attrs:
    description: "Whether this version is or was the designated Inquiry version; set at designation and at publish of a designated set. FR-002 accepts only such versions (REQ-002-037)."
- op: "add_field"
  id: "ENT-questionnaire-audit-entry.session_id"
  entity_id: "ENT-questionnaire-audit-entry"
  name: "session_id"
  data_type: "text"
  title: "Session ID"
  owner_fr: "FR-025"
  attrs:
    description: "Identifier of the admin session that performed the action; system-captured."
- {op: "add_enum_value", field_id: "ENT-questionnaire-question.status", value: "Deleted", label: "Deleted"}
- {op: "add_enum_value", field_id: "ENT-questionnaire-audit-entry.action_type", value: "Duplicate Set", label: "Duplicate Set"}
- {op: "add_enum_value", field_id: "ENT-questionnaire-audit-entry.action_type", value: "Delete Set", label: "Delete Set"}
- {op: "add_enum_value", field_id: "ENT-questionnaire-audit-entry.action_type", value: "Reorder Questions", label: "Reorder Questions"}
- {op: "add_enum_value", field_id: "ENT-questionnaire-audit-entry.action_type", value: "Remove Inquiry Designation", label: "Remove Inquiry Designation"}
- {op: "add_enum_value", field_id: "ENT-questionnaire-audit-entry.action_type", value: "Inquiry Flow Unconfigured", label: "Inquiry Flow Unconfigured"}
# ---- New rule and steps ----------------------------------------------------
- op: "add_node"
  id: "REQ-025-084"
  type: "Rule"
  owner_fr: "FR-025"
  title: "Inactive, deleted and hidden questions"
  attrs:
    statement: "Inactive and soft-deleted questions are not delivered to patients and are excluded from completeness checks, severity checks and the tier; Visible to Patient is not offered in Inquiry or Multi-Context sets"
    rationale: "Logic review: the question status, the Visible to Patient control and the severity and completeness rules were not reconciled."
- op: "add_node"
  id: "STP-025-056"
  type: "Step"
  owner_fr: "FR-025"
  title: "Patient with a saved draft resumes and keeps the questionnaire version of that draft"
  attrs:
    prd_ref: "Workflow 3: Questionnaire Deployment"
    description: "A resumed draft is not reloaded to a newer version; the version used is recorded at submit (REQ-025-057, REQ-025-058)."
- op: "add_node"
  id: "STP-025-057"
  type: "Step"
  owner_fr: "FR-025"
  title: "Admin manages the questionnaire categories"
  attrs:
    prd_ref: "Screen 4: Category Management"
    description: "Admin creates, edits, deactivates or deletes a category; deletion is blocked while sets are assigned (REQ-025-028); category changes go to the platform Admin audit log (FR-031)."
- op: "add_node"
  id: "STP-025-058"
  type: "Step"
  owner_fr: "FR-025"
  title: "Admin views the version history of a set and restores an earlier version as a new Draft"
  attrs:
    prd_ref: "Screen 7: Version History & Audit Trail"
    description: "Admin opens the version history, views a snapshot, or uses Restore as New Draft; Restore is refused while the set has an open Draft (REQ-025-038, REQ-025-039)."
- op: "add_node"
  id: "STP-025-059"
  type: "Step"
  owner_fr: "FR-025"
  title: "Admin archives a set"
  attrs:
    prd_ref: "Screen 1: Questionnaire Catalog"
    description: "Archive is blocked while a milestone uses the set; archiving the designated Inquiry set removes the designation (REQ-025-045, REQ-025-047, REQ-025-048)."
- op: "add_node"
  id: "STP-025-060"
  type: "Step"
  owner_fr: "FR-025"
  title: "Admin deletes a set that was never published and has no usages"
  attrs:
    prd_ref: "Screen 1: Questionnaire Catalog"
    description: "Delete is offered only for a never-published set without usages (REQ-025-046)."
