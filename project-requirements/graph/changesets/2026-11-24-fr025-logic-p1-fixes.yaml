# ---- Rule statements -------------------------------------------------------
- op: update_node
  id: "REQ-025-008"
  attrs:
    statement: "Duplicating a set creates a Draft copy with all questions, named `<source name> (copy)`; the Admin makes the name unique before the first save; the copy's Context Type is editable before first publish; the copy does not inherit the Inquiry designation"
- op: update_node
  id: "REQ-025-013"
  attrs:
    statement: "All Active questions in Inquiry/Multi-Context sets must have a Severity flag before publishing"
- op: update_node
  id: "REQ-025-017"
  attrs:
    statement: "Severity flags drive the automatic provider alert system for the inquiry flow only. Severity Flag and Alert Description are shown only on questions in Inquiry or Multi-Context sets; Alert Description is optional and an Admin-only note shown in the editor and Preview, and providers see the question text; response colour-coding in the provider view follows each answer's own flag automatically with no extra configuration; Preview shows no overall tier"
- op: update_node
  id: "REQ-025-024"
  attrs:
    statement: "All Active questions must pass completeness validation before the parent set can be published"
- op: update_node
  id: "REQ-025-028"
  attrs:
    statement: "Deleting a category with assigned sets is blocked; admin must first reassign those sets. Deactivating a category retires it from use but does not make it deletable until its sets are reassigned"
- op: update_node
  id: "REQ-025-031"
  attrs:
    statement: "Publishing increments the version number and archives the previous Active version; a designation of the set for Inquiry stays on the set and carries over to the new version"
- op: update_node
  id: "REQ-025-032"
  attrs:
    statement: "Every change to an Active (published) set (add, edit, delete or reorder a question, metadata, Context Type) is saved to the set's single open Draft; the Active version continues to serve downstream consumers until the Draft is published; a set has at most one open Draft"
- op: update_node
  id: "REQ-025-033"
  attrs:
    statement: "Context Type is read-only on the Active version and editable only in an open Draft; publishing a Draft whose Context Type no longer fits a current use (Inquiry designation or milestone assignment) is blocked with the list of those uses"
- op: update_node
  id: "REQ-025-034"
  attrs:
    statement: "Version activation requires explicit admin confirmation, shown after validation with the new version number and changes summary"
- op: update_node
  id: "REQ-025-038"
  attrs:
    statement: "Any earlier version must be restorable as a new Draft, which is then published; there is no one-step rollback, and the Active version is unaffected until the restored Draft is published; Restore is refused while the set has an open Draft"
- op: update_node
  id: "REQ-025-041"
  attrs:
    statement: "All admin actions on the set — including metadata edits, question changes, duplicate, delete, reorder, designation changes, and publish/archive events — are captured in the audit trail, each with a timestamp and the identity of the admin"
- op: update_node
  id: "REQ-025-043"
  attrs:
    statement: "Security information (IP address, session ID) must be tracked"
- op: update_node
  id: "REQ-025-044"
  attrs:
    statement: "Deleting a question performs a soft delete (status Deleted); historical patient responses referencing this question are preserved and remain accessible"
- op: update_node
  id: "REQ-025-045"
  attrs:
    statement: "A set designated for Inquiry cannot be deleted, only archived; a set assigned to a milestone can be neither deleted nor archived until those milestones are reassigned; Archived is terminal, and the way back is Restore as New Draft then publish"
- op: update_node
  id: "REQ-025-046"
  attrs:
    statement: "Delete is allowed only for a set that was never published and has no usages; a set that has been published can only be archived"
- op: update_node
  id: "REQ-025-048"
  attrs:
    statement: "Archiving a set that is currently designated as the active Inquiry questionnaire removes the designation and flags the inquiry flow as unconfigured; system notifies admin. This applies only to the Archive action on the set, not to the archiving of the previous Active version when a new version is published. The Inquiry designation can only be replaced (by designating another set) or ended by archiving the set; there is no control to remove the designation on its own. The designation belongs to the set and carries over to a newly published version"
- op: update_node
  id: "REQ-025-051"
  attrs:
    statement: "The \"Set as Active for Inquiry\" action is only available on sets with Status = Active (published) and Context Type = Inquiry or Multi-Context. It is hidden for Draft, Archived, and Aftercare-only sets; the block message appears only when the set changed after the screen loaded"
- op: update_node
  id: "REQ-025-052"
  attrs:
    statement: "If no set is designated as the active Inquiry questionnaire, the system must block all patient inquiry submissions, including resumed drafts; the draft is kept and the patient sees the submission-unavailable message (REQ-002-053); admins see a system-level warning"
- op: update_node
  id: "REQ-025-053"
  attrs:
    statement: "A patient starting the inquiry questionnaire gets the current designated version; a resumed draft keeps its version; the version used is recorded at submit; publishing a set does not make it the active Inquiry set — the admin must explicitly toggle \"Set as Active for Inquiry\""
- op: update_node
  id: "REQ-025-057"
  attrs:
    statement: "When the patient platform holds an older questionnaire version than the current Active version, the system pushes the current Active version for a new start; a patient with a resumed draft is not made to start over, and the submission is accepted on an older version that is or was designated for Inquiry; the version used is recorded against the inquiry"
- op: update_node
  id: "REQ-025-058"
  attrs:
    statement: "System records the questionnaire set version number on the inquiry record itself at submit, in addition to the template version stamp kept by FR-002."
- op: update_node
  id: "REQ-025-059"
  attrs:
    statement: "The patient's answers and the alert tier are recorded on the inquiry record (FR-003) and the questionnaire version in the FR-002 intake audit entry (template_version_used); this set's audit trail holds Admin actions only."
- op: update_node
  id: "REQ-025-063"
  attrs:
    statement: "Medical alerts are generated automatically from questionnaire responses by the FR-002 engine (REQ-002-002); FR-025 supplies the Severity Flags"
- op: update_node
  id: "REQ-025-064"
  attrs:
    statement: "Alert tier for each submitted Inquiry questionnaire: Red if any Critical question is answered Yes; otherwise Amber if any Standard question is answered Yes; otherwise Green (no Yes answer on a Critical or Standard question). The tier is computed by the FR-002 engine (REQ-002-002); FR-025 owns only the mapping from Severity Flag to tier"
- op: update_node
  id: "REQ-025-065"
  attrs:
    statement: "Alert severity must match question severity flags, as applied by the FR-002 engine"
- op: update_node
  id: "REQ-025-071"
  attrs:
    statement: "Questionnaire sets with Context Type = Inquiry are not selectable in aftercare milestone assignments; every Multi-Context set may be assigned, with no extra flag"
- op: update_node
  id: "REQ-025-072"
  attrs:
    statement: "Changing a milestone's assigned questionnaire set does not affect previously submitted patient responses; those remain linked to the version used at time of submission, and a draft response keeps the version it started on"
- op: update_node
  id: "REQ-025-073"
  attrs:
    statement: "System must handle concurrent admin modifications gracefully: a save made from a stale screen is refused with a message to reload; question order must be maintained during updates"
# ---- Step wording ----------------------------------------------------------
- op: update_node
  id: "STP-025-010"
  title: "Admin clicks Publish on the set; after validation the new version number and changes summary are confirmed"
- op: update_node
  id: "STP-025-012"
  title: "Admin opens a published set; the system opens its single open Draft and the Active version stays unchanged"
- op: update_node
  id: "STP-025-021"
  title: "Admin edits a question in the open Draft; the Active version keeps serving inquiries"
- op: update_node
  id: "STP-025-030"
  title: "Patient reaches the medical questionnaire step and the designated Inquiry questionnaire is delivered, or submission is blocked when none is designated"
- op: update_node
  id: "STP-025-034"
  title: "Patient app loads the current questionnaire version for a new start; a resumed draft is not made to start over"
- op: update_node
  id: "STP-025-053"
  title: "System records the questionnaire set version number on the inquiry record at submit"
- op: update_node
  id: "STP-025-054"
  title: "The FR-002 alert engine returns the Red, Amber or Green tier from the answers and the severity flags (REQ-002-002); FR-025 owns only the mapping"
- op: update_node
  id: "STP-025-055"
  title: "System records the answers and the tier on the inquiry record (FR-003) and the version in the FR-002 intake audit entry"
