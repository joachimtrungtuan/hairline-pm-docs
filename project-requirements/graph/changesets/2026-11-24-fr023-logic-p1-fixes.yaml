# Operations ordered so nodes and fields are created before the edges that use them.
reason: 'FR-023 logic review pass 1: approval cancels the open inquiry through FR-003 (owner default 63); every category anonymised or archived in place (67); Denied outcome; one obligation list blocks approval while the 30-day clock keeps running (68); status lifecycle, verification states and stages repaired; Verification Required ends only by a Deny (69); record-type mapping (70); retention floor of 10 years, longer-only overrides (71); patient data export out of scope (72)'
by: docs-manager
operations:
- op: add_node
  id: REQ-023-042
  type: Rule
  title: Approval cancels the patient's open inquiry through FR-003 before anything is anonymised
  owner_fr: FR-023
  attrs:
    statement: When an Admin approves a deletion request, the system MUST cancel the patient's open inquiry through FR-003 (REQ-003-103) before any data is anonymised, so the cancellation and its provider notices run on the identifiable record. The cancellation happens at approval, never at submission; a denied request and a request blocked by an obligation cancel nothing. The cancelled inquiry and quotes are retained under REQ-023-003 and REQ-023-040.
    rationale: 'Owner default 63: cancel at admin approval, not at submission; a refused or blocked request cancels nothing. The cancellation runs first because it notifies providers and flips quotes on the identifiable record. FR-003 owns the cancellation (REQ-003-103).'
- op: add_node
  id: STP-023-008
  type: Step
  title: System cancels the patient's open inquiry through FR-003 before anything is anonymised
  owner_fr: FR-023
  attrs:
    prd_ref: Main Flow step 6
- op: add_node
  id: REQ-023-044
  type: Rule
  title: Every record type belongs to exactly one category by the record-type mapping
  owner_fr: FR-023
  attrs:
    statement: System MUST assign every record type to exactly one data category by the record-type mapping below. Reviews, messages and support cases are Communications and are anonymised in place. Inquiries are Medical Records, and quotes, acceptance events and bookings are Financial Records; they are retained records under REQ-023-003 and REQ-023-040. Scan media are Medical Records.
    rationale: 'Owner default 70: reviews, messages and support cases are Communications (anonymised); inquiry is Medical Records; quote, acceptance event and booking are Financial Records; scans are Medical Records. The mapping table lives in the PRD.'
- op: add_node
  id: REQ-023-043
  type: Rule
  title: Admin may deny a deletion request with a required reason; the patient is notified and nothing is cancelled or anonymised
  owner_fr: FR-023
  attrs:
    statement: An Admin MAY deny a deletion request on the DSR Queue (FR-016) while it is open, including a request in Verification Required that cannot be completed. A denial requires a reason; the system sets the status to Denied, notifies the patient with the reason, cancels nothing and anonymises nothing, and the request stays auditable. The patient may submit a new deletion request after a denial.
    rationale: Gives the FR-016 Deny action (REQ-016-173) a counterpart in the entity FR-023 owns; a refused request cancels nothing (owner default 63). Resubmission after a denial is allowed, as a default.
