- op: update_node
  id: REQ-023-038
  title: One list of active obligations; an obligation at approval blocks approval and the request stays pending
  attrs:
    statement: 'System MUST keep one list of active obligations: an inquiry at the Accepted stage or later that is not Cancelled (FR-003 REQ-003-103), an active booking, treatment or aftercare in progress, a payment in progress, and a pending refund. FR-001 and FR-003 block the submission of a request while an obligation of the list exists. An obligation that arises after submission blocks approval: the system checks the list again when the Admin approves, keeps the request Pending Admin Review, marks it blocked by obligation and tells the patient the expected timeline. Nothing else is restricted for the patient while the request is pending.'
    rationale: 'Owner default 68: replaces the pause with FR-016''s block at approval (REQ-016-171). FR-023 owns the one list; FR-001 and FR-003 block at submission from the same list. No new patient restriction while the request is pending is a default; the approval re-check covers anything that arises after submission.'
