- op: update_node
  id: REQ-023-007
  attrs:
    statement: System MUST provide Admin views to configure retention by data category and jurisdiction (never below 10 years, REQ-023-045) and to manage DSR queues.
    rationale: Admin retention settings never go below the 10-year floor of REQ-023-045. The Admin retention screens are not specified in any FR yet, so the rule is platform-wide.
    scope: global
- op: update_node
  id: REQ-023-010
  attrs:
    statement: Each category MUST have an assigned retention policy and legal basis (with jurisdiction overrides that may only extend the period, REQ-023-045).
    rationale: Jurisdiction overrides may only extend the period (REQ-023-045).
- op: update_node
  id: REQ-023-028
  title: Patient notified at each DSR status change, including blocked by obligation and denied
  attrs:
    statement: 'Patients are notified of each DSR status change: submission, verification required, in progress, blocked by obligation (with the expected timeline), denied (with the reason), and fulfilled.'
    rationale: Adds the blocked and denied notices; the timeline message of REQ-023-038 and the reason of REQ-023-043 travel with them.
- op: update_node
  id: REQ-023-029
  title: Admins notified of new DSRs and 7 calendar days before the deadline
  attrs:
    statement: Admins are notified of new DSRs and, 7 calendar days before the deadline, of an approaching deadline.
    rationale: A fixed threshold of 7 calendar days (a default; no setting is added).
- op: update_node
  id: REQ-023-031
  attrs:
    statement: System classifies the patient's data by category and applicable retention/jurisdiction when a deletion request is processed, and refreshes the classification when the Admin approves.
    rationale: Classification is refreshed at approval so it cannot be stale.
- op: update_node
  id: REQ-023-032
  title: Admin reviews the classification and approves, denies or finds the identity proof insufficient
  attrs:
    statement: Admin reviews the classification and approves the action before anonymization or restriction is performed; the Admin may instead deny the request (REQ-023-043) or find the identity proof insufficient (REQ-023-034).
    rationale: Approval is the only path to anonymisation; deny and verification are the other two exits.
- op: update_node
  id: REQ-023-034
  title: Admin decides whether identity proof is sufficient; Verification Required stays open until validated or denied
  attrs:
    statement: An Admin decides at review whether the identity proof of a deletion request is sufficient. When it is not, the request is set to Verification Required and the patient is notified; the patient provides additional verification and an Admin validates it, which returns the request to Pending Admin Review. A request in Verification Required stays open until an Admin validates the proof or denies the request with a reason (REQ-023-043); it never closes by itself.
    rationale: 'Owner default 69: no auto-close; the Admin decides insufficient proof at review and ends a stuck request with a Deny and a reason.'
- op: update_node
  id: REQ-023-037
  attrs:
    statement: When a patient submits multiple DSRs concurrently, the system merges them into one request with a clear status; the SLA applies per consolidated request and the merged request keeps the earliest submission date.
    rationale: A merged request keeps the earliest submission date so the clock rule has one input.
- op: update_node
  id: REQ-023-039
  title: Jurisdiction conflict applies the longer retention and flags Admin review before approval
  attrs:
    statement: On a jurisdiction conflict (for example EU versus non-EU residency), the system applies the longer retention period (REQ-023-045) and flags the request for Admin review before approval.
    rationale: 'Owner default 71: stricter means longer. The review flag is a field of the request.'
- op: update_node
  id: REQ-023-040
  title: Deletion after inquiry cancellation proceeds; cancelled records stay retained; records cancelled at approval are covered
  attrs:
    statement: 'A deletion request made after the patient cancelled an inquiry proceeds normally, because a cancelled inquiry is a terminal state with no active obligation. Inquiries cancelled by the patient, inquiries cancelled by the system at approval (REQ-023-042), cascaded cancelled quotes, and associated audit entries are retained per the system PRD, Platform-Wide Rules: One 10-year retention period and REQ-023-003 even after the deletion request is fulfilled; the retained inquiry and quote records are kept in anonymised form and the audit entries are kept unchanged (REQ-023-011).'
    rationale: Extended to inquiries cancelled by the system at approval; audit entries stay unchanged (REQ-023-011).
- op: update_node
  id: REQ-023-027
  attrs:
    statement: 'Out of scope for this module: real-time chat/video features (managed by other modules), payment flow changes beyond record retention, third-party DPO/legal tooling integrations (future consideration), and patient data export (data portability), which is not offered at launch.'
