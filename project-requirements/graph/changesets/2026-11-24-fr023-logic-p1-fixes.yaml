- op: update_node
  id: REQ-023-041
  attrs:
    statement: The 30-day deadline of a deletion request always runs from submission (the earliest submission date of a merged request) and does not pause during verification or while an obligation blocks approval. When the deadline passes on an open request, the queue shows it as overdue and the request stays open; an overdue request blocked by an obligation is shown as an excused breach.
    rationale: 'Owner default 68: one clock rule. The deadline runs from submission (the earliest date of a merged request), never pauses, and an overdue open request is shown, not closed; a breach while blocked by an obligation is excused.'
