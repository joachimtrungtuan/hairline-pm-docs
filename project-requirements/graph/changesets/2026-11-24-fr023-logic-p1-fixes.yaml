- op: update_node
  id: REQ-023-003
  title: Every delete is a soft delete; protected categories restricted; cancelled inquiries and cascade records retained
  attrs:
    statement: 'Every delete MUST be a soft delete (REQ-SYS-003): the record is archived or anonymised in place and is never physically removed before the retention period ends (REQ-SYS-002). The protected categories (Medical Records, Financial Records, Account Profile) are additionally restricted, with access limited to the legal purpose. Patient-cancelled inquiries (FR-003 Workflow 5), inquiries cancelled by the system when a deletion request is approved (REQ-023-042), and all records generated from the cancellation cascade — including auto-cancelled quotes with status "Cancelled (Inquiry Cancelled)" per FR-004 — are subject to the same retention rules as completed inquiries and quotes. AcceptanceEvents are retained and never deleted (FR-005 REQ-005-023). This applies to inquiry records, quote records, acceptance events (including superseded AcceptanceEvents per FR-005), and associated audit trail entries, which are kept unchanged (REQ-023-011).'
    rationale: 'Owner default 67: every category is anonymised or archived in place, so the old limit of soft deletion to three categories is removed (REQ-SYS-002, REQ-SYS-003). Cancelled records produced at approval fall under the same retention.'
- op: update_node
  id: REQ-023-004
  title: 'Deletion request: no category physically removed; non-protected data anonymised or archived in place, protected records retained anonymised with restricted access'
  attrs:
    statement: 'System MUST allow patients to request data deletion (erasure). On an approved request no category is physically removed (REQ-SYS-002, REQ-SYS-003): the personal data of the non-protected categories (Communications, Media, Analytics) is anonymised in place, or archived and made inaccessible; the protected categories (Medical Records, Financial Records, Account Profile) are retained in anonymised form, with strict access restrictions and documented legal basis.'
    rationale: 'Owner default 67: anonymise or archive in place for every category; protected categories are Medical Records, Financial Records and Account Profile.'
- op: update_node
  id: STP-023-004
