- op: add_node
  id: REQ-023-046
  type: Rule
  title: Status of a deletion request is set only by the named steps; the system sets Fulfilled and FR-016 owns the certificate
  owner_fr: FR-023
  attrs:
    statement: 'The status of a deletion request is set only as follows: Pending Admin Review at submission, and again when an Admin validates the verification or an obligation block clears; Verification Required when an Admin finds the proof insufficient; In Progress when an Admin approves and the obligation check passes; Fulfilled when the system sends the outcome notice after anonymisation; Denied when an Admin denies. The request also carries two flags, blocked by obligation and jurisdiction review required. FR-016 shows the status and owns the deletion certificate (REQ-016-062); it does not set Fulfilled.'
    rationale: 'Closes the lifecycle gaps: every status has a step that sets it. Fulfilment is set by the system at the outcome notice (a default); FR-016 shows it and generates the certificate (REQ-016-062).'
- op: add_node
  id: STP-023-007
  type: Step
  owner_fr: FR-023
  title: System sets the request to In Progress and emits dsr.in_progress
  attrs:
    prd_ref: Main Flow step 5
- op: add_node
  id: REQ-023-045
  type: Rule
  title: Retention defaults to 10 years, never below 10; a jurisdiction override may only extend
  owner_fr: FR-023
  attrs:
    statement: The retention period of every category MUST default to 10 years and MUST NOT be set below 10 years (REQ-SYS-002). A jurisdiction override may only extend the period, and the stricter retention on a jurisdiction conflict is the longer period.
    rationale: 'Owner default 71: the Admin retention screen cannot shorten any category below REQ-SYS-002, and the stricter retention on a conflict is the longer one.'
    scope: global
