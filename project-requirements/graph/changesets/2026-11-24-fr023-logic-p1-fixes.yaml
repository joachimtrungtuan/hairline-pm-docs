  id: REQ-023-011
  attrs:
    statement: 'Audit log entries MUST be immutable; their retention follows the system PRD, Platform-Wide Rules: One 10-year retention period. An entry is never edited and never marked deleted: after a fulfilled deletion request it is anonymised by removing the identifying data from the patient record the entry points to, so the entry stays unchanged and no longer identifies the patient.'
    rationale: An immutable entry cannot also be rewritten or soft-deleted, so anonymisation works on the patient record the entry points to, not on the entry.
