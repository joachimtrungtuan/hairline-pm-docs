- op: update_node
  id: SET-retention-period-by-category
  attrs:
    default: 10 years
    description: Retention policy per data category (Medical Records, Financial Records, Communications, Media, Account Profile, Analytics) with legal basis and per-jurisdiction overrides, configured by Admin. Every category defaults to the one 10-year period of the system PRD (REQ-SYS-002) and cannot be set below it; a jurisdiction override may only extend the period (REQ-023-045). The PRD names module A-09 for the configuration and no FR-026 setting; FR-023 owns the policy itself.
    unit: years
- op: update_node
  id: ENT-retention-policy.default_retention
  attrs:
    description: 'Default retention duration of the category: 10 years, never below 10 (REQ-023-045, REQ-SYS-002).'
- op: update_node
  id: ENT-retention-policy.jurisdiction_overrides
  attrs:
    description: Per-jurisdiction retention that replaces the default and may only extend it; on a conflict the longer period applies (REQ-023-045, REQ-023-039).
