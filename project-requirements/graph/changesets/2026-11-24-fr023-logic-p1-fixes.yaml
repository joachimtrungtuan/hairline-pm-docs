- op: update_node
  id: ENT-deletion-request
  attrs:
    description: 'Data Subject Request (DSR) of type deletion: a patient''s request to erase account data, reviewed by an Admin (classification, approval or denial, inquiry cancellation, anonymisation or archival in place of every category, access restriction of protected records) and notified to the patient at each status change. FR-016 reviews it on Screen 8. This entity is the single deletion-request record used by the FR-001 Delete Account screen and the FR-016 queue (the former FR-001 stub ENT-account-deletion-request is merged into it).'
