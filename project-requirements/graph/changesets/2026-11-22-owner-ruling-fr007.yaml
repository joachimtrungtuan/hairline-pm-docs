reason: "Owner rulings of 2026-11-22 applied to FR-007: a provider suspension or deactivation refunds the patient in full like a withdrawal or drop-out, replacing the provider-status placeholder; a treatment already started and interrupted by the provider's fault gets an admin-set refund (zero up to the full amount paid, mandatory reason and audit entry) with the provider payout held until the admin decides."
by: controller
operations:
  - {"op": "update_node", "id": "REQ-007-022", "title": "Provider fault after acceptance blocks payment and refunds paid money in full; an interrupted treatment gets an admin-set refund", "attrs": {"statement": "When a provider fault after acceptance closes a booking (FR-006 Alternative Flow B5), System MUST block further payment against it. When the provider withdraws, drops out, or is suspended or deactivated (FR-006 Alternative Flow B4), the patient is refunded in full everything paid, with no patient fee, and the replacement booking takes a new payment. For a treatment already started and interrupted by the provider's fault, an admin MUST review the case and set the patient refund amount, from zero up to the full amount paid, with a mandatory reason and an audit entry, and the provider's payout for that booking MUST be held until the admin decides (see Fund Release & Money Routing Rules). Detailed refund and fund-release mechanics are defined in FR-007B and FR-017. A provider fault during Aftercare reassigns only the aftercare provider or team (FR-011) and has no payment effect here.", "rationale": "prd.md lines 162, 165, 167 (Alternative Flow B4: provider fault after acceptance and before treatment; a provider fault during Aftercare has no payment effect; refund and fund-release mechanics are defined in FR-007B and FR-017) and line 813 (Fund Release & Money Routing Rules: treatment interrupted by the provider's fault). Owner ruling 2026-11-22."}}
  - {"op": "update_node", "id": "STP-007-062", "title": "Payment against the closed booking is blocked; on a provider withdrawal, drop-out, suspension, or deactivation the patient is refunded in full and pays no cancellation fee"}
