  - {"op": "update_node", "id": "ENT-installment-payment.status", "attrs": {"description": "One list: Scheduled, Retrying, Paid, Failed, Cancelled. Overdue is not a status: it is the calculated is_overdue flag, not stored."}}
  - {"op": "update_node", "id": "ENT-installment-payment.reminder_status", "attrs": {"description": "Whether the reminders due so far were sent or the next one is still pending; shown to the patient. Up to 3 reminders follow the FR-007 payment reminder setting."}}
  - {"op": "update_node", "id": "ENT-installment-payment.amount", "attrs": {"description": "Installment amount; installments 1 to N-1 are equal shares rounded down to the currency's smallest unit and the last installment is the total minus the others, so the amounts sum to the total amount."}}
  - {"op": "update_node", "id": "ENT-installment-plan.status", "attrs": {"description": "Active, Cancelled, Completed (shown as Fully Paid) or Defaulted. Overdue is not a status: it is the calculated is_overdue flag, not stored."}}
  - {"op": "update_node", "id": "ENT-installment-plan.max_installments", "attrs": {"description": "Calculated maximum number of installments available, 2 to 9: (days until procedure minus the plan's cutoff days) divided by 30, rounded down, plus 1 (60 days with a 30-day cutoff gives 2)."}}
  - {"op": "update_node", "id": "ENT-installment-plan.days_until_procedure", "attrs": {"description": "Days remaining until the procedure; the installment option needs at least the cutoff days plus 30."}}
  - {"op": "update_node", "id": "ENT-installment-plan-metrics.overdue_installments_count", "attrs": {"description": "Count of installments flagged Overdue, including those with an automatic retry still pending; flagged for admin action."}}
  - {"op": "update_node", "id": "ENT-payment-method", "attrs": {"description": "The single record of a patient's saved payment method, used by installment plans and read by the FR-007 payment screens and the FR-016 patient payments view. The payment method it records is a card: a tokenized recurring payment method. Installments need a saved card and the first installment must use it; a bank transfer cannot pay an installment plan. Belongs to one patient; used by one or more installment plans. Full card numbers are never stored."}}
  - {"op": "update_node", "id": "EVT-installment-reminder-due", "attrs": {"description": "Reminder to the patient before each installment due date at the times set in the FR-007 payment reminder setting, by email and push (REQ-007B-014)."}}
  - {"op": "update_node", "id": "SCR-007B-02", "attrs": {"description": "Allow the patient to view the installment payment schedule and history from the booking details screen. UI controls: progress bar, countdown, Update Payment Method button (opens payment method management from the FR-001 menu, REQ-001-151), Pay now button on a Failed or Overdue installment, receipt download."}}
  - {"op": "update_node", "id": "SCR-007B-06", "attrs": {"description": "Actionable view of one booking's installment plan with the Admin Action Panel (Retry Charge, Mark as Resolved), each with a justification of at least 20 characters. The panel is a UI control group; its justification is written to the audit log (S-06), not to a graph entity. Cancelling a booking is not a plan action: it uses the FR-006 Cancel Booking action."}}
  - {"op": "update_node", "id": "REQ-007B-002", "attrs": {"statement": "System MUST determine feasible installment options based on time until procedure, monthly frequency, and the cutoff days configured in FR-029 (minimum 30 days; the plan keeps the cutoff days it was created with); the maximum number of installments is (days until procedure - cutoff days) ÷ 30, rounded down, plus 1, so 60 days with a 30-day cutoff allows 2 installments; offered options are limited to enabled installment counts configured in FR-029 (2-9)"}}
  - {"op": "update_node", "id": "REQ-007B-004", "attrs": {"statement": "System MUST calculate installment amounts as equal shares of the booking total (accepted price after promotion) ÷ number of installments, rounded down to the currency's smallest unit; the last installment is the total minus the sum of the others, so the amounts always sum to the total"}}
  - {"op": "update_node", "id": "REQ-007B-008", "attrs": {"statement": "System MUST track installment payment status as one list: scheduled, retrying, paid, failed, cancelled; Overdue is a calculated flag, not a status"}}
  - {"op": "update_node", "id": "REQ-007B-009", "attrs": {"statement": "System MUST persist a patient's card securely for recurring charges (tokenized); installments need a saved card and the first installment MUST use it, so a bank transfer cannot pay an installment plan"}}
  - {"op": "update_node", "id": "REQ-007B-014", "title": "Reminders follow the FR-007 payment reminder setting", "attrs": {"statement": "System MUST send installment payment reminders at the times set in the FR-007 payment reminder setting (whole days 0 to 14 before the due date, up to 3 reminders, default 3 days before and on the due date)"}}
  - {"op": "add_edge", "from": "REQ-007B-014", "verb": "governed by", "to": "SET-payment-reminder-timing"}
  - {"op": "update_node", "id": "REQ-007B-018", "attrs": {"statement": "System MUST execute 3 automatic retry attempts for an installment whose charge failed for a technical reason, with waits of 1 day, 3 days and 7 days (retries fall on day 1, day 4 and day 11 after the failure). After a hard decline System MUST NOT retry automatically; it MUST notify the patient, who must use Pay now or update the card, and the installment becomes Defaulted on day 11 after the due date if still unpaid. Admin retries do not count toward the 3 automatic retries"}}
  - {"op": "update_node", "id": "REQ-007B-019", "title": "Plan flagged Defaulted after three failed retries or on day 11 after a hard decline", "attrs": {"statement": "System MUST flag installment plan as \"Defaulted\" after 3 failed retry attempts, or on day 11 after the due date when the charge was hard declined and the installment is still unpaid"}}
  - {"op": "update_node", "id": "REQ-007B-021", "title": "Patient can update the card and pay a failed or overdue installment at once", "attrs": {"statement": "System MUST allow the patient to update the card of an active installment plan at any time before the next installment is charged; the new card applies to the remaining installments and to a Failed or Overdue one, which the update re-offers to charge, and the patient can charge it at once with Pay now. Neither happens while the support-required marker is on"}}
  - {"op": "update_node", "id": "REQ-007B-022", "title": "Refund base is the paid amount excluding late fees; FR-006 and FR-007 compute the refund", "attrs": {"statement": "System MUST show the admin the amount paid so far excluding late fees as the refund base. FR-006 and FR-007 compute the refund as a percentage of that amount per the cancellation refund ladder owned by FR-029 (or the provider-fault terms), and FR-007B only voids the unpaid installments and records the outcome"}}
  - {"op": "update_node", "id": "REQ-007B-024", "title": "Date change recalculates the schedule or is blocked when no plan fits", "attrs": {"statement": "System MUST handle an admin date change by recalculating the installment schedule from the new date; when the remaining installments cannot all be scheduled at least the cutoff days before it, System MUST return no feasible plan and FR-006 blocks the change"}}
  - {"op": "update_node", "id": "REQ-007B-026", "attrs": {"statement": "System MUST allow a failed first installment to be retried, or another payment method used, only within the original FR-006 payment hold; when the hold expires the booking moves to `Payment Window Expired` and installment checkout is blocked. `Payment Window Expired` applies only to that first payment step, and missed later installments MUST NOT cause `Payment Window Expired` or inquiry cancellation; they cancel the booking only at the FR-029 Unpaid Balance Cancellation Point, when one is set"}}
  - {"op": "update_node", "id": "REQ-007B-027", "attrs": {"statement": "When the provider fails after acceptance (FR-006 Alternative Flows B4 and B5 only), System MUST cancel remaining installments with no patient cancellation fee. On a provider withdrawal, drop-out, suspension or deactivation, System MUST refund in full every installment already paid, and the replacement booking takes a new payment. The FR-006 unpaid-balance cancellation does not take this path: it takes the refund ladder"}}
  - {"op": "update_node", "id": "REQ-007B-031", "title": "Provider banner for an Overdue or Defaulted plan", "attrs": {"statement": "If a plan has an Overdue installment or is \"Defaulted\", the provider detail screen shows the banner \"Please contact Hairline support; payment follow-up is handled by admin team.\""}}
  - {"op": "update_node", "id": "REQ-007B-032", "title": "Provider notified once when a plan is Defaulted; an Overdue installment shows the banner only", "attrs": {"statement": "Providers are notified when a plan is Defaulted (REQ-007B-020); while an installment is Overdue the provider sees the banner on the plan detail screen only."}}
  - {"op": "remove_edge", "from": "REQ-007B-032", "verb": "applies to", "to": "EVT-installment-provider-overdue-alert"}
  - {"op": "remove_edge", "from": "STG-main-05-payment", "verb": "emits", "to": "EVT-installment-provider-overdue-alert"}
  - {"op": "retire_node", "id": "EVT-installment-provider-overdue-alert"}
  - {"op": "update_node", "id": "REQ-007B-033", "attrs": {"statement": "The provider installment list supports filtering by plan status (Active, Cancelled, Completed, Defaulted), the Overdue flag and procedure date range. Default sort is nearest upcoming procedure date, then highest risk (Overdue/Defaulted) at top. Overdue and defaulted plans are visually emphasized (e.g. warning badges, sort to top)"}}
  - {"op": "update_node", "id": "REQ-007B-035", "attrs": {"statement": "The installment checkout displays the explanation \"Final payment must complete [cutoff days] days before your procedure\" and shows the maximum installments prominently with the calculation explanation."}}
  - {"op": "update_node", "id": "REQ-007B-039", "title": "Installment option disabled when fewer than the cutoff days plus 30 remain", "attrs": {"statement": "The installment option is disabled if the days until the procedure are fewer than the cutoff days plus 30 (so at least 2 installments fit with the final one by the cutoff)."}}
  - {"op": "update_node", "id": "REQ-007B-044", "attrs": {"statement": "The patient installment schedule view shows a progress bar of installments completed over total installments, a countdown \"X days until next payment\", the reminder status (\"Reminder sent\" or \"Reminder pending\"), the final deadline \"All payments complete by [date]\", a visual timeline with checkmarks for completed installments and a status for each installment (Scheduled, Retrying, Paid, Failed, Cancelled) with an Overdue flag beside it. Payment history is read-only."}}
  - {"op": "update_node", "id": "REQ-007B-045", "title": "Overdue installments highlighted in red and labelled Overdue", "attrs": {"statement": "An Overdue installment is highlighted in red with the label \"Overdue\" on the patient schedule view; a separate \"Retry scheduled\" tag shows while an automatic retry is pending."}}
  - {"op": "update_node", "id": "REQ-007B-047", "attrs": {"statement": "After the patient provides new card details, the system validates and saves them and applies the new card to the remaining installments and to a Failed or Overdue one; future installments are charged to the new card and previous installments are unaffected."}}
  - {"op": "update_node", "id": "REQ-007B-049", "attrs": {"statement": "When the final installment is paid, normally by the cutoff date, the system marks the installment plan as completed (shown as \"Fully Paid\"); the booking status continues to follow FR-006."}}
  - {"op": "update_node", "id": "REQ-007B-050", "title": "No rescheduling fee applies to an installment plan in V1", "attrs": {"statement": "No rescheduling fee is charged on an installment plan: patient rescheduling is deferred to V2 and an admin date change charges none."}}
  - {"op": "remove_edge", "from": "REQ-007B-050", "verb": "governed by", "to": "SET-late-payment-fee"}
  - {"op": "remove_edge", "from": "REQ-007B-050", "verb": "governed by", "to": "SET-rescheduling-fee"}
  - {"op": "update_node", "id": "REQ-007B-051", "attrs": {"statement": "Admin reviews and contacts the patient to resolve the payment issue; payment is resolved manually, or the admin cancels the booking through the FR-006 Cancel Booking action with a mandatory reason, only while the booking is Accepted, Payment Window Expired or Confirmed (REQ-007B-104). Admin can cancel the booking for chronically defaulted plans."}}
  - {"op": "update_node", "id": "REQ-007B-052", "title": "Later missed installments cancel the booking only at the cancellation point", "attrs": {"statement": "Alternative Flow B1 covers installments after the first. A missed or failed later installment never causes `Payment Window Expired` or inquiry cancellation; it cancels the booking only at the FR-029 Unpaid Balance Cancellation Point, when one is set (REQ-007B-102). Failure of the first installment at checkout is part of the first payment step and follows the FR-006 payment hold.", "rationale": "PRD prose rule, no id: Alternative Flow B1, Boundary bullet."}}
  - {"op": "update_node", "id": "REQ-007B-054", "attrs": {"statement": "Cancellation refunds are a percentage of the amount paid so far, excluding late fees, set by the refund ladder in FR-029 (Payment settings)."}}
  - {"op": "update_node", "id": "REQ-007B-057", "attrs": {"statement": "The system records the refund outcome on the installment plan once FR-007 has started the refund; booking status moves to Cancelled per FR-006; no further installments are charged."}}
  - {"op": "update_node", "id": "REQ-007B-059", "attrs": {"statement": "When a patient disputes a charge for a partial-installment refund, the admin reviews the dispute and the refund is processed per the resolution through the FR-007 approval (another billing admin, escalating to a super-admin, never self-approved); the admin may cancel the booking where its state allows it, or allow continuation."}}
  - {"op": "update_node", "id": "REQ-007B-061", "attrs": {"statement": "After a date change the system checks whether every remaining installment still fits at least the cutoff days (FR-029 snapshot) before the new procedure date; if so, the system adjusts the installment schedule dates to the new date and returns the schedule to FR-006 Screen 8 read-only."}}
  - {"op": "update_node", "id": "REQ-007B-062", "title": "No feasible plan blocks the date change", "attrs": {"statement": "When the remaining installments cannot all be scheduled at least the cutoff days before the new date, the system returns no feasible plan and FR-006 blocks the change (FR-006 REQ-006-017); the booking date and the plan stay as they were and no notice is sent. The admin may cancel the booking through the FR-006 Cancel Booking action instead."}}
  - {"op": "remove_edge", "from": "REQ-007B-062", "verb": "applies to", "to": "ACT-patient"}
  - {"op": "remove_edge", "from": "REQ-007B-062", "verb": "applies to", "to": "EVT-installment-insufficient-time-notice"}
  - {"op": "remove_edge", "from": "REQ-007B-024", "verb": "applies to", "to": "EVT-installment-insufficient-time-notice"}
  - {"op": "remove_edge", "from": "STG-main-05-payment", "verb": "emits", "to": "EVT-installment-insufficient-time-notice"}
  - {"op": "retire_node", "id": "EVT-installment-insufficient-time-notice"}
  - {"op": "update_node", "id": "REQ-007B-070", "title": "Commission and payout timing are owned by FR-007 and FR-017", "attrs": {"statement": "Commission calculation (type and value from the snapshot taken at booking confirmation, FR-029), payout timing and the release of the clinic's money are owned by FR-007 and FR-017. FR-007B adds only that the plan is Completed when the final installment is paid."}}
  - {"op": "update_node", "id": "REQ-007B-071", "title": "The plan is Completed when the final installment is paid; payout timing follows FR-007 and FR-017", "attrs": {"statement": "Provider payout timing is owned by FR-007 and FR-017. FR-007B contributes only the Completed plan status once every installment is paid."}}
  - {"op": "update_node", "id": "REQ-007B-074", "attrs": {"statement": "The following are fixed in code and not editable by the admin: interest rate (always 0%), installment frequency (monthly, 30-day intervals), core payment security controls and encryption standards, number of retry attempts (3, only after a technical failure), retry schedule (waits of 1, 3 and 7 days) and audit logging scope for payment events. Reminder timing is the FR-007 payment reminder setting, not fixed here. Payment processor integration settings require technical deployment and are not runtime editable."}}
  - {"op": "update_node", "id": "REQ-007B-075", "attrs": {"statement": "The admin dashboard shows the active plans count, overdue installments (installments flagged Overdue, including those with a retry pending, flagged for admin action), the Defaulted plans count, total installment revenue collected, average installments selected and success rate (successful installment charges over total attempts), and a plan list with patient, provider, status and progress, whose filter criteria are owned by FR-022, with drill-down into individual plan details; the admin can generate reports on installment plan usage and performance."}}
  - {"op": "update_node", "id": "REQ-007B-076", "attrs": {"statement": "The admin sees an aging report showing days overdue for Overdue installments."}}
  - {"op": "update_node", "id": "REQ-007B-080", "title": "Admin Retry Charge on a Failed or Overdue installment", "attrs": {"statement": "The admin can perform Retry Charge on a Failed installment or one flagged Overdue (invokes the payment processor via S-02). Admin retries do not count toward the 3 automatic retries; on success the installment is Paid, on failure it returns to Failed and the plan is unchanged."}}
  - {"op": "update_node", "id": "REQ-007B-081", "title": "Admin Mark as Resolved settles the installment and can reopen the plan", "attrs": {"statement": "The admin can Mark as Resolved an unpaid installment when an external or manual payment has been handled: the system records the external payment, sets the installment Paid with source manual, and when no installment is unpaid sets the plan back to Active, or Completed when every installment is Paid."}}
  - {"op": "add_edge", "from": "REQ-007B-092", "verb": "applies to", "to": "EVT-installment-overdue-notice"}
  - {"op": "update_node", "id": "REQ-007B-092", "attrs": {"statement": "Installment notifications (reminders, payment confirmations, payment failures, overdue notices, admin alerts) go by email and push; SMS installment notifications are not available in MVP and the channel is a future enhancement. Chat between patient and provider about payment terms and marketing content about installment plans are out of scope."}}
  - {"op": "update_node", "id": "REQ-007B-095", "attrs": {"statement": "Overdue Days is the number of days since the due date of the first missed installment and appears only for plans with an Overdue installment or flagged Defaulted."}}
  - {"op": "update_node", "id": "REQ-007B-098", "title": "Money movement is owned by FR-007 and FR-017", "attrs": {"statement": "Money movement (Hairline as the seller on the card payment, refunds, chargebacks and Stripe fees paid from Hairline's balance first, the clinic's share moving to its locked Stripe balance, the pull-back on cancellation or rescheduling, and the payout at release) is owned by FR-007 (REQ-007-090) and FR-017. The day count for an installment plan once fully paid is that FR-007 rule, separate from the plan's cutoff days. FR-007B adds only that the share moves when the plan is fully paid and a Defaulted plan blocks the movement."}}
  - {"op": "update_node", "id": "REQ-007B-099", "attrs": {"statement": "A late fee is added once to an installment when the late payment grace period (FR-029), counted from the due date, passes with the installment unpaid. It is collected with the next successful charge, never as a separate charge, and the refund base excludes it. The fee amount is set by the admin in FR-029."}}
  - {"op": "update_node", "id": "REQ-007B-100", "attrs": {"statement": "Overdue is not a status: it is a calculated flag on the installment, true from the day after its due date while it is unpaid and not Cancelled, and it is not stored. The plan flag is true while any installment is Overdue."}}
