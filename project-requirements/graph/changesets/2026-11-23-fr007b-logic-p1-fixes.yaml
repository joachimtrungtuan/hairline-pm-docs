  - {"op": "add_node", "id": "REQ-007B-103", "type": "Rule", "title": "A pending provider fault pauses every charge, retry, reminder, Overdue flag, Defaulted flag and late fee", "owner_fr": "FR-007B", "attrs": {"statement": "While the booking carries the support-required marker (FR-006 REQ-006-081), System MUST NOT charge, retry, remind, flag Overdue or Defaulted, or add a late fee for an installment, and the retry and grace clocks are paused, not reset. A card update is still accepted but re-offers no charge. If a replacement is accepted, the replacement plan recalculates all dates (B4); otherwise charges resume at the Screen 10 submit."}}
