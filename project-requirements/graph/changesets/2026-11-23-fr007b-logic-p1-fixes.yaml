  - {"op": "add_node", "id": "REQ-007B-102", "type": "Rule", "title": "The cancellation point cancels the booking for an unpaid balance whatever the retry state", "owner_fr": "FR-007B", "attrs": {"statement": "When the FR-029 Unpaid Balance Cancellation Point is set and the booking was confirmed after it was set, System hands the Confirmed booking to FR-006 Alternative Flow B8 (cause UnpaidBalance) that many days after the due date of the first missed installment, whatever the retry, grace period or Defaulted state; pending retries and the grace period end with the plan. While the point is unset nothing cancels automatically. It covers any unpaid balance."}}
