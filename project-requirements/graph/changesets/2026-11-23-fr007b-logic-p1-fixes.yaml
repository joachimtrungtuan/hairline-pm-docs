  - {"op": "add_node", "id": "REQ-007B-105", "type": "Rule", "title": "Later installments on a Defaulted plan are paused until an admin resolves it", "owner_fr": "FR-007B", "attrs": {"statement": "While a plan is Defaulted, System MUST NOT charge its later installments on their due dates; they stay paused until an admin resolves the plan with Mark as Resolved or a successful Retry Charge."}}
  - {"op": "add_edge", "from": "REQ-007B-105", "verb": "applies at", "to": "STG-main-05-payment"}
