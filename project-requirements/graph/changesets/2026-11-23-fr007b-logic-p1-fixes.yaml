  - {"op": "add_node", "id": "REQ-007B-104", "type": "Rule", "title": "After treatment starts a Defaulted plan is resolved by payment only", "owner_fr": "FR-007B", "attrs": {"statement": "The FR-006 Cancel Booking route is open only while the booking is Accepted, Payment Window Expired or Confirmed, and in In Progress only through the FR-006 provider-fault route. Once treatment has started, a Defaulted plan is resolved by payment only (Retry Charge or Mark as Resolved), with no cancel route."}}
