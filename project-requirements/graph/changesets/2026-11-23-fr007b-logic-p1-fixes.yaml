  - {"op": "add_node", "id": "REQ-007B-101", "type": "Rule", "title": "Overdue starts the day after the due date with one patient notice and one billing-admin notice", "owner_fr": "FR-007B", "attrs": {"statement": "An installment is Overdue from the day after its due date while it is unpaid and not Cancelled. On that day System sends the patient one overdue notice and notifies the billing admins once. The provider sees the Overdue banner on the plan detail screen and is notified only when the plan is Defaulted."}}
