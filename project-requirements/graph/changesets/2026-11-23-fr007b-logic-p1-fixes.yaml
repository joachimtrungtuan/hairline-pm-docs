reason: "FR-007B logic review pass 1: Overdue is a calculated flag from the day after the due date with one patient and one billing-admin notice and a provider banner; an unpaid balance reaches the FR-006 cancellation point whatever the retry state; a pending provider fault pauses charges, retries, reminders and fees; the cancel route and the Defaulted plan are guarded by booking state and the refund is computed by FR-006 and FR-007 from the paid amount excluding late fees; no feasible plan blocks an admin date change; the provider-fault refund and replacement plan are no longer entered from the unpaid-balance cancellation; reminders follow the FR-007 setting; the installment threshold reads the cutoff days; a late fee is added once and collected with the next successful charge; a hard decline reaches Defaulted on day 11 and can be paid with Pay now; Defaulted plans pause later installments and Mark as Resolved and Retry Charge have defined results; installments need a card; payout and commission timing point to FR-007 and FR-017; the rescheduling fee does not apply in V1; spelling aligned."
by: docs-manager
operations:
  - {"op": "add_node", "id": "EVT-installment-overdue-notice", "type": "Event", "title": "Installment overdue notice", "owner_fr": "FR-007B", "attrs": {"description": "One notice to the patient and one to the billing admins on the day after an installment due date passes with the installment unpaid (REQ-007B-101)."}}
