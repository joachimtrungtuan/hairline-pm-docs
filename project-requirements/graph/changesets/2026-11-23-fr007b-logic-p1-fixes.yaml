  - {"op": "update_node", "id": "REQ-007B-028", "attrs": {"statement": "Patient has accepted a quote (FR-005) and reaches the Payment Options step in the booking and payment flow (FR-006/FR-007), which offers pay in full, deposit and balance, or installments; selecting \"Pay in Installments\" hands off to FR-007B Screen 1. Patient views the installment schedule from the booking details screen. Admin accesses installment management from the billing/financial management module. Provider views installment status from the booking overview screen."}}
  - {"op": "update_node", "id": "REQ-007B-040", "title": "The other payment options stay available alongside installments", "attrs": {"statement": "The other payment options FR-007 offers (pay in full, deposit and balance) are always available as alternatives to installments, and the checkout shows them as alternatives; when fewer days remain than the FR-029 balance due days only pay in full is offered (REQ-007B-106)."}}
  - {"op": "update_node", "id": "REQ-007B-041", "title": "Pay in full and deposit and balance are handled by FR-007 and do not invoke FR-007B", "attrs": {"statement": "When the patient selects pay in full or deposit and balance on the Payment Options step, the system routes to the checkout defined in FR-007, the payment is recorded per FR-007 and booking status follows FR-006; the booking is confirmed without an installment plan and FR-007B is not invoked."}}
  - {"op": "update_node", "id": "REQ-007B-053", "attrs": {"statement": "The patient requests cancellation through Contact Support; after subquote acceptance the patient cannot cancel in the app (FR-006) and the request reaches the admin queue in FR-016. The admin reviews the request and cancels the booking through the FR-006 Cancel Booking action with a mandatory reason and audit entry; FR-006 and FR-007 compute the refund (the refund ladder set in FR-029, or the provider-fault terms where the provider is at fault), and a refund that needs approval follows FR-007 REQ-007-015."}}
  - {"op": "update_node", "id": "REQ-007B-096", "title": "Refund and fund-release mechanics are owned by FR-007 and FR-017", "attrs": {"statement": "Refund, fund-release and payment-allocation mechanics are owned by FR-007 and FR-017; FR-007B only voids the unpaid installments and records the outcome."}}
