  - {"op": "add_field", "id": "ENT-installment-payment.late_fee_amount", "entity_id": "ENT-installment-payment", "name": "late_fee_amount", "data_type": "money", "title": "Late fee amount", "owner_fr": "FR-007B", "attrs": {"description": "Late fee added once to the installment when the grace period passes unpaid; collected with the next successful charge and excluded from the refund base."}}
