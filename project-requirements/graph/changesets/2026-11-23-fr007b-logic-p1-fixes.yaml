  - {"op": "add_node", "id": "REQ-007B-107", "type": "Rule", "title": "Retries and the grace period continue past the cutoff; the share moves when the plan is fully paid", "owner_fr": "FR-007B", "attrs": {"statement": "Retries and the grace period continue past the cutoff date. The plan is Completed whenever the final installment is paid, and the clinic's share moves then, whatever the date. A Defaulted plan blocks the share movement."}}
