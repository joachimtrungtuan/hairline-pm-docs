  - {"op": "add_node", "id": "REQ-007B-106", "type": "Rule", "title": "The installment option is offered only when installments are enabled, the amount qualifies and enough days remain", "owner_fr": "FR-007B", "attrs": {"statement": "System MUST offer the installment option only when installments are enabled in FR-029, the booking total is at or above the FR-029 minimum booking amount (converted at the locked rate) and the days until the procedure are at least the cutoff days plus 30. When fewer days remain than the FR-029 balance due days only pay in full is offered."}}
