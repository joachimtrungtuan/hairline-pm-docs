  - {"op": "update_node", "id": "ENT-payment-method", "attrs": {"description": "The single record of a patient's saved payment method, used by installment plans and read by the FR-007 payment screens and the FR-016 patient payments view. The payment methods it records are card and bank transfer. For a card it is a tokenized recurring payment method; for a bank transfer, which has no saved card, there is no card token, last 4 digits or expiration date to show. Belongs to one patient; used by one or more installment plans. Full card numbers are never stored."}}
