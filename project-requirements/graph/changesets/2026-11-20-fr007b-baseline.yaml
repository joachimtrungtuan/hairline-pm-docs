reason: "Requirements graph programme baseline 2026-11-20: owner rulings applied (FR-007B)"
by: controller
operations:
  - {"op": "retire_node", "id": "REQ-007B-082"}
  - {"op": "retire_node", "id": "SET-installment-first-installment-type"}
  - {"op": "update_node", "id": "REQ-007B-002", "attrs": {"statement": "System MUST determine feasible installment options based on time until procedure, monthly frequency, and cutoff days configured in FR-029 (minimum 30 days); the maximum number of installments is (days until procedure - 30) ÷ 30 + 1, rounded down, so 60 days allows 2 installments; offered options are limited to enabled installment counts configured in FR-029 (2-9)"}}
  - {"op": "update_node", "id": "REQ-007B-004", "attrs": {"statement": "System MUST calculate installment amounts as equal shares: booking total (accepted price after promotion) ÷ number of installments, rounded to 2 decimal places"}}
  - {"op": "update_node", "id": "REQ-007B-008", "attrs": {"statement": "System MUST track installment payment status as one list: scheduled, retrying, paid, failed, overdue, cancelled"}}
  - {"op": "update_node", "id": "REQ-007B-012", "attrs": {"statement": "System MUST log every installment payment attempt and lifecycle event (scheduled, charged, failed, retried, refunded) with timestamp, amount, status, and user, in a tamper-evident audit trail"}}
  - {"op": "update_node", "id": "REQ-007B-018", "title": "Technical failures retried after waits of 1, 3 and 7 days; no automatic retry after a hard decline", "attrs": {"statement": "System MUST execute 3 automatic retry attempts for an installment whose charge failed for a technical reason, with waits of 1 day, 3 days and 7 days (retries fall on day 1, day 4 and day 11 after the failure). After a hard decline System MUST NOT retry automatically; it MUST notify the patient, who must retry or update the card"}}
  - {"op": "update_node", "id": "REQ-007B-021", "attrs": {"statement": "System MUST allow the patient to update the payment method of an active installment plan at any time before the next installment is charged; the new method applies to the remaining installments only"}}
  - {"op": "update_node", "id": "REQ-007B-022", "title": "Refund on partial installments is a percentage of the amount paid, per the FR-029 refund ladder", "attrs": {"statement": "System MUST calculate refunds for canceled bookings with partial installments paid as a percentage of the amount paid so far, per the cancellation refund ladder owned by FR-029"}}
  - {"op": "update_node", "id": "REQ-007B-023", "attrs": {"statement": "System MUST cancel remaining installments when booking is canceled; stopping the installments and the refund happen inside the FR-006 Cancel Booking action, and installment plans have no separate cancel action"}}
  - {"op": "update_node", "id": "REQ-007B-024", "attrs": {"statement": "System MUST handle procedure date rescheduling by recalculating installment schedule or requiring immediate payment; when the new date leaves too little time for the remaining installments, System MUST notify the patient (insufficient-time notice)"}}
  - {"op": "update_node", "id": "REQ-007B-031", "attrs": {"statement": "If a plan is flagged Overdue or is \"Defaulted\", the provider detail screen shows the banner \"Please contact Hairline support; payment follow-up is handled by admin team.\""}}
  - {"op": "update_node", "id": "REQ-007B-033", "attrs": {"statement": "The provider installment list supports filtering by plan status (Active, Canceled, Completed, Defaulted), the Overdue flag and procedure date range. Default sort is nearest upcoming procedure date, then highest risk (Overdue/Defaulted) at top. Overdue and defaulted plans are visually emphasized (e.g. warning badges, sort to top)."}}
  - {"op": "update_node", "id": "REQ-007B-044", "attrs": {"statement": "The patient installment schedule view shows a progress bar of installments completed over total installments, a countdown \"X days until next payment\", the reminder status (\"Reminder sent\" or \"Reminder pending\"), the final deadline \"All payments complete by [date]\", a visual timeline with checkmarks for completed installments and a status for each installment (Scheduled, Retrying, Paid, Failed, Overdue, Cancelled). Payment history is read-only."}}
  - {"op": "update_node", "id": "REQ-007B-050", "attrs": {"statement": "After a failed installment is resolved manually or the booking is cancelled, the patient may be charged late fees or rescheduling fees, with amounts set in the FR-029 late-fee and rescheduling-fee settings."}}
  - {"op": "update_node", "id": "REQ-007B-054", "attrs": {"statement": "Cancellation refunds are a percentage of the amount paid so far, set by the refund ladder in FR-029 (Payment settings)."}}
  - {"op": "update_node", "id": "REQ-007B-056", "title": "Refund ladder is owned and set in FR-029", "attrs": {"statement": "The cancellation refund ladder for installment plans is owned by FR-029 (Payment settings) and is configurable with restrictions."}}
  - {"op": "update_node", "id": "REQ-007B-062", "title": "Insufficient time: remaining balance paid immediately with reminders, or booking cancelled", "attrs": {"statement": "If the new procedure date leaves insufficient time, the system sends the patient an insufficient-time notice that the remaining balance must be paid immediately or the installment plan canceled; the patient pays the remaining balance immediately, and the system sends reminders until it is paid; or the admin, in coordination with the patient, cancels the booking through the FR-006 Cancel Booking action."}}
  - {"op": "update_node", "id": "REQ-007B-074", "attrs": {"statement": "The following are fixed in code and not editable by the admin: interest rate (always 0%), installment frequency (monthly, 30-day intervals), core payment security controls and encryption standards, number of retry attempts (3, only after a technical failure), retry schedule (waits of 1, 3 and 7 days), reminder timing (3 days before the due date) and audit logging scope for payment events. Payment processor integration settings require technical deployment and are not runtime editable."}}
  - {"op": "update_node", "id": "REQ-007B-075", "attrs": {"statement": "The admin dashboard shows the active plans count, overdue installments (failed after retries, flagged for admin action), total installment revenue collected, average installments selected and success rate (successful installment charges over total attempts), and a plan list with patient, provider, status and progress, whose filter criteria are owned by FR-022, with drill-down into individual plan details; the admin can generate reports on installment plan usage and performance."}}
  - {"op": "update_node", "id": "REQ-007B-079", "attrs": {"statement": "The admin views the installment plan configuration (managed in FR-029) and a link to the configuration screen for authorized users; enabled installment counts, cutoff days, minimum booking amount and the late payment grace period are configured in FR-029."}}
  - {"op": "update_node", "id": "REQ-007B-084", "attrs": {"statement": "Retry Charge is logged with installment ID and retry attempt number; Mark as Resolved with installment ID and resolution method."}}
  - {"op": "update_node", "id": "REQ-007B-095", "attrs": {"statement": "Overdue Days is the number of days since the first missed or failed installment and appears only for plans flagged Overdue or Defaulted."}}
  - {"op": "add_node", "id": "REQ-007B-098", "type": "Rule", "owner_fr": "FR-007B", "title": "Money movement follows the owner decisions that replace the missing Payment Routing Spec", "attrs": {"statement": "Money movement follows the owner decisions that replace the missing Payment Routing Spec: Hairline is the seller on the card payment, and Hairline's balance pays refunds, chargebacks and Stripe fees first and recovers the clinic's part afterwards. Hairline holds the payment; the clinic's share moves to the clinic's locked Stripe balance 60 days before treatment (30 days for an installment plan once it is fully paid) and is paid out at release. If the booking is cancelled after the share has moved, Hairline refunds the patient per the refund ladder, pulls the share back from the clinic's locked balance and deducts any shortfall from the clinic's next payout. If the booking is rescheduled after the share has moved, Hairline always pulls it back and moves it again 60 or 30 days before the new date.", "rationale": "PRD prose rule, no id. Payment & Billing Rules (money movement)."}}
  - {"op": "add_node", "id": "REQ-007B-099", "type": "Rule", "owner_fr": "FR-007B", "title": "Late fee charged when the late payment grace period passes without payment", "attrs": {"statement": "A late fee is charged when the late payment grace period (FR-029) has passed without payment; the amounts of the late fee and the rescheduling fee are set by the admin in FR-029.", "rationale": "PRD prose rule, no id. Payment & Billing Rules and Alternative Flow B1 Outcome."}}
