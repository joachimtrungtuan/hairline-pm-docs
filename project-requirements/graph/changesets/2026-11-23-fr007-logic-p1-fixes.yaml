  - {"op": "add_edge", "from": "REQ-007-095", "verb": "applies to", "to": "ENT-payment.refund_case"}
  - {"op": "update_node", "id": "REQ-007-063", "attrs": {"statement": "Refunds follow the FR-006 cancellation policy and the refund ladder set in FR-029 (launch default: >30 days before = 90% refund; 15-30 days before = 50% refund; <15 days before = no refund), unless an approved exception, for example a medical emergency. The ladder percentage applies to the amount paid toward the booking total; late payment fees are not part of that base. Provider-fault and in-treatment cases take the amount that REQ-006-053 sets"}}
  - {"op": "update_node", "id": "REQ-007-092", "attrs": {"statement": "When a clinic withdraws or drops out after acceptance (FR-006 Alternative Flow B5), a fixed charge set in admin settings MUST be deducted from the clinic's next payout. The patient cancellation fee is the amount paid toward the booking total less the amount refunded. It MUST be split between Hairline and the clinic by a percentage set in admin settings. Neither setting has a starting value; an admin sets it."}}
  - {"op": "update_node", "id": "REQ-007-091", "attrs": {"statement": "When a cancellation or a reschedule happens after the clinic's share has moved, the share MUST be pulled back (see Fund Release & Money Routing Rules): on cancellation the patient is refunded the amount the closure case sets (REQ-006-053) and any shortfall is deducted from the clinic's next payout; on reschedule the share moves again 60 or 30 days before the new date."}}
  - {"op": "update_node", "id": "REQ-007-090", "attrs": {"statement": "Hairline MUST be the seller on the card payment and hold the payment; the clinic's share moves to the clinic's locked Stripe balance 60 days before the scheduled treatment date (30 days for an installment plan once fully paid), or right away when less time remains at payment, and is paid out at release. For the deposit-and-balance option, the part of the amount paid that is above Hairline's commission moves at the 60-day mark and each later payment tops it up. Hairline's balance pays refunds, chargebacks, and Stripe fees first and recovers the clinic's part afterwards."}}
  - {"op": "update_node", "id": "REQ-007-022", "attrs": {"statement": "When a provider fault after acceptance closes a booking (FR-006 Alternative Flow B5), System MUST block further payment against it. When the provider withdraws, drops out, or is suspended or deactivated (FR-006 Alternative Flow B4), the patient is refunded in full everything paid, with no patient fee and no second approval, and the replacement booking takes a new payment. For a treatment already started and interrupted by the provider's fault, an admin MUST review the case and set the patient refund amount, from zero up to the full amount paid, with a mandatory reason and an audit entry, and the provider's payout for that booking MUST be held until the admin decides (see Fund Release & Money Routing Rules). Detailed refund and fund-release mechanics are defined in FR-007B and FR-017. A provider fault during Aftercare reassigns only the aftercare provider or team (FR-011) and has no payment effect here."}}
  - {"op": "update_node", "id": "STP-007-021", "title": "Admin opens Refund Processing on Screen 6 and reviews the closure case, the cancellation timing and the refund the case sets (the ladder percentage of the amount paid, late fees excluded)"}
  - {"op": "update_node", "id": "STP-007-022", "title": "System sets the refund for the case (full refund with no fee, the FR-029 ladder on the amount paid, or the admin-set amount) and starts it; a closure case needs no second approval"}
