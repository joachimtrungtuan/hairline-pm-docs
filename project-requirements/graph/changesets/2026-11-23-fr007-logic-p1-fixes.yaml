  - {"op": "add_node", "id": "EVT-refund-approval-escalated", "type": "Event", "title": "Refund approval overdue", "owner_fr": "FR-007", "attrs": {"description": "Escalation notice to billing admins when an exception or manual refund has had no decision for 2 business days; the refund stays awaiting approval."}}
  - {"op": "add_edge", "from": "STG-main-05-payment", "verb": "emits", "to": "EVT-refund-approval-escalated"}
  - {"op": "add_edge", "from": "REQ-007-015", "verb": "applies to", "to": "EVT-refund-approval-escalated"}
  - {"op": "update_node", "id": "REQ-007-064", "attrs": {"statement": "An exception to the policy (for example a medical emergency) needs documentation upload and the approval of a different admin with billing permission (REQ-007-015); the requester cannot approve it. The refund stays awaiting approval until the decision."}}
  - {"op": "add_edge", "from": "REQ-007-064", "verb": "applies to", "to": "ENT-payment.approval_status"}
