reason: "FR-007 logic review: one final-payment due date from the FR-029 balance due days and an Overdue definition with a scheduled trigger; unpaid-balance cancellation only through the FR-006 cancellation point; refund approval limited to exception and manual refunds with a second admin, deny action, escalation and one reason rule; Screen 6 as the single refund control with a case selector; refund base and cancellation fee; share movement for the deposit-and-balance option; payout eligibility after the confirmation window; retry and replacement steps wired; late capture refunded automatically; three payment options; payment status values defined; reminder setting range; standalone aftercare payment flow; in-treatment fault payout hold, refund and release steps; duplicate revive step retired in favour of FR-006"
by: docs-manager
operations:
  - {"op": "update_node", "id": "REQ-007-036", "title": "The final payment is due the FR-029 balance-due days before the procedure; an unpaid balance is Overdue from the next day and is flagged and notified", "attrs": {"statement": "The final payment is due the number of days before the procedure date that FR-029 sets as the deposit plan balance due days (launch default 7; an admin edits it in FR-029). A balance still unpaid is Overdue from the day after the due date. A scheduled job, not the display flag, raises the overdue event once, flags the booking and notifies billing admins. An overdue balance never causes Payment Window Expired and cancels the booking only through the FR-006 unpaid balance cancellation (REQ-007-021)."}}
  - {"op": "add_edge", "from": "REQ-007-036", "verb": "governed by", "to": "SET-deposit-plan-balance-due-days"}
  - {"op": "update_node", "id": "REQ-007-038", "title": "Final payment reminders follow the admin timing setting: up to three, 0 to 14 days before the due date, default three days before and on the due date", "attrs": {"statement": "Reminders for the final payment go out at the days set in the payment reminder timing setting: whole days from 0 to 14 before the due date, up to 3 reminders; the default is 3 days before the due date and on the due date. No reminder is sent while an FR-006 provider fault is pending on the booking (REQ-006-081)."}}
  - {"op": "update_node", "id": "REQ-007-076", "attrs": {"statement": "Configurable with Restrictions: Payment reminder timing: the single payment-reminder setting, owned by this module and read by FR-030; whole days 0 to 14 before the due date, up to 3 reminders, default 3 days before the due date and on the due date. The payout execution timing window is owned by FR-017 (not in this module)."}}
  - {"op": "update_node", "id": "SET-payment-reminder-timing", "attrs": {"description": "When the final payment reminders go out: whole days from 0 to 14 before the due date, up to 3 reminders. Owned by FR-007 and read by FR-030 and FR-017.", "default": "3 days before the due date and on the due date", "unit": "days"}}
  - {"op": "update_node", "id": "EVT-payment-overdue", "attrs": {"description": "A scheduled job raises this once when a balance is still unpaid the day after its due date; the booking is flagged Overdue and billing admins are notified."}}
  - {"op": "update_node", "id": "REQ-007-021", "attrs": {"statement": "`Payment Window Expired` MUST apply only to the first payment step, as stated in FR-006 (REQ-006-016). A missed later installment or final payment MUST NOT cause `Payment Window Expired`, booking cancellation, or inquiry cancellation, except the FR-006 unpaid balance cancellation (Alternative Flow B8) at the FR-029 Unpaid Balance Cancellation Point, which applies only when an admin has set that point and only to bookings confirmed after it is set."}}
  - {"op": "add_edge", "from": "REQ-007-021", "verb": "governed by", "to": "SET-unpaid-balance-cancellation-point"}
