  - {"op": "update_node", "id": "REQ-007-086", "attrs": {"statement": "When an admin denies an exception or manual refund on Screen 6, the system records the denial with its reason, keeps the booking and payment status unchanged and notifies the patient."}}
  - {"op": "add_edge", "from": "REQ-007-086", "verb": "applies to", "to": "ENT-payment.decision_reason"}
  - {"op": "add_edge", "from": "REQ-007-086", "verb": "applies to", "to": "ENT-payment.approval_status"}
  - {"op": "update_node", "id": "REQ-007-067", "title": "Refund actions audited with timestamp, requester, approver, decision and reason", "attrs": {"statement": "All refund actions are auditable with timestamp, requester, approver, decision, reason and the refund case."}}
  - {"op": "update_node", "id": "REQ-007-068", "title": "Refund reason is mandatory, 10 to 500 characters", "attrs": {"statement": "Mandatory audit field on every refund and every denial; 10 to 500 characters, the same admin reason rule as FR-006 (REQ-006-050)."}}
  - {"op": "update_node", "id": "REQ-007-074", "attrs": {"statement": "Refund approvals and reasons, within the closure case or the FR-006 cancellation policy"}}
  - {"op": "update_node", "id": "REQ-007-095", "attrs": {"statement": "On Screen 6, Process Refund is enabled only when all required fields are complete: the refund case, the reason and, for an admin-set case, the amount. An exception or manual refund is submitted for approval and processed once a different admin approves it."}}
  - {"op": "add_node", "id": "REQ-007-097", "type": "Rule", "title": "Screen 6 is the single refund execution control; the admin picks the refund case", "owner_fr": "FR-007", "attrs": {"statement": "Every refund is executed on Screen 6. The admin picks the case: a closure case (the amount follows the FR-006 closure cause, REQ-006-053), an exception to the policy, or a manual refund. The amount field is open only for an admin-set case (in-treatment provider fault, manual), from zero up to the amount paid. FR-006 Process Refund and the FR-017 refund action open this screen instead of running their own refund."}}
