  - {"op": "add_node", "id": "REQ-007-098", "type": "Rule", "title": "The patient has three payment options: pay in full now, deposit now and balance later, or installments", "owner_fr": "FR-007", "attrs": {"statement": "The patient chooses one of three payment options on FR-006 Screen 1: pay in full now, a deposit now with the balance later, or installments (2 to 9, FR-007B). FR-007 Screen 1 shows the chosen option read-only. The first successful charge of the chosen option confirms the booking."}}
