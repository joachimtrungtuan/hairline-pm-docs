  - {"op": "update_node", "id": "REQ-007-015", "title": "Exception and manual refunds need a second admin's approval within two business days; closure-case refunds need none", "attrs": {"statement": "Admin approval applies only to an exception refund and a manually entered refund. The approver is any other admin with billing permission, never the requester, and approves or denies within 2 business days; until then the refund is awaiting approval. When 2 business days pass with no decision, System sends an escalation notice to billing admins and never approves or denies on its own. A closure-case refund (REQ-006-053) runs with no second approval. The requester, approver, decision and reason are logged and notifications sent."}}
  - {"op": "add_edge", "from": "REQ-007-015", "verb": "applies to", "to": "ENT-payment.approval_status"}
