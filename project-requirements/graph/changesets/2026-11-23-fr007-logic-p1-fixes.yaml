  - {"op": "update_node", "id": "ENT-booking.payment_status", "attrs": {"description": "The single payment status of a booking, owned by FR-007 and read by FR-006: Unpaid, Deposit only, Installments active, Full paid, Refunded. Overdue is a calculated flag, not a list value (REQ-007-099)."}}
  - {"op": "add_node", "id": "REQ-007-099", "type": "Rule", "title": "Payment status values are defined: Refunded means all paid money returned, Partial deposit means part of the deposit received", "owner_fr": "FR-007", "attrs": {"statement": "Unpaid: nothing is paid. Deposit only: the deposit is paid and the balance is not. Installments active: an installment plan has started and is not fully paid. Full paid: the whole payable total is paid. Refunded: all money paid has been returned; a part refund leaves the previous status and shows in the refund history. Deposit status Partial: only part of the deposit amount has been received and the rest is still due; the booking is not confirmed until the full deposit is paid. At Risk is not a status."}}
