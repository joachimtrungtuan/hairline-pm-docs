  - {"op": "update_node", "id": "REQ-007-001", "title": "Patients pay the accepted subquote's booking by one of three options: in full, deposit then balance, or installments", "attrs": {"statement": "System MUST allow patients to pay the accepted subquote's booking by one of three options (REQ-007-098): in full now, a deposit now with the balance by its due date, or installments per FR-007B; the first successful charge confirms the same booking."}}
