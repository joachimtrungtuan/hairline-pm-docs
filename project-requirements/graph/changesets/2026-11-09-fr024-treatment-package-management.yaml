  - {"op": "add_node", "id": "REQ-024-043", "type": "Rule", "owner_fr": "FR-024", "title": "Treatment deactivation: providers notified", "attrs": {"statement": "When an admin deactivates a treatment, System notifies providers with the message \"Treatment [Name] has been deactivated\"; providers with active usage are notified.", "rationale": "Communication Structure (PRD line 69, providers with active usage) and Alternative Flow A2 step 8 (line 163, providers). The audience is an open product owner question; the graph holds the narrower Communication Structure reading."}}
  - {"op": "add_edge", "from": "REQ-024-043", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-024-044", "type": "Rule", "owner_fr": "FR-024", "title": "Provider gets a confirmation after saving packages and pricing", "attrs": {"statement": "Provider receives a confirmation when a package is created or updated (\"Package created successfully\", \"Package saved successfully\") and when treatment pricing is saved (\"Treatment pricing saved successfully\").", "rationale": "Communication Structure (PRD line 70); Main Flow: Provider Creates Package step 15 (line 246); Screen 3 notes (line 436); Screen 5 notes (line 522)."}}
  - {"op": "add_edge", "from": "REQ-024-044", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-024-045", "type": "Rule", "owner_fr": "FR-024", "title": "Treatment media formats and size limits", "attrs": {"statement": "A treatment video is optional, MP4 only, max 50MB. Treatment images are optional, JPEG or PNG, max 5 images of 5MB each. Educational resources are optional PDF documents, max 3 files of 10MB each. These limits and formats are fixed in the code, not admin-editable. A video over the limit is rejected with \"Video file exceeds maximum size of 50MB. Please compress the video or upload a shorter version.\"", "rationale": "Main Flow steps 5-7 (PRD lines 122-124); Screen 2 fields (lines 370-372); Admin Editability, Fixed in Codebase (lines 572-574); Edge Cases (line 912); validation example B1 (lines 197-199)."}}
  - {"op": "add_edge", "from": "REQ-024-045", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-024-046", "type": "Rule", "owner_fr": "FR-024", "title": "Treatment save validates inputs and shows errors on the field", "attrs": {"statement": "On Save Treatment, System validates name uniqueness, required fields (name, type, description) and file formats. The name is unique across all treatments, max 100 characters. Description max 5,000 characters, technique specifications max 2,000, expected recovery time max 50, typical duration 0.5 to 12 hours. Errors are shown next to the invalid fields and the treatment is created only after validation passes.", "rationale": "Main Flow step 10 (PRD line 127); B1 (lines 188-206); Screen 2 fields and rules (lines 356-377)."}}
  - {"op": "add_edge", "from": "REQ-024-046", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-024-047", "type": "Rule", "owner_fr": "FR-024", "title": "Treatment needs at least one of description, video or images", "attrs": {"statement": "A treatment must have at least one of: description, video, or images.", "rationale": "Screen 2 business rules (PRD line 378). The same table marks Description as required (line 366), so the two lines disagree; this is an open product owner question. The graph keeps both readings: ENT-treatment.description is required and this rule is recorded as written."}}
  - {"op": "add_edge", "from": "REQ-024-047", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-024-048", "type": "Rule", "owner_fr": "FR-024", "title": "Treatment status is set by admin; only Active ones are visible to providers", "attrs": {"statement": "A treatment's status is Active or Inactive, set by the admin on the treatment form (default Active). Only Active treatments are visible to providers; Inactive treatments are hidden from provider view.", "rationale": "Main Flow steps 8 and 13 (PRD lines 125, 130); Screen 2 Status (line 373); Screen 3 rules (lines 420-421). Step 13 says the record is saved as Active; this is an open product owner question."}}
  - {"op": "add_edge", "from": "REQ-024-048", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_edge", "from": "REQ-024-048", "verb": "decided by", "to": "SRC-MTG-002-D02"}
  - {"op": "add_node", "id": "REQ-024-049", "type": "Rule", "owner_fr": "FR-024", "title": "Failed media upload retries, then saves without media", "attrs": {"statement": "When a media upload to S-05 fails, System retries up to 3 times with exponential backoff. If all retries fail it shows an error (\"Media upload failed, please try again\"), saves the treatment record without media marked \"Pending Media Upload\", and the admin can retry the upload separately by editing the treatment; once the upload succeeds the record is updated.", "rationale": "Alternative Flow B2 (PRD lines 208-218); Edge Cases (line 920)."}}
  - {"op": "add_edge", "from": "REQ-024-049", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-024-050", "type": "Rule", "owner_fr": "FR-024", "title": "Concurrent treatment edits use optimistic locking", "attrs": {"statement": "System uses optimistic locking with version timestamps on treatment edits. When a second admin saves a treatment another admin changed, System rejects the save with \"This treatment was modified by another admin. Please refresh and reapply your changes.\" and the second admin must reload and reapply the edits.", "rationale": "Edge Cases (PRD line 922)."}}
  - {"op": "add_edge", "from": "REQ-024-050", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-024-051", "type": "Rule", "owner_fr": "FR-024", "title": "Treatment deactivation warns and needs admin confirmation", "attrs": {"statement": "Before deactivating a treatment, System checks the open quotes (draft or sent) and the open FR-006 bookings (Accepted, Confirmed, In Progress, Aftercare) that use it, shows a warning with the number of providers offering it and of active quotes, and requires the admin to confirm; on confirmation the status becomes Inactive.", "rationale": "Alternative Flow A2 steps 2-6 (PRD lines 154-161); Screen 1 notes (line 351); Screen 2 rules (line 382). Screen 1 line 343 (\"Deactivate button disabled if no active quotes exist using this treatment\") contradicts A2 and is not recorded as a rule; this is an open product owner question."}}
  - {"op": "add_edge", "from": "REQ-024-051", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-024-052", "type": "Rule", "owner_fr": "FR-024", "title": "Deactivated treatment cannot be picked for new quotes", "attrs": {"statement": "Providers cannot select a deactivated treatment in new quotes. If a treatment is deactivated while a provider has a draft quote open, System refreshes the available treatments and warns \"Treatment [Name] is no longer available. Please select a different treatment.\" Existing quotes and bookings using the treatment continue unaffected.", "rationale": "A2 steps 7 and 9 (PRD lines 162, 165); Edge Cases (line 918). Whether a draft that already holds the treatment must change it is an open product owner question."}}
  - {"op": "add_edge", "from": "REQ-024-052", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_edge", "from": "REQ-024-052", "verb": "applies at", "to": "STG-main-02-quote"}
  - {"op": "add_node", "id": "REQ-024-053", "type": "Rule", "owner_fr": "FR-024", "title": "Treatments and packages are archived, never deleted; retention follows FR-023", "attrs": {"statement": "Treatments cannot be deleted: admins deactivate them (soft delete only). Deactivated treatments and packages are archived, not deleted, with the retention period governed by FR-023.", "rationale": "Admin Editability, Configurable with Restrictions (PRD line 581); Data & Privacy Rules, Data Retention (line 561). REQ-024-033 covers packages never being hard-deleted."}}
  - {"op": "add_edge", "from": "REQ-024-053", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-024-054", "type": "Rule", "owner_fr": "FR-024", "title": "Admin treatment list: order, search, filter, edit", "attrs": {"statement": "The admin treatment list shows Active treatments first and Inactive last, filters by treatment name in real time and by treatment type, shows \"Create New Treatment\" at all times, allows Edit on every treatment regardless of status, and shows 20 treatments per page.", "rationale": "Screen 1 business rules and notes (PRD lines 339-344, 352)."}}
  - {"op": "add_edge", "from": "REQ-024-054", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-024-055", "type": "Rule", "owner_fr": "FR-024", "title": "Number of Providers counts providers offering the treatment", "attrs": {"statement": "Number of Providers on the admin treatment list is the count of provider treatment pricing configurations for that treatment whose status is Offered. It is calculated, not entered.", "rationale": "Screen 1 field (PRD line 333) and Field Calculation Rules (line 629). Screen 1 rule at line 345 words it as providers who have configured pricing; this is an open product owner question."}}
  - {"op": "add_edge", "from": "REQ-024-055", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-024-056", "type": "Rule", "owner_fr": "FR-024", "title": "Timestamps shown in local timezone; Last Updated is updated_at", "attrs": {"statement": "All timestamps are displayed in the provider's local timezone. Last Updated on every screen is the database updated_at timestamp, displayed in the user's local timezone.", "rationale": "General Module Rule 6 (PRD line 535) and Field Calculation Rules (line 631). Provider versus user timezone for admin screens is an open product owner question."}}
  - {"op": "add_edge", "from": "REQ-024-056", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-024-057", "type": "Rule", "owner_fr": "FR-024", "title": "Draft auto-save and Cancel on the treatment and package forms", "attrs": {"statement": "The admin treatment form auto-saves a draft every 30 seconds to prevent data loss. The package form offers Save as Draft for an incomplete package. Cancel on either form discards unsaved changes and returns to the list.", "rationale": "Screen 2 rules and notes (PRD lines 384, 391); Screen 5 rules and notes (lines 513, 521). A draft state is not in the status values; this is an open product owner question."}}
  - {"op": "add_edge", "from": "REQ-024-057", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-024-058", "type": "Rule", "owner_fr": "FR-024", "title": "Providers see active treatments and a Not Configured badge", "attrs": {"statement": "Providers can only view active treatments from the admin catalog. A treatment the provider has not configured pricing for shows a \"Not Configured\" badge.", "rationale": "Screen 3 business rules (PRD lines 420-422); A3 step 2 (line 175)."}}
  - {"op": "add_edge", "from": "REQ-024-058", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_edge", "from": "REQ-024-058", "verb": "decided by", "to": "SRC-MTG-002-D02"}
  - {"op": "add_node", "id": "REQ-024-059", "type": "Rule", "owner_fr": "FR-024", "title": "Pricing must be configured before a treatment is offered in quotes", "attrs": {"statement": "A provider must set a base price to enable \"Offered\" status and must configure pricing for a treatment before offering it in quotes. Saving the pricing configuration makes the treatment available in quote creation.", "rationale": "Screen 3 rules (PRD lines 423, 428); Provider Editability (line 602); A3 steps 5 and 9 (lines 180, 184)."}}
  - {"op": "add_edge", "from": "REQ-024-059", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_edge", "from": "REQ-024-059", "verb": "applies at", "to": "STG-main-02-quote"}
  - {"op": "add_edge", "from": "REQ-024-059", "verb": "decided by", "to": "SRC-MTG-002-D02"}
  - {"op": "add_node", "id": "REQ-024-060", "type": "Rule", "owner_fr": "FR-024", "title": "Treatment pricing validation", "attrs": {"statement": "System validates treatment pricing on save: no negative values; base price > 0; price per graft optional and >= 0 (some treatments are fixed price, not graft-based); minimum graft count > 0 and below the maximum; maximum graft count greater than minimum. A maximum below the minimum shows \"Maximum graft count must be greater than minimum graft count.\" next to the maximum field.", "rationale": "A3 step 7 (PRD line 182); Screen 3 fields and rules (lines 416-419, 427); Edge Cases (line 916)."}}
  - {"op": "add_edge", "from": "REQ-024-060", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-024-061", "type": "Rule", "owner_fr": "FR-024", "title": "Providers set their own prices without admin approval", "attrs": {"statement": "Providers have authority to set their own treatment pricing and package prices without admin approval.", "rationale": "Business Process Assumption 2 (PRD line 753), promoted because it states who decides prices."}}
  - {"op": "add_edge", "from": "REQ-024-061", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_edge", "from": "REQ-024-061", "verb": "decided by", "to": "SRC-MTG-002-D02"}
  - {"op": "add_node", "id": "REQ-024-062", "type": "Rule", "owner_fr": "FR-024", "title": "Quick Copy Pricing between treatments", "attrs": {"statement": "Provider can copy a treatment's pricing configuration from another treatment with the \"Quick Copy Pricing\" option.", "rationale": "Screen 3 notes (PRD line 435)."}}
  - {"op": "add_edge", "from": "REQ-024-062", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-024-063", "type": "Rule", "owner_fr": "FR-024", "title": "Package item types and travel services are fixed value lists", "attrs": {"statement": "Each included package item has a service type (medical, travel, accommodation, transport, flight, or other), a name, an optional description, an optional component price (>= 0), and an included flag. The service types are fixed in the code, aligned with FR-004. Included travel services are chosen from flight, hotel, transport, and other travel services.", "rationale": "Main Flow: Provider Creates Package steps 5-6 (PRD lines 236-237); Screen 5 fields (lines 491-492); Admin Editability, Fixed in Codebase (line 577)."}}
  - {"op": "add_edge", "from": "REQ-024-063", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_edge", "from": "REQ-024-063", "verb": "decided by", "to": "SRC-MTG-002-D04"}
  - {"op": "add_edge", "from": "REQ-024-063", "verb": "decided by", "to": "SRC-MTG-002-O01"}
  - {"op": "add_node", "id": "REQ-024-064", "type": "Rule", "owner_fr": "FR-024", "title": "Package plan uses relative days from Day 1", "attrs": {"statement": "A package's treatment plan uses relative days (Day 1, Day 2, and so on), each with a description, consecutive from Day 1; it never holds calendar dates.", "rationale": "Main Flow step 7 and step 12 (PRD lines 238, 243); Screen 5 field (line 493)."}}
  - {"op": "add_edge", "from": "REQ-024-064", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_edge", "from": "REQ-024-064", "verb": "decided by", "to": "SRC-MTG-002-O01"}
  - {"op": "add_node", "id": "REQ-024-065", "type": "Rule", "owner_fr": "FR-024", "title": "Package save validates inputs", "attrs": {"statement": "On Save Package, System validates: name not empty (max 100); description required (max 2,000); standard price > 0 with up to 2 decimal places; at least one included item with an allowed service type and component price >= 0; plan days consecutive from Day 1 with a description; duration max 50 characters in common patterns (\"X nights\", \"X days\", \"X hours\", \"X sessions\"); terms max 1,000 characters. Errors are shown next to the invalid fields and the package is created only after validation passes.", "rationale": "Main Flow step 12 (PRD line 243); B3 (lines 299-313); Screen 5 fields and rules (lines 488-505)."}}
  - {"op": "add_edge", "from": "REQ-024-065", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-024-066", "type": "Rule", "owner_fr": "FR-024", "title": "Package needs at least one of description or images", "attrs": {"statement": "A package must have at least one of: description or images.", "rationale": "Screen 5 notes (PRD line 519). The same table marks Description as required (line 490), so the two lines disagree; this is an open product owner question. The graph keeps both readings: ENT-package.description is required and this rule is recorded as written."}}
  - {"op": "add_edge", "from": "REQ-024-066", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-024-067", "type": "Rule", "owner_fr": "FR-024", "title": "Package image formats and size limits", "attrs": {"statement": "Package images are optional, JPEG or PNG, max 3 images of 2MB each. The 2MB per-image limit is fixed in the code and not editable by providers. An image over the limit is rejected.", "rationale": "Main Flow step 8 (PRD line 239); Screen 5 field (line 496); Provider Editability, Fixed in Codebase (line 598); B3 (line 303)."}}
  - {"op": "add_edge", "from": "REQ-024-067", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-024-068", "type": "Rule", "owner_fr": "FR-024", "title": "Package name unique within the provider's catalog", "attrs": {"statement": "A package name must be unique within the provider's own package catalog and may repeat across providers. A duplicate name is rejected with \"A package with this name already exists. Please choose a different name or edit the existing package.\"", "rationale": "Screen 5 rules (PRD line 503); Edge Cases (line 914)."}}
  - {"op": "add_edge", "from": "REQ-024-068", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-024-069", "type": "Rule", "owner_fr": "FR-024", "title": "A new package is version 1 and an Active one is selectable at once", "attrs": {"statement": "System saves a new package as version 1 linked to the provider account. Saving an Active package makes it immediately available in quote creation.", "rationale": "Main Flow step 14 and outcome (PRD lines 245, 247); Screen 5 rules (line 510)."}}
  - {"op": "add_edge", "from": "REQ-024-069", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_edge", "from": "REQ-024-069", "verb": "applies at", "to": "STG-main-02-quote"}
  - {"op": "add_edge", "from": "REQ-024-069", "verb": "decided by", "to": "SRC-MTG-002-D04"}
  - {"op": "add_node", "id": "REQ-024-070", "type": "Rule", "owner_fr": "FR-024", "title": "New quote options copy the latest package version", "attrs": {"statement": "New quote options copy the latest version of the package.", "rationale": "Alternative Flow A4 step 10 (PRD line 268)."}}
  - {"op": "add_edge", "from": "REQ-024-070", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_edge", "from": "REQ-024-070", "verb": "applies at", "to": "STG-main-02-quote"}
  - {"op": "add_edge", "from": "REQ-024-070", "verb": "decided by", "to": "SRC-MTG-002-D04"}
  - {"op": "add_edge", "from": "REQ-024-070", "verb": "decided by", "to": "SRC-MTG-002-O01"}
  - {"op": "add_node", "id": "REQ-024-071", "type": "Rule", "owner_fr": "FR-024", "title": "No save-for-future from an inline package edit", "attrs": {"statement": "There is no \"save for future\" action from an inline package edit during quote creation. To reuse a change, the provider repeats it as a library edit in package management.", "rationale": "Package Edit Paths (PRD line 552)."}}
  - {"op": "add_edge", "from": "REQ-024-071", "verb": "applies at", "to": "STG-main-02-quote"}
  - {"op": "add_edge", "from": "REQ-024-071", "verb": "decided by", "to": "SRC-MTG-002-D04"}
  - {"op": "add_node", "id": "REQ-024-072", "type": "Rule", "owner_fr": "FR-024", "title": "Package deactivation warns of open quotes and needs confirmation", "attrs": {"statement": "Before deactivating a package, System counts the open quotes (draft or sent) that contain a quote option copied from the package, warns \"This package is used in N open quotes. Deactivating hides it from new quotes; existing quotes are not changed.\", and requires the provider to confirm; if the package is used in open quotes, confirmation is required. On confirmation the status becomes Inactive.", "rationale": "Alternative Flow A5 steps 3-6 (PRD lines 278-281); Screen 4 rules (line 467); Screen 5 rules (line 512); User Story 6."}}
  - {"op": "add_edge", "from": "REQ-024-072", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-024-073", "type": "Rule", "owner_fr": "FR-024", "title": "Provider can clone a package", "attrs": {"statement": "Provider can clone an existing package. System creates a new package record copied from the original with \"(Copy)\" appended to the name; the provider edits the name, duration, and price and saves it.", "rationale": "Alternative Flow A6 (PRD lines 286-297); Screen 4 rules (line 466)."}}
  - {"op": "add_edge", "from": "REQ-024-073", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-024-074", "type": "Rule", "owner_fr": "FR-024", "title": "Usage Count of open quote options", "attrs": {"statement": "Usage Count on the package list is the number of FR-004 quote options copied from any version of the package whose parent quote is still open (status draft or sent). The deactivation warning shows the number of distinct open parent quotes among them. It is calculated, not entered.", "rationale": "Screen 4 field (PRD line 456) and rule (line 468); Field Calculation Rules (line 630)."}}
  - {"op": "add_edge", "from": "REQ-024-074", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-024-075", "type": "Rule", "owner_fr": "FR-024", "title": "Included Items summary shows first three items", "attrs": {"statement": "The package list shows a short summary of the included items: the first 3 items and \"+N more\". It is calculated, not entered.", "rationale": "Screen 4 field Included Items (PRD line 451)."}}
  - {"op": "add_edge", "from": "REQ-024-075", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-024-076", "type": "Rule", "owner_fr": "FR-024", "title": "Provider package list: order, search, filter, sort", "attrs": {"statement": "The provider package list shows Active packages first and Inactive last, filters by package name in real time and by status, can be sorted by name, price, or usage count, shows \"Create New Package\" at all times, and shows 20 packages per page.", "rationale": "Screen 4 business rules and notes (PRD lines 462-469, 476)."}}
  - {"op": "add_edge", "from": "REQ-024-076", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-024-077", "type": "Rule", "owner_fr": "FR-024", "title": "Bulk actions and quick price edit on the package list", "attrs": {"statement": "The package list offers the bulk actions \"Deactivate Selected\" and \"Export to CSV\". A quick price edit from the list is a library edit and saves a new package version.", "rationale": "Screen 4 notes (PRD lines 475, 477)."}}
  - {"op": "add_edge", "from": "REQ-024-077", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-024-078", "type": "Rule", "owner_fr": "FR-024", "title": "No platform limit on packages per provider", "attrs": {"statement": "A provider can create unlimited packages; the platform imposes no limit.", "rationale": "Provider Editability, Business Rules for Providers (PRD line 604)."}}
  - {"op": "add_edge", "from": "REQ-024-078", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-024-079", "type": "Rule", "owner_fr": "FR-024", "title": "Package images only to patients viewing that provider's quote", "attrs": {"statement": "Package images are accessible only to patients viewing quotes from that provider, and are resolved from the package version recorded on the quote option.", "rationale": "Data & Privacy Rules, Privacy Rule 4 (PRD line 559)."}}
  - {"op": "add_edge", "from": "REQ-024-079", "verb": "applies at", "to": "STG-main-02-quote"}
  - {"op": "add_node", "id": "REQ-024-080", "type": "Rule", "owner_fr": "FR-024", "title": "Treatment media served by time-limited signed URLs", "attrs": {"statement": "Treatment videos and images are served via CDN using time-limited, signed URLs; unauthenticated bulk access is not allowed.", "rationale": "Data & Privacy Rules, Privacy Rule 3 (PRD line 558). External Dependencies line 704 describes a fallback to direct S3 URLs; this is an open product owner question."}}
  - {"op": "add_edge", "from": "REQ-024-080", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-024-081", "type": "Rule", "owner_fr": "FR-024", "title": "Treatment and package text is translatable via FR-021", "attrs": {"statement": "Treatment descriptions and technique specifications, package names and descriptions, and all UI labels and error messages are translatable and use i18n keys from FR-021. Treatment type codes (FUE, FUT, DHI, Sapphire FUE, Robotic), package item service type codes, and media file names and CDN URLs stay in English. Before production release all treatment- and package-related strings must be registered with the FR-021 translation management system.", "rationale": "Localization Rules (PRD lines 607-623)."}}
  - {"op": "add_edge", "from": "REQ-024-081", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_edge", "from": "REQ-024-081", "verb": "decided by", "to": "SRC-MTG-003-D06"}
  - {"op": "add_node", "id": "REQ-024-082", "type": "Rule", "owner_fr": "FR-024", "title": "Provider staff role permissions gate package management", "attrs": {"statement": "Role-based permissions (FR-009) determine which provider staff can create and edit packages; package creation and editing are permission-checked by staff role.", "rationale": "Internal Dependencies, FR-009 (PRD lines 686-688). The permission matrix is owned by FR-009."}}
  - {"op": "add_edge", "from": "REQ-024-082", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-024-083", "type": "Rule", "owner_fr": "FR-024", "title": "Package selection blocked when the package API is unavailable", "attrs": {"statement": "If the package API is temporarily unavailable, package selection is blocked with a retry message. System never seeds a quote option from cached data whose price or content does not match the package version it records.", "rationale": "Implementation Notes, Integration 3 error handling (PRD line 786), promoted because it is a business rule inside a technical section."}}
