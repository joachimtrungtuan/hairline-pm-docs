  - {"op": "update_node", "id": "REQ-014-139", "attrs": {"statement": "At the displayed snapshot time, include only Accepted FR-006 pending bookings with a non-superseded AcceptanceEvent, valid exclusive slot hold, and no successful initial payment. It is a current snapshot and ignores the time range filter (REQ-014-317). Calculate age from immutable `acceptedAt`, and validate the actual configured hold deadline. Remove cancelled, expired-hold, and `Payment Window Expired` selections even before stale quote status caches update; do not restart age on payment retries. When an admin revives an expired booking it re-enters these figures and its age counts from the start of its current hold. Sum each eligible accepted total price once as potential accepted booking value, not deposit receivables, captured revenue, or outstanding installment balances."}}
  - {"op": "update_node", "id": "REQ-014-161", "attrs": {"statement": "Default provider-role access to the provider analytics screens, using the FR-009 roles. The matrix states the default data-domain grants only; actual visibility is always resolved through Rules 15A and 15B, so a role whose permissions are changed sees whatever its granted data domains allow. Where the matrix says \"Only with financial permission\", the FR-031 permissions of REQ-031-118 decide: View Financial Dashboard gates the income and revenue widgets (every Screen 1 Section C and Screen 4 widget other than the payout widgets), View Payouts gates the payout widgets and payout history (Screen 1 C4 and Screen 4 Widget 8), and View Financial Reports gates financial exports (Screen 6). Screens or sections a role cannot see are hidden from navigation, not shown as locked. The Analytics nav item opens the first of Screens 2, 3, 4 and 5 the role can see and is hidden when it can see none; Screen 1 renders only the sections the role may see, and a role with no visible section sees \"No analytics available for your role\". Screen 1 Main Dashboard — Sections A and B (inbox and performance): Owner: Full; Manager: Full; Billing Staff: Hidden; Clinical Staff: Hidden; Screen 1 Main Dashboard — Section C (financials): Owner: Full; Manager: Only with financial permission; Billing Staff: Full; Clinical Staff: Hidden; Screen 2 Performance & Conversion: Owner: Full; Manager: Full; Billing Staff: Hidden; Clinical Staff: Hidden; Screen 3 Patient Analytics: Owner: Full; Manager: Full; Billing Staff: Hidden; Clinical Staff: Satisfaction and aftercare widgets only; Screen 4 Finance & Payouts: Owner: Full; Manager: Only with financial permission; Billing Staff: Full; Clinical Staff: Hidden; Screen 5 Pricing & Benchmarks: Owner: Full; Manager: Full; Billing Staff: Full; Clinical Staff: Hidden; Screen 6 Export Report Configuration: Owner: Full; Manager: Exports limited to the screens and widgets the user can see; Billing Staff: Exports limited to the screens and widgets the user can see; Clinical Staff: Exports limited to the screens and widgets the user can see (Screen 3 exports contain only the satisfaction and aftercare widgets)"}}
  - {"op": "update_node", "id": "REQ-014-182", "attrs": {"statement": "Value: Today count + This week count (dual display); Tap → the FR-003 provider inquiry list with the period pre-applied"}}
  - {"op": "update_node", "id": "REQ-014-186", "attrs": {"statement": "Chart: Funnel chart; Stages: Inquiries → Quoted → Accepted → Confirmed booking; Each stage: Count + Step % (stage ÷ previous stage); Footer: Overall booking conversion = Confirmed bookings ÷ Inquiries; Confirmed booking = successful deposit or first installment charge confirms the FR-006 Booking. `In Progress` means procedure started via FR-010 and is not the payment-confirmation label. Count distinct inquiry/provider pairs in a single inquiry cohort cumulatively through each reached stage, per Analytics Counting & Time Basis; multiple parent quotes and subquotes do not multiply the funnel. Drill-down: click stage → the FR-003 provider inquiry list with that stage, the period and the country filter (when set) pre-applied"}}
  - {"op": "update_node", "id": "REQ-014-189", "attrs": {"statement": "Chart: Donut (top 8 countries by inquiry share + Other); Center: total Inquiries in range; Slice labels: `CC (ISO-2) • %`; Slice border: thin/neutral <20% confirmed booking rate · medium/amber 20–40% · thick/green >40%; Tooltip: `Country • Inquiries: N • Confirmed bookings: B • Confirmed booking rate: R%`; Confirmed bookings and the confirmed booking rate use the inquiry cohort and Confirmed booking stage defined in Analytics Counting & Time Basis (rate = Confirmed bookings ÷ Inquiries). Drill-down: click slice → the FR-003 provider inquiry list with that country and the period pre-applied"}}
  - {"op": "update_node", "id": "REQ-014-192", "attrs": {"statement": "Chart: Stacked horizontal bar; Buckets: 0–24h · 1–3d · 4–7d · 8–14d · >14d; X = count of accepted selections awaiting successful initial payment; optional legend by treatment (top 3) or country; Age = snapshot time − `AcceptanceEvent.acceptedAt`, or the start of the current hold when an admin has revived an expired booking; count one pending Booking/AcceptanceEvent with a valid exclusive payment-window hold. Exclude cancelled selections, superseded acceptance events, expired holds, and `Payment Window Expired` bookings, even if a flat quote status still says Accepted. Snapshot: this chart shows the current state and ignores the time range filter (REQ-014-317); Drill-down: click bucket → Accepted Quotes list resolved to the exact accepted subquote and pending booking; retain the same chart and buckets. Older buckets may legitimately be empty with the default 48-hour hold; use the actual configured deadline, not an assumed fixed limit."}}
  - {"op": "update_node", "id": "REQ-014-195", "attrs": {"statement": "Chart type: Multi-line chart (one line per funnel stage); X axis: Week or month (toggle); Y axis: Conversion % to that stage from Inquiries; Lines: Quoted % · Accepted % · Confirmed booking %; Drill-down: Click a point → the FR-003 provider inquiry list with that stage and the period pre-applied; Calculation: Each stage % = distinct inquiry/provider pairs in the selected inquiry cohort that have reached that stage by the reporting cutoff ÷ all inquiry/provider pairs in that cohort. Counts are cumulative, not mutually exclusive highest-stage buckets. Use the shared cohort and cutoff definitions in Analytics Counting & Time Basis."}}
  - {"op": "update_node", "id": "REQ-014-197", "attrs": {"statement": "Chart type: Horizontal ranked bar chart; Y axis: Patient country (top 10 by inquiry volume); X axis: Booking conversion % (Inquiries → Confirmed booking); Secondary bar: Inquiry count (context for the rate); Drill-down: Click bar → the FR-003 provider inquiry list with that country and the period pre-applied; Data source: `inquiries.patient_id → patients.location_id → countries.name`, with temporary fallback to legacy `patients.location` only for unmigrated rows."}}
  - {"op": "update_node", "id": "REQ-014-199", "attrs": {"statement": "Chart type: Dual-line chart (p50 line + p90 line); X axis: Week or month (toggle); Y axis: Minutes (render as h:m); Reference line: SLA target; Color band: Green/Amber/Red zones based on SLA thresholds; Drill-down: Click point → the FR-003 provider inquiry list with the period pre-applied, sorted by TTFQ"}}
  - {"op": "update_node", "id": "REQ-014-218", "attrs": {"statement": "Chart type: Column bar chart (monthly, full history) + paginated table below; Bar chart: Last 12 months of disbursed payouts; Table columns: Period · Amount · Status (Upcoming / Processing / Paid / Failed) · Paid date · Cadence (how the payout is released, see Assumption 5); All rows: Full history (not limited to the 2–3 rows shown in the Main Dashboard Section C4 inline table); fixed window, so this widget ignores the time range filter; Drill-down: Click bar or row → Payout statement detail (CSV/PDF export); Payout status mapping (FR-017): Upcoming: No statement yet for the period, or Pending Approval, Approved, or Overdue (internal admin review states are not shown to providers), or Waiting for clinic setup (`waiting_for_clinic_setup`, a Stripe Connect payout), shown with the note \"Payout setup incomplete\" and a link to the payout setup in provider settings; Processing: Processing (Stripe transfer initiated); Paid: Paid (`transfer.paid`); Paid date = webhook time; Failed: Failed (`transfer.failed`); returns to Processing when admin retries; (not shown): Voided — excluded from the provider's payout chart, table, totals, and exports. Voided is an internal admin audit state; the period appears as Upcoming again once FR-017 re-generates a statement on the next payout cycle"}}
  - {"op": "update_node", "id": "REQ-014-232", "attrs": {"statement": "Widget-level permission scope: an export contains only the widgets the generating user is permitted to see on each selected screen (Rules 15A, 15B and 15F); widgets the user cannot see are omitted, not shown empty or locked. Recurring runs re-resolve this scope against the configuration owner's permissions at run time. Each generated report records the user it was generated for: the requesting user for a one-off report, the configuration owner for a recurring run."}}
  - {"op": "update_node", "id": "REQ-014-248", "attrs": {"statement": "Chart: Donut (Green / Amber / Red provider counts); Value: Count and % in each tier; a provider with no TTFQ observation in the period is shown as a separate grey \"No data\" tier with a text label and its count, kept out of the donut slices and out of the percentages of the three colour tiers; Tap → Screen 8 filtered to Red tier; the No data count taps to Screen 8 filtered to the No data tier"}}
  - {"op": "update_node", "id": "REQ-014-249", "attrs": {"statement": "Value: % of active providers who first submitted at least 1 parent quote within the Dormant threshold window (FR-026 Analytics Configuration, default 30 days) ending at the period end. \"Active providers\" here means account `status = active` (the Tile 1 definition, FR-015), not the activity-based Active engagement status in Screen 8 Widget 3; Sub-values: Dormant providers (the Screen 8 Widget 3 Dormant count, as of now; it ignores the time range filter and so equals the Dormant count on the Screen 8 list it opens) and Non-responding providers (0 first-submitted parent quotes within the same Dormant threshold window; drafts, child records, edits, and resends do not count as new submissions). These are separate counts; a provider can be active but non-responding. Tap → Screen 8 engagement section filtered to dormant"}}
  - {"op": "update_node", "id": "REQ-014-259", "attrs": {"statement": "Only Sections A and B and the GMV and commission tiles (C1 and C2) follow the time range filter; C3 (next 30 days) and C4 (snapshot) ignore it. In Section A: Tile 1 shows providers with `status = active` at the end of the selected period plus those onboarded within it; Tiles 2 and 3 count records created within the period, compared with the prior equivalent period; Tile 4 tiers providers from TTFQ observations in the period; Tile 5 rate and Non-responding count use the trailing Dormant threshold window (default 30 days) ending at the period end, while its Dormant sub-value is the Screen 8 Widget 3 Dormant count and ignores the time range filter"}}
  - {"op": "update_node", "id": "REQ-014-262", "attrs": {"statement": "Provider: Name + country; Last active: `MAX(action_at)` from `provider_activity_logs` for that `provider_id`; for last login specifically use `MAX(action_at) WHERE action_type = 'login'`; Quotes this month: Distinct parent quotes first submitted in current calendar month; no extra counts for options, date-price records, versions, or resends; Inquiry response rate: Distinct distributed inquiries answered ÷ distinct inquiries distributed to this provider (last 30-day distribution cohort); Status: Based on Last active: Active (activity within the At Risk threshold, default 7d) · At Risk (between the At Risk and Dormant thresholds, default 7–30d) · Dormant (no activity beyond the Dormant threshold, default 30d). Thresholds come from FR-026 Screen 5e; Filter by status (Active / At Risk / Dormant); Fixed window: status is as of now, Quotes this month is the current calendar month and the response rate is the last 30-day distribution cohort, so this widget ignores the time range filter; the Screen 7 Tile 5 Dormant count uses this Dormant definition; Drill-down: click row → provider detail in FR-015"}}
  - {"op": "update_node", "id": "REQ-014-264", "attrs": {"statement": "Chart type: Three KPI tiles; Tile 1: Active providers count (Screen 8 Widget 3 status; default activity in last 7 days); Tile 2: At-risk providers count (Screen 8 Widget 3 status; default 7–30 days no activity); Tile 3: Dormant providers count (Screen 8 Widget 3 status; default >30 days no activity); Fixed window: these counts use the Widget 3 statuses as of now and ignore the time range filter"}}
  - {"op": "update_node", "id": "REQ-014-294", "attrs": {"statement": "Chart type: KPI tile + table; KPI: Total upcoming payout amount (next 30 days), counting every status in the table, Waiting for clinic setup included; Table columns: Provider · Amount · Payout date · Cadence (how the payout is released, see Assumption 5) · Status (FR-017: Pending Approval / Approved / Overdue / Processing / Waiting for clinic setup); Sort: Payout date ascending. Fixed window (next 30 days): this widget ignores the time range filter; Drill-down: Click row → provider payout detail in FR-017"}}
  - {"op": "update_node", "id": "REQ-014-317", "attrs": {"statement": "System MUST ignore the time range filter on fixed-window and snapshot tiles: which keep their own windows: Screen 1 C3 and C4, Screen 4 Widgets 7 and 8, Screen 7 C3, C4 and the Tile 5 Dormant count, Screen 8 Widgets 3 and 5, and Screen 12 Widgets 4 and 5."}}
  - {"op": "update_node", "id": "REQ-014-320", "attrs": {"statement": "System MUST show a provider with no TTFQ observation in a grey \"No data\" tier with a text label, and keep it out of the donut percentages and the scatter; Screen 8 offers No data as a TTFQ health tier filter option, which the Screen 7 Tile 4 No data count opens."}}
  - {"op": "update_node", "id": "REQ-014-322", "attrs": {"statement": "System MUST pause a recurring export whose owner is removed or loses access to every widget in it, notify the clinic Owner, and keep it paused until a user who can see every widget in it saves an edit and so becomes the owner."}}
  - {"op": "update_node", "id": "REQ-014-324", "attrs": {"statement": "System MUST let any user who can see every widget in a recurring configuration edit or delete it; the user who last saves an edit becomes its owner."}}
  - {"op": "update_node", "id": "ENT-export-report-config", "attrs": {"description": "Entity 8 — Export Report Configuration: `config_id`, `provider_id`, `report_type`, `screens_included` (array), `date_range_type` (`custom` for one-off exports; `previous_full_period` for recurring), `custom_start`/`custom_end` (one-off only), `recurring`, `frequency`, `timezone`, `status` (active/paused), `email_recipients` (registered email plus up to 5 team member IDs), `next_run_at`, `last_run_status`, `last_generated_at`, `owner_user_id` (the user who last saved an edit)"}}
  - {"op": "update_node", "id": "ENT-analytics-generated-report", "attrs": {"description": "Generated export report (Screen 6 Report History Tab 1). Generated reports additionally retain the metric definitions/cohorts, reporting cutoff/data-as-of, sample sizes, currency/FX provenance, and authorized accepted-selection IDs/versions for detailed rows. Configuration and scheduling do not change screen metric semantics. `generated_by_user_id` records the user the report was generated for."}}
  - {"op": "update_node", "id": "SCR-014-08", "attrs": {"description": "Purpose: Two-section screen — Performance (conversion quality) and Engagement (activity/dormancy). These are distinct jobs: performance tells you how well a provider works; engagement tells you whether they're working at all. Filters: Time range + Country + TTFQ health tier (All / Green / Amber / Red / No data) + Engagement status (All / Active / At Risk / Dormant)"}}
