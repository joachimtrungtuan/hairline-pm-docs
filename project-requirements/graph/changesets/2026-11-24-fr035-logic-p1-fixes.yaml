  - {"op": "update_node", "id": "REQ-035-017", "attrs": {"statement": "System MUST display the patient's original request (description and initial attachments) and the full communication thread for each ticket showing all messages from patient and admin with sender labels and timestamps"}, "title": "Original request and full communication thread with sender labels"}
  - {"op": "update_node", "id": "REQ-035-019", "attrs": {"statement": "System MUST automatically reopen Resolved cases to Open status when patient sends a reply, and send the admin a support.case_reopened notice (FR-034 REQ-034-092)"}}
  - {"op": "update_node", "id": "REQ-035-020", "attrs": {"statement": "System MUST display auto-closure countdown on Resolved tickets showing remaining days before automatic closure (FR-034 REQ-034-061); \"closes today\" on the last day; none when the closure period is Immediately"}}
  - {"op": "update_node", "id": "REQ-035-024", "attrs": {"statement": "System MUST require patient authentication to access Help Center content, submit support requests, and view tickets; a person who is not logged in sees only the support contact details (phone and email), with no case and no help content"}, "title": "Patient authentication required; not-logged-in view shows only support contact details"}
  - {"op": "update_node", "id": "REQ-035-031", "attrs": {"statement": "System MUST trigger patient notifications via FR-020/S-03 for case status changes, admin replies (support.case_admin_reply), and case closure"}}
  - {"op": "update_node", "id": "REQ-035-033", "attrs": {"statement": "Patient navigates to \"Help & Support\" from Settings screen (FR-026 / P01.2-S1); in-app deep link from other screens (e.g., contextual help links from booking, payment, or aftercare screens); push notification tap (e.g., tapping a case status change notification navigates to Ticket Detail); the Report a Problem row on the Hub opens Contact Support with the device, operating system, app version, and report time attached per FR-034 REQ-034-164; a person who is not logged in reaches only the support contact details (REQ-035-024)."}, "title": "Entry points to the patient Help Center"}
  - {"op": "update_node", "id": "REQ-035-036", "attrs": {"statement": "Search covers all published patient-audience Help Center content (FAQs, Articles, Resources, Videos); results are ranked by relevance and appear on the Help Center Browser (Screen 2), whichever search bar the patient types in; if no results match, show a \"Contact Support\" prompt. Full-text search is required for P1 and must not be downgraded to browse-only behavior."}}
  - {"op": "update_node", "id": "REQ-035-038", "attrs": {"statement": "Patient taps No on Was this helpful? (on any content type: FAQ, article, resource, or video) or sees no search results; System displays Still need help? Contact Support CTA, and the no-results message \"No results for '[query]'. Try different keywords or Contact Support.\"; Patient taps Contact Support; System displays Contact Support form (Screen 5)."}}
  - {"op": "update_node", "id": "REQ-035-039", "attrs": {"statement": "Emergency contact section is a healthcare UX best practice for post-procedure patient safety; it must always be visible - it cannot be hidden or require scrolling past it. The section must remain visible regardless of scroll position (sticky or always rendered); emergency phone is read-only with tap-to-call on mobile and emergency email is read-only with tap-to-compose on mobile. Each row is shown only when its App Setting has a value: a row with no value is left out, and the Contact Support row stays."}}
  - {"op": "update_node", "id": "REQ-035-042", "attrs": {"statement": "4 content types for patient platform: FAQs, Articles, Resources, Videos (FR-033 REQ-033-003), all four cards always shown; admin cannot add new content types for patients; no Service Status for patients."}, "title": "Four fixed content types, always shown; no Service Status for patients"}
  - {"op": "update_node", "id": "REQ-035-048", "attrs": {"statement": "Resolved cases display a subtle \"Auto-closes in X days\" indicator to set expectations about the closure window (FR-034 REQ-034-061); on the last day it reads \"Auto-closes today\", and it is not shown when the closure period is Immediately because there is no Resolved window"}}
  - {"op": "update_node", "id": "REQ-035-054", "attrs": {"statement": "Upon successful submission, the system displays a confirmation screen showing the assigned Case ID (CASE-YYYY-#####) and the message \"We will respond within 24 hours on business days\" (FR-034 SC-003), then navigates to My Support Tickets (Screen 3); the confirmation always shows in the app, whether or not the confirmation email is sent"}, "title": "Submission confirmation shows the case ID and the 24-hours-on-business-days message"}
  - {"op": "update_node", "id": "REQ-035-055", "attrs": {"statement": "Patient receives a confirmation email with the case reference number upon submission unless an admin has switched the notice off in the Admin notification settings (FR-030, FR-034 REQ-034-090); the in-app confirmation always shows (FR-020, FR-034 A5 step 11)"}}
  - {"op": "update_node", "id": "REQ-035-059", "attrs": {"statement": "A file that fails virus scanning is refused with the FR-034 message (REQ-034-106), and the patient can send the case without it."}, "title": "Failed virus scan refuses the file with the FR-034 message"}
  - {"op": "update_node", "id": "REQ-035-061", "attrs": {"statement": "Media Storage Service failure handling: for file uploads, the case is created without the files, the files are queued for retry, and the patient is told of the delay."}}
  - {"op": "update_node", "id": "REQ-035-062", "attrs": {"statement": "A support request submitted while offline, or one that fails with a server error (5xx), is queued on the device and shows \"queued, will be sent when online\"; it is sent when connectivity returns or retried with exponential backoff, and the patient gets the Case ID after it is sent."}}
  - {"op": "update_node", "id": "REQ-035-063", "attrs": {"statement": "Rate limiting on new ticket submissions (max 10 new tickets per hour per patient); the patient sees a message to wait before trying again; replies are not counted by this limit."}}
  - {"op": "update_node", "id": "REQ-035-067", "attrs": {"statement": "Cases auto-close after 7 days in Resolved status if no patient reply (configurable: Immediately, 3, 7, or 14 days per FR-034 REQ-034-061/062); the patient receives a support.case_closed notification. With Immediately there is no Resolved window: the case goes straight to Closed, no countdown or Auto-closes indicator is shown, and the patient uses the Closed Case Banner (reopen request or new ticket)."}}
  - {"op": "update_node", "id": "REQ-035-068", "attrs": {"statement": "The screen learns that a case closed on its next refresh or when the patient sends a reply. A reply sent after closure is refused with a message, the typed text stays visible for copying, and the Closed Case Banner replaces the reply input."}, "title": "Closure while the patient is viewing: a late reply is refused and the text is kept"}
  - {"op": "update_node", "id": "REQ-035-069", "attrs": {"statement": "Closed Case Banner: \"This case is closed. If you still need help, you can create a new ticket or contact support to request this case be reopened.\" with \"Create New Ticket\" link to Screen 5 and \"Contact Support\" link that opens an email to the support address (the emergency email App Setting) with the case ID in the subject; the Contact Support link is shown only when that setting has a value. Both paths: new ticket creation (in-app) and case reopening via admin (FR-034 Workflow B3, REQ-034-017)."}}
  - {"op": "update_node", "id": "REQ-035-070", "attrs": {"statement": "The resolution summary is also sent to the patient via email notification on status change to Resolved, unless an admin has switched the notice off in the Admin notification settings (FR-030, FR-034 REQ-034-060); the summary always shows on Ticket Detail."}}
  - {"op": "update_node", "id": "REQ-035-075", "attrs": {"statement": "Open, In Progress, and Resolved cases of a deleted patient stay with the Admin, marked \"Patient Account Deleted\" (FR-034 REQ-034-109), and notices to the deleted patient stop; patient identity is anonymized per data retention policy (FR-023)."}, "title": "Account deletion with support cases: cases stay with the Admin and notices stop"}
  - {"op": "update_node", "id": "REQ-035-076", "attrs": {"statement": "Patient-visible support categories (admin cannot add or remove categories from the fixed list; the labels are editable in FR-034 REQ-034-087, the picker shows the current label, and the two internal categories stay hidden whatever their label)"}}
  - {"op": "update_node", "id": "REQ-035-087", "attrs": {"statement": "When no messages exist yet on a case (the case was just created), Ticket Detail shows \"Your case has been submitted. Our team will respond within 24 hours on business days.\""}}
