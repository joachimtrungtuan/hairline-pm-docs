  - {"op": "update_node", "id": "REQ-033-077", "attrs": {"statement": "For Upload File videos the video file is required for new videos (MP4 or MOV, max 500MB) with a progress indicator; after upload a background job processes the video for streaming optimization (transcoding, thumbnail generation); the video duration is auto-extracted (read-only); the thumbnail is auto-generated from the video frame at the 10% mark unless the admin uploads a custom one; a processing status (uploading, processing, ready, failed) is shown; an uploaded video cannot be published until its processing status is ready (embedded videos are exempt); if processing fails the status becomes failed, the admin is told and can re-upload, and a new item stays Draft; when the file of a Published video is replaced or its source is switched, the previous video stays live for viewers until the new one is Ready, and if the new file fails the old one stays in place and the admin is told."}}
  - {"op": "update_node", "id": "REQ-033-094", "attrs": {"statement": "Admins MUST be able to change the source type of an existing video (uploaded file or third-party link) by providing the new file or URL and confirming that the old one is replaced; the video keeps its view counts; for a Published video the previous video stays live for viewers until the new one is Ready, and if the new file fails the old one stays in place and the admin is told"}}
  - {"op": "update_node", "id": "STP-033-049", "title": "System processes the uploaded video for streaming optimisation; if processing fails the status becomes Failed, the admin is told and can re-upload, and a new item stays Draft, while a Published video whose file was replaced keeps the previous video live"}
  - {"op": "update_node", "id": "REQ-033-034", "title": "Publish, edit, unpublish, delete and reorder take effect in the provider and patient Help Centre within 1 minute", "attrs": {"statement": "Publishing content, editing published content, reordering FAQ topics or FAQs, unpublishing content, and deleting a Published item take effect in the provider Help Centre (via FR-032) and the patient Help Centre (via FR-035, REQ-035-028) within 1 minute."}}
  - {"op": "update_node", "id": "STP-033-164", "title": "System makes published, edited or reordered content available in the patient Help Centre, and removes unpublished or deleted content, within 1 minute"}
  - {"op": "update_node", "id": "REQ-033-062", "attrs": {"statement": "Admins can run bulk operations: assign multiple FAQs to a topic, change status for multiple FAQs, articles, resources or videos (Publish and Unpublish only; a bulk Unpublish takes one shared reason for all selected items), delete multiple items (following the single-item delete rules), and upload multiple resource files at once; multiple FAQs can be edited in batch."}}
  - {"op": "update_node", "id": "REQ-033-099", "title": "Content status moves are limited; Published is left only by Unpublish or Delete", "attrs": {"statement": "Content status moves are limited to Draft to Published, Published to Unpublished (only through the Unpublish action with its reason), Unpublished to Published, and any state to Archived by Delete; the Publish Status dropdown offers Draft and Published only, Draft is not selectable for an Unpublished item, and the dropdown is read-only while the item is Published."}}
  - {"op": "update_node", "id": "REQ-033-081", "attrs": {"statement": "Admins can create, edit and delete service components; delete prompts confirmation before deletion and archives the component instead of erasing it (it stays on past incidents and maintenance windows and is shown there as removed); a component on an open incident (not Resolved) or on a Scheduled or In Progress maintenance window cannot be deleted, and the message names the incident or window; the component name is required (max 100 characters); the component status is Operational, Degraded or Down and defaults to Operational for a new component; component status updates in real time and affects the overall platform status."}}
