  - {"op": "update_node", "id": "REQ-001-036", "attrs": {"statement": "Out of scope: direct patient-provider communication (handled by FR-012); social authentication (Google, Apple, Facebook OAuth - future enhancement); multi-factor authentication beyond email OTP (future enhancement)"}}
  - {"op": "update_node", "id": "REQ-001-165", "attrs": {"statement": "On first start the app language is the phone's language; if the app does not offer that language, it shows the default locale set in FR-021 (English until a Super Admin changes it), and a text missing in the shown language falls back until it ends at the English source. The patient can change the language later."}}
  - {"op": "update_node", "id": "REQ-001-098", "attrs": {"statement": "Selecting \"Email OTP\" sends a 6-digit code to the registered email with the email verification template; the code expires after a fixed 15 minutes, which is also the life of the email-change code and does not follow the FR-026 OTP Expiry Time; resend is rate-limited"}}
  - {"op": "update_node", "id": "REQ-001-142", "attrs": {"statement": "Re-verification is required when the last successful auth is older than the re-verification threshold, a platform setting managed in FR-026 (whole minutes from 1 to 60, default 5)"}}
  - {"op": "update_node", "id": "REQ-001-125", "attrs": {"statement": "Read-only; shown in the admin's browser timezone with the zone named beside the time (REQ-026-050)"}}
  - {"op": "update_node", "id": "REQ-001-180", "attrs": {"statement": "A wrong 6-digit code (registration, password reset, re-verification, email change) counts toward the same limit as failed logins (the FR-026 max login attempts setting, default 5). After the limit the code stops working and the patient must request a new one; the resend cooldown applies. There is no separate setting. One failed-attempt counter per account serves both sign-in and code entry; it resets after a successful sign-in or code entry and when a lockout ends, and a lowered limit applies from the next failed attempt (REQ-026-145)."}}
  - {"op": "update_node", "id": "REQ-002-034", "attrs": {"statement": "Basic quality checks MUST be enforced against the two FR-026 minimums, a brightness minimum and a blur minimum (each 0 to 100, default 40), and actionable guidance returned on failure. The engine scores each photo 0 to 100 for brightness and for blur; a photo passes only when each score reaches its own minimum. The qualityScore returned per photo is the lower of the two scores, for display; validationStatus carries the result."}}
  - {"op": "update_node", "id": "REQ-002-050", "attrs": {"statement": "The engine check MUST be authoritative. The device check at capture is advisory and uses the same two FR-026 minimums (brightness and blur); when the engine rejects the media, FR-003 returns the patient to the capture screen."}}
  - {"op": "update_node", "id": "ENT-media-artifact.quality_score", "attrs": {"description": "qualityScore, 0 to 100: the lower of the photo's brightness score and blur score (REQ-002-034). Returned per photo."}}
  - {"op": "update_node", "id": "REQ-003-054", "attrs": {"statement": "Patient must review all sections. Patient can edit any section before submission. The Current Terms & Conditions must be accepted before submission: the checkbox appears only when the patient has not yet accepted them, and submission stays blocked until they are accepted (FR-027 REQ-027-033, REQ-027-035)."}}
  - {"op": "update_node", "id": "REQ-003-027", "attrs": {"statement": "When the service is Get a Hair Transplant, patient must select one active treatment-area option; the other services do not ask for one. The selected option must be active when the inquiry is created; inactive options remain readable on historical inquiries through their saved snapshot."}}
  - {"op": "update_node", "id": "REQ-003-122", "attrs": {"statement": "Problem-duration choices come from an Admin-managed problem-duration list retrieved from the backend, not a fixed client-side enum; the list is managed with the other inquiry configuration owned by FR-026. Starting values, editable by Admin: Less than 6 months; 6 to 12 months; 1 to 2 years; 2 to 5 years; More than 5 years. The patient must select one active option. The inquiry stores the chosen option's label as text, so a later edit or deactivation of the option changes no saved inquiry; an inquiry created by an FR-037 conversion takes the label the monitoring case saved."}}
  - {"op": "update_node", "id": "REQ-003-124", "attrs": {"statement": "The provider inquiry list (Screen 9) can be searched by patient ID, the search is debounced and case-insensitive, and the list can be filtered by age range, concern, date range (requested treatment dates), medical alerts, location (patient country), stage and inquiry date using valid ranges and enum values. The list can open with stage, location (country) and an inquiry date period already applied, as when a provider follows an FR-014 analytics drill-down; the provider can change or clear them."}}
  - {"op": "update_node", "id": "REQ-003-125", "attrs": {"statement": "On the cancel confirmation modal (Screen 8a) the Impact Summary reads \"X quotes will be cancelled\" when the inquiry has quotes to cancel (draft, sent or expired) and \"No quotes to cancel\" when it has none, taken from `preview_quote_count`, counted when the modal opens. The note \"Providers of the quotes being cancelled will be notified of this cancellation, normally within 5 minutes\" is shown only when there are quotes to cancel. Go Back closes the modal with no change of state."}}
  - {"op": "update_node", "id": "REQ-003-100", "title": "Providers whose quotes were cancelled are notified without the reason, first send attempt within 5 minutes", "attrs": {"statement": "Only providers whose quotes were cancelled receive notification of the cancellation; cancellation reason is NOT shared with providers (patient-private analytics data). Send/enqueue notifications (target: first send attempt within 5 minutes, not a guarantee; a failed first attempt is retried under the FR-030 retry rule; owned by this FR; FR-020 delivers the notice, REQ-020-020); if enqueue/send fails, queue/retry notifications and log attempts (do not roll back cancellation). When no quote was cancelled, no provider is notified."}}
  - {"op": "update_node", "id": "REQ-003-063", "title": "Provider notifications: first send attempt within 5 minutes, with retry and SLA alert", "attrs": {"statement": "Send provider notifications (target: first send attempt within 5 minutes). If notification dispatch fails: queue/retry, alert on SLA risk and log attempts."}}
  - {"op": "update_node", "id": "STP-003-024", "title": "System distributes and sends the provider notices, first attempt within 5 minutes"}
  - {"op": "update_node", "id": "STP-003-047", "title": "Providers are notified without the reason, first send attempt within 5 minutes"}
  - {"op": "update_node", "id": "REQ-003-127", "attrs": {"statement": "When an admin cancels the booking through FR-006 Screen 9 or closes the inquiry through Close inquiry on FR-006 Screen 6, System MUST move any draft replacement quote of that inquiry to `Cancelled (Inquiry Cancelled)`, MUST NOT send `quote.cancelled_inquiry` to any provider (an admin cancellation or close sends no provider notice, REQ-020-020; the replacement provider is not told), and no `quote.expired` follows. The quote-side behaviour is owned by FR-004 (REQ-004-111). The patient cancellation path has no replacement draft, because a replacement exists only after acceptance."}}
  - {"op": "update_node", "id": "REQ-003-128", "attrs": {"statement": "When System asks the patient to confirm a redistribution (REQ-003-021), it MUST set `redistribution_state` to `awaiting_patient_confirmation`. On confirm, it MUST set `confirmed` and run normal Workflow 2 matching (Alternative Flow B1 applies when no eligible provider is found). On decline, it MUST set `declined`, leave the inquiry as it is with `supportRequired = true` and the Contact Admin/Support action, and not redistribute. If the patient has not answered after a fixed 48 hours, System MUST send one reminder (`provider.status_redistribution_reminder`, FR-020 REQ-020-159), set `admin_follow_up`, and show the inquiry in the admin inquiry queue (Screen 11); it MUST NOT send a second reminder. The patient can still confirm or decline after the reminder. The state returns to `none`, and any pending reminder is dropped, when the inquiry is cancelled, when an admin reassigns providers or reruns distribution on Screen 12, or when an admin clears `supportRequired` (REQ-003-111). The reminder is sent only while the state is `awaiting_patient_confirmation`."}}
