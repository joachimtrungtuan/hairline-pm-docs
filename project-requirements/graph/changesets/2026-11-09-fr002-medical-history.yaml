  - {"op": "add_node", "id": "REQ-002-012", "type": "Rule", "owner_fr": "FR-002", "title": "Expose processing API for FR-003", "attrs": {"statement": "Engine MUST expose processing API consumed by FR-003", "rationale": "Integration Requirements (line 311). Entry point 1 (line 74). Integration Points (lines 381-382)."}}
  - {"op": "add_node", "id": "REQ-002-013", "type": "Rule", "owner_fr": "FR-002", "title": "Return structured error codes on validation failure", "attrs": {"statement": "Engine MUST return structured error codes for validation failures", "rationale": "Integration Requirements (line 312). The same outcome, with guidance and no persisted artifacts, is stated as REQ-002-036."}}
