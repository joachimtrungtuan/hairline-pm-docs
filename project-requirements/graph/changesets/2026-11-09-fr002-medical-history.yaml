  - {"op": "add_node", "id": "REQ-002-036", "type": "Rule", "owner_fr": "FR-002", "title": "Failed validation returns error codes, stores nothing", "attrs": {"statement": "On validation failure, engine returns structured error codes and guidance to the caller (FR-003); no artifacts persisted.", "rationale": "Media Rules 6 (line 222). Repeated as Alternative Flow A1 (from line 98, caller can retry), integration contract rules (line 198) and edge cases (lines 258-260). Error codes named in User Story 2 (lines 252-254): MEDIA_INCOMPLETE_VIEW_SET, MEDIA_SIZE_EXCEEDED, MEDIA_QUALITY_INSUFFICIENT. Close to REQ-002-013, which states only the error codes."}}
