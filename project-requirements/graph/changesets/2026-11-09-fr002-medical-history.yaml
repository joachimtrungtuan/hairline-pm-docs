  - {"op": "add_node", "id": "REQ-002-008", "type": "Rule", "owner_fr": "FR-002", "title": "No PII in engine responses", "attrs": {"statement": "No PII in engine responses; anonymized identifiers only", "rationale": "Security and Privacy Requirements (line 304). Repeated in integration contract rules (line 196, no PII in payloads) and Security Considerations (line 393)."}}
  - {"op": "add_node", "id": "REQ-002-009", "type": "Rule", "owner_fr": "FR-002", "title": "Store media under anonymized patient id", "attrs": {"statement": "Media MUST be stored under anonymizedPatientId", "rationale": "Security and Privacy Requirements (line 305). Repeated in integration contract rules (line 196) and Security Considerations (line 394)."}}
  - {"op": "add_node", "id": "REQ-002-010", "type": "Rule", "owner_fr": "FR-002", "title": "All operations auditable and retention-compliant", "attrs": {"statement": "All operations MUST be fully auditable and retention-compliant", "rationale": "Security and Privacy Requirements (line 306). Security Considerations (line 395): full audit trail for processing operations and configuration versions."}}
