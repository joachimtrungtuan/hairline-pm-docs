  - {"op": "add_node", "id": "REQ-002-015", "type": "Rule", "owner_fr": "FR-002", "title": "Patients reach the engine only through FR-003", "attrs": {"statement": "Patients do not directly interact with FR-002 engine; all interaction through FR-003", "rationale": "Patient Platform breakdown (prd.md line 30; lines 28-29 give the capture and submit flow). Patient-facing capture UI is handled by FR-003; the patient app submits questionnaire responses and the head scan photo set (V1) to the engine via FR-003."}}
