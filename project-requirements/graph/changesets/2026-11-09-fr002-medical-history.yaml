  - {"op": "add_node", "id": "REQ-002-001", "type": "Rule", "owner_fr": "FR-002", "title": "Validate responses against questionnaire template", "attrs": {"statement": "Engine MUST validate responses against FR-025 template requirements", "rationale": "Core Requirements (prd.md line 291). Workflow 1 step 2 (flow diagram, Workflow 1 at line 80): engine validates completeness against the FR-025 template and media constraints. Shared Services (line 49): Medical Intake Engine validates questionnaire responses. Integration contract rules (line 195): enforce FR-025 required fields and media constraints."}}
