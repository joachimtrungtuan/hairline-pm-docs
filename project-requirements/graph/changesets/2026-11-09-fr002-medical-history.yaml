  - {"op": "add_node", "id": "REQ-002-019", "type": "Rule", "owner_fr": "FR-002", "title": "Admin manages templates, fields and risk-tag rules", "attrs": {"statement": "Admin manages questionnaire templates, sections, fields, and risk-tag rules via FR-025", "rationale": "Admin Platform breakdown (line 40). Admin Editability 1 (line 226): admin can manage templates, guidance copy, and risk-tag rules. Workflow 3 step 2: admin creates/edits templates: sections, fields, required/optional, help text, and risk-tag rules. Merged as one rule."}}
