reason: "FR-006 logic review, pass 2: pending provider fault now blocks payment, payment reminders and revive, keeps the hold and re-checks the status at the Screen 10 submit (REQ-006-081, new STP-006-609, STP-006-605); Close inquiry for a Cancelled booking that still carries supportRequired (REQ-006-082, new STP-006-210 and FLW-006-close-inquiry); one refund per closure (REQ-006-083); Cancel Booking not offered in In Progress or Aftercare (REQ-006-004, REQ-006-052, REQ-006-061, STP-006-301); B7 refund from the held payout; STP-006-805 for Move to Aftercare only; B8 voids the remaining installments and reaches the refund calculation once; unpaid balance cancellation point counted in days after the first missed installment; emergency edit limited to the appointment time on the same date and the booking notes (REQ-006-074, STP-006-209, new STP-006-211); system-filled fee and refund amounts on booking.cancelled (REQ-006-011, STP-006-305); Screen 1 blocked state while a fault is pending (REQ-006-037)."
by: docs-manager
operations:
  - {"op": "update_node", "id": "REQ-006-004", "attrs": {"statement": "System MUST enforce the cancellation policy, with refunds following the refund ladder set in FR-029 (rescheduling deferred to V2). Apart from the unpaid-balance case in REQ-006-016, only an admin MAY cancel a booking, from `Accepted`, `Payment Window Expired`, or `Confirmed` (and from `In Progress` only through the Cancel route of Screen 11), never from `Aftercare`, with a mandatory reason, confirmation, and audit entry; the booking and inquiry MUST become `Cancelled`, the accepted quote MUST stay `accepted`, and `booking.cancelled` MUST be sent. The refund MUST follow REQ-006-053. The patient MUST NOT have an in-app cancel action from acceptance onward and MUST be offered \"Contact support\" instead."}}
  - {"op": "update_node", "id": "REQ-006-011", "attrs": {"statement": "System MUST integrate with Notification Service for confirmations, reminders, and policy notices, and MUST trigger these FR-030 events: `booking.scheduled` (sent on patient acceptance and on an admin-authored replacement acceptance), `booking.rescheduled` (sent on an admin appointment change and on an emergency edit of the appointment time), `booking.cancelled` (sent on any booking cancellation with the reason or cause, and with the cancellation fee and the refund amount filled in by the system: an admin cancellation, a provider drop-out at the Screen 10 submit, and a system cancellation for an unpaid balance; not for a provider withdrawal, which FR-004 announces through `quote.withdrawn`), `booking.hold_expiring_soon`, `booking.payment_window_expired`, `booking.revived`, `booking.provider_fault_replacement`, `booking.confirmed` (sent when the first payment confirms the booking), and `booking.appointment_reminder` (sent ahead of a confirmed appointment). The patient notice sent at Close inquiry has its event and template owned by FR-020 and FR-030. Recipients, message content, and whether each notice is mandatory are owned by the notification Rules in FR-020 (for example REQ-020-021) and FR-030 and are not restated here. FR-004 is the only producer of `quote.withdrawn`; FR-006 does not emit it and reacts to it by starting the provider-fault transfer in Alternative Flow B5."}}
  - {"op": "update_node", "id": "REQ-006-016", "attrs": {"statement": "`Payment Window Expired` MUST apply only to the first payment step (acceptance to deposit or first installment). A missed later installment or final payment MUST NOT cause `Payment Window Expired`, booking cancellation, or inquiry cancellation. The one exception is the unpaid balance of a booking paid with the Installments option on Screen 1 (the \"deposit plan\" of FR-029): when that balance is still unpaid at the cancellation point set in FR-029, counted in days after the due date of the first missed installment, System MUST cancel the `Confirmed` booking with closure cause `UnpaidBalance`, cancel the inquiry as in Alternative Flow B2, release the calendar block, void the remaining installments, send `booking.cancelled`, and apply the refund ladder. The rule is inactive until an admin sets that point, which has no default, and it applies only to bookings confirmed after the value is set."}}
  - {"op": "update_node", "id": "REQ-006-017", "attrs": {"statement": "Admin MAY revive a `Payment Window Expired` booking to `Accepted` only through Screen 7 with a mandatory reason, a slot availability re-check, a check that the appointment is later than the new payment deadline, a new hold of the FR-026 duration, one promotion use taken again where the accepted promotion has a usage limit (re-reserved for a provider-selected promotion or patient code, taken again for an automatic promotion; the revive is rejected if the limit has no room), an audit entry, an unchanged AcceptanceEvent, and a mandatory \"booking revived\" notice to patient and provider. A revive MUST be blocked while the booking carries the marker of a pending provider fault. A revive MUST NOT extend the expired hold; it starts a new one, and the initial payment then MUST pass the Initial Payment Guard (REQ-007-017) against that new hold. Appointment date changes MUST be made through Screen 8 or the admin edit of the accepted quote's date range or appointment (REQ-005-023), both running the same checks (provider `Active`, slot availability, a feasible FR-007B plan recalculation, and for an `Accepted` booking an appointment later than the payment deadline), MUST NOT apply the FR-029 rescheduling fee, MUST update the booking's current appointment while the acceptance snapshot keeps the accepted baseline, MUST send `booking.rescheduled`, and MUST trigger an FR-008 travel review for any travel records already linked to the booking. No other manual status change is allowed."}}
  - {"op": "update_node", "id": "REQ-006-018", "attrs": {"statement": "When the provider withdraws or drops out after acceptance and before treatment starts, System MUST set the `supportRequired` marker with the cause `ProviderFault` at the trigger, MUST, at the admin submit on Screen 10, re-check the booking status and cancel the booking with cause `ProviderFault`, release the hold or calendar block, keep the AcceptanceEvent unchanged, and let an admin transfer the patient to a replacement provider in the same inquiry through an admin-authored replacement quote and a new admin-authored acceptance that points to that quote, option, and date-price row (Alternative Flow B5, Screen 10; FR-004 Workflow 7 and Screen 8). A replacement quote that is not accepted MUST expire under the normal quote expiry, the inquiry MUST stay `supportRequired` without automatic cancellation, and the admin MAY author another replacement quote or, for a `Cancelled` booking that still carries the marker, close the inquiry (REQ-006-082). System MUST write the single supersession record linking the original AcceptanceEvent to the new one at the replacement acceptance, as one append-only insert; the B4 or B5 closure is recorded on the booking as its cause. A provider fault during `Aftercare` MUST NOT create a new quote, acceptance, or payment; the booking stays `Aftercare` and an admin reassigns the aftercare provider or team through FR-011 (Alternative Flow B6); the replacement booking MUST receive the carried-over passport and copied flight and hotel records flagged \"travel-date review required\" per FR-008, with the originals kept read-only on the closed booking."}}
  - {"op": "update_node", "id": "REQ-006-019", "attrs": {"statement": "When a provider fault occurs while the booking is `In Progress`, System MUST keep the booking `In Progress`, MUST NOT cancel it automatically or create a replacement quote or acceptance, and MUST flag it `supportRequired` with the cause. Only an admin MAY resolve it on Screen 11 (Alternative Flow B7), with a mandatory reason, confirmation, and audit entry, by either moving the booking to `Aftercare` and reassigning the aftercare provider or team through FR-011 Screen 19, or cancelling the booking through Screen 9. The admin MUST also set the patient refund amount, from zero up to the full amount paid, under the same mandatory reason and audit entry, and System MUST hold the provider's payout for that booking from the fault until the chosen route completes, MUST take the refund from that held payout, and MUST deduct any shortfall from the provider's next payout when the payout was already released. The decision records the choice only: System MUST resolve the `supportRequired` marker and end the payout hold once the chosen route completes, by the Screen 9 submit or the FR-011 Screen 19 submit."}}
  - {"op": "update_node", "id": "REQ-006-036", "attrs": {"statement": "Before the hold expires, the patient receives the `booking.hold_expiring_soon` reminder; the lead time is set by admin in FR-026, and the notice details are in the notification Rule (REQ-020-086). No reminder is sent while a provider fault is pending on the booking."}}
  - {"op": "update_node", "id": "REQ-006-037", "attrs": {"statement": "If the booking is `Payment Window Expired`, carries a pending provider fault, or is `Cancelled` for any other cause (provider withdrawal or fault, provider suspension or deactivation), the screen shows the same read-only blocked layout with the banner text of that cause and the Contact Support button; all payment fields and payment actions are hidden."}}
  - {"op": "update_node", "id": "REQ-006-052", "attrs": {"statement": "`Accepted`, `Payment Window Expired`, and `Confirmed` from the Cancel Booking action on Screen 6, and `In Progress` only through the Cancel route of Alternative Flow B7 (Screen 11 opens Screen 9). The action is not offered in `In Progress` or `Aftercare`; those stages use Screen 11 and Alternative Flow B6. `Cancelled` and `Completed` are terminal and cannot be cancelled again."}}
  - {"op": "update_node", "id": "REQ-006-053", "attrs": {"statement": "A full refund applies when the provider withdraws, drops out, or is suspended or deactivated before treatment starts; an in-treatment provider fault takes an admin-set refund; every other cancellation follows the refund ladder set in FR-029. When the provider withdraws or drops out after acceptance and before treatment starts (Alternative Flow B5), or the booking is cancelled by a provider suspension or deactivation (Alternative Flow B4), the patient is refunded everything paid, pays no cancellation fee, and a replacement booking takes a new payment; the same terms apply to an admin cancellation of a booking with a pending provider fault. While `In Progress` the case follows Alternative Flow B7: the admin sets the patient refund amount from zero up to the full amount paid, with a mandatory reason and an audit entry, and the provider's payout for the booking is held from the fault until the chosen route completes; the refund comes out of the held payout, and if the payout was already released, the shortfall is deducted from the provider's next payout."}}
  - {"op": "update_node", "id": "REQ-006-058", "attrs": {"statement": "If the original booking is not already `Cancelled`, the submit first cancels it with cause `ProviderFault` and releases its hold or calendar block; until this submit the original booking keeps its status and its hold, with payment, payment reminders and revive blocked (Alternative Flow B5 steps 1 and 2)."}}
  - {"op": "update_node", "id": "REQ-006-061", "attrs": {"statement": "**Cancelled entries** (source state, actor, cause): (1) `Accepted`, `Payment Window Expired`, or `Confirmed` → `Cancelled` by admin cancellation (Screen 9), including support-routed patient requests, with the admin's reason, and `In Progress` → `Cancelled` through the Cancel route of Screen 11; the inquiry also becomes `Cancelled` and the accepted quote stays `accepted` (Alternative Flows B2, B3, and B7). Cancel Booking is not offered in `In Progress` or `Aftercare` on Screen 6. A cancellation of a booking with a pending provider fault takes the cause `ProviderFault` (REQ-006-081). (2) `Accepted` or `Confirmed` → `Cancelled` at the admin submit of the provider-fault transfer, cause `ProviderFault` (Alternative Flow B5). (3) `Accepted` or `Confirmed` → `Cancelled` by the system on an effective provider suspension or deactivation, cause `ProviderSuspended` or `ProviderDeactivated` with `supportRequired = true` (Alternative Flow B4), followed by the B5 transfer. The inquiry of a booking closed through (2) or (3) stays open until the replacement acceptance, or until an admin closes it with Close inquiry (REQ-006-082). (4) `Confirmed` → `Cancelled` by the system, cause `UnpaidBalance`, when the unpaid balance of a booking paid with the Installments option is still unpaid at the cancellation point set in FR-029, counted in days after the due date of the first missed installment; the inquiry also becomes `Cancelled`, the remaining installments are voided, the refund ladder applies, and the rule is inactive until that point is set and applies only to bookings confirmed after it is set (Alternative Flow B8). A provider fault or provider-status event while `In Progress` does not cancel the booking; it stays `In Progress` with `supportRequired` until the admin moves it to `Aftercare` with an aftercare reassignment or cancels it through entry (1) (Alternative Flow B7). A provider fault or provider-status event during `Aftercare` does not cancel the booking; it stays `Aftercare` and follows the aftercare reassignment (Alternative Flow B6). `Completed` and `Cancelled` are terminal."}}
  - {"op": "update_node", "id": "REQ-006-062", "attrs": {"statement": "(1) Post-acceptance hold expiry without successful first payment (FR-026 duration, 48h default), (2) Admin cancellation during the hold period, including a support-routed patient request (immediate release per B3 flow), (3) Admin booking cancellation per B2 flow, (4) Provider suspension/deactivation cascade per B4 flow (immediate release, including holds with time remaining), (5) Provider fault before treatment starts per B5 flow, released at the admin submit on Screen 10 or at an admin cancellation of the pending fault, never earlier (the hold does not expire while the fault is pending), (6) Admin appointment change per Screen 8 or an admin edit of the accepted quote date (the hold or block moves to the new appointment), (7) System cancellation for an unpaid balance per B8 flow (the calendar block is released)."}}
  - {"op": "update_node", "id": "REQ-006-074", "attrs": {"statement": "An admin MAY make an audited emergency edit that changes only the appointment time on the same date and the booking notes, with a mandatory reason; System MUST keep the full before and after history of every emergency edit. An emergency edit MUST NOT change the appointment date, the price, the package, the provider, or the clinic, MUST NOT set the booking status, and MUST NOT change payment records or money terms, which stay immutable; revive, appointment change, cancellation, and the provider-fault transfer keep their own guarded steps and checks, and the acceptance snapshot stays unchanged."}}
  - {"op": "add_node", "id": "REQ-006-081", "type": "Rule", "title": "A pending provider fault blocks payment, reminders and revive, keeps the hold, and Screen 10 re-checks the status at submit", "owner_fr": "FR-006", "attrs": {"statement": "From the trigger of a provider withdrawal or drop-out until the admin submit on Screen 10, System MUST keep the booking in its status with the `supportRequired` marker and the cause `ProviderFault`, MUST block payment, payment reminders, and revive against it, and MUST NOT let its hold expire. At the Screen 10 submit System MUST re-check the booking status: only `Accepted`, `Confirmed`, or a `Cancelled` booking that still carries the marker from the provider-status cascade proceed, and a booking that has reached `In Progress` MUST go to Alternative Flow B7. An admin cancellation of a booking with a pending provider fault MUST take the cause `ProviderFault`, the full refund, and no cancellation fee, and MUST resolve the marker.", "rationale": "prd.md Alternative Flow B5 steps 1, 2 and 5; Screens 1, 6, 7, 9 and 10"}}
