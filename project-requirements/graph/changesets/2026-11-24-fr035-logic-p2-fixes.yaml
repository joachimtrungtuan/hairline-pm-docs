  - {"op": "update_node", "id": "REQ-035-033", "attrs": {"statement": "Patient navigates to \"Help & Support\" from Settings screen (FR-026 / P01.2-S1); in-app deep link from other screens (e.g., contextual help links from booking, payment, or aftercare screens); push notification tap (e.g., tapping a case status change notification navigates to Ticket Detail); the Report a Problem row on the Hub opens Contact Support with the category preset to Technical Issue and the device, operating system, app version, and report time attached per FR-034 REQ-034-164; a person who is not logged in reaches only the support contact details (REQ-035-024)."}}
  - {"op": "update_node", "id": "REQ-035-039", "attrs": {"statement": "Emergency contact section is a healthcare UX best practice for post-procedure patient safety; the section is always rendered - it cannot be hidden or require scrolling past it. The section must remain visible regardless of scroll position (sticky or always rendered); emergency phone is read-only with tap-to-call on mobile and emergency email is read-only with tap-to-compose on mobile. Each row is shown only when its App Setting has a value: a row with no value is left out, and the Contact Support row stays."}, "title": "Emergency Contact Section always rendered on the Hub, each row when it has a value"}
  - {"op": "update_node", "id": "REQ-035-040", "attrs": {"statement": "Emergency phone and email values are two App Settings owned by FR-026 (support emergency contact phone and email); this screen displays them. FR-026 must keep at least one of the two values set: its settings screen refuses to save both blank, so the section is never empty."}}
  - {"op": "update_node", "id": "REQ-035-043", "attrs": {"statement": "Content type card is shown greyed out but still tappable, with label \"No content available yet\"; tapping shows empty state message \"No [content type] available yet. Check back later or Contact Support.\" Item count badge is hidden if count is 0."}}
  - {"op": "update_node", "id": "REQ-035-059", "attrs": {"statement": "A file that fails virus scanning is refused with the FR-034 message (REQ-034-106), and the patient can send the case or reply without it."}}
  - {"op": "update_node", "id": "REQ-035-062", "attrs": {"statement": "A support request submitted while offline, or one that fails with a server error (5xx), is queued on the device and shows \"queued, will be sent when online\"; it is sent when connectivity returns or retried with exponential backoff, and the patient gets the Case ID after it is sent. Only one request waits in the queue at a time (a second submit is refused with a message to wait until the first is sent); one not sent within 24 hours is reported to the patient as not sent, and the typed text is kept so it can be sent again."}}
  - {"op": "update_node", "id": "REQ-035-066", "attrs": {"statement": "Send Reply Button is enabled when reply input is non-empty; hidden for Closed cases. A reply that cannot be sent right now (device offline, server error, or media storage unavailable) is refused with a retry message and the typed text is kept."}, "title": "Send Reply enabled only with text; a reply that cannot be sent keeps the text"}
  - {"op": "update_node", "id": "REQ-035-069", "attrs": {"statement": "Closed Case Banner: \"This case is closed. If you still need help, you can create a new ticket or contact support to request this case be reopened.\" with \"Create New Ticket\" link to Screen 5 and \"Email support\" link that opens an email to the support address (the emergency email App Setting) with the case ID in the subject; the clause \"or contact support to request this case be reopened\" and the Email support link are shown only when that setting has a value (the sentence then ends after \"create a new ticket\"). Both paths: new ticket creation (in-app) and case reopening via admin (FR-034 Workflow B3, REQ-034-017)."}}
  - {"op": "update_node", "id": "REQ-035-070", "attrs": {"statement": "The resolution summary is also emailed to the patient when the case becomes Resolved, if the admin left Send Resolution Email checked on the case (FR-034 REQ-034-060, REQ-034-161) and the notification settings allow it (FR-030); the summary always shows on Ticket Detail."}}
  - {"op": "update_node", "id": "REQ-035-071", "attrs": {"statement": "Support case lifecycle workflow: Open -> In Progress -> Resolved -> Closed (fixed in the codebase, not editable by admin); it moves forward only, except that a patient reply reopens a Resolved case (REQ-035-019) and an Admin can reopen a Closed case (FR-034 REQ-034-017), after which the patient sees the case as Open with the reply box again and receives the FR-034 reopen notice (REQ-034-163)."}}
