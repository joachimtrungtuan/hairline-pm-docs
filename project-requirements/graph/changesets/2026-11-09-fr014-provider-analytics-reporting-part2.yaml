  - {"op": "add_node", "id": "REQ-014-192", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 1 C3 accepted-but-unpaid aging", "attrs": {"statement": "Chart: Stacked horizontal bar; Buckets: 0–24h · 1–3d · 4–7d · 8–14d · >14d; X = count of accepted selections awaiting successful initial payment; optional legend by treatment (top 3) or country; Age = snapshot time − `AcceptanceEvent.acceptedAt`; count one pending Booking/AcceptanceEvent with a valid exclusive payment-window hold. Exclude cancelled selections, superseded acceptance events, expired holds, and `Payment Window Expired` bookings, even if a flat quote status still says Accepted. Drill-down: click bucket → Accepted Quotes list resolved to the exact accepted subquote and pending booking; retain the same chart and buckets. Older buckets may legitimately be empty with the default 48-hour hold; use the actual configured deadline, not an assumed fixed limit.", "rationale": "PRD lines 234-238."}}
  - {"op": "add_node", "id": "REQ-014-193", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 1 C4 Payouts history and upcoming", "attrs": {"statement": "Chart: Column bar (monthly, last 6–12 months) + inline table (2–3 rows); Inline table columns: Type, Period, Amount, Scheduled Date, Cadence; Type = the provider display status from the Screen 4 Widget 8 FR-017 mapping (Upcoming / Processing / Paid / Failed; Voided is never shown). Rows: the next Upcoming payout, any Processing or Failed payout, then the most recent Paid payout, up to 3 rows. Scheduled Date = FR-017 scheduled payout date; for Paid rows it shows the paid date. Definition only; columns and layout unchanged; Drill-down: click bar → Payout statements list (CSV/PDF export)", "rationale": "PRD lines 242-245."}}
  - {"op": "add_node", "id": "REQ-014-194", "type": "Rule", "owner_fr": "FR-014", "title": "Error state: non-blocking banners, retry and telemetry", "attrs": {"statement": "Error: non-blocking banners + retry; log telemetry", "rationale": "PRD line 253. Screen 1 States; the other state lines restate Rules 4, 7 and 11."}}
  - {"op": "add_node", "id": "REQ-014-195", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 2 Widget 1 Funnel Conversion Trend", "attrs": {"statement": "Chart type: Multi-line chart (one line per funnel stage); X axis: Week or month (toggle); Y axis: Conversion % to that stage from Inquiries; Lines: Quoted % · Accepted % · Confirmed booking %; Drill-down: Click a point → Inquiries list filtered to that stage + time period; Calculation: Each stage % = distinct inquiry/provider pairs in the selected inquiry cohort that have reached that stage by the reporting cutoff ÷ all inquiry/provider pairs in that cohort. Counts are cumulative, not mutually exclusive highest-stage buckets. Use the shared cohort and cutoff definitions in Analytics Counting & Time Basis.", "rationale": "PRD lines 270-276."}}
  - {"op": "add_node", "id": "REQ-014-196", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 2 Widget 2 Conversion by Treatment Type", "attrs": {"statement": "Chart type: Grouped bar chart; X axis: Treatment type (from catalog); Y axis: Quote-to-booking conversion % (Quoted → Confirmed booking); Groups per bar: Quoted count, Accepted count, Confirmed booking count; Drill-down: Click bar → filtered list of quoted inquiries for that treatment; Data source: Patients do not choose a treatment in the FR-003 inquiry; the provider chooses it in the FR-004 Parent Quote. A treatment segment therefore starts at Quoted: the base is inquiries quoted with that treatment (Parent Quote treatment context), and Accepted and Confirmed booking stages follow the FR-005/FR-006 handoff for that treatment. Inquiries that were never quoted have no treatment and appear only in the all-treatments funnel (Widget 1). Deduplicate `(providerId, inquiryId, treatmentId)` within each treatment segment before counting stages; child options, date-price records, and quote revisions MUST NOT multiply counts. An inquiry may appear in more than one treatment segment, so segment counts are not additive.", "rationale": "PRD lines 284-290."}}
  - {"op": "add_node", "id": "REQ-014-197", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 2 Widget 3 Conversion by Patient Country", "attrs": {"statement": "Chart type: Horizontal ranked bar chart; Y axis: Patient country (top 10 by inquiry volume); X axis: Booking conversion % (Inquiries → Confirmed booking); Secondary bar: Inquiry count (context for the rate); Drill-down: Click bar → filtered Inquiries list for that country; Data source: `inquiries.patient_id → patients.location_id → countries.name`, with temporary fallback to legacy `patients.location` only for unmigrated rows.", "rationale": "PRD lines 298-304."}}
  - {"op": "add_node", "id": "REQ-014-198", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 2 Widget 4 Quote Acceptance Rate Trend", "attrs": {"statement": "Chart type: Line chart; X axis: Week or month (toggle); Y axis: Parent-quote acceptance rate = distinct accepted parent quotes ÷ distinct submitted parent quotes in the same first-submission cohort; Drill-down: Click point → parent Quotes list for that first-submission cohort, with accepted subquote provenance where present", "rationale": "PRD lines 312-315."}}
  - {"op": "add_node", "id": "REQ-014-199", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 2 Widget 5 TTFQ Trend", "attrs": {"statement": "Chart type: Dual-line chart (p50 line + p90 line); X axis: Week or month (toggle); Y axis: Minutes (render as h:m); Reference line: SLA target; Color band: Green/Amber/Red zones based on SLA thresholds; Drill-down: Click point → Inquiries list for that period sorted by TTFQ", "rationale": "PRD lines 323-328."}}
  - {"op": "add_node", "id": "REQ-014-200", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 2 Widget 6 Cancellation and No-Show Rate", "attrs": {"statement": "Chart type: Two KPI tiles + trend sparklines; Tile 1: Cancellation rate = cancelled (post-confirmed) ÷ confirmed bookings; Tile 2: No-show rate = no-show ÷ confirmed bookings; Sparkline: Rate trend over selected period; Drill-down: Click Cancellation tile → Bookings list filtered to post-confirmation cancellations (FR-006); click No-show tile → Cases list filtered to FR-010 closure reason `No-show`; Data source: Cancellations come from post-confirmation cancellations in the FR-006 Booking lifecycle. No-shows come from FR-010 case closures with closure reason `No-show`; No-show is an admin-managed case closure label, not a booking pipeline status. Each confirmed booking counts at most once, and a booking closed as No-show counts as a no-show, not a cancellation. Draft/quote expiry and `Payment Window Expired` before confirmation are not post-confirmation cancellations or no-shows. Historical acceptance remains recorded separately.", "rationale": "PRD lines 336-342."}}
  - {"op": "add_node", "id": "REQ-014-201", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 2 Widget 7 Platform Benchmarks", "attrs": {"statement": "Chart type: Comparison table with variance indicators; Metrics: TTFQ p50 · Conversion rate · Quote acceptance rate · Avg rating; Columns: Provider value · Platform median · Variance (±%) · Percentile band (Bottom 25% / Mid 50% / Top 25%); Color: Green / Amber / Red per the Shared Benchmark Rule (direction-aware; TTFQ lower is better); Business rule: Peer pool, minimum pool size, anonymisation, and colour follow the Shared Benchmark Rule in Analytics Counting & Time Basis. If the pool is insufficient, display \"Benchmark unavailable — not enough providers in your segment.\"", "rationale": "PRD lines 350-355."}}
  - {"op": "add_node", "id": "REQ-014-202", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 2 widgets share time range and country filter", "attrs": {"statement": "All widgets share the same time range and country filter", "rationale": "PRD line 361. Screen 2 Business Rules."}}
  - {"op": "add_node", "id": "REQ-014-203", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 2 treatment filter applies from Quoted onward", "attrs": {"statement": "Treatment type filter applies to quote-stage and later metrics (Quoted, Accepted, Confirmed booking). Inquiries carry no treatment, so with a treatment selected the Inquiries stage and inquiry-based rates show \"— (inquiries have no treatment)\" and conversion is measured from Quoted. TTFQ is not treatment-filtered", "rationale": "PRD line 362. Screen 2 Business Rules; detail of Rule 5A."}}
  - {"op": "add_node", "id": "REQ-014-204", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 3 Widget 1 Full Patient Location Breakdown", "attrs": {"statement": "Chart type: Ranked table + donut chart (linked); Table columns: Country · Inquiries · Confirmed bookings · Confirmed booking rate · Avg rating (Confirmed bookings and rate follow the inquiry cohort and Confirmed booking stage in Analytics Counting & Time Basis); Table: All countries (not capped at 8); sortable by any column; Donut: Top 10 countries by inquiry volume + Other; Drill-down: Click row/slice → Inquiries list filtered to that country; Avg rating: average `overall_rating` of this provider's Published FR-013 reviews published within the selected range, grouped by the reviewing patient's country (review → patient → `patients.location_id → countries.name`, with the same legacy `patients.location` fallback). Shows \"—\" when the country has no reviews in range; the review count appears in the tooltip.", "rationale": "PRD lines 379-385."}}
  - {"op": "add_node", "id": "REQ-014-205", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 3 Widget 2 New vs Returning Patients (provider-scoped)", "attrs": {"statement": "Chart type: Donut (current period split) + trend line over time; Definition: Provider-scoped: New = patient's first inquiry distributed to this provider · Returning = patient with an earlier inquiry distributed to this provider; Trend: New vs. Returning count per month over selected range; Drill-down: Click segment → Patient list filtered by type; Data source: `inquiries.patient_id` joined to this provider's `inquiry_providers` records — count distinct patient_ids whose earliest inquiry distributed to this provider falls in the range = New; patients in the range with an earlier inquiry distributed to this provider = Returning. Inquiries the patient sent only to other providers do not make them Returning.", "rationale": "PRD lines 393-398. Restated by Screen 3 Business Rules (line 458: returning is based on the same provider's patient base)."}}
  - {"op": "add_node", "id": "REQ-014-206", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 3 Widget 3 Patient Journey Time", "attrs": {"statement": "Chart type: Two KPI tiles + distribution histogram; Tile 1: Median days from inquiry → payment (p50); Tile 2: p90 days from inquiry → payment; Histogram: Distribution of journey durations in days (binned: 0–7d · 8–14d · 15–30d · 31–60d · >60d); Drill-down: Click histogram bin → Inquiries list filtered to that journey-duration range; Calculation: first successful initial-payment capture time that confirms the FR-006 Booking − `inquiry.created_at`, for bookings first confirmed within the selected range. Resolve the booking through its AcceptanceEvent and selected subquote; count the inquiry once. Payment-attempt creation, failed attempts, later installments, and retries of the same successful event MUST NOT add journey observations.", "rationale": "PRD lines 406-412."}}
  - {"op": "add_node", "id": "REQ-014-207", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 3 Widget 4 Review Sub-Scores by Treatment", "attrs": {"statement": "Chart type: Grouped bar chart; X axis: Treatment type; Y axis: Score (1–5); Groups per bar: Overall · Results · Staff · Facility · Value; Data source: FR-013 per-treatment sub-scores endpoint (REQ-013-018a), keyed by `treatment_id`, Published reviews only; not joined through quote status; Drill-down: Click bar → Reviews list filtered to that treatment", "rationale": "PRD lines 420-425."}}
  - {"op": "add_node", "id": "REQ-014-208", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 3 Widget 5 Treatment Preference Distribution", "attrs": {"statement": "Chart type: Horizontal ranked bar chart; Y axis: Treatment type; X axis: Quoted inquiry count + Booking count (dual bars); Purpose: What treatments the provider quotes most vs. what actually gets booked; Drill-down: Click bar → filtered Inquiries or Bookings list; Data source: Quoted bars count distinct inquiries the provider quoted, by the treatment of the submitted Parent Quote (FR-004); inquiries have no treatment until quoted. Booking bars count Confirmed bookings (FR-006), by the treatment of the accepted parent quote (FR-005 AcceptanceEvent). Both follow Analytics Counting & Time Basis; quote statuses are not used.", "rationale": "PRD lines 433-439."}}
  - {"op": "add_node", "id": "REQ-014-209", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 3 Widget 6 Aftercare Activation Rate", "attrs": {"statement": "Chart type: KPI tile + trend sparkline; Value: Aftercare plans activated ÷ completed treatments; Drill-down: Click → Aftercare records list; Data source: FR-011 aftercare records created for procedures completed in the period ÷ procedures completed in the period (FR-010 completion), by the accepted parent's treatment. Each completed procedure counts once.", "rationale": "PRD lines 447-451."}}
  - {"op": "add_node", "id": "REQ-014-210", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 3 shows no patient names or identifiers", "attrs": {"statement": "PII: no patient names or identifiers shown; all aggregated.", "rationale": "PRD line 459. Screen 3 Business Rules."}}
  - {"op": "add_node", "id": "REQ-014-211", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 4 Widget 1 Revenue Trend", "attrs": {"statement": "Chart type: Area line chart; X axis: Week / Month / Quarter (toggle); Y axis: Income amount (provider currency); Single series: Income (captured payments only); Drill-down: Click period → Payments list filtered to that period; Calculation: Gross captured income per the Refund Source of Truth rule — `SUM(payments.amount)` where `payment_type ≠ 'refund'` and `payment_status IN ('completed', 'refunded')`, bucketed by `payments.created_at`. A later refund does not remove the original payment from income.", "rationale": "PRD lines 475-481."}}
  - {"op": "add_node", "id": "REQ-014-212", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 4 Widget 2 Revenue by Treatment attribution", "attrs": {"statement": "Chart type: Horizontal ranked bar chart (full list, paginated if >15); Y axis: Treatment name (all, not capped); X axis: Income amount; Secondary metric: % of total revenue; Drill-down: Click bar → Payments list filtered to that treatment; Data source: Income per the Refund Source of Truth rule, attributed to a treatment through payment → FR-006 Booking → FR-005 AcceptanceEvent → accepted parent quote's treatment. Each payment is attributed once. Payments that cannot be resolved to an accepted parent are shown as \"Unattributed\", not dropped or assigned to a guessed treatment. Screen 1 C2 uses the same attribution.", "rationale": "PRD lines 489-495. Referenced by Screen 1 C2 (line 230)."}}
  - {"op": "add_node", "id": "REQ-014-213", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 4 Widget 3 Revenue by Patient Country", "attrs": {"statement": "Chart type: Horizontal ranked bar chart; Y axis: Patient country (top 10 + Other); X axis: Income amount; Secondary metric: Patient count; Drill-down: Click bar → Payments list filtered to that country; Data source: `payments.patient_id → patients.location_id → countries.name`, with temporary fallback to legacy `patients.location` only for unmigrated rows.", "rationale": "PRD lines 503-509."}}
  - {"op": "add_node", "id": "REQ-014-214", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 4 Widget 4 Commission and Net Revenue", "attrs": {"statement": "Chart type: Three KPI tiles + trend line (both on same chart); Tile 1: Total income (gross); Tile 2: Commission deducted; Tile 3: Net income = Total income (gross) − Commission deducted, for the same period; Trend: Gross income line + commission deducted area, stacked; Calculation: Commission deducted = sum of percentage-model deductions for each completed payment in range plus flat-rate deductions for each procedure completed in range (FR-010 completion, per FR-015). Each deduction uses the booking's commission snapshot taken at booking confirmation (FR-015 REQ-015-022, FR-029), not the provider's current commission settings: Percentage model: `payments.amount × (snapshot_commission_percentage / 100)`; Flat-rate model: `snapshot_commission_amount` once per completed procedure, regardless of procedure price, number of payments, or installments (FR-015); Gross, commission, and net income are displayed in provider currency. Net income does not subtract refunds; refunds are reported separately in Widget 5.", "rationale": "PRD lines 517-528. Commission logic fixed in codebase (line 1511)."}}
  - {"op": "add_node", "id": "REQ-014-215", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 4 Widget 5 Refunds", "attrs": {"statement": "Chart type: Two KPI tiles + trend; Tile 1: Total refund amount (period); Tile 2: Refund rate = refund count ÷ captured payment count (both per the Refund Source of Truth rule); Trend: Monthly refund rate over selected range; Drill-down: Click → Payments list filtered to refund type; Data source: Refund rows only — `payments.payment_type = 'refund'` with `payment_status = 'completed'` (Refund Source of Truth rule). The original payment's `refunded` status is not counted as a second refund.", "rationale": "PRD lines 536-542."}}
  - {"op": "add_node", "id": "REQ-014-216", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 4 Widget 6 Installment vs Full Payment Split", "attrs": {"statement": "Chart type: Donut + KPI summary; Segments: Installment payments · Full payments; KPI: Avg number of installments for installment plans; Trend: Monthly installment adoption rate = bookings first confirmed in the month whose payment is an FR-007B installment plan ÷ all bookings first confirmed in the month (one observation per booking); Drill-down: Click segment → Payments list filtered by installment flag; Data source: `payments.is_installment` for the payment split; FR-007B installment plan records for the average installment count and the adoption rate. The donut counts payment records; the adoption rate counts bookings, so the two values are not interchangeable.", "rationale": "PRD lines 550-556."}}
  - {"op": "add_node", "id": "REQ-014-217", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 4 Widget 7 Cash-at-Risk Summary", "attrs": {"statement": "Chart type: KPI tile + link to Main Dashboard Section C3 for full aging detail; Value: Sum of accepted subquote total prices for selections awaiting initial payment with a valid hold; label as potential accepted booking value, not captured revenue or outstanding installment debt; Count: Distinct pending bookings/AcceptanceEvents in each aging bucket, following Screen 1 C3 exclusions and deadline checks; Note: This is a summary view; the full aging stacked bar is in Screen 1 Section C3", "rationale": "PRD lines 564-567."}}
  - {"op": "add_node", "id": "REQ-014-218", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 4 Widget 8 Payout History and FR-017 status mapping", "attrs": {"statement": "Chart type: Column bar chart (monthly, full history) + paginated table below; Bar chart: Last 12 months of disbursed payouts; Table columns: Period · Amount · Status (Upcoming / Processing / Paid / Failed) · Paid date · Cadence; All rows: Full history (not limited to the 2–3 rows shown in the Main Dashboard Section C4 inline table); Drill-down: Click bar or row → Payout statement detail (CSV/PDF export); Payout status mapping (FR-017): Upcoming: No statement yet for the period, or Pending Approval, Approved, or Overdue (internal admin review states are not shown to providers); Processing: Processing (Stripe transfer initiated); Paid: Paid (`transfer.paid`); Paid date = webhook time; Failed: Failed (`transfer.failed`); returns to Processing when admin retries; (not shown): Voided — excluded from the provider's payout chart, table, totals, and exports. Voided is an internal admin audit state; the period appears as Upcoming again once FR-017 re-generates a statement on the next payout cycle", "rationale": "PRD lines 575-589. FR-017 dependency (line 1572: Voided excluded from provider-facing payout views and exports)."}}
  - {"op": "add_node", "id": "REQ-014-219", "type": "Rule", "owner_fr": "FR-014", "title": "Commission from booking confirmation snapshot with period note", "attrs": {"statement": "Commission is calculated from each booking's commission snapshot taken at booking confirmation (FR-015 REQ-015-022), not from a single percentage-only field or the provider's current settings; provider screens must display a note clarifying whether the period includes percentage-based deductions, flat-rate deductions, or both", "rationale": "PRD line 596. Screen 4 Business Rules."}}
  - {"op": "add_node", "id": "REQ-014-220", "type": "Rule", "owner_fr": "FR-014", "title": "Finance amounts in provider currency with historical FX note", "attrs": {"statement": "All amounts in provider currency; FX rates locked at payment `created_at` date; footer note \"Historical exchange rates applied\"", "rationale": "PRD line 597. Screen 4 Business Rules."}}
  - {"op": "add_node", "id": "REQ-014-221", "type": "Rule", "owner_fr": "FR-014", "title": "Payout history shows processed payouts only", "attrs": {"statement": "Payout history only shows payouts that have been processed (not projected future payouts beyond the next scheduled one)", "rationale": "PRD line 598. Screen 4 Business Rules."}}
  - {"op": "add_node", "id": "REQ-014-222", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 5 Widget 1 Average Accepted Price by Treatment", "attrs": {"statement": "Chart type: Bar chart + trend line; X axis: Treatment type; Y axis: Average accepted subquote total price (provider reporting currency); Trend overlay: Provider's own average accepted price over time, bucketed by AcceptanceEvent.acceptedAt; Drill-down: Click bar → Quotes list filtered to accepted selections for that treatment and acceptance period", "rationale": "PRD lines 615-619."}}
  - {"op": "add_node", "id": "REQ-014-223", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 5 Widget 2 Accepted Price Distribution", "attrs": {"statement": "Chart type: Histogram; X axis: Accepted subquote total price (binned, e.g., 0–1k · 1k–2k · 2k–3k · 3k–5k · >5k; dynamic bins based on accepted-price range); Y axis: Accepted selection count (one observation per accepted parent quote); Reference lines: Median accepted price · Platform median accepted price (anonymised); Drill-down: Click bin → Quotes list filtered to accepted selections in that price range and acceptance period", "rationale": "PRD lines 627-631."}}
  - {"op": "add_node", "id": "REQ-014-224", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 5 Widget 3 Accepted Price vs Acceptance Rate scatter", "attrs": {"statement": "Chart type: Scatter plot; X axis: Average accepted subquote price among accepted parents in the selected first-submission cohort, per treatment type; Y axis: Distinct accepted parent quotes ÷ all submitted parent quotes in that same cohort, per treatment type; Points: One point per treatment type (labelled); Reference lines: Platform median X (average accepted price) and platform median Y (parent-quote acceptance rate), using the same cohort and reporting cutoff; Purpose: Descriptive comparison of accepted prices and acceptance rates across treatments; does not show conversion probability at an offered price or prove a causal price effect; Note: A treatment needs a non-zero submitted-parent denominator and at least one accepted selection to have both coordinates. If fewer than 3 treatment types qualify, replace the chart with \"Insufficient treatment variety to compare accepted prices and acceptance rates.\" Unaccepted parents remain in Y's denominator but contribute no amount to X; tooltips show both sample sizes and the first-submission cohort basis, which differs from acceptance-period pricing widgets.", "rationale": "PRD lines 639-646."}}
  - {"op": "add_node", "id": "REQ-014-225", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 5 Widget 4 Platform Benchmark Comparison", "attrs": {"statement": "Chart type: Comparison table; Rows (metrics): TTFQ p50 · Overall booking conversion rate · Parent-quote acceptance rate · Average accepted price · Avg overall rating · Avg results rating; Columns: Provider value · Platform median · Variance (±%) · Percentile band (Bottom 25% / Mid 50% / Top 25%); Color coding: Per the Shared Benchmark Rule: Green = at or better than median · Amber = up to 10% worse · Red = more than 10% worse; TTFQ lower is better; average accepted price has no colour; Drill-down: Click metric row → corresponding detailed screen (e.g., TTFQ → Screen 2 Widget 5); Business rule: Benchmark pool follows the Shared Benchmark Rule in Analytics Counting & Time Basis (≥30 inquiries, rolling 12 months, minimum 5 providers). If pool is too small, display \"Not enough peer providers to generate a meaningful benchmark yet.\"", "rationale": "PRD lines 654-660."}}
  - {"op": "add_node", "id": "REQ-014-226", "type": "Rule", "owner_fr": "FR-014", "title": "Benchmark data refreshes at the configured frequency", "attrs": {"statement": "Benchmark data refreshes at the FR-026 Analytics Configuration benchmark refresh frequency (default Weekly; not real-time)", "rationale": "PRD line 667. Screen 5 Business Rules."}}
  - {"op": "add_node", "id": "REQ-014-227", "type": "Rule", "owner_fr": "FR-014", "title": "Amount metrics use only immutable accepted-selection prices", "attrs": {"statement": "Amount metrics use only immutable accepted-selection prices, including the accepted promotion; never substitute a minimum, maximum, average, or sum of unaccepted alternatives. Historical acceptance remains an observation after later cancellation or hold expiry; those outcomes are measured separately.", "rationale": "PRD line 668. Screen 5 Business Rules."}}
  - {"op": "add_node", "id": "REQ-014-228", "type": "Rule", "owner_fr": "FR-014", "title": "Price widgets use acceptance-time cohort; scatter uses first-submission cohort", "attrs": {"statement": "Standalone price widgets use the acceptance-time cohort. The scatter explicitly uses the parent first-submission cohort so both axes refer to the same offered parent population.", "rationale": "PRD line 669. Screen 5 Business Rules."}}
  - {"op": "add_node", "id": "REQ-014-229", "type": "Rule", "owner_fr": "FR-014", "title": "Prices in provider reporting currency with preserved provenance", "attrs": {"statement": "Price displayed in provider reporting currency; preserve the accepted currency and locked exchange-rate provenance and apply Rule 10 for any additional reporting-currency conversion. Apply the same historical conversion basis to provider and peer amounts; current package prices or today's FX MUST NOT rewrite the accepted value.", "rationale": "PRD line 670. Screen 5 Business Rules."}}
  - {"op": "add_node", "id": "REQ-014-230", "type": "Rule", "owner_fr": "FR-014", "title": "Price benchmarks include only peers with accepted-price observations", "attrs": {"statement": "Price benchmarks include only peers with accepted-price observations; the existing minimum 5-provider benchmark pool still applies to that metric. Unaccepted parents are not zero-price observations.", "rationale": "PRD line 671. Screen 5 Business Rules."}}
  - {"op": "add_node", "id": "REQ-014-231", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 6 export form fields and constraints", "attrs": {"statement": "Report type: Radio; Screens to include: Checkboxes; Date range: Date picker; Country filter: Dropdown; Treatment filter: Dropdown; Email delivery: Checkbox; Recipients: Multi-select; Schedule recurring: Checkbox + select", "rationale": "PRD lines 683-690. Screen 6 Data Fields."}}
  - {"op": "add_node", "id": "REQ-014-232", "type": "Rule", "owner_fr": "FR-014", "title": "Export contains only widgets the generating user may see", "attrs": {"statement": "Widget-level permission scope: an export contains only the widgets the generating user is permitted to see on each selected screen (Rules 15A, 15B and 15F); widgets the user cannot see are omitted, not shown empty or locked. Recurring runs re-resolve this scope against the configuration owner's permissions at run time.", "rationale": "PRD line 694. Screen 6 Business Rules."}}
  - {"op": "add_node", "id": "REQ-014-233", "type": "Rule", "owner_fr": "FR-014", "title": "PDF uses provider logo and platform default palette", "attrs": {"statement": "PDF reports include provider logo sourced from `providers.profile_image`; no provider-specific color theming (platform default palette is used) — schema does not define brand color fields and this is intentional for v1", "rationale": "PRD line 695. Screen 6 Business Rules."}}
  - {"op": "add_node", "id": "REQ-014-234", "type": "Rule", "owner_fr": "FR-014", "title": "Export email: PDF attachment and 48-hour secure link via analytics.export_ready", "attrs": {"statement": "Email delivery: PDF attachment + secure link (expires 48 hours), sent through S-03 as the FR-030 `analytics.export_ready` event (email + in-app) to each recipient", "rationale": "PRD line 698. Screen 6 Business Rules. Restated by Communication Structure (line 59), S-03 dependency (line 1577) and Implementation Notes (line 1628)."}}
  - {"op": "add_node", "id": "REQ-014-235", "type": "Rule", "owner_fr": "FR-014", "title": "Maximum 5 active recurring configurations per provider", "attrs": {"statement": "Max 5 active recurring configurations per provider", "rationale": "PRD line 699. Screen 6 Business Rules; restated by Tab 2 heading (line 722)."}}
  - {"op": "add_node", "id": "REQ-014-236", "type": "Rule", "owner_fr": "FR-014", "title": "Recurring run covers previous full period, starts 06:00 provider time", "attrs": {"statement": "Recurring date range: each run covers the previous full period in the provider's timezone (`providers.timezone`): Monday–Sunday week, calendar month, or calendar quarter. Runs start at 06:00 provider local time on the first day after the period ends.", "rationale": "PRD line 700. Screen 6 Business Rules."}}
  - {"op": "add_node", "id": "REQ-014-237", "type": "Rule", "owner_fr": "FR-014", "title": "Recurring failures retried 3 times; no partial report emailed", "attrs": {"statement": "Recurring failures: a failed run is retried up to 3 times at 30-minute intervals; after the final failure the run shows as Failed in Report History with a manual retry action. No partial report is emailed.", "rationale": "PRD line 701. Screen 6 Business Rules."}}
  - {"op": "add_node", "id": "REQ-014-238", "type": "Rule", "owner_fr": "FR-014", "title": "Recurring configurations can be edited, paused, resumed or deleted", "attrs": {"statement": "Recurring management: providers can edit, pause, resume, or delete a recurring configuration; edits apply from the next run. Recipients who are deactivated or lose permission are dropped automatically at the next run.", "rationale": "PRD line 702. Screen 6 Business Rules."}}
  - {"op": "add_node", "id": "REQ-014-239", "type": "Rule", "owner_fr": "FR-014", "title": "PDF and CSV state definitions, sample size, currency, FX basis and data-as-of", "attrs": {"statement": "PDF and CSV MUST use the same counting units, cohorts, cutoff, accepted-price eligibility, and financial deduplication as the included screens. State the metric definition, sample size, reporting currency, FX basis, and data-as-of time. For detailed quote/acceptance rows, retain authorized inquiry/provider IDs, parent/option/date-price/subquote IDs, AcceptanceEvent and booking IDs where present, accepted aggregate versions, and immutable price/currency provenance; unaccepted parent rows have no accepted amount or accepted-choice IDs.", "rationale": "PRD line 703. Screen 6 Business Rules."}}
  - {"op": "add_node", "id": "REQ-014-240", "type": "Rule", "owner_fr": "FR-014", "title": "Report History Tab 1 Generated Reports", "attrs": {"statement": "Tab 1 — Generated Reports (reports generated in the last 7 days, newest first, 20 per page): Generated at: Timestamp; Report type: Label; Screens included: Text list; Period covered: Date range; Trigger: Label; Status: Badge; Expires on: Date; Actions: Buttons", "rationale": "PRD lines 709, 713-720."}}
  - {"op": "add_node", "id": "REQ-014-241", "type": "Rule", "owner_fr": "FR-014", "title": "Report History Tab 2 Recurring Exports", "attrs": {"statement": "Tab 2 — Recurring Exports (all of the provider's recurring configurations, maximum 5 active): Frequency: Label; Report type and screens: Text; Recipients: Count + tooltip list; Next run: Timestamp; Last run status: Badge; Status: Badge; Actions: Buttons", "rationale": "PRD lines 722, 726-732."}}
  - {"op": "add_node", "id": "REQ-014-242", "type": "Rule", "owner_fr": "FR-014", "title": "Only users permitted for every widget see or download a report", "attrs": {"statement": "Only users permitted to view every widget in a report can see or download it (Rules 15A/15B); downloads use the same secure-link mechanism as email delivery.", "rationale": "PRD line 734. Report History rules."}}
  - {"op": "add_node", "id": "REQ-014-243", "type": "Rule", "owner_fr": "FR-014", "title": "Resuming a paused configuration does not back-fill runs", "attrs": {"statement": "Resuming a paused configuration does not back-fill runs missed while it was paused.", "rationale": "PRD line 735. Report History rules."}}
  - {"op": "add_node", "id": "REQ-014-244", "type": "Rule", "owner_fr": "FR-014", "title": "Report History empty states", "attrs": {"statement": "Empty states: \"No reports generated in the last 7 days\" and \"No recurring exports set up\".", "rationale": "PRD line 736. Report History rules."}}
  # --- Fields (part 2); calculated fields follow the Rule that computes them
