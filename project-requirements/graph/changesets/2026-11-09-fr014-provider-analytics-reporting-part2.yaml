  - {"op": "add_node", "id": "REQ-014-186", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 1 B1 four-stage booking funnel", "attrs": {"statement": "Chart: Funnel chart; Stages: Inquiries → Quoted → Accepted → Confirmed booking; Each stage: Count + Step % (stage ÷ previous stage); Footer: Overall booking conversion = Confirmed bookings ÷ Inquiries; Confirmed booking = successful deposit or first installment charge confirms the FR-006 Booking. `In Progress` means procedure started via FR-010 and is not the payment-confirmation label. Count distinct inquiry/provider pairs in a single inquiry cohort cumulatively through each reached stage, per Analytics Counting & Time Basis; multiple parent quotes and subquotes do not multiply the funnel. Drill-down: click stage → filtered Inquiries list", "rationale": "PRD lines 179-185."}}
  - {"op": "add_node", "id": "REQ-014-187", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 1 B2 TTFQ vs SLA bullet chart", "attrs": {"statement": "Chart: Bullet chart (p50 + p90, SLA as target marker); Axis: 0 → max(3×SLA, 1.2×p90), units = minutes (render h:m); Color: Green/Amber/Red per TTFQ formula above; Drill-down: click → Inquiries list grouped by coordinator", "rationale": "PRD lines 189-192."}}
  - {"op": "add_node", "id": "REQ-014-188", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 1 B3 Booking Intensity Index", "attrs": {"statement": "Chart: Calendar heatmap (6 rows × 7 cols, Mon→Sun); Colored metric: Intensity Index = `(Bookings_on_day ÷ MonthlyDailyAvg_for_that_day's_month) × 100`; `Bookings_on_day` counts FR-006 Bookings whose appointment falls on that day and whose status is `Confirmed` or `In Progress`. Held bookings (`Accepted`), `Payment Window Expired` and `Cancelled` bookings never count, and no separate held figure is shown. The monthly average uses the same status filter. Color scale: ≤50% Cool · 50–90% Below avg · 90–110% Neutral · 110–150% Above avg · >150% Hot; Cell tooltip: `Confirmed bookings: N • Monthly avg: m/day • Index: X%`; Drill-down: click cell → Schedule day view; Baseline priority: 12-month same-month avg → current MTD → rolling 90-day; Index clamped 0–300% for coloring; actual value in tooltip", "rationale": "PRD lines 196-203. Intensity formula fixed in codebase (line 1510); status filter restated by REQ-014-116 and Key Entity 2 (line 1789)."}}
  - {"op": "add_node", "id": "REQ-014-189", "type": "Rule", "owner_fr": "FR-014", "title": "Screen 1 B4 Patient Location donut", "attrs": {"statement": "Chart: Donut (top 8 countries by inquiry share + Other); Center: total Inquiries in range; Slice labels: `CC (ISO-2) • %`; Slice border: thin/neutral <20% confirmed booking rate · medium/amber 20–40% · thick/green >40%; Tooltip: `Country • Inquiries: N • Confirmed bookings: B • Confirmed booking rate: R%`; Confirmed bookings and the confirmed booking rate use the inquiry cohort and Confirmed booking stage defined in Analytics Counting & Time Basis (rate = Confirmed bookings ÷ Inquiries). Drill-down: click slice → filtered Inquiries list", "rationale": "PRD lines 207-213."}}
