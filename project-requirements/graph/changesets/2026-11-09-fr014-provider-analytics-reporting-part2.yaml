  - {"op": "add_node", "id": "REQ-014-184", "type": "Rule", "owner_fr": "FR-014", "title": "TTFQ formula: first send minus distribution per provider/inquiry", "attrs": {"statement": "TTFQ formula: `Parent Quote.first_sent_at` of the provider's earliest parent quote for the inquiry `− inquiry_providers.distributed_at` per `(providerId, inquiryId)` (elapsed wall time from the inquiry's distribution to that provider; display in provider timezone). This is the same clock as the FR-020/FR-030 `inquiry.ttfq_sla_breached` alert, so a provider who receives an inquiry later (for example after an FR-003 exclusive-provider decline releases it to normal distribution) is not penalised for time before distribution. Missing `distributed_at` yields no TTFQ observation for that pair, not a fallback to `inquiry.created_at`. `first_sent_at` is set by FR-004 on the parent quote's first send; a re-send or new version never changes it. Draft creation, option/date-price creation, later parent quotes, edits, and resends do not reset the first-response timestamp. Exclude auto-acks; calls/messages do not stop the clock.", "rationale": "PRD line 158. Fixed in codebase (line 1509). Shares its clock with the SLA-breach alert."}}
