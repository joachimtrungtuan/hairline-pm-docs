  - {"op": "add_node", "id": "REQ-035-023", "type": "Rule", "owner_fr": "FR-035", "title": "Internal admin notes hidden from patients", "attrs": {"statement": "System MUST hide internal admin notes from patient view — only messages explicitly sent to the patient are visible (FR-034 REQ-034-013, REQ-034-046)", "rationale": "Restated by Privacy Rule 2 (line 462) and Screen 4 rules (414)."}}
