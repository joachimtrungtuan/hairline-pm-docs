  - {"op": "add_node", "id": "REQ-035-005", "type": "Rule", "owner_fr": "FR-035", "title": "In-app video playback with controls", "attrs": {"statement": "System MUST support in-app video playback for video tutorials with play/pause, seek, and fullscreen controls", "rationale": "Video Detail has an embedded player with play/pause, seek and fullscreen that streams the video, a title, a rich-text description and an optional transcript link that opens a scrollable text view (321-324). The video list shows thumbnail, title and duration (316-320). Technology assumption: the app supports in-app video playback (592)."}}
  - {"op": "add_node", "id": "REQ-035-006", "type": "Rule", "owner_fr": "FR-035", "title": "In-app resource preview and download", "attrs": {"statement": "System MUST support in-app file preview and download for resource documents", "rationale": "Resource Detail previews at least the first page in-app; the Download button shows a progress indicator and saves the file to the device downloads folder (308-309). The resource list shows title, file type icon and size (302-306). Technology assumption: the app supports in-app PDF and document preview (593)."}}
  - {"op": "add_node", "id": "REQ-035-007", "type": "Rule", "owner_fr": "FR-035", "title": "Was this helpful? binary feedback, aggregated anonymously", "attrs": {"statement": "System MUST provide \"Was this helpful?\" binary feedback on all content types, with feedback aggregated anonymously at the content level (FR-033 Privacy Rule 2)", "rationale": "Restated by Privacy Rule 1 (line 461), Screen 2 rules (339) and Main Flow steps 9-10 (122). Tapping Yes or No shows the confirmation Thank you for your feedback (294); admin dashboards show total Yes and No counts per content item; FAQ, resource and video feedback behave the same (281, 310, 325). Near-duplicate of REQ-035-027, kept as both are PRD lines."}}
  - {"op": "add_node", "id": "REQ-035-008", "type": "Rule", "owner_fr": "FR-035", "title": "Related content suggestions across content types", "attrs": {"statement": "System MUST display related content suggestions (admin-configured via FR-033) that may cross content types", "rationale": "Screen 2 Article Detail: 2-4 related items suggested by the system, admin-configured via FR-033, tappable (296); relationship may cross content types, for example an article linking to a video tutorial (342)."}}
  - {"op": "add_node", "id": "REQ-035-009", "type": "Rule", "owner_fr": "FR-035", "title": "Contact Support form fields and limits", "attrs": {"statement": "System MUST allow patients to submit support requests via Contact Support form with title (10-200 chars), category, description (20-5000 chars), priority, and optional file attachments (FR-034 REQ-034-020, REQ-034-030, REQ-034-031, REQ-034-035)", "rationale": "Screen 5 fields (430-434): title has no auto-generation; priority and category are pickers; attachments are optional. Form validation limits are fixed in the codebase (483). Creating a ticket follows FR-034 Workflow A5 (249, 372)."}}
  - {"op": "add_node", "id": "REQ-035-010", "type": "Rule", "owner_fr": "FR-035", "title": "Cases auto-created with Patient App source and Patient submitter", "attrs": {"statement": "System MUST automatically create support cases in FR-034 with Ticket Source = \"Patient App\" and Submitter Type = \"Patient\" on form submission (FR-034 REQ-034-021, REQ-034-024)", "rationale": "Restated by General Module Rule 3 (line 455), Screen 1 rules (249), Screen 3 rules (372), A3 step 5 (161) and the Submit Button (435)."}}
  - {"op": "add_node", "id": "REQ-035-011", "type": "Rule", "owner_fr": "FR-035", "title": "Cases linked to the patient by session", "attrs": {"statement": "System MUST link patient-submitted cases to patient records using logged-in patient session (FR-034 REQ-034-024)", "rationale": "A3 step 6 (162) and the Submit Button (435: links to the patient record via session). Patient session provides the patient ID (Dependencies FR-001, 543-545)."}}
  - {"op": "add_node", "id": "REQ-035-012", "type": "Rule", "owner_fr": "FR-035", "title": "Eight patient-visible support categories", "attrs": {"statement": "System MUST display 8 patient-visible categories: Technical Issue, Account Access, Payment Question, Booking Issue, General Inquiry, Feature Request, Bug Report, Feedback (FR-034 REQ-034-030; \"Provider Support\" and \"Patient Support\" excluded as admin-internal)", "rationale": "Provider Support and Patient Support are admin-internal categories and are not shown to patients (372, 431). Business assumption: eight categories are sufficient for launch (600). Category visibility and fixed-list wording are in dispute, see REQ-035-076."}}
  - {"op": "add_node", "id": "REQ-035-013", "type": "Rule", "owner_fr": "FR-035", "title": "Attachment size, count and formats", "attrs": {"statement": "System MUST support file attachments up to 10 MB per file, maximum 5 files per case, formats: JPG, PNG, PDF, DOC, DOCX (FR-034 REQ-034-036/037)", "rationale": "Fixed in the codebase (482). Screen 5 Attachments (434: thumbnail preview with remove option) and Screen 4 Attachment Button (403) carry the same limits. Per-submission versus per-case counting is open, see REQ-035-032."}}
  - {"op": "add_node", "id": "REQ-035-014", "type": "Rule", "owner_fr": "FR-035", "title": "Patient uploads virus-scanned before acceptance", "attrs": {"statement": "System MUST virus-scan all patient-uploaded files before acceptance", "rationale": "Restated by Privacy Rule 4 (line 464), Screen 5 Attachments (434) and the Virus Scanning dependency (558-561). Mechanics: REQ-035-058 to REQ-035-060."}}
  - {"op": "add_node", "id": "REQ-035-015", "type": "Rule", "owner_fr": "FR-035", "title": "My Support Tickets list content", "attrs": {"statement": "System MUST display patient's submitted support tickets with case ID, title, status (Open/In Progress/Resolved/Closed), priority, submitted date, and last updated timestamp", "rationale": "Screen 3 Ticket Card (359-365): case ID in subdued style, bold title truncated to 1-2 lines, colour-coded status badge (Open blue, In Progress amber, Resolved green, Closed grey), colour-coded priority badge (Low grey, Medium blue, High orange, Urgent red), short submitted date, relative last-updated time. Main A4 step 2 (175)."}}
  - {"op": "add_node", "id": "REQ-035-016", "type": "Rule", "owner_fr": "FR-035", "title": "Ticket filter by status", "attrs": {"statement": "System MUST support ticket filtering by status: All, Open, In Progress, Resolved, Closed", "rationale": "Screen 3 Filter Chips (358) and rules (371): All is the default; Resolved and Closed are separate chips because Resolved cases still accept patient replies during the 7-day auto-closure window while Closed cases are read-only (FR-034 REQ-034-003). All shows every status."}}
  - {"op": "add_node", "id": "REQ-035-017", "type": "Rule", "owner_fr": "FR-035", "title": "Full communication thread with sender labels", "attrs": {"statement": "System MUST display full communication thread for each ticket showing all messages from patient and admin with sender labels and timestamps", "rationale": "Screen 4 Communication Thread (397-400): chronological, scrollable, newest message at the bottom, sender label You for patient messages and Support Team for admin replies, plain-text body, relative or absolute timestamp; attachments are viewable full-size or downloadable (401). Empty thread shows Your case has been submitted. Our team will respond within 24 hours. (406)."}}
  - {"op": "add_node", "id": "REQ-035-018", "type": "Rule", "owner_fr": "FR-035", "title": "Reply allowed unless the case is Closed", "attrs": {"statement": "System MUST allow patients to reply to admin messages when case is Open, In Progress, or Resolved (FR-034 REQ-034-026); reply input hidden only for Closed cases", "rationale": "Restated by Screen 4 Reply Input Field (402), Screen 4 rules (410) and Send Reply Button (404: hidden for Closed cases). Critical for healthcare: patients must be able to report that a resolved issue has recurred (410)."}}
  - {"op": "add_node", "id": "REQ-035-019", "type": "Rule", "owner_fr": "FR-035", "title": "Reply to a Resolved case reopens it", "attrs": {"statement": "System MUST automatically reopen Resolved cases to Open status when patient sends a reply", "rationale": "Restated by Screen 4 Reply Input Field (402), rules (411) and A5 steps 4-6 (192-194): the patient sees the status badge update immediately and the admin receives support.case_user_reply."}}
  - {"op": "add_node", "id": "REQ-035-020", "type": "Rule", "owner_fr": "FR-035", "title": "Auto-closure countdown on Resolved tickets", "attrs": {"statement": "System MUST display auto-closure countdown on Resolved tickets showing remaining days before automatic closure (FR-034 REQ-034-061)", "rationale": "Screen 4 Auto-Closure Countdown (394): text This case will close in X days if no further reply, shown only when status is Resolved, hidden for Open, In Progress and Closed; period is configurable 3, 7 or 14 days, default 7 (FR-034 REQ-034-061). A5 step 2 (190). Governed by SET-support-case-auto-closure-period."}}
