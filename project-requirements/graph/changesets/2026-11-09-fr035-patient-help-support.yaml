  - {"op": "add_node", "id": "REQ-035-033", "type": "Rule", "owner_fr": "FR-035", "title": "Entry points to the patient Help Center", "attrs": {"statement": "Patient navigates to \"Help & Support\" from Settings screen (FR-026 / P01.2-S1); in-app deep link from other screens (e.g., contextual help links from booking, payment, or aftercare screens); push notification tap (e.g., tapping a case status change notification navigates to Ticket Detail).", "rationale": "Entry Points (lines 96-98). Also Multi-Tenant Breakdown (48) and Dependencies FR-026 (547-549: the Settings screen has a Help & Support menu item linking to Screen 1)."}}
