  - {"op": "add_node", "id": "REQ-035-026", "type": "Rule", "owner_fr": "FR-035", "title": "Encryption in transit and at rest", "attrs": {"statement": "System MUST encrypt all patient data in transit (TLS 1.3) and at rest", "rationale": "Security Considerations Encryption (641) and Privacy Rule 4 (464: file attachments are encrypted at rest)."}}
