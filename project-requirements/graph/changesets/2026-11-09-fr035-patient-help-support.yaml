  - {"op": "add_node", "id": "REQ-035-036", "type": "Rule", "owner_fr": "FR-035", "title": "Help search covers published patient-audience content, ranked by relevance", "attrs": {"statement": "Search covers all published patient-audience articles and FAQs; results are ranked by relevance; if no results match, show a \"Contact Support\" prompt. Full-text search is required for P1 and must not be downgraded to browse-only behavior.", "rationale": "Screen 1 rules (247), Screen 1 Search Bar (236), Screen 2 rules (338), Alternative Flow A1 (134-136). Scope of searched content is described differently on Screen 1 (FAQ and articles) and Screen 2 and A1 (all four content types): see product owner decision list."}}
  - {"op": "add_node", "id": "REQ-035-037", "type": "Rule", "owner_fr": "FR-035", "title": "Help search suggests results while typing", "attrs": {"statement": "Full-text search, relevance ordering, and inline suggestions are required for the patient Help Center MVP scope.", "rationale": "Implementation Notes Search (611), promoted. Screen 2 Search Bar (264): auto-suggests results while typing, scoped to the patient audience, required for P1. Results appear inline or on a separate results screen (236)."}}
  - {"op": "add_node", "id": "REQ-035-038", "type": "Rule", "owner_fr": "FR-035", "title": "Contact Support offered when help does not answer", "attrs": {"statement": "Patient taps No on Was this helpful? or sees no search results; System displays Still need help? Contact Support CTA; Patient taps Contact Support; System displays Contact Support form (Screen 5).", "rationale": "Alternative Flow A2 (141-148), Screen 2 Article Detail Contact Support CTA (295: conditional on tapping No), General Content List No Results State (331: No results for '[query]'. Try different keywords or Contact Support.) and Screen 2 rules (338: empty search results must always surface a Contact Support path)."}}
  - {"op": "add_node", "id": "REQ-035-039", "type": "Rule", "owner_fr": "FR-035", "title": "Emergency Contact Section always visible on the Hub", "attrs": {"statement": "Emergency contact section is a healthcare UX best practice for post-procedure patient safety; it must always be visible — it cannot be hidden or require scrolling past it. The section must remain visible regardless of scroll position (sticky or always rendered); emergency phone is read-only with tap-to-call on mobile and emergency email is read-only with tap-to-compose on mobile.", "rationale": "Screen 1 rules (248, marked [Design Addition: not in FR-033/FR-034]) and Screen 1 fields Emergency Contact Section, Emergency Phone, Emergency Email (240-242). Main Flow step 2 (114) lists the section on the Hub."}}
  - {"op": "add_node", "id": "REQ-035-040", "type": "Rule", "owner_fr": "FR-035", "title": "Emergency phone and email configured by admin", "attrs": {"statement": "Emergency phone and email values should be configurable by admin via FR-026 (App Settings) or a future dedicated FR.", "rationale": "Screen 1 rules (248), Admin Editability (474: configurable via FR-026) and Business Process Assumption 3 (599: values are configured by admin before FR-035 goes live). Owner of the two settings is FR-026 as the PRD names it; wording allows a future dedicated FR, see product owner decision list."}}
  - {"op": "add_node", "id": "REQ-035-041", "type": "Rule", "owner_fr": "FR-035", "title": "My Support Tickets badge counts open and in-progress tickets", "attrs": {"statement": "\"My Support Tickets\" badge count reflects open + in-progress tickets only; hidden when count is 0", "rationale": "Screen 1 rules (250) and My Support Tickets row (239: badge shows count of open and in-progress tickets)."}}
  - {"op": "add_node", "id": "REQ-035-042", "type": "Rule", "owner_fr": "FR-035", "title": "Four fixed content types; visibility toggle only; no Service Status for patients", "attrs": {"statement": "4 content types for patient platform: FAQs, Articles, Resources, Videos (FR-033 REQ-033-003); admin can toggle content type visibility in FR-033 but cannot add new content types for patients; no Service Status for patients.", "rationale": "Fixed in Codebase (479), Configurable with Restrictions (488), Screen 2 Content Type Cards (265) and Out of Scope (88: Service Status page is a provider-only feature per FR-033)."}}
  - {"op": "add_node", "id": "REQ-035-043", "type": "Rule", "owner_fr": "FR-035", "title": "Empty content type shown greyed out with an empty-state message", "attrs": {"statement": "Content type card is shown but greyed out / disabled with label \"No content available yet\"; tapping shows empty state message \"No [content type] available yet. Check back later or Contact Support.\" Item count badge is hidden if count is 0.", "rationale": "Screen 2 Empty Content Type State and Item Count Badge (268-269), General Content List Empty Content State (332) and Edge Cases (736: first launch before admin populates content)."}}
  - {"op": "add_node", "id": "REQ-035-044", "type": "Rule", "owner_fr": "FR-035", "title": "Featured / Popular Articles shortlist (design addition)", "attrs": {"statement": "Featured / Popular Articles [Design Addition]: curated shortlist of popular or featured articles, up to 5 items; not defined in FR-033; requires admin curation mechanism or auto-generation based on view analytics (FR-033 REQ-033-018).", "rationale": "Screen 2 field Featured / Popular Articles (270), optional (Required: No). The mechanism (curated or view-analytics) is not decided: see product owner decision list."}}
  - {"op": "add_node", "id": "REQ-035-045", "type": "Rule", "owner_fr": "FR-035", "title": "Help Center unavailable: cached content or retry message", "attrs": {"statement": "When Help Center content is unavailable (API down), display cached content if available or show \"Help Center temporarily unavailable\" with a retry option", "rationale": "Screen 2 rules (343), Content Unavailable State (271: Help Center temporarily unavailable. Please try again later., retry button) and Alternative Flow B2 (212-219: patient may navigate to Contact Support as fallback). Implementation Notes Caching (609) and Integration 1 error handling (618); Technology Assumption 2 (591: cached content available offline where feasible); Media Storage failure handling (556)."}}
  - {"op": "add_node", "id": "REQ-035-046", "type": "Rule", "owner_fr": "FR-035", "title": "Tickets ordered by latest activity", "attrs": {"statement": "Tickets are ordered by most recently updated (newest activity at top) within each filter tab", "rationale": "Screen 3 rules (370). Last Updated uses relative format such as 2h ago or Yesterday (365)."}}
  - {"op": "add_node", "id": "REQ-035-047", "type": "Rule", "owner_fr": "FR-035", "title": "Ticket cards always open the full thread", "attrs": {"statement": "Ticket cards are always tappable regardless of status — patients can view the full thread even for Closed cases", "rationale": "Screen 3 rules (374) and Ticket Card (359)."}}
  - {"op": "add_node", "id": "REQ-035-048", "type": "Rule", "owner_fr": "FR-035", "title": "Resolved ticket cards show an auto-closes indicator", "attrs": {"statement": "Resolved cases display a subtle \"Auto-closes in X days\" indicator to set expectations about the closure window (FR-034 REQ-034-061)", "rationale": "Screen 3 rules (375)."}}
  - {"op": "add_node", "id": "REQ-035-049", "type": "Rule", "owner_fr": "FR-035", "title": "Submit stays disabled until required fields are valid", "attrs": {"statement": "All fields except Attachments are mandatory; the Submit button remains disabled until Title (>= 10 chars), Category, Description (>= 20 chars), and Priority are all valid", "rationale": "Screen 5 rules (440) and Submit Button (435: disabled until all required fields pass validation). Conflicts with Alternative Flow B1 (REQ-035-050): see product owner decision list."}}
  - {"op": "add_node", "id": "REQ-035-050", "type": "Rule", "owner_fr": "FR-035", "title": "Invalid fields highlighted inline on Submit", "attrs": {"statement": "Patient taps Submit on Contact Support form with incomplete data; System validates required fields: title (min 10 chars), category, description (min 20 chars), priority; System highlights invalid fields with inline error messages; Patient corrects validation errors and resubmits.", "rationale": "Alternative Flow B1 (198-208). Cannot be reached when Submit is disabled (REQ-035-049): both kept, see product owner decision list."}}
  - {"op": "add_node", "id": "REQ-035-051", "type": "Rule", "owner_fr": "FR-035", "title": "Priority picker default Medium with self-triage descriptions", "attrs": {"statement": "Priority Picker options: Low, Medium, High, Urgent; default: Medium. Brief inline descriptions help patients self-triage: Low = \"General question\", Medium = \"Something isn't working right\", High = \"Blocking my care or booking\", Urgent = \"Critical issue needing immediate attention\".", "rationale": "Screen 5 Priority Picker (433) and rules (444: patients in distress tend to over-select Urgent without guidance, which degrades response quality for truly urgent cases)."}}
  - {"op": "add_node", "id": "REQ-035-052", "type": "Rule", "owner_fr": "FR-035", "title": "Category inline descriptions (design addition)", "attrs": {"statement": "Brief inline description per category to help patients select correctly: Feature Request = \"Suggest a new feature or improvement\", Bug Report = \"Report something that is broken or not working as expected\", Feedback = \"Share general feedback about your experience\".", "rationale": "Screen 5 Category Picker (431) and rules (445, marked [Design Addition]: all three appear in FR-034 REQ-034-030 without patient-facing guidance)."}}
  - {"op": "add_node", "id": "REQ-035-053", "type": "Rule", "owner_fr": "FR-035", "title": "Category selection drives admin routing", "attrs": {"statement": "Category selection drives downstream admin routing — this is transparent to the patient but important for response time", "rationale": "Screen 5 rules (443)."}}
  - {"op": "add_node", "id": "REQ-035-054", "type": "Rule", "owner_fr": "FR-035", "title": "Submission confirmation shows the case ID and 24-hour message", "attrs": {"statement": "Upon successful submission, the system displays a confirmation screen showing the assigned Case ID (CASE-YYYY-#####) and the message \"We will respond within 24 hours\" (FR-034 SC-003), then navigates to My Support Tickets (Screen 3)", "rationale": "Screen 5 rules (441), Alternative Flow A3 steps 8-9 (164-165) and Screen 3 Create New Ticket Button (357: confirmation then return to the ticket list)."}}
  - {"op": "add_node", "id": "REQ-035-055", "type": "Rule", "owner_fr": "FR-035", "title": "Confirmation email with the case reference number", "attrs": {"statement": "Patient receives a confirmation email with the case reference number upon submission (FR-020, FR-034 A5 step 11)", "rationale": "Screen 3 rules (373), Alternative Flow A3 step 7 (163) and Screen 5 Submit Button (435). The PRD names no event for this email."}}
  - {"op": "add_node", "id": "REQ-035-056", "type": "Rule", "owner_fr": "FR-035", "title": "Case ID format CASE-YYYY-#####", "attrs": {"statement": "Case ID format: CASE-YYYY-##### (fixed in the codebase, not editable by admin)", "rationale": "Fixed in Codebase (481), Screen 3 Case ID (360), Screen 4 Case ID (389) and A3 step 5 (161)."}}
  - {"op": "add_node", "id": "REQ-035-057", "type": "Rule", "owner_fr": "FR-035", "title": "Discard confirmation on leaving the form", "attrs": {"statement": "Back Navigation prompts \"Discard draft?\" confirmation if the form has unsaved input; Cancel / Discard prompts \"Discard this request?\" if any field has input; no data saved on cancel.", "rationale": "Screen 5 Back Navigation (429) and Cancel / Discard (436)."}}
  - {"op": "add_node", "id": "REQ-035-058", "type": "Rule", "owner_fr": "FR-035", "title": "Attachments validated on the device and on the server", "attrs": {"statement": "File uploads are validated client-side (format + size) before upload and server-side (virus scan + format whitelist) before acceptance (FR-034 REQ-034-036/037)", "rationale": "Screen 5 rules (442)."}}
  - {"op": "add_node", "id": "REQ-035-059", "type": "Rule", "owner_fr": "FR-035", "title": "Failed virus scan rejects the file with a generic message", "attrs": {"statement": "A file that fails virus scanning is rejected with the message: \"This file could not be attached. Please try a different file.\" No details about the scan failure are exposed to the patient.", "rationale": "Edge Cases (735)."}}
  - {"op": "add_node", "id": "REQ-035-060", "type": "Rule", "owner_fr": "FR-035", "title": "Virus scanning service failure: quarantine and notify admin", "attrs": {"statement": "Virus Scanning Service failure handling: quarantine uploads and notify admin; do not attach files to case until scan completes.", "rationale": "External Dependencies (558-561). Whether this covers an infected file, a scanner outage, or both is not stated; REQ-035-059 covers the rejection message: see product owner decision list."}}
  - {"op": "add_node", "id": "REQ-035-061", "type": "Rule", "owner_fr": "FR-035", "title": "Media storage failure: uploads queued and patient told of delay", "attrs": {"statement": "Media Storage Service failure handling: for file uploads, queue for retry and notify patient of delay.", "rationale": "External Dependencies (553-556)."}}
  - {"op": "add_node", "id": "REQ-035-062", "type": "Rule", "owner_fr": "FR-035", "title": "Support request submitted offline is queued", "attrs": {"statement": "A support request submitted while offline is queued locally and submitted when connectivity is restored, with clear indication to the patient.", "rationale": "Edge Cases (734) and Integration 2 error handling (623: queue submission locally if offline; retry with exponential backoff on 5xx errors)."}}
  - {"op": "add_node", "id": "REQ-035-063", "type": "Rule", "owner_fr": "FR-035", "title": "Rate limit on ticket submission and replies", "attrs": {"statement": "Rate limiting on ticket submission and reply endpoints (max 10 submissions/hour/patient).", "rationale": "Security Considerations Threat mitigation (643), promoted. Whether replies count toward the same 10 per hour is not stated."}}
  - {"op": "add_node", "id": "REQ-035-064", "type": "Rule", "owner_fr": "FR-035", "title": "Notification failures never block case operations", "attrs": {"statement": "Notification delivery failures do not block case operations; retry asynchronously.", "rationale": "Integration 3 error handling (628), promoted."}}
  - {"op": "add_node", "id": "REQ-035-065", "type": "Rule", "owner_fr": "FR-035", "title": "Patient reply joins the thread and notifies the assigned admin", "attrs": {"statement": "Patient replies are added to the shared communication thread and the assigned admin receives a notification via FR-020 (support.case_user_reply event)", "rationale": "Screen 4 rules (413), A4 steps 6-7 (179-181) and Send Reply Button (404)."}}
  - {"op": "add_node", "id": "REQ-035-066", "type": "Rule", "owner_fr": "FR-035", "title": "Send Reply enabled only with text", "attrs": {"statement": "Send Reply Button is enabled when reply input is non-empty; hidden for Closed cases.", "rationale": "Screen 4 Send Reply Button (404)."}}
  - {"op": "add_node", "id": "REQ-035-067", "type": "Rule", "owner_fr": "FR-035", "title": "Resolved cases auto-close after the closure period", "attrs": {"statement": "Cases auto-close after 7 days in Resolved status if no patient reply (configurable: 3/7/14 days per FR-034 REQ-034-061/062); the patient receives a support.case_closed notification.", "rationale": "Screen 4 rules (412), Admin Editability (473: configured via FR-034), User Story 4 scenario 2 (711) and Shared Services (70). The countdown is visible in Ticket Detail to set expectations. Governed by SET-support-case-auto-closure-period."}}
  - {"op": "add_node", "id": "REQ-035-068", "type": "Rule", "owner_fr": "FR-035", "title": "Closure while the patient is viewing updates in real time", "attrs": {"statement": "When the auto-closure countdown reaches 0 while the patient is actively viewing the ticket, the status should update to Closed in real-time and the reply input should be replaced with the Closed Case Banner.", "rationale": "Edge Cases (738)."}}
  - {"op": "add_node", "id": "REQ-035-069", "type": "Rule", "owner_fr": "FR-035", "title": "Closed Case Banner offers new ticket or reopen request", "attrs": {"statement": "Closed Case Banner: \"This case is closed. If you still need help, you can create a new ticket or contact support to request this case be reopened.\" with \"Create New Ticket\" link to Screen 5 and \"Contact Support\" link (email/phone from Emergency Contact Section in Screen 1). Both paths: new ticket creation (in-app) and case reopening via admin (FR-034 Workflow B3, REQ-034-063, REQ-034-017).", "rationale": "Screen 4 Closed Case Banner (405) and User Story 4 scenario 3 (712). The reply input is hidden for Closed cases (REQ-035-018)."}}
  - {"op": "add_node", "id": "REQ-035-070", "type": "Rule", "owner_fr": "FR-035", "title": "Resolution summary emailed when the case becomes Resolved", "attrs": {"statement": "The resolution summary is also sent to the patient via email notification on status change to Resolved.", "rationale": "Screen 4 Resolution Summary (395)."}}
  - {"op": "add_node", "id": "REQ-035-071", "type": "Rule", "owner_fr": "FR-035", "title": "Support case lifecycle is fixed", "attrs": {"statement": "Support case lifecycle workflow: Open -> In Progress -> Resolved -> Closed (fixed in the codebase, not editable by admin).", "rationale": "Fixed in Codebase (480) and Screen 3 filter chips (358)."}}
  - {"op": "add_node", "id": "REQ-035-072", "type": "Rule", "owner_fr": "FR-035", "title": "Support case data visible only to the patient and authorized admin staff", "attrs": {"statement": "Patient support case data is accessible only to the submitting patient and authorized admin staff", "rationale": "Data & Privacy Privacy Rule 3 (463). Complements REQ-035-025."}}
  - {"op": "add_node", "id": "REQ-035-073", "type": "Rule", "owner_fr": "FR-035", "title": "Support case lifecycle events audited in FR-034", "attrs": {"statement": "All support case lifecycle events (creation, status changes, messages, attachments) are logged with timestamp and user ID in FR-034 case timeline", "rationale": "Audit Rule (465) and Security Considerations Audit trail (642: timestamp, patient ID and action type, managed by FR-034)."}}
  - {"op": "add_node", "id": "REQ-035-074", "type": "Rule", "owner_fr": "FR-035", "title": "Patient support data follows HIPAA and GDPR requirements", "attrs": {"statement": "Patient support data handling follows the same HIPAA/GDPR compliance requirements as all patient data in the platform", "rationale": "Security Considerations Compliance (644), promoted."}}
  - {"op": "add_node", "id": "REQ-035-075", "type": "Rule", "owner_fr": "FR-035", "title": "Account deletion with active support cases", "attrs": {"statement": "Open/In Progress cases should be flagged for admin review; patient identity is anonymized per data retention policy (FR-023).", "rationale": "Edge Cases (737): a patient deleting their account while support cases are active. Applies at the patient Deleted stage."}}
  - {"op": "add_node", "id": "REQ-035-076", "type": "Rule", "owner_fr": "FR-035", "title": "Patient-visible support categories are a fixed list", "attrs": {"statement": "Patient-visible support categories (admin cannot add or remove categories from the fixed list but may update labels in future)", "rationale": "Configurable with Restrictions (487). Editable by Admin (475) says patient-facing category descriptions and category visibility are managed via FR-033, which sits uneasily with a fixed list and with FR-033 being the help content module: see product owner decision list. Business assumption 4 (600)."}}
  # --- Settings: emergency contact values are FR-026 (PRD line 474); the auto-closure period is FR-034 (PRD line 473)
  - {"op": "add_node", "id": "SET-support-emergency-contact-phone", "type": "Setting", "owner_fr": "FR-026", "title": "Support emergency contact phone number", "attrs": {"description": "Emergency phone number shown read-only with tap-to-call on the patient Help & Support Hub (FR-035 Screen 1). Admin-configurable via FR-026 (PRD line 474). No default: the PRD assumes admin sets it before go-live (line 599)."}}
  - {"op": "add_node", "id": "SET-support-emergency-contact-email", "type": "Setting", "owner_fr": "FR-026", "title": "Support emergency contact email address", "attrs": {"description": "Emergency email address shown read-only with tap-to-compose on the patient Help & Support Hub (FR-035 Screen 1). Admin-configurable via FR-026 (PRD line 474). No default: the PRD assumes admin sets it before go-live (line 599)."}}
  - {"op": "add_node", "id": "SET-support-case-auto-closure-period", "type": "Setting", "owner_fr": "FR-034", "title": "Support case auto-closure period", "attrs": {"description": "Days a Resolved support case waits for a patient reply before it closes automatically. Options 3, 7 or 14 days (FR-034 REQ-034-061/062; FR-035 lines 394, 412, 473).", "default": "7", "unit": "days"}}
  # --- Stub entity for the emergency contact values; owner FR-026 per the PRD (stub, fields shown by Screen 1 only)
  - {"op": "add_node", "id": "ENT-support-emergency-contact", "type": "Entity", "owner_fr": "FR-026", "title": "Support emergency contact", "attrs": {"description": "Emergency phone and email the patient app shows on the Help & Support Hub; admin-configurable via FR-026 App Settings (FR-035 lines 240-242, 474). Stub created during FR-035 migration with only the fields FR-035 shows. Not the patient personal emergency contact."}}
  # --- Fields on existing FR-033/FR-034 stubs that FR-035 Key Entities lists and the stubs lack; calculated_by points at a Rule above
  - {"op": "add_field", "id": "ENT-support-emergency-contact.phone", "entity_id": "ENT-support-emergency-contact", "name": "phone", "data_type": "text", "title": "Emergency phone", "owner_fr": "FR-026", "required": true}
  - {"op": "add_field", "id": "ENT-support-emergency-contact.email", "entity_id": "ENT-support-emergency-contact", "name": "email", "data_type": "text", "title": "Emergency email", "owner_fr": "FR-026", "required": true}
  - {"op": "add_field", "id": "ENT-help-centre-content.publish_status", "entity_id": "ENT-help-centre-content", "name": "publish_status", "data_type": "text", "title": "Publish status", "owner_fr": "FR-033", "required": false}
  - {"op": "add_field", "id": "ENT-help-centre-content.audience", "entity_id": "ENT-help-centre-content", "name": "audience", "data_type": "text", "title": "Audience", "owner_fr": "FR-033", "required": false}
  - {"op": "add_field", "id": "ENT-support-case.patient_id", "entity_id": "ENT-support-case", "name": "patient_id", "data_type": "id", "title": "Patient ID", "owner_fr": "FR-034", "required": false}
  - {"op": "add_field", "id": "ENT-support-case.assigned_admin_id", "entity_id": "ENT-support-case", "name": "assigned_admin_id", "data_type": "id", "title": "Assigned admin", "owner_fr": "FR-034", "required": false}
  - {"op": "add_field", "id": "ENT-support-case.auto_closure_deadline", "entity_id": "ENT-support-case", "name": "auto_closure_deadline", "data_type": "datetime", "title": "Auto-closure deadline", "owner_fr": "FR-034", "required": false, "calculated_by": "REQ-035-067"}
  - {"op": "add_enum_value", "field_id": "ENT-support-case-message.sender_type", "value": "patient", "label": "Patient"}
  # --- Events (FR-034 stubs, notification triggers named by FR-035 line 541); producer stage per PRD is unstated, see report
  - {"op": "add_node", "id": "EVT-support-case-status-changed", "type": "Event", "owner_fr": "FR-034", "title": "Support case status changed", "attrs": {"description": "`support.case_status_changed`: FR-034 triggers it and FR-020/S-03 notifies the patient by push and email (Open to In Progress status change). Stub created during FR-035 migration."}}
  - {"op": "add_node", "id": "EVT-support-case-resolved", "type": "Event", "owner_fr": "FR-034", "title": "Support case resolved", "attrs": {"description": "`support.case_resolved`: FR-034 triggers it and FR-020/S-03 notifies the patient by push and email (In Progress to Resolved; the email carries the resolution summary (FR-035 line 395)). Stub created during FR-035 migration."}}
  - {"op": "add_node", "id": "EVT-support-case-closed", "type": "Event", "owner_fr": "FR-034", "title": "Support case closed", "attrs": {"description": "`support.case_closed`: FR-034 triggers it and FR-020/S-03 notifies the patient by push and email (Resolved to Closed, including closure when the auto-closure period expires (FR-035 lines 70, 412)). Stub created during FR-035 migration."}}
  # --- Screens (patient mobile app); screens own no fields, controls and states are listed in each description
  - {"op": "add_node", "id": "SCR-035-01", "type": "Screen", "owner_fr": "FR-035", "title": "Help & Support Hub", "attrs": {"platform": "patient", "description": "Central entry point for help and support (PRD Screen 1). UI controls, not fields: Screen Title, Back Navigation, Search Bar, Browse Help Center link, Contact Support link, My Support Tickets link, Emergency Contact Section container."}}
  - {"op": "add_node", "id": "SCR-035-02", "type": "Screen", "owner_fr": "FR-035", "title": "Help Center Browser", "attrs": {"platform": "patient", "description": "Browse patient help content by type, search, and view FAQ, article, resource and video detail (PRD Screen 2). UI controls and states, not fields: Screen Title, Back Navigation, Search Bar, Content Type Cards group and icons, Article Subtype Filter chips, Article List, Resource List, Video List, Download Button, Contact Support CTA, Content Unavailable State, No Results State, Empty Content State, Empty Content Type State."}}
  - {"op": "add_node", "id": "SCR-035-03", "type": "Screen", "owner_fr": "FR-035", "title": "My Support Tickets", "attrs": {"platform": "patient", "description": "List of the patient support cases with filter chips (PRD Screen 3). UI controls and states, not fields: Screen Title, Back Navigation, Create New Ticket Button, Filter Chips, Ticket Card container, Empty State (No support tickets yet. Need help? Tap Create New Ticket.)."}}
  - {"op": "add_node", "id": "SCR-035-04", "type": "Screen", "owner_fr": "FR-035", "title": "Ticket Detail", "attrs": {"platform": "patient", "description": "Support case detail, thread and patient reply (PRD Screen 4). UI controls and states, not fields: Back Navigation, Communication Thread container, Reply Input Field, Attachment Button, Send Reply Button, Closed Case Banner, Empty Thread State."}}
  - {"op": "add_node", "id": "SCR-035-05", "type": "Screen", "owner_fr": "FR-035", "title": "Contact Support Form", "attrs": {"platform": "patient", "description": "Form to submit a support request or feedback; creates an FR-034 case (PRD Screen 5). UI controls, not fields: Screen Title, Back Navigation, Submit Button, Cancel / Discard. The confirmation screen after submission is part of this screen (PRD line 441)."}}
