  - {"op": "add_field", "id": "ENT-provider-earnings-summary.released_earnings", "entity_id": "ENT-provider-earnings-summary", "name": "released_earnings", "data_type": "money", "title": "Released earnings", "owner_fr": "FR-017", "calculated_by": "REQ-017-189", "attrs": {"description": "Net earnings whose funds are released and not yet paid."}}
  - {"op": "add_field", "id": "ENT-patient-invoice.final_payment_status", "entity_id": "ENT-patient-invoice", "name": "final_payment_status", "data_type": "enum", "title": "Final payment status", "owner_fr": "FR-017", "attrs": {"description": "Read from FR-007: Not Due, Due, Overdue. Overdue starts the day after the due date."}}
