  - {"op": "retire_enum_value", "field_id": "ENT-patient-invoice.payment_status", "value": "pending"}
  - {"op": "retire_enum_value", "field_id": "ENT-patient-invoice.payment_status", "value": "partial"}
  - {"op": "retire_enum_value", "field_id": "ENT-patient-invoice.payment_status", "value": "paid"}
  - {"op": "retire_enum_value", "field_id": "ENT-patient-invoice.payment_status", "value": "overdue"}
  - {"op": "retire_enum_value", "field_id": "ENT-patient-invoice.payment_status", "value": "at_risk"}
  - {"op": "update_node", "id": "REQ-017-001", "attrs": {"statement": "System MUST allow admins to view all patient invoices with filtering by Payment Status (Unpaid, Deposit only, Installments active, Full paid, Refunded), Final Payment Status (Not Due, Due, Overdue) and the At Risk flag"}}
  - {"op": "update_node", "id": "REQ-017-037", "title": "Treatment completion adds earnings as Pending release", "attrs": {"statement": "Treatment completion triggers provider payout eligibility calculation; eligible earnings are added to the provider's running earnings total as Pending release, and become Released when the booking's funds are released: the confirmation window ends with no open problem case, or an admin resolves the case (REQ-017-189)"}}
  - {"op": "update_node", "id": "REQ-017-039", "attrs": {"statement": "Stripe webhook events (`transfer.created`, `transfer.paid`, `transfer.failed`) trigger real-time status updates of Stripe Connect per-booking payouts and affiliate payouts, never of a settlement statement. `transfer.created` — confirms payout initiated; update status \"Pending\" → \"Processing\". `transfer.paid` — confirms provider/affiliate received funds; update status \"Processing\" → \"Paid\". `transfer.failed` — trigger retry logic and `payout.failed` notification event"}}
  - {"op": "update_node", "id": "REQ-017-040", "attrs": {"statement": "Stage 1 (earnings tracking): Provider sees per-treatment earnings accumulate in real time as treatments complete — this is always visible. Stage 2 (payout visibility): Provider sees a confirmed payout entry ONLY after the payout is confirmed: a Stripe Connect payout once its transfer is initiated, a manual-rail statement once the admin marks it as paid — providers do NOT see draft statements during the review window between the cutoff day and the payout day"}}
  - {"op": "update_node", "id": "REQ-017-042", "attrs": {"statement": "A failed Stripe Connect payout is marked \"Failed\" and the admin is notified: \"Payout failed for [Provider Name]\". After three failed attempts it is set to Manual Review Required. Invalid bank account: Admin contacts provider (A-10); provider updates bank details in FR-032 / PR-06 Billing Settings; admin retries the payout. Other Stripe error: Admin investigates error; resolves; retries transfer. A settlement statement never has a Failed state", "rationale": "Alternative Flow B4 and Release Rule 4: Failed belongs to a Stripe Connect per-booking payout, never to a settlement statement; three automatic attempts, then manual review (REQ-017-143, REQ-017-170, REQ-017-194)."}}
  - {"op": "update_node", "id": "REQ-017-050", "attrs": {"statement": "\"Outstanding Patient Invoices\" includes ONLY invoices of bookings whose FR-007 Payment Status is \"Unpaid\", \"Deposit only\" or \"Installments active\" (an unpaid balance remains); \"Overdue\" is read from the booking's Final Payment Status and \"At Risk\" is a separate flag, neither is a Payment Status"}}
  - {"op": "update_node", "id": "REQ-017-051", "title": "Overdue aging buckets from the day after the Due Date", "attrs": {"statement": "Overdue aging buckets count from the day after the invoice Due Date (the day the Final Payment Status becomes Overdue, FR-007) to today: 0–30 days, 31–60 days, 60+ days; the \"At Risk\" flag (all installment retries exhausted) is shown as a separate row regardless of age"}}
  - {"op": "update_node", "id": "REQ-017-052", "attrs": {"statement": "\"Pending Provider Payouts\" includes treatments with status \"Completed\" or \"Aftercare\" not yet paid, split into \"Pending release\" and \"Released\"; only released funds can enter a statement or a per-booking payout"}}
  - {"op": "update_node", "id": "REQ-017-053", "attrs": {"statement": "\"Failed Payout Count\" includes failed Stripe Connect per-booking payouts and failed affiliate payouts currently awaiting retry or manual resolution; a statement has no Failed state"}}
  - {"op": "update_node", "id": "REQ-017-061", "title": "Payout includes all released Completed or Aftercare treatments of the period", "attrs": {"statement": "Payout amount MUST include all treatments with status \"Completed\" or \"Aftercare\" completed since the last payout cycle whose funds are released: the confirmation window has ended with no open problem case, or an admin has resolved the case. Treatments with status \"Scheduled\", \"In Progress\", or \"Cancelled\" are NOT included"}}
  - {"op": "update_node", "id": "REQ-017-062", "attrs": {"statement": "Providers with status \"Suspended\" or \"Deactivated\" do NOT have statements generated; an admin releases their earnings with the Release earnings resolution on Screen 7"}}
  - {"op": "update_node", "id": "REQ-017-065", "attrs": {"statement": "\"Approve Payout\" button enabled ONLY for statements with status \"Pending Approval\" or \"Overdue\", and not while Payout Readiness is \"Manual Review Required\". \"Approve Payout\" is enabled ONLY when Payout Readiness = \"Ready\", the user role is Billing Admin or Super Admin, and financial re-authentication succeeds"}}
  - {"op": "update_node", "id": "REQ-017-066", "title": "Retry Payout only for Failed Stripe Connect payouts", "attrs": {"statement": "\"Retry Payout\" button is shown only in the Stripe Connect payouts section and is enabled ONLY for a Failed per-booking payout that is not in \"Manual Review Required\"; clicking it re-initiates the Stripe transfer; retry is logged in audit trail with admin ID, timestamp, and failure reason from prior attempt. A failed Stripe Connect payout first gets 3 automatic attempts with exponential backoff and then goes to Manual Review Required; once an admin clears it with a review note, this button is available for the manual retry. A statement has no retry: an admin marks it as paid"}}
  - {"op": "update_node", "id": "REQ-017-067", "attrs": {"statement": "\"Unapprove\" button enabled ONLY for statements with status \"Approved\" and ONLY before the payout day (it is not offered once the payout day has passed); on click, admin must enter a mandatory reason (max 500 chars); statement reverts to \"Pending Approval\"; action logged in audit trail with action_type \"Payout Unapproved\""}}
  - {"op": "update_node", "id": "REQ-017-072", "title": "Overdue section on top of the payout list; Failed Stripe Connect payouts in their own part", "attrs": {"statement": "Statements with status \"Overdue\" are surfaced at the top of the list in a dedicated \"Overdue\" section. Failed Stripe Connect payouts are surfaced in a dedicated \"Failed\" part of the Stripe Connect payouts section, which sits below \"Upcoming / Pending Approval\""}}
  - {"op": "update_node", "id": "REQ-017-074", "attrs": {"statement": "Payout period determined by the one platform-wide settlement period for manual-rail clinics (weekly by default, ending on the Sunday cutoff day; set in admin payment settings). Per-clinic payout frequency no longer applies; Stripe Connect clinics are paid per released booking, have no statement and are listed in the Stripe Connect payouts section of Screen 2"}}
  - {"op": "update_node", "id": "REQ-017-075", "attrs": {"statement": "If a patient refund is processed AFTER the provider has already been paid, the next provider payout statement MUST include a row in `Payout Adjustments` labelled `Adjustment: Refund deducted — [Booking Reference] — [Date]`. If a refund deduction exceeds the provider's current payout amount, the unapplied balance remains visible in `Remaining Balance` and carries forward to the next payout cycle until fully recovered; the same applies to every entry of the clinic balance record, on either rail. A debt with no further payout coming stays open on the clinic's balance until an admin writes it off"}}
  - {"op": "update_node", "id": "REQ-017-076", "title": "Approve marks the statement Approved; an Overdue one is payable at once", "attrs": {"statement": "\"Approve Payout\" button marks the statement as \"Approved\"; no payment is started by the review action. An approved statement is paid by the admin by bank transfer outside the platform and marked as paid. An Overdue statement that is approved is payable at once and does not wait for the next payout day", "rationale": "Screen 3 business rules and Billing Rule 5: an Overdue statement is payable at once on approval, and Unapprove is not offered once the payout day has passed."}}
  - {"op": "update_node", "id": "REQ-017-077", "attrs": {"statement": "Stripe Transfer ID of a Stripe Connect payout remains blank until Stripe confirms `transfer.created`; failure reason remains blank unless Stripe or validation returns a blocking error"}}
  - {"op": "update_node", "id": "REQ-017-080", "attrs": {"statement": "Reminder Type: Auto-selected based on invoice status: \"Upcoming Due Reminder\" (Final Payment Status Not Due or Due), \"Overdue Reminder\" (Final Payment Status Overdue), \"At Risk — Final Notice\" (At Risk flag). The four reminder types are Upcoming Due, Overdue, At Risk - Final Notice, and Manual Reminder. Display-only; not editable by admin. Channel: \"Via: Email + Push Notification\""}}
  - {"op": "update_node", "id": "REQ-017-083", "title": "Invoice Overdue from the day after the due date", "attrs": {"statement": "\"Overdue\" is read from the booking's Final Payment Status in FR-007 and shows from the day after the due date while a balance is unpaid; FR-017 does not compute it. The 7 days named in reminders and alerts is only their cadence"}}
  - {"op": "update_node", "id": "REQ-017-084", "title": "Invoice carries the At Risk flag when all installment retries fail", "attrs": {"statement": "The \"At Risk\" flag (not a payment status) is raised when all 3 retry attempts for any installment have failed; booking is flagged for admin review. Admin MUST manually follow up with patient (contact via support, update payment method, or cancel booking)"}}
  - {"op": "update_node", "id": "REQ-017-085", "title": "Send Reminder only for invoices with an unpaid balance", "attrs": {"statement": "\"Send Reminder\" button available ONLY for invoices with an unpaid balance (Payment Status \"Unpaid\", \"Deposit only\" or \"Installments active\"), including those whose Final Payment Status is \"Overdue\" or that carry the \"At Risk\" flag"}}
  - {"op": "update_node", "id": "REQ-017-086", "title": "Process Refund only for invoices with money paid and not all returned", "attrs": {"statement": "\"Process Refund\" button available ONLY for invoices with Payment Status \"Deposit only\", \"Installments active\" or \"Full paid\" (money has been paid and not all of it returned); it opens FR-007 Screen 6 (Refund Processing) through the launcher on Screen 4b, and the refund amount, reason and approval belong to FR-007. A part refund keeps the previous Payment Status and shows as a row in the refund history"}}
  - {"op": "update_node", "id": "REQ-017-088", "attrs": {"statement": "Admin can manually override a payment status when the Stripe webhook fails, is delayed, or when an off-system payment adjustment is needed. \"Override Status\" button available for ANY invoice (all statuses). On click: admin selects the new Payment Status from the dropdown (the FR-007 list: \"Unpaid\", \"Deposit only\", \"Installments active\", \"Full paid\", \"Refunded\"), enters mandatory reason (free text, max 500 characters), and confirms. Override is logged to audit trail with: admin ID, timestamp, previous status, new status, reason entered. Overridden invoices display a warning badge: \"Status manually adjusted — [date]\" visible to admins only"}}
  - {"op": "update_node", "id": "REQ-017-090", "attrs": {"statement": "Invoices with a Reconciliation Flag are surfaced in a dedicated exceptions section alongside invoices that carry the \"At Risk\" flag until resolved. Invoices with the \"At Risk\" flag are surfaced at top of list in a dedicated section, similar to Overdue pattern in Screen 2. Display warning icon for installments with upcoming payment dates (within 7 days)"}}
  - {"op": "update_node", "id": "REQ-017-093", "title": "At Risk invoices show a warning banner", "attrs": {"statement": "Invoices with the \"At Risk\" flag display a prominent warning banner at the top of the detail view: \"All payment retries have been exhausted. Please contact the patient to resolve.\""}}
  - {"op": "update_node", "id": "REQ-017-103", "attrs": {"statement": "\"Process Payout\" button enabled ONLY for payouts that are payable (status \"Pending\" and the payable condition of REQ-017-197) and after successful financial re-authentication. \"Retry Payout\" button enabled ONLY for payouts with status \"Failed\", Payout Readiness = \"Ready\", and successful financial re-authentication"}}
  - {"op": "update_node", "id": "REQ-017-106", "attrs": {"statement": "Batch selection is allowed ONLY for affiliate payouts that are payable under the same condition as \"Process Payout\". Processing is sequential; failures for individual affiliates do not block processing of others. After batch completes, failed rows are pinned in the Failed / Requires Retry section for individual follow-up"}}
  - {"op": "update_node", "id": "REQ-017-118", "title": "Earnings payout status follows the payment", "attrs": {"statement": "Manual rail: once the admin has marked the statement as paid, affected treatments update to Payout Status \"Included in Payout — [Date]\". Stripe Connect: once the per-booking payout is initiated at release, the booking updates to \"Included in Payout — [Date]\". If a Stripe Connect transfer fails (`transfer.failed` webhook), the booking updates to Payout Status \"Payout Failed — [Date]\" and displays a warning icon; it reverts once the admin retries and the transfer succeeds. A statement never fails"}}
  - {"op": "update_node", "id": "REQ-017-123", "title": "Payout history entries appear when the payout starts or is marked paid", "attrs": {"statement": "Payout entries appear in this list as soon as the Stripe transfer is initiated (status: \"Processing\"); they remain visible through \"Paid\" and \"Failed\" states. A manual-rail payout appears once an admin has marked it as paid. Each payout entry links to all treatment cases included in that payout period (Booking Reference → FR-001 / A-01). Retry Resolution History remains visible even after a failed payout later resolves to \"Paid\", so providers can understand why timing changed. Provider has read-only access to all data on this screen; no approval or editing actions are available"}}
  - {"op": "update_node", "id": "REQ-017-125", "title": "Provider invoice PDF only after the payout is confirmed", "attrs": {"statement": "Invoice PDF is generated only after Stripe `transfer.paid` confirmation for a Stripe Connect payout, and when the admin marks a manual-rail statement as paid; the Download button is disabled during \"Processing\" status"}}
  - {"op": "update_node", "id": "REQ-017-137", "title": "Provider-status cancellations: full refund started by the system; admin resolution of captured payments", "attrs": {"statement": "Bookings cancelled by an FR-015 provider suspension or deactivation (cause `ProviderSuspended` / `ProviderDeactivated`) are excluded from provider payout calculation like other cancelled bookings. The Rule 7 refund ladder is not applied. As when the clinic withdraws or drops out, the patient is always refunded in full everything paid and pays no cancellation fee; the system starts the full refund through the FR-007 refund flow without waiting for an admin. A replacement booking through the FR-006 provider-fault transfer takes a new payment. The fixed clinic cancellation charge applies to a clinic withdrawal or drop-out only, not to a provider suspension or deactivation (FR-006 Alternative Flow B4). Captured patient payments on these bookings, including payments captured while the cancellation cascade was running, remain recorded against the booking invoice and are routed to admin financial resolution through the refund launcher (Screen 4b, which opens FR-007 Screen 6) and the existing adjustment controls (mandatory reason, audit trail). Provider reactivation does not restore cancelled bookings or their payout eligibility"}}
  - {"op": "update_node", "id": "REQ-017-138", "attrs": {"statement": "Amounts on bookings cancelled by provider suspension or deactivation, including any procedure already recorded as completed under FR-010 and any Rule 14 late capture, are held from provider payout statements until admin financial resolution is recorded. Release to a payout uses the existing \"Add to Next Payout\" resolution (Screen 7) while the clinic is active, and the \"Release earnings\" resolution (REQ-017-193) when the clinic is Suspended or Deactivated; payout timing is otherwise unchanged. The earnings of a removed clinic are never forfeited: an admin always settles them through this rule and the Release earnings route"}}
  - {"op": "update_node", "id": "REQ-017-142", "title": "Overdue statements payable at once on approval", "attrs": {"statement": "Payout statement approval during the review time between the cutoff day and the payout day, and during overdue review; an approved statement is payable on the payout day and an Overdue statement is payable at once when approved, and the admin pays it and marks it paid"}}
  - {"op": "update_node", "id": "REQ-017-143", "title": "Stripe Connect payout retry fixed at 3 attempts", "attrs": {"statement": "Payout retry logic for Stripe Connect payouts (3 attempts with exponential backoff - hardcoded)"}}
  - {"op": "update_node", "id": "REQ-017-150", "attrs": {"statement": "Provider payout statements (dashboard view) for manual-rail clinics are auto-generated on the platform-wide cutoff day. Provider invoice PDFs are generated separately only after the payout is confirmed (post-payout): when the admin marks a statement as paid, or on `transfer.paid` for a Stripe Connect payout. Statements and invoices are two distinct artefacts."}}
  - {"op": "update_node", "id": "REQ-017-153", "title": "Approve between cutoff and payout day; payout day makes only Approved payable", "attrs": {"statement": "Admin must approve payout statements during the review time between the cutoff day and the payout day. On payout day only \"Approved\" statements are payable: the admin pays them and marks them paid. Any statement still in \"Pending Approval\" at that point moves to \"Overdue\" and is NOT payable. An Overdue statement can be approved at any time outside the normal cycle; on approval it is payable at once, the admin pays it and marks it paid, and it never waits for the next payout day. Unapprove is not offered after the payout day. Delay is recorded in the audit trail."}}
  - {"op": "update_node", "id": "REQ-017-170", "attrs": {"statement": "A failed Stripe transfer for a provider or affiliate payout is retried up to 3 times; if all retries fail the payout is set to Manual Review Required and the payout failed event is triggered."}}
  - {"op": "update_node", "id": "REQ-017-174", "attrs": {"statement": "Funds are released per booking at Treatment, then paid out per provider. The provider marks the procedure complete; the patient confirms or disputes within a confirmation window (default 7 days, an editable admin setting); no answer means automatic release; a dispute pauses release until an admin resolves it. A booking's funds count as released when the window ends with no open case, or when an admin resolves the case; until then its earnings show as Pending release. Any admin with support access can resolve a completion problem case and choose the money outcome; there is no time limit. A completion problem case ends in one of three outcomes: release in full, refund in full, or refund in part and release the rest"}}
  - {"op": "update_node", "id": "REQ-017-176", "attrs": {"statement": "The manual rail runs one platform-wide weekly cycle: Sunday cutoff, Wednesday payout (both admin-editable). The admin records each payment by marking the statement as paid. A manually paid clinic is \"Ready\" once the admin has set its payout method to manual bank transfer and saved valid bank details. A booking with an open problem case leaves the unpaid settlement statement until the admin decides. A bank charge on a manual transfer is recorded against the settlement statement; the clinic bears it, and it is entered when the admin marks the statement as paid, recorded as a Bank Charge adjustment, deducted from the clinic's statement amount and shown as a deduction"}}
  - {"op": "update_node", "id": "REQ-017-177", "attrs": {"statement": "A Stripe Connect clinic is paid one payout per released booking, at release, recorded on the booking ledger; the weekly cycle does not apply to it. A failed Stripe Connect payout gets 3 automatic attempts with exponential backoff, then goes to manual review, and the Retry Payout button on the Stripe Connect payouts list (Screen 2) stays available. Manual Review Required is also set by the fraud flag (REQ-017-161); while it is set, approval and retry are disabled until an admin clears it with a review note, which is audited"}}
  - {"op": "update_node", "id": "REQ-017-179", "attrs": {"statement": "When a clinic's Stripe payout setup is not Ready at the time its share is due to move, the share stays with Hairline, the clinic and the admin are told, it moves when the clinic becomes Ready, and nothing is paid out before then, even after treatment. If the patient cancels after the share has moved, Hairline refunds the patient per the refund ladder, pulls the share back from the clinic's locked balance, and records any shortfall as a refund deduction on the clinic's balance. If the treatment is rescheduled after the share has moved, the share is always pulled back and moved again 60 or 30 days before the new date; this also keeps the share inside Stripe's 90-day limit. The share can be pulled back to Hairline before Stripe's 90-day limit and moved again later; there is no deadline for moving it again"}}
  - {"op": "update_node", "id": "REQ-017-180", "title": "Clinic cancellation deduction from FR-029 Screen 7 and patient cancellation fee split", "attrs": {"statement": "When a clinic cancels, the fixed amount set in FR-029 Screen 7 is deducted from the clinic's next payout, only while it is set, in its Fee Currency converted to the payout currency, as an entry on the clinic balance. A patient cancellation fee is split between Hairline and the clinic by a percentage set in admin settings. The refund ladder is one global ladder now (General Module Rule 7)"}}
  - {"op": "update_node", "id": "REQ-017-182", "attrs": {"statement": "The admin gets an internal alert (email and push) for an overdue patient invoice once the invoice has been overdue for the alert threshold. The threshold is an admin setting expressed in days overdue, and it defaults to 7 days."}}
  - {"op": "update_node", "id": "REQ-017-183", "title": "Hourly installment job in the clinic's timezone", "attrs": {"statement": "One scheduled job runs hourly and acts on each installment plan whose due day has started in the clinic's timezone; payment reminders use the same day boundary at 9 AM clinic time, 3 days before the due date."}}
  - {"op": "update_node", "id": "REQ-017-185", "attrs": {"statement": "When a treatment already started is interrupted by the provider's fault (FR-006 Alternative Flow B7, booking `In Progress`), the Rule 7 refund ladder is not applied. An admin reviews each case and sets the patient refund amount, from zero up to the full amount paid, with a mandatory reason and an audit entry, through the refund launcher (Screen 4b), which opens FR-007 Screen 6 with the amount the admin sets. The provider's payout for that booking is held, and stays off the unpaid statement and the per-booking payout, until the admin decides; the held amount then follows the Screen 7 outcomes"}}
  - {"op": "update_node", "id": "STP-017-007", "title": "Admin sees the Overdue section at the top of the list and approves it; an approved Overdue statement is payable at once"}
  - {"op": "update_node", "id": "STP-017-008", "title": "Invalid bank account: admin contacts the provider, who updates bank details in Billing Settings; admin retries the per-booking payout from the Stripe Connect payouts section"}
  - {"op": "update_node", "id": "STP-017-009", "title": "Other Stripe error: admin investigates, resolves and retries the per-booking payout from the Stripe Connect payouts section"}
  - {"op": "update_node", "id": "STP-017-034", "title": "Admin reviews the flagged invoice and resolves it through the refund launcher (opens FR-007 Screen 6) or an adjustment, with a mandatory reason"}
  - {"op": "update_node", "id": "STP-017-038", "title": "System calculates eligible earnings of released bookings, commission from the booking snapshot and net payout"}
  - {"op": "update_node", "id": "STP-017-041", "title": "Payout day: Approved statements become due for payment; no payout is started automatically"}
  - {"op": "update_node", "id": "STP-017-044", "title": "System starts the clinic's per-booking payout at release; status Processing"}
  - {"op": "update_node", "id": "STP-017-047", "title": "Payout becomes Paid (marked by the admin, or transfer.paid for a per-booking payout) and the system generates the invoice document with itemised breakdown"}
  - {"op": "update_node", "id": "STP-017-050", "title": "transfer.failed: the per-booking payout becomes Failed and admin is notified; three automatic attempts, then Manual Review Required"}
  - {"op": "update_node", "id": "STP-017-056", "title": "Approved statements wait for the payout day, when the admin pays them"}
  - {"op": "update_node", "id": "SCR-017-06", "title": "Refund Launcher", "attrs": {"description": "Screen 4b. Launcher into FR-007 Screen 6 (Refund Processing) with the invoice and booking prefilled; FR-007 owns the refund amount, reason, re-authentication, Stripe refund and approval. UI controls (no field): Open Refund Processing button; Cancel button."}}
  - {"op": "update_node", "id": "SCR-017-02", "attrs": {"description": "UI controls (no field): Select checkbox; Actions (View Details, Approve Payout, Unapprove, Void Statement, Add Note on a statement; Retry Payout, Clear Manual Review on a Stripe Connect payout; Write Off Balance on an open clinic balance); Batch Approval Toolbar (Selected Statements, Selected Net Total, Approve All Selected Payouts, Clear Selection); Unapprove and Void reason inputs; Filters, sort and CSV export. Sections: Upcoming / Pending Approval statements, Overdue, Stripe Connect payouts (Waiting for clinic setup, Processing, Paid, Failed), Open clinic balances."}}
  - {"op": "update_node", "id": "SCR-017-03", "attrs": {"description": "UI controls (no field): Batch Approval Confirmation Modal (summary, counts, warning, re-authentication, confirm, cancel, result summary); Approve Payout Confirmation Modal; Mark as Paid Modal (re-authentication, bank reference, payment date, optional bank charge, confirm); Retry Payout Confirmation Modal; Clear Manual Review input; Export payout report."}}
  - {"op": "update_node", "id": "SCR-017-09", "attrs": {"description": "UI controls (no field): Search controls (Search By, Search Input, Record Type, Date Range, Status); Search Results Record Type badge (names which record the row is); Save Resolution button (Confirm Already Paid, Add to Next Payout, Escalate Technical Investigation, Release in Full, Refund in Full, Refund in Part and Release the Rest, Release Earnings); Audit log filter controls (Date Range, Admin User, Action Type, Affected Entity, Entity ID); Audit log export."}}
  - {"op": "update_node", "id": "FLW-017-main", "attrs": {"description": "Provider payout processing on the manual rail: cutoff-day statements, admin approval, payment by bank transfer outside the platform, Mark as Paid, invoice and provider notification."}}
  - {"op": "update_node", "id": "SET-outstanding-invoice-alert-threshold", "attrs": {"description": "Number of days overdue after which an outstanding patient invoice raises an alert (FR-017 Admin Editability). Defaults to 7 days."}}
