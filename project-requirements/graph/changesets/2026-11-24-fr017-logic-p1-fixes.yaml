# FR-017 logic review pass 1: graph change-set mirroring the revised PRD (Admin Billing and Financial Management). New rules, entity, fields, enum values, flows and steps come first, then updates, removals and retirements, then new edges.
# Cross-FR edges (other FRs' nodes): REQ-017-198 applies to ENT-affiliate-payout.payout_readiness (FR-018 field, edge only); STP-017-089 is on SCR-007-07 (FR-007 Screen 6, edge only); SCR-017-07 shows ENT-promotion-code.code and ENT-promotion-program.name, start_at and end_at (FR-019 fields, edges only). No node owned by another FR is updated or retired.
# Queued for other FRs, not done here: FR-006, FR-007 (SET-payout-execution-window owner), FR-007B (installment job day boundary), FR-014, FR-015, FR-018, FR-019 (Screen 5 Type and Status vocabulary), FR-029, FR-030, FR-031.
# Left alone on purpose: unused provider-payout enum values (processing and failed stay, they belong to the Stripe Connect payout); ENT-refund entity and its remaining fields; ENT-invoice-reminder.reminder_type (no At Risk final notice value yet); EVT-billing-payout-schedule-updated and REQ-017-044 are already retired.
reason: "FR-017 logic review pass 1: a settlement statement is manual-rail only with Mark as Paid and an Overdue statement payable at once; Stripe Connect per-booking payouts with Waiting for clinic setup, readiness and Manual Review Required; funds-released gate with Pending release and Released; Screen 7 outcomes and Release earnings; Screen 4b is a launcher into FR-007 Screen 6 (refund rules retired); FR-007 Payment Status list with Final Payment Status and an At Risk flag; Overdue from the day after the due date; one hourly installment job in the clinic timezone; clinic balance record with write-off; no forfeiture for a removed clinic; Hairline discount reimbursement row; affiliate payable condition, Held or Flagged column and readiness from FR-018; clinic cancellation deduction from FR-029 Screen 7; Screen 5 fields re-pointed to the promotion entities; outstanding-invoice alert defaults to 7 days."
by: docs-manager
operations:
  - {"op": "add_node", "id": "REQ-017-186", "type": "Rule", "owner_fr": "FR-017", "title": "A settlement statement is manual-rail only, with five states", "attrs": {"statement": "A settlement statement exists only for a manual-rail clinic and has five states: Pending Approval, Approved, Overdue, Paid (set when the admin marks it paid) and Voided. A statement never has Processing or Failed, and Stripe webhooks never change it.", "rationale": "Main Flow rail scope note; Screen 2 and Screen 3 status rules; Entry Points."}}
  - {"op": "add_node", "id": "REQ-017-187", "type": "Rule", "owner_fr": "FR-017", "title": "A Stripe Connect payout has its own states and is listed on Screen 2", "attrs": {"statement": "A Stripe Connect clinic is paid one payout per released booking, listed in the Stripe Connect payouts section of Screen 2. That payout has the states Waiting for clinic setup, Processing, Paid and Failed, moved by the Stripe transfer webhooks; Retry Payout and the three automatic attempts belong to it.", "rationale": "Alternative Flow B4; Screen 2 Stripe Connect payouts section; Release Rules 4 and 11."}}
  - {"op": "add_node", "id": "REQ-017-188", "type": "Rule", "owner_fr": "FR-017", "title": "Mark as Paid records a manual payment on Screen 3", "attrs": {"statement": "A manual-rail statement in Approved status, or an Overdue one just approved, is marked paid by the admin on Screen 3 with financial re-authentication, a bank reference, a payment date (not in the future) and an optional bank charge. Marking it paid sets the statement to Paid, records a bank charge as a Bank Charge adjustment, writes the audit entry Payout Marked Paid, notifies the clinic and generates the invoice document.", "rationale": "Main Flow steps 14 to 16; Screen 3 Mark as Paid modal; Release Rule 3."}}
  - {"op": "add_node", "id": "REQ-017-189", "type": "Rule", "owner_fr": "FR-017", "title": "Earnings are Pending release until the booking's funds are released", "attrs": {"statement": "A booking's earnings are Pending release until its funds are released, and Released afterwards. Funds are released when the confirmation window ends with no open problem case, or when an admin resolves the case. Only released earnings enter a statement, the running total available for payout, or a per-booking payout.", "rationale": "Entry Points; Screen 1 Pending Provider Payouts; Screen 9 summary; Release Rule 1."}}
  - {"op": "add_node", "id": "REQ-017-190", "type": "Rule", "owner_fr": "FR-017", "title": "Screen 7 carries the three outcomes of a completion problem case", "attrs": {"statement": "Screen 7 carries the three outcomes of a completion problem case. Release in full releases the held amount; refund in full, and refund in part with release of the rest, open FR-007 Screen 6 with an admin-set refund amount from zero to the full amount paid, a reason and an audit entry. Each outcome needs an internal note and writes an audit entry.", "rationale": "Screen 7 business rules; Alternative Flow B4; Screen 4b rules; Rule 19."}}
  - {"op": "add_node", "id": "REQ-017-191", "type": "Rule", "owner_fr": "FR-017", "title": "One clinic balance record of signed entries, applied to the next payout", "attrs": {"statement": "Each clinic has one balance record of signed entries: refund deduction, chargeback recovery, clinic cancellation deduction and bank charge. Open entries are applied to the clinic's next payout on either rail and are shown on Screens 2, 3 and 9.", "rationale": "Release Rule 9; Alternative Flow B5; Screens 2, 3 and 9 balance rows."}}
  - {"op": "add_node", "id": "REQ-017-192", "type": "Rule", "owner_fr": "FR-017", "title": "An open clinic debt is written off by an admin with a reason", "attrs": {"statement": "A clinic debt with no further payout coming stays open on the clinic's balance until an admin writes it off with a mandatory reason; the write-off is recorded in the audit trail.", "rationale": "Release Rule 9; Alternative Flow B5; Screen 2 Open clinic balances."}}
  - {"op": "add_node", "id": "REQ-017-193", "type": "Rule", "owner_fr": "FR-017", "title": "Release earnings resolves a Suspended or Deactivated clinic's money", "attrs": {"statement": "For a Suspended or Deactivated clinic, an admin releases earnings with a Release earnings resolution on Screen 7 that needs no target payout cycle: a manual-rail clinic gets a one-off manual statement and a Stripe Connect clinic a direct per-booking payout, with an internal note and an audit entry. It covers bookings completed normally and bookings held under General Module Rule 16 once the admin has resolved them.", "rationale": "Screen 7 business rules; General Module Rule 16; Alternative Flow B4."}}
  - {"op": "add_node", "id": "REQ-017-194", "type": "Rule", "owner_fr": "FR-017", "title": "Manual Review Required blocks approval and retry until an admin clears it", "attrs": {"statement": "Payout Readiness becomes Manual Review Required when the fraud flag (REQ-017-161) is raised or after three failed payout attempts. Approval and retry are disabled while it is set. An admin clears it with a review note, recorded in the audit trail as Manual Review Cleared.", "rationale": "Screen 2 business rules; Screen 3 Manual Review Note; Release Rule 4."}}
  - {"op": "add_node", "id": "REQ-017-195", "type": "Rule", "owner_fr": "FR-017", "title": "Hairline discount reimbursement is its own payout row", "attrs": {"statement": "A Hairline-funded discount is reimbursed to the clinic as its own row on the statement and on the per-booking payout, read from the frozen booking snapshot (REQ-019-017) and shown on Screen 3.", "rationale": "Release Rule 10; Screen 3 reimbursement rows."}}
  - {"op": "add_node", "id": "REQ-017-196", "type": "Rule", "owner_fr": "FR-017", "title": "Stripe Connect readiness: Not onboarded, Restricted, Ready", "attrs": {"statement": "A Stripe Connect clinic's payout setup is shown as Not onboarded, Restricted or Ready. A booking whose clinic is not Ready shows Waiting for clinic setup on the per-booking payout list until the clinic is Ready.", "rationale": "Release Rule 11; Screen 2 Payout Readiness and Stripe Connect payouts section."}}
  - {"op": "add_node", "id": "REQ-017-197", "type": "Rule", "owner_fr": "FR-017", "title": "When an affiliate payout is payable on Screen 6", "attrs": {"statement": "An affiliate payout is payable on Screen 6 only when the payout month is closed, the unpaid balance is at or above the USD 50 minimum (an Inactive affiliate has no minimum), Payout Readiness is Ready and no hold applies. Screen 6 shows a Held or Flagged column: Held for the unpaid commission of a Suspended affiliate, Flagged for a payout with a booking that still breaches the margin check.", "rationale": "Screen 6 business rules; FR-018 payout and margin guard rules."}}
  - {"op": "add_node", "id": "REQ-017-198", "type": "Rule", "owner_fr": "FR-017", "title": "Affiliate payout readiness comes from FR-018; the USD floor is checked in USD", "attrs": {"statement": "The affiliate payout readiness shown on Screen 6 is derived from ENT-affiliate-payout.payout_readiness, set by FR-018; FR-017 does not recompute it. The USD 50 minimum is checked in USD after conversion at the locked rate, with one threshold for all affiliates.", "rationale": "Screen 6 Payout Readiness row and business rules; FR-018 REQ-018-311."}}
  - {"op": "add_node", "id": "REQ-017-199", "type": "Rule", "owner_fr": "FR-017", "title": "Process Refund is a launcher into FR-007 Screen 6", "attrs": {"statement": "Process Refund is a launcher on Screen 4b into FR-007 Screen 6 with the invoice and booking prefilled; FR-007 owns the refund amount, reason, re-authentication, Stripe refund and any approval. FR-017 keeps the effect on the invoice (a refund row in the refund history; a full refund sets Payment Status Refunded) and on the clinic's payout. The closure refund of General Module Rule 13 is started by the system through FR-007.", "rationale": "Screen 4b; Screen 4 Process Refund rule; General Module Rule 13."}}
  - {"op": "add_node", "id": "ENT-clinic-balance-entry", "type": "Entity", "owner_fr": "FR-017", "title": "Clinic Balance Entry", "attrs": {"description": "One signed entry on a clinic's balance record: refund deduction, chargeback recovery, clinic cancellation deduction or bank charge. Open entries are applied to the clinic's next payout on either rail; a debt with no further payout stays open until an admin writes it off (Entity 9)."}}
  - {"op": "add_field", "id": "ENT-clinic-balance-entry.amount", "entity_id": "ENT-clinic-balance-entry", "name": "amount", "data_type": "money", "title": "Balance entry amount", "owner_fr": "FR-017", "calculated_by": "REQ-017-191", "attrs": {"description": "Signed amount of the entry; a negative amount is money the clinic owes Hairline."}}
  - {"op": "add_field", "id": "ENT-provider-payout.bank_reference", "entity_id": "ENT-provider-payout", "name": "bank_reference", "data_type": "text", "title": "Bank reference", "owner_fr": "FR-017", "attrs": {"description": "Bank transfer reference the admin enters when marking a statement as paid."}}
