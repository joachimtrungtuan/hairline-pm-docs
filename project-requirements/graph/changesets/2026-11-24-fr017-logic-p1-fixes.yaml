  - {"op": "add_field", "id": "ENT-payout-dispute-resolution.refund_amount", "entity_id": "ENT-payout-dispute-resolution", "name": "refund_amount", "data_type": "money", "title": "Refund amount", "owner_fr": "FR-017", "attrs": {"description": "Admin-set refund amount for a refund outcome, from zero to the full amount paid; carried into FR-007 Screen 6."}}
