  - {"op": "add_field", "id": "ENT-provider-payout.manual_review_note", "entity_id": "ENT-provider-payout", "name": "manual_review_note", "data_type": "text", "title": "Manual review note", "owner_fr": "FR-017", "attrs": {"description": "Review note an admin enters when clearing Manual Review Required."}}
