# FR-017 logic review pass 2: graph change-set mirroring PRD 2.20 (Admin Billing and Financial Management). New rules, steps and clinic balance entry fields come first, then updates, removals, then new edges.
# Cross-FR edges (other FRs' nodes): none. Steps STP-017-100 and STP-017-102 are event-started and are extra starts of FLW-017-per-booking-payout.
# Queued for other FRs, not done here: see the ledger section for FR-017 pass 2 (FR-006, FR-007, FR-030, FR-031 wording only).
reason: "FR-017 logic review pass 2: interrupted-treatment hold ends with the FR-006 route; bank charge carried to the next payout; clinic share of a retained cancellation fee is an earning; Manual Review Required named, cleared and returned on both rails; one-off Release Earnings statement created Approved and paid with Mark as Paid; dead-end steps wired; Approved statement past its payout day may be voided; clinic balance entry fields and Clinic Balance audit entity type; Pay Now for a Stripe Connect clinic on Screen 7."
by: docs-manager
operations:
  - {"op": "add_node", "id": "REQ-017-200", "type": "Rule", "owner_fr": "FR-017", "title": "The clinic's share of a retained patient cancellation fee is an earning released into the next payout", "attrs": {"statement": "When a patient cancellation retains a fee, the clinic's share of it (the split percentage set in admin settings) creates an earning for the clinic. The earning has no confirmation window and is released into the clinic's next payout: the next statement on the manual rail, a direct per-booking payout on Stripe Connect. The Hairline share is not an earning. The treatment amount of a cancelled booking stays excluded from payout calculation, and a provider-fault cancellation carries no fee and so no share.", "rationale": "Release Rule 7; General Module Rule 13; Screen 2 business rules."}}
  - {"op": "add_node", "id": "REQ-017-201", "type": "Rule", "owner_fr": "FR-017", "title": "Pay Now replaces Add to Next Payout for a Stripe Connect clinic on Screen 7", "attrs": {"statement": "On Screen 7, for a Stripe Connect clinic the Target Payout Cycle field is hidden and Pay Now replaces Add to Next Payout. Pay Now is available only when the booking was not already paid, its funds are released and the admin has provided an Internal Note; it starts a direct per-booking payout, which shows Waiting for clinic setup until the clinic's Stripe setup is Ready, and the provider notification is mandatory. Confirm Already Paid and Escalate Technical Investigation stay for both rails.", "rationale": "Screen 7 Dispute Resolution Panel and business rules; Alternative Flow B4."}}
  - {"op": "add_node", "id": "STP-017-100", "type": "Step", "owner_fr": "FR-017", "title": "System holds the payout of a booking In Progress when the provider's fault is flagged (interrupted treatment); no confirmation window applies", "attrs": {"prd_ref": "B4 step 11"}}
  - {"op": "add_node", "id": "STP-017-101", "type": "Step", "owner_fr": "FR-017", "title": "Admin resolves the interrupted treatment through the FR-006 route (Screen 11); when that route completes the hold ends: the refund set in the FR-006 decision is taken from the held payout and the rest is released", "attrs": {"prd_ref": "B4 step 12"}}
  - {"op": "add_node", "id": "STP-017-102", "type": "Step", "owner_fr": "FR-017", "title": "A patient cancellation retains a fee: the clinic's share becomes an earning with no confirmation window, released into the clinic's next payout", "attrs": {"prd_ref": "B4 step 13"}}
  - {"op": "add_node", "id": "STP-017-103", "type": "Step", "owner_fr": "FR-017", "title": "System checks the payout against the payout flag (over 2x the clinic's average) and sets Manual Review Required before approval or the start of the per-booking payout", "attrs": {"prd_ref": "Screen 2 Manual Review Required rule"}}
  - {"op": "add_node", "id": "STP-017-104", "type": "Step", "owner_fr": "FR-017", "title": "Manual rail: the cleared statement returns to the state it had before the flag (Pending Approval or Approved) and approval or payment continues", "attrs": {"prd_ref": "Screen 2 Manual Review Required rule"}}
  - {"op": "add_node", "id": "STP-017-105", "type": "Step", "owner_fr": "FR-017", "title": "Stripe Connect clinic: admin chooses Pay Now with an internal note; the system starts the booking's direct per-booking payout", "attrs": {"prd_ref": "Screen 7 Pay Now rule"}}
  - {"op": "add_node", "id": "STP-017-106", "type": "Step", "owner_fr": "FR-017", "title": "An Approved statement that cannot be paid after the payout day is voided with a mandatory reason and an audit entry; its bookings return to the next cycle's statement", "attrs": {"prd_ref": "Screen 2 Void Statement rule"}}
