  - {"op": "add_field", "id": "ENT-clinic-balance-entry.state", "entity_id": "ENT-clinic-balance-entry", "name": "state", "data_type": "enum", "required": true, "title": "Entry state", "owner_fr": "FR-017", "attrs": {"description": "Open entries are applied to the clinic's next payout; a debt with no further payout stays open until it is written off."}}
