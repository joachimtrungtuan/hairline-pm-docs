  - {"op": "update_node", "id": "REQ-017-161", "attrs": {"statement": "Flag sudden high-value discount codes for review (>50% off or >£500). Flag provider payouts exceeding 2x average payout amount for manual review. Implement rate limiting on refund API endpoints (max 10 refunds per admin per hour). Of these flags only the payout flag sets a statement or a Stripe Connect payout to Manual Review Required (REQ-017-194); the discount code flag and refund rate limiting do not"}}
  - {"op": "update_node", "id": "REQ-017-194", "attrs": {"statement": "Payout Readiness becomes Manual Review Required on either rail when the payout flag of REQ-017-161 is raised (a payout over 2x the clinic's average payout amount), and on a Stripe Connect payout also after three failed payout attempts. Approval and retry are disabled while it is set. An admin clears it on a statement or on a Stripe Connect payout with a review note, recorded in the audit trail as Manual Review Cleared; a statement then returns to the state it had before the flag (Pending Approval or Approved) and a Stripe Connect payout returns to Failed, so Retry Payout applies (REQ-017-066)."}}
  - {"op": "update_node", "id": "REQ-017-177", "attrs": {"statement": "A Stripe Connect clinic is paid one payout per released booking, at release, recorded on the booking ledger; the weekly cycle does not apply to it. A failed Stripe Connect payout gets 3 automatic attempts with exponential backoff, then goes to manual review, and the Retry Payout button on the Stripe Connect payouts list (Screen 2) stays available. Manual Review Required is also set, on either rail, by the payout flag (REQ-017-161); while it is set, approval and retry are disabled until an admin clears it with a review note, which is audited, and a cleared Stripe Connect payout returns to Failed so Retry Payout applies"}}
  - {"op": "update_node", "id": "REQ-017-066", "attrs": {"statement": "\"Retry Payout\" button is shown only in the Stripe Connect payouts section and is enabled ONLY for a Failed per-booking payout that is not in \"Manual Review Required\"; clicking it re-initiates the Stripe transfer; retry is logged in audit trail with admin ID, timestamp, and failure reason from prior attempt. A failed Stripe Connect payout first gets 3 automatic attempts with exponential backoff and then goes to Manual Review Required; once an admin clears it with a review note, the payout returns to Failed and this button is available for the manual retry. A statement has no retry: an admin marks it as paid"}}
  - {"op": "update_node", "id": "REQ-017-185", "title": "Interrupted treatment: admin sets the refund, payout held until the FR-006 route completes", "attrs": {"statement": "When a treatment already started is interrupted by the provider's fault (FR-006 Alternative Flow B7, booking `In Progress`), the Rule 7 refund ladder is not applied. An admin reviews each case and sets the patient refund amount in the FR-006 decision, from zero up to the full amount paid, with a mandatory reason and an audit entry; the refund is executed through the refund launcher (Screen 4b), which opens FR-007 Screen 6 with that amount. The provider's payout for that booking is held, and stays off the unpaid statement and the per-booking payout, from the fault until the FR-006 route the admin chose completes (FR-006 REQ-006-019); no confirmation window applies and the Screen 7 outcomes, which are for Completed bookings only, are not used. The refund is taken from the held payout, a shortfall becomes a clinic balance entry (REQ-017-191), and the rest is released."}}
  - {"op": "update_node", "id": "REQ-017-190", "attrs": {"statement": "Screen 7 carries the three outcomes of a completion problem case. Release in full releases the held amount; refund in full, and refund in part with release of the rest, open FR-007 Screen 6 with an admin-set refund amount from zero to the full amount paid, a reason and an audit entry. Each outcome needs an internal note and writes an audit entry. These outcomes are for a Completed booking only; an interrupted treatment ends its payout hold through the FR-006 route (REQ-017-185)."}}
  - {"op": "update_node", "id": "REQ-017-176", "attrs": {"statement": "The manual rail runs one platform-wide weekly cycle: Sunday cutoff, Wednesday payout (both admin-editable). The admin records each payment by marking the statement as paid. A manually paid clinic is \"Ready\" once the admin has set its payout method to manual bank transfer and saved valid bank details. A booking with an open problem case leaves the unpaid settlement statement until the admin decides. A bank charge on a manual transfer is borne by the clinic and entered when the admin marks the statement as paid; it is recorded as a Bank Charge entry of the clinic balance record and applied to the clinic's next payout, and the statement being marked as paid keeps its approved amount"}}
  - {"op": "update_node", "id": "REQ-017-188", "attrs": {"statement": "A manual-rail statement in Approved status, or an Overdue one just approved, is marked paid by the admin on Screen 3 with financial re-authentication, a bank reference, a payment date (not in the future) and an optional bank charge. Marking it paid sets the statement to Paid at its approved amount, records a bank charge as a Bank Charge entry of the clinic balance record for the clinic's next payout (never deducted from this statement), writes the audit entry Payout Marked Paid, notifies the clinic and generates the invoice document."}}
  - {"op": "update_node", "id": "REQ-017-191", "attrs": {"statement": "Each clinic has one balance record of signed entries: refund deduction, chargeback recovery, clinic cancellation deduction and bank charge. Open entries are applied to the clinic's next payout on either rail and are shown on Screens 2, 3 and 9. A bank charge of a manual transfer is entered when the statement is marked as paid and applied to the clinic's next payout."}}
  - {"op": "update_node", "id": "REQ-017-193", "attrs": {"statement": "For a Suspended or Deactivated clinic, an admin releases earnings with a Release earnings resolution on Screen 7 that needs no target payout cycle: a manual-rail clinic gets a one-off manual statement and a Stripe Connect clinic a direct per-booking payout, with an internal note and an audit entry. It covers bookings completed normally and bookings held under General Module Rule 16 once the admin has resolved them. The one-off statement is created Approved (the admin's release is the approval), sits outside the weekly cycle and is paid with Mark as Paid like any other statement."}}
  - {"op": "update_node", "id": "REQ-017-068", "title": "Void a Pending Approval or Overdue statement, or an Approved one past its payout day, with reason", "attrs": {"statement": "\"Void Statement\" button enabled ONLY for statements with status \"Pending Approval\" or \"Overdue\", and for an \"Approved\" statement that has passed its payout day unpaid; on click, admin must enter a mandatory reason (max 500 chars); statement is marked \"Voided\" and permanently removed from auto-processing; action logged with action_type \"Payout Voided\"; a new statement can be re-generated on the next payout cycle, and the bookings of a voided statement return to the next cycle's statement; voided statements remain visible in list with \"Voided\" status badge for audit history"}}
  - {"op": "update_node", "id": "REQ-017-110", "title": "Add to Next Payout (manual rail) only for unpaid, now-eligible bookings", "attrs": {"statement": "\"Add to Next Payout\" is available ONLY when the booking was not already paid, is now eligible for payout, and the admin has provided an Internal Note and target payout cycle; it applies to a manual-rail clinic, and a Stripe Connect clinic gets Pay Now instead (REQ-017-201)"}}
  - {"op": "update_node", "id": "REQ-017-037", "attrs": {"statement": "Treatment completion triggers provider payout eligibility calculation; eligible earnings are added to the provider's running earnings total as Pending release, and become Released when the booking's funds are released: the confirmation window ends with no open problem case, or an admin resolves the case (REQ-017-189); the clinic's share of a retained patient cancellation fee is a Released earning at once (REQ-017-200)"}}
  - {"op": "update_node", "id": "REQ-017-061", "attrs": {"statement": "Payout amount MUST include all treatments with status \"Completed\" or \"Aftercare\" completed since the last payout cycle whose funds are released: the confirmation window has ended with no open problem case, or an admin has resolved the case. Treatments with status \"Scheduled\", \"In Progress\", or \"Cancelled\" are NOT included; the clinic's share of a retained patient cancellation fee is the one exception, an earning of its own that enters the next statement (REQ-017-200)"}}
  - {"op": "update_node", "id": "REQ-017-137", "attrs": {"statement": "Bookings cancelled by an FR-015 provider suspension or deactivation (cause `ProviderSuspended` / `ProviderDeactivated`) are excluded from provider payout calculation like other cancelled bookings. The Rule 7 refund ladder is not applied. As when the clinic withdraws or drops out, the patient is always refunded in full everything paid and pays no cancellation fee, so no fee share arises for the clinic (REQ-017-200); the system starts the full refund through the FR-007 refund flow without waiting for an admin. A replacement booking through the FR-006 provider-fault transfer takes a new payment. The fixed clinic cancellation charge applies to a clinic withdrawal or drop-out only, not to a provider suspension or deactivation (FR-006 Alternative Flow B4). Captured patient payments on these bookings, including payments captured while the cancellation cascade was running, remain recorded against the booking invoice and are routed to admin financial resolution through the refund launcher (Screen 4b, which opens FR-007 Screen 6) and the existing adjustment controls (mandatory reason, audit trail). Provider reactivation does not restore cancelled bookings or their payout eligibility"}}
  - {"op": "update_node", "id": "REQ-017-180", "attrs": {"statement": "When a clinic cancels, the fixed amount set in FR-029 Screen 7 is deducted from the clinic's next payout, only while it is set, in its Fee Currency converted to the payout currency, as an entry on the clinic balance. A patient cancellation fee is split between Hairline and the clinic by a percentage set in admin settings; the clinic's share of a retained fee is an earning of its own, released into the clinic's next payout, and the Hairline share is not an earning (REQ-017-200). The refund ladder is one global ladder now (General Module Rule 7)"}}
  - {"op": "update_node", "id": "SCR-017-02", "attrs": {"description": "UI controls (no field): Select checkbox; Actions (View Details, Approve Payout, Unapprove, Void Statement, Add Note on a statement; Retry Payout on a Stripe Connect payout; Clear Manual Review on a statement or a Stripe Connect payout; Write Off Balance on an open clinic balance); Batch Approval Toolbar (Selected Statements, Selected Net Total, Approve All Selected Payouts, Clear Selection); Unapprove and Void reason inputs; Filters, sort and CSV export. Sections: Upcoming / Pending Approval statements, Overdue, Stripe Connect payouts (Waiting for clinic setup, Processing, Paid, Failed), Open clinic balances."}}
  - {"op": "update_node", "id": "SCR-017-09", "attrs": {"description": "UI controls (no field): Search controls (Search By, Search Input, Record Type, Date Range, Status); Search Results Record Type badge (names which record the row is); Save Resolution button (Confirm Already Paid, Add to Next Payout (manual rail), Pay Now (Stripe Connect), Escalate Technical Investigation, Release in Full, Refund in Full, Refund in Part and Release the Rest, Release Earnings); Audit log filter controls (Date Range, Admin User, Action Type, Affected Entity, Entity ID); Audit log export."}}
  - {"op": "update_node", "id": "STP-017-087", "title": "System checks the booking's funds when the confirmation window ends: with no open problem case they are released; with an open problem case on a Completed booking, or a provider-status cancellation, the payout is held"}
  - {"op": "update_node", "id": "STP-017-082", "title": "Admin notifies the provider that the booking is included in the next payout, or that its payout was started (Pay Now)"}
  - {"op": "update_node", "id": "STP-017-086", "title": "Statement becomes Paid at its approved amount; a bank charge becomes a clinic balance entry for the next payout; audit entry Payout Marked Paid; the clinic is notified"}
  - {"op": "update_node", "id": "STP-017-091", "title": "Release earnings for a Suspended or Deactivated clinic: a one-off manual statement created Approved and paid with Mark as Paid (manual rail) or a direct per-booking payout (Stripe Connect), with an internal note and an audit entry"}
  - {"op": "update_node", "id": "STP-017-094", "title": "The payout is set to Manual Review Required (three failed attempts on a Stripe Connect payout, or the payout flag on either rail); approval and retry are disabled"}
  - {"op": "update_node", "id": "STP-017-095", "title": "Admin clears Manual Review Required with a review note, recorded in the audit trail; a Stripe Connect payout returns to Failed so it can be retried, a statement returns to its earlier state"}
