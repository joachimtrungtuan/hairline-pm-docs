# Draft, not applied. Clears the nine L03 findings (Screens that show no stored Field) once schema version 11 is in place:
# eight Screens are marked display_only with a reason, and SCR-024-08 gets a new FR-024 Entity with Fields and shows edges.
# Apply only after scripts/migrate_schema_v11.py has run on graph.db, because the display_only attributes need schema version 11.
# Evidence per Screen is in plans/reports/fullstack-developer-261120-2140-display-only-screens.md.
reason: "Mark the display-only Screens (FR-001 splash, explanation, landing, service selection, settings main, privacy and security menu, password changed confirmation; FR-026 Platform Settings Editor) so lint L03 skips them, and give the FR-024 Admin Aftercare Templates Screen the template Entity and Fields its PRD Screen 8 describes"
by: controller
operations:
  - {"op": "update_node", "id": "SCR-001-20", "attrs": {"display_only": true, "display_only_reason": "Splash Screen (PRD Screen 1) shows only the logo, an animated loading indicator and the app version, all static or system-populated branding that is not a stored Field, and collects nothing."}}
  - {"op": "update_node", "id": "SCR-001-21", "attrs": {"display_only": true, "display_only_reason": "The two explanation screens (PRD Screen 1a) hold static explanatory content only, and the PRD states they are display-only and collect no data."}}
  - {"op": "update_node", "id": "SCR-001-22", "attrs": {"display_only": true, "display_only_reason": "Landing Screen (PRD Screen 2) holds a rotating background image (a platform Setting managed in FR-026), static headline copy and two navigation controls, and shows or collects no stored Field."}}
  - {"op": "update_node", "id": "SCR-001-23", "attrs": {"display_only": true, "display_only_reason": "Service Selection (PRD Screen 8a) is pure navigation: the patient picks one of four services and lands in it, and FR-001 stores no choice (REQ-001-169 and Steps STP-001-007 to 009 name no stored value, and the service list is defined outside this FR)."}}
  - {"op": "update_node", "id": "SCR-001-24", "attrs": {"display_only": true, "display_only_reason": "Settings Main (PRD Screen 15) is a static navigation hub of four link rows to other screens and shows or collects no stored Field."}}
  - {"op": "update_node", "id": "SCR-001-25", "attrs": {"display_only": true, "display_only_reason": "Privacy and Security Menu (PRD Screen 15b) is a navigation menu of two link rows (Change Password, Privacy Policy) and shows or collects no stored Field."}}
  - {"op": "update_node", "id": "SCR-001-26", "attrs": {"display_only": true, "display_only_reason": "Password Changed Confirmation (PRD Screen 17a) shows a success icon, a title, static confirmation copy and a Done button, and shows or collects no stored Field."}}
