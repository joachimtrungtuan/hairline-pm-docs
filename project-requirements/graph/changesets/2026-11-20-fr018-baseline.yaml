  - {"op": "update_node", "id": "ACT-affiliate", "attrs": {"group": "external", "description": "External referral partner who uses the affiliate portal operated within the Admin Platform (PRD Module Scope)."}}
  - {"op": "update_node", "id": "SET-affiliate-payout-day", "owner_fr": "FR-018", "attrs": {"description": "Day of the month on which monthly affiliate payouts are processed. Admin-editable platform setting owned by FR-018 (PRD General Module Rules, Rule 5); the payout stays monthly. The PRD names no owning configuration screen."}}
  - {"op": "add_edge", "from": "REQ-018-266", "verb": "governed by", "to": "SET-affiliate-payout-day"}
  - {"op": "add_edge", "from": "REQ-018-007", "verb": "governed by", "to": "SET-affiliate-payout-day"}
