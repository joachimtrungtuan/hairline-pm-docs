# Backlog points settled for FR-007, FR-009, FR-026 and the aftercare completed event (cross-FR filing points X1, X2, X3, X4, X8, X9).
reason: "Balance due date and locked FR-029 values stored on the booking; FR-017 commission and handover fee rules cited; role change timing aligned to 5 seconds and next request; step title carries the Account Name; re-verification threshold consumer Screen 14 added; aftercare completed event is not registered by FR-030."
by: controller
source_id: SRC-PRD-007
operations:
  - {"op": "add_node", "id": "REQ-007-103", "type": "Rule", "owner_fr": "FR-007", "title": "The booking stores the balance due date and the FR-029 values locked at confirmation", "attrs": {"statement": "At booking confirmation (REQ-007-098) System MUST store on the booking the balance due date (the procedure date minus the FR-029 balance due days, kept as the Final Payment Due Date) and the FR-029 values that lock at confirmation: the refund ladder, the rescheduling fee, the late payment fee with its currency code, the late payment grace period, the unpaid balance cancellation point and the installment cutoff. A value that is Not set stays Not set, and a later FR-029 change MUST NOT move any of them (FR-029 REQ-029-101, REQ-029-146)."}}
  - {"op": "add_edge", "from": "REQ-007-103", "verb": "applies at", "to": "STG-main-05-payment"}
  - {"op": "add_edge", "from": "REQ-007-103", "verb": "applies to", "to": "ENT-booking.final_payment_due_at"}
  - {"op": "add_edge", "from": "REQ-007-103", "verb": "governed by", "to": "SET-deposit-plan-balance-due-days"}
  - {"op": "update_node", "id": "REQ-007-012", "attrs": {"statement": "System MUST support release of the clinic's share and its payout with commission deduction and statement generation, per Fund Release & Money Routing Rules (payout execution is owned by FR-017). A handover fee for aftercare handed to the Hairline team (REQ-011-057) is paid to the provider from Hairline's own revenue and is never taken from a price (FR-017 REQ-017-203)"}}
  - {"op": "update_node", "id": "REQ-007-100", "attrs": {"statement": "For a standalone aftercare payment (REQ-007-088) no refund ladder applies: an admin decides any refund beyond FR-011's own refund cases with a reason on Screen 6, opened from the aftercare payment record, as a manual refund (REQ-007-015). FR-011's own cases are the automatic refund in REQ-011-037 and the pro-rata refund of the unused full months when a plan paid in full is cancelled (REQ-011-097); the system starts them, and the commission and the provider's payout (FR-017) fall in the same proportion (FR-017 REQ-017-202). The provider's money is released after the same patient confirmation window as a booking, counted from the date of the payment instead of procedure completion."}}
  - {"op": "update_node", "id": "REQ-009-057", "title": "Role change: new permissions reach active sessions within 5 seconds, the next request uses them", "attrs": {"statement": "System updates the team member's role in the database, applies the new permissions to the member's active sessions within 5 seconds without forcing logout, and the member's next request uses the new permissions (REQ-009-014; FR-031 REQ-031-006, REQ-031-026)."}}
  - {"op": "update_node", "id": "STP-009-020", "title": "System creates the Active team member record linked to the provider with the assigned role and an Account Name of First Name + Last Name"}
  - {"op": "update_node", "id": "REQ-026-112", "attrs": {"statement": "System MUST store a Re-Verification Threshold Setting (whole minutes from 1 to 60, default 5, the value FR-001 uses), the time after a patient's last successful sign-in beyond which FR-001 asks the patient to confirm identity again before a sensitive action. Consumer: FR-001 Screens 14, 16 and 18."}}
  - {"op": "update_node", "id": "EVT-aftercare-completed", "attrs": {"description": "aftercare.completed: aftercare ends and the event carries an outcome value: completed (the end of the last milestone or the subscription term, REQ-011-096), paperwork only, cancelled by the patient (subscription cancellation once the paid period ends) or cancelled by an admin (REQ-011-101). FR-006 reads this event to move the booking on (REQ-006-060); reading the outcome is queued for FR-006. FR-011 is the producer and owns the event; it produces no notification, so it is not in the FR-030 catalogue (FR-030 REQ-030-233)."}}
