reason: "Requirements graph programme baseline 2026-11-20: owner rulings applied (FR-005)"
by: "controller"
operations:
- {"op": "update_node", "id": "REQ-005-004", "attrs": {"statement": "System MUST block subquote acceptance when the subquote or its parent quote is expired, withdrawn, cancelled, archived, superseded, or stale, or when the owning provider is `Suspended` or `Deactivated` (FR-015), with clear messaging."}}
- {"op": "update_node", "id": "REQ-005-007", "title": "Acceptance record retention follows the platform retention Rule", "attrs": {"statement": "Retention of acceptance and related parent quote/subquote records follows the system PRD, Platform-Wide Rules: One 10-year retention period.", "rationale": "Restated by Data & Privacy Rule 4 (acceptance and related quote/subquote records follow the system PRD, Platform-Wide Rules: One 10-year retention period, REQ-SYS-002)."}}
- {"op": "update_node", "id": "REQ-005-012", "attrs": {"rationale": "Restated by the Screen 1 business rules (patient can sort/filter subquotes). The sort and filter options, the default sort and the price-order currency handling are owned by FR-022 (REQ-022-057, REQ-022-068, REQ-022-058, REQ-022-069)."}}
- {"op": "update_node", "id": "REQ-005-015", "title": "Quote screen may link to the existing provider conversation", "attrs": {"statement": "A quote screen MAY link to the existing provider conversation. In-app messaging itself is defined in REQ-012-006 (FR-012 Messages/Inbox).", "rationale": "Restated by the Screen 1 Message Provider button. In-app messaging itself is defined in REQ-012-006 (FR-012 Messages/Inbox)."}}
- {"op": "update_node", "id": "REQ-005-020", "attrs": {"statement": "Parent quote and subquote analytics MUST remain distinct: one provider response counts once at parent level (metric: Parent Quote Responses), while comparison and selection behavior is recorded at subquote level (metrics: Subquote Comparisons and Subquote Selections). Drafts, versions, edits, and resends MUST NOT add to the parent count. A parent quote counts once, on its first successful submission; several parent quotes count separately, one each. The parent count and the subquote counts are distinct grains: parents versus subquotes are never summed. Quote Option and subquote counts, when reported, MUST be labelled as such and never substituted into parent metrics."}}
- {"op": "update_node", "id": "REQ-005-023", "title": "AcceptanceEvent and snapshot immutable; admin may edit the accepted quote except price, currency and promotion", "attrs": {"statement": "System MUST NOT allow an AcceptanceEvent or its acceptance snapshot to be deleted, restored, or edited, and MUST NOT allow an accepted subquote or its parent quote to be deleted or restored. After acceptance an admin MAY edit the accepted quote in any field except its price, currency, and promotion (the date range and the treatment details may be changed), with a mandatory reason and a full before/after history. The edit MUST be stored as a new version beside the acceptance snapshot, and the snapshot keeps the terms as accepted. Admins MAY also add audited notes or corrections as annotations next to an AcceptanceEvent; an annotation MUST NOT change the event, its snapshot, or any quote, subquote, or inquiry state.", "rationale": "Restated by the Admin Platform scope and Admin Editability (after acceptance an admin may edit the accepted quote in any field except price, currency and promotion, with a mandatory reason and full before/after history, stored as a new version beside the unchanged acceptance snapshot; an annotation never alters the AcceptanceEvent, its snapshot, the accepted IDs/versions, or any quote, subquote, or inquiry state), Business Rule 6 (AcceptanceEvents, accepted subquotes, and their parent quotes are never deleted or restored), Screen 5 (annotations are append-only, each showing author, time, and reason; no delete or restore action exists), and Key Entities (AcceptanceAnnotation is an audited, append-only admin note)."}}
- {"op": "update_node", "id": "REQ-005-029", "title": "Acceptance outcome notices; recipients and content set by REQ-020-019", "attrs": {"statement": "At acceptance, System MUST notify the patient and the providers of the outcome, and the patient notice MUST also fire on an admin-authored replacement acceptance. Recipients, content, and whether a notice can be switched off are set by the notification Rule REQ-020-019 (FR-020).", "rationale": "Restated by Main Flow step 9 and Alternative Flow A9 (the patient notice also fires at the replacement acceptance). Recipients, content, and whether a notice can be switched off are set by the notification Rule REQ-020-019 (FR-020)."}}
- {"op": "add_node", "id": "REQ-005-065", "type": "Rule", "owner_fr": "FR-005", "title": "Conflicts flag set automatically by the system", "attrs": {"statement": "System MUST set the Conflicts flag on an acceptance automatically when a second acceptance is rejected; an admin does not set it. The flagged acceptance is then investigated by an admin (Screen 5).", "rationale": "Stated in the Admin Platform scope and the Screen 5 Conflicts field."}}
