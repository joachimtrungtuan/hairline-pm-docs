  - {"op": "add_node", "id": "REQ-007B-052", "type": "Rule", "owner_fr": "FR-007B", "title": "Later missed installments never cancel the booking automatically", "attrs": {"statement": "Alternative Flow B1 covers installments after the first. A missed or failed later installment never causes automatic booking cancellation; failure of the first installment at checkout is part of the first payment step and follows the FR-006 payment hold.", "rationale": "PRD prose rule, no id. prd.md line 155 (Alternative Flows)."}}
  - {"op": "add_node", "id": "REQ-007B-053", "type": "Rule", "owner_fr": "FR-007B", "title": "Patient cancellation goes through Contact Support and an admin cancels", "attrs": {"statement": "The patient requests cancellation through Contact Support; after subquote acceptance the patient cannot cancel in the app (FR-006) and the request reaches the admin queue in FR-016. The admin reviews the request and cancels the booking through the FR-006 Cancel Booking action with a mandatory reason and audit entry; the refund amount follows the FR-006 payment placeholder.", "rationale": "PRD prose rule, no id. prd.md line 161 (Alternative Flows)."}}
  - {"op": "add_node", "id": "REQ-007B-054", "type": "Rule", "owner_fr": "FR-007B", "title": "Cancellation refund ladder on paid installments", "attrs": {"statement": "Cancellation refunds are calculated based on timing: more than 30 days before the procedure = 90% of paid installments; 15 to 30 days = 50%; less than 15 days = no refund.", "rationale": "PRD prose rule, no id. prd.md line 491 (Payment & Billing Rules)."}}
  - {"op": "add_node", "id": "REQ-007B-055", "type": "Rule", "owner_fr": "FR-007B", "title": "Same refund percentages for installment and single payments", "attrs": {"statement": "The cancellation refund policy applies the same percentages to installment plans as to single payments.", "rationale": "PRD prose rule, no id. prd.md line 639 (Business Process Assumptions)."}}
  - {"op": "add_node", "id": "REQ-007B-056", "type": "Rule", "owner_fr": "FR-007B", "title": "Refund percentages set by admin per timing window", "attrs": {"statement": "The cancellation refund policy for installment plans is configurable with restrictions: the admin sets the percentages per timing window.", "rationale": "PRD prose rule, no id. prd.md line 482 (Admin Editability Rules)."}}
  - {"op": "add_node", "id": "REQ-007B-057", "type": "Rule", "owner_fr": "FR-007B", "title": "Partial refund outcome recorded on the plan", "attrs": {"statement": "The system records the partial refund outcome on the installment plan; booking status moves to Cancelled per FR-006; no further installments are charged.", "rationale": "PRD prose rule, no id. prd.md line 166 (Alternative Flows)."}}
  - {"op": "add_node", "id": "REQ-007B-058", "type": "Rule", "owner_fr": "FR-007B", "title": "Provider notified when a booking with an active plan is cancelled", "attrs": {"statement": "The provider is notified when a booking with an active installment plan is cancelled.", "rationale": "PRD prose rule, no id. prd.md line 167 (Alternative Flows)."}}
  - {"op": "add_node", "id": "REQ-007B-059", "type": "Rule", "owner_fr": "FR-007B", "title": "Refund dispute on partial installments", "attrs": {"statement": "When a patient disputes a charge for a partial-installment refund, the admin reviews the dispute and processes the refund per the resolution; the admin may cancel the booking or allow continuation.", "rationale": "PRD prose rule, no id. prd.md line 804 (Edge Cases)."}}
  - {"op": "add_node", "id": "REQ-007B-060", "type": "Rule", "owner_fr": "FR-007B", "title": "Admin date change triggers recalculation without changing the total", "attrs": {"statement": "The admin date change, made through the FR-006 Change Appointment action and notified to the patient and provider through booking.rescheduled, triggers installment plan recalculation from the updated booking date; the plan total, currency and the accepted snapshot do not change. Patient self-service rescheduling remains deferred to V2.", "rationale": "PRD prose rule, no id. prd.md line 173 (Alternative Flows)."}}
  - {"op": "add_node", "id": "REQ-007B-061", "type": "Rule", "owner_fr": "FR-007B", "title": "Sufficient time: schedule dates adjusted to the new date", "attrs": {"statement": "After a date change the system checks whether the new procedure date allows completion of the remaining installments (30-day buffer); if there is sufficient time, the system adjusts the installment schedule dates to align with the new procedure date.", "rationale": "PRD prose rule, no id. prd.md line 175 (Alternative Flows)."}}
  - {"op": "add_node", "id": "REQ-007B-062", "type": "Rule", "owner_fr": "FR-007B", "title": "Insufficient time: remaining balance paid immediately or plan cancelled", "attrs": {"statement": "If the new procedure date leaves insufficient time, the system notifies the patient that the remaining balance must be paid immediately or the installment plan canceled; the admin, in coordination with the patient, either collects the remaining balance immediately or cancels the booking through the FR-006 Cancel Booking action.", "rationale": "PRD prose rule, no id. prd.md line 176 (Alternative Flows)."}}
  - {"op": "add_node", "id": "REQ-007B-063", "type": "Rule", "owner_fr": "FR-007B", "title": "Provider fault during Aftercare does not change the plan", "attrs": {"statement": "A provider fault during Aftercare reassigns only the aftercare provider (FR-011) and does not change the installment plan.", "rationale": "PRD prose rule, no id. prd.md line 182 (Alternative Flows)."}}
  - {"op": "add_node", "id": "REQ-007B-064", "type": "Rule", "owner_fr": "FR-007B", "title": "Replacement plan takes its total from the replacement quote's snapshot", "attrs": {"statement": "Any installment plan for the replacement booking takes its total, currency and exchange rate from the replacement quote's acceptance snapshot, never from the original snapshot or a live quote.", "rationale": "PRD prose rule, no id. prd.md line 186 (Alternative Flows)."}}
  - {"op": "add_node", "id": "REQ-007B-065", "type": "Rule", "owner_fr": "FR-007B", "title": "Cutoff change applies only to new bookings", "attrs": {"statement": "If the admin increases the cutoff window (e.g. from 30 to 45 days via FR-029), it applies only to new bookings; existing installment plans are unchanged.", "rationale": "PRD prose rule, no id. prd.md line 803 (Edge Cases)."}}
  - {"op": "add_node", "id": "REQ-007B-066", "type": "Rule", "owner_fr": "FR-007B", "title": "Fewer installments mid-plan not supported", "attrs": {"statement": "Reducing the number of installments mid-plan is not supported; the patient can pay the remaining balance early to complete the plan.", "rationale": "PRD prose rule, no id. prd.md line 802 (Edge Cases)."}}
  - {"op": "add_node", "id": "REQ-007B-067", "type": "Rule", "owner_fr": "FR-007B", "title": "Payment status polled when the processor webhook fails", "attrs": {"statement": "If the payment processor webhook fails to deliver a charge status, the system polls payment status as a fallback so that no confirmation or retry is missed.", "rationale": "PRD prose rule, no id. prd.md line 805 (Edge Cases)."}}
  - {"op": "add_node", "id": "REQ-007B-068", "type": "Rule", "owner_fr": "FR-007B", "title": "Installment charges are idempotent", "attrs": {"statement": "Installment charges are idempotent: a retry never produces a duplicate charge.", "rationale": "PRD prose rule, no id. prd.md line 649 (Technical Considerations)."}}
  - {"op": "add_node", "id": "REQ-007B-069", "type": "Rule", "owner_fr": "FR-007B", "title": "Installment schedule and amounts immutable once confirmed", "attrs": {"statement": "Installment schedule and amounts are immutable once confirmed (prevents tampering).", "rationale": "PRD prose rule, no id. prd.md line 685 (Security Considerations)."}}
  - {"op": "add_node", "id": "REQ-007B-070", "type": "Rule", "owner_fr": "FR-007B", "title": "Commission on the booking total, deducted from payout after the final installment", "attrs": {"statement": "Platform commission is calculated on the booking total (accepted price after promotion), using the commission type (Percentage or Flat Rate) and value from the snapshot taken at booking confirmation (FR-029), deducted from provider payout after the final installment completes.", "rationale": "PRD prose rule, no id. prd.md line 492 (Payment & Billing Rules)."}}
  - {"op": "add_node", "id": "REQ-007B-071", "type": "Rule", "owner_fr": "FR-007B", "title": "Provider payout delayed until the plan is fully paid", "attrs": {"statement": "Provider payout is delayed until all installments are completed and the instalment plan is fully paid.", "rationale": "PRD prose rule, no id. prd.md line 493 (Payment & Billing Rules)."}}
  - {"op": "add_node", "id": "REQ-007B-072", "type": "Rule", "owner_fr": "FR-007B", "title": "Installment data visible by role", "attrs": {"statement": "Access to installment payment data follows RBAC: patients see their own installments, providers see booking payment status, and admins see all plans.", "rationale": "PRD prose rule, no id. prd.md line 455 (Data & Privacy Rules)."}}
  - {"op": "add_node", "id": "REQ-007B-073", "type": "Rule", "owner_fr": "FR-007B", "title": "PCI-DSS via the processor; GDPR and HIPAA-aligned payment data handling", "attrs": {"statement": "Payment method details are stored securely per PCI-DSS standards via the payment processor; the platform follows PCI-DSS (via processor) and GDPR/HIPAA-aligned handling of payment data.", "rationale": "PRD prose rule, no id. prd.md line 452 (Data & Privacy Rules)."}}
  - {"op": "add_node", "id": "REQ-007B-074", "type": "Rule", "owner_fr": "FR-007B", "title": "Fixed values are not admin-editable", "attrs": {"statement": "The following are fixed in code and not editable by the admin: interest rate (always 0%), installment frequency (monthly, 30-day intervals), core payment security controls and encryption standards, number of retry attempts (3), retry schedule (1, 3 and 7 days later), reminder timing (3 days before the due date) and audit logging scope for payment events. Payment processor integration settings require technical deployment and are not runtime editable.", "rationale": "PRD prose rule, no id. prd.md line 470 (Admin Editability Rules)."}}
  - {"op": "add_node", "id": "REQ-007B-075", "type": "Rule", "owner_fr": "FR-007B", "title": "Admin dashboard metrics, plan list and drill-down", "attrs": {"statement": "The admin dashboard shows the active plans count, overdue installments (failed after retries, flagged for admin action), total installment revenue collected, average installments selected and success rate (successful installment charges over total attempts), and a plan list with patient, provider, status and progress that is filterable and sortable with drill-down into individual plan details; the admin can generate reports on installment plan usage and performance.", "rationale": "PRD prose rule, no id. prd.md line 362 (Screen 5: Admin Installment Plan Management Dashboard)."}}
  - {"op": "add_node", "id": "REQ-007B-076", "type": "Rule", "owner_fr": "FR-007B", "title": "Aging report of overdue installments", "attrs": {"statement": "The admin sees an aging report showing days overdue for failed installments.", "rationale": "PRD prose rule, no id. prd.md line 372 (Screen 5: Admin Installment Plan Management Dashboard)."}}
  - {"op": "add_node", "id": "REQ-007B-077", "type": "Rule", "owner_fr": "FR-007B", "title": "Revenue forecast from scheduled installments", "attrs": {"statement": "The admin dashboard shows a revenue forecast based on scheduled installments.", "rationale": "PRD prose rule, no id. prd.md line 376 (Screen 5: Admin Installment Plan Management Dashboard)."}}
  - {"op": "add_node", "id": "REQ-007B-078", "type": "Rule", "owner_fr": "FR-007B", "title": "Dashboard export for financial reporting", "attrs": {"statement": "The admin dashboard provides export capabilities for financial reporting and reconciliation.", "rationale": "PRD prose rule, no id. prd.md line 382 (Screen 5: Admin Installment Plan Management Dashboard)."}}
  - {"op": "add_node", "id": "REQ-007B-079", "type": "Rule", "owner_fr": "FR-007B", "title": "Admin views the plan configuration owned by FR-029", "attrs": {"statement": "The admin views the installment plan configuration (managed in FR-029) and a link to the configuration screen for authorized users; enabled installment counts, cutoff days, minimum booking amount, first installment type and the late payment grace period are configured in FR-029.", "rationale": "PRD prose rule, no id. prd.md line 48 (Multi-Tenant Breakdown)."}}
  - {"op": "add_node", "id": "REQ-007B-080", "type": "Rule", "owner_fr": "FR-007B", "title": "Admin Retry Charge on a failed installment", "attrs": {"statement": "The admin can perform Retry Charge on a failed installment (invokes the payment processor via S-02); Retry Charge is available only for \"Failed\" or \"Overdue\" installments.", "rationale": "PRD prose rule, no id. prd.md line 413 (Screen 6: Admin Booking Installment Plan Detail)."}}
  - {"op": "add_node", "id": "REQ-007B-081", "type": "Rule", "owner_fr": "FR-007B", "title": "Admin Mark as Resolved", "attrs": {"statement": "The admin can Mark as Resolved a failed installment when an external or manual payment issue has been handled.", "rationale": "PRD prose rule, no id. prd.md line 414 (Screen 6: Admin Booking Installment Plan Detail)."}}
  - {"op": "add_node", "id": "REQ-007B-082", "type": "Rule", "owner_fr": "FR-007B", "title": "Admin Cancel Plan and Apply Cancellation Policy", "attrs": {"statement": "The admin can Cancel Plan & Apply Cancellation Policy, which stops future installments, calculates refunds per cancellation policy and updates booking status per the Business Workflows; the action is available for \"Active\" or \"Overdue\" plans and disabled for \"Completed\" plans.", "rationale": "PRD prose rule, no id. prd.md line 415 (Screen 6: Admin Booking Installment Plan Detail)."}}
  - {"op": "add_node", "id": "REQ-007B-083", "type": "Rule", "owner_fr": "FR-007B", "title": "Admin actions require a justification of at least 20 characters", "attrs": {"statement": "All admin actions that modify installment plan state (subject to internal policy and audit logging) require a justification text input of at least 20 characters and are logged with timestamp, admin ID, action type and justification.", "rationale": "PRD prose rule, no id. prd.md line 420 (Screen 6: Admin Booking Installment Plan Detail)."}}
  - {"op": "add_node", "id": "REQ-007B-084", "type": "Rule", "owner_fr": "FR-007B", "title": "Action-specific audit data", "attrs": {"statement": "Retry Charge is logged with installment ID and retry attempt number; Mark as Resolved with installment ID and resolution method; Cancel Plan & Apply Cancellation Policy with installment plan ID, booking ID, refund amount and cancellation reason.", "rationale": "PRD prose rule, no id. prd.md line 502 (Admin Action & Audit Rules)."}}
  - {"op": "add_node", "id": "REQ-007B-085", "type": "Rule", "owner_fr": "FR-007B", "title": "Admin cannot directly edit financial amounts", "attrs": {"statement": "The admin cannot directly edit financial amounts; changes must be made via refunds or adjustments defined in the payment rules.", "rationale": "PRD prose rule, no id. prd.md line 425 (Screen 6: Admin Booking Installment Plan Detail)."}}
  - {"op": "add_node", "id": "REQ-007B-086", "type": "Rule", "owner_fr": "FR-007B", "title": "Admin actions written to the immutable audit trail", "attrs": {"statement": "All admin actions documented in Screen 6 (Admin Booking Installment Plan Detail) are logged to the immutable audit trail system (S-06: Audit Log Service); audit logs are tamper-proof and queryable for compliance reporting.", "rationale": "PRD prose rule, no id. prd.md line 508 (Admin Action & Audit Rules)."}}
  - {"op": "add_node", "id": "REQ-007B-087", "type": "Rule", "owner_fr": "FR-007B", "title": "Audit logs retained for 10 years", "attrs": {"statement": "Audit logs are retained for 10 years per constitution requirements.", "rationale": "PRD prose rule, no id. prd.md line 509 (Admin Action & Audit Rules)."}}
  - {"op": "add_node", "id": "REQ-007B-088", "type": "Rule", "owner_fr": "FR-007B", "title": "Audit log record contents", "attrs": {"statement": "Audit logs include timestamp (UTC), admin user ID, admin name, action type, affected entity IDs (installment plan ID, booking ID, patient ID), justification text, before/after state (if applicable) and IP address.", "rationale": "PRD prose rule, no id. prd.md line 510 (Admin Action & Audit Rules)."}}
  - {"op": "add_node", "id": "REQ-007B-089", "type": "Rule", "owner_fr": "FR-007B", "title": "Failed admin action attempts also logged", "attrs": {"statement": "Failed admin action attempts (e.g. insufficient permissions, validation errors) are also logged.", "rationale": "PRD prose rule, no id. prd.md line 511 (Admin Action & Audit Rules)."}}
  - {"op": "add_node", "id": "REQ-007B-090", "type": "Rule", "owner_fr": "FR-007B", "title": "Only billing and finance admin roles run installment actions", "attrs": {"statement": "Only authorized admin roles (Billing Admin, Financial Manager, Super Admin) can execute installment management actions.", "rationale": "PRD prose rule, no id. prd.md line 516 (Admin Action & Audit Rules)."}}
  - {"op": "add_node", "id": "REQ-007B-091", "type": "Rule", "owner_fr": "FR-007B", "title": "RBAC per FR-031 on all installment data access", "attrs": {"statement": "Role-based access control is enforced per FR-031 (Admin Access Control & Permissions); all installment data access (read and write) is subject to RBAC validation.", "rationale": "PRD prose rule, no id. prd.md line 517 (Admin Action & Audit Rules)."}}
  - {"op": "add_node", "id": "REQ-007B-092", "type": "Rule", "owner_fr": "FR-007B", "title": "Email and push notifications; no SMS in MVP", "attrs": {"statement": "Installment notifications (reminders, payment confirmations, payment failures, admin alerts) go by email and push; SMS installment notifications are not available in MVP and the channel is a future enhancement. Chat between patient and provider about payment terms and marketing content about installment plans are out of scope.", "rationale": "PRD prose rule, no id. prd.md line 65 (Communication Structure)."}}
  - {"op": "add_node", "id": "REQ-007B-093", "type": "Rule", "owner_fr": "FR-007B", "title": "Booking status change notification when the final installment completes", "attrs": {"statement": "A booking status change notification is sent when the final installment completes.", "rationale": "PRD prose rule, no id. prd.md line 69 (Communication Structure)."}}
  - {"op": "add_node", "id": "REQ-007B-094", "type": "Rule", "owner_fr": "FR-007B", "title": "Installment counts, next payment and completion percentage", "attrs": {"statement": "Installments Paid is the count of completed installments (0 to total); Installments Remaining is total minus paid; Next Payment Date and Next Payment Amount show only if installments remaining is above 0; Completion Percentage is the percentage of total amount collected (0 to 100%, auto-calculated).", "rationale": "PRD prose rule, no id. prd.md line 244 (Screen 2: Patient Booking Details - Installment Schedule View)."}}
  - {"op": "add_node", "id": "REQ-007B-095", "type": "Rule", "owner_fr": "FR-007B", "title": "Overdue days count from the first missed or failed installment", "attrs": {"statement": "Overdue Days is the number of days since the first missed or failed installment and appears only for Overdue or Defaulted plans.", "rationale": "PRD prose rule, no id. prd.md line 289 (Screen 3: Provider Installment Plans Overview)."}}
  - {"op": "add_node", "id": "REQ-007B-096", "type": "Rule", "owner_fr": "FR-007B", "title": "Provider-fault credit and refund mechanics are defined later", "attrs": {"statement": "Exact credit, refund, fund-release and payment-allocation override mechanics are defined later in FR-007, FR-007B and FR-017.", "rationale": "PRD prose rule, no id. prd.md line 188 (Alternative Flows)."}}
  - {"op": "add_node", "id": "REQ-007B-097", "type": "Rule", "owner_fr": "FR-007B", "title": "Provider fault before treatment starts hands off to the FR-006 replacement flow", "attrs": {"statement": "Before treatment starts (booking Accepted or Confirmed), when the provider withdraws the accepted quote, drops out, or is suspended or deactivated, and an admin transfers the patient to a replacement provider through FR-006 Alternative Flow B5 by authoring a replacement quote in the same inquiry, the installment plan follows the B4 outcome.", "rationale": "PRD prose rule, no id. prd.md line 180 (Alternative Flows)."}}
  # --- Settings: stubs owned by FR-029 for configuration the PRD names there (the other FR-029 settings already come from the FR-006 stub)
  - {"op": "add_node", "id": "SET-installment-first-installment-type", "type": "Setting", "owner_fr": "FR-029", "title": "Installment first-installment type", "attrs": {"description": "Whether the first installment is a deposit or an equal split of the total; configured in FR-029 (PRD Admin Editability Rules). Stub created during FR-007B migration; detail arrives when FR-029 migrates."}}  # stub
  - {"op": "add_node", "id": "SET-installment-late-payment-grace-period", "type": "Setting", "owner_fr": "FR-029", "title": "Installment late payment grace period", "attrs": {"description": "Late payment grace period before booking cancellation; configured in FR-029 (PRD Admin Editability Rules). Stub created during FR-007B migration; detail arrives when FR-029 migrates."}}  # stub
  # --- Entities and fields: PRD Key Entities 1 to 3, plus the values the screens show (calculated fields point at their Rule)
  - {"op": "add_node", "id": "ENT-installment-plan", "type": "Entity", "owner_fr": "FR-007B", "title": "Installment plan", "attrs": {"description": "The payment schedule for a booking. Total amount, currency and exchange rate are read-only copies of the accepted snapshot. Resolves the AcceptanceEvent, accepted parent quote and subquote ids and versions through its booking (FR-007 REQ-007-019). Belongs to one booking, has many installment payments, linked to one patient payment method."}}
  - {"op": "add_field", "id": "ENT-installment-plan.booking_id", "entity_id": "ENT-installment-plan", "name": "booking_id", "data_type": "id", "title": "Booking ID", "owner_fr": "FR-007B", "required": true, "attrs": {"description": "The booking the plan belongs to (FR-006)."}}
  - {"op": "add_field", "id": "ENT-installment-plan.total_amount", "entity_id": "ENT-installment-plan", "name": "total_amount", "data_type": "money", "title": "Total amount", "owner_fr": "FR-007B", "required": true, "calculated_by": "REQ-007B-025", "attrs": {"description": "Booking total (accepted price after promotion); read-only copy of the accepted snapshot; never recomputed."}}
  - {"op": "add_field", "id": "ENT-installment-plan.currency", "entity_id": "ENT-installment-plan", "name": "currency", "data_type": "currency", "title": "Currency", "owner_fr": "FR-007B", "required": true, "calculated_by": "REQ-007B-025", "attrs": {"description": "Accepted patient currency; read-only copy of the accepted snapshot; used for every installment."}}
  - {"op": "add_field", "id": "ENT-installment-plan.exchange_rate", "entity_id": "ENT-installment-plan", "name": "exchange_rate", "data_type": "exchange rate", "title": "Exchange rate", "owner_fr": "FR-007B", "required": true, "calculated_by": "REQ-007B-025", "attrs": {"description": "Exchange rate from the accepted snapshot; read-only."}}
  - {"op": "add_field", "id": "ENT-installment-plan.installment_count", "entity_id": "ENT-installment-plan", "name": "installment_count", "data_type": "int", "title": "Number of installments", "owner_fr": "FR-007B", "required": true, "attrs": {"description": "The patient's chosen number of installments, 2 to 9, not above the maximum available."}}
  - {"op": "add_field", "id": "ENT-installment-plan.installment_amount", "entity_id": "ENT-installment-plan", "name": "installment_amount", "data_type": "money", "title": "Installment amount", "owner_fr": "FR-007B", "required": true, "calculated_by": "REQ-007B-004", "attrs": {"description": "Amount per installment: booking total divided by installment count, rounded to 2 decimal places."}}
  - {"op": "add_field", "id": "ENT-installment-plan.cutoff_days", "entity_id": "ENT-installment-plan", "name": "cutoff_days", "data_type": "int", "title": "Cutoff days", "owner_fr": "FR-007B", "required": true, "attrs": {"description": "Days before the procedure by which the final installment must complete; minimum 30, configured in FR-029; fixed per plan at creation."}}
  - {"op": "add_field", "id": "ENT-installment-plan.created_at", "entity_id": "ENT-installment-plan", "name": "created_at", "data_type": "datetime", "title": "Creation date", "owner_fr": "FR-007B", "required": true}
  - {"op": "add_field", "id": "ENT-installment-plan.status", "entity_id": "ENT-installment-plan", "name": "status", "data_type": "enum", "title": "Plan status", "owner_fr": "FR-007B", "required": true, "attrs": {"description": "Key Entities lists active, completed, defaulted, canceled; the screens list Active, Completed, Overdue, Defaulted. Both lists are recorded; see the report question on plan status values."}}
  - {"op": "add_enum_value", "field_id": "ENT-installment-plan.status", "value": "active", "label": "Active", "sort_order": 0}
  - {"op": "add_enum_value", "field_id": "ENT-installment-plan.status", "value": "completed", "label": "Completed (shown as Fully Paid)", "sort_order": 1}
  - {"op": "add_enum_value", "field_id": "ENT-installment-plan.status", "value": "defaulted", "label": "Defaulted", "sort_order": 2}
  - {"op": "add_enum_value", "field_id": "ENT-installment-plan.status", "value": "canceled", "label": "Canceled", "sort_order": 3}
  - {"op": "add_enum_value", "field_id": "ENT-installment-plan.status", "value": "overdue", "label": "Overdue", "sort_order": 4}
  - {"op": "add_field", "id": "ENT-installment-plan.payment_method_id", "entity_id": "ENT-installment-plan", "name": "payment_method_id", "data_type": "id", "title": "Payment method ID", "owner_fr": "FR-007B", "required": true, "attrs": {"description": "The one patient payment method the plan is linked to."}}
  - {"op": "add_field", "id": "ENT-installment-plan.days_until_procedure", "entity_id": "ENT-installment-plan", "name": "days_until_procedure", "data_type": "int", "title": "Time until procedure (days)", "owner_fr": "FR-007B", "required": true, "calculated_by": "REQ-007B-002", "attrs": {"description": "Days remaining until the procedure."}}
  - {"op": "add_field", "id": "ENT-installment-plan.max_installments", "entity_id": "ENT-installment-plan", "name": "max_installments", "data_type": "int", "title": "Maximum installments", "owner_fr": "FR-007B", "required": true, "calculated_by": "REQ-007B-002", "attrs": {"description": "Calculated maximum number of installments available, 2 to 9; the PRD gives (days until procedure minus 30) divided by 30; see the report question on the formula."}}
  - {"op": "add_field", "id": "ENT-installment-plan.final_payment_deadline", "entity_id": "ENT-installment-plan", "name": "final_payment_deadline", "data_type": "date", "title": "Final payment deadline", "owner_fr": "FR-007B", "required": true, "calculated_by": "REQ-007B-003", "attrs": {"description": "Date by which all installments must be completed; must meet the configured cutoff rule."}}
  - {"op": "add_field", "id": "ENT-installment-plan.installments_paid", "entity_id": "ENT-installment-plan", "name": "installments_paid", "data_type": "int", "title": "Installments paid", "owner_fr": "FR-007B", "required": true, "calculated_by": "REQ-007B-094", "attrs": {"description": "Count of completed installments, 0 to total."}}
  - {"op": "add_field", "id": "ENT-installment-plan.installments_remaining", "entity_id": "ENT-installment-plan", "name": "installments_remaining", "data_type": "int", "title": "Installments remaining", "owner_fr": "FR-007B", "required": true, "calculated_by": "REQ-007B-094", "attrs": {"description": "Total minus paid."}}
  - {"op": "add_field", "id": "ENT-installment-plan.completion_percentage", "entity_id": "ENT-installment-plan", "name": "completion_percentage", "data_type": "decimal", "title": "Completion percentage", "owner_fr": "FR-007B", "required": true, "calculated_by": "REQ-007B-094", "attrs": {"description": "Percentage of the total amount collected, 0 to 100 percent, auto-calculated."}}
  - {"op": "add_field", "id": "ENT-installment-plan.next_payment_date", "entity_id": "ENT-installment-plan", "name": "next_payment_date", "data_type": "date", "title": "Next payment date", "owner_fr": "FR-007B", "required": false, "calculated_by": "REQ-007B-094", "attrs": {"description": "Date of the next scheduled installment; only when installments remaining is above 0."}}
