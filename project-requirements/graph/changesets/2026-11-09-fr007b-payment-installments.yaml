  - {"op": "add_field", "id": "ENT-installment-payment.reminder_status", "entity_id": "ENT-installment-payment", "name": "reminder_status", "data_type": "enum", "title": "Reminder status", "owner_fr": "FR-007B", "required": false, "attrs": {"description": "Whether the 3-day reminder was sent or is still pending; shown to the patient."}}
