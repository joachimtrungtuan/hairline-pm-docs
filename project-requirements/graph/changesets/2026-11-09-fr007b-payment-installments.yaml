  - {"op": "add_node", "id": "ENT-installment-payment", "type": "Entity", "owner_fr": "FR-007B", "title": "Installment payment", "attrs": {"description": "A single scheduled or completed installment charge. Belongs to one installment plan; linked to a payment transaction record."}}
