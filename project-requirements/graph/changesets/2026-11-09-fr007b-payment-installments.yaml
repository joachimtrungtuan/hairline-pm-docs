  - {"op": "add_node", "id": "ENT-installment-plan-metrics", "type": "Entity", "owner_fr": "FR-007B", "title": "Installment plan metrics", "attrs": {"description": "Aggregate figures the admin dashboard shows across all plans. Not a stored record: created because the screen fields have no other owning entity; each value is calculated by the dashboard rule."}}
  - {"op": "add_field", "id": "ENT-installment-plan-metrics.active_plans_count", "entity_id": "ENT-installment-plan-metrics", "name": "active_plans_count", "data_type": "int", "title": "Active plans count", "owner_fr": "FR-007B", "required": true, "calculated_by": "REQ-007B-075", "attrs": {"description": "Total installment plans currently active; non-negative integer."}}
  - {"op": "add_field", "id": "ENT-installment-plan-metrics.overdue_installments_count", "entity_id": "ENT-installment-plan-metrics", "name": "overdue_installments_count", "data_type": "int", "title": "Overdue installments", "owner_fr": "FR-007B", "required": true, "calculated_by": "REQ-007B-075", "attrs": {"description": "Count of failed installments after retries; flagged for admin action."}}
  - {"op": "add_field", "id": "ENT-installment-plan-metrics.total_installment_revenue", "entity_id": "ENT-installment-plan-metrics", "name": "total_installment_revenue", "data_type": "money", "title": "Total installment revenue", "owner_fr": "FR-007B", "required": true, "calculated_by": "REQ-007B-075", "attrs": {"description": "Sum of all installment payments collected across all bookings."}}
  - {"op": "add_field", "id": "ENT-installment-plan-metrics.average_installments", "entity_id": "ENT-installment-plan-metrics", "name": "average_installments", "data_type": "decimal", "title": "Average installments", "owner_fr": "FR-007B", "required": true, "calculated_by": "REQ-007B-075", "attrs": {"description": "Average number of installments selected."}}
