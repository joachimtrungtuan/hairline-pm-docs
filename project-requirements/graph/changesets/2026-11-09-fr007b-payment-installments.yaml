  # --- Events: the notifications the PRD names, each produced at the Payment stage (single producer, D7)
  - {"op": "add_node", "id": "EVT-installment-reminder-due", "type": "Event", "owner_fr": "FR-007B", "title": "Installment reminder due", "attrs": {"description": "Reminder to the patient 3 days before each installment due date, by email and push (REQ-007B-014)."}}
  - {"op": "add_node", "id": "EVT-installment-charged", "type": "Event", "owner_fr": "FR-007B", "title": "Installment charged", "attrs": {"description": "Confirmation to the patient after a successful installment charge, by email and push (REQ-007B-016)."}}
  - {"op": "add_node", "id": "EVT-installment-failed", "type": "Event", "owner_fr": "FR-007B", "title": "Installment charge failed", "attrs": {"description": "Immediate notice to the patient that an installment charge failed, with a clear error message (REQ-007B-017)."}}
  - {"op": "add_node", "id": "EVT-installment-plan-defaulted", "type": "Event", "owner_fr": "FR-007B", "title": "Installment plan defaulted", "attrs": {"description": "Admin alert that a plan is Defaulted after three failed retries and the booking is overdue (REQ-007B-020)."}}
  - {"op": "add_node", "id": "EVT-installment-plan-completed", "type": "Event", "owner_fr": "FR-007B", "title": "Installment plan completed", "attrs": {"description": "Booking status change notification sent when the final installment completes (communication scope, final installment)."}}
  # --- Screens: SCR-007B-01..06 in PRD order; screens own no fields, the shows edges carry them (D15)
  - {"op": "add_node", "id": "SCR-007B-01", "type": "Screen", "owner_fr": "FR-007B", "title": "Patient Checkout - Installment Plan Selection", "attrs": {"platform": "patient", "description": "Allow the patient to select an installment plan at booking checkout. Reached from the Payment Options step (FR-006/FR-007) after the patient selects Pay in Installments; shows the full schedule and an interest-free highlight, a Pay in Full alternative, a plan versus full payment comparison and a calculator. UI controls: installment selector, calculator, Pay in Full option, confirm."}}
  - {"op": "add_node", "id": "SCR-007B-02", "type": "Screen", "owner_fr": "FR-007B", "title": "Patient Booking Details - Installment Schedule View", "attrs": {"platform": "patient", "description": "Allow the patient to view the installment payment schedule and history from the booking details screen. UI controls: progress bar, countdown, Update Payment Method button (opens P03.1 Payment Methods Management; the Business Rules also name an Update Card button), receipt download."}}
  - {"op": "add_node", "id": "SCR-007B-03", "type": "Screen", "owner_fr": "FR-007B", "title": "Provider Installment Plans Overview", "attrs": {"platform": "provider", "description": "Let the provider see all their bookings that use installment plans, with high-level status and risk indicators; read-only. UI controls: Booking ID link to the shared detail screen, plan status and date range filters, sort."}}
  - {"op": "add_node", "id": "SCR-007B-04", "type": "Screen", "owner_fr": "FR-007B", "title": "Provider Booking Installment Plan Detail", "attrs": {"platform": "provider", "description": "Read-only view of one booking's installment plan, schedule and payment history. The Installment Schedule table has one row per installment; the overdue or defaulted support banner is described by a Rule."}}
  - {"op": "add_node", "id": "SCR-007B-05", "type": "Screen", "owner_fr": "FR-007B", "title": "Admin Installment Plan Management Dashboard", "attrs": {"platform": "admin", "description": "Monitor and manage all installment plans across the platform: metric widgets, a filterable and sortable plan list, aging report, revenue forecast, export and drill-down. UI controls: widgets, filters, export, contact patient, retry, cancel booking actions."}}
  - {"op": "add_node", "id": "SCR-007B-06", "type": "Screen", "owner_fr": "FR-007B", "title": "Admin Booking Installment Plan Detail", "attrs": {"platform": "admin", "description": "Actionable view of one booking's installment plan with the Admin Action Panel (Retry Charge, Mark as Resolved, Cancel Plan and Apply Cancellation Policy), each with a justification of at least 20 characters. The panel is a UI control group; its justification is written to the audit log (S-06), not to a graph entity."}}
