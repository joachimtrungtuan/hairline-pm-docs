  - {"op": "add_field", "id": "ENT-installment-payment.installment_number", "entity_id": "ENT-installment-payment", "name": "installment_number", "data_type": "int", "title": "Installment number", "owner_fr": "FR-007B", "required": true, "attrs": {"description": "Sequence number 1 to N, at most 9."}}
  - {"op": "add_field", "id": "ENT-installment-payment.due_date", "entity_id": "ENT-installment-payment", "name": "due_date", "data_type": "date", "title": "Due date", "owner_fr": "FR-007B", "required": true, "calculated_by": "REQ-007B-006", "attrs": {"description": "Scheduled charge date; first installment is today, later ones at 30-day intervals."}}
