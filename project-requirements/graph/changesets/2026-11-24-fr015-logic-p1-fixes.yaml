  - {"op": "update_node", "id": "REQ-015-032", "attrs": {"statement": "Deactivation is permanent—deactivated providers cannot be reactivated; admin must create new provider account if re-onboarding required. Deactivation frees the provider's emails: Contact Email uniqueness counts only Active and Suspended providers, and login Email follows the FR-009 global provider email identity rule (Rule 3, REQ-009-008), under which the Owner, team member, and pending-invitation emails of a Deactivated provider are freed. The new account may reuse those emails; the deactivated record and its history are retained unchanged, and Screen 3 Tab 1 is read-only."}}
  - {"op": "update_node", "id": "REQ-015-056", "attrs": {"statement": "System validates email exists in provider database, account status is Active or Suspended, and the password is not yet set. If provider email not found, the account is Deactivated, or the account already has a password set, system displays generic message: \"If an account exists with this email, an activation link will be sent.\" (security: don't reveal if email exists)."}}
  - {"op": "update_node", "id": "REQ-015-058", "attrs": {"statement": "\"Resend Activation Email\" (requires the FR-031 Edit Providers permission; visible only if password not yet set and status is Active or Suspended, so it is hidden for Deactivated providers; a Suspended clinic can set its password but stays read-only per FR-032 Rule 6; matches Alternative Flow A1; sends new one-time password setup link)"}}
  - {"op": "update_node", "id": "REQ-015-087", "attrs": {"statement": "If the admin rejects the request instead (e.g., the provider withdraws it), the admin enters review notes (required, min 20 chars); the request is marked Rejected, the provider keeps its current status, the Closure Requested marker clears, and the provider receives the FR-020 `provider.closure_rejected` email with the review notes (mandatory)."}}
  - {"op": "update_node", "id": "REQ-015-114", "attrs": {"statement": "Changing the Email Address (the Owner's login ID) requires admin password re-authentication and a reason (the admin change reason above). The new address is validated against the FR-009 global provider email identity rule (REQ-015-014) before saving. The Owner does not confirm the new address. On save, the system: sends FR-020 `provider.login_email_changed` (mandatory security notice) to the old address, saying the login email was changed to the new address (partly masked) by a Hairline admin, with the date and time and a prompt to contact support if unexpected, and to the new address, saying it is now the login email for the clinic; signs the Owner out of all sessions and revokes the Owner's tokens; if `password_set` is false, invalidates the pending activation link and sends a new activation email (FR-020 `provider.activation`) to the new address; this email is sent only when the provider status is Active or Suspended, because Tab 1 is read-only for a Deactivated provider. An admin Owner handover (FR-009 Rule 11, REQ-009-174) applies these same steps to the new Owner's email: admin re-authentication, a reason, notices to the old and new address, and the old Owner signed out; if `password_set` is false, the pending activation link is invalidated and a new activation email goes to the new Owner automatically."}}
  - {"op": "update_node", "id": "REQ-015-116", "attrs": {"statement": "Invite is blocked when the provider's Seat Limit (Rule 7) is reached and when provider status is Suspended or Deactivated. \"Invite Staff Member\": admin enters an email and selects one of the provider's existing roles (not Owner); the invitation uses FR-009's normal invitation email, acceptance, and expiry flow. Requires the FR-031 \"Edit Providers\" permission; the invite and the inviting admin are logged in FR-009's audit trail and Tab 8. The FR-009 admin actions (force suspend member, reset invitation, Owner handover, view audit log, impersonate) remain available for Active and Suspended providers; for a Deactivated provider only \"view audit log\" remains, and impersonation follows the Login as Provider rules (REQ-015-121). Owner handover (FR-009 REQ-009-174) is available for Active and Suspended providers and unavailable for Deactivated providers, and needs the Edit Providers permission and admin re-authentication."}}
  - {"op": "update_node", "id": "ENT-provider.starting_price", "attrs": {"description": "Calculated, not typed in: the lowest standard price (ENT-package.standard_price, FR-024) among the provider's active packages, shown in the package's own currency; conversion to the patient's currency happens only on patient-facing screens. Shown read-only in Screen 3 Tab 1."}}
