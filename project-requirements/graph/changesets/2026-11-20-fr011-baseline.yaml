reason: "Requirements graph programme baseline 2026-11-20: owner rulings applied (FR-011)"
by: controller
operations:
  # --- Event ownership: the three aftercare reminder events move to the notification FR ---
  - {op: update_node, id: EVT-aftercare-milestone-due, owner_fr: FR-030}
  - {op: update_node, id: EVT-aftercare-scan-missed, owner_fr: FR-030}
  - {op: update_node, id: EVT-aftercare-questionnaire-missed, owner_fr: FR-030}

  # --- Overdue is a flag, not a status ---
  - {op: retire_enum_value, field_id: ENT-aftercare-plan.status, value: overdue}
  - {op: retire_enum_value, field_id: ENT-aftercare-task.status, value: overdue}
  - op: add_field
    id: ENT-aftercare-plan.overdue_flag
    entity_id: ENT-aftercare-plan
    name: overdue_flag
    data_type: bool
    title: Overdue flag
    owner_fr: FR-011
    attrs: {description: "Set on a case that has overdue tasks; shown next to the case status, which is Active, Completed or Cancelled (Screen 13)."}
  - op: add_field
    id: ENT-aftercare-task.overdue_flag
    entity_id: ENT-aftercare-task
    name: overdue_flag
    data_type: bool
    title: Overdue flag
    owner_fr: FR-011
    attrs: {description: "Set 24 hours after the due date while the task is not completed; the task status stays Pending or Completed (Screens 3 and 12)."}
  - {op: add_edge, from: SCR-011-13, verb: shows, to: ENT-aftercare-plan.overdue_flag, attrs: {provenance: system calculated, label: Overdue flag}}
  - {op: add_edge, from: SCR-011-03, verb: shows, to: ENT-aftercare-task.overdue_flag, attrs: {provenance: system calculated, label: Overdue flag}}
  - {op: add_edge, from: SCR-011-12, verb: shows, to: ENT-aftercare-task.overdue_flag, attrs: {provenance: system calculated, label: Overdue flag}}

  # --- Pricing option is separate from payment method ---
  - op: add_field
    id: ENT-aftercare-request.pricing_option
    entity_id: ENT-aftercare-request
    name: pricing_option
    data_type: enum
    title: Pricing option
    owner_fr: FR-011
  - {op: add_enum_value, field_id: ENT-aftercare-request.pricing_option, value: fixed, label: Fixed price, sort_order: 0}
  - {op: add_enum_value, field_id: ENT-aftercare-request.pricing_option, value: subscription, label: Monthly subscription, sort_order: 1}
  - op: add_field
    id: ENT-aftercare-request.payment_method
    entity_id: ENT-aftercare-request
    name: payment_method
    data_type: enum
    title: Payment method
    owner_fr: FR-011
  - {op: add_enum_value, field_id: ENT-aftercare-request.payment_method, value: card, label: Credit or debit card, sort_order: 0}
  - {op: add_enum_value, field_id: ENT-aftercare-request.payment_method, value: paypal, label: PayPal, sort_order: 1}
  - op: add_field
    id: ENT-aftercare-template.default_pricing_option
    entity_id: ENT-aftercare-template
    name: default_pricing_option
    data_type: enum
    title: Default pricing option
    owner_fr: FR-011
  - {op: add_enum_value, field_id: ENT-aftercare-template.default_pricing_option, value: fixed, label: Fixed price, sort_order: 0}
  - {op: add_enum_value, field_id: ENT-aftercare-template.default_pricing_option, value: subscription, label: Subscription, sort_order: 1}
  - {op: remove_edge, from: SCR-011-06, verb: shows, to: ENT-aftercare-request.payment_plan_type}
  - {op: remove_edge, from: SCR-011-07, verb: shows, to: ENT-aftercare-request.payment_plan_type}
  - {op: remove_edge, from: SCR-011-15, verb: shows, to: ENT-aftercare-request.payment_plan_type}
  - {op: remove_edge, from: SCR-011-07, verb: shows, to: ENT-aftercare-request.payment_instrument}
  - {op: remove_edge, from: SCR-011-15, verb: shows, to: ENT-aftercare-request.payment_instrument}
  - {op: remove_edge, from: SCR-011-16, verb: shows, to: ENT-aftercare-template.default_payment_method}
  - {op: add_edge, from: SCR-011-06, verb: shows, to: ENT-aftercare-request.pricing_option, attrs: {provenance: user input, label: Pricing Option / Selected Pricing Option}}
  - {op: add_edge, from: SCR-011-07, verb: shows, to: ENT-aftercare-request.pricing_option, attrs: {provenance: carried from previous screen, label: Pricing Option Selected}}
  - {op: add_edge, from: SCR-011-15, verb: shows, to: ENT-aftercare-request.pricing_option, attrs: {provenance: retrieved, label: Pricing Option}}
  - {op: add_edge, from: SCR-011-07, verb: shows, to: ENT-aftercare-request.payment_method, attrs: {provenance: user input, label: Payment Method Selection}}
  - {op: add_edge, from: SCR-011-15, verb: shows, to: ENT-aftercare-request.payment_method, attrs: {provenance: retrieved, label: Payment Method}}
