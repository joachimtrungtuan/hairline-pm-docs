  - {op: retire_node, id: ENT-aftercare-request.payment_instrument}
  - {op: retire_node, id: ENT-aftercare-template.default_payment_method}

  # --- One platform fee, taken from the price, never shown as an extra charge ---
  - {op: remove_edge, from: SCR-011-07, verb: shows, to: ENT-aftercare-request.platform_fee}
  - op: update_node
    id: ENT-aftercare-request.platform_fee
    attrs: {description: "The platform fee is one amount under the commission rate setting, taken out of the aftercare price and never added to the patient's total; Screen 7 does not show it."}

  # --- Surgeon notes are read from the FR-010 conclusion notes ---
  - {op: remove_edge, from: SCR-011-15, verb: shows, to: ENT-aftercare-request.surgeon_notes}
  - {op: add_edge, from: SCR-011-15, verb: shows, to: ENT-aftercare-request.surgeon_notes, attrs: {provenance: inherited from another FR, label: Surgeon Notes}}

  # --- Adherence period is calculated from the doses, so the stored scheduled_at goes ---
  - {op: remove_edge, from: SCR-011-09, verb: shows, to: ENT-aftercare-dose.scheduled_at}
  - {op: retire_node, id: ENT-aftercare-dose.scheduled_at}

  # --- Standalone aftercare order: request, admin assigns, provider configures, payment activates ---
