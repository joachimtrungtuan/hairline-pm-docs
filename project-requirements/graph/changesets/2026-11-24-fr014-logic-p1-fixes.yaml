  - {"op": "update_node", "id": "REQ-014-084", "attrs": {"statement": "System MUST display emerging patient origins table (countries with >20% inquiry growth vs. prior period and >10 inquiries in current period; a zero prior period with more than 10 current inquiries shows \"New\" and qualifies)"}}
  - {"op": "update_node", "id": "REQ-014-116", "attrs": {"statement": "System MUST count the booking load figure on Screen 1 B3 and its heatmap from FR-006 Bookings whose appointment falls on the day and whose status is `Confirmed`, `In Progress`, `Aftercare` or `Completed`, label it \"Scheduled bookings\", and never count held (`Accepted`), `Payment Window Expired` or `Cancelled` bookings or show a separate held figure. Country booking figures on B4, Screen 3 Widget 1 and Screen 10 Widget 1 keep the Confirmed booking milestone meaning"}, "title": "Scheduled bookings load figure counts Confirmed, In Progress, Aftercare or Completed by appointment date"}
  - {"op": "update_node", "id": "REQ-014-126", "attrs": {"statement": "Provider \"Analytics\" nav item opens the first of Screens 2, 3, 4 and 5 the role can see, and is hidden when the role can see none; Screen 1 (Main Dashboard) is the platform landing page, not the analytics section entry; admin \"Analytics\" nav item opens the first of Screens 7 to 13 the admin may see (Screen 7, Platform Overview, for an admin who holds View Analytics Dashboard), and is hidden when the admin may see none; \"Export Report\" button is available on Screens 2 to 5 only, Screen 1 has no Export button, and admins have no analytics export in this version"}}
  - {"op": "update_node", "id": "REQ-014-127", "attrs": {"statement": "A2 — Export from Screens 2 to 5: Provider clicks \"Export\" button → reaches Screen 6 pre-populated with the current screen's section selected. Screen 1 has no Export button."}, "title": "Export from Screens 2 to 5 pre-populates Screen 6"}
  - {"op": "update_node", "id": "REQ-014-135", "attrs": {"statement": "Use inquiry `created_at` to select the inquiry cohort. Provider views count distinct `(providerId, inquiryId)` pairs assigned to that provider; platform views count distinct Inquiry IDs across providers, not the sum of provider totals. Quoted means at least one parent was submitted; Accepted means an AcceptanceEvent exists for that inquiry and, in provider views, that provider; Confirmed booking means the first successful initial charge of the option the patient chose (full payment, deposit, or first installment) confirmed the FR-006 Booking. Each inquiry contributes at most once to each reached stage and cumulatively to preceding stages. Inquiries have no treatment (the provider chooses it in the parent quote), so treatment segments start at Quoted and use the parent/accepted booking's treatment; unquoted inquiries count only in all-treatments views. Deduplicate within each segment. Later cancellation does not erase a reached milestone; cancellation and no-show metrics remain separate. `In Progress` is a procedure-start milestone, never a synonym for payment confirmation."}}
  - {"op": "update_node", "id": "REQ-014-139", "attrs": {"statement": "At the displayed snapshot time, include only Accepted FR-006 pending bookings with a non-superseded AcceptanceEvent, valid exclusive slot hold, and no successful initial payment. Scope the time filter by acceptance time, calculate age from immutable `acceptedAt`, and validate the actual configured hold deadline. Remove cancelled, expired-hold, and `Payment Window Expired` selections even before stale quote status caches update; do not restart age on payment retries. When an admin revives an expired booking it re-enters these figures and its age counts from the start of its current hold. Sum each eligible accepted total price once as potential accepted booking value, not deposit receivables, captured revenue, or outstanding installment balances."}}
  - {"op": "update_node", "id": "REQ-014-161", "attrs": {"statement": "Default provider-role access to the provider analytics screens, using the FR-009 roles. The matrix states the default data-domain grants only; actual visibility is always resolved through Rules 15A and 15B, so a role whose permissions are changed sees whatever its granted data domains allow. Screens or sections a role cannot see are hidden from navigation, not shown as locked. The Analytics nav item opens the first of Screens 2, 3, 4 and 5 the role can see and is hidden when it can see none; Screen 1 renders only the sections the role may see, and a role with no visible section sees \"No analytics available for your role\". Screen 1 Main Dashboard — Sections A and B (inbox and performance): Owner: Full; Manager: Full; Billing Staff: Hidden; Clinical Staff: Hidden; Screen 1 Main Dashboard — Section C (financials): Owner: Full; Manager: Only with financial permission; Billing Staff: Full; Clinical Staff: Hidden; Screen 2 Performance & Conversion: Owner: Full; Manager: Full; Billing Staff: Hidden; Clinical Staff: Hidden; Screen 3 Patient Analytics: Owner: Full; Manager: Full; Billing Staff: Hidden; Clinical Staff: Satisfaction and aftercare widgets only; Screen 4 Finance & Payouts: Owner: Full; Manager: Only with financial permission; Billing Staff: Full; Clinical Staff: Hidden; Screen 5 Pricing & Benchmarks: Owner: Full; Manager: Full; Billing Staff: Full; Clinical Staff: Hidden; Screen 6 Export Report Configuration: Owner: Full; Manager: Exports limited to the screens and widgets the user can see; Billing Staff: Exports limited to the screens and widgets the user can see; Clinical Staff: Exports limited to the screens and widgets the user can see (Screen 3 exports contain only the satisfaction and aftercare widgets)"}}
  - {"op": "update_node", "id": "REQ-014-183", "attrs": {"statement": "Value: p50 and p90 vs SLA (compact dual-bullet); Color: Green (p50 ≤ SLA and p90 ≤ 2×SLA) · Amber (p50 ≤ SLA and p90 > 2×SLA) · Red (p50 > SLA); Tap → the FR-003 provider inquiry list filtered to the inquiries in the period; response time is per provider, not per team member"}}
  - {"op": "update_node", "id": "REQ-014-187", "attrs": {"statement": "Chart: Bullet chart (p50 + p90, SLA as target marker); Axis: 0 → max(3×SLA, 1.2×p90), units = minutes (render h:m); Color: Green/Amber/Red per TTFQ formula above; Drill-down: click → the FR-003 provider inquiry list filtered to the inquiries in the period"}}
  - {"op": "update_node", "id": "REQ-014-188", "attrs": {"statement": "Chart: Calendar heatmap (6 rows × 7 cols, Mon→Sun); Colored metric: Intensity Index = `(Bookings_on_day ÷ MonthlyDailyAvg_for_that_day's_month) × 100`; `Bookings_on_day` counts FR-006 Bookings whose appointment falls on that day and whose status is `Confirmed`, `In Progress`, `Aftercare` or `Completed` (the \"Scheduled bookings\" figure; \"Confirmed bookings\" elsewhere keeps the payment-milestone meaning). Held bookings (`Accepted`), `Payment Window Expired` and `Cancelled` bookings never count, and no separate held figure is shown. The monthly average uses the same status filter. Color scale: ≤50% Cool · 50–90% Below avg · 90–110% Neutral · 110–150% Above avg · >150% Hot; Cell tooltip: `Scheduled bookings: N • Monthly avg: m/day • Index: X%`; Drill-down: click cell → Schedule day view; Baseline priority: 12-month same-month avg → current MTD → rolling 90-day; Index clamped 0–300% for coloring; actual value in tooltip"}}
  - {"op": "update_node", "id": "REQ-014-192", "attrs": {"statement": "Chart: Stacked horizontal bar; Buckets: 0–24h · 1–3d · 4–7d · 8–14d · >14d; X = count of accepted selections awaiting successful initial payment; optional legend by treatment (top 3) or country; Age = snapshot time − `AcceptanceEvent.acceptedAt`, or the start of the current hold when an admin has revived an expired booking; count one pending Booking/AcceptanceEvent with a valid exclusive payment-window hold. Exclude cancelled selections, superseded acceptance events, expired holds, and `Payment Window Expired` bookings, even if a flat quote status still says Accepted. Drill-down: click bucket → Accepted Quotes list resolved to the exact accepted subquote and pending booking; retain the same chart and buckets. Older buckets may legitimately be empty with the default 48-hour hold; use the actual configured deadline, not an assumed fixed limit."}}
  - {"op": "update_node", "id": "REQ-014-193", "attrs": {"statement": "Chart: Column bar (monthly, last 6–12 months) + inline table (2–3 rows); Inline table columns: Type, Period, Amount, Scheduled Date, Cadence; Type = the provider display status from the Screen 4 Widget 8 FR-017 mapping (Upcoming / Processing / Paid / Failed; Voided is never shown). Rows: the next Upcoming payout, any Processing or Failed payout, then the most recent Paid payout, up to 3 rows. Scheduled Date = FR-017 scheduled payout date; for Paid rows it shows the paid date. Cadence = how the payout is released (see Assumption 5), not a per-clinic frequency. Definition only; columns and layout unchanged; Fixed window: this tile ignores the time range filter; Drill-down: click bar → Payout statements list (CSV/PDF export)"}}
  - {"op": "update_node", "id": "REQ-014-200", "attrs": {"statement": "Chart type: Two KPI tiles + trend sparklines; Tile 1: Cancellation rate = cancelled (post-confirmed) ÷ confirmed bookings; Tile 2: No-show rate = no-show ÷ confirmed bookings; Sparkline: Rate trend over selected period; Drill-down: Click Cancellation tile → Bookings list filtered to post-confirmation cancellations (FR-006); click No-show tile → Cases list filtered to FR-010 closure reason `No-show`; Data source: Cancellations come from post-confirmation cancellations in the FR-006 Booking lifecycle. No-shows come from FR-010 case closures with closure reason `No-show`; No-show is an admin-managed case closure label, not a booking pipeline status. Each confirmed booking counts at most once, and a booking closed as No-show counts as a no-show, not a cancellation. Draft/quote expiry and `Payment Window Expired` before confirmation are not post-confirmation cancellations or no-shows. Historical acceptance remains recorded separately. Both rates use the confirmation cohort, like Screen 11 Widget 1: the denominator is the bookings first confirmed in the period, and the numerators are the cancellations and no-shows among those same bookings, whenever they occur."}}
  - {"op": "update_node", "id": "REQ-014-214", "attrs": {"statement": "Chart type: Three KPI tiles + trend line (both on same chart); Tile 1: Total income (gross); Tile 2: Commission deducted; Tile 3: \"Income after commission (before refunds)\" = Total income (gross) − Commission deducted, for the same period; Trend: Gross income line + commission deducted area, stacked; Calculation: Commission deducted = sum of percentage-model deductions for each completed payment in range plus flat-rate deductions for each procedure completed in range (FR-010 completion, per FR-015). Each deduction uses the booking's commission snapshot taken at booking confirmation (FR-015 REQ-015-022, FR-029), not the provider's current commission settings: Percentage model: `payments.amount × (snapshot_commission_percentage / 100)`; Flat-rate model: `snapshot_commission_amount` once per completed procedure, regardless of procedure price, number of payments, or installments (FR-015); Gross, commission, and income after commission are displayed in provider currency. These tiles do not subtract refunds or reverse commission on refunded money; refunds are reported separately in Widget 5, and the platform reverses the commission on refunded money with the refund. Tile 3 tooltip: flat-rate commission is recognised at completion of the procedure."}, "title": "Screen 4 Widget 4 Commission and Income After Commission"}
  - {"op": "update_node", "id": "REQ-014-216", "attrs": {"statement": "Chart type: Donut + KPI summary; Segments: Payment option chosen: Full payment · Deposit plus balance · Installment plan; KPI: Avg number of installments for installment plans; Trend: Monthly installment adoption rate = bookings first confirmed in the month whose payment is an FR-007B installment plan ÷ all bookings first confirmed in the month (one observation per booking); Drill-down: Click segment → Bookings list filtered to that payment option; Data source: the donut and the trend both count bookings by the payment option the patient chose at confirmation, one observation per booking, so the two values use the same unit; FR-007B installment plan records supply the average installment count."}, "title": "Screen 4 Widget 6 Payment Option Split"}
  - {"op": "update_node", "id": "REQ-014-217", "attrs": {"statement": "Chart type: KPI tile + link to Main Dashboard Section C3 for full aging detail; Value: Sum of accepted subquote total prices for selections awaiting initial payment with a valid hold; label as potential accepted booking value, not captured revenue or outstanding installment debt; Count: Distinct pending bookings/AcceptanceEvents in each aging bucket, following Screen 1 C3 exclusions and deadline checks; Note: This is a summary view; the full aging stacked bar is in Screen 1 Section C3. Snapshot tile: it ignores the time range filter. A booking revived by an admin counts again, aged from the start of its current hold"}}
  - {"op": "update_node", "id": "REQ-014-218", "attrs": {"statement": "Chart type: Column bar chart (monthly, full history) + paginated table below; Bar chart: Last 12 months of disbursed payouts; Table columns: Period · Amount · Status (Upcoming / Processing / Paid / Failed) · Paid date · Cadence (how the payout is released, see Assumption 5); All rows: Full history (not limited to the 2–3 rows shown in the Main Dashboard Section C4 inline table); fixed window, so this widget ignores the time range filter; Drill-down: Click bar or row → Payout statement detail (CSV/PDF export); Payout status mapping (FR-017): Upcoming: No statement yet for the period, or Pending Approval, Approved, or Overdue (internal admin review states are not shown to providers); Processing: Processing (Stripe transfer initiated); Paid: Paid (`transfer.paid`); Paid date = webhook time; Failed: Failed (`transfer.failed`); returns to Processing when admin retries; (not shown): Voided — excluded from the provider's payout chart, table, totals, and exports. Voided is an internal admin audit state; the period appears as Upcoming again once FR-017 re-generates a statement on the next payout cycle"}}
  - {"op": "update_node", "id": "REQ-014-231", "attrs": {"statement": "Report type: Radio; Screens to include: Checkboxes for Screens 2 to 5 (a screen on which the user can see no widget cannot be selected); Date range: Date picker; Country filter: Dropdown; Treatment filter: Dropdown; Email delivery: Checkbox; Recipients: Multi-select; Schedule recurring: Checkbox + select"}}
  - {"op": "update_node", "id": "REQ-014-237", "attrs": {"statement": "Recurring failures: a failed run is retried up to 3 times at 30-minute intervals; after the final failure the run shows as Failed in Report History with a manual retry action. No partial report is emailed. A run that fails its final retry also sends the configuration owner an in-app \"recurring export failed\" notice (FR-030 and FR-020 own the notice)."}}
  - {"op": "update_node", "id": "REQ-014-238", "attrs": {"statement": "Recurring management: providers can edit, pause, resume, or delete a recurring configuration; edits apply from the next run. Recipients who are deactivated or lose permission are dropped automatically at the next run. Any user who can see every widget in a recurring configuration may edit or delete it. A configuration whose owner is removed, or loses access to every widget in it, is paused and the clinic Owner receives an in-app \"recurring export paused\" notice (FR-030 and FR-020 own the notice)."}}
  - {"op": "update_node", "id": "REQ-014-246", "attrs": {"statement": "Value: Platform-wide inquiry count in period; Sub-value: % change vs. prior equivalent period; a zero prior period shows \"New\" when the current count is above zero, otherwise N/A; Tap → Inquiries list (admin)"}}
  - {"op": "update_node", "id": "REQ-014-247", "attrs": {"statement": "Value: `patients.created_at` count in period; Sub-value: % change vs. prior equivalent period, with the same zero-prior rule as Tile 2; Tap → Patient Management (FR-016)"}}
  - {"op": "update_node", "id": "REQ-014-248", "attrs": {"statement": "Chart: Donut (Green / Amber / Red provider counts); Value: Count and % in each tier; a provider with no TTFQ observation in the period is shown as a separate grey \"No data\" tier with a text label and its count, kept out of the donut slices and out of the percentages of the three colour tiers; Tap → Screen 8 filtered to Red tier"}}
  - {"op": "update_node", "id": "REQ-014-254", "attrs": {"statement": "Value: `SUM(payments.amount)` where `payment_type ≠ 'refund'` and `payment_status IN ('completed', 'refunded')`, period (same GMV rule as Screen 12 Widget 1 and the Refund Source of Truth rule); Sub-value: % change vs. prior period, with the same zero-prior rule as Tile 2; Drill-down → Screen 12"}}
  - {"op": "update_node", "id": "REQ-014-255", "attrs": {"statement": "Value: Sum of effective provider commission deductions in period, using each booking's confirmation-time commission snapshot (FR-015 REQ-015-022): percentage per completed payment; flat rate once per completed procedure (FR-015); commission on refunded money is reversed with the refund, so the figure counts commission on money kept; Sub-value: As % of GMV; Drill-down → Screen 12"}}
  - {"op": "update_node", "id": "REQ-014-256", "attrs": {"statement": "Value: Total payout amount due to providers in next 30 days; Sub-value: Number of providers in next payout cycle; Fixed window (next 30 days): this tile ignores the time range filter; Drill-down → Screen 12"}}
  - {"op": "update_node", "id": "REQ-014-257", "attrs": {"statement": "Value: Total accepted subquote value in active pending initial-payment holds, platform-wide; same eligibility as Screen 1 C3 and Screen 4 Widget 7; Sub-value: Count of active pending selections >14 days aging (may be zero under the default 48-hour hold); expired windows are not active cash risk; a booking revived by an admin counts again, aged from the start of its current hold; snapshot tile: it ignores the time range filter; Drill-down → Screen 12"}}
  - {"op": "update_node", "id": "REQ-014-259", "attrs": {"statement": "Only Sections A and B and the GMV and commission tiles (C1 and C2) follow the time range filter; C3 (next 30 days) and C4 (snapshot) ignore it. In Section A: Tile 1 shows providers with `status = active` at the end of the selected period plus those onboarded within it; Tiles 2 and 3 count records created within the period, compared with the prior equivalent period; Tile 4 tiers providers from TTFQ observations in the period; Tile 5 uses the trailing Dormant threshold window (default 30 days) ending at the period end, with engagement status as at the period end"}, "title": "Screen 7 time range scope: Sections A and B and the GMV and commission tiles only"}
  - {"op": "update_node", "id": "REQ-014-260", "attrs": {"statement": "Provider: Name + country flag; TTFQ p50: Value + color badge; Conversion rate: Distinct provider inquiry cohort → Confirmed booking %; Quote acceptance rate: Distinct accepted parent quotes ÷ distinct submitted parent quotes in the same first-submission cohort; Avg overall rating: Star rating (from reviews); Quote response rate: Distinct distributed inquiries answered ÷ distinct inquiries distributed to this provider in the same distribution cohort; vs. Platform: Variance column for conversion rate (+/−%); Provider-fault replacements: Count of admin-authored replacement quotes created in the selected period for FR-006 provider-fault transfers away from this provider; shown on its own and never added to quote counts, conversion, or TTFQ; Status: Health badge: Red if TTFQ tier is Red or conversion is more than 10% below platform median; Amber if TTFQ tier is Amber or conversion is up to 10% below median; otherwise Green. If the provider has <30 inquiries (Rule 7), the badge uses TTFQ only and shows a low-sample marker. A provider with no TTFQ observation in the period shows the grey \"No data\" tier with a text label instead of a health badge. \"Platform median\" is the median of the Shared Benchmark Rule peer pool; Sortable by any column; Default sort: TTFQ status (Red first) then conversion rate ascending; Paginated: 20 per page; Drill-down: click row → provider's own analytics view (read-only admin view of provider's Screen 2)"}}
  - {"op": "update_node", "id": "REQ-014-261", "attrs": {"statement": "Chart type: Scatter plot; X axis: TTFQ p50 (minutes); Y axis: Conversion rate (%); Points: One per provider, labelled with the provider name (admin view, Rule 14); Reference lines: Platform median TTFQ · Platform median conversion rate (the Shared Benchmark Rule median); a provider with no TTFQ observation has no point on the scatter; Quadrants: Fast + High conversion (ideal) · Slow + Low conversion (needs support); Drill-down: Click point → that provider's detail"}}
  - {"op": "update_node", "id": "REQ-014-279", "attrs": {"statement": "Chart type: Ranked table; Columns: Country · Inquiry count (current period) · Inquiry count (prior period) · Growth %; Filter: Countries with >10 inquiries in current period and >20% growth vs prior period; when the prior period is zero and the current period is above 10, Growth % shows \"New\" and the country qualifies, and any other country with a zero prior period shows N/A and does not qualify; Purpose: Spot new markets before they become dominant"}}
  - {"op": "update_node", "id": "REQ-014-282", "attrs": {"statement": "Chart type: Grouped bar chart; X axis: Treatment type; Y axis: Rate %; Groups: Cancellation rate · No-show rate, both on the confirmation cohort (bookings first confirmed in the period); Drill-down: Click Cancellation bar → admin Bookings list filtered to post-confirmation cancellations (FR-006) for that treatment; click No-show bar → admin Cases list filtered to FR-010 closure reason `No-show` for that treatment"}}
  - {"op": "update_node", "id": "REQ-014-288", "attrs": {"statement": "No-show rate uses FR-010 case closures with closure reason `No-show` (admin-managed case closure label, not a booking pipeline status) over the bookings first confirmed in the period (the confirmation cohort, like Widget 1); cancellation rate uses post-confirmation cancellations from the FR-006 Booking lifecycle over the same cohort. A booking closed as No-show counts as a no-show, not a cancellation"}}
  - {"op": "update_node", "id": "REQ-014-290", "attrs": {"statement": "Chart type: Dual-line area chart; X axis: Month; Y₁ series: Platform GMV (gross payment volume); Y₂ series: Net revenue (platform commission earned in period, accrual basis); Tooltip: GMV · Refunds completed in period · Net GMV (GMV − refunds) · Net revenue; Drill-down: Click period → detailed payment records; Calculation: GMV = `SUM(payments.amount)` where `payment_type ≠ 'refund'` and `payment_status IN ('completed', 'refunded')` (gross captured volume; refund rows are neither added nor subtracted, and a later refund does not remove the original payment). Net GMV = GMV − completed refund rows in the same period, per the Refund Source of Truth rule, so each refund is subtracted exactly once. Net revenue = platform commission earned in the period, using the Widget 2 formula (percentage per completed payment; flat rate once per completed procedure). Net revenue is counted on money kept: the commission on a refunded amount is reversed with the refund. Payout timing does not affect net revenue."}}
  - {"op": "update_node", "id": "REQ-014-291", "attrs": {"statement": "Chart type: Bar chart (monthly); X axis: Month; Y axis: Commission earned = sum of effective provider commission deductions in period, using each booking's confirmation-time commission snapshot (FR-015 REQ-015-022): percentage per completed payment; flat rate once per completed procedure (FR-015); the commission on a refunded amount is reversed with the refund; Reference line: Target monthly commission (admin-configurable in FR-026; hidden until a target is set); Drill-down: Click bar → filtered payment records with commission breakdown"}}
  - {"op": "update_node", "id": "REQ-014-293", "attrs": {"statement": "Chart type: Stacked horizontal bar chart (same as provider C3, but all providers); Buckets: 0–24h · 1–3d · 4–7d · 8–14d · >14d; X axis: Distinct accepted selections awaiting initial payment with a valid payment-window hold (all providers); Optional legend: By provider country; Drill-down: Click bucket → admin Quotes list resolved to accepted subquote + pending booking and filtered by active hold + aging bucket; Calculation: Age from immutable `AcceptanceEvent.acceptedAt`, using the actual configured hold deadline and the Screen 1 C3 exclusions. Expired, superseded, and cancelled selections are retained in lifecycle history but excluded from active cash risk; a booking revived by an admin counts again, aged from the start of its current hold. Snapshot widget: it ignores the time range filter."}}
  - {"op": "update_node", "id": "REQ-014-294", "attrs": {"statement": "Chart type: KPI tile + table; KPI: Total upcoming payout amount (next 30 days); Table columns: Provider · Amount · Payout date · Cadence (how the payout is released, see Assumption 5) · Status (FR-017: Pending Approval / Approved / Overdue / Processing); Sort: Payout date ascending. Fixed window (next 30 days): this widget ignores the time range filter; Drill-down: Click row → provider payout detail in FR-017"}}
  - {"op": "update_node", "id": "REQ-014-299", "attrs": {"statement": "Net revenue is accrual-based (commission earned in the period) and does not depend on when payouts are disbursed. It is counted on money kept: commission on a refunded amount is reversed with the refund, the same principle as REQ-017-134 for affiliates"}}
  - {"op": "update_node", "id": "REQ-014-300", "attrs": {"statement": "This screen is only accessible to admin roles holding the FR-031 permission \"View Financial Analytics\""}, "title": "Screen 12 only for admin roles holding the View Financial Analytics permission"}
  - {"op": "update_node", "id": "ENT-booking-intensity-record", "attrs": {"description": "Entity 2 — Booking Intensity Record (provider-level, daily): `provider_id`, `date`, `bookings_on_day`, `monthly_daily_avg`, `intensity_index`, `baseline_type`. `bookings_on_day` and `monthly_daily_avg` count only FR-006 Bookings in `Confirmed`, `In Progress`, `Aftercare` or `Completed` status by appointment date (the \"Scheduled bookings\" figure); `Accepted` (held), `Payment Window Expired` and `Cancelled` bookings are excluded."}}
