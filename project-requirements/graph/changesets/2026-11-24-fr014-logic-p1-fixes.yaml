  - {"op": "add_node", "id": "REQ-014-313", "type": "Rule", "owner_fr": "FR-014", "title": "Cancellation and no-show rates use the confirmation cohort", "attrs": {"statement": "System MUST compute the cancellation and no-show rates (Screen 2 Widget 6, Screen 11 Widget 2) on the confirmation cohort: bookings first confirmed in the period are the denominator, and the cancellations and no-shows among those same bookings are the numerators.", "rationale": "PRD Functional Requirements Summary, Access, Counting and Notice Rules."}}
  - {"op": "add_node", "id": "REQ-014-314", "type": "Rule", "owner_fr": "FR-014", "title": "Provider analytics entry point and empty state follow the role", "attrs": {"statement": "System MUST open the provider Analytics nav item on the first of Screens 2 to 5 the role can see, hide it when the role can see none, render on Screen 1 only the sections the role may see, and show \"No analytics available for your role\" when no section is visible.", "rationale": "PRD Functional Requirements Summary, Access, Counting and Notice Rules."}}
  - {"op": "add_node", "id": "REQ-014-315", "type": "Rule", "owner_fr": "FR-014", "title": "Admins have no analytics export in this version", "attrs": {"statement": "System MUST NOT offer an analytics export to admins in this version; the FR-031 permission \"Export Reports\" gates nothing in FR-014.", "rationale": "PRD Functional Requirements Summary, Access, Counting and Notice Rules."}}
  - {"op": "add_node", "id": "REQ-014-316", "type": "Rule", "owner_fr": "FR-014", "title": "Admin analytics screens each need one FR-031 permission", "attrs": {"statement": "System MUST require the FR-031 permission named for each of Screens 7 to 13 in Rule 15G, open the admin Analytics nav item on the first of those screens the admin may see, and hide it when the admin may see none.", "rationale": "PRD Functional Requirements Summary, Access, Counting and Notice Rules."}}
  - {"op": "add_node", "id": "REQ-014-317", "type": "Rule", "owner_fr": "FR-014", "title": "Fixed-window and snapshot tiles ignore the time range filter", "attrs": {"statement": "System MUST ignore the time range filter on fixed-window and snapshot tiles: Screen 1 C4, Screen 4 Widgets 7 and 8, Screen 7 C3 and C4, and Screen 12 Widgets 4 and 5.", "rationale": "PRD Functional Requirements Summary, Access, Counting and Notice Rules."}}
  - {"op": "add_node", "id": "REQ-014-318", "type": "Rule", "owner_fr": "FR-014", "title": "Inquiry Queue and Accepted Quotes drill-down read live records", "attrs": {"statement": "System MUST read the Inquiry Queue and the Accepted Quotes drill-down from live records, while charts and tiles read the pre-aggregated figures.", "rationale": "PRD Functional Requirements Summary, Access, Counting and Notice Rules."}}
  - {"op": "add_node", "id": "REQ-014-319", "type": "Rule", "owner_fr": "FR-014", "title": "Parent Quote Responses and Subquote Selections are shown; Subquote Comparisons is not", "attrs": {"statement": "System MUST show Parent Quote Responses and Subquote Selections only; Subquote Comparisons is recorded by FR-005 and not shown in FR-014 in this version.", "rationale": "PRD Functional Requirements Summary, Access, Counting and Notice Rules."}}
  - {"op": "add_node", "id": "REQ-014-320", "type": "Rule", "owner_fr": "FR-014", "title": "Provider with no TTFQ observation shows a grey No data tier", "attrs": {"statement": "System MUST show a provider with no TTFQ observation in a grey \"No data\" tier with a text label, and keep it out of the donut percentages and the scatter.", "rationale": "PRD Functional Requirements Summary, Access, Counting and Notice Rules."}}
  - {"op": "add_node", "id": "REQ-014-321", "type": "Rule", "owner_fr": "FR-014", "title": "Growth from a zero prior period shows New or N/A", "attrs": {"statement": "System MUST show growth as \"New\" when the prior period is zero and the current period is above zero (above the stated minimum where the widget has one), and as N/A otherwise when the prior period is zero.", "rationale": "PRD Functional Requirements Summary, Access, Counting and Notice Rules."}}
  - {"op": "add_node", "id": "REQ-014-322", "type": "Rule", "owner_fr": "FR-014", "title": "Recurring export with a removed owner or no widget access is paused", "attrs": {"statement": "System MUST pause a recurring export whose owner is removed or loses access to every widget in it, and notify the clinic Owner.", "rationale": "PRD Functional Requirements Summary, Access, Counting and Notice Rules."}}
  - {"op": "add_node", "id": "REQ-014-323", "type": "Rule", "owner_fr": "FR-014", "title": "Failed recurring run sends the configuration owner an in-app notice", "attrs": {"statement": "System MUST send the configuration owner an in-app notice when a recurring run fails its final retry.", "rationale": "PRD Functional Requirements Summary, Access, Counting and Notice Rules."}}
  - {"op": "add_node", "id": "REQ-014-324", "type": "Rule", "owner_fr": "FR-014", "title": "Any user who can see every widget may edit or delete a recurring export", "attrs": {"statement": "System MUST let any user who can see every widget in a recurring configuration edit or delete it.", "rationale": "PRD Functional Requirements Summary, Access, Counting and Notice Rules."}}
  - {"op": "add_node", "id": "REQ-014-325", "type": "Rule", "owner_fr": "FR-014", "title": "Commission on refunded money is reversed with the refund", "attrs": {"statement": "System MUST reverse the commission on refunded money with the refund, so platform commission and Screen 12 net revenue are counted on money kept.", "rationale": "PRD Functional Requirements Summary, Access, Counting and Notice Rules."}}
