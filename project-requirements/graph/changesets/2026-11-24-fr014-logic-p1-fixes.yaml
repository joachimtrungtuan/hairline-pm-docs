# FR-014 logic review pass 1: graph change-set mirroring the revised PRD (Provider Analytics and Reporting). New rules and steps come first, then new edges, then updates and removals.
# Cross-FR edges (edge only, no other FR node is updated): REQ-014-009, REQ-014-015, REQ-014-183 and REQ-014-187 apply to SCR-003-12 (the FR-003 provider inquiry list). No FR-017 node is touched; SCR-014-01 and SCR-014-04 show ENT-provider-payout fields that already exist.
# Queued for other FRs, not done here: FR-031 (Export Reports gates nothing in FR-014), FR-020 and FR-030 (recurring-export paused and failed notices), FR-017 and FR-015 (commission reversed with a refund), FR-003 (optional response-time column), FR-005 (Subquote Comparisons recorded, not shown), FR-006 (revival semantics), FR-007 (first-initial-charge wording).
# REQ-014-116 also loses its edges to SCR-014-03 and SCR-014-10: the country booking figures there keep the Confirmed booking milestone meaning and are already governed by REQ-014-135.
reason: "FR-014 logic review pass 1: Scheduled bookings split from the Confirmed booking milestone, time-range scope of fixed and snapshot tiles, live versus aggregate reads, payment option per booking, entry points and empty state per role, admin permissions and no admin export, per-provider response time, export on Screens 2 to 5 with recurring-export ownership and notices, cockpit and report-history steps, No data tier, New growth label, revived bookings, commission reversed on refund, payout widgets bound to the FR-017 statement, confirmation cohort for cancellation and no-show."
by: docs-manager
