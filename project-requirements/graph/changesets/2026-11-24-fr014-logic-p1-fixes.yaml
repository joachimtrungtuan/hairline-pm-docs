  - {"op": "update_node", "id": "REQ-014-017", "attrs": {"statement": "System MUST count B3 as \"Scheduled bookings\" only per REQ-014-116 (Confirmed, In Progress, Aftercare or Completed by appointment date)"}}
  - {"op": "update_node", "id": "REQ-014-018", "attrs": {"statement": "System MUST colour B3 cells Cool (50% or less), Below avg (50 to 90%), Neutral (90 to 110%), Above avg (110 to 150%) or Hot (over 150%), show the Scheduled bookings, monthly average and index in the cell tooltip, and open the Schedule day view on click"}}
  - {"op": "update_node", "id": "REQ-014-051", "attrs": {"statement": "System MUST display commission deducted and \"Income after commission (before refunds)\" (gross income minus commission deducted) per period using each booking's confirmation-time commission snapshot: percentage per completed payment in range; flat rate once per procedure completed in range (FR-015 REQ-015-022)"}, "title": "Commission deducted and income after commission from confirmation-time snapshot (Screen 4)"}
  - {"op": "update_node", "id": "REQ-014-053", "attrs": {"statement": "System MUST display the payment option chosen per booking (Full payment, Deposit plus balance, Installment plan) and a monthly installment adoption rate (bookings first confirmed in the month with an FR-007B installment plan divided by all bookings first confirmed in the month)"}, "title": "Payment option split and installment adoption rate (Screen 4)"}
