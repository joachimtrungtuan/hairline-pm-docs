  - {"op": "update_node", "id": "REQ-014-014", "attrs": {"statement": "System MUST count B1 as distinct inquiry/provider pairs in one inquiry cohort, cumulative through each reached stage, with Confirmed booking meaning the first successful initial charge of the chosen option (full payment, deposit, or first installment) confirms the FR-006 Booking; clicking a stage opens the filtered Inquiries list"}}
