operations:
  - {"op": "update_node", "id": "ENT-inquiry", "title": "Inquiry", "attrs": {"description": "The patient's request for treatment offers: service, treatment area, destination countries, problem details, media, head scan reference, date ranges, medical questionnaire summary and selected providers. Owned by FR-003; lifecycle stage runs from Inquiry to Completed or Cancelled.", "table": "inquiries"}}
  - {"op": "update_node", "id": "ENT-inquiry-date-range", "title": "Inquiry date range", "attrs": {"description": "One preferred treatment date range of an inquiry, with a stable ID so FR-004 date-price rows can reference the source range. Persisted as inquiry_date_ranges.", "table": "inquiry_date_ranges"}}
  - {"op": "update_field", "id": "ENT-inquiry.problem_concern", "required": true}
