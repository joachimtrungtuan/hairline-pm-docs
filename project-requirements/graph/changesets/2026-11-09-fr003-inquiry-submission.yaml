  - {"op": "add_node", "id": "ENT-treatment-area", "type": "Entity", "owner_fr": "FR-026", "title": "Treatment area", "attrs": {"description": "Stub created during FR-003 migration; detail arrives when FR-026 migrates. Admin-managed treatment-area option offered at inquiry creation (Hair, Beard, Both are the seeded defaults)."}}  # stub
  - {"op": "add_node", "id": "SET-inquiry-lead-time", "type": "Setting", "owner_fr": "FR-026", "title": "Minimum inquiry lead time", "attrs": {"description": "Stub created during FR-003 migration; detail arrives when FR-026 migrates. Whole number of blocked days before the earliest selectable treatment date; permitted 0 through 730.", "default": "3", "unit": "days"}}  # stub
  - {"op": "add_node", "id": "SET-inquiry-cancellation-reasons", "type": "Setting", "owner_fr": "FR-026", "title": "Inquiry cancellation reason options", "attrs": {"description": "Stub created during FR-003 migration; detail arrives when FR-026 migrates. Admin-configurable list of predefined cancellation reasons (FR-026 Screen 5a); defaults are listed in the rule on cancellation reason options."}}  # stub
  - {"op": "add_node", "id": "SET-inquiry-expiry-window", "type": "Setting", "owner_fr": "FR-003", "title": "Inquiry expiry window", "attrs": {"description": "Configurable timeframe after which an unquoted inquiry expires automatically. The PRD does not name the owner or the default value."}}
  - {"op": "add_node", "id": "SET-provider-response-window", "type": "Setting", "owner_fr": "FR-003", "title": "Provider response window", "attrs": {"description": "Time providers have to respond to a distributed inquiry (configurable).", "default": "72", "unit": "hours"}}
  - {"op": "add_node", "id": "ENT-provider-inquiry", "type": "Entity", "owner_fr": "FR-003", "title": "Provider inquiry", "attrs": {"description": "Per-provider record of a distributed inquiry (persisted as inquiry_providers): distribution time, first view, status, and provider-caused cancellation cause.", "table": "inquiry_providers"}}
  - {"op": "add_node", "id": "ENT-medical-questionnaire-response", "type": "Entity", "owner_fr": "FR-003", "title": "Medical questionnaire response", "attrs": {"description": "One patient answer to one medical questionnaire question of an inquiry. MVP answers are Yes/No."}}
  - {"op": "add_node", "id": "ENT-medical-alert", "type": "Entity", "owner_fr": "FR-003", "title": "Medical alert", "attrs": {"description": "Alert level derived from the questionnaire answers of an inquiry (critical, standard, none)."}}
  - {"op": "add_node", "id": "ENT-scan", "type": "Entity", "owner_fr": "FR-003", "title": "Scan", "attrs": {"description": "Head scan capture assets of an inquiry (photo set in V1, 3D in V2). Capture rules belong to FR-002; ownership of this entity is an open question."}}
  - {"op": "add_node", "id": "ENT-inquiry-audit-entry", "type": "Entity", "owner_fr": "FR-003", "title": "Inquiry audit entry", "attrs": {"description": "Immutable audit record of an admin change to an inquiry: who, when, field, old and new value, reason, IP."}}
  - {"op": "add_node", "id": "REQ-003-001", "type": "Rule", "owner_fr": "FR-003", "title": "Patient creates and submits inquiry with full content", "attrs": {"statement": "System MUST allow patients to create and submit inquiries with destinations, media, date ranges, head scan media (V1 photo set; V2 true 3D), and medical questionnaire.", "rationale": "Restated by Workflow 1 outcome (complete inquiry created with destinations, media, head scan reference, date ranges and medical questionnaire; inquiry ID generated) and the Inquiry Payload composition list."}}
  - {"op": "add_node", "id": "REQ-003-002", "type": "Rule", "owner_fr": "FR-003", "title": "Inquiry distributed to matching and selected providers", "attrs": {"statement": "System MUST distribute completed inquiries to matching providers in selected countries and those explicitly chosen by the patient.", "rationale": "Restated by Distribution Rules 1 (providers in selected countries OR explicitly selected by patient) and Screen 9 (only inquiries for the provider's countries OR explicitly selected by the patient)."}}
  - {"op": "add_node", "id": "REQ-003-003", "type": "Rule", "owner_fr": "FR-003", "title": "Providers see anonymized patient data and tiered alerts", "attrs": {"statement": "Providers MUST see anonymized patient data and tiered medical alerts until payment/acceptance per system PRD.", "rationale": "Restated by Workflow 2 last step (provider views enforce anonymization until payment and show medical alerts prominently) and Data Access Rules 1."}}
  - {"op": "add_node", "id": "REQ-003-004", "type": "Rule", "owner_fr": "FR-003", "title": "Draft autosave and resume with 7-day inactivity expiry", "attrs": {"statement": "System MUST support draft autosave and resume with 7-day inactivity expiry for incomplete inquiries.", "rationale": "Restated by Alternative Flow A1 (draft saved automatically; patient can resume within 7 days; draft expires after 7 days of inactivity) and User Story 2."}}
  - {"op": "add_node", "id": "REQ-003-005", "type": "Rule", "owner_fr": "FR-003", "title": "Admin views, edits, reassigns, soft deletes and overrides with audit", "attrs": {"statement": "Admin MUST be able to view, edit (with warnings), reassign, soft delete, and override distribution/expiration with full audit trail.", "rationale": "Restated by Workflow 4 and Admin Editability Rules."}}
  - {"op": "add_node", "id": "REQ-003-006", "type": "Rule", "owner_fr": "FR-003", "title": "Inquiry data retained at least 7 years", "attrs": {"statement": "System MUST retain inquiry data for at least 7 years; scan retention per system policy.", "rationale": "Restated by Data Retention (inquiry data retained for 7 years minimum) and the Screen 8 rule (inquiry data persists for 7 years minimum)."}}
  - {"op": "add_node", "id": "REQ-003-007", "type": "Rule", "owner_fr": "FR-003", "title": "Inquiry linked to patient, providers, locations, scan and questionnaire", "attrs": {"statement": "System MUST link inquiries to patients, providers, locations, head scan media, and questionnaire responses."}}
  - {"op": "add_node", "id": "REQ-003-008", "type": "Rule", "owner_fr": "FR-003", "title": "Patient name masked and contact details hidden until payment", "attrs": {"statement": "System MUST mask patient names and hide phone numbers and email addresses until payment confirmation; patient ID (HPID-based) may remain visible as a pseudonymous identifier.", "rationale": "Restated by Data Access Rules 1 and Data and Privacy 2 (patient direct identifiers name, phone number, email anonymized until payment confirmation), Screen 9 (patient names partially masked until payment confirmation), Screen 10 (full patient details visible only after payment confirmation) and UI/UX Display Rule 5."}}
  - {"op": "add_node", "id": "REQ-003-009", "type": "Rule", "owner_fr": "FR-003", "title": "Encryption and immutable audit logs", "attrs": {"statement": "System MUST encrypt all inquiry-related data at rest and in transit, and maintain immutable audit logs.", "rationale": "Restated by Data and Privacy 1 and 3 (all inquiry data encrypted at rest and in transit) and Security Considerations."}}
  - {"op": "add_node", "id": "REQ-003-010", "type": "Rule", "owner_fr": "FR-003", "title": "Shared Services used for notifications and media", "attrs": {"statement": "System MUST integrate with Shared Services for notifications and media/scan handling."}}
  - {"op": "add_node", "id": "REQ-003-011", "type": "Rule", "owner_fr": "FR-003", "title": "Internal APIs let FR-004 read inquiry without mutation", "attrs": {"statement": "System MUST expose internal APIs required by FR-004 (quote) to consume inquiry data without mutation."}}
  - {"op": "add_node", "id": "REQ-003-012", "type": "Rule", "owner_fr": "FR-003", "title": "Patient cancels in Inquiry or Quoted; admin only afterwards", "attrs": {"statement": "System MUST allow patients to cancel their own inquiry in Inquiry or Quoted stages with a required cancellation reason; cancellation is immediate and irreversible. From the Accepted stage onward, System MUST NOT offer patient cancellation; it MUST show \"Contact support\", and cancellation is performed only by an admin through FR-006.", "rationale": "Restated by Cancellation Rules 4 (cancellation is immediate and irreversible; no grace period, no admin approval required; reason required with predefined options), Workflow 5 and Alternative Flow E2."}}
  - {"op": "add_node", "id": "REQ-003-013", "type": "Rule", "owner_fr": "FR-003", "title": "Inquiry cancellation cascade to draft, sent and expired quotes", "attrs": {"statement": "System MUST auto-cancel only the draft, sent, and expired quotes when an inquiry is cancelled by the patient, with distinct cancellation status \"Cancelled (Inquiry Cancelled)\"; quotes in any other status MUST keep their status and cause, and `quote.cancelled_inquiry` (FR-020) MUST go only to providers whose quotes were cancelled by this cascade.", "rationale": "Restated by Alternative Flow A4, Workflow 5 outcome, Alternative Flow E3 and Cancellation Rules 4 (all associated draft, sent and expired quotes auto-cancelled with status Cancelled (Inquiry Cancelled))."}}
  - {"op": "add_node", "id": "REQ-003-014", "type": "Rule", "owner_fr": "FR-003", "title": "Admin booking cancellation cancels inquiry and releases hold", "attrs": {"statement": "When an admin cancels a booking through FR-006, System MUST set the inquiry to `Cancelled`, release any active appointment slot hold (FR-006 hold of the FR-026 configured duration) immediately, and leave the accepted quote with the status `accepted`."}}
  - {"op": "add_node", "id": "REQ-003-015", "type": "Rule", "owner_fr": "FR-003", "title": "Provider capacity management handled by a separate FR", "attrs": {"statement": "Provider capacity management is referenced but handled by a separate FR (TBD); integration expectations remain."}}
  - {"op": "add_node", "id": "REQ-003-016", "type": "Rule", "owner_fr": "FR-003", "title": "Exclusive provider decline releases to normal distribution once", "attrs": {"statement": "When the exclusive provider explicitly declines an FR-037 monitoring-conversion inquiry before quote creation, the system MUST audit the decline reason, remove exclusive routing, and execute normal inquiry distribution exactly once.", "rationale": "Restated by Distribution Rules 2, Workflow 3 diagram, Alternative Flow C2, Screen 10 business rules and User Story 3 scenario 4."}}
  - {"op": "add_node", "id": "REQ-003-017", "type": "Rule", "owner_fr": "FR-003", "title": "Treatment-area catalog exposed for inquiry creation", "attrs": {"statement": "System MUST expose an active, ordered treatment-area catalog for inquiry creation, including a stable option identifier, label, and image/icon URL; Admin manages the catalog under FR-026.", "rationale": "Restated by Screen 1 Treatment Area notes (catalog retrieved from the Inquiry Configuration API; each option has a stable identifier, patient-facing label and image/icon URL; Hair, Beard and Both remain the default seeded options and are not a fixed client-side enum) and Inquiry Configuration Rules 5."}}
  - {"op": "add_node", "id": "REQ-003-018", "type": "Rule", "owner_fr": "FR-003", "title": "Minimum lead time enforced in date picker and at submission", "attrs": {"statement": "System MUST enforce the Admin-configured minimum inquiry lead time consistently in the patient date picker and at submission. The default blocked window is 3 days and does not change the existing two-year, non-overlap, or availability rules.", "rationale": "Restated by Screen 5 notes and rules (minimum lead time from inquiry date is the active Admin-configured blocked window, default 3 days; calendar eligibility and submission validation use the same value)."}}
  - {"op": "add_node", "id": "REQ-003-019", "type": "Rule", "owner_fr": "FR-003", "title": "Provider status revalidated at allocation, routing and reassignment", "attrs": {"statement": "System MUST revalidate provider status at allocation, exclusive routing, and reassignment, and MUST NOT allocate inquiries to a `Suspended` or `Deactivated` provider from the effective time, including through in-flight jobs or retries, or to an `Active` provider whose FR-015 `password_set` is false. On inquiry submission, an explicitly selected provider that has become ineligible MUST be rejected with a validation error that names the provider, so the patient can choose another; it MUST NOT be removed from the selection silently (Screen 7a).", "rationale": "Restated by Distribution Rules 2, Rule 6 (Active provider with password_set false is not eligible), Workflow 2 matching and exclusive routing, Workflow 4 reassignment, Screen 7a and the edge case for a distribution job or retry that targets a provider that became Suspended or Deactivated after matching (allocation is revalidated and skipped; no ProviderInquiry or notification is created)."}}
  - {"op": "add_node", "id": "REQ-003-020", "type": "Rule", "owner_fr": "FR-003", "title": "Provider suspension or deactivation keeps accepted inquiry open", "attrs": {"statement": "When a provider becomes `Suspended` or `Deactivated`, System MUST NOT cancel an inquiry whose accepted treatment belongs to that provider; it MUST keep the inquiry open with `supportRequired = true` while FR-006 Alternative Flow B4 records cause `ProviderSuspended` or `ProviderDeactivated` on the booking; before treatment starts, B4 closes the booking and an admin rehomes the patient through FR-006 Alternative Flow B5, an `In Progress` booking stays `In Progress` for the admin decision in FR-006 Alternative Flow B7, and an `Aftercare` booking follows FR-006 Alternative Flow B6; for inquiries still comparing providers, System MUST cancel only that provider's ProviderInquiry participation and quotes, keep the inquiry stage, flag it `supportRequired = true`, and preserve other providers' offers. Before acceptance, patients MUST receive the offer-unavailability message with Contact Admin/Support; after acceptance and before treatment starts, they MUST receive the `booking.provider_fault_replacement` notice that an admin will arrange a replacement provider within the same inquiry. Patients MUST NOT receive the patient-cancellation message in either case (FR-015 A5/Screen 4)."}}
  - {"op": "add_node", "id": "REQ-003-021", "type": "Rule", "owner_fr": "FR-003", "title": "Automatic redistribution after cascade removes the last live offer", "attrs": {"statement": "Before acceptance, when the provider-status cascade cancels a live offer (a sent quote that has not expired) and the patient has no other live offer on the inquiry, System MUST automatically redistribute the inquiry, at most once per provider-status event, to eligible providers that have not yet received it under the normal Workflow 2 distribution rules, keep `supportRequired = true`, and tell the patient \"[Clinic] is no longer available. We are finding new offers for you.\" If the patient had explicitly selected the affected provider, System MUST ask the patient to confirm and MUST redistribute only after confirmation. System MUST NOT redistribute while another live offer remains (Workflow 2 Alternative Flow B4).", "rationale": "Restated by Workflow 2 Alternative Flow B4 step 3 (redistribution removes the exclusive restriction for an FR-037 exclusive inquiry; while the patient has not confirmed the inquiry is not redistributed and the patient keeps the Contact Admin/Support action; runs at most once per provider-status event and inquiry) and the matching edge case."}}
  - {"op": "add_node", "id": "REQ-003-022", "type": "Rule", "owner_fr": "FR-003", "title": "Entry points to inquiry creation", "attrs": {"statement": "Entry points: Patient-Initiated (primary flow through mobile app inquiry creation); Admin-Managed (direct inquiry creation and management by admin team); Provider-Viewed (provider access to distributed inquiries).", "rationale": "PRD Entry Points (69-71)."}}
  - {"op": "add_node", "id": "REQ-003-023", "type": "Rule", "owner_fr": "FR-003", "title": "No direct patient-provider chat in this module", "attrs": {"statement": "Out of scope: direct patient-provider chat (handled by FR-012)."}}
  - {"op": "add_node", "id": "REQ-003-024", "type": "Rule", "owner_fr": "FR-003", "title": "Providers cannot modify patient data before a quote", "attrs": {"statement": "Given pre-quote stage, when a provider attempts to modify patient data, the system blocks and logs read-only access. Provider can review inquiry details.", "rationale": "User Story 3 scenario 3 (1396); Screen 10 business rules (924); Provider Platform scope (35-37)."}}
  - {"op": "add_node", "id": "REQ-003-025", "type": "Rule", "owner_fr": "FR-003", "title": "Primary service is Get a Hair Transplant; other services use other workflows", "attrs": {"statement": "Service options: \"Get a Hair Transplant\" (primary option); \"Monitor Hair Loss\", \"Aftercare: Monitor Transplant Progress\" and \"Aftercare for Transplant\" (secondary - different workflow). Primary focus on \"Get a Hair Transplant\" option; other services are secondary features.", "rationale": "PRD Screen 1 notes and business rules (463-484)."}}
  - {"op": "add_node", "id": "REQ-003-026", "type": "Rule", "owner_fr": "FR-003", "title": "Patient eligibility validated at service selection", "attrs": {"statement": "System validates patient eligibility; if eligibility is not valid, show an eligibility error and block progression.", "rationale": "PRD Workflow 1 flow diagram, service step (79-87)."}}
  - {"op": "add_node", "id": "REQ-003-027", "type": "Rule", "owner_fr": "FR-003", "title": "One active treatment-area option chosen; inactive options stay readable", "attrs": {"statement": "Patient must select one active treatment-area option. The selected option must be active when the inquiry is created; inactive options remain readable on historical inquiries through their saved snapshot.", "rationale": "PRD Screen 1 business rules (478-481); Inquiry Configuration Rules 5."}}
  - {"op": "add_node", "id": "REQ-003-028", "type": "Rule", "owner_fr": "FR-003", "title": "Used treatment-area option cannot be deleted", "attrs": {"statement": "A treatment-area option used by an existing inquiry cannot be deleted. It may be deactivated for future inquiries while historical inquiry display retains the saved label and asset reference.", "rationale": "PRD Business Rules, Inquiry Configuration Rules 5 (1041-1042)."}}
  - {"op": "add_node", "id": "REQ-003-029", "type": "Rule", "owner_fr": "FR-003", "title": "Lead time is an Admin-set whole number of blocked days", "attrs": {"statement": "Admin configures the minimum inquiry lead time as a whole number of blocked days. The default is 3; the permitted value is 0 through 730, consistent with the existing two-year date horizon.", "rationale": "PRD Inquiry Configuration Rules 5 (1043)."}}
  - {"op": "add_node", "id": "REQ-003-030", "type": "Rule", "owner_fr": "FR-003", "title": "Patient platform reads catalog and lead time from the backend", "attrs": {"statement": "The patient platform retrieves the current catalog and lead-time setting from the backend. A client release is not required for ordinary option or lead-time changes only after implementation verifies compatibility with this dynamic response.", "rationale": "PRD Inquiry Configuration Rules 5 (1044)."}}
  - {"op": "add_node", "id": "REQ-003-031", "type": "Rule", "owner_fr": "FR-003", "title": "At most 10 destination countries", "attrs": {"statement": "Maximum 10 countries selectable. Country selection limited to 10 countries maximum.", "rationale": "PRD Screen 2 rules (510), Validation and Constraints 1 (1161), Workflow 1 destination step (89)."}}
  - {"op": "add_node", "id": "REQ-003-032", "type": "Rule", "owner_fr": "FR-003", "title": "Countries ordered by FR-028 regional configuration, else proximity", "attrs": {"statement": "Countries ordered by FR-028 regional configuration when available, otherwise by proximity to patient location. System suggests nearest countries to patient's location first.", "rationale": "PRD Screen 2 data fields and rules (500-513)."}}
  - {"op": "add_node", "id": "REQ-003-033", "type": "Rule", "owner_fr": "FR-003", "title": "Starting price shown per destination country with fallback currency", "attrs": {"statement": "Starting prices displayed for transparency. Starting price per country; currency based on patient location; fallback pricing for unsupported currencies.", "rationale": "PRD Screen 2 notes and rules (503-513)."}}
  - {"op": "add_node", "id": "REQ-003-034", "type": "Rule", "owner_fr": "FR-003", "title": "Detailed hair-concern fields: four required, two optional", "attrs": {"statement": "All required fields must be completed: nature of concern (text), duration (enum), previous treatments (text) and symptom severity (integer 1-10 slider). Lifestyle factors and additional notes are optional. Text fields have character limits.", "rationale": "PRD Screen 3 data fields and rules (519-545); Workflow 1 details step."}}
  - {"op": "add_node", "id": "REQ-003-035", "type": "Rule", "owner_fr": "FR-003", "title": "Visual evidence limited to 5 files with size and format rules", "attrs": {"statement": "Visual evidence limited to 5 files total. Photos: JPG/PNG <= 2MB each. Videos: MP4 <= 30s, <= 20MB each. File size and format validation enforced; invalid media is blocked with actionable guidance.", "rationale": "PRD Screen 3 rules (537-542), Validation and Constraints 1 (1163-1165), Workflow 1 upload step, Edge Cases (1419). The Screen 3 field table and Screen 10 list up to 5 photos and up to 5 videos; see the report question on per-type or combined limit."}}
  - {"op": "add_node", "id": "REQ-003-036", "type": "Rule", "owner_fr": "FR-003", "title": "Head scan photo set required and must meet FR-002 thresholds", "attrs": {"statement": "Head scan photo set must meet minimum completeness/quality thresholds required by FR-002. Head scan media quality validation applies.", "rationale": "PRD Screen 4 data fields and rules (554-572); Validation and Constraints 2."}}
  - {"op": "add_node", "id": "REQ-003-037", "type": "Rule", "owner_fr": "FR-003", "title": "Patient can retake a poor-quality head scan capture", "attrs": {"statement": "Patient can retake capture if quality poor; the system prompts retake with guidance when the scan quality is not valid.", "rationale": "PRD Screen 4 rules (571); Workflow 1 scan step."}}
  - {"op": "add_node", "id": "REQ-003-038", "type": "Rule", "owner_fr": "FR-003", "title": "Head scan media encrypted, access-controlled, shown through engine outputs", "attrs": {"statement": "Captured media encrypted and stored securely. Head scan media stored securely with access controls. Media accessible to providers for assessment via engine outputs.", "rationale": "PRD Screen 4 rules (572-574); Data Security 3."}}
  - {"op": "add_node", "id": "REQ-003-039", "type": "Rule", "owner_fr": "FR-003", "title": "V1 head scan is a photo set; true 3D is V2", "attrs": {"statement": "In V1, \"3D head scan\" capture is implemented as a standardized head scan photo set (multiple 2D views). True 3D capture is deferred to V2. Head scan requires viewer (photo set gallery in V1; interactive 3D in V2).", "rationale": "PRD Executive Summary (16-17), Screen 4 purpose and notes (547-570), Screen 10 head scan notes and rules (920)."}}
  - {"op": "add_node", "id": "REQ-003-040", "type": "Rule", "owner_fr": "FR-003", "title": "Head scan media retained 2 years after inquiry completion", "attrs": {"statement": "Head scan media retained for 2 years after inquiry completion (photo sets in V1; 3D scans in V2).", "rationale": "PRD Data and Privacy Rules, Data Retention (1093-1095)."}}
  - {"op": "add_node", "id": "REQ-003-041", "type": "Rule", "owner_fr": "FR-003", "title": "At most 10 treatment date ranges", "attrs": {"statement": "Maximum 10 date ranges selectable.", "rationale": "PRD Screen 5 rules (591), Workflow 1 dates step."}}
  - {"op": "add_node", "id": "REQ-003-042", "type": "Rule", "owner_fr": "FR-003", "title": "Date ranges cannot overlap", "attrs": {"statement": "Date ranges cannot overlap. Overlapping date ranges are rejected server-side with correction prompts.", "rationale": "PRD Screen 5 rules, Validation and Constraints 2 (1169), Edge Cases (1420)."}}
  - {"op": "add_node", "id": "REQ-003-043", "type": "Rule", "owner_fr": "FR-003", "title": "Date ranges at most 2 years in the future", "attrs": {"statement": "Dates limited to 2 years in future.", "rationale": "PRD Screen 5 rules, Validation and Constraints 1."}}
  - {"op": "add_node", "id": "REQ-003-044", "type": "Rule", "owner_fr": "FR-003", "title": "Date and provider availability validated", "attrs": {"statement": "System validates date availability and provider availability.", "rationale": "PRD Workflow 1 dates step (97); Screen 5 notes and rules (593-602)."}}
  - {"op": "add_node", "id": "REQ-003-045", "type": "Rule", "owner_fr": "FR-003", "title": "Every medical question needs Yes/No; Yes needs details", "attrs": {"statement": "All questions require Yes/No answers. Detailed explanations required for \"Yes\" answers. The patient must complete the medical questionnaire before submission; missing details for \"Yes\" answers block submission until completed.", "rationale": "PRD Screen 6 rules (643-644), Medical Data Rules 2, Submission Rules 1 (1023), Edge Cases (1421)."}}
  - {"op": "add_node", "id": "REQ-003-046", "type": "Rule", "owner_fr": "FR-003", "title": "Questionnaire managed by admin through FR-025 and versioned", "attrs": {"statement": "Medical questionnaire managed by admin (not hard-coded) via FR-025 (Medical Questionnaire Management). Questionnaire content versioned and auditable.", "rationale": "PRD Screen 6 rules (646), Medical Data Rules 2 (1086-1090)."}}
  - {"op": "add_node", "id": "REQ-003-047", "type": "Rule", "owner_fr": "FR-003", "title": "MVP questionnaires are Yes/No only; typed answers need V2 work", "attrs": {"statement": "MVP: Inquiry questionnaires support Yes/No questions only (enforced in FR-025 publishing/activation rules). Future (V2+): if Inquiry questionnaires allow non-Yes/No question types, the inquiry response schema and UI must be extended to support typed answers (e.g., numeric scale, multi-select, free text).", "rationale": "PRD Screen 6 rules (647-648); Key Entities MedicalQuestionnaireResponse note."}}
  - {"op": "add_node", "id": "REQ-003-048", "type": "Rule", "owner_fr": "FR-003", "title": "Three-tier medical alert generated automatically", "attrs": {"statement": "3-tier color-coded alert system: Critical alerts (red - high risk conditions), Standard alerts (yellow/amber - moderate concerns), No alerts (green - no medical concerns). Alerts generated automatically from questionnaire.", "rationale": "PRD Medical Data Rules 1, Screen 6 rules (645), Workflow 1 medical step."}}
  - {"op": "add_node", "id": "REQ-003-049", "type": "Rule", "owner_fr": "FR-003", "title": "Medical alerts prominently shown as colour-coded chips", "attrs": {"statement": "Alerts prominently displayed to providers. Critical alerts: red color-coded chips. Standard alerts: yellow/amber color-coded chips. No alerts: green color-coded chips.", "rationale": "PRD Medical Data Rules 1, Screen 9 rules (846), Screen 10 rules (917), UI/UX Display Rules 4."}}
  - {"op": "add_node", "id": "REQ-003-050", "type": "Rule", "owner_fr": "FR-003", "title": "Critical alerts inform providers; they never reject the patient", "attrs": {"statement": "Inquiry flagged with critical alerts for provider awareness (not patient rejection). Admin can review and provide guidance to providers. Medical alerts are for provider awareness, not patient rejection.", "rationale": "PRD Alternative Flow A3 (140-156); Business Process Assumptions (1330)."}}
  - {"op": "add_node", "id": "REQ-003-051", "type": "Rule", "owner_fr": "FR-003", "title": "Patient selects at least 1 and at most 5 providers", "attrs": {"statement": "Maximum 5 providers selectable. Patient must select at least 1 provider to proceed.", "rationale": "PRD Screen 7a data fields and rules (689-713); Distribution Rules 2."}}
  - {"op": "add_node", "id": "REQ-003-052", "type": "Rule", "owner_fr": "FR-003", "title": "Provider suggestions ranked by reviews and admin curation, in selected countries", "attrs": {"statement": "Provider suggestions based on positive reviews and admin curation (system PRD). Only providers in patient's selected destination countries are shown. Patient can search/filter providers by country, rating, and specialty.", "rationale": "PRD Screen 7a notes and rules (693-709); Workflow 1 provider step; Distribution Rules 2."}}
  - {"op": "add_node", "id": "REQ-003-053", "type": "Rule", "owner_fr": "FR-003", "title": "Selected providers included; others may also receive the inquiry", "attrs": {"statement": "Selected providers are included in the inquiry for distribution; system may also distribute to additional matching providers per distribution rules.", "rationale": "PRD Screen 7a rules (710)."}}
  - {"op": "add_node", "id": "REQ-003-054", "type": "Rule", "owner_fr": "FR-003", "title": "Patient reviews all sections and accepts terms before submit", "attrs": {"statement": "Patient must review all sections. Patient can edit any section before submission. Terms and conditions must be accepted.", "rationale": "PRD Screen 7 rules (672-675); Workflow 1 review step."}}
  - {"op": "add_node", "id": "REQ-003-055", "type": "Rule", "owner_fr": "FR-003", "title": "Submission generates a unique inquiry ID in HPID format", "attrs": {"statement": "Submission generates unique inquiry ID (HPID format: HPID + YY + MM + 4-digit sequence). Inquiry uniqueness validation applies.", "rationale": "PRD Screen 7 rules (676), Workflow 1 review step and Workflow 2 identify step, UI/UX Display Rules 3 (1151-1153), Validation and Constraints 2."}}
  - {"op": "add_node", "id": "REQ-003-056", "type": "Rule", "owner_fr": "FR-003", "title": "A patient has only one active inquiry at a time", "attrs": {"statement": "Patient can only have one active inquiry at a time. Cancelled inquiries are not counted as \"active\".", "rationale": "PRD Submission Rules 1, Screen 8 rules (775, 782)."}}
  - {"op": "add_node", "id": "REQ-003-057", "type": "Rule", "owner_fr": "FR-003", "title": "Inquiry editable by the patient only in Inquiry stage", "attrs": {"statement": "Patient can modify inquiry if still in \"Inquiry\" stage; otherwise a blocked message (stage changed) is shown.", "rationale": "PRD Submission Rules 1, Alternative Flow A2, Screen 8 rules."}}
  - {"op": "add_node", "id": "REQ-003-058", "type": "Rule", "owner_fr": "FR-003", "title": "Returning patient offered to continue an incomplete inquiry", "attrs": {"statement": "System shows \"continue with your request\" option; patient can resume from last completed step; system displays inquiry status as \"incomplete\" or \"pending\". On return within 7 days the system restores the last step and data and previously validated sections remain intact.", "rationale": "PRD Alternative Flows A1, A2; User Story 2."}}
  - {"op": "add_node", "id": "REQ-003-059", "type": "Rule", "owner_fr": "FR-003", "title": "Failed submission shows an error and allows retry", "attrs": {"statement": "Show submission error and allow retry when submission does not succeed.", "rationale": "PRD Workflow 1 flow diagram, submission step."}}
  - {"op": "add_node", "id": "REQ-003-060", "type": "Rule", "owner_fr": "FR-003", "title": "Only complete and valid inquiries are distributed", "attrs": {"statement": "System detects a submitted inquiry meeting completeness requirements; an incomplete or invalid inquiry is not distributed and errors are returned or the inquiry is flagged for fix. Every inquiry record MUST include destinations, treatment date ranges, problem details and questionnaireSummary (including derived medical alerts), media attachments (photos/videos and head scan photo set / scanRef from FR-002), a linked patient identifier (HPID-based patientId) and distribution metadata via related ProviderInquiry records, fully populated before an inquiry is eligible for distribution to providers.", "rationale": "PRD Workflow 2 trigger and flow diagram (186-215); Key Entities Inquiry Payload composition (1270-1279)."}}
  - {"op": "add_node", "id": "REQ-003-061", "type": "Rule", "owner_fr": "FR-003", "title": "At most 10 providers per inquiry; explicit selections always included", "attrs": {"statement": "When matched providers exceed 10, select up to 10 providers (ensure explicitly selected providers included; remaining per matching rules).", "rationale": "PRD Workflow 2 flow diagram (199-202)."}}
  - {"op": "add_node", "id": "REQ-003-062", "type": "Rule", "owner_fr": "FR-003", "title": "Provider-specific anonymized views created and timestamps recorded", "attrs": {"statement": "Create provider-specific inquiry views (anonymized); distribute inquiry to providers and record timestamps.", "rationale": "PRD Workflow 2 flow diagram (204-213)."}}
  - {"op": "add_node", "id": "REQ-003-063", "type": "Rule", "owner_fr": "FR-003", "title": "Provider notifications within 5 minutes with retry and SLA alert", "attrs": {"statement": "Send provider notifications (within 5 minutes). If notification dispatch fails: queue/retry, alert on SLA risk and log attempts.", "rationale": "PRD Workflow 2 flow diagram (213-217); Alternative Flow B3 outcome."}}
  - {"op": "add_node", "id": "REQ-003-064", "type": "Rule", "owner_fr": "FR-003", "title": "No matched provider: admin assigns manually and patient may be told of delay", "attrs": {"statement": "If no providers are found in the patient's selected countries, the system notifies admin of the unmatched inquiry for manual assignment; patient is optionally notified of potential delay. Admin can manually assign inquiries.", "rationale": "PRD Workflow 2 flow diagram (206-208), Alternative Flow B1, Distribution Rules 2; B4 step 3 (if redistribution finds no eligible provider, B1 applies)."}}
  - {"op": "add_node", "id": "REQ-003-065", "type": "Rule", "owner_fr": "FR-003", "title": "Provider capacity checks are advisory and do not block distribution", "attrs": {"statement": "Provider capacity limits affect distribution where capacity data is available; until the dedicated Provider Capacity Management FR is delivered, capacity checks are advisory and MUST NOT block inquiry distribution.", "rationale": "PRD Alternative Flow B2, Distribution Rules 2."}}
  - {"op": "add_node", "id": "REQ-003-066", "type": "Rule", "owner_fr": "FR-003", "title": "Providers must respond within 72 hours (configurable)", "attrs": {"statement": "Providers must respond within 72 hours (configurable).", "rationale": "PRD Distribution Rules 2 (1031); the change log records alignment with the system PRD."}}
  - {"op": "add_node", "id": "REQ-003-067", "type": "Rule", "owner_fr": "FR-003", "title": "Unquoted inquiry expires after a configurable timeframe", "attrs": {"statement": "Inquiry automatically expires if unquoted (configurable timeframe). Inquiry expiration is configurable by admin.", "rationale": "PRD Submission Rules 1 (1024), Screen 9 rules (848)."}}
  - {"op": "add_node", "id": "REQ-003-068", "type": "Rule", "owner_fr": "FR-003", "title": "FR-037 conversion with an assigned provider routes only to that provider", "attrs": {"statement": "When the inquiry is created via FR-037 (Monitor Your Hair Loss) conversion and the source monitoring case has an active provider assignment at the time of conversion (REQ-037-029, Business Rule 7), normal country/selection matching and the 10-provider distribution cap are bypassed and the inquiry is distributed exclusively to the assigned provider. Standard anonymization, notification timing, and dashboard behavior are unchanged.", "rationale": "PRD Workflow 2 flow diagram (192-195) and Alternative Flow B3 (247-269); Distribution Rules 2."}}
  - {"op": "add_node", "id": "REQ-003-069", "type": "Rule", "owner_fr": "FR-003", "title": "Decline action only for the exclusive provider, with confirmation and reason", "attrs": {"statement": "Decline Exclusive Inquiry declines an FR-037 monitoring-conversion inquiry before quote creation; exclusive assigned provider only; confirmation and reason required.", "rationale": "PRD Workflow 3 flow diagram (297-303), Screen 10 data fields (868)."}}
  - {"op": "add_node", "id": "REQ-003-070", "type": "Rule", "owner_fr": "FR-003", "title": "Duplicate decline requests release the inquiry only once", "attrs": {"statement": "Repeated decline requests MUST NOT distribute the inquiry more than once. Duplicate decline requests return the committed result without creating duplicate provider views or notifications.", "rationale": "PRD Alternative Flow C2 (329), Edge Cases (1427)."}}
  - {"op": "add_node", "id": "REQ-003-071", "type": "Rule", "owner_fr": "FR-003", "title": "Decline fallback is triggered only by an explicit decline, not by expiry", "attrs": {"statement": "This automatic fallback is triggered by an explicit provider decline only. Inquiry or quote expiry continues to follow its existing configured rules. Expiry does not use this decline fallback.", "rationale": "PRD Alternative Flow C2 expiry boundary (330), Distribution Rules 2, Edge Cases (1428)."}}
  - {"op": "add_node", "id": "REQ-003-072", "type": "Rule", "owner_fr": "FR-003", "title": "Redistribution after provider status removes the exclusive restriction", "attrs": {"statement": "For an FR-037 exclusive inquiry, redistribution removes the exclusive restriction in the same way as the explicit-decline fallback (REQ-003-016). The supportRequired marker stays on the inquiry.", "rationale": "PRD Workflow 2 Alternative Flow B4 step 3 (279)."}}
  - {"op": "add_node", "id": "REQ-003-073", "type": "Rule", "owner_fr": "FR-003", "title": "Provider asks admin for clarification; inquiry stays in Inquiry stage", "attrs": {"statement": "Provider requests clarification via admin; admin facilitates communication; inquiry remains in \"Inquiry\" stage until resolved.", "rationale": "PRD Workflow 3 flow diagram, Alternative Flow C1."}}
  - {"op": "add_node", "id": "REQ-003-074", "type": "Rule", "owner_fr": "FR-003", "title": "Providers see only assigned inquiries", "attrs": {"statement": "Provider access limited to assigned inquiries. Only shows inquiries for provider's countries OR explicitly selected by patient.", "rationale": "PRD Data Access Rules 3, Screen 9 rules (844), Data and Privacy 2."}}
  - {"op": "add_node", "id": "REQ-003-075", "type": "Rule", "owner_fr": "FR-003", "title": "Masked patient name format and visible fields", "attrs": {"statement": "Patient name masking format: first name + last initial + asterisks (e.g., \"John D*****\"). Full name revealed only after payment confirmation. Patient ID (HPID-based) visible; name, phone number, and email remain masked/hidden until payment confirmation. Age, gender and country are shown.", "rationale": "PRD UI/UX Display Rules 5, Screen 10 notes (891-893)."}}
  - {"op": "add_node", "id": "REQ-003-076", "type": "Rule", "owner_fr": "FR-003", "title": "Patient ID display format", "attrs": {"statement": "Patient ID format: HPID + YY + MM + 4-digit sequence. Example: HPID2501001 (HPID + 25 + 01 + 0001).", "rationale": "PRD UI/UX Display Rules 3, Screens 9, 10 and 11 Patient ID columns."}}
  - {"op": "add_node", "id": "REQ-003-077", "type": "Rule", "owner_fr": "FR-003", "title": "Primary date range shown with tooltip for the others", "attrs": {"statement": "Primary date range displayed prominently. Additional ranges shown as \"[+ X other ranges]\" with tooltip expansion. Tooltip shows all date ranges with full details.", "rationale": "PRD UI/UX Display Rules 1, Screen 9 rules."}}
  - {"op": "add_node", "id": "REQ-003-078", "type": "Rule", "owner_fr": "FR-003", "title": "Relative, yesterday and dated time display", "attrs": {"statement": "Recent inquiries: relative format (\"X minutes ago\", \"X hours ago\"). Previous day: specific format (\"Yesterday at 3:45 PM\"). Older inquiries: date format (\"Sep 22, 2025\").", "rationale": "PRD UI/UX Display Rules 2, Screen 9 rules."}}
  - {"op": "add_node", "id": "REQ-003-079", "type": "Rule", "owner_fr": "FR-003", "title": "Inquiry detail timeline lists creation, distribution, views and status changes", "attrs": {"statement": "Timeline: creation, distribution to providers, provider views, status changes; sorted descending by time with relative and absolute timestamps.", "rationale": "PRD Screen 10 notes (908-909)."}}
  - {"op": "add_node", "id": "REQ-003-080", "type": "Rule", "owner_fr": "FR-003", "title": "Admin can edit every category of inquiry data", "attrs": {"statement": "Admin can edit ALL inquiry data in the system: inquiry data (all patient-submitted information), patient data (patient information, contact details), provider data (provider assignments and settings), system data (expiration rules, capacity limits) and medical data (questionnaire responses and alerts). Admin can override any system-calculated settings.", "rationale": "PRD Admin Editability Rules 1 and 2, Screen 10 rules (919), Screen 12 rules (1006)."}}
  - {"op": "add_node", "id": "REQ-003-081", "type": "Rule", "owner_fr": "FR-003", "title": "Every admin change needs a reason", "attrs": {"statement": "Change reason required for all modifications. Block save and require a reason when none is provided.", "rationale": "PRD Workflow 4 flow diagram, Admin Editability Rules 3, Screen 12 rules."}}
  - {"op": "add_node", "id": "REQ-003-082", "type": "Rule", "owner_fr": "FR-003", "title": "Admin edits logged with who, when, what, reason", "attrs": {"statement": "All admin edits logged with timestamp and admin identification. Edit history maintained for audit trail. Audit trail records who, when, what changed (old -> new), reason, IP (if available); filterable by field, user, date range; exportable (CSV/JSON) for compliance; immutable and timestamped. Complete audit trail maintained.", "rationale": "PRD Admin Editability Rules 3, Screen 12 notes (1004-1011) and rules."}}
  - {"op": "add_node", "id": "REQ-003-083", "type": "Rule", "owner_fr": "FR-003", "title": "Patient and provider notified of significant admin changes", "attrs": {"statement": "Patient and provider notified of significant changes. Trigger re-notifications when impactful fields change; admin may re-notify parties if impactful.", "rationale": "PRD Admin Editability Rules 3, Workflow 4 flow diagram, Screen 12 notes (1000)."}}
  - {"op": "add_node", "id": "REQ-003-084", "type": "Rule", "owner_fr": "FR-003", "title": "Visual warnings shown for data modification", "attrs": {"statement": "Visual warnings displayed for data modification. Edit inquiry details with caution banners and field-level audit.", "rationale": "PRD Admin Editability Rules 3, Screen 12 notes and rules."}}
  - {"op": "add_node", "id": "REQ-003-085", "type": "Rule", "owner_fr": "FR-003", "title": "Admin reassignment offers only eligible providers", "attrs": {"statement": "Select provider(s) from eligible providers only (Active, Owner password set). Ineligible providers (status not Active, or Owner password not set) are hidden from the admin provider picker. If a selected provider becomes ineligible before the admin saves, the save is blocked with \"[Provider] can't receive inquiries right now (not active or activation not completed).\" The same check applies to providers included through the distribution override.", "rationale": "PRD Workflow 4 flow diagram (349-352), Screen 12 notes (1005)."}}
  - {"op": "add_node", "id": "REQ-003-086", "type": "Rule", "owner_fr": "FR-003", "title": "Admin reassignment avoids duplicates and may send a note", "attrs": {"statement": "Reassign providers (single/multi) with eligibility checks: search providers by country/specialty; multi-select. Validation: avoid duplicates; respect provider capacity policies (if enabled). Optional note sent to provider(s) upon assignment.", "rationale": "PRD Screen 12 notes (1002-1006)."}}
  - {"op": "add_node", "id": "REQ-003-087", "type": "Rule", "owner_fr": "FR-003", "title": "Admin expiry and distribution overrides need confirmation and reason", "attrs": {"statement": "Override expiry/distribution windows with required reason. Expiry: set new deadline (cannot be in the past without justification). Distribution: re-run matching; include/exclude specific providers. All overrides require confirmation and reason entry.", "rationale": "PRD Workflow 4 flow diagram (355-358), Screen 12 notes (1001-1004)."}}
  - {"op": "add_node", "id": "REQ-003-088", "type": "Rule", "owner_fr": "FR-003", "title": "Admin soft delete only, with reason and Archived badge", "attrs": {"statement": "Soft delete only (no hard deletes). Archive requires reason and confirmation; retains data for audit; prevents further edits; read-only view after deletion; display badge \"Archived\" across all admin views; notify patient if required.", "rationale": "PRD Workflow 4 flow diagram (360-363), Screen 12 notes (1007-1009) and rules (1013), Data Security 3 (soft deletes only, no hard deletes allowed)."}}
  - {"op": "add_node", "id": "REQ-003-089", "type": "Rule", "owner_fr": "FR-003", "title": "Admin can escalate an urgent case", "attrs": {"statement": "Escalate urgent case: mark urgent and assign owner; escalation is logged.", "rationale": "PRD Workflow 4 flow diagram (365-367)."}}
  - {"op": "add_node", "id": "REQ-003-090", "type": "Rule", "owner_fr": "FR-003", "title": "Admin contacts patient or provider and the intervention is logged", "attrs": {"statement": "Admin contacts patient or provider, resolves the issue and updates the inquiry if needed; the system logs the intervention in the audit trail. Admin notes are time-stamped and visible to admins only.", "rationale": "PRD Workflow 4 flow diagram (369-372), Screen 12 notes (999)."}}
  - {"op": "add_node", "id": "REQ-003-091", "type": "Rule", "owner_fr": "FR-003", "title": "Admin overview shows all inquiries with filters and bulk actions", "attrs": {"statement": "Shows all inquiries in all lifecycle stages. Admin has full visibility of all data. Advanced filtering capabilities. Bulk actions available. Real-time status updates.", "rationale": "PRD Screen 11 business rules (958-962)."}}
  - {"op": "add_node", "id": "REQ-003-092", "type": "Rule", "owner_fr": "FR-003", "title": "All inquiry data access is logged and monitored", "attrs": {"statement": "All data access logged for audit trail. Admin access logged for audit trail. Access attempts logged and monitored.", "rationale": "PRD Data Access Rules 3, Data and Privacy 2 and 3."}}
  - {"op": "add_node", "id": "REQ-003-093", "type": "Rule", "owner_fr": "FR-003", "title": "Cross-tenant data access only through authenticated APIs", "attrs": {"statement": "Cross-tenant data access through authenticated APIs only.", "rationale": "PRD Data and Privacy Rules, Data Access (1102)."}}
  - {"op": "add_node", "id": "REQ-003-094", "type": "Rule", "owner_fr": "FR-003", "title": "Questionnaire responses retained 7 years", "attrs": {"statement": "Medical questionnaire responses retained for 7 years.", "rationale": "PRD Data and Privacy Rules, Data Retention (1094)."}}
  - {"op": "add_node", "id": "REQ-003-095", "type": "Rule", "owner_fr": "FR-003", "title": "Cancelled inquiries follow the same retention", "attrs": {"statement": "Cancelled inquiries are subject to the same retention policy as completed inquiries; cancellation does not accelerate data deletion timelines.", "rationale": "PRD Data and Privacy Rules, Data Retention (1096)."}}
  - {"op": "add_node", "id": "REQ-003-096", "type": "Rule", "owner_fr": "FR-003", "title": "Admin sees patient cancellations but cannot block or reverse them", "attrs": {"statement": "Admin has oversight visibility of patient-initiated cancellations but cannot block or reverse them.", "rationale": "PRD Cancellation Rules 4 (1066)."}}
  - {"op": "add_node", "id": "REQ-003-097", "type": "Rule", "owner_fr": "FR-003", "title": "Cancellation preflight changes no state and a failure does not cancel", "attrs": {"statement": "Preflight (no state change): confirm inquiry still active; load quotes and notification targets. If preflight fails, show a temporary error with Retry/Back and do NOT cancel yet.", "rationale": "PRD Workflow 5 flow diagram (390-395)."}}
  - {"op": "add_node", "id": "REQ-003-098", "type": "Rule", "owner_fr": "FR-003", "title": "Cancellation commits atomically with an audit event", "attrs": {"statement": "Atomic commit: set inquiry = Cancelled with timestamp and reason; cancel draft, sent, and expired quotes (if any); write immutable audit event. With no quotes, only the inquiry status is updated and no quote cascade is needed.", "rationale": "PRD Workflow 5 flow diagram (397-399), Alternative Flow E1 (421-432)."}}
  - {"op": "add_node", "id": "REQ-003-099", "type": "Rule", "owner_fr": "FR-003", "title": "Cancellation audit event content", "attrs": {"statement": "Cancellation event is logged in immutable audit trail with: patient ID, inquiry ID, timestamp, reason, optional feedback.", "rationale": "PRD Cancellation Rules 4 (1068)."}}
  - {"op": "add_node", "id": "REQ-003-100", "type": "Rule", "owner_fr": "FR-003", "title": "Providers notified of cancellation within 5 minutes without the reason", "attrs": {"statement": "All affected providers receive notification of cancellation; cancellation reason is NOT shared with providers (patient-private analytics data). Send/enqueue notifications (target <= 5 minutes); if enqueue/send fails, queue/retry notifications and log attempts (do not roll back cancellation). Inquiry.cancelled is sent to distributed providers.", "rationale": "PRD Workflow 5 flow diagram (401-405), Alternative Flow E1, Alternative Flow E3 notes, Cancellation Rules 4, Screen 8a rules."}}
  - {"op": "add_node", "id": "REQ-003-101", "type": "Rule", "owner_fr": "FR-003", "title": "Cancellation reason is patient-private", "attrs": {"statement": "Cancellation reason is patient-private data (not shared with providers; stored for analytics and audit).", "rationale": "PRD Screen 8a rules (774)."}}
  - {"op": "add_node", "id": "REQ-003-102", "type": "Rule", "owner_fr": "FR-003", "title": "Cancellation reason chosen from admin-configurable options", "attrs": {"statement": "Cancellation reason is required before the Confirm button becomes active. Default options: \"Changed my mind\", \"Found a better option elsewhere\", \"Medical concerns\", \"Financial reasons\", \"Travel restrictions\", \"Timeline doesn't work\", \"Other\" (admin-configurable via FR-026 Screen 5a). Additional notes are required if \"Other\" is selected (max 500 characters). Optional feedback: max 1000 characters.", "rationale": "PRD Screen 8a data fields and rules (755-777)."}}
  - {"op": "add_node", "id": "REQ-003-103", "type": "Rule", "owner_fr": "FR-003", "title": "Account-deletion request cancels the inquiry with a system reason", "attrs": {"statement": "System MAY cancel an eligible inquiry as a consequence of a patient account deletion request (FR-001). In that case, the system MUST set a system-generated cancellation reason for audit (e.g., \"Account Deleted (System)\") and MUST NOT prompt the patient for a cancellation reason. Draft, sent, and expired quotes are auto-cancelled as in Workflow 5, other quotes keep their status and cause; providers are notified and MUST NOT see the cancellation reason; inquiry becomes read-only.", "rationale": "PRD Alternative Flow E3 (437-450), Cancellation Rules 4 (1064)."}}
  - {"op": "add_node", "id": "REQ-003-104", "type": "Rule", "owner_fr": "FR-003", "title": "Cancelled inquiry stays visible and read-only", "attrs": {"statement": "Cancelled inquiry remains visible in patient dashboard with \"Cancelled\" badge (read-only); no actions available except viewing details.", "rationale": "PRD Cancellation Rules 4 (1065), Screen 8 notes (742)."}}
  - {"op": "add_node", "id": "REQ-003-105", "type": "Rule", "owner_fr": "FR-003", "title": "No cooldown after cancellation", "attrs": {"statement": "No cooldown period after cancellation: patient can immediately create a new inquiry (one-active-inquiry rule: cancelled inquiry is no longer \"active\").", "rationale": "PRD Cancellation Rules 4 (1067), Screen 8b rules (813-814), Alternative Flow A4 (172-176)."}}
  - {"op": "add_node", "id": "REQ-003-106", "type": "Rule", "owner_fr": "FR-003", "title": "Cancel Inquiry and Contact support shown by stage", "attrs": {"statement": "\"Cancel Inquiry\" is visible only in Inquiry or Quoted stages and hidden when stage is Accepted, Confirmed, In Progress, Aftercare, Completed, or Cancelled. \"Contact support\" is shown in place of \"Cancel Inquiry\" from the Accepted stage onward (Accepted, Confirmed, In Progress or Aftercare) and opens Help & Support so an admin can act on the request.", "rationale": "PRD Screen 8 data fields and notes (731-740), Workflow 5 trigger (382)."}}
  - {"op": "add_node", "id": "REQ-003-107", "type": "Rule", "owner_fr": "FR-003", "title": "Inquiry status is the source of truth when cancel and quote submit collide", "attrs": {"statement": "If a quote is submitted concurrently with cancellation, the system processes cancellation first (inquiry status is source of truth); the incoming quote submission is rejected with an \"Inquiry no longer active\" error. FR-004 must implement the corresponding rejection handling.", "rationale": "PRD Workflow 5 flow diagram (399-400), Edge Cases (1425)."}}
  - {"op": "add_node", "id": "REQ-003-108", "type": "Rule", "owner_fr": "FR-003", "title": "Provider draft locked with Inquiry Cancelled banner", "attrs": {"statement": "If the patient cancels while a provider is drafting a quote, the provider's draft is locked with an \"Inquiry Cancelled\" banner upon next save/refresh.", "rationale": "PRD Edge Cases (1424)."}}
  - {"op": "add_node", "id": "REQ-003-109", "type": "Rule", "owner_fr": "FR-003", "title": "Cancellation success screen reflects server time and real cascade", "attrs": {"statement": "Cancellation Timestamp reflects server-side time (not client clock) for audit consistency. Impact Summary must match the actual cascade results (number of quotes cancelled). The success screen is shown only after Workflow 5 completes successfully.", "rationale": "PRD Screen 8b rules (809-815)."}}
  - {"op": "add_node", "id": "REQ-003-110", "type": "Rule", "owner_fr": "FR-003", "title": "Admin cancels from acceptance onward with reason and audit", "attrs": {"statement": "From acceptance onward, only an admin can cancel, through the FR-006 booking cancellation, from any booking state, with a mandatory reason and an audit entry. The booking and the inquiry become Cancelled, any active appointment hold is released, and the accepted quote keeps the status accepted. Refunds and fees follow the payment placeholder.", "rationale": "PRD Cancellation Rules 4 (1062), Alternative Flow E2 (434-449), User Story 4 scenario 3."}}
  - {"op": "add_node", "id": "REQ-003-111", "type": "Rule", "owner_fr": "FR-003", "title": "supportRequired is an independent marker cleared only by audited admin resolution", "attrs": {"statement": "supportRequired is an independent marker, not a lifecycle stage. Clearing it requires an audited admin resolution. Later reactivation does not clear supportRequired; only an audited admin resolution clears it.", "rationale": "PRD Business Rules 6 (1060), Workflow 2 Alternative Flow B4 step 5 (284), Key Entities Inquiry."}}
  - {"op": "add_node", "id": "REQ-003-112", "type": "Rule", "owner_fr": "FR-003", "title": "Provider-caused causes are distinct and never overwritten", "attrs": {"statement": "Provider-caused causes are distinct from patient cancellation, account-deletion cancellation, and Payment Window Expired, and are never overwritten by later provider status changes. The causes ProviderSuspended and ProviderDeactivated are stored on the affected ProviderInquiry and on the FR-006 booking.", "rationale": "PRD Business Rules 6 (1061), Workflow 2 Alternative Flow B4 Boundary (286), Key Entities (1258)."}}
  - {"op": "add_node", "id": "REQ-003-113", "type": "Rule", "owner_fr": "FR-003", "title": "Completed and cancelled inquiries are not reclassified; reactivation restores nothing", "attrs": {"statement": "Completed and already-cancelled inquiries are not reclassified. Later reactivation does not restore cancelled participation or quotes. A cancelled ProviderInquiry record is retained and never reopened by reactivation.", "rationale": "PRD Workflow 2 Alternative Flow B4 step 5 (284), Key Entities ProviderInquiry status (1262)."}}
  - {"op": "add_node", "id": "REQ-003-114", "type": "Rule", "owner_fr": "FR-003", "title": "Provider becomes eligible once its password is set; earlier inquiries not re-sent", "attrs": {"statement": "An Active provider that has not yet set its password (FR-015 password_set = false) becomes eligible once the password is set; inquiries distributed before then are not re-sent to it.", "rationale": "PRD Business Rules 6 (1057)."}}
  - {"op": "add_node", "id": "REQ-003-115", "type": "Rule", "owner_fr": "FR-003", "title": "Cascade processing deduplicated per provider-status event and inquiry", "attrs": {"statement": "Cascade processing is deduplicated per provider-status event and inquiry. A replayed provider-status cascade produces no duplicate cancellations, support flags, or patient messages.", "rationale": "PRD Workflow 2 Alternative Flow B4 Boundary (286), Edge Cases (1431)."}}
  - {"op": "add_node", "id": "REQ-003-116", "type": "Rule", "owner_fr": "FR-003", "title": "Patient told other offers stay open, or asked to confirm redistribution", "attrs": {"statement": "Before acceptance, the patient receives the offer-unavailability message (provider.status_cancellation_patient) with a Contact Admin/Support action (FR-020). When other offers remain open, the message says \"[Clinic] is no longer available. Your other offers are still open.\" When the patient must confirm first, the message asks the patient to confirm the redistribution. In neither case does the patient see the Workflow 5 patient-cancellation confirmation, and no patient cancellation reason is requested.", "rationale": "PRD Workflow 2 Alternative Flow B4 step 4 (281)."}}
  - {"op": "add_node", "id": "REQ-003-117", "type": "Rule", "owner_fr": "FR-003", "title": "Dashboard shows provider-unavailable banner and keeps other offers actionable", "attrs": {"statement": "A provider-caused status change (ProviderSuspended or ProviderDeactivated) never shows patient-cancellation copy. For a still-comparing inquiry (Inquiry or Quoted stage), the dashboard shows a provider-unavailable banner with a Contact Admin/Support action, the affected provider's offers show as unavailable while other offers remain actionable, and when the patient had explicitly selected the affected provider the dashboard first asks the patient to confirm the redistribution. After acceptance, the dashboard keeps the current stage and tells the patient that an admin will arrange a replacement provider within the same inquiry.", "rationale": "PRD Screen 8 notes (743)."}}
  - {"op": "add_node", "id": "REQ-003-118", "type": "Rule", "owner_fr": "FR-003", "title": "Distribution timestamp set once per provider and feeds response metrics", "attrs": {"statement": "distributed_at (timestamp, UTC) is set once per provider when the inquiry is distributed to that provider, including when an inquiry is released to normal distribution after an exclusive provider declines (REQ-003-016). Distribution retries or re-sends to the same provider never overwrite it. It is the start point for FR-014 time to first quote (TTFQ) and response rate, and for the FR-020/FR-030 inquiry.ttfq_sla_breached alert.", "rationale": "PRD Key Entities ProviderInquiry (1260)."}}
  - {"op": "add_node", "id": "REQ-003-119", "type": "Rule", "owner_fr": "FR-003", "title": "Provider inquiry detail shows full inquiry content and scan metadata", "attrs": {"statement": "Provider inquiry detail shows: countries (primary country highlighted; remaining in order selected), problem details, media (photos with thumbnails and modal preview, videos with poster frame and player), head scan (V1 photo set gallery viewer with zoom/compare, quality score and capture metadata if available, retake indicator if replaced after initial capture), all selected date ranges (primary first), the full Q&A list with derived alerts and a link to the audit trail of the questionnaire version used.", "rationale": "PRD Screen 10 notes (884-916)."}}
