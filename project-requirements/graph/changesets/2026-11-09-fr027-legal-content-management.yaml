  # --- Screens: PRD Screens 1, 2, 3, 4, 4A as SCR-027-01..05
  - {"op": "add_node", "id": "SCR-027-01", "type": "Screen", "owner_fr": "FR-027", "title": "Admin: Legal Documents List", "attrs": {"platform": "admin", "description": "PRD Screen 1 (prd.md line 125). Lists all legal document types and versions with entry points to draft, edit, preview and publish. UI controls, not fields: Actions buttons (Draft new version, Edit draft, View history, Preview, Publish) and filters by Document Type, Status and Locale (criteria owned by FR-022, REQ-022-110); behaviour in REQ-027-049 and REQ-027-050. Shows warning banners (REQ-027-024)."}}
  - {"op": "add_node", "id": "SCR-027-02", "type": "Screen", "owner_fr": "FR-027", "title": "Admin: Draft/Edit Legal Document", "attrs": {"platform": "admin", "description": "PRD Screen 2 (prd.md line 158). Author or edit content of one legal document version before publication. Side-by-side preview while editing; shows a prior version summary for context; rich text editor with Markdown toggle (editor limits in REQ-027-051)."}}
  - {"op": "add_node", "id": "SCR-027-03", "type": "Screen", "owner_fr": "FR-027", "title": "Admin: Preview and Publish", "attrs": {"platform": "admin", "description": "PRD Screen 3 (prd.md line 188). Review draft content, confirm details and publish globally. UI controls, not fields: Publish button (enabled per REQ-027-050) and the link back to edit the draft. Shows the acceptance impact summary."}}
  - {"op": "add_node", "id": "SCR-027-04", "type": "Screen", "owner_fr": "FR-027", "title": "Admin: Acceptance Coverage Dashboard", "attrs": {"platform": "admin", "description": "PRD Screen 4 (prd.md line 216). Monitor acceptance for current and recent versions. Filters by document type and version; date range for trend; CSV export of pending users; audit link for the publication event. Pending Users list supports pagination and export."}}
  - {"op": "add_node", "id": "SCR-027-05", "type": "Screen", "owner_fr": "FR-027", "title": "Admin: Acceptance Detail List (Drilldown)", "attrs": {"platform": "admin", "description": "PRD Screen 4A (prd.md line 244). Paginated list of users per version, accepted versus pending, with filters and export; sortable by acceptance timestamp and user ID. UI controls, not fields: User Filter, Status Filter (Accepted or Pending, default Pending) and Export button; criteria owned by FR-022 (REQ-022-111)."}}
