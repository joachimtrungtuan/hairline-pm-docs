  - {"op": "update_node", "id": "SET-supported-payment-methods", "attrs": {"description": "Payment methods enabled or disabled by admin per region and currency (FR-029 Screen 1, Enabled Payment Methods). FR-007 reads it; FR-007B owns the payment-method records."}}
  - {"op": "update_node", "id": "SET-installment-late-payment-grace-period", "attrs": {"description": "Late payment grace period (0-14 days, FR-029 Screen 4): the days after a missed installment due date during which reminders are sent before the late payment fee is charged. A missed installment never cancels the booking automatically."}}
  - {"op": "update_node", "id": "REQ-029-004", "attrs": {"statement": "System MUST route payment transactions to the appropriate Stripe account based on the country on the patient's profile (not the patient's current physical location)", "rationale": "FR-029 PRD, Payment Rule 1 and the no-Stripe-account edge case: the profile country decides the Stripe account."}}
  - {"op": "update_node", "id": "REQ-029-012", "attrs": {"statement": "System MUST gracefully handle per-pair rate source failures by keeping the last successfully fetched rate, marking the pair's status as red/error on the pair list, and alerting admin. Deleting a rate source MUST be blocked while any pair still references it; the admin must first reassign those pairs to another source or convert them to manual mode (with the last fetched rate pre-filled), and no pair switches to manual mode automatically.", "rationale": "FR-029 PRD, REQ-029-012 and Screen 2B: deleting a source is blocked while pairs use it; no automatic switch to manual mode."}}
  - {"op": "update_node", "id": "REQ-029-015", "attrs": {"statement": "System MUST apply deposit rate changes to new bookings only (existing bookings retain original deposit rate). Once a booking has been confirmed, its installment settings are locked: later changes to installment configuration never alter that booking"}}
  - {"op": "update_node", "id": "REQ-029-022", "attrs": {"statement": "System MUST generate installment payment schedules using equal-split amounts: booking total ÷ installment count (rounded to each currency's own minor units; last installment absorbs rounding difference)", "rationale": "Restated by Billing Rule 1 and Screen 4. Rounding follows each currency's own minor units."}}
  - {"op": "update_node", "id": "REQ-029-023", "attrs": {"statement": "System MUST allow admins to configure the late payment grace period (0-14 days): the number of days after a missed installment due date during which reminders are sent and before the late fee is charged. A missed installment never cancels the booking automatically"}}
  - {"op": "update_node", "id": "REQ-029-027", "attrs": {"statement": "System MUST retain payment configuration audit history; retention follows the system PRD, Platform-Wide Rules: One 10-year retention period", "rationale": "Retention follows REQ-SYS-002."}}
  - {"op": "update_node", "id": "REQ-029-044", "attrs": {"statement": "System MUST lock currency conversion rates (including markup) at FR-005 subquote acceptance, store them with their timestamp in the acceptance snapshot, and copy them to the booking and its transactions (no rate fluctuation after subquote acceptance). If the cached rate is older than 24 hours, acceptance still proceeds and the snapshot records the rate and its timestamp", "rationale": "Restates Rule 1(a) and Currency Rule 2. Likely duplicate of REQ-005-017 (FR-005)."}}
  - {"op": "update_node", "id": "REQ-029-051", "attrs": {"statement": "System MUST present any pre-confirmation commission (including the FR-004 quote screen) as an indicative model and value labelled \"indicative, final at booking confirmation\"; only the booking-confirmation snapshot is authoritative. The binding commission is fixed at booking confirmation on the accepted price after promotion, in the quote currency, from the acceptance snapshot"}}
  - {"op": "update_node", "id": "REQ-029-053", "attrs": {"statement": "System MUST create a new FR-026 Quote Configuration version whenever the Default Currency changes; open quote drafts MUST keep their typed numbers, switch to the new currency without conversion, and require the provider to acknowledge a banner reading \"currency changed, check your prices\" (FR-004 quote screen) before send."}}
  - {"op": "update_node", "id": "REQ-029-054", "attrs": {"statement": "System MUST calculate commission on the accepted price after the promotion, in the quote currency and read from the acceptance snapshot, for every discount type, including discounts funded only by Hairline; no program keeps commission on the price before the promotion."}}
  - {"op": "update_node", "id": "REQ-029-087", "attrs": {"statement": "Status badges update automatically: green when last fetch succeeded and rate change is within threshold; yellow when the last sync breached the rate protection threshold or the source is degraded; red when last fetch failed or source is down. A yellow badge returns to green on the pair's next normal sync; there is no acknowledge action.", "rationale": "Status of a pair is calculated by this rule. A yellow badge returns to green on the next normal sync; there is no acknowledge action."}}
  - {"op": "update_node", "id": "REQ-029-105", "title": "Missed installment never cancels the booking; reminders, retries, then an admin flag", "attrs": {"statement": "Payment Rule 6: A missed installment never cancels the booking automatically. The system sends reminders during the grace period and retries the payment three times (day 1, day 3 and day 7, as owned by FR-007B); when the retries have failed, an admin is flagged to follow up. The late payment fee is charged when the grace period passes without payment (Late Fee Rule)", "rationale": "FR-029 PRD, Payment Rule 6."}}
  - {"op": "update_node", "id": "REQ-029-110", "title": "Refunds follow the refund ladder", "attrs": {"statement": "Refund Rule: Refunds on a cancelled booking follow the refund ladder set on Screen 7: the refund percentage depends on how many days before the procedure date the booking is cancelled. The launch default is more than 30 days, 90 percent; 15 to 30 days, 50 percent; under 15 days, 0 percent. It is one global setting that FR-006, FR-007, FR-007B and FR-017 read; each provider's own cancellation terms do not replace it", "rationale": "FR-029 PRD, Refund Rule; the ladder itself is REQ-029-142."}}
  - {"op": "update_node", "id": "REQ-029-124", "attrs": {"statement": "If an admin attempts to disable a currency referenced only by configuration items (e.g., used in Stripe account supported currencies, location starting prices, or active pricing configs), the system MUST warn and provide a safe resolution path (e.g., update dependent configs first) before allowing the disable. A currency still used by quotes, bookings or instalment plans is not a warning case: it is blocked by the rule below.", "rationale": "Overlaps REQ-029-052 (blocked while in use). The warning covers configuration items only; records in use are blocked by REQ-029-052."}}
  - {"op": "update_node", "id": "REQ-029-118", "attrs": {"statement": "Percentage model (global default or provider scope): commission amount = booking total (the accepted subquote price after promotion, in the quote currency, from the acceptance snapshot) × snapshotted commission percentage (rounded to the quote currency's own minor units; last payment absorbs rounding difference if needed)", "rationale": "Part of the commission calculation; see REQ-029-050 for the booking total. Rounding follows the quote currency's minor units."}}
  - {"op": "update_node", "id": "REQ-029-097", "attrs": {"statement": "How does system handle rapid currency fluctuation exceeding rate protection threshold multiple times in single day for one pair (e.g., USD/EUR changes 3% at 8am, another 3% at 2pm, another 3% at 8pm)? System sends first alert at 8am when the pair's initial 3% threshold is crossed and marks the pair's status as yellow/warning on the pair list. System applies rate-limiting to alerts (maximum one alert per currency pair per 6 hours) to prevent alert fatigue. System accumulates rate changes and sends second alert at 2pm showing cumulative change: \"USD/EUR increased 6% in 6 hours.\" The pair's yellow/warning status returns to green on the pair's next normal sync (when the rate is back within the protection threshold); there is no acknowledge action. Admin receives summary of all rate changes across all pairs in daily digest email."}}
