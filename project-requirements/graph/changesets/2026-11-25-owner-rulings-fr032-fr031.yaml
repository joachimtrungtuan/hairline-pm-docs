# Owner rulings of 2026-11-25 (final), FR-032 Provider Dashboard Settings and FR-031 Admin Access Control. NOT APPLIED: to be applied by the controller with write.py.
# A. Clinic billing settings: by default Billing Staff can VIEW them read-only; only the Owner can EDIT them. The one FR-031 permission View and Edit Billing Settings is split into View Billing Settings and Edit Billing Settings. Permissions are rows of ENT-permission and ENT-role-permission-definition, not graph nodes, so no node is added for the split: the permission rows are carried by REQ-031-118 (statement updated). REQ-031-068 keeps Edit Billing Settings in its hard Owner-only list (not grantable); only View Billing Settings is grantable, default Owner and Billing Staff. FR-032 rules REQ-032-011, REQ-032-022, REQ-032-141, screen SCR-032-08 and the three billing flow titles are updated; Billing Staff is added to the actor edges of the billing screen, the two access rules and the read-only flow steps.
# B. A locked (mandatory) notification guarantees EMAIL only; push and any other optional channel follow the recipient's own setting; the in-app record is always created (FR-020 REQ-020-038, FR-030 REQ-030-208). Updated: REQ-032-031, REQ-032-079, REQ-032-080, REQ-032-081, REQ-032-143.
# Not changed on purpose: retired steps STP-032-139, STP-032-163, STP-032-164 (retired; their titles are history); no new REQ id was needed.
# Not in this change-set: any FR-009 node (FR-009 holds no billing settings permission), and system-prd.md and implementation-backlog.md wording.
