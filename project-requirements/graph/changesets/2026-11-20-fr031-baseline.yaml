  - {"op": "update_node", "id": "REQ-031-001", "attrs": {"statement": "System MUST allow Super Admins to invite new admin team members via email with role assignment; the invitation email is sent within 1 minute"}}
  - {"op": "update_node", "id": "REQ-031-004", "attrs": {"statement": "System MUST provide predefined admin roles: Super Admin, Aftercare Specialist, Billing Admin, Support Staff"}}
  - {"op": "update_node", "id": "REQ-031-005", "title": "Central configuration of provider role permissions", "attrs": {"statement": "System MUST provide centralized configuration for the permissions of the four provider roles (Owner, Manager, Clinical Staff, Billing Staff); no other provider roles exist", "rationale": "PRD Functional Requirements Summary, REQ-031-005; Tab 3 business rules. Provider-side application: Active stage."}}
  - {"op": "update_node", "id": "REQ-031-006", "title": "Provider role permission changes sync to Provider Platform within 5 seconds", "attrs": {"statement": "System MUST automatically sync provider role permission changes to Provider Platform (FR-009) within 5 seconds"}}
  - {"op": "update_node", "id": "REQ-031-007", "attrs": {"statement": "System MUST prevent modification of Owner role permissions that would remove full access to provider features, with the message: \"Owner role must maintain full access to all provider features\""}}
  - {"op": "update_node", "id": "REQ-031-009", "title": "Super Admin accounts are never suspended, removed, demoted or self-deactivated in the product", "attrs": {"statement": "System MUST NOT allow a Super Admin account to be suspended by another user, or removed, demoted or self-deactivated inside the product (system protection; if ever needed, this is done outside the product), and MUST show a message saying so when it is attempted", "rationale": "PRD Functional Requirements Summary, REQ-031-009; Tab 2 business rules; Business Rule 7; User Story 6. Business Rule 4 (at least one active Super Admin must exist at all times, system protection against lockout) is merged here."}}
  - {"op": "update_node", "id": "REQ-031-012", "attrs": {"statement": "System MUST maintain admin user accounts with: email, name, password hash, assigned role, role effective date/time, role change acknowledgement time, status (active/pending/suspended), creation date, last login timestamp", "rationale": "PRD Functional Requirements Summary, REQ-031-012; Key Entities, Entity 1. One admin user has one assigned role (Business Rule 1)."}}
  - {"op": "update_node", "id": "REQ-031-013", "attrs": {"statement": "System MUST maintain role definitions with: guard-scoped role name, description, assigned permissions (as permission matrix), and system/custom status (custom roles exist for admin roles only)", "rationale": "PRD Functional Requirements Summary, REQ-031-013. Key Entities, Entity 2. Provider-side application: Active stage."}}
  - {"op": "update_node", "id": "REQ-031-015", "title": "Audit trail retention follows the platform retention period", "attrs": {"distinct_from": "REQ-001-012,REQ-023-011,REQ-029-027", "statement": "Audit trail retention follows the system PRD, Platform-Wide Rules: One 10-year retention period", "rationale": "PRD Functional Requirements Summary, REQ-031-015; Privacy Rule 1; Admin Editability (fixed in codebase). The period is owned by the system Rule One 10-year retention period."}}
  - {"op": "update_node", "id": "REQ-031-023", "attrs": {"statement": "System MUST send the admin invitation, role change and password reset emails through the platform notification service defined in FR-020", "rationale": "PRD Functional Requirements Summary, REQ-031-023. Cross-FR citation: FR-020 Notification Service (S-03); the general duty to send through the service is the FR-020 Rule."}}
  - {"op": "update_node", "id": "REQ-031-035", "attrs": {"statement": "System checks the invitation email against all admin users (active, suspended, pending) and pending invitations; a duplicate is blocked with the error \"This email is already associated with an admin account. Please use a different email or check existing team members.\" and the system suggests \"View team member\" or, if pending, \"Resend invitation\". The existing record is kept.", "rationale": "Alternative Flow B2 and Screen 2 (one message in both places)."}}
  - {"op": "update_node", "id": "REQ-031-036", "title": "Only active admin roles can be assigned", "attrs": {"statement": "The role dropdown on the invitation form is populated from active admin roles, including custom admin roles, and shows role name plus a brief description on hover; an expandable role permission summary is shown below it, and a role must be selected (\"Please select a role for this team member.\"). Only active roles can be assigned to new or existing users.", "rationale": "Screen 2 business rules and notes; Data Dependencies (State: Active Roles)."}}
  - {"op": "update_node", "id": "REQ-031-039", "title": "Invitation status on the account", "attrs": {"statement": "When an invitation is sent, System records it on the new admin user's account with status \"Invited\", marks it \"Accepted\" when the account is created and shows it as \"Expired\" when the token has passed its expiry, when Cancel is used on Admin Account Setup, or when it still cannot be sent 24 hours after it was created. The pending invitations list shows each invitation's status.", "rationale": "Main Flow steps 12 and 21; Alternative Flows A1 and B4; Screen 3 Cancel. The account status before acceptance is \"Pending\"; \"Pending Send\" is the invitation status while sending fails (REQ-031-043)."}}
  - {"op": "update_node", "id": "REQ-031-043", "title": "Invitation email delivery failure follows the FR-030 retry rule", "attrs": {"statement": "If the invitation email fails to send, System logs each failed delivery in the audit trail and retries under the notification retry rule owned by FR-030 (this flow sets no retry count or interval of its own). While sending fails the invitation shows \"Pending Send\" and the Super Admin is warned \"Invitation created but email failed. We'll retry automatically.\"; if the invitation still cannot be sent 24 hours after it was created, it becomes \"Expired\" and the system alerts the admin team. The Super Admin can resend the invitation.", "rationale": "Alternative Flow B4; Edge Case 3; External Dependencies (failure handling); Integration 2. The retry rule is FR-030 General Module Rule 7."}}
  - {"op": "update_node", "id": "REQ-031-047", "attrs": {"statement": "Cancel on Admin Account Setup returns to the login page and invalidates the invitation token; the invitation then shows as \"Expired\".", "rationale": "Screen 3 actions. The Super Admin can resend the invitation (Alternative Flow A1)."}}
  - {"op": "update_node", "id": "REQ-031-049", "attrs": {"rationale": "Main Flow steps 17 to 25; Screen 3 Success Flow. User Story 1 expects the invitation email within 1 minute and the account status \"Pending\" before acceptance."}}
  - {"op": "update_node", "id": "REQ-031-050", "title": "Every admin user holds exactly one role", "attrs": {"statement": "All admin users MUST have exactly one role assigned (no \"roleless\" accounts).", "rationale": "Business Rule 1; Key Entities, Entity 1 (one admin user has one assigned role)."}}
  - {"op": "update_node", "id": "REQ-031-052", "title": "Super Admin row actions", "attrs": {"statement": "Edit Permissions and Clone Role are disabled for the Super Admin role; View Users stays available.", "rationale": "Tab 1 data fields (Actions)."}}
  - {"op": "update_node", "id": "REQ-031-053", "attrs": {"statement": "Suspended admin users cannot log in but their accounts remain in the system (soft suspension, not deletion); Super Admin accounts are never suspended inside the product. Super Admins can suspend and reactivate the other admin accounts.", "rationale": "Business Rule 7; Tab 2 business rules and actions; Admin Editability. REQ-031-021 covers rejection of API calls."}}
  - {"op": "update_node", "id": "REQ-031-055", "attrs": {"statement": "Role names of system-defined roles (admin and provider) MUST be immutable (not editable or renamable); the system admin roles are Super Admin, Aftercare Specialist, Billing Admin and Support Staff, and the protected provider roles are Owner, Manager, Clinical Staff and Billing Staff. Only custom admin roles can be renamed."}}
  - {"op": "update_node", "id": "REQ-031-056", "title": "System roles cannot be deleted", "attrs": {"statement": "System admin roles (Super Admin, Aftercare Specialist, Billing Admin, Support Staff) cannot be deleted; all of them except Super Admin can be edited. The four provider roles cannot be renamed or removed."}}
  - {"op": "update_node", "id": "REQ-031-057", "attrs": {"rationale": "Tab 1 business rules and actions; Screen 4 data fields; Admin Editability. Custom roles exist for admin roles only; the four provider roles are fixed."}}
  - {"op": "update_node", "id": "REQ-031-068", "title": "Provider permissions limited to named roles", "attrs": {"statement": "Provider permissions Manage Bank Details, Edit Settings and Remove Team Members are Owner only; Document Treatment is limited to Owner or Clinical Staff; Edit Team Member Roles (non-Owner) is limited to Owner or Manager."}}
  - {"op": "update_node", "id": "REQ-031-069", "attrs": {"statement": "The admin permission Issue Refunds is a write permission that requires approval; any admin holding the permission may approve, no second person is required, and the approval step is defined in FR-007.", "rationale": "Screen 4 Billing & Financial category (A-05), access level \"Write (requires approval)\". FR-007 owns the approval rule (REQ-007-015)."}}
  - {"op": "update_node", "id": "REQ-031-077", "attrs": {"statement": "The matrix view shows permissions as rows grouped by category/module and all roles of the same type (Admin or Provider, including custom admin roles) as columns, with checkboxes or access-level indicators. Super Admins can edit several roles at once and save all changes together; bulk actions are Select All on a column header, Select All on a row header, and Select Category; locked cells (Super Admin, Owner) show a lock icon and a disabled checkbox. The matrix can be filtered by category, searched by permission name, set to show only differences, sorted by role or permission, and exported to CSV or Excel."}}
  - {"op": "update_node", "id": "REQ-031-090", "attrs": {"statement": "System sends an alert to Super Admin when one admin is refused access 5 times within 10 minutes (launch default; the count and the time window are admin settings in A-09; potential security issue).", "rationale": "Alternative Flow B5 step 6; Communication Structure (system notifications for access denial attempts); Admin Editability (Configurable with Restrictions)."}}
  - {"op": "update_node", "id": "REQ-031-099", "attrs": {"statement": "The maximum failed login attempts before lockout (default 5 failed attempts with a 15-minute lockout, the same setting as FR-001), the session timeout duration (the admin inactivity timeout of A-09, default 30 minutes) and the number of concurrent sessions per admin user (default 3, range 1-5) are configurable in A-09 Authentication Settings.", "rationale": "Admin Editability (Configurable with Restrictions). The session timeout is the admin inactivity timeout SET-admin-inactivity-timeout (FR-026); the lockout default is the FR-001 / FR-026 lockout setting. The admin login rate limit (REQ-031-100) is a separate control."}}
  - {"op": "update_node", "id": "REQ-031-107", "attrs": {"statement": "Permission category \"Billing & Financial\" (A-05) in the admin permission matrix offers: View Transactions (View patient and provider transactions; Read); Process Payouts (Initiate provider payouts; Write); Issue Refunds (Process patient refunds; Write (requires approval; any admin holding this permission may approve, no second person is required; approval step defined in FR-007)); View Financial Reports (Access revenue analytics; Read); View Patient Billing (View patient invoices and payment status; Read); Send Payment Reminders (Send payment reminders to patients; Write); Download Invoices (Download patient/provider invoices; Read)."}}
  - {"op": "update_node", "id": "REQ-031-113", "attrs": {"statement": "Permission category \"System Settings\" (A-09) in the admin permission matrix offers: View Settings (View system configuration; Read); Edit Settings (Modify system settings; Write (Super Admin only)); Manage Users (Create/edit admin accounts; Write (Super Admin only)); Manage Roles (Create/edit roles and permissions; Write (Super Admin only)); Manage Terms & Conditions (Edit patient/provider terms and consent; Write); Manage App Data (Edit countries, discovery questions, location presentation; Write); Manage Treatment Catalog (Create/edit treatments and packages; Write); Manage Aftercare Templates (Create/edit aftercare milestone templates; Write); Manage Notification Templates (Edit email templates (OTP, confirmations); Write); Configure Payment Settings (Manage Stripe accounts, commission rates, split pay; Write); Manage Help Centre (Create/edit Help Centre content for providers; Write); View Sensitive Settings (View the full value of sensitive settings (for example API keys); Read); Manage Authentication Policies (Edit authentication policy settings (for example lockout and session timeout); Write)."}}
  - {"op": "update_node", "id": "REQ-031-116", "attrs": {"statement": "Permission category \"Treatment & Procedures\" (PR-03) in the provider permission matrix offers: View In-Progress Cases (View patients currently in treatment; Read); Document Treatment (Add treatment notes, scans, photos; Write (Owner or Clinical Staff only)); Update Treatment Status (Change patient treatment stage; Write); View Treatment History (Access historical treatment records; Read)."}}
  - {"op": "update_node", "id": "REQ-031-119", "attrs": {"statement": "Permission category \"Team Management\" (PR-01) in the provider permission matrix offers: View Team Members (View team member list; Read); Invite Team Members (Send team member invitations; Write); Edit Team Member Roles (Change team member roles (non-Owner); Write (Owner or Manager only)); Remove Team Members (Remove or suspend team members; Write (Owner only)); View Team Activity (Access team activity logs; Read)."}}
