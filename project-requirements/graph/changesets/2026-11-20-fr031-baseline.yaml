  - {"op": "add_node", "id": "REQ-031-124", "type": "Rule", "owner_fr": "FR-031", "title": "Role change must be acknowledged within 24 hours", "attrs": {"statement": "System MUST ask an admin user to acknowledge a role change within 24 hours; the acknowledgement time is stored on the account and shown to Super Admins", "rationale": "PRD Functional Requirements Summary, REQ-031-124; Business Rule 10; Alternative Flow A2 step 13 (Acknowledge role change action as a banner after sign-in and a link in the email); Tab 2 notes; Screen 5 field Role Change Acknowledged; Key Entity 1."}}
