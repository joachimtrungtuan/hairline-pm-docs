  - {"op": "update_node", "id": "ENT-role-permission-definition", "attrs": {"description": "Role definition for admin and provider roles, scoped by guard: system (protected) or custom (custom roles exist for admin roles only), with a permission matrix. Cloned admin roles keep an independent permission snapshot (PRD Key Entities, Entity 2). FR-009 created this as a provider-role stub; the PRD covers both guards."}}
  - {"op": "update_node", "id": "ENT-admin-user-account", "attrs": {"description": "An admin team member's account: identity, one assigned role with its effective date, the time the user acknowledged the latest role change, status, login history and invitation state (PRD Key Entities, Entity 1). The invitation is recorded on the account; there is no separate invitation record."}}
  - {"op": "update_node", "id": "SCR-031-01", "attrs": {"description": "Admin Platform, Settings > User Roles & Permissions, three tabs: Admin Roles, Admin Users, Provider Roles (PRD Screen 1). UI controls, not fields: tab switcher, role list action buttons (Edit Permissions, View Users, Clone Role; disabled for Super Admin), Create Custom Role, Invite Team Member, user action menu (Change Role, Suspend, View Audit), search bar and filters (Tab 2 specified in FR-022 REQ-022-115, Tab 1 in REQ-022-116), pending invitations sub-tab and notification dot, sync status indicator, warning banner when only one Super Admin exists. Tab 3 View Users links to FR-015. Tab 2 rows also show whether the user has acknowledged the latest role change (Acknowledged or Awaiting acknowledgement)."}}
  - {"op": "update_node", "id": "SCR-031-05", "attrs": {"description": "Admin Platform page with an admin user's profile and audit trail (PRD Screen 5). UI controls: Send Password Reset, Load More, Export audit trail to CSV, security alerts, audit filters (specified in FR-022 REQ-022-117). Admin actions on a patient account (FR-016) appear in the acting admin's audit trail; the records stay separate. Shows the Role Change Acknowledged status."}}
