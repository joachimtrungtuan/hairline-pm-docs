  - {"op": "add_node", "id": "SET-admin-repeated-denial-threshold", "type": "Setting", "owner_fr": "FR-031", "title": "Repeated access denial alert threshold", "attrs": {"description": "Refusals of one admin that trigger the Super Admin alert: 5 refusals within 10 minutes at launch; both the count and the 10-minute window are admin settings in A-09 (FR-031 Alternative Flow B5, Admin Editability).", "default": "5", "unit": "refusals"}}
  - {"op": "add_node", "id": "ACT-finance-admin", "type": "Actor", "title": "Finance admin", "attrs": {"group": "admin", "description": "Admin team member who works the financial screens of the Admin Platform (payouts, billing, provider financial reports); the predefined role for this work is Billing Admin, and Super Admin also has full access (FR-031 Module Scope)."}}
