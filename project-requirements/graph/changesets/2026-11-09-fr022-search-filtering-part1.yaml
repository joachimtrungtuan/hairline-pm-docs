  # --- Rules: prose rules outside Screen Specifications, new ids in PRD order ---
  - {"op": "add_node", "id": "REQ-022-059", "type": "Rule", "owner_fr": "FR-022", "title": "Entry points to search and filter", "attrs": {"statement": "Patient Platform: [P2] Provider Search is accessed when the patient begins the quote request flow and needs to select destination/providers, is triggered from the \"Choose Destination\" or \"Select Providers\" screens, and is available throughout the quote request journey for comparison; [P2] Messaging search is accessed from the patient communications inbox once FR-012 messaging is scheduled; [P1] Help & Support search is accessed from the Help & Support hub, Help Center, and My Support Tickets screens. Provider Platform: PR-01 (Team) from Provider Dashboard → Team tab → Team Directory (FR-009/Screen 10); PR-02 (Inquiries/Quotes) from Provider Dashboard → Inquiries tab → Inquiry List (FR-003/Screen 9) and Quotes List (FR-004/Screen 2); PR-03 (Treatment) from Provider Dashboard → Treatments tab → In Progress Cases (FR-010/Screen 3); PR-04 (Aftercare) from Provider Dashboard → Aftercare tab → Aftercare Cases List (FR-011/Screen 8); PR-05 (Analytics) from Provider Dashboard → Analytics tab → Analytics Dashboard (FR-014/Screen 1); PR-06 (Profile/Settings) from Provider Dashboard → Profile/Settings section — Packages (FR-024/Screen 4), Help Centre (FR-032/Screen 5), Reviews (FR-032/Screen 1 Tab 5), Support Cases (FR-032/Screen 5.7); PR-07 (Messaging) [P2 - Post-MVP] from the provider secure messaging inbox once FR-012 is scheduled. Admin Platform [P1 - MVP]: each admin module (A-01 through A-10) provides context-specific search and filtering within its own interface.", "rationale": "Entry Points (prd.md lines 86-110). Business Process Assumption 3: patient searches for providers occur during the quote request flow, not as standalone exploration [P2]. Change log 2.7 removed admin global/cross-module search entry points."}}
  - {"op": "add_node", "id": "REQ-022-060", "type": "Rule", "owner_fr": "FR-022", "title": "Keyword and filters evaluated together in real time", "attrs": {"statement": "Search and filter controls are available simultaneously; the System evaluates the active keyword AND active filters together in real-time (Main Flow 1 admin patient search, Main Flow 2 admin provider search). In patient provider discovery the System evaluates destination, keyword, and filters together in real-time (Main Flow 3 [P2 - Post-MVP]).", "rationale": "Main Flows 1-3 CTRL and QUERY nodes (prd.md lines 127-188)."}}
  - {"op": "add_node", "id": "REQ-022-061", "type": "Rule", "owner_fr": "FR-022", "title": "Default list and reset per search flow", "attrs": {"statement": "Admin opens Patients module — full patient list shown by default; Reset all clears all inputs and restores the full patient list (Main Flow 1). Admin opens Providers module — Active providers shown by default (FR-015 Screen 1); Reset all restores the default Active-only list (Main Flow 2). Patient Reset all clears all inputs and restores the full country list (Main Flow 3 [P2 - Post-MVP]).", "rationale": "Main Flows 1-3 NAV and RESET nodes (prd.md lines 124-199). FR-015 / Screen 1 Status filter default Active (line 1140)."}}
  - {"op": "add_node", "id": "REQ-022-062", "type": "Rule", "owner_fr": "FR-022", "title": "No-results feedback with refinement guidance", "attrs": {"statement": "When a search term or filter combination matches no records, the System displays 'No results found' with refinement guidance: check spelling or try different keywords; remove one or more filters; contact support (admin platform only). In patient provider discovery the System displays 'No providers found' with refinement guidance.", "rationale": "Alternative Flow B1 (prd.md lines 275-295); Main Flows 1-3 EMPTY nodes."}}
  - {"op": "add_node", "id": "REQ-022-063", "type": "Rule", "owner_fr": "FR-022", "title": "Search unavailable: message, retry, engineering alert", "attrs": {"statement": "If the backend database connection fails during a search query, the System displays 'Search temporarily unavailable. Please try again.', logs the error and alerts the engineering team; the user can retry, abandon the search or contact support.", "rationale": "Alternative Flow B2 (prd.md lines 296-315)."}}
  - {"op": "add_node", "id": "REQ-022-124", "type": "Rule", "owner_fr": "FR-022", "title": "Fuzzy, accent-insensitive matching via full-text indexes", "attrs": {"statement": "Search functionality MUST support fuzzy matching via database full-text indexes (e.g., \"Mark P\" matches \"Mark Patterson\"; \"Mehmet\" matches \"Mehmet Yilmaz\"; accent-insensitive matching, e.g., \"Jose\" matches \"José\").", "rationale": "General Module Rule 2 (line 1797). Restated by Edge Case 4 (accent-insensitive matching, José matches Jose). Refines REQ-022-007. Advanced fuzzy features (synonyms, edit distance, relevance) are a P3 external-search enhancement."}}
  - {"op": "add_node", "id": "REQ-022-125", "type": "Rule", "owner_fr": "FR-022", "title": "Filter selections persist for the session", "attrs": {"statement": "Filter selections MUST persist during user session (cleared on logout)", "rationale": "General Module Rule 4 (line 1799)."}}
  - {"op": "add_node", "id": "REQ-022-126", "type": "Rule", "owner_fr": "FR-022", "title": "Autocomplete limited to 10 suggestions", "attrs": {"statement": "Autocomplete suggestions MUST be limited to 10 results to avoid overwhelming user", "rationale": "General Module Rule 7 (line 1802). Admin Editability Rules list the autocomplete result limit (10 suggestions) as fixed in codebase. REQ-022-015 applies the same limit to P2 location autocomplete."}}
  - {"op": "add_node", "id": "REQ-022-127", "type": "Rule", "owner_fr": "FR-022", "title": "Search history not stored", "attrs": {"statement": "Search history MUST NOT be stored (privacy consideration for admin platform)", "rationale": "General Module Rule 8 (line 1803). See needs-decision item on admin search audit logging (REQ-022-023, REQ-022-027)."}}
  - {"op": "add_node", "id": "REQ-022-128", "type": "Rule", "owner_fr": "FR-022", "title": "Patient contact information not indexed for public search", "attrs": {"statement": "Patient contact information MUST NOT be indexed for public search (admin only)", "rationale": "Data & Privacy Rule 3 (line 1810)."}}
  - {"op": "add_node", "id": "REQ-022-129", "type": "Rule", "owner_fr": "FR-022", "title": "Provider financial data not searchable by other providers", "attrs": {"statement": "Provider financial data MUST NOT be searchable by other providers (admin only)", "rationale": "Data & Privacy Rule 4 (line 1811)."}}
  - {"op": "add_node", "id": "REQ-022-130", "type": "Rule", "owner_fr": "FR-022", "title": "Featured providers curated by admin; affects Recommended sort", "attrs": {"statement": "Featured provider designation is a manually curated list editable by admin; admin can feature/unfeature providers in patient search, affecting \"Recommended\" sort order.", "rationale": "Admin Editability Rules: Editable by Admin (line 1820) and Configurable with Restrictions (line 1833). Business Process Assumption 4: Featured status is manually curated by admin based on performance, quality, and partnerships. FR-015 / Screen 1 Featured filter."}}
  - {"op": "add_node", "id": "REQ-022-131", "type": "Rule", "owner_fr": "FR-022", "title": "Only active providers appear in search; suspension hides, never deletes", "attrs": {"statement": "Provider visibility status: active providers appear in search, suspended do not. Admin can temporarily disable provider from search results (suspension) but cannot delete provider record.", "rationale": "Admin Editability Rules: Editable by Admin (line 1821) and Configurable with Restrictions (line 1832)."}}
  - {"op": "add_node", "id": "REQ-022-132", "type": "Rule", "owner_fr": "FR-022", "title": "Debounce timing fixed: 300ms local, 500ms server query", "attrs": {"statement": "Search debounce timing is fixed in codebase (not editable): per REQ-022-012, 300ms for local filters, 500ms for server-query searches.", "rationale": "Admin Editability Rules: Fixed in Codebase (line 1825)."}}
  - {"op": "add_node", "id": "REQ-022-133", "type": "Rule", "owner_fr": "FR-022", "title": "Search query maximum length by platform", "attrs": {"statement": "Search query max length is fixed in codebase (not editable): 200 chars for admin, 200 chars for provider, 50 chars for patient.", "rationale": "Admin Editability Rules: Fixed in Codebase (line 1828); change log 2.3 item 3 and 2.5 item 5. See needs-decision item on screens that set 100 chars."}}
  - {"op": "add_node", "id": "REQ-022-134", "type": "Rule", "owner_fr": "FR-022", "title": "No active providers in the selected country [P2]", "attrs": {"statement": "When a patient searches for providers in a country with no active providers, the System displays \"No providers available in [country]. Please try another location or contact support.\" with link to support chat.", "rationale": "Edge Case 1 (prd.md lines 2135-2136)."}}
  - {"op": "add_node", "id": "REQ-022-135", "type": "Rule", "owner_fr": "FR-022", "title": "Many results: first page, total count and narrowing banner", "attrs": {"statement": "When an admin search matches very many records (e.g., a very common name), the System displays the first page of results (25 per page, per REQ-022-006) with total result count shown (e.g., \"500+ results found\") and an informational banner: \"Many results found. Use filters to narrow down by location, status, or patient ID.\"", "rationale": "Edge Case 2 (prd.md lines 2138-2139); change log 2.4 item 2 (pagination is the single model; no truncation)."}}
  - {"op": "add_node", "id": "REQ-022-136", "type": "Rule", "owner_fr": "FR-022", "title": "Search timeout after 10 seconds", "attrs": {"statement": "Search times out after 10 seconds; error message displayed: \"Search taking too long. Please try again or contact support.\"; error logged for engineering team to investigate.", "rationale": "Edge Case 5 (prd.md lines 2147-2148); the missing-index cause is technical and not migrated."}}
  - {"op": "add_node", "id": "REQ-022-137", "type": "Rule", "owner_fr": "FR-022", "title": "Duplicate patient accounts all returned and flagged", "attrs": {"statement": "When a patient has multiple accounts with the same name/email, search returns all matching accounts; the admin reviews each record to identify the correct patient using patient ID, location, or registration date; duplicate account detection is flagged in results.", "rationale": "Edge Case 7 (prd.md lines 2153-2154)."}}
  - {"op": "add_node", "id": "REQ-022-138", "type": "Rule", "owner_fr": "FR-022", "title": "Patient email and phone shown only to authorised admins", "attrs": {"statement": "Patient PII (email, phone) displayed only to authorized admins with proper permissions", "rationale": "Implementation Notes, Security Considerations: Data masking (line 2039); promoted as a business rule. Permissions per FR-031."}}
  # --- Settings (Admin Editability Rules; owner not named by the PRD, FR-022 provisionally) ---
  - {"op": "add_node", "id": "SET-search-results-page-size", "type": "Setting", "owner_fr": "FR-022", "title": "Maximum search results per page", "attrs": {"description": "Admin-editable maximum search results per page; range 10-100.", "default": "25", "unit": "results per page"}}
  - {"op": "add_node", "id": "SET-provider-search-default-sort", "type": "Setting", "owner_fr": "FR-022", "title": "Default sort order for provider search", "attrs": {"description": "Admin-editable default sort order for patient provider search; options Recommended, Rating, Price, Experience. The PRD gives no default value. [P2 - Post-MVP]"}}
