  - {"op": "add_node", "id": "SCR-032-14", "type": "Screen", "owner_fr": "FR-032", "title": "Contact Support", "attrs": {"platform": "provider", "description": "Help Centre support request form and submission tracking (PRD Screen 5.5). Submissions create FR-034 cases. UI controls, not fields: Submit button."}}
  - {"op": "add_node", "id": "SCR-032-15", "type": "Screen", "owner_fr": "FR-032", "title": "Feedback & Suggestions", "attrs": {"platform": "provider", "description": "Help Centre feedback form and submission tracking (PRD Screen 5.6). Submissions create FR-034 feedback cases. UI controls, not fields: Submit button."}}
