  - {"op": "add_node", "id": "REQ-032-102", "type": "Rule", "owner_fr": "FR-032", "title": "Contact support form limits", "attrs": {"statement": "Support Request Form - Subject: Max 200 chars; Support Request Form - Message: Max 2000 chars, min 20 chars; Support Request Form - Priority: Default: Medium; Support Request Form - Attachment: Max 10MB, common file types (PDF, PNG, JPG, DOCX)", "rationale": "Screen 5.5. Help Centre Main Flow step 20 lists only subject, message and attachment. Screen: SCR-032-14."}}
  - {"op": "add_node", "id": "REQ-032-103", "type": "Rule", "owner_fr": "FR-032", "title": "Support request confirmation and response time", "attrs": {"statement": "Support request confirmation displayed: \"Support request submitted. Ticket #[number]. Our team will respond within 24 hours.\"", "rationale": "Screen 5.5; Help Centre Main Flow step 23. Screen: SCR-032-14."}}
