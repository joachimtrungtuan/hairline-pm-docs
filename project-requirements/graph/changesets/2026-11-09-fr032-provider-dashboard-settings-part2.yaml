  - {"op": "add_node", "id": "REQ-032-113", "type": "Rule", "owner_fr": "FR-032", "title": "Reopen request needs a reason", "attrs": {"statement": "Modal only accessible from Screen 5.8 when viewing Closed cases; Reopening reason required (min 20 chars) to prevent accidental/spam reopening; Reopening Reason: Min 20 chars, max 500 chars; Provider can optionally adjust priority when reopening (e.g., escalate if issue was marked resolved incorrectly)", "rationale": "Screen 5.9; Support Alternative Flow A1. Screen: SCR-032-18."}}
