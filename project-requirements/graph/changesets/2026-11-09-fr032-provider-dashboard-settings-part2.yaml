  - {"op": "add_node", "id": "REQ-032-097", "type": "Rule", "owner_fr": "FR-032", "title": "Cached Help Centre content when loading fails", "attrs": {"statement": "displays cached version of Help Centre content (if available) with warning banner \"Content may be outdated. Please refresh to load latest updates.\", and provides \"Retry\" button for manual refresh", "rationale": "Edge Cases; Alternative Flow B12 (\"Unable to load Help Centre content. Please check your connection and try again.\"); Integration Points: retry after 1 minute."}}
