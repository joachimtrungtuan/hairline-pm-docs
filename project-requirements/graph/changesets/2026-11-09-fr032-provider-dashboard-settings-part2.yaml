  - {"op": "add_node", "id": "REQ-032-109", "type": "Rule", "owner_fr": "FR-032", "title": "Replies allowed only on open cases", "attrs": {"statement": "Providers can reply to admin messages for Open and In Progress cases via Reply Message Box; For Resolved cases, Reply Message Box is read-only with message: \"This case has been marked as resolved. If the issue persists, click 'Request Reopen'.\"; For Closed cases, Reply Message Box is disabled; provider can only click \"Request Reopen\" button", "rationale": "Screen 5.8; Support Main Flow step 18 (\"not empty, case is Open or In Progress\"). Screen: SCR-032-17."}}
  - {"op": "add_node", "id": "REQ-032-110", "type": "Rule", "owner_fr": "FR-032", "title": "Support reply limits", "attrs": {"statement": "Reply Message Box: Max 2000 chars; only enabled for Open and In Progress cases; Character counter displayed; Attach Files Button: Max 3 files, 10MB per file, formats: JPG, PNG, PDF, DOC, DOCX; Attachment files validated before upload (file type, size, virus scan)", "rationale": "Screen: SCR-032-17."}}
