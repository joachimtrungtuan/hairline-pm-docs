  - {"op": "update_node", "id": "STP-030-034", "title": "System prompts that events during the pause will not send notifications and that queued notices are still delivered"}
  - {"op": "update_node", "id": "STP-030-036", "title": "System pauses the rule: events that occur during the pause are skipped and notices already queued are still delivered"}
  - {"op": "update_node", "id": "STP-030-053", "title": "If retry is enabled and the bounce is soft, system queues a retry after the retry interval (platform default 1 hour); a hard bounce is not retried and is marked Failed - Permanent at once"}
  - {"op": "update_node", "id": "STP-030-054", "title": "After ordinary retries are exhausted (platform default 3; an admin may set 1 to 5), system marks the notification Failed - Permanent; during an email provider outage the notice is held up to 24 hours and then marked Failed - Service Outage"}
  - {"op": "update_node", "id": "STP-030-055", "title": "System flags the recipient's account with an Email delivery issue indicator, whatever the account type"}
  - {"op": "update_node", "id": "STP-030-056", "title": "Admin receives a system.alert, in-app and by a channel other than the failing one, when a locked notice fails permanently"}
  - {"op": "update_node", "id": "STP-030-057", "title": "Admin contacts the recipient by phone or in-app message to update the email address"}
  - {"op": "update_node", "id": "STP-030-070", "title": "Admin saves the rule and, when ready, activates it; the system refuses the activation if it overlaps an Active rule of the same event"}
