by: docs-manager
operations:
  - {"op": "add_node", "id": "EVT-provider-status-redistribution-reminder", "type": "Event", "owner_fr": "FR-030", "title": "Provider status redistribution reminder", "attrs": {"description": "provider.status_redistribution_reminder: sent once to the patient 48 hours after the confirm variant of provider.status_cancellation_patient is left unanswered (FR-020 REQ-020-159); dropped when the patient has answered, the inquiry was cancelled, an admin reassigned or reran distribution, or the support marker was cleared. Mandatory."}}
  - {"op": "add_node", "id": "EVT-monitoring-progress-reminder", "type": "Event", "owner_fr": "FR-030", "title": "monitoring.progress_reminder", "attrs": {"description": "monitoring.progress_reminder: default patient reminder on a transplant-progress case (FR-038) only; hair-loss monitoring cases (FR-037) have no reminders. Schedule set on Screen 1; stopped when the case is completed or converted."}}
