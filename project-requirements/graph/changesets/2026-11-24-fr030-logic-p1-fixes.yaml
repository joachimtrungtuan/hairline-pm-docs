  - {"op": "update_node", "id": "REQ-030-031", "attrs": {"statement": "Inquiry Cancelled (inquiry.cancelled) is an admin-configurable notification event. Primary recipients: Patient, Admin (optional). Fires when the patient cancels the inquiry in the Inquiry or Quoted stage (FR-003 Workflow 5) and when an admin closes the inquiry (FR-006 Close inquiry). The patient receives a mandatory cancellation confirmation (aligns with FR-003 Workflow 5 step 4 and Screen 8b); a cancellation caused by an approved account deletion sends the patient no notice. The patient's cancellation reason is private to the patient. The admin-close notice says the inquiry was closed by Hairline, gives the reason entered in FR-006, says no replacement follows, and carries the Contact Admin/Support action. MVP default channels: Email + Push. Template variables: `inquiry.id`, `inquiry.cancellation_reason`, `inquiry.cancelled_at`. Providers are not recipients: a provider that holds a draft, sent or expired quote on the inquiry receives only `quote.cancelled_inquiry`, and a provider that never quoted is told nothing."}}
  - {"op": "update_node", "id": "REQ-030-035", "attrs": {"statement": "Quote Expiring Soon (quote.expiring_soon) is an admin-configurable notification event. Primary recipients: Patient, Provider. Fired by FR-004 once per expiry window of a sent parent quote when the time left before expiry reaches the quote-expiring-soon lead time set by admin in FR-026 (a restored quote has a new window and can fire it again). Never fired for drafts or for accepted, withdrawn or cancelled quotes. Admin-configurable"}}
  - {"op": "update_node", "id": "REQ-030-036", "attrs": {"statement": "Quote Expired (quote.expired) is an admin-configurable notification event. Primary recipients: Patient, Provider. Fired by FR-004 once per expiry window when a sent parent quote expires, on expiry processing completion (a restored quote that expires again fires it again)"}}
  - {"op": "update_node", "id": "REQ-030-039", "attrs": {"statement": "Quote Cancelled (Inquiry Cancelled) (quote.cancelled_inquiry) is an admin-configurable notification event. Primary recipients: Provider. Sent to each provider that holds a draft, sent or expired quote when the patient cancels the inquiry (FR-003 Workflow 5) and when an approved account deletion cancels it; never to the provider of a replacement draft quote, and no provider notice is sent for an admin Close inquiry. A provider that never quoted is told nothing, and a provider that receives this notice never also receives `inquiry.cancelled`. Provider receipt is mandatory — admin cannot disable this event (see Non-Disableable by Default section); it is sent at once as a locked notice (FR-020 sets the 5-minute first-send target). The reason shows only as \"Inquiry cancelled by patient\"; the deletion cancellation shows none. MVP default channels: Email + Push. Not subject to FR-032 provider notification preferences; FR-032 offers no toggle for this event. Available template variables: `quote.id`, `quote.provider_id`, `inquiry.id`, `inquiry.cancelled_at`; `inquiry.cancellation_reason` is excluded per privacy rule."}}
  - {"op": "update_node", "id": "REQ-030-044", "attrs": {"statement": "Provider Unable to Proceed — Replacement Being Arranged (booking.provider_fault_replacement) is an admin-configurable notification event. Primary recipients: Patient, Admin. Fired by FR-006 when an accepted booking is closed for provider fault and a replacement is arranged. Each cause sends these notices: a withdrawal after acceptance sends `quote.withdrawn` and then this event; a drop-out before treatment starts sends `booking.cancelled` (provider-fault cause) to the patient and provider at the FR-006 Screen 10 submit, and this event then announces the transfer; a suspension or deactivation after acceptance and before treatment starts (FR-015) sends only this event. An `In Progress` booking is not closed for provider fault and never fires this event; it stays `In Progress` with `supportRequired` for an admin decision. Tells the patient that an admin will arrange a replacement provider within the same inquiry and that the patient pays no cancellation fee; MUST NOT expose confidential suspension or deactivation reasons. Admins receive it as an exception alert so they can arrange the replacement. Providers are not recipients: the replacement provider learns through the normal new-booking and acceptance notice, and the faulted provider is not notified by this event. Mandatory — admin cannot disable this event"}}
  - {"op": "update_node", "id": "REQ-030-045", "attrs": {"statement": "Booking Confirmed (booking.confirmed) is an admin-configurable notification event. Primary recipients: Patient, Provider. Sent when the first payment confirms the booking (FR-006)"}}
  - {"op": "update_node", "id": "REQ-030-047", "attrs": {"statement": "Booking Cancelled (booking.cancelled) is an admin-configurable notification event. Primary recipients: Patient, Provider, Admin (optional). Fires for an Admin cancellation, a provider drop-out at the FR-006 Screen 10 submit, and a system cancellation for an unpaid balance (including an installment plan default). A provider suspension or deactivation closure sends `booking.provider_fault_replacement` instead. The notice states the cancellation reason in the wording FR-006 defines (REQ-006-011); the system fills in any fee and refund amounts"}}
  - {"op": "update_node", "id": "REQ-030-048", "attrs": {"statement": "Appointment Reminder (booking.appointment_reminder) is an admin-configurable notification event. Primary recipients: Patient, Provider. Scheduled reminders before the appointment; policy-driven. Admin-switchable: it is not a locked notice"}}
  - {"op": "update_node", "id": "REQ-030-055", "attrs": {"statement": "Payment Received / Receipt (payment.received) is an admin-configurable notification event. Primary recipients: Patient, Provider, Admin (optional). Receipt for a payment received. Mandatory — admin cannot disable this event (see Non-Disableable by Default section)"}}
  - {"op": "update_node", "id": "REQ-030-056", "attrs": {"statement": "Payment Failed (payment.failed) is an admin-configurable notification event. Primary recipients: Patient, Admin (optional). Sent when a payment fails. Mandatory — admin cannot disable this event (see Non-Disableable by Default section)"}}
  - {"op": "update_node", "id": "REQ-030-075", "attrs": {"statement": "Aftercare Escalation / Red Flag Triggered (aftercare.escalation_triggered) is an admin-configurable notification event. Primary recipients: Provider, Admin, Patient (optional). Red-flag alert; escalation recipients configurable"}}
  - {"op": "update_node", "id": "REQ-030-078", "attrs": {"statement": "Monitoring Case Pending Assignment (monitoring.assignment_pending) is an admin-configurable notification event. Primary recipients: Admin. Advice-mode hair-loss monitoring case activated and awaiting provider assignment (FR-037 only)"}}
  - {"op": "update_node", "id": "REQ-030-079", "attrs": {"statement": "Monitoring Provider Assigned (monitoring.provider_assigned) is an admin-configurable notification event. Primary recipients: Patient, Provider. Initial assignment or reassignment; assignment type distinguished in payload (FR-037 only)"}}
  - {"op": "update_node", "id": "REQ-030-080", "attrs": {"statement": "Monitoring Provider Withdrawn (monitoring.provider_withdrawn) is an admin-configurable notification event. Primary recipients: Admin, Patient. Provider withdraws with reason; case returns to Admin as Pending Reassignment (FR-037 only)"}}
  - {"op": "update_node", "id": "REQ-030-081", "attrs": {"statement": "Monitoring Provider Reassigned (monitoring.provider_reassigned) is an admin-configurable notification event. Primary recipients: Patient, Provider. Replacement provider assigned after withdrawal; replacement receives history and next eligible advice date (FR-037 only)"}}
  - {"op": "update_node", "id": "REQ-030-082", "attrs": {"statement": "Monitoring Advice Posted (monitoring.advice_posted) is an admin-configurable notification event. Primary recipients: Patient. Provider submits or edits the one advice-window paragraph for the current window; an edit sends the same notice marked \"updated\" (FR-037 only)"}}
  - {"op": "update_node", "id": "REQ-030-084", "attrs": {"statement": "Monitoring PDF Export Ready (monitoring.export_ready) is an admin-configurable notification event. Primary recipients: Patient. A PDF has finished generating and is downloadable: the date-to-date summary PDF (FR-037/FR-038), the conversion PDF, or a regenerated report. For a converted case the notice opens FR-038 Screen 6 while the draft is open, otherwise Screen 7"}}
  - {"op": "update_node", "id": "REQ-030-085", "attrs": {"statement": "Monitoring Converted to Inquiry (monitoring.converted_to_inquiry) is an admin-configurable notification event. Primary recipients: Patient. Monitoring case successfully converts into a distinct FR-003 inquiry (FR-037 only; FR-038 converts to a standalone aftercare request instead)"}, "title": "Catalog event: Monitoring Converted to Inquiry"}
  - {"op": "update_node", "id": "REQ-030-086", "attrs": {"statement": "Review Request (review.requested) is an admin-configurable notification event. Primary recipients: Patient. Review invitation anchored on the review eligibility date (FR-013): the invitation is sent on that date and any reminder is counted from it, using this event's delivery timing; FR-013 does not set its own invitation timing"}}
  - {"op": "update_node", "id": "REQ-030-094", "attrs": {"statement": "Provider-Caused Cancellation / Offer Unavailable (provider.status_cancellation_patient) is an admin-configurable notification event. Primary recipients: Patient. FR-015 Alternative Flow A5 / Screen 4 (FR-020 REQ-020-013). One per affected inquiry/case when provider suspension (`ProviderSuspended`) or deactivation (`ProviderDeactivated`) cancels the patient's case or the provider's offer before acceptance. For a case already accepted, the patient instead receives `booking.provider_fault_replacement`. Before acceptance, three variants apply, checked in this order (FR-003 Workflow 2 Alternative Flow B4, REQ-003-021): (1) when other live offers remain open, the notice says \"[Clinic] is no longer available. Your other offers are still open.\"; (2) when no live offer remains and the patient had explicitly selected the affected provider, the notice asks the patient to confirm the redistribution first, with Confirm and Decline deep links to FR-003 Screen 8 (REQ-003-128); (3) when no live offer remains and the patient had not selected the provider, the inquiry is redistributed automatically and the notice says \"[Clinic] is no longer available. We are finding new offers for you.\" An unanswered confirm variant is followed by `provider.status_redistribution_reminder`. Includes inquiry/case reference and a Contact Admin/Support action. MUST NOT say the patient cancelled, instruct payment against the cancelled selection, or expose confidential suspension/deactivation reasons. Mandatory — admin cannot disable this event (see Non-Disableable by Default section); sent regardless of FR-015's \"Notify Provider\" checkbox. MVP default channels: Email + Push + in-app (global patient toggles still apply to Email/Push; in-app record always created). Retries de-duplicated per provider-status event + affected record + recipient"}}
  - {"op": "update_node", "id": "REQ-030-103", "attrs": {"statement": "System Escalation (system.escalation) is an admin-configurable notification event. Primary recipients: Admin. Operational escalation events requiring admin action; also the escalation notice S-03 sends to the escalation recipients when a locked notice meets its escalation condition (Not delivered or Not opened after the wait time)"}}
  - {"op": "update_node", "id": "REQ-030-104", "attrs": {"statement": "System Alert (system.alert) is an admin-configurable notification event. Primary recipients: Admin. System health/monitoring alerts surfaced via notifications; also raised when a locked notice fails permanently, in-app and by a channel other than the failing one"}}
  - {"op": "update_node", "id": "REQ-030-009", "attrs": {"statement": "System MUST log all notification deliveries (successful and failed), as a view of the FR-020 notification record and attempt rows, with recipient (masked), event, channel, timestamp, delivery status, and failure reason (if applicable)"}}
  - {"op": "update_node", "id": "REQ-030-017", "attrs": {"statement": "System MUST enforce rate limiting to prevent notification spam: a maximum number of notifications per hour per recipient, set by admins with a default of 10 (notices over the limit are held and sent in order in the next hour; locked (critical) notices are never held)"}}
  - {"op": "update_node", "id": "REQ-030-019", "attrs": {"statement": "System MUST respect recipient opt-out preferences for non-critical notifications (marketing, general updates); critical notifications (the locked notices) override opt-out with in-app explanation"}}
  - {"op": "update_node", "id": "REQ-030-111", "attrs": {"statement": "Notifications delivered via email and in-app notifications"}, "title": "Provider notifications go by email and in-app"}
  - {"op": "update_node", "id": "REQ-030-140", "attrs": {"statement": "System displays the backend event catalog (grouped by category) with each row showing the status of its rule (Active, Paused or Draft), channels, and last modified"}}
  - {"op": "update_node", "id": "REQ-030-141", "attrs": {"statement": "If toggled Off (its rules paused), S-03 sends no notification for events that occur meanwhile; a locked notice cannot be paused and its toggle is locked. Security-critical events (OTP verification, password reset) are non-disableable by default and show a locked toggle. If toggled On, S-03 uses the event's Active rule; an On event with no Active rule is sent with the catalogue defaults (default channels and the standard template). Every event ships with one seeded Active rule."}, "title": "Toggling an event off pauses its rules except locked notices; toggling on uses the Active rule or the catalogue defaults"}
  - {"op": "update_node", "id": "REQ-030-143", "attrs": {"statement": "Email: Enabled (required for payment reminders) Push notification: Enabled SMS: Optional (admin can enable for payment reminders in future phases; SMS is not available in MVP)"}}
  - {"op": "update_node", "id": "REQ-030-145", "attrs": {"statement": "Trigger: 3 days (72 hours) before installment due date (example only; the payment reminder schedule itself is the single payment reminder timing setting owned by FR-007) Delivery time: 9:00 AM in recipient's local timezone Skip If Too Late (optional): when the send time has already passed as the event occurs, the notice is not sent Retry logic: the platform default retry rule (retry on, up to 3 retries, 1 hour apart), or different values set for this notification"}}
  - {"op": "update_node", "id": "REQ-030-146", "attrs": {"statement": "Escalation is offered only for locked notices. The admin picks a condition from a fixed list (Not delivered, Not opened) and a wait time, for example Payment Failed, Not opened, wait 24 hours, escalate to the admin billing team"}, "title": "Escalation rules are optional per event and only for locked notices"}
  - {"op": "update_node", "id": "REQ-030-149", "attrs": {"statement": "System prompts: \"This rule will activate immediately and apply to all matching events. Continue?\" The system refuses to activate a rule that overlaps an Active rule of the same event (same recipient type and same channel) and names that Active rule"}}
  - {"op": "update_node", "id": "REQ-030-151", "attrs": {"statement": "System pauses the rule: events that occur while it is paused are skipped for good and send nothing from this rule; notices already queued before the pause are still delivered. Reactivating applies the rule only to events that occur from then on"}, "title": "Pausing a rule skips events that occur during the pause; queued notices are still delivered"}
  - {"op": "update_node", "id": "REQ-030-155", "attrs": {"statement": "System logs failed delivery with error code and timestamp. If retry is enabled and the bounce is soft (for example mailbox full), system queues a retry after the retry interval (platform default 1 hour; see General Module Rule 7); a hard bounce (for example an invalid address) is not retried and is marked \"Failed - Permanent\" at once. After ordinary retries are exhausted (platform default 3; an admin may set 1 to 5), system marks the notification \"Failed - Permanent\"; while an email provider outage lasts, the notice is held for up to 24 hours and then marked \"Failed - Service Outage\" without using up its retries"}}
  - {"op": "update_node", "id": "REQ-030-156", "attrs": {"statement": "System flags the recipient's account with an \"Email delivery issue\" indicator, whatever the account type"}, "title": "A bounced email flags the recipient's account with an Email delivery issue indicator"}
  - {"op": "update_node", "id": "REQ-030-157", "attrs": {"statement": "Admin receives a system.alert (in-app and by a channel other than the failing one) when a locked (critical) notice fails permanently; admin contacts the recipient via alternative channel (phone, in-app message) to update email address"}, "title": "Admin is alerted when a locked notice fails permanently"}
  - {"op": "update_node", "id": "REQ-030-159", "attrs": {"statement": "Rule 3: An event type can have several notification rules. Rule Name must be unique among the rules of one event; an admin adds another rule for an event with Add Rule. Every event ships with one seeded Active rule, and any rule can be saved as Draft. The system refuses to activate a rule that overlaps an Active rule of the same event (same recipient type and same channel) and names the Active rule"}}
  - {"op": "update_node", "id": "REQ-030-173", "attrs": {"statement": "Escalation is available only for locked notices. The condition is picked from a fixed list (Not delivered, Not opened) with a wait time; when it holds after the wait time, S-03 sends the escalation notice to the escalation recipients"}, "title": "Escalation rules are only available for locked notices"}
  - {"op": "update_node", "id": "REQ-030-184", "attrs": {"statement": "Archived templates cannot be selected in notification rules but remain for historical records; a template that an Active rule uses cannot be archived or set to Draft, and the system refuses with a message naming the rule"}}
  - {"op": "update_node", "id": "REQ-030-185", "attrs": {"statement": "Rule 4: Notification templates must be activated before they can be selected in notification rules, and cannot be archived or set to Draft while an Active rule uses them"}}
  - {"op": "update_node", "id": "REQ-030-200", "attrs": {"statement": "Assumption 1: Critical notifications (the locked notices, for example payment confirmations and booking cancellations) must be delivered with higher priority and stricter SLAs than non-critical notifications (marketing, general updates)"}}
  - {"op": "update_node", "id": "REQ-030-201", "attrs": {"statement": "If the SMTP service is unavailable, hold emails for up to 24 hours (General Module Rule 7), alert admin if the outage exceeds 15 minutes, and fall back to a secondary SMTP provider if configured. If the push service is unavailable, hold notifications for up to 24 hours, alert admin if the outage exceeds 15 minutes, and after 24 hours mark them \"Failed - Service Outage\" (the recipient sees notification history in-app instead)."}, "title": "Outage handling: hold up to 24 hours, alert admin after 15 minutes, then Failed - Service Outage"}
  - {"op": "update_node", "id": "REQ-030-203", "attrs": {"statement": "System evaluates notification rule when event created; if the send time has already passed, system sends the notification at once with note \"Delivery timing adjusted due to short notice\" in admin logs. If the rule has Skip If Too Late checked, the notification is not sent when the send time has passed (e.g., a \"3 days before\" reminder is not sent if the event is tomorrow)"}, "title": "Late trigger: send at once, or skip when Skip If Too Late is checked"}
  - {"op": "update_node", "id": "REQ-030-204", "attrs": {"statement": "System renders template with placeholder text for missing variable (e.g., \"[Phone number not provided]\") or omits section containing missing variable if template designed with conditional logic System logs warning in admin notification logs: \"Variable `patient.phone` not available for notification [notification_id]; rendered with placeholder\" Admin receives alert if missing variable affects a locked (critical) notice (e.g., payment confirmation missing the amount)"}, "title": "Missing template variable renders a placeholder, logs a warning and alerts admin for locked notices"}
  - {"op": "update_node", "id": "REQ-030-205", "attrs": {"statement": "Profiles hold one email address and one phone number each (FR-001, FR-032); delivery goes to them, and there is no secondary-contact retry and no double send"}, "title": "Notifications go to the profile's one email and one phone; no secondary contact"}
  - {"op": "update_node", "id": "REQ-030-207", "attrs": {"statement": "System immediately stops adding new notifications for the paused rule: events that occur during the pause are skipped for good. Notifications already queued (not yet delivered) remain in queue and are delivered as scheduled. To cancel queued notifications, the admin uses the Purge Queue button on the rule screen (Screen 2), with confirmation prompt: \"This will cancel X pending notifications. Continue?\""}, "title": "Pausing a rule keeps queued notices; the Purge Queue button cancels them"}
  - {"op": "update_node", "id": "REQ-030-208", "attrs": {"statement": "System respects recipient opt-out for non-critical notifications (marketing, general updates) and does not deliver. A locked notice is critical: it is sent at once, is exempt from quiet hours, the hourly rate limit and coalescing, and overrides the recipient's opt-out, delivering via at least one channel (the app displays a banner explaining why a critical notice was delivered despite opt-out). The one exception is legal.acceptance_reminder, which is locked but not critical. The locked list is fixed in the codebase: an admin cannot mark any other notice as critical"}, "title": "Locked (critical) notices override recipient opt-out and show an in-app banner"}
  - {"op": "update_node", "id": "REQ-030-209", "attrs": {"statement": "System holds notifications for up to 24 hours and retries them at the retry interval If service restored within 24 hours, queued notifications delivered (may result in burst of deliveries) If outage exceeds 24 hours, system marks notifications as \"Failed - Service Outage\" without using up their retries, and alerts admin Admin can manually re-trigger notifications after service restored or switch to backup notification provider if configured"}, "title": "Prolonged outage: hold for 24 hours then mark Failed - Service Outage and alert admin"}
  - {"op": "update_node", "id": "REQ-030-219", "attrs": {"statement": "Providers are not recipients of inquiry.cancelled. A provider that holds a draft, sent or expired quote on a cancelled inquiry receives only quote.cancelled_inquiry, and a provider that never quoted is told nothing"}, "title": "A provider with a quote on a cancelled inquiry gets only the quote-cancelled notice"}
  - {"op": "update_node", "id": "REQ-030-224", "attrs": {"statement": "Admins set one platform-wide quiet-hours period during which non-critical notifications are held and sent in order when it ends. It is set only on the Rules Dashboard by an admin; recipients and providers cannot set their own. Default: 10 PM to 7 AM in the recipient's local time; start and end must differ; locked (critical) notices are never held; the hourly rate limit still applies to the release"}}
  - {"op": "update_node", "id": "REQ-030-225", "attrs": {"statement": "Admins set how often the default patient progress reminder is sent on a transplant-progress case, and for how long, counted from the case creation date. Default: once a month for 12 months from the case creation date. The patient may change or switch off their own reminders; FR-038 refers to this schedule"}}
  - {"op": "update_node", "id": "REQ-030-227", "attrs": {"statement": "Critical - Cannot Opt Out is a read-only indicator that shows whether the event is a locked (critical) notice: a locked notice is delivered through at least one channel even when the recipient has opted out. An admin cannot mark an event critical; the indicator follows the locked list."}, "title": "Rule Editor shows Critical - Cannot Opt Out as a read-only indicator"}
  - {"op": "update_node", "id": "REQ-030-232", "attrs": {"statement": "Pausing a rule requires a confirmation prompt: \"Events that occur while this rule is paused will not send notifications. Notices already queued are still delivered. Continue?\""}}
  - {"op": "update_node", "id": "REQ-030-234", "attrs": {"statement": "When a recipient has both Email and Push switched off, nothing is sent by email or push, and the in-app entry is still always created; it is built from the push title and body of the event's push template, and there is no separate in-app template"}}
  - {"op": "update_node", "id": "EVT-inquiry-cancelled", "attrs": {"description": "inquiry.cancelled: sent to the patient when the patient cancels the inquiry (Inquiry or Quoted stage) and when an admin closes the inquiry; a cancellation caused by an approved account deletion sends the patient no notice. Providers are not recipients: a provider holding a draft, sent or expired quote receives quote.cancelled_inquiry. The patient's cancellation reason is never shown to a provider."}}
  - {"op": "update_node", "id": "EVT-booking-cancelled", "attrs": {"description": "booking.cancelled: patient and provider, sent for an admin cancellation (with the reason), a provider drop-out at the FR-006 Screen 10 submit, and a system cancellation for an unpaid balance (including an installment plan default); the wording follows FR-006 REQ-006-011."}}
  - {"op": "update_node", "id": "EVT-treatment-started", "attrs": {"description": "treatment.started: sent to the patient when Check In moves the booking to In Progress (Integration 3, REQ-010-007)."}}
  - {"op": "update_node", "id": "EVT-treatment-completed", "attrs": {"description": "treatment.completed: sent to the patient when treatment completes, with post-op and medication instructions; the admin is also notified of completion for billing (Integration 3, REQ-010-007, REQ-010-008)."}}
  - {"op": "update_node", "id": "EVT-monitoring-export-ready", "attrs": {"description": "monitoring.export_ready: a PDF has finished generating (the summary PDF, the conversion PDF or a regenerated report); the patient is notified when it is ready. For a converted case the notice opens FR-038 Screen 6 while the draft is open, otherwise Screen 7."}}
  - {"op": "update_node", "id": "EVT-review-requested", "attrs": {"description": "review.requested: review invitation anchored on the review eligibility date (FR-013); the invitation is sent on that date and any reminder is counted from it. FR-030 owns the event and its timing and cadence (Screen 10 link-outs)."}}
  - {"op": "update_node", "id": "EVT-support-case-user-reply", "attrs": {"description": "`support.case_user_reply`: email to the assigned admin (or all support staff if unassigned) when the patient or the provider replies to a case (FR-032 Screen 5.8 for a provider reply)."}}
  - {"op": "update_node", "id": "EVT-support-case-reopened", "attrs": {"description": "`support.case_reopened`: sent to the patient, the provider and the admin when a Closed case is reopened, with the reopening reason (FR-032 Screen 5.9 for a provider reopen)."}}
  - {"op": "update_node", "id": "STP-030-002", "title": "System displays the backend event catalog grouped by category with the status of each rule (Active, Paused or Draft), channels and last modified"}
  - {"op": "update_node", "id": "STP-030-004", "title": "Admin switches the event On or Off by activating or pausing its rules (locked notices show a locked toggle)"}
