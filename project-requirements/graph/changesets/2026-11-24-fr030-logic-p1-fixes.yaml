  - {"op": "add_node", "id": "REQ-030-235", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Account Deletion Requested", "attrs": {"statement": "Account Deletion Requested (account.deletion_requested) is an admin-configurable notification event. Primary recipients: Patient, Admin. Fired when a patient's account deletion request is submitted through FR-001 (FR-023 REQ-023-029). One event with two recipients: the patient receives the submission confirmation, which is the mandatory notice, and the admins are told of the new request. The toggle is locked", "rationale": "Event Catalog table, row account.deletion_requested. Category: Account/Auth. Event nodes: EVT-account-deletion-requested."}}
  - {"op": "add_node", "id": "REQ-030-236", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Data Request Status Notices", "attrs": {"statement": "Data Request Status Notices (dsr.verification_required, dsr.in_progress, dsr.fulfilled, dsr.denied, dsr.blocked_by_obligation) is an admin-configurable notification event. Primary recipients: Patient. Status notices on a deletion request (FR-023 REQ-023-008): identity proof insufficient, approved and processing, completed (with the actions taken and the legal basis of any retained records), denied (with the reason), approval blocked by an active obligation (with the expected timeline). `dsr.fulfilled` and `dsr.denied` are mandatory — admin cannot disable them; the other three are admin-switchable. `dsr.fulfilled` is sent by email only, to the contact address FR-023 captured, is critical and creates no in-app record", "rationale": "Event Catalog table, row dsr.verification_required, dsr.in_progress, dsr.fulfilled, dsr.denied, dsr.blocked_by_obligation. Category: Account/Auth. Event nodes: EVT-dsr-verification-required, EVT-dsr-in-progress, EVT-dsr-fulfilled, EVT-dsr-denied, EVT-dsr-blocked-by-obligation."}}
  - {"op": "add_node", "id": "REQ-030-237", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Data Request Deadline Approaching", "attrs": {"statement": "Data Request Deadline Approaching (dsr.deadline_approaching) is an admin-configurable notification event. Primary recipients: Admin. Sent 7 calendar days before the deadline of a deletion request that is still open (FR-023 REQ-023-029)", "rationale": "Event Catalog table, row dsr.deadline_approaching. Category: Account/Auth. Event nodes: EVT-dsr-deadline-approaching."}}
  - {"op": "add_node", "id": "REQ-030-238", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Data Request Obligation Block Ended", "attrs": {"statement": "Data Request Obligation Block Ended (dsr.obligation_block_ended) is an admin-configurable notification event. Primary recipients: Admin. Sent when the obligation that blocked approval of a deletion request ends, saying the request can be approved (FR-023 REQ-023-029 and Main Flow step 3). FR-023 owns the emitting step", "rationale": "Event Catalog table, row dsr.obligation_block_ended. Category: Account/Auth. Event nodes: none (FR-023 owns the emitting step)."}}
  - {"op": "add_node", "id": "REQ-030-239", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Legal Version Published", "attrs": {"statement": "Legal Version Published (legal.version_published) is an admin-configurable notification event. Primary recipients: Admin (the publishing Admin). Sent to the Admin who published the version once publication succeeds (FR-027 REQ-027-022)", "rationale": "Event Catalog table, row legal.version_published. Category: System/Operations. Event nodes: EVT-legal-version-published."}}
  - {"op": "add_node", "id": "REQ-030-240", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Legal Acceptance Coverage Below Threshold", "attrs": {"statement": "Legal Acceptance Coverage Below Threshold (legal.coverage_below_threshold) is an admin-configurable notification event. Primary recipients: Admin (holders of the A-09 Edit Settings permission). Sent once per version when the acceptance rate of a Current version is below the Admin-set threshold; evaluated daily from 14 days after the version became Current (FR-027 REQ-027-023)", "rationale": "Event Catalog table, row legal.coverage_below_threshold. Category: System/Operations. Event nodes: EVT-legal-coverage-below-threshold."}}
  - {"op": "add_node", "id": "REQ-030-241", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Legal Acceptance Reminder", "attrs": {"statement": "Legal Acceptance Reminder (legal.acceptance_reminder) is an admin-configurable notification event. Primary recipients: Patient, Provider (team members in the Pending set). One reminder to each user in the Pending set; FR-027 owns the cadence (REQ-027-063). Locked: the toggle cannot be switched off. It is the one locked notice that is not critical: it respects quiet hours and the rate limit", "rationale": "Event Catalog table, row legal.acceptance_reminder. Category: System/Operations. Event nodes: EVT-legal-acceptance-reminder."}}
  - {"op": "add_node", "id": "REQ-030-242", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Installment Charge Failed", "attrs": {"statement": "Installment Charge Failed (installment.failed) is an admin-configurable notification event. Primary recipients: Patient. Immediate notice that an installment charge failed, with a clear error message (FR-007B REQ-007B-017). On the day after the due date the overdue notice replaces that day's failure notice", "rationale": "Event Catalog table, row installment.failed. Category: Payment. Event nodes: EVT-installment-failed."}}
  - {"op": "add_node", "id": "REQ-030-243", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Installment Overdue", "attrs": {"statement": "Installment Overdue (installment.overdue_notice) is an admin-configurable notification event. Primary recipients: Patient, Admin (billing admins). One notice to the patient and one to the billing admins on the day after a due date passes unpaid, after that day's retry; the patient notice states the booking cancellation date when the cancellation point is set. The provider sees the Overdue banner only and gets no notice (FR-007B REQ-007B-101)", "rationale": "Event Catalog table, row installment.overdue_notice. Category: Payment. Event nodes: EVT-installment-overdue-notice."}}
  - {"op": "add_node", "id": "REQ-030-244", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Installment Plan Defaulted", "attrs": {"statement": "Installment Plan Defaulted (installment.plan_defaulted) is an admin-configurable notification event. Primary recipients: Admin, Patient, Provider. Sent when a plan becomes Defaulted; the admin notice is for intervention (FR-007B REQ-007B-020)", "rationale": "Event Catalog table, row installment.plan_defaulted. Category: Payment. Event nodes: EVT-installment-plan-defaulted."}}
  - {"op": "add_node", "id": "REQ-030-245", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Installment Charged", "attrs": {"statement": "Installment Charged (installment.charged) is an admin-configurable notification event. Primary recipients: Patient. Confirmation after a successful installment charge, by email and push (FR-007B REQ-007B-016)", "rationale": "Event Catalog table, row installment.charged. Category: Payment. Event nodes: EVT-installment-charged."}}
  - {"op": "add_node", "id": "REQ-030-246", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Installment Plan Completed", "attrs": {"statement": "Installment Plan Completed (installment.plan_completed) is an admin-configurable notification event. Primary recipients: Patient. Sent when the final installment completes and the booking status changes (FR-007B REQ-007B-093)", "rationale": "Event Catalog table, row installment.plan_completed. Category: Payment. Event nodes: EVT-installment-plan-completed."}}
  - {"op": "add_node", "id": "REQ-030-247", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Payment Overdue Notice", "attrs": {"statement": "Payment Overdue Notice (payment.overdue_notice) is an admin-configurable notification event. Primary recipients: Patient, Admin (billing admins). Sent when a booking balance enters Overdue (FR-007 REQ-007-036): the billing admins are notified and the patient receives one overdue notice", "rationale": "Event Catalog table, row payment.overdue_notice. Category: Payment. Event nodes: EVT-patient-payment-overdue-notice."}}
  - {"op": "add_node", "id": "REQ-030-248", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Refund Approval Overdue", "attrs": {"statement": "Refund Approval Overdue (refund.approval_escalated) is an admin-configurable notification event. Primary recipients: Admin (super-admin). Sent to a super-admin when a refund approval is still open after 2 business days (FR-007 REQ-007-015)", "rationale": "Event Catalog table, row refund.approval_escalated. Category: Payment. Event nodes: EVT-refund-approval-escalated."}}
  - {"op": "add_node", "id": "REQ-030-249", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Redistribution Confirmation Reminder", "attrs": {"statement": "Redistribution Confirmation Reminder (provider.status_redistribution_reminder) is an admin-configurable notification event. Primary recipients: Patient. Sent once, 48 hours after the confirm variant of `provider.status_cancellation_patient` is left unanswered (FR-020 REQ-020-159). It carries the same Confirm and Decline links and the Contact Admin/Support action. It is dropped when the patient has answered, the inquiry was cancelled, an admin reassigned or reran distribution, or the support marker was cleared. Mandatory — admin cannot disable this event (see Non-Disableable by Default section)", "rationale": "Event Catalog table, row provider.status_redistribution_reminder. Category: Provider/Compliance. Event nodes: EVT-provider-status-redistribution-reminder."}}
  - {"op": "add_node", "id": "REQ-030-250", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Provider Response Removed", "attrs": {"statement": "Provider Response Removed (review.response_removed) is an admin-configurable notification event. Primary recipients: Provider. Fired by FR-013 when an admin removes the provider's public response to a review; tells the provider the response was removed and gives the removal reason. Informational; admin-switchable", "rationale": "Event Catalog table, row review.response_removed. Category: Reviews. Event nodes: EVT-review-response-removed."}}
  - {"op": "add_node", "id": "REQ-030-251", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Monitoring Progress Reminder", "attrs": {"statement": "Monitoring Progress Reminder (monitoring.progress_reminder) is an admin-configurable notification event. Primary recipients: Patient. Default patient reminder on a transplant-progress case (FR-038) only; hair-loss monitoring cases (FR-037) have no reminders. By default sent once a month for 12 months from the case creation date (schedule set on Screen 1) and stopped when the case is completed or converted. The patient can change the schedule or switch it off; admin-switchable", "rationale": "Event Catalog table, row monitoring.progress_reminder. Category: Monitoring. Event nodes: EVT-monitoring-progress-reminder."}}
  - {"op": "add_node", "id": "REQ-030-252", "type": "Rule", "owner_fr": "FR-030", "title": "Aftercare progress reminder schedule is set in the admin notification settings", "attrs": {"statement": "Admins set how often the default patient progress reminder is sent during aftercare, and for how long, counted from the treatment completion date. Default: once a month for 12 months after treatment. The patient may change or switch off their own reminders; the default is the FR-011 setting (REQ-011-088)", "rationale": "Screen 1 field Aftercare Progress Reminder Schedule and the Editable by Admin list. The transplant-progress schedule (REQ-030-225) counts from the case creation date instead."}}
  - {"op": "add_node", "id": "STP-030-071", "type": "Step", "owner_fr": "FR-030", "title": "S-03 checks the escalation condition once the wait time has passed and, when it holds, sends the escalation notice to the escalation recipients", "attrs": {"prd_ref": "Main Flow: Admin Reviews Event Catalog and Toggles / Configures Notification Rules step 25"}}
  - {"op": "add_field", "owner_fr": "FR-030", "id": "ENT-notification-rule.escalation_wait_time", "entity_id": "ENT-notification-rule", "name": "escalation_wait_time", "data_type": "int", "title": "Escalation wait time", "required": false, "attrs": {"description": "Screen 2 Escalation Wait Time (number plus unit, hours or days): how long after the notice is sent to wait before checking the escalation condition. Required if escalation is enabled; positive whole number."}}
  - {"op": "add_field", "owner_fr": "FR-030", "id": "ENT-notification-rule.delay_direction", "entity_id": "ENT-notification-rule", "name": "delay_direction", "data_type": "enum", "title": "Delay direction", "required": false, "attrs": {"description": "Screen 2 Delay Direction: whether Delay Duration counts Before or After the anchor date (the date the event is about, for example the installment due date). Required when Delayed."}}
