  - {"op": "update_node", "id": "ENT-role-permission-definition", "attrs": {"description": "Role definition for admin and provider roles, scoped by guard: system (protected) or custom, with a permission matrix and, for custom provider roles, a non-Owner base type. Cloned roles keep an independent permission snapshot (PRD Key Entities, Entity 2). FR-009 created this as a provider-role stub; the PRD covers both guards."}}
  - {"op": "update_node", "id": "ENT-role-permission-definition.role_name", "attrs": {"description": "Unique within the role's guard; max 50 characters; locked for system-defined roles."}}
