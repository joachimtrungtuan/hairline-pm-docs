reason: "FR-031 Admin Access Control & Permissions migration (migrate-fr checklist v1.1, from the frozen PRD)."
by: "docs-manager"
operations:
  - {"op": "add_node", "id": "ACT-super-admin", "type": "Actor", "title": "Super Admin", "attrs": {"group": "admin", "description": "Admin user with the Super Admin role: full system access, invites admin team members, assigns roles and configures role permissions (FR-031)."}}
  - {"op": "add_node", "id": "ACT-admin-invitee", "type": "Actor", "title": "Admin invitee", "attrs": {"group": "admin", "description": "Person invited by a Super Admin to join the admin team who has not yet completed account setup."}}
  - {"op": "add_node", "id": "SET-admin-invitation-token-expiry", "type": "Setting", "owner_fr": "FR-031", "title": "Admin invitation token expiry", "attrs": {"description": "Lifetime of an admin team invitation token, configurable by Super Admin in A-09 settings; range 1-30 days. Separate from FR-009's provider invitation setting; whether they are one setting is an open question.", "default": "7", "unit": "days"}}
  - {"op": "add_node", "id": "SET-admin-max-failed-logins", "type": "Setting", "owner_fr": "FR-026", "title": "Admin maximum failed login attempts", "attrs": {"description": "Maximum failed admin login attempts before lockout, configurable in A-09 Authentication Settings. The PRD gives no default or range. Stub created during FR-031 migration; detail arrives when FR-026 migrates."}}  # stub FR-026 # may-collide
  - {"op": "add_node", "id": "SET-admin-concurrent-sessions", "type": "Setting", "owner_fr": "FR-026", "title": "Admin concurrent sessions per user", "attrs": {"description": "Number of concurrent sessions allowed per admin user, configurable in A-09 Authentication Settings; range 1-5. Stub created during FR-031 migration; detail arrives when FR-026 migrates.", "default": "3", "unit": "sessions"}}  # stub FR-026 # may-collide
  - {"op": "add_node", "id": "REQ-031-001", "type": "Rule", "owner_fr": "FR-031", "title": "Super Admins invite admin team members by email", "attrs": {"statement": "System MUST allow Super Admins to invite new admin team members via email with role assignment", "rationale": "PRD Functional Requirements Summary, REQ-031-001. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-002", "type": "Rule", "owner_fr": "FR-031", "title": "Custom roles with per-module granular permissions", "attrs": {"statement": "System MUST support creation of custom roles with granular permission assignment per admin module (A-01 through A-10)", "rationale": "PRD Functional Requirements Summary, REQ-031-002. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-003", "type": "Rule", "owner_fr": "FR-031", "title": "Role-based access control on every admin endpoint and component", "attrs": {"statement": "System MUST enforce role-based access control on all admin API endpoints and UI components", "rationale": "PRD Functional Requirements Summary, REQ-031-003. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage. Provider-side application: Active stage."}}
  - {"op": "add_node", "id": "REQ-031-004", "type": "Rule", "owner_fr": "FR-031", "title": "Four predefined admin roles", "attrs": {"statement": "System MUST provide predefined admin roles: Super Admin, Aftercare Specialist, Billing Staff, Support Staff", "rationale": "PRD Functional Requirements Summary, REQ-031-004. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-005", "type": "Rule", "owner_fr": "FR-031", "title": "Central configuration of provider roles", "attrs": {"statement": "System MUST provide centralized configuration for the four protected provider roles and for global custom provider roles created or cloned by Super Admins; custom roles require a non-Owner base type and cannot gain Owner-only capabilities", "rationale": "PRD Functional Requirements Summary, REQ-031-005. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage. Provider-side application: Active stage."}}
  - {"op": "add_node", "id": "REQ-031-006", "type": "Rule", "owner_fr": "FR-031", "title": "Provider role changes sync to Provider Platform within 5 seconds", "attrs": {"statement": "System MUST automatically sync provider role creation, cloning, and permission changes to Provider Platform (FR-009) within 5 seconds", "rationale": "PRD Functional Requirements Summary, REQ-031-006. Sync indicator and timing wording: see the sync and propagation rules; other propagation wordings conflict (migration report decision list). Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage. Provider-side application: Active stage."}}
  - {"op": "add_node", "id": "REQ-031-007", "type": "Rule", "owner_fr": "FR-031", "title": "Owner role permissions cannot be reduced", "attrs": {"statement": "System MUST prevent modification of Owner role permissions that would remove full access to provider features", "rationale": "PRD Functional Requirements Summary, REQ-031-007."}}
  - {"op": "add_node", "id": "REQ-031-008", "type": "Rule", "owner_fr": "FR-031", "title": "Administrative actions logged in an immutable audit trail", "attrs": {"statement": "System MUST log all administrative actions (role changes, permission grants, user suspensions, access denials) in immutable audit trail", "rationale": "PRD Functional Requirements Summary, REQ-031-008. Business Rule 5 repeats this requirement (role changes, permission grants, user suspensions logged in the audit trail); merged here. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-009", "type": "Rule", "owner_fr": "FR-031", "title": "Last Super Admin cannot be suspended or deleted", "attrs": {"statement": "System MUST prevent suspension or deletion of the last Super Admin account (system protection)", "rationale": "PRD Functional Requirements Summary, REQ-031-009. Business Rule 4 repeats this (at least one active Super Admin must exist at all times, system protection against lockout); merged here. Tab 2 and User Story 6 scenario 2 disagree on whether a Super Admin can be suspended when another exists; see the migration report decision list. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-010", "type": "Rule", "owner_fr": "FR-031", "title": "Email notifications for invitations, role changes, resets and denials", "attrs": {"statement": "System MUST send email notifications for: new invitations, role changes, password resets, repeated access denials", "rationale": "PRD Functional Requirements Summary, REQ-031-010. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-011", "type": "Rule", "owner_fr": "FR-031", "title": "Role changes carry an Effective From date and time", "attrs": {"statement": "System MUST support role assignment changes with **Effective From** date/time tracking (stored and auditable)", "rationale": "PRD Functional Requirements Summary, REQ-031-011. Business Rule 8 repeats this (role assignments stored with an Effective From timestamp; enforcement respects that date/time on authorization checks); merged here. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-012", "type": "Rule", "owner_fr": "FR-031", "title": "Admin user account data", "attrs": {"statement": "System MUST maintain admin user accounts with: email, name, password hash, assigned role(s), role effective date/time, status (active/pending/suspended), creation date, last login timestamp", "rationale": "PRD Functional Requirements Summary, REQ-031-012. Key Entities, Entity 1 lists the same attributes plus the invitation token and MFA flag, and says one admin user has one assigned role; see the migration report decision list (single versus several roles). Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-013", "type": "Rule", "owner_fr": "FR-031", "title": "Role definition data", "attrs": {"statement": "System MUST maintain role definitions with: guard-scoped role name, description, assigned permissions (as permission matrix), system/custom status, and non-Owner base type for custom provider roles", "rationale": "PRD Functional Requirements Summary, REQ-031-013. Key Entities, Entity 2. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage. Provider-side application: Active stage."}}
  - {"op": "add_node", "id": "REQ-031-014", "type": "Rule", "owner_fr": "FR-031", "title": "Audit trail entry data", "attrs": {"statement": "System MUST maintain audit trail entries with: timestamp, user ID, action type, action details, IP address, outcome (success/failed/denied)", "rationale": "PRD Functional Requirements Summary, REQ-031-014. Privacy Rule 2 (IP addresses logged for security audit purposes, GDPR-compliant logging) merged here. Key Entities, Entity 3. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-015", "type": "Rule", "owner_fr": "FR-031", "title": "Audit trail retained for ten years", "attrs": {"statement": "System MUST retain audit trail for minimum 10 years per compliance requirements (Constitution Principle VI)", "rationale": "PRD Functional Requirements Summary, REQ-031-015. Privacy Rule 1 (audit trail entries immutable and retained for 10 years per Constitution Principle VI) merged here; Admin Editability lists the retention period as fixed in codebase. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-016", "type": "Rule", "owner_fr": "FR-031", "title": "MFA-ready architecture", "attrs": {"statement": "System MUST be architected to support Multi-Factor Authentication (MFA) integration as a planned Post-MVP requirement (per Constitution Principle II)", "rationale": "PRD Functional Requirements Summary, REQ-031-016. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-017", "type": "Rule", "owner_fr": "FR-031", "title": "bcrypt password hashing", "attrs": {"statement": "System MUST use bcrypt (cost factor 12+) for password hashing", "rationale": "PRD Functional Requirements Summary, REQ-031-017. Technical requirement, kept because the PRD numbers it; Admin Editability lists the algorithm as fixed in codebase. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-018", "type": "Rule", "owner_fr": "FR-031", "title": "Admin password requirements", "attrs": {"statement": "System MUST enforce password requirements: minimum 12 characters, 1 uppercase, 1 lowercase, 1 digit, 1 special character", "rationale": "PRD Functional Requirements Summary, REQ-031-018. Admin Editability lists the requirements as fixed in codebase. Governed by the existing FR-026 password policy setting (provider wording there; assumption recorded in the migration report). Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-019", "type": "Rule", "owner_fr": "FR-031", "title": "JWT tokens signed with RS256", "attrs": {"statement": "System MUST sign JWT tokens with RS256 (asymmetric encryption) to prevent tampering", "rationale": "PRD Functional Requirements Summary, REQ-031-019. Technical requirement, kept because the PRD numbers it. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-020", "type": "Rule", "owner_fr": "FR-031", "title": "Authorization evaluated server-side on every call", "attrs": {"statement": "System MUST perform server-side authorization evaluation on each API call based on current role assignments and permission matrices; JWT tokens MUST NOT be the authoritative source of permissions", "rationale": "PRD Functional Requirements Summary, REQ-031-020. Business Rule 3 repeats this (latest role assignment and permission matrix evaluated on every API call; caching allowed only if invalidated within 5 seconds; enforcement reflects changes on the next API call after invalidation); merged here. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage. Provider-side application: Active stage."}}
  - {"op": "add_node", "id": "REQ-031-021", "type": "Rule", "owner_fr": "FR-031", "title": "Suspended accounts rejected from the next request", "attrs": {"statement": "System MUST invalidate active sessions (and/or reject access tokens) immediately upon account suspension; at minimum, all API calls MUST be rejected for suspended accounts starting with the next request", "rationale": "PRD Functional Requirements Summary, REQ-031-021. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-022", "type": "Rule", "owner_fr": "FR-031", "title": "Admin PII anonymised on deletion request", "attrs": {"statement": "System MUST anonymize admin user PII (email, name) on account deletion request, while preserving audit trail with anonymized identifier", "rationale": "PRD Functional Requirements Summary, REQ-031-022. The GDPR Compliance line in Data and Privacy Rules (email and name anonymised, audit trail preserved with anonymised identifiers) is merged here. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-023", "type": "Rule", "owner_fr": "FR-031", "title": "Email delivery through the Notification Service", "attrs": {"statement": "System MUST integrate with Notification Service (S-03) for email delivery (invitations, role changes, password resets)", "rationale": "PRD Functional Requirements Summary, REQ-031-023. Cross-FR citation: S-03 Notification Service. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-024", "type": "Rule", "owner_fr": "FR-031", "title": "Permission check API for admin modules", "attrs": {"statement": "System MUST provide permission check API for all admin modules to enforce access control", "rationale": "PRD Functional Requirements Summary, REQ-031-024. Technical requirement, kept because the PRD numbers it. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-025", "type": "Rule", "owner_fr": "FR-031", "title": "Permission matrix cached for fast checks", "attrs": {"statement": "System MUST cache permission matrix in memory for fast authorization checks (< 50ms per check)", "rationale": "PRD Functional Requirements Summary, REQ-031-025. Technical requirement, kept because the PRD numbers it. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-026", "type": "Rule", "owner_fr": "FR-031", "title": "Permission cache invalidated within 5 seconds", "attrs": {"statement": "System MUST invalidate permission cache within 5 seconds of role or permission changes", "rationale": "PRD Functional Requirements Summary, REQ-031-026. Business Rule 3 also states the 5-second invalidation limit. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-027", "type": "Rule", "owner_fr": "FR-031", "title": "Entry points to access control", "attrs": {"statement": "Super Admins access this module via \"Settings > User Roles & Permissions\" in the Admin Platform. The module is hidden from non-Super Admin users. The first Super Admin account is created during platform deployment/installation; later admin accounts are created through the invitation flow. Super Admins configure role permissions and invite admin team members; provider owners invite their team members (FR-009) but cannot configure role permissions.", "rationale": "Entry Points section; Data Dependencies (Admin User Accounts). Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-028", "type": "Rule", "owner_fr": "FR-031", "title": "Module restricted to Super Admins", "attrs": {"statement": "Only Super Admins can access this module; regular admin users and providers cannot view or modify role permissions. The module is a Super Admin-only configuration tool and the single source of truth for role definitions and permission matrices across the platform.", "rationale": "Stated in the Executive Summary, Admin Platform scope, Entry Points and Screen 4 Access Control. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-029", "type": "Rule", "owner_fr": "FR-031", "title": "Provider Platform only enforces, never configures", "attrs": {"statement": "Provider Platform consumes and enforces the RBAC rules defined in the Admin Platform (FR-031) and has no configuration UI: provider users do not see or access role permission configuration, and Provider Platform reads permission matrices read-only and applies them when provider team members access features.", "rationale": "Provider Platform scope. Provider team member invitation and role assignment stay in FR-009; the permission definitions for those roles come from FR-031."}}
  - {"op": "add_node", "id": "REQ-031-030", "type": "Rule", "owner_fr": "FR-031", "title": "Custom provider roles are global", "attrs": {"statement": "Custom provider roles are global across provider organizations. Provider users may assign an available custom role to non-Owner staff in FR-009, but cannot create, clone, or edit role definitions.", "rationale": "Tab 3 business rule; Executive Summary and A5 outcome say the same. Overlaps FR-009 REQ-009-002 and REQ-009-149 (listed as possible duplicates in the migration report). Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage. Provider-side application: Active stage."}}
  - {"op": "add_node", "id": "REQ-031-031", "type": "Rule", "owner_fr": "FR-031", "title": "MVP exclusions for admin notifications and sign-in", "attrs": {"statement": "No SMS admin notifications are available in MVP; SMS will only be enabled if and when S-03 adds SMS delivery in a later phase. Real-time permission updates via WebSocket and external identity provider integration (OAuth, SAML) are V2 enhancements and out of scope.", "rationale": "Communication Structure, Out of Scope. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-032", "type": "Rule", "owner_fr": "FR-031", "title": "Permission changes notified by email to affected admin users", "attrs": {"statement": "System sends an email notification to the affected admin users when the permissions of their role change.", "rationale": "Communication Structure lists permission-change email as in scope; REQ-031-010 names invitations, role changes, password resets and repeated access denials but not permission changes. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-033", "type": "Rule", "owner_fr": "FR-031", "title": "Invitation form fields and limits", "attrs": {"statement": "The invitation form requires first name, last name, email address and an assigned role. First and last name are max 50 characters (letters, spaces, hyphens only); the email is converted to lowercase; phone number is optional (E.164 format); personal message is optional (max 500 characters, included in the invitation email). The form cannot be submitted until all required fields pass validation.", "rationale": "Screen 2 data fields and business rules; Main Flow steps 6 to 7. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-034", "type": "Rule", "owner_fr": "FR-031", "title": "Invitation email format validated inline", "attrs": {"statement": "System validates the email format on blur or submit and shows the inline error \"Please enter a valid email address\"; after the Super Admin corrects it, the system re-validates and allows submission. Only valid email addresses are accepted.", "rationale": "Alternative Flow B1; Screen 2 validation messages. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-035", "type": "Rule", "owner_fr": "FR-031", "title": "Duplicate admin email blocked", "attrs": {"statement": "System checks the invitation email against all admin users (active, suspended, pending) and pending invitations; a duplicate is blocked with the error \"This email is already part of the admin team\" and the system suggests \"View team member\" or, if pending, \"Resend invitation\". The existing record is kept.", "rationale": "Alternative Flow B2 and Screen 2. Screen 2 words the same error differently (\"This email is already associated with an admin account. Please use a different email or check existing team members.\"); see the migration report decision list. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-036", "type": "Rule", "owner_fr": "FR-031", "title": "Only active admin roles can be assigned", "attrs": {"statement": "The role dropdown on the invitation form is populated from active admin roles only (archived roles excluded) and shows role name plus a brief description on hover; an expandable role permission summary is shown below it, and a role must be selected (\"Please select a role for this team member.\"). Only active (non-archived) roles can be assigned to new or existing users.", "rationale": "Screen 2 business rules and notes; Data Dependencies (State: Active Roles). The PRD does not define how a role becomes archived. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-037", "type": "Rule", "owner_fr": "FR-031", "title": "Invitation token expiry", "attrs": {"statement": "Invitation tokens expire after 7 days (168 hours). The expiry is configurable by Super Admin through A-09 settings within a range of 1 to 30 days.", "rationale": "Business Rule 6; Screen 2; Admin Editability (Editable and Configurable with Restrictions); Main Flow step 10. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-038", "type": "Rule", "owner_fr": "FR-031", "title": "Invitation email content and preview", "attrs": {"statement": "The invitation email carries the invitation link, Hairline Admin Platform branding and the role being offered, plus the personal message when provided. Before sending, the form can preview the email (invitee name, role, personal message, invitation link placeholder) and shows \"Invitation will expire in 7 days on [date] at [time]\". After sending, it shows \"Invitation sent to [email]. They have 7 days to accept.\"", "rationale": "Main Flow steps 10 to 13; Screen 2 actions and notes. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-039", "type": "Rule", "owner_fr": "FR-031", "title": "Invitation record and its statuses", "attrs": {"statement": "When an invitation is sent, System creates a pending invitation record with status \"Invited\", marks it \"Accepted\" when the account is created and shows it as \"Expired\" when the token has passed its expiry. The pending invitations list shows each invitation's status.", "rationale": "Main Flow steps 12 and 21; Alternative Flow A1. Status labels differ across the PRD (\"Pending Send\", \"Delivery Failed\", \"Pending Activation\", \"Pending Invitation\"); see the migration report decision list. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-040", "type": "Rule", "owner_fr": "FR-031", "title": "Invitation link validated before the setup form", "attrs": {"statement": "When the invitee opens the invitation link, System validates the token (not expired, not already used) before showing the Admin Account Setup screen pre-filled with email, first name and last name. An expired or invalid token redirects to an error page with a \"Request New Invitation\" option.", "rationale": "Main Flow steps 15 to 16; Screen 3 business rules. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-041", "type": "Rule", "owner_fr": "FR-031", "title": "Used invitation link shows a login message", "attrs": {"statement": "If the invitation link was already accepted, System shows \"This invitation has already been used. Please log in with your existing credentials.\" and a login link, so no duplicate account is created.", "rationale": "Alternative Flow B3. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-042", "type": "Rule", "owner_fr": "FR-031", "title": "Super Admin can resend an invitation", "attrs": {"statement": "A Super Admin can resend an invitation for a pending account, including an expired one: System generates a new token, sends a new email, and invalidates the old token. The invitee receives a fresh invitation with a new expiry. The pending invitations list shows a notification dot when invitations are about to expire (< 24 hours).", "rationale": "Alternative Flow A1; Admin Editability (re-send invitation emails for pending accounts); Screen 2 B2 suggestion; Screen 1 Tab 2 notes. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-043", "type": "Rule", "owner_fr": "FR-031", "title": "Invitation email delivery failure and retries", "attrs": {"statement": "If the invitation email fails to send, System logs the error and retries up to 3 times with exponential backoff; if all retries fail it marks the invitation \"Pending Send\" and warns the Super Admin \"Invitation created but email failed. We'll retry automatically.\" A background job then retries every 10 minutes for 24 hours, and if still failing the system alerts the admin team.", "rationale": "Alternative Flow B4 is followed. Edge Case 3 states a different outcome (3 attempts, then \"Delivery Failed\" with the Super Admin notified and a manual re-send); that reading is recorded as a decision item. External Dependencies: failed emails are queued for retry, failures are logged in the audit trail, and the admin team is notified if emails fail for 24+ hours. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-044", "type": "Rule", "owner_fr": "FR-031", "title": "Account setup pre-filled fields", "attrs": {"statement": "On Admin Account Setup, the email is pre-filled from the invitation and cannot be edited; first and last name are pre-filled but editable (2-50 characters; letters, spaces, hyphens only). The screen shows the assigned role (\"You've been invited as [Role Name]\"), the Super Admin's personal message when provided, and an invitation expiry countdown when less than 24 hours remain.", "rationale": "Screen 3 data fields, business rules and notes. The invitation form (Screen 2) allows names up to 50 characters without a 2-character minimum. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-045", "type": "Rule", "owner_fr": "FR-031", "title": "Password confirmation and weak-password messages", "attrs": {"statement": "On Admin Account Setup, Confirm Password must match Password exactly (\"Passwords do not match.\"). A password that does not meet the policy is rejected with \"Password must be at least 12 characters with uppercase, lowercase, number, and special character from !@#$%^&(),.?\\\":{}|<>.\"", "rationale": "Screen 3 data fields and validation messages. The password policy itself is REQ-031-018 (defined in FR-026). Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-046", "type": "Rule", "owner_fr": "FR-031", "title": "Terms of Service acceptance required", "attrs": {"statement": "The new admin user must accept the Terms of Service (\"You must accept the Terms of Service to continue.\"); \"Create Account\" stays disabled until all required fields are valid and terms are accepted.", "rationale": "Screen 3 data fields and business rules; Main Flow step 17 and 19. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-047", "type": "Rule", "owner_fr": "FR-031", "title": "Cancelling account setup invalidates the invitation", "attrs": {"statement": "Cancel on Admin Account Setup returns to the login page and invalidates the invitation token.", "rationale": "Screen 3 actions. The PRD does not say what status the invitation then holds or how the invitee gets a new one; see the migration report decision list. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-048", "type": "Rule", "owner_fr": "FR-031", "title": "Phone optional until MFA arrives", "attrs": {"statement": "The phone number is optional for now (E.164 format) because MFA enrollment will be added in a future enhancement; Admin Account Setup shows an MFA enrollment section marked \"Coming Soon\" with the note \"Multi-factor authentication will be required in future updates\".", "rationale": "Screen 2 and Screen 3 business rules and notes. Related to REQ-031-016. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-049", "type": "Rule", "owner_fr": "FR-031", "title": "Account creation completes onboarding", "attrs": {"statement": "When the new admin user clicks Create Account, System validates all inputs, creates the admin account with the role from the invitation, marks the invitation \"Accepted\", logs the account creation in the audit trail, sends a confirmation email to both the new admin user and the Super Admin who sent the invitation, shows \"Account created successfully! Redirecting to login...\" and redirects to the admin login page after 3 seconds. The new admin user can log in immediately.", "rationale": "Main Flow steps 17 to 25; Screen 3 Success Flow. User Story 1 expects the invitation email within 1 minute and the account status \"Pending Activation\" before acceptance. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-050", "type": "Rule", "owner_fr": "FR-031", "title": "Every admin user holds a role", "attrs": {"statement": "All admin users MUST have at least one role assigned (no \"roleless\" accounts).", "rationale": "Business Rule 1. Key Entities says one admin user has one assigned role, while REQ-031-012 says role(s); see the migration report decision list. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-051", "type": "Rule", "owner_fr": "FR-031", "title": "Super Admin role is locked to full access", "attrs": {"statement": "The Super Admin role MUST always have full system access and cannot be restricted: its permissions cannot be edited or removed, its checkboxes are disabled, and it stays locked in the matrix view.", "rationale": "Business Rule 2; Screen 1 Tab 1 rules; Screen 4 Admin Role Protection and Matrix Mode rules; Admin Editability (fixed in codebase). Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-052", "type": "Rule", "owner_fr": "FR-031", "title": "Super Admin row actions disabled", "attrs": {"statement": "Edit Permissions, View Users and Clone Role are disabled for the Super Admin role.", "rationale": "Tab 1 data fields (Actions). Quoted as written; whether View Users should also be disabled is not stated. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-053", "type": "Rule", "owner_fr": "FR-031", "title": "Suspended admin users cannot log in", "attrs": {"statement": "Suspended admin users cannot log in but their accounts remain in the system (soft suspension, not deletion). Super Admins can suspend and reactivate admin accounts.", "rationale": "Business Rule 7; Tab 2 business rules and actions; Admin Editability. REQ-031-021 covers rejection of API calls. Tab 2 also says Super Admin accounts cannot be suspended by other users; see the migration report decision list. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-054", "type": "Rule", "owner_fr": "FR-031", "title": "Super Admins assign and change admin roles", "attrs": {"statement": "A Super Admin can assign or change the role of any admin user.", "rationale": "Admin Editability (Editable by Super Admin); Alternative Flow A2. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-055", "type": "Rule", "owner_fr": "FR-031", "title": "System role names are immutable", "attrs": {"statement": "Role names of system-defined roles (admin and provider) MUST be immutable (not editable or renamable); the system admin roles are Super Admin, Aftercare Specialist, Billing Staff and Support Staff, and the protected provider roles are Owner, Manager, Clinical Staff and Billing Staff. Only custom roles can be renamed.", "rationale": "Business Rule 9; Screen 4 role name field (locked for system-defined roles); Admin Editability (fixed in codebase); Tab 1 and Tab 3 role name rules. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage. Provider-side application: Active stage."}}
  - {"op": "add_node", "id": "REQ-031-056", "type": "Rule", "owner_fr": "FR-031", "title": "System roles can be edited but not deleted", "attrs": {"statement": "System admin roles (Super Admin, Aftercare Specialist, Billing Staff, Support Staff) can be edited but not deleted. The four system-defined provider roles cannot be renamed or removed.", "rationale": "Tab 1 and Tab 3 business rules. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage. Provider-side application: Active stage."}}
  - {"op": "add_node", "id": "REQ-031-057", "type": "Rule", "owner_fr": "FR-031", "title": "Custom admin roles lifecycle", "attrs": {"statement": "Custom admin roles can be created, edited, and deleted (deleted only if no users are assigned). A role name is unique within the role's guard (max 50 characters) and a role description is required (max 500 characters). Clone Role creates a new custom admin role based on an existing role.", "rationale": "Tab 1 business rules and actions; Screen 4 data fields; Admin Editability. Custom-role deletion for provider roles is out of scope (separate rule). Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-058", "type": "Rule", "owner_fr": "FR-031", "title": "Create custom admin role", "attrs": {"statement": "To create a custom admin role the Super Admin enters a role name and description and selects permissions in the permission matrix; System shows a permission summary with potential conflicts and warnings, validates a unique role name and at least one permission, saves the role, logs the creation in the audit trail, and lists the role in the Admin Roles tab and in the role dropdown for team member assignment.", "rationale": "Alternative Flow A3. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-059", "type": "Rule", "owner_fr": "FR-031", "title": "Create custom provider role", "attrs": {"statement": "To create a custom provider role the Super Admin enters a unique role name and description, selects a non-Owner base type (Manager, Clinical Staff or Billing Staff) and at least one permission, reviews the effective access, sensitive-permission warnings and organization-wide impact, and confirms. System saves a global custom provider role, records the actor, base type and permission grants in the audit trail, and makes the role available for non-Owner staff assignment in FR-009.", "rationale": "Alternative Flow A5; Screen 3 Tab 3 data fields and actions. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage. Provider-side application: Active stage."}}
  - {"op": "add_node", "id": "REQ-031-060", "type": "Rule", "owner_fr": "FR-031", "title": "Clone provider role", "attrs": {"statement": "A Super Admin can clone a system or custom provider role other than Owner: System shows the source role's base type and current permission snapshot, the Super Admin supplies a unique new name and description, and System copies the base type and eligible permissions into an editable draft, validates it with the same protected-action, dependency and sensitive-permission rules as creation, and after confirmation creates a separate global custom role with is_system_role = false. System logs the source role, copied permissions, actor and timestamp. Later edits to either role do not change the other, and cloning never creates a second Owner role or changes the source role.", "rationale": "Alternative Flow A6; User Story 3 scenarios 6 and 7; Tab 3 actions (Owner has no Clone Role action). Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage. Provider-side application: Active stage."}}
  - {"op": "add_node", "id": "REQ-031-061", "type": "Rule", "owner_fr": "FR-031", "title": "Custom provider role protections", "attrs": {"statement": "A custom provider role cannot use the Owner base type, replace the primary Owner, or receive Owner-only permissions; System rejects any attempt and keeps the single primary Owner invariant. Existing role-limited actions require both the applicable base type and the explicit permission grant: the base type defines eligibility, and selected permissions may narrow access but cannot bypass those protections. Cloning copies eligible grants without creating Owner-equivalent access.", "rationale": "Tab 3 business rules; Alternative Flow A5 step 4; Screen 4 Custom Provider Role Protection; User Story 3 scenario 7. Overlaps FR-009 REQ-009-149. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage. Provider-side application: Active stage."}}
  - {"op": "add_node", "id": "REQ-031-062", "type": "Rule", "owner_fr": "FR-031", "title": "Provider role deletion out of scope", "attrs": {"statement": "Deleting custom provider roles is outside the scope of this revision; custom provider roles can be created and cloned only by Super Admins.", "rationale": "Tab 3 business rules. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage. Provider-side application: Active stage."}}
  - {"op": "add_node", "id": "REQ-031-063", "type": "Rule", "owner_fr": "FR-031", "title": "Custom role base type fixed after creation", "attrs": {"statement": "A custom provider role's base type is required at creation (Manager, Clinical Staff or Billing Staff, never Owner) and cannot change after creation; Owner-only provider capabilities are fixed in the codebase.", "rationale": "Tab 3 data fields; Screen 4 Provider Base Type; Admin Editability (fixed in codebase). Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage. Provider-side application: Active stage."}}
  - {"op": "add_node", "id": "REQ-031-064", "type": "Rule", "owner_fr": "FR-031", "title": "Configured matrix outranks the FR-009 default role descriptions", "attrs": {"statement": "Provider role descriptions in FR-009 are recommended defaults; the permission matrix configured in FR-031 is authoritative and may grant additional access (for example, Clinical Staff granted read-only financial reporting).", "rationale": "Provider Role Permission Rules (Provider Rule 1)."}}
  - {"op": "add_node", "id": "REQ-031-065", "type": "Rule", "owner_fr": "FR-031", "title": "Core permission categories fixed", "attrs": {"statement": "Core permission categories (such as Patient Management, Provider Management and Billing) cannot be renamed or removed.", "rationale": "Admin Editability (fixed in codebase). Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-066", "type": "Rule", "owner_fr": "FR-031", "title": "Provider permission changes reach every holder of the role", "attrs": {"statement": "Provider role permission changes affect all provider team members with that role across all providers and are enforced on their next API call.", "rationale": "Tab 3 business rules; Alternative Flow A4 step 16 and outcome."}}
  - {"op": "add_node", "id": "REQ-031-067", "type": "Rule", "owner_fr": "FR-031", "title": "Super Admin-only permissions", "attrs": {"statement": "The admin permissions Edit Settings, Manage Users and Manage Roles are write permissions reserved for Super Admin only.", "rationale": "Screen 4 System Settings category (A-09); permission field is_super_admin_only. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-068", "type": "Rule", "owner_fr": "FR-031", "title": "Provider permissions limited to Owner or a base type", "attrs": {"statement": "Provider permission Manage Bank Details, Edit Settings and Remove Team Members are Owner only; Document Treatment is limited to Owner or Clinical Staff base type; Edit Team Member Roles (non-Owner) is limited to Owner or Manager base type.", "rationale": "Screen 4 provider permission categories (PR-03, PR-05, PR-06, PR-01)."}}
  - {"op": "add_node", "id": "REQ-031-069", "type": "Rule", "owner_fr": "FR-031", "title": "Issue Refunds requires approval", "attrs": {"statement": "The admin permission Issue Refunds is a write permission that requires approval.", "rationale": "Screen 4 Billing & Financial category (A-05), access level \"Write (requires approval)\". The PRD does not say who approves; see the migration report decision list. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-070", "type": "Rule", "owner_fr": "FR-031", "title": "Edit permission selects View automatically", "attrs": {"statement": "Permission dependencies apply across all roles: selecting an Edit permission automatically selects the matching View permission (for example \"Edit Patients\" requires \"View Patients\") and the dependency is highlighted.", "rationale": "Screen 4 Both Modes and Validation; Matrix Mode business rules; Alternative Flow A6 (dependency validation). Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage. Provider-side application: Active stage."}}
  - {"op": "add_node", "id": "REQ-031-071", "type": "Rule", "owner_fr": "FR-031", "title": "A role cannot be saved with zero permissions", "attrs": {"statement": "System prevents saving a role with zero permissions: at least one permission is required.", "rationale": "Screen 4 Both Modes; Single Role data fields (Permission Categories). Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage. Provider-side application: Active stage."}}
  - {"op": "add_node", "id": "REQ-031-072", "type": "Rule", "owner_fr": "FR-031", "title": "Permissions organised by module code", "attrs": {"statement": "Permissions are organised by module code (A-01, A-02 for admin; PR-01, PR-02 for provider) for traceability, and a Select All checkbox is available for each category.", "rationale": "Screen 4 Both Modes. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage. Provider-side application: Active stage."}}
  - {"op": "add_node", "id": "REQ-031-073", "type": "Rule", "owner_fr": "FR-031", "title": "Sensitive permission warning", "attrs": {"statement": "When a role contains permissions flagged \"sensitive\" in the permission definition (billing, user management, provider suspension, financial data), System shows a warning modal \"This role grants access to sensitive features: [Billing & Financial Data, Process Payouts, View Transactions]. Confirm assignment?\" together with the full permission summary; the Super Admin either confirms or cancels to select a different role.", "rationale": "Alternative Flow B6; Screen 4 Validation. Key Entities Permission has no sensitive flag; ENT-permission.is_sensitive was added (orphan field). Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage. Provider-side application: Active stage."}}
  - {"op": "add_node", "id": "REQ-031-074", "type": "Rule", "owner_fr": "FR-031", "title": "Impact confirmation before saving permission changes", "attrs": {"statement": "Before saving, System shows a confirmation \"This will affect [X] users. Continue?\"; for provider roles \"This will affect [Y] team members across [Z] provider organizations. Continue?\" and the headers warn \"Changes will affect all provider organizations\". When removing critical permissions it warns \"This will remove access to [feature] for all Clinical Staff members\" and shows the count of affected provider team members. In matrix mode the confirmation lists all affected roles and user counts.", "rationale": "Alternative Flow A4 steps 8, 9; Screen 4 Validation and header; Tab 3 business rules and notes (\"This change will affect [X] providers and [Y] team members\"); Matrix Mode business rules. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage. Provider-side application: Active stage."}}
  - {"op": "add_node", "id": "REQ-031-075", "type": "Rule", "owner_fr": "FR-031", "title": "Permission comparison shown before confirming", "attrs": {"statement": "System shows a permission comparison before a change is confirmed: current versus new role permissions with the effective date/time on a role change, and additions and removals on a provider permission edit. After a provider role save it shows \"Provider role permissions updated. Changes will take effect for all [Role] members on next page load.\"", "rationale": "Alternative Flows A2 step 7 and A4 steps 7 and 15. The \"next page load\" wording conflicts with next API call and 5 seconds elsewhere; see the migration report decision list. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage. Provider-side application: Active stage."}}
  - {"op": "add_node", "id": "REQ-031-076", "type": "Rule", "owner_fr": "FR-031", "title": "Reset to Default and Preview Impact", "attrs": {"statement": "In Single Role Mode, Reset to Default resets the role to the system-recommended permissions when they are available, and Preview Impact shows which users and providers will be affected by the changes. In matrix mode, Reset Role to Default resets the selected roles and asks for confirmation when unsaved changes exist.", "rationale": "Screen 4 modal actions (both modes). Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage. Provider-side application: Active stage."}}
  - {"op": "add_node", "id": "REQ-031-077", "type": "Rule", "owner_fr": "FR-031", "title": "Matrix comparison view", "attrs": {"statement": "The matrix view shows permissions as rows grouped by category/module and all roles of the same type (Admin or Provider, including custom roles) as columns, with checkboxes or access-level indicators. Super Admins can edit several roles at once and save all changes together; bulk actions are Select All on a column header, Select All on a row header, and Select Category; locked cells (Super Admin, Owner) show a lock icon and a disabled checkbox. The matrix can be filtered by category, searched by permission name, set to show only differences, sorted by role or permission, and exported to CSV or Excel.", "rationale": "Screen 4 View Mode 2 (layout, features, modal actions, business rules). The example matrices are illustrative; see the migration report decision list. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage. Provider-side application: Active stage."}}
  - {"op": "add_node", "id": "REQ-031-078", "type": "Rule", "owner_fr": "FR-031", "title": "Unsaved permission changes are protected", "attrs": {"statement": "System tracks all permission changes against the saved state and shows a confirmation dialog (\"Unsaved Changes\" / \"You have unsaved changes. Are you sure you want to discard them?\" with Discard Changes, Save Changes and Cancel) when the user clicks Cancel, closes the modal with X or a backdrop click, switches between Single Role and Matrix view, or navigates away from the page. With no changes the modal closes immediately; the header shows an \"Unsaved changes\" indicator while changes exist.", "rationale": "Screen 4 Unsaved Changes Protection. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage. Provider-side application: Active stage."}}
  - {"op": "add_node", "id": "REQ-031-079", "type": "Rule", "owner_fr": "FR-031", "title": "Provider sync status shown", "attrs": {"statement": "The Provider Roles tab shows \"Last synced to Provider Platform: [timestamp]\".", "rationale": "Tab 3 notes."}}
  - {"op": "add_node", "id": "REQ-031-080", "type": "Rule", "owner_fr": "FR-031", "title": "Role user counts displayed", "attrs": {"statement": "Users Count (admin roles) and Total Users (provider roles) show, display-only, the number of admin users holding the role or the number of provider team members holding it across all providers. On the admin tab the count can be clicked to filter the Admin Users tab; View Users on a provider role links to FR-015 (Provider Management).", "rationale": "Tab 1 and Tab 3 data fields and actions. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage. Provider-side application: Active stage."}}
  - {"op": "add_node", "id": "REQ-031-081", "type": "Rule", "owner_fr": "FR-031", "title": "Permission change audit content", "attrs": {"statement": "A permission change is logged in the audit trail with a before/after permission comparison: role name, permissions added and removed, affected provider count where applicable, timestamp and actor.", "rationale": "Screen 4 Both Modes; Alternative Flow A4 step 13; User Story 3 scenario 4. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage. Provider-side application: Active stage."}}
  - {"op": "add_node", "id": "REQ-031-082", "type": "Rule", "owner_fr": "FR-031", "title": "Role change for an existing admin user", "attrs": {"statement": "To change an admin user's role, the Super Admin opens Change Role, picks the new role and sets Effective From (default now); System shows the permission comparison and effective date/time, requires confirmation, validates that Effective From is not in the past, and updates the role assignment with the Effective From timestamp. System enforces the new role's permissions on the first API call at or after Effective From.", "rationale": "Alternative Flow A2; Business Rule 8 and REQ-031-011. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-083", "type": "Rule", "owner_fr": "FR-031", "title": "Role change audit entry", "attrs": {"statement": "System logs a role change in the audit trail with who changed it, the old role, the new role, effective_from and the timestamp.", "rationale": "Alternative Flow A2 step 11. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-084", "type": "Rule", "owner_fr": "FR-031", "title": "Role change email content", "attrs": {"statement": "System emails the affected user about a role change, including the effective date/time, the old role, the new role and a summary of permission changes; User Story 5 expects it within 5 minutes. When a user then opens a feature they no longer have, access is denied with \"Your permissions have changed. You no longer have access to this feature.\"", "rationale": "Alternative Flow A2 step 12; User Story 5 scenarios 1 and 3. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-085", "type": "Rule", "owner_fr": "FR-031", "title": "Last Super Admin cannot change own role", "attrs": {"statement": "When only one Super Admin exists, that Super Admin cannot change their own role to a non-Super Admin role; the action is blocked with \"You are the last Super Admin. Assign Super Admin role to another user before changing your role.\" A warning banner \"Warning: Only one Super Admin account. Consider adding backup admin.\" is shown on the Admin Users tab while only one exists.", "rationale": "User Story 6 scenario 3; Tab 2 notes. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-086", "type": "Rule", "owner_fr": "FR-031", "title": "Concurrent role changes", "attrs": {"statement": "If two Super Admins change the same user's role at once, database-level locking prevents concurrent updates: the second Super Admin receives \"Role change failed - this user's role was just updated by another admin. Refresh and try again.\" and the audit trail logs both attempts with their outcomes (success, conflict).", "rationale": "Edge Case 2. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-087", "type": "Rule", "owner_fr": "FR-031", "title": "Active session survives a role change until the next API call", "attrs": {"statement": "When a role changes during an active session, the session stays valid until the next API call; that call checks the updated permissions and enforces the new role (the user may see a permission-denied result) and the session is not forcibly terminated.", "rationale": "Edge Case 1. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-088", "type": "Rule", "owner_fr": "FR-031", "title": "Hide first, deny second", "attrs": {"statement": "On page load, System checks the user's permissions and hides menu items, buttons, tabs and sections for features the user cannot access, on both the Admin and Provider platforms. Only when hiding is not feasible (direct URL access, shared pages with partial access) does it deny access.", "rationale": "Alternative Flow B5 step 1, 2 and Note; Screen 4 UI Enforcement. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage. Provider-side application: Active stage."}}
  - {"op": "add_node", "id": "REQ-031-089", "type": "Rule", "owner_fr": "FR-031", "title": "Access denial message and log", "attrs": {"statement": "When access is denied System shows \"Access Denied: You do not have permission to access this feature. Contact your administrator if you need access.\" and logs the denial in the audit trail (user, feature, timestamp, IP address).", "rationale": "Alternative Flow B5 steps 4 and 5; Screen 5 business rules (requested feature/endpoint). User Story 4 scenario 2 lists the same fields. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-090", "type": "Rule", "owner_fr": "FR-031", "title": "Repeated access denial alerts Super Admin", "attrs": {"statement": "System sends an alert to Super Admin if multiple failed access attempts are detected (potential security issue).", "rationale": "Alternative Flow B5 step 6; Communication Structure (system notifications for access denial attempts). The PRD does not define how many attempts or over what period; see the migration report decision list. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-091", "type": "Rule", "owner_fr": "FR-031", "title": "Sensitive feature access logged", "attrs": {"statement": "All access to sensitive features (billing, patient medical data, provider financial data) MUST be logged with timestamp, user ID, action, IP address and outcome.", "rationale": "Data & Privacy Rules (Audit Rule). Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-092", "type": "Rule", "owner_fr": "FR-031", "title": "Password reset requests logged", "attrs": {"statement": "Password reset requests are logged in the audit trail with the requester's identity.", "rationale": "Data & Privacy Rules (Privacy Rule 3). Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-093", "type": "Rule", "owner_fr": "FR-031", "title": "Super Admin sends a password reset", "attrs": {"statement": "Super Admins can send a password reset from the user detail page, which forces a password reset on the user's next login. A pending-activation account does not support password reset (no password set yet): the user must request a new invitation from a Super Admin, and the original invitation token is invalidated to prevent duplicate accounts.", "rationale": "Screen 5 notes; Edge Case 4. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-094", "type": "Rule", "owner_fr": "FR-031", "title": "Audit trail view", "attrs": {"statement": "The audit trail on the user detail page shows the last 100 actions by default with a Load More option; each row shows timestamp, action type (Login, Role Change, Permission Grant, Access Denied), details, IP address and outcome (Success, Failed, Denied). Sensitive actions (role changes, permission grants) are highlighted, and role change events offer a comparison of old and new role permissions. Login failures are logged with the reason (invalid password, account suspended, and so on).", "rationale": "Screen 5. Filtering by action type, date range and outcome is specified in FR-022 REQ-022-117 (cited, not restated). The PRD names six action types in Key Entities but four on the screen. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-095", "type": "Rule", "owner_fr": "FR-031", "title": "Audit trail export", "attrs": {"statement": "The audit trail can be exported to CSV for compliance reporting, with all entries and the columns timestamp, user, action, details, IP address and outcome.", "rationale": "Screen 5 business rules; User Story 4 scenario 3. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-096", "type": "Rule", "owner_fr": "FR-031", "title": "Suspicious activity alerts on user detail", "attrs": {"statement": "The user detail page displays security alerts when suspicious activity is detected (multiple failed logins, unusual access patterns).", "rationale": "Screen 5 notes. No thresholds are defined. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-097", "type": "Rule", "owner_fr": "FR-031", "title": "Audit write failure blocks critical admin actions", "attrs": {"statement": "If an audit trail write fails, critical actions (role changes, suspensions) are buffered in memory and retried on database reconnection; if the buffer is full or the database is unavailable for an extended period, admin actions are temporarily blocked with \"System maintenance in progress. Please try again shortly.\" and an alert goes to the infrastructure team immediately (audit trail failure is a critical security issue).", "rationale": "Edge Case 5; Implementation Notes (audit writes buffered, alert on audit write failure). Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-098", "type": "Rule", "owner_fr": "FR-031", "title": "Admin user list paging, sorting and export", "attrs": {"statement": "The Admin Users list shows 25 users per page with a Load More option and can be sorted by Name (A-Z), Last Login (most recent first) and Role (alphabetical); the user list can be exported to CSV with all columns and the applied filters. Search and filters are specified in FR-022 REQ-022-115.", "rationale": "Tab 2 business rules and notes. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-099", "type": "Rule", "owner_fr": "FR-031", "title": "Authentication limits configurable in A-09", "attrs": {"statement": "The maximum failed login attempts before lockout, the session timeout duration and the number of concurrent sessions per admin user (default 3, range 1-5) are configurable in A-09 Authentication Settings.", "rationale": "Admin Editability (Configurable with Restrictions). The session timeout is linked to the existing SET-admin-inactivity-timeout (FR-026) on the assumption that they are the same setting. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-100", "type": "Rule", "owner_fr": "FR-031", "title": "Admin login rate limit", "attrs": {"statement": "The admin login endpoint is rate-limited to prevent brute-force attacks (max 5 attempts per 15 minutes).", "rationale": "Implementation Notes, Security Considerations (threat mitigation). Promoted as a business rule because it states a numeric limit. How it relates to the configurable lockout threshold is unstated; see the migration report decision list. Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-101", "type": "Rule", "owner_fr": "FR-031", "title": "Admin permissions: Dashboard & Overview (A-01)", "attrs": {"statement": "Permission category \"Dashboard & Overview\" (A-01) in the admin permission matrix offers: View Dashboard (Access main admin dashboard; Read); View Patient Overview (View patients across all lifecycle stages; Read).", "rationale": "Screen 4 permission matrix structure, admin platform categories. Rows copied from the PRD table (Permission, Description, Access Level). Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-102", "type": "Rule", "owner_fr": "FR-031", "title": "Admin permissions: Patient Management (A-01)", "attrs": {"statement": "Permission category \"Patient Management\" (A-01) in the admin permission matrix offers: View Patients (View patient list and profiles; Read); Edit Patients (Modify patient information; Write); Delete Patients (Archive patient accounts; Delete).", "rationale": "Screen 4 permission matrix structure, admin platform categories. Rows copied from the PRD table (Permission, Description, Access Level). Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
  - {"op": "add_node", "id": "REQ-031-103", "type": "Rule", "owner_fr": "FR-031", "title": "Admin permissions: Provider Management (A-02)", "attrs": {"statement": "Permission category \"Provider Management\" (A-02) in the admin permission matrix offers: View Providers (View provider list and profiles; Read); Edit Providers (Modify provider information; Write); Onboard Providers (Create new provider accounts; Write); Suspend Providers (Suspend/activate provider accounts; Delete).", "rationale": "Screen 4 permission matrix structure, admin platform categories. Rows copied from the PRD table (Permission, Description, Access Level). Stage placement for admin-side behaviour is provisional: the PRD names no stage and the model has no admin-configuration stage."}}
