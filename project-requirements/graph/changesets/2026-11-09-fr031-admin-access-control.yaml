  - {"op": "add_node", "id": "EVT-admin-invitation-sent", "type": "Event", "owner_fr": "FR-031", "title": "Admin invitation sent", "attrs": {"description": "Email to the invitee when a Super Admin sends an admin team invitation (or re-sends it): invitation link, role, personal message. Raised at the provisional admin stage."}}
  - {"op": "add_node", "id": "EVT-admin-invitation-delivery-failed", "type": "Event", "owner_fr": "FR-031", "title": "Admin invitation delivery failed", "attrs": {"description": "Invitation email could not be delivered after the automatic retries; the invitation is marked Pending Send and the Super Admin is warned. Raised at the provisional admin stage."}}
  - {"op": "add_node", "id": "EVT-admin-account-created", "type": "Event", "owner_fr": "FR-031", "title": "Admin account created", "attrs": {"description": "Confirmation email to the new admin user and to the Super Admin who invited them after account setup completes. Raised at the provisional admin stage."}}
  - {"op": "add_node", "id": "EVT-admin-role-changed", "type": "Event", "owner_fr": "FR-031", "title": "Admin role changed", "attrs": {"description": "Email to the affected admin user when their role changes: effective date/time, old role, new role, permission change summary. Raised at the provisional admin stage."}}
  - {"op": "add_node", "id": "EVT-admin-role-permissions-changed", "type": "Event", "owner_fr": "FR-031", "title": "Admin role permissions changed", "attrs": {"description": "Email to affected admin users when the permissions of their role change. Raised at the provisional admin stage."}}
  - {"op": "add_node", "id": "EVT-admin-repeated-access-denial", "type": "Event", "owner_fr": "FR-031", "title": "Repeated access denial alert", "attrs": {"description": "Alert to Super Admin when multiple failed access attempts are detected. Raised at the provisional admin stage."}}
  - {"op": "add_node", "id": "EVT-admin-password-reset-sent", "type": "Event", "owner_fr": "FR-031", "title": "Admin password reset sent", "attrs": {"description": "Password reset email sent when a Super Admin triggers a reset from the user detail page. Raised at the provisional admin stage."}}
  - {"op": "add_node", "id": "SCR-031-01", "type": "Screen", "owner_fr": "FR-031", "title": "User Roles & Permissions", "attrs": {"platform": "admin", "description": "Admin Platform, Settings > User Roles & Permissions, three tabs: Admin Roles, Admin Users, Provider Roles (PRD Screen 1). UI controls, not fields: tab switcher, role list action buttons (Edit Permissions, View Users, Clone Role; disabled for Super Admin), Create Custom Role, Invite Team Member, user action menu (Change Role, Suspend, View Audit), search bar and filters (Tab 2 specified in FR-022 REQ-022-115, Tab 1 in REQ-022-116), pending invitations sub-tab and notification dot, sync status indicator, warning banner when only one Super Admin exists. Tab 3 View Users links to FR-015."}}
  - {"op": "add_node", "id": "SCR-031-02", "type": "Screen", "owner_fr": "FR-031", "title": "Invite Team Member", "attrs": {"platform": "admin", "description": "Admin Platform form where a Super Admin invites an admin team member (PRD Screen 2). UI controls: role permission summary, Preview Email, Send Invitation, Cancel."}}
  - {"op": "add_node", "id": "SCR-031-03", "type": "Screen", "owner_fr": "FR-031", "title": "Admin Account Setup", "attrs": {"platform": "admin", "description": "Admin Platform page the invitee opens from the invitation link to create their account (PRD Screen 3). UI controls: Confirm Password (validation only, nothing stored), MFA enrollment section marked Coming Soon, expiry countdown, Create Account and Cancel buttons."}}
  - {"op": "add_node", "id": "SCR-031-04", "type": "Screen", "owner_fr": "FR-031", "title": "Permission Matrix Modal", "attrs": {"platform": "admin", "description": "Admin Platform modal to edit one role's permissions (Single Role mode) or compare and edit several roles at once (Matrix mode) (PRD Screen 4). UI controls: Select All and category bulk actions, mode switch, Save Changes, Cancel, Reset to Default, Preview Impact, Export Matrix, matrix filters and search, unsaved-changes dialog, sensitive-permission warning modal."}}
  - {"op": "add_node", "id": "SCR-031-05", "type": "Screen", "owner_fr": "FR-031", "title": "User Detail & Audit Trail", "attrs": {"platform": "admin", "description": "Admin Platform page with an admin user's profile and audit trail (PRD Screen 5). UI controls: Send Password Reset, Load More, Export audit trail to CSV, security alerts, audit filters (specified in FR-022 REQ-022-117)."}}
