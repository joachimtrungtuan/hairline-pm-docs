  - {"op": "add_node", "id": "ENT-admin-user-account", "type": "Entity", "owner_fr": "FR-031", "title": "Admin user account", "attrs": {"description": "An admin team member's account: identity, one assigned role with its effective date, status, login history and invitation state (PRD Key Entities, Entity 1). Invitation fields are held on the account because the PRD names no separate invitation record; see the migration report decision list."}}
