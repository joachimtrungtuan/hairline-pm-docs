reason: "Owner ruling 2026-11-22 (R1, R2) applied to FR-015: a booking cancelled by provider suspension or deactivation refunds the patient in full, no cancellation fee, new payment on the replacement booking (the credit placeholder is gone); an In Progress booking follows the admin-set refund with mandatory reason, audit entry and provider payout held until the admin decides."
by: controller
operations:
  - {"op": "update_node", "id": "REQ-015-043", "title": "Cancellation by provider status leaves payment records intact; money follows FR-006 B5 and B7 payment terms", "attrs": {"statement": "Suspension or deactivation closes affected bookings and blocks further patient payment to that provider, but payment/refund/commission records remain intact. For a closed accepted booking, money follows the FR-006 Alternative Flow B5 payment terms: the patient is refunded in full everything paid, pays no cancellation fee, and the replacement booking takes a new payment. For an `In Progress` booking (treatment already started), an admin reviews each case and sets the patient refund amount, from zero up to the full amount paid, with a mandatory reason and an audit entry, and the provider's payout for that booking is held until the admin decides (FR-006 Alternative Flow B7 payment terms). Exact refund, fund-release, and allocation mechanics belong to FR-007, FR-007B, and FR-017; no new refund percentage or fee is defined here, and the payout method and payout-readiness rules below concern only a clinic's payout setup."}}
  - {"op": "update_node", "id": "REQ-015-085", "attrs": {"statement": "`Completed`, already `Cancelled`, and `Payment Window Expired` cases are not relabelled as new suspension or deactivation cancellations. Retain clinical notes, photos, completion milestones, accepted identifiers/versions, and payment/refund history. In Progress bookings awaiting the admin decision and Aftercare reassignments caused by suspension or deactivation must reach admins for clinical continuity and recovery support; automatic lifecycle cancellation does not itself transfer care or settle money; the admin replacement-provider transfer and its payment terms (full refund, no cancellation fee, new payment on the replacement booking) follow FR-006 Alternative Flow B5, and the aftercare reassignment follows FR-006 Alternative Flow B6 with no new acceptance or payment."}}
