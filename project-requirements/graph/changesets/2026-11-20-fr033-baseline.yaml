  - {"op": "add_node", "id": "REQ-033-094", "type": "Rule", "owner_fr": "FR-033", "title": "Changing the source type of an existing video needs a new file or URL and a replace confirmation", "attrs": {"statement": "Admins MUST be able to change the source type of an existing video (uploaded file or third-party link) by providing the new file or URL and confirming that the old one is replaced; the video keeps its view counts", "rationale": "Screen 5.1 (video source type). PRD: FR-033."}}
