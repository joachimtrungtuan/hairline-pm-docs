  - {"op": "update_node", "id": "REQ-033-004", "attrs": {"statement": "Admins MUST be able to create Help Centre content with audience selection (Provider or Patient), content kind (which decides the Help Centre section it appears in), title, rich text body, file attachments, tags, and publish status", "rationale": "Restated by Main Flow steps 1 to 15, Rule 7 (admin must explicitly select the audience) and Admin Editability (title, body, attachments, content kind, publish status, audience type are editable)."}, "title": "Admin creates content with audience, kind, body, attachments, tags and status"}
  - {"op": "update_node", "id": "REQ-033-016", "attrs": {"statement": "System MUST support soft-delete for content (move to \"Archived\" status) not permanent deletion for both audiences; service components and incidents are also soft-deleted", "rationale": "Restated by Rule 6 (soft delete supports recovery and audit compliance), Data Retention (archived content retained indefinitely) and the delete rules of Screens 2 to 6."}}
  - {"op": "update_node", "id": "REQ-033-024", "attrs": {"statement": "System MUST enforce one allowed-file list per upload kind, rejecting all other file types: resources (PDF, DOCX, XLSX, PNG, JPG), videos (MP4, MOV), and images such as thumbnails (PNG, JPG)", "rationale": "Restated by Security Considerations (File Upload Security) and Screen 4."}}
  - {"op": "update_node", "id": "REQ-033-034", "attrs": {"statement": "Publishing content, editing published content, reordering FAQ topics or FAQs, and unpublishing content take effect in the provider Help Centre within 1 minute.", "rationale": "Main Flow step 14, A2 step 10, A3 step 11, A5 step 7 (all say within 1 minute)."}, "title": "Publish, edit and reorder take effect in the provider Help Centre within 1 minute"}
  - {"op": "update_node", "id": "REQ-033-036", "attrs": {"statement": "Content must be tagged with audience type (Provider or Patient) and with its kind (FAQ, Tutorial Guide, Troubleshooting Tip, Video Tutorial, Resource Document, Policy Document); the kind decides the Help Centre section the content appears in, and admins do not pick a section separately.", "rationale": "Business Rules, General Module Rules, Rule 3."}, "title": "Content tagged with audience and kind; the kind decides the section"}
  - {"op": "update_node", "id": "REQ-033-037", "attrs": {"statement": "Content can exist in four states: Draft (admin-only), Published (audience-visible), Unpublished (admin-only, previously published), Archived (admin-only, set when content is deleted).", "rationale": "Business Rules, General Module Rules, Rule 4. REQ-033-016 sets the Archived state on delete."}, "title": "Content states: Draft, Published, Unpublished, Archived"}
  - {"op": "update_node", "id": "REQ-033-044", "attrs": {"statement": "Every hide of a Help Centre category (any of the 10 categories) asks the admin for confirmation.", "rationale": "Screen 1.1 Visibility Toggle validation and Admin Editability Rules (Configurable with Restrictions)."}, "title": "Every category hide needs admin confirmation"}
  - {"op": "update_node", "id": "REQ-033-080", "attrs": {"statement": "The overall status is calculated automatically from the service component statuses and recalculated when a component or an incident changes; a Degraded component does not count: if no component is Down the overall status is All Systems Operational, if some components are Down it is Partial Outage, and if all components are Down it is Major Outage; the options are All Systems Operational, Partial Outage and Major Outage, and an admin may pick another value by hand (see REQ-033-093).", "rationale": "Alternative Flow A6 step 4, Screen 6 Data Fields (Overall Status) and Business Rules, Screen 6.1 and 6.2 rules."}}
  - {"op": "update_node", "id": "STP-033-014", "title": "If published, system makes content available in the provider Help Centre category within 1 minute"}
