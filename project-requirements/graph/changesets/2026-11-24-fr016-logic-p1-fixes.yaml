  - {"op": "update_node", "id": "ENT-admin-action-log.admin_id", "attrs": {"description": "The admin who acted; shown as Admin Name. Required for an admin-performed action; empty when system_generated is true, and the entry shows System as the actor."}}
  - {"op": "update_node", "id": "ENT-admin-action-log.justification", "attrs": {"description": "Admin reason for the action (minimum 20 characters) for an admin-performed action; for a system-generated entry (system_generated is true) the cause the system states."}}
