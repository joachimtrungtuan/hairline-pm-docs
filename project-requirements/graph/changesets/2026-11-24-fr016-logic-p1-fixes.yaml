# FR-016 logic review pass 1: ruled fixes applied to the PRD (Admin Patient Management). New rules, one step and the audit action values come first, then new edges, then updates, removed edges and retirements.
# Cross-FR edges: SCR-016-08 shows ENT-deletion-request.blocked_by_obligation and ENT-deletion-request.jurisdiction_review_required (FR-023 fields, edge only; FR-023 is not edited). No other FR's node is updated. STP-016-080 keeps its existing next edge to STP-006-301.
# Queued for other FRs, not done here: FR-020 (events patient.suspended, patient.suspension_ended, patient.password_reset_by_admin, admin.manual_notice, admin.policy_warning; the first four mandatory), FR-031 (default role matrix check for the mapped actions, wording of the Delete Patients description), FR-001 (enum value deactivated of ENT-patient.account_status), FR-023 (Needs attention signal has no field), FR-006 and FR-034 (nothing to edit).
# Left alone on purpose: minor observations of the review; the badge Needs attention has no graph field (stated in REQ-016-222); the two deletion rules pinned on the deleted stage (accepted earlier).
reason: "FR-016 logic review pass 1: Cancel Booking only in the FR-006 cancel states, audit entries for system actions need no admin or 20-character justification, audit action list extended, suspension cascade limited to cancellable bookings with a fixed neutral reason and a failure step, Lift Suspension and Unlock Account controls and a system entry at automatic suspension end, Deactivated status and archive interface removed, deletion flow reduced to the admin steps of the FR-023 process, Screen 8 filter, badges and approval conditions, deletion certificate dropped, Edge Case 5 follows FR-023 A3, permission mapping for uncovered actions, refund threshold in US dollars, FR-020 events noted, REQ-016-082 wired like REQ-016-020."
by: docs-manager
