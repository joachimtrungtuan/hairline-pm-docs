  - {"op": "update_node", "id": "REQ-016-007", "attrs": {"statement": "System MUST log every admin action on patient accounts in immutable audit trail with timestamp, admin ID, action type, and justification; an entry the system generates records System as the actor and the system-stated cause"}}
  - {"op": "update_node", "id": "REQ-016-161", "title": "Admin name and justification are required for admin-performed actions; a system entry shows System and its stated cause", "attrs": {"statement": "Admin name and justification (minimum 20 characters) are required for every admin-performed action; for a system-generated entry the actor is \"System\" and the justification is the system-stated cause"}}
  - {"op": "update_node", "id": "REQ-016-162", "attrs": {"statement": "Actions marked as \"System-Generated\" if automated (e.g., auto-unlock account after lockout period, end of a timed suspension)"}}
  - {"op": "update_node", "id": "REQ-016-160", "attrs": {"rationale": "Stated in prd.md, Screen 7: Patient Detail View - Admin Actions Tab. The allowed list also holds Manual Notification, Patient Warning, Provider Warning, Suspension Lifted and Suspension Ended."}}
  - {"op": "update_node", "id": "REQ-016-078", "attrs": {"statement": "Editable by admin: Booking cancellation only through the FR-006 Cancel Booking action: allowed for `Accepted`, `Payment Window Expired`, and `Confirmed` bookings (`In Progress` goes through FR-006 Screen 11, Alternative Flow B7, and `Aftercare` has no cancel button), on an admin decision or a support-routed patient request, with a mandatory reason, confirmation, and audit entry (Flow A8, Screen 9)"}}
  - {"op": "update_node", "id": "REQ-016-194", "attrs": {"statement": "Cancel Booking action: Opens the FR-006 Cancel Booking action (FR-006 Screen 9) prefilled with the request source and support case reference; Shown for cancellation requests when the booking is `Accepted`, `Payment Window Expired`, or `Confirmed`. For `In Progress` the row links to FR-006 Screen 11 (Alternative Flow B7) instead; for `Aftercare` no cancel button is shown and the admin uses Decline Request, pointing to FR-006 Alternative Flow B6"}}
  - {"op": "update_node", "id": "STP-016-093", "title": "Admin opens the FR-006 Cancel Booking action (Accepted, Payment Window Expired or Confirmed bookings; In Progress through FR-006 Screen 11, Aftercare declined), enters the mandatory reason and confirms"}
  - {"op": "update_node", "id": "REQ-016-052", "title": "Suspension warning: patient login blocked and cancellable bookings cancelled", "attrs": {"statement": "System displays warning: \"This action will immediately prevent patient login and cancel bookings that are Accepted, Payment Window Expired or Confirmed. Proceed?\" and lists the patient's `In Progress` and `Aftercare` bookings, which are left untouched, for admin follow-up"}}
  - {"op": "update_node", "id": "STP-016-075", "title": "System displays the suspension warning and lists the In Progress and Aftercare bookings that are left untouched"}
  - {"op": "update_node", "id": "STP-016-080", "title": "System cancels each Accepted, Payment Window Expired or Confirmed booking through the FR-006 admin booking cancellation with the fixed neutral reason; the admin justification stays in the audit entry only"}
  - {"op": "update_node", "id": "REQ-016-054", "title": "Patient receives a suspension notification that tells them to contact support to appeal", "attrs": {"statement": "System sends suspension notification to patient; the notice tells the patient to contact support to appeal, which creates an FR-034 support ticket"}}
  - {"op": "update_node", "id": "STP-016-081", "title": "System sends the suspension notification; the notice tells the patient to contact support to appeal"}
  - {"op": "update_node", "id": "REQ-016-110", "title": "Overview quick actions: Reset Password, Suspend Account, Send Notification, Lift Suspension, Unlock Account", "attrs": {"statement": "Quick action buttons: \"Reset Password\", \"Suspend Account\", \"Send Notification\"; \"Lift Suspension\" is shown only when Account Status is Suspended and \"Unlock Account\" only when it is Locked"}}
  - {"op": "update_node", "id": "REQ-016-201", "attrs": {"statement": "A 30-day or 90-day account suspension ends by itself: when the suspension end date is reached the patient account returns to Active without an admin action, the system logs a System-generated Suspension Ended audit entry and sends the patient a notice. A permanent suspension has no end date"}}
  - {"op": "update_node", "id": "SCR-016-02", "attrs": {"description": "Patient profile summary and current status. Controls: Edit Patient, Reset Password, Suspend Account, Lift Suspension (only while Suspended), Unlock Account (only while Locked), Send Notification, Resolve Support, flags View All, copy and mail actions."}}
  - {"op": "update_node", "id": "REQ-016-183", "title": "Account status filter: Active, Suspended, Locked", "attrs": {"statement": "Account status filter: Filter by account status; Options: Active, Suspended, Locked"}}
  - {"op": "update_node", "id": "REQ-016-046", "attrs": {"statement": "System displays \"No patients found matching your search criteria\"; System suggests broadening search:; Remove date range filters; Try partial name match; Search by phone number instead of email; If still no results, admin checks if the patient account exists in a different status"}}
  - {"op": "update_node", "id": "STP-016-044", "title": "Admin checks whether the patient account exists in a different status"}
  - {"op": "update_node", "id": "REQ-016-076", "attrs": {"statement": "Editable by admin: Patient account status: suspend, lift a suspension early, and unlock a Locked account"}}
  - {"op": "update_node", "id": "REQ-016-017", "attrs": {"rationale": "Stated in prd.md, Data Governance Requirements. Restated in General Module Rule 6: a patient account is never hard-deleted; an approved deletion request anonymizes or archives the data in place per FR-023, with retention per the system PRD, Platform-Wide Rules: One 10-year retention period."}}
  - {"op": "update_node", "id": "FLW-016-data-deletion-request", "title": "Admin reviews a patient data deletion request (GDPR)", "attrs": {"description": "Admin reviews a patient data deletion request (GDPR); the patient submits it from FR-001 Delete Account and FR-023 owns the process"}}
  - {"op": "update_node", "id": "REQ-016-060", "title": "Data deletion request handling: the admin reviews the request on Screen 8; FR-023 owns the process", "attrs": {"statement": "The patient submits a deletion request from Delete Account (FR-001) and it appears on Screen 8 as Pending Admin Review; the admin reviews it and may contact the patient. The process, statuses, deadline and notices are owned by FR-023"}}
  - {"op": "update_node", "id": "REQ-016-061", "title": "On approval FR-023 runs the deletion; the data is anonymized in place", "attrs": {"statement": "After approval FR-023 runs the rest: the request becomes In Progress; mark account for anonymization; Remove PII (name, email, phone, address); Retain anonymized medical records and archive transaction history (retention follows the system PRD, Platform-Wide Rules: One 10-year retention period)"}}
  - {"op": "update_node", "id": "REQ-016-062", "title": "The Fulfilled request with the actions taken is the audit evidence; no separate certificate", "attrs": {"statement": "The request ends Fulfilled with the actions taken recorded on the request; that record is the audit evidence and no separate deletion certificate is produced"}}
  - {"op": "update_node", "id": "REQ-016-063", "title": "The patient receives one outcome notice and the request ends Fulfilled", "attrs": {"statement": "System notifies the patient of the deletion outcome, listing the actions taken and the legal basis for any retained records (per FR-023); the request ends Fulfilled"}}
  - {"op": "update_node", "id": "REQ-016-171", "attrs": {"statement": "System validates active obligations at the time of approval; if obligations exist, approval is blocked and the admin sees an actionable message (the request stays Pending Admin Review, marked blocked by obligation, until the obligation ends; FR-023 Alternative Flow A3)"}}
  - {"op": "update_node", "id": "REQ-016-186", "attrs": {"statement": "Deletion requests default filter: Status = Pending Admin Review; the Status filter offers all five request statuses: Pending Admin Review, Verification Required, In Progress, Fulfilled, Denied"}}
  - {"op": "update_node", "id": "REQ-016-190", "attrs": {"statement": "Approve deletion request: Approves deletion request; Shown only for Pending Admin Review and Verification Required, not for In Progress; requires the retention confirmation (the protected categories stay in anonymized form with restricted access, FR-023), enhanced confirmation, and justification"}}
  - {"op": "update_node", "id": "REQ-016-191", "attrs": {"statement": "Deny deletion request: Denies deletion request; Shown only for Pending Admin Review and Verification Required, not for In Progress; requires justification"}}
  - {"op": "update_node", "id": "SCR-016-08", "attrs": {"description": "Queue of patient account and data deletion requests with a review modal. Filter offers all five request statuses; badges show Overdue, Blocked by obligation, Jurisdiction review and Needs attention. Controls: search, filters, Review, Approve and Deny (Pending Admin Review and Verification Required only, Approve with a retention confirmation), Validate Verification, Close, call and email actions."}}
  - {"op": "update_node", "id": "REQ-016-067", "attrs": {"statement": "The request stays Pending Admin Review, marked blocked by obligation, and the patient is told the expected timeline (for example, \"a pending refund of USD 500 must complete first\"); when the refund completes, the system clears the mark and notifies the admins, who then approve or deny; the 30-day deadline keeps running (FR-023 Alternative Flow A3)", "rationale": "Stated in prd.md, Edge Cases (Edge Case 5); the handling follows FR-023 Alternative Flow A3."}}
  - {"op": "update_node", "id": "STP-016-111", "title": "Admin opens the deletion request on Screen 8 and reviews it; the admin may contact the patient"}
  - {"op": "update_node", "id": "STP-016-112", "title": "If the identity proof is not sufficient the request becomes Verification Required and the admin validates the additional verification on Screen 8"}
  - {"op": "update_node", "id": "STP-016-113", "title": "Admin approves with the retention confirmation and a justification, or denies with a reason; on approval the active bookings and financial obligations are checked"}
  - {"op": "update_node", "id": "STP-016-114", "title": "If an active obligation exists, approval is blocked: the request stays Pending Admin Review, marked blocked by obligation, until the obligation ends"}
  - {"op": "update_node", "id": "STP-016-115", "title": "After approval the request becomes In Progress and FR-023 runs the rest of the process"}
  - {"op": "update_node", "id": "STP-016-116", "title": "System anonymizes or archives the data in place per FR-023"}
  - {"op": "update_node", "id": "STP-016-118", "title": "System sends the patient one outcome notice with the actions taken and the legal basis"}
  - {"op": "update_node", "id": "STP-016-119", "title": "The request ends Fulfilled with the actions taken recorded on the request"}
  - {"op": "update_node", "id": "REQ-016-027", "attrs": {"statement": "System MUST notify the patient when an admin takes an action that affects them; delivery follows the FR-020 notification service Rule; the notices raised by this module (suspension, suspension end, password reset by an admin, manual and bulk notices, policy warnings) each need an FR-020 event"}}
  - {"op": "update_node", "id": "REQ-016-070", "attrs": {"statement": "Admin visibility and edit rights follow the FR-031 role permissions: View Patients grants patient visibility (all default roles), Edit Patients grants patient edits (Super Admin by default), Manage Aftercare covers aftercare actions and access to medical data and scans (Super Admin and Aftercare Coordinator by default), View Support Center and Respond to Support cover support actions (Super Admin, Aftercare Coordinator, and Support Staff by default), Issue Refunds covers refunds and payment retry, and Delete Patients covers approving deletion requests. Actions the FR-031 list does not name map as follows: Reset Password, Unlock Account, and Lift Suspension need Edit Patients; Send Notification needs Respond to Support; the Payments tab needs View Patient Billing; the Communications tab needs View Provider-Patient Messages, and flagging a conversation needs Flag Communications"}}
  - {"op": "update_node", "id": "REQ-016-011", "attrs": {"statement": "System MUST allow admins to initiate refunds with enhanced confirmation workflow for amounts > $1,000 (US dollars; other currencies are converted at the rate FR-007 applies to that payment)"}}
  - {"op": "update_node", "id": "REQ-016-020", "attrs": {"statement": "System MUST require enhanced confirmation + justification for high-impact actions (account suspension of any duration, refunds exceeding $1,000 (US dollars; other currencies converted at the rate FR-007 applies to that payment), manual booking modifications during active treatment, bulk patient notifications, patient data deletion for GDPR requests) even when the admin holds the FR-031 permission for the action"}}
  - {"op": "update_node", "id": "REQ-016-082", "attrs": {"statement": "High-impact actions require extended confirmation + justification: Account suspension (any duration: 30 days, 90 days, or permanent); Refunds exceeding $1,000 (US dollars; other currencies converted at the rate FR-007 applies to that payment); Manual booking modifications during active treatment (handled on case detail screen); Bulk patient notifications; Patient data deletion (GDPR requests)"}}
