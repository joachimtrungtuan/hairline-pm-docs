  - {"op": "add_node", "id": "STP-004-115", "type": "Step", "title": "System moves the accepted quote to withdrawn, keeps the acceptance unchanged and sends quote.withdrawn to the patient and the admin", "owner_fr": "FR-004", "attrs": {"prd_ref": "Alternative Flows bullet 12; Workflow 6"}}
  - {"op": "add_node", "id": "STP-004-116", "type": "Step", "title": "Admin opens Screen 8 from the transfer; the system checks the provider-fault marker, the booking status, that no replacement acceptance exists, that treatment has not started and the replacement provider", "owner_fr": "FR-004", "attrs": {"prd_ref": "Alternative Flows bullet 13; Workflow 7"}}
  - {"op": "add_node", "id": "STP-004-117", "type": "Step", "title": "Admin builds the replacement quote and saves it as a draft with no expiry, no promotion and no notice", "owner_fr": "FR-004", "attrs": {"prd_ref": "Alternative Flows bullet 13; Workflow 7"}}
