  - {"op": "add_node", "id": "REQ-004-109", "type": "Rule", "title": "Provider-fault marker freezes the accepted quote; the replacement quote is the only quote write", "owner_fr": "FR-004", "attrs": {"statement": "While the booking carries the provider-fault support-required marker, whether the fault is pending or the booking is already `Cancelled` with the marker, System MUST block provider edits and admin Screen 7 edits of the accepted quote's date range, appointment, and treatment details, MUST block an admin restore of any quote of the inquiry, and MUST hide a second Withdraw action. The replacement quote on Screen 8 is the only quote write allowed; admin notes stay allowed. The marker stops payment, reminders, and revive in FR-006 (REQ-006-081).", "rationale": "Keeps the accepted quote from changing underneath a pending replacement; mirrors the FR-006 pending-fault block."}}
  - {"op": "add_edge", "from": "REQ-004-109", "verb": "decided by", "to": "SRC-PRD-004"}
  - {"op": "add_node", "id": "REQ-004-110", "type": "Rule", "title": "Active acceptance is the latest AcceptanceEvent without a supersession record", "owner_fr": "FR-004", "attrs": {"statement": "An active acceptance is the latest AcceptanceEvent on the inquiry that has no supersession record, whatever the status of its parent quote or subquote. The original acceptance stays active, even after its quote is withdrawn, until the replacement acceptance is recorded; once it is superseded, superseded takes precedence over withdrawn for the original subquote. The original parent quote keeps its own status, and only the replacement parent quote counts as the inquiry's accepted quote. A restore stays blocked between a withdrawal and the replacement acceptance.", "rationale": "One definition so every rule that says an acceptance is active reads the same fact."}}
  - {"op": "add_edge", "from": "REQ-004-110", "verb": "decided by", "to": "SRC-PRD-004"}
  - {"op": "add_node", "id": "REQ-004-111", "type": "Rule", "title": "A replacement draft is cancelled without notice when an admin closes or cancels the inquiry", "owner_fr": "FR-004", "attrs": {"statement": "When an admin closes the inquiry (Close inquiry on FR-006 Screen 6) or cancels it (FR-006 Screen 9), System MUST move any draft replacement quote of that inquiry to `cancelled_inquiry_cancelled`, MUST NOT send `quote.cancelled_inquiry` to the replacement provider, and no `quote.expired` follows. The cascade trigger is owned by FR-003 (REQ-003-013) and FR-006.", "rationale": "The replacement draft is admin-authored and never offered to the patient, so the provider is not told and nothing expires."}}
