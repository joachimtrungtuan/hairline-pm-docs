  - {"op": "update_node", "id": "SCR-004-02", "attrs": {"description": "Provider views all quotes in a single unified list with no tabs, reflecting global case statuses; actions (Edit, Soft Delete for drafts only, View Details) are state-aware; cancelled quotes are greyed out with a badge and all actions disabled."}}
  - {"op": "update_node", "id": "SCR-004-03", "attrs": {"description": "Provider inspects full quote details, patient-first as a continuation of the inquiry (Patient, Inquiry, Quote, Audit); Edit and Soft Delete (drafts only) when eligible, and Withdraw for a sent quote before acceptance or for an accepted quote only while the booking is Confirmed, before check-in, with no provider-fault marker; an Inquiry Cancelled banner and read-only state for cancelled quotes."}}
  - {"op": "update_node", "id": "SCR-004-05", "attrs": {"description": "Admin lists and filters all quotes across providers, grouped by inquiry by default, with a multi-quote cue, per-quote audit trail and version history; Restore and Archive are hidden for accepted quotes, and Restore is blocked while the inquiry has an active acceptance or the booking carries a provider-fault marker."}}
  - {"op": "update_node", "id": "SCR-004-07", "attrs": {"description": "Admin performs inline edits with audit on draft, sent, and accepted quotes, with a mandatory reason; price, currency, and promotion stay read-only once accepted, an edit after acceptance is stored as a new version beside the unchanged acceptance snapshot, and edits of the accepted quote are blocked while the booking carries a provider-fault marker, except admin notes."}}
  - {"op": "update_node", "id": "SCR-004-08", "attrs": {"description": "Admin authors a quote for the replacement provider during an FR-006 provider-fault transfer, pending or closed, opened only from the transfer; the quote stays a draft with no expiry, and Save and Continue confirms the summary and returns to FR-006 to record the acceptance."}}
  - {"op": "add_edge", "from": "SCR-004-03", "verb": "shows", "to": "ENT-quote-audit.reason", "attrs": {"provenance": "user input", "label": "Withdrawal Reason", "editable": true}}
  - {"op": "add_edge", "from": "SCR-004-08", "verb": "shows", "to": "ENT-booking.support_required", "attrs": {"provenance": "inherited from another FR", "label": "Transfer Context: provider-fault marker"}}
  - {"op": "update_node", "id": "ENT-quote.expires_at", "attrs": {"description": "Computed at first send from the FR-026 quote expiry setting; null on drafts and always null on an admin-authored replacement quote; no per-quote extension; shown as \"set on first send\" while drafting."}}
  - {"op": "update_node", "id": "ENT-quote.currency_snapshot", "attrs": {"description": "Captured read-only at first send from the active FR-026 quote configuration (FR-029 Default Currency); for an admin-authored replacement quote, captured when the admin records the replacement acceptance; null on drafts; never provider input."}}
  - {"op": "update_node", "id": "ENT-quote.first_sent_at", "attrs": {"description": "Set once on the first send; for an admin-authored replacement quote, set when the admin records the replacement acceptance; never changed by a re-send or new version; null on drafts. FR-014 Time to First Quote reads it."}}
  - {"op": "update_node", "id": "EVT-quote-expiring-soon", "attrs": {"description": "Emitted once per sent parent quote when it reaches the FR-026 quote-expiring-soon lead time (FR-030); never for drafts, accepted or terminal quotes, or the admin-authored replacement quote, which has no expiry."}}
  - {"op": "update_node", "id": "EVT-quote-expired", "attrs": {"description": "Emitted once per parent quote when expiry processing moves a sent quote to expired (FR-030); never for the admin-authored replacement quote, which has no expiry."}}
  - {"op": "update_node", "id": "FLW-004-abandoned-draft", "title": "Provider abandons a draft; system archives it 7 days after the last edit", "attrs": {"description": "Provider abandons a draft; system archives it 7 days after the last edit"}}
