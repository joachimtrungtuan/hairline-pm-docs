reason: "FR-004 logic review pass 1 - provider withdraws a sent quote before acceptance and may soft-delete drafts only; withdrawal after acceptance only while the booking is Confirmed before check-in with no provider-fault marker; the provider-fault transfer follows FR-006 (booking keeps its status and hold until the admin submit; Screen 8 opens for a pending or closed fault until a replacement acceptance is recorded); new rules for the frozen accepted quote (REQ-004-109), the definition of an active acceptance (REQ-004-110) and the replacement draft cascade (REQ-004-111); replacement quote has no expiry and stays a draft until accepted; archive releases and restore re-checks the promotion; restore targets for archived drafts and sent quotes; 7-day draft archive counted from the last edit; identity rule cites the platform rule; restore notice cites its catalogue entry; flows and steps for withdrawal, replacement quote, admin restore, draft soft-delete and expiring-soon; edges to retired steps removed. Business defaults per owner review entries 56 to 58."
by: docs-manager
operations:
  - {"op": "update_node", "id": "REQ-004-003", "attrs": {"statement": "System MUST cancel every other parent quote for the same inquiry as `cancelled_other_accepted` upon one subquote acceptance. Each sent parent quote MUST produce one not-selected notice per parent quote; unsent drafts MUST be cancelled silently without notice. The not-selected notice is the FR-030 `quote.accepted` event with `outcome` = `competing_parent_cancelled_other_subquote_accepted` (REQ-030-038)."}}
  - {"op": "update_node", "id": "REQ-004-004", "attrs": {"statement": "System MUST support provider withdrawal after acceptance, only while the booking is `Confirmed`, before check-in, and without a provider-fault marker, by moving the parent quote to `withdrawn`, keeping the AcceptanceEvent and snapshot unchanged, and handing the case to the FR-006 provider-fault transfer, with full audit and the mandatory `quote.withdrawn` notice."}}
  - {"op": "update_node", "id": "REQ-004-005", "attrs": {"statement": "Admin MUST be able to inline edit policy-bound fields of `draft` and `sent` quotes with required reason and re-notifications. After a subquote is accepted, an admin MUST still be able to change any quote field except price, currency, and promotion (the date range and treatment details can be changed), with a mandatory reason and full before and after history; the change MUST be stored as a new version beside the acceptance snapshot, which stays unchanged, and payment records MUST NOT change. While the booking carries a provider-fault marker, this admin edit right is suspended (REQ-004-109)."}}
  - {"op": "update_node", "id": "REQ-004-037", "attrs": {"statement": "After a subquote is accepted, System MUST block every FR-004 quote edit by providers; their treatment-detail changes (plan, clinicians, grafts) MUST go through FR-010. Admin edits after acceptance follow REQ-004-005 and are blocked while the booking carries a provider-fault marker (REQ-004-109). Price, currency, and promotion MUST never change after acceptance. An accepted parent quote MUST never be reopened, expired, or restored to an acceptable state, including after `Payment Window Expired`, and no new parent quote MAY be created or sent for an inquiry with an active acceptance (REQ-004-110), except the admin-authored replacement quote of REQ-004-048."}}
  - {"op": "update_node", "id": "REQ-004-039", "attrs": {"statement": "System MUST emit `quote.expiring_soon` once per sent parent quote when it reaches the FR-026 quote-expiring-soon lead time, and MUST NOT emit it for draft, accepted, or terminal quotes, including the replacement quote, which has no expiry."}}
  - {"op": "update_node", "id": "REQ-004-042", "attrs": {"statement": "A sent quote carrying an automatic FR-019 promotion MUST hold exactly one reserved use of that promotion's usage limit. A re-send of a new version MUST keep the existing reservation, create one only if the new version newly qualifies, and release it if the new version no longer carries the promotion. The reservation MUST be released when the quote expires, is withdrawn, is archived, or ends not selected or cancelled, MUST be released with reason `not_applied` when the accepted row does not carry the promotion, and MUST be consumed at acceptance when the accepted row carries it, so the usage limit is never exceeded. When an admin restores an expired quote, System MUST re-check the promotion's validity and usage limit and take a new reservation; if the limit is used up or the promotion has ended, the restore MUST be blocked with a message and the provider MAY send a new quote (REQ-004-105). If the booking later ends in `Payment Window Expired` or is cancelled before the first payment, FR-005 and FR-019 own the return of the consumed use to the limit."}}
  - {"op": "update_node", "id": "REQ-004-048", "attrs": {"statement": "During an FR-006 provider-fault transfer before treatment starts, System MUST let an admin author a replacement quote for the replacement provider inside the same inquiry through Screen 8, with a mandatory reason and full audit. The quote MUST be marked admin-authored for a replacement and linked to the AcceptanceEvent it replaces, MUST NOT be offered for patient comparison, MUST stay a `draft` that the patient's quote list does not show while it is not accepted, MUST NOT emit `quote.submitted` or `quote.expired`, and MUST be the target of the FR-005 admin-authored replacement acceptance."}}
  - {"op": "update_node", "id": "REQ-004-050", "title": "Replacement quote pricing, no expiry and ending the case", "attrs": {"statement": "System MUST NOT attach an automatic FR-019 promotion to an admin-authored replacement quote or take a promotion usage reservation for it; the admin sets the replacement price directly. A replacement quote MUST have no expiry and MUST NOT emit `quote.expiring_soon`; it stays a `draft` until the admin records the replacement acceptance, and a replacement draft that is never accepted follows the 7-day draft rule. It MUST leave the inquiry flagged `supportRequired` without cancelling it automatically, and the admin MAY author another replacement quote, close the inquiry with Close inquiry on FR-006 Screen 6 when the booking is already `Cancelled` with the marker, or cancel through FR-006 Alternative Flow B2 (Screen 9) when the fault is still pending."}}
  - {"op": "update_node", "id": "REQ-004-070", "title": "Provider withdraws a sent quote before acceptance", "attrs": {"statement": "A provider MAY withdraw a `sent` quote before acceptance from Screen 3, with an optional reason; the quote moves to `withdrawn`, its promotion reservation is released, and the patient receives `quote.withdrawn`. A provider soft-deletes drafts only (REQ-004-076)."}}
  - {"op": "update_node", "id": "REQ-004-071", "attrs": {"statement": "An accepted parent quote stays `accepted` and is never reopened for acceptance or moved to `expired`, including after FR-006 moves the booking to `Payment Window Expired`; its status changes only through provider withdrawal (Workflow 6), which is allowed only while the booking is `Confirmed`, before check-in, and without a provider-fault marker (REQ-004-079). An admin booking cancellation in FR-006 moves the booking and inquiry to `Cancelled` but leaves the accepted parent quote `accepted`. Competing parent quotes stay cancelled."}}
  - {"op": "update_node", "id": "REQ-004-076", "title": "Provider soft-deletes drafts only", "attrs": {"statement": "A provider MAY soft-delete a draft quote only (removes it from the provider listing, not from the audit/archive); the system sets status = Archived with rationale. A sent quote cannot be soft-deleted by the provider: it leaves the offered state only by withdrawal before acceptance (REQ-004-070), by expiry, or through the patient's choice. Quotes in any status other than draft (sent, accepted, expired, withdrawn, cancelled_other_accepted, cancelled_inquiry_cancelled, cancelled_provider_status) cannot be soft-deleted by the provider."}}
  - {"op": "update_node", "id": "REQ-004-077", "attrs": {"statement": "Soft-deletes are fully auditable and revertible only by admin. Admin can perform soft delete or restore and view the immutable audit trail and full quote history; soft delete and restore are unavailable for a quote in `accepted` status, which is never deleted or restored. Only admin can restore expired/archived quotes if justified (GDPR-compliant log); a restore is blocked while the inquiry has an active acceptance (REQ-004-110) and while the booking carries a provider-fault marker (REQ-004-109). An archived draft is restored to `draft` with the 7-day count restarted. An archived sent quote (admin archive only) is restored to `sent` when its original expiry has not passed, with no renewal, and to `expired` otherwise; an expired quote is then restored under REQ-004-105."}}
  - {"op": "update_node", "id": "REQ-004-079", "title": "Withdrawal after acceptance needs a reason, a Confirmed booking and edits nothing", "attrs": {"statement": "A provider submits a withdrawal after acceptance with a mandatory reason, and only while the booking is `Confirmed`, before check-in, and carries no provider-fault marker; in every other booking state the action is hidden and the provider is pointed to contact support. The parent quote moves from `accepted` to `withdrawn`. This is the only status change FR-004 makes after acceptance; no quote field, option, or option/date-price record is edited."}}
  - {"op": "update_node", "id": "REQ-004-080", "attrs": {"statement": "The provider-fault transfer with a replacement quote and a new acceptance applies only before treatment starts (booking `Accepted`, `Confirmed`, or `Cancelled` with the support-required marker); provider drop-out after acceptance, including an FR-010 reassignment, is not a quote withdrawal. If the fault happens in Aftercare, no replacement quote, new acceptance, or new payment is created. Screen 8 is unavailable for a booking in `In Progress` or later stages and once a replacement acceptance has been recorded for this transfer."}}
  - {"op": "update_node", "id": "REQ-004-081", "attrs": {"statement": "Before the admin authors a replacement quote, the system checks that the booking carries a provider-fault marker (pending, or closed with `ProviderFault`, `ProviderSuspended`, or `ProviderDeactivated`) and is `Accepted`, `Confirmed`, or `Cancelled` with that marker, that no replacement acceptance has been recorded for this transfer, that treatment had not started, and that the replacement provider is `Active` and is not the provider at fault."}}
  - {"op": "update_node", "id": "REQ-004-082", "title": "Replacement quote has no expiry and captures currency when accepted", "attrs": {"statement": "A replacement quote MUST have no expiry. When the admin records the replacement acceptance, the quote moves to `sent` and `accepted`, its first-send time is recorded, and its currency is captured from the active FR-026 quote configuration."}}
  - {"op": "update_node", "id": "REQ-004-094", "title": "Abandoned drafts auto-archived 7 days after the last edit", "attrs": {"statement": "System retains an abandoned draft for 7 days after its last edit, then auto-archives it. The 7 days are a fixed platform rule with no admin setting, and the rule applies to a replacement draft too."}}
  - {"op": "update_node", "id": "REQ-004-105", "attrs": {"statement": "Only an admin, with a mandatory reason, MAY restore an expired quote, and not when the inquiry has an active acceptance (REQ-004-110). Before restoring, System MUST re-check the validity and usage limit of the promotion on the quote's rows and take a new reservation; if the limit is used up or the promotion has ended, the restore MUST be blocked with a message and the provider MAY send a new quote. The same re-check applies when an archived sent quote is restored to `sent`. The restored quote MUST return to `sent` with a fresh full window: its new expiry is the restore time plus the FR-026 quote expiry window in force at that time. This is the only case in which a quote's expiry is renewed."}}
  - {"op": "update_node", "id": "REQ-004-106", "attrs": {"statement": "When an admin restores an expired quote, System MUST notify both the patient and the provider through `quote.restored`; FR-004 is the only producer. Drafted default channels are Email and Push; recipients, content, and whether the notice can be switched off are set in the FR-030 catalogue (REQ-030-218)."}}
