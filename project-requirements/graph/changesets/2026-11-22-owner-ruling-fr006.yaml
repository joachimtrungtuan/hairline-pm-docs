reason: "Owner ruling 2026-11-22 (FR-006): a provider-status cancellation (B4) takes the same patient payment terms as a provider withdrawal or drop-out (B5), and an in-treatment provider fault (B7) takes an admin-set patient refund with the provider payout held until the admin decides."
by: controller
operations:
  - {"op": "update_node", "id": "REQ-006-015", "attrs": {"statement": "When a provider's suspension or deactivation becomes effective, System MUST cancel that provider's `Accepted` and `Confirmed` bookings with cause `ProviderSuspended` or `ProviderDeactivated` and an independent `supportRequired` marker, release holds/reservations/slots, block further payment, revalidate provider eligibility at booking-confirming payment, treat any racing capture as paid money refunded in full under the B4 payment terms (see Provider-Status Cancellation), retain the accepted snapshot and booking/payment history, write the supersession record only at the replacement acceptance, and let an admin rehome the patient to a replacement provider in the same inquiry through Alternative Flow B5, without restoration on reactivation (Alternative Flow B4; FR-015 A5/Screen 4). `In Progress` and `Aftercare` bookings MUST keep their status and receive the cause and `supportRequired` (Alternative Flows B7 and B6)."}}
  - {"op": "update_node", "id": "REQ-006-019", "attrs": {"statement": "When a provider fault occurs while the booking is `In Progress`, System MUST keep the booking `In Progress`, MUST NOT cancel it automatically or create a replacement quote or acceptance, and MUST flag it `supportRequired` with the cause. Only an admin MAY resolve it on Screen 11 (Alternative Flow B7), with a mandatory reason, confirmation, and audit entry, by either moving the booking to `Aftercare` and reassigning the aftercare provider or team through FR-011 Screen 19, or cancelling the booking through Screen 9. The admin MUST also set the patient refund amount, from zero up to the full amount paid, under the same mandatory reason and audit entry, and System MUST hold the provider's payout for that booking until the admin decides."}}
  - {"op": "update_node", "id": "REQ-006-053", "title": "A full refund for provider withdrawal, drop-out, suspension or deactivation before treatment starts; an in-treatment fault takes an admin-set refund; other cancellations follow the FR-029 refund ladder", "attrs": {"statement": "A full refund applies when the provider withdraws, drops out, or is suspended or deactivated before treatment starts; an in-treatment provider fault takes an admin-set refund; every other cancellation follows the refund ladder set in FR-029. When the provider withdraws or drops out after acceptance and before treatment starts (Alternative Flow B5), or the booking is cancelled by a provider suspension or deactivation (Alternative Flow B4), the patient is refunded everything paid, pays no cancellation fee, and a replacement booking takes a new payment. While `In Progress` the case follows Alternative Flow B7: the admin sets the patient refund amount from zero up to the full amount paid, with a mandatory reason and an audit entry, and the provider's payout for the booking is held until the admin decides."}}
  - {"op": "update_node", "id": "REQ-006-054", "title": "Provider-status cancellation money follows the B5 withdrawal terms", "attrs": {"statement": "Bookings cancelled by an effective provider suspension/deactivation (Alternative Flow B4) are rehomed by admin to a replacement provider in the same inquiry through the Alternative Flow B5 transfer. The payment terms are the same as for a provider withdrawal or drop-out (Alternative Flow B5): the patient is refunded everything paid, pays no cancellation fee, and the replacement booking takes a new payment; exact mechanics are defined in FR-007, FR-007B, and FR-017. Provider eligibility is revalidated at booking-confirming payment (FR-015 Rule 9). A payment captured while suspension/deactivation becomes effective is recorded and treated as paid money, refunded in full under these B4 terms; it never confirms or revives the booking.", "rationale": "Restated by Alternative Flows B4 step 4, B5 Payment terms and B7 Payment terms."}}
