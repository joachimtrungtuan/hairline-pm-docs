# Operations ordered so new nodes and fields come first, then edge removals, then updates, retirements and enum values, then new edges. Neighbour needs (FR-001, FR-003, FR-026, FR-029, FR-031) are queued in the ledger, not in this file.
reason: 'FR-028 logic review pass 2 (final pass): Inactive switch obeys the Stripe block; a price chain step that cannot show a price passes to the next step; price rows may not overlap and the fallback tie-break is stated; deactivated countries keep applying in groupings and starting prices and can still be saved; Screen 2 banners shown when the tab opens; read-only Change history panels on Screens 1 and 2; Screen 3 simulates saved configuration only; destination default currency and system-wide default price get a stored home (new ENT-pricing-default) and audit entity types; every active country is a destination; deactivated-country warning replaces the provider-location warning; patient currency is the profile preference, else the FR-029 system default; admin-side rules move to the configuration stage. Owner defaults 153, 154, 155, 156.'
by: docs-manager
