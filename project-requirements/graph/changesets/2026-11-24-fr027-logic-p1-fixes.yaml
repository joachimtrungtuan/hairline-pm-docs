# Operations ordered so nodes, fields and enum values are created before the edges that use them; removals and retirements come after the additions.
reason: 'FR-027 logic review pass 1: Legal settings panel and unset behaviour (owner default 77); shared acceptance prompt screen; publish and audit run at the Publish click on both branches and prompts start when the version is Current; Scheduled status added, view-only and withdrawable (default 78); one version model with locale texts as children; one general consent (default 79); Cancellation Policy Material Change fixed to No; acceptance base and first-run acceptance (defaults 80, 81); acceptance once per version (default 82); each provider team member accepts (default 83); gated actions named (default 84); daily reminder and coverage job (default 85); Cancellation Policy shown through the FR-006 policy link (default 86); restore reuses the main publish steps and is always material; audit actions replaced; effective date as UTC date and time with a re-check at Publish; first-version diff summary; fallback fixed to English; Locale gap badge; stage edges cleaned.'
by: docs-manager
operations:
# ---- New nodes -------------------------------------------------------------
- op: add_node
  id: REQ-027-058
  type: Rule
  owner_fr: FR-027
  title: Acceptance prompt screen shared by the patient app and the provider portal
  attrs:
    statement: 'The acceptance prompt MUST list each document that needs acceptance with its version and effective date, MUST enable Accept for a document only after its full text has been opened, MUST give one Accept per document, MUST show the fallback-language notice when REQ-027-036 applies, and MUST show a blocked state until every listed document is accepted and an accepted state afterwards.'
    rationale: The user-facing half of the flow had no screen, so the acceptance steps could not be built or tested. One spec serves the patient app and the provider portal (REQ-027-012, REQ-027-015).
- op: add_node
  id: REQ-027-059
  type: Rule
  owner_fr: FR-027
  title: Admin edits the four legal settings in a panel on Screen 1; behaviour while a value is unset
  attrs:
    statement: 'Admin MUST edit the acceptance rules, the coverage threshold (percent), the reminder limit (reminders per user per version) and the export limit (exports per Admin per day) in a Legal settings panel on Screen 1; each change is audited. While a value is unset there is no banner or alert (threshold), no reminders (reminder limit) and CSV export is blocked (export limit); while the acceptance rules are unset, a version with Material Change = Yes gates all patients and all provider team members.'
    rationale: Owner default 77. The four values had no screen and no behaviour while unset, so the gating rule, the banner, the alert, the reminders and the export could not be built. Unset values switch the optional features off, and the acceptance rules fall back to the strictest reading so a material change is never silently ungated.
- op: add_node
  id: REQ-027-060
  type: Rule
  owner_fr: FR-027
  title: A Scheduled version is view-only, one per document type, and can be withdrawn to Draft
  attrs:
    statement: 'A Scheduled version is view-only. There MUST be at most one Scheduled version per document type; a second Publish for the type is rejected until the Scheduled version is withdrawn or has gone live. Admin MAY withdraw a Scheduled version back to Draft; the withdrawal is audited.'
    rationale: Owner default 78. Scheduled could be entered but not left except by going live, so a wrong text could only wait to be published and then be restored. Withdrawal returns it to Draft before any user sees it.
- op: add_node
  id: REQ-027-061
  type: Rule
  owner_fr: FR-027
  title: Version-level attributes belong to the version; locale texts are children of it
  attrs:
    statement: 'Version label, status, effective date, Material Change and change summary belong to the version, and each locale text is a child of the version. Version uniqueness and the one-Current rule apply per document type and version, never per locale.'
    rationale: Screens 1 and 2 give each row a locale and a version, so uniqueness and the one-Current rule were undetermined when two locales share a version. The graph entity fields are not restructured; this rule states the model.
- op: add_node
  id: REQ-027-062
  type: Rule
  owner_fr: FR-027
  title: First-run acceptance at registration and at invitation acceptance
  attrs:
    statement: 'A new patient at registration and a new provider team member at invitation acceptance MUST accept the Current Terms & Conditions and the Current Privacy Policy; the general consent is asked at the first sign-in. A Scheduled version is never shown or recorded before its effective date.'
    rationale: Owner default 81. The first-run entry points had no step and FR-001 records only the Terms checkbox. Accounts created after an effective date accept at first run and are not counted as pending (REQ-027-053).
- op: add_node
  id: REQ-027-063
  type: Rule
  owner_fr: FR-027
  title: Daily job sends reminders and checks coverage
  attrs:
    statement: 'A daily system job MUST send each pending user one reminder at most every 7 days, up to the reminder limit, and MUST evaluate the Acceptance Rate of the Current version of each document type daily from 14 days after it became Current, raising the coverage alert once per version while the rate is below the threshold. reminders_sent_count is the count of the version''s legal reminder records.'
    rationale: Owner default 85. Reminders and the coverage alert had no trigger, cadence or producer, and at publication the rate is 0 percent so the alert would have fired at once. The 14-day wait removes that.
- op: add_node
  id: SCR-027-06
  type: Screen
  owner_fr: FR-027
  title: 'Patient and provider: Acceptance prompt'
  attrs:
    platform: patient and provider
    description: 'Shared by the patient app and the provider portal (REQ-027-058). Lists each document that needs acceptance with version and effective date; Accept per document is enabled after the full text is opened; shows the fallback-language notice (REQ-027-036) and the blocked and accepted states. UI controls, not fields: the Accept buttons.'
- op: add_node
  id: STP-027-011
  type: Step
  owner_fr: FR-027
  title: System asks a new patient at registration, or a new provider team member at invitation acceptance, to accept the Current Terms and Privacy Policy
  attrs:
    prd_ref: Main Flow User Accepts New Version, first-run step
    handoff_from: 'FR-001: STP-001-003, patient creates the account'
- op: add_node
  id: STP-027-012
  type: Step
  owner_fr: FR-027
  title: System sends reminders to pending users and checks the coverage of each Current version daily
  attrs:
    prd_ref: Main Flow User Accepts New Version, reminder job step
