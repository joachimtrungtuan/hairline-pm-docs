- op: update_node
  id: SET-legal-acceptance-rules
  attrs:
    description: 'Admin-configurable acceptance rules: who must accept, and when enforcement applies. Edited in the Legal settings panel on Screen 1 (REQ-027-059). Unset: a version with Material Change = Yes gates all patients and all provider team members. FR-027 owns this setting (CL-5).'
- op: update_node
  id: SET-legal-coverage-threshold
  attrs:
    description: 'Acceptance Rate of the Current version below which the Admin is notified and the document list shows a warning banner. Edited in the Legal settings panel on Screen 1 (REQ-027-059). Unset: no banner and no alert. FR-027 owns this setting (CL-5).'
    default: Unset means no banner and no alert
- op: update_node
  id: SET-legal-reminder-limit
  attrs:
    description: 'Maximum reminders per user per version. Edited in the Legal settings panel on Screen 1 (REQ-027-059). Unset: no reminders are sent (CL-5).'
    unit: reminders per user per version
    default: Unset means no reminders
- op: update_node
  id: SET-legal-export-limit
  attrs:
    description: 'Maximum CSV exports per Admin per day from the acceptance dashboard and detail list. Edited in the Legal settings panel on Screen 1 (REQ-027-059). Unset: CSV export is blocked (CL-5).'
    unit: exports per Admin per day
    default: Unset means export is blocked
- op: update_node
  id: EVT-legal-acceptance-reminder
  attrs:
    description: 'Reminder sent by the daily job (REQ-027-063) to a patient or provider team member with pending required acceptance, at most every 7 days and up to the reminder limit. Recorded at the Admin configuration stage, where the job runs.'
- op: update_node
  id: EVT-legal-coverage-below-threshold
  attrs:
    description: 'The Acceptance Rate of a Current version is below the Admin-set threshold: the Admin is notified once per version, evaluated daily from 14 days after the version became Current (REQ-027-063).'
- op: update_node
  id: SCR-027-01
  attrs:
    description: 'PRD Screen 1. Lists all legal document types and versions with entry points to draft, edit, preview and publish. UI controls, not fields: Actions buttons (Draft new version, Edit draft, Create draft from this version on Current and Archived rows, View history that filters the list to the document type, Preview, Publish, Withdraw on a Scheduled row), filters by Document Type, Status and Locale (criteria owned by FR-022, REQ-022-110), the Legal settings panel (REQ-027-059), the read-only Audit trail list filtered to one document (REQ-027-013) and the Locale gap badge on a version row (REQ-027-037). Behaviour in REQ-027-049, REQ-027-050 and REQ-027-060. Shows the warning banner (REQ-027-024).'
- op: update_node
  id: REQ-027-008
  attrs:
    statement: 'Legal document entities MUST include: type, locale (for translation only, no regional content variants), version, status (draft/scheduled/current/archived), effective date, change summary'
    rationale: Data Requirements. Scheduled is a stored status because the publish flow depends on it (REQ-027-030, REQ-027-060).
- op: update_node
  id: REQ-027-011
  attrs:
    statement: 'Only authorized Admin roles can use the FR-027 Admin screens and exports: A-09 Edit Settings to create, edit, publish, withdraw and change the legal settings and to export CSV; A-09 View Settings to view the lists, acceptance status and audit trail. Publication actions require explicit confirmation.'
    rationale: Security and Privacy Requirements. Screens 4 and 4A list user names and emails and export them, so they need a stated permission. The FR-031 permission matrix row is a neighbour change.
- op: update_node
  id: REQ-027-012
  attrs:
    statement: 'Users MUST have clear access to read the full content prior to acceptance; acceptance records, legal audit entries and reminders are retained to demonstrate consent under the FR-023 retention rules (10-year floor, anonymised in place at approved deletion; anonymised rows are not counted in coverage).'
    rationale: Security and Privacy Requirements. The retention period and the treatment at account deletion follow FR-023, whose record-type mapping row is a neighbour change.
- op: update_node
  id: REQ-027-013
  attrs:
    statement: 'Audit trail MUST be immutable and reviewable by authorized Admins as a read-only Audit trail list on Screen 1, filtered to one document; the Screen 4 audit link opens that list.'
    rationale: Security and Privacy Requirements. The trail had no view. The audit actions are create, edit, publish, schedule, activate, archive, withdraw and settings_change.
- op: update_node
  id: REQ-027-017
  attrs:
    statement: 'Patient can view the latest Terms & Conditions, Privacy Policy, Cancellation Policy and the general Consent text.'
    rationale: Patient Platform breakdown. The Consent type is one general platform consent (owner default 79); the photo storage, third-party sharing and other consents stay in FR-010, FR-016 and FR-038.
- op: update_node
  id: REQ-027-019
  attrs:
    statement: 'Every provider team member views and accepts the latest legal content personally; the ledger is per user, and invitation acceptance writes the member''s first ledger rows (REQ-027-062).'
    rationale: Owner default 83. The PRD said provider users, the step said the account holder accepts for the clinic, and FR-009 has each invited member accept; one model avoids a clinic where only one person is blocked.
- op: update_node
  id: REQ-027-021
  attrs:
    statement: 'Admin configures acceptance rules (who must accept and when enforcement applies) in the Legal settings panel on Screen 1 (REQ-027-059).'
    rationale: Admin Platform breakdown. The screen and the unset behaviour are in REQ-027-059.
- op: update_node
  id: REQ-027-023
  title: Admin notified when the Acceptance Rate is below the threshold
  attrs:
    statement: 'System notifies the Admin when the Acceptance Rate of a Current version is below the Admin-set threshold.'
    rationale: Communication scope. Coverage is the accepted share, so the alert fires when it is low. The evaluation time is in REQ-027-063.
- op: update_node
  id: REQ-027-024
  title: Warning banner on the document list when the Acceptance Rate is below the Admin-set threshold
  attrs:
    statement: 'Screen 1 (Admin Legal Documents List, SCR-027-01) shows a warning banner when the Acceptance Rate of the Current version is below the Admin-set threshold.'
    rationale: Screen 1 notes. The threshold is set in the Legal settings panel; unset means no banner (REQ-027-059).
- op: update_node
  id: REQ-027-025
  title: 'Out of scope: real-time chat, legal counsel workflows, external e-signature, Admin Terms of Service'
  attrs:
    statement: 'Out of scope: real-time chat or legal counsel workflows; external e-signature platforms (future consideration); Admin Terms of Service acceptance (FR-031).'
    rationale: Admin Terms of Service acceptance at account creation is owned by FR-031 and is not tracked in the FR-027 ledger.
- op: update_node
  id: REQ-027-026
  attrs:
    statement: 'Cancellation Policy is a read-only informational document that does NOT require user acceptance. It uses the same versioning and publishing pipeline, but Material Change is fixed to No and not editable and Requires Acceptance is always No. It is shown through the full policy link on the FR-006 booking and payment screens; the refund ladder numbers come from FR-029 and the legal text MUST NOT restate them.'
    rationale: Owner default 86. FR-005 does not carry cancellation terms, FR-006 shows the policy before payment, and the percentages must have one source.
- op: update_node
  id: REQ-027-027
  attrs:
    statement: 'Requires Acceptance indicates whether material change gating applies and is tied to the Material flag from the draft; for the Cancellation Policy it is always No.'
- op: update_node
  id: REQ-027-030
  attrs:
    statement: 'When Admin publishes with a future effective date, System marks the new version Scheduled and the previous version stays Current; on the effective date the new version becomes Current, the previous version is archived, and prompts begin when Material Change = Yes and Requires Acceptance = Yes. Prompts start only when the version is Current.'
    rationale: Alternative Flow A1. Publish and the audit entry run at the Publish click on both branches; the main flow no longer prompts for a version that is not yet Current.
- op: update_node
  id: REQ-027-031
  attrs:
    statement: 'There is no revert button. To go back to an earlier text, Admin creates a new draft from the old version (Create draft from this version on a Current or Archived row of Screen 1) and publishes it as a new version through the normal publishing flow with Material Change fixed to Yes (No for the Cancellation Policy); one publish audit entry is recorded.'
    rationale: Alternative Flow B1. The restore reuses the main edit, preview and publish steps; the audit and prompt steps are those of the normal flow.
- op: update_node
  id: REQ-027-032
  attrs:
    statement: 'When an earlier text is restored it is published as a new version; existing acceptance records are preserved, and every user whose latest accepted version of that type is not the version the text was restored from is asked to accept it.'
    rationale: Edge Cases. A restored version is always material, so one rule decides who is prompted; a user who already holds the original version is not asked again.
- op: update_node
  id: REQ-027-033
  attrs:
    statement: 'Until acceptance, a patient cannot submit an inquiry, accept a quote or start a payment, and a provider cannot accept an inquiry or submit a quote; everything else stays available, including aftercare, messaging, scheduled installments and viewing. A user who does not accept stays in this limited state and may sign out or use the FR-001 account-deletion route. Gating occurs at sign-in and at those actions.'
    rationale: Owner default 84. CL-1 named no enforcer and no list of core actions; the neighbour checks in FR-003, FR-004, FR-005 and FR-007 are neighbour changes.
- op: update_node
  id: REQ-027-034
  attrs:
    statement: 'Users with pending procedures keep access to aftercare, messaging, scheduled installments and viewing until acceptance; prompts are shown at sign-in and at the blocked actions in REQ-027-033.'
- op: update_node
  id: REQ-027-035
  attrs:
    statement: 'After the user accepts, System resumes normal access without further prompts until the next required version; acceptance is once per version, so FR-003 asks again at an inquiry only when the Current Terms & Conditions are not accepted.'
    rationale: Owner default 82. Main Flow step 4 of User Accepts New Version and User Story 2 scenario 2. The FR-003 checkbox change is a neighbour change.
- op: update_node
  id: REQ-027-036
  attrs:
    statement: 'If a localized version is unavailable, fall back to the platform default language (English) and display a discreet notice. When a version is published globally, the system validates that at least the English (en-US) locale content is complete; if other locales are configured, the Admin UI summarises their completeness and publishing proceeds with the platform default language (English, en-US) version as the single fallback where a locale is missing or incomplete (as per CL-3). Legal-content fallback is fixed to English (en-US) and does not follow the FR-021 fallback order, because publication needs a complete English text.'
- op: update_node
  id: REQ-027-037
  attrs:
    statement: 'When a user is served the fallback text, Screen 1 shows a Locale gap badge on that version''s row; it clears when that locale''s text is published.'
    rationale: CL-3 and Edge Cases. The task for the Admin is a badge on the existing list, not a new entity or screen.
- op: update_node
  id: REQ-027-040
  attrs:
    statement: 'Version label must be unique per document type; all locale texts of a version share it (REQ-027-061).'
- op: update_node
  id: REQ-027-041
  title: Effective date is a UTC date and time, checked at save and again at Publish
  attrs:
    statement: 'Effective Date is a date and time stored in UTC and shown in the Admin''s time zone; at save it cannot be in the past; it is checked again at Publish, and a time already past at Publish makes the version Current immediately.'
    rationale: Screen 1 and Screen 2 gave different types and no time zone, and a stale draft could be published with a past date.
- op: update_node
  id: REQ-027-049
  attrs:
    statement: 'Edit opens only Draft versions; Scheduled, Current and Archived versions are view-only (preview/history). Create draft from this version is offered on Current and Archived rows; View history filters the list to that document type.'
- op: update_node
  id: REQ-027-050
  attrs:
    statement: 'Publish is disabled unless the draft passes validation, which is repeated at Publish; the preview shows the effective date and Material Change exactly as set in the draft, and the version diff summary must be generated from the draft; for the first version of a document type the summary reads Initial version and does not block Publish.'
- op: update_node
  id: REQ-027-053
  attrs:
    statement: 'Acceptance Rate is the % accepted out of the users who must accept that document: patient accounts in Active state and provider team members of Active providers whose latest accepted version of that type is older than the version in question. Dormant, deletion-requested, deleted, suspended and offboarded accounts are not counted and are prompted at their next sign-in if they return; accounts created after the effective date accept at first run and are not counted as pending. Pending Users are the users in that base who have not accepted. For the Cancellation Policy and any version with Material Change = No, rate and pending are shown as not applicable.'
    rationale: Owner default 80. The ledger holds only acceptances, so the population needed a definition; the same base gives the re-accept count on Screen 3 (REQ-027-052).
