  - {"op": "update_node", "id": "REQ-031-009", "attrs": {"statement": "System MUST NOT allow a Super Admin account to be suspended by another user, or removed, demoted or self-deactivated inside the product (system protection; if ever needed, this is done outside the product). When another admin tries to suspend one, including one Super Admin trying to suspend another, the action is blocked with \"A Super Admin account cannot be suspended. Super Admin accounts can only be changed outside the product.\" and both accounts stay active; when a Super Admin tries to change their own role or deactivate their own account, the action is blocked with \"A Super Admin account cannot be demoted or deactivated in the product. This can only be done outside the product.\" The Admin Users tab shows no Change Role, Suspend or Delete action on a Super Admin row. An invitation for a Super Admin role is not yet an account: it can be cancelled or resent until it is accepted (REQ-031-127)."}}
  - {"op": "update_node", "id": "REQ-031-012", "attrs": {"statement": "System MUST maintain admin user accounts with: email, name, password hash, assigned role, role effective date/time, pending role and its effective date/time, role change acknowledgement time, status (active/invited/suspended/deleted), creation date, last login timestamp"}}
  - {"op": "update_node", "id": "REQ-031-043", "attrs": {"statement": "If the invitation email fails to send, System logs each failed delivery in the audit trail and retries under the notification retry rule owned by FR-030 (this flow sets no retry count or interval of its own). From the first failed delivery the invitation shows \"Pending Send\" and the Super Admin is warned \"Invitation created but the email could not be sent yet. The system retries under the notification rule, and you can resend the invitation yourself. The invitation expires if it is still unsent after 24 hours.\"; if the invitation still cannot be sent 24 hours after it was created, it becomes \"Expired\" and the system alerts the admin team. The Super Admin can resend the invitation."}}
  - {"op": "update_node", "id": "REQ-031-068", "attrs": {"statement": "Provider permissions View and Edit Billing Settings and Edit Settings are Owner only; Document Treatment is limited to Owner or Clinical Staff (not Manager); Remove Team Members is limited to Owner (any non-Owner member) or Manager (Clinical Staff and Billing Staff only); Invite Team Members and Edit Team Member Roles (non-Owner) are limited to Owner or Manager, and a Manager may invite or set only Clinical Staff and Billing Staff and cannot create a Manager."}}
  - {"op": "update_node", "id": "REQ-031-069", "attrs": {"statement": "The admin permission Issue Refunds is a write permission that requires approval by another admin holding the permission, never the requester; FR-007 owns the approval step and its 2-business-day escalation. While only one admin holds the permission, a refund that needs approval stays \"awaiting approval\" until a second holder exists."}}
  - {"op": "update_node", "id": "REQ-031-085", "attrs": {"statement": "A warning banner \"Warning: Only one Super Admin account. Consider adding backup admin. Refunds that need approval are blocked until a second admin holds Issue Refunds.\" is shown on the Admin Users tab while only one Active Super Admin account exists (Invited, Suspended and Deleted accounts do not count). No Super Admin can be demoted, removed or deactivated inside the product (REQ-031-009)."}}
  - {"op": "update_node", "id": "REQ-031-086", "attrs": {"statement": "If two Super Admins change the same user's role at once, database-level locking prevents concurrent updates: the second Super Admin receives \"Role change failed - this user's role was just updated by another admin. Refresh and try again.\" and the audit trail logs both attempts with their outcomes (success, failed)."}}
  - {"op": "update_node", "id": "REQ-031-107", "attrs": {"statement": "Permission category \"Billing & Financial\" (A-05) in the admin permission matrix offers: View Transactions (View patient and provider transactions; Read); Process Payouts (Initiate provider payouts; Write); Issue Refunds (Process patient refunds; Write (requires approval by another admin holding this permission, never the requester; the approval step and its 2-business-day escalation are defined in FR-007; while only one admin holds this permission, a refund that needs approval stays awaiting approval until a second holder exists)); View Financial Reports (Access revenue analytics; Read); View Patient Billing (View patient invoices and payment status; Read); Send Payment Reminders (Send payment reminders to patients; Write); Retry Charge (Retry a failed patient payment charge (FR-007B); Write); Resolve Installments (Record a manual bank transfer for an unpaid installment and approve one entered by a colleague; the approver is never the requester; Write); Download Invoices (Download patient/provider invoices; Read)."}}
  - {"op": "update_node", "id": "REQ-031-118", "attrs": {"statement": "Permission category \"Financial & Billing\" (PR-05) in the provider permission matrix offers: View Financial Dashboard (View revenue and earnings; Read); View Payouts (View payment history and upcoming payouts; Read); View and Edit Billing Settings (View and edit the provider billing settings tab, including bank account details; Write (Owner only; viewing the tab needs the same permission)); View Financial Reports (Access financial analytics; Read)."}}
  - {"op": "update_node", "id": "REQ-031-120", "attrs": {"statement": "Permission category \"Provider Settings\" (PR-06) in the provider permission matrix offers: View Profile (View provider profile information; Read); Edit Profile (Update provider profile details; Write); Manage Treatments (Set a treatment Offered or Not Offered and configure its pricing, including Quick Copy Pricing (FR-024); Write); Manage Packages (Create, edit, clone and deactivate packages and use quick price edit (FR-024); Write); Manage Promotions (Create and edit discount codes; Write); View Settings (View provider settings; Read); Edit Settings (Modify provider settings; Write (Owner only)); Edit Notification Settings (Change the clinic's notification preferences; Write; default holders Owner and Manager)."}}
  - {"op": "update_node", "id": "REQ-031-126", "attrs": {"statement": "System MUST let a Super Admin suspend an Active account (with a required reason), reactivate a Suspended account back to Active, and delete a Suspended non-Super Admin account; suspension ends the user's sessions and emails the user, reactivation returns the account to Active and emails the user, and deletion anonymises the account under REQ-031-022, keeps the audit entries and sets the status to Deleted. A Deleted account is hidden from the Admin Users list unless the Status filter \"Deleted\" is chosen, offers only View Audit, cannot be reactivated and is not counted as a role holder (REQ-031-129) or as a Super Admin (REQ-031-085). An Invited account is removed only with Cancel (REQ-031-127) and has no Change Role action. A Super Admin account can never be suspended, demoted or deleted inside the product."}}
  - {"op": "update_node", "id": "REQ-031-127", "attrs": {"statement": "System MUST list every invitation not yet accepted (Invited, Expired or Pending Send) in a Pending Invitations sub-tab of the Admin Users tab, with Name, Email, Role, Invited by, Expires at and Status; a Super Admin can resend an invitation (REQ-031-042) or cancel it, including an invitation for a Super Admin role until it is accepted, and cancelling removes the Invited account, invalidates the invitation link and writes an audit entry."}}
  - {"op": "update_node", "id": "REQ-031-129", "attrs": {"statement": "System MUST let a Super Admin delete a custom admin role only while no admin user (including an Invited account, but not a Deleted one) and no pending role change holds it, and MUST name a cloned role \"Copy of [role name]\", editable and cut to 50 characters; roles have no active or inactive status."}}
  - {"op": "update_node", "id": "REQ-031-130", "attrs": {"statement": "System MUST, when a provider role permission change fails to reach the Provider Platform, mark the role \"Sync failed\", retry automatically 3 times, send an in-app alert to all Super Admins, and show the role as \"not yet applied\" on the Provider Roles tab until a retry succeeds. After the 3 automatic tries fail the role stays \"Sync failed / not yet applied\"; a Super Admin can press \"Retry sync\" on the Provider Roles tab (saving the matrix again also re-sends it), and every attempt is logged in the audit trail."}}
  - {"op": "update_node", "id": "STP-031-214", "title": "System shows the affected admin an Acknowledge role change banner on the admin dashboard once the change takes effect"}
  - {"op": "update_node", "id": "STP-031-221", "title": "Super Admin clicks Suspend on an Active non-Super Admin user's row"}
  - {"op": "update_node", "id": "STP-031-227", "title": "System anonymises the user's name and email, keeps the audit entries, sets the status Deleted and logs the deletion"}
  - {"op": "update_node", "id": "STP-031-734", "title": "System marks Pending Send from the first failed delivery"}
  - {"op": "update_node", "id": "ENT-admin-user-account.password_hash", "attrs": {"description": "bcrypt hash, set when the invitation is accepted and empty while the account is Invited; the password itself is never stored."}}
  - {"op": "update_node", "id": "ENT-admin-user-account.role_change_acknowledged_at", "attrs": {"description": "When the affected admin clicked Acknowledge role change on the admin dashboard banner; empty until then (Rule 10, REQ-031-124). Shown to Super Admins as Acknowledged, Awaiting acknowledgement or Overdue."}}
  - {"op": "update_node", "id": "ENT-admin-user-account.status", "attrs": {"description": "Active, Invited, Suspended or Deleted. Deleted is the end state of an anonymised account: hidden from the Admin Users list unless the Status filter Deleted is chosen, View Audit only, never reactivated (REQ-031-126)."}}
