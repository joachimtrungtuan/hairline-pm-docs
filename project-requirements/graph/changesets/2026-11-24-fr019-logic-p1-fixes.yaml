  - {"op": "update_node", "id": "REQ-019-014", "attrs": {"statement": "For provider-selected promotions and patient-entered codes, System MUST reserve one promotion use at acceptance, consume it at the first successful payment, release it on `Payment Window Expired` or cancellation, and re-reserve it on an admin revive, rejecting the revive if the usage limit is exhausted. On release or void, System MUST drop the code's In-Progress count and return a single-use code to Unused; a refund after the first payment MUST NOT return the use."}}
  - {"op": "update_node", "id": "REQ-019-015", "attrs": {"statement": "For an auto-applied promotion, System MUST reserve one use when a quote carrying it is sent, MUST hold at most one reserved use per sent quote across re-sent versions (keeping the existing reservation, creating one only when a new version newly carries the promotion, and releasing it when a new version no longer carries the promotion), MUST release the reservation when the quote expires, is withdrawn, is archived (`archived`), ends Not Selected, drops the promotion in a re-sent version, or is cancelled before acceptance because the inquiry was cancelled or the provider's status changed, or when a subquote of that quote is accepted that does not carry the promotion (`not_applied`), and MUST consume it when the accepted subquote carries the promotion. If the booking reaches `Payment Window Expired` or is cancelled before the first payment, System MUST return the consumed use to the limit; on an admin revive, System MUST take the use again if the limit has room and otherwise MUST reject the revive, so the accepted price never changes. Restoring an archived quote MUST re-check the promotion and take a new reservation, and the restore MUST be refused when the limit is used up or the promotion has ended (FR-004 REQ-004-105). Usage limits MUST count active reservations plus consumed uses so that a limit can never be exceeded."}}
  - {"op": "update_node", "id": "REQ-019-019", "attrs": {"statement": "System MUST NOT attach an automatic promotion to an admin-authored replacement quote (FR-004 Workflow 7) or reserve a use for it; the admin sets the replacement price directly, the replacement carries no promotion, the original Application MUST be marked Superseded, and the use it held MUST return to the usage limit."}}
  - {"op": "update_node", "id": "REQ-019-023", "title": "Program lifecycle in scope: five states, with usage limits and date windows", "attrs": {"statement": "Discount code definition and lifecycle (draft, active, paused, expired, archived), with usage limits and date windows; approval of an Admin-via-Provider program is per provider adoption, not a program state.", "rationale": "Scope Boundaries. Matches the Screen 2 lifecycle field; there is no program-level Pending Approval state."}}
  - {"op": "update_node", "id": "REQ-019-027", "title": "Admin publishes a both-fees discount; it is Active and targeted providers are notified", "attrs": {"statement": "Admin defines discount (type, value, Hairline share %, dates, usage limit, targeted providers). Admin publishes the discount; the system sets it Active and notifies targeted providers (approval-requested event of the FR-030 notification catalogue). Approval is per provider: the discount applies only to providers whose adoption is Accepted.", "rationale": "Main Flow steps 1-2. Screen 2 business rules and acceptance criterion 1 repeat the Active outcome and the notification."}}
  - {"op": "update_node", "id": "REQ-019-028", "attrs": {"statement": "Providers accept or decline; system logs responses. A provider who does not answer within the auto-decline window is Auto-Declined. If every provider declines, the program stays Active with no participants until an admin archives it."}}
  - {"op": "update_node", "id": "REQ-019-033", "attrs": {"statement": "Trigger: A patient enters an invalid, expired or limit-reached code, or a provider picks from the list a promotion that no longer qualifies for the row (a provider types no code: FR-004 Screen 1 offers a select-or-create Promotion field). Steps: System returns reason; prevents application. Outcome: No discount applied; user can retry. On the patient screen (Screen 11), the patient gets clear feedback for an invalid, expired, limit-reached or segment-mismatched code."}}
  - {"op": "update_node", "id": "REQ-019-034", "attrs": {"statement": "Trigger: Before the quote is sent, the provider picks a second promotion for an option/date-price row that already has one; or before the subquote is accepted, the patient enters a code on a subquote (option/date-price row) that already carries a promotion. Steps: System blocks the new entry; prompts the user to confirm replacement or keep the existing discount. A patient's replacement applies only to the patient's selection on that subquote and never changes the provider's promotion. A patient code replaces the promotion the row carries, including an automatic one (Alternative Flow A5 states the reservation outcome). Outcome: Exactly one discount per subquote; the user's confirmed choice is applied. After acceptance no entry, selection, or replacement is accepted (Alternative Flow B4)."}}
  - {"op": "update_node", "id": "REQ-019-035", "attrs": {"statement": "Trigger: When a quote is sent, more than one automatic promotion is eligible for the quote, or an automatic promotion is eligible for an option/date-price row that already carries another discount. Steps: A quote carries at most one automatic promotion. System silently resolves the conflict using the priority order: patient-entered code > provider discount (provider-selected or provider auto-applied) > Hairline-funded discount > affiliate discount. The usage limit is checked before ranking: an automatic program whose limit is fully reserved or consumed is skipped, and the next-ranked qualifying program may attach. When several automatic programs qualify, only the highest-ranked remaining one attaches, to every row it is eligible for; the others attach to no row of that quote and reserve no use. On a row that already carries a higher-ranked discount, the automatic promotion is not applied to that row; a provider-selected promotion wins over a provider auto-applied one on the same row. No user prompt is shown. Example: A Hairline-funded automatic program and a provider's automatic program are both eligible when a quote is sent. The provider's program ranks higher, so it attaches to every row it is eligible for and one use is reserved for it; the Hairline-funded program attaches to no row of that quote and no use is reserved for it."}}
  - {"op": "update_node", "id": "REQ-019-038", "attrs": {"statement": "Trigger: A provider sends a quote while an auto-applied program is active and eligible for one or more of its option/date-price rows. Steps: A quote carries at most one automatic promotion; when several qualify, Alternative Flow B3 picks one. System attaches that program to every eligible option/date-price row of the sent quote and copies its terms into the sent quote version. The provider's entered price on each row stays unchanged, and the discount is shown as a separate line next to it. Rows that are not eligible receive no automatic promotion. Conflicts with another discount on the same row are resolved by Alternative Flow B3. Sending a quote carrying the automatic promotion reserves one use against the program's usage limits. A sent quote holds at most one reserved use: re-sending a new version keeps the existing reservation, creates one only if the new version newly carries the promotion, and releases it if the new version no longer carries the promotion. An admin edit that creates a new version of a sent quote (FR-004) counts as a re-send for these rules. If the limit is already fully reserved or consumed, that program is skipped and Alternative Flow B3 picks the next-ranked qualifying program, if any; a promotion never attaches past a full limit."}}
  - {"op": "update_node", "id": "REQ-019-039", "attrs": {"statement": "Trigger: While reviewing one named subquote and before confirming acceptance, the patient enters a code (FR-005 Alternative Flow A8). Steps: System validates the code for that subquote only (active window, eligibility, usage limits, recipient binding). If valid, the discounted price is shown next to the provider's offered price; if invalid, the reason is shown and the price stays what the row carried at send, including its attached promotion. The code is held with the open subquote view and stored only on the AcceptanceEvent at acceptance; it is never written to the provider's promotion or quote records. Opening another subquote does not carry the code over. Outcome: On acceptance, the discounted price and the applied promotion are frozen into the AcceptanceEvent snapshot."}}
  - {"op": "update_node", "id": "REQ-019-040", "attrs": {"statement": "Trigger: The patient accepts a subquote that carries a promotion attached at send or a valid patient-entered code. Steps: In the same atomic step as the acceptance, the system creates one Application linked to the AcceptanceEvent, the parent quote and version, and the accepted option/date-price row, and reserves one use against the program's usage limits. For an automatic promotion attached at send, the use already reserved at send is consumed instead. If the accepted subquote does not carry the automatic promotion that reserved a use for its parent quote, that reservation is released with reason `not_applied` and the use returns to the limit. Sibling subquotes marked Not Selected and competing quotes never create an Application; any use reserved for them at send is released. A patient code replaces the promotion the row carried: when the replaced promotion is the automatic one, its reservation is released with reason `not_applied` and the code's use is reserved instead. If the usage limit of a provider-selected promotion is used up when the patient confirms, it is handled like an invalid code (FR-005 REQ-005-026): the acceptance does not happen, the reason is shown, and the patient returns to the subquote detail, which shows the row without that promotion. Pausing, revoking or ending the program after send does not affect a sent quote (General Module Rules); only the usage limit can refuse it at acceptance. A patient code entered on a subquote that was not accepted is discarded. Outcome: The Application is in state Applied with its use reserved, or consumed for an automatic promotion; the discounted price is read from the acceptance snapshot by every later step."}}
  - {"op": "update_node", "id": "REQ-019-049", "attrs": {"statement": "Lifecycle State: Draft → Active → Paused → Expired → Archived; Forward transitions only, except Pause and Resume; only the side that paused (admin or provider) may resume, and who paused is recorded.", "rationale": "Screen 2 common data fields. Pause and Resume on Screens 1 and 8 are the allowed exception; there is no program-level Pending Approval state."}}
  - {"op": "update_node", "id": "REQ-019-051", "title": "Publishing an Admin-via-Provider program notifies targeted providers, who each accept or decline", "attrs": {"statement": "For Admin-via-Provider, publishing the program (Draft to Active) notifies targeted providers, who each accept or decline (S-03; approval-requested event of the FR-030 notification catalogue). There is no program-level Pending Approval: approval is per provider adoption, and the program applies only to providers whose adoption is Accepted. If every provider declines, the program stays Active with no participants until archived.", "rationale": "Screen 2 business rules; same outcome as the Main Flow step 2 rule."}}
  - {"op": "update_node", "id": "REQ-019-057", "attrs": {"statement": "All state changes, edits, approvals, and override actions are listed in chronological order with actor, timestamp, reason, and the old and new values for edits."}}
  - {"op": "update_node", "id": "REQ-019-060", "title": "Re-invite resets a declined, auto-declined or revoked provider to Pending and re-sends the notification", "attrs": {"statement": "Re-invite resets the provider's status from Declined, Auto-Declined, Revoked-by-Provider or Revoked-by-Admin back to Pending and re-sends the S-03 notification."}}
  - {"op": "update_node", "id": "REQ-019-068", "attrs": {"statement": "FR-018: Affiliate Management – Affiliate-bound code redemptions accrue incentive to the linked affiliate; FR-019 triggers the incentive event consumed by FR-018. Affiliate codes follow the same usage rule as every code: one use is reserved at acceptance and consumed at the first payment, and there is no code entry at checkout. Given a patient enters an Affiliate-bound code on a named subquote and accepts it, when the first payment succeeds, then the corresponding row updates to Redeemed and the affiliate's incentive accrual (per FR-018) is triggered."}}
  - {"op": "update_node", "id": "REQ-019-069", "attrs": {"statement": "The two-state distinction (Applied vs Completed) is preserved per client request (Admin Part 1 L341–344). Applied = the subquote carrying the promotion has been accepted and, for a provider-selected promotion or patient code, one use is reserved at that moment (entering a code never counts against a limit); Completed = the first payment for that booking has succeeded and that reserved use is consumed. For an automatic promotion the use is already consumed at acceptance, so Completed only marks the first payment."}}
  - {"op": "update_node", "id": "REQ-019-070", "attrs": {"statement": "Voided is set only by the system, when the booking reaches `Payment Window Expired` or is cancelled, except for a provider-fault transfer, where Superseded takes precedence; the reserved use is then released. For an automatic promotion, the use consumed at acceptance returns to the usage limit when the row is Voided before the first payment. Superseded is set only by the system when a provider-fault transfer replaces the accepted record, and the use it held returns to the usage limit. There is no admin Void action."}}
  - {"op": "update_node", "id": "REQ-019-075", "title": "A provider may run many self-created promotions at once, subject to one discount per subquote", "attrs": {"statement": "Provider may have an arbitrary number of self-created promotions concurrently active, subject to the platform's single-discount-per-subquote rule at redemption time."}}
  - {"op": "update_node", "id": "REQ-019-085", "title": "A discount shows as one separate line that reduces the whole price", "attrs": {"statement": "The discount is shown as one separate line that reduces the whole price. When a valid code is applied, for 95% of valid codes the price breakdown updates within 1 second and shows the discount as a separate line.", "rationale": "Screen 11 business rules and acceptance criterion 1."}}
  - {"op": "update_node", "id": "REQ-019-086", "title": "Active dates, eligibility and usage limits are checked at attach, at code validation and at confirmation; send-time and restore failures are handled", "attrs": {"statement": "Active dates, eligibility, and usage limits are checked when a promotion is attached to a row at send, when a patient code is validated before acceptance, and, for the usage limit of a provider-selected promotion, when the patient confirms acceptance (Alternative Flow A5). If a promotion the provider selected cannot attach at send (its limit is used up, the program is paused or ended, or the provider's adoption is revoked), the provider sees the reason and the quote is sent without that promotion only after the provider confirms; a draft quote that holds a revoked or paused program drops it the same way. An archived quote that is restored re-checks its promotion and takes a new reservation, and the restore is refused when the limit is used up or the promotion has ended (FR-004 REQ-004-105)."}}
  - {"op": "update_node", "id": "REQ-019-089", "title": "On a provider-fault transfer the original Application is kept as Superseded and the replacement carries no promotion", "attrs": {"statement": "Post-acceptance freeze: after acceptance, the promotion and discounted price of the accepted subquote are frozen in the AcceptanceEvent snapshot. No removal, replacement, code entry at checkout or booking, price-changing revalidation, or admin void is allowed. The only exception is the provider-fault transfer in FR-006 (Alternative Flow B5): the replacement quote carries no promotion, the original Application is kept as history and marked Superseded (Superseded takes precedence over Voided when the original booking is cancelled for the transfer), and the use it held returns to the usage limit. Money handling for that transfer is defined by FR-006, FR-007, FR-007b, and FR-017."}}
  - {"op": "update_node", "id": "REQ-019-099", "title": "If the code is no longer valid at confirmation, the acceptance does not happen and the patient returns to the subquote detail", "attrs": {"statement": "Patient code no longer valid when the patient confirms acceptance (for example, its usage limit was reached): the acceptance does not happen, the reason is shown, and the patient returns to the subquote detail, where the patient may accept without the code or enter another; the price falls back to what the row carried at send, including its attached promotion (FR-005 REQ-005-026)."}}
  - {"op": "update_node", "id": "REQ-019-109", "title": "An admin can never force a provider into a program; the overrides are Force-Revoke and Re-invite", "attrs": {"statement": "System MUST NOT let an admin force a provider to take part in a program; the overrides an admin has on a provider's adoption are Force-Revoke and Re-invite."}}
