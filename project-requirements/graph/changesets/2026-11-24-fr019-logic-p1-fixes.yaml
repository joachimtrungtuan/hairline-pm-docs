# FR-019 logic review: ruled fixes applied to the PRD (Promotions and Discounts). New steps and the new field come first, then removals, updates, enum values and new edges.
# Cross-FR edges: STG-provider-03-active no longer emits EVT-promotion-discount-approval-requested and STG-main-02-quote now emits it (the event is FR-030-owned); STG-main-02-quote emits and STG-admin-02-operations writes ENT-promotion-adoption are FR-019-side stage wiring. STP-019-021 to -023 and ENT-promotion-program.paused_by are FR-019-owned.
# Not touched here (owned elsewhere): FR-004 line 211 and REQ-004-090; FR-005 offered-price definition and ENT-acceptance-event.promotion_code; FR-018 Rule 13, the applied definition and the checkout code-entry lines; FR-017 ENT-discount-code, SCR-017-07 and SCR-017-08; FR-030 EVT-promotion-discount-approval-requested description.
# Left alone on purpose: no revive, supersede or refund steps; the missing incoming next edge into STP-019-017 from the FR-005 acceptance step; the Financial Impact Preview percentage wording; STP-019-019 and STP-019-020 stay as flow starts and only lose their next edges.
reason: "FR-019 logic review: archived release reason and restore re-check, send-time and acceptance-time handling of an unusable provider-selected promotion, patient code replacing the row's promotion, tie-break and limit-before-ranking for automatic programs, provider-fault transfer carrying no promotion, no program-level Pending Approval with per-side pause and resume, admin overrides limited to Force-Revoke and Re-invite, auto-decline default, provider code entry removed, package-upgrade and partial-scope options removed, affiliate usage rule, code status on release or void, funnel source and audit before and after values, plus the consume and release steps and the stage and event wiring."
