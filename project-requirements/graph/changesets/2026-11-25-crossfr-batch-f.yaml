# Cross-FR alignment, owners FR-012 to FR-018: graph change-set mirroring the revised PRDs
# New: rules REQ-015-139 and REQ-015-140 (with field ENT-provider.aftercare_participation), REQ-016-226 and REQ-016-227, REQ-017-202 and REQ-017-203 (with handover_fee enum values); each rule has its stage, actor or entity, and source edges.
# Cross-FR edges: from FR-013 REQ-013-017 to EVT-review-response-removed (FR-030); from FR-015 STP-015-174 to FR-009 STP-009-089; from FR-016 nodes to FR-001 lock and email fields and FR-034 support case fields; from FR-017 screens to FR-019 promotion fields. No node owned by another FR is updated.
# Removed: the three FR-017 screen edges to ENT-discount-code fields, replaced by the FR-019 promotion program and code fields. ENT-discount-code itself is owned by FR-019 and is not touched.
reason: "Cross-FR alignment of owner PRDs: FR-012 read-only conversation conditions; FR-013 response-removed event key and admin review actions for a Deactivated provider; FR-015 conversations on suspension, Aftercare Participation setting, commission reversal on refund, fixed creation rate limit; FR-016 permission wording, session end on reset, unlock fields, email change, flag and export rules, request type and case reference; FR-017 permission names, commission reversal on refund, handover fee credit, release date for a Connect payout, promotion fields on Screens 5 and 6, Inactive affiliate payout, Deactivated clinic bank details."
by: docs-manager
operations:
  - {"op": "add_node", "id": "REQ-015-139", "type": "Rule", "owner_fr": "FR-015", "title": "Provider suspension and deactivation make conversations read-only", "attrs": {"statement": "Suspension and deactivation also make the provider's conversations with patients read-only, history kept, as FR-012 REQ-012-018 rules. A suspended provider may still chat on its open `In Progress` and `Aftercare` cases (REQ-015-077); a deactivated provider cannot, because its login is disabled.", "rationale": "Provider status effects; the read-only rule itself is owned by FR-012 REQ-012-018."}}
  - {"op": "add_node", "id": "REQ-015-140", "type": "Rule", "owner_fr": "FR-015", "title": "Aftercare Participation is a yes or no setting on the provider profile", "attrs": {"statement": "Aftercare Participation is a yes or no setting on the provider profile, default On, that an admin sets when creating the provider (Screen 2 Step 5) and can change later in Tab 1 while the provider is Active or Suspended. When On, FR-011 assigns a patient's aftercare to this clinic while it is Active; when Off, to the Hairline aftercare team (FR-011 REQ-011-054). A change applies to aftercare assigned afterwards.", "rationale": "Screen 2 Step 5 and Screen 3 Tab 1; the assignment rule is owned by FR-011 REQ-011-054."}}
  - {"op": "add_node", "id": "REQ-016-226", "type": "Rule", "owner_fr": "FR-016", "title": "Admin email change is saved unverified and shown on the Overview", "attrs": {"statement": "An email change made with Edit Patient is saved as unverified, a notice goes to the old address, and the patient confirms a code sent to the new address at the next login (FR-001 REQ-001-184); an address already in use is refused. The Overview shows the verification state and an \"Email change pending\" mark", "rationale": "Edit Patient and Overview Email Verified row; the verification flow is owned by FR-001 REQ-001-184."}}
  - {"op": "add_node", "id": "REQ-016-227", "type": "Rule", "owner_fr": "FR-016", "title": "Support Case Reference is a plain reference without View Support Center", "attrs": {"statement": "On Booking Support Requests the Support Case Reference opens the support case for an admin with View Support Center; for an admin without it the reference is plain text with no link (FR-034 REQ-034-094)", "rationale": "Booking Support Requests screen; the access rule is owned by FR-034 REQ-034-094."}}
  - {"op": "add_node", "id": "REQ-017-202", "type": "Rule", "owner_fr": "FR-017", "title": "A refund reverses commission in proportion, including an aftercare plan refund", "attrs": {"statement": "A refund reverses the commission on the refunded money in the same proportion, so the clinic's matching amount is the refunded money less the reversed commission; this holds for a part refund, a patient cancellation refund and the pro-rata refund of the unused full months of an aftercare plan paid in full, and the payout effect follows REQ-017-075 and REQ-017-191", "rationale": "Payout effect of a refund on Screen 5; the aftercare refund amount is owned by FR-011 REQ-011-097 and the commission principle by FR-015 REQ-015-041."}}
  - {"op": "add_node", "id": "REQ-017-203", "type": "Rule", "owner_fr": "FR-017", "title": "A handover fee is a credit entry on the clinic balance record", "attrs": {"statement": "A handover fee that Hairline owes a provider after an aftercare handover (FR-011) is a credit entry of type Handover Fee on the clinic's balance record, created only when the admin-set fee is above zero; it is paid by Hairline, never taken from a patient price or from the provider's earnings, carries no commission, and is added to the clinic's next payout on either rail", "rationale": "Screen 3 payout adjustments; the fee amount and the handover are owned by FR-011 REQ-011-057."}}
  - {"op": "add_field", "id": "ENT-provider.aftercare_participation", "entity_id": "ENT-provider", "name": "aftercare_participation", "data_type": "bool", "title": "Aftercare participation", "owner_fr": "FR-015", "attrs": {"description": "Whether this clinic takes the aftercare of its own patients; default On. When On, FR-011 assigns a patient's aftercare to this clinic while it is Active; when Off, to the Hairline aftercare team (FR-011 REQ-011-054)."}}
  - {"op": "add_enum_value", "field_id": "ENT-clinic-balance-entry.entry_type", "value": "handover_fee", "label": "Handover fee credit", "sort_order": 4}
