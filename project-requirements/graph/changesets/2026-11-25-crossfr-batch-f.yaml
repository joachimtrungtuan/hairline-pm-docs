  - {"op": "update_node", "id": "REQ-012-018", "attrs": {"statement": "System MUST enable patient-provider messaging only when provider has sent a quote to patient. The conversation is open while the pair has a live quote, booking or aftercare; it becomes read-only (history kept for both parties, nobody can send, admins can still view it) when the provider is deactivated, when the provider is suspended and the pair has no open In Progress or Aftercare case (a suspended provider may still chat on those, FR-015 REQ-015-077), when the patient's account is suspended or deleted, or when nothing live is left between the pair. It opens again when the patient's suspension is lifted or ends (FR-016 REQ-016-224) and when the same provider sends a new quote. Read-only is derived from those conditions and is not a stored conversation status. On a read-only conversation the composer, attach control and call buttons are disabled with a banner giving the reason, and Enable Emergency Intervention is not available."}}
  - {"op": "update_node", "id": "REQ-013-017", "attrs": {"statement": "The review module raises a notification on each of these events: new published review, provider reply, admin removal of a review (to the reviewing patient), admin removal of a provider response (event `review.response_removed`, raised by this module, to the provider with the reason), takedown decision, review edited by the patient (to the provider, informational only), review edited by an admin (to the reviewing patient), takedown requested (to admins), and takedown overdue (to admins). Notices that would go to the placeholder patient of an admin-seeded review are not sent. The invitation fires on the eligibility date (3 months after the treatment case was marked Completed in FR-010) and reminder timing counts from that date; reminder cadence is owned by FR-030. Delivery, recipients, content and opt-out follow the notification-service Rule in FR-020 and the FR-030 notification catalogue."}}
  - {"op": "update_node", "id": "REQ-013-039", "attrs": {"statement": "Insert authenticated reviews and edit/remove existing reviews with mandatory reasons. These actions stay available for a provider of any status, including a Deactivated provider, because reviews are retained. Removal reason must be at least 10 characters."}}
  - {"op": "update_node", "id": "REQ-015-041", "attrs": {"statement": "Percentage Model: Calculated as `Booking Total * (Commission Rate / 100)`. The booking total is the accepted price after promotion, in the quote currency, read from the FR-005 acceptance snapshot; commission never reads the live quote or option record. The same base applies to every discount type, including discounts funded only by Hairline. The rate is the one fixed at booking confirmation (Commission Rule 4). When money is refunded to the patient, the commission on the refunded amount is reversed with it, in the same proportion, so Hairline keeps commission only on money the patient keeps; FR-017 owns the refund and payout mechanics (REQ-017-202)."}}
  - {"op": "update_node", "id": "REQ-015-066", "attrs": {"statement": "Rate limiting on provider creation API (max 10 provider creations per admin per hour) to prevent bulk account creation abuse. The limit is a fixed platform setting; it is not editable in the admin console and is not listed on FR-026 Screen 8."}}
  - {"op": "update_node", "id": "SET-provider-creation-rate-limit", "attrs": {"description": "Maximum provider creations per admin per hour (Implementation Notes, Security Considerations). A fixed platform setting: not editable in the admin console and not listed on FR-026 Screen 8."}}
  - {"op": "update_node", "id": "REQ-016-009", "attrs": {"statement": "System MUST allow admins to unlock patient accounts after failed login attempts; an unlock clears the lock time and resets the failed-attempt count (FR-001 REQ-001-007)"}}
  - {"op": "update_node", "id": "REQ-016-013", "attrs": {"statement": "System MUST allow admins to update patient profile information (name, email, phone, location) with justification and audit logging; an email change is saved as unverified and confirmed by the patient at the next login"}}
  - {"op": "update_node", "id": "REQ-016-050", "attrs": {"statement": "System generates password reset token; System sends email to patient with reset link (6-digit OTP); when the patient completes the reset, every existing session of the patient ends on every device (FR-001 REQ-001-182)"}}
  - {"op": "update_node", "id": "REQ-016-053", "attrs": {"statement": "System immediately revokes patient authentication tokens, which ends every existing session of the patient on every device (FR-001 REQ-001-182)"}}
  - {"op": "update_node", "id": "STP-016-067", "title": "System sends the reset email with a 6-digit OTP to the patient; when the patient completes the reset, every existing session of the patient ends on every device"}
  - {"op": "update_node", "id": "STP-016-079", "title": "System immediately revokes patient authentication tokens, which ends every existing session of the patient on every device"}
  - {"op": "update_node", "id": "STP-016-125", "title": "System sets the account to Active, clears the lock time, resets the failed-attempt count and logs Account Unlock"}
  - {"op": "update_node", "id": "REQ-016-070", "attrs": {"statement": "Admin visibility and edit rights follow the FR-031 role permissions: View Patients grants patient visibility (all default roles), Edit Patients grants patient edits (Super Admin by default), Manage Aftercare covers aftercare actions and access to medical data and scans (Super Admin and Aftercare Coordinator by default), View Support Center and Respond to Support cover support actions (Super Admin, Aftercare Coordinator, and Support Staff by default), Issue Refunds covers refunds, and Delete Patients covers approving deletion requests. Actions the FR-031 list does not name map as follows: Reset Password, Unlock Account, Lift Suspension, and Take Action on a flagged conversation need Edit Patients; Payment Retry needs the FR-031 Retry Charge permission and Send Payment Reminder needs Send Payment Reminders; Super Admin and Billing Admin hold both by default, and the Payment Retry button calls the FR-007B Retry Charge action; Send Notification needs Respond to Support; the Payments tab needs View Patient Billing; the Communications tab needs View Provider-Patient Messages, and flagging a conversation needs Flag Communications"}}
  - {"op": "update_node", "id": "REQ-016-140", "attrs": {"statement": "\"Send Payment Reminder\" button for overdue installments; it needs the FR-031 Send Payment Reminders permission, held by Super Admin and Billing Admin by default"}}
  - {"op": "update_node", "id": "REQ-016-146", "attrs": {"statement": "Flagged conversations are highlighted by flag type as in FR-012: red for an automatic keyword flag, orange for a manual observation flag; system flags follow FR-012. A flag is resolved, never removed"}}
  - {"op": "update_node", "id": "REQ-016-147", "attrs": {"statement": "The words that trigger automatic flags are the keyword list in the FR-012 Screen 5 Moderation settings (FR-012 REQ-012-105), not a fixed list on this tab"}}
  - {"op": "update_node", "id": "REQ-016-148", "attrs": {"statement": "Admin can add a manual observation flag with a justification and resolve an open flag with a note; a flag is resolved, never unflagged or removed (FR-012 REQ-012-109, REQ-012-023)"}}
  - {"op": "update_node", "id": "REQ-016-151", "attrs": {"statement": "Conversation export is deferred to a future phase, as in FR-012 (REQ-012-061, REQ-012-076); this tab has no Export control until then"}}
  - {"op": "update_node", "id": "REQ-016-157", "attrs": {"statement": "Admins see the patient's real identity on this tab; the masked identifier \"Patient #HP12345\" applies only on the provider screens until payment is confirmed (FR-012 REQ-012-028)"}}
  - {"op": "update_node", "id": "REQ-016-183", "attrs": {"statement": "Account status filter: Filter by account status; Options: Active, Suspended, Locked; Deactivated is a reserved FR-001 value that nothing sets or shows, so it is not offered (FR-001 REQ-001-188)"}}
  - {"op": "update_node", "id": "REQ-016-198", "attrs": {"statement": "Admin roles and permissions follow FR-031 (Admin Access Control & Permissions): default roles Super Admin, Aftercare Coordinator, Billing Admin, and Support Staff, plus custom roles"}}
  - {"op": "update_node", "id": "REQ-016-208", "attrs": {"statement": "Each request on the Booking Support Requests screen is an FR-034 support case that carries a request type (booking cancellation or booking change, shown here as Cancellation or Appointment Change; FR-034 REQ-034-167); the patient raised it through Contact Support on an FR-006 booking screen, and the Ticket Source values are defined by FR-034"}}
  - {"op": "update_node", "id": "REQ-017-017", "attrs": {"statement": "System MUST implement role-based access control (RBAC) with the FR-031 permissions: Process Payouts and View Transactions (the read-only finance permission) are held by Super Admin and Billing Admin by default, and Issue Refunds by Super Admin by default; read-only finance access is granted by permission, not by a named role"}}
  - {"op": "update_node", "id": "REQ-017-047", "attrs": {"statement": "Admin access follows the FR-031 permissions: Process Payouts covers the money-moving payout actions (payout approvals, retries, overrides and bulk actions) and View Transactions is the read-only finance permission that opens every admin financial screen; Super Admin and Billing Admin hold both by default. A refund needs Issue Refunds, which Super Admin holds by default and Billing Admin does not. Read-only finance access is the View Transactions permission, not a named role. An admin who holds only View Transactions can access the same screens in read-only mode, but selection checkboxes, money-moving buttons, retry buttons, override buttons, and confirmation modals are hidden. Any action that moves money or changes a financial status MUST invoke the financial re-authentication step before the final confirm action is enabled"}}
  - {"op": "update_node", "id": "REQ-017-065", "attrs": {"statement": "\"Approve Payout\" button enabled ONLY for statements with status \"Pending Approval\" or \"Overdue\", and not while Payout Readiness is \"Manual Review Required\". \"Approve Payout\" is enabled ONLY when Payout Readiness = \"Ready\", the admin holds Process Payouts, and financial re-authentication succeeds"}}
  - {"op": "update_node", "id": "REQ-017-064", "attrs": {"statement": "Bank account details shown ONLY if provider has a valid bank account on file in FR-032 Billing Settings. Statements with missing or invalid bank details remain visible in the list for operational follow-up, but Payout Readiness is not \"Ready\" and approval controls remain disabled until the provider updates payout details in FR-032 / PR-06. A Suspended clinic's Owner can still update the bank details in FR-032 (REQ-032-067); a Deactivated clinic has no portal access, so an admin collects the corrected bank details outside the platform and records them as for a manually paid clinic, after which Payout Readiness follows the stored details as usual"}}
  - {"op": "update_node", "id": "REQ-017-100", "attrs": {"statement": "\"View in A-06\" deep-link on each row opens the discount's management page in FR-019. Implement filtering by: Status (the program lifecycle state), Program Type (Admin-via-Provider / Provider Self-Created / Hairline-Funded and Direct-Issued), and Active Window date range (codes valid within a given period). Support free-text search by discount code or campaign name. Export to CSV button for finance reconciliation (includes all visible columns for the filtered result set)"}}
  - {"op": "update_node", "id": "REQ-017-197", "attrs": {"statement": "An affiliate payout is payable on Screen 6 only when the payout month is closed, the unpaid balance is at or above the USD 50 minimum (an Inactive affiliate has no minimum), Payout Readiness is Ready and no hold applies. Screen 6 shows a Held or Flagged column: Held for the unpaid commission of a Suspended affiliate, Flagged for a payout with a booking that still breaches the margin check. An Inactive affiliate without a ban flag stays in the monthly run for any month with unpaid commission: the whole unpaid balance, including commission confirmed after the offboarding, is paid in the next run with no USD 50 minimum, a normal offboarding clears any hold, and there is no admin-initiated final payout on this screen"}}
