# FR-033 logic review pass 1: ruled fixes applied to the PRD (Help Centre Content Management). New rules, steps, field and enum values come first, then edges, then updates, retirements and removals.
# Cross-FR edges (edges only; no other FR's node is updated or retired): STP-033-164 on SCR-035-02 and applies REQ-035-028; STP-033-014, 025, 035, 036, 050, 057, 082, 083 and 090 are put on the FR-032 screens SCR-032-09, 10, 13 and 19.
# Queued for other FRs, not done here: FR-032 (SCR-032-12 Resource Category Filter still maps to topic; its view and download counter rules REQ-032-098 and REQ-032-099 do not cover FAQ, article and resource views, so view_count and download_count keep their FR-032 calculated_by and REQ-033-097 only applies to them), FR-035 (REQ-035-028 wording and how a vote and a view are written).
# Left alone on purpose: ENT-help-centre-content.category was already retired, so its enum values are retired and the field is made not required; REQ-033-089, 090 and 091 are retired and get no edge; minor observations (see the ledger Leftovers).
reason: "FR-033 logic review pass 1: size limit per upload kind, the helpful vote on resources, view and download counting, an uploaded video published only when processed (Failed status), virus scan rejection, the same required-field check on Save as Draft and Publish, resource category field replacing the retired category, status moves limited to Unpublish from Published, Archived filter and Restore, version on save, wiring of steps to screens and rules, overall status from active components only, patient Article Type values"
by: docs-manager
operations:
  - {"op": "add_node", "id": "REQ-033-096", "type": "Rule", "owner_fr": "FR-033", "title": "A helpful vote is one anonymous Yes or No; repeat votes count", "attrs": {"statement": "A \"Was this helpful?\" vote on a FAQ, article, resource or video is one anonymous Yes or No added to the item's helpfulness count, written through the FR-032 and FR-035 content interfaces; no identity is kept, so repeat votes count.", "rationale": "Core Requirements and Data & Privacy. Recording the vote on the audience side is stated by REQ-032-094 and REQ-035-007."}}
  - {"op": "add_node", "id": "REQ-033-097", "type": "Rule", "owner_fr": "FR-033", "title": "Views of FAQs, articles and resources are counted per open and stored with their date", "attrs": {"statement": "A view of a FAQ, article or resource is counted each time its detail (or the FAQ answer) is opened, for both audiences; a video view keeps the 30-second rule (REQ-033-079); a resource download is counted for both audiences; each view is stored with its date so views over time (REQ-033-018) and the FR-035 30-day popular list can be derived.", "rationale": "Core Requirements and Data & Privacy (View records). FR-032 keeps REQ-032-098 (download) and REQ-032-099 (video view) as the calculating rules of the two counters."}}
  - {"op": "add_node", "id": "REQ-033-098", "type": "Rule", "owner_fr": "FR-033", "title": "A file that fails the virus scan is rejected and not stored", "attrs": {"statement": "A file that fails the virus scan MUST be rejected and not stored; the admin sees \"File failed security scan. Upload a clean file.\" and the event is written to the audit trail.", "rationale": "Alternative Flow B2 step 8 and the security rules. Extends REQ-033-022 and REQ-033-029."}}
  - {"op": "add_node", "id": "REQ-033-099", "type": "Rule", "owner_fr": "FR-033", "title": "Content status moves are limited; only Unpublish leaves Published", "attrs": {"statement": "Content status moves are limited to Draft to Published, Published to Unpublished (only through the Unpublish action with its reason), Unpublished to Published, and any state to Archived by Delete; the Publish Status dropdown offers Draft and Published only and is read-only while the item is Published.", "rationale": "General Rule 4 and the Publish Status rows on the content forms."}}
  - {"op": "add_node", "id": "REQ-033-100", "type": "Rule", "owner_fr": "FR-033", "title": "Admins can filter archived content and restore it as Draft", "attrs": {"statement": "Each content list MUST have an admin-only \"Archived\" filter, and a Restore action MUST return an archived item as Draft; Related Content links removed at deletion (REQ-033-092) are not put back.", "rationale": "Alternative Flow A7 and General Rule 6 (soft delete supports recovery)."}}
  - {"op": "add_node", "id": "STP-033-164", "type": "Step", "owner_fr": "FR-033", "title": "System makes published, edited, unpublished or reordered content available in the patient Help Centre within 1 minute", "attrs": {"prd_ref": "Main Flow step 14 (patient audience)"}}
  - {"op": "add_node", "id": "STP-033-165", "type": "Step", "owner_fr": "FR-033", "title": "System rejects a file that fails the virus scan, does not store it, shows File failed security scan. Upload a clean file. and writes the event to the audit trail", "attrs": {"prd_ref": "Alternative Flow B2 step 8"}}
  - {"op": "add_node", "id": "STP-033-166", "type": "Step", "owner_fr": "FR-033", "title": "Admin selects the Archived filter and clicks Restore; the item returns as Draft and the Related Content links removed at deletion are not put back", "attrs": {"prd_ref": "Alternative Flow A7"}}
  - {"op": "add_field", "id": "ENT-help-centre-content.resource_category", "entity_id": "ENT-help-centre-content", "name": "resource_category", "data_type": "enum", "title": "Resource category", "owner_fr": "FR-033", "required": false, "attrs": {"description": "Optional resource category chosen from Templates, Documents or Forms (Screens 4.1 and 11.1). Replaces the retired category field, whose kind is carried by content_type."}}
