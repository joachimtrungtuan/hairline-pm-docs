  - {"op": "update_node", "id": "REQ-033-005", "title": "Six content types; Policy Document is provider-only", "attrs": {"statement": "System MUST support multiple content types (FAQ, Tutorial Guide, Troubleshooting Tip, Video Tutorial, Resource Document, Policy Document) applicable to both audiences, except that Policy Document is for the provider audience only (REQ-033-036)."}}
  - {"op": "update_node", "id": "REQ-033-010", "title": "File upload size limits by upload kind", "attrs": {"statement": "System MUST support file uploads for Help Centre content with a size limit per upload kind (resource file 50MB whatever its type, uploaded video 500MB, resource thumbnail 1MB, video thumbnail 2MB, image placed inside article or FAQ text 10MB) for both audiences."}}
  - {"op": "update_node", "id": "REQ-033-034", "title": "Publish, edit, unpublish and reorder take effect in the provider and patient Help Centre within 1 minute", "attrs": {"statement": "Publishing content, editing published content, reordering FAQ topics or FAQs, and unpublishing content take effect in the provider Help Centre (via FR-032) and the patient Help Centre (via FR-035, REQ-035-028) within 1 minute."}}
  - {"op": "update_node", "id": "REQ-033-036", "attrs": {"statement": "Content must be tagged with audience type (Provider or Patient) and with its kind (FAQ, Tutorial Guide, Troubleshooting Tip, Video Tutorial, Resource Document, Policy Document); the kind decides the Help Centre section the content appears in, and admins do not pick a section separately; Policy Document is for the provider audience only and is blocked for the patient audience, whose Article Type values are Tutorial Guide and Troubleshooting Tip."}}
  - {"op": "update_node", "id": "REQ-033-041", "attrs": {"statement": "These are fixed in code and not editable by admins: the 10 provider Help Centre categories; 5 content types for providers and 4 for patients (no Service Status); the audience types Provider and Patient (no new audience types); the content type options (FAQ, Tutorial Guide, Troubleshooting Tip, Video Tutorial, Resource Document, Policy Document); the file upload size limits per upload kind (resource file 50MB, uploaded video 500MB, resource thumbnail 1MB, video thumbnail 2MB, image placed inside article or FAQ text 10MB); the content body character limits (max 5000 characters for FAQ answers, max 10,000 characters for tutorial guides); the audit log retention period."}}
  - {"op": "update_node", "id": "REQ-033-054", "title": "Editing content creates a version on save; optional version note", "attrs": {"statement": "When an admin edits existing content, the editor is pre-filled with the existing content; the system creates a new version on save (opening the editor or cancelling creates none); the admin may add an optional \"Version note\" describing what changed; the system updates the content version and logs the change in the audit trail; if two admins edit the same item, the last save wins and both saves are versions."}}
  - {"op": "update_node", "id": "REQ-033-055", "attrs": {"statement": "To unpublish content the admin must confirm and enter a reason; the status changes from Published to Unpublished, the content is removed from the audience's Help Centre view within 1 minute (REQ-033-034), the action is logged in the audit trail with the reason, and the content remains in admin view as Unpublished for editing or re-publishing."}}
  - {"op": "update_node", "id": "REQ-033-056", "title": "Save as Draft and Publish run the same required-field check", "attrs": {"statement": "On Save as Draft and on Publish the system runs the same check of the required fields for the content kind (FAQ: question, answer, topic; article: title, content, article type; resource: name, file; video: title, source type) and of file formats, highlights missing or invalid fields with an error message, and saves or publishes only after the admin corrects them and re-submits."}}
  - {"op": "update_node", "id": "REQ-033-057", "attrs": {"statement": "When a file exceeds the size limit of its upload kind (resource file 50MB, uploaded video 500MB, resource thumbnail 1MB, video thumbnail 2MB, image placed inside article or FAQ text 10MB) the system displays an error message with the limit and suggested alternatives (compress the file, use external video hosting); the admin may re-upload a smaller file or add an external video embed link (YouTube or Vimeo)."}}
  - {"op": "update_node", "id": "REQ-033-065", "attrs": {"statement": "FAQ question is required (max 200 characters); FAQ answer is required (max 5000 characters, HTML formatting supported); FAQ topic is required and chosen from pre-defined topics or a newly created one; display order is optional (an integer, auto-incremented within the topic if not specified); publish status is Draft or Published (an Unpublished item can only move to Published, REQ-033-099) and defaults to Draft; question, answer and topic are required before saving, with the same check for Save as Draft and for Publish."}}
  - {"op": "update_node", "id": "REQ-033-070", "attrs": {"statement": "Article title is required (max 200 characters); article content is required (max 10,000 characters; HTML, headings, lists, images and tables supported); article type is required (Tutorial Guide, Troubleshooting Tip or Policy Information; patient articles use Tutorial Guide or Troubleshooting Tip only, REQ-033-036); tags and related articles are optional; publish status defaults to Draft; title, content and article type are required before saving, with the same check for Save as Draft and for Publish."}}
  - {"op": "update_node", "id": "REQ-033-072", "attrs": {"statement": "Resource name is required (max 200 characters); description is optional (max 500 characters); the resource file is required for new resources (max 50MB whatever the file type; whitelist PDF, DOCX, XLSX, PNG, JPG); resource category is optional and chosen from Templates, Documents or Forms; thumbnail or icon is optional (max 1MB, PNG or JPG, 128x128px recommended); publish status defaults to Draft; name and file are required before saving."}}
  - {"op": "update_node", "id": "REQ-033-077", "title": "Upload File videos: format, size, processing, duration, thumbnail and publish gate", "attrs": {"statement": "For Upload File videos the video file is required for new videos (MP4 or MOV, max 500MB) with a progress indicator; after upload a background job processes the video for streaming optimization (transcoding, thumbnail generation); the video duration is auto-extracted (read-only); the thumbnail is auto-generated from the video frame at the 10% mark unless the admin uploads a custom one; a processing status (uploading, processing, ready, failed) is shown; an uploaded video cannot be published until its processing status is ready (embedded videos are exempt); if processing fails the status becomes failed, the admin is told and can re-upload, and the item stays Draft."}}
  - {"op": "update_node", "id": "REQ-033-080", "attrs": {"statement": "The overall status is calculated automatically from the statuses of the active service components only and recalculated when a component changes; open incidents and maintenance in progress do not change it. A Degraded component does not count: if no active component is Down the overall status is All Systems Operational, if some but not all active components are Down it is Partial Outage, and if all active components are Down (including the case of a single active component) it is Major Outage; with no active component the page shows \"Status not available\" unless an admin sets the overall status by hand (see REQ-033-093); the options are All Systems Operational, Partial Outage and Major Outage."}}
  - {"op": "update_node", "id": "REQ-033-084", "attrs": {"statement": "Admins can schedule, edit, cancel and mark as completed maintenance windows; title and description are required (title max 200 characters, description max 2000 characters); scheduled start and end times are required and the end must be after the start; scheduled times must be in the future for new maintenance windows; at least one affected service is required; the status is Scheduled, In Progress, Completed or Cancelled and defaults to Scheduled; the status changes only by admin action, and a window past its end time stays as the admin left it."}}
  - {"op": "update_node", "id": "REQ-033-087", "title": "Helpfulness rating is aggregated Yes/No feedback, read-only", "attrs": {"statement": "The helpfulness rating shown to admins is the aggregated Yes/No feedback counts from provider feedback (or aggregated patient feedback), read-only, and tracked per FAQ, article, resource and video for analytics; how a vote is recorded is stated by REQ-033-096."}}
  - {"op": "update_node", "id": "STP-033-024", "title": "System creates a new version on save, updates the version and logs the change in the audit trail"}
  - {"op": "update_node", "id": "STP-033-048", "title": "Publish the video tutorial; an uploaded video can be published only when its processing status is Ready (embedded videos are exempt)"}
  - {"op": "update_node", "id": "STP-033-049", "title": "System processes the uploaded video for streaming optimisation; if processing fails the status becomes Failed, the admin is told and can re-upload, and the item stays Draft"}
  - {"op": "update_node", "id": "STP-033-060", "title": "Complete the content form and click Save as Draft or Publish; the same required-field check runs on both"}
  - {"op": "update_node", "id": "STP-033-065", "title": "Re-submit content for saving or publishing"}
