  # --- entities, fields, enum values
  - {"op": "add_node", "id": "ENT-aftercare-plan", "type": "Entity", "owner_fr": "FR-011", "title": "Aftercare plan", "attrs": {"description": "The aftercare case for one patient: who delivers it, from which template, its status, progress and the supportRequired marker. Treatment-linked or standalone."}}
  - {"op": "add_node", "id": "ENT-aftercare-template", "type": "Entity", "owner_fr": "FR-011", "title": "Aftercare template", "attrs": {"description": "Admin-created milestone template that providers use to set up a plan; when marked Available for Purchase it is also the service patients buy."}}
  - {"op": "add_node", "id": "ENT-aftercare-template-price", "type": "Entity", "owner_fr": "FR-011", "title": "Aftercare template price", "attrs": {"description": "One currency row of a template pricing table."}}
  - {"op": "add_node", "id": "ENT-aftercare-milestone", "type": "Entity", "owner_fr": "FR-011", "title": "Aftercare milestone", "attrs": {"description": "A phase of a plan or a template (plan_id or template_id is set): duration, scan and questionnaire schedule, restrictions and instructions."}}
  - {"op": "add_node", "id": "ENT-aftercare-task", "type": "Entity", "owner_fr": "FR-011", "title": "Aftercare task", "attrs": {"description": "A scheduled scan, questionnaire, medication or education task inside a milestone."}}
  - {"op": "add_node", "id": "ENT-aftercare-scan-artifact", "type": "Entity", "owner_fr": "FR-011", "title": "Aftercare scan artifact", "attrs": {"description": "A head scan photo set uploaded for a scheduled scan task (V1)."}}
  - {"op": "add_node", "id": "ENT-aftercare-questionnaire-response", "type": "Entity", "owner_fr": "FR-011", "title": "Aftercare questionnaire response", "attrs": {"description": "A patient answer set for one milestone questionnaire; the questions come from FR-025."}}
  - {"op": "add_node", "id": "ENT-aftercare-audit-entry", "type": "Entity", "owner_fr": "FR-011", "title": "Aftercare audit entry", "attrs": {"description": "Append-only record of a plan change, reassignment or admin edit."}}
  - {"op": "add_node", "id": "ENT-aftercare-medication", "type": "Entity", "owner_fr": "FR-011", "title": "Aftercare medication", "attrs": {"description": "A medication the provider prescribes in the plan."}}
  - {"op": "add_node", "id": "ENT-aftercare-dose", "type": "Entity", "owner_fr": "FR-011", "title": "Aftercare dose", "attrs": {"description": "One scheduled dose of a medication and whether the patient marked it taken."}}
  - {"op": "add_node", "id": "ENT-aftercare-resource", "type": "Entity", "owner_fr": "FR-011", "title": "Aftercare educational resource", "attrs": {"description": "A video, guide, FAQ or help item attached to a milestone."}}
  - {"op": "add_node", "id": "ENT-aftercare-resource-view", "type": "Entity", "owner_fr": "FR-011", "title": "Aftercare resource view", "attrs": {"description": "Records that a patient viewed a resource."}}
  - {"op": "add_node", "id": "ENT-aftercare-request", "type": "Entity", "owner_fr": "FR-011", "title": "Aftercare service request", "attrs": {"description": "A patient purchase request for aftercare (standalone or post-treatment add-on) with intake data, order amounts and request status."}}
  - {"op": "add_node", "id": "ENT-aftercare-communication-entry", "type": "Entity", "owner_fr": "FR-011", "title": "Aftercare communication entry", "attrs": {"description": "A message, escalation or system notification in the aftercare communication log."}}
  # --- rules: REQ-011-001..015 verbatim from the PRD, prose rules from REQ-011-016
  - {"op": "add_node", "id": "REQ-011-001", "type": "Rule", "owner_fr": "FR-011", "title": "Treatment-linked and standalone activation paths", "attrs": {"statement": "System MUST support treatment-linked and standalone aftercare activation paths"}}
  - {"op": "add_node", "id": "REQ-011-002", "type": "Rule", "owner_fr": "FR-011", "title": "Patients complete milestone tasks with reminders and quality validation", "attrs": {"statement": "Patients MUST be able to complete milestone tasks (scan uploads, questionnaires) with reminders and quality validation"}}
  - {"op": "add_node", "id": "REQ-011-003", "type": "Rule", "owner_fr": "FR-011", "title": "Providers configure and activate plans from templates", "attrs": {"statement": "Providers MUST be able to configure and activate aftercare plans with template customization"}}
  - {"op": "add_node", "id": "REQ-011-004", "type": "Rule", "owner_fr": "FR-011", "title": "Admin oversees cases, reassigns and overrides plans with audit", "attrs": {"statement": "Admin MUST be able to oversee cases, reassign providers, and override plans with full audit"}}
  - {"op": "add_node", "id": "REQ-011-005", "type": "Rule", "owner_fr": "FR-011", "title": "Milestones, tasks, progress and adherence tracked as entities", "attrs": {"statement": "System MUST track milestones, tasks, progress, and adherence as structured entities"}}
  - {"op": "add_node", "id": "REQ-011-006", "type": "Rule", "owner_fr": "FR-011", "title": "Aftercare artifacts retained per retention policy", "attrs": {"statement": "System MUST retain all aftercare artifacts (scans, questionnaires, communications) per retention policy", "rationale": "The periods are stated in Data and Privacy Rule 1 (see the retention rule)."}}
  - {"op": "add_node", "id": "REQ-011-007", "type": "Rule", "owner_fr": "FR-011", "title": "Progress derived deterministically", "attrs": {"statement": "Progress MUST be derived deterministically from plan and task completion", "rationale": "The formula is stated in Milestone and Task Rule 3 and on Screen 1. Workflow 3 step 4 lists further inputs; see the open question on progress inputs."}}
  - {"op": "add_node", "id": "REQ-011-008", "type": "Rule", "owner_fr": "FR-011", "title": "Aftercare data encrypted in transit and at rest", "attrs": {"statement": "All aftercare data MUST be encrypted in transit and at rest", "rationale": "Restated by Data and Privacy Rule 3 and Security Considerations (Data Encryption)."}}
  - {"op": "add_node", "id": "REQ-011-009", "type": "Rule", "owner_fr": "FR-011", "title": "Role-based, audited access", "attrs": {"statement": "Access MUST be role-based (patient, provider, admin) and fully audited", "rationale": "Restated by Security Considerations (Access Control, Audit Logging)."}}
  - {"op": "add_node", "id": "REQ-011-010", "type": "Rule", "owner_fr": "FR-011", "title": "PII visibility follows payment-confirmation policy", "attrs": {"statement": "PII visibility MUST follow payment-confirmation policy and admin exemptions", "rationale": "Detail in General Module Rule 3 and Data and Privacy Rule 2."}}
  - {"op": "add_node", "id": "REQ-011-011", "type": "Rule", "owner_fr": "FR-011", "title": "Notification Service for reminders and alerts", "attrs": {"statement": "System MUST integrate with Notification Service for reminders/alerts", "rationale": "Cross-FR: notification delivery is owned by FR-020 (Dependencies, prd.md lines 1477-1479)."}}
  - {"op": "add_node", "id": "REQ-011-012", "type": "Rule", "owner_fr": "FR-011", "title": "Media stored in secure storage with controlled access", "attrs": {"statement": "System MUST store media artifacts in secure storage with controlled access", "rationale": "Restated by Data and Privacy Rule 3 (scan media stored securely with access controls)."}}
  - {"op": "add_node", "id": "REQ-011-013", "type": "Rule", "owner_fr": "FR-011", "title": "Questionnaires referenced from FR-025", "attrs": {"statement": "System MUST reference questionnaires managed in FR-025 for aftercare context", "rationale": "Restated on Screens 3, 10 and 16; content ownership stays with FR-025."}}
  - {"op": "add_node", "id": "REQ-011-014", "type": "Rule", "owner_fr": "FR-011", "title": "Provider suspension or deactivation does not cancel standalone aftercare", "attrs": {"statement": "When a provider's suspension or deactivation becomes effective, System MUST NOT cancel that provider's non-terminal standalone aftercare cases; it MUST record cause `ProviderSuspended` or `ProviderDeactivated` and an independent `supportRequired` marker and route them to Screen 19 reassignment (treatment-linked cases follow REQ-011-015), retain the completion milestone and aftercare records, and route recovery continuity to admins for resolution through the existing reassignment/recovery workflow, without automatic reassignment or restoration on reactivation (Workflow 4 D4; FR-015 A5/Screen 4)", "rationale": "Restated by Workflow 4 D4, General Module Rule 4 and the mid-aftercare suspension edge case. The treatment-linked behaviour is stated in D4 and Rule 4 and recorded as its own Rule."}}
  - {"op": "add_node", "id": "REQ-011-015", "type": "Rule", "owner_fr": "FR-011", "title": "Admin reassigns aftercare provider or team on Screen 19", "attrs": {"statement": "System MUST let an admin reassign the aftercare provider or team on Screen 19 with a mandatory reason, confirmation, audit entry, and the mandatory `aftercare.provider_reassigned` notice to the patient and the new aftercare provider or assigned team member (no admin alert); for a treatment-linked case the booking MUST stay `Aftercare` and the treatment record MUST stay unchanged, with no new quote, acceptance, or payment", "rationale": "Restated by Workflow 4 D5 and the Screen 19 business rules."}}
  - {"op": "add_node", "id": "REQ-011-016", "type": "Rule", "owner_fr": "FR-011", "title": "Aftercare has exactly two entry routes", "attrs": {"statement": "Aftercare has exactly two entry routes: treatment-linked aftercare (starts from the patient's accepted Hairline quote whose treatment was performed, covering the Workflow 1 setup and the Workflow 2b post-treatment add-on bought within 90 days) and standalone aftercare (bought directly by patients treated at an outside clinic, with no inquiry or quote). Admin assignment is a step inside these routes, not a separate route.", "rationale": "Entry Points, prd.md line 64 onward."}}
  - {"op": "add_node", "id": "REQ-011-017", "type": "Rule", "owner_fr": "FR-011", "title": "Treatment-linked aftercare activates automatically at treatment completion", "attrs": {"statement": "Treatment-linked aftercare activates automatically upon treatment completion.", "rationale": "General Module Rule 1. Workflow 1 step 1: the provider marks the treatment completed, the system moves the patient status to Aftercare and prompts the provider to configure the aftercare plan. The booking transition itself is owned by FR-006."}}
  - {"op": "add_node", "id": "REQ-011-018", "type": "Rule", "owner_fr": "FR-011", "title": "Standalone aftercare requires payment before activation", "attrs": {"statement": "Standalone aftercare requires payment before activation. Payment is required before service activation for both standalone and post-treatment add-on aftercare.", "rationale": "General Module Rule 1 and Payment Rule 4 (payment timing)."}}
  - {"op": "add_node", "id": "REQ-011-019", "type": "Rule", "owner_fr": "FR-011", "title": "Admin can manually activate aftercare for special cases", "attrs": {"statement": "Admin can manually activate aftercare for special cases.", "rationale": "General Module Rule 1."}}
  - {"op": "add_node", "id": "REQ-011-020", "type": "Rule", "owner_fr": "FR-011", "title": "Standard duration 6-12 months, extensions need provider and admin approval", "attrs": {"statement": "Standard aftercare duration is 6-12 months, determined by treatment type and complexity. Extensions require provider and admin approval.", "rationale": "General Module Rule 2."}}
  - {"op": "add_node", "id": "REQ-011-021", "type": "Rule", "owner_fr": "FR-011", "title": "Data access limited by role: own, assigned, all", "attrs": {"statement": "Patients can only access their own aftercare data. Providers can only access assigned patients. Admin has full access to all aftercare data.", "rationale": "General Module Rule 3 and Data Access Rule 2; repeated on Screens 8, 9 and 12 (provider sees only assigned patients)."}}
  - {"op": "add_node", "id": "REQ-011-022", "type": "Rule", "owner_fr": "FR-011", "title": "Patient data anonymized until payment confirmation", "attrs": {"statement": "Patient data is anonymized until payment confirmation; patient anonymization is lifted after payment confirmation. Anonymization rules do not apply to admin.", "rationale": "General Module Rule 3 and Data Access Rule 2; Screen 14 business rules. Screens 8 and 9 state that provider-visible patient details are fully visible because aftercare occurs after payment confirmation."}}
  - {"op": "add_node", "id": "REQ-011-023", "type": "Rule", "owner_fr": "FR-011", "title": "Milestones progress by time, cannot be skipped, need all tasks done", "attrs": {"statement": "Milestones progress automatically based on time elapsed. Patients cannot skip milestones. Milestone completion requires all tasks completed.", "rationale": "Milestone and Task Rule 1."}}
  - {"op": "add_node", "id": "REQ-011-024", "type": "Rule", "owner_fr": "FR-011", "title": "Task completion standards", "attrs": {"statement": "Scan uploads must meet the quality threshold. Questionnaires must be completed in full. Medication adherence is tracked but not mandatory for milestone completion.", "rationale": "Milestone and Task Rule 2; Screen 2 (minimum quality threshold) and Screen 3 (all required fields) business rules."}}
  - {"op": "add_node", "id": "REQ-011-025", "type": "Rule", "owner_fr": "FR-011", "title": "Overdue tasks escalate after 48 hours", "attrs": {"statement": "Overdue tasks trigger escalation after 48 hours.", "rationale": "Milestone and Task Rule 2. Workflow 3 C1 and the overdue flag use 24 hours; see the open question on overdue timing."}}
  - {"op": "add_node", "id": "REQ-011-026", "type": "Rule", "owner_fr": "FR-011", "title": "Missed task: reminder, Overdue flag after 24 hours, team contacts patient", "attrs": {"statement": "When a patient misses a scheduled task, the system sends a reminder notification; after 24 hours the system flags the task as Overdue and the aftercare team contacts the patient.", "rationale": "Workflow 3 alternative flow C1."}}
  - {"op": "add_node", "id": "REQ-011-027", "type": "Rule", "owner_fr": "FR-011", "title": "Progress is completed tasks over total tasks, equally weighted, real time", "attrs": {"statement": "Progress = (completed tasks / total tasks) * 100. Tasks are weighted equally. Progress updates in real time.", "rationale": "Milestone and Task Rule 3; Screen 1 business rules add that tasks include scan uploads, questionnaires and medication adherence. Workflow 3 step 4 lists milestone completion, task completion and compliance rates as inputs; see the open question on progress inputs."}}
  - {"op": "add_node", "id": "REQ-011-028", "type": "Rule", "owner_fr": "FR-011", "title": "Concerning responses flag the case Urgent and trigger escalation", "attrs": {"statement": "When a patient reports concerning symptoms or a questionnaire response triggers the urgent flag per milestone rules, the system flags the case as Urgent, the aftercare team immediately contacts the patient and the escalation workflow is triggered.", "rationale": "Workflow 3 alternative flow C2; Screen 3 business rules (urgent flag raised immediately in real-time validation)."}}
  - {"op": "add_node", "id": "REQ-011-029", "type": "Rule", "owner_fr": "FR-011", "title": "Patient contact 24/7 with 2-hour urgent and 24-hour standard response", "attrs": {"statement": "Patients can contact the aftercare team 24/7. Urgent cases receive priority response within 2 hours. Standard cases receive a response within 24 hours.", "rationale": "Communication Rule 1."}}
  - {"op": "add_node", "id": "REQ-011-030", "type": "Rule", "owner_fr": "FR-011", "title": "Provider and aftercare team communication, immediate escalation response, audit logging", "attrs": {"statement": "Providers can communicate with the aftercare team about assigned cases. Escalations require immediate response. All communications are logged for audit.", "rationale": "Communication Rule 2; Screen 14 (all communications monitored and logged)."}}
  - {"op": "add_node", "id": "REQ-011-031", "type": "Rule", "owner_fr": "FR-011", "title": "Admin communicates with any stakeholder, announcements, emergency bypass", "attrs": {"statement": "Admin can communicate with any stakeholder. System-wide announcements are sent to all relevant parties. Emergency communications bypass normal channels.", "rationale": "Communication Rule 3."}}
  - {"op": "add_node", "id": "REQ-011-032", "type": "Rule", "owner_fr": "FR-011", "title": "Retention periods: 7 years data, 2 years scan media, 3 years communication logs", "attrs": {"statement": "Aftercare data is retained for 7 years minimum. Scan media is retained for 2 years after aftercare completion. Communication logs are retained for 3 years.", "rationale": "Data Retention Rule 1."}}
  - {"op": "add_node", "id": "REQ-011-033", "type": "Rule", "owner_fr": "FR-011", "title": "Admin access and access attempts logged for audit", "attrs": {"statement": "Admin access is logged for the audit trail. Access attempts are logged and monitored.", "rationale": "Data Access Rule 2 and Data Security Rule 3."}}
  - {"op": "add_node", "id": "REQ-011-034", "type": "Rule", "owner_fr": "FR-011", "title": "Admin can edit all aftercare data and override calculated progress", "attrs": {"statement": "Admin can edit ALL aftercare data in the system, modify any provider's aftercare plans, change patient assignments and providers, and override any system-calculated progress.", "rationale": "Admin Editability Rule 1; Workflow 4 step 2; Screens 8, 13 and 14 (full editability, admin override)."}}
  - {"op": "add_node", "id": "REQ-011-035", "type": "Rule", "owner_fr": "FR-011", "title": "Admin edit capabilities by data area", "attrs": {"statement": "Admin can edit aftercare plans (templates, milestones, medications, instructions), patient data (patient information, treatment details, contact info), provider data (assignments, customizations, settings), progress data (progress calculations, milestone completions), communication data (messages, escalations, notifications) and template data (milestone templates, questionnaires, resources).", "rationale": "Admin Editability Rule 2. Editing messages and escalations conflicts with immutable communication logs; see the open question on admin edits to logged data."}}
  - {"op": "add_node", "id": "REQ-011-036", "type": "Rule", "owner_fr": "FR-011", "title": "Admin edits logged with reason, history kept, parties notified", "attrs": {"statement": "All admin edits are logged with timestamp and admin identification. A change reason is required for all modifications. Edit history is maintained for the audit trail. Provider and patient are notified of significant changes.", "rationale": "Admin Editability Rule 3; Screen 11 business rules."}}
  - {"op": "add_node", "id": "REQ-011-037", "type": "Rule", "owner_fr": "FR-011", "title": "Rejected standalone requests refunded automatically", "attrs": {"statement": "Refunds are processed automatically for rejected requests. Rejection requires a reason and triggers a refund.", "rationale": "Payment Rule 1; Screens 7 and 15 business rules; Workflow 2 alternative flow B2. Money movement is executed through FR-007."}}
  - {"op": "add_node", "id": "REQ-011-038", "type": "Rule", "owner_fr": "FR-011", "title": "Payment disputes handled by admin team", "attrs": {"statement": "Payment disputes are handled by the admin team.", "rationale": "Payment Rule 1."}}
  - {"op": "add_node", "id": "REQ-011-039", "type": "Rule", "owner_fr": "FR-011", "title": "Provider compensation for aftercare participation, paid monthly", "attrs": {"statement": "Providers are compensated for aftercare participation. Compensation is based on case complexity and duration. Payment is processed monthly.", "rationale": "Provider Compensation, Payment Rule 2; Workflow 1 A2 (provider receives compensation when the Hairline aftercare team takes over)."}}
  - {"op": "add_node", "id": "REQ-011-040", "type": "Rule", "owner_fr": "FR-011", "title": "Platform commission 15-25% deducted at payment", "attrs": {"statement": "Platform commission is deducted from standalone aftercare payments. The commission rate is 15-25% (configurable). Commission is calculated at time of payment.", "rationale": "Platform Commission, Payment Rule 3. Screen 7 shows a Platform Fee of 15-25% to the patient; see the open question on commission versus patient fee."}}
  - {"op": "add_node", "id": "REQ-011-041", "type": "Rule", "owner_fr": "FR-011", "title": "Templates define their own pricing, per currency, in local currency", "attrs": {"statement": "Each aftercare template defines its own pricing (fixed, subscription, or both) in Screen 16. Pricing is configured per currency, and the patient sees the price in local currency based on location.", "rationale": "Payment Rule 4 (template-based pricing, multi-currency); Screen 6 and Screen 16 business rules (purchasable templates require pricing for all supported currencies; real-time exchange rates are a baseline with admin override)."}}
  - {"op": "add_node", "id": "REQ-011-042", "type": "Rule", "owner_fr": "FR-011", "title": "Patient chooses fixed or subscription when template offers both", "attrs": {"statement": "If a template offers both fixed and subscription pricing, the patient chooses at purchase time.", "rationale": "Payment Rule 4; Screens 6 and 16."}}
  - {"op": "add_node", "id": "REQ-011-043", "type": "Rule", "owner_fr": "FR-011", "title": "Subscription charged monthly, first payment immediate", "attrs": {"statement": "Subscription payments are monthly installments charged automatically for the template duration; the first payment is immediate and subsequent payments fall on the monthly anniversary. Total subscription amount = monthly price x template duration in months.", "rationale": "Payment Rule 4; Screens 7 and 16."}}
  - {"op": "add_node", "id": "REQ-011-044", "type": "Rule", "owner_fr": "FR-011", "title": "Post-treatment add-on only within 90 days of Hairline treatment completion", "attrs": {"statement": "The post-treatment add-on is available only to Hairline-treated patients within 90 days of treatment completion; the system verifies a completed Hairline treatment within 90 days and auto-populates treatment information from the patient's treatment history.", "rationale": "Payment Rule 4; Screen 6; Workflow 2b step 1."}}
  - {"op": "add_node", "id": "REQ-011-045", "type": "Rule", "owner_fr": "FR-011", "title": "Standalone service available to all patients", "attrs": {"statement": "The standalone service is available to all patients regardless of treatment source.", "rationale": "Payment Rule 4."}}
  - {"op": "add_node", "id": "REQ-011-046", "type": "Rule", "owner_fr": "FR-011", "title": "Only templates marked Available for Purchase shown, filtered by treatment type", "attrs": {"statement": "Only templates marked \"Available for Purchase\" are shown, filtered by treatment type compatibility. Templates can be marked \"Internal Use Only\" (providers only) or \"Available for Purchase\" (standalone and add-on). The template name is used as the service name for patient-facing display.", "rationale": "Payment Rule 4; Screens 6 and 16."}}
  - {"op": "add_node", "id": "REQ-011-047", "type": "Rule", "owner_fr": "FR-011", "title": "Price locked at purchase", "attrs": {"statement": "Patients are locked into the price at the time of purchase; future template price changes do not affect existing patients. Pricing changes to active templates require admin approval.", "rationale": "Payment Rule 4 (pricing immutability); Screen 16 business rules."}}
  - {"op": "add_node", "id": "REQ-011-048", "type": "Rule", "owner_fr": "FR-011", "title": "Paid standalone request goes to Pending Assignment, admin assigns provider", "attrs": {"statement": "After a successful payment the standalone request moves to Pending Assignment and appears in the admin dashboard (Screen 15); the admin reviews patient information and treatment details, assigns a suitable provider based on specialization and availability, and the system notifies the assigned provider.", "rationale": "Workflow 2 steps 2-3; Screen 15 business rules."}}
  - {"op": "add_node", "id": "REQ-011-049", "type": "Rule", "owner_fr": "FR-011", "title": "Assigned provider selects template, customizes and activates; patient onboarded", "attrs": {"statement": "The assigned provider reviews the patient case, selects the aftercare template (the purchased one or an alternative), customizes the plan and activates it; the patient receives an activation notification and gains access to the aftercare dashboard (Screen 1) and the aftercare team begins monitoring.", "rationale": "Workflow 2 steps 4-5 and Workflow 2b steps 4-5. The PRD order is pay, then admin assigns, then provider configures; SRC-MTG-001-W03 lists assign and configure before payment; see the open question on the standalone sequence."}}
  - {"op": "add_node", "id": "REQ-011-050", "type": "Rule", "owner_fr": "FR-011", "title": "Failed payment can retry; request expires after 48 hours unpaid", "attrs": {"statement": "When payment fails the patient receives a failure notification and can retry with a different payment method; the request expires after 48 hours without successful payment.", "rationale": "Workflow 2 alternative B1, Workflow 2b B1b; Screen 7 business rules (failed payments allow retry). Screen 15 separately says requests expire after 7 days if not assigned."}}
  - {"op": "add_node", "id": "REQ-011-051", "type": "Rule", "owner_fr": "FR-011", "title": "Admin rejection marks request Not suitable and notifies patient with reason", "attrs": {"statement": "When the admin rejects a request, the admin marks it \"Not suitable for aftercare\" with a required reason and the patient receives a rejection notification with the reason.", "rationale": "Workflow 2 alternative B2; Screen 15. Refund is a separate rule."}}
  - {"op": "add_node", "id": "REQ-011-052", "type": "Rule", "owner_fr": "FR-011", "title": "No available provider: Awaiting provider availability, admin assigns manually", "attrs": {"statement": "When no suitable provider is available, the admin marks the request \"Awaiting provider availability\", the patient is notified of the delay and the admin manually assigns when a provider becomes available.", "rationale": "Workflow 2 alternative B3."}}
  - {"op": "add_node", "id": "REQ-011-053", "type": "Rule", "owner_fr": "FR-011", "title": "Unassigned standalone requests expire after 7 days", "attrs": {"statement": "Requests expire after 7 days if not assigned.", "rationale": "Screen 15 business rules. The effect on a paid request is not stated; see the open question on expiry."}}
  - {"op": "add_node", "id": "REQ-011-054", "type": "Rule", "owner_fr": "FR-011", "title": "Add-on assigned automatically after payment: original provider or Hairline team", "attrs": {"statement": "Payment confirmation of a post-treatment add-on triggers automatic assignment: the system assigns the original treatment provider if the provider participates in aftercare, otherwise the Hairline aftercare team; the patient is notified of the provider assignment and the assigned provider receives a notification.", "rationale": "Workflow 2b step 3 and alternative B1a."}}
  - {"op": "add_node", "id": "REQ-011-055", "type": "Rule", "owner_fr": "FR-011", "title": "Provider marks completion, configures plan from admin-created template", "attrs": {"statement": "After the provider marks the treatment completed, the provider selects an admin-created milestone template, adds patient-specific instructions and post-operative medications (name, dosage, frequency, special instructions), may modify milestone durations and confirms the plan; the system then generates the plan with milestones, creates the patient aftercare dashboard, sends an activation notification to the patient and sends the aftercare team a case assignment notification.", "rationale": "Workflow 1 steps 1-4; Screen 10 business rules."}}
  - {"op": "add_node", "id": "REQ-011-056", "type": "Rule", "owner_fr": "FR-011", "title": "Paperwork-only aftercare: instructions delivered, no monitoring", "attrs": {"statement": "When the provider marks \"Paperwork only - no aftercare service\" and uploads an aftercare instructions document, the patient receives the instructions but no active monitoring, and the patient status moves to Completed after instruction delivery.", "rationale": "Workflow 1 alternative A1."}}
  - {"op": "add_node", "id": "REQ-011-057", "type": "Rule", "owner_fr": "FR-011", "title": "Provider may hand aftercare to the Hairline aftercare team", "attrs": {"statement": "When the provider marks \"Assign to Hairline aftercare team\", the admin receives a notification for aftercare assignment, the Hairline aftercare team takes over patient monitoring and the provider receives compensation for aftercare participation.", "rationale": "Workflow 1 alternative A2."}}
  - {"op": "add_node", "id": "REQ-011-058", "type": "Rule", "owner_fr": "FR-011", "title": "System sends reminders for upcoming tasks and missed doses", "attrs": {"statement": "The system sends notifications for upcoming tasks (scan or photo set, questionnaire), scan and questionnaire reminders, and reminder notifications for missed medication doses.", "rationale": "Workflow 3 steps 1-3; Screen 4 business rules."}}
  - {"op": "add_node", "id": "REQ-011-059", "type": "Rule", "owner_fr": "FR-011", "title": "Scan upload rules", "attrs": {"statement": "The scan is validated for quality with real-time feedback and may be retaken when quality is below the threshold; maximum file size is 50MB; multiple scans within a milestone are supported per the configured scan schedule with one upload allowed per scheduled instance; the stored scan is made available to the aftercare team and previous scans remain accessible for comparison.", "rationale": "Workflow 3 step 2; Screen 2 business rules (V1 head scan photo sets; true 3D scanning is V2)."}}
  - {"op": "add_node", "id": "REQ-011-060", "type": "Rule", "owner_fr": "FR-011", "title": "Questionnaire submission rules", "attrs": {"statement": "All required questionnaire fields must be completed before submission. Drafts are saved automatically every 30 seconds. One submission per questionnaire is allowed. The aftercare team reviews responses.", "rationale": "Screen 3 business rules; Workflow 3 step 3. Questionnaire content is owned by FR-025."}}
  - {"op": "add_node", "id": "REQ-011-061", "type": "Rule", "owner_fr": "FR-011", "title": "Medication schedule and adherence rules", "attrs": {"statement": "Medications are prescribed by the provider during aftercare setup. Adherence = (taken doses / total doses) * 100. A dose is shown as missed if not taken within 2 hours, and Mark as Taken is enabled when the dose time is reached. History is available for the entire aftercare period.", "rationale": "Screen 4 business rules and field validation."}}
  - {"op": "add_node", "id": "REQ-011-062", "type": "Rule", "owner_fr": "FR-011", "title": "Educational resources are milestone-specific and viewing is tracked", "attrs": {"statement": "Educational resources are specific to the current milestone, viewing progress is tracked for compliance, resources remain accessible throughout aftercare and new resources added by admin appear automatically.", "rationale": "Screen 5 business rules."}}
  - {"op": "add_node", "id": "REQ-011-063", "type": "Rule", "owner_fr": "FR-011", "title": "Order and checkout rules", "attrs": {"statement": "Payment is processed through FR-007 with multiple payment methods (credit or debit cards, PayPal, local payment methods) and PCI-compliant processing; terms and privacy policy must be accepted; payment confirmation triggers the aftercare request workflow (Workflow 2 or 2b) and a confirmation email. Card number, expiry, CVV, cardholder name and billing address are entered in the payment form and are not stored by FR-011.", "rationale": "Screen 7 business rules and fields. Payment processing is owned by FR-007."}}
  - {"op": "add_node", "id": "REQ-011-064", "type": "Rule", "owner_fr": "FR-011", "title": "Provider list limited to assigned patients with overdue indicator", "attrs": {"statement": "The provider case list shows only patients assigned to this provider, with overdue cases shown with amber indicators; progress is calculated automatically by the system.", "rationale": "Screens 8 and 12 business rules."}}
  - {"op": "add_node", "id": "REQ-011-065", "type": "Rule", "owner_fr": "FR-011", "title": "Case details keep full history for Hairline-treated and standalone cases", "attrs": {"statement": "The provider case details screen displays all historical data from the patient's entire journey without removing older data: for Hairline-treated patients the complete lifecycle (inquiry, quote, treatment details, aftercare), for standalone patients only aftercare data and the intake information from the request. All activities are logged with timestamps, the provider can modify the plan only for assigned patients and an escalation creates an audit trail.", "rationale": "Screen 9 business rules."}}
  - {"op": "add_node", "id": "REQ-011-066", "type": "Rule", "owner_fr": "FR-011", "title": "Setup wizard needs all steps; admin can edit after activation", "attrs": {"statement": "All setup steps must be completed before activation, the provider can go back to previous steps, the system validates all required fields, the admin can edit any step after activation and the patient receives a notification upon activation.", "rationale": "Screen 10 business rules."}}
  - {"op": "add_node", "id": "REQ-011-067", "type": "Rule", "owner_fr": "FR-011", "title": "Plan edits are logged; major changes need admin approval", "attrs": {"statement": "Provider changes are logged and tracked, admin changes override provider settings, major changes require admin approval, all changes are logged with reason and timestamp, the patient is notified of approved changes and change history is maintained for the audit trail.", "rationale": "Screen 11 business rules."}}
  - {"op": "add_node", "id": "REQ-011-068", "type": "Rule", "owner_fr": "FR-011", "title": "Admin list shows all cases, overdue amber, actions logged", "attrs": {"statement": "The admin case list shows all aftercare cases across all providers, any case data is editable, overdue cases are shown with amber indicators, progress is calculated automatically and all actions are logged for the audit trail.", "rationale": "Screens 13 and 14 business rules."}}
  - {"op": "add_node", "id": "REQ-011-069", "type": "Rule", "owner_fr": "FR-011", "title": "Provider assignment based on specialization and availability", "attrs": {"statement": "Provider assignment is based on specialization and availability; the admin sees available providers with name, specialization and availability.", "rationale": "Screen 15 business rules and fields."}}
  - {"op": "add_node", "id": "REQ-011-070", "type": "Rule", "owner_fr": "FR-011", "title": "Template lifecycle: not deletable in use, approval for active changes, tested first", "attrs": {"statement": "Templates cannot be deleted if in use, changes to active templates require approval, new templates must be tested before activation and resource files are limited to 100MB each.", "rationale": "Screen 16 business rules."}}
  - {"op": "add_node", "id": "REQ-011-071", "type": "Rule", "owner_fr": "FR-011", "title": "Questionnaire sets selected per milestone from FR-025 Aftercare context", "attrs": {"statement": "Screen 16 selects among existing Questionnaire Sets and configures schedule and frequency per milestone; each milestone independently selects one Questionnaire Set; only sets with context type Aftercare are surfaced, plus multi-context sets flagged as compatible. Sets and questions are not authored in FR-011.", "rationale": "Screen 16 business rules; content ownership is FR-025."}}
  - {"op": "add_node", "id": "REQ-011-072", "type": "Rule", "owner_fr": "FR-011", "title": "Provider withdrawal reviewed by admin", "attrs": {"statement": "When a provider withdraws from aftercare, the admin receives a notification and reviews the case, and can reassign it to another suitable provider, assign it to the Hairline internal aftercare team or mark the aftercare as cancelled with a reason; all changes are logged and the patient is notified of the new arrangement or cancellation.", "rationale": "Workflow 4 alternative D1. Provider performance reassignment (D2) and template and process updates (D3) are admin actions covered by the admin override and reassignment rules."}}
  - {"op": "add_node", "id": "REQ-011-073", "type": "Rule", "owner_fr": "FR-011", "title": "Treatment-linked cases are not cancelled on provider suspension or deactivation", "attrs": {"statement": "For treatment-linked cases the aftercare case is not cancelled and the booking stays Aftercare when the assigned provider is suspended or deactivated; the cause and the supportRequired marker are recorded and an admin reassigns the aftercare provider or team on Screen 19.", "rationale": "Workflow 4 D4 and D5, General Module Rule 4. The standalone behaviour is REQ-011-014."}}
  - {"op": "add_node", "id": "REQ-011-074", "type": "Rule", "owner_fr": "FR-011", "title": "Suspension and withdrawal handling keeps records read-only and removes provider actions", "attrs": {"statement": "On provider suspension, deactivation or reassignment the provider loses aftercare actions on the case; the completion milestone, plan, milestones, scans, questionnaire responses, medications and communication history are retained read-only; the cancellation is not a patient cancellation or a provider withdrawal; a later deactivation does not overwrite an earlier ProviderSuspended cause; no refund occurs automatically.", "rationale": "Workflow 4 D4 and D5; General Module Rule 4."}}
  - {"op": "add_node", "id": "REQ-011-075", "type": "Rule", "owner_fr": "FR-011", "title": "Reassignment keeps the case and the previous provider read-only history", "attrs": {"statement": "A reassignment changes only the aftercare provider or team; the plan, milestones, scans, questionnaire responses, medications and communication history stay with the case, the new assignee gets the aftercare actions from the moment of confirmation, the previous provider loses them and keeps read-only access to history it recorded, and money effects, if any, follow the FR-006 payment placeholder.", "rationale": "Workflow 4 D5 and Screen 19 business rules."}}
  - {"op": "add_node", "id": "REQ-011-076", "type": "Rule", "owner_fr": "FR-011", "title": "Reassignment saved only after confirmation, with audit and optional marker resolution", "attrs": {"statement": "The reassignment is saved only after confirmation, is recorded in the audit trail with admin identity, timestamp, reason, previous assignee and new assignee and, when selected, records the audited resolution of the supportRequired marker; the new provider must be an Active provider other than the current one; the reason is 10 to 1000 characters.", "rationale": "Screen 19 fields and business rules."}}
  - {"op": "add_node", "id": "REQ-011-077", "type": "Rule", "owner_fr": "FR-011", "title": "Provider performance scores monthly (backlog)", "attrs": {"statement": "Provider performance scores are calculated monthly, poor performance triggers a review process, provider suspension requires admin approval and performance data is retained for 2 years.", "rationale": "Screen 17 business rules. The screen is Backlog (post-MVP analytics)."}}
  - {"op": "add_node", "id": "REQ-011-078", "type": "Rule", "owner_fr": "FR-011", "title": "Admin progress overview updates in real time, metrics daily (backlog)", "attrs": {"statement": "The admin progress overview shows all cases across all providers with real-time updates, performance metrics calculated daily, alerts generated automatically for issues and all actions logged with admin identification.", "rationale": "Screen 18 business rules. The screen is Backlog (post-MVP analytics)."}}
  - {"op": "add_node", "id": "REQ-011-079", "type": "Rule", "owner_fr": "FR-011", "title": "Scan media is V1 photo sets", "attrs": {"statement": "In V1 all references to 3D scans in this FR refer to standardized head scan photo sets (multiple 2D views); true 3D scanning (ARKit/ARCore) is deferred to V2.", "rationale": "Executive Summary note on scan media."}}
  - {"op": "add_node", "id": "REQ-011-080", "type": "Rule", "owner_fr": "FR-011", "title": "Out of scope: patient and provider chat, payment flows beyond activation", "attrs": {"statement": "Direct patient to provider chat is out of scope (FR-012 backlog) and payment flows beyond standalone activation are out of scope (Payment FR).", "rationale": "Communication Structure, Out of Scope."}}
