  - {"op": "add_node", "id": "REQ-018-028", "type": "Rule", "owner_fr": "FR-018", "title": "provide a system-wide Promo Code Management list and a shared per-code Promo Code Detail...", "attrs": {"statement": "System MUST provide a system-wide Promo Code Management list and a shared per-code Promo Code Detail screen (reachable from both the management list and the Affiliate Detail codes list) showing the assigned affiliate and code performance", "rationale": "PRD Functional Requirements Summary, prd.md line 1602"}}
  - {"op": "add_node", "id": "REQ-018-029", "type": "Rule", "owner_fr": "FR-018", "title": "provide a shared Payout / Transaction Detail screen reachable from both the global payout...", "attrs": {"statement": "System MUST provide a shared Payout / Transaction Detail screen reachable from both the global payout list and an affiliate's payout list, with identical layout and capabilities from both entry points", "rationale": "PRD Functional Requirements Summary, prd.md line 1603"}}
  - {"op": "add_node", "id": "REQ-018-030", "type": "Rule", "owner_fr": "FR-018", "title": "onboard affiliates via a one-time secure activation link (set password, expires 24 hours) mirroring...", "attrs": {"statement": "System MUST onboard affiliates via a one-time secure activation link (set password, expires 24 hours) mirroring the provider activation flow, including activation-email resend (self-service and admin-triggered) rate-limited to 3 requests per hour per email", "rationale": "PRD Functional Requirements Summary, prd.md line 1604"}}
  - {"op": "add_node", "id": "REQ-018-031", "type": "Rule", "owner_fr": "FR-018", "title": "provide affiliates a portal with Overview, Promo Codes, Payouts, and Profile tabs, where affiliates...", "attrs": {"statement": "System MUST provide affiliates a portal with Overview, Promo Codes, Payouts, and Profile tabs, where affiliates can self-edit only non-sensitive profile fields (phone, language) while name (legal/payout name), payment details, commission, and status remain read-only/admin-controlled", "rationale": "PRD Functional Requirements Summary, prd.md line 1605"}}
  - {"op": "add_node", "id": "REQ-018-032", "type": "Rule", "owner_fr": "FR-018", "title": "present a Code Generation Results view after bulk generation showing created/skipped/failed counts with per-row...", "attrs": {"statement": "System MUST present a Code Generation Results view after bulk generation showing created/skipped/failed counts with per-row reasons and a retry-failed-only action that never duplicates successful codes", "rationale": "PRD Functional Requirements Summary, prd.md line 1606"}}
  - {"op": "add_node", "id": "REQ-018-033", "type": "Rule", "owner_fr": "FR-018", "title": "provide a Suspend/Reinstate action (with required reason and confirmation) that disables the affiliate's codes...", "attrs": {"statement": "System MUST provide a Suspend/Reinstate action (with required reason and confirmation) that disables the affiliate's codes and holds pending payouts on suspension", "rationale": "PRD Functional Requirements Summary, prd.md line 1607"}}
  - {"op": "add_node", "id": "REQ-018-034", "type": "Rule", "owner_fr": "FR-018", "title": "capture an effective date for commission-structure changes and apply new rates only to bookings...", "attrs": {"statement": "System MUST capture an effective date for commission-structure changes and apply new rates only to bookings completed on/after that date (no retroactive recalculation)", "rationale": "PRD Functional Requirements Summary, prd.md line 1608"}}
  - {"op": "add_node", "id": "REQ-018-035", "type": "Rule", "owner_fr": "FR-018", "title": "expose monthly affiliate payout cycle data to FR-017 / A-05, including total amount, affiliate...", "attrs": {"statement": "System MUST expose monthly affiliate payout cycle data to FR-017 / A-05, including total amount, affiliate count, threshold exclusions below $50, payout readiness, and reconciliation metadata before A-05 initiates Stripe transfers", "rationale": "PRD Functional Requirements Summary, prd.md line 1609"}}
  - {"op": "add_node", "id": "REQ-018-036", "type": "Rule", "owner_fr": "FR-018", "title": "record affiliate activation state (Invited until password set, Active after) and last login timestamp", "attrs": {"statement": "System MUST record affiliate activation state (Invited until password set, Active after) and last login timestamp", "rationale": "PRD Functional Requirements Summary, prd.md line 1622"}}
  - {"op": "add_node", "id": "REQ-018-037", "type": "Rule", "owner_fr": "FR-018", "title": "collect affiliate bank details for payouts (account holder name, bank name, account number, routing/SWIFT...", "attrs": {"statement": "System MUST collect affiliate bank details for payouts (account holder name, bank name, account number, routing/SWIFT code, optional IBAN), mirroring provider billing details (FR-032), with format validation via S-02, encryption at rest, and last-4 masking in the UI", "rationale": "PRD Functional Requirements Summary, prd.md line 1623"}}
  - {"op": "add_node", "id": "REQ-018-038", "type": "Rule", "owner_fr": "FR-018", "title": "provide affiliate onboarding/activation screens — Set Password (activation landing), Resend Activation, and Welcome /...", "attrs": {"statement": "System MUST provide affiliate onboarding/activation screens — Set Password (activation landing), Resend Activation, and Welcome / Get Started (first login) — mirroring the provider activation flow (FR-015)", "rationale": "PRD Functional Requirements Summary, prd.md line 1610"}}
  - {"op": "add_node", "id": "REQ-018-039", "type": "Rule", "owner_fr": "FR-018", "title": "provide an Offboarding / Deactivation action (Screen 3.3, with required reason and confirmation) that...", "attrs": {"statement": "System MUST provide an Offboarding / Deactivation action (Screen 3.3, with required reason and confirmation) that moves an affiliate to the terminal Inactive state: disabling all the affiliate's codes, converting portal access to read-only, retaining historical data, and performing explicit final settlement — pay net balance ≥ $50, forfeit a residual below $50, or write off a negative balance — each recorded in the audit trail. Inactive is distinct from Suspended (temporary, reversible) and is not silently reinstated", "rationale": "PRD Functional Requirements Summary, prd.md line 1611"}}
  - {"op": "add_node", "id": "REQ-018-040", "type": "Rule", "owner_fr": "FR-018", "title": "denominate all affiliate amounts (commission, balances, thresholds, payouts) in USD (platform base currency) and...", "attrs": {"statement": "System MUST denominate all affiliate amounts (commission, balances, thresholds, payouts) in USD (platform base currency) and MUST source every non-USD-to-USD conversion and exchange rate exclusively from FR-029 (Payment System Configuration) using the rate locked for the underlying booking — FR-018 MUST NOT define, cache, or override its own FX rate", "rationale": "PRD Functional Requirements Summary, prd.md line 1612"}}
  - {"op": "add_node", "id": "REQ-018-041", "type": "Rule", "owner_fr": "FR-018", "title": "validate at affiliate code creation/generation that the combined Hairline-funded cost on a booking (patient-facing...", "attrs": {"statement": "System MUST validate at affiliate code creation/generation that the combined Hairline-funded cost on a booking (patient-facing affiliate discount + affiliate commission) does not exceed Hairline's own commission on that booking (Rule 15); percentage breaches MUST be blocked (override requires documented, audited business approval) and fixed-amount configurations MUST raise a review warning", "rationale": "PRD Functional Requirements Summary, prd.md line 1613"}}
  - {"op": "add_node", "id": "REQ-018-042", "type": "Rule", "owner_fr": "FR-018", "title": "provide affiliates read-only access to externally hosted marketing materials (banners, templates, campaign assets) linked...", "attrs": {"statement": "System MUST provide affiliates read-only access to externally hosted marketing materials (banners, templates, campaign assets) linked to assigned codes/campaigns, while creation, editing, approval, and hosting of those materials remain outside FR-018 scope", "rationale": "PRD Functional Requirements Summary, prd.md line 1614"}}
  - {"op": "add_node", "id": "REQ-018-043", "type": "Rule", "owner_fr": "FR-018", "title": "Affiliate commissions are ONLY calculated for completed bookings where payment is confirmed...", "attrs": {"statement": "Affiliate commissions are ONLY calculated for completed bookings where payment is confirmed (not for quote requests or pending bookings)", "rationale": "PRD General Module Rules, prd.md line 1163"}}
  - {"op": "add_node", "id": "REQ-018-044", "type": "Rule", "owner_fr": "FR-018", "title": "Affiliate discount codes apply ONLY to Hairline's commission (does NOT reduce provider...", "attrs": {"statement": "Affiliate discount codes apply ONLY to Hairline's commission (does NOT reduce provider payout)", "rationale": "PRD General Module Rules, prd.md line 1164"}}
  - {"op": "add_node", "id": "REQ-018-045", "type": "Rule", "owner_fr": "FR-018", "title": "Affiliate commissions are deducted from Hairline's commission, NOT from provider's payout", "attrs": {"statement": "Affiliate commissions are deducted from Hairline's commission, NOT from provider's payout", "rationale": "PRD General Module Rules, prd.md line 1166"}}
  - {"op": "add_node", "id": "REQ-018-046", "type": "Rule", "owner_fr": "FR-018", "title": "Payout processing occurs monthly on the 7th of each month (fixed schedule...", "attrs": {"statement": "Payout processing occurs monthly on the 7th of each month (fixed schedule, per client policy — not admin-configurable) for the previous month's completed bookings", "rationale": "PRD General Module Rules, prd.md line 1167"}}
  - {"op": "add_node", "id": "REQ-018-047", "type": "Rule", "owner_fr": "FR-018", "title": "Affiliates can have multiple active discount codes simultaneously for different campaigns", "attrs": {"statement": "Affiliates can have multiple active discount codes simultaneously for different campaigns", "rationale": "PRD General Module Rules, prd.md line 1168"}}
  - {"op": "add_node", "id": "REQ-018-048", "type": "Rule", "owner_fr": "FR-018", "title": "FR-018 is the source of truth for affiliate-specific promo code generation and...", "attrs": {"statement": "FR-018 is the source of truth for affiliate-specific promo code generation and assignment; FR-019 provides the shared promotion rules, validation, redemption state lifecycle, and financial-impact logging", "rationale": "PRD General Module Rules, prd.md line 1169"}}
  - {"op": "add_node", "id": "REQ-018-049", "type": "Rule", "owner_fr": "FR-018", "title": "Admins MAY create open Hairline-funded marketing codes in FR-019, but those codes...", "attrs": {"statement": "Admins MAY create open Hairline-funded marketing codes in FR-019, but those codes do not create affiliate payout attribution unless they are generated or linked as affiliate-bound codes through FR-018", "rationale": "PRD General Module Rules, prd.md line 1171"}}
  - {"op": "add_node", "id": "REQ-018-050", "type": "Rule", "owner_fr": "FR-018", "title": "Affiliate onboarding uses a one-time secure activation link (set password, expires 24...", "attrs": {"statement": "Affiliate onboarding uses a one-time secure activation link (set password, expires 24 hours) mirroring the provider activation flow; raw credentials are never emailed", "rationale": "PRD General Module Rules, prd.md line 1172"}}
  - {"op": "add_node", "id": "REQ-018-051", "type": "Rule", "owner_fr": "FR-018", "title": "Affiliate referral attribution is preserved separately from price discount priority", "attrs": {"statement": "Affiliate commission and referral credit are earned when a valid affiliate-bound code or affiliate auto-apply referral link is captured for the patient's booking journey and the booking completes with payment confirmation, even if the final price discount applied at checkout is a higher-priority patient or provider promotion under Rule 3. The single-discount rule still controls the patient's price and provider/Hairline discount impact; it does not erase affiliate referral attribution. This protects affiliates from losing commission because a provider-side promotion is applied outside the patient's knowledge. FR-017 and FR-019 MUST consume the FR-018/FR-019 attribution result separately from the final applied discount line.", "rationale": "PRD General Module Rules, prd.md line 1173"}}
  - {"op": "add_node", "id": "REQ-018-052", "type": "Rule", "owner_fr": "FR-018", "title": "Affiliate lifecycle states", "attrs": {"statement": "An affiliate moves through Pending (account created, password not yet set) → Active (password set, transacting) and may then be Suspended (temporary, reversible, codes disabled, pending commissions held pending investigation — B3) or Inactive (permanent terminal end-of-partnership, codes disabled, portal read-only, final balance settled/forfeited/written off — B5). Active ⇄ Suspended is reversible via Screen 3.1; Active → Inactive is terminal via Screen 3.3 and is not silently reversed (resuming requires re-onboarding).", "rationale": "PRD General Module Rules, prd.md line 1174"}}
  - {"op": "add_node", "id": "REQ-018-053", "type": "Rule", "owner_fr": "FR-018", "title": "Usage-limit basis", "attrs": {"statement": "A code's `Maximum Usage Count` and `Per-Patient Usage Limit` are decremented on \"completed\" (paid) redemptions only, never on \"applied\" events — so abandoned or abusive checkouts cannot exhaust a code's cap. A separate soft anti-abuse rate limit on \"applied\" events (per patient / per IP / per time window) guards against application spam without consuming the usage cap.", "rationale": "PRD General Module Rules, prd.md line 1175"}}
  - {"op": "add_node", "id": "REQ-018-054", "type": "Rule", "owner_fr": "FR-018", "title": "Commission base", "attrs": {"statement": "Percentage commissions are calculated as a percentage of the completed booking's revenue (booking total, in USD per the Currency Rule) — not as a percentage of Hairline's net commission. Fixed-amount commissions are a flat USD amount per completed booking, independent of booking value. In both cases the commission is funded from (deducted from) Hairline's commission, never the provider's payout (Rule 4). The patient-facing affiliate discount (also Hairline-funded, Rule 2) and the affiliate commission are separate Hairline-borne costs against the same booking.", "rationale": "PRD General Module Rules, prd.md line 1176"}}
  - {"op": "add_node", "id": "REQ-018-055", "type": "Rule", "owner_fr": "FR-018", "title": "Hairline-funded cost ceiling", "attrs": {"statement": "On any single booking, the combined Hairline-funded cost — the patient-facing affiliate discount (Rule 2) plus the affiliate commission (Rule 14) — MUST NOT exceed Hairline's own commission earned on that booking; the affiliate program never makes a booking net-negative for Hairline. The system enforces this at affiliate code creation/generation (Screen 4): when both the discount and the commission are percentage-based, it validates that `discount % + commission % ≤ Hairline's commission % on the booking` and blocks the save with the shortfall shown; an admin with documented business approval may override with an audited confirmation. Fixed-amount configurations (where the ceiling depends on booking value) raise a review warning rather than a hard block, since the breach can only be evaluated per booking. This rule complements Assumption 4 (aggregate program cost ≤ 10% of Hairline commission revenue) by preventing per-booking negative margin.", "rationale": "PRD General Module Rules, prd.md line 1177"}}
  - {"op": "add_node", "id": "REQ-018-056", "type": "Rule", "owner_fr": "FR-018", "title": "Performance tier from trailing-12-month revenue", "attrs": {"statement": "Performance Tier (system-calculated, read-only): a band derived from the affiliate's trailing-12-month revenue generated (USD) by completed referrals, recalculated monthly. Default bands (admin-tunable): Bronze < $5,000 · Silver $5,000–$24,999 · Gold $25,000–$99,999 · Platinum ≥ $100,000. Tier is used for filtering/segmentation only and never changes commission automatically.", "rationale": "PRD Affiliate Segmentation Rules, prd.md line 1181"}}
  - {"op": "add_node", "id": "REQ-018-057", "type": "Rule", "owner_fr": "FR-018", "title": "Campaign eligibility needs Active status, activation and bank details", "attrs": {"statement": "Campaign Eligibility (system-calculated, read-only): an affiliate is Eligible for bulk/campaign code generation only when all of the following hold — Status = Active (not Pending, Suspended, or Inactive); Activation Status = Active (password set); and complete bank/payout details on file. Otherwise the affiliate is Ineligible and the specific failing reason is surfaced (e.g., \"Pending activation\", \"Incomplete payout setup\", \"Suspended/Inactive\"). These reasons are the same ones reported per row in bulk generation (B4) and drive Screen 1's eligibility gating.", "rationale": "PRD Affiliate Segmentation Rules, prd.md line 1182"}}
  - {"op": "add_node", "id": "REQ-018-058", "type": "Rule", "owner_fr": "FR-018", "title": "Patient identity never shared with affiliates", "attrs": {"statement": "Patient identity is NEVER shared with affiliates (affiliates see only aggregated statistics, not individual patient names)", "rationale": "PRD Data and Privacy Rules, prd.md line 1186"}}
  - {"op": "add_node", "id": "REQ-018-059", "type": "Rule", "owner_fr": "FR-018", "title": "Affiliate bank account numbers masked in the UI", "attrs": {"statement": "Affiliate bank account numbers are masked in UI (show last 4 digits only)", "rationale": "PRD Data and Privacy Rules, prd.md line 1187"}}
  - {"op": "add_node", "id": "REQ-018-060", "type": "Rule", "owner_fr": "FR-018", "title": "Affiliate dashboard requires secure login", "attrs": {"statement": "Affiliate dashboard access requires secure login (username/password + optional MFA — future / non-MVP, pending the shared MFA stack FR-026 / FR-031 per constitution Principle II)", "rationale": "PRD Data and Privacy Rules, prd.md line 1188"}}
  - {"op": "add_node", "id": "REQ-018-061", "type": "Rule", "owner_fr": "FR-018", "title": "Affiliate actions audit-logged, append-only, retained 10 years", "attrs": {"statement": "Audit Rule: All affiliate actions logged with timestamp, user ID, and action type (code usage, commission calculation, payout-cycle generation, payout status synchronization). The audit trail is immutable (append-only) and retained for 10 years per the platform constitution (financial/payout records are retained 7 years minimum)", "rationale": "PRD Data and Privacy Rules, prd.md line 1189"}}
  - {"op": "add_node", "id": "REQ-018-062", "type": "Rule", "owner_fr": "FR-018", "title": "Affiliate personal data deletable on request", "attrs": {"statement": "GDPR: Affiliate personal data (contact info, payment details) can be deleted upon request (historical commission data retained for accounting)", "rationale": "PRD Data and Privacy Rules, prd.md line 1190"}}
  - {"op": "add_node", "id": "REQ-018-063", "type": "Rule", "owner_fr": "FR-018", "title": "Fields an admin may edit on affiliates and codes", "attrs": {"statement": "Editable by Admin: Affiliate account details (name, email, phone, language, country, type, tax/VAT ID, bank account details, commission structure); Discount code parameters (expiration date, usage limits, active/inactive status); Bulk code generation criteria (selected affiliates, filtered segment, code pattern, campaign settings); Commission percentage/fixed amount per affiliate (with effective date for changes, via Screen 3.2); Affiliate status (Active/Suspended/Inactive, via Screen 3.1)", "rationale": "PRD Admin Editability Rules, prd.md lines 1196-1200"}}
  - {"op": "add_node", "id": "REQ-018-064", "type": "Rule", "owner_fr": "FR-018", "title": "Affiliate self-service edits non-sensitive fields only", "attrs": {"statement": "Editable by Affiliate (Self-Service): Non-sensitive profile fields only: phone, language(s); Affiliates CANNOT edit name (legal/payout name, admin-controlled), payment details, commission structure, status, or assigned codes (admin-controlled, read-only to affiliate)", "rationale": "PRD Admin Editability Rules, prd.md lines 1204-1205"}}
  - {"op": "add_node", "id": "REQ-018-065", "type": "Rule", "owner_fr": "FR-018", "title": "Fixed in codebase, not admin-editable", "attrs": {"statement": "Fixed in Codebase (Not Editable): Affiliate commission calculation logic (percentage of booking revenue OR fixed amount per booking); One-affiliate-per-code attribution model; Discount code uniqueness validation rules; Payout workflow status transitions (Pending → Processing → Paid/Failed); Audit trail retention period (10 years, per constitution); financial/payout records retained 7 years minimum; Activation link expiry (24 hours) and resend rate limit (3 per hour per email); Payout schedule (monthly on the 7th — fixed per client business policy; frequency and date are not configurable)", "rationale": "PRD Admin Editability Rules, prd.md lines 1209-1215"}}
  - {"op": "add_node", "id": "REQ-018-066", "type": "Rule", "owner_fr": "FR-018", "title": "Commission changes apply to future bookings only", "attrs": {"statement": "Configurable with Restrictions: Commission structure changes apply ONLY to future bookings (historical commissions cannot be retroactively modified)", "rationale": "PRD Admin Editability Rules, prd.md line 1219"}}
  - {"op": "add_node", "id": "REQ-018-067", "type": "Rule", "owner_fr": "FR-018", "title": "If patient refunds booking, affiliate commission is reversed (deducted from next payout)", "attrs": {"statement": "If patient refunds booking, affiliate commission is reversed (deducted from next payout)", "rationale": "PRD Payment and Billing Rules, prd.md line 1224"}}
  - {"op": "add_node", "id": "REQ-018-068", "type": "Rule", "owner_fr": "FR-018", "title": "Minimum payout threshold: $50 (commissions below $50 roll over to next month)", "attrs": {"statement": "Minimum payout threshold: $50 (commissions below $50 roll over to next month)", "rationale": "PRD Payment and Billing Rules, prd.md line 1225"}}
  - {"op": "add_node", "id": "REQ-018-069", "type": "Rule", "owner_fr": "FR-018", "title": "All affiliate amounts in USD; FX only through FR-029", "attrs": {"statement": "Currency Rule: All affiliate amounts (commission accrual, pending balances, thresholds, and payouts) are denominated in USD — the platform base currency owned by FR-029 (Payment System Configuration). When a booking is transacted in a non-USD currency, its value is converted to USD using FR-029's currency service, supported-currency list, and locked exchange-rate/markup logic — FR-018 never defines, caches, or overrides its own FX rate. The conversion rate applied to a commission is the rate locked for that booking per FR-029 (no discrepancy with billing/finance figures). Affiliates are responsible for any onward conversion from USD on their side. Note on client figures: GBP amounts in the client transcription (e.g., \"£50\", \"£200\") are illustrative of intended incentive magnitudes; the platform base currency is USD (per FR-029), so this PRD's literal thresholds and minimums (e.g., the $50 minimum fixed commission and $50 payout threshold) are stated in USD and are not a direct GBP→USD conversion of those examples.", "rationale": "PRD Payment and Billing Rules, prd.md line 1226"}}
  - {"op": "add_node", "id": "REQ-018-070", "type": "Rule", "owner_fr": "FR-018", "title": "Hairline covers Stripe payout/transfer fees (not deducted from affiliate commission)", "attrs": {"statement": "Hairline covers Stripe payout/transfer fees (not deducted from affiliate commission)", "rationale": "PRD Payment and Billing Rules, prd.md line 1228"}}
  - {"op": "add_node", "id": "REQ-018-071", "type": "Rule", "owner_fr": "FR-018", "title": "Affiliates must provide complete bank details (account holder name, bank name, account...", "attrs": {"statement": "Affiliates must provide complete bank details (account holder name, bank name, account number, routing/SWIFT code, optional IBAN) before a payout can be processed, mirroring provider billing setup in FR-032", "rationale": "PRD Payment and Billing Rules, prd.md line 1229"}}
  - {"op": "add_node", "id": "REQ-018-072", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 1: Sorting", "attrs": {"statement": "Sorting: Default sort by \"Total Revenue\" descending (highest performers first)", "rationale": "PRD Screen 1, prd.md line 345"}}
  - {"op": "add_node", "id": "REQ-018-073", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 1: Filtering", "attrs": {"statement": "Filtering: Admin can filter by status, country/region, affiliate type, language, performance tier, campaign eligibility, and payout setup completeness; admin can also search by affiliate name/email", "rationale": "PRD Screen 1, prd.md line 346"}}
  - {"op": "add_node", "id": "REQ-018-074", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 1: Pagination", "attrs": {"statement": "Pagination: Display 25 affiliates per page with pagination controls", "rationale": "PRD Screen 1, prd.md line 347"}}
  - {"op": "add_node", "id": "REQ-018-075", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 1: Quick Actions", "attrs": {"statement": "Quick Actions: Inline \"Generate Report\" button exports affiliate performance to PDF", "rationale": "PRD Screen 1, prd.md line 348"}}
  - {"op": "add_node", "id": "REQ-018-076", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 1: Bulk Code Action", "attrs": {"statement": "Bulk Code Action: Admin can select one or more affiliates from the filtered list and generate one distinct affiliate-bound code per selected affiliate", "rationale": "PRD Screen 1, prd.md line 350"}}
  - {"op": "add_node", "id": "REQ-018-077", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 1: Ineligible affiliates blocked from bulk generation with reason", "attrs": {"statement": "Given admin selects ineligible affiliates, when admin clicks \"Generate Codes\", then system blocks or excludes those rows and displays the specific eligibility reason.", "rationale": "PRD Screen 1, prd.md line 357"}}
  - {"op": "add_node", "id": "REQ-018-078", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 2: Email Uniqueness", "attrs": {"statement": "Email Uniqueness: System validates email is not already registered as affiliate or admin user", "rationale": "PRD Screen 2, prd.md line 401"}}
  - {"op": "add_node", "id": "REQ-018-079", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 2: Payment Masking", "attrs": {"statement": "Payment Masking: Bank account number masked in UI after initial entry (show last 4 digits only) and encrypted at rest; S-02 validates bank-detail format on save (same handling as provider bank details in FR-032)", "rationale": "PRD Screen 2, prd.md line 402"}}
  - {"op": "add_node", "id": "REQ-018-080", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 2: Commission Validation", "attrs": {"statement": "Commission Validation: If percentage type, system calculates preview of commission for an example booking (e.g., \"For a $1,000 booking at 15% of booking revenue, affiliate earns $150\")", "rationale": "PRD Screen 2, prd.md line 404"}}
  - {"op": "add_node", "id": "REQ-018-081", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 2: Default Values", "attrs": {"statement": "Default Values: Payout schedule is fixed at \"Monthly on the 7th\" (not editable); commission type defaults to \"Percentage\"", "rationale": "PRD Screen 2, prd.md line 405"}}
  - {"op": "add_node", "id": "REQ-018-082", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 2: Edit Restrictions", "attrs": {"statement": "Edit Restrictions: Email cannot be changed after account creation (must create new account if email change needed)", "rationale": "PRD Screen 2, prd.md line 406"}}
  - {"op": "add_node", "id": "REQ-018-083", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 2: Activation State", "attrs": {"statement": "Activation State: On create, Status is \"Pending\" and Activation Status is \"Invited\" until the affiliate completes the set-password flow; completing it flips Status to \"Active\" and Activation Status to \"Active\" together (per Rule 12). An admin \"Resend Activation Email\" action is available while Activation Status is \"Invited\"", "rationale": "PRD Screen 2, prd.md line 408"}}
  - {"op": "add_node", "id": "REQ-018-084", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 2: Warning above 20 percent commission", "attrs": {"statement": "Display warning message if commission percentage > 20%: \"High commission rate - please confirm business approval\"", "rationale": "PRD Screen 2, prd.md line 413"}}
  - {"op": "add_node", "id": "REQ-018-085", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 2: Draft autosave every 30 seconds", "attrs": {"statement": "Auto-save draft every 30 seconds to prevent data loss on accidental navigation away", "rationale": "PRD Screen 2, prd.md line 414"}}
  - {"op": "add_node", "id": "REQ-018-086", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 3: Single Source View", "attrs": {"statement": "Single Source View: All affiliate-scoped data (codes, payouts, audit) is read from the same records surfaced elsewhere; this screen aggregates, it does not duplicate", "rationale": "PRD Screen 3, prd.md line 441"}}
  - {"op": "add_node", "id": "REQ-018-087", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 3: Resend Activation", "attrs": {"statement": "Resend Activation: \"Resend Activation Email\" is enabled only while Activation Status is \"Invited\" (password not yet set); it follows the A5 rate-limit and security rules", "rationale": "PRD Screen 3, prd.md line 443"}}
  - {"op": "add_node", "id": "REQ-018-088", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 3.1: Suspension Effects", "attrs": {"statement": "Suspension Effects: On suspend, all of the affiliate's codes are disabled (invalid at checkout), pending unpaid commissions are held pending investigation, and historical data is retained", "rationale": "PRD Screen 3.1, prd.md line 478"}}
  - {"op": "add_node", "id": "REQ-018-089", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 3.1: Reinstatement", "attrs": {"statement": "Reinstatement: On reinstate, status returns to \"Active\"; held payouts resume per investigation outcome", "rationale": "PRD Screen 3.1, prd.md line 479"}}
  - {"op": "add_node", "id": "REQ-018-090", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 3.1: Notification", "attrs": {"statement": "Notification: System emails the affiliate about suspension with the reason", "rationale": "PRD Screen 3.1, prd.md line 480"}}
  - {"op": "add_node", "id": "REQ-018-091", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 3.1: Confirmation Gate", "attrs": {"statement": "Confirmation Gate: \"Submit\" is disabled until the confirmation checkbox is checked (prevents accidental suspension)", "rationale": "PRD Screen 3.1, prd.md line 481"}}
  - {"op": "add_node", "id": "REQ-018-092", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 3.2: Future-Only", "attrs": {"statement": "Future-Only: New rates apply only to bookings completed on/after the effective date; historical commissions are never recalculated", "rationale": "PRD Screen 3.2, prd.md line 507"}}
  - {"op": "add_node", "id": "REQ-018-093", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 3.2: Past Date Blocked", "attrs": {"statement": "Past Date Blocked: System rejects an effective date in the past with a clear error", "rationale": "PRD Screen 3.2, prd.md line 508"}}
  - {"op": "add_node", "id": "REQ-018-094", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 3.2: Notification", "attrs": {"statement": "Notification: System emails the affiliate the old rate, new rate, and effective date", "rationale": "PRD Screen 3.2, prd.md line 509"}}
  - {"op": "add_node", "id": "REQ-018-095", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 3.2: Audit", "attrs": {"statement": "Audit: Change is logged with admin user ID, timestamp, old and new values, and effective date", "rationale": "PRD Screen 3.2, prd.md line 510"}}
  - {"op": "add_node", "id": "REQ-018-096", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 3.3: Terminal State", "attrs": {"statement": "Terminal State: Sets `Status: Inactive`; this is a permanent end-of-partnership state, not a temporary hold", "rationale": "PRD Screen 3.3, prd.md line 535"}}
  - {"op": "add_node", "id": "REQ-018-097", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 3.3: Final Settlement", "attrs": {"statement": "Final Settlement: Net final balance ≥ $50 is queued for the next (or an admin-initiated final) payout; a residual below $50 is forfeited with an audit entry; a negative balance is written off with an audit entry (no future payouts exist to net against)", "rationale": "PRD Screen 3.3, prd.md line 536"}}
  - {"op": "add_node", "id": "REQ-018-098", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 3.3: Code Disablement", "attrs": {"statement": "Code Disablement: All of the affiliate's codes are disabled (invalid at checkout)", "rationale": "PRD Screen 3.3, prd.md line 537"}}
  - {"op": "add_node", "id": "REQ-018-099", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 3.3: Portal Access", "attrs": {"statement": "Portal Access: Affiliate retains read-only portal access (historical views only); no new activity is possible", "rationale": "PRD Screen 3.3, prd.md line 538"}}
  - {"op": "add_node", "id": "REQ-018-100", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 3.3: Data Retention", "attrs": {"statement": "Data Retention: Historical referrals, commissions, payouts, and audit trail are retained for the audit-retention period", "rationale": "PRD Screen 3.3, prd.md line 539"}}
  - {"op": "add_node", "id": "REQ-018-101", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 3.3: No Silent Reactivation", "attrs": {"statement": "No Silent Reactivation: An Inactive affiliate is not reinstated via Screen 3.1; resuming a partnership requires re-onboarding (new activation)", "rationale": "PRD Screen 3.3, prd.md line 540"}}
  - {"op": "add_node", "id": "REQ-018-102", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 3.3: Confirmation Gate", "attrs": {"statement": "Confirmation Gate: \"Submit\" is disabled until the reason is valid and the confirmation checkbox is checked", "rationale": "PRD Screen 3.3, prd.md line 541"}}
  - {"op": "add_node", "id": "REQ-018-103", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 4: Code Uniqueness", "attrs": {"statement": "Code Uniqueness: System validates discount code is unique across all affiliates (case-insensitive check)", "rationale": "PRD Screen 4, prd.md line 579"}}
  - {"op": "add_node", "id": "REQ-018-104", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 4: One Affiliate Per Code", "attrs": {"statement": "One Affiliate Per Code: Every affiliate-bound code belongs to exactly one affiliate; the same affiliate payout code cannot be assigned to multiple affiliates", "rationale": "PRD Screen 4, prd.md line 580"}}
  - {"op": "add_node", "id": "REQ-018-105", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 4: Bulk Generation", "attrs": {"statement": "Bulk Generation: Bulk generation creates one distinct unique code per selected affiliate using the same campaign settings", "rationale": "PRD Screen 4, prd.md line 581"}}
  - {"op": "add_node", "id": "REQ-018-106", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 4: Bulk Filter Snapshot", "attrs": {"statement": "Bulk Filter Snapshot: System records the selected affiliates at generation time; later filter membership changes do not retroactively add or remove codes", "rationale": "PRD Screen 4, prd.md line 582"}}
  - {"op": "add_node", "id": "REQ-018-107", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 4: Code Format", "attrs": {"statement": "Code Format: System automatically converts code to uppercase on save", "rationale": "PRD Screen 4, prd.md line 583"}}
  - {"op": "add_node", "id": "REQ-018-108", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 4: Expiration Logic", "attrs": {"statement": "Expiration Logic: If expiration date set, system automatically deactivates code at midnight (UTC) on that date", "rationale": "PRD Screen 4, prd.md line 584"}}
  - {"op": "add_node", "id": "REQ-018-109", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 4: Usage Limit", "attrs": {"statement": "Usage Limit: The usage cap counts \"completed\" (paid) redemptions only; once completed redemptions reach the maximum, the system automatically deactivates the code. \"Applied\" (entered-but-not-paid) events never consume the cap; a separate soft rate limit on applied events guards against application spam (Rule 13)", "rationale": "PRD Screen 4, prd.md line 585"}}
  - {"op": "add_node", "id": "REQ-018-110", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 4: Generation Outcome", "attrs": {"statement": "Generation Outcome: On submit, Selected Affiliates and Filtered Segment modes open Screen 4.1 (Code Generation Results) showing created/skipped/failed counts; Single mode confirms inline and routes to Screen 6", "rationale": "PRD Screen 4, prd.md line 586"}}
  - {"op": "add_node", "id": "REQ-018-111", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 4: Margin Guard (Rule 15)", "attrs": {"statement": "Margin Guard (Rule 15): System validates that the configured discount plus the affiliate's commission does not exceed Hairline's commission on the booking. Percentage configurations that breach the ceiling (`discount % + commission % > Hairline's commission %`) are blocked with the shortfall shown (override requires documented, audited business approval); fixed-amount configurations raise a review warning since the breach is booking-value dependent", "rationale": "PRD Screen 4, prd.md line 587"}}
  - {"op": "add_node", "id": "REQ-018-112", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 4: Dashboard Visibility", "attrs": {"statement": "Dashboard Visibility: Active issued codes appear in the assigned affiliate's dashboard immediately after creation; inactive, expired, or revoked codes remain visible in historical views with status labels", "rationale": "PRD Screen 4, prd.md line 588"}}
  - {"op": "add_node", "id": "REQ-018-113", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 4.1: No Duplicate Creation", "attrs": {"statement": "No Duplicate Creation: Retrying failed rows never re-creates already-successful codes", "rationale": "PRD Screen 4.1, prd.md line 625"}}
  - {"op": "add_node", "id": "REQ-018-114", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 4.1: Per-Row Reason", "attrs": {"statement": "Per-Row Reason: Each skipped/failed row records a specific reason (duplicate generated code, inactive affiliate, incomplete payout setup, FR-019 registration failure, notification failure)", "rationale": "PRD Screen 4.1, prd.md line 626"}}
  - {"op": "add_node", "id": "REQ-018-115", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 4.1: Idempotent Retry", "attrs": {"statement": "Idempotent Retry: \"Retry Failed Only\" re-runs generation for the failed subset under the same campaign settings and snapshot", "rationale": "PRD Screen 4.1, prd.md line 627"}}
  - {"op": "add_node", "id": "REQ-018-116", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 4.1: Export", "attrs": {"statement": "Export: Results downloadable as CSV for record-keeping", "rationale": "PRD Screen 4.1, prd.md line 628"}}
  - {"op": "add_node", "id": "REQ-018-117", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 5: System-Wide Scope", "attrs": {"statement": "System-Wide Scope: Lists codes across all affiliates, campaigns, and generation modes (single and bulk)", "rationale": "PRD Screen 5, prd.md line 666"}}
  - {"op": "add_node", "id": "REQ-018-118", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 5: Filtering", "attrs": {"statement": "Filtering: Filter by status, campaign, linked affiliate, discount type, application method, created date range; search by code text or campaign", "rationale": "PRD Screen 5, prd.md line 667"}}
  - {"op": "add_node", "id": "REQ-018-119", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 5: Pagination", "attrs": {"statement": "Pagination: Display 50 codes per page with pagination controls", "rationale": "PRD Screen 5, prd.md line 668"}}
  - {"op": "add_node", "id": "REQ-018-120", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 5: Bulk Actions", "attrs": {"statement": "Bulk Actions: Admin can multi-select codes to bulk activate/deactivate (subject to status rules)", "rationale": "PRD Screen 5, prd.md line 669"}}
  - {"op": "add_node", "id": "REQ-018-121", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 5: Read-Through Counts", "attrs": {"statement": "Read-Through Counts: Applied/completed and conversion stats are sourced from FR-019 redemption lifecycle", "rationale": "PRD Screen 5, prd.md line 671"}}
  - {"op": "add_node", "id": "REQ-018-122", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 6: One Affiliate", "attrs": {"statement": "One Affiliate: The linked affiliate is always exactly one; reassignment to another affiliate is not supported (create a new code instead)", "rationale": "PRD Screen 6, prd.md line 707"}}
  - {"op": "add_node", "id": "REQ-018-123", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 6: Editable Subset", "attrs": {"statement": "Editable Subset: Admin may edit expiration date, usage limits, and active/inactive status; discount value and linked affiliate are fixed after creation", "rationale": "PRD Screen 6, prd.md line 708"}}
  - {"op": "add_node", "id": "REQ-018-124", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 6: Lifecycle Source", "attrs": {"statement": "Lifecycle Source: Applied/completed/conversion and revenue/commission figures are read from FR-019 and commission calculation; this screen does not recompute them", "rationale": "PRD Screen 6, prd.md line 709"}}
  - {"op": "add_node", "id": "REQ-018-125", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 6: Status Transitions", "attrs": {"statement": "Status Transitions: Deactivation revokes checkout validity immediately; expired/revoked codes remain visible with status labels and cannot be copied as active codes", "rationale": "PRD Screen 6, prd.md line 710"}}
  - {"op": "add_node", "id": "REQ-018-126", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 7: Automated Generation", "attrs": {"statement": "Automated Generation: System automatically generates the payout list on the 7th of each month for the previous month's completed bookings and exposes the calculated amounts to FR-017 / A-05 for payout execution", "rationale": "PRD Screen 7, prd.md line 750"}}
  - {"op": "add_node", "id": "REQ-018-127", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 7: Overview Sub-view", "attrs": {"statement": "Overview Sub-view: Shows overall performance for the selected month (total owed, total paid, affiliate count, failed count) at the top", "rationale": "PRD Screen 7, prd.md line 751"}}
  - {"op": "add_node", "id": "REQ-018-128", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 7: Current Cycle Sub-view", "attrs": {"statement": "Current Cycle Sub-view: Current cycle list is read-only in FR-018; payout processing actions are performed in FR-017 Screen 6 (Affiliate Billing - Commission Payouts)", "rationale": "PRD Screen 7, prd.md line 752"}}
  - {"op": "add_node", "id": "REQ-018-129", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 7: Billing History Sub-view", "attrs": {"statement": "Billing History Sub-view: Permanent audit log of all payouts (affiliate, amount, date, transaction ID, final status) with full-text search, filter by affiliate/date/status, and CSV export; records retained for 7 years minimum", "rationale": "PRD Screen 7, prd.md line 754"}}
  - {"op": "add_node", "id": "REQ-018-130", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 7: Status Workflow", "attrs": {"statement": "Status Workflow: Pending → Processing (payment initiated by FR-017) → Paid (payment confirmed) OR Failed (payment error)", "rationale": "PRD Screen 7, prd.md line 755"}}
  - {"op": "add_node", "id": "REQ-018-131", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 7: Retry Logic", "attrs": {"statement": "Retry Logic: If a payout fails, retry is handled in FR-017 Screen 6; FR-018 displays the latest failed/retried status and failure reason", "rationale": "PRD Screen 7, prd.md line 756"}}
  - {"op": "add_node", "id": "REQ-018-132", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 8: Breakdown Integrity", "attrs": {"statement": "Breakdown Integrity: The included-bookings list must reconcile to the net commission amount (gross minus reversals/refunds)", "rationale": "PRD Screen 8, prd.md line 800"}}
  - {"op": "add_node", "id": "REQ-018-133", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 8: Receipt", "attrs": {"statement": "Receipt: \"Download Receipt\" generates a PDF receipt for the payout (affiliate records)", "rationale": "PRD Screen 8, prd.md line 802"}}
  - {"op": "add_node", "id": "REQ-018-134", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 9: Real-Time Updates", "attrs": {"statement": "Real-Time Updates: Portal data refreshes every 5 minutes (or on manual refresh)", "rationale": "PRD Screen 9, prd.md line 837"}}
  - {"op": "add_node", "id": "REQ-018-135", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 9: Referral Link", "attrs": {"statement": "Referral Link: The affiliate's unique referral link (auto-apply code URL) is available with a one-click copy action", "rationale": "PRD Screen 9, prd.md line 839"}}
  - {"op": "add_node", "id": "REQ-018-136", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 9.1: Payout Calculation", "attrs": {"statement": "Payout Calculation: \"Pending Payout\" includes commissions from completed bookings in previous month (not yet paid)", "rationale": "PRD Screen 9.1, prd.md line 872"}}
  - {"op": "add_node", "id": "REQ-018-137", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 9.1: Conversion Funnel", "attrs": {"statement": "Conversion Funnel: Overview shows the funnel Code Applied → Checkout Started → Payment Completed", "rationale": "PRD Screen 9.1, prd.md line 873"}}
  - {"op": "add_node", "id": "REQ-018-138", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 9.1: Monthly Breakdown", "attrs": {"statement": "Monthly Breakdown: Affiliate can toggle between \"All-Time\" and \"Current Month\"", "rationale": "PRD Screen 9.1, prd.md line 874"}}
  - {"op": "add_node", "id": "REQ-018-139", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 9.1: Export Report", "attrs": {"statement": "Export Report: Affiliate can download a performance report as PDF", "rationale": "PRD Screen 9.1, prd.md line 875"}}
  - {"op": "add_node", "id": "REQ-018-140", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 9.2: Issued Code Visibility", "attrs": {"statement": "Issued Code Visibility: All active codes generated for the affiliate through single or bulk admin actions appear here with campaign name, active window, and status", "rationale": "PRD Screen 9.2, prd.md line 927"}}
  - {"op": "add_node", "id": "REQ-018-141", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 9.2: Marketing Materials Access", "attrs": {"statement": "Marketing Materials Access: If a campaign has externally hosted marketing materials, affiliates can view/download those links from the relevant code detail. Asset creation, editing, approval, and hosting remain outside FR-018 scope.", "rationale": "PRD Screen 9.2, prd.md line 930"}}
  - {"op": "add_node", "id": "REQ-018-142", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 9.2: Sorting/Filtering", "attrs": {"statement": "Sorting/Filtering: Affiliate can sort by performance (revenue/commission) and filter by status (Active / Inactive / Expired / Revoked)", "rationale": "PRD Screen 9.2, prd.md line 931"}}
  - {"op": "add_node", "id": "REQ-018-143", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 9.3: Upcoming Payout", "attrs": {"statement": "Upcoming Payout: The next scheduled payout (amount, date, included bookings count) is shown at the top alongside the history list", "rationale": "PRD Screen 9.3, prd.md line 986"}}
  - {"op": "add_node", "id": "REQ-018-144", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 9.3: Minimum Threshold", "attrs": {"statement": "Minimum Threshold: When the pending amount is below the $50 minimum, the panel notes it will roll over to the next cycle (Payment Rule 3)", "rationale": "PRD Screen 9.3, prd.md line 987"}}
  - {"op": "add_node", "id": "REQ-018-145", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 9.3: Read-Only", "attrs": {"statement": "Read-Only: Affiliates view payout status only; processing is admin-side (Screen 7) and execution is via Stripe transfer", "rationale": "PRD Screen 9.3, prd.md line 988"}}
  - {"op": "add_node", "id": "REQ-018-146", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 9.3: Receipt", "attrs": {"statement": "Receipt: A PDF receipt is downloadable for each Paid payout", "rationale": "PRD Screen 9.3, prd.md line 990"}}
  - {"op": "add_node", "id": "REQ-018-147", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 9.4: Self-Service Edit", "attrs": {"statement": "Self-Service Edit: Affiliate may edit non-sensitive fields (phone, language) and manage their own account security (password, optional MFA — future / non-MVP, pending FR-026 / FR-031); changes sync to the admin view (Screen 2 / Screen 3)", "rationale": "PRD Screen 9.4, prd.md line 1040"}}
  - {"op": "add_node", "id": "REQ-018-148", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 9.4: Admin-Controlled Fields", "attrs": {"statement": "Admin-Controlled Fields: Name (legal/payout name used for attribution and Stripe transfers), email, country/region, affiliate type, tax/VAT ID, bank details, commission structure, payout schedule, and status are read-only to the affiliate and changed only by admins", "rationale": "PRD Screen 9.4, prd.md line 1041"}}
  - {"op": "add_node", "id": "REQ-018-149", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 9.4: Email Immutable", "attrs": {"statement": "Email Immutable: Contact email (login username) cannot be changed (a new account is required), consistent with admin Screen 2 rules", "rationale": "PRD Screen 9.4, prd.md line 1042"}}
  - {"op": "add_node", "id": "REQ-018-150", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 10: Token Handling", "attrs": {"statement": "Token Handling: One-time set-password link expires in 24 hours; generating a new link invalidates the previous one", "rationale": "PRD Screen 10, prd.md line 1062"}}
  - {"op": "add_node", "id": "REQ-018-151", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 10.1: On Success", "attrs": {"statement": "On Success: System saves the encrypted password, flips Status from \"Pending\" to \"Active\" and Activation Status to \"Active\" (per Rule 12), and redirects to the Affiliate Portal login (Screen 9)", "rationale": "PRD Screen 10.1, prd.md line 1090"}}
  - {"op": "add_node", "id": "REQ-018-152", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 10.1: Expired / Used Link", "attrs": {"statement": "Expired / Used Link: System shows an explanatory message and a link to request a new one (Screen 10.2)", "rationale": "PRD Screen 10.1, prd.md line 1091"}}
  - {"op": "add_node", "id": "REQ-018-153", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 10.1: Security", "attrs": {"statement": "Security: Password strength is enforced server-side; the email field is fixed (cannot be changed here)", "rationale": "PRD Screen 10.1, prd.md line 1092"}}
  - {"op": "add_node", "id": "REQ-018-154", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 10.2: Rate Limit", "attrs": {"statement": "Rate Limit: Maximum 3 resend requests per hour per email address", "rationale": "PRD Screen 10.2, prd.md line 1116"}}
  - {"op": "add_node", "id": "REQ-018-155", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 10.2: Generic Messaging", "attrs": {"statement": "Generic Messaging: System always shows \"If an account exists with this email, an activation link will be sent.\" regardless of whether the email exists or is already activated (does not reveal account existence)", "rationale": "PRD Screen 10.2, prd.md line 1118"}}
  - {"op": "add_node", "id": "REQ-018-156", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 10.2: Eligibility", "attrs": {"statement": "Eligibility: A link is only generated for accounts created but not yet activated (password not set)", "rationale": "PRD Screen 10.2, prd.md line 1119"}}
  - {"op": "add_node", "id": "REQ-018-157", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 10.3: Shown Once", "attrs": {"statement": "Shown Once: Displayed only at first login; afterwards the affiliate lands directly on Overview (Screen 9.1). It is dismissible.", "rationale": "PRD Screen 10.3, prd.md line 1147"}}
  - {"op": "add_node", "id": "REQ-018-158", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 10.3: Privacy", "attrs": {"statement": "Privacy: Only the affiliate's own codes, commission, and payout schedule are shown", "rationale": "PRD Screen 10.3, prd.md line 1149"}}
  - {"op": "add_node", "id": "REQ-018-159", "type": "Rule", "owner_fr": "FR-018", "title": "A1: Several discount codes under one affiliate account", "attrs": {"statement": "Single affiliate can promote multiple discount codes, all tracked under same affiliate account for commission calculation", "rationale": "PRD Alternative Flow A1, prd.md line 145"}}
  - {"op": "add_node", "id": "REQ-018-160", "type": "Rule", "owner_fr": "FR-018", "title": "A3: Affiliate sees full performance without admin intervention", "attrs": {"statement": "Affiliate has full visibility into performance metrics and earnings without admin intervention", "rationale": "PRD Alternative Flow A3, prd.md line 180"}}
  - {"op": "add_node", "id": "REQ-018-161", "type": "Rule", "owner_fr": "FR-018", "title": "A4: One campaign across many affiliates without a shared code", "attrs": {"statement": "Admin launches one campaign across many affiliates without creating a shared affiliate code; each affiliate receives their own trackable code under the same campaign settings", "rationale": "PRD Alternative Flow A4, prd.md line 202"}}
  - {"op": "add_node", "id": "REQ-018-162", "type": "Rule", "owner_fr": "FR-018", "title": "A5: Admin can resend activation from Affiliate Detail", "attrs": {"statement": "Admin can also resend the activation email from the Affiliate Detail screen (button: \"Resend Activation Email\"), mirroring FR-015", "rationale": "PRD Alternative Flow A5, prd.md line 222"}}
  - {"op": "add_node", "id": "REQ-018-163", "type": "Rule", "owner_fr": "FR-018", "title": "B1: Invalid code shows a message and tracks no referral", "attrs": {"statement": "System displays error message: \"This discount code is no longer valid. Please check the code or contact support.\"; Patient can proceed with checkout without discount OR enter different valid code; System does NOT track this as affiliate referral (no commission triggered)", "rationale": "PRD Alternative Flow B1, prd.md lines 234-236"}}
  - {"op": "add_node", "id": "REQ-018-164", "type": "Rule", "owner_fr": "FR-018", "title": "FR-018 exposes the payout cycle data and readiness status to FR-017 /...", "attrs": {"statement": "FR-018 exposes the payout cycle data and readiness status to FR-017 / A-05", "rationale": "PRD Alternative Flow B2, prd.md line 245"}}
  - {"op": "add_node", "id": "REQ-018-165", "type": "Rule", "owner_fr": "FR-018", "title": "System logs error with affiliate ID, amount, and error message", "attrs": {"statement": "System logs error with affiliate ID, amount, and error message", "rationale": "PRD Alternative Flow B2, prd.md line 248"}}
  - {"op": "add_node", "id": "REQ-018-166", "type": "Rule", "owner_fr": "FR-018", "title": "FR-017 marks payout as \"Failed\"; FR-018 displays the failed status in read-only...", "attrs": {"statement": "FR-017 marks payout as \"Failed\"; FR-018 displays the failed status in read-only payout views", "rationale": "PRD Alternative Flow B2, prd.md line 249"}}
  - {"op": "add_node", "id": "REQ-018-167", "type": "Rule", "owner_fr": "FR-018", "title": "System sends alert notification to admin team with failed payout details", "attrs": {"statement": "System sends alert notification to admin team with failed payout details", "rationale": "PRD Alternative Flow B2, prd.md line 250"}}
  - {"op": "add_node", "id": "REQ-018-168", "type": "Rule", "owner_fr": "FR-018", "title": "Admin manually triggers retry from FR-017 once payment details corrected", "attrs": {"statement": "Admin manually triggers retry from FR-017 once payment details corrected", "rationale": "PRD Alternative Flow B2, prd.md line 252"}}
  - {"op": "add_node", "id": "REQ-018-169", "type": "Rule", "owner_fr": "FR-018", "title": "System prompts admin for suspension reason (required field)", "attrs": {"statement": "System prompts admin for suspension reason (required field)", "rationale": "PRD Alternative Flow B3, prd.md line 262"}}
  - {"op": "add_node", "id": "REQ-018-170", "type": "Rule", "owner_fr": "FR-018", "title": "System retains historical data (referrals, commissions, payouts) but prevents new activity (audit...", "attrs": {"statement": "System retains historical data (referrals, commissions, payouts) but prevents new activity (audit trail retained 10 years; financial records 7 years minimum)", "rationale": "PRD Alternative Flow B3, prd.md line 267"}}
  - {"op": "add_node", "id": "REQ-018-171", "type": "Rule", "owner_fr": "FR-018", "title": "System displays a generation summary: created count, skipped count, and failed count", "attrs": {"statement": "System displays a generation summary: created count, skipped count, and failed count", "rationale": "PRD Alternative Flow B4, prd.md line 278"}}
  - {"op": "add_node", "id": "REQ-018-172", "type": "Rule", "owner_fr": "FR-018", "title": "System sends the affiliate an offboarding notification (with final-settlement outcome) and records...", "attrs": {"statement": "System sends the affiliate an offboarding notification (with final-settlement outcome) and records the action in the audit log", "rationale": "PRD Alternative Flow B5, prd.md line 299"}}
  - {"op": "add_node", "id": "REQ-018-173", "type": "Rule", "owner_fr": "FR-018", "title": "How does system handle duplicate discount codes across different affiliates? System validates...", "attrs": {"statement": "How does system handle duplicate discount codes across different affiliates? System validates uniqueness across ALL affiliates; if code exists, displays error \"Code already exists for affiliate [name]\".", "rationale": "PRD Edge Cases, prd.md line 1570"}}
  - {"op": "add_node", "id": "REQ-018-174", "type": "Rule", "owner_fr": "FR-018", "title": "What happens if admin tries to assign the same code to multiple...", "attrs": {"statement": "What happens if admin tries to assign the same code to multiple affiliates? System blocks the action and requires one unique code per affiliate, or redirects admin to create a non-attributed open marketing code in FR-019.", "rationale": "PRD Edge Cases, prd.md line 1571"}}
  - {"op": "add_node", "id": "REQ-018-175", "type": "Rule", "owner_fr": "FR-018", "title": "What occurs if patient applies affiliate code but cancels booking before payment?...", "attrs": {"statement": "What occurs if patient applies affiliate code but cancels booking before payment? System tracks code as \"applied\" but NOT \"completed\"; no commission credited to affiliate.", "rationale": "PRD Edge Cases, prd.md line 1573"}}
  - {"op": "add_node", "id": "REQ-018-176", "type": "Rule", "owner_fr": "FR-018", "title": "How does system handle booking refund after affiliate payout has been processed?...", "attrs": {"statement": "How does system handle booking refund after affiliate payout has been processed? System tracks negative balance for affiliate; deducts refunded commission from next payout (if next payout insufficient, carries negative balance forward).", "rationale": "PRD Edge Cases, prd.md line 1576"}}
  - {"op": "add_node", "id": "REQ-018-177", "type": "Rule", "owner_fr": "FR-018", "title": "What happens when a patient referred by an affiliate uses or receives...", "attrs": {"statement": "What happens when a patient referred by an affiliate uses or receives a higher-priority patient/provider discount code instead? The higher-priority discount controls the patient's final price under the one-discount rule, but the affiliate referral attribution is preserved internally if the affiliate-bound code/link was validly captured for the booking journey. When the booking completes with payment confirmation, affiliate commission and referral credit are still counted for that affiliate per Rule 11.", "rationale": "PRD Edge Cases, prd.md line 1580"}}
  - {"op": "add_node", "id": "REQ-018-178", "type": "Rule", "owner_fr": "FR-018", "title": "Module Scope: Provider Platform (PR-05)", "attrs": {"statement": "Provider Platform (PR-05): No direct provider interaction; providers see bookings with affiliate codes applied", "rationale": "PRD Module Scope, prd.md line 28"}}
  - {"op": "add_node", "id": "REQ-018-179", "type": "Rule", "owner_fr": "FR-018", "title": "Patients can enter affiliate discount codes during booking checkout", "attrs": {"statement": "Patients can enter affiliate discount codes during booking checkout", "rationale": "PRD Module Scope, prd.md line 37"}}
  - {"op": "add_node", "id": "REQ-018-180", "type": "Rule", "owner_fr": "FR-018", "title": "Booking confirmation shows affiliate discount applied (code name displayed)", "attrs": {"statement": "Booking confirmation shows affiliate discount applied (code name displayed)", "rationale": "PRD Module Scope, prd.md line 39"}}
  - {"op": "add_node", "id": "REQ-018-181", "type": "Rule", "owner_fr": "FR-018", "title": "Patients do NOT see affiliate commission structure or payout information", "attrs": {"statement": "Patients do NOT see affiliate commission structure or payout information", "rationale": "PRD Module Scope, prd.md line 40"}}
  - {"op": "add_node", "id": "REQ-018-182", "type": "Rule", "owner_fr": "FR-018", "title": "Providers see bookings with affiliate codes in their dashboard (read-only view)", "attrs": {"statement": "Providers see bookings with affiliate codes in their dashboard (read-only view)", "rationale": "PRD Module Scope, prd.md line 44"}}
  - {"op": "add_node", "id": "REQ-018-183", "type": "Rule", "owner_fr": "FR-018", "title": "Providers understand that affiliate discounts come from Hairline's commission (not their payout)", "attrs": {"statement": "Providers understand that affiliate discounts come from Hairline's commission (not their payout)", "rationale": "PRD Module Scope, prd.md line 45"}}
  - {"op": "add_node", "id": "REQ-018-184", "type": "Rule", "owner_fr": "FR-018", "title": "No provider action required for affiliate-referred bookings", "attrs": {"statement": "No provider action required for affiliate-referred bookings", "rationale": "PRD Module Scope, prd.md line 46"}}
  - {"op": "add_node", "id": "REQ-018-185", "type": "Rule", "owner_fr": "FR-018", "title": "Module Scope: Performance Tracking", "attrs": {"statement": "Performance Tracking: View real-time statistics on referral counts, booking conversions, revenue generated per affiliate", "rationale": "PRD Module Scope, prd.md line 52"}}
  - {"op": "add_node", "id": "REQ-018-186", "type": "Rule", "owner_fr": "FR-018", "title": "Module Scope: Reporting", "attrs": {"statement": "Reporting: Generate affiliate performance reports for analysis and optimization", "rationale": "PRD Module Scope, prd.md line 55"}}
  - {"op": "add_node", "id": "REQ-018-187", "type": "Rule", "owner_fr": "FR-018", "title": "Email notifications to affiliates when discount codes are created or updated", "attrs": {"statement": "Email notifications to affiliates when discount codes are created or updated", "rationale": "PRD Communication Structure, prd.md line 67"}}
  - {"op": "add_node", "id": "REQ-018-188", "type": "Rule", "owner_fr": "FR-018", "title": "Email notifications to affiliates when monthly payouts are processed", "attrs": {"statement": "Email notifications to affiliates when monthly payouts are processed", "rationale": "PRD Communication Structure, prd.md line 68"}}
  - {"op": "add_node", "id": "REQ-018-189", "type": "Rule", "owner_fr": "FR-018", "title": "Admin-to-affiliate communication via notes in admin dashboard (internal only)", "attrs": {"statement": "Admin-to-affiliate communication via notes in admin dashboard (internal only)", "rationale": "PRD Communication Structure, prd.md line 69"}}
  - {"op": "add_node", "id": "REQ-018-190", "type": "Rule", "owner_fr": "FR-018", "title": "System-generated payout confirmations with transaction breakdown", "attrs": {"statement": "System-generated payout confirmations with transaction breakdown", "rationale": "PRD Communication Structure, prd.md line 70"}}
  - {"op": "add_node", "id": "REQ-018-191", "type": "Rule", "owner_fr": "FR-018", "title": "Read-only access to externally hosted affiliate marketing materials (banners, templates, and campaign...", "attrs": {"statement": "Read-only access to externally hosted affiliate marketing materials (banners, templates, and campaign assets) from the affiliate portal", "rationale": "PRD Communication Structure, prd.md line 71"}}
  - {"op": "add_node", "id": "REQ-018-192", "type": "Rule", "owner_fr": "FR-018", "title": "Out of scope: patient-affiliate messaging, asset hosting, training calls", "attrs": {"statement": "Out of Scope: Direct messaging between patients and affiliates (handled outside platform); Marketing material creation or asset hosting (affiliates use externally hosted materials linked from the portal); Affiliate training or onboarding calls (manual process outside platform)", "rationale": "PRD Communication Structure, prd.md lines 75-77"}}
  - {"op": "add_node", "id": "REQ-018-193", "type": "Rule", "owner_fr": "FR-018", "title": "Entry points to affiliate management", "attrs": {"statement": "Entry Points: Admins access Affiliate Management section in admin dashboard to onboard new affiliates; Admins select affiliates manually or through filters, then generate one unique affiliate-bound promo code per selected affiliate; After the admin creates their account, affiliates complete a one-time activation link to set their password, then log into the dedicated affiliate portal to view their performance dashboard; Patients enter affiliate codes during booking checkout, triggering tracking and commission calculation; Automated monthly job generates payout reports on the 7th of each month (fixed schedule)", "rationale": "PRD Entry Points, prd.md lines 81-85"}}
  - {"op": "add_node", "id": "REQ-018-194", "type": "Rule", "owner_fr": "FR-018", "title": "System validates inputs (unique email, valid payment details format)", "attrs": {"statement": "System validates inputs (unique email, valid payment details format)", "rationale": "PRD Main Flow, prd.md line 106"}}
  - {"op": "add_node", "id": "REQ-018-195", "type": "Rule", "owner_fr": "FR-018", "title": "Generated unique affiliate ID", "attrs": {"statement": "Generated unique affiliate ID", "rationale": "PRD Main Flow, prd.md line 109"}}
  - {"op": "add_node", "id": "REQ-018-196", "type": "Rule", "owner_fr": "FR-018", "title": "Discount type: Hairline fees only (deducted from Hairline's commission)", "attrs": {"statement": "Discount type: Hairline fees only (deducted from Hairline's commission)", "rationale": "PRD Main Flow, prd.md line 115"}}
  - {"op": "add_node", "id": "REQ-018-197", "type": "Rule", "owner_fr": "FR-018", "title": "Affiliate clicks the \"Set Password\" link; system displays the password creation form...", "attrs": {"statement": "Affiliate clicks the \"Set Password\" link; system displays the password creation form (strong password required: min 12 chars, uppercase, lowercase, number, special char)", "rationale": "PRD Main Flow, prd.md line 129"}}
  - {"op": "add_node", "id": "REQ-018-198", "type": "Rule", "owner_fr": "FR-018", "title": "Affiliate sets and confirms password; system validates strength, saves the encrypted password...", "attrs": {"statement": "Affiliate sets and confirms password; system validates strength, saves the encrypted password, and redirects to the Affiliate Portal login", "rationale": "PRD Main Flow, prd.md line 130"}}
  - {"op": "add_node", "id": "REQ-018-199", "type": "Rule", "owner_fr": "FR-018", "title": "Affiliate logs in and lands on the Affiliate Portal (Overview tab), where...", "attrs": {"statement": "Affiliate logs in and lands on the Affiliate Portal (Overview tab), where assigned discount code(s), commission structure, and payout schedule are shown; affiliate can review real-time stats and complete non-sensitive fields on the Profile tab", "rationale": "PRD Main Flow, prd.md line 131"}}
  - {"op": "add_node", "id": "REQ-018-200", "type": "Rule", "owner_fr": "FR-018", "title": "Activation email content", "attrs": {"statement": "Activation email contains: System sends the activation email to the affiliate containing:; Welcome message and platform introduction; Secure one-time \"Set Password\" link (expires in 24 hours); The affiliate's contact email (used as the login username); Instructions for first login and profile completion", "rationale": "PRD Main Flow, prd.md lines 124-128"}}
  - {"op": "add_node", "id": "REQ-018-201", "type": "Rule", "owner_fr": "FR-018", "title": "Integration Points: Error handling", "attrs": {"statement": "Error handling: If validation service unavailable, allow checkout to proceed without discount (prevent checkout failure)", "rationale": "PRD Integration Points, prd.md line 1393"}}
  - {"op": "add_node", "id": "REQ-018-202", "type": "Rule", "owner_fr": "FR-018", "title": "Integration Points: Error handling", "attrs": {"statement": "Error handling: If FR-019 registration fails for a generated code, mark that affiliate row as failed and allow admin to retry without duplicating successful rows", "rationale": "PRD Integration Points, prd.md line 1398"}}
  - {"op": "add_node", "id": "REQ-018-203", "type": "Rule", "owner_fr": "FR-018", "title": "Integration Points: Error handling", "attrs": {"statement": "Error handling: If commission calculation fails, retry 3 times with exponential backoff; alert admin if all retries fail", "rationale": "PRD Integration Points, prd.md line 1403"}}
  - {"op": "add_node", "id": "REQ-018-204", "type": "Rule", "owner_fr": "FR-018", "title": "Security Considerations: Authorization", "attrs": {"statement": "Authorization: Role-based access control (RBAC): Affiliates view only their own data; Admins view all affiliate data", "rationale": "PRD Security Considerations, prd.md line 1421"}}
  - {"op": "add_node", "id": "REQ-018-205", "type": "Rule", "owner_fr": "FR-018", "title": "Security Considerations: Audit trail", "attrs": {"statement": "Audit trail: Log all access to affiliate payment details with timestamp, user ID, and IP address", "rationale": "PRD Security Considerations, prd.md line 1423"}}
  - {"op": "add_node", "id": "REQ-018-206", "type": "Rule", "owner_fr": "FR-018", "title": "Affiliates are vetted by Hairline; no self-service signup", "attrs": {"statement": "Assumption 1: Hairline will manually vet and approve affiliate partners before onboarding (no self-service affiliate signup)", "rationale": "PRD Assumptions, prd.md line 1370"}}
