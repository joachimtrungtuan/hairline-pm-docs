  - {"op": "add_field", "id": "ENT-monitoring-case.monitoring_period", "entity_id": "ENT-monitoring-case", "name": "monitoring_period", "data_type": "json", "title": "Monitoring period", "owner_fr": "FR-037", "required": false, "calculated_by": "REQ-037-057", "attrs": {"description": "First through final case date."}}
