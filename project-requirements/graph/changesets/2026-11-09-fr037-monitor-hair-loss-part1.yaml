  - {"op": "add_field", "id": "ENT-monitoring-case.initial_photos", "entity_id": "ENT-monitoring-case", "name": "initial_photos", "data_type": "media", "title": "Initial photos", "owner_fr": "FR-037", "required": false, "attrs": {"description": "Screen 1: FR-003 image limits."}}
