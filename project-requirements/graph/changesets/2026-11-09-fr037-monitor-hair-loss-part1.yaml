  # --- Entities
  - {"op": "add_node", "id": "ENT-monitoring-case", "type": "Entity", "owner_fr": "FR-037", "title": "Monitoring case", "attrs": {"description": "Key Entities 1 (MonitoringCase): one patient hair-loss monitoring case with its mode, status, dates, intake snapshot, creation-time cadence and conversion link. Shared with FR-038 through the case type; FR-037 owns it per its Key Entities."}}
  - {"op": "add_node", "id": "ENT-monitoring-entry", "type": "Entity", "owner_fr": "FR-037", "title": "Monitoring entry", "attrs": {"description": "Key Entities 2 (MonitoringEntry): patient-authored case log with log date, submission timestamp, severity, notes, photos, creator and version history."}}
  - {"op": "add_node", "id": "ENT-monitoring-scan", "type": "Entity", "owner_fr": "FR-037", "title": "Monitoring scan", "attrs": {"description": "Key Entities 3 (MonitoringScan): case and entry link, V1 photo-set media references, quality state and capture timestamp."}}
  - {"op": "add_node", "id": "ENT-monitoring-provider-assignment", "type": "Entity", "owner_fr": "FR-037", "title": "Monitoring provider assignment", "attrs": {"description": "Key Entities 4 (MonitoringProviderAssignment): case, provider, assignment type, status, dates, withdrawal reason and Admin actor."}}
  - {"op": "add_node", "id": "ENT-monitoring-advice-window", "type": "Entity", "owner_fr": "FR-037", "title": "Monitoring advice window", "attrs": {"description": "Key Entities 5 (MonitoringAdviceWindow): case, cadence snapshot, calculated start date, available, submitted or expired state, superseded-window link and linked advice record."}}
  - {"op": "add_node", "id": "ENT-monitoring-advice", "type": "Entity", "owner_fr": "FR-037", "title": "Monitoring advice", "attrs": {"description": "Key Entities 6 (MonitoringAdvice): separate provider-authored case-calendar record with assignment, advice-window key, paragraph, author, submission timestamp, edited state and immutable versions; no patient-log foreign-key ownership."}}
  - {"op": "add_node", "id": "ENT-monitoring-case-preview", "type": "Entity", "owner_fr": "FR-037", "title": "Monitoring case preview", "attrs": {"description": "Key Entities 7 (MonitoringCasePreview): Admin-shared read-only pre-assignment preview with candidate provider, dataset version, token digest, expiry, access events, revocation state and assignment-neutral outcome."}}
  - {"op": "add_node", "id": "ENT-monitoring-export", "type": "Entity", "owner_fr": "FR-037", "title": "Monitoring export", "attrs": {"description": "Key Entities 8 (MonitoringExport): case, report version, covered date range, metrics, PDF media reference and generation state."}}
  - {"op": "add_node", "id": "ENT-monitoring-conversion", "type": "Entity", "owner_fr": "FR-037", "title": "Monitoring conversion", "attrs": {"description": "Key Entities 9 (MonitoringConversion): source case, destination inquiry, selected scan, field mapping version, PDF export, provider-routing rule and idempotency key."}}
  - {"op": "add_node", "id": "ENT-monitoring-audit-entry", "type": "Entity", "owner_fr": "FR-037", "title": "Monitoring audit entry", "attrs": {"description": "Not in Key Entities. Added so Screens 13, 14A and 14B have a record to show: Admin correction audit and version history (before and after values, actor, reason, time) required by Admin Editability and the Screen 13/14A/14B Audit History and Version History fields."}}
  # --- Rules
  - {"op": "add_node", "id": "REQ-037-001", "type": "Rule", "owner_fr": "FR-037", "title": "One active hair-loss monitoring case per patient", "attrs": {"statement": "System MUST enforce one active hair-loss monitoring case per patient.", "rationale": "Restated by Business Rule 1 (one active case per monitoring type; the FR-038 non-blocking half is REQ-037-032), Screen 1 business rules (only one active case; a self-monitoring patient must complete the case before starting an advice-mode case) and the Business Workflows duplicate-creation gate. Also fixed in code per Admin Editability."}}
  - {"op": "add_node", "id": "REQ-037-002", "type": "Rule", "owner_fr": "FR-037", "title": "Mode chosen at activation and fixed for the case", "attrs": {"statement": "Patient MUST select self-monitoring or provider-advice mode before activation, and the mode MUST remain fixed for that case.", "rationale": "Restated by Business Rule 2, Screen 1 (Monitoring Mode immutable after activation; mode cannot change after activation), Communication Structure out of scope (no switching from self-monitoring to advice mode) and Admin Editability fixed in code."}}
  - {"op": "add_node", "id": "REQ-037-003", "type": "Rule", "owner_fr": "FR-037", "title": "Optional dated logs with severity, notes, photos and head scan", "attrs": {"statement": "System MUST provide optional dated logs with severity 1 to 10, notes, photos, and V1 head scan photo sets.", "rationale": "Restated by Screen 3 and the Executive Summary. Assumption: severity 1 means least severe and 10 most severe. The patient records optional entries on any date."}}
  - {"op": "add_node", "id": "REQ-037-004", "type": "Rule", "owner_fr": "FR-037", "title": "Logging allowed during pending assignment and reassignment", "attrs": {"statement": "System MUST allow logging during pending provider assignment and pending reassignment.", "rationale": "Restated by Business Rule 4, Screen 2 business rules, the Patient Platform scope and the Business Workflows (logging stays available in every assignment state)."}}
  - {"op": "add_node", "id": "REQ-037-005", "type": "Rule", "owner_fr": "FR-037", "title": "Advice mode requires the active Inquiry medical questionnaire", "attrs": {"statement": "Advice mode MUST require the active FR-025 Inquiry medical questionnaire before provider access.", "rationale": "Restated by Screen 1 (Medical Questionnaire conditional, required for provider advice mode), the Patient Platform scope and the Business Workflows medical gate (missing or invalid answers shown; patient completes before activation)."}}
  - {"op": "add_node", "id": "REQ-037-006", "type": "Rule", "owner_fr": "FR-037", "title": "Admin assigns advice providers; reassignment distinguished", "attrs": {"statement": "Admin MUST assign advice providers and clearly distinguish reassignment after withdrawal.", "rationale": "Restated by the Admin Platform scope (assigns an eligible provider, reassigns withdrawn cases, distinguishes first assignment from reassignment in queues and case history), Screens 8 and 12 (Assignment Type badge) and the assumption that Admin selects providers manually."}}
  - {"op": "add_node", "id": "REQ-037-007", "type": "Rule", "owner_fr": "FR-037", "title": "Provider withdrawal with reason ends access and returns case to Admin", "attrs": {"statement": "Provider MUST be able to withdraw with a reason, ending access and returning the case to Admin.", "rationale": "Restated by Screen 11 (mandatory reason 1 to 1000 characters, confirmation of immediate loss of access; withdrawal does not end the patient's case; case returns to Admin as Pending Reassignment labelled as a reassignment), Screen 8 (case leaves the queue immediately after confirmation) and the Business Workflows (Admin and patient notified)."}}
  - {"op": "add_node", "id": "REQ-037-008", "type": "Rule", "owner_fr": "FR-037", "title": "Global advice cadence weekly or bi-weekly, captured per case at creation", "attrs": {"statement": "System MUST enforce a single global Admin-configurable weekly or bi-weekly advice cadence. Each case MUST capture the active cadence at creation and keep it for the case lifetime; a cadence change MUST apply only to cases created after the change.", "rationale": "Restated by Business Rules 5 and 5a (minimum intervals of 7 or 14 days; one global value with no per-case, per-provider or per-patient override; the case keeps its creation-time cadence through reassignment; a patient with an active case gets the new cadence on the next case), Screen 13 Advice Cadence, Admin Editability (approved weekly and bi-weekly values only) and the Edge Cases (cadence change while a window is partly elapsed)."}}
  - {"op": "add_node", "id": "REQ-037-009", "type": "Rule", "owner_fr": "FR-037", "title": "Complete case and export a date-to-date PDF summary", "attrs": {"statement": "Patient MUST be able to complete the case and export a date-to-date PDF summary.", "rationale": "Restated by the Business Workflows (completion preview, then PDF with logs, severity summary, advice when applicable and scan photos) and Screens 5 and 6. The workflow names advice in the PDF; Screen 6 rules and REQ-037-023 do not (see the report)."}}
  - {"op": "add_node", "id": "REQ-037-010", "type": "Rule", "owner_fr": "FR-037", "title": "Convert an active case into a distinct FR-003 inquiry", "attrs": {"statement": "Patient MUST be able to convert an active case into a distinct FR-003 inquiry.", "rationale": "Restated by the Executive Summary, Business Rule 6 (a converted monitoring case remains distinct from the inquiry), Screen 5 and Screen 7."}}
  - {"op": "add_node", "id": "REQ-037-011", "type": "Rule", "owner_fr": "FR-037", "title": "Conversion starts with a read-only summary step", "attrs": {"statement": "Conversion MUST present a read-only summary step showing the monitoring recap, all carried-over data, the summary PDF, and remaining inquiry-only items before any editable inquiry form is opened, and leaving that step MUST NOT alter the monitoring case.", "rationale": "Restated by Screen 7 Step A business rules (Step A is read-only; no inquiry record exists yet; leaving Step A never completes, converts or alters the monitoring case)."}}
  - {"op": "add_node", "id": "REQ-037-012", "type": "Rule", "owner_fr": "FR-037", "title": "No reminders, cadence, milestones or overdue state", "attrs": {"statement": "System MUST NOT provide patient logging or scan reminders, cadence, milestones, or overdue/compliance state; those belong to the aftercare package, not to this self-service FR.", "rationale": "Restated by Business Rule 8, the Service Boundary table (cadence, scan reminders, overdue and compliance state, milestone entities are aftercare mechanics), the Communication Structure out of scope list (nudges, streaks, adherence notifications), Screen 2 (no daily frequency; missing dates neutral, never overdue) and the assumption that patients may log irregularly without penalty."}}
  - {"op": "add_node", "id": "REQ-037-013", "type": "Rule", "owner_fr": "FR-037", "title": "Advice window opens on start date, open until submitted or superseded", "attrs": {"statement": "Each advice window MUST open on its calculated start date and remain actionable without an ordinary deadline until its single advice is submitted or a successor window opens; a successor MUST expire only the older unsubmitted window and become the sole actionable window.", "rationale": "Restated by Business Rule 5b, Screen 10B (each window opens on its calculated start date; both windows stay visible with distinct states), Screen 9 Advice Window Summary, the Provider Platform scope and the Edge Cases (unsubmitted window expires when the next opens)."}}
  - {"op": "add_node", "id": "REQ-037-014", "type": "Rule", "owner_fr": "FR-037", "title": "Advice is a separate provider-authored calendar record", "attrs": {"statement": "Submitted provider advice MUST create a separate provider-authored case-calendar record and MUST NOT attach to or modify any patient log record.", "rationale": "Restated by Business Rule 5c, Screens 2, 10A, 10B, 13, 14A and 14B business rules and the Edge Cases (same-date log and advice show as two authored records). Admin sees both as separate record types."}}
  - {"op": "add_node", "id": "REQ-037-015", "type": "Rule", "owner_fr": "FR-037", "title": "Submitted advice editable with immutable versions and edited cue", "attrs": {"statement": "Provider MUST be able to edit submitted advice while the system preserves immutable versions and displays an edited cue plus latest-edit timestamp to patient, provider, and Admin users.", "rationale": "Restated by Business Rule 5c, Screen 10B (edit saves a new version; patient, Provider and Admin views show edited cue and latest-edit time), Screen 2 and the Business Workflows edit-advice step."}}
  - {"op": "add_node", "id": "REQ-037-016", "type": "Rule", "owner_fr": "FR-037", "title": "Provider and Admin lists: search, filters, sorting, pagination, Admin mode tabs", "attrs": {"statement": "Provider and Admin listing screens MUST support scoped search, filters, sorting, and pagination; the Admin list MUST provide separate All Cases, Self-Monitoring, and Provider Intervention tabs with operational case, activity, and assignment summaries.", "rationale": "Restated by Screen 8 (search by anonymized patient ID or case ID; search, filters, sorting and pagination compose without exposing cases assigned to another provider) and Screen 12 (mode tabs; counts and selected tab stay synchronized with filters; status, provider, advice-state and date filters)."}}
  - {"op": "add_node", "id": "REQ-037-017", "type": "Rule", "owner_fr": "FR-037", "title": "Case overviews with full dashboard and calendar; dedicated detail screens", "attrs": {"statement": "Provider and Admin case overviews MUST include the full patient-visible monitoring dashboard and calendar, while each patient daily log and provider-advice record MUST open in its dedicated role-specific detail screen with the authorized fields and actions defined in Screens 10A, 10B, 14A, and 14B.", "rationale": "Restated by Screens 9 and 13 (overview only; no inline expansion of a daily log or inline advice editing), Screens 10A, 10B, 14A and 14B, and Screen 13 (Admin sees every field and dated record in the patient view plus assignment, advice-window, audit, preview, export and conversion controls)."}}
  - {"op": "add_node", "id": "REQ-037-018", "type": "Rule", "owner_fr": "FR-037", "title": "Admin read-only pre-assignment preview link, revocable, expiry chosen at share time", "attrs": {"statement": "Admin MUST be able to generate and revoke a read-only pre-assignment case-preview link for a candidate provider, MUST select its expiry at share time, and preview access MUST NOT create an assignment or ongoing case access.", "rationale": "Restated by Business Rule 5d, Screen 12 (expiry chosen each time Share is used; read-only; scoped to the minimum information for an acceptance decision; audited; revocable; does not grant assignment access), the Business Workflows and the Edge Cases (preview revoked or expired without assignment; candidate opens a valid preview but is never assigned)."}}
  - {"op": "add_node", "id": "REQ-037-019", "type": "Rule", "owner_fr": "FR-037", "title": "No embedded chat for pre-assignment communication", "attrs": {"statement": "FR-037 MUST NOT add an embedded chat screen for pre-assignment communication; the preview link is shared through an existing external communication channel.", "rationale": "Restated by Business Rule 5d, the Communication Structure (in scope: link shared through an existing external channel; out of scope: FR-037 chat screen) and Screen 12 (Admin shares the link through an existing channel and records the eventual assignment decision on the screen)."}}
  - {"op": "add_node", "id": "REQ-037-020", "type": "Rule", "owner_fr": "FR-037", "title": "Submission timestamp stored; latest entry on a date sets that date's severity", "attrs": {"statement": "Every entry MUST store a submission timestamp, and derived severity for a date MUST use the latest-timestamped entry on that date.", "rationale": "Restated by Business Rule 9 and Screen 3 (earlier entries stay visible and auditable; latest timestamp supplies the date's severity for the trend, latest-severity and summary calculations)."}}
  - {"op": "add_node", "id": "REQ-037-021", "type": "Rule", "owner_fr": "FR-037", "title": "Conversion pre-fills compatible information; all copied fields editable", "attrs": {"statement": "Conversion MUST pre-fill compatible information and allow the patient to edit all copied fields.", "rationale": "Restated by the Executive Summary (the patient must not repeat information already supplied merely because they are changing services) and Screen 7 Step B (every copied field remains editable before submission)."}}
  - {"op": "add_node", "id": "REQ-037-022", "type": "Rule", "owner_fr": "FR-037", "title": "Conversion selects the latest valid scan by default", "attrs": {"statement": "Conversion MUST select the latest valid scan by default and allow another scan or retake.", "rationale": "Restated by the Business Workflows scan-choice step, Screen 7 Step B (Selected Head Scan) and the Edge Cases (latest scan fails quality validation; patient selects an earlier valid scan)."}}
  - {"op": "add_node", "id": "REQ-037-023", "type": "Rule", "owner_fr": "FR-037", "title": "Conversion attaches a generated summary PDF", "attrs": {"statement": "Conversion MUST attach a PDF containing logs, scan photos, logged-day count, and severity summary.", "rationale": "Restated by the Business Workflows (monitoring-summary PDF generated, then pre-fill), Screen 7 Steps A and B and the Integration Points note."}}
  - {"op": "add_node", "id": "REQ-037-024", "type": "Rule", "owner_fr": "FR-037", "title": "Previous monitoring history links to an inquiry only through conversion", "attrs": {"statement": "Previous monitoring history MUST link to the FR-003 inquiry only through conversion and MUST NOT be attached to a newly created monitoring case.", "rationale": "Restated by Business Rule 3 and Screen 1 business rules (a new monitoring case starts with its own intake; previous monitoring-case history is not attached to it)."}}
  - {"op": "add_node", "id": "REQ-037-025", "type": "Rule", "owner_fr": "FR-037", "title": "Patient, assigned provider and authorized Admin access only", "attrs": {"statement": "System MUST enforce patient, current assigned provider, and authorized Admin access boundaries.", "rationale": "Restated by Data and Privacy Rules (access limited to the patient, authorized Admin users and the currently assigned provider for advice-mode cases), the Provider Platform scope and Screen 4 (providers view scans only while assigned)."}}
  - {"op": "add_node", "id": "REQ-037-026", "type": "Rule", "owner_fr": "FR-037", "title": "Medical-data access, advice, preview, export, assignment, withdrawal and conversion audited", "attrs": {"statement": "System MUST audit all medical-data access, advice submissions and edits, preview-link creation/access/expiry/revocation, exports, assignments, withdrawals, and conversions.", "rationale": "Restated by Data and Privacy Rules (every view, export, edit, assignment, withdrawal and conversion of medical data is audited) and Screen 13 Audit History."}}
  - {"op": "add_node", "id": "REQ-037-027", "type": "Rule", "owner_fr": "FR-037", "title": "Admin edits keep version history and need a reason", "attrs": {"statement": "Admin edits MUST preserve version history and require a reason.", "rationale": "Restated by Admin Editability (edits require permission, a reason and version history; edits cannot delete audit evidence) and Screens 13, 14A and 14B (Edit Reason required before save; before and after values, actor, reason, time)."}}
  - {"op": "add_node", "id": "REQ-037-028", "type": "Rule", "owner_fr": "FR-037", "title": "Providers see only an anonymized patient identifier for the whole case", "attrs": {"statement": "Provider-facing FR-037 screens MUST show an anonymized patient identifier for the entire case lifetime and MUST NOT expose patient full name or contact details.", "rationale": "Restated by Data and Privacy Rules, Screen 9 (FR-037 advice involves no payment, so no de-anonymization trigger exists here; any later de-anonymization happens only in the FR-003/FR-004 flow created by conversion; Admin retains full identity visibility) and the Implementation Notes."}}
  - {"op": "add_node", "id": "REQ-037-029", "type": "Rule", "owner_fr": "FR-037", "title": "Exclusive routing to the assigned provider; decline falls back to normal distribution", "attrs": {"statement": "If an assigned advice provider exists at conversion, only that provider MUST initially be selected to quote. If that provider explicitly declines before quote creation, FR-003 MUST audit the reason, remove exclusive routing, and execute normal distribution exactly once. If no provider is assigned at conversion, FR-003 normal distribution MUST apply immediately. Expiry MUST remain governed by FR-003/FR-004 rather than this decline fallback.", "rationale": "Restated by Business Rule 7 (decline fallback needs no patient release action; expiry stays governed by FR-003/FR-004), Screen 7 Step B (exclusive provider is the only initial quote recipient; transition occurs on the resulting inquiry), Screen 7 Step A routing notice, the Business Workflows provider-route gate and the Edge Cases. Overlaps FR-003 and FR-004 rules (see the report)."}}
  - {"op": "add_node", "id": "REQ-037-030", "type": "Rule", "owner_fr": "FR-037", "title": "Monitoring stays active if submission fails; ends only on commit or completion", "attrs": {"statement": "Monitoring MUST remain active if FR-003 submission fails and MUST terminate only after successful conversion commit or explicit completion.", "rationale": "Restated by Business Rule 6 (completion and conversion are terminal outcomes), Screen 5 (conversion not committed until the FR-003 inquiry is submitted), Screen 7 Step A (leaving never alters the case) and the Edge Cases (exit before submission leaves monitoring active)."}}
  - {"op": "add_node", "id": "REQ-037-031", "type": "Rule", "owner_fr": "FR-037", "title": "Conversion is idempotent; no duplicate inquiries", "attrs": {"statement": "Conversion MUST be idempotent and MUST NOT create duplicate inquiries.", "rationale": "Restated by the Shared Services scope (idempotent transfer of compatible fields and attachments), Admin Editability (conversion identity and idempotency fixed in code), the Technology Assumptions (idempotency key) and the Edge Cases (retry after a network timeout)."}}
  - {"op": "add_node", "id": "REQ-037-032", "type": "Rule", "owner_fr": "FR-037", "title": "Active hair-loss case does not block an active FR-038 case", "attrs": {"statement": "A patient may have one active case per monitoring type; an active FR-037 case does not block an active FR-038 case.", "rationale": "Business Rule 1 (prd.md line 585); Internal Dependencies FR-038 (both reuse shared monitoring entities discriminated by case type)."}}
  - {"op": "add_node", "id": "REQ-037-033", "type": "Rule", "owner_fr": "FR-037", "title": "Starting monitoring with an active case opens it", "attrs": {"statement": "System blocks duplicate creation and opens the existing active case.", "rationale": "Business Workflows main flow, active-case gate (Duplicate step)."}}
  - {"op": "add_node", "id": "REQ-037-034", "type": "Rule", "owner_fr": "FR-037", "title": "Entry points to Monitor Your Hair Loss", "attrs": {"statement": "Patient selects Monitor Your Hair Loss from FR-003 Screen 1: Service Selection, opens the active case from the patient home/dashboard monitoring card, or opens conversion from the active case actions or from the completion flow. Provider opens Hair Loss Monitoring Advice from the provider dashboard. Admin opens Monitoring Cases or the pending assignment/reassignment queue.", "rationale": "Entry Points (five bullets, joined). Screen names are as written in the PRD."}}
  - {"op": "add_node", "id": "REQ-037-035", "type": "Rule", "owner_fr": "FR-037", "title": "Intake captures reusable concern information", "attrs": {"statement": "Hair-loss monitoring intake captures Nature of Concern (required, 1 to 2000 characters), Duration (required, FR-003 Duration enum with an identical value set so conversion copies without remapping), Previous Treatments or \"None\" (required, maximum 2000 characters), Current Severity (required, integer 1 to 10), Lifestyle Factors and Additional Notes (optional, maximum 2000 characters each), Initial Photos (optional, FR-003 image limits) and an Initial Head Scan (optional, FR-002 quality contract).", "rationale": "Assembled from the Screen 1 field table (prd.md lines 220-229); the PRD has no prose statement."}}
  - {"op": "add_node", "id": "REQ-037-036", "type": "Rule", "owner_fr": "FR-037", "title": "Advice-mode case activates as Pending Assignment and Admin is notified", "attrs": {"statement": "System activates the case as Pending Assignment and notifies Admin once the required medical answers are complete and valid.", "rationale": "Business Workflows medical gate and ActivateAdvice step; Executive Summary (advice-mode cases wait for Admin assignment while the patient continues logging)."}}
  - {"op": "add_node", "id": "REQ-037-037", "type": "Rule", "owner_fr": "FR-037", "title": "Self-monitoring case has no provider workflow", "attrs": {"statement": "No provider workflow is available for a self-monitoring case. Admin supports self-monitoring cases without adding a provider.", "rationale": "Business Workflows NoProvider step; Admin Platform scope; Provider Platform scope (does not manage self-monitoring cases); Communication Structure out of scope (provider advice for self-monitoring cases)."}}
  - {"op": "add_node", "id": "REQ-037-038", "type": "Rule", "owner_fr": "FR-037", "title": "Providers see only their assigned advice-mode cases", "attrs": {"statement": "Provider sees only advice-mode cases currently assigned to the provider. Self-monitoring and unassigned cases never appear in the provider queue.", "rationale": "Provider Platform scope; Screen 8 business rules."}}
  - {"op": "add_node", "id": "REQ-037-039", "type": "Rule", "owner_fr": "FR-037", "title": "Entry validation", "attrs": {"statement": "Log Date must not be in the future; Severity is an integer 1 to 10; Notes are at most 3000 characters; Photos follow the secure image limits; a Head Scan must meet the FR-002 quality contract.", "rationale": "Assembled from the Screen 3 field table (Validation Rules column); Admin Screen 14A repeats the 1 to 10 and 3000-character limits."}}
  - {"op": "add_node", "id": "REQ-037-040", "type": "Rule", "owner_fr": "FR-037", "title": "Patient edits and deletes own entries while active; all versions auditable", "attrs": {"statement": "The patient may create, edit, or delete their own entries while the case is active; all versions remain auditable.", "rationale": "Screen 3 business rules."}}
  - {"op": "add_node", "id": "REQ-037-041", "type": "Rule", "owner_fr": "FR-037", "title": "Multiple entries per date; logged days count a date once", "attrs": {"statement": "Multiple entries on one date are allowed, but Logged Days counts the date once.", "rationale": "Screen 3 business rules; Screen 2 Logged Days (unique dates with at least one entry)."}}
  - {"op": "add_node", "id": "REQ-037-042", "type": "Rule", "owner_fr": "FR-037", "title": "Calendar in patient-local time; authors and types distinguishable", "attrs": {"statement": "The monitoring calendar uses the patient-local timezone and shows patient logs, scans, and separate provider-advice entries so that the event author and type are distinguishable.", "rationale": "Screen 2 Calendar field; Screens 9 and 13 (provider and Admin calendars show the same dated events)."}}
  - {"op": "add_node", "id": "REQ-037-043", "type": "Rule", "owner_fr": "FR-037", "title": "Patient sees advice as its own entry; no reply; edited cue without prior versions", "attrs": {"statement": "Advice is shown chronologically as its own provider-authored calendar entry, never inside a patient log, and cannot be replied to as a chat thread. Edited advice shows a clear edited cue and latest-edit timestamp without exposing prior versions to the patient.", "rationale": "Screen 2 business rules; Provider Advice Detail is read-only to the patient."}}
  - {"op": "add_node", "id": "REQ-037-044", "type": "Rule", "owner_fr": "FR-037", "title": "Scan capture links to the log date; guidance, validation and retake", "attrs": {"statement": "Scan capture opens the head scan capture screen and links the resulting scan to the log date. The capture shows front, top, left, and right guidance, validates quality and completeness, and lets the patient retake a failed-quality scan before saving.", "rationale": "Screen 3 business rules; Screen 4 (Capture Guidance, Photo Set validation, retake rule)."}}
  - {"op": "add_node", "id": "REQ-037-045", "type": "Rule", "owner_fr": "FR-037", "title": "V1 head scan is a standardized multi-view photo set", "attrs": {"statement": "In V1, all references to a \"3D head scan\" mean the standardized multi-view head scan photo set defined by FR-002. True 3D reconstruction is not required in V1; true 3D capture and viewing remain V2 scope.", "rationale": "Executive Summary V1 scan terminology; Screen 4 business rules; Technology Assumptions."}}
  - {"op": "add_node", "id": "REQ-037-046", "type": "Rule", "owner_fr": "FR-037", "title": "Provider access ends immediately; scans visible only while assigned", "attrs": {"statement": "Provider access ends immediately on withdrawal, reassignment away, case completion, or conversion. Providers can view scans and media only while assigned to the advice case.", "rationale": "Data and Privacy Rules; Screen 4 business rules; Security Considerations (revoke provider media access when assignment ends)."}}
  - {"op": "add_node", "id": "REQ-037-047", "type": "Rule", "owner_fr": "FR-037", "title": "Monitoring data encrypted in transit and at rest", "attrs": {"statement": "Monitoring entries, medical answers, scans, advice, assignments, and exports are medical data and require encryption in transit and at rest.", "rationale": "Data and Privacy Rules."}}
  - {"op": "add_node", "id": "REQ-037-048", "type": "Rule", "owner_fr": "FR-037", "title": "Case records retained 7 years after completion or conversion", "attrs": {"statement": "Case records, entries, advice, assignment history, conversion provenance, and PDF exports are retained for 7 years after completion or conversion.", "rationale": "Data and Privacy Rules (prd.md line 605)."}}
  - {"op": "add_node", "id": "REQ-037-049", "type": "Rule", "owner_fr": "FR-037", "title": "Raw scan media retained 7 years", "attrs": {"statement": "Raw monitoring scan media is medical data and is retained for 7 years after completion or conversion, matching the medical-record retention minimum. No shorter raw-media lifecycle applies.", "rationale": "Data and Privacy Rules (prd.md line 606); Technical Considerations (cold storage may not delete earlier). Compare FR-003 REQ-003-040 (see the report)."}}
  - {"op": "add_node", "id": "REQ-037-050", "type": "Rule", "owner_fr": "FR-037", "title": "Generated PDF links expire and are authorization-checked", "attrs": {"statement": "Generated PDF links must be expiring, authorization-checked links.", "rationale": "Data and Privacy Rules; Screen 6 Download PDF (signed access link); Security Considerations (recheck authorization on every PDF request)."}}
  - {"op": "add_node", "id": "REQ-037-051", "type": "Rule", "owner_fr": "FR-037", "title": "Preview link token, expiry, revocation, approved dataset, event record", "attrs": {"statement": "Pre-assignment preview links must use an unguessable token, expire at the Admin-selected time, support revocation, expose only the approved preview dataset, and record creation, access, expiry, and revocation events.", "rationale": "Data and Privacy Rules."}}
  - {"op": "add_node", "id": "REQ-037-052", "type": "Rule", "owner_fr": "FR-037", "title": "End Monitoring previews the case and needs a confirmed choice", "attrs": {"statement": "End Monitoring shows the patient a preview of date range, logged-day count, scan count, and severity trend. The patient makes a single completion choice (complete and export, or Request Treatment) and selects a confirmation that acknowledges monitoring will end; declining returns to the active case.", "rationale": "Business Workflows completion preview and gate; Screen 5 field table (Completion Choice single selection; Confirmation must be selected)."}}
  - {"op": "add_node", "id": "REQ-037-053", "type": "Rule", "owner_fr": "FR-037", "title": "Completion or successful conversion ends the case and any advice assignment", "attrs": {"statement": "Completing or successfully converting ends the active case and any advice assignment.", "rationale": "Screen 5 business rules; Business Workflows Complete step."}}
  - {"op": "add_node", "id": "REQ-037-054", "type": "Rule", "owner_fr": "FR-037", "title": "Completed case is read-only except Admin audited correction", "attrs": {"statement": "A completed case is read-only except for Admin audited correction.", "rationale": "Screen 5 business rules."}}
  - {"op": "add_node", "id": "REQ-037-055", "type": "Rule", "owner_fr": "FR-037", "title": "PDF generated asynchronously, retained, retryable", "attrs": {"statement": "Summary PDFs are generated asynchronously and the generated artifact is retained; the patient is notified when the PDF is ready. A failed generation is retryable without altering the completed case.", "rationale": "Shared Services scope (asynchronous generation, retained artifact); Screen 6 business rules; Technology Assumptions (notify when ready); Edge Cases (generation fails after completion and succeeds on retry)."}}
  - {"op": "add_node", "id": "REQ-037-056", "type": "Rule", "owner_fr": "FR-037", "title": "PDF versioned and regenerated after Admin correction", "attrs": {"statement": "When Admin corrects a value after PDF generation, for example a severity value, the PDF is versioned and regenerated.", "rationale": "Edge Cases (last bullet); Key Entities MonitoringExport (report version)."}}
  - {"op": "add_node", "id": "REQ-037-057", "type": "Rule", "owner_fr": "FR-037", "title": "Monitoring summary values derived from valid entries", "attrs": {"statement": "Monitoring summary values are derived from valid entries: monitoring period (first through final case date), logged-day count, scan count, advice count when applicable, and severity first, latest, minimum, maximum, average, and trend.", "rationale": "Assembled from Screens 2, 5, 6 and 7 Step A (Derived columns); per-date severity follows REQ-037-020."}}
  - {"op": "add_node", "id": "REQ-037-058", "type": "Rule", "owner_fr": "FR-037", "title": "Conversion blocked while an FR-003 inquiry is active", "attrs": {"statement": "System blocks conversion when the patient already has an active FR-003 inquiry, explains the conflict, and preserves the active monitoring case.", "rationale": "Business Workflows inquiry gate."}}
  - {"op": "add_node", "id": "REQ-037-059", "type": "Rule", "owner_fr": "FR-037", "title": "Conversion summary shows PDF status; continue when ready or retry", "attrs": {"statement": "If PDF generation has not finished, the conversion summary step shows generation status and allows the patient to continue once it is ready or retry on failure.", "rationale": "Screen 7 Step A business rules."}}
  - {"op": "add_node", "id": "REQ-037-060", "type": "Rule", "owner_fr": "FR-037", "title": "Conversion summary states the provider routing", "attrs": {"statement": "The conversion summary step states, when an advice provider has an active assignment, that the assigned advice provider will be the only initial quote recipient.", "rationale": "Screen 7 Step A Provider Routing Notice field."}}
  - {"op": "add_node", "id": "REQ-037-061", "type": "Rule", "owner_fr": "FR-037", "title": "Patient answers only missing information and reconfirms medical answers", "attrs": {"statement": "The patient answers only missing or newly required information and reconfirms existing medical answers during conversion review.", "rationale": "Screen 7 Step B business rules and Medical Answers field."}}
  - {"op": "add_node", "id": "REQ-037-062", "type": "Rule", "owner_fr": "FR-037", "title": "Monitoring case and inquiry linked by immutable conversion provenance", "attrs": {"statement": "The monitoring case and the inquiry remain distinct records linked by immutable conversion provenance.", "rationale": "Screen 7 Step B business rules; Business Workflows CommitConversion step."}}
  - {"op": "add_node", "id": "REQ-037-063", "type": "Rule", "owner_fr": "FR-037", "title": "Conversion hands off to FR-003 screens for inquiry-only information", "attrs": {"statement": "Completing conversion review hands the patient into the standard FR-003 inquiry screens for the inquiry-only information (destinations, dates, provider selection rules, terms). FR-037 does not duplicate those screens; it supplies pre-filled values and the summary PDF to them.", "rationale": "Screen 7 Step B business rules and Inquiry-Only Handoff Target field."}}
  - {"op": "add_node", "id": "REQ-037-064", "type": "Rule", "owner_fr": "FR-037", "title": "Failed conversion preserves the case and the draft", "attrs": {"statement": "When FR-003 data is invalid or submission fails, System preserves the monitoring case and the conversion draft and shows corrections or a retry option.", "rationale": "Business Workflows PreserveDraft step."}}
  - {"op": "add_node", "id": "REQ-037-065", "type": "Rule", "owner_fr": "FR-037", "title": "FR-003 accepts the generated PDF as an additional document", "attrs": {"statement": "FR-003 must accept the system-generated monitoring-summary PDF as an additional document even if its ordinary patient upload UI remains image/video-only.", "rationale": "Integration Points (promoted from the technical section; the behaviour is FR-003's, stated here by the PRD)."}}
  - {"op": "add_node", "id": "REQ-037-066", "type": "Rule", "owner_fr": "FR-037", "title": "Withdrawal reasons hidden from other providers", "attrs": {"statement": "Withdrawal reasons are never exposed to another provider unless Admin includes an appropriate operational note.", "rationale": "Security Considerations (promoted from the technical section); Screen 11 (reason visible to Admin)."}}
  - {"op": "add_node", "id": "REQ-037-067", "type": "Rule", "owner_fr": "FR-037", "title": "Reassignment shows history to Admin and replacement provider", "attrs": {"statement": "Reassignment cases display the withdrawal reason and prior assignment history to Admin; the replacement provider receives the case history and the next eligible advice date.", "rationale": "Screen 12 business rules; Business Workflows Reassign and Replacement steps."}}
  - {"op": "add_node", "id": "REQ-037-068", "type": "Rule", "owner_fr": "FR-037", "title": "Assignment eligibility and Admin permissions validated before save", "attrs": {"statement": "Assignment eligibility and Admin permissions are validated before an assignment is saved.", "rationale": "Screen 12 business rules. The PRD does not define eligibility (see the report)."}}
  - {"op": "add_node", "id": "REQ-037-069", "type": "Rule", "owner_fr": "FR-037", "title": "Provider assigned at conversion assumed eligible", "attrs": {"statement": "The provider assigned at conversion is assumed eligible to receive the inquiry; otherwise Admin resolves eligibility before submission or the case follows the no-assigned-provider path.", "rationale": "Business Process Assumptions, promoted because it states a business path; Marking Unclear Requirements (provider eligibility to be validated in technical design)."}}
  - {"op": "add_node", "id": "REQ-037-070", "type": "Rule", "owner_fr": "FR-037", "title": "Admin mode tabs partition provider controls from self-monitoring rows", "attrs": {"statement": "The Admin mode tabs are a primary partition: provider-intervention controls and advice fields do not appear as applicable on self-monitoring rows, and tab counts stay synchronized with the filters.", "rationale": "Screen 12 business rules and Mode Tabs field."}}
  - {"op": "add_node", "id": "REQ-037-071", "type": "Rule", "owner_fr": "FR-037", "title": "Preview contents reviewed before sharing; contact and audit data excluded", "attrs": {"statement": "Admin must review the exact read-only case overview and clinical summary that a candidate provider will receive before sharing a preview; the preview excludes patient direct-contact details and Admin-only audit and assignment data.", "rationale": "Screen 12 Preview Contents field."}}
  - {"op": "add_node", "id": "REQ-037-072", "type": "Rule", "owner_fr": "FR-037", "title": "Admin may edit any case information; no edit erases history", "attrs": {"statement": "Admin may edit all patient-supplied monitoring information, logs, severity ratings, scan metadata, assignment state, advice records, conversion links, and status where operational correction is required, but no edit may erase historical values or provenance.", "rationale": "Admin Editability (Editable by Admin); Screen 13 business rules."}}
  - {"op": "add_node", "id": "REQ-037-073", "type": "Rule", "owner_fr": "FR-037", "title": "Fixed in code: encryption, authorization, audit, one case per type, mode, conversion identity", "attrs": {"statement": "Encryption, authorization, audit immutability, one-active-case-per-type enforcement, the rule that self mode cannot change mid-case, and FR-003 conversion identity and idempotency controls are fixed in code and not Admin-editable.", "rationale": "Admin Editability (Fixed in Codebase)."}}
  - {"op": "add_node", "id": "REQ-037-074", "type": "Rule", "owner_fr": "FR-037", "title": "Admin advice edits keep the provider as author and every prior version", "attrs": {"statement": "Admin edits to advice preserve the provider as original author, retain every prior version, and surface the edited cue and latest-edit timestamp.", "rationale": "Screen 14B business rules."}}
  - {"op": "add_node", "id": "REQ-037-075", "type": "Rule", "owner_fr": "FR-037", "title": "Advice is informational, one concise paragraph, no chat or consultation", "attrs": {"statement": "Advice is informational and must not be represented as diagnosis or prescription. It is one concise paragraph (maximum 1500 characters); FR-037 has no embedded chat, calls, diagnosis, prescriptions, or full medical consultation.", "rationale": "Screen 10B business rules and Advice Paragraph field; Communication Structure out of scope."}}
  - {"op": "add_node", "id": "REQ-037-076", "type": "Rule", "owner_fr": "FR-037", "title": "Provider cannot edit patient-authored data", "attrs": {"statement": "The provider cannot edit patient-authored monitoring data.", "rationale": "Screen 10A business rules."}}
  - {"op": "add_node", "id": "REQ-037-077", "type": "Rule", "owner_fr": "FR-037", "title": "Advice submit and edit need an active assignment", "attrs": {"statement": "Advice submit and edit actions require an active assignment.", "rationale": "Screen 10B (Advice Paragraph, Submit Advice and Edit Advice validation rules)."}}
  - {"op": "add_node", "id": "REQ-037-078", "type": "Rule", "owner_fr": "FR-037", "title": "Who is notified on assignment, withdrawal, replacement and advice", "attrs": {"statement": "The patient is notified when a provider is assigned, withdraws, is replaced, or posts advice; Provider and Admin are notified of assignment and reassignment actions.", "rationale": "Communication Structure in scope; Shared Services scope; Business Workflows."}}
  - {"op": "add_node", "id": "REQ-037-079", "type": "Rule", "owner_fr": "FR-037", "title": "FR-037 notification events; no logging or scan reminder", "attrs": {"statement": "FR-037 notifications are limited to assignment, reassignment, advice, withdrawal, completion, export-ready, and conversion events. FR-037 defines no patient-configurable logging or scan reminder.", "rationale": "Service Boundary closing paragraph; Integration Points (FR-020 event candidates)."}}
  - {"op": "add_node", "id": "REQ-037-080", "type": "Rule", "owner_fr": "FR-037", "title": "Add Log, Request Treatment and End Monitoring on active cases only", "attrs": {"statement": "Add Log, Request Treatment, and End Monitoring are available on active cases only.", "rationale": "Screen 2 field table (Validation Rules column)."}}
  - {"op": "add_node", "id": "REQ-037-081", "type": "Rule", "owner_fr": "FR-037", "title": "Advice availability states", "attrs": {"statement": "Advice availability is shown as a future start date, available since date, submitted, or expired-unsubmitted.", "rationale": "Screen 2 Advice Availability field; Screen 8 and Screen 12 advice filters."}}
  - {"op": "add_node", "id": "REQ-037-082", "type": "Rule", "owner_fr": "FR-037", "title": "List screens show derived activity values", "attrs": {"statement": "Provider and Admin lists show derived activity values: last patient log, logged-day count, latest severity, scan count, last advice, and next or current advice state.", "rationale": "Screen 8 (Last Patient Log, Advice Availability) and Screen 12 (Activity Summary)."}}
  - {"op": "add_node", "id": "REQ-037-083", "type": "Rule", "owner_fr": "FR-037", "title": "Provider advice is a limited free service", "attrs": {"statement": "Provider advice is a limited free service, not a full consultation; FR-037 advice involves no payment and has no payment event.", "rationale": "Business Process Assumptions; Screen 9 business rules; Data and Privacy Rules."}}
  - {"op": "add_node", "id": "REQ-037-084", "type": "Rule", "owner_fr": "FR-037", "title": "Self-service boundary: aftercare mechanics are not inherited", "attrs": {"statement": "FR-037 is a standalone, patient-driven self-service utility; it is not an aftercare package and must never inherit aftercare mechanics. An aftercare capability absent here is correct scope, not a defect.", "rationale": "Module Scope, Service Boundary (NON-NEGOTIABLE), including the care-team and milestone-entity rows."}}
  - {"op": "add_node", "id": "REQ-037-085", "type": "Rule", "owner_fr": "FR-037", "title": "Provider assignment lifecycle events are immutable", "attrs": {"statement": "Provider assignment lifecycle events are immutable.", "rationale": "Screen 13 Assignment History field (Validation Rules: Immutable events)."}}
