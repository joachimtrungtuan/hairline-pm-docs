  - {"op": "add_field", "id": "ENT-monitoring-case.medical_questionnaire_snapshot", "entity_id": "ENT-monitoring-case", "name": "medical_questionnaire_snapshot", "data_type": "json", "title": "Medical questionnaire answers", "owner_fr": "FR-037", "required": false, "attrs": {"description": "Screen 1: the active Inquiry-context questionnaire answers, required for provider advice mode (REQ-037-005)."}}
