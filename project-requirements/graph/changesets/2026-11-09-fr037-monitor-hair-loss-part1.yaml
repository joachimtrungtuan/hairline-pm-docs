  - {"op": "add_field", "id": "ENT-monitoring-case.advice_state", "entity_id": "ENT-monitoring-case", "name": "advice_state", "data_type": "enum", "title": "Provider advice state", "owner_fr": "FR-037", "required": false, "attrs": {"description": "Advice mode only: not requested, pending assignment, assigned, pending reassignment or ended (Screen 2 Provider Advice Status)."}}
  - {"op": "add_field", "id": "ENT-monitoring-case.nature_of_concern", "entity_id": "ENT-monitoring-case", "name": "nature_of_concern", "data_type": "text", "title": "Nature of concern", "owner_fr": "FR-037", "required": true, "attrs": {"description": "Screen 1: 1 to 2000 characters."}}
  - {"op": "add_field", "id": "ENT-monitoring-case.duration", "entity_id": "ENT-monitoring-case", "name": "duration", "data_type": "enum", "title": "Duration", "owner_fr": "FR-037", "required": true, "attrs": {"description": "Screen 1: the FR-003 Duration value set, identical so conversion copies without remapping. Enum values are not repeated here; the PRD says they are FR-003's."}}
  - {"op": "add_field", "id": "ENT-monitoring-case.previous_treatments", "entity_id": "ENT-monitoring-case", "name": "previous_treatments", "data_type": "text", "title": "Previous treatments", "owner_fr": "FR-037", "required": true, "attrs": {"description": "Screen 1: maximum 2000 characters, or None."}}
