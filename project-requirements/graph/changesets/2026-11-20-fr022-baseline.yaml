  # Statements that changed in the PRD
  - {"op": "update_node", "id": "REQ-022-070", "attrs": {"statement": "System MUST allow patients to search their messages inbox by provider name and message content and to filter it by read status (All, Unread, Read); this is the one statement for the inbox search and filter", "rationale": "Patient inbox search and filter, kept as the one statement for both (REQ-022-049 and REQ-022-050 merged into it). Screen criteria: Screen Specifications, FR-012 / Screen 1 (P1). Search inputs and filter controls are UI controls, not Fields; FR-022 owns the criteria (Maintenance Convention)."}}
  - {"op": "update_node", "id": "REQ-022-043", "attrs": {"statement": "System MUST allow providers to search and filter support cases by case ID, keywords, status, type, and date range (criteria owned by FR-032: REQ-032-106 and REQ-032-107)"}}
  - {"op": "update_node", "id": "REQ-022-058", "attrs": {"statement": "System MUST order any patient-facing price sort or price filter by each price converted to the patient's display currency at the current rate, for ordering and filtering only; each card carrying a quote MUST keep showing its own quote currency, and the price order MUST be labelled approximate when the listed items use more than one currency."}}
  - {"op": "update_node", "id": "REQ-022-026", "attrs": {"statement": "System MUST show providers only the Patient ID and a masked patient name in search results until the patient has confirmed payment; search itself stays by Patient ID only"}}
  - {"op": "update_node", "id": "REQ-022-124", "attrs": {"statement": "Search functionality MUST support fuzzy matching (e.g., \"Mark P\" matches \"Mark Patterson\"; \"Mehmet\" matches \"Mehmet Yilmaz\"; accent-insensitive matching, e.g., \"Jose\" matches \"José\")", "rationale": "General Module Rule 2. Restated by Edge Case 4 (accent-insensitive matching, José matches Jose). Refines REQ-022-007."}}
  - {"op": "update_node", "id": "REQ-022-127", "attrs": {"statement": "No user-facing search history is offered (no recent-searches list or saved searches); the admin audit log of admin searches stays (see Audit Rule)"}}
  - {"op": "update_node", "id": "REQ-022-131", "attrs": {"statement": "Provider visibility status: active providers appear in patient provider search, suspended do not. Admin can temporarily disable provider from patient provider search results (suspension) but cannot delete provider record."}}
  - {"op": "update_node", "id": "REQ-022-133", "attrs": {"statement": "Search query max length is fixed in codebase (not editable): 200 chars for admin, 200 chars for provider, 50 chars for patient, unless the screen states less."}}
  - {"op": "update_node", "id": "REQ-022-141", "attrs": {"statement": "Search performs accent-insensitive matching (José matches Jose).", "rationale": "Edge Case 4. Restates the accent-insensitive part of REQ-022-124."}}
  - {"op": "update_node", "id": "REQ-022-062", "attrs": {"statement": "When a search term or filter combination matches no records, the System displays 'No results found' with refinement guidance: check spelling or try different keywords; remove one or more filters. In patient provider discovery the System displays 'No providers found' with refinement guidance."}}
  - {"op": "update_node", "id": "REQ-022-079", "attrs": {"statement": "FR-014 / Screen 1: Provider Analytics Dashboard [P1 — MVP]. Provider filters analytics reports by date range and treatment type. Filters: Date Range (Type: Segmented + custom picker; Options: Today, This week, Last 4 weeks, Last 12 weeks, Custom; Default: Last 4 weeks; Logic: Single selection) / Treatment Type (Type: Multi-select; Options: All, FUE, FUT, DHI, Sapphire FUE, and other admin-defined types; Default: All; Logic: OR (within field)) / Benchmarks Toggle (Type: Toggle; Options: Show industry benchmarks overlay; Default: Off; Logic: Single flag). Notes: No search input on this screen — filtering only."}}
  - {"op": "update_node", "id": "REQ-022-081", "attrs": {"statement": "FR-032 / Screen 5: Help Centre [P1 — MVP]. Provider searches across Help Centre content from the main support landing page. Search: Search Bar (Type: text; Placeholder: Global Help Centre search; Max Length: 200 chars; Notes: Global search across all provider Help Centre content types (FAQs, articles, resources, and videos) with autocomplete suggestions). Notes: No additional filter controls on this landing screen — topic and content-specific filtering occurs in the relevant Help Centre sub-screens."}}
  - {"op": "update_node", "id": "REQ-022-085", "attrs": {"statement": "FR-012 / Screen 3: Provider Messages List [P1 — MVP]. Provider searches for and filters their patient conversations from the header messages list. Search: Patient name / inquiry or quote ID / message content (Type: text; Placeholder: \"Search messages…\"; Min Length: 2 chars; Debounce: 300ms; Notes: Filters the conversation list in real time; case-insensitive fuzzy match across patient name, inquiry/quote ID, and message content). Filters: Read Status (Type: Toggle; Options: All, Unread Only; Default: All; Logic: Exact match) / Date Range (Type: Dropdown; Options: Today, Last 7 days, Last 30 days, All; Default: All; Logic: Filters by activity date) / Service Type (Type: Dropdown; Options: All; options from service catalog; Default: All; Logic: Exact match)."}}
  - {"op": "update_node", "id": "REQ-022-089", "attrs": {"statement": "FR-005 / Screen 5: Quote Acceptance Table [P1 — MVP]. Admin filters the quote acceptance overview by acceptance status. Filters: Acceptance Status (Type: Multi-select; Options: Active, Booking Cancelled, Superseded — Provider Fault; Default: Active; Logic: OR (within field)). Notes: No search input on this screen — filtering only."}}
  - {"op": "update_node", "id": "REQ-022-115", "attrs": {"statement": "FR-031 / Screen 1 / Tab 2: Admin Users List [P1 — MVP]. Admin searches for and filters admin user accounts. Search: Name / email (Type: text; Placeholder: \"Search admin users…\"; Debounce: 300ms; Notes: Real-time filter; case-insensitive). Filters: Role (Type: Dropdown; Options: All Roles, Super Admin, Aftercare Specialist, Billing Staff, Support Staff; Default: All Roles; Logic: Exact match) / Status (Type: Multi-select; Options: All, Active, Suspended, Pending Invitation; Default: All; Logic: OR (within field))."}}
  - {"op": "update_node", "id": "REQ-022-123", "attrs": {"statement": "FR-034 / Screen 1: Support Center Dashboard [P1 — MVP]. Admin searches for and filters all support tickets from patients and providers. Search: Case ID / patient name / provider name / email / title keywords (Type: text; Placeholder: \"Search support cases…\"; Min Length: 3 chars; Debounce: 300ms; Notes: Real-time search across all listed fields). Filters: Status (Type: Multi-select; Options: Open, In Progress, Resolved, Closed; Default: Open + In Progress; Logic: OR (within field)) / Priority (Type: Multi-select; Options: High, Medium, Low; Default: All; Logic: OR (within field)) / Category (Type: Dropdown; Options: All; admin-defined ticket categories; Default: All; Logic: Exact match) / Ticket Source (Type: Dropdown; Options: All, Patient App, Provider App, Admin Portal; Default: All; Logic: Exact match) / Submitter Type (Type: Dropdown; Options: All, Patient, Provider; Default: All; Logic: Exact match) / Date Range (Type: Date range picker; Options: Custom; Default: Last 30 days; Logic: Filters by ticket creation date) / Assigned Admin (Type: Dropdown; Options: All; admin user list; Default: All; Logic: Exact match)."}}
  - {"op": "update_node", "id": "REQ-022-084", "attrs": {"statement": "FR-032 / Screen 1 / Tab 5: Reviews Tab [P1 — MVP]. Provider filters their patient reviews by star rating. Filters: Rating (Type: Multi-select star chips; Options: 5★, 4★, 3★, 2★, 1★; Default: All ratings; Logic: OR (within field)) / Sort (Type: Dropdown; Options: Most recent, Highest rated, Lowest rated, Oldest first; Default: Most recent; Logic: Single selection). Notes: No search input on this screen — filtering only. Filter and sort selections on this screen persist for the session."}}
  - {"op": "update_node", "id": "REQ-022-122", "attrs": {"statement": "FR-012 / Screen 5: Communication Monitoring Center [P1 — MVP]. Admin searches for and filters all platform conversations for oversight and support. Search: Patient / provider / keyword / inquiry ID (Type: text; Placeholder: \"Search conversations…\"; Min Length: 2 chars; Debounce: 300ms; Notes: Searches across all four fields simultaneously). Filters: Patient (Type: Autocomplete; Options: Matching patient names; Default: None; Logic: Exact selection) / Provider (Type: Autocomplete; Options: Matching provider names; Default: None; Logic: Exact selection) / Service Type (Type: Multi-select; Options: All; platform-defined service types; Default: All; Logic: OR (within field)) / Quote ID (text (optional); \"Filter by quote ID…\"; —; Optional exact match) / Inquiry ID (text (optional); \"Filter by inquiry ID…\"; —; Optional exact match) / Date Range (Type: Date range picker + presets; Options: Custom; Today, Last 7 days, Last 30 days, All; Default: All; Logic: Filters by message date) / Flag Type (Type: Multi-select; Options: Keyword Flagged, Manually Flagged, Intervened, No Flags; Default: All; Logic: OR (within field)) / Conversation Status (Type: Multi-select; Options: Active, Resolved, Escalated; Default: All; Logic: OR (within field)). Active filters combine, and the filters are remembered."}}
