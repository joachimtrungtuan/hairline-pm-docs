# Backlog points settled for FR-029: refund base, alert-and-retry, one global split record, caller authentication, rate-protection quiet period, rate entity description.
reason: "Filing fixes from the 2026-11-25 backlog settlement: statements widened to what the PRD and FR-007B already say."
by: controller
source_id: SRC-PRD-029
operations:
  - {"op": "update_node", "id": "REQ-029-110", "attrs": {"statement": "Refund Rule: Refunds on a cancelled booking follow the refund ladder set on Screen 7 and locked at booking confirmation: the refund percentage depends on how many days before the procedure date the booking is cancelled. The launch default is more than 30 days, 90 percent; 15 to 30 days, 50 percent; under 15 days, 0 percent. It is one global setting that FR-006, FR-007, FR-007B and FR-017 read; each provider's own cancellation terms do not replace it. The refund is that percentage of the amount the patient has paid so far, excluding late fees (FR-007B REQ-007B-022; FR-006 and FR-007 compute it)"}}
  - {"op": "update_node", "id": "REQ-029-102", "attrs": {"statement": "Rule 4: System must gracefully handle payment processing when configuration data is unavailable (use last known good configuration, alert the admin, and retry with exponential backoff)"}}
  - {"op": "update_node", "id": "REQ-029-017", "attrs": {"statement": "System MUST allow admins to enable or disable split payment (installment) feature globally. The split payment configuration is one global record: there are no tiers and no separate installment plan by booking amount or by region"}}
  - {"op": "update_node", "id": "REQ-029-033", "attrs": {"statement": "System MUST provide RESTful API for Payment Processing Service to query payment configuration (Stripe accounts, currency pair effective rates, deposit rates, effective commission settings, installment rules), and the calling service MUST authenticate with API keys or mutual TLS"}}
  - {"op": "update_node", "id": "REQ-029-155", "attrs": {"statement": "System MUST let an admin acknowledge a pair's rate-protection warning on Screen 2B, log the acknowledgement, and clear the warning only by that action; afterwards the pair is compared with the rate at that moment until the change against the rate 24 hours earlier is again within the threshold. No comparison runs for 24 hours after a pair is created or switched between manual and auto-fetch mode."}}
  - {"op": "update_node", "id": "ENT-currency-exchange-rate", "attrs": {"description": "Currency Exchange Rate: one fetched rate per currency pair per day (`date`, `base_currency`, `target_currency`, `exchange_rate`, `fetched_at`). FR-029 owns this entity (moved in from FR-014); FR-014 reads the daily rates and does not define the entity."}}
