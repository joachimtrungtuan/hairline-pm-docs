  - {"op": "update_node", "id": "REQ-016-016", "title": "Process patient data deletion requests by anonymization and archival", "attrs": {"statement": "System MUST process patient data deletion requests (GDPR) via anonymization + archival workflow, retaining compliance records (retention follows the system PRD, Platform-Wide Rules: One 10-year retention period)", "rationale": "Stated in prd.md, Functional Requirements Summary, Data Governance Requirements."}}
  - {"op": "update_node", "id": "REQ-016-020", "title": "Require enhanced confirmation + justification for high-impact actions", "attrs": {"statement": "System MUST require enhanced confirmation + justification for high-impact actions (account suspension of any duration, refunds exceeding $1,000, manual booking modifications during active treatment, bulk patient notifications, patient data deletion for GDPR requests) even when the admin holds the FR-031 permission for the action", "rationale": "Stated in prd.md, Functional Requirements Summary, Security & Privacy Requirements; same list as General Module Rule 4 and Admin Editability Rules, High-Impact Actions."}}
