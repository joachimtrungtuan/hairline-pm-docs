  - {"op": "update_node", "id": "REQ-016-027", "title": "Notify the patient when an admin action affects them", "attrs": {"statement": "System MUST notify the patient when an admin takes an action that affects them; delivery follows the FR-020 notification service Rule", "rationale": "Stated in prd.md, Functional Requirements Summary, Integration Requirements."}}
  - {"op": "update_node", "id": "REQ-016-061", "title": "Admin starts the deletion workflow when no obligations exist", "attrs": {"statement": "If no obligations, admin initiates data deletion workflow:; Mark account for anonymization; Remove PII (name, email, phone, address); Retain anonymized medical records and archive transaction history (retention follows the system PRD, Platform-Wide Rules: One 10-year retention period)", "rationale": "Stated in prd.md, Alternative Flows, patient data deletion request."}}
  - {"op": "update_node", "id": "REQ-016-069", "title": "Admins may edit questionnaire responses with a logged reason; scans stay unchanged", "attrs": {"statement": "Admins MAY edit a patient's medical questionnaire responses and alerts (FR-003 admin edit capability), but only with a typed reason that is logged in the audit trail with the edit. Patient scans MUST NOT be modified by admins; scan media is immutable except by patients", "rationale": "Stated in prd.md, Business Rules, General Module Rule 2."}}
  - {"op": "update_node", "id": "REQ-016-097", "title": "No inline editing on the patient list; Edit Patient only", "attrs": {"statement": "No inline editing on the patient list: patient profile fields are changed only through the \"Edit Patient\" button on the Overview tab, with justification and audit logging", "rationale": "Stated in prd.md, Screen 1: Patient List View (Notes)."}}
  - {"op": "update_node", "id": "REQ-016-130", "title": "Compliance note on the Medical Data tab follows the platform retention period", "attrs": {"statement": "Compliance note: \"Data retained per the platform retention period\" (retention follows the system PRD, Platform-Wide Rules: One 10-year retention period)", "rationale": "Stated in prd.md, Screen 4: Patient Detail View - Medical Data Tab (compliance note)."}}
  - {"op": "update_node", "id": "REQ-016-169", "title": "Deletion requests queue lists FR-023 requests and records the admin review", "attrs": {"statement": "This screen is a queue for deletion requests initiated by patients; the one deletion request record and its lifecycle are owned by FR-023, and this screen only lists the requests and records the admin's review", "rationale": "Stated in prd.md, Screen 8: Patient Deletion Requests List (GDPR), Business Rules."}}
  - {"op": "update_node", "id": "REQ-016-170", "title": "Admin may contact the patient before approving a deletion request", "attrs": {"statement": "Admin may contact the patient (call/email) for additional confirmation before approving", "rationale": "Stated in prd.md, Screen 8: Patient Deletion Requests List (GDPR), Business Rules."}}
  - {"op": "update_node", "id": "REQ-016-183", "title": "Account status filter: Active, Suspended, Deactivated, Locked", "attrs": {"statement": "Account status filter: Filter by account status; Options: Active, Suspended, Deactivated, Locked", "rationale": "Stated in prd.md, Screen 1: Patient List View, Account Status Filter row."}}
  - {"op": "update_node", "id": "REQ-016-186", "title": "Deletion requests default filter is Pending Admin Review", "attrs": {"statement": "Deletion requests default filter: Status = Pending Admin Review; the Status filter also offers Verification Required", "rationale": "Stated in prd.md, Screen 8: Patient Deletion Requests List (GDPR), Filters row."}}
