  - {"op": "add_node", "id": "REQ-028-003", "type": "Rule", "owner_fr": "FR-028", "title": "Regional grouping applied to the patient destination list by patient location", "attrs": {"statement": "System MUST apply regional grouping to patient destination list based on patient's location from profile or IP geolocation", "rationale": "Restated by Patient Entry Point (94-99) and Main Flow: Patient Views Personalized Location Recommendations, steps 2-6 (281-290). The patient screen is FR-003 Screen 2 (SCR-003-02). Overlaps REQ-003-032."}}
  - {"op": "add_node", "id": "REQ-028-004", "type": "Rule", "owner_fr": "FR-028", "title": "Starting price in the patient's currency, else the location's default currency converted", "attrs": {"statement": "System MUST display starting prices in patient's preferred currency, falling back to location's default currency with conversion if specific currency not configured", "rationale": "Restated by Main Flow step 7 (291-296), A6 (316-325) and the second edge case (748). The lookup order is REQ-028-039 and REQ-028-040. Overlaps REQ-003-033."}}
  - {"op": "add_node", "id": "REQ-028-005", "type": "Rule", "owner_fr": "FR-028", "title": "Configuration changes reach patient APIs within 1 minute by cache invalidation", "attrs": {"statement": "System MUST propagate configuration changes to patient-facing APIs within 1 minute via cache invalidation", "rationale": "Restated by Communication Structure (78), Entry Points (92), Main Flow step 10-11 (127-128), Screen 1 Cache Propagation (353), General Module Rule 4 (459: cache TTL = 60 seconds) and SC-009, SC-013. The system clears the location presentation cache on every save (step 10, A1 step 6, A2 step 4)."}}
  - {"op": "add_node", "id": "REQ-028-006", "type": "Rule", "owner_fr": "FR-028", "title": "A country belongs to at most one regional grouping, enforced at configuration time", "attrs": {"statement": "System MUST prevent overlapping regional groupings by enforcing one-to-one mapping between country and regional grouping at configuration time", "rationale": "Restated by General Module Rule 1 (456: groupings MUST NOT overlap; blocks saves that would assign a country to two groupings), Main Flow step 4 (117-118), Screen 1 Unique Membership (351), the first edge case (746), SC-010 and the Change Log entry that removed overlapping-grouping priority logic (819). The error text is REQ-028-021."}}
  - {"op": "add_node", "id": "REQ-028-007", "type": "Rule", "owner_fr": "FR-028", "title": "Fallback pricing when the patient's currency is not configured", "attrs": {"statement": "System MUST support fallback pricing for locations when patient's specific currency is not configured", "rationale": "Restated by Screen 2 Fallback Priority (391: fallback prices apply when the patient's location-currency combination is not configured), A3 (217-228), A5 (306-314) and User Story 3 (694-706). Configuration steps are REQ-028-056."}}
  - {"op": "add_node", "id": "REQ-028-008", "type": "Rule", "owner_fr": "FR-028", "title": "Admin previews configuration before saving", "attrs": {"statement": "System MUST allow admins to preview how configurations will appear to patients from different regions before saving", "rationale": "Restated by Screen 2 Preview Mode (394), Screen 3 (419-448: Test Mode toggle) and User Story 5 (727-740: preview of unsaved changes, then Save and Apply turns the panel into Live Configuration)."}}
  - {"op": "add_node", "id": "REQ-028-009", "type": "Rule", "owner_fr": "FR-028", "title": "Regional grouping stored with name, country list, location order and status", "attrs": {"statement": "System MUST store regional grouping configuration with grouping name, country list, location ordering, and status (active/inactive)", "rationale": "Restated by Key Entities, Entity 1 (800-802) and Screen 1 data fields (337-347)."}}
  - {"op": "add_node", "id": "REQ-028-010", "type": "Rule", "owner_fr": "FR-028", "title": "Starting price stored with location, currency, amount, dates and fallback flag", "attrs": {"statement": "System MUST store starting price configuration with location, currency, amount, effective date, expiry date, and fallback flag", "rationale": "Restated by Key Entities, Entity 2 (804-806) and Screen 2 data fields (373-384)."}}
  - {"op": "add_node", "id": "REQ-028-011", "type": "Rule", "owner_fr": "FR-028", "title": "Audit trail of every configuration change", "attrs": {"statement": "System MUST maintain audit trail of all configuration changes with admin user, timestamp, change reason, and change details", "rationale": "Restated by Data & Privacy Audit Rule (469), Main Flow step 12 (129) and 12 (213), Screen 1 Audit Trail (354: added/removed countries, reordered locations), Key Entities Entity 3 (808-810) and User Story 1 scenario 5 (671: admin views the audit log)."}}
  - {"op": "add_node", "id": "REQ-028-012", "type": "Rule", "owner_fr": "FR-028", "title": "Pricing history retained 3 years", "attrs": {"statement": "System MUST retain pricing history for 3 years for trend analysis and compliance audit", "rationale": "Stated only here (780). Contradicted by the Retention Rule (470), which keeps pricing history for 10 years; see REQ-028-064. Both kept as written, conflict raised as a question."}}
  - {"op": "add_node", "id": "REQ-028-013", "type": "Rule", "owner_fr": "FR-028", "title": "Regional configuration restricted to admins with the System Configuration role", "attrs": {"statement": "System MUST restrict regional configuration and pricing management to admin users with \"System Configuration\" role (per FR-031)", "rationale": "Restated by Entry Points (91), Internal Dependencies FR-031 (558-560) and Security Considerations Authentication and Authorization (645-646: read-only roles cannot modify regional groupings or pricing)."}}
  - {"op": "add_node", "id": "REQ-028-014", "type": "Rule", "owner_fr": "FR-028", "title": "Configuration changes logged with user id, timestamp, IP address, reason and details", "attrs": {"statement": "System MUST log all configuration changes with admin user ID, timestamp, IP address, change reason, and full change details for audit trail", "rationale": "Restated by Security Considerations Audit Trail (648: old value to new value). Extends REQ-028-011 with admin user ID and IP address."}}
  - {"op": "add_node", "id": "REQ-028-015", "type": "Rule", "owner_fr": "FR-028", "title": "All admin inputs validated server-side", "attrs": {"statement": "System MUST validate all admin inputs server-side (country codes, currency codes, positive pricing amounts) to prevent invalid configurations", "rationale": "Restated by Security Considerations Input Validation (649)."}}
  - {"op": "add_node", "id": "REQ-028-016", "type": "Rule", "owner_fr": "FR-028", "title": "Admin configuration API rate-limited to 100 requests per minute per admin", "attrs": {"statement": "System MUST rate-limit admin configuration API to 100 requests/minute per admin user to prevent abuse", "rationale": "Restated by Security Considerations Rate Limiting (650)."}}
  - {"op": "add_node", "id": "REQ-028-017", "type": "Rule", "owner_fr": "FR-028", "title": "Country selection uses the FR-026 country list", "attrs": {"statement": "System MUST integrate with FR-026 country list API for country selection in regional grouping configuration", "rationale": "Restated by Internal Dependencies FR-026 (542-544), Data Dependencies Entity 2 (572-574) and Integration 3 (630-633)."}}
  - {"op": "add_node", "id": "REQ-028-018", "type": "Rule", "owner_fr": "FR-028", "title": "Currency validation and conversion rates come from FR-029", "attrs": {"statement": "System MUST integrate with FR-029 currency API for currency validation and conversion rate retrieval", "rationale": "Restated by Internal Dependencies FR-029 (554-556), Data Dependencies Entity 3 (576-578) and External Dependencies (564)."}}
  - {"op": "add_node", "id": "REQ-028-019", "type": "Rule", "owner_fr": "FR-028", "title": "REST API gives patient apps location order and starting prices", "attrs": {"statement": "System MUST provide REST API for patient apps to fetch regional configuration (location ordering + starting prices) based on patient location and currency", "rationale": "Restated by Integration 1 (620-623)."}}
  - {"op": "add_node", "id": "REQ-028-020", "type": "Rule", "owner_fr": "FR-028", "title": "Admin configuration API with role-based access control", "attrs": {"statement": "System MUST expose admin configuration API for CRUD operations on regional groupings and starting prices with role-based access control", "rationale": "Restated by Integration 2 (625-628) and Security Considerations Authorization (646)."}}
  - {"op": "add_node", "id": "REQ-028-021", "type": "Rule", "owner_fr": "FR-028", "title": "Conflicting country assignment blocked with the conflicting groupings listed", "attrs": {"statement": "System MUST block selection or save of a country that already belongs to another regional grouping and MUST show the error \"Each country can only belong to one regional grouping. Remove it from the other grouping first.\" together with the list of conflicting groupings.", "rationale": "Main Flow step 4 (118), Screen 1 Unique Membership (351) and the first edge case (746). The no-overlap rule itself is REQ-028-006."}}
  - {"op": "add_node", "id": "REQ-028-022", "type": "Rule", "owner_fr": "FR-028", "title": "Grouping needs at least one country", "attrs": {"statement": "System MUST NOT save a regional grouping with no country selected and MUST show \"At least one country must be selected for this regional grouping.\"", "rationale": "Main Flow step 4 and 8 (117, 125), B1 (156-163) and Screen 1 Countries validation (341)."}}
  - {"op": "add_node", "id": "REQ-028-023", "type": "Rule", "owner_fr": "FR-028", "title": "Grouping needs at least one ordered destination", "attrs": {"statement": "System MUST NOT save a regional grouping without a destination order and MUST show \"At least one destination must be ordered for this regional grouping.\"", "rationale": "B2 (165-172) and Screen 1 Location Order validation (342)."}}
  - {"op": "add_node", "id": "REQ-028-024", "type": "Rule", "owner_fr": "FR-028", "title": "Every create, update and archive needs a change reason of 10-500 characters", "attrs": {"statement": "All create/update/archive actions require a change reason (10-500 chars). System MUST NOT save a regional grouping change or a price change without it and MUST show \"Change reason is required (10-500 characters).\"", "rationale": "General Module Rule 7 (462), Main Flow steps 6 and 8 (123, 125), A1 step 4 (140), A2 step 3 (151), B3 (174-181), pricing steps 7 and 9 (204, 210), A3 step 5 (225), A4 step 6 (239), B5 (262-269) and the Change Reason fields of Screen 1 and Screen 2 (344, 384)."}}
  - {"op": "add_node", "id": "REQ-028-025", "type": "Rule", "owner_fr": "FR-028", "title": "Grouping name unique and at most 100 characters; description at most 500", "attrs": {"statement": "A regional grouping name is required, MUST be unique and at most 100 characters; the description is optional (internal purpose of the grouping) and at most 500 characters.", "rationale": "Screen 1 data fields Grouping Name and Description (339-340)."}}
  - {"op": "add_node", "id": "REQ-028-026", "type": "Rule", "owner_fr": "FR-028", "title": "Editing an existing grouping follows the creation steps", "attrs": {"statement": "When an admin edits an existing regional grouping, System shows the current countries and location order, requires a change reason, and then validates, saves, clears the cache and confirms as for a new grouping; patients from the affected region see the updated order within 1 minute.", "rationale": "Alternative Flow A1 (133-143)."}}
  - {"op": "add_node", "id": "REQ-028-027", "type": "Rule", "owner_fr": "FR-028", "title": "Deleting a grouping warns, needs a reason and confirmation", "attrs": {"statement": "Before a regional grouping is deleted, System MUST warn \"Deleting this grouping will affect patients from [X countries]. They will fall back to proximity-based destination ordering. Continue?\" and the admin MUST enter a change reason and confirm.", "rationale": "Alternative Flow A2 steps 2-3 (150-151)."}}
  - {"op": "add_node", "id": "REQ-028-028", "type": "Rule", "owner_fr": "FR-028", "title": "Deleted groupings are archived, never permanently deleted", "attrs": {"statement": "Deleting a regional grouping MUST archive it (soft delete), never remove it permanently, so the audit trail stays complete; System clears the cache and confirms \"Regional grouping archived. Patients from affected countries will now see proximity-based destination ordering.\"", "rationale": "A2 steps 4-5 (152-154) and Screen 1 Soft Delete (355)."}}
  - {"op": "add_node", "id": "REQ-028-029", "type": "Rule", "owner_fr": "FR-028", "title": "Inactive groupings are retained but not applied", "attrs": {"statement": "Inactive regional groupings are retained in system but not applied to patient location presentation.", "rationale": "General Module Rule 6 (461) and Screen 1 Status field (343: Active applies to patients, Inactive is archived)."}}
  - {"op": "add_node", "id": "REQ-028-030", "type": "Rule", "owner_fr": "FR-028", "title": "At most 50 regional groupings; soft limit with admin warning", "attrs": {"statement": "Maximum of 50 regional groupings to prevent administrative complexity (soft limit with admin warning).", "rationale": "General Module Rule 5 (460) and Admin Editability, Fixed in Codebase (488)."}}
  - {"op": "add_node", "id": "REQ-028-031", "type": "Rule", "owner_fr": "FR-028", "title": "Cache timing, currency decimal rules and the grouping limit are fixed in the codebase", "attrs": {"statement": "Cache propagation timing (1-minute TTL), currency decimal precision rules (2 decimals for major currencies, 0 for yen and won) and the maximum number of regional groupings (50) are fixed in the codebase and not editable by admin.", "rationale": "Admin Editability, Fixed in Codebase (484-488)."}}
  - {"op": "add_node", "id": "REQ-028-032", "type": "Rule", "owner_fr": "FR-028", "title": "Admin-editable items", "attrs": {"statement": "Admins can edit regional grouping names, countries and location ordering; starting price amounts for any location-currency combination; fallback pricing configuration per location; regional grouping active or inactive status; price effective and expiry dates; and the number of locations displayed per regional grouping.", "rationale": "Admin Editability, Editable by Admin (475-482). Per-item behaviour is in the rules of this module; Admin Platform scope (61-67)."}}
  - {"op": "add_node", "id": "REQ-028-033", "type": "Rule", "owner_fr": "FR-028", "title": "Number of locations displayed per grouping: default 10, range 5-20", "attrs": {"statement": "The number of locations displayed per regional grouping is configurable by admin: default 10, allowed range 5-20.", "rationale": "Admin Editability, Editable by Admin (482). No screen of this PRD shows the setting (question raised)."}}
  - {"op": "add_node", "id": "REQ-028-034", "type": "Rule", "owner_fr": "FR-028", "title": "Default location ordering editable but must include every active provider location", "attrs": {"statement": "The default location ordering used when no regional grouping matches is editable by admin, but MUST include all active provider locations.", "rationale": "Admin Editability, Configurable with Restrictions (492). Conflicts in wording with REQ-028-035 (proximity ordering); question raised."}}
  - {"op": "add_node", "id": "REQ-028-035", "type": "Rule", "owner_fr": "FR-028", "title": "No matching grouping: destinations ordered by proximity", "attrs": {"statement": "If no regional grouping matches the patient's country (or a grouping was deleted or is inactive), System orders destinations by proximity to the patient's location (FR-003 default behavior) and shows all available destinations in that default order.", "rationale": "Screen 1 Default Fallback (352), A5 steps 1-3 (306-314), A2 outcome (154) and the third edge case (750)."}}
  - {"op": "add_node", "id": "REQ-028-036", "type": "Rule", "owner_fr": "FR-028", "title": "Configured order first; other locations after, by proximity", "attrs": {"statement": "System shows destinations in the matched grouping's configured order (first position first, second position second, and so on); locations not in the configured order appear at the end, ordered by proximity to the patient's location.", "rationale": "Main Flow: Patient Views Personalized Location Recommendations steps 5-6 (285-290) and Main Flow: Regional Presentation step 5 (119-121)."}}
  - {"op": "add_node", "id": "REQ-028-037", "type": "Rule", "owner_fr": "FR-028", "title": "Destination list shows name, flag, starting price, description and provider count", "attrs": {"statement": "System displays each destination to the patient with the location name and flag, the starting price in the patient's currency (\"Starting from £2,500\"), a brief location description and the number of providers available in the location.", "rationale": "Main Flow: Patient Views Personalized Location Recommendations step 8 (297-301). The screen is FR-003 Screen 2 (SCR-003-02); the patient then selects destinations (step 9)."}}
  - {"op": "add_node", "id": "REQ-028-038", "type": "Rule", "owner_fr": "FR-028", "title": "Patient currency from profile, else the location default", "attrs": {"statement": "System identifies the patient's currency preference from the patient profile or, when none is set, from the location default.", "rationale": "Main Flow: Patient Views Personalized Location Recommendations step 7 (292)."}}
  - {"op": "add_node", "id": "REQ-028-039", "type": "Rule", "owner_fr": "FR-028", "title": "Starting price lookup order: specific, fallback, system-wide default", "attrs": {"statement": "For each displayed location System looks up the starting price for the location and currency combination: if specific pricing exists, display that price; if not, display the fallback price for the location (if configured); if there is no fallback, display the default starting price (system-wide default).", "rationale": "Main Flow: Patient Views Personalized Location Recommendations step 7 (293-296). Differs from REQ-028-040 and REQ-028-041 on the last step; question raised."}}
  - {"op": "add_node", "id": "REQ-028-040", "type": "Rule", "owner_fr": "FR-028", "title": "Missing price in the patient's currency: fallback, else converted location default price", "attrs": {"statement": "When the patient's currency has no pricing for the location, System checks for fallback pricing in the patient's currency; if none, it displays the price in the location's default currency with a conversion note (\"Starting from €2,200 (approx. £2,500)\") using the real-time exchange rate from the FR-029 currency service.", "rationale": "A6 (316-325) and the second edge case (748)."}}
  - {"op": "add_node", "id": "REQ-028-041", "type": "Rule", "owner_fr": "FR-028", "title": "No price and no conversion: Price available on request, error logged, admin warned", "attrs": {"statement": "When no fallback is configured and currency conversion is unavailable, System displays the location without a starting price, shows the text \"Price available on request\" to the patient and logs an error for admin review; the admin dashboard shows \"[Location] missing fallback pricing - patients seeing no price estimate.\"", "rationale": "Sixth edge case (756)."}}
  - {"op": "add_node", "id": "REQ-028-042", "type": "Rule", "owner_fr": "FR-028", "title": "Location ordering is advisory only", "attrs": {"statement": "Location ordering is strictly advisory for patient presentation - it does not restrict which locations patients can select or providers can serve.", "rationale": "General Module Rule 2 (457)."}}
  - {"op": "add_node", "id": "REQ-028-043", "type": "Rule", "owner_fr": "FR-028", "title": "Starting prices are estimates and do not constrain provider quotes", "attrs": {"statement": "Starting prices are estimates only and do not constrain provider quote pricing. Providers can quote higher or lower than starting prices.", "rationale": "General Module Rule 3 (458) and Provider Platform scope (57: quote submission pricing is provider-controlled)."}}
  - {"op": "add_node", "id": "REQ-028-044", "type": "Rule", "owner_fr": "FR-028", "title": "Patients only consume the configuration; providers have no interaction with it", "attrs": {"statement": "The Patient platform only consumes the admin-configured regional configuration and has no editing capability; the Provider platform has no direct interaction with regional configuration settings.", "rationale": "Multi-Tenant Breakdown, Patient Platform and Provider Platform (45-57)."}}
  - {"op": "add_node", "id": "REQ-028-045", "type": "Rule", "owner_fr": "FR-028", "title": "Admin can enable or disable specific destinations for specific patient regions", "attrs": {"statement": "Admins can enable or disable specific destinations for specific patient regions.", "rationale": "Multi-Tenant Breakdown, Admin Platform (66). No screen, field or other rule of the PRD describes how; question raised."}}
  - {"op": "add_node", "id": "REQ-028-046", "type": "Rule", "owner_fr": "FR-028", "title": "Admin notified when regional configuration changes are saved", "attrs": {"statement": "System sends the admin a system notification when a regional configuration change is saved.", "rationale": "Communication Structure, In Scope (77). Whether price saves are included is not stated; question raised."}}
  - {"op": "add_node", "id": "REQ-028-047", "type": "Rule", "owner_fr": "FR-028", "title": "Out of scope: patient and provider notices and real-time exchange-rate pricing", "attrs": {"statement": "This module does not send patients notifications about pricing changes (general notification system), does not notify providers about regional configuration updates (providers are unaffected), and does not update prices in real time from exchange rates (FR-029).", "rationale": "Communication Structure, Out of Scope (80-84)."}}
  - {"op": "add_node", "id": "REQ-028-048", "type": "Rule", "owner_fr": "FR-028", "title": "Pricing display only; no payment processing", "attrs": {"statement": "FR-028 configures pricing display only, not actual payment processing.", "rationale": "Business Rules, Payment & Billing Rules (497)."}}
  - {"op": "add_node", "id": "REQ-028-049", "type": "Rule", "owner_fr": "FR-028", "title": "Entry points to regional configuration and pricing", "attrs": {"statement": "Admin reaches the configuration at Settings > General Settings (Location Presentation & Pricing), with the System Configuration permission (per FR-031), and changes take effect on save within the 1-minute cache propagation. Patient reaches it through the \"Choose Your Destination\" screen of the quote request flow, where System determines the patient's location from profile or IP geolocation, applies the regional configuration to filter and order the destinations, and shows starting prices in the patient's preferred currency.", "rationale": "Entry Points (86-99). The PRD names the tab three ways (90, 113, 193); question raised."}}
  - {"op": "add_node", "id": "REQ-028-050", "type": "Rule", "owner_fr": "FR-028", "title": "Save confirmation messages", "attrs": {"statement": "After a successful save System confirms: \"Regional grouping saved. Changes will be live for patients within 1 minute.\" for a grouping; \"Starting price for [Location] in [Currency] set to [Amount].\" for a price; \"Fallback pricing enabled for [Location]. Patients from unconfigured countries will see these prices.\" for fallback pricing; \"[X] currency prices updated for [Location].\" for a bulk update.", "rationale": "Main Flow step 11 (128) and 11 (212), A3 step 7 (227), A4 step 8 (241) and Screen 2 bulk modal banner (415)."}}
  - {"op": "add_node", "id": "REQ-028-051", "type": "Rule", "owner_fr": "FR-028", "title": "Pricing view shows configured currencies and marks missing ones Not Set", "attrs": {"statement": "After the admin selects a destination, System shows the current pricing configuration for it: the currencies with configured starting prices, with currencies that have no configured price marked \"Not Set\".", "rationale": "Main Flow: Starting Prices step 2-3 (195-198)."}}
  - {"op": "add_node", "id": "REQ-028-052", "type": "Rule", "owner_fr": "FR-028", "title": "Currency list read-only from FR-029; no inline currency creation", "attrs": {"statement": "The currency dropdown for starting prices is populated from the FR-029 supported currency list (Settings > Billing Settings > Currency Management); currencies are not created or edited on this screen, and currency support must be configured in FR-029 before location pricing can be configured.", "rationale": "Main Flow: Starting Prices step 1 (194), Screen 2 notes (407-408) and Admin Editability, Configurable with Restrictions (493)."}}
  - {"op": "add_node", "id": "REQ-028-053", "type": "Rule", "owner_fr": "FR-028", "title": "Only supported currencies; unsupported currency refused with a pointer to Currency Management", "attrs": {"statement": "Only currencies configured in the system can be selected for a starting price; when the admin tries to save a price for an unsupported currency System shows \"[Currency] is not currently supported. Add currency to system first via Currency Management.\" and does not save the price.", "rationale": "Main Flow: Starting Prices step 9 (207), B4 (253-260) and Screen 2 Currency Validation (388)."}}
  - {"op": "add_node", "id": "REQ-028-054", "type": "Rule", "owner_fr": "FR-028", "title": "Starting price must be a positive number greater than 0", "attrs": {"statement": "A starting price MUST be a positive number greater than 0; for a non-numeric or negative value System shows \"Starting price must be a positive number.\" and does not save it, and shows the format guidance \"Enter base starting price (e.g., 2500 for £2,500)\".", "rationale": "Main Flow: Starting Prices steps 6 and 9 (202-208), B3 (244-251) and Screen 2 Positive Values Only (390)."}}
  - {"op": "add_node", "id": "REQ-028-055", "type": "Rule", "owner_fr": "FR-028", "title": "Decimal places follow the currency", "attrs": {"statement": "System enforces currency-appropriate decimal places for starting prices: 2 for GBP, EUR and USD, 0 for JPY and KRW.", "rationale": "Main Flow: Starting Prices step 9 (209), Screen 2 Decimal Precision (389)."}}
  - {"op": "add_node", "id": "REQ-028-056", "type": "Rule", "owner_fr": "FR-028", "title": "Fallback pricing configuration", "attrs": {"statement": "To set fallback pricing the admin goes to Location Pricing > Fallback Pricing, selects the destination, enables the fallback pricing option, enters the fallback price per currency and a change reason; System saves the fallback configuration.", "rationale": "Alternative Flow A3 (217-228) and Screen 2 Fallback Price field (381). Application of fallback prices is REQ-028-007."}}
  - {"op": "add_node", "id": "REQ-028-057", "type": "Rule", "owner_fr": "FR-028", "title": "Bulk price update by percentage or fixed amount", "attrs": {"statement": "Admins can update all currency prices of one destination at once by a percentage increase or decrease or a fixed amount adjustment; System shows a preview of the new prices for all currencies, the admin enters a change reason and confirms, and System saves all currency price updates simultaneously.", "rationale": "Alternative Flow A4 (230-242), Screen 2 Bulk Update (393) and User Story 4 (710-723)."}}
  - {"op": "add_node", "id": "REQ-028-058", "type": "Rule", "owner_fr": "FR-028", "title": "Bulk update modal inputs", "attrs": {"statement": "The bulk update modal has a method selector (percentage increase or decrease, or fixed amount adjustment), an adjustment value input that is numeric and may be negative for a decrease, an optional rounding rule (round to the nearest 5, 10 or 50 of the currency unit), a preview table of current versus new prices per currency, and a required change reason logged in the audit trail.", "rationale": "Screen 2 notes, Bulk Update modal (409-415)."}}
  - {"op": "add_node", "id": "REQ-028-059", "type": "Rule", "owner_fr": "FR-028", "title": "Bulk update action available only with a destination or rows selected", "attrs": {"statement": "The Bulk Update Pricing action is enabled only when a destination is selected (or at least one pricing row is selected) and requires a change reason inside the modal before apply.", "rationale": "Screen 2 field Bulk Update Pricing (380) and notes (400)."}}
  - {"op": "add_node", "id": "REQ-028-060", "type": "Rule", "owner_fr": "FR-028", "title": "Future effective date keeps current pricing active until then", "attrs": {"statement": "If a price's effective date is in the future, the current pricing remains active until the effective date; without an effective date pricing is effective immediately.", "rationale": "Screen 2 Effective Dating (395) and field Price Effective Date (378)."}}
  - {"op": "add_node", "id": "REQ-028-061", "type": "Rule", "owner_fr": "FR-028", "title": "Expiry date after effective date; admin warned 7 days before expiry", "attrs": {"statement": "A price expiry date, when set, MUST be after the effective date, and System warns the admin 7 days before the price expiry date.", "rationale": "Screen 2 field Price Expiry Date (379) and Expiry Warning (396)."}}
  - {"op": "add_node", "id": "REQ-028-062", "type": "Rule", "owner_fr": "FR-028", "title": "Price without expiry stays active indefinitely", "attrs": {"statement": "When an effective date is set without an expiry date, the pricing remains active indefinitely until the admin updates it or sets an expiry; System shows the info note \"No expiry set - pricing active indefinitely.\" in the pricing table and enforces no automatic expiration.", "rationale": "Seventh edge case (758). What happens when a set expiry date passes is not stated; question raised."}}
  - {"op": "add_node", "id": "REQ-028-063", "type": "Rule", "owner_fr": "FR-028", "title": "Price history kept for audit and trend analysis", "attrs": {"statement": "System maintains the history of all price changes for audit and trend analysis.", "rationale": "Screen 2 Price History (392). Retention periods are REQ-028-012 and REQ-028-064."}}
  - {"op": "add_node", "id": "REQ-028-064", "type": "Rule", "owner_fr": "FR-028", "title": "Pricing history and configuration audit logs retained 10 years", "attrs": {"statement": "Pricing history and configuration change audit logs are retained for 10 years (Constitution compliance).", "rationale": "Data & Privacy Retention Rule (470) and the Change Log entry on 10-year audit retention (819). Conflicts with REQ-028-012 (3 years for pricing history); question raised."}}
  - {"op": "add_node", "id": "REQ-028-065", "type": "Rule", "owner_fr": "FR-028", "title": "Patient location for matching is stored in the patient profile under PHI encryption", "attrs": {"statement": "Patient location data used for regional matching is stored in the patient profile, which is already compliant with the PHI encryption requirements (Principle II).", "rationale": "Data & Privacy Privacy Rule 1 (466)."}}
  - {"op": "add_node", "id": "REQ-028-066", "type": "Rule", "owner_fr": "FR-028", "title": "Starting price estimates are public data; no encryption required", "attrs": {"statement": "Starting price estimates are public data and are not subject to encryption requirements; regional configuration data (location display rules and public pricing estimates) is not sensitive.", "rationale": "Data & Privacy Privacy Rule 2 (467) and Security Considerations Data Protection (647)."}}
  - {"op": "add_node", "id": "REQ-028-067", "type": "Rule", "owner_fr": "FR-028", "title": "Pricing history names the admin, never patient-level pricing", "attrs": {"statement": "Pricing history includes the admin user who made each change for accountability, but not patient-level pricing data.", "rationale": "Data & Privacy Privacy Rule 3 (468)."}}
  - {"op": "add_node", "id": "REQ-028-068", "type": "Rule", "owner_fr": "FR-028", "title": "Patient location data follows FR-001 GDPR requirements", "attrs": {"statement": "Patient location data handling follows the existing GDPR requirements of FR-001, with no additional requirements.", "rationale": "Data & Privacy GDPR Compliance (471)."}}
  - {"op": "add_node", "id": "REQ-028-069", "type": "Rule", "owner_fr": "FR-028", "title": "Preview updates immediately when patient location or currency changes", "attrs": {"statement": "The location display preview updates immediately when the admin selects a different patient location or currency.", "rationale": "Screen 3 Real-Time Preview (436) and User Story 5 scenarios 2-3 (738-739)."}}
  - {"op": "add_node", "id": "REQ-028-070", "type": "Rule", "owner_fr": "FR-028", "title": "Preview shows which grouping and pricing rules were applied", "attrs": {"statement": "The preview shows which regional grouping and which pricing rules were applied for the simulated patient.", "rationale": "Screen 3 Applied Config Display (437) and field Applied Regional Grouping (431)."}}
  - {"op": "add_node", "id": "REQ-028-071", "type": "Rule", "owner_fr": "FR-028", "title": "Preview highlights locations using fallback pricing", "attrs": {"statement": "Locations using fallback pricing are visually distinguished in the preview (for example italic text or an info icon with the tooltip \"Using fallback pricing - AUD pricing not configured for this location\").", "rationale": "Screen 3 Fallback Highlighting (438), field Fallback Indicators (432) and User Story 3 scenario 3 (706)."}}
  - {"op": "add_node", "id": "REQ-028-072", "type": "Rule", "owner_fr": "FR-028", "title": "Preview warns when a location has no price for the preview currency", "attrs": {"statement": "If any location has no pricing for the preview currency, the preview displays a warning.", "rationale": "Screen 3 Missing Price Warning (439)."}}
  - {"op": "add_node", "id": "REQ-028-073", "type": "Rule", "owner_fr": "FR-028", "title": "Preview shows the actual provider count per location", "attrs": {"statement": "The preview shows the number of available providers per location, using actual counts from the provider database.", "rationale": "Screen 3 Provider Count Display (440)."}}
  - {"op": "add_node", "id": "REQ-028-074", "type": "Rule", "owner_fr": "FR-028", "title": "Admin can refresh the preview manually", "attrs": {"statement": "The admin can manually refresh the preview to see the latest data after configuration changes.", "rationale": "Screen 3 Refresh Button (441)."}}
  - {"op": "add_node", "id": "REQ-028-075", "type": "Rule", "owner_fr": "FR-028", "title": "Preview inputs: a valid country and a currency defaulting to the location's currency", "attrs": {"statement": "The preview requires a patient country that is valid in the system and a patient currency preference, which defaults to the location's default currency.", "rationale": "Screen 3 fields Preview Patient Location and Preview Currency (427-428)."}}
  - {"op": "add_node", "id": "REQ-028-076", "type": "Rule", "owner_fr": "FR-028", "title": "Grouping screen aids: drag and drop, preview pane, flags, assigned countries marked", "attrs": {"statement": "The regional grouping screen provides a drag-and-drop interface for location ordering, a preview pane showing how patients from the selected countries will see the location list, country flags next to country names, and a disabled or visibly marked state (for example greyed out with the tooltip \"Already assigned to [Grouping Name]\") for countries already assigned to another grouping.", "rationale": "Screen 1 notes (359-362) and Main Flow step 5 (120-122)."}}
  - {"op": "add_node", "id": "REQ-028-077", "type": "Rule", "owner_fr": "FR-028", "title": "Grouping screen bulk actions: duplicate, export, import from template", "attrs": {"statement": "The regional grouping screen provides bulk actions: duplicate grouping, export configuration, and import from template.", "rationale": "Screen 1 notes (363)."}}
  - {"op": "add_node", "id": "REQ-028-078", "type": "Rule", "owner_fr": "FR-028", "title": "Pricing table: locations as rows, currencies as columns, missing prices highlighted", "attrs": {"statement": "The pricing screen shows a table with locations as rows and currencies as columns, highlights cells without configured pricing in yellow, and shows the last updated timestamp and admin name on hover for each price.", "rationale": "Screen 2 notes (401-403)."}}
  - {"op": "add_node", "id": "REQ-028-079", "type": "Rule", "owner_fr": "FR-028", "title": "Pricing CSV import and export", "attrs": {"statement": "The pricing screen provides CSV import and export for bulk pricing updates; an export includes all location-currency combinations with their prices and last updated timestamps.", "rationale": "Screen 2 notes (404) and User Story 2 scenario 6 (690)."}}
  - {"op": "add_node", "id": "REQ-028-080", "type": "Rule", "owner_fr": "FR-028", "title": "Exchange rate reference and price calculator for admins", "attrs": {"statement": "The pricing screen displays an exchange rate reference for admin guidance from the FR-029 currency service, and a calculator that suggests prices for other currencies from a price entered in one currency, based on exchange rates.", "rationale": "Screen 2 notes (405-406)."}}
  - {"op": "add_node", "id": "REQ-028-081", "type": "Rule", "owner_fr": "FR-028", "title": "Preview aids: side-by-side comparison, tooltips, Test Mode, cache status", "attrs": {"statement": "The preview screen lets the admin compare two patient locations side by side, shows a tooltip explaining why a location is in its position (the regional grouping rule), provides a Test Mode toggle to see changes without saving them, and shows a cache status indicator with the time patient-facing data was last refreshed.", "rationale": "Screen 3 notes (445-448)."}}
  - {"op": "add_node", "id": "REQ-028-082", "type": "Rule", "owner_fr": "FR-028", "title": "Concurrent edits: last save wins, with an overwrite warning", "attrs": {"statement": "Concurrent admin edits of one regional grouping use optimistic locking: the last save wins, and when the configuration changed since the admin opened the edit screen System warns \"This grouping was modified by [Admin Name] at [Time]. Your changes will overwrite theirs. Continue?\"", "rationale": "Fourth edge case (752)."}}
  - {"op": "add_node", "id": "REQ-028-083", "type": "Rule", "owner_fr": "FR-028", "title": "Provider location changes keep grouping references; permanently removed locations are flagged", "attrs": {"statement": "System keeps location references in regional groupings even when a provider is deactivated, and the ordering applies again if the provider reactivates; when a location is permanently removed from the system, the grouping edit screen warns \"[Location] is no longer active. Remove from ordering?\"", "rationale": "Fifth edge case (754)."}}
  - {"op": "add_node", "id": "REQ-028-084", "type": "Rule", "owner_fr": "FR-028", "title": "Deleted grouping: cached sessions served up to 60 seconds, then default ordering, no errors", "attrs": {"statement": "When a regional grouping is deleted while patients are viewing destinations, cached data serves existing sessions for up to 60 seconds; after cache expiry patients see the default location ordering, with no errors displayed to patients.", "rationale": "Third edge case (750)."}}
  - {"op": "add_node", "id": "REQ-028-085", "type": "Rule", "owner_fr": "FR-028", "title": "Configuration unavailable: default ordering and pricing", "attrs": {"statement": "If the regional configuration is unavailable, System falls back to default location ordering and pricing.", "rationale": "Integration 1 error handling (623)."}}
  - {"op": "add_node", "id": "REQ-028-086", "type": "Rule", "owner_fr": "FR-028", "title": "Pricing destination must be a valid location in the system", "attrs": {"statement": "The destination location chosen for a starting price MUST be a valid location in the system.", "rationale": "Screen 2 field Destination Location (375)."}}
  - {"op": "add_node", "id": "SET-locations-displayed-per-grouping", "type": "Setting", "owner_fr": "FR-028", "title": "Locations displayed per regional grouping", "attrs": {"default": "10", "unit": "locations", "description": "Number of locations displayed per regional grouping; configurable range 5-20 (PRD line 482)."}}
  - {"op": "add_node", "id": "SET-default-location-ordering", "type": "Setting", "owner_fr": "FR-028", "title": "Default location ordering", "attrs": {"description": "Location ordering used when no regional grouping matches; editable by admin but must include all active provider locations (PRD line 492)."}}
  - {"op": "add_node", "id": "EVT-regional-configuration-saved", "type": "Event", "owner_fr": "FR-028", "title": "Regional configuration saved", "attrs": {"description": "A regional grouping or starting price change was saved; the admin is notified (PRD line 77).", "payload": "admin user, entity type, change reason, change details"}}
  - {"op": "add_node", "id": "ENT-regional-grouping", "type": "Entity", "owner_fr": "FR-028", "title": "Regional grouping", "attrs": {"description": "Logical grouping of patient countries with the location presentation order shown to patients from those countries (Key Entities, Entity 1)."}}
  - {"op": "add_node", "id": "ENT-location-starting-price", "type": "Entity", "owner_fr": "FR-028", "title": "Location starting price", "attrs": {"description": "Starting price estimate for one destination location in one currency, optionally flagged as fallback (Key Entities, Entity 2)."}}
  - {"op": "add_node", "id": "ENT-configuration-change-audit-log", "type": "Entity", "owner_fr": "FR-028", "title": "Configuration change audit log", "attrs": {"description": "One record per change to a regional grouping or starting price, kept for compliance and troubleshooting (Key Entities, Entity 3)."}}
  - {"op": "add_node", "id": "ENT-location-display-preview", "type": "Entity", "owner_fr": "FR-028", "title": "Location display preview", "attrs": {"description": "Admin's preview request (simulated patient country and currency) and the resulting ordered location list as the patient would see it (Screen 3). The PRD does not say whether it is stored; added so the Screen 3 fields have an Entity owner."}}
  - {"op": "add_field", "id": "ENT-regional-grouping.grouping_id", "entity_id": "ENT-regional-grouping", "name": "grouping_id", "data_type": "id", "title": "Grouping ID", "owner_fr": "FR-028", "required": true}
  - {"op": "add_field", "id": "ENT-regional-grouping.grouping_name", "entity_id": "ENT-regional-grouping", "name": "grouping_name", "data_type": "text", "title": "Grouping name", "owner_fr": "FR-028", "required": true, "attrs": {"description": "Screen 1 Grouping Name: required, unique, max 100 characters."}}
  - {"op": "add_field", "id": "ENT-regional-grouping.description", "entity_id": "ENT-regional-grouping", "name": "description", "data_type": "text", "title": "Description", "owner_fr": "FR-028", "required": false, "attrs": {"description": "Internal description of the grouping purpose, max 500 characters."}}
  - {"op": "add_field", "id": "ENT-regional-grouping.country_list", "entity_id": "ENT-regional-grouping", "name": "country_list", "data_type": "text[]", "title": "Countries", "owner_fr": "FR-028", "required": true, "attrs": {"description": "Countries in the grouping, at least one; each country belongs to at most one grouping."}}
  - {"op": "add_field", "id": "ENT-regional-grouping.location_order", "entity_id": "ENT-regional-grouping", "name": "location_order", "data_type": "id[]", "title": "Location order", "owner_fr": "FR-028", "required": true, "attrs": {"description": "Ordered destination locations, at least one; first position is shown first."}}
  - {"op": "add_field", "id": "ENT-regional-grouping.status", "entity_id": "ENT-regional-grouping", "name": "status", "data_type": "enum", "title": "Status", "owner_fr": "FR-028", "required": true, "attrs": {"description": "Active applies to patients; Inactive means archived."}}
  - {"op": "add_field", "id": "ENT-regional-grouping.created_at", "entity_id": "ENT-regional-grouping", "name": "created_at", "data_type": "datetime", "title": "Created at", "owner_fr": "FR-028", "required": true}
  - {"op": "add_field", "id": "ENT-regional-grouping.updated_at", "entity_id": "ENT-regional-grouping", "name": "updated_at", "data_type": "datetime", "title": "Updated at", "owner_fr": "FR-028", "required": true}
  - {"op": "add_field", "id": "ENT-regional-grouping.created_by_admin_id", "entity_id": "ENT-regional-grouping", "name": "created_by_admin_id", "data_type": "id", "title": "Created by admin", "owner_fr": "FR-028", "required": true}
  - {"op": "add_field", "id": "ENT-regional-grouping.updated_by_admin_id", "entity_id": "ENT-regional-grouping", "name": "updated_by_admin_id", "data_type": "id", "title": "Updated by admin", "owner_fr": "FR-028", "required": true}
  - {"op": "add_field", "id": "ENT-location-starting-price.price_id", "entity_id": "ENT-location-starting-price", "name": "price_id", "data_type": "id", "title": "Price ID", "owner_fr": "FR-028", "required": true}
  - {"op": "add_field", "id": "ENT-location-starting-price.location_id", "entity_id": "ENT-location-starting-price", "name": "location_id", "data_type": "id", "title": "Destination location", "owner_fr": "FR-028", "required": true, "attrs": {"description": "Treatment destination (country or city); must be a valid location in the system."}}
  - {"op": "add_field", "id": "ENT-location-starting-price.currency_code", "entity_id": "ENT-location-starting-price", "name": "currency_code", "data_type": "text", "title": "Currency", "owner_fr": "FR-028", "required": true, "attrs": {"description": "Must be a supported currency (FR-029)."}}
  - {"op": "add_field", "id": "ENT-location-starting-price.starting_price_amount", "entity_id": "ENT-location-starting-price", "name": "starting_price_amount", "data_type": "decimal", "title": "Starting price", "owner_fr": "FR-028", "required": true, "attrs": {"description": "Positive number, decimals per currency rules."}}
  - {"op": "add_field", "id": "ENT-location-starting-price.is_fallback_price", "entity_id": "ENT-location-starting-price", "name": "is_fallback_price", "data_type": "bool", "title": "Fallback price", "owner_fr": "FR-028", "required": false, "attrs": {"description": "Use as fallback for unconfigured patient locations."}}
  - {"op": "add_field", "id": "ENT-location-starting-price.effective_date", "entity_id": "ENT-location-starting-price", "name": "effective_date", "data_type": "date", "title": "Price effective date", "owner_fr": "FR-028", "required": false, "attrs": {"description": "Future date optional; defaults to immediate."}}
  - {"op": "add_field", "id": "ENT-location-starting-price.expiry_date", "entity_id": "ENT-location-starting-price", "name": "expiry_date", "data_type": "date", "title": "Price expiry date", "owner_fr": "FR-028", "required": false, "attrs": {"description": "Must be after the effective date if set."}}
  - {"op": "add_field", "id": "ENT-location-starting-price.created_at", "entity_id": "ENT-location-starting-price", "name": "created_at", "data_type": "datetime", "title": "Created at", "owner_fr": "FR-028", "required": true}
  - {"op": "add_field", "id": "ENT-location-starting-price.updated_at", "entity_id": "ENT-location-starting-price", "name": "updated_at", "data_type": "datetime", "title": "Updated at", "owner_fr": "FR-028", "required": true}
  - {"op": "add_field", "id": "ENT-location-starting-price.updated_by_admin_id", "entity_id": "ENT-location-starting-price", "name": "updated_by_admin_id", "data_type": "id", "title": "Updated by admin", "owner_fr": "FR-028", "required": true}
  - {"op": "add_field", "id": "ENT-location-starting-price.change_reason", "entity_id": "ENT-location-starting-price", "name": "change_reason", "data_type": "text", "title": "Change reason", "owner_fr": "FR-028", "required": true, "attrs": {"description": "10-500 characters."}}
  - {"op": "add_field", "id": "ENT-configuration-change-audit-log.audit_id", "entity_id": "ENT-configuration-change-audit-log", "name": "audit_id", "data_type": "id", "title": "Audit ID", "owner_fr": "FR-028", "required": true}
  - {"op": "add_field", "id": "ENT-configuration-change-audit-log.entity_type", "entity_id": "ENT-configuration-change-audit-log", "name": "entity_type", "data_type": "enum", "title": "Entity type", "owner_fr": "FR-028", "required": true}
  - {"op": "add_field", "id": "ENT-configuration-change-audit-log.entity_id", "entity_id": "ENT-configuration-change-audit-log", "name": "entity_id", "data_type": "id", "title": "Changed record ID", "owner_fr": "FR-028", "required": true, "attrs": {"description": "Polymorphic reference to the regional grouping or starting price."}}
  - {"op": "add_field", "id": "ENT-configuration-change-audit-log.admin_user_id", "entity_id": "ENT-configuration-change-audit-log", "name": "admin_user_id", "data_type": "id", "title": "Admin user", "owner_fr": "FR-028", "required": true}
  - {"op": "add_field", "id": "ENT-configuration-change-audit-log.change_timestamp", "entity_id": "ENT-configuration-change-audit-log", "name": "change_timestamp", "data_type": "datetime", "title": "Change timestamp", "owner_fr": "FR-028", "required": true}
  - {"op": "add_field", "id": "ENT-configuration-change-audit-log.change_reason", "entity_id": "ENT-configuration-change-audit-log", "name": "change_reason", "data_type": "text", "title": "Change reason", "owner_fr": "FR-028", "required": true, "attrs": {"description": "10-500 characters; shown on Screen 1 Change Reason."}}
  - {"op": "add_field", "id": "ENT-configuration-change-audit-log.change_details", "entity_id": "ENT-configuration-change-audit-log", "name": "change_details", "data_type": "json", "title": "Change details", "owner_fr": "FR-028", "required": true, "attrs": {"description": "Old value and new value."}}
  - {"op": "add_field", "id": "ENT-configuration-change-audit-log.ip_address", "entity_id": "ENT-configuration-change-audit-log", "name": "ip_address", "data_type": "text", "title": "IP address", "owner_fr": "FR-028", "required": true}
  - {"op": "add_field", "id": "ENT-location-display-preview.preview_patient_location", "entity_id": "ENT-location-display-preview", "name": "preview_patient_location", "data_type": "id", "title": "Preview patient location", "owner_fr": "FR-028", "required": true, "attrs": {"description": "Patient country to simulate."}}
  - {"op": "add_field", "id": "ENT-location-display-preview.preview_currency", "entity_id": "ENT-location-display-preview", "name": "preview_currency", "data_type": "text", "title": "Preview currency", "owner_fr": "FR-028", "required": true, "attrs": {"description": "Patient currency preference; defaults to the location's default currency."}}
  - {"op": "add_field", "id": "ENT-location-display-preview.location_list", "entity_id": "ENT-location-display-preview", "name": "location_list", "data_type": "id[]", "title": "Location list", "owner_fr": "FR-028", "required": false, "calculated_by": "REQ-028-036", "attrs": {"description": "Ordered location list as the patient would see it."}}
  - {"op": "add_field", "id": "ENT-location-display-preview.starting_prices", "entity_id": "ENT-location-display-preview", "name": "starting_prices", "data_type": "json", "title": "Starting prices", "owner_fr": "FR-028", "required": false, "calculated_by": "REQ-028-039", "attrs": {"description": "Starting prices in the preview currency."}}
  - {"op": "add_field", "id": "ENT-location-display-preview.applied_regional_grouping", "entity_id": "ENT-location-display-preview", "name": "applied_regional_grouping", "data_type": "id", "title": "Applied regional grouping", "owner_fr": "FR-028", "required": false, "calculated_by": "REQ-028-003"}
  - {"op": "add_field", "id": "ENT-location-display-preview.fallback_indicators", "entity_id": "ENT-location-display-preview", "name": "fallback_indicators", "data_type": "json", "title": "Fallback indicators", "owner_fr": "FR-028", "required": false, "calculated_by": "REQ-028-071", "attrs": {"description": "Locations using fallback pricing."}}
  - {"op": "add_enum_value", "field_id": "ENT-regional-grouping.status", "value": "active", "label": "Active"}
  - {"op": "add_enum_value", "field_id": "ENT-regional-grouping.status", "value": "inactive", "label": "Inactive"}
  - {"op": "add_enum_value", "field_id": "ENT-configuration-change-audit-log.entity_type", "value": "regional_grouping", "label": "Regional grouping"}
  - {"op": "add_enum_value", "field_id": "ENT-configuration-change-audit-log.entity_type", "value": "starting_price", "label": "Starting price"}
  - {"op": "add_node", "id": "SCR-028-01", "type": "Screen", "owner_fr": "FR-028", "title": "Regional Grouping Management (Screen 1)", "attrs": {"platform": "admin", "description": "Admin creates, edits, archives and orders regional groupings that control the location presentation order for patients from different regions."}}
  - {"op": "add_node", "id": "SCR-028-02", "type": "Screen", "owner_fr": "FR-028", "title": "Location Pricing Configuration (Screen 2)", "attrs": {"platform": "admin", "description": "Admin configures starting price estimates per destination and currency, with fallback prices, effective and expiry dates, and bulk update."}}
  - {"op": "add_node", "id": "SCR-028-03", "type": "Screen", "owner_fr": "FR-028", "title": "Location Display Preview (Screen 3)", "attrs": {"platform": "admin", "description": "Admin previews how location recommendations and starting prices appear to patients from different regions."}}
  - {"op": "add_edge", "from": "SCR-028-01", "verb": "shows", "to": "ENT-regional-grouping.grouping_name", "attrs": {"provenance": "user input", "label": "Grouping Name", "editable": true}}
  - {"op": "add_edge", "from": "SCR-028-01", "verb": "shows", "to": "ENT-regional-grouping.description", "attrs": {"provenance": "user input", "label": "Description", "editable": true}}
  - {"op": "add_edge", "from": "SCR-028-01", "verb": "shows", "to": "ENT-regional-grouping.country_list", "attrs": {"provenance": "user input", "label": "Countries", "editable": true}}
  - {"op": "add_edge", "from": "SCR-028-01", "verb": "shows", "to": "ENT-regional-grouping.location_order", "attrs": {"provenance": "user input", "label": "Location Order", "editable": true}}
  - {"op": "add_edge", "from": "SCR-028-01", "verb": "shows", "to": "ENT-regional-grouping.status", "attrs": {"provenance": "user input", "label": "Status", "editable": true}}
  - {"op": "add_edge", "from": "SCR-028-01", "verb": "shows", "to": "ENT-configuration-change-audit-log.change_reason", "attrs": {"provenance": "user input", "label": "Change Reason", "editable": true}}
