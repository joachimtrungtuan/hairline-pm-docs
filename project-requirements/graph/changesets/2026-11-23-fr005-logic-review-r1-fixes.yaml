  - {"op": "update_node", "id": "REQ-005-006", "attrs": {"statement": "System MUST preserve an immutable acceptance snapshot containing the accepted subquote identifier/version, the underlying Quote Option ID and Option/date-price ID, the source package ID/version, the parent quote identifier/version and expiry, provider and inquiry references, treatment ID/version, package and service snapshot, date range, appointment date/time/timezone, offered price, any patient-applied promotion code and the resulting discounted price, promotion, currency, exchange rate and its timestamp, treatment plan, estimated grafts, graft description, visual plan, clinician IDs, notes, requirements, attachment IDs with versions, actor, and timestamp; `acceptedSubquoteVersion` MUST equal `acceptedParentQuoteVersion` because both identify the same FR-004 aggregate revision; all resulting state changes MUST be audited. Price, currency, date range, appointment, and promotion are the binding fields that downstream modules MUST read from the snapshot; the snapshot appointment is the accepted baseline, and booking notices MUST read the booking's current appointment, which can change only through an FR-006 admin appointment change or an admin edit of the accepted quote's date range or appointment (REQ-005-023). The treatment details are the original record at acceptance; later changes to plan, clinicians, or grafts are made only through FR-010 or an admin edit of the accepted quote (REQ-005-023), with audit and patient notice, and never edit the snapshot.", "rationale": "Restated by Payment & Billing binding snapshot fields (price, currency, date range, appointment, and promotion are read from the snapshot by every downstream module and the snapshot never changes after acceptance; an admin may later change the booking's appointment through FR-006 or through an admin edit of the accepted quote's date range or appointment (REQ-005-023), each of which emits booking.rescheduled, and every booking notice reads the booking's current appointment; after acceptance only the clinic or an admin may change the plan, clinicians, or grafts, through FR-010 or, for an admin, the admin edit of the accepted quote (REQ-005-023), with audit and patient notice, and the snapshot itself is never edited), Payment & Billing pricing (the resulting price and promotion are frozen into the snapshot; only the provider-fault transfer creates a new linked record), and Key Entities (acceptedSubquoteVersion MUST equal acceptedParentQuoteVersion; acceptanceSnapshot preserves the complete subquote plus inherited parent context, including the exchange rate and its timestamp and any patient-applied promotion code)."}}
  - {"op": "update_node", "id": "REQ-005-023", "attrs": {"statement": "System MUST NOT allow an AcceptanceEvent or its acceptance snapshot to be deleted, restored, or edited, and MUST NOT allow an accepted subquote or its parent quote to be deleted or restored. After acceptance an admin MAY edit the accepted quote in any field except its price, currency, and promotion (the date range and the treatment details may be changed), with a mandatory reason and a full before/after history. An edit of the date range or appointment MUST run the same slot-availability check as the FR-006 admin appointment change, update the booking's current appointment, and emit `booking.rescheduled`; an edit of the treatment details MUST notify the patient through `treatment.plan_changed`. The edit MUST be stored as a new version beside the acceptance snapshot, and the snapshot keeps the terms as accepted. Admins MAY also add audited notes or corrections as annotations next to an AcceptanceEvent; an annotation MUST NOT change the event, its snapshot, or any quote, subquote, or inquiry state.", "rationale": "Restated by the Admin Platform scope and Admin Editability (after acceptance an admin may edit the accepted quote in any field except price, currency and promotion, with a mandatory reason and full before/after history, stored as a new version beside the unchanged acceptance snapshot, a change of the date range or appointment running the FR-006 slot-availability check and emitting booking.rescheduled, and a change of treatment details emitting treatment.plan_changed; an annotation never alters the AcceptanceEvent, its snapshot, the accepted IDs/versions, or any quote, subquote, or inquiry state), Business Rule 6 (AcceptanceEvents, accepted subquotes, and their parent quotes are never deleted or restored), Screen 5 (annotations are append-only, each showing author, time, and reason; no delete or restore action exists), and Key Entities (AcceptanceAnnotation is an audited, append-only admin note)."}}
  - {"op": "update_node", "id": "REQ-004-084", "attrs": {"statement": "After acceptance, price, currency, and promotion never change; the booking's appointment changes only through the FR-006 admin appointment change or an admin edit of the accepted quote's date range or appointment (REQ-005-023), each of which emits `booking.rescheduled`, while the acceptance snapshot keeps the accepted appointment as the baseline."}}
  - {"op": "update_node", "id": "REQ-010-042", "attrs": {"statement": "After subquote acceptance, FR-010 is the only path for changing the treatment plan days, the assigned clinician set, and the estimated graft count, apart from the admin edit of the accepted quote (REQ-005-023); the rest of this rule governs the FR-010 path. No change is allowed while the booking is `Accepted` (unpaid); changes are allowed only from `Confirmed`. Only the clinic (Owner, Manager, or Clinical Staff, from `Confirmed` until Check In) or an admin (from `Confirmed` onward) may make the change. Each change MUST record actor, role, reason, timestamp, and before/after values; MUST notify the patient through the FR-030 `treatment.plan_changed` event; MUST leave the accepted snapshot unchanged as the original record; and MUST NOT change price, currency, date range, appointment, or promotion (Alternative Flow A2). Admin changes use Screen 9."}}
  - {"op": "update_node", "id": "REQ-010-027", "attrs": {"statement": "System MUST make FR-010 the only path for post-acceptance changes to treatment plan days, clinician set, and estimated graft count (apart from the admin edit of the accepted quote, REQ-005-023), blocked while the booking is `Accepted` and limited to the clinic (Owner, Manager, or Clinical Staff, from `Confirmed` until Check In) and admins (from `Confirmed` onward); each change MUST require a reason, be audited with before/after values, notify the patient through the FR-030 `treatment.plan_changed` event, leave the accepted snapshot unchanged, and never change money fields (Rule 13; Alternative Flow A2)"}}
  - {"op": "update_node", "id": "REQ-010-043", "attrs": {"statement": "Price, currency, date range, accepted appointment baseline, and promotion are read only from the accepted snapshot, reached through the FR-006 booking's AcceptanceEvent. The operative procedure date (Check In gate and displays) is the current FR-006 booking appointment, which equals the snapshot appointment unless an approved FR-006 admin date change or an admin edit of the accepted quote's date range or appointment (REQ-005-023) applies. FR-010 never edits the snapshot or reads these values from live FR-004 records. The case's current treatment details are seeded from the same snapshot and then change only under Rule 13."}}
  - {"op": "update_node", "id": "REQ-006-067", "attrs": {"statement": "The provider pre-schedules the appointment in the subquote; acceptance fixes the chosen appointment and reserves its slot, and successful payment confirms the booking. Rescheduling functionality will be evaluated for V2 based on business needs. The patient cannot reschedule. Date changes require the audited admin appointment change (Screen 8) or the admin edit of the accepted quote's date range or appointment (REQ-005-023), each of which sends `booking.rescheduled`, or an admin cancellation per cancellation policy."}}
  - {"op": "add_edge", "from": "FR-004", "verb": "references", "to": "REQ-005-023"}
  - {"op": "update_node", "id": "REQ-012-006", "attrs": {"statement": "System MUST enable in-app messaging for Patient ↔ Provider with text and media, accessible ONLY through dedicated Messages/Inbox screens (chat is not embedded in quote detail screens; a quote screen may link to the conversation in the inbox, REQ-005-015)."}}
  - {"op": "update_node", "id": "REQ-012-029", "attrs": {"statement": "Patients access their Messages/Inbox screen (Screen 1) from the main navigation in the mobile app; Chat is NOT embedded in quote detail screens—a quote screen may link to the conversation in the dedicated inbox (REQ-005-015), where chat takes place; Providers access patient conversations through a Messages popup/submenu in the header navigation (Screen 3), showing recent conversations with unread counts; Chat is NOT accessible from quote detail or inquiry screens—only from the dedicated messages list; Admins access the Communication Monitoring Center from the Admin platform navigation (Screen 5), which serves as the comprehensive message list monitoring all patient-provider conversations (and any admin-patient communications); Push/email notifications deep-link users directly into the specific conversation in their inbox."}}
  - {"op": "add_edge", "from": "FR-012", "verb": "references", "to": "REQ-005-015"}
