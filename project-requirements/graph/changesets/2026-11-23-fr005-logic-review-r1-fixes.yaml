  - {"op": "update_node", "id": "REQ-005-026", "attrs": {"statement": "System MUST let the patient apply a promotion code to one named subquote before acceptance, validated through FR-019, and MUST freeze the discounted price and promotion into the acceptance snapshot. The code MUST NOT be written to the provider's quote or promotion records, and the price and promotion MUST NOT change after acceptance except through an FR-006 provider-fault transfer. If the code is no longer valid, or its usage limit is exhausted, when the patient confirms, the acceptance MUST NOT happen and nothing is recorded as accepted; the patient MUST return to the subquote detail with the reason shown and the offered price unchanged, and may accept without the code or enter another."}}
  - {"op": "update_node", "id": "REQ-005-037", "attrs": {"statement": "After the exclusive hold succeeds, System records the selected subquote as Accepted, locks its inherited parent context and commercial details, sets the parent quote and inquiry to Accepted, records the acceptance snapshot (including the exchange rate and its timestamp) and the slot-hold reference, and writes the accepted subquote's price after any promotion as the parent quote's accepted total (FR-004 acceptedTotal), read from the snapshot. No appointment record is created at acceptance; FR-006 creates it only on successful first payment."}}
  - {"op": "update_node", "id": "REQ-005-051", "attrs": {"statement": "Price per graft is the subquote's offered price, before any promotion, divided by the inherited graft count; it is calculated and non-editable."}}
