  - {"op": "update_node", "id": "REQ-030-070", "attrs": {"statement": "Support Case Escalated (support.case_escalated) is an admin-configurable notification event. Primary recipients: Admin (Super Admins). Sent to the Super Admin chosen as the new assignee when a case is escalated manually, and to all Super Admins when the system escalates an overdue case (FR-034 REQ-034-092, REQ-034-103, REQ-034-173)"}}
  - {"op": "update_node", "id": "REQ-030-079", "attrs": {"statement": "Monitoring Provider Assigned (monitoring.provider_assigned) is an admin-configurable notification event. Primary recipients: Patient, Provider. Initial assignment only; a reassignment uses `monitoring.provider_reassigned` (FR-037 only)"}}
  - {"op": "update_node", "id": "REQ-030-082", "attrs": {"statement": "Monitoring Advice Posted (monitoring.advice_posted) is an admin-configurable notification event. Primary recipients: Patient. Provider submits or edits the one advice-window paragraph for the current window; an edit by the provider, or a text change by an Admin, sends the same notice marked \"updated\" (FR-037 only)"}}
  - {"op": "update_node", "id": "REQ-030-091", "attrs": {"statement": "Provider Approval Needed for Platform Discount (promotion.discount_approval_requested) is an admin-configurable notification event. Primary recipients: Provider. Sent to the targeted providers when an admin publishes an Admin-via-Provider (Both Fees) program and when an admin Re-invites a provider; not sent when the program only enters Pending Approval (FR-019 REQ-019-010)"}}
  - {"op": "update_node", "id": "REQ-030-233", "attrs": {"statement": "Event ownership: every event that produces a notification is owned by FR-030 and listed in this catalog, including events triggered by other features (the producing feature is named in the Notes). An event that produces no notification is owned by the feature that triggers it and is not listed here. Affiliate account emails (activation, code created, commission change, suspension, offboarding) go through the notification service as emails to the affiliate (FR-018 Rule 17, REQ-018-315); they are not catalogue events, and `payout.affiliate_processed` is the one affiliate event listed."}}
  - {"op": "update_node", "id": "REQ-030-137", "attrs": {"statement": "Account/Auth notifications (OTP verification, email change code, re-verification code, password reset) are security-critical and MUST be non-disableable by default in the admin UI (toggle locked; no pause)."}}
  - {"op": "update_node", "id": "REQ-030-152", "attrs": {"statement": "Trigger: Admin needs to support multiple locales for the same event (initially English and Turkish per FR-021) Admin selects language: English (default) from the locale list (the FR-021 locale catalogue: Active, Preparation and Inactive locales)", "rationale": "prd.md lines 305, 309, 312, 463. Initially English and Turkish. Language dropdown is populated from the FR-021 locale catalogue (FR-021 REQ-021-076)."}}
  - {"op": "update_node", "id": "STP-030-040", "title": "Admin selects the default language English from the locale list"}
  - {"op": "update_node", "id": "STP-030-043", "title": "System displays a language dropdown populated from the FR-021 locale catalogue"}
  - {"op": "update_node", "id": "ENT-notification-template.language", "attrs": {"description": "Key Entities: language (en-US, tr-TR and others). Must be in the FR-021 locale catalogue (Active, Preparation or Inactive); a template in a locale that becomes Inactive is kept (REQ-021-076)."}}
  - {"op": "update_node", "id": "REQ-030-186", "attrs": {"statement": "Template Editor fields: Template Name: Max 100 chars, unique per event, channel and language; Event Type: Predefined event list; Channel Type: Fixed at creation (cannot change); Language: Must be in the FR-021 locale catalogue (Active, Preparation or Inactive); can create multiple language versions; Email Subject: Max 200 chars, supports variables; Email Body: Max 10,000 chars, supports HTML/variables; Push Title: Max 100 chars, supports variables; Push Body: Max 500 chars, supports variables; SMS Body: Max 160 chars (1 SMS segment), supports variables; Available Variables: Display only; click to insert; Variable Preview Values: Valid JSON; used only for preview; Template Status: Default: Draft."}}
  - {"op": "update_node", "id": "REQ-030-127", "title": "Hidden post-MVP events: SMS delivery, aftercare reminders, quote declined", "attrs": {"statement": "Hidden until enabled: SMS Delivery Enabled `channel.sms_enabled` SMS is future; not available in MVP; Medication / Washing / Activity Reminders `aftercare.medication_reminder` / `aftercare.washing_reminder` / `aftercare.activity_reminder` Scheduled reminders referenced in system PRD; enable when milestone engine supports schedules; Quote Declined `quote.declined` Reserved for an explicit governed decline flow; no MVP producer exists because patients have no explicit decline action (FR-005). FR-005 sibling Not Selected and competing-parent cancellation outcomes do not use this event.", "rationale": "Post-MVP hidden events table. None has a producer stage; no Event node created. Keys: channel.sms_enabled, aftercare.medication_reminder, aftercare.washing_reminder, aftercare.activity_reminder, quote.declined. The travel notices are MVP events with catalogue rows (FR-008 REQ-008-071; REQ-030-265 to REQ-030-271)."}}
  - {"op": "update_node", "id": "EVT-quote-cancelled-inquiry", "attrs": {"description": "quote.cancelled_inquiry: sent to each provider holding a draft, sent or expired quote when the patient cancels the inquiry and when an approved account deletion cancels it; not sent for an admin Close inquiry; never sent to the provider of a replacement draft quote."}}
  - {"op": "update_node", "id": "EVT-support-case-escalated", "attrs": {"description": "support.case_escalated: emitted when a case is escalated to a Super Admin; a manual escalation notifies the chosen new assignee and a system escalation of an overdue case notifies all Super Admins."}}
  - {"op": "update_node", "id": "EVT-monitoring-advice-posted", "attrs": {"description": "monitoring.advice_posted: the provider submits advice and the patient is notified; an edit by the provider, or a text change by an Admin, sends the same notice marked \"updated\" (REQ-037-078)."}}
  - {"op": "update_node", "id": "EVT-monitoring-provider-assigned", "attrs": {"description": "monitoring.provider_assigned: Admin saves an initial assignment; the patient is notified and the provider is notified of the assignment (REQ-037-078). A reassignment uses monitoring.provider_reassigned."}}
  - {"op": "update_node", "id": "EVT-promotion-discount-approval-requested", "attrs": {"description": "promotion.discount_approval_requested: FR-030 notification catalogue event. Targeted providers are notified that a Both Fees program awaits their approval. Fires when an admin publishes an Admin-via-Provider program and on Re-invite, not when the program enters Pending Approval (REQ-019-010); the one approval-requested event."}}
