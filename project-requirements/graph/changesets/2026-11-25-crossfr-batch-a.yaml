# Cross-FR alignment of the FR-030 notification catalogue: mirrors the revised PRD (version 1.26)
# New: rules REQ-030-254 to REQ-030-294 (catalogue rows) and event EVT-monitoring-assignment-ended; each rule has its stage, actor, event and source edges. Removed: eight reads and writes edges of the four FR-030 entities at STG-main-01-inquiry (replaced by edges at STG-platform-01-all-stages).
# Cross-FR edges: new rules point to events owned by FR-001, FR-008, FR-009, FR-011, FR-012, FR-017 and FR-024, and REQ-030-070 points to ACT-super-admin. No node owned by another FR is updated.
reason: "Cross-FR alignment of the notification catalogue: new catalogue rules REQ-030-254 to REQ-030-294 with their stage, actor, event and source edges, a new event for the monitoring assignment end, wording fixes on four existing rows and on the language list, the affiliate and re-verification statements, and the notification entities moved to the platform stage."
by: docs-manager
operations:
  - {"op": "add_node", "id": "EVT-monitoring-assignment-ended", "type": "Event", "owner_fr": "FR-030", "title": "monitoring.assignment_ended", "attrs": {"description": "monitoring.assignment_ended: a monitoring assignment ends other than by the provider's own withdrawal; the patient and Admin are notified, and the provider only when an Admin ends the assignment (REQ-037-078)."}}
  - {"op": "add_node", "id": "REQ-030-254", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Monitoring Assignment Ended", "attrs": {"statement": "Monitoring Assignment Ended (monitoring.assignment_ended) is an admin-configurable notification event. Primary recipients: Patient, Admin, Provider (only when an Admin ends the assignment). Fires when a monitoring assignment ends other than by the provider's own withdrawal, which uses `monitoring.provider_withdrawn`. The patient and the Admin are always notified. The provider is notified only when an Admin ends the assignment, in neutral wording that does not show the reason; the provider gets no notice on completion or conversion (FR-037 REQ-037-078, REQ-037-079)", "rationale": "Event Catalog table, row monitoring.assignment_ended. Category: Monitoring. Event nodes: EVT-monitoring-assignment-ended."}}
  - {"op": "add_node", "id": "REQ-030-255", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Admin Intervention Notice", "attrs": {"statement": "Admin Intervention Notice (message.admin_intervention) is an admin-configurable notification event. Primary recipients: Patient, Provider. Sent to both parties of a conversation when an Admin intervenes in it (FR-012 REQ-012-007). Locked: the toggle cannot be switched off and the notice is held for no one", "rationale": "Event Catalog table, row message.admin_intervention. Category: Messaging/Support. Event nodes: EVT-admin-intervention-sent."}}
  - {"op": "add_node", "id": "REQ-030-256", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Keyword Flag Raised", "attrs": {"statement": "Keyword Flag Raised (message.keyword_flag_raised) is an admin-configurable notification event. Primary recipients: Admin. Sent to Admins when a conversation is flagged for a policy keyword, with a link to the flagged conversation (FR-012 REQ-012-094, REQ-012-026). The patient and the provider are not told. Locked: the toggle cannot be switched off", "rationale": "Event Catalog table, row message.keyword_flag_raised. Category: Messaging/Support. Event nodes: EVT-keyword-flag-raised."}}
  - {"op": "add_node", "id": "REQ-030-257", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Provider Response Reminder", "attrs": {"statement": "Provider Response Reminder (message.provider_response_reminder) is an admin-configurable notification event. Primary recipients: Provider. Sent when a patient message has had no provider reply for 48 hours, once per unanswered stretch and not while the conversation is read-only; if there is still no reply at 72 hours further reminders follow (FR-012 REQ-012-098)", "rationale": "Event Catalog table, row message.provider_response_reminder. Category: Messaging/Support. Event nodes: EVT-provider-response-reminder, EVT-provider-response-escalated."}}
  - {"op": "add_node", "id": "REQ-030-258", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Urgent Case Unassigned Alert", "attrs": {"statement": "Urgent Case Unassigned Alert (support.urgent_case_unassigned) is an admin-configurable notification event. Primary recipients: Admin (Support Staff pool). Sent when an Open or In Progress Urgent case is still unassigned 1 hour after the Urgent clock started (FR-034 REQ-034-092, REQ-034-173)", "rationale": "Event Catalog table, row support.urgent_case_unassigned. Category: Messaging/Support. Event nodes: none (Rule only)."}}
  - {"op": "add_node", "id": "REQ-030-259", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Support Case Orphaned", "attrs": {"statement": "Support Case Orphaned (support.case_orphaned) is an admin-configurable notification event. Primary recipients: Admin (Support Staff pool). Sent when the assigned admin of a case is deactivated and the case becomes unassigned, so that the case can be reassigned (FR-034 REQ-034-108)", "rationale": "Event Catalog table, row support.case_orphaned. Category: Messaging/Support. Event nodes: none (Rule only)."}}
  - {"op": "add_node", "id": "REQ-030-260", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Support Notice Delivery Failed", "attrs": {"statement": "Support Notice Delivery Failed (support.notice_delivery_failed) is an admin-configurable notification event. Primary recipients: Admin (the assigned admin, or the Support Staff pool when the case is unassigned). Sent when a support notice to a patient or provider still fails once the retry rule is exhausted, so that the admin contacts the person manually (FR-034 REQ-034-113)", "rationale": "Event Catalog table, row support.notice_delivery_failed. Category: Messaging/Support. Event nodes: none (Rule only)."}}
  - {"op": "add_node", "id": "REQ-030-261", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Payout Dispute Resolved", "attrs": {"statement": "Payout Dispute Resolved (payout.dispute_resolved) is an admin-configurable notification event. Primary recipients: Provider. Sent when an admin saves a dispute resolution (FR-017 REQ-017-111): automatic and mandatory for Add to Next Payout and Pay Now, and for the other resolution actions only when the admin ticks Notify Provider. Locked: the toggle cannot be switched off", "rationale": "Event Catalog table, row payout.dispute_resolved. Category: Billing/Payouts. Event nodes: EVT-billing-dispute-payout-added."}}
  - {"op": "add_node", "id": "REQ-030-262", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Identity Re-verification Code", "attrs": {"statement": "Identity Re-verification Code (account.reauth_code) is an admin-configurable notification event. Primary recipients: Patient. 6-digit code sent to the patient's registered email when the patient re-verifies identity before a sensitive change (FR-001 Screen 18); its own event, separate from the registration code; security-critical and non-disableable by default", "rationale": "Event Catalog table, row account.reauth_code. Category: Account/Auth. Event nodes: EVT-reauth-otp-sent."}}
  - {"op": "add_node", "id": "REQ-030-263", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Patient Profile Changed by Admin", "attrs": {"statement": "Patient Profile Changed by Admin (account.profile_changed_by_admin) is an admin-configurable notification event. Primary recipients: Patient. Sent by email after every admin edit of the patient profile; the notice lists the changed fields and the patient has no review screen (FR-001 REQ-001-034, REQ-001-035)", "rationale": "Event Catalog table, row account.profile_changed_by_admin. Category: Account/Auth. Event nodes: EVT-patient-profile-changed-by-admin."}}
  - {"op": "add_node", "id": "REQ-030-264", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Formal Warning to Patient", "attrs": {"statement": "Formal Warning to Patient (account.formal_warning) is an admin-configurable notification event. Primary recipients: Patient. Sent when an admin sends a formal warning from Take Action on a flagged conversation (FR-016 REQ-016-225)", "rationale": "Event Catalog table, row account.formal_warning. Category: Account/Auth. Event nodes: none (Rule only)."}}
  - {"op": "add_node", "id": "REQ-030-265", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Travel Information Requested", "attrs": {"statement": "Travel Information Requested (travel.request_sent) is an admin-configurable notification event. Primary recipients: Patient. Email and in-app (FR-008 REQ-008-071). Covers the initial passport request, the initial flight and hotel request, an admin Re-notify and the passport Incomplete notice", "rationale": "Event Catalog table, row travel.request_sent. Category: Travel. Event nodes: EVT-travel-request-sent."}}
  - {"op": "add_node", "id": "REQ-030-266", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Travel Record Submitted", "attrs": {"statement": "Travel Record Submitted (travel.record_submitted) is an admin-configurable notification event. Primary recipients: Provider. Email and in-app (FR-008 REQ-008-071). Sent when the patient submits a travel record", "rationale": "Event Catalog table, row travel.record_submitted. Category: Travel. Event nodes: EVT-travel-record-submitted."}}
  - {"op": "add_node", "id": "REQ-030-267", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Travel Record Entered", "attrs": {"statement": "Travel Record Entered (travel.record_entered) is an admin-configurable notification event. Primary recipients: Patient. Email and in-app (FR-008 REQ-008-071). Sent when the provider enters a travel record for the patient", "rationale": "Event Catalog table, row travel.record_entered. Category: Travel. Event nodes: EVT-travel-record-entered."}}
  - {"op": "add_node", "id": "REQ-030-268", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Travel Record Corrected", "attrs": {"statement": "Travel Record Corrected (travel.record_corrected) is an admin-configurable notification event. Primary recipients: Patient, Provider. Email and in-app (FR-008 REQ-008-071). Sent when an admin corrects a travel record", "rationale": "Event Catalog table, row travel.record_corrected. Category: Travel. Event nodes: EVT-travel-record-corrected."}}
  - {"op": "add_node", "id": "REQ-030-269", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Travel Date Review Required", "attrs": {"statement": "Travel Date Review Required (travel.date_review_required) is an admin-configurable notification event. Primary recipients: Patient, Provider, Admin. Email and in-app (FR-008 REQ-008-071). Sent when a change of treatment date means the travel dates must be reviewed", "rationale": "Event Catalog table, row travel.date_review_required. Category: Travel. Event nodes: EVT-travel-date-review-required."}}
  - {"op": "add_node", "id": "REQ-030-270", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: No Travel Declared", "attrs": {"statement": "No Travel Declared (travel.no_travel_declared) is an admin-configurable notification event. Primary recipients: Provider. Email and in-app (FR-008 REQ-008-071). Sent when the patient declares that no travel is needed and when an admin overrides that declaration (FR-008 REQ-008-059)", "rationale": "Event Catalog table, row travel.no_travel_declared. Category: Travel. Event nodes: none (Rule only)."}}
  - {"op": "add_node", "id": "REQ-030-271", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Travel Record Re-entry Requested", "attrs": {"statement": "Travel Record Re-entry Requested (travel.record_reentry_requested) is an admin-configurable notification event. Primary recipients: Patient or Provider (the owner of the item). Email and in-app (FR-008 REQ-008-071). Sent after an admin soft-deletes a travel or passport item, asking its owner to enter it again (FR-008 REQ-008-067, REQ-008-076)", "rationale": "Event Catalog table, row travel.record_reentry_requested. Category: Travel. Event nodes: none (Rule only)."}}
  - {"op": "add_node", "id": "REQ-030-272", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Treatment Added to Catalog", "attrs": {"statement": "Treatment Added to Catalog (treatment.added) is an admin-configurable notification event. Primary recipients: Provider. Sent to all active providers the first time a treatment becomes Active, by any route; a treatment saved as Draft or Inactive sends nothing until then (FR-024 REQ-024-041)", "rationale": "Event Catalog table, row treatment.added. Category: Treatment Catalog. Event nodes: EVT-treatment-added."}}
  - {"op": "add_node", "id": "REQ-030-273", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Treatment Updated in Catalog", "attrs": {"statement": "Treatment Updated in Catalog (treatment.updated) is an admin-configurable notification event. Primary recipients: Provider. Sent to the providers who currently offer the treatment when an admin updates an Active treatment; an edit of a Draft, Inactive or Pending Media Upload treatment sends nothing. When an Inactive treatment that has been Active before is switched back to Active, the notice reads that the treatment is available again and goes only to providers with a pricing configuration for it; the same event is used (FR-024 REQ-024-042)", "rationale": "Event Catalog table, row treatment.updated. Category: Treatment Catalog. Event nodes: EVT-treatment-updated."}}
  - {"op": "add_node", "id": "REQ-030-274", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Treatment Deactivated in Catalog", "attrs": {"statement": "Treatment Deactivated in Catalog (treatment.deactivated) is an admin-configurable notification event. Primary recipients: Provider. Sent to the providers who offer the treatment when an admin deactivates it (FR-024 REQ-024-043)", "rationale": "Event Catalog table, row treatment.deactivated. Category: Treatment Catalog. Event nodes: EVT-treatment-deactivated."}}
  - {"op": "add_node", "id": "REQ-030-275", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Promotion Terms Changed", "attrs": {"statement": "Promotion Terms Changed (promotion.terms_changed) is an admin-configurable notification event. Primary recipients: Provider (every adopting provider). Sent when an admin edits the Value or the Hairline Share % of an adopted Both Fees program; the notice shows the old and the new terms, and each adoption stays Accepted (FR-019 REQ-019-118, REQ-019-010)", "rationale": "Event Catalog table, row promotion.terms_changed. Category: Promotions/Discounts. Event nodes: none (Rule only)."}}
  - {"op": "add_node", "id": "REQ-030-276", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Promotion Adoption Force-Revoked, Program Paused or Resumed", "attrs": {"statement": "Promotion Adoption Force-Revoked, Program Paused or Resumed (promotion.adoption_force_revoked / promotion.program_paused / promotion.program_resumed) is an admin-configurable notification event. Primary recipients: Provider (the adopting providers). Sent to the adopting providers when an admin Force-Revokes an adoption, pauses an adopted program or resumes it (FR-019 REQ-019-010)", "rationale": "Event Catalog table, row promotion.adoption_force_revoked / promotion.program_paused / promotion.program_resumed. Category: Promotions/Discounts. Event nodes: none (Rule only)."}}
  - {"op": "add_node", "id": "REQ-030-277", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Promotion Adoption Revoked by Provider", "attrs": {"statement": "Promotion Adoption Revoked by Provider (promotion.adoption_revoked_by_provider) is an admin-configurable notification event. Primary recipients: Admin. Sent to admins when a provider revokes its own adoption of a program (FR-019 REQ-019-010)", "rationale": "Event Catalog table, row promotion.adoption_revoked_by_provider. Category: Promotions/Discounts. Event nodes: none (Rule only)."}}
  - {"op": "add_node", "id": "REQ-030-278", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Team Invitation Sent", "attrs": {"statement": "Team Invitation Sent (team.invitation_sent) is an admin-configurable notification event. Primary recipients: Team invitee. Invitation email to a person invited to join a provider team (FR-009)", "rationale": "Event Catalog table, row team.invitation_sent. Category: Provider Team. Event nodes: EVT-team-invitation-sent."}}
  - {"op": "add_node", "id": "REQ-030-279", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Team Invitation Accepted", "attrs": {"statement": "Team Invitation Accepted (team.invitation_accepted) is an admin-configurable notification event. Primary recipients: Provider Owner, the new team member. Confirmation email to both when an invitation is accepted (FR-009 REQ-009-046)", "rationale": "Event Catalog table, row team.invitation_accepted. Category: Provider Team. Event nodes: EVT-team-invitation-accepted."}}
  - {"op": "add_node", "id": "REQ-030-280", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Team Member Role Changed", "attrs": {"statement": "Team Member Role Changed (team.member_role_changed) is an admin-configurable notification event. Primary recipients: Provider (the affected team member). Email telling the member the new role (FR-009 REQ-009-058)", "rationale": "Event Catalog table, row team.member_role_changed. Category: Provider Team. Event nodes: EVT-team-member-role-changed."}}
  - {"op": "add_node", "id": "REQ-030-281", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Team Member Removed", "attrs": {"statement": "Team Member Removed (team.member_removed) is an admin-configurable notification event. Primary recipients: Provider (the removed member), Provider Owner. Sent when a member is removed from the team (FR-009 REQ-009-081)", "rationale": "Event Catalog table, row team.member_removed. Category: Provider Team. Event nodes: EVT-team-member-removed."}}
  - {"op": "add_node", "id": "REQ-030-282", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Team Member Suspended or Reactivated", "attrs": {"statement": "Team Member Suspended or Reactivated (team.member_suspended / team.member_reactivated) is an admin-configurable notification event. Primary recipients: Provider (the affected team member). Sent to the member when a suspension is set and again when it is lifted (FR-009 REQ-009-082, REQ-009-192)", "rationale": "Event Catalog table, row team.member_suspended / team.member_reactivated. Category: Provider Team. Event nodes: EVT-team-member-suspended."}}
  - {"op": "add_node", "id": "REQ-030-283", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Owner Role Handed Over", "attrs": {"statement": "Owner Role Handed Over (team.owner_handover) is an admin-configurable notification event. Primary recipients: Provider Owner (the new Owner and the previous Owner). Email to both when a Hairline admin hands the Owner role to another team member (FR-009 REQ-009-174)", "rationale": "Event Catalog table, row team.owner_handover. Category: Provider Team. Event nodes: none (Rule only)."}}
  - {"op": "add_node", "id": "REQ-030-284", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Team Invitation Delivery Failed", "attrs": {"statement": "Team Invitation Delivery Failed (team.invitation_delivery_failed) is an admin-configurable notification event. Primary recipients: Admin. Sent when an invitation email still fails once the retry rule is exhausted (FR-009 REQ-009-055)", "rationale": "Event Catalog table, row team.invitation_delivery_failed. Category: Provider Team. Event nodes: EVT-team-invitation-delivery-failed."}}
  - {"op": "add_node", "id": "REQ-030-285", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Aftercare Request Assigned", "attrs": {"statement": "Aftercare Request Assigned (aftercare.request_assigned) is an admin-configurable notification event. Primary recipients: Provider. Sent to the provider an aftercare request is assigned to (FR-011)", "rationale": "Event Catalog table, row aftercare.request_assigned. Category: Aftercare. Event nodes: EVT-aftercare-request-assigned."}}
  - {"op": "add_node", "id": "REQ-030-286", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Aftercare Payment Due", "attrs": {"statement": "Aftercare Payment Due (aftercare.payment_due) is an admin-configurable notification event. Primary recipients: Patient. Sent when payment for an aftercare request is due (FR-011)", "rationale": "Event Catalog table, row aftercare.payment_due. Category: Aftercare. Event nodes: EVT-aftercare-payment-due."}}
  - {"op": "add_node", "id": "REQ-030-287", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Aftercare Request Rejected or Expired", "attrs": {"statement": "Aftercare Request Rejected or Expired (aftercare.request_rejected / aftercare.request_expired) is an admin-configurable notification event. Primary recipients: Patient. Sent when an aftercare request is rejected or expires; for a request converted from a monitoring case the notice says the patient may start a new standalone request pre-filled from the same source data (FR-011 REQ-011-094)", "rationale": "Event Catalog table, row aftercare.request_rejected / aftercare.request_expired. Category: Aftercare. Event nodes: EVT-aftercare-request-rejected, EVT-aftercare-request-expired."}}
  - {"op": "add_node", "id": "REQ-030-288", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Aftercare Awaiting Provider Availability", "attrs": {"statement": "Aftercare Awaiting Provider Availability (aftercare.awaiting_availability) is an admin-configurable notification event. Primary recipients: Patient. Sent when an aftercare request is waiting for a provider to become available (FR-011)", "rationale": "Event Catalog table, row aftercare.awaiting_availability. Category: Aftercare. Event nodes: EVT-aftercare-awaiting-availability."}}
  - {"op": "add_node", "id": "REQ-030-289", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Aftercare Provider Withdrawn", "attrs": {"statement": "Aftercare Provider Withdrawn (aftercare.provider_withdrawn) is an admin-configurable notification event. Primary recipients: Admin. Sent when the provider of an aftercare case withdraws (FR-011)", "rationale": "Event Catalog table, row aftercare.provider_withdrawn. Category: Aftercare. Event nodes: EVT-aftercare-provider-withdrawn."}}
  - {"op": "add_node", "id": "REQ-030-290", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Aftercare Assigned to Hairline Team", "attrs": {"statement": "Aftercare Assigned to Hairline Team (aftercare.team_assigned) is an admin-configurable notification event. Primary recipients: Admin, aftercare team. Sent when an aftercare case is assigned to the Hairline team (FR-011)", "rationale": "Event Catalog table, row aftercare.team_assigned. Category: Aftercare. Event nodes: EVT-aftercare-team-assigned."}}
  - {"op": "add_node", "id": "REQ-030-291", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Aftercare Plan Setup Reminder and Escalation", "attrs": {"statement": "Aftercare Plan Setup Reminder and Escalation (aftercare.plan_setup_reminder / aftercare.plan_setup_escalated) is an admin-configurable notification event. Primary recipients: Provider (reminder), Admin (escalation). Sent when an aftercare plan is not finished: the assignee is reminded after 2 days and the case is escalated to the admin after 4 days; both day counts are admin settings (FR-011 REQ-011-090)", "rationale": "Event Catalog table, row aftercare.plan_setup_reminder / aftercare.plan_setup_escalated. Category: Aftercare. Event nodes: none (Rule only)."}}
  - {"op": "add_node", "id": "REQ-030-292", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Provider Role Sync Failed", "attrs": {"statement": "Provider Role Sync Failed (system.role_sync_failed) is an admin-configurable notification event. Primary recipients: Admin (all Super Admins). In-app alert sent when a provider role permission change fails to reach the Provider Platform after the automatic retries (FR-031 REQ-031-130)", "rationale": "Event Catalog table, row system.role_sync_failed. Category: System/Operations. Event nodes: none (Rule only)."}}
  - {"op": "add_node", "id": "REQ-030-293", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Recurring Export Paused", "attrs": {"statement": "Recurring Export Paused (analytics.recurring_export_paused) is an admin-configurable notification event. Primary recipients: Provider (the clinic Owner). In-app notice sent when a recurring export is paused because its owner was removed or lost access to a widget in it (FR-014 REQ-014-322)", "rationale": "Event Catalog table, row analytics.recurring_export_paused. Category: System/Operations. Event nodes: none (Rule only)."}}
  - {"op": "add_node", "id": "REQ-030-294", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Recurring Export Failed", "attrs": {"statement": "Recurring Export Failed (analytics.recurring_export_failed) is an admin-configurable notification event. Primary recipients: Provider (the configuration owner). In-app notice sent when a recurring run fails its final retry (FR-014 REQ-014-323)", "rationale": "Event Catalog table, row analytics.recurring_export_failed. Category: System/Operations. Event nodes: none (Rule only)."}}
