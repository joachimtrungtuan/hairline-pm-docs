# Cross-FR alignment for FR-019 to FR-023: new rules REQ-019-119, REQ-023-047 and REQ-023-048, the event dsr.obligation_block_ended, the attempt field opened_at, and statement updates that mirror the revised PRDs.
# Cross-FR edges: edges from FR-023 and FR-020 rules to nodes owned by FR-019, FR-023 and FR-024 (ENT-treatment, ENT-package); the shared stages STG-patient-06-deletion-requested emits the new event. The edge from FR-021 to REQ-026-050 is removed because FR-021 no longer cites that rule.
reason: "Cross-FR alignment of FR-019 to FR-023: the affiliate code registration rejection, the FR-020 catalogue mirror (mandatory flags, reminder offsets, monitoring scope, closure and escalation rows), the admin timezone wording, the FR-022 System Flagged, Flag Category and treatment Status filters, the search audit log with no reading screen, and the FR-023 login, attachment, legal record, draft and notice rules."
by: docs-manager
operations:
  - {"op": "add_node", "id": "REQ-019-119", "type": "Rule", "owner_fr": "FR-019", "title": "A generated affiliate code is rejected with a named reason when its text already exists or its program is not Affiliate-bound", "attrs": {"statement": "When FR-018 registers a generated code, FR-019 rejects the registration with a named reason when the code text already exists on the platform (REQ-019-076) or the chosen program is not an Affiliate-bound program; FR-018 shows the returned reason on that row and the admin retries."}}
  - {"op": "add_node", "id": "REQ-023-047", "type": "Rule", "owner_fr": "FR-023", "title": "A patient can log in while a deletion request is open; at Fulfilled every session ends and the email address is free", "attrs": {"statement": "While a deletion request is open (any status before Fulfilled or Denied) the patient can still log in (FR-001 REQ-001-068). When the request becomes Fulfilled, every session of the patient ends, login with the old credentials gets the standard \"Invalid email or password\" result (FR-001 REQ-001-065), and the email address is free for a new registration, which creates a new account with no link to the old data (FR-001 REQ-001-182)."}}
  - {"op": "add_node", "id": "REQ-023-048", "type": "Rule", "owner_fr": "FR-023", "title": "FR-024 drafts are not patient records; a discarded draft is soft-deleted and the discard is audited", "attrs": {"statement": "Treatment and package drafts of FR-024 hold no patient data and are not patient records, so a deletion request never touches them. A discarded draft follows the platform soft-delete rule (REQ-SYS-003): it is removed from every list and archived, and the discard is kept in the audit log (FR-024 REQ-024-022, REQ-023-011)."}}
  - {"op": "add_node", "id": "EVT-dsr-obligation-block-ended", "type": "Event", "owner_fr": "FR-023", "title": "dsr.obligation_block_ended", "attrs": {"description": "dsr.obligation_block_ended: the obligation that blocked a deletion request has ended; the patient is told the request resumes (REQ-023-029, REQ-020-163)."}}
  - {"op": "add_field", "id": "ENT-notification-attempt.opened_at", "entity_id": "ENT-notification-attempt", "name": "opened_at", "data_type": "datetime", "title": "Opened at", "owner_fr": "FR-020", "required": false, "attrs": {"description": "Email attempts only: the time the recipient opened the email. Opened applies to email only, and the FR-030 escalation condition Not opened reads it (REQ-020-041)."}}
