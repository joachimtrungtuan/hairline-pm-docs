  - {"op": "update_node", "id": "REQ-019-036", "attrs": {"statement": "Exactly one discount affects the patient's final price; audit records which program was applied and which was superseded. If a valid affiliate-bound code/link was already captured as the patient acquisition source, FR-019 preserves that affiliate attribution metadata for FR-018 even when a provider-side promotion wins the price-discount priority. The capture is stored with the patient's inquiry journey (FR-018 REQ-018-308) and FR-019 reads it at quote acceptance; it is honoured only when the affiliate is Active at that moment, otherwise it earns no credit, no commission and no attribution."}}
  - {"op": "update_node", "id": "REQ-020-029", "attrs": {"statement": "Source of truth: FR-030: Notification Rules & Configuration (Admin-Configurable Notification Event Catalog). The table below mirrors FR-030 for completeness; if any mismatch exists, FR-030 prevails. The table does not repeat every catalogue row: an FR-030 catalogue event with no row here (for example the monitoring assignment-ended, chat, travel, provider team, aftercare, promotion, support-alert and recurring-export notices) is still a notice of this service, and its FR-030 Rule applies. Each row is a pointer to the FR-030 catalogue entry of the same event, and FR-030 owns that row's recipients, channels, content and whether the notice can be switched off. Events that produce a notification are owned by the FR-030 catalogue (see Event Ownership in Business Rules)."}}
  - {"op": "update_node", "id": "REQ-020-041", "attrs": {"statement": "One notification record per recipient and event, with one attempt row per channel attempt under it; each attempt row carries channel, provider, status, timestamp and, on failure, the cause. Attempt status is one of queued, sent, delivered, failed, suppressed, deferred, coalesced. The in-app record is the notification record itself and has no attempt row, so an attempt's channel is email, push or sms. An email attempt row also carries an opened marker, the time the recipient opened the email; opened applies to email only, and the FR-030 escalation condition Not opened reads it."}}
  - {"op": "update_node", "id": "REQ-020-092", "attrs": {"statement": "Notification catalog event booking.cancelled (Booking Cancelled), category Booking/Schedule. Primary recipients: Patient, Provider, Admin (optional). Notes: Fires for an Admin cancellation, a provider drop-out at the FR-006 Screen 10 submit, and a system cancellation for an unpaid balance (including an FR-007B installment plan default). A closure for provider suspension or deactivation sends booking.provider_fault_replacement to the patient and not booking.cancelled. The reason text each recipient sees is the one FR-006 defines (REQ-006-011). Mandatory — admin cannot disable this event"}}
  - {"op": "update_node", "id": "REQ-020-093", "attrs": {"statement": "Notification catalog event booking.appointment_reminder (Appointment Reminder), category Booking/Schedule. Primary recipients: Patient, Provider. Notes: Two reminders by default, 7 days and 1 day before the appointment (REQ-030-048); admin-switchable, not a locked notice"}}
  - {"op": "update_node", "id": "REQ-020-100", "attrs": {"statement": "Notification catalog event payment.received (Payment Received / Receipt), category Payment. Primary recipients: Patient, Provider, Admin (optional). Notes: Mandatory — admin cannot disable this event; critical"}}
  - {"op": "update_node", "id": "REQ-020-101", "attrs": {"statement": "Notification catalog event payment.failed (Payment Failed), category Payment. Primary recipients: Patient, Admin (optional). Notes: Mandatory — admin cannot disable this event; critical"}}
  - {"op": "update_node", "id": "REQ-020-123", "attrs": {"statement": "Notification catalog event monitoring.assignment_pending (Monitoring Case Pending Assignment), category Monitoring. Primary recipients: Admin. Notes: Advice-mode hair-loss monitoring case activated and awaiting provider assignment (FR-037 only)"}}
  - {"op": "update_node", "id": "REQ-020-124", "attrs": {"statement": "Notification catalog event monitoring.provider_assigned (Monitoring Provider Assigned), category Monitoring. Primary recipients: Patient, Provider. Notes: Initial assignment only; a reassignment uses monitoring.provider_reassigned (FR-037 only)"}}
  - {"op": "update_node", "id": "REQ-020-125", "attrs": {"statement": "Notification catalog event monitoring.provider_withdrawn (Monitoring Provider Withdrawn), category Monitoring. Primary recipients: Admin, Patient. Notes: Provider withdraws with reason; case returns to Admin as Pending Reassignment (FR-037 only)"}}
  - {"op": "update_node", "id": "REQ-020-127", "attrs": {"statement": "Notification catalog event monitoring.advice_posted (Monitoring Advice Posted), category Monitoring. Primary recipients: Patient. Notes: Provider submits or edits the one advice-window paragraph for the current window (FR-037 only)"}}
  - {"op": "update_node", "id": "REQ-020-130", "attrs": {"statement": "Notification catalog event monitoring.converted_to_inquiry (Monitoring Converted to Inquiry), category Monitoring. Primary recipients: Patient. Notes: Monitoring case successfully converts into a distinct FR-003 inquiry (FR-037 only; FR-038 converts to a standalone aftercare request instead)"}}
  - {"op": "update_node", "id": "REQ-020-138", "attrs": {"statement": "Notification catalog event provider.status_cancellation_patient (Provider-Caused Cancellation / Offer Unavailable), category Provider/Compliance. Primary recipients: Patient. Notes: FR-015 Alternative Flow A5 / Screen 4. One per affected inquiry/case when provider suspension (ProviderSuspended) or deactivation (ProviderDeactivated) cancels the patient's case or the provider's offer before acceptance. A cancelled unsent draft quote alone does not trigger this notice, because the patient never saw it. For a case already accepted, the patient instead receives booking.provider_fault_replacement. Before acceptance, three variants apply, chosen in this order (FR-003 Workflow 2 Alternative Flow B4, REQ-003-021): (1) when other live offers remain, the notice says \"[Clinic] is no longer available. Your other offers are still open.\"; (2) when no live offer remains and the patient had explicitly selected the affected provider, the notice asks the patient to confirm the redistribution first and carries Confirm and Decline deep links to FR-003 Screen 8 (REQ-003-128); (3) when no live offer remains and the patient made no explicit selection, the notice says \"[Clinic] is no longer available. We are finding new offers for you.\" Includes inquiry/case reference and a Contact Admin/Support action. MUST NOT say the patient cancelled, instruct payment against the cancelled selection, or expose confidential suspension/deactivation reasons. Mandatory (cannot be disabled in FR-030 rules); sent regardless of FR-015's \"Notify Provider\" checkbox. MVP channels: Email + Push + in-app"}}
  - {"op": "update_node", "id": "REQ-020-146", "attrs": {"statement": "Notification catalog event provider.closure_rejected (Provider Account-Closure Request Rejected), category Provider/Compliance. Primary recipients: Provider. Notes: FR-015 A7 step 6 / FR-032 step 16. Sent when an admin rejects a closure request. Email states that the account keeps its current status, gives the admin review notes, and the admin support contact. Mandatory; cannot be disabled in FR-030 rules. Unaffected by FR-032 category preferences (account notice). Email only"}}
  - {"op": "update_node", "id": "REQ-020-148", "attrs": {"statement": "Notification catalog event system.escalation (System Escalation), category System/Operations. Primary recipients: Admin. Notes: Operational escalation events requiring admin action. Mandatory — admin cannot disable this event"}}
  - {"op": "update_node", "id": "REQ-020-149", "attrs": {"statement": "Notification catalog event system.alert (System Alert), category System/Operations. Primary recipients: Admin. Notes: System health/monitoring alerts surfaced via notifications. Mandatory — admin cannot disable this event"}}
  - {"op": "update_node", "id": "REQ-021-126", "attrs": {"statement": "Provider and admin screens MUST format dates and numbers by the selected locale. Provider screens MUST use the provider timezone set in FR-032 (a value from the FR-026 GMT list); admin screens MUST use the admin's browser timezone with the zone named beside the time (FR-026 General Module Rule 5)."}}
  - {"op": "update_node", "id": "REQ-022-122", "attrs": {"statement": "FR-012 / Screen 5: Communication Monitoring Center [P1 — MVP]. Admin searches for and filters all platform conversations for oversight and support. Search: Patient / provider / keyword / inquiry ID (Type: text; Placeholder: \"Search conversations…\"; Min Length: 2 chars; Debounce: 500ms; Notes: Searches across all four fields simultaneously). Filters: Patient (Type: Autocomplete; Options: Matching patient names; Default: None; Logic: Exact selection) / Provider (Type: Autocomplete; Options: Matching provider names; Default: None; Logic: Exact selection) / Service Type (Type: Multi-select; Options: All; platform-defined service types; Default: All; Logic: OR (within field)) / Quote ID (text (optional); \"Filter by quote ID…\"; —; Optional exact match) / Inquiry ID (text (optional); \"Filter by inquiry ID…\"; —; Optional exact match) / Date Range (Type: Date range picker + presets; Options: Custom; Today, Last 7 days, Last 30 days, All; Default: All; Logic: Filters by message date) / Flag Type (Type: Multi-select; Options: Keyword Flagged, Manually Flagged, System Flagged, Intervened, No Flags; Default: All; Logic: OR (within field)) / Flag Category (Type: Multi-select; Options: Off-Platform Risk, Potential Dispute, Quality Concern, Follow-Up Needed, Other; Default: All; Logic: OR (within field)) / Conversation Status (Type: Multi-select; Options: Active, Resolved, Escalated; Default: All; Logic: OR (within field)). Active filters combine, and the filters are remembered."}}
  - {"op": "update_node", "id": "REQ-022-108", "attrs": {"statement": "FR-024 / Screen 1: Admin Treatment Catalog [P1 — MVP]. Admin searches for and filters the global treatment catalog. Search: Treatment name (Type: text; Placeholder: \"Search treatments…\"; Debounce: 300ms; Notes: Real-time filter; case-insensitive). Filters: Treatment Type (Type: Dropdown; Options: All; admin-defined treatment types; Default: All; Logic: Exact match) / Status (Type: Dropdown; Options: All, Active, Pending Media Upload, Draft, Inactive; Default: All; Logic: Exact match)."}}
  - {"op": "update_node", "id": "REQ-022-140", "attrs": {"statement": "The search audit log MUST be kept for audit purposes (who searched for whom, when) for the same period as the FR-031 admin audit trail (REQ-031-015). No screen reads this log in this release; it is stored for audit only."}}
  - {"op": "update_node", "id": "REQ-023-033", "attrs": {"statement": "System records the anonymisation actions in the audit log and notifies the patient of the outcome once, listing the actions taken and the legal basis and scope of the retained categories. The notice goes to the contact address the system captured when the request was approved, before any anonymisation; that copy is kept only until the notice is delivered, or until its last retry has failed, and is then anonymised with the rest. The notice goes by email only (the critical dsr.fulfilled notice of the FR-020 catalogue) and creates no in-app record; when the email still fails after the last retry, the Admin sees the failure in the delivery log (FR-020 REQ-020-161)."}}
  - {"op": "update_node", "id": "REQ-023-042", "attrs": {"statement": "When an Admin approves a deletion request, the system MUST cancel the patient's open inquiry through FR-003 (REQ-003-103) before any data is anonymised, so the cancellation and its provider notices run on the identifiable record. The cancellation happens at approval, never at submission; a denied request and a request blocked by an obligation cancel nothing. The cancelled inquiry and quotes are retained under REQ-023-003 and REQ-023-040. Anonymisation starts only after the FR-003 cancellation and its provider notices complete (a notice is complete when its first attempt has been handed to a channel or it has ended failed after the last retry, FR-020 REQ-020-040). If the cancellation fails, the request stays In Progress, the queue shows that it needs attention and the system retries; nothing is anonymised until the cancellation succeeds."}}
  - {"op": "update_node", "id": "REQ-023-044", "attrs": {"statement": "System MUST assign every record type to exactly one data category by the record-type mapping below. Reviews, messages and support cases are Communications and are anonymised in place. Inquiries are Medical Records, and quotes, acceptance events and bookings are Financial Records; they are retained records under REQ-023-003 and REQ-023-040. Scan media are Medical Records. Message attachments belong to their message and are anonymised in place with it. Legal acceptance records (acceptances, legal audit entries and reminders) are Account Profile."}}
  - {"op": "remove_edge", "from": "FR-021", "verb": "references", "to": "REQ-026-050"}
