  # ---- P1-01, P1-02, P1-09: inquiry.cancelled and quote.cancelled_inquiry ----
  - op: update_node
    id: REQ-020-076
    attrs:
      statement: 'Notification catalog event inquiry.cancelled (Inquiry Cancelled), category Inquiry. Primary recipients: Patient, Admin (optional). Notes: Fires when a patient cancels the inquiry in the Inquiry or Quoted stage (FR-003 Workflow 5) and when an admin closes the inquiry (FR-006 Close inquiry, cancelled_by = admin; REQ-003-014). The patient receives the cancellation confirmation (mandatory, aligns with FR-003 Workflow 5 step 4 and Screen 8b); for an admin close the patient notice carries the reason as FR-006 defines. Providers are not recipients: each provider holding a quote for the inquiry in draft, sent or expired state is told by quote.cancelled_inquiry only, and a provider that never quoted is told nothing (REQ-020-020). The reason a patient gives is patient-private. MVP default channels: Email + Push.'
      rationale: 'Event Catalog table. The table mirrors FR-030; FR-030 prevails on any mismatch.'
  - op: update_node
    id: REQ-020-020
    title: quote.cancelled_inquiry goes only to quote-holding providers and is critical
    attrs:
      statement: 'System MUST always send quote.cancelled_inquiry, and only that notice, to each provider holding a quote for the inquiry in draft, sent or expired state when a patient cancels the inquiry or an admin closes it (never to the provider of a replacement draft quote, REQ-003-127); a provider that never quoted is told nothing; neither FR-030 toggles nor FR-032 provider notification preferences may suppress it. The reason is patient-private: a patient cancellation says only Inquiry cancelled by patient, an admin close says the inquiry was closed by Hairline and gives no reason. The notice is critical (REQ-020-158): its target is a first send attempt within 5 minutes, and a failed first attempt is retried under the FR-030 retry rule (up to 3 retries, 1 hour apart by default), so 5 minutes is a target, not a guarantee.'
      rationale: 'Functional Requirements Summary and the quote.cancelled_inquiry catalogue row (a pointer to REQ-030-039). FR-030 and FR-003 are queued to align REQ-030-039, REQ-030-219 and REQ-003-100.'

  # ---- P1-11: booking.cancelled causes ----
  - op: update_node
    id: REQ-020-092
    attrs:
      statement: 'Notification catalog event booking.cancelled (Booking Cancelled), category Booking/Schedule. Primary recipients: Patient, Provider, Admin (optional). Notes: Covers every cause of a booking cancellation: Admin cancellation, patient drop-out, unpaid balance or installment plan default (FR-007B), and provider fault. The reason text each recipient sees is the one FR-006 defines (REQ-006-011).'
      rationale: 'Event Catalog table. The table mirrors FR-030; FR-030 prevails on any mismatch. EVT-booking-cancelled is FR-030-owned; the emits edge at STG-main-05-payment is queued for FR-030.'

  # ---- P1-15: affiliate notices by email only ----
  - op: update_node
    id: REQ-020-104
    attrs:
      statement: 'Notification catalog event payout.affiliate_processed (Affiliate Payout Processed), category Billing/Payouts. Primary recipients: Affiliate, Admin (optional). Notes: If affiliate program is enabled. The affiliate copy goes by email only, with no preference setting (REQ-020-027).'
  - op: update_node
    id: REQ-020-105
    attrs:
      statement: 'Notification catalog event payout.failed (Payout Failed), category Billing/Payouts. Primary recipients: Admin, Provider (optional), Affiliate (optional). Notes: Failure processing payout; recipients depend on payout type. The affiliate copy goes by email only, with no preference setting (REQ-020-027).'
  - op: update_node
    id: REQ-020-027
    attrs:
      statement: 'Affiliate Program (if enabled): Receive affiliate payout notifications by email only, with no preference setting; configuration is managed via FR-030 event catalog and rules.'

  # ---- P1-06: confirm variant deep links ----
  - op: update_node
    id: REQ-020-013
    attrs:
      statement: 'System MUST send mandatory provider.status_cancellation_patient and provider.status_cancellation_admin_support notifications for each record affected by an FR-015 provider suspension/deactivation, regardless of the Notify Provider checkbox, with privacy-safe patient content (no patient-cancelled wording, no payment instruction, no confidential reason), and MUST use the FR-003 pre-acceptance variants (Workflow 2 Alternative Flow B4, REQ-003-021): "[Clinic] is no longer available. Your other offers are still open." when other offers remain open; "[Clinic] is no longer available. We are finding new offers for you." when the inquiry is redistributed, or a confirmation request first, with Confirm and Decline deep links to FR-003 Screen 8, when the patient had explicitly selected the affected provider. When the patient has not answered after 48 hours, one mandatory reminder provider.status_redistribution_reminder follows (REQ-020-159).'

  # ---- P1-05, P1-04, P1-13, P1-16: alternative flows ----
  - op: update_node
    id: REQ-020-038
    attrs:
      statement: 'Preference Disabled. Trigger: Recipient has disabled Email or Push. Outcome: Channel suppressed; delivery attempted on remaining enabled channels (back to step 3). A mandatory patient notice is sent by email even when the patient has switched off every channel, and always appears in the in-app list; a non-mandatory notice with no channel left is recorded with status suppressed and ends.'
      rationale: 'Alternative Flow A1.'
  - op: update_node
    id: REQ-020-039
    attrs:
      statement: 'Throttling. Trigger: Excessive events in short time window. Outcome: Coalesce or defer per policy; record suppression in audit. A deferred notice returns to step 3 when its hold ends; a notice merged into another ends with status coalesced. A critical notice (REQ-020-158) is never coalesced or deferred.'
      rationale: 'Alternative Flow B1.'
  - op: update_node
    id: REQ-020-040
    title: 'B2: failed channel attempts retried under the FR-030 retry rule'
    attrs:
      statement: 'Channel Failure. Trigger: Email/push/SMS provider unavailable. Outcome: Failed attempts are retried under the FR-030 retry rule (up to 3 retries, 1 hour apart by default), each retry returning to step 4; status reflects failure cause; after the last retry the notice ends with status failed.'
      rationale: 'Alternative Flow B2. The failover clause is removed; the retry rule is owned by FR-030.'

  # ---- P1-12: one record per recipient and event, attempt rows ----
  - op: update_node
    id: REQ-020-041
    title: One notification record per recipient and event, one attempt row per channel attempt
    attrs:
      statement: 'One notification record per recipient and event, with one attempt row per channel attempt under it; each attempt row carries channel, provider, status, timestamp and, on failure, the cause. Attempt status is one of queued, sent, delivered, failed, suppressed, deferred, coalesced.'
      rationale: 'Business Rules, Delivery Audit. FR-030 delivery log is a view of the same rows (queued).'
  - op: update_node
    id: REQ-020-042
    attrs:
      statement: 'Throttling and suppression policies are transparent in audit logs: a suppressed, deferred or coalesced notice is an attempt row with that status.'
  - op: update_node
    id: REQ-020-043
    title: Event handlers are idempotent; failed deliveries retried under the FR-030 retry rule
    attrs:
      statement: 'Event-driven design; idempotent handlers; failed deliveries retried under the FR-030 retry rule (up to 3 retries, 1 hour apart by default).'
      rationale: 'Implementation Notes: promoted because idempotency is a business rule.'

  # ---- P1-08: admin recipient by held permission ----
  - op: update_node
    id: REQ-020-046
    attrs:
      statement: 'Admin recipients and event coverage are defined by the FR-030 event catalog and configured rules (no additional hard-coded admin event list in FR-020). An Admin recipient may be defined by a held permission, for example the Admins holding A-09 Edit Settings for legal.coverage_below_threshold.'
      rationale: 'Business Rules, Admin Notifications.'

  # ---- P1-14: 90-day window for all three lists ----
  - op: update_node
    id: REQ-020-068
    title: Notification lists persist 90 days, then archive
    attrs:
      statement: 'Notifications persist for 90 days then archive. The same 90-day window applies to the patient, provider and admin lists; an archived notice is no longer in the lists, and a deep link to it opens the list with a no longer available message.'
      rationale: 'Consolidated Screen Notes, Patient listing; Screens 2 and 3 point to it.'

  # ---- P1-16: step texts and the SMS step ----
  - op: update_node
    id: STP-020-005
    attrs:
      prd_ref: 'Main Flow step 3'
      description: 'Post-MVP, future phase: if SMS is enabled and the notice is urgent, the SMS path is included in routing. In MVP the step does not run; email and push only.'
  - op: update_node
    id: STP-020-006
    attrs:
      description: 'A1: the disabled channel is suppressed and delivery continues on the remaining channels (back to step 3). May also end: a mandatory patient notice still goes by email; a non-mandatory notice with no channel left is recorded as suppressed and ends.'
  - op: update_node
    id: STP-020-007
    attrs:
      description: 'B1: the notice is coalesced or deferred per policy and the suppression is audited. A deferred notice returns to step 3 when its hold ends. May also end: a coalesced notice ends with status coalesced. A critical notice skips this step.'
  - op: update_node
    id: STP-020-008
    attrs:
      description: 'B2: a failed channel attempt is retried under the FR-030 retry rule (up to 3 retries, 1 hour apart by default), each retry returning to step 4. May also end: after the last retry the notice ends with status failed.'

  # ---- P1-12, P1-15: entity and field descriptions ----
  - op: update_node
    id: ENT-notification-attempt
    attrs:
      description: 'One delivery attempt on one channel, with its status (PRD Key Entities; REQ-020-007). Many attempt rows sit under one notification record (REQ-020-041).'
  - op: update_node
    id: ENT-notification-attempt.status
    attrs:
      description: 'Status of the attempt: queued, sent, delivered, failed, suppressed, deferred or coalesced (REQ-020-041, REQ-020-042).'
  - op: update_node
    id: ENT-notification-record
    attrs:
      description: 'In-app notification shown on the notification listing screens (PRD Key Entities); one per recipient and event (REQ-020-041). Two fields (severity, priority) exist only because Screen 3 shows them; see the migration report. Affiliates have a record for the audit but no in-app list; their notices go by email only (REQ-020-027).'

  # ---- P1-02: provider is not an inquiry.cancelled recipient ----
