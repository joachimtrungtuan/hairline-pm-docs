# Order: field and enum operations first, then the new Rule nodes, then node updates, edge removals and edge additions.
# The writer applies in file order. Every edge end exists in the graph or is added earlier in this file.
reason: 'FR-020 logic review pass 1 (17 findings, all accepted; PRD 2.17). A locked notice is critical (new REQ-020-158); inquiry cancellation tells only providers holding a draft, sent or expired quote, by quote.cancelled_inquiry; admin Close inquiry is covered; mandatory patient notices go by email when every channel is off; attempt status becomes an enum and one record per recipient and event; retry follows the FR-030 retry rule; 90-day window for all three lists; affiliate notices by email only; mirror rows for the redistribution reminder, the data request, legal and installment notices; flow steps rejoin the main path; notification entity reads and writes move to the all-stages platform stage. Neighbour changes in FR-030, FR-003, FR-001, FR-023, FR-027, FR-007B and FR-006 are queued in plans/reports/logic-review-ledger.md, not made here.'
by: docs-manager
operations:
  # ---- P1-12 and P1-15: attempt status enum, attempt-to-record link, affiliate recipient type ----
  - op: add_field
    id: ENT-notification-attempt.notification_id
    entity_id: ENT-notification-attempt
    name: notification_id
    data_type: id
    title: Notification ID
    owner_fr: FR-020
    required: true
    attrs:
      description: 'The notification record this attempt belongs to (ENT-notification-record.notification_id). One record per recipient and event; one attempt row per channel attempt under it (REQ-020-041).'
  - op: update_field
    id: ENT-notification-attempt.status
    data_type: enum
  - {op: add_enum_value, field_id: ENT-notification-attempt.status, value: queued, label: Queued, sort_order: 0}
  - {op: add_enum_value, field_id: ENT-notification-attempt.status, value: sent, label: Sent, sort_order: 1}
  - {op: add_enum_value, field_id: ENT-notification-attempt.status, value: delivered, label: Delivered, sort_order: 2}
  - {op: add_enum_value, field_id: ENT-notification-attempt.status, value: failed, label: Failed, sort_order: 3}
  - {op: add_enum_value, field_id: ENT-notification-attempt.status, value: suppressed, label: Suppressed, sort_order: 4}
  - {op: add_enum_value, field_id: ENT-notification-attempt.status, value: deferred, label: Deferred, sort_order: 5}
  - {op: add_enum_value, field_id: ENT-notification-attempt.status, value: coalesced, label: Coalesced, sort_order: 6}
  - {op: add_enum_value, field_id: ENT-notification-record.recipient_type, value: affiliate, label: Affiliate, sort_order: 3}

  # ---- P1-04: critical notices rule ----
  - op: add_node
    id: REQ-020-158
    type: Rule
    owner_fr: FR-020
    title: A locked notice is critical and is never held back
    attrs:
      statement: 'A notice whose toggle is locked (mandatory) is critical. A critical notice is sent at once and is exempt from quiet hours, the hourly rate limit and coalescing. The Urgency badge on the admin dropdown only displays a level and drives none of these. Single exception: legal.acceptance_reminder is locked but not critical; it respects quiet hours and the rate limit.'
      rationale: 'Business Rules, Critical Notices. Closes the gap between the locked toggle in FR-030 and the throttling flow (B1), which named no exemption.'

  # ---- Mirror rows: new catalogue rows (FR-020 PRD Event Catalog; FR-030 prevails on any mismatch) ----
  - op: add_node
    id: REQ-020-159
    type: Rule
    owner_fr: FR-020
    title: 'Catalog: Redistribution Confirmation Reminder (provider.status_redistribution_reminder)'
    attrs:
      statement: 'Notification catalog event provider.status_redistribution_reminder (Redistribution Confirmation Reminder), category Provider/Compliance. Primary recipients: Patient. Notes: FR-003 Workflow 2 Alternative Flow B4 step 3 (STP-003-095, REQ-003-128). Sent once, when the patient has not answered the confirm variant of provider.status_cancellation_patient after 48 hours; same Confirm and Decline deep links to FR-003 Screen 8 and the Contact Admin/Support action; no second reminder. Mandatory (cannot be disabled in FR-030 rules).'
      rationale: 'Event Catalog table. The table mirrors FR-030; FR-030 prevails on any mismatch. No Event node exists yet; FR-003 is queued to add it.'
  - op: add_node
    id: REQ-020-160
    type: Rule
    owner_fr: FR-020
    title: 'Catalog: Account Deletion Requested (account.deletion_requested)'
    attrs:
      statement: 'Notification catalog event account.deletion_requested (Account Deletion Requested), category Account/Auth. Primary recipients: Patient, Admin. Notes: FR-023 deletion request submitted through FR-001 (REQ-023-029). One event: the patient receives the submission confirmation and the admins are told of the new request.'
      rationale: 'Event Catalog table. The table mirrors FR-030; FR-030 prevails on any mismatch.'
  - op: add_node
    id: REQ-020-161
    type: Rule
    owner_fr: FR-020
    title: 'Catalog: Data Request Status Notices (dsr.verification_required, dsr.in_progress, dsr.fulfilled, dsr.denied, dsr.blocked_by_obligation)'
    attrs:
      statement: 'Notification catalog events dsr.verification_required, dsr.in_progress, dsr.fulfilled, dsr.denied and dsr.blocked_by_obligation (Data Request Status Notices), category Account/Auth. Primary recipients: Patient. Notes: FR-023 REQ-023-008. Status notices on a deletion request: identity proof insufficient (the patient provides more), approved and processing, completed (with the actions taken and the legal basis of any retained records), denied (with the reason), approval blocked by an active obligation (with the expected timeline). The outcome notices dsr.fulfilled and dsr.denied are mandatory; admin cannot disable them.'
      rationale: 'Event Catalog table. The table mirrors FR-030; FR-030 prevails on any mismatch. One grouped row for the five patient status notices of one request.'
  - op: add_node
    id: REQ-020-162
    type: Rule
    owner_fr: FR-020
    title: 'Catalog: Data Request Deadline Approaching (dsr.deadline_approaching)'
    attrs:
      statement: 'Notification catalog event dsr.deadline_approaching (Data Request Deadline Approaching), category Account/Auth. Primary recipients: Admin. Notes: FR-023 REQ-023-029. Sent 7 calendar days before the deadline of a request that is still open.'
      rationale: 'Event Catalog table. The table mirrors FR-030; FR-030 prevails on any mismatch.'
  - op: add_node
    id: REQ-020-163
    type: Rule
    owner_fr: FR-020
    title: 'Catalog: Data Request Obligation Block Ended (dsr.obligation_block_ended)'
    attrs:
      statement: 'Notification catalog event dsr.obligation_block_ended (Data Request Obligation Block Ended), category Account/Auth. Primary recipients: Admin. Notes: FR-023 REQ-023-029 and Main Flow step 3. Sent when the obligation that blocked approval ends, saying the request can be approved. FR-023 owns the emitting step.'
      rationale: 'Event Catalog table. The table mirrors FR-030; FR-030 prevails on any mismatch. No Event node yet; FR-023 is queued to add the event and its emitting step.'
  - op: add_node
    id: REQ-020-164
    type: Rule
    owner_fr: FR-020
    title: 'Catalog: Installment Charge Failed (installment.failed)'
    attrs:
      statement: 'Notification catalog event installment.failed (Installment Charge Failed), category Payment. Primary recipients: Patient. Notes: FR-007B REQ-007B-017. Immediate notice that an installment charge failed, with a clear error message. On the day after the due date the overdue notice replaces that day''s failure notice (REQ-007B-101). Event key proposed by FR-020; FR-030 confirms.'
      rationale: 'Event Catalog table. The table mirrors FR-030; FR-030 prevails on any mismatch.'
  - op: add_node
    id: REQ-020-165
    type: Rule
    owner_fr: FR-020
    title: 'Catalog: Installment Overdue (installment.overdue_notice)'
    attrs:
      statement: 'Notification catalog event installment.overdue_notice (Installment Overdue), category Payment. Primary recipients: Patient, Admin (billing admins). Notes: FR-007B REQ-007B-101. One notice to the patient and one to the billing admins on the day after a due date passes unpaid, after that day''s retry; the patient notice states the booking cancellation date when the cancellation point is set. The provider sees the Overdue banner only and gets no notice. FR-007B adds a late fee to the installment without a notice event of its own. Event key proposed by FR-020; FR-030 confirms.'
      rationale: 'Event Catalog table. The table mirrors FR-030; FR-030 prevails on any mismatch.'
  - op: add_node
    id: REQ-020-166
    type: Rule
    owner_fr: FR-020
    title: 'Catalog: Installment Plan Defaulted (installment.plan_defaulted)'
    attrs:
      statement: 'Notification catalog event installment.plan_defaulted (Installment Plan Defaulted), category Payment. Primary recipients: Admin, Patient, Provider. Notes: FR-007B REQ-007B-020. Sent when a plan is Defaulted; the admin notice is for intervention. Event key proposed by FR-020; FR-030 confirms.'
      rationale: 'Event Catalog table. The table mirrors FR-030; FR-030 prevails on any mismatch.'
  - op: add_node
    id: REQ-020-167
    type: Rule
    owner_fr: FR-020
    title: 'Catalog: Legal Version Published (legal.version_published)'
    attrs:
      statement: 'Notification catalog event legal.version_published (Legal Version Published), category System/Operations. Primary recipients: Admin (the publishing Admin). Notes: FR-027 REQ-027-022. Sent to the Admin who published the version once publication succeeds.'
      rationale: 'Event Catalog table. The table mirrors FR-030; FR-030 prevails on any mismatch.'
  - op: add_node
    id: REQ-020-168
    type: Rule
    owner_fr: FR-020
    title: 'Catalog: Legal Acceptance Coverage Below Threshold (legal.coverage_below_threshold)'
    attrs:
      statement: 'Notification catalog event legal.coverage_below_threshold (Legal Acceptance Coverage Below Threshold), category System/Operations. Primary recipients: Admin (holders of A-09 Edit Settings). Notes: FR-027 REQ-027-023. Sent once per version when the acceptance rate of a Current version is below the Admin-set threshold, evaluated daily from 14 days after the version became Current.'
      rationale: 'Event Catalog table. The table mirrors FR-030; FR-030 prevails on any mismatch.'
  - op: add_node
    id: REQ-020-169
    type: Rule
    owner_fr: FR-020
    title: 'Catalog: Legal Acceptance Reminder (legal.acceptance_reminder)'
    attrs:
      statement: 'Notification catalog event legal.acceptance_reminder (Legal Acceptance Reminder), category System/Operations. Primary recipients: Patient, Provider (team members in the Pending set). Notes: FR-027 REQ-027-063. One reminder to each user in the Pending set; FR-027 owns the cadence. The toggle is locked: the user cannot switch it off. It is not critical: it respects quiet hours and the rate limit (REQ-020-158).'
      rationale: 'Event Catalog table. The table mirrors FR-030; FR-030 prevails on any mismatch. FR-027 emits the event at the Admin stage although its recipients are patients and providers; queued as a cross-FR remark.'

