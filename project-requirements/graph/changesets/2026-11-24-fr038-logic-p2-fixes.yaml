# Operations ordered so removals come first, then updates, then new edges; no add_node, add_field or add_enum_value is needed. Needs on FR-037, FR-011, FR-030 and stage nodes are queued in the ledger, not in this file.
reason: 'FR-038 logic review pass 2: monitoring period and first severity point in date order with logs dated before the case (REQ-038-034, -035); zero-log summary shows the Initial Severity; stale FR-011 package edge and retired-rule edges removed; failure edge moved to the FR-011 submit step; failed or abandoned request returns to FR-038 Screen 6 with the draft intact; draft rule wired to its steps and the return-to-monitoring exit; End Monitoring with an open draft discards it (owner default 101); idempotency key created once per case and kept; Retry PDF on Screen 6 with its step; export-ready notice opens Screen 6 only while the draft is open; previous completed and converted cases listed on the home card (owner default 102); Screen 6 retake and Screen 1 capture entry for Screen 4; Admin cannot edit case status (owner default 103); conditions on sibling next edges and the check step folded into the entry branch; malware-scan outcome; default reminders run 12 months from case creation (owner default 104); duplicate-case choices wired onward.'
by: docs-manager
operations:
# ---- Edge removals ---------------------------------------------------------
- {op: remove_edge, from: FR-038, verb: references, to: REQ-011-046}
- {op: remove_edge, from: REQ-038-065, verb: applies to, to: SCR-038-06}
- {op: remove_edge, from: REQ-038-065, verb: applies at, to: STG-monitoring-03-conversion}
- {op: remove_edge, from: REQ-038-074, verb: applies to, to: SCR-038-06}
- {op: remove_edge, from: REQ-038-074, verb: applies at, to: STG-monitoring-03-conversion}
- {op: remove_edge, from: REQ-038-065, verb: applies to, to: ENT-aftercare-template}
- {op: remove_edge, from: STP-038-055, verb: next, to: STP-038-051}
- {op: remove_edge, from: STP-038-001, verb: next, to: STP-038-003}
- {op: remove_edge, from: STP-038-015, verb: next, to: STP-038-016}
- {op: remove_edge, from: STP-038-034, verb: next, to: STP-038-058}
- {op: remove_edge, from: SCR-038-09, verb: shows, to: ENT-monitoring-case.status}
# ---- Rule updates ----------------------------------------------------------
- op: update_node
  id: REQ-038-016
  attrs:
    statement: 'Conversion MUST be idempotent and MUST NOT create duplicate standalone-aftercare requests. A standalone request may be created from an FR-038 conversion with pre-filled fields, the attached monitoring PDF, an optional selected scan, and an idempotency key; a repeated key returns the existing request. The idempotency key is created once per case at the first Switch to Aftercare Package and is kept when the draft is cleared.'
- op: update_node
  id: REQ-038-031
  attrs:
    statement: 'Reminders are on by default with the Admin schedule (once a month for 12 months from the case creation date); the patient can change the schedule or switch them off with Reminder Preference on Screen 2, without affecting case status. Reminders are sent through a progress-reminder event of the FR-030 catalogue, stop when the case is completed or converted, and cannot become mandatory milestones or compliance checks.'
- op: update_node
  id: REQ-038-034
  attrs:
    statement: 'Severity Summary shows first, latest, minimum, maximum, average, and trend of the severity ratings; the Initial Severity given at intake is a data point of the trend plotted on the case creation date, the trend is in date order with the logs, and first means the earliest-dated point. A case with no log shows the Initial Severity as first, latest, minimum, maximum, and average, with a one-point trend, and completion and conversion stay allowed.'
    rationale: 'Screen 2 Severity Trend is the rating over time (derived); Main Flow step 7 updates the severity trend as entries change; Scalability says trend summaries may be cached while source entries stay authoritative.'
- op: update_node
  id: REQ-038-035
  title: 'Monitoring Period runs from the earlier of the case creation date and the earliest log date to the completion or conversion date'
  attrs:
    statement: 'Monitoring Period is the date range from the earlier of the case creation date and the earliest log date to the date the case was completed or converted (to today for an active case preview).'
- op: update_node
  id: REQ-038-037
  title: 'Conversion State is None, draft or converted; the draft is set at Switch and cleared at commit, return or completion'
  attrs:
    statement: 'Conversion State is None, draft, or converted to FR-011. The conversion draft is set when the patient selects Switch to Aftercare Package and cleared when the conversion is committed, the patient returns to monitoring, or the patient completes the case; the idempotency key is kept when the draft is cleared (REQ-038-016).'
- op: update_node
  id: REQ-038-041
  attrs:
    statement: 'Failed generation can be retried without reopening the case: the patient sees the failed status on Screen 7, or on Screen 6 during conversion, and selects Retry PDF.'
- op: update_node
  id: REQ-038-044
  attrs:
    statement: 'Completion and successful conversion are terminal outcomes, and source/destination cases remain distinct. The patient may end monitoring while a conversion draft is open; completion discards the draft, and a request creation arriving after completion is refused.'
- op: update_node
  id: REQ-038-049
  attrs:
    statement: 'Scan history lists prior scans grouped by date, for the current case only. Screen 4 opens from Scan History on Screen 2, from the head-scan capture on Screens 1 and 3, and from the retake on Screen 6. A scan captured from Screen 1 is held with the intake draft and saved when the case is created.'
- op: update_node
  id: REQ-038-055
  attrs:
    statement: 'Admin may edit all monitoring intake information, entries, severity ratings, scan metadata, report regeneration, and conversion metadata when operational correction is required. Case status is not editable: completed and converted are final. No edit may erase historical values or provenance.'
- op: update_node
  id: REQ-038-062
  attrs:
    statement: 'Patient selects Aftercare: Monitor Transplant Progress from FR-003 Screen 1: Service Selection. Patient opens the active case from the patient home/dashboard monitoring card. Patient opens a completed or converted case from the same card, which also lists previous completed and converted cases, each opening its Screen 7 read-only. Admin opens Transplant-Progress Cases (Screen 8). Patient selects Switch to Aftercare Package from active-case actions or Screen 5.'
- op: update_node
  id: REQ-038-064
  attrs:
    statement: 'System generates the current monitoring-summary PDF when the patient selects Switch to Aftercare Package. Screen 6 shows the PDF status; on failed the patient can retry; the PDF is regenerated when logs or the selected scan change after it was made; a repeated Switch reuses the existing draft PDF unless data changed; the export-ready notice for the conversion PDF opens Screen 6 only while the conversion draft is open, otherwise Screen 7.'
- op: update_node
  id: REQ-038-068
  attrs:
    statement: 'When FR-011 request validation or creation does not complete, or the patient abandons it, System preserves the active monitoring case and the conversion draft; the patient returns to FR-038 Screen 6 with the draft intact, corrects copied fields there, and retries or returns to monitoring.'
- op: update_node
  id: REQ-038-077
  attrs:
    statement: 'System MUST scan uploaded treatment documentation and generated PDFs for malware; an uploaded file that fails the scan is rejected with an error and not stored, and a generated PDF that fails ends with generation status failed.'
