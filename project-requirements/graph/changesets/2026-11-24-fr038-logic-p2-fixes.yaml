- op: update_node
  id: REQ-038-001
  attrs:
    rationale: 'Restated by General Rule 1 (one active case per monitoring type), Screen 1 (a patient may have only one active transplant-progress case), Main Flow step 1 (the patient selects Monitor Transplant Progress; the system checks that no active case exists, otherwise flow B1), Alternative Flow B1 and Admin Editability (one-active-case-per-type enforcement is fixed in codebase).'
- op: update_node
  id: REQ-038-003
  attrs:
    rationale: 'Restated by Module Scope (adds optional logs on any date with recovery severity/condition rating, notes, photos and V1 head scan photo sets) and Main Flow steps 5 and 6.'
- op: update_node
  id: REQ-038-004
  attrs:
    rationale: 'Restated by General Rule 3 (logging frequency is entirely optional; no overdue, missed-task, compliance or milestone state), Screen 2 (the system must not display overdue, missed milestone, compliance or required-frequency states), Executive Summary and Main Flow step 7 (timeline, scan history and severity trend update without overdue states).'
- op: update_node
  id: REQ-038-007
  attrs:
    rationale: 'Restated by Main Flow step 2, Module Scope and Screen 1 purpose (information compatible with FR-011 standalone aftercare).'
- op: update_node
  id: REQ-038-021
  attrs:
    rationale: 'Main Flow step 3. Screen 1 Self-Service Acknowledgment (confirms no provider monitoring or required cadence) is required and must be selected before the case is created. Patient profile and consent state are listed under Data Dependencies.'
- op: update_node
  id: REQ-038-024
  attrs:
    rationale: 'Main Flow step 4. User Story 1 scenario 1 adds that the case opens without provider assignment.'
# ---- Step and setting updates ----------------------------------------------
- op: update_node
  id: STP-038-057
  attrs:
    prd_ref: 'A1 step 5a; A2 step 2a'
- op: update_node
  id: SET-transplant-progress-reminder-defaults
  attrs:
    description: 'Patient reminder defaults for transplant-progress monitoring. Reminders are on by default with this schedule and cannot become mandatory milestones or compliance checks. The default schedule is set by admins in the FR-030 notification settings (REQ-030-225); FR-038 only refers to it. The patient may change or switch off their own reminders, and reminders stop when the case is completed or converted.'
    default: 'once a month for 12 months from the case creation date'
