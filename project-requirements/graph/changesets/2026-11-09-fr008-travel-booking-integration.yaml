  - {"op": "add_field", "id": "ENT-travel-context.passport_status", "entity_id": "ENT-travel-context", "name": "passport_status", "data_type": "enum", "title": "Passport status", "owner_fr": "FR-008", "required": false, "calculated_by": "REQ-008-019", "attrs": {"description": "Shown as a badge (Path A only). Added for screen badges; the PRD Key Entities hold the status on the passport record (see questions)."}}
  - {"op": "add_field", "id": "ENT-travel-context.outbound_flight_status", "entity_id": "ENT-travel-context", "name": "outbound_flight_status", "data_type": "enum", "title": "Outbound flight status", "owner_fr": "FR-008", "required": false, "calculated_by": "REQ-008-019", "attrs": {"description": "Badge on provider and admin Travel sections."}}
  - {"op": "add_field", "id": "ENT-travel-context.return_flight_status", "entity_id": "ENT-travel-context", "name": "return_flight_status", "data_type": "enum", "title": "Return flight status", "owner_fr": "FR-008", "required": false, "calculated_by": "REQ-008-019", "attrs": {"description": "Badge on provider and admin Travel sections."}}
  - {"op": "add_field", "id": "ENT-travel-context.hotel_status", "entity_id": "ENT-travel-context", "name": "hotel_status", "data_type": "enum", "title": "Hotel status", "owner_fr": "FR-008", "required": false, "calculated_by": "REQ-008-019", "attrs": {"description": "Badge on provider and admin Travel sections."}}
  - {"op": "add_field", "id": "ENT-travel-context.overall_status", "entity_id": "ENT-travel-context", "name": "overall_status", "data_type": "enum", "title": "Overall status", "owner_fr": "FR-008", "required": false, "attrs": {"description": "Admin Screen 12 header badge: Pending, Partially submitted, Complete. The PRD does not define how it is derived (see questions)."}}
