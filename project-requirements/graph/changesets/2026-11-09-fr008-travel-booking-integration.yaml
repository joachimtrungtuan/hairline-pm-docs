  - {"op": "add_field", "id": "ENT-passport-record.passport_number", "entity_id": "ENT-passport-record", "name": "passport_number", "data_type": "text", "title": "Passport number", "owner_fr": "FR-008", "required": true, "attrs": {"description": "Machine-readable passport number; required; max 20 characters; stored encrypted. Masked in patient display, in full for the assigned provider and admin."}}
  - {"op": "add_field", "id": "ENT-passport-record.passport_dob", "entity_id": "ENT-passport-record", "name": "passport_dob", "data_type": "date", "title": "Date of birth", "owner_fr": "FR-008", "required": true, "attrs": {"description": "As on the passport; must be a valid past date."}}
  - {"op": "add_field", "id": "ENT-passport-record.gender", "entity_id": "ENT-passport-record", "name": "gender", "data_type": "enum", "title": "Gender", "owner_fr": "FR-008", "required": true, "attrs": {"description": "As on the passport."}}
  - {"op": "add_field", "id": "ENT-passport-record.location", "entity_id": "ENT-passport-record", "name": "location", "data_type": "text", "title": "Location (nationality)", "owner_fr": "FR-008", "required": true, "attrs": {"description": "Country of nationality; required."}}
  - {"op": "add_field", "id": "ENT-passport-record.place_of_birth", "entity_id": "ENT-passport-record", "name": "place_of_birth", "data_type": "text", "title": "Place of birth", "owner_fr": "FR-008", "required": true, "attrs": {"description": "City or country of birth; required."}}
