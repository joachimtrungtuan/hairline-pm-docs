  - {"op": "add_field", "id": "ENT-flight-record.arrival_date", "entity_id": "ENT-flight-record", "name": "arrival_date", "data_type": "date", "title": "Arrival date", "owner_fr": "FR-008", "required": true, "attrs": {"description": "Must be on or after the departure date."}}
