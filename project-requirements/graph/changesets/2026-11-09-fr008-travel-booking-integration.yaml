operations:
  - {"op": "add_node", "id": "REQ-008-001", "type": "Rule", "owner_fr": "FR-008", "title": "Passport submission only after booking Confirmed", "attrs": {"statement": "The system MUST allow patients to submit a passport photo and structured form data only after the linked FR-006 booking is Confirmed."}}
  - {"op": "add_node", "id": "REQ-008-002", "type": "Rule", "owner_fr": "FR-008", "title": "Passport data encrypted and number masked for the patient", "attrs": {"statement": "The system MUST store passport data encrypted and mask `passport_number` in patient display views; full passport details are visible only to the assigned provider and admin for the confirmed booking.", "rationale": "Passport number is shown masked (for example A1234****) in the patient display and confirmation view; the assigned provider and admin see it in full (Screen 1 rules, Screen 7, Passport Rules)."}}
  - {"op": "add_node", "id": "REQ-008-003", "type": "Rule", "owner_fr": "FR-008", "title": "Passport access restricted to patient, assigned provider and admin", "attrs": {"statement": "The system MUST restrict passport data access to the submitting patient, their assigned provider, and admin."}}
  - {"op": "add_node", "id": "REQ-008-004", "type": "Rule", "owner_fr": "FR-008", "title": "Provider notified of passport submission or correction", "attrs": {"statement": "The system MUST notify the provider when a patient submits passport details or admin corrects the record."}}
  - {"op": "add_node", "id": "REQ-008-005", "type": "Rule", "owner_fr": "FR-008", "title": "Automatic passport request at Confirmed (Path A)", "attrs": {"statement": "The system MUST automatically request passport details from the patient once when the linked FR-006 booking becomes **Confirmed** and the accepted option snapshot yields Path A. No provider or admin trigger is required.", "rationale": "Restated by Main Flow 1 trigger and step A2, Patient Platform scope, Shared Services scope and Business Rules 'Automated Trigger on Confirmed Booking'."}}
  - {"op": "add_node", "id": "REQ-008-006", "type": "Rule", "owner_fr": "FR-008", "title": "Flight as two independent leg records", "attrs": {"statement": "The system MUST allow flight information to be submitted as two independent records (outbound and return), each with a `leg_type` indicator."}}
  - {"op": "add_node", "id": "REQ-008-007", "type": "Rule", "owner_fr": "FR-008", "title": "Flight submitter follows the travel path", "attrs": {"statement": "The system MUST allow the patient to submit flight records in Path B or the provider to submit them in Path A only when flight is included in the accepted option. It MUST reject mixed submitters for the same booking.", "rationale": "No submitter mixing: Path A flight and hotel entries come from the provider only, Path B entries from the patient only; admin corrects in both paths (Travel Path Determination)."}}
  - {"op": "add_node", "id": "REQ-008-008", "type": "Rule", "owner_fr": "FR-008", "title": "Travel dates validated against the current appointment", "attrs": {"statement": "The system MUST validate that `arrival_date` is ≥ `departure_date`, that the outbound flight arrives on or before the current booking appointment date, that the return flight departs after it, and that hotel check-in is on or before that date with check-out after check-in. The current booking appointment equals the accepted snapshot appointment unless an admin-approved change exists. Because treatment plan days are relative, a return flight or hotel check-out before the last treatment plan day is not rejected; it raises the soft warning in REQ-008-031.", "rationale": "Field-level date validation also appears on Screens 3, 4, 8 and 9. Treatment plan days are relative, so an early departure is a warning (REQ-008-031), not a rejection."}}
  - {"op": "add_node", "id": "REQ-008-009", "type": "Rule", "owner_fr": "FR-008", "title": "No total price on the flight record", "attrs": {"statement": "The system MUST NOT include a `total_price` field in the flight record (payment is handled against the accepted option/date-price selection).", "rationale": "Flight cost is part of the accepted option/date-price selection (FR-004, FR-005, FR-007); Screens 3 and 8 and the Assumptions repeat the exclusion."}}
  - {"op": "add_node", "id": "REQ-008-010", "type": "Rule", "owner_fr": "FR-008", "title": "Flight baggage field name normalised", "attrs": {"statement": "The system MUST normalise the flight API field to `baggage_allowance` (singular) for consistency.", "rationale": "The PRD marks the baggages_allowance spelling as an API naming discrepancy to resolve with the backend team."}}
  - {"op": "add_node", "id": "REQ-008-011", "type": "Rule", "owner_fr": "FR-008", "title": "Hotel submitter follows the travel path", "attrs": {"statement": "The system MUST allow the patient to submit hotel information in Path B or the provider to submit it in Path A only when hotel is included in the accepted option. It MUST reject mixed submitters for the same booking."}}
  - {"op": "add_node", "id": "REQ-008-012", "type": "Rule", "owner_fr": "FR-008", "title": "Hotel check-out after check-in", "attrs": {"statement": "The system MUST validate that `check_out_date` is after `check_in_date`."}}
  - {"op": "add_node", "id": "REQ-008-013", "type": "Rule", "owner_fr": "FR-008", "title": "Hotel transportation field is canonical for pickup notes", "attrs": {"statement": "The `transportation` field in the hotel record MUST be the canonical field for airport pickup and transfer coordination in MVP.", "rationale": "No separate transport form exists in MVP (Screens 4 and 9 notes, Hotel Records, Assumptions)."}}
  - {"op": "add_node", "id": "REQ-008-014", "type": "Rule", "owner_fr": "FR-008", "title": "Itinerary is a read view per confirmed booking", "attrs": {"statement": "The system MUST assemble one active travel itinerary per confirmed booking/appointment as a read view from its TravelContext, the current passport, flight, and hotel records, and the Booking; the itinerary MUST NOT be stored as a separate record.", "rationale": "Itinerary Rules and Screen 5 purpose restate this; admin corrections refresh the relevant section automatically."}}
  - {"op": "add_node", "id": "REQ-008-015", "type": "Rule", "owner_fr": "FR-008", "title": "Itinerary visible to patient, provider and admin", "attrs": {"statement": "The system MUST display the itinerary to the patient, provider (for coordination), and admin."}}
  - {"op": "add_node", "id": "REQ-008-016", "type": "Rule", "owner_fr": "FR-008", "title": "Travel record changes audit-logged", "attrs": {"statement": "The system MUST log all changes to travel records (who, when, what) for audit.", "rationale": "Itinerary Rules: all record submissions and admin corrections are logged (who, when, what)."}}
  - {"op": "add_node", "id": "REQ-008-017", "type": "Rule", "owner_fr": "FR-008", "title": "Travel records locked on submission; admin corrections versioned", "attrs": {"statement": "Travel records (passport, flight, hotel) MUST be locked immediately after submission. The system MUST prevent any edit by the patient or provider post-submission. Admin corrections MUST write a new locked version, mark the previous as superseded, and log the correction with a mandatory reason.", "rationale": "Restated by Screen 1, 3, 4, 8 and 9 rules, Passport Rules, Flight Records and Alternative Flow A2. Admin correction on any tab writes a new locked version and marks the previous one superseded (Screen 12 tabs)."}}
  - {"op": "add_node", "id": "REQ-008-018", "type": "Rule", "owner_fr": "FR-008", "title": "Travel path derived from the accepted option snapshot", "attrs": {"statement": "The binary travel path MUST be derived from `included_services` in the accepted FR-004 Quote Option snapshot carried by the FR-005 AcceptanceEvent, not selected by the provider in FR-008. `flight` or `hotel` yields `provider_included` (Path A); neither yields `patient_self_booked` (Path B), including transport-only options. FR-008 MUST persist the derived path and accepted inclusions in TravelContext at booking confirmation. Path A allows provider entry only for included flight/hotel services and never patient entry; Path B allows patient entry only and never provider entry. An omitted Path A flight/hotel service is \"Not included\" and is not collected in MVP. The reusable package preset and parent quote are not the authority for this choice.", "rationale": "Travel Path Determination: travel_path is not user-selectable; the provider edits option-level included_services in FR-004 and those changes stay within that quote. Transport-only inclusion remains Path B."}}
  - {"op": "add_node", "id": "REQ-008-019", "type": "Rule", "owner_fr": "FR-008", "title": "Provider travel status tracker follows included services", "attrs": {"statement": "For a Path A booking, the system MUST surface a travel status tracker on the provider's confirmed booking view covering passport, outbound flight, return flight, and hotel; entry actions MUST follow the accepted option's included services."}}
  - {"op": "add_node", "id": "REQ-008-020", "type": "Rule", "owner_fr": "FR-008", "title": "Automatic travel request on Confirmed", "attrs": {"statement": "The system MUST automatically send the applicable travel request notification to the patient (in-app + email) once when the booking transitions to Confirmed after successful initial payment — no manual trigger required."}}
  - {"op": "add_node", "id": "REQ-008-021", "type": "Rule", "owner_fr": "FR-008", "title": "Patient notified of provider entry and admin correction", "attrs": {"statement": "The system MUST notify the patient when the provider enters travel details on their behalf (Path A), and when admin applies a correction to any of their travel records."}}
  - {"op": "add_node", "id": "REQ-008-022", "type": "Rule", "owner_fr": "FR-008", "title": "Provider notified of patient submission and admin correction", "attrs": {"statement": "The system MUST notify the provider when the patient submits passport or travel details, and when admin applies a correction to any travel record for their patient."}}
  - {"op": "add_node", "id": "REQ-008-023", "type": "Rule", "owner_fr": "FR-008", "title": "Admin views, filters and drills into all travel records", "attrs": {"statement": "Admin MUST be able to view, filter, and drill into all travel records across all appointments."}}
  - {"op": "add_node", "id": "REQ-008-024", "type": "Rule", "owner_fr": "FR-008", "title": "Admin edits any travel record with audit entry", "attrs": {"statement": "Admin MUST be able to edit any travel record with a mandatory audit log entry."}}
  - {"op": "add_node", "id": "REQ-008-025", "type": "Rule", "owner_fr": "FR-008", "title": "One TravelContext per confirmed booking", "attrs": {"statement": "FR-008 MUST create or reuse exactly one TravelContext per confirmed FR-006 Booking, keyed by `booking_id`; passport, flight, and hotel records MUST link to that TravelContext rather than using a flat `quote_id` as their sole operational key."}}
  - {"op": "add_node", "id": "REQ-008-026", "type": "Rule", "owner_fr": "FR-008", "title": "TravelContext retains the accepted snapshot provenance", "attrs": {"statement": "TravelContext MUST retain the immutable AcceptanceEvent ID, accepted parent quote and subquote IDs/aggregate version, Quote Option ID, Option/Date-Price ID, accepted appointment date/time/timezone, accepted date range start and end, and included-service snapshot, all read from the FR-005 accepted snapshot. The accepted parent and subquote versions MUST match the same FR-004 aggregate `QuoteVersion`. FR-008 MUST NOT reselect or reconstruct a different package, date range, appointment, or price.", "rationale": "acceptedSubquoteVersion equals acceptedParentQuoteVersion because both refer to the same FR-004 parent aggregate revision (Travel Context and Booking Lifecycle)."}}
  - {"op": "add_node", "id": "REQ-008-027", "type": "Rule", "owner_fr": "FR-008", "title": "No travel coordination before successful initial payment", "attrs": {"statement": "FR-008 MUST NOT create TravelContext or send initial travel requests on subquote acceptance, payment attempts, `Payment Window Expired`, or cancellation before successful initial payment. Repeated delivery of the confirmed-booking signal MUST NOT duplicate TravelContext or the initial request.", "rationale": "Business Rules 'Automated Trigger on Confirmed Booking' and acceptance scenarios 1 and 2: replayed confirmation events or retries never create a second TravelContext or a duplicate initial request."}}
  - {"op": "add_node", "id": "REQ-008-028", "type": "Rule", "owner_fr": "FR-008", "title": "Cancelled booking closes the TravelContext; date change flags review", "attrs": {"statement": "When a confirmed booking is cancelled, FR-008 MUST set the TravelContext to `closed` and close pending travel requests and reminders while retaining submitted travel records and audit history. An admin-approved appointment change MUST flag existing travel dates for audited revalidation; external travel is not automatically rebooked."}}
  - {"op": "add_node", "id": "REQ-008-029", "type": "Rule", "owner_fr": "FR-008", "title": "Travel APIs resolve the booking server-side and reject overrides", "attrs": {"statement": "Travel record APIs MUST accept a confirmed `booking_id`, resolve TravelContext and acceptance provenance server-side, enforce the Path A / Path B submitter and inclusion rules, and reject client-supplied changes to accepted quote, subquote, option, date-price, path, or inclusion values. Travel record APIs and patient re-notification MUST also reject any write against a closed TravelContext."}}
  - {"op": "add_node", "id": "REQ-008-030", "type": "Rule", "owner_fr": "FR-008", "title": "Only admin clears travel-date review", "attrs": {"statement": "Only an admin MAY clear `travel-date-review-required`, by confirming that the existing flight and hotel dates still fit the current booking appointment or by correcting the affected records. Either action MUST return the TravelContext to `active` and record the admin, time, reason and outcome in the audit log."}}
  - {"op": "add_node", "id": "REQ-008-031", "type": "Rule", "owner_fr": "FR-008", "title": "Early departure raises an acknowledged soft warning", "attrs": {"statement": "When a return flight departs, or the hotel check-out date falls, before the last treatment plan day (current booking appointment date plus the plan day count minus one), the system MUST show the submitter a soft warning that must be acknowledged before saving, MUST still allow the record to be saved, MUST record who acknowledged it and when, and MUST show the provider an early-departure flag on the booking.", "rationale": "Applies on Screens 3, 8 and 12 (return flight) and Screens 4, 9 and 12 (hotel check-out); the provider's status badge shows 'Leaves before last treatment day' with the time the submitter acknowledged the warning (Screen 6)."}}
  - {"op": "add_node", "id": "REQ-008-032", "type": "Rule", "owner_fr": "FR-008", "title": "Provider-fault transfer carries travel records to the replacement booking", "attrs": {"statement": "When FR-006 Alternative Flow B5 transfers a patient to a replacement booking, the system MUST keep the original TravelContext closed with its records read-only, MUST carry the passport record over to the replacement TravelContext as a new locked booking-linked record, MUST copy the current flight and hotel records to it with a copy-source reference and the flag \"travel-date review required\", and MUST set the replacement TravelContext to `travel-date-review-required` until an admin clears the review under REQ-008-030.", "rationale": "Alternative Flow B2: copied flight and hotel records show 'Travel-date review required' on the provider Travel section until admin clears it; admin confirms or corrects copied dates on Screens 11 and 12."}}
  - {"op": "add_node", "id": "REQ-008-033", "type": "Rule", "owner_fr": "FR-008", "title": "Itinerary has no stored record", "attrs": {"statement": "The itinerary MUST be a read view assembled from the TravelContext, the current passport, flight, and hotel records, and the Booking; no itinerary table or stored itinerary record MAY exist."}}
  - {"op": "add_node", "id": "REQ-008-034", "type": "Rule", "owner_fr": "FR-008", "title": "Automatic flight and hotel request at Confirmed (Path B)", "attrs": {"statement": "The system MUST automatically request flight and hotel details (no passport) from the patient once when the linked FR-006 booking becomes **Confirmed** and the accepted option snapshot yields Path B. No provider or admin trigger is required.", "rationale": "PRD id REQ-008-005b does not fit the Rule id pattern, so it is recorded as REQ-008-034. Passport is not requested in Path B (Passport Rules)."}}
  - {"op": "add_node", "id": "REQ-008-035", "type": "Rule", "owner_fr": "FR-008", "title": "Future phase: in-app flight search and booking", "attrs": {"statement": "The system SHOULD integrate a flight search API (e.g. Amadeus) to enable in-app flight booking in a future phase."}}
  - {"op": "add_node", "id": "REQ-008-036", "type": "Rule", "owner_fr": "FR-008", "title": "Future phase: in-app hotel search and booking", "attrs": {"statement": "The system SHOULD integrate a hotel search API (e.g. Booking.com) to enable in-app hotel booking in a future phase."}}
  - {"op": "add_node", "id": "REQ-008-037", "type": "Rule", "owner_fr": "FR-008", "title": "Future phase: commission tracking on platform bookings", "attrs": {"statement": "The system SHOULD support commission tracking on platform-facilitated bookings once API booking is live."}}
  - {"op": "add_node", "id": "REQ-008-038", "type": "Rule", "owner_fr": "FR-008", "title": "Future phase: dedicated transport record", "attrs": {"statement": "The system SHOULD support a dedicated transport record entity when Hairline operates its own driver network."}}
  - {"op": "add_node", "id": "REQ-008-039", "type": "Rule", "owner_fr": "FR-008", "title": "Future phase: real-time flight price estimates", "attrs": {"statement": "The system SHOULD display real-time flight price estimates during inquiry date selection once a flight API is integrated."}}
  - {"op": "add_node", "id": "REQ-008-040", "type": "Rule", "owner_fr": "FR-008", "title": "MVP is information capture and coordination only", "attrs": {"statement": "In MVP the platform MUST NOT support in-app flight or hotel booking, platform-managed transport, commission tracking, airport transport booking, travel price preview during inquiry date selection, or OCR/auto-extraction of travel data from patient screenshots. It facilitates information capture and coordination only: all flight and hotel bookings are completed outside the platform by the patient or the provider, and all travel details are entered manually.", "rationale": "PRD Executive Summary, Out of Scope (MVP) list and Assumptions. Airport transport is informational only through the hotel Transportation Details field."}}
  - {"op": "add_node", "id": "REQ-008-041", "type": "Rule", "owner_fr": "FR-008", "title": "Travel lives inside the confirmed booking detail screens", "attrs": {"statement": "Travel status, records and actions MUST be surfaced as a Travel section inside the confirmed booking detail screen of the provider (visible only once the booking is Confirmed) and of the admin (visible for every confirmed booking regardless of travel path). There MUST be no standalone travel dashboard or travel oversight screen; admin reaches a booking through the existing inquiry and booking management.", "rationale": "Entry points: the automated in-app prompt and email on Confirmed for the patient, and the Travel section of the booking detail screen for provider and admin (Multi-Tenant Architecture; Screens 6 and 11 placement). Conflicts with REQ-008-023 and SC-007 wording; recorded as a question."}}
  - {"op": "add_node", "id": "REQ-008-042", "type": "Rule", "owner_fr": "FR-008", "title": "Passport photo is a reference document only", "attrs": {"statement": "The passport photo MUST be stored in compliant secure storage as a reference document only. It MUST NOT be parsed or processed automatically, is viewable but not downloadable by the assigned provider and admin, and is not shown in any list, itinerary view or the patient's confirmation view. All passport fields are entered manually by the patient."}}
  - {"op": "add_node", "id": "REQ-008-043", "type": "Rule", "owner_fr": "FR-008", "title": "Travel path fixed at booking confirmation", "attrs": {"statement": "The travel path MUST be fixed at booking confirmation: the derived path and the included-service snapshot are stored in the booking's TravelContext, and later package-library or quote changes MUST NOT reroute an existing booking. Neither the parent quote as a whole nor the reusable package preset determines the accepted travel choice."}}
  - {"op": "add_node", "id": "REQ-008-044", "type": "Rule", "owner_fr": "FR-008", "title": "Included travel items listed on the patient itinerary", "attrs": {"statement": "Included travel items of the accepted option (for example hotel, airport transfer, or another travel service such as a city tour) MUST be listed as Package Travel Items on the patient itinerary whenever they exist, in Path A or Path B. Services not included are shown as Not included and are not collected in MVP."}}
  - {"op": "add_node", "id": "REQ-008-045", "type": "Rule", "owner_fr": "FR-008", "title": "Transport is provider-arranged and has no separate record", "attrs": {"statement": "Transport (airport pickup) MUST always be provider-arranged when included in the accepted option and MUST NOT be tracked as a separate record or form in MVP; it is captured through the Transportation Details notes of the hotel record. Providers may use those notes to plan clinic-side logistics such as verifying arrival times for pickup."}}
  - {"op": "add_node", "id": "REQ-008-046", "type": "Rule", "owner_fr": "FR-008", "title": "Passport required for Path A only", "attrs": {"statement": "Passport submission MUST be required for every Path A appointment and MUST NOT be required or requested for Path B, where the patient manages their own passport for independent bookings. The passport submission screen is never shown for Path B."}}
  - {"op": "add_node", "id": "REQ-008-047", "type": "Rule", "owner_fr": "FR-008", "title": "Invalid passport submission rejected, nothing stored", "attrs": {"statement": "A passport submission that fails validation (missing required fields, invalid dates, or failed photo quality check) MUST be rejected with field-level errors; no passport record is created or updated and the passport status remains Awaiting until a successful submission."}}
  - {"op": "add_node", "id": "REQ-008-048", "type": "Rule", "owner_fr": "FR-008", "title": "Passport photo quality gate before submission", "attrs": {"statement": "Before a passport photo can be submitted, the app MUST run an on-device quality check (lighting, focus, blur) and block submission with an actionable error (for example 'Too blurry - retake in better light') when it fails. The check is a quality gate only: no OCR or data extraction.", "rationale": "The PRD names Google ML Kit as the Flutter implementation; that is a technical choice and is not carried into the graph."}}
  - {"op": "add_node", "id": "REQ-008-049", "type": "Rule", "owner_fr": "FR-008", "title": "Passport data is PII, encrypted at rest and in transit", "attrs": {"statement": "Passport data (especially passport_number and passport_image) MUST be treated as PII under GDPR and data protection rules and MUST be encrypted at rest and in transit."}}
  - {"op": "add_node", "id": "REQ-008-050", "type": "Rule", "owner_fr": "FR-008", "title": "Provider passport access logged and limited to assigned clinic", "attrs": {"statement": "Provider access to passport data MUST be logged (timestamp, provider user ID), and a provider MUST NOT be able to view passport data of patients not assigned to its clinic. The provider sees the passport number in full and the passport view is read-only; incorrect data is corrected by contacting admin."}}
  - {"op": "add_node", "id": "REQ-008-051", "type": "Rule", "owner_fr": "FR-008", "title": "Earlier passport details reused through a new locked record", "attrs": {"statement": "If a patient previously submitted passport details for an earlier appointment, the patient MAY reuse them through a new booking-linked locked record; the earlier record MUST NOT be edited. If the passport has since changed (for example renewed), admin MUST correct the applicable record."}}
  - {"op": "add_node", "id": "REQ-008-052", "type": "Rule", "owner_fr": "FR-008", "title": "Edit of a submitted record is blocked and redirected to admin", "attrs": {"statement": "Once a passport, flight or hotel record is submitted, an attempt by the patient or provider to edit, delete or re-submit it MUST be blocked and the submitter MUST be shown a message that corrections are requested through admin. The provider has no edit or flag capability on a patient-submitted record and contacts admin when it looks incorrect.", "rationale": "Alternative Flow A2; Screens 1, 3, 4, 6, 8, 9 and 10 rules."}}
  - {"op": "add_node", "id": "REQ-008-053", "type": "Rule", "owner_fr": "FR-008", "title": "At most two current flight records per booking", "attrs": {"statement": "A confirmed booking MUST have at most two current flight records (outbound and return); superseded admin-correction versions remain in history. Both legs use the same form and the leg type is set at creation."}}
  - {"op": "add_node", "id": "REQ-008-054", "type": "Rule", "owner_fr": "FR-008", "title": "Round-trip legs are independent and presented sequentially", "attrs": {"statement": "A round trip MUST be two FlightRecord entries (outbound, return) linked to the same appointment. Each leg MUST be independent, so either may be missing (one-way, or return not yet confirmed). After the outbound leg is submitted the system prompts for the return leg, the form header labels the leg ('Outbound Flight' or 'Return Flight'), and the UI presents the legs as two sequential steps or two tabs.", "rationale": "Round-Trip rules, Screens 3 and 8, and the Assumption that round trip is the standard expectation."}}
  - {"op": "add_node", "id": "REQ-008-055", "type": "Rule", "owner_fr": "FR-008", "title": "At most one current hotel record per booking", "attrs": {"statement": "A confirmed booking MUST have at most one current hotel record in MVP (no multi-hotel or multi-city case); superseded admin-correction versions remain in history. Provider hotel entry is enabled only while no hotel record has been submitted for the appointment."}}
  - {"op": "add_node", "id": "REQ-008-056", "type": "Rule", "owner_fr": "FR-008", "title": "Itinerary sections show submitter, timestamp and pending state", "attrs": {"statement": "Each itinerary section MUST show the submission timestamp and the submitter (patient or provider). A pending item shows an 'Awaiting submission' state, and a submission link appears only when the patient owns that item (Path B, or the Path A passport). The passport section (full name, masked passport number, date of expiry) appears only for Path A, and the return flight section only if a return record exists."}}
  - {"op": "add_node", "id": "REQ-008-057", "type": "Rule", "owner_fr": "FR-008", "title": "Record visibility limited to owner, assigned clinic and admin", "attrs": {"statement": "A patient MUST see only their own travel records; a provider MUST see only bookings assigned to its clinic and only the booking currently open (no cross-patient or cross-clinic access); admin sees all travel records without restriction."}}
  - {"op": "add_node", "id": "REQ-008-058", "type": "Rule", "owner_fr": "FR-008", "title": "No-travel declaration by a Path B patient", "attrs": {"statement": "On the travel requirement check (Path B only), the patient MUST state whether travel is needed. Yes leads to flight and then hotel submission. No MUST set the TravelContext travel_required flag to false (no_travel_required), suppress further travel submission reminders for the booking, skip the flight and hotel steps, and show the itinerary as 'No travel required'. The check is not shown for Path A."}}
  - {"op": "add_node", "id": "REQ-008-059", "type": "Rule", "owner_fr": "FR-008", "title": "No-travel declaration reversed by admin only", "attrs": {"statement": "A patient MUST NOT be able to reverse a no-travel declaration and contacts admin instead. Admin MAY override no_travel_required from the Travel section and re-send the travel submission request. The declaration and any admin override MUST be recorded on the TravelContext with timestamp and actor ID."}}
  - {"op": "add_node", "id": "REQ-008-060", "type": "Rule", "owner_fr": "FR-008", "title": "Admin re-notify limited to patient-owned pending items", "attrs": {"statement": "Admin 'Re-notify patient' MUST send a manual reminder only for a patient-owned pending item: the passport in Path A, or flight or hotel in Path B unless the booking is marked no_travel_required. Provider-owned Path A flight and hotel items MUST NOT create patient submission reminders."}}
  - {"op": "add_node", "id": "REQ-008-061", "type": "Rule", "owner_fr": "FR-008", "title": "Closed TravelContext is read-only; refunds are out of scope", "attrs": {"statement": "A closed TravelContext MUST reject new passport, flight and hotel records, patient re-notification and admin corrections; its records stay read-only with their audit history, and Enter Flight, Enter Hotel, Re-notify patient, Confirm Travel Dates and Apply Correction are not available. Any external flight or hotel cancellation is coordinated outside the platform under the governing booking policy; FR-008 MUST NOT calculate refunds or cancellation fees."}}
  - {"op": "add_node", "id": "REQ-008-062", "type": "Rule", "owner_fr": "FR-008", "title": "Appointment change keeps the accepted baseline visible", "attrs": {"statement": "When an approved admin intervention changes the appointment date after confirmation, the system MUST preserve the immutable accepted appointment baseline, show the current booking appointment alongside it, and revalidate the existing flight and hotel dates before the itinerary is treated as current. Patients and providers see 'Travel dates under admin review' on the affected sections but cannot clear it. FR-008 MUST NOT automatically rebook external travel."}}
  - {"op": "add_node", "id": "REQ-008-063", "type": "Rule", "owner_fr": "FR-008", "title": "Treatment plan days stay relative", "attrs": {"statement": "Treatment plan days in the accepted option are relative days. FR-008 MUST NOT store them as calendar dates; it derives the last treatment plan day only to show the early-departure warning, and later FR-010 changes to the treatment plan, clinicians or grafts MUST NOT change the TravelContext or the accepted snapshot."}}
  - {"op": "add_node", "id": "REQ-008-064", "type": "Rule", "owner_fr": "FR-008", "title": "Provider status badges and entry actions follow path and inclusion", "attrs": {"statement": "The provider Travel section MUST show status badges for passport (Path A only), outbound flight, return flight and hotel (Not included, Awaiting or Submitted), updated in real time on submission and on admin correction, and MUST show the Awaiting states immediately when the booking becomes Confirmed. In Path A, Enter Flight and Enter Hotel appear only for included services; services not included show 'Not included' with no entry action. In Path B only View Travel Details (read-only) is shown and the provider cannot enter or modify records."}}
  - {"op": "add_node", "id": "REQ-008-065", "type": "Rule", "owner_fr": "FR-008", "title": "Incomplete passport status is admin-managed", "attrs": {"statement": "'Incomplete' MUST be an admin-managed passport status, used when a submitted passport record is deemed unusable or incorrect and is pending admin correction; the patient and provider cannot re-submit to change a locked record."}}
  - {"op": "add_node", "id": "REQ-008-066", "type": "Rule", "owner_fr": "FR-008", "title": "Admin corrections need a mandatory reason note", "attrs": {"statement": "Every admin correction of a travel record MUST require a mandatory 'Reason for correction' note before saving. Admin photo replacement and field edits create a new locked version, and the previous version stays in the backend records."}}
  - {"op": "add_node", "id": "REQ-008-067", "type": "Rule", "owner_fr": "FR-008", "title": "Admin soft-delete with reason", "attrs": {"statement": "Admin MAY soft-delete any travel record with a mandatory reason; deletion is not permanent and is retained in the backend audit trail."}}
  - {"op": "add_node", "id": "REQ-008-068", "type": "Rule", "owner_fr": "FR-008", "title": "Passport tab hidden for Path B", "attrs": {"statement": "The passport tab and passport status MUST be hidden entirely for Path B appointments because no passport is captured."}}
  - {"op": "add_node", "id": "REQ-008-069", "type": "Rule", "owner_fr": "FR-008", "title": "Retention periods for travel data and audit entries", "attrs": {"statement": "Booking confirmation data (flight and hotel) MUST be retained for 7 years, aligned with medical data retention under the constitution; audit log entries for travel record mutations MUST be retained for 10 years under constitution Section VI."}}
  - {"op": "add_node", "id": "REQ-008-070", "type": "Rule", "owner_fr": "FR-008", "title": "Access and modification events logged with IP", "attrs": {"statement": "All access and modification events on travel records MUST be logged with timestamp, user ID and IP."}}
  - {"op": "add_node", "id": "REQ-008-071", "type": "Rule", "owner_fr": "FR-008", "title": "Travel notifications go by email and in-app", "attrs": {"statement": "All travel notifications MUST be sent by email and in-app."}}
  - {"op": "add_node", "id": "REQ-008-072", "type": "Rule", "owner_fr": "FR-008", "title": "Replacement TravelContext notices at provider-fault transfer", "attrs": {"statement": "When the replacement TravelContext is set to travel-date-review-required after a provider-fault transfer, the patient, the replacement provider and admin MUST be notified.", "rationale": "Alternative Flow B2 step 6."}}
  - {"op": "add_node", "id": "REQ-008-073", "type": "Rule", "owner_fr": "FR-008", "title": "Provider-fault carry-over applies before treatment starts", "attrs": {"statement": "The provider-fault carry-over MUST apply only when an admin transfers the patient through FR-006 Alternative Flow B5 after the original booking was confirmed and before treatment starts. A provider fault during Aftercare reassigns only the aftercare provider (FR-011) and leaves the booking and its TravelContext unchanged."}}
  - {"op": "add_node", "id": "REQ-008-074", "type": "Rule", "owner_fr": "FR-008", "title": "Only verified logged-in patients may submit travel records", "attrs": {"statement": "Only verified, logged-in patients MAY submit passport and travel records.", "rationale": "Dependencies (internal), FR-001; FR-001 does not state this rule for travel records."}}
  - {"op": "add_node", "id": "REQ-008-075", "type": "Rule", "owner_fr": "FR-008", "title": "Admin manages travel settings", "attrs": {"statement": "Admin MUST be able to manage travel settings and, in a future phase, API configuration, commission parameters and per-country enablement once API booking is live.", "rationale": "Admin Platform scope and Screen 12 future note. The PRD does not define any MVP travel setting; recorded as a question."}}
  - {"op": "add_node", "id": "ENT-travel-context", "type": "Entity", "owner_fr": "FR-008", "title": "Travel context", "attrs": {"description": "One per confirmed FR-006 Booking, created idempotently from its immutable AcceptanceEvent and accepted subquote snapshot. The current appointment is read from Booking while the accepted baseline stays immutable here. Owns the booking's travel records. The provider package-library ID and version stay quote-option provenance, not an FR-008 decision source."}}
  - {"op": "add_node", "id": "ENT-passport-record", "type": "Entity", "owner_fr": "FR-008", "title": "Passport record", "attrs": {"description": "Booking-linked passport record, Path A only. One current record per Path A TravelContext; eligible prior details may be copied into a new locked booking-linked record without changing the earlier source record. Accessible by the patient, the assigned provider and admin."}}
  - {"op": "add_node", "id": "ENT-flight-record", "type": "Entity", "owner_fr": "FR-008", "title": "Flight record", "attrs": {"description": "One flight leg (outbound or return). Up to two current records per confirmed booking; shown in the itinerary read view. Superseded correction versions remain retained."}}
  - {"op": "add_node", "id": "ENT-hotel-record", "type": "Entity", "owner_fr": "FR-008", "title": "Hotel record", "attrs": {"description": "Hotel stay details. One current record per confirmed booking; shown in the itinerary read view. Superseded correction versions remain retained."}}
  - {"op": "update_node", "id": "ENT-travel-responsibility", "attrs": {"description": "Stub created during FR-004 migration. The FR-008 PRD defines no entity named travel responsibility; its derived travel path is the TravelContext travel_path (ENT-travel-context). Kept because FR-004 Screen 1 (Tab 7) cites it."}}
  - {"op": "add_field", "id": "ENT-travel-context.id", "entity_id": "ENT-travel-context", "name": "id", "data_type": "id", "title": "TravelContext ID", "owner_fr": "FR-008", "required": true}
  - {"op": "add_field", "id": "ENT-travel-context.booking_id", "entity_id": "ENT-travel-context", "name": "booking_id", "data_type": "id", "title": "Booking ID", "owner_fr": "FR-008", "required": true, "attrs": {"description": "Unique. Operational key of the TravelContext and of every travel record; the FR-006 Booking anchors it."}}
  - {"op": "add_field", "id": "ENT-travel-context.acceptance_event_id", "entity_id": "ENT-travel-context", "name": "acceptance_event_id", "data_type": "id", "title": "Acceptance event ID", "owner_fr": "FR-008", "required": true, "attrs": {"description": "Immutable provenance copied from the FR-005 accepted snapshot."}}
  - {"op": "add_field", "id": "ENT-travel-context.accepted_parent_quote_id", "entity_id": "ENT-travel-context", "name": "accepted_parent_quote_id", "data_type": "id", "title": "Accepted parent quote ID", "owner_fr": "FR-008", "required": true}
  - {"op": "add_field", "id": "ENT-travel-context.accepted_subquote_id", "entity_id": "ENT-travel-context", "name": "accepted_subquote_id", "data_type": "id", "title": "Accepted subquote ID", "owner_fr": "FR-008", "required": true}
  - {"op": "add_field", "id": "ENT-travel-context.accepted_parent_quote_version", "entity_id": "ENT-travel-context", "name": "accepted_parent_quote_version", "data_type": "int", "title": "Accepted parent quote version", "owner_fr": "FR-008", "required": true}
  - {"op": "add_field", "id": "ENT-travel-context.accepted_subquote_version", "entity_id": "ENT-travel-context", "name": "accepted_subquote_version", "data_type": "int", "title": "Accepted subquote version", "owner_fr": "FR-008", "required": true, "attrs": {"description": "Equals the accepted parent quote version: both are the same FR-004 aggregate version."}}
  - {"op": "add_field", "id": "ENT-travel-context.quote_option_id", "entity_id": "ENT-travel-context", "name": "quote_option_id", "data_type": "id", "title": "Quote option ID", "owner_fr": "FR-008", "required": true}
  - {"op": "add_field", "id": "ENT-travel-context.option_date_price_id", "entity_id": "ENT-travel-context", "name": "option_date_price_id", "data_type": "id", "title": "Option date-price ID", "owner_fr": "FR-008", "required": true}
  - {"op": "add_field", "id": "ENT-travel-context.accepted_appointment_date_time", "entity_id": "ENT-travel-context", "name": "accepted_appointment_date_time", "data_type": "datetime", "title": "Accepted appointment date and time", "owner_fr": "FR-008", "required": true, "attrs": {"description": "Immutable accepted baseline, copied from the accepted snapshot."}}
  - {"op": "add_field", "id": "ENT-travel-context.accepted_appointment_timezone", "entity_id": "ENT-travel-context", "name": "accepted_appointment_timezone", "data_type": "text", "title": "Accepted appointment timezone", "owner_fr": "FR-008", "required": true}
  - {"op": "add_field", "id": "ENT-travel-context.accepted_date_range_start", "entity_id": "ENT-travel-context", "name": "accepted_date_range_start", "data_type": "date", "title": "Accepted date range start", "owner_fr": "FR-008", "required": true}
  - {"op": "add_field", "id": "ENT-travel-context.accepted_date_range_end", "entity_id": "ENT-travel-context", "name": "accepted_date_range_end", "data_type": "date", "title": "Accepted date range end", "owner_fr": "FR-008", "required": true}
  - {"op": "add_field", "id": "ENT-travel-context.included_services_snapshot", "entity_id": "ENT-travel-context", "name": "included_services_snapshot", "data_type": "enum[]", "title": "Included services snapshot", "owner_fr": "FR-008", "required": true, "attrs": {"description": "Accepted option's included services (flight, hotel, transport, other) frozen at confirmation."}}
  - {"op": "add_field", "id": "ENT-travel-context.travel_path", "entity_id": "ENT-travel-context", "name": "travel_path", "data_type": "enum", "title": "Travel path", "owner_fr": "FR-008", "required": true, "calculated_by": "REQ-008-018", "attrs": {"description": "Derived at confirmation from the accepted option snapshot; never user-selectable."}}
  - {"op": "add_field", "id": "ENT-travel-context.travel_required", "entity_id": "ENT-travel-context", "name": "travel_required", "data_type": "bool", "title": "Travel required", "owner_fr": "FR-008", "required": true, "attrs": {"description": "Default true; false means no_travel_required."}}
