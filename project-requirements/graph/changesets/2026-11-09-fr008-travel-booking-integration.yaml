  - {"op": "add_node", "id": "EVT-travel-request-sent", "type": "Event", "owner_fr": "FR-008", "title": "Travel request sent", "attrs": {"description": "travel.request_sent: the automated in-app and email request to the patient, sent once when the booking becomes Confirmed (passport request in Path A, flight and hotel request in Path B). Admin re-notify sends a manual reminder for a patient-owned pending item."}}
  - {"op": "add_node", "id": "EVT-travel-record-submitted", "type": "Event", "owner_fr": "FR-008", "title": "Travel record submitted", "attrs": {"description": "travel.record_submitted: the patient submits passport, flight or hotel details; the provider is notified and the provider status badge updates."}}
  - {"op": "add_node", "id": "EVT-travel-record-entered", "type": "Event", "owner_fr": "FR-008", "title": "Travel record entered by provider", "attrs": {"description": "travel.record_entered: the provider enters flight or hotel details on the patient's behalf in Path A; the patient is notified that travel details are confirmed and available."}}
  - {"op": "add_node", "id": "EVT-travel-record-corrected", "type": "Event", "owner_fr": "FR-008", "title": "Travel record corrected by admin", "attrs": {"description": "travel.record_corrected: admin applies a correction to any travel record; both the patient and the provider are notified and the itinerary section refreshes."}}
  - {"op": "add_node", "id": "EVT-travel-date-review-required", "type": "Event", "owner_fr": "FR-008", "title": "Travel-date review required", "attrs": {"description": "travel.date_review_required: a replacement TravelContext starts in travel-date-review-required after a provider-fault transfer; the patient, the replacement provider and admin are notified."}}
  - {"op": "add_node", "id": "SCR-008-01", "type": "Screen", "owner_fr": "FR-008", "title": "Passport Submission", "attrs": {"platform": "patient", "description": "Patient submits the passport photo and form after the booking is Confirmed, only for Path A, so the provider can complete included bookings. Passes the on-device photo quality gate first. After submission the screen becomes a read-only confirmation of the form fields with a masked passport number and no photo."}}
  - {"op": "add_node", "id": "SCR-008-02", "type": "Screen", "owner_fr": "FR-008", "title": "Travel Requirement Check", "attrs": {"platform": "patient", "description": "Path B only. Full-screen prompt with the confirmed booking reference and appointment context and a single question: does the patient need to arrange travel. Yes continues to flight then hotel submission; No sets no_travel_required and goes to the itinerary showing No travel required. Buttons: Yes and No."}}
  - {"op": "add_node", "id": "SCR-008-03", "type": "Screen", "owner_fr": "FR-008", "title": "Flight Information Patient Submission", "attrs": {"platform": "patient", "description": "Path B only. Patient submits confirmed flight details for one leg; used twice for a round trip. The form header shows Outbound Flight or Return Flight. Locked on submission. Early-departure warning applies to the return leg."}}
  - {"op": "add_node", "id": "SCR-008-04", "type": "Screen", "owner_fr": "FR-008", "title": "Hotel Information Patient Submission", "attrs": {"platform": "patient", "description": "Path B only. Patient submits confirmed hotel details so the provider can coordinate. Locked on submission. Early-departure warning applies to the check-out date."}}
  - {"op": "add_node", "id": "SCR-008-05", "type": "Screen", "owner_fr": "FR-008", "title": "Travel Itinerary View Patient", "attrs": {"platform": "patient", "description": "Unified read-only view assembled each time it opens from the booking, TravelContext and current records: booking and accepted choice, package travel items, passport (Path A only), outbound and return flight, hotel. Shows Awaiting submission, Travel dates under admin review, and No travel required states; read-only when the TravelContext is closed."}}
  - {"op": "add_node", "id": "SCR-008-06", "type": "Screen", "owner_fr": "FR-008", "title": "Travel Section Provider Confirmed Booking Detail", "attrs": {"platform": "provider", "description": "Collapsible Travel section at the bottom of the provider's confirmed booking detail screen (FR-006 Screen 4), visible once Confirmed. Shows accepted choice summary, travel path, status badges and path-dependent actions: View Passport, Enter Flight, Enter Hotel (Path A) or View Travel Details (Path B). Shows early-departure flag, Travel dates under admin review and Travel-date review required labels."}}
  - {"op": "add_node", "id": "SCR-008-07", "type": "Screen", "owner_fr": "FR-008", "title": "Passport View Provider", "attrs": {"platform": "provider", "description": "Path A. Read-only view of the patient's passport details, with the passport number in full and the photo viewable but not downloadable. Access is logged."}}
  - {"op": "add_node", "id": "SCR-008-08", "type": "Screen", "owner_fr": "FR-008", "title": "Flight Information Provider Entry", "attrs": {"platform": "provider", "description": "Path A, only for flights included in the accepted option. Same form as the patient flight screen; the submitter is recorded as the provider. Locked on submission."}}
  - {"op": "add_node", "id": "SCR-008-09", "type": "Screen", "owner_fr": "FR-008", "title": "Hotel Information Provider Entry", "attrs": {"platform": "provider", "description": "Path A, only when a hotel is included in the accepted option and none has been submitted yet. Same form as the patient hotel screen. Locked on submission."}}
  - {"op": "add_node", "id": "SCR-008-10", "type": "Screen", "owner_fr": "FR-008", "title": "Travel Details Provider Path B", "attrs": {"platform": "provider", "description": "Patient-submitted flight and hotel details shown inline as collapsible sub-sections of the Travel section for Path B bookings. Entirely read-only; no passport sub-section."}}
  - {"op": "add_node", "id": "SCR-008-11", "type": "Screen", "owner_fr": "FR-008", "title": "Travel Section Admin Confirmed Booking Detail", "attrs": {"platform": "admin", "description": "Travel section of the admin's confirmed booking detail screen, shown for every confirmed booking. Shows accepted choice, travel path, statuses and TravelContext status with the review baseline. Actions: Re-notify patient, Apply Correction (to Screen 12) and Confirm Travel Dates (review only). Unavailable actions when the TravelContext is closed."}}
  - {"op": "add_node", "id": "SCR-008-12", "type": "Screen", "owner_fr": "FR-008", "title": "Travel Record Detail and Admin Correction", "attrs": {"platform": "admin", "description": "Full travel record view and correction screen reached from Apply Correction: a header plus tabs for Passport (Path A only), Flight Details and Hotel Details. Each correction needs a mandatory reason note; admin can replace the passport photo, edit fields and soft-delete a record; corrections notify the patient and provider."}}
