  - {"op": "add_field", "id": "ENT-passport-record.version", "entity_id": "ENT-passport-record", "name": "version", "data_type": "int", "title": "Version", "owner_fr": "FR-008", "required": true, "attrs": {"description": "Admin corrections write a new locked version and supersede the previous one."}}
