  - {"op": "add_field", "id": "ENT-passport-record.passport_image", "entity_id": "ENT-passport-record", "name": "passport_image", "data_type": "file", "title": "Passport photo", "owner_fr": "FR-008", "required": true, "attrs": {"description": "Photo of the passport data page. JPEG, PNG or HEIC; max 10 MB; must be legible. Reference document only."}}
  - {"op": "add_field", "id": "ENT-passport-record.submitted_by", "entity_id": "ENT-passport-record", "name": "submitted_by", "data_type": "id", "title": "Submitted by", "owner_fr": "FR-008", "required": true}
