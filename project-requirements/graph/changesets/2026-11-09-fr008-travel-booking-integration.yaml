  - {"op": "add_field", "id": "ENT-flight-record.ticket_confirmation_number", "entity_id": "ENT-flight-record", "name": "ticket_confirmation_number", "data_type": "text", "title": "Ticket confirmation number", "owner_fr": "FR-008", "required": true, "attrs": {"description": "Booking reference from the airline; required."}}
  - {"op": "add_field", "id": "ENT-flight-record.ticket_class", "entity_id": "ENT-flight-record", "name": "ticket_class", "data_type": "enum", "title": "Ticket class", "owner_fr": "FR-008", "required": true}
  - {"op": "add_field", "id": "ENT-flight-record.baggage_allowance", "entity_id": "ENT-flight-record", "name": "baggage_allowance", "data_type": "text", "title": "Baggage allowance", "owner_fr": "FR-008", "required": false, "attrs": {"description": "Checked and carry-on allowance details; free text, max 300 characters."}}
  - {"op": "add_field", "id": "ENT-flight-record.special_request", "entity_id": "ENT-flight-record", "name": "special_request", "data_type": "text", "title": "Special requests", "owner_fr": "FR-008", "required": false, "attrs": {"description": "Seat or meal preference and similar; free text, max 500 characters."}}
