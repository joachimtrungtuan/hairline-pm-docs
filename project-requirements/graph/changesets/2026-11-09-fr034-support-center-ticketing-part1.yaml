  - {"op": "add_node", "id": "REQ-034-086", "type": "Rule", "owner_fr": "FR-034", "title": "Attributes admins can edit", "attrs": {"statement": "Editable by Admin (via Admin Platform UI): Case category, priority, status, title, description (per-case editing in Screen 2); Case assignment (transfer to another admin user via Screen 5); Internal notes and admin-only comments (in Screen 3); Patient/provider linkage (add, modify, or remove linked records in Screen 2); Case tags and labels (per-case in Screen 2); Resolution summary and resolution category (in Screen 4); Auto-close period (3, 7, or 14 days after resolution in Screen 4)", "rationale": "Business Rules, Admin Editability (prd.md lines 780 to 786). Screens 2, 3, 4 and 5 are named in the line items."}}
