  - {"op": "add_node", "id": "REQ-034-088", "type": "Rule", "owner_fr": "FR-034", "title": "Values fixed in the codebase", "attrs": {"statement": "Fixed in Codebase (Not Editable): Case lifecycle stages (Open, In Progress, Resolved, Closed); Feedback Resolution options (Implemented, Planned, Declined, Under Review); Case ID format and generation logic (CASE-YYYY-#####); Ticket Source options (Patient App, Provider Portal, Manual Admin Entry); Submitter Type options (Patient, Provider, Admin); Audit trail structure and immutability; Encryption algorithms (AES-256 for data at rest, TLS 1.3 for data in transit); Maximum attachment size (10MB per file)", "rationale": "Business Rules, Admin Editability (prd.md lines 800 to 807). Screen 7 restates that Feedback Resolution options are fixed (prd.md line 725)."}}
  - {"op": "add_edge", "from": "REQ-034-088", "verb": "applies at", "to": "STG-patient-03-active"}
  - {"op": "add_edge", "from": "REQ-034-088", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-034-089", "type": "Rule", "owner_fr": "FR-034", "title": "Notification content managed in FR-030", "attrs": {"statement": "Configurable with Restrictions (via FR-030: Notification Rules & Configuration): Email notification templates for support case events (content editable, trigger logic fixed):; Notification timing and retry logic for support case notifications; ; Note: Notification templates, delivery timing, channel preferences, and recipient rules for all support case notifications are managed centrally in FR-030 (Notification Rules & Configuration), not in FR-034. Admin configures these via Settings → Alerts & Notifications → Messaging/Support category.", "rationale": "Business Rules, Admin Editability (prd.md lines 811, 822, 823) and the note after the Integration Requirements (prd.md line 1239). The nine event templates listed at prd.md lines 812 to 820 mirror REQ-034-047. FR-030 owns templates, channels, timing and retry; the PRD boundary is recorded as stated."}}
