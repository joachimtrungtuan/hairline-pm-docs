  - {"op": "add_node", "id": "REQ-034-087", "type": "Rule", "owner_fr": "FR-034", "title": "Lists Super Admin can configure", "attrs": {"statement": "Configurable by Super Admin (via Settings > Support Center - Screen 7): Case categories list (add, edit, deactivate, reorder); Case priorities list (add, edit, deactivate, reorder, color coding); Resolution categories list (add, edit, deactivate, reorder); Root cause options list (add, edit, deactivate, reorder); Case tags master list (add, edit, delete, color coding); Auto-escalation thresholds (configurable within defined ranges: 1-48 hours for urgent cases, 12-72 hours for high priority, 7-90 days for inactivity); Reopen reason templates (add, edit, delete)", "rationale": "Business Rules, Admin Editability (prd.md lines 790 to 796). Screen 7 business rules restate the access, immediate effect and deletion limits (prd.md lines 718 to 728)."}}
