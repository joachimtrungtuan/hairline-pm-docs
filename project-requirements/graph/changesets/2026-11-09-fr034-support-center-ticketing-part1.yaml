  - {"op": "add_node", "id": "REQ-034-070", "type": "Rule", "owner_fr": "FR-034", "title": "Entry points to the Support Center", "attrs": {"statement": "Patients access Contact Support and Feedback submission forms from patient app Help Center (FR-035: Patient Help Center & Support Submission); Providers access Contact Support form from Help Centre (FR-032 Screen 5.5) to submit support requests; Providers access Feedback & Suggestions form from Help Centre (FR-032 Screen 5.6) to submit feedback; Admin staff access Support Center module from main admin navigation menu; Default view shows case listing screen with all cases (Open and In Progress by default); Admin can create new support case manually from case listing screen via \"Create New Case\" button; Super Admin and authorized admin staff access Support Center Configuration via Settings > Support Center path to manage centralized lists (categories, priorities, resolution categories, root causes, tags)", "rationale": "Entry Points (prd.md lines 131 to 162), including the Admin Platform, patient app, provider Help Centre and Settings routes. The case-listing default view is also stated on Screen 1 (prd.md line 395)."}}
