  - {"op": "update_node", "id": "REQ-001-007", "attrs": {"statement": "System MUST track and lock accounts after configurable max failed login attempts (default: 5; per Admin Settings A-09 / FR-026). The account stores the failed-attempt count and the time the lock started; the count resets after a successful login and when the lock ends, and attempts made during the lock do not extend it."}}
  - {"op": "update_node", "id": "REQ-001-009", "attrs": {"statement": "System MUST maintain unique email addresses across all patient accounts. The check also runs when a patient saves a pending email, when an admin saves an email, and again at code confirmation. A patient gets the same neutral message as on Screen 4 and the existing owner is emailed; an admin gets a plain \"address already in use\" error. If the address was taken between save and confirmation, the confirmation fails with the neutral message and the pending address is cleared."}}
  - {"op": "update_node", "id": "REQ-001-026", "attrs": {"statement": "Admin can view patient account status and verification state (email verified, email change pending); an admin changes status only through the FR-016 flows (suspend A6, lift a suspension, unlock)."}}
  - {"op": "update_node", "id": "REQ-001-043", "attrs": {"statement": "Continue button disabled until both name fields are valid and the Terms and Privacy Policy acceptance is checked; the checkbox is shown again if a newer version becomes Current before the account is created (REQ-001-044)"}}
  - {"op": "update_node", "id": "REQ-001-044", "attrs": {"statement": "One checkbox covers the Terms & Conditions and the Privacy Policy. When the account is created (Screen 4), not before, the app MUST record both acceptances via FR-027 acceptance tracking (document type, version, locale, acceptedAt, channel), each naming the version that was displayed when the box was ticked. If a newer version is Current when the account is created, the checkbox is shown again with a link to the new text before Screen 4 completes.", "rationale": "prd.md Screen 3 and Screen 4; the acceptance record needs the patient identity, which exists only once the account is created. Owner default 274 (other option: always record the newest version at creation time)."}}
  - {"op": "update_node", "id": "REQ-001-065", "attrs": {"statement": "System displays \"Invalid email or password\" error. The same message is shown for a wrong password on a Locked account, for a login from an IP address blocked under FR-026 (REQ-026-056), and for the old credentials of an account whose deletion was fulfilled (REQ-001-182)."}}
  - {"op": "update_node", "id": "REQ-001-066", "attrs": {"statement": "Patient must wait for configurable lockout duration (default: 15 minutes; per Admin Settings A-09 / FR-026) or contact support. A wrong password on a Locked account shows the normal \"Invalid email or password\" message; the lockout message appears only with correct credentials. Attempts during the lock do not extend it.", "rationale": "prd.md line 205. Also stated in the PRD at line 200: \"System displays account lockout message\"; line 201: \"System logs security event\". Owner default 272 (other option: show the lock message for any password)."}}
  - {"op": "update_node", "id": "REQ-001-180", "attrs": {"statement": "A wrong 6-digit code (registration, password reset, re-verification, email change) counts toward the same limit as failed logins (the FR-026 max login attempts setting, default 5). After the limit the code stops working and the patient must request a new one; the resend cooldown applies. There is no separate setting."}}
  - {"op": "update_node", "id": "REQ-001-181", "title": "Duplicate email at registration gets the neutral result; only a registration that never had a verified email may register again", "attrs": {"statement": "A registration with an email that belongs to an existing account gets the same neutral \"check your email\" result as a new email and reveals nothing on screen; the system emails the existing owner that an account already exists. An existing account is every record except a registration that never had a verified email, including an account whose email is unverified after an admin change. A registration that never had a verified email (never finished) may register again with the same email: only that unfinished record is replaced and a new code is sent."}}
  - {"op": "update_node", "id": "REQ-001-182", "title": "Password reset, admin reset, suspension and a fulfilled deletion end every existing session", "attrs": {"statement": "A password reset by the patient, a password reset by an admin and a suspension each end all existing sessions of the patient on every device, as Change Password does (REQ-001-119). After a patient reset a new session starts only where the account status allows it (REQ-001-076). When FR-023 sets a deletion request to Fulfilled, every session of the patient ends too, login with the old credentials gets the standard \"Invalid email or password\" result, and the email address is free for a new registration, which creates a new account with no link to the old data.", "rationale": "FR-001 PRD Screen 12 and Login Rules; owner default 256 (other option: sessions end only on Change Password) and default 273 for a fulfilled deletion (other option: the address stays blocked). FR-016 has no session-ending rule for suspension or admin reset."}}
  - {"op": "update_node", "id": "REQ-001-183", "attrs": {"statement": "When the patient changes the email on the profile, the 6-digit code is sent to the NEW address. The login email stays the old address, and the new one is held as pending (ENT-patient.pending_email), until the code is confirmed. Screen 14 shows the pending address (read only), the code input, Resend and Cancel change (clears the pending address). The code lives 15 minutes (REQ-001-098) and follows the same resend limit and wrong-code limit as the other codes; when it expires the pending address stays until the patient resends or cancels. After confirmation the new address becomes the login email, the pending value is cleared and a notice goes to the old address."}}
  - {"op": "update_node", "id": "REQ-001-184", "attrs": {"statement": "An admin may change a patient's email. The new address is saved as unverified, a notice goes to the old address, and at the patient's next login a code is sent to the new address and the patient confirms it before the session starts, on Screen 5 with the same expiry, resend and wrong-code rules. An address already in use gets a plain \"address already in use\" error (REQ-001-009)."}}
  - {"op": "update_node", "id": "REQ-001-188", "attrs": {"statement": "The account status list keeps the value Deactivated as a reserved value: nothing sets it, nothing shows it and it has no behaviour. An admin changes account status only through the FR-016 flows. The system also locks an account after failed logins (REQ-001-007), unlocks it when the lock period ends, and returns a Locked account to Active after a password reset (REQ-001-076)."}}
  - {"op": "update_node", "id": "STP-001-081", "title": "System locks the account at the attempt limit and shows the lockout message only when the credentials are correct"}
  - {"op": "update_node", "id": "STP-001-135", "title": "When the lock period ends, the failed-attempt count resets and login works again"}
  - {"op": "update_node", "id": "STP-001-139", "title": "System replaces the unfinished registration, which never had a verified email, with the new registration and sends a new code"}
