  - {"op": "update_node", "id": "REQ-031-044", "attrs": {"statement": "On Admin Account Setup, the email is pre-filled from the invitation and cannot be edited; first and last name are required, pre-filled but editable (2-50 characters; letters, spaces, hyphens only). The screen shows the assigned role (\"You've been invited as [Role Name]\"), the Super Admin's personal message when provided, and an invitation expiry countdown when less than 24 hours remain.", "rationale": "Screen 3 data fields, business rules and notes. The invitation form (Screen 2) allows names up to 50 characters without a 2-character minimum. prd.md lines 459-460 (First Name and Last Name: Required Yes)."}}
  - {"op": "update_node", "id": "REQ-031-045", "attrs": {"statement": "On Admin Account Setup, Password and Confirm Password are required and Confirm Password must match Password exactly (\"Passwords do not match.\"). A password that does not meet the policy is rejected with \"Password must be at least 12 characters with uppercase, lowercase, number, and special character from !@#$%^&(),.?\\\":{}|<>.\"", "rationale": "Screen 3 data fields and validation messages. The password policy itself is REQ-031-018 (defined in FR-026). prd.md lines 462-463 (Password and Confirm Password: Required Yes)."}}
