  - {"op": "update_node", "id": "REQ-031-009", "attrs": {"statement": "System MUST NOT allow a Super Admin account to be suspended by another user, or removed, demoted or self-deactivated inside the product (system protection; if ever needed, this is done outside the product). When another admin tries to suspend one, including one Super Admin trying to suspend another, the action is blocked with \"A Super Admin account cannot be suspended. Super Admin accounts can only be changed outside the product.\" and both accounts stay active; when a Super Admin tries to change their own role or deactivate their own account, the action is blocked with \"A Super Admin account cannot be demoted or deactivated in the product. This can only be done outside the product.\"", "rationale": "PRD Functional Requirements Summary, REQ-031-009; Tab 2 business rules; Business Rule 7; User Story 6. Business Rule 4 (at least one active Super Admin must exist at all times, system protection against lockout) is merged here. prd.md lines 1304-1310 (User Story 6 scenarios 1 to 3 give the two messages)."}}
