# FR-011 logic review pass 2: graph change-set mirroring PRD v1.14. Order: new rule, steps, field and enum values first; then new edges; then updates; then removals and the retired field.
# Cross-FR edges: FR-011 references REQ-007-100 and REQ-006-019 (edges only, nodes owned by FR-007 and FR-006 untouched). All other edges stay inside FR-011.
# Removed edges: STP-011-027 done by the aftercare specialist and on Screen 10 (the step moves to the coordinator on Screen 14); SCR-011-16 shows the discount field (retired, discount codes do not apply to aftercare in this release).
# Queued for other FRs, not done here: FR-006 (read the completion outcome, REQ-006-060), FR-015 (aftercare participation yes or no on the provider profile and its screen row), FR-038 (new standalone request after a Rejected or Expired conversion), FR-030 (notice wording for the new endings), FR-007 and FR-017 (handover fee paid from Hairline revenue in the treatment-linked flow).
reason: "FR-011 logic review pass 2: one closing rule for every ending of aftercare with an admin cancel control; time ends a milestone and an undone required task becomes Missed; reminder and escalation clock for a paid add-on and an assigned standalone request instead of the add-on unassigned expiry; Pending activation plan status; coordinator actions on Screen 14 and confirm-and-activate after a handover; a reassignment has no automatic refund; add-on alternative template only at the price already paid; aftercare participation as a provider profile setting; new standalone request after a rejected or expired conversion; discount field retired; Screen 15 availability marks."
by: docs-manager
operations:
  - {"op": "add_node", "id": "REQ-011-101", "type": "Rule", "owner_fr": "FR-011", "title": "Every ending of aftercare stops all reminders and emits the completion event with an outcome; an admin can cancel with a reason", "attrs": {"statement": "Every ending of aftercare (completed, paperwork-only completion, cancelled by the patient through subscription cancellation once the paid period ends, cancelled by an admin) MUST stop all reminders for the plan and emit the completion event with an outcome value; the booking then moves to Completed as it does on a normal completion, which FR-006 reads. The admin MUST be able to cancel aftercare on Screen 14 Tab 4 with a mandatory reason, and the cancellation is written to the audit trail."}}
