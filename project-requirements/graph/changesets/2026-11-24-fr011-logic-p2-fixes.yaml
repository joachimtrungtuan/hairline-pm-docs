  - {"op": "update_node", "id": "EVT-aftercare-completed", "attrs": {"description": "aftercare.completed: aftercare ends and the event carries an outcome value: completed (the end of the last milestone or the subscription term, REQ-011-096), paperwork only, cancelled by the patient (subscription cancellation once the paid period ends) or cancelled by an admin (REQ-011-101). FR-006 reads this event to move the booking on (REQ-006-060); reading the outcome is queued for FR-006. FR-011 is the producer; FR-030 owns registration."}}
  - {"op": "update_node", "id": "EVT-aftercare-request-rejected", "attrs": {"description": "aftercare.request_rejected: the request becomes Rejected, by the admin with a reason, by the 7-day unassigned expiry (standalone only) or by the patient cancelling a changed price (Workflow 2 B2, B3 and B4). For a request converted from FR-038 monitoring the notice says the patient may start a new standalone request (REQ-011-094). FR-011 is the producer; FR-030 owns delivery and catalogue registration."}}
  - {"op": "update_node", "id": "EVT-aftercare-request-expired", "attrs": {"description": "aftercare.request_expired: the request becomes Expired after 48 hours without successful payment (Workflow 2 B1, Workflow 2b B1b). For a request converted from FR-038 monitoring the notice says the patient may start a new standalone request (REQ-011-094). FR-011 is the producer; FR-030 owns delivery and catalogue registration."}}
  - {"op": "update_node", "id": "SET-aftercare-plan-reminder-days", "attrs": {"description": "Number of days before the assignee gets a reminder that the aftercare plan is not finished. Counted from the FR-010 completion signal (treatment-linked), from payment (paid add-on) or from assignment (standalone); it restarts at a handover or an admin assignment. Admin-editable."}}
  - {"op": "update_node", "id": "SET-aftercare-plan-escalation-days", "attrs": {"description": "Number of days before an unfinished aftercare plan is escalated to the admin, counted from the same starting points as the reminder. Admin-editable."}}
  - {"op": "update_node", "id": "SET-aftercare-handover-fee", "attrs": {"description": "Fixed amount paid to the provider when the provider hands the aftercare to the Hairline aftercare team. In the treatment-linked flow there is no separate aftercare price, so Hairline pays it from its own revenue; in the add-on and standalone flows Hairline keeps the rest of the price. Admin-editable; a default of 0 means nothing is paid until the admin sets an amount."}}
  - {"op": "update_node", "id": "ENT-aftercare-plan.status", "attrs": {"description": "Plan status: pending_activation (a treatment-linked plan whose setup is open, opened at the FR-010 completion signal, or a standalone plan configured but unpaid), active, completed or cancelled."}}
  - {"op": "update_node", "id": "ENT-aftercare-task.status", "attrs": {"description": "Task status: pending, completed, or missed (a required task not done by the end of its milestone). Overdue is a separate flag, not a status."}}
  - {"op": "update_node", "id": "REQ-011-023", "title": "Milestones progress by time, cannot be skipped and close on schedule; a required task not done by then is Missed", "attrs": {"statement": "Milestones progress automatically based on time elapsed and close on schedule at their end. Patients cannot skip milestones. A required scan, questionnaire or education task not done by the milestone end becomes Missed (task status missed), and the plan completes at the end of the last milestone (REQ-011-096). Medication tick-offs are adherence tracking only and do not affect a milestone."}}
  - {"op": "update_node", "id": "REQ-011-024", "attrs": {"statement": "Scan uploads must meet the quality threshold. Questionnaires must be completed in full. Medication adherence is tracked but has no effect on a milestone and is not part of the progress percentage."}}
  - {"op": "update_node", "id": "REQ-011-027", "attrs": {"statement": "Progress = (completed scan, questionnaire and education tasks / total such tasks) * 100; a Missed task counts as not done. Tasks are weighted equally; medication adherence is not part of the percentage. Progress updates in real time."}}
  - {"op": "update_node", "id": "REQ-011-037", "attrs": {"statement": "Any payment already taken is refunded in full and automatically when a request is rejected by the admin (an add-on too, after payment) or a standalone request stays unassigned for 7 days. A request that expires unpaid after 48 hours, or that the patient cancels at a changed price, had no payment taken, so nothing is refunded. Rejection requires a reason."}}
  - {"op": "update_node", "id": "REQ-011-053", "title": "Unassigned standalone requests are rejected after 7 days; an add-on has no unassigned expiry", "attrs": {"statement": "A standalone request not assigned within 7 days of submission, with the time paused while the request is Awaiting provider availability, becomes Rejected with a system reason and the refund rule applies. A post-treatment add-on has no unassigned expiry because assignment is automatic at payment; its reminder and escalation follow REQ-011-090."}}
  - {"op": "update_node", "id": "REQ-011-054", "title": "Add-on assigned automatically after payment: original provider if Active and participating, otherwise the Hairline team", "attrs": {"statement": "Payment confirmation of a post-treatment add-on triggers automatic assignment: the system assigns the original treatment provider if the provider is Active and has the aftercare participation setting on (a standing yes or no setting on the provider profile, owned by FR-015), otherwise the Hairline aftercare team; the patient is notified of the provider assignment and the assigned provider receives a notification."}}
  - {"op": "update_node", "id": "REQ-011-056", "attrs": {"statement": "When the provider marks \"Paperwork only - no aftercare service\" and uploads an aftercare instructions document, the patient receives the instructions but no active monitoring, and the patient status moves to Completed after instruction delivery. The setup row closes with no plan, the closing rule applies (REQ-011-101) and the completion event carries the outcome paperwork only; a later add-on stays allowed (REQ-011-092)."}}
  - {"op": "update_node", "id": "REQ-011-057", "attrs": {"statement": "When the provider marks \"Assign to Hairline aftercare team\", the admin receives a notification for aftercare assignment, the Hairline aftercare team takes over patient monitoring, and, after the handover, the coordinator confirms the plan on Screen 14 and the system activates it. The provider is paid a fixed handover fee set by the admin (default 0, so nothing is paid until the admin sets an amount); in the treatment-linked flow there is no separate aftercare price, so Hairline pays the fee from its own revenue, and in the add-on and standalone flows Hairline keeps the rest of the price. When the Hairline team delivers by default in the add-on flow, or after an admin reassignment, Hairline keeps the full price with no commission line and no provider payment. When a provider delivers, the provider is paid the price less commission (REQ-011-040)."}}
  - {"op": "update_node", "id": "REQ-011-075", "attrs": {"statement": "A reassignment changes only the aftercare provider or team; the plan, milestones, scans, questionnaire responses, medications and communication history stay with the case, the new assignee gets the aftercare actions from the moment of confirmation, the previous provider loses them and keeps read-only access to history it recorded, and a reassignment has no automatic refund and no refund ladder: for a standalone plan any refund is an admin manual refund (REQ-007-100); for a treatment-linked case reached through the FR-006 B7 decision, the refund and payout hold are those set on FR-006 Screen 11 (REQ-006-019). The setup clock of REQ-011-090 restarts at the admin assignment and addresses the new assignee, and Screen 19 marks a provider handover differently from an admin reassignment."}}
  - {"op": "update_node", "id": "REQ-011-090", "title": "Plan not finished: assignee reminder after 2 days, admin escalation after 4 days", "attrs": {"statement": "When an aftercare plan is not finished, System MUST remind the assignee after 2 days and escalate the case to the admin after 4 days; both day counts are admin settings. The days count from the FR-010 completion signal (treatment-linked), from payment for a paid add-on whose plan is not activated, and from assignment for a standalone request whose provider has not finished the plan; the clock restarts at a handover or an admin assignment and addresses the current assignee. The admin can reassign on Screen 19 or, for a treatment-linked plan or a paid add-on, activate the plan manually (REQ-011-019)."}}
  - {"op": "update_node", "id": "REQ-011-092", "title": "No add-on while a plan for the same booking is Pending activation, Active or Completed", "attrs": {"statement": "System MUST refuse a post-treatment add-on while a plan for the same booking is Pending activation, Active or Completed, and allow it after a paperwork-only completion. A plan is Pending activation from the opening of setup at the FR-010 completion signal (treatment-linked) or from configuration until payment (standalone); a paperwork-only completion closes the opened setup row with no plan."}}
  - {"op": "update_node", "id": "REQ-011-093", "attrs": {"statement": "System MUST accept a standalone request converted from an FR-038 transplant-progress monitoring case, carrying the source, the monitoring case, the scan or photo set, the report file and an idempotency key; a repeated key returns the existing request, and a new standalone request after a Rejected or Expired converted request uses a new idempotency key. The patient still picks the template and pricing option."}}
  - {"op": "update_node", "id": "REQ-011-094", "attrs": {"statement": "System MUST refuse a conversion once the monitoring case is completed, and after a failed or abandoned request MUST return the patient to FR-038 Screen 6 with the draft intact (REQ-038-068). When a converted request ends Rejected or Expired, the notice says the patient may start a new standalone request pre-filled from the same source data; the monitoring case stays final."}}
  - {"op": "update_node", "id": "REQ-011-096", "attrs": {"statement": "System MUST complete the plan at the end of the last milestone or the end of the subscription term, whichever is later, stop all reminders for the plan (including the progress reminder of REQ-011-088) and emit a completion event that FR-006 reads (REQ-006-060); every other ending follows REQ-011-101."}}
  - {"op": "update_node", "id": "REQ-011-098", "attrs": {"statement": "The assigned provider (or the Aftercare Coordinator when the Hairline team delivers) MUST be able to propose an extension or major change with a reason. The admin approves or rejects it on the admin case screen (approval status Proposed, Approved or Rejected) and the patient is notified. Where the change costs more, the patient MUST accept and pay before it takes effect. A rejection leaves the plan unchanged and the proposer is told why. When the coordinator proposes, the approving admin MUST be a different person."}}
  - {"op": "update_node", "id": "REQ-011-099", "attrs": {"statement": "The plan MUST carry an urgent flag and the time it was raised, set by an urgent questionnaire answer or a manual flag. The assigned provider (or the coordinator when the Hairline team delivers) clears it with a note. When the flag is not cleared within 2 hours of the raised time (clearing it with a note is the response), System MUST escalate the case to the admin. Dashboards count the plans that have the flag set."}}
  - {"op": "update_node", "id": "REQ-011-100", "title": "Alternative template only among those offering the chosen pricing option; in the paid add-on only at the price already paid; the patient accepts a changed standalone price or cancels at no charge", "attrs": {"statement": "The provider MAY pick an alternative template only among templates that offer the pricing option the patient chose. Screen 7 shows the order summary of the final template; when the final price differs from the requested price the patient MUST accept the new price before paying, or may cancel at no charge, in which case the request becomes Rejected with the system reason cancelled by patient. In the post-treatment add-on flow, which is already paid, an alternative is allowed only if its price for the chosen pricing option equals the price already paid (REQ-011-047)."}}
  - {"op": "update_node", "id": "REQ-011-049", "attrs": {"statement": "The assigned provider reviews the patient case, selects the aftercare template (the purchased one, or an alternative that offers the chosen pricing option, REQ-011-100; in the paid add-on only at the price already paid) and customizes the plan. For a standalone request the provider completes the plan, the request becomes Payment due, the plan is not active until payment succeeds and the system notifies the patient that payment is now due; for a post-treatment add-on the provider activates the plan. On activation the patient receives an activation notification and gains access to the aftercare dashboard (Screen 1) and the aftercare team begins monitoring."}}
