reason: "Requirements graph programme baseline 2026-11-20: owner rulings applied (FR-019)"
by: controller
operations:
  - {"op": "add_node", "id": "REQ-019-109", "type": "Rule", "owner_fr": "FR-019", "title": "An admin overrides a discount approval only for Hairline Only programs", "attrs": {"statement": "System MUST let an admin override a discount approval only for Hairline Only programs; an admin can never force a provider to take part in a program.", "rationale": "FR-019 PRD, Functional Requirements Summary and the module overview. Moved in from FR-017 (former REQ-017-145)."}}
  - {"op": "add_edge", "from": "REQ-019-109", "verb": "applies at", "to": "STG-admin-02-operations"}
  - {"op": "add_edge", "from": "REQ-019-109", "verb": "applies to", "to": "ACT-platform-admin"}
  - {"op": "add_edge", "from": "REQ-019-109", "verb": "applies to", "to": "SCR-019-03"}
  - {"op": "add_edge", "from": "REQ-019-109", "verb": "applies to", "to": "ENT-promotion-adoption"}
  - {"op": "add_node", "id": "REQ-019-110", "type": "Rule", "owner_fr": "FR-019", "title": "Hairline and provider portions of a discount follow the commission effect; Both Fees adds a reimbursement", "attrs": {"statement": "System MUST record the Hairline portion and the provider portion of every Application's discount value according to the commission effect for every program type, and for a Both Fees program MUST add Hairline's reimbursement of the Hairline share % on top.", "rationale": "FR-019 PRD, Functional Requirements Summary, General Module Rules (funding split of each Application) and Screen 6 Funding Split."}}
  - {"op": "add_edge", "from": "REQ-019-110", "verb": "applies at", "to": "STG-main-05-payment"}
  - {"op": "add_edge", "from": "REQ-019-110", "verb": "applies to", "to": "ENT-promotion-application.hairline_portion"}
  - {"op": "add_edge", "from": "REQ-019-110", "verb": "applies to", "to": "ENT-promotion-application.provider_portion"}
  - {"op": "update_node", "id": "REQ-019-004", "title": "Priority and non-stacking apply to the whole platform; one automatic promotion per quote", "attrs": {"statement": "System MUST enforce priority and non‑stacking rules across the whole platform (patient-entered code > provider discount > Hairline-funded discount > affiliate discount when conflicts arise) and MUST attach at most one automatic promotion per quote."}}
  - {"op": "update_node", "id": "REQ-019-010", "title": "Provider approval notice uses the FR-030 approval-requested event and the FR-020 notification service", "attrs": {"statement": "System MUST notify targeted providers when a platform discount awaits their approval, using the approval-requested event of the FR-030 notification catalogue and the notification service defined in FR-020.", "rationale": "Integration Requirements and Shared Services. The approval-requested event is one event in the FR-030 catalogue."}}
  - {"op": "update_node", "id": "REQ-019-016", "attrs": {"statement": "System MUST calculate commission on the accepted price after the promotion, in the quote currency and read from the acceptance snapshot, for every discount type, including Hairline-funded programs; no program keeps commission on the price before the promotion. FR-029 carries the matching Rule REQ-029-054.", "rationale": "General Module Rules, Alternative Flows A2 and C1 and Core Requirements. FR-029 carries the matching Rule REQ-029-054; the owner kept both on purpose, so they are reviewed and kept as different Rules.", "distinct_from": "REQ-029-054"}}
  - {"op": "update_node", "id": "REQ-019-023", "title": "Program lifecycle in scope: six states, with usage limits and date windows", "attrs": {"statement": "Discount code definition and lifecycle (draft, pending approval, active, paused, expired, archived), with usage limits and date windows.", "rationale": "Scope Boundaries. The Screen 2 lifecycle field lists five states without Pending Approval; the two are not reconciled in the PRD (open item)."}}
  - {"op": "update_node", "id": "REQ-019-027", "attrs": {"statement": "Admin defines discount (type, value, Hairline share %, dates, usage limit, targeted providers). System saves discount as Pending Approval and notifies targeted providers (approval-requested event of the FR-030 notification catalogue)."}}
  - {"op": "update_node", "id": "REQ-019-037", "attrs": {"statement": "Trigger: Admin issues a Hairline-funded code (open code, segment-bound, or affiliate-distributed) and the patient enters it on one named subquote before acceptance. Steps: System validates the code against issuance binding (open vs recipient-bound), records the redemption against the issuing channel (e.g., affiliate id), and calculates commission on the accepted price after the promotion, as for every discount type. For affiliate-bound codes, code generation and affiliate assignment are initiated from FR-018; FR-019 receives the registered code and manages redemption lifecycle. Outcome: Patient receives discount; the platform commission and the provider's payout are both reduced, with the provider bearing most of the discount; affiliate (if applicable) accrues the configured incentive (see FR-018), where a percentage affiliate commission is calculated on net revenue after discounts and refunds."}}
  - {"op": "update_node", "id": "REQ-019-045", "attrs": {"statement": "Provider Self-Created programs appear here so admins can monitor and intervene; admins may pause or archive any program and may change a provider-owned definition only as a logged governance override (see Screen 4). Admin may open Screen 2 in read-only mode for provider self-created programs; editing is reserved for the provider unless an override is needed (governance action, logged in audit). Admin may pause or archive any provider self-created program via row action with mandatory reason text."}}
  - {"op": "update_node", "id": "REQ-019-049", "title": "Program lifecycle state moves forward only, except Pause and Resume", "attrs": {"statement": "Lifecycle State: Draft → Active → Paused → Expired → Archived; Forward transitions only, except Pause and Resume.", "rationale": "Screen 2 common data fields. Pause and Resume on Screens 1 and 8 are the allowed exception; the Pending Approval state on Screen 1 is not in this field (open item)."}}
  - {"op": "update_node", "id": "REQ-019-051", "attrs": {"statement": "For Admin-via-Provider, saving transitions the program to `Pending Approval` and notifies targeted providers (S-03; approval-requested event of the FR-030 notification catalogue)."}}
  - {"op": "update_node", "id": "REQ-019-056", "title": "Admin and provider programs offer the same four Application Mode choices", "attrs": {"statement": "Admin programs and provider programs offer the same `Application Mode` list: `Auto-applied / List-selection / Code-only / Either`. A provider selects an admin program on a quote only from the list of programs the provider has adopted through the approval workflow (Screen 7), never before adoption. The existing limits stand: `Auto-applied` is only allowed for `Hairline Only` or `Provider Only` programs, and Hairline-Funded programs do not appear in provider selection UIs.", "rationale": "Screen 2 notes and Screen 9 Application Mode field (same four choices as Screen 2)."}}
  - {"op": "update_node", "id": "REQ-019-067", "title": "Affiliate-bound code generation in FR-018 for 50 affiliates registers 50 unique codes, one per affiliate", "attrs": {"statement": "Given the admin starts affiliate-bound code generation in FR-018 for 50 selected affiliates and the program's channel = Affiliate-bound, when FR-018 completes generation, then 50 unique codes are registered with this program, each bound to exactly one affiliate, and each appears in the table with status = Unused.", "rationale": "Screen 5 acceptance criterion 1. FR-018 owns generation and one-affiliate-per-code assignment; FR-019 owns validation and redemption state."}}
  - {"op": "update_node", "id": "REQ-019-071", "title": "Refund is logged with a reason, integrates with FR-017 and never changes the accepted price", "attrs": {"statement": "Refund actions are logged with mandatory reason and integrate with FR-017 (Billing & Finance) for monetary reconciliation. They never change the accepted price or the AcceptanceEvent snapshot.", "rationale": "Screen 6 business rules and acceptance criterion 2 (status Refunded, FR-017 receives a reconciliation event)."}}
  - {"op": "update_node", "id": "REQ-019-083", "title": "A provider cannot refund a Completed redemption; that authority is admin's", "attrs": {"statement": "The provider cannot refund a Completed redemption; that authority sits with admin (Screen 6)."}}
  - {"op": "update_node", "id": "REQ-019-093", "attrs": {"statement": "Discount categories, code format policy, the maximum discount value (one Setting; this PRD fixes no figure), and campaign dates. Targeting rules (all providers vs. subsets) and approval routing. Notification templates for approvals and status: managed in FR-030 (setting: promotion notification templates). Minimum number of quotes on each side before Conversion Lift is shown (launch default: 20 quotes on each side)."}}
  - {"op": "update_node", "id": "REQ-019-094", "attrs": {"statement": "Maximum discount value per policy and region (the same single Setting as above). Auto‑decline window for unresponded provider approvals."}}
  - {"op": "update_node", "id": "REQ-019-095", "attrs": {"statement": "Single‑discount rule and priority order (apply to the whole platform). Promotion terms fixed at send and frozen at acceptance. Calculation order of operations (base → discounts → taxes/fees)."}}
  - {"op": "update_node", "id": "REQ-019-105", "title": "The Code-only application mode requires a Code; the other modes leave it optional", "attrs": {"statement": "An Application Mode of Code-only requires the Code(s) field to be filled; the field is optional for the other modes, on the admin form (Screen 2) and the provider form (Screen 9).", "rationale": "Screen 2 Code(s) field and Screen 9 Application Mode field (Code-only requires Code field)."}}
