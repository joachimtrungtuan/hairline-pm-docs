# FR-016 logic review pass 2: ruled fixes applied to the PRD (Admin Patient Management). New rules, steps, flows and audit action values come first, then removed edges (write.py rejects a duplicate edge key, so a changed edge is removed before it is added again), then new edges, then updates and the retired audit value.
# Cross-FR edges (from an FR-016 node to another FR's node; no other FR's node is updated): FR-016 references REQ-007-015, REQ-007-097, REQ-007B-080 and REQ-007B-090; STP-016-034 applies REQ-007-015. STP-016-080 keeps its existing next edge to STP-006-301.
# Queued for other FRs, not done here: FR-006 (cancellation cause Patient account suspended on Screen 9), FR-001 (login rule and message for a Suspended account; Screen 19 Suspend opens the FR-016 flow, REQ-001-025 and REQ-001-028), FR-012 (REQ-012-018 read-only conversations while the patient is suspended), FR-030 (patient warning notice event), FR-031 (wording of the Issue Refunds approval line and the permission for Retry Charge and Take Action), FR-007 (nothing to restate, refund approval is cited by reference).
# Left alone on purpose: the minor observations of the review (see the ledger leftovers). The Overview has no separate bookings panel; the Cancellation failed mark is stated on the patient's Overview tab and no field or screen is added.
reason: "FR-016 logic review pass 2: Approve only for Pending Admin Review and a Denied outcome step; refunds enter an FR-007 manual refund; Payment Retry and Send Payment Reminder use the FR-007B Retry Charge access; suspension cascade cause, audit booking ids and Cancellation failed mark; password reset never changes Suspended; conversations read-only while suspended; Take Action offers a patient warning or suspension; three audit action types added and provider warning retired; flows for lift, unlock, automatic suspension end and Take Action; deletion review and cascade wiring completed."
by: docs-manager
