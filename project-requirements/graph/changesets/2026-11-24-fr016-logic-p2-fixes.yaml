  - {"op": "update_node", "id": "REQ-016-011", "title": "Admins start a refund as an FR-007 manual refund approved by another admin, with enhanced confirmation for amounts over $1,000 in addition", "attrs": {"statement": "System MUST let admins start a refund from the patient page as an FR-007 manual refund, which another admin with billing permission approves or denies (never the requesting admin), with enhanced confirmation workflow for amounts > $1,000 (US dollars; other currencies are converted at the rate FR-007 applies to that payment) in addition", "rationale": "Admin Intervention Requirements; Alternative Flow A3 step 4; Screen 5 Business Rules. The approval rule is owned by FR-007."}}
  - {"op": "update_node", "id": "REQ-016-020", "attrs": {"statement": "System MUST require enhanced confirmation + justification for high-impact actions (account suspension of any duration, refunds exceeding $1,000 (US dollars; other currencies converted at the rate FR-007 applies to that payment), manual booking modifications during active treatment, bulk patient notifications, patient data deletion for GDPR requests) even when the admin holds the FR-031 permission for the action; a refund is also an FR-007 manual refund that another admin with billing permission approves or denies"}}
  - {"op": "update_node", "id": "REQ-016-070", "attrs": {"statement": "Admin visibility and edit rights follow the FR-031 role permissions: View Patients grants patient visibility (all default roles), Edit Patients grants patient edits (Super Admin by default), Manage Aftercare covers aftercare actions and access to medical data and scans (Super Admin and Aftercare Coordinator by default), View Support Center and Respond to Support cover support actions (Super Admin, Aftercare Coordinator, and Support Staff by default), Issue Refunds covers refunds, and Delete Patients covers approving deletion requests. Actions the FR-031 list does not name map as follows: Reset Password, Unlock Account, Lift Suspension, and Take Action on a flagged conversation need Edit Patients; Payment Retry and Send Payment Reminder use the same access as the FR-007B Retry Charge action, and the FR-016 buttons call that action; Send Notification needs Respond to Support; the Payments tab needs View Patient Billing; the Communications tab needs View Provider-Patient Messages, and flagging a conversation needs Flag Communications"}}
  - {"op": "update_node", "id": "REQ-016-079", "title": "Admins can start a manual refund and retry a payment", "attrs": {"statement": "Editable by admin: Payment status (starting an FR-007 manual refund, payment retry through the FR-007B Retry Charge action)"}}
  - {"op": "update_node", "id": "REQ-016-140", "attrs": {"statement": "\"Send Payment Reminder\" button for overdue installments; it uses the same access as the FR-007B Retry Charge action"}}
  - {"op": "update_node", "id": "REQ-016-190", "attrs": {"statement": "Approve deletion request: Approves deletion request; Shown only for Pending Admin Review, not for Verification Required (the admin validates first, FR-023) or In Progress; requires the retention confirmation (the protected categories stay in anonymized form with restricted access, FR-023), enhanced confirmation, and justification"}}
  - {"op": "update_node", "id": "REQ-016-012", "attrs": {"statement": "System MUST allow admins to suspend patient accounts (30 days / 90 days / Permanent) with justification; a suspension started from any admin screen runs the Alternative Flow A6 steps"}}
  - {"op": "update_node", "id": "REQ-016-217", "attrs": {"statement": "A suspension cancels only the patient's bookings in `Accepted`, `Payment Window Expired`, and `Confirmed`; `In Progress` and `Aftercare` bookings are left untouched and listed on the suspension confirmation dialog for admin follow-up. The suspension audit entry lists the booking ids cancelled, failed and left untouched."}}
  - {"op": "update_node", "id": "REQ-016-218", "attrs": {"statement": "If a booking cancellation in a suspension fails, the suspension still applies, the failed bookings are listed for admin follow-up and marked \"Cancellation failed\" on the patient's Overview tab, and the admin retries each through the FR-006 cancel action."}}
  - {"op": "update_node", "id": "REQ-016-219", "attrs": {"statement": "The cancellation cause in a suspension cascade is \"Patient account suspended\" (admin-initiated, request source Admin, the acting admin carried from this flow); the reason sent to the patient and the provider is the fixed text \"Booking cancelled because the patient account was suspended\"; the admin justification stays in the audit entry only."}}
  - {"op": "update_node", "id": "REQ-016-160", "attrs": {"rationale": "Stated in prd.md, Screen 7: Patient Detail View - Admin Actions Tab. The allowed list also holds Payment Reminder, Provider Medical Report Request, Data Export, Manual Notification, Patient Warning, Suspension Lifted and Suspension Ended. Provider warnings are not sent from the patient page."}}
  - {"op": "update_node", "id": "ENT-admin-action-log.action_type", "attrs": {"description": "Type of intervention. Values follow the Screen 7 allowed list, which also holds payment reminder, provider medical report request, data export (the export name is in the entry), manual notification, patient warning, suspension lifted, and suspension ended (a system-generated entry)."}}
  - {"op": "update_node", "id": "SCR-016-06", "attrs": {"description": "Read-only conversation history with providers, support and aftercare for compliance monitoring. Controls: flag and unflag, Flag for Review, Take Action (formal warning to the patient or suspend account), search within thread, PDF export."}}
  - {"op": "update_node", "id": "SCR-016-08", "attrs": {"description": "Queue of patient account and data deletion requests with a review modal. Filter offers all five request statuses; badges show Overdue, Blocked by obligation, Jurisdiction review and Needs attention. Controls: search, filters, Review, Approve (Pending Admin Review only, with a retention confirmation), Deny (Pending Admin Review and Verification Required), Validate Verification, Close, call and email actions."}}
  - {"op": "retire_enum_value", "field_id": "ENT-admin-action-log.action_type", "value": "provider_warning"}
