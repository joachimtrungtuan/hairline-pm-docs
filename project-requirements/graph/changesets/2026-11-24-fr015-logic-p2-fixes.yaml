  - {"op": "update_node", "id": "REQ-015-017", "attrs": {"statement": "Effective provider suspension MUST automatically cancel the provider's unaccepted Parent Quotes with the FR-004 status `cancelled_provider_status` and close all related non-terminal Accepted and Confirmed cases under A5/Screen 4, while an accepted Parent Quote keeps `accepted`; release active reservations and block further payment. Closed accepted bookings MUST enter the FR-006 provider-fault transfer instead of cancelling their inquiry. In Progress bookings MUST NOT be closed automatically; they MUST stay `In Progress` with the cause and support marker until an admin moves them to `Aftercare` with aftercare reassignment or cancels them with a reason. Aftercare bookings and FR-011 standalone aftercare cases assigned to that provider MUST NOT be closed; they MUST keep their status, receive the cause and support marker, and move to admin aftercare reassignment with no new acceptance or payment. Effective deactivation MUST apply the same cascade scope with the `ProviderDeactivated` cause, without overwriting an earlier `ProviderSuspended` cause. Suspension and deactivation MUST also end every FR-037 monitoring assignment of the provider, as FR-037 Rule 5e (REQ-037-094) rules."}}
  - {"op": "update_node", "id": "REQ-015-020", "attrs": {"statement": "System MUST revalidate provider eligibility at allocation, submission, acceptance, booking confirmation, and the FR-006 admin actions admin Revive Booking, admin appointment change (reschedule), and admin acceptance of a replacement quote (FR-006 B5) (each requires an Active provider, per FR-006 REQ-006-020), prevent in-flight operations/callbacks from reviving cancelled cases, and deduplicate cascade processing by provider-status event and affected record. The status change and its provider status event MUST be written in one transaction; the cascade MUST run as an idempotent background job with a target completion within 5 minutes, and a reactivation MUST NOT stop a running cascade for the earlier event. The cascade MUST act only on records that existed at the effective time of the status event."}}
  - {"op": "update_node", "id": "REQ-015-031", "attrs": {"statement": "An Active provider with `password_set = false` is excluded from FR-003 inquiry distribution (including explicit patient selection and reassignment) until the password is set; it may still be featured or edited by admins. A Suspended provider is not eligible either, even with a password set (Rule 9); it becomes eligible only once reactivated."}}
  - {"op": "update_node", "id": "REQ-015-032", "attrs": {"statement": "Deactivation is permanent—deactivated providers cannot be reactivated; admin must create new provider account if re-onboarding required. Deactivation frees the provider's emails: Contact Email uniqueness counts only Active and Suspended providers, and login Email follows the FR-009 global provider email identity rule (Rule 3, REQ-009-008), under which the Owner, team member, and pending-invitation emails of a Deactivated provider are freed. The new account may reuse those emails; the deactivated record and its history are retained unchanged, and Screen 3 Tab 1 is read-only. For a Deactivated provider the Screen 3 header Edit Profile is hidden and all tabs are read-only; documents can still be viewed and downloaded and the activity log read. Tab 3 and Tab 7 keep their own rules (Tab 7 allows the Payout Method change of REQ-015-138), and review actions in Tab 5 are per FR-013."}}
  - {"op": "update_node", "id": "REQ-015-069", "attrs": {"statement": "Each action checks its FR-031 permission: View Providers (read-only access), Onboard Providers (create), Edit Providers (profile, documents, commission, seat limit, featured flag), Suspend Providers (all status changes, and Reject Request on an account-closure request). Resend Activation Email requires Edit Providers. Login as Provider is Super Admin only. Roles are defined in FR-031, not in this FR"}}
  - {"op": "update_node", "id": "REQ-015-087", "attrs": {"statement": "If the admin rejects the request instead (e.g., the provider withdraws it) with \"Reject Request\" on the Closure request notice in the Screen 3 header, which requires the FR-031 Suspend Providers permission (the same as the deactivation it declines), the admin enters review notes (required, min 20 chars); the request is marked Rejected, the provider keeps its current status, the Closure Requested marker clears, and the provider receives the FR-020 `provider.closure_rejected` email with the review notes (mandatory)."}}
  - {"op": "update_node", "id": "REQ-015-068", "title": "Deactivated provider data retained for the platform retention period, never hard-deleted"}
