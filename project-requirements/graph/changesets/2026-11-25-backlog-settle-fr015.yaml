  - {"op": "update_node", "id": "REQ-015-034", "attrs": {"statement": "At most 10 active providers may be featured. Admin can set or unset featured status from the Provider-list quick action or the Basic Information toggle, and can set it at creation with the Screen 2 Step 5 Featured Provider toggle; the limit applies to all three. A request to feature an eleventh provider must be rejected without changing data and must clearly tell the admin to unfeature another provider first, using the message: \"Maximum of 10 featured providers reached. Unfeature another provider first.\" Featuring or unfeaturing does not require an admin change reason (Tab 8 still logs it). This limit must be enforced server-side for every write path."}}
