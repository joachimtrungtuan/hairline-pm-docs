  - {"op": "add_node", "id": "REQ-017-002", "type": "Rule", "owner_fr": "FR-017", "title": "Admins view provider payment schedules and process payouts", "attrs": {"statement": "System MUST allow admins to view all provider payment schedules (Weekly, 2x a Month, Monthly) and process payouts with itemized treatment breakdowns", "rationale": "PRD id REQ-017-002 (prd.md line 1758). Restated by Admin Platform scope Provider Billing (line 70) and Screens 2 and 3."}}
  - {"op": "add_node", "id": "REQ-017-003", "type": "Rule", "owner_fr": "FR-017", "title": "Admins view discount usage, fee split, revenue and ROI", "attrs": {"statement": "System MUST allow admins to view discount code usage, fee split, attributed revenue, and ROI for discounts created and managed in FR-019 / A-06", "rationale": "PRD id REQ-017-003 (prd.md line 1759). Restated by Admin Platform scope Discount Usage & ROI Tracking (line 72) and Screen 5."}}
  - {"op": "add_node", "id": "REQ-017-004", "type": "Rule", "owner_fr": "FR-017", "title": "Invoice PDFs on payment; one invoice per booking from the accepted snapshot", "attrs": {"statement": "System MUST automatically generate invoice/payment PDFs upon successful patient payment, retaining one invoice record per booking and updating its payment history for later installments/final payments. Invoice amounts and itemization use the accepted subquote snapshot via FR-006, including the promotion and price after promotion frozen at acceptance; billing never recalculates the promotion, and unaccepted alternatives are not billed.", "rationale": "PRD id REQ-017-004 (prd.md line 1760). Restated by Billing Rule 1 (line 1235: initial successful payment creates the booking's invoice; later successful payments update that same invoice and generate the payment PDF or receipt; mere subquote acceptance or unpaid options create no invoice), Screen 4 business rules (lines 588-589: invoice generated when the patient completes booking payment, deposit or full; an eligible first installment also confirms the booking and generates its invoice), Data Dependencies Entity 1 (line 1374) and Key Entity 1 relationships (one invoice per booking)."}}
  - {"op": "add_node", "id": "REQ-017-005", "type": "Rule", "owner_fr": "FR-017", "title": "Installments charged on configured dates with 3 retries", "attrs": {"statement": "System MUST automatically schedule and charge installment payments on configured dates, with 3 retry attempts for failed charges", "rationale": "PRD id REQ-017-005 (prd.md line 1761). Restated by Entry Points automated triggers (lines 124 and 127: installment cron daily at 3 AM UTC; failed payment events trigger admin alerts and retry mechanisms) and Shared Services S-02 (lines 81-83)."}}
  - {"op": "add_node", "id": "REQ-017-006", "type": "Rule", "owner_fr": "FR-017", "title": "Provider payouts from Completed or Aftercare treatments less commission", "attrs": {"statement": "System MUST calculate provider payouts based on completed treatments (status \"Completed\" or \"Aftercare\"), deducting platform commission", "rationale": "PRD id REQ-017-006 (prd.md line 1762). Restated by Main Flow step 2 (line 147: eligible earnings are completed/aftercare treatments, commission from each booking's confirmation-time snapshot, net payout amount)."}}
  - {"op": "add_node", "id": "REQ-017-007", "type": "Rule", "owner_fr": "FR-017", "title": "Consume the acceptance-locked exchange rate; never relock", "attrs": {"statement": "System MUST consume the currency/exchange-rate snapshot locked at FR-005 subquote acceptance and retained by FR-006 for all applicable multi-currency billing transactions; payment must not relock it.", "rationale": "PRD id REQ-017-007 (prd.md line 1763). Restated by Currency Rule 2 (line 1241: locked at subquote acceptance, recorded with the rate's timestamp, never relocked; no fluctuation risk to patient or provider), Screen 3 rule (line 492: no fluctuation risk to provider during payout), Screen 10 rule (line 1160) and the edge case on exchange-rate API downtime (lines 1716-1720: FR-017 never fetches or relocks a rate at payment, invoice or payout)."}}
  - {"op": "add_node", "id": "REQ-017-008", "type": "Rule", "owner_fr": "FR-017", "title": "Financial dashboard with real-time metrics", "attrs": {"statement": "System MUST generate financial dashboard with real-time metrics: total revenue, platform commission, provider payouts, outstanding invoices", "rationale": "PRD id REQ-017-008 (prd.md line 1764). Restated by Admin Platform scope Financial Reporting (line 73) and Screen 1."}}
  - {"op": "add_node", "id": "REQ-017-009", "type": "Rule", "owner_fr": "FR-017", "title": "Track affiliate commissions and process monthly payouts", "attrs": {"statement": "System MUST track affiliate commissions based on discount code usage and process monthly payouts with failure and retry visibility", "rationale": "PRD id REQ-017-009 (prd.md line 1765). Restated by Admin Platform scope Affiliate Billing (line 71) and Screen 6."}}
  - {"op": "add_node", "id": "REQ-017-010", "type": "Rule", "owner_fr": "FR-017", "title": "Payment reminders 3 days before due and 7 days if overdue", "attrs": {"statement": "System MUST send payment reminder emails 3 days before installment due date and 7 days if overdue", "rationale": "PRD id REQ-017-010 (prd.md line 1766). Restated by the Communication Structure row Payment due reminder (line 94: sent 3 days before due date) and Admin Editability (line 1209: reminder timing configured in FR-030; A-05 triggers the events that S-03 dispatches)."}}
  - {"op": "add_node", "id": "REQ-017-011", "type": "Rule", "owner_fr": "FR-017", "title": "Complete transaction history resolving provenance through the booking", "attrs": {"statement": "System MUST maintain complete transaction history for all payments, refunds, and payouts with timestamp, amount, currency, and affected parties, resolving acceptance provenance through the associated FR-006 booking without duplicating/mutating the accepted quote aggregate.", "rationale": "PRD id REQ-017-011 (prd.md line 1770). Restated by the Executive Summary (line 18: financial records remain booking-based)."}}
  - {"op": "add_node", "id": "REQ-017-012", "type": "Rule", "owner_fr": "FR-017", "title": "Provider bank details encrypted and masked to last 4 digits", "attrs": {"statement": "System MUST store provider bank account details encrypted at rest (AES-256) and display masked (last 4 digits only) in UI", "rationale": "PRD id REQ-017-012 (prd.md line 1771). Restated by Privacy Rule 2 (line 1192). Near-duplicate of REQ-017-021, kept because both carry PRD ids."}}
  - {"op": "add_node", "id": "REQ-017-013", "type": "Rule", "owner_fr": "FR-017", "title": "Discount usage metrics", "attrs": {"statement": "System MUST track discount code usage with metrics: times used, total discount amount, bookings generated, ROI", "rationale": "PRD id REQ-017-013 (prd.md line 1772)."}}
  - {"op": "add_node", "id": "REQ-017-014", "type": "Rule", "owner_fr": "FR-017", "title": "Read-only projection of the locked rate per booking", "attrs": {"statement": "System MUST keep, per booking, a read-only projection of the exchange rate and its timestamp from the FR-005 acceptance snapshot, linked to the AcceptanceEvent, for multi-currency transactions (rate never changes after subquote acceptance)", "rationale": "PRD id REQ-017-014 (prd.md line 1773). Restated by Key Entity 7 lock origin (line 1829: never written independently, edited, or relocked at payment, invoice, or payout)."}}
  - {"op": "add_node", "id": "REQ-017-015", "type": "Rule", "owner_fr": "FR-017", "title": "Separate payout records for providers and affiliates", "attrs": {"statement": "System MUST maintain separate payout records for providers and affiliates with status tracking (Pending, Processing, Paid, Failed)", "rationale": "PRD id REQ-017-015 (prd.md line 1774)."}}
  - {"op": "add_node", "id": "REQ-017-016", "type": "Rule", "owner_fr": "FR-017", "title": "Re-authentication for financial operations", "attrs": {"statement": "In MVP, system MUST require admin password re-authentication for financial operations (payout approval, refund processing). Once FR-026 / FR-031 shared MFA is delivered, these actions MUST require MFA-based re-authentication", "rationale": "PRD id REQ-017-016 (prd.md line 1778). Restated by Security Considerations Authentication (line 1474) and every confirmation modal's Re-authentication element (Screens 3, 4, 4b, 6)."}}
  - {"op": "add_node", "id": "REQ-017-017", "type": "Rule", "owner_fr": "FR-017", "title": "Billing RBAC roles", "attrs": {"statement": "System MUST implement role-based access control (RBAC) with granular permissions: Billing Admin (full access), Billing Viewer (read-only), Super Admin (full access)", "rationale": "PRD id REQ-017-017 (prd.md line 1779). Restated by Security Considerations Authorization (lines 1475-1478: Billing Viewer cannot approve payouts or refunds; Super Admin has the same refund flow as Billing Admin)."}}
  - {"op": "add_node", "id": "REQ-017-018", "type": "Rule", "owner_fr": "FR-017", "title": "Audit trail for all financial actions", "attrs": {"statement": "System MUST log ALL financial actions with audit trail: admin ID, timestamp, IP address, action type, before/after values", "rationale": "PRD id REQ-017-018 (prd.md line 1780). Restated by the Audit Rule (line 1194: all admin actions logged with admin ID, timestamp, action type and affected records), Security Considerations Audit trail (line 1480) and Main Flow step 20 (line 181: timestamp, payout amount, provider ID, statement ID)."}}
  - {"op": "add_node", "id": "REQ-017-019", "type": "Rule", "owner_fr": "FR-017", "title": "Mask patient payment methods in the UI", "attrs": {"statement": "System MUST mask patient payment methods in UI (display \"Visa ending in 1234\" NOT full card number)", "rationale": "PRD id REQ-017-019 (prd.md line 1781). Restated by Security Considerations Sensitive data masking (line 1486) and the Screen 4 Payment Method field (line 563)."}}
  - {"op": "add_node", "id": "REQ-017-020", "type": "Rule", "owner_fr": "FR-017", "title": "Soft delete; retain financial records 7 years", "attrs": {"statement": "System MUST soft-delete financial records (no hard deletion); retain records for minimum 7 years (compliance requirement)", "rationale": "PRD id REQ-017-020 (prd.md line 1782). Restated by Data Retention (line 1195: healthcare and tax compliance), Fixed in Codebase (line 1221: audit log retention 7 years) and Security Considerations Data retention (line 1485)."}}
  - {"op": "add_node", "id": "REQ-017-021", "type": "Rule", "owner_fr": "FR-017", "title": "Bank details decrypted only during payout processing", "attrs": {"statement": "System MUST encrypt provider bank account details at rest using AES-256; decrypt ONLY during payout processing", "rationale": "PRD id REQ-017-021 (prd.md line 1783). Restated by Security Considerations Encryption (line 1479). Near-duplicate of REQ-017-012, kept because both carry PRD ids."}}
  - {"op": "add_node", "id": "REQ-017-022", "type": "Rule", "owner_fr": "FR-017", "title": "Verify Stripe webhook signatures", "attrs": {"statement": "System MUST verify Stripe webhook signatures to prevent spoofing and ensure event authenticity", "rationale": "PRD id REQ-017-022 (prd.md line 1784). Technical in flavour; kept as a Rule because it carries a PRD id."}}
  - {"op": "add_node", "id": "REQ-017-023", "type": "Rule", "owner_fr": "FR-017", "title": "Integrate with the Stripe Payment API", "attrs": {"statement": "System MUST integrate with Stripe Payment API for payment intents, transfers, refunds, and webhook event processing", "rationale": "PRD id REQ-017-023 (prd.md line 1788). Integration Points (line 1437) narrow this: Stripe payment intents and patient-payment webhooks are owned by FR-007; A-05 consumes payment completion events and payout-specific webhooks only."}}
  - {"op": "add_node", "id": "REQ-017-024", "type": "Rule", "owner_fr": "FR-017", "title": "Integrate with a currency exchange API, hourly with 1-hour cache", "attrs": {"statement": "System MUST integrate with Currency Exchange API (xe.com or equivalent) with hourly rate updates and 1-hour caching", "rationale": "PRD id REQ-017-024 (prd.md line 1789). Restated by External Service 2 (lines 1360-1363)."}}
  - {"op": "add_node", "id": "REQ-017-025", "type": "Rule", "owner_fr": "FR-017", "title": "Idempotent Stripe calls", "attrs": {"statement": "System MUST use idempotent Stripe API calls (unique idempotency keys per transaction) to prevent duplicate charges/transfers", "rationale": "PRD id REQ-017-025 (prd.md line 1790). Restated by Technical Considerations Idempotency (line 1429)."}}
  - {"op": "add_node", "id": "REQ-017-026", "type": "Rule", "owner_fr": "FR-017", "title": "Process Stripe webhooks asynchronously", "attrs": {"statement": "System MUST process Stripe webhook events asynchronously via job queue (Redis Queue or AWS SQS)", "rationale": "PRD id REQ-017-026 (prd.md line 1791). Restated by Technical Considerations Async Processing (line 1430)."}}
  - {"op": "add_node", "id": "REQ-017-027", "type": "Rule", "owner_fr": "FR-017", "title": "Read-only API for provider payout history and earnings", "attrs": {"statement": "System MUST provide read-only API for Provider Platform to query payout history and earnings analytics", "rationale": "PRD id REQ-017-027 (prd.md line 1792). Restated by Integration 3 (lines 1449-1452: no direct database access across tenant boundaries; read-only RBAC for providers)."}}
  - {"op": "add_node", "id": "REQ-017-028", "type": "Rule", "owner_fr": "FR-017", "title": "Payment captured after provider-status cancellation", "attrs": {"statement": "System MUST record a payment captured after an FR-015 `ProviderSuspended` / `ProviderDeactivated` cancellation as a real transaction, MUST NOT confirm a booking or revive the case from it, MUST exclude it from provider earnings, payout, and commission recognition, and MUST flag it \"Captured after provider cancellation\" with links to the case/inquiry and the provider-status event until admin resolves it through the existing refund/adjustment workflow with reason and audit entry", "rationale": "PRD id REQ-017-028 (prd.md line 1793). Restated by Rule 14 (line 1185, adds that it does not count toward platform or affiliate commission and that no new refund percentage, fee or payout rail is introduced), Workflow B3 steps 4-9 (lines 271-288: recorded against the booking invoice, or the cancelled case or inquiry when no booking exists; the audit entry clears the flag) and the provider-suspension edge case (line 1740)."}}
  - {"op": "add_node", "id": "REQ-017-029", "type": "Rule", "owner_fr": "FR-017", "title": "Cancel remaining installments after provider-status cancellation", "attrs": {"statement": "System MUST cancel all remaining unpaid scheduled installments when a booking is cancelled by provider suspension or deactivation, keep already-paid installments recorded for admin financial resolution, and hold the booking's amounts from provider payout statements until that resolution is recorded", "rationale": "PRD id REQ-017-029 (prd.md line 1794). Restated by Rule 15 (line 1186: no further automatic charges or retries run; Payment Rule 3 does not apply), Workflow B3 steps 2-3 and 7 and the provider-suspension edge case (line 1739)."}}
  - {"op": "add_node", "id": "REQ-017-030", "type": "Rule", "owner_fr": "FR-017", "title": "Percentage commission base is the accepted price after promotion", "attrs": {"statement": "System MUST calculate Percentage platform commission on the accepted price after promotion, in the quote currency, read from the acceptance snapshot, for every discount type including Hairline Only discounts, using the commission model and value fixed at booking confirmation; the exchange rate used is the one locked at subquote acceptance", "rationale": "PRD id REQ-017-030 (prd.md line 1795). Restated by the Screen 3 rule (line 491: the result is converted to the payout currency at the rate locked at subquote acceptance, if applicable)."}}
  - {"op": "add_node", "id": "REQ-017-031", "type": "Rule", "owner_fr": "FR-017", "title": "One promotion code per named subquote before acceptance", "attrs": {"statement": "Patients may apply one promotion code to one named subquote before acceptance (FR-005 / FR-019); no code can be entered, removed, or replaced at checkout or after acceptance", "rationale": "Module Scope, Patient Platform (prd.md line 47). Restated by Key Entity 4 relationships (line 1813: one booking has at most one promotion, frozen at acceptance) and the promotion usage-limit edge case (line 1714: no code is entered or revalidated at checkout)."}}
  - {"op": "add_node", "id": "REQ-017-032", "type": "Rule", "owner_fr": "FR-017", "title": "Patients receive invoices by email; in-app invoice history is backlog", "attrs": {"statement": "[BACKLOG — Future Phase] In-app invoice history and receipt viewing for patients: not included in the MVP mobile flow. Patients receive invoices via email (PDF) at payment confirmation; in-app access deferred to a future release.", "rationale": "Module Scope, Patient Platform (prd.md line 49). Restated by Communication Out of Scope (line 110), the Screen Specifications tenant scope (line 298) and User Behavior Assumption 3 (line 1400)."}}
  - {"op": "add_node", "id": "REQ-017-033", "type": "Rule", "owner_fr": "FR-017", "title": "Providers see per-case earnings read-only", "attrs": {"statement": "Providers view earnings per completed treatment case (booking-level income visibility). Providers view commission structure and breakdown per booking. Providers can see running total of pending earnings yet to be paid out. All earnings data is read-only (providers cannot modify financial records)", "rationale": "Module Scope, Provider Platform Stage 1 (prd.md lines 55-58). Screen 9 implements it."}}
  - {"op": "add_node", "id": "REQ-017-034", "type": "Rule", "owner_fr": "FR-017", "title": "Admin consolidates earnings into per-provider scheduled payouts", "attrs": {"statement": "Admin consolidates all eligible treatment earnings into scheduled payouts (Weekly, 2x a Month, or Monthly per the provider's payout frequency configured in FR-015 / A-02). Providers view their upcoming payout schedule and expected payout amounts. Providers view payout history (completed payouts with itemised breakdown). Providers download invoices for completed payouts (PDF, generated after admin processes payout)", "rationale": "Module Scope, Provider Platform Stage 2 (prd.md lines 62-65). Screen 10 implements it."}}
  - {"op": "add_node", "id": "REQ-017-035", "type": "Rule", "owner_fr": "FR-017", "title": "FR-017 defines billing events; FR-020 delivers them", "attrs": {"statement": "FR-017 is the authoritative source for billing events; FR-020 / S-03 handles delivery, channels, and user preferences. Channels: Email and in-app push (notification dropdown) for both admin and provider platforms. SMS is deferred to a future phase. In-app chat for payment disputes is handled by FR-034 / A-10; provider-patient direct communication about payments is routed through admin support.", "rationale": "Communication Structure (prd.md lines 88-108). The eight event rows (lines 92-99) are Event nodes. Notification preferences: admin in FR-030, provider in FR-032 / PR-06 (line 104)."}}
  - {"op": "add_node", "id": "REQ-017-036", "type": "Rule", "owner_fr": "FR-017", "title": "Entry points to Billing & Finance", "attrs": {"statement": "Admin logs into Admin Platform → navigates to \"Billing & Finance\" section. Dashboard displays: upcoming payouts, outstanding patient invoices, pending provider payments, affiliate commissions due. Provider logs into Provider Platform → navigates to \"Financial Management\" section.", "rationale": "Entry Points (prd.md lines 114-117 and 131). Admin uses Screens 1 to 8; the provider uses Screens 9 and 10 inside the FR-032 navigation shell (line 297)."}}
  - {"op": "add_node", "id": "REQ-017-037", "type": "Rule", "owner_fr": "FR-017", "title": "Treatment completion makes earnings payout-eligible immediately", "attrs": {"statement": "Treatment completion triggers provider payout eligibility calculation; eligible earnings are immediately added to the provider's running earnings total", "rationale": "Entry Points, Automated Triggers (prd.md line 121). Data Dependencies Entity 2 (lines 1376-1378): the provider platform updates treatment status and the financial module monitors status changes."}}
  - {"op": "add_node", "id": "REQ-017-038", "type": "Rule", "owner_fr": "FR-017", "title": "Daily cron generates Pending Approval statements at buffer start", "attrs": {"statement": "Scheduled cron job runs daily (e.g., 3 AM UTC) to check each active provider's individual payout schedule (configured in FR-015 / A-02 — Commission & Financials tab); for each provider whose buffer window starts on that day, the system generates a payout statement with status \"Pending Approval\"; admin notified to review and approve newly generated statements", "rationale": "Entry Points, Automated Triggers (prd.md line 122). Restated by Main Flow steps 1-3 (lines 146-148: statement is a dashboard view only, no PDF generated) and Screen 2 rules (lines 399-401: providers appear in the list only once a statement is generated; each provider has its own payout frequency; there is no single platform-wide schedule)."}}
  - {"op": "add_node", "id": "REQ-017-039", "type": "Rule", "owner_fr": "FR-017", "title": "Stripe transfer webhooks drive payout status", "attrs": {"statement": "Stripe webhook events (`transfer.created`, `transfer.paid`, `transfer.failed`) trigger real-time payout status updates. `transfer.created` — confirms payout initiated; update status \"Pending\" → \"Processing\". `transfer.paid` — confirms provider/affiliate received funds; update status \"Processing\" → \"Paid\". `transfer.failed` — trigger retry logic and `payout.failed` notification event", "rationale": "Entry Points, Automated Triggers (prd.md line 126) and Integration Points payout webhooks (lines 1444-1446). Main Flow steps 16-17 (lines 166-172)."}}
  - {"op": "add_node", "id": "REQ-017-040", "type": "Rule", "owner_fr": "FR-017", "title": "Providers never see draft statements", "attrs": {"statement": "Stage 1 (earnings tracking): Provider sees per-treatment earnings accumulate in real time as treatments complete — this is always visible. Stage 2 (payout visibility): Provider sees a confirmed payout entry ONLY after admin has approved the payout statement and the Stripe transfer is initiated — providers do NOT see draft statements during the buffer review window", "rationale": "Entry Points, Provider Access (prd.md lines 132-133). Restated by Main Flow step 5 (line 150: the statement is internal to the admin review workflow) and Screen 9 rule (line 1099: provider cannot see the payout statement, buffer window status, or admin approval action)."}}
  - {"op": "add_node", "id": "REQ-017-041", "type": "Rule", "owner_fr": "FR-017", "title": "Admin told how many statements await review", "attrs": {"statement": "System notifies admin via push + email: \"X statements ready for review. Payout date: [date]\"", "rationale": "Main Flow step 4 (prd.md line 149)."}}
  - {"op": "add_node", "id": "REQ-017-042", "type": "Rule", "owner_fr": "FR-017", "title": "Failed transfer marks the payout Failed and alerts admin", "attrs": {"statement": "Status → \"Failed\"; admin notified: \"Payout failed for [Provider Name]\". Invalid bank account: Admin contacts provider (A-10); provider updates bank details in FR-032 / PR-06 Billing Settings; admin retries payout. Other Stripe error: Admin investigates error; resolves; retries transfer", "rationale": "Main Flow steps 16a-16d (prd.md lines 167-171). Restated by the closed-bank-account edge case (lines 1702-1707). Integration 1 error handling (line 1441: retry failed transfers up to 3 times, then manual review and `payout.failed`) differs from this manual retry; raised as a product owner question."}}
  - {"op": "add_node", "id": "REQ-017-043", "type": "Rule", "owner_fr": "FR-017", "title": "Provider notified of a paid payout with the invoice attached", "attrs": {"statement": "System sends email + push notification to provider with invoice attachment. Provider Financial Management dashboard updates — confirmed payout and invoice download available", "rationale": "Main Flow steps 18-19 (prd.md lines 173-174)."}}
  - {"op": "add_node", "id": "REQ-017-044", "type": "Rule", "owner_fr": "FR-017", "title": "Payout frequency change takes effect next cycle", "attrs": {"statement": "Change takes effect from the next billing cycle — current in-progress cycle is NOT affected. FR-017 cron reads updated frequency on next daily run; schedules provider's next statement at the new payout date. Provider notified: \"Your payout schedule has been updated. Your next payout date: [date]\"", "rationale": "Alternative Flow A2 steps 5-7 (prd.md lines 220-222). Steps 1-4 (change made and logged in Commission History) belong to FR-015 / A-02."}}
  - {"op": "add_node", "id": "REQ-017-045", "type": "Rule", "owner_fr": "FR-017", "title": "Provider payout disputes resolved by booking reference", "attrs": {"statement": "Admin searches disputed Booking Reference in A-05 transaction history. If not found, admin escalates to technical investigation — booking may be missing due to system error; documents in audit trail. If already included in a prior payout, admin confirms booking was correctly included; shares payout reference with provider as evidence. If missing, admin adds booking to next scheduled payout with internal note: \"Missed booking — added retroactively\"; admin notifies provider: \"Booking included in next payout [date]\". System logs dispute resolution in audit trail", "rationale": "Alternative Flow B1 (prd.md lines 227-246). Screen 7 Tab 1 Dispute Resolution Panel implements it."}}
  - {"op": "add_node", "id": "REQ-017-046", "type": "Rule", "owner_fr": "FR-017", "title": "Rate fluctuation above threshold flags bookings and alerts admin", "attrs": {"statement": "System monitors all configured currency pairs (FR-029) via external API (hourly). If the rate fluctuation exceeds the configured alert threshold, system flags pending bookings with locked rates approaching their payout date and sends admin alert: \"Currency fluctuation alert: [pair] +X% in 24h. Review payouts for potential loss exposure.\" System logs admin decision and action taken in audit trail", "rationale": "Alternative Flow B2 steps 1-4 and 8 (prd.md lines 255-266). Screen 8 implements the decision. Contact-providers outcome (line 263): any agreed change is a separate authorized finance adjustment; the accepted snapshot and AcceptanceEvent stay unchanged."}}
  - {"op": "add_node", "id": "REQ-017-047", "type": "Rule", "owner_fr": "FR-017", "title": "Billing Viewer is read-only; money-moving actions need re-authentication", "attrs": {"statement": "Billing Admin and Super Admin can view all admin financial screens and execute payout approvals, retries, refunds, overrides, and bulk actions. Billing Viewer can access the same screens in read-only mode, but selection checkboxes, money-moving buttons, retry buttons, override buttons, and confirmation modals are hidden. Any action that moves money or changes a financial status MUST invoke the financial re-authentication step before the final confirm action is enabled", "rationale": "Admin Platform Screens, Role-Based Action Visibility (prd.md lines 307-309)."}}
  - {"op": "add_node", "id": "REQ-017-048", "type": "Rule", "owner_fr": "FR-017", "title": "Dashboard amounts in the selected currency, default from FR-029", "attrs": {"statement": "All currency amounts displayed in selected currency (with real-time conversion if multi-currency). Currency selector initializes to the system default currency configured in FR-029 / A-09 Currency Management; MVP environments seed this default to USD unless an admin changes it later", "rationale": "Screen 1 business rules (prd.md lines 342-343)."}}
  - {"op": "add_node", "id": "REQ-017-049", "type": "Rule", "owner_fr": "FR-017", "title": "Active Currency Alerts counts alerts without a decision", "attrs": {"statement": "\"Active Currency Alerts\" count reflects alerts triggered by FR-029 / A-09 rate monitoring that have not yet had a decision recorded via Screen 8; count resets to 0 once all active alerts have a confirmed admin decision", "rationale": "Screen 1 business rules (prd.md line 344)."}}
  - {"op": "add_node", "id": "REQ-017-050", "type": "Rule", "owner_fr": "FR-017", "title": "Outstanding Patient Invoices statuses", "attrs": {"statement": "\"Outstanding Patient Invoices\" includes ONLY invoices with status \"Pending\", \"Partial\", \"Overdue\", or \"At Risk\"", "rationale": "Screen 1 business rules (prd.md line 345)."}}
  - {"op": "add_node", "id": "REQ-017-051", "type": "Rule", "owner_fr": "FR-017", "title": "Overdue aging buckets from Due Date", "attrs": {"statement": "Overdue aging buckets calculated from the invoice Due Date to today: 0–30 days, 31–60 days, 60+ days; \"At Risk\" (all retries exhausted) shown as a separate row regardless of age", "rationale": "Screen 1 business rules (prd.md line 346)."}}
  - {"op": "add_node", "id": "REQ-017-052", "type": "Rule", "owner_fr": "FR-017", "title": "Pending Provider Payouts are unpaid Completed or Aftercare treatments", "attrs": {"statement": "\"Pending Provider Payouts\" includes treatments with status \"Completed\" or \"Aftercare\" not yet paid", "rationale": "Screen 1 business rules (prd.md line 347)."}}
  - {"op": "add_node", "id": "REQ-017-053", "type": "Rule", "owner_fr": "FR-017", "title": "Failed Payout Count covers provider and affiliate payouts", "attrs": {"statement": "\"Failed Payout Count\" includes both provider payouts and affiliate payouts currently awaiting retry or manual resolution", "rationale": "Screen 1 business rules (prd.md line 348)."}}
  - {"op": "add_node", "id": "REQ-017-054", "type": "Rule", "owner_fr": "FR-017", "title": "Revenue by Country uses patient location", "attrs": {"statement": "Revenue by Country based on patient location (not provider location)", "rationale": "Screen 1 business rules (prd.md line 349)."}}
  - {"op": "add_node", "id": "REQ-017-055", "type": "Rule", "owner_fr": "FR-017", "title": "Revenue by Treatment Type excludes refunded bookings", "attrs": {"statement": "Revenue by Treatment Type excludes refunded bookings", "rationale": "Screen 1 business rules (prd.md line 350)."}}
  - {"op": "add_node", "id": "REQ-017-056", "type": "Rule", "owner_fr": "FR-017", "title": "Refund Trend includes full and partial refunds", "attrs": {"statement": "Refund Trend includes full and partial refunds and supports drill-down into Screen 4a", "rationale": "Screen 1 business rules (prd.md line 351)."}}
  - {"op": "add_node", "id": "REQ-017-057", "type": "Rule", "owner_fr": "FR-017", "title": "Top Providers sortable by revenue, count, average value", "attrs": {"statement": "Top Providers table sortable by: revenue, booking count, average booking value", "rationale": "Screen 1 business rules (prd.md line 352)."}}
  - {"op": "add_node", "id": "REQ-017-058", "type": "Rule", "owner_fr": "FR-017", "title": "Dashboard discount usage shows code, uses, discount and ROI", "attrs": {"statement": "Discount Usage table shows: code name, times used, total discount amount, estimated ROI (bookings generated vs. discount cost)", "rationale": "Screen 1 business rules (prd.md line 353)."}}
  - {"op": "add_node", "id": "REQ-017-059", "type": "Rule", "owner_fr": "FR-017", "title": "Conversion Rate is bookings over inquiries", "attrs": {"statement": "(Bookings / Inquiries) × 100. Inquiries count sourced from FR-003 / P-02: Quote Request & Management.", "rationale": "Screen 1 field Conversion Rate (prd.md line 338)."}}
  - {"op": "add_node", "id": "REQ-017-060", "type": "Rule", "owner_fr": "FR-017", "title": "Dashboard filtering, export, comparison and anomaly warnings", "attrs": {"statement": "Charts interactive: clicking segment filters dashboard to that subset (e.g., click \"Turkey\" → filters to Turkey bookings). Provide \"Export Full Report\" button to download PDF/CSV with all dashboard data. Support comparison mode: \"Compare to previous period\" (e.g., last 30 days vs. previous 30 days). Display warning icons for anomalies: sudden revenue drop, high refund rate, unusual currency fluctuations", "rationale": "Screen 1 business rules and notes (prd.md lines 354 and 358-360)."}}
  - {"op": "add_node", "id": "REQ-017-061", "type": "Rule", "owner_fr": "FR-017", "title": "Payout includes all Completed or Aftercare treatments of the period", "attrs": {"statement": "Payout amount MUST include all treatments with status \"Completed\" or \"Aftercare\" completed since the last payout cycle. Treatments with status \"Scheduled\", \"In Progress\", or \"Cancelled\" are NOT included", "rationale": "Screen 2 business rules (prd.md lines 402-403). Restated by the Screen 3 rule (line 485: ALL treatments with status Completed or Aftercare within the payout period)."}}
  - {"op": "add_node", "id": "REQ-017-062", "type": "Rule", "owner_fr": "FR-017", "title": "No statements for Suspended or Deactivated providers", "attrs": {"statement": "Providers with status \"Suspended\" or \"Deactivated\" do NOT have statements generated", "rationale": "Screen 2 business rules (prd.md line 404). Restated by the provider-suspension edge case (line 1738)."}}
  - {"op": "add_node", "id": "REQ-017-063", "type": "Rule", "owner_fr": "FR-017", "title": "Commission comes from the booking-confirmation snapshot", "attrs": {"statement": "Commission shown in this list comes from the commission snapshot captured at booking confirmation (FR-006): provider-specific commission configuration managed in FR-015 / A-02 or FR-029 / A-09 when defined, otherwise the FR-029 / A-09 global default; supported models are Percentage and Flat Rate where applicable", "rationale": "Screen 2 business rules (prd.md line 405). Restated by the Screen 3 rule (line 490: the model, value and Flat Rate currency are fixed at booking confirmation from the effective configuration at that moment; nothing is fixed at quote creation) and Admin Editability (line 1206)."}}
  - {"op": "add_node", "id": "REQ-017-064", "type": "Rule", "owner_fr": "FR-017", "title": "Missing or invalid bank details block approval", "attrs": {"statement": "Bank account details shown ONLY if provider has a valid bank account on file in FR-032 Billing Settings. Statements with missing or invalid bank details remain visible in the list for operational follow-up, but Payout Readiness is not \"Ready\" and approval controls remain disabled until the provider updates payout details in FR-032 / PR-06", "rationale": "Screen 2 business rules (prd.md lines 406-407)."}}
  - {"op": "add_node", "id": "REQ-017-065", "type": "Rule", "owner_fr": "FR-017", "title": "When Approve Payout is enabled", "attrs": {"statement": "\"Approve Payout\" button enabled ONLY for statements with status \"Pending Approval\" or \"Overdue\". \"Approve Payout\" is enabled ONLY when Payout Readiness = \"Ready\", the user role is Billing Admin or Super Admin, and financial re-authentication succeeds", "rationale": "Screen 2 business rules (prd.md line 408) and Screen 3 business rules (line 495)."}}
  - {"op": "add_node", "id": "REQ-017-066", "type": "Rule", "owner_fr": "FR-017", "title": "Retry Payout only for Failed statements", "attrs": {"statement": "\"Retry Payout\" button enabled ONLY for statements with status \"Failed\"; clicking it re-initiates the Stripe transfer for that statement; retry is logged in audit trail with admin ID, timestamp, and failure reason from prior attempt", "rationale": "Screen 2 business rules (prd.md line 409). Retry Payout Confirmation Modal (lines 525-534): shows prior failure reason, current payout readiness and destination last 4 digits; confirm re-initiates the transfer after successful re-authentication."}}
  - {"op": "add_node", "id": "REQ-017-067", "type": "Rule", "owner_fr": "FR-017", "title": "Unapprove only before payout day, with reason", "attrs": {"statement": "\"Unapprove\" button enabled ONLY for statements with status \"Approved\" and ONLY before the payout-day cron runs (i.e., the payout date has not yet been reached); on click, admin must enter a mandatory reason (max 500 chars); statement reverts to \"Pending Approval\"; action logged in audit trail with action_type \"Payout Unapproved\"", "rationale": "Screen 2 business rules (prd.md line 410)."}}
  - {"op": "add_node", "id": "REQ-017-068", "type": "Rule", "owner_fr": "FR-017", "title": "Void a Pending Approval or Overdue statement with reason", "attrs": {"statement": "\"Void Statement\" button enabled ONLY for statements with status \"Pending Approval\" or \"Overdue\"; on click, admin must enter a mandatory reason (max 500 chars); statement is marked \"Voided\" and permanently removed from auto-processing; action logged with action_type \"Payout Voided\"; a new statement can be re-generated on the next payout cycle; voided statements remain visible in list with \"Voided\" status badge for audit history", "rationale": "Screen 2 business rules (prd.md line 411)."}}
  - {"op": "add_node", "id": "REQ-017-069", "type": "Rule", "owner_fr": "FR-017", "title": "Admin-only internal notes on payouts at any status", "attrs": {"statement": "\"Add Note\" button available for all statements at any status (for audit documentation). Internal notes visible ONLY to admins (never exposed to provider)", "rationale": "Screen 2 business rules (prd.md line 412) and Screen 3 business rules (line 494). Restated by Main Flow step 8a (line 155: max 500 characters, attached to the payout record) and Admin Editability (line 1212: internal notes on payouts and invoices, admin-only visibility)."}}
  - {"op": "add_node", "id": "REQ-017-070", "type": "Rule", "owner_fr": "FR-017", "title": "Batch approval only for Ready Pending Approval or Overdue statements", "attrs": {"statement": "Batch selection is allowed ONLY for statements with Status = \"Pending Approval\" or \"Overdue\" and Payout Readiness = \"Ready\". Clicking \"Approve All Selected Payouts\" opens a batch confirmation modal showing selected count, total net payout amount, and a financial re-authentication challenge; confirm remains disabled until re-authentication succeeds", "rationale": "Screen 2 business rules (prd.md lines 413-414). Restated by Alternative Flow A1 steps 1-6 (lines 193-198: Select All selects Pending Approval statements of the current cycle; admin may exclude some) and the Batch Approval Confirmation Modal (lines 502-513)."}}
  - {"op": "add_node", "id": "REQ-017-071", "type": "Rule", "owner_fr": "FR-017", "title": "Batch approval is sequential and ends with a result summary", "attrs": {"statement": "System marks each selected statement as Approved sequentially; displays live progress: \"Approving X of Y statements...\". After batch approval, the UI MUST show a batch result summary with: total selected, total approved, total failed, and error details per failed statement. Failed statements remain in \"Pending Approval\" for individual retry", "rationale": "Alternative Flow A1 steps 7-11 (prd.md lines 199-206), Screen 2 business rules (line 415) and the Batch Approval Confirmation Modal Result Summary (line 513)."}}
  - {"op": "add_node", "id": "REQ-017-072", "type": "Rule", "owner_fr": "FR-017", "title": "Overdue and Failed sections at the top of the payout list", "attrs": {"statement": "Statements with status \"Overdue\" are surfaced at the top of the list in a dedicated \"Overdue\" section. Statements with status \"Failed\" are surfaced in a dedicated \"Failed\" section below \"Overdue\", above \"Upcoming / Pending Approval\"", "rationale": "Screen 2 business rules (prd.md lines 416-417) and notes (line 419). Restated by Main Flow step 13b (line 163)."}}
  - {"op": "add_node", "id": "REQ-017-073", "type": "Rule", "owner_fr": "FR-017", "title": "Payout list filtering, sorting and CSV export", "attrs": {"statement": "List should support filtering by: status, payment schedule, date range, provider name/ID. List should support sorting by: payout date, net payout amount (ascending/descending). Export to CSV functionality for batch processing and accounting reconciliation", "rationale": "Screen 2 notes (prd.md lines 420-423)."}}
  - {"op": "add_node", "id": "REQ-017-074", "type": "Rule", "owner_fr": "FR-017", "title": "Payout period by provider schedule", "attrs": {"statement": "Payout period determined by provider's payment schedule (read from FR-015 / A-02): Weekly: Monday to Sunday of the preceding week. 2x a Month: Either 1st–15th or 16th–last day of the preceding month period. Monthly: Full preceding calendar month", "rationale": "Screen 3 business rules (prd.md lines 486-489)."}}
  - {"op": "add_node", "id": "REQ-017-075", "type": "Rule", "owner_fr": "FR-017", "title": "Refund after payout deducted on the next statement and carried forward", "attrs": {"statement": "If a patient refund is processed AFTER the provider has already been paid, the next provider payout statement MUST include a row in `Payout Adjustments` labelled `Adjustment: Refund deducted — [Booking Reference] — [Date]`. If a refund deduction exceeds the provider's current payout amount, the unapplied balance remains visible in `Remaining Balance` and carries forward to the next payout cycle until fully recovered", "rationale": "Screen 3 business rules (prd.md lines 492-493). Restated by the refund-after-payout edge case (lines 1729-1736: no immediate clawback; the commission-adjusted amount is deducted from the next cycle; never silently absorbed by Hairline; the audit trail records the refund event, deduction amount, affected payout statement ID and admin ID)."}}
  - {"op": "add_node", "id": "REQ-017-076", "type": "Rule", "owner_fr": "FR-017", "title": "Approve queues the statement; no transfer during the buffer", "attrs": {"statement": "\"Approve Payout\" button marks the statement as \"Approved\" and queues it for the payout-day cron; Stripe transfer is not initiated during the buffer review action", "rationale": "Screen 3 business rules (prd.md line 496). Billing Rule 5 (line 1239) initiates the transfer immediately when an Overdue statement is approved; see the product owner question on approval timing."}}
  - {"op": "add_node", "id": "REQ-017-077", "type": "Rule", "owner_fr": "FR-017", "title": "Transfer ID and failure reason stay blank until set", "attrs": {"statement": "Stripe Transfer ID remains blank until Stripe confirms `transfer.created`; failure reason remains blank unless Stripe or validation returns a blocking error", "rationale": "Screen 3 business rules (prd.md line 498)."}}
  - {"op": "add_node", "id": "REQ-017-078", "type": "Rule", "owner_fr": "FR-017", "title": "Approve confirmation shows amount and destination", "attrs": {"statement": "\"Approve payout of [Net Payout amount] to [Provider Name]?\" Destination: \"Bank account ending in [last 4 digits]\". Confirm button \"Yes, Approve\" — marks statement \"Approved\". Enabled ONLY after successful re-authentication", "rationale": "Approve Confirmation Modal (prd.md lines 515-523). Restated by Main Flow step 9 (line 157)."}}
  - {"op": "add_node", "id": "REQ-017-079", "type": "Rule", "owner_fr": "FR-017", "title": "Payout detail links bookings and exports a report", "attrs": {"statement": "Clicking on \"Booking Reference\" opens booking detail view in A-01: Patient Management & Oversight. Provide \"Download Detailed Report\" button to export payout breakdown as PDF for provider records. Highlight any bookings with special conditions (refunds, partial payments) with warning icon", "rationale": "Screen 3 notes (prd.md lines 538-540)."}}
  - {"op": "add_node", "id": "REQ-017-080", "type": "Rule", "owner_fr": "FR-017", "title": "Manual reminder type follows invoice status", "attrs": {"statement": "Reminder Type: Auto-selected based on invoice status: \"Upcoming Due Reminder\" (Pending), \"Overdue Reminder\" (Overdue), \"At Risk — Final Notice\" (At Risk). Display-only; not editable by admin. Channel: \"Via: Email + Push Notification\"", "rationale": "Send Reminder Confirmation Modal (prd.md lines 568-580). The Screen 4a Reminder History lists different type values; see the product owner question."}}
  - {"op": "add_node", "id": "REQ-017-081", "type": "Rule", "owner_fr": "FR-017", "title": "Manual reminder content from FR-020; history updated; automated schedule untouched", "attrs": {"statement": "Reminder content and template are determined by FR-020 / S-03 based on the reminder type; admin cannot customize the message text. On confirm: FR-020 notification event is triggered; Reminder History table on Screen 4a is updated with: type, channel, sent timestamp, delivery status. Admin sees a success toast: \"Reminder sent to [Patient Name]\" (or an error toast if FR-020 returns a failure). Sending a manual reminder does NOT reset or interfere with any automated reminder schedule", "rationale": "Send Reminder business rules (prd.md lines 581-584)."}}
  - {"op": "add_node", "id": "REQ-017-082", "type": "Rule", "owner_fr": "FR-017", "title": "Installment invoices show installments paid", "attrs": {"statement": "Invoices with installment plans display: \"X of Y installments paid\"", "rationale": "Screen 4 business rules (prd.md line 590)."}}
  - {"op": "add_node", "id": "REQ-017-083", "type": "Rule", "owner_fr": "FR-017", "title": "Invoice Overdue 7 days after due date", "attrs": {"statement": "\"Overdue\" status triggered if outstanding balance remains 7 days after due date", "rationale": "Screen 4 business rules (prd.md line 591)."}}
  - {"op": "add_node", "id": "REQ-017-084", "type": "Rule", "owner_fr": "FR-017", "title": "Invoice At Risk when all installment retries fail", "attrs": {"statement": "\"At Risk\" status triggered when all 3 retry attempts for any installment have failed; booking is flagged for admin review. Admin MUST manually follow up with patient (contact via support, update payment method, or cancel booking)", "rationale": "Screen 4 business rules (prd.md line 592). Restated by Payment Rule 3 (line 1234) and the Screen 4a At Risk banner rule (line 708)."}}
  - {"op": "add_node", "id": "REQ-017-085", "type": "Rule", "owner_fr": "FR-017", "title": "Send Reminder only for Pending, Overdue or At Risk", "attrs": {"statement": "\"Send Reminder\" button available ONLY for invoices with status \"Pending\", \"Overdue\", or \"At Risk\"", "rationale": "Screen 4 business rules (prd.md line 593)."}}
  - {"op": "add_node", "id": "REQ-017-086", "type": "Rule", "owner_fr": "FR-017", "title": "Process Refund only for Paid or Partial invoices", "attrs": {"statement": "\"Process Refund\" button available ONLY for invoices with status \"Paid\" or \"Partial\"", "rationale": "Screen 4 business rules (prd.md line 594)."}}
  - {"op": "add_node", "id": "REQ-017-087", "type": "Rule", "owner_fr": "FR-017", "title": "Invoice PDF with Hairline branding", "attrs": {"statement": "Clicking \"Download Invoice\" generates PDF with Hairline branding, itemized breakdown, and payment instructions", "rationale": "Screen 4 business rules (prd.md line 596). Fixed in Codebase (line 1220): invoice PDF template structure, branding and layout, is fixed."}}
  - {"op": "add_node", "id": "REQ-017-088", "type": "Rule", "owner_fr": "FR-017", "title": "Manual payment status override with reason and audit", "attrs": {"statement": "Admin can manually override a payment status when the Stripe webhook fails, is delayed, or when an off-system payment adjustment is needed. \"Override Status\" button available for ANY invoice (all statuses). On click: admin selects new status from dropdown (\"Pending\", \"Partial\", \"Paid\", \"Overdue\", \"Refunded\", \"At Risk\"), enters mandatory reason (free text, max 500 characters), and confirms. Override is logged to audit trail with: admin ID, timestamp, previous status, new status, reason entered. Overridden invoices display a warning badge: \"Status manually adjusted — [date]\" visible to admins only", "rationale": "Screen 4 business rules (prd.md lines 598-602). Restated by Admin Editability (line 1211)."}}
  - {"op": "add_node", "id": "REQ-017-089", "type": "Rule", "owner_fr": "FR-017", "title": "Override moves no money and needs re-authentication", "attrs": {"statement": "Override does NOT automatically trigger Stripe refund or charge — admin is responsible for ensuring any off-system action is completed separately. \"Override Status\" REQUIRES financial re-authentication (password re-entry in MVP; MFA challenge after FR-026 / FR-031) before the Confirm button is enabled", "rationale": "Screen 4 business rules (prd.md lines 603-604)."}}
  - {"op": "add_node", "id": "REQ-017-090", "type": "Rule", "owner_fr": "FR-017", "title": "At Risk and flagged invoices surface at the top", "attrs": {"statement": "Invoices with a Reconciliation Flag are surfaced in a dedicated exceptions section alongside \"At Risk\" until resolved. \"At Risk\" invoices surfaced at top of list in a dedicated section, similar to Overdue pattern in Screen 2. Display warning icon for installments with upcoming payment dates (within 7 days)", "rationale": "Screen 4 notes (prd.md lines 609, 611, 612)."}}
  - {"op": "add_node", "id": "REQ-017-091", "type": "Rule", "owner_fr": "FR-017", "title": "Invoice filtering and bulk actions", "attrs": {"statement": "Implement advanced filtering: date range, payment status, currency, installment vs. full payment, patient name/ID, and Reconciliation Flag (\"Captured after provider cancellation\"). Support bulk actions: \"Send reminders to all overdue invoices\", \"Export selected invoices to CSV\"", "rationale": "Screen 4 notes (prd.md lines 608 and 610)."}}
  - {"op": "add_node", "id": "REQ-017-092", "type": "Rule", "owner_fr": "FR-017", "title": "Invoice detail read-only with conditional tables", "attrs": {"statement": "All data on this screen is read-only except via action buttons. Installment Schedule Table visible ONLY if `installment_plan_id` is set on the invoice. Refund History Table visible ONLY if at least one refund exists for this invoice. Reminder History Table visible ONLY if at least one automated or manual reminder event exists for this invoice. Status Override History Table visible ONLY if at least one manual override has been applied. Discount Code Applied: if no discount was used, display \"None — no discount applied\"", "rationale": "Screen 4a business rules (prd.md lines 702 and 704-707, 709)."}}
  - {"op": "add_node", "id": "REQ-017-093", "type": "Rule", "owner_fr": "FR-017", "title": "At Risk invoices show a warning banner", "attrs": {"statement": "\"At Risk\" invoices display a prominent warning banner at the top of the detail view: \"All payment retries have been exhausted. Please contact the patient to resolve.\"", "rationale": "Screen 4a business rules (prd.md line 708)."}}
  - {"op": "add_node", "id": "REQ-017-094", "type": "Rule", "owner_fr": "FR-017", "title": "Refund amount auto-calculated from the cancellation policy", "attrs": {"statement": "Modal auto-calculates refund amount using cancellation policy from FR-006 based on days until treatment at time admin opens the modal. Adjusted Refund Amount defaults to Calculated Refund Amount. Non-Refundable Amount: invoice amount − Final Refund Amount. Labelled \"Platform fee (non-refundable)\"", "rationale": "Screen 4b business rules (prd.md lines 739-740) and field Non-Refundable Amount (line 731). Field Cancellation Policy Applied (line 726) lists the tiers of Rule 7."}}
  - {"op": "add_node", "id": "REQ-017-095", "type": "Rule", "owner_fr": "FR-017", "title": "Adjusted refund needs a justification", "attrs": {"statement": "Adjusted Refund Amount can be changed ONLY for eligible partial or discretionary pre-treatment refunds; if changed, Adjustment Justification becomes mandatory. Partial refunds (e.g., cancelling add-on packages only) use the same modal; the pre-calculated amount can be manually adjusted by admin with mandatory justification in the Adjustment Justification field", "rationale": "Screen 4b business rules (prd.md lines 741 and 745) and field Adjustment Justification (line 733: max 500 characters)."}}
  - {"op": "add_node", "id": "REQ-017-096", "type": "Rule", "owner_fr": "FR-017", "title": "Refund confirm gating, Stripe refund and audit", "attrs": {"statement": "\"Confirm Refund\" button is disabled until the Reason field contains at least 1 character, any required Adjustment Justification is provided, and re-authentication succeeds. On confirm: Stripe refund API call is initiated; status changes to \"Processing\"; audit trail entry created with: admin ID, timestamp, invoice ID, refund amount, reason, before/after payment status", "rationale": "Screen 4b business rules (prd.md lines 742-743)."}}
  - {"op": "add_node", "id": "REQ-017-097", "type": "Rule", "owner_fr": "FR-017", "title": "No refund through the modal once treatment has passed", "attrs": {"statement": "If treatment date has already passed (treatment completed), the <15 days tier applies (0% refund) — admin sees \"0% refund — treatment has been completed\" and the Confirm button is disabled; admin must use Override Status instead if a discretionary refund is needed", "rationale": "Screen 4b business rules (prd.md line 744)."}}
  - {"op": "add_node", "id": "REQ-017-098", "type": "Rule", "owner_fr": "FR-017", "title": "Discount usage screen is read-only and derived", "attrs": {"statement": "This screen is read-only; all discount management actions route to FR-019 / A-06. Data here is derived from booking and invoice records; no source-of-truth discount records are stored in A-05", "rationale": "Screen 5 business rules (prd.md lines 771-772). Screen 5 notes (line 778): used primarily for financial reconciliation."}}
  - {"op": "add_node", "id": "REQ-017-099", "type": "Rule", "owner_fr": "FR-017", "title": "Hairline Cost and Provider Cost split", "attrs": {"statement": "\"Hairline Cost\" and \"Provider Cost\" splits reflect the commission effect plus, for Both Fees discounts only, the Hairline share % that FR-019 defines on the program (fixed at send and frozen at acceptance). FR-019 owns that definition; FR-017 applies it in payout settlement and defines no split of its own. Because commission is calculated on the price after promotion for every discount type, Provider Cost is non-zero for Hairline Only discounts as well as Both Fees discounts. Payout mechanics for the reimbursement belong to the payment work", "rationale": "Screen 5 business rules (prd.md line 775) and field Hairline Cost (line 765)."}}
  - {"op": "add_node", "id": "REQ-017-100", "type": "Rule", "owner_fr": "FR-017", "title": "Discount usage deep link, filters, search and export", "attrs": {"statement": "\"View in A-06\" deep-link on each row opens the discount's management page in FR-019. Implement filtering by: Status (Active / Expired / Disabled), Discount Type (Platform-Wide / Provider-Specific / Affiliate), and Active Window date range (codes valid within a given period). Support free-text search by discount code or campaign name. Export to CSV button for finance reconciliation (includes all visible columns for the filtered result set)", "rationale": "Screen 5 notes (prd.md lines 777-783)."}}
  - {"op": "add_node", "id": "REQ-017-101", "type": "Rule", "owner_fr": "FR-017", "title": "Affiliate payouts monthly on the 7th", "attrs": {"statement": "Affiliate payouts processed MONTHLY (default: 7th of each month for previous month's earnings). Payouts with status \"Pending\" become eligible for processing on scheduled payout date", "rationale": "Screen 6 business rules (prd.md lines 820 and 823). Restated by User Behavior Assumption 4 (line 1401)."}}
  - {"op": "add_node", "id": "REQ-017-102", "type": "Rule", "owner_fr": "FR-017", "title": "Affiliate commission amounts come from FR-018", "attrs": {"statement": "Commission amounts displayed here are calculated by FR-018 (A-07: Affiliate Program Management) — A-05 reads these values for affiliate billing and payout execution; it does not recalculate them. Commission rate and referral attribution are managed in FR-018; any disputes on commission amounts must be resolved in FR-018 before admin processes payout here", "rationale": "Screen 6 business rules (prd.md lines 821-822). Restated by the affiliate-plus-provider-code edge case (line 1727: FR-017 processes affiliate payout execution using the FR-018 commission output for the preserved affiliate attribution)."}}
  - {"op": "add_node", "id": "REQ-017-103", "type": "Rule", "owner_fr": "FR-017", "title": "When Process Payout and Retry Payout are enabled for affiliates", "attrs": {"statement": "\"Process Payout\" button enabled ONLY for payouts with status \"Pending\", past due date, Payout Readiness = \"Ready\", and successful financial re-authentication. \"Retry Payout\" button enabled ONLY for payouts with status \"Failed\", Payout Readiness = \"Ready\", and successful financial re-authentication", "rationale": "Screen 6 business rules (prd.md lines 824-825). Process and Retry Payout Confirmation Modals (lines 858-880)."}}
  - {"op": "add_node", "id": "REQ-017-104", "type": "Rule", "owner_fr": "FR-017", "title": "Admin-only notes on affiliate payouts", "attrs": {"statement": "\"Add Note\" button available for all affiliate payouts at any status (admin-only internal notes, max 500 characters, not visible to affiliate); note saved and logged in audit trail with action_type \"Note Added\"", "rationale": "Screen 6 business rules (prd.md line 826)."}}
  - {"op": "add_node", "id": "REQ-017-105", "type": "Rule", "owner_fr": "FR-017", "title": "Affiliates view their earnings in FR-018", "attrs": {"statement": "Affiliates track their own earnings via the Affiliate Platform (read-only dashboard, managed in FR-018)", "rationale": "Screen 6 business rules (prd.md line 827). Restated by the Screen Specifications tenant scope (line 299: no affiliate-facing screens in this FR)."}}
  - {"op": "add_node", "id": "REQ-017-106", "type": "Rule", "owner_fr": "FR-017", "title": "Bulk affiliate payouts: selection and sequential processing", "attrs": {"statement": "Batch selection is allowed ONLY for affiliate payouts with Status = \"Pending\", past due date, and Payout Readiness = \"Ready\". Processing is sequential; failures for individual affiliates do not block processing of others. After batch completes, failed rows are pinned in the Failed / Requires Retry section for individual follow-up", "rationale": "Bulk affiliate payout business rules (prd.md lines 852-854). Bulk Payout Toolbar and Confirmation Modal (lines 829-850): confirm initiates Stripe transfers sequentially, status Processing for each, enabled only after re-authentication; result summary \"X payouts initiated. Y failed.\""}}
  - {"op": "add_node", "id": "REQ-017-107", "type": "Rule", "owner_fr": "FR-017", "title": "Affiliate payouts split into Pending and Paid tabs", "attrs": {"statement": "Two-tab layout required: Screen 6 MUST display affiliates in two separate tabs: \"Pending Payouts\" (status: Pending plus Failed rows pinned in a dedicated Failed / Requires Retry section) and \"Paid Payouts\" (status: Processing or Paid). Default view opens on \"Pending Payouts\".", "rationale": "Screen 6 notes (prd.md line 895), a client request quoted in the PRD from a transcription that is not in the source register."}}
  - {"op": "add_node", "id": "REQ-017-108", "type": "Rule", "owner_fr": "FR-017", "title": "Affiliate payout details, report, bulk by date and filters", "attrs": {"statement": "Clicking \"View Details\" opens the Referral Booking Sub-Table above. \"Download Report\" generates PDF summary for affiliate records (includes per-booking breakdown). Support bulk payout processing for all affiliates due on the same date. Support filtering by payout month/period and affiliate name/ID within each tab", "rationale": "Screen 6 notes (prd.md lines 896-899)."}}
  - {"op": "add_node", "id": "REQ-017-109", "type": "Rule", "owner_fr": "FR-017", "title": "Transaction search trigger, scope, order and empty state", "attrs": {"statement": "Search triggers on minimum 3 characters or on pressing Enter/clicking Search. Booking Reference search returns ALL financial records linked to that booking (invoice, installments, any refunds, payout inclusion). Results sorted by date descending by default. Clicking any row opens the relevant detail screen (Screen 3 for provider payouts, Screen 4a for invoices, etc.). If no results found: display \"No financial records found for '[search term]'. Check the reference and try again.\"", "rationale": "Screen 7 Tab 1 business rules (prd.md lines 962-965 and 968)."}}
  - {"op": "add_node", "id": "REQ-017-110", "type": "Rule", "owner_fr": "FR-017", "title": "Add to Next Payout only for unpaid, now-eligible bookings", "attrs": {"statement": "\"Add to Next Payout\" is available ONLY when the booking was not already paid, is now eligible for payout, and the admin has provided an Internal Note and target payout cycle", "rationale": "Screen 7 Tab 1 business rules (prd.md line 966). Dispute Panel Target Payout Cycle accepts a Pending Approval or future cycle only."}}
  - {"op": "add_node", "id": "REQ-017-111", "type": "Rule", "owner_fr": "FR-017", "title": "Saving a dispute resolution audits it and notifies the provider", "attrs": {"statement": "Saving a dispute resolution writes an audit log entry; when Resolution Action = \"Add to Next Payout\", provider notification is mandatory and sent automatically. For other resolution actions, notification is sent only when selected", "rationale": "Screen 7 Tab 1 business rules (prd.md line 967)."}}
  - {"op": "add_node", "id": "REQ-017-112", "type": "Rule", "owner_fr": "FR-017", "title": "Audit log is read-only, retained 7 years, exportable", "attrs": {"statement": "Audit log is read-only; no editing or deletion of log entries is permitted. All 7-year retention (compliance requirement) is enforced at storage level; UI displays entries for the full retention period. Export to CSV button available for compliance reporting. Log entries link back to the affected entity's detail screen", "rationale": "Screen 7 Tab 2 business rules (prd.md lines 1001-1004)."}}
  - {"op": "add_node", "id": "REQ-017-113", "type": "Rule", "owner_fr": "FR-017", "title": "Currency alert lists bookings paying out within 14 days", "attrs": {"statement": "Affected bookings table shows ONLY bookings with a payout date within the next 14 days (i.e., at risk of being affected by the current rate movement)", "rationale": "Screen 8 business rules (prd.md line 1051)."}}
  - {"op": "add_node", "id": "REQ-017-114", "type": "Rule", "owner_fr": "FR-017", "title": "Currency alert decision with mandatory notes", "attrs": {"statement": "Decision: Radio: \"Accept risk — proceed with payouts at locked rates\" / \"Contact providers (any agreed change is a separate finance adjustment)\" / \"Adjust commission configuration (FR-015 single-provider / FR-029 global-or-bulk)\". Notes: mandatory if any decision is selected. Max 500 chars. Documents rationale. Decision and notes logged in Transaction Audit Log (Entity 5) with action_type = \"Currency Alert Decision\". Alert dismissed from notification dropdown once admin confirms a decision; re-surfaces if the rate continues to diverge and a new alert fires", "rationale": "Screen 8 Admin Decision Panel (prd.md lines 1043-1047) and business rules (lines 1054-1055). Restated by Alternative Flow B2 steps 6-8."}}
  - {"op": "add_node", "id": "REQ-017-115", "type": "Rule", "owner_fr": "FR-017", "title": "Adjust commission routes to FR-015 or FR-029", "attrs": {"statement": "\"Adjust commission configuration (FR-015 single-provider / FR-029 global-or-bulk)\" routes admin to the appropriate management surface: FR-015 / A-02 for single-provider profile edits, or FR-029 / A-09 for the central global / provider-scope commission settings screen. This screen does not initiate the edit directly. Commission configuration changes never alter bookings already confirmed, whose commission was fixed at booking confirmation", "rationale": "Screen 8 business rules (prd.md line 1052). Restated by Alternative Flow B2 step 7c (line 264)."}}
  - {"op": "add_node", "id": "REQ-017-116", "type": "Rule", "owner_fr": "FR-017", "title": "No currency alert decision changes the snapshot or locked rate", "attrs": {"statement": "No decision changes the accepted snapshot, the AcceptanceEvent, or a locked rate", "rationale": "Screen 8 business rules (prd.md line 1053). Restated by Alternative Flow B2 step 7b (line 263)."}}
  - {"op": "add_node", "id": "REQ-017-117", "type": "Rule", "owner_fr": "FR-017", "title": "Earnings tracker lists Completed or Aftercare treatments in real time", "attrs": {"statement": "Only treatments with status \"Completed\" or \"Aftercare\" appear in this list. Each row is directly linked to its treatment case via Booking Reference (→ FR-001 booking record / A-01 Patient Management). Earnings update in real time as treatment status changes. Treatments are never removed from this list; older entries remain visible for historical reference", "rationale": "Screen 9 business rules (prd.md lines 1096-1098 and 1105)."}}
  - {"op": "add_node", "id": "REQ-017-118", "type": "Rule", "owner_fr": "FR-017", "title": "Earnings payout status follows the transfer", "attrs": {"statement": "Once admin approves and Stripe transfer is initiated, affected treatments update to Payout Status \"Included in Payout — [Date]\". If the Stripe transfer fails (`transfer.failed` webhook), affected treatments update to Payout Status \"Payout Failed — [Date]\" and display a warning icon. They revert to \"Pending Next Payout\" once the admin retries and the transfer succeeds", "rationale": "Screen 9 business rules (prd.md lines 1100-1101). The revert-to-Pending wording after a successful retry is raised as a product owner question."}}
  - {"op": "add_node", "id": "REQ-017-119", "type": "Rule", "owner_fr": "FR-017", "title": "Refund before payout zeroes the earning", "attrs": {"statement": "If a patient refund is processed on a booking that had not yet been paid out, the treatment row is updated to show Net Earning as £0.00 with a \"Refunded\" label and a strikethrough on the original amount. The treatment is excluded from the Total Pending Earnings calculation. If the refund is partial (e.g., only add-on packages refunded), Net Earning is recalculated based on the adjusted booking amount", "rationale": "Screen 9 business rules (prd.md line 1102)."}}
  - {"op": "add_node", "id": "REQ-017-120", "type": "Rule", "owner_fr": "FR-017", "title": "Refund after payout shows a negative deduction", "attrs": {"statement": "If a patient refund is processed AFTER the provider has already been paid, the original treatment row remains visible with Adjustment Marker \"Refunded — Deducted from Next Payout\" and Net Earning showing the negative deduction amount clearly; if the deduction spans multiple cycles, the tooltip explains the remaining carry-forward balance. Adjustment Marker opens a provider-friendly explanation tooltip (e.g., \"Adjusted due to partial refund on 12-04-2026\"); no internal admin notes are exposed", "rationale": "Screen 9 business rules (prd.md lines 1103-1104). Restated by the refund-after-payout edge case (line 1733)."}}
  - {"op": "add_node", "id": "REQ-017-121", "type": "Rule", "owner_fr": "FR-017", "title": "Earnings tracker filters, sorts and CSV export", "attrs": {"statement": "Support filtering by: treatment status, payout status, date range. Support sorting by: treatment date, net earning (ascending/descending). \"Export\" button to download earnings history as CSV", "rationale": "Screen 9 notes (prd.md lines 1109-1111)."}}
  - {"op": "add_node", "id": "REQ-017-122", "type": "Rule", "owner_fr": "FR-017", "title": "Payout history filters, sorts and CSV export", "attrs": {"statement": "Support filtering by: status, date range. Support sorting by: payout date, net payout amount (ascending/descending). \"Export History\" button to download full payout history as CSV", "rationale": "Screen 10 notes (prd.md lines 1164-1166)."}}
  - {"op": "add_node", "id": "REQ-017-123", "type": "Rule", "owner_fr": "FR-017", "title": "Payout history entries appear at Processing and stay", "attrs": {"statement": "Payout entries appear in this list as soon as the Stripe transfer is initiated (status: \"Processing\"); they remain visible through \"Paid\" and \"Failed\" states. Each payout entry links to all treatment cases included in that payout period (Booking Reference → FR-001 / A-01). Retry Resolution History remains visible even after a failed payout later resolves to \"Paid\", so providers can understand why timing changed. Provider has read-only access to all data on this screen; no approval or editing actions are available", "rationale": "Screen 10 business rules (prd.md lines 1154, 1156, 1158, 1159)."}}
  - {"op": "add_node", "id": "REQ-017-124", "type": "Rule", "owner_fr": "FR-017", "title": "Failed payout message to the provider", "attrs": {"statement": "\"Failed\" entries appear with a warning icon and a message: \"Your payout of [amount] for [period] could not be processed. Hairline is investigating. You will be notified once resolved.\"", "rationale": "Screen 10 business rules (prd.md line 1155)."}}
  - {"op": "add_node", "id": "REQ-017-125", "type": "Rule", "owner_fr": "FR-017", "title": "Provider invoice PDF only after transfer.paid", "attrs": {"statement": "Invoice PDF is generated only after Stripe `transfer.paid` confirmation; the Download button is disabled during \"Processing\" status", "rationale": "Screen 10 business rules (prd.md line 1157). Restated by Main Flow step 17 (line 172), Entry Points (line 134: providers download invoice PDFs after the Stripe transfer is complete) and Billing Rule 2 second sentence (line 1236)."}}
  - {"op": "add_node", "id": "REQ-017-126", "type": "Rule", "owner_fr": "FR-017", "title": "Payout history in the provider payout currency at the locked rate", "attrs": {"statement": "All amounts displayed in the provider's configured payout currency; exchange rate used is the rate locked at subquote acceptance (FR-005 AcceptanceEvent)", "rationale": "Screen 10 business rules (prd.md line 1160)."}}
  - {"op": "add_node", "id": "REQ-017-127", "type": "Rule", "owner_fr": "FR-017", "title": "All financial transactions logged with affected parties", "attrs": {"statement": "All financial transactions MUST be logged with timestamp, admin user ID, transaction amount, and affected parties (patient/provider/affiliate)", "rationale": "General Module Rule 1 (prd.md line 1172)."}}
  - {"op": "add_node", "id": "REQ-017-128", "type": "Rule", "owner_fr": "FR-017", "title": "Every payment record traces to its booking and acceptance", "attrs": {"statement": "Every payment record (patient invoice, provider payout, affiliate commission) MUST maintain a traceable link to the treatment case(s) that generated it via Booking Reference and, through FR-006, the accepted subquote/parent IDs, equal accepted aggregate versions, and AcceptanceEvent snapshot. Patient invoices link 1:1 to a booking; payout/commission periods aggregate their existing booking-linked records, never unaccepted quote alternatives. This provenance supports audit, dispute resolution, and commission verification without duplicating the quote aggregate in billing.", "rationale": "General Module Rule 2 (prd.md line 1173). Restated by the Executive Summary (line 18: one patient invoice resolves through its FR-006 Booking to one accepted subquote and immutable AcceptanceEvent; parent quote alternatives are not billable cases or invoice lines) and Key Entity 1 commercial source (line 1805)."}}
  - {"op": "add_node", "id": "REQ-017-129", "type": "Rule", "owner_fr": "FR-017", "title": "All payment processing through Stripe; no card storage", "attrs": {"statement": "All payment processing MUST use Stripe API (PCI-DSS compliant); NO direct credit card storage", "rationale": "General Module Rule 3 (prd.md line 1174). Restated by Security Considerations PCI-DSS (line 1484) and Data Dependencies Entity 5 (line 1390: tokens stored in Stripe, not in the Hairline database)."}}
  - {"op": "add_node", "id": "REQ-017-130", "type": "Rule", "owner_fr": "FR-017", "title": "Rates locked at acceptance; USD base; pairs from FR-029", "attrs": {"statement": "Currency exchange rates are locked at subquote acceptance (FR-005 AcceptanceEvent) and read from the acceptance snapshot; NO rate changes during payout cycle. USD is the base currency — all conversions route through USD (e.g., GBP→USD→TRY; no direct non-USD pair rates). The list of supported currency pairs is dynamic and admin-configurable in FR-029 / A-09: Payment System Configuration. FR-017 supports any currency pair that is enabled in FR-029; it does not restrict or define which pairs are available.", "rationale": "General Module Rule 4 (prd.md line 1175). Restated by Fixed in Codebase (line 1218: exchange API source in environment variables; USD fixed base currency)."}}
  - {"op": "add_node", "id": "REQ-017-131", "type": "Rule", "owner_fr": "FR-017", "title": "Payouts only after Completed or Aftercare", "attrs": {"statement": "Provider payouts processed ONLY after treatment status changes to \"Completed\" or \"Aftercare\"", "rationale": "General Module Rule 5 (prd.md line 1176). Restated by Data Dependencies Entity 2 (line 1377). Meeting sources ask for a patient-confirmation step before release; see the product owner question."}}
  - {"op": "add_node", "id": "REQ-017-132", "type": "Rule", "owner_fr": "FR-017", "title": "Installments complete by the cutoff before treatment", "attrs": {"statement": "Installment payments MUST complete by the cutoff date before scheduled treatment (cutoff days configured in FR-029 / A-09; default: 30 days). See FR-007B: Split Payment / Installment Plans.", "rationale": "General Module Rule 6 (prd.md line 1177). Restated by Admin Editability (line 1207: FR-017 reads this value at runtime to determine installment eligibility)."}}
  - {"op": "add_node", "id": "REQ-017-133", "type": "Rule", "owner_fr": "FR-017", "title": "Refunds follow the graduated cancellation policy", "attrs": {"statement": "Refunds follow graduated cancellation policy (FR-006: Booking & Scheduling): >30 days = 90%, 15-30 days = 50%, <15 days = 0%. Provider-status cancellations follow Rule 13", "rationale": "General Module Rule 7 (prd.md line 1178). Restated by Screen 4b field Cancellation Policy Applied (line 726) and Admin Editability (line 1213: refund initiation and approval subject to cancellation policy). Meeting sources call the ladder illustrative and configurable; see the product owner question."}}
  - {"op": "add_node", "id": "REQ-017-134", "type": "Rule", "owner_fr": "FR-017", "title": "Affiliate commissions on net revenue only", "attrs": {"statement": "Affiliate commissions calculated ONLY on net revenue (after discounts and refunds)", "rationale": "General Module Rule 10 (prd.md line 1181)."}}
  - {"op": "add_node", "id": "REQ-017-135", "type": "Rule", "owner_fr": "FR-017", "title": "Patients see their currency; providers paid in theirs", "attrs": {"statement": "Multi-currency bookings display amounts in patient's selected currency; providers receive payouts in their configured currency", "rationale": "General Module Rule 11 (prd.md line 1182)."}}
  - {"op": "add_node", "id": "REQ-017-136", "type": "Rule", "owner_fr": "FR-017", "title": "Billing reads one accepted subquote's immutable commercial base", "attrs": {"statement": "Billing reads one accepted subquote's immutable commercial base through FR-006, not a parent range, sibling option/date rows, the live quote, or live library/promotion prices. The promotion and price after promotion are frozen at acceptance; billing never adds, removes, replaces, or recalculates a promotion after acceptance. The only exception is the FR-006 provider-fault transfer, which creates a new linked acceptance record that billing reads in place of the superseded one. The FR-019 application record is linked to the AcceptanceEvent; authorized finance interventions remain separate records; attribution, refund, installment, and payout policies are unchanged.", "rationale": "General Module Rule 12 (prd.md line 1183). Restated by Screen 4a business rule (line 703: itemized invoice and PDF content from the acceptance snapshot via FR-006; the FR-019 application record is provenance only and never re-prices the invoice), Data Dependencies Entity 4 (line 1386) and the promotion usage-limit edge case (line 1714)."}}
  - {"op": "add_node", "id": "REQ-017-137", "type": "Rule", "owner_fr": "FR-017", "title": "Provider-status cancellations: no automatic refund; admin resolution", "attrs": {"statement": "Bookings cancelled by an FR-015 provider suspension or deactivation (cause `ProviderSuspended` / `ProviderDeactivated`) are excluded from provider payout calculation like other cancelled bookings. No refund or reversal is issued automatically and the Rule 7 graduated patient-cancellation tiers are not auto-applied. When the suspension or deactivation happens after acceptance, the patient is rehomed by admin through the FR-006 provider-fault transfer; as a placeholder principle, money already paid moves with the patient as credit toward the replacement booking, any unused part is refunded, and the patient pays no cancellation fee. Exact refund, fund-release, and reallocation mechanics are defined in the later payment pass. Captured patient payments on these bookings, including payments captured while the cancellation cascade was running, remain recorded against the booking invoice and are routed to admin financial resolution through the existing refund and adjustment controls (Screen 4b, mandatory reason, audit trail). Provider reactivation does not restore cancelled bookings or their payout eligibility", "rationale": "General Module Rule 13 (prd.md line 1184). Restated by the provider-suspension edge case (lines 1736-1741: a procedure already recorded as completed under FR-010 is not erased by the cancellation)."}}
  - {"op": "add_node", "id": "REQ-017-138", "type": "Rule", "owner_fr": "FR-017", "title": "Provider-status cancellation amounts held from payout until resolved", "attrs": {"statement": "Amounts on bookings cancelled by provider suspension or deactivation, including any procedure already recorded as completed under FR-010 and any Rule 14 late capture, are held from provider payout statements until admin financial resolution is recorded. Release to a payout uses the existing \"Add to Next Payout\" resolution (Screen 7) subject to normal Rule 5 eligibility and Billing Rule 5 approval; payout timing is otherwise unchanged", "rationale": "General Module Rule 16 (prd.md line 1187)."}}
  - {"op": "add_node", "id": "REQ-017-139", "type": "Rule", "owner_fr": "FR-017", "title": "Patient names in financial records only after payment confirmation", "attrs": {"statement": "Patient full names and contact details visible in financial records ONLY after booking payment confirmation", "rationale": "Privacy Rule 1 (prd.md line 1191). Restated by the Screen 3 treatment sub-table Patient Name (shown post-payment)."}}
  - {"op": "add_node", "id": "REQ-017-140", "type": "Rule", "owner_fr": "FR-017", "title": "Transaction logs hold masked payment methods", "attrs": {"statement": "Financial transaction logs MUST include masked payment method (e.g., \"Visa ending in 1234\") NOT full card numbers", "rationale": "Privacy Rule 3 (prd.md line 1193)."}}
  - {"op": "add_node", "id": "REQ-017-141", "type": "Rule", "owner_fr": "FR-017", "title": "Patient deletion anonymizes PII but keeps financial records", "attrs": {"statement": "Patient data deletion requests MUST result in PII anonymization while preserving financial records for audit (replace name with \"Patient #ID\")", "rationale": "GDPR/Compliance (prd.md line 1196)."}}
  - {"op": "add_node", "id": "REQ-017-142", "type": "Rule", "owner_fr": "FR-017", "title": "Overdue statements processed immediately on approval", "attrs": {"statement": "Payout statement approval during buffer/overdue review windows; payout processing is automatic on payout day for approved statements and immediate only when an overdue statement is approved after the normal payout day", "rationale": "Admin Editability, Editable by Admin (prd.md line 1210). Restated by Billing Rule 5 (line 1239) and User Behavior Assumption 1 (line 1398)."}}
  - {"op": "add_node", "id": "REQ-017-143", "type": "Rule", "owner_fr": "FR-017", "title": "Payment retry logic fixed at 3 attempts", "attrs": {"statement": "Payment retry logic (3 attempts with exponential backoff - hardcoded)", "rationale": "Fixed in Codebase (prd.md line 1222). Payment Rule 3 (line 1234: day 1, day 3, day 7) and External Service 1 (line 1358: 1 hour, 6 hours, 24 hours) give different schedules; see the product owner question."}}
  - {"op": "add_node", "id": "REQ-017-144", "type": "Rule", "owner_fr": "FR-017", "title": "Manual payout adjustment only with justification", "attrs": {"statement": "Admin can manually adjust payout amounts ONLY with documented justification (audit trail required)", "rationale": "Configurable with Restrictions (prd.md line 1226)."}}
  - {"op": "add_node", "id": "REQ-017-145", "type": "Rule", "owner_fr": "FR-017", "title": "Admin overrides discount approval only for Hairline Only", "attrs": {"statement": "Admin can override discount approval ONLY for \"Hairline Only\" discounts (cannot force provider participation)", "rationale": "Configurable with Restrictions (prd.md line 1227). The approval workflow itself belongs to FR-019 (General Module Rule 9, line 1180)."}}
  - {"op": "add_node", "id": "REQ-017-146", "type": "Rule", "owner_fr": "FR-017", "title": "Refunds need a reason; no second approver", "attrs": {"statement": "Admin can process refunds ONLY with a mandatory reason entered (free text, max 500 characters) and full audit trail logged; no secondary approver required", "rationale": "Configurable with Restrictions (prd.md line 1228). Restated by Screen 4 business rules (line 595), Screen 4b field Reason (line 732) and Business Process Assumption 4 (line 1414: refund requests reviewed manually by admin; no automated refund approvals)."}}
  - {"op": "add_node", "id": "REQ-017-147", "type": "Rule", "owner_fr": "FR-017", "title": "Initial payment required for booking confirmation", "attrs": {"statement": "Initial payment is REQUIRED for booking confirmation: deposit (20-30% of total under existing configuration), eligible first installment per FR-007B, or the existing full-payment alternative. Existing treatment-completion fund-holding policy is unchanged.", "rationale": "Payment Rule 1 (prd.md line 1232)."}}
  - {"op": "add_node", "id": "REQ-017-148", "type": "Rule", "owner_fr": "FR-017", "title": "Final payment 7 days before treatment or last installment 30 days before", "attrs": {"statement": "Final payment due 7 days before treatment date OR last installment 30 days before treatment (whichever is configured)", "rationale": "Payment Rule 2 (prd.md line 1233). Restated by the Screen 4 Due Date field."}}
  - {"op": "add_node", "id": "REQ-017-149", "type": "Rule", "owner_fr": "FR-017", "title": "Failed installments retried 3 times then flagged", "attrs": {"statement": "Failed installment payments trigger 3 automatic retry attempts (day 1, day 3, day 7); if all fail, booking flagged for admin review", "rationale": "Payment Rule 3 (prd.md line 1234). External Service 1 failure handling (line 1358) gives 1 hour, 6 hours, 24 hours; see the product owner question."}}
  - {"op": "add_node", "id": "REQ-017-150", "type": "Rule", "owner_fr": "FR-017", "title": "Payout statements and provider invoices are distinct artefacts", "attrs": {"statement": "Provider payout statements (dashboard view) are auto-generated at the start of the buffer window before each scheduled payout date. Provider invoice PDFs are generated separately only after the Stripe transfer is confirmed (post-payout). Statements and invoices are two distinct artefacts.", "rationale": "Billing Rule 2 (prd.md line 1236). Restated by Main Flow step 3 (line 148)."}}
  - {"op": "add_node", "id": "REQ-017-151", "type": "Rule", "owner_fr": "FR-017", "title": "Affiliate invoices at buffer start before the monthly payout", "attrs": {"statement": "Affiliate invoices generated at the start of the buffer window before the monthly payout date (1st processing date minus buffer days)", "rationale": "Billing Rule 3 (prd.md line 1237). Restated by Entry Points (line 125: monthly affiliate payout summaries generated at the start of the buffer period)."}}
  - {"op": "add_node", "id": "REQ-017-152", "type": "Rule", "owner_fr": "FR-017", "title": "Global buffer window, default 3 days", "attrs": {"statement": "The buffer window is configurable globally (default: 3 days before payout date). For example, a Friday payout with a 3-day buffer means the statement is generated on Tuesday. Buffer window configuration is managed in FR-029 / A-09: Payment System Configuration.", "rationale": "Billing Rule 4 (prd.md line 1238). Restated by Admin Editability (line 1208)."}}
  - {"op": "add_node", "id": "REQ-017-153", "type": "Rule", "owner_fr": "FR-017", "title": "Approve during the buffer; payout day processes only Approved", "attrs": {"statement": "Admin must approve payout statements during the buffer window. On payout day, the system auto-processes only \"Approved\" statements. Any statement still in \"Pending Approval\" at that point moves to \"Overdue\" and is NOT auto-processed. Overdue statements can be approved and processed at any time outside the normal cycle; the Stripe transfer is initiated immediately on approval. Delay is recorded in the audit trail.", "rationale": "Billing Rule 5 (prd.md line 1239). Restated by Entry Points (line 123: payout-day cron, e.g. Friday 6 AM UTC), Main Flow steps 11-14 (lines 159-165) and the Screen 3 rule (line 497: status Processing then Paid after the Stripe confirmation webhook)."}}
  - {"op": "add_node", "id": "REQ-017-154", "type": "Rule", "owner_fr": "FR-017", "title": "Hairline absorbs currency conversion costs", "attrs": {"statement": "Patients charged in their selected currency; providers paid in their configured currency; Hairline absorbs currency conversion costs", "rationale": "Currency Rule 1 (prd.md line 1240). Restated by Business Process Assumption 5 (line 1415: no pass-through to patients or providers)."}}
  - {"op": "add_node", "id": "REQ-017-155", "type": "Rule", "owner_fr": "FR-017", "title": "Commission before payout; lock points; Flat Rate per completed procedure", "attrs": {"statement": "Platform commission calculated BEFORE provider payout. Lock points: the exchange rate is locked at subquote acceptance; the commission model and value, with the deposit and installment settings, are fixed at booking confirmation; nothing is fixed at quote creation. The Percentage commission base is the accepted price after promotion, in the quote currency, read from the acceptance snapshot, for every discount type, including Hairline Only discounts; Flat Rate commission is a fixed deduction once per FR-010 completed procedure, independent of procedure price", "rationale": "Commission Rule 1 (prd.md line 1242). Restated by the Screen 3 Flat Rate rule (line 491: later changes to the commission configuration do not alter existing snapshots) and Fixed in Codebase (line 1217: formulas fixed in business logic)."}}
  - {"op": "add_node", "id": "REQ-017-156", "type": "Rule", "owner_fr": "FR-017", "title": "Affiliate commission comes out of Hairline's commission", "attrs": {"statement": "Affiliate commissions deducted from Hairline's commission (does not reduce provider payout)", "rationale": "Commission Rule 2 (prd.md line 1243)."}}
  - {"op": "add_node", "id": "REQ-017-157", "type": "Rule", "owner_fr": "FR-017", "title": "HTML invoice by email when PDF generation fails", "attrs": {"statement": "If PDF generation fails, provide HTML invoice via email; retry PDF generation asynchronously", "rationale": "External Service 3 failure handling (prd.md line 1367)."}}
  - {"op": "add_node", "id": "REQ-017-158", "type": "Rule", "owner_fr": "FR-017", "title": "Stale exchange-rate cache alerts admin only", "attrs": {"statement": "If API unavailable, use last cached rate; flag admin if cache >24 hours stale (alert only; acceptance is never paused and locked snapshot rates are never changed)", "rationale": "External Service 2 failure handling (prd.md line 1363). Restated by Integration 2 error handling (line 1447)."}}
  - {"op": "add_node", "id": "REQ-017-159", "type": "Rule", "owner_fr": "FR-017", "title": "Bank validation done in FR-032; no per-payout re-verification", "attrs": {"statement": "Provider bank account validation is completed in FR-032 Billing Settings before payout processing; no additional per-payout re-verification is required beyond readiness checks", "rationale": "Business Process Assumption 1 (prd.md line 1410), promoted because it states a rule. The closed-bank-account edge case (line 1707) says admin verifies the new account; see the product owner question."}}
  - {"op": "add_node", "id": "REQ-017-160", "type": "Rule", "owner_fr": "FR-017", "title": "Payout processing is transactional and race-free", "attrs": {"statement": "Financial module requires high data integrity; use database transactions (BEGIN/COMMIT/ROLLBACK) for all payment processing. Prevent race conditions in payout processing; use row-level locking when calculating provider earnings", "rationale": "Technical Considerations Architecture and Concurrency (prd.md lines 1427-1428), promoted as a concurrency rule (checklist step 2)."}}
  - {"op": "add_node", "id": "REQ-017-161", "type": "Rule", "owner_fr": "FR-017", "title": "Fraud flags on discounts, payouts and refunds", "attrs": {"statement": "Flag sudden high-value discount codes for review (>50% off or >£500). Flag provider payouts exceeding 2x average payout amount for manual review. Implement rate limiting on refund API endpoints (max 10 refunds per admin per hour)", "rationale": "Security Considerations Fraud prevention (prd.md lines 1481-1483)."}}
  - {"op": "add_node", "id": "REQ-017-162", "type": "Rule", "owner_fr": "FR-017", "title": "Expired card: patient emailed; retry on next attempt", "attrs": {"statement": "System sends email to patient: \"Payment method expired. Please update card to continue installment plan.\" System retries charge with updated card on next scheduled attempt", "rationale": "Edge case, card expires before installment due (prd.md lines 1696-1700). The patient updates the card in P-01 (FR-001)."}}
  - {"op": "add_node", "id": "REQ-017-163", "type": "Rule", "owner_fr": "FR-017", "title": "Partial refund recalculates Percentage commission only", "attrs": {"statement": "Provider payout adjusted: under the Percentage model, original commission calculated on £2,700, recalculated on £2,000; under the Flat Rate model, the per-procedure deduction is unchanged because the base procedure is still completed", "rationale": "Edge case, partial refund of add-on packages (prd.md lines 1743-1749: Stripe refund for the add-ons; invoice shows Partial Refund and New Total)."}}
# --- Settings: new settings this PRD reads (FR-029 settings already in the graph are reused)
  - {"op": "add_node", "id": "SET-payment-reminder-schedule", "type": "Setting", "owner_fr": "FR-030", "title": "Payment reminder schedule", "attrs": {"description": "When automated patient payment reminders go out: 3 days before the due date, and 7 days after it if overdue (FR-017 REQ-017-010). Managed in FR-030 / A-09 notification configuration.", "unit": "days"}}  # stub
  - {"op": "add_node", "id": "SET-affiliate-payout-day", "type": "Setting", "owner_fr": "FR-017", "title": "Affiliate payout day of month", "attrs": {"description": "Day of the month on which monthly affiliate payouts are processed (FR-017 Screen 6). The PRD names no owning configuration screen.", "default": "7", "unit": "day of month"}}
# --- Events: billing notification events FR-017 defines; FR-020 / S-03 delivers them
  - {"op": "add_node", "id": "EVT-billing-payment-received", "type": "Event", "owner_fr": "FR-017", "title": "Payment received", "attrs": {"description": "Receipt to the patient (provider and admin optional) on a successful Stripe payment, by email and push (prd.md line 92)."}}
  - {"op": "add_node", "id": "EVT-billing-payment-failed", "type": "Event", "owner_fr": "FR-017", "title": "Payment failed", "attrs": {"description": "To the patient (admin optional) on a failed charge or webhook, by email and push (prd.md line 93)."}}
  - {"op": "add_node", "id": "EVT-billing-payment-due-reminder", "type": "Event", "owner_fr": "FR-017", "title": "Payment due reminder", "attrs": {"description": "Installment or balance reminder to the patient 3 days before the due date, by email and push (prd.md line 94)."}}
  - {"op": "add_node", "id": "EVT-billing-outstanding-invoice-alert", "type": "Event", "owner_fr": "FR-017", "title": "Outstanding invoice alert", "attrs": {"description": "Internal admin alert for overdue patient invoices past a configurable threshold, by email and push (prd.md line 98). The PRD names no owner for the threshold."}}
  - {"op": "add_node", "id": "EVT-billing-manual-payment-reminder", "type": "Event", "owner_fr": "FR-017", "title": "Manual payment reminder sent", "attrs": {"description": "Admin-triggered reminder from Screen 4 or 4a; FR-020 picks the template from the reminder type (prd.md lines 576, 581-584)."}}
  - {"op": "add_node", "id": "EVT-billing-provider-payout-processed", "type": "Event", "owner_fr": "FR-017", "title": "Provider payout processed", "attrs": {"description": "To the provider (admin optional) after the payout is confirmed, with the invoice attached, by email and push (prd.md lines 95, 173)."}}
  - {"op": "add_node", "id": "EVT-billing-affiliate-payout-processed", "type": "Event", "owner_fr": "FR-017", "title": "Affiliate payout processed", "attrs": {"description": "To the affiliate (admin optional) after the monthly affiliate payout, by email and push (prd.md line 96)."}}
  - {"op": "add_node", "id": "EVT-billing-payout-failed", "type": "Event", "owner_fr": "FR-017", "title": "Payout failed", "attrs": {"description": "To admin (provider and affiliate optional) on a failed Stripe transfer, by email and push (prd.md lines 97, 167)."}}
  - {"op": "add_node", "id": "EVT-billing-overdue-payout-alert", "type": "Event", "owner_fr": "FR-017", "title": "Overdue payout alert", "attrs": {"description": "Admin alert on payout day when a statement was not approved during the buffer window and was skipped by auto-processing (prd.md line 99)."}}
  - {"op": "add_node", "id": "EVT-billing-statements-ready-for-review", "type": "Event", "owner_fr": "FR-017", "title": "Payout statements ready for review", "attrs": {"description": "Admin push and email: X statements ready for review, with the payout date (prd.md line 149)."}}
  - {"op": "add_node", "id": "EVT-billing-payout-schedule-updated", "type": "Event", "owner_fr": "FR-017", "title": "Payout schedule updated", "attrs": {"description": "Provider notice that the payout schedule changed, with the next payout date (prd.md line 222)."}}
  - {"op": "add_node", "id": "EVT-billing-dispute-payout-added", "type": "Event", "owner_fr": "FR-017", "title": "Disputed booking added to next payout", "attrs": {"description": "Provider notice sent automatically when a dispute is resolved with Add to Next Payout, optional for other actions (prd.md line 967)."}}
