operations:
  - {"op": "add_node", "id": "REQ-018-318", "type": "Rule", "owner_fr": "FR-018", "title": "Inactive affiliate: whole unpaid balance paid in the next run with no threshold", "attrs": {"statement": "System MUST keep an Inactive affiliate without a ban flag in the monthly cycle list for any month with unpaid commission, pay in the next run the whole unpaid balance earned up to the offboarding (including the current month's part) and any commission confirmed after the offboarding with no $50 threshold, and write off with an audit entry a refund reversal that arrives after the affiliate is Inactive. The $50 forfeiture at the moment of deactivation stays", "rationale": "PRD Payment Rule 7, Screen 3.3, Screen 7"}}
