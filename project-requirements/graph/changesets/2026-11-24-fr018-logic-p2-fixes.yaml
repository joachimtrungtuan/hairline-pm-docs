  - {"op": "update_node", "id": "REQ-018-043", "attrs": {"statement": "Affiliate commissions are ONLY calculated for completed bookings where payment is confirmed (not for quote requests or pending bookings). In FR-018 a \"completed booking\" means the payment that leaves the booking fully paid in FR-007: pay in full, the final balance payment, or the last installment (REQ-007-083, REQ-007-084, REQ-007B-049), called the final payment in this PRD; this event sets the accrual month, the effective-date test for commission changes, and Total Referrals"}}
  - {"op": "update_node", "id": "REQ-018-044", "title": "The affiliate discount follows FR-019; the affiliate commission is funded only from Hairline's commission", "attrs": {"statement": "The affiliate discount is treated like every other discount in FR-019: commission is calculated on the accepted price after the promotion, so Hairline's commission and the provider's payout both fall in proportion to their shares, with the provider bearing most of it (REQ-019-016, REQ-019-037). The affiliate commission itself is deducted from Hairline's commission only, never from the provider's payout"}}
  - {"op": "update_node", "id": "REQ-018-054", "attrs": {"statement": "Percentage commissions are calculated as a percentage of the completed booking's net revenue (the booking total after discounts and refunds, in USD per the Currency Rule) — not as a percentage of Hairline's net commission. Fixed-amount commissions are a flat USD amount per completed booking, independent of booking value. In both cases the commission is funded from (deducted from) Hairline's commission, never the provider's payout (Rule 2). The affiliate discount only lowers the price that both shares are calculated on (Rule 2); the affiliate commission is a separate Hairline-borne cost against the same booking."}}
  - {"op": "update_node", "id": "REQ-018-055", "title": "Commission ceiling", "attrs": {"statement": "On any single booking, the affiliate commission (Rule 14) is meant to stay within Hairline's own commission earned on that booking. For a percentage commission the system checks that `commission % ≤ the platform default Hairline commission %` and blocks the save with the shortfall shown; the discount is not part of the test, because it is already reflected in the price both shares are calculated on (Rule 2). The check runs at affiliate code creation/generation (Screen 4), when the commission is set at onboarding (Screen 2) and when it is edited on Screen 3.2. The admin can save past a breach only by ticking \"Override\" and entering a required \"Approval reference\" text, which is stored in the audit entry; nothing is disabled automatically, and who may override follows the FR-031 permission matrix. Fixed-amount commissions (where the ceiling depends on booking value) raise a review warning rather than a hard block. At accrual, a booking whose commission is still more than Hairline's commission on that booking is paid in full and flagged for admin review on the commission list. This rule complements Assumption 4 (aggregate program cost at most 10% of Hairline commission revenue)"}}
  - {"op": "update_node", "id": "REQ-018-041", "title": "validate at affiliate code creation/generation that the affiliate commission percentage stays within the platform default Hairline commission percentage", "attrs": {"statement": "System MUST validate at affiliate code creation/generation that the affiliate commission percentage does not exceed the platform default Hairline commission percentage (Rule 15), re-run the check when commission is set at onboarding (Screen 2) or edited (Screen 3.2), and flag a booking that still breaches at accrual for admin review while paying the commission in full; percentage breaches MUST block the save unless the admin ticks Override and enters a required Approval reference stored in the audit entry (nothing is disabled automatically), and fixed-amount configurations MUST raise a review warning"}}
  - {"op": "update_node", "id": "REQ-018-111", "attrs": {"statement": "Margin Guard (Rule 15): At code creation the system checks the affiliate's commission percentage against the platform default Hairline commission percentage (the discount is not part of the test). A percentage commission above it (`commission % > default Hairline commission %`) is blocked with the shortfall shown, unless the admin ticks \"Override\" and enters a required \"Approval reference\" text, which is stored in the audit entry; nothing is disabled automatically. Fixed-amount configurations raise a review warning since the breach is booking-value dependent. The check runs again when the commission is set at onboarding or edited on Screen 3.2, and at accrual a booking that still breaches is flagged for admin review"}}
  - {"op": "update_node", "id": "REQ-018-003", "title": "validate affiliate-bound codes/links during the patient booking journey, apply the affiliate discount like any other FR-019 discount...", "attrs": {"statement": "System MUST validate affiliate-bound codes/links during the patient booking journey, apply the affiliate discount like any other FR-019 discount (commission is calculated on the price after the promotion) when it is the final price discount, and preserve valid affiliate referral attribution for commission/reporting when another higher-priority discount controls the final price"}}
  - {"op": "update_node", "id": "REQ-018-183", "title": "Providers understand that an affiliate discount follows FR-019 and the commission never comes from their payout", "attrs": {"statement": "Providers understand that an affiliate discount is treated like any other FR-019 discount (commission is calculated on the price after the promotion) and that the affiliate commission never comes from their payout"}}
  - {"op": "update_node", "id": "REQ-018-196", "title": "Discount type: Hairline fees only (treated like any other FR-019 discount)", "attrs": {"statement": "Discount type: Hairline fees only (the discount is treated like any other FR-019 discount; the affiliate commission is deducted from Hairline's commission); future phase: Both Fees"}}
  - {"op": "update_node", "id": "REQ-018-135", "attrs": {"statement": "Referral Link: The affiliate's unique referral link (auto-apply code URL) is shown with a one-click copy action only while the affiliate has an Active Auto-apply code that is not disabled by account status; the link carries the newest such code, and a click counts for 30 days. Otherwise the field reads \"No auto-apply code\", and an old link opens the normal landing page with no code and no attribution"}}
  - {"op": "update_node", "id": "REQ-018-051", "attrs": {"statement": "Affiliate commission and referral credit are earned when a valid affiliate-bound code or affiliate auto-apply referral link is captured for the patient's booking journey and the booking completes with payment confirmation; \"valid\" means the affiliate is Active at the moment the quote is accepted, and a capture for an affiliate that is not Active at acceptance earns no credit and no commission, even if the final price discount applied at quote acceptance is a higher-priority patient or provider promotion under FR-019's priority order (Rule 3). The attribution goes to the last valid affiliate code or affiliate link the patient used before accepting the quote: a link click counts for 30 days, a typed affiliate code replaces an earlier link, the link carries the affiliate's newest Active Auto-apply code that is not disabled by account status (if there is none, an old link opens the normal landing page with no code and no attribution), and the capture is stored with the patient's inquiry journey and read by FR-019 at acceptance. The single-discount rule still controls the patient's price and provider/Hairline discount impact; it does not erase affiliate referral attribution. This protects affiliates from losing commission because a provider-side promotion is applied outside the patient's knowledge. FR-017 and FR-019 MUST consume the FR-018/FR-019 attribution result separately from the final applied discount line."}}
  - {"op": "update_node", "id": "REQ-018-052", "attrs": {"statement": "An affiliate has four states: Pending (account created, password not yet set), Active (password set, transacting), Suspended (temporary and reversible; codes disabled by account status, unpaid commission held, B3) and Inactive (permanent end of the partnership; codes revoked, portal read-only, final balance settled, forfeited or written off, B5). Only these transitions are allowed: Pending to Active (password set, Screen 10.1), Pending to Inactive (Screen 3.3), Active to Suspended (Screen 3.1), Suspended to Active (Screen 3.1), Active to Inactive (Screen 3.3) and Suspended to Inactive (Screen 3.3). Inactive is terminal and is not silently reversed (resuming requires re-onboarding as a new affiliate record, Screen 2). Setting the password changes the status only from Pending."}}
  - {"op": "update_node", "id": "REQ-018-078", "attrs": {"statement": "Email Uniqueness: System validates email is not already registered as an affiliate or admin user. An Inactive affiliate without a ban flag does not count, so a person who left by normal offboarding can be onboarded again with the same email as a new affiliate record with a new ID and a zero balance; the old record is unchanged. The email of a banned affiliate stays blocked"}}
  - {"op": "update_node", "id": "REQ-018-213", "attrs": {"statement": "Valid email format, unique across affiliates except Inactive records without a ban flag"}}
  - {"op": "update_node", "id": "REQ-018-097", "attrs": {"statement": "Final Settlement: The modal first shows the settlement outcome; nothing is applied until the admin confirms. After confirmation, a net final balance ≥ $50 is queued for the next scheduled payout run, a residual below $50 is forfeited with an audit entry, and a negative balance is written off with an audit entry (no future payouts exist to net against); a Pending affiliate has nothing to settle and its activation link is invalidated"}}
  - {"op": "update_node", "id": "REQ-018-101", "attrs": {"statement": "No Silent Reactivation: An Inactive affiliate is not reinstated via Screen 3.1; resuming a partnership requires re-onboarding on Screen 2 as a new affiliate record with a new ID and zero balance, allowed with the same email only after a normal offboarding"}}
  - {"op": "update_node", "id": "REQ-018-144", "attrs": {"statement": "Minimum Threshold: When the next payout amount of an Active affiliate is below the $50 minimum, the panel notes it will roll over to the next cycle (Payment Rule 3); a Suspended affiliate sees \"Held\" and an Inactive affiliate sees \"Final balance\" instead (Payment Rules 4 and 7)"}}
  - {"op": "update_node", "id": "REQ-018-152", "attrs": {"statement": "Expired / Used Link: System shows an explanatory message and a link to request a new one (Screen 10.2); if the affiliate was offboarded while Pending, the link no longer works and the screen shows \"This activation link is no longer valid\" with no resend option"}}
  - {"op": "update_node", "id": "REQ-018-156", "attrs": {"statement": "Eligibility: A link is only generated for accounts created but not yet activated (password not set) and still Pending; for an affiliate offboarded while Pending, resend is disabled and the \"link no longer valid\" message is shown"}}
  - {"op": "update_node", "id": "REQ-018-087", "attrs": {"statement": "Resend Activation: \"Resend Activation Email\" is enabled only while Activation Status is \"Invited\" (password not yet set) and the affiliate is Pending; offboarding a Pending affiliate invalidates the link and disables the action; it follows the A5 rate-limit and security rules"}}
  - {"op": "update_node", "id": "REQ-018-306", "attrs": {"statement": "On the affiliate Promo Codes tab, the discount code is read-only and has a one-click copy action; copying an active code puts the code text (or the auto-apply referral link) on the clipboard. While a code carries the disabled-by-account-status marker, a read-only \"Disabled by account status\" badge is shown and copying is blocked (a Suspended affiliate can log in and view but cannot copy codes or links)"}}
  - {"op": "update_node", "id": "REQ-018-310", "attrs": {"statement": "System MUST mark an affiliate's codes \"disabled by account status\" on suspension or offboarding, separate from the admin Inactive toggle, and clear the marker on reinstatement so codes that were Active before suspension work again; Revoked is the permanent result of offboarding or ban, Inactive is the admin switch-off, and Expired is past the expiry date; the affiliate sees a read-only \"Disabled by account status\" badge on the code and copying is blocked while the marker is set"}}
  - {"op": "update_node", "id": "REQ-018-311", "attrs": {"statement": "System MUST set payout readiness of a suspended affiliate's unpaid commission to Manual Review Required with the suspension reason, list it as held in the monthly run without paying it, and clear the hold on reinstatement so all held commission is paid in the next run under the normal $50 threshold, or on a normal offboarding so readiness follows the stored bank details; only a ban forfeits. Ready, Missing Destination and Invalid Destination are set by the system from the stored bank details"}}
  - {"op": "update_node", "id": "REQ-018-312", "attrs": {"statement": "System MUST keep earning commission for a booking whose quote was accepted with the affiliate's code or link before a status change and whose final payment is confirmed later, but only when the affiliate was Active when the quote was accepted: held while Suspended, paid in the next run after a normal offboarding, forfeited after a ban"}}
  - {"op": "update_node", "id": "REQ-018-313", "attrs": {"statement": "System MUST settle an Inactive affiliate's final balance in the next scheduled run with readiness following the stored bank details, and carry forward a reversal created by a refund after a payout was Paid, deducting it from later payouts of an active affiliate until it is cleared"}}
  - {"op": "update_node", "id": "REQ-018-307", "attrs": {"statement": "System MUST store the first code's settings (code name, discount type and amount, expiry, maximum usage, application method) with the affiliate account at onboarding and generate, validate and save the first code only after the affiliate becomes Active (password set), so a code never exists for a Pending affiliate; if the first code cannot be generated or registered, the affiliate stays Active with no code, the failure and reason are recorded in the audit panel and shown on Screen 3, and the admin creates the code from Screen 4 with the stored settings, which stay editable until a code exists"}}
  - {"op": "update_node", "id": "REQ-018-308", "attrs": {"statement": "System MUST give the referral attribution to the last valid affiliate code or affiliate link the patient used before quote acceptance: a link click counts for 30 days, a typed affiliate code replaces an earlier link, the link carries the affiliate's newest Active Auto-apply code that is not disabled by account status (if there is none, an old link opens the normal landing page with no code and no attribution), and the capture is stored with the patient's inquiry journey and read by FR-019 at acceptance; the affiliate must be Active at the moment the quote is accepted, otherwise the capture earns no credit and no commission"}}
  - {"op": "update_node", "id": "REQ-018-309", "title": "A completed booking means the payment that leaves the booking fully paid is confirmed", "attrs": {"statement": "System MUST treat a booking as completed in FR-018 when the payment that leaves it fully paid is confirmed in FR-007 (pay in full, final balance or last installment; REQ-007-083, REQ-007-084, REQ-007B-049), and use that event for the accrual month, the effective-date test for commission changes, and Total Referrals"}}
  - {"op": "update_node", "id": "REQ-018-317", "attrs": {"statement": "System MUST require an Offboarding type (Normal offboarding or Permanent ban) on Screen 3.3; Permanent ban sets Settlement Outcome to \"Forfeit whole balance (ban)\" and stores a ban flag on the affiliate; the Permanent ban option is hidden while the affiliate is Pending, and the Settlement Outcome of a Pending affiliate reads \"Nothing to settle\""}}
  - {"op": "update_node", "id": "REQ-018-067", "attrs": {"statement": "Payment Rule 2: If patient refunds booking, affiliate commission is reversed (deducted from next payout). A refund after a payout was already Paid creates a reversal that is carried forward and deducted from later payouts of an active affiliate until it is cleared; a reversal that arrives after the affiliate is Inactive is written off with an audit entry (Payment Rule 7)"}}
  - {"op": "update_node", "id": "REQ-018-068", "attrs": {"statement": "Minimum payout threshold: $50 (commissions below $50 roll over to next month); it does not apply to an Inactive affiliate (Payment Rule 7)"}}
  - {"op": "update_node", "id": "STP-018-108", "title": "System retains historical data and blocks new activity; a Suspended affiliate can view the portal but cannot copy codes or links"}
  - {"op": "update_node", "id": "STP-018-138", "title": "System clears the hold and pays all held commission in the next monthly run under the normal $50 threshold"}
  - {"op": "update_node", "id": "STP-018-122", "title": "System opens Screen 3.3 and requires an Offboarding type and a reason; Permanent ban is hidden for a Pending affiliate"}
  - {"op": "update_node", "id": "STP-018-124", "title": "System computes and shows the settlement outcome; nothing is applied yet", "attrs": {"prd_ref": "B5 step 4"}}
