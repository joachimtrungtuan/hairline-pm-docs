# FR-018 logic review pass 1: ruled fixes applied to the PRD (Affiliate Management). New fields, enum value, rules and steps come first, then edges (the Unpaid balance relabels remove and re-add their shows edges together), then updates, then removals; the superseded duplicate activation-email step is retired last, after its edges are removed.
# Cross-FR edges: adds FR-018 references to REQ-019-088 and REQ-019-116 (FR-019 usage-cap rules) and to REQ-007-036 (FR-007 final payment rule). No other edge touches a node owned by another FR; no other FR's node is updated.
# Queued for other FRs, not done here: FR-019 (attribution read at acceptance, rejection reasons, program picker), FR-005 (storing the attribution capture with the inquiry journey), FR-031 (permissions for suspend, reinstate, offboard, ban, generate codes, edit commission and the settings panel), FR-030 and FR-020 (affiliate account email events), FR-017 (held and flagged commission on the commission list, payout readiness values, final-balance pointer).
# Left alone on purpose: minor observations other than the Pending status and the duplicate activation email; no graph field exists for the stored initial code settings (described in the rule and the screen description only); ENT-affiliate-commission is FR-017's and is not updated; the new settings_changed audit action is an addition to the existing enum.
reason: "FR-018 logic review pass 1: usage caps follow FR-019 reservations, code entry moved to the sub-quote review, one lifecycle transition list, first code generated at activation, Unpaid balance and Next payout amount, attribution capture, disabled-by-account-status marker, suspension hold and reinstatement steps, bookings accepted before a status change, completed booking means final payment confirmed, Offboarding type and ban flag, margin check re-run and accrual flag, Screen 1 program settings panel, notifications through the notification service, no admin-initiated final payout, stage writes edges."
by: docs-manager
