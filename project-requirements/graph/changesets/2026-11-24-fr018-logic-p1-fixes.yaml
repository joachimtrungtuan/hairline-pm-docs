  - {"op": "update_node", "id": "REQ-018-004", "title": "count a code's usage caps (Maximum Usage Count, Per-Patient Usage Limit) as active reservations plus consumed...", "attrs": {"statement": "System MUST count a code's usage caps (Maximum Usage Count, Per-Patient Usage Limit) as active reservations plus consumed uses, exactly as FR-019 rules (REQ-019-088, REQ-019-116), where \"applied\" means the FR-019 Application made at quote acceptance and \"completed\" means the final payment is confirmed"}}
  - {"op": "update_node", "id": "REQ-018-006", "title": "provide affiliates with real-time dashboard showing referral count, revenue generated, commission earned, and...", "attrs": {"statement": "System MUST provide affiliates with real-time dashboard showing referral count, revenue generated, commission earned, and unpaid balance"}}
  - {"op": "update_node", "id": "REQ-018-010", "title": "enforce single discount code per booking rule for the patient's final price (FR-019 owns the priority order...", "attrs": {"statement": "System MUST enforce single discount code per booking rule for the patient's final price (FR-019 owns the priority order and the patient prompt) while preserving valid affiliate referral attribution separately for commission and reporting when a provider-side or other higher-priority promotion supersedes the affiliate discount line"}}
  - {"op": "update_node", "id": "REQ-018-020", "title": "expose API for discount code validation on the patient sub-quote review (response time <500ms)", "attrs": {"statement": "System MUST expose API for discount code validation on the patient sub-quote review (response time <500ms)"}}
  - {"op": "update_node", "id": "REQ-018-033", "title": "provide a Suspend/Reinstate action (with required reason and confirmation) that disables the affiliate's...", "attrs": {"statement": "System MUST provide a Suspend/Reinstate action (with required reason and confirmation) that disables the affiliate's codes by account status and holds the unpaid commission on suspension"}}
  - {"op": "update_node", "id": "REQ-018-034", "title": "capture an effective date for commission-structure changes and apply new rates only to bookings completed on...", "attrs": {"statement": "System MUST capture an effective date for commission-structure changes and apply new rates only to bookings completed on or after that date (no retroactive recalculation)"}}
  - {"op": "update_node", "id": "REQ-018-039", "title": "provide an Offboarding / Deactivation action (Screen 3.3, with required reason and confirmation) that moves...", "attrs": {"statement": "System MUST provide an Offboarding / Deactivation action (Screen 3.3, with required reason and confirmation) that moves an affiliate to the terminal Inactive state: revoking all the affiliate's codes, converting portal access to read-only, retaining historical data, and performing explicit final settlement — pay net balance ≥ $50, forfeit a residual below $50, or write off a negative balance — each recorded in the audit trail. Inactive is distinct from Suspended (temporary, reversible) and is not silently reinstated"}}
  - {"op": "update_node", "id": "REQ-018-041", "title": "validate at affiliate code creation/generation that the combined Hairline-funded cost on a booking...", "attrs": {"statement": "System MUST validate at affiliate code creation/generation that the combined Hairline-funded cost on a booking (patient-facing affiliate discount + affiliate commission) stays within the platform default Hairline commission rate (Rule 15), re-run the check when commission is set at onboarding or edited, and flag a booking that still breaches at accrual for admin review while paying the commission in full; percentage breaches at code creation MUST be blocked (override requires documented, audited business approval) and fixed-amount configurations MUST raise a review warning"}}
  - {"op": "update_node", "id": "REQ-018-043", "attrs": {"statement": "Affiliate commissions are ONLY calculated for completed bookings where payment is confirmed (not for quote requests or pending bookings). In FR-018 a \"completed booking\" means the booking's final payment is confirmed (FR-007, REQ-007-036); this event sets the accrual month, the effective-date test for commission changes, and Total Referrals"}}
  - {"op": "update_node", "id": "REQ-018-051", "attrs": {"statement": "Affiliate commission and referral credit are earned when a valid affiliate-bound code or affiliate auto-apply referral link is captured for the patient's booking journey and the booking completes with payment confirmation, even if the final price discount applied at quote acceptance is a higher-priority patient or provider promotion under FR-019's priority order (Rule 3). The attribution goes to the last valid affiliate code or affiliate link the patient used before accepting the quote: a link click counts for 30 days, a typed affiliate code replaces an earlier link, the link carries the affiliate's one Auto-apply code (the newest Active one if several), and the capture is stored with the patient's inquiry journey and read by FR-019 at acceptance. The single-discount rule still controls the patient's price and provider/Hairline discount impact; it does not erase affiliate referral attribution. This protects affiliates from losing commission because a provider-side promotion is applied outside the patient's knowledge. FR-017 and FR-019 MUST consume the FR-018/FR-019 attribution result separately from the final applied discount line."}}
  - {"op": "update_node", "id": "REQ-018-052", "attrs": {"statement": "An affiliate has four states: Pending (account created, password not yet set), Active (password set, transacting), Suspended (temporary and reversible; codes disabled by account status, unpaid commission held, B3) and Inactive (permanent end of the partnership; codes revoked, portal read-only, final balance settled, forfeited or written off, B5). Only these transitions are allowed: Pending to Active (password set, Screen 10.1), Pending to Inactive (Screen 3.3), Active to Suspended (Screen 3.1), Suspended to Active (Screen 3.1), Active to Inactive (Screen 3.3) and Suspended to Inactive (Screen 3.3). Inactive is terminal and is not silently reversed (resuming requires re-onboarding). Setting the password changes the status only from Pending."}}
  - {"op": "update_node", "id": "REQ-018-053", "attrs": {"statement": "A code's `Maximum Usage Count` and `Per-Patient Usage Limit` count active reservations plus consumed uses, exactly as FR-019 rules (REQ-019-088 for the total cap, REQ-019-116 per patient). \"Applied\" means the FR-019 Application made when the patient accepts a quote with the code. FR-018 adds no separate rate limit on applied events."}}
  - {"op": "update_node", "id": "REQ-018-055", "attrs": {"statement": "On any single booking, the combined Hairline-funded cost, which is the patient-facing affiliate discount (Rule 2) plus the affiliate commission (Rule 14), is meant to stay within Hairline's own commission earned on that booking. The system checks this at affiliate code creation/generation (Screen 4) using the platform default Hairline commission rate: when both the discount and the commission are percentage-based, it validates that `discount % + commission % ≤ the platform default Hairline commission %` and blocks the save with the shortfall shown; an admin with documented business approval may override with an audited confirmation. The check runs again against the affiliate's active codes when the commission is set at onboarding or edited on Screen 3.2. Fixed-amount configurations (where the ceiling depends on booking value) raise a review warning rather than a hard block. At accrual, a booking whose discount plus commission is still more than Hairline's commission on that booking is paid in full and flagged for admin review on the commission list. This rule complements Assumption 4 (aggregate program cost at most 10% of Hairline commission revenue)."}}
  - {"op": "update_node", "id": "REQ-018-056", "attrs": {"statement": "Performance Tier (system-calculated, read-only): a band derived from the affiliate's trailing-12-month revenue generated (USD) by completed referrals, recalculated monthly. Default bands (admin-editable setting on the Screen 1 Affiliate Program Settings panel): Bronze < $5,000 · Silver $5,000–$24,999 · Gold $25,000–$99,999 · Platinum ≥ $100,000. Tier is used for filtering/segmentation only and never changes commission automatically."}}
  - {"op": "update_node", "id": "REQ-018-067", "attrs": {"statement": "Payment Rule 2: If patient refunds booking, affiliate commission is reversed (deducted from next payout). A refund after a payout was already Paid creates a reversal that is carried forward and deducted from later payouts of an active affiliate until it is cleared"}}
  - {"op": "update_node", "id": "REQ-018-069", "attrs": {"statement": "Currency Rule: All affiliate amounts (commission accrual, unpaid balances, thresholds, and payouts) are denominated in USD — the platform base currency owned by FR-029 (Payment System Configuration). When a booking is transacted in a non-USD currency, its value is converted to USD using FR-029's currency service, supported-currency list, and locked exchange-rate/markup logic — FR-018 never defines, caches, or overrides its own FX rate. The conversion rate applied to a commission is the rate locked for that booking per FR-029 (no discrepancy with billing/finance figures). Affiliates are responsible for any onward conversion from USD on their side. Note on client figures: GBP amounts in the client transcription (e.g., \"£50\", \"£200\") are illustrative of intended incentive magnitudes; the platform base currency is USD (per FR-029), so this PRD's literal thresholds and minimums (e.g., the $50 minimum fixed commission and $50 payout threshold) are stated in USD and are not a direct GBP→USD conversion of those examples."}}
  - {"op": "update_node", "id": "REQ-018-080", "attrs": {"statement": "Commission Validation: If percentage type, system calculates preview of commission for an example booking (e.g., \"For a $1,000 booking with no discount or refund at 15% of net revenue, affiliate earns $150; if the patient received a 10% discount, net revenue is $900 and the affiliate earns $135\"). Setting the commission at onboarding runs the Rule 15 margin check against the stored code settings"}}
  - {"op": "update_node", "id": "REQ-018-088", "attrs": {"statement": "Suspension Effects: Suspend is available for an Active affiliate only. On suspend, all of the affiliate's codes get the disabled-by-account-status marker (FR-019 validation no longer accepts them), the unpaid commission is set to Manual Review Required with the suspension reason and is listed as held in the monthly run without being paid, and historical data is retained"}}
  - {"op": "update_node", "id": "REQ-018-089", "attrs": {"statement": "Reinstatement: Reinstate is available for a Suspended affiliate only. On reinstate, status returns to \"Active\", the marker is cleared so codes that were Active before the suspension work again, the hold is cleared and all held commission is paid in the next monthly run, and the affiliate is sent a reinstatement notice"}}
  - {"op": "update_node", "id": "REQ-018-092", "attrs": {"statement": "Future-Only: New rates apply only to bookings completed on or after the effective date (completed means the final payment is confirmed); historical commissions are never recalculated"}}
  - {"op": "update_node", "id": "REQ-018-096", "attrs": {"statement": "Terminal State: Available for a Pending, Active or Suspended affiliate. Sets `Status: Inactive`; this is a permanent end-of-partnership state, not a temporary hold"}}
  - {"op": "update_node", "id": "REQ-018-097", "attrs": {"statement": "Final Settlement: Net final balance ≥ $50 is queued for the next scheduled payout run (payout readiness unchanged); a residual below $50 is forfeited with an audit entry; a negative balance is written off with an audit entry (no future payouts exist to net against)"}}
  - {"op": "update_node", "id": "REQ-018-098", "attrs": {"statement": "Code Disablement: All of the affiliate's codes are set to Revoked and carry the disabled-by-account-status marker, so FR-019 validation no longer accepts them"}}
  - {"op": "update_node", "id": "REQ-018-108", "attrs": {"statement": "Expiration Logic: If expiration date set, the code becomes Expired at midnight (UTC) on that date"}}
  - {"op": "update_node", "id": "REQ-018-109", "attrs": {"statement": "Usage Limit: The caps count active reservations plus consumed uses, as FR-019 rules (REQ-019-088; per patient REQ-019-116). \"Applied\" means the FR-019 Application made at quote acceptance. A code at its cap is not accepted by FR-019 validation, and a use returned because the booking was cancelled or expired before first payment frees it again (Rule 13)"}}
  - {"op": "update_node", "id": "REQ-018-111", "attrs": {"statement": "Margin Guard (Rule 15): At code creation the system checks the configured discount plus the affiliate's commission against the platform default Hairline commission rate. Percentage configurations that breach it (`discount % + commission % > default Hairline commission %`) are blocked with the shortfall shown (override requires documented, audited business approval); fixed-amount configurations raise a review warning since the breach is booking-value dependent. The check runs again when the commission is set at onboarding or edited on Screen 3.2, and at accrual a booking that still breaches is flagged for admin review"}}
  - {"op": "update_node", "id": "REQ-018-114", "attrs": {"statement": "Per-Row Reason: Each skipped/failed row records a specific reason (duplicate generated code, inactive affiliate, incomplete payout setup, the reason returned by FR-019 for a registration failure, notification failure)"}}
  - {"op": "update_node", "id": "REQ-018-120", "attrs": {"statement": "Bulk Actions: Admin can multi-select codes to bulk activate/deactivate; codes of an affiliate that is not Active are skipped, as the single toggle is blocked for them"}}
  - {"op": "update_node", "id": "REQ-018-125", "attrs": {"statement": "Status Transitions: Deactivation stops FR-019 validation from accepting the code immediately; expired/revoked codes remain visible with status labels and cannot be copied as active codes"}}
  - {"op": "update_node", "id": "REQ-018-135", "attrs": {"statement": "Referral Link: The affiliate's unique referral link (auto-apply code URL) is available with a one-click copy action; the link carries the affiliate's one Auto-apply code, and a click counts for 30 days"}}
  - {"op": "update_node", "id": "REQ-018-136", "attrs": {"statement": "Payout Calculation: Two named figures are used everywhere: \"Unpaid balance\" is all commission earned and not yet paid, and \"Next payout amount\" is the commission from the previous month's completed bookings due in the next run, including any amount rolled over under Payment Rule 3"}}
  - {"op": "update_node", "id": "REQ-018-137", "attrs": {"statement": "Conversion Funnel: Overview shows the funnel Applied → Redeemed → Completed, using the FR-019 Application states (Applied when the quote is accepted with the code, Redeemed at the first successful payment) and the final payment confirmation for Completed"}}
  - {"op": "update_node", "id": "REQ-018-143", "attrs": {"statement": "Upcoming Payout: The next scheduled payout (next payout amount, date, included bookings count) and the unpaid balance are shown at the top alongside the history list"}}
  - {"op": "update_node", "id": "REQ-018-144", "attrs": {"statement": "Minimum Threshold: When the next payout amount is below the $50 minimum, the panel notes it will roll over to the next cycle (Payment Rule 3)"}}
  - {"op": "update_node", "id": "REQ-018-176", "attrs": {"statement": "How does system handle booking refund after affiliate payout has been processed? System tracks negative balance for affiliate; deducts refunded commission from next payout (if next payout insufficient, carries negative balance forward until it is cleared, Payment Rule 2). The reversal is shown on Screen 8 (Payout / Transaction Detail)."}}
  - {"op": "update_node", "id": "REQ-018-201", "attrs": {"statement": "Error handling: If the validation service is unavailable, the patient continues without the discount"}}
  - {"op": "update_node", "id": "REQ-018-202", "attrs": {"statement": "Error handling: If FR-019 registration fails for a generated code, mark that affiliate row as failed, show the reason FR-019 returns on that row, and allow admin to retry without duplicating successful rows"}}
  - {"op": "update_node", "id": "REQ-018-297", "title": "Permanent ban of an affiliate ends at Inactive and forfeits the whole unpaid balance", "attrs": {"statement": "System MUST support a permanent ban of an affiliate as a punitive end of partnership (workflow B6, Rule 16): the affiliate ends at Inactive with the Offboarding type \"Permanent ban\" and a ban flag stored, there is no separate Banned status, the whole unpaid balance is forfeited, and who may ban follows the FR-031 permission matrix"}}
  - {"op": "update_node", "id": "REQ-018-063", "attrs": {"statement": "Editable by Admin: Affiliate account details (name, email, phone, language, country, type, tax/VAT ID, bank account details, commission structure); Discount code parameters (expiration date, usage limits, active/inactive status); Bulk code generation criteria (selected affiliates, filtered segment, code pattern, campaign settings); Commission percentage/fixed amount per affiliate (with effective date for changes, via Screen 3.2); Affiliate status (Suspend and Reinstate via the Screen 3.1 modal; Inactive only via the Screen 3.3 Deactivate / Offboard modal); Affiliate payout day of the month (platform setting owned by FR-018, default the 7th; the payout stays monthly), edited on the Screen 1 Affiliate Program Settings panel; a change applies from the next run; Performance tier bands (platform setting; default values in Affiliate Segmentation Rules), edited on the Screen 1 Affiliate Program Settings panel; each save writes an audit entry"}}
  - {"op": "update_node", "id": "REQ-018-083", "attrs": {"statement": "Activation State: On create, Status is \"Pending\" and Activation Status is \"Invited\" until the affiliate completes the set-password flow; completing it flips Status from \"Pending\" to \"Active\" and Activation Status to \"Active\" together (per Rule 12). An admin \"Resend Activation Email\" action is available while Activation Status is \"Invited\""}}
  - {"op": "update_node", "id": "REQ-018-163", "attrs": {"statement": "System displays error message: \"This discount code is no longer valid. Please check the code or contact support.\"; Patient can continue without discount OR enter different valid code; there is no code entry after acceptance; System does NOT track this as affiliate referral (no commission triggered)"}}
  - {"op": "update_node", "id": "REQ-018-193", "attrs": {"statement": "Entry Points: Admins access Affiliate Management section in admin dashboard to onboard new affiliates; Admins select affiliates manually or through filters, then generate one unique affiliate-bound promo code per selected affiliate; After the admin creates their account, affiliates complete a one-time activation link to set their password, then log into the dedicated affiliate portal to view their performance dashboard; Patients enter an affiliate code on the sub-quote review, or arrive by an affiliate link, before accepting a quote; FR-019 applies the discount at acceptance and commission is calculated when the booking's final payment is confirmed; Automated monthly job generates payout reports on the affiliate payout day each month (platform setting, default the 7th)"}}
  - {"op": "update_node", "id": "REQ-018-198", "attrs": {"statement": "Affiliate sets and confirms password; system validates strength, saves the encrypted password, flips the status from Pending to Active, and redirects to the Affiliate Portal login"}}
  - {"op": "update_node", "id": "REQ-018-175", "title": "What occurs if patient accepts a quote with an affiliate code but cancels before the first payment?...", "attrs": {"statement": "What occurs if patient accepts a quote with an affiliate code but cancels before the first payment? No commission is credited to the affiliate, and the reserved code use is returned per FR-019."}}
  - {"op": "update_node", "id": "REQ-018-179", "title": "Patients can enter affiliate discount codes on the sub-quote review before accepting a quote", "attrs": {"statement": "Patients can enter affiliate discount codes on the sub-quote review before accepting a quote"}}
  - {"op": "update_node", "id": "REQ-018-240", "attrs": {"statement": "Dropdown of Active affiliates only (not Pending, Suspended or Inactive); required in Single mode"}}
  - {"op": "update_node", "id": "STP-018-006", "title": "System generates the affiliate's first discount code from the settings stored at onboarding", "attrs": {"prd_ref": "Main Flow step 8"}}
