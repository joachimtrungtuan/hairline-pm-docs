  - {"op": "update_node", "id": "SET-affiliate-payout-day", "attrs": {"description": "Day of the month on which monthly affiliate payouts are processed. Admin-editable platform setting owned by FR-018 (PRD General Module Rules, Rule 5), edited on the Screen 1 Affiliate Program Settings panel (SCR-018-01); a whole number 1 to 28, applied from the next run; each save writes an audit entry. The payout stays monthly."}}
  - {"op": "update_node", "id": "SET-affiliate-performance-tier-bands", "attrs": {"description": "Revenue bands (trailing 12 months, USD) that set an affiliate's performance tier; an admin-editable platform setting edited on the Screen 1 Affiliate Program Settings panel (SCR-018-01); a change applies from the next monthly tier calculation and each save writes an audit entry."}}
