  - {"op": "add_node", "id": "REQ-018-307", "type": "Rule", "owner_fr": "FR-018", "title": "First code is generated at activation from the settings stored at onboarding", "attrs": {"statement": "System MUST store the first code's settings (code name, discount type and amount, expiry, maximum usage, application method) with the affiliate account at onboarding and generate, validate and save the first code only after the affiliate becomes Active (password set), so a code never exists for a Pending affiliate", "rationale": "PRD Main Flow and Business Rules, REQ-018-307"}}
  - {"op": "add_node", "id": "REQ-018-308", "type": "Rule", "owner_fr": "FR-018", "title": "Attribution goes to the last valid affiliate code or link before quote acceptance", "attrs": {"statement": "System MUST give the referral attribution to the last valid affiliate code or affiliate link the patient used before quote acceptance: a link click counts for 30 days, a typed affiliate code replaces an earlier link, the link carries the affiliate's one Auto-apply code (the newest Active one if several), and the capture is stored with the patient's inquiry journey and read by FR-019 at acceptance", "rationale": "PRD Business Rules, Rule 11"}}
  - {"op": "add_node", "id": "REQ-018-309", "type": "Rule", "owner_fr": "FR-018", "title": "A completed booking means the booking's final payment is confirmed", "attrs": {"statement": "System MUST treat a booking as completed in FR-018 when its final payment is confirmed (FR-007), and use that event for the accrual month, the effective-date test for commission changes, and Total Referrals", "rationale": "PRD Business Rules, Rule 1 and Payment Rule 1"}}
  - {"op": "add_node", "id": "REQ-018-310", "type": "Rule", "owner_fr": "FR-018", "title": "Account status disables codes through a marker separate from the admin Inactive toggle", "attrs": {"statement": "System MUST mark an affiliate's codes \"disabled by account status\" on suspension or offboarding, separate from the admin Inactive toggle, and clear the marker on reinstatement so codes that were Active before suspension work again; Revoked is the permanent result of offboarding or ban, Inactive is the admin switch-off, and Expired is past the expiry date", "rationale": "PRD Screens 3.1, 3.3, 5 and 6; workflows B3 and B5"}}
  - {"op": "add_node", "id": "REQ-018-311", "type": "Rule", "owner_fr": "FR-018", "title": "Suspension holds the unpaid commission with payout readiness Manual Review Required", "attrs": {"statement": "System MUST set payout readiness of a suspended affiliate's unpaid commission to Manual Review Required with the suspension reason, list it as held in the monthly run without paying it, and clear the hold on reinstatement so all held commission is paid in the next run; only a ban forfeits. Ready, Missing Destination and Invalid Destination are set by the system from the stored bank details", "rationale": "PRD Business Rules, Payment Rule 4; Screen 7"}}
  - {"op": "add_node", "id": "REQ-018-312", "type": "Rule", "owner_fr": "FR-018", "title": "A booking accepted before a status change keeps its commission outcome", "attrs": {"statement": "System MUST keep earning commission for a booking whose quote was accepted with the affiliate's code or link before a status change and whose final payment is confirmed later: held while Suspended, paid in the next run after a normal offboarding, forfeited after a ban", "rationale": "PRD Business Rules, Payment Rule 5"}}
  - {"op": "add_node", "id": "REQ-018-313", "type": "Rule", "owner_fr": "FR-018", "title": "Final balance settles in the next scheduled run and refund reversals carry forward", "attrs": {"statement": "System MUST settle an Inactive affiliate's final balance in the next scheduled run, and carry forward a reversal created by a refund after a payout was Paid, deducting it from later payouts of an active affiliate until it is cleared", "rationale": "PRD Business Rules, Payment Rules 2 and 6"}}
  - {"op": "add_node", "id": "REQ-018-314", "type": "Rule", "owner_fr": "FR-018", "title": "Screen 1 Affiliate Program Settings panel edits the payout day and the performance tier bands", "attrs": {"statement": "System MUST provide an Affiliate Program Settings panel on Screen 1 with the payout day (whole number 1 to 28, applied from the next run) and the performance tier bands, writing an audit entry on each save; who may edit follows the FR-031 permission matrix", "rationale": "PRD Screen 1, Affiliate Program Settings Panel"}}
  - {"op": "add_node", "id": "REQ-018-315", "type": "Rule", "owner_fr": "FR-018", "title": "Affiliate account emails are sent through the notification service", "attrs": {"statement": "System MUST send affiliate account emails through the platform notification service", "rationale": "PRD Business Rules, Rule 17"}}
  - {"op": "add_node", "id": "REQ-018-316", "type": "Rule", "owner_fr": "FR-018", "title": "Generated codes are registered with FR-019, which owns the rejection reasons; FR-018 owns the code on/off status", "attrs": {"statement": "System MUST register codes generated in FR-018 under the affiliate-bound program FR-019 holds, show the reason FR-019 returns on a failed row with retry, keep the FR-018 code status as its own on/off record that FR-019 validation reads, and read usage state from FR-019", "rationale": "PRD Screen 4 and Integration Points"}}
  - {"op": "add_node", "id": "REQ-018-317", "type": "Rule", "owner_fr": "FR-018", "title": "Offboarding type selector and ban flag on Screen 3.3", "attrs": {"statement": "System MUST require an Offboarding type (Normal offboarding or Permanent ban) on Screen 3.3; Permanent ban sets Settlement Outcome to \"Forfeit whole balance (ban)\" and stores a ban flag on the affiliate", "rationale": "PRD Screen 3.3, Business Rules, Rule 16"}}
  - {"op": "add_node", "id": "STP-018-137", "type": "Step", "owner_fr": "FR-018", "title": "System clears the disabled-by-account-status marker so codes that were Active before the suspension work again", "attrs": {"prd_ref": "B3 step 11"}}
  - {"op": "add_node", "id": "STP-018-138", "type": "Step", "owner_fr": "FR-018", "title": "System clears the hold and pays all held commission in the next monthly run", "attrs": {"prd_ref": "B3 step 12"}}
