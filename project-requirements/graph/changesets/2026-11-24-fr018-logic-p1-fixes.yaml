  - {"op": "update_node", "id": "STP-018-110", "title": "Admin reinstates the account from Suspended to Active"}
  - {"op": "update_node", "id": "STP-018-122", "title": "System opens Screen 3.3 and requires an Offboarding type and a reason"}
