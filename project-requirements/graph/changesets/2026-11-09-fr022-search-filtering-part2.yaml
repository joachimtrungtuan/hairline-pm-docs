  - {"op": "add_node", "id": "REQ-022-092", "type": "Rule", "owner_fr": "FR-022", "title": "Search and filter criteria: Provider Reviews List & Filters (FR-013 / Screen 5)", "attrs": {"statement": "FR-013 / Screen 5: Provider Reviews List & Filters [P1 — MVP]. Provider filters their reviews across treatment cases by patient, case, rating, date, response status, and source type. Filters: Patient (Type: Dropdown; Options: All; patients linked to this provider's completed cases; Default: All; Logic: Exact match (supports multi-case patient histories — added in FR-013 v1.7)) / Treatment Case (Type: Dropdown; Options: All; cases for the selected patient (or all cases when patient = All); Default: All; Logic: Exact match) / Rating (Type: Multi-select star chips; Options: 5★, 4★, 3★, 2★, 1★; Default: All; Logic: OR (within field)) / Date Range (Type: Date range picker; Options: Custom; Default: All dates; Logic: Filters by review submission date) / Response Status (Type: Multi-select; Options: No response, Responded; Default: All; Logic: OR (within field)) / Source Type (Type: Multi-select; Options: Patient-submitted, Verified Off-platform; Default: All; Logic: OR (within field)). Notes: No search input on this screen — filtering only.", "rationale": "Screen Specifications (prd.md lines 1007-1027). Screen owned by FR-013 (Provider tenant, Master Reference Table). Search inputs and filter controls are UI controls, not Fields; FR-022 owns the criteria (Maintenance Convention, line 319)."}}
  - {"op": "add_node", "id": "REQ-022-093", "type": "Rule", "owner_fr": "FR-022", "title": "Search and filter criteria: Review Management Dashboard (FR-013 / Screen 7)", "attrs": {"statement": "FR-013 / Screen 7: Review Management Dashboard [P1 — MVP]. Admin filters all platform reviews by date, provider, patient, treatment case, rating, status, source type, flagged status, and response status. Search: Patient / provider / case identifier (Type: text; Placeholder: \"Search reviews…\"; Debounce: 500ms; Min Length: 2 chars; Notes: Case-insensitive). Filters: Date Range (Type: Date range picker; Options: Custom; Default: All dates; Logic: Filters by review submission date) / Provider (Type: Dropdown; Options: All; provider list from DB; Default: All; Logic: Exact match) / Patient (Type: Dropdown; Options: All; patient list from DB; Default: All; Logic: Exact match) / Treatment Case (Type: Dropdown; Options: All; cases scoped by selected patient/provider; Default: All; Logic: Exact match) / Rating (Type: Multi-select star chips; Options: 5★, 4★, 3★, 2★, 1★; Default: All; Logic: OR (within field)) / Review Status (Type: Multi-select; Options: Published, Removed; Default: All; Logic: OR (within field) — updated per FR-013 v1.10 backend-aligned status vocabulary; `Pending Moderation` / `Rejected` removed) / Source Type (Type: Multi-select; Options: Patient-submitted, Verified Off-platform; Default: All; Logic: OR (within field)) / Response Status (Type: Multi-select; Options: No response, Responded; Default: All; Logic: OR (within field)) / Flagged (Type: Toggle; Options: Show flagged only (admin-internal `Flagged` state); Default: Off; Logic: Single flag).", "rationale": "Screen Specifications (prd.md lines 1028-1055). Screen owned by FR-013 (Admin tenant, Master Reference Table). Search inputs and filter controls are UI controls, not Fields; FR-022 owns the criteria (Maintenance Convention, line 319)."}}
