  - {"op": "add_node", "id": "REQ-022-100", "type": "Rule", "owner_fr": "FR-022", "title": "Search and filter criteria: Admin Aftercare Cases List (FR-011 / Screen 13)", "attrs": {"statement": "FR-011 / Screen 13: Admin Aftercare Cases List [P1 — MVP]. Admin searches for and filters all aftercare cases across all providers. Search: Case ID (Type: text; Placeholder: \"Search by case ID…\"; Debounce: 500ms; Notes: Searchable; sortable). Filters: Provider (Type: Dropdown; Options: All; provider list from DB; Default: All; Logic: Exact match) / Milestone (Type: Dropdown; Options: All; milestone names from aftercare plan templates; Default: All; Logic: Exact match) / Case Status (Type: Multi-select; Options: Active, Overdue, Completed; Default: All; Logic: OR (within field)) / Date Range (Type: Date range picker; Options: Custom; Default: All dates; Logic: Filters by aftercare start date) / Risk Level (Type: Multi-select; Options: High, Medium, Low; Default: All; Logic: OR (within field)) / Specialist Assignment (Type: Dropdown; Options: All; aftercare specialists from DB; Default: All; Logic: Exact match) / Completion Rate (Type: Range slider; Options: 0–100%; Default: All; Logic: Min threshold).", "rationale": "Screen Specifications (prd.md lines 1190-1215). Screen owned by FR-011 (Admin tenant, Master Reference Table). Search inputs and filter controls are UI controls, not Fields; FR-022 owns the criteria (Maintenance Convention, line 319)."}}
  - {"op": "add_node", "id": "REQ-022-101", "type": "Rule", "owner_fr": "FR-022", "title": "Search and filter criteria: Installment Plans List (FR-007b / Screen 5)", "attrs": {"statement": "FR-007b / Screen 5: Installment Plans List [P1 — MVP]. Admin filters installment plans by plan status and procedure date range. Filters: Plan Status (Type: Multi-select; Options: Active, Completed, Overdue, Defaulted; Default: All; Logic: OR (within field)) / Procedure Date Range (Type: Date range picker; Options: Custom; Default: All dates; Logic: Filters by procedure date; default sort is nearest upcoming first, overdue/defaulted at top). Notes: No search input on this screen — filtering only.", "rationale": "Screen Specifications (prd.md lines 1222-1238). Screen owned by FR-007B (Admin tenant, Master Reference Table). Search inputs and filter controls are UI controls, not Fields; FR-022 owns the criteria (Maintenance Convention, line 319)."}}
  - {"op": "add_node", "id": "REQ-022-102", "type": "Rule", "owner_fr": "FR-022", "title": "Search and filter criteria: Patient Billing Invoices (FR-017 / Screen 4)", "attrs": {"statement": "FR-017 / Screen 4: Patient Billing Invoices [P1 — MVP]. Admin searches for and filters patient invoices by status and date. Search: Patient name (Type: text; Placeholder: \"Search by patient name…\"; Debounce: 500ms; Notes: Case-insensitive; fuzzy match). Filters: Payment Status (Type: Multi-select; Options: Pending, Partial, Paid, Overdue, Refunded, At Risk; Default: All; Logic: OR (within field)) / Date Range (Type: Date range picker; Options: Custom; Default: Last 30 days; Logic: Filters by invoice date) / Currency (Type: Dropdown; Options: All; configured currency list; Default: All; Logic: Exact match) / Payment Method (Type: Dropdown; Options: All, Full Payment, Installment; Default: All; Logic: Exact match).", "rationale": "Screen Specifications (prd.md lines 1243-1265). Screen owned by FR-017 (Admin tenant, Master Reference Table). Search inputs and filter controls are UI controls, not Fields; FR-022 owns the criteria (Maintenance Convention, line 319)."}}
  - {"op": "add_node", "id": "REQ-022-103", "type": "Rule", "owner_fr": "FR-022", "title": "Search and filter criteria: Transaction Search (FR-017 / Screen 7 / Tab 1)", "attrs": {"statement": "FR-017 / Screen 7 / Tab 1: Transaction Search [P1 — MVP]. Admin searches for any financial transaction using multiple lookup fields and narrows results by type, date, and status. Search: Search By (type selector) (Dropdown; Booking Reference, Invoice Number, Patient Name/ID, Provider Name/ID, Affiliate Name/ID; Booking Reference; Determines search context) / Search Input (Type: text; Placeholder: Auto-updates per \"Search By\" selection; Debounce: 500ms; Notes: Free-text; case-insensitive; scoped to selected type). Filters: Record Type (Type: Multi-select; Options: Invoice, Provider Payout, Installment, Refund, Affiliate Commission; Default: All; Logic: OR (within field)) / Date Range (Type: Date range picker; Options: Custom; Default: All dates; Logic: Filters by transaction date) / Status (Type: Multi-select; Options: Dynamically scoped to selected Record Type(s) — see enumeration below; Default: All; Logic: OR (within field)). Notes: Status options by Record Type (when multiple Record Types are selected, the union of all applicable statuses is shown): Invoice: Pending, Partial, Paid, Overdue, Refunded, At Risk. Provider Payout: Pending, Approved, Paid, Voided, Failed. Installment: Active, Completed, Overdue, Defaulted. Refund: Processing, Completed, Failed. Affiliate Commission: Pending, Paid, Failed, Cancelled.", "rationale": "Screen Specifications (prd.md lines 1266-1298). Screen owned by FR-017 (Admin tenant, Master Reference Table). Search inputs and filter controls are UI controls, not Fields; FR-022 owns the criteria (Maintenance Convention, line 319). The PRD Search By row places the option list in the Placeholder column and the default in the Debounce column; rendered without column labels."}}
