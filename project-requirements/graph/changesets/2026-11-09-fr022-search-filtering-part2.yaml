  - {"op": "add_node", "id": "REQ-022-097", "type": "Rule", "owner_fr": "FR-022", "title": "Search and filter criteria: Provider Management List (FR-015 / Screen 1)", "attrs": {"statement": "FR-015 / Screen 1: Provider Management List [P1 — MVP]. Admin searches for and filters all provider accounts. Search: Provider name / clinic name / email / license number (Type: text; Placeholder: \"Search providers…\"; Debounce: 500ms; Max Length: 200 chars; Notes: Case-insensitive; fuzzy match). Filters: Status (Type: Multi-select; Options: Active, Suspended, Deactivated; Default: Active; Logic: OR (within field); matches FR-015 Screen 1 Default View. Clearing the Status filter shows all statuses) / Featured (Type: Checkbox; Options: Featured only; Default: Off; Logic: Single flag) / Commission Type (Type: Dropdown; Options: All, Percentage, Flat Rate; Default: All; Logic: Exact match) / Date Range (Type: Date range picker + type toggle; Options: Custom; toggle: Creation Date / Last Activity; Default: All dates — Creation Date; Logic: Filters by selected date type).", "rationale": "Screen Specifications (prd.md lines 1124-1146). Screen owned by FR-015 (Admin tenant, Master Reference Table). Search inputs and filter controls are UI controls, not Fields; FR-022 owns the criteria (Maintenance Convention, line 319)."}}
