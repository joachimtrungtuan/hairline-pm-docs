  - {"op": "add_node", "id": "REQ-022-064", "type": "Rule", "owner_fr": "FR-022", "title": "Search control states", "attrs": {"statement": "Search Inactive (default; no input in search field): placeholder text shown; full default list visible; no query fired; dimmed placeholder text and neutral input border. Search Active (user types in search field): typed text visible; clear (×) button appears; debounced query fires (300–500ms per screen spec); list filters to matching results; active input border. These states apply uniformly to every screen; any screen-specific deviation is noted inline under that screen.", "rationale": "Control Behavior Standards table rows Search Inactive and Search Active (prd.md lines 394-395)."}}
  - {"op": "add_node", "id": "REQ-022-065", "type": "Rule", "owner_fr": "FR-022", "title": "Filter control states and reset to defaults", "attrs": {"statement": "Filter Inactive (default; no filters applied): filter button neutral; no filter chips; default query runs; full result set shown. Filter Active (one or more filter controls changed from default): active filter chips shown below filter bar; filter button highlighted; AND-logic applied across all active filters; list narrows; result count updates. Reset Filter (user taps \"Clear Filters\" / \"Reset\" / selects default option): all filter controls return to their default values; chips cleared; all filter parameters cleared; default result set restored; filter icon returns to neutral.", "rationale": "Control Behavior Standards table rows Filter Inactive, Filter Active and Reset Filter (prd.md lines 396-398). Related: REQ-022-008, REQ-022-054, REQ-022-055, REQ-022-056."}}
  - {"op": "add_node", "id": "REQ-022-066", "type": "Rule", "owner_fr": "FR-022", "title": "Within-field OR, across-field AND", "attrs": {"statement": "AND logic applies across different active filter types simultaneously — a result must satisfy all active filter conditions at once. Within a single multi-select filter field, selected values are combined with OR logic — a result matches if it satisfies any of the selected values for that field.", "rationale": "Control Behavior Standards Filter Logic Note (line 400); change log 2.3 item 4."}}
