  - {"op": "add_node", "id": "REQ-022-067", "type": "Rule", "owner_fr": "FR-022", "title": "Search and filter criteria: Provider Selection (FR-003 / Screen 7a) [P2]", "attrs": {"statement": "FR-003 / Screen 7a: Provider Selection [P2 — Post-MVP]. Patient searches for and selects providers during the quote request flow. Search: Provider name / keyword (Type: text; Placeholder: \"Search providers…\"; Debounce: 500ms; Max Length: 50 chars; Notes: Case-insensitive; matches provider name and specialty tags). Filters: Country / Destination (Type: Multi-select chips; Options: Patient's previously selected destination countries; Default: All selected countries; Logic: AND within selection) / Rating (Type: Star selector; Options: All, 4+ stars, 4.5+ stars; Default: All; Logic: Min threshold) / Specialty (Type: Dropdown; Options: Hair Transplant, Beard Transplant, Both; Default: All; Logic: Exact match) / Active Status (Type: Segmented; Options: All, Active Only; Default: Active Only; Logic: Single selection) / Available Capacity (Type: Toggle; Options: Show providers with open appointment slots only; Default: Off; Logic: Single flag).", "rationale": "Screen Specifications (prd.md lines 414-437). Screen owned by FR-003 (Patient tenant, Master Reference Table). Search inputs and filter controls are UI controls, not Fields; FR-022 owns the criteria (Maintenance Convention, line 319). Graph screen: SCR-003-08."}}
  - {"op": "add_node", "id": "REQ-022-068", "type": "Rule", "owner_fr": "FR-022", "title": "Search and filter criteria: Quote Comparison List (FR-005 / Screen 1)", "attrs": {"statement": "FR-005 / Screen 1: Quote Comparison List [P1 — MVP]. Patient sorts and filters complete subquotes across received parent quotes before accepting one subquote. Filters: Sort By (Type: Dropdown; Options: Price (Low–High), Price (High–Low), Graft Count, Rating, Appointment Date, Quote Date; Default: Quote Date (most recent); Logic: Single selection; evaluates subquote-owned values and inherited parent/provider values) / Date Range (Type: Filter chips; Options: Patient's submitted date ranges; Default: All; Logic: Narrows to subquotes whose selected Option/Date-Price Record uses that range). Notes: No search input on this screen — filtering and sorting only.", "rationale": "Screen Specifications (prd.md lines 442-460). Screen owned by FR-005 (Patient tenant, Master Reference Table). Search inputs and filter controls are UI controls, not Fields; FR-022 owns the criteria (Maintenance Convention, line 319). Graph screen: SCR-005-01."}}
  - {"op": "add_node", "id": "REQ-022-069", "type": "Rule", "owner_fr": "FR-022", "title": "Subquote price sort basis, tie-break and ineligible placement", "attrs": {"statement": "Price sorts use each subquote's complete offered price as shown on FR-005 / Screen 1, with any promotion already included; the standard price before promotion and the price per graft are not used for price sorting. For ordering only, each price is converted to the patient's display currency at the current rate; each card still shows its own quote currency, and when the listed subquotes use more than one currency the price order is labelled approximate. Subquotes with the same sort value are ordered by parent quote send date (most recent first), then by option order within the parent quote, then by date range start. Subquotes that cannot currently be accepted (Not Selected, Expired, Withdrawn or Cancelled) stay in the list, shown disabled as in FR-005, and sort after all eligible subquotes. Each list row and each counted result is one subquote.", "rationale": "FR-005 / Screen 1 Sort basis paragraph (line 457). Restated by User Story 5 scenarios 1, 3, 4 and 5. Overlaps REQ-022-058 and REQ-005-027 on currency conversion."}}
