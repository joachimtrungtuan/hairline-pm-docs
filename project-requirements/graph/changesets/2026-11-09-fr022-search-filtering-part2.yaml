  - {"op": "add_node", "id": "REQ-022-112", "type": "Rule", "owner_fr": "FR-022", "title": "Search and filter criteria: Provider Commission Search (FR-029 / Screen 5)", "attrs": {"statement": "FR-029 / Screen 5: Provider Commission Search [P1 — MVP]. Admin searches for a specific provider when configuring provider-specific commission rates. Search: Provider name / ID (Type: text; Placeholder: \"Search provider by name or ID…\"; Debounce: 500ms; Notes: Returns provider record for commission configuration). Notes: No filter controls — search-only functionality for provider selection.", "rationale": "Screen Specifications (prd.md lines 1513-1528). Screen owned by FR-029 (Admin tenant, Master Reference Table). Search inputs and filter controls are UI controls, not Fields; FR-022 owns the criteria (Maintenance Convention, line 319)."}}
  - {"op": "add_node", "id": "REQ-022-113", "type": "Rule", "owner_fr": "FR-022", "title": "Search and filter criteria: Currency Configuration (FR-029 / Screen 6)", "attrs": {"statement": "FR-029 / Screen 6: Currency Configuration [P1 — MVP]. Admin searches for a currency by code or name when configuring platform currencies. Search: Currency code / name (Type: text; Placeholder: \"Filter currencies by code or name…\"; Debounce: 300ms; Max Length: 100 chars; Notes: Real-time filter of currency list). Notes: No filter controls — search/filter input only for narrowing the currency list.", "rationale": "Screen Specifications (prd.md lines 1529-1544). Screen owned by FR-029 (Admin tenant, Master Reference Table). Search inputs and filter controls are UI controls, not Fields; FR-022 owns the criteria (Maintenance Convention, line 319). No lifecycle stage fits this screen; applied at the FR-022 default stage (Batch A Inquiry) provisionally."}}
  - {"op": "add_node", "id": "REQ-022-114", "type": "Rule", "owner_fr": "FR-022", "title": "Search and filter criteria: Notification Rules Dashboard (FR-030 / Screen 1)", "attrs": {"statement": "FR-030 / Screen 1: Notification Rules Dashboard [P1 — MVP]. Admin searches for and filters notification rules by event category and rule status. Search: Event name / template name / recipient type (Type: text; Placeholder: \"Search rules…\"; Debounce: 500ms; Max Length: 100 chars; Notes: Case-insensitive; fuzzy match). Filters: Event Category (Type: Dropdown; Options: All, Account/Auth, Inquiry, Quote, Booking/Schedule, Treatment, Payment, Billing/Payouts, Messaging/Support, Aftercare, Reviews, Promotions/Discounts, Provider/Compliance, System/Operations; Default: All; Logic: Exact match) / Rule Status (Type: Multi-select; Options: Active, Paused, Draft; Default: All; Logic: OR (within field)).", "rationale": "Screen Specifications (prd.md lines 1549-1569). Screen owned by FR-030 (Admin tenant, Master Reference Table). Search inputs and filter controls are UI controls, not Fields; FR-022 owns the criteria (Maintenance Convention, line 319). No lifecycle stage fits this screen; applied at the FR-022 default stage (Batch A Inquiry) provisionally."}}
  - {"op": "add_node", "id": "REQ-022-115", "type": "Rule", "owner_fr": "FR-022", "title": "Search and filter criteria: Admin Users List (FR-031 / Screen 1 / Tab 2)", "attrs": {"statement": "FR-031 / Screen 1 / Tab 2: Admin Users List [P1 — MVP]. Admin searches for and filters admin user accounts. Search: Name / email (Type: text; Placeholder: \"Search admin users…\"; Debounce: 300ms; Notes: Real-time filter; case-insensitive). Filters: Role (Type: Dropdown; Options: All Roles, Super Admin, Aftercare Specialist, Billing Staff, Support Staff; Default: All Roles; Logic: Exact match) / Status (Type: Multi-select; Options: Active, Suspended, Pending Activation, Inactive; Default: All; Logic: OR (within field)).", "rationale": "Screen Specifications (prd.md lines 1574-1594). Screen owned by FR-031 (Admin tenant, Master Reference Table). Search inputs and filter controls are UI controls, not Fields; FR-022 owns the criteria (Maintenance Convention, line 319). No lifecycle stage fits this screen; applied at the FR-022 default stage (Batch A Inquiry) provisionally."}}
  - {"op": "add_node", "id": "REQ-022-116", "type": "Rule", "owner_fr": "FR-022", "title": "Search and filter criteria: Roles & Permissions (FR-031 / Screen 1 / Tab 1)", "attrs": {"statement": "FR-031 / Screen 1 / Tab 1: Roles & Permissions [P1 — MVP]. Admin searches for permissions and filters by category or module. Search: Permission name (Type: text; Placeholder: \"Search permissions…\"; Debounce: 300ms; Notes: Real-time filter on permission name). Filters: Category (Type: Dropdown; Options: All; admin-defined permission categories; Default: All; Logic: Exact match) / Module (Type: Dropdown; Options: All; platform modules (Patient, Provider, Admin, System); Default: All; Logic: Exact match).", "rationale": "Screen Specifications (prd.md lines 1595-1615). Screen owned by FR-031 (Admin tenant, Master Reference Table). Search inputs and filter controls are UI controls, not Fields; FR-022 owns the criteria (Maintenance Convention, line 319). No lifecycle stage fits this screen; applied at the FR-022 default stage (Batch A Inquiry) provisionally."}}
  - {"op": "add_node", "id": "REQ-022-117", "type": "Rule", "owner_fr": "FR-022", "title": "Search and filter criteria: Admin Activity Audit Trail (FR-031 / Screen 5)", "attrs": {"statement": "FR-031 / Screen 5: Admin Activity Audit Trail [P1 — MVP]. Admin filters the admin user activity log by action type, date, and outcome. Filters: Action Type (Type: Multi-select; Options: Platform-defined admin action types (per FR-031); Default: All; Logic: OR (within field)) / Date Range (Type: Date range picker; Options: Custom; Default: Last 30 days; Logic: Filters by action timestamp) / Outcome (Type: Multi-select; Options: Success, Failed, Denied; Default: All; Logic: OR (within field)). Notes: No search input on this screen — filtering only.", "rationale": "Screen Specifications (prd.md lines 1616-1633). Screen owned by FR-031 (Admin tenant, Master Reference Table). Search inputs and filter controls are UI controls, not Fields; FR-022 owns the criteria (Maintenance Convention, line 319). No lifecycle stage fits this screen; applied at the FR-022 default stage (Batch A Inquiry) provisionally."}}
  - {"op": "add_node", "id": "REQ-022-118", "type": "Rule", "owner_fr": "FR-022", "title": "Search and filter criteria: FAQ Management (FR-033 / Screen 2)", "attrs": {"statement": "FR-033 / Screen 2: FAQ Management [P1 — MVP]. Admin searches for and filters FAQ entries in the Help Centre. Search: Question text (Type: text; Placeholder: \"Search FAQ questions…\"; Debounce: 500ms; Notes: Fuzzy match on question content). Filters: Topic (Type: Dropdown; Options: All; admin-defined FAQ topics; Default: All; Logic: Exact match) / Status (Type: Multi-select; Options: Draft, Published, Archived; Default: All; Logic: OR (within field)) / Audience (Type: Dropdown; Options: All, Patient, Provider; Default: All; Logic: Exact match).", "rationale": "Screen Specifications (prd.md lines 1638-1659). Screen owned by FR-033 (Admin tenant, Master Reference Table). Search inputs and filter controls are UI controls, not Fields; FR-022 owns the criteria (Maintenance Convention, line 319). No lifecycle stage fits this screen; applied at the FR-022 default stage (Batch A Inquiry) provisionally."}}
  - {"op": "add_node", "id": "REQ-022-119", "type": "Rule", "owner_fr": "FR-022", "title": "Search and filter criteria: Article Management (FR-033 / Screen 3)", "attrs": {"statement": "FR-033 / Screen 3: Article Management [P1 — MVP]. Admin searches for and filters help articles. Search: Article title (Type: text; Placeholder: \"Search articles…\"; Debounce: 500ms; Notes: Fuzzy match on title). Filters: Article Type (Type: Dropdown; Options: All, Tutorial Guide, Troubleshooting Tip; Default: All; Logic: Exact match) / Category / Tags (Type: Multi-select; Options: Admin-defined article categories; Default: All; Logic: OR (within field)) / Status (Type: Multi-select; Options: Draft, Published, Archived; Default: All; Logic: OR (within field)) / Audience (Type: Dropdown; Options: All, Patient, Provider; Default: All; Logic: Exact match).", "rationale": "Screen Specifications (prd.md lines 1660-1682). Screen owned by FR-033 (Admin tenant, Master Reference Table). Search inputs and filter controls are UI controls, not Fields; FR-022 owns the criteria (Maintenance Convention, line 319). No lifecycle stage fits this screen; applied at the FR-022 default stage (Batch A Inquiry) provisionally."}}
  - {"op": "add_node", "id": "REQ-022-120", "type": "Rule", "owner_fr": "FR-022", "title": "Search and filter criteria: Resource Management (FR-033 / Screen 4)", "attrs": {"statement": "FR-033 / Screen 4: Resource Management [P1 — MVP]. Admin searches for and filters downloadable help resources. Search: Resource name (Type: text; Placeholder: \"Search resources…\"; Debounce: 500ms; Notes: Fuzzy match on name). Filters: Category (Type: Dropdown; Options: All; admin-defined resource categories; Default: All; Logic: Exact match) / File Type (Type: Multi-select; Options: PDF, Video, Image, Link, and others as configured; Default: All; Logic: OR (within field)) / Status (Type: Multi-select; Options: Draft, Published, Archived; Default: All; Logic: OR (within field)) / Audience (Type: Dropdown; Options: All, Patient, Provider; Default: All; Logic: Exact match).", "rationale": "Screen Specifications (prd.md lines 1683-1705). Screen owned by FR-033 (Admin tenant, Master Reference Table). Search inputs and filter controls are UI controls, not Fields; FR-022 owns the criteria (Maintenance Convention, line 319). No lifecycle stage fits this screen; applied at the FR-022 default stage (Batch A Inquiry) provisionally."}}
  - {"op": "add_node", "id": "REQ-022-121", "type": "Rule", "owner_fr": "FR-022", "title": "Search and filter criteria: Video Management (FR-033 / Screen 5)", "attrs": {"statement": "FR-033 / Screen 5: Video Management [P1 — MVP]. Admin searches for and filters help videos. Search: Video title (Type: text; Placeholder: \"Search videos…\"; Debounce: 500ms; Notes: Fuzzy match on title). Filters: Category / Tags (Type: Multi-select; Options: Admin-defined video categories; Default: All; Logic: OR (within field)) / Status (Type: Multi-select; Options: Draft, Published, Archived; Default: All; Logic: OR (within field)) / Source Type (Type: Dropdown; Options: All, Uploaded, YouTube, Vimeo, and other configured sources; Default: All; Logic: Exact match) / Audience (Type: Dropdown; Options: All, Patient, Provider; Default: All; Logic: Exact match).", "rationale": "Screen Specifications (prd.md lines 1706-1728). Screen owned by FR-033 (Admin tenant, Master Reference Table). Search inputs and filter controls are UI controls, not Fields; FR-022 owns the criteria (Maintenance Convention, line 319). No lifecycle stage fits this screen; applied at the FR-022 default stage (Batch A Inquiry) provisionally."}}
  - {"op": "add_node", "id": "REQ-022-122", "type": "Rule", "owner_fr": "FR-022", "title": "Search and filter criteria: Communication Monitoring Center (FR-012 / Screen 5)", "attrs": {"statement": "FR-012 / Screen 5: Communication Monitoring Center [P1 — MVP]. Admin searches for and filters all platform conversations for oversight and support. Search: Patient / provider / keyword / inquiry ID (Type: text; Placeholder: \"Search conversations…\"; Min Length: 2 chars; Debounce: 300ms; Notes: Searches across all four fields simultaneously). Filters: Patient (Type: Autocomplete; Options: Matching patient names; Default: None; Logic: Exact selection) / Provider (Type: Autocomplete; Options: Matching provider names; Default: None; Logic: Exact selection) / Service Type (Type: Multi-select; Options: All; platform-defined service types; Default: All; Logic: OR (within field)) / Quote ID (text (optional); \"Filter by quote ID…\"; —; Optional exact match) / Inquiry ID (text (optional); \"Filter by inquiry ID…\"; —; Optional exact match) / Date Range (Type: Date range picker + presets; Options: Custom; Today, Last 7 days, Last 30 days, All; Default: All; Logic: Filters by message date) / Flag Type (Type: Multi-select; Options: Keyword Flagged, Manually Flagged, Intervened, No Flags; Default: All; Logic: OR (within field)) / Conversation Status (Type: Multi-select; Options: Active, Resolved, Escalated; Default: All; Logic: OR (within field)).", "rationale": "Screen Specifications (prd.md lines 1735-1761). Screen owned by FR-012 (Admin tenant, Master Reference Table). Search inputs and filter controls are UI controls, not Fields; FR-022 owns the criteria (Maintenance Convention, line 319)."}}
  - {"op": "add_node", "id": "REQ-022-123", "type": "Rule", "owner_fr": "FR-022", "title": "Search and filter criteria: Support Center Dashboard (FR-034 / Screen 1)", "attrs": {"statement": "FR-034 / Screen 1: Support Center Dashboard [P1 — MVP]. Admin searches for and filters all support tickets from patients and providers. Search: Case ID / patient name / provider name / email / title keywords (Type: text; Placeholder: \"Search support cases…\"; Min Length: 3 chars; Debounce: 300ms; Notes: Real-time search across all listed fields). Filters: Status (Type: Multi-select; Options: Open, In Progress, Closed, On Hold, Escalated; Default: Open + In Progress; Logic: OR (within field)) / Priority (Type: Multi-select; Options: High, Medium, Low; Default: All; Logic: OR (within field)) / Category (Type: Dropdown; Options: All; admin-defined ticket categories; Default: All; Logic: Exact match) / Ticket Source (Type: Dropdown; Options: All, Patient App, Provider App, Admin Portal; Default: All; Logic: Exact match) / Submitter Type (Type: Dropdown; Options: All, Patient, Provider; Default: All; Logic: Exact match) / Date Range (Type: Date range picker; Options: Custom; Default: Last 30 days; Logic: Filters by ticket creation date) / Assigned Admin (Type: Dropdown; Options: All; admin user list; Default: All; Logic: Exact match).", "rationale": "Screen Specifications (prd.md lines 1766-1791). Screen owned by FR-034 (Admin tenant, Master Reference Table). Search inputs and filter controls are UI controls, not Fields; FR-022 owns the criteria (Maintenance Convention, line 319)."}}
