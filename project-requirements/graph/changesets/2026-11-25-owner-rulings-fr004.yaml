# Owner ruling 2026-11-25 (final): a replacement quote expires like any other quote. Mirrors FR-004 PRD v4.6.
# FR-004 Workflow 7 / Screen 8: Save and Continue is the replacement quote's first send (draft -> sent, FR-026 expiry captured); acceptance moves sent -> accepted; unaccepted -> expired with quote.expired once.
# Rules updated: REQ-004-002, REQ-004-036, REQ-004-039, REQ-004-048, REQ-004-050 (title too), REQ-004-082 (title too), REQ-004-111 (title, statement, rationale).
# Fields updated: ENT-quote.expires_at, ENT-quote.first_sent_at. Screens updated: SCR-004-02, SCR-004-07, SCR-004-08. Steps updated: STP-004-117, STP-004-125, STP-004-126 (text is the title).
# No nodes or edges added or retired. Not applied yet: write.py, lint.py and export.py are run by the controller.
reason: "Owner ruling 2026-11-25 (final): an admin-authored replacement quote expires like any other quote under the FR-026 quote expiry setting captured at first send; FR-004 (Save and Continue is the first send) is aligned with FR-005 REQ-005-045 and FR-006 REQ-006-018 and REQ-006-082"
by: docs-manager
operations:
  - {"op": "update_node", "id": "REQ-004-002", "attrs": {"statement": "System MUST enforce the admin-controlled FR-026 expiry window (default 48h), captured at first send, and compute the deadline per sent quote. The only renewal is the admin restore of an expired quote (REQ-004-105). The admin-authored replacement quote follows the same window from its first send on Screen 8 (REQ-004-082)."}}
  - {"op": "update_node", "id": "REQ-004-036", "attrs": {"statement": "System MUST capture the quote expiry and quote currency read-only at first send from the FR-026 quote configuration. Drafts MUST carry neither, and there MUST be no per-quote expiry extension other than the admin restore of an expired quote (REQ-004-105). The admin-authored replacement quote captures its expiry at its first send, which is Save and Continue on Screen 8, and its currency at its first Screen 8 save (REQ-004-082)."}}
  - {"op": "update_node", "id": "REQ-004-039", "attrs": {"statement": "System MUST emit `quote.expiring_soon` once per expiry window of a sent parent quote when it reaches the FR-026 quote-expiring-soon lead time, and MUST NOT emit it for draft, accepted, or terminal quotes, including the replacement quote, which the patient does not compare. A lead time raised after the send applies only to reminders not yet sent; a reminder whose time has already passed is skipped, not sent late (REQ-026-031)."}}
  - {"op": "update_node", "id": "REQ-004-048", "attrs": {"statement": "During an FR-006 provider-fault transfer before treatment starts, System MUST let an admin author a replacement quote for the replacement provider inside the same inquiry through Screen 8, with a mandatory reason and full audit. The quote MUST be marked admin-authored for a replacement and linked to the AcceptanceEvent it replaces, MUST NOT be offered for patient comparison, MUST stay hidden from the replacement provider and the patient until it is accepted (a `draft` until Save and Continue sends it, then `sent`), MUST be editable only on Screen 8 and be excluded from Screen 2 and Screen 7, MUST NOT emit `quote.submitted`, and MUST be the target of the FR-005 admin-authored replacement acceptance."}}
  - {"op": "update_node", "id": "REQ-004-050", "title": "Replacement quote pricing, expiry and ending the case", "attrs": {"statement": "System MUST NOT attach an automatic FR-019 promotion to an admin-authored replacement quote or take a promotion usage reservation for it; the admin sets the replacement price directly, so the replacement quote carries no promotion, and the use held by the original acceptance's promotion, which FR-019 marks Superseded, returns to the usage limit. A replacement quote MUST NOT emit `quote.expiring_soon`; Save and Continue sends it, it expires under the normal quote expiry if the admin does not record the replacement acceptance first (REQ-004-082), and a replacement draft that was never sent follows the 7-day draft rule. It MUST leave the inquiry flagged `supportRequired` without cancelling it automatically, and the admin MAY author another replacement quote, close the inquiry with Close inquiry on FR-006 Screen 6 when the booking is already `Cancelled` with the marker, or cancel through FR-006 Alternative Flow B2 (Screen 9) when the fault is still pending."}}
  - {"op": "update_node", "id": "REQ-004-082", "title": "Replacement quote expires like any other quote, fixes its currency at first save and is accepted by the admin", "attrs": {"statement": "A replacement quote MUST expire like any other quote. Its currency MUST be captured from the active FR-026 quote configuration at the first Screen 8 save, shown on Screen 8, and fixed after that. Save Draft keeps it a `draft` with no expiry; Save and Continue is its first send, which moves it to `sent`, records the first-send time, copies the FR-026 quote expiry setting (default 48 hours) onto it, and computes the expiry from that moment. If the admin does not record the replacement acceptance before the expiry, the quote moves to `expired` and `quote.expired` is emitted once, and the admin authors a new replacement quote. When the admin records the replacement acceptance, the quote moves from `sent` to `accepted`. This acceptance MUST NOT run the cancel-other-quotes cascade: the original quote keeps its status, and every other open replacement quote of the inquiry, draft or sent, is cancelled as `cancelled_other_accepted` silently, with no notice to its provider."}}
  - {"op": "update_node", "id": "REQ-004-111", "title": "An open replacement quote is cancelled without notice when an admin closes or cancels the inquiry", "attrs": {"statement": "When an admin closes the inquiry (Close inquiry on FR-006 Screen 6) or cancels it (FR-006 Screen 9), System MUST move any open replacement quote (draft or sent) of that inquiry to `cancelled_inquiry_cancelled`, MUST NOT send `quote.cancelled_inquiry` to the replacement provider, and no `quote.expired` follows. The cascade trigger is owned by FR-003 (REQ-003-013) and FR-006.", "rationale": "The replacement quote is admin-authored and never offered to the patient, so the provider is not told and the cancellation, not expiry, ends it."}}
  - {"op": "update_node", "id": "ENT-quote.expires_at", "attrs": {"description": "Computed at first send from the FR-026 quote expiry setting; null on drafts, and for an admin-authored replacement quote the first send is Save and Continue on Screen 8; no per-quote extension; shown as \"set on first send\" while drafting."}}
  - {"op": "update_node", "id": "ENT-quote.first_sent_at", "attrs": {"description": "Set once on the first send; for an admin-authored replacement quote, set when the admin chooses Save and Continue on Screen 8 and the draft moves to sent; never changed by a re-send or new version; null on drafts. FR-014 Time to First Quote reads it."}}
  - {"op": "update_node", "id": "SCR-004-08", "attrs": {"description": "Admin authors a quote for the replacement provider during an FR-006 provider-fault transfer, pending or closed, opened only from the transfer and blocked with a message that names the failed check; the quote is a draft with no expiry until Save and Continue sends it and starts the normal quote expiry, hidden from the provider and the patient throughout, with its currency captured at the first save and fixed after, and Screen 8 is its only edit surface; Save and Continue confirms the summary, sends the quote and returns to FR-006 to record the acceptance before it expires."}}
  - {"op": "update_node", "id": "SCR-004-02", "attrs": {"description": "Provider views all quotes in a single unified list with no tabs, reflecting global case statuses; actions (Edit, Soft Delete for drafts only, View Details) are state-aware; cancelled quotes are greyed out with a badge and all actions disabled; the admin-authored replacement quote is not listed."}}
  - {"op": "update_node", "id": "SCR-004-07", "attrs": {"description": "Admin performs inline edits with audit on draft, sent, and accepted quotes, with a mandatory reason; price, currency, and promotion stay read-only once accepted, an edit after acceptance is stored as a new version beside the unchanged acceptance snapshot, and edits of the accepted quote are blocked while the booking carries a provider-fault marker, except admin notes; the replacement quote is not offered, because Screen 8 is its only edit surface."}}
  - {"op": "update_node", "id": "STP-004-117", "title": "Admin builds the replacement quote; its currency is captured at the first save and fixed after; Save Draft keeps it a draft with no expiry and Save and Continue sends it and starts the normal quote expiry; no promotion and no notice; hidden from the provider and the patient"}
  - {"op": "update_node", "id": "STP-004-125", "title": "System moves the replacement quote from sent to accepted after the FR-005 acceptance record, keeps the original quote's status, and cancels other open replacement quotes silently as cancelled_other_accepted"}
  - {"op": "update_node", "id": "STP-004-126", "title": "Platform Admin closes or cancels the inquiry (FR-006 Screen 6 Close inquiry or Screen 9); any open replacement quote is cancelled with no notice to its provider"}
