  - {op: update_field, id: ENT-conversation.status, calculated_by: REQ-012-109}
  - {op: update_node, id: ENT-conversation.status, attrs: {description: "Calculated from the conversation's flags, with no manual control: Escalated while a flag is escalated to intervention, Resolved when all flags are closed, otherwise Active (REQ-012-109). Used by the Monitoring Center filter."}}
  - {op: update_node, id: ENT-conversation.partner, attrs: {description: "The other party's name, worked out from the provider name; a shown value, not stored separately."}}
  - {op: update_node, id: ENT-flag.status, attrs: {description: "Active, resolved, escalated to intervention, or intervention completed; a flag marked Resolved - No Action Needed shows as resolved."}}
  - {op: add_enum_value, field_id: ENT-flag.status, value: intervention_completed, label: Intervention completed}
  - {op: update_node, id: ENT-flag.category, attrs: {description: "Manual flags only: Off-Platform Risk, Potential Dispute, Quality Concern, Follow-Up Needed or Other. Automatic keyword flags carry matched_keyword instead."}}
  - {op: add_field, id: ENT-flag.matched_keyword, entity_id: ENT-flag, name: matched_keyword, data_type: text, title: Matched keyword, owner_fr: FR-012, required: false, attrs: {description: "The keyword that matched; set on automatic keyword flags only."}}
  - {op: update_node, id: ENT-flag.admin_user, attrs: {description: "Admin who created a manual flag; empty on the Follow-Up Needed flag the system creates after 72 hours without a provider response."}}
  - {op: update_node, id: ENT-message.text, attrs: {description: "Message body, max 2000 characters; optional, because text or at least one attachment is needed to send (a message may be attachment-only)."}}
  - {op: add_edge, from: SCR-012-04, verb: shows, to: ENT-conversation.keyword_flags, attrs: {provenance: retrieved, label: "Flag indicator (warning icon if keyword-flagged)"}}
