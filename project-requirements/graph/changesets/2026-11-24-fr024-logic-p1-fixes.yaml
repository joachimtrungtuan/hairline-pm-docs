# FR-024 logic review pass 1: ruled fixes applied to the PRD (Treatment and Package Management). New rule, flows and steps come first, then removals, updates and new edges.
# Cross-FR edges: removes STP-024-086 next STP-004-006 (FR-004 step, edge only; FR-004 is not edited); adds FR-024 references to REQ-004-056, REQ-004-058 and REQ-021-119 (rules owned by FR-004 and FR-021). No FR-030, FR-031, FR-026 or FR-022 nodes are touched.
# Queued for other FRs, not done here: FR-004 (line 318 wording, REQ-004-059 scope, Not Offered effect), FR-030 (three catalogue rows), FR-031 and FR-009 (permission matrix), FR-026 (rate-limit setting entries), FR-022 (list ordering), FR-021 (treatment-library key group).
# Left alone on purpose: minor observations; the stored chosen status has no ENT-treatment field (stated in the rule and field description only).
reason: "FR-024 logic review pass 1: first-Active notice by any route and reactivation notice, Deactivate only on Active records, Draft only for a never-Active package, versions only on a successful Update, open-quote warning on every route to Inactive, open booking count in the treatment warning, Offered-only availability and Not Offered effect, Number of Providers counts Offered configurations of Active providers, packages not tied to a treatment, stored chosen status restored on a retried upload and failed edit upload keeping the live version, creation-limit message and counting rule, permission-gated actions named, FR-021 translation approach, and short flows for the admin screens, Quick Copy Pricing, quick price edit and bulk actions."
by: docs-manager
