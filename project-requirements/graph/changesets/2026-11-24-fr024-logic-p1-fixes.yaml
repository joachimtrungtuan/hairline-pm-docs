  - {"op": "update_node", "id": "STP-024-048", "title": "System stores the provider-specific pricing configuration"}
  - {"op": "update_node", "id": "STP-024-049", "title": "Treatment becomes available for the provider to select when creating quotes only while its status is Offered"}
