  - {"op": "update_node", "id": "STP-024-080", "title": "Provider sets the package status Active or Inactive (default Active), or saves the package as a draft (only for a package never Active); the form also auto-saves a draft every 30 seconds without creating a version"}
  - {"op": "update_node", "id": "STP-024-084", "title": "System saves the package as version 1 linked to the provider account; a draft has no version until it is first saved as Active or Inactive"}
