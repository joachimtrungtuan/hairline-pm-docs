# FR-022 logic review pass 2: graph change-set mirroring the revised PRD
# New: rules REQ-022-144 (FR-009 Screen 1, clinic team list), REQ-022-145 (FR-029 Screen 2A, currency pair list) and REQ-022-146 (FR-029 Screen 3, provider search on deposit rates), each with its stage, actor, screen and source edges. REQ-022-074 (FR-009 Screen 10) moves from the provider platform to the admin platform (stage and actor edges replaced), and REQ-022-044 now points to FR-009 Screen 1.
# Cross-FR edges: edges from FR-022 rules to FR-009 screens SCR-009-01 and SCR-009-10 (removed), FR-029 screens SCR-029-02 and SCR-029-04. No node owned by another FR is updated.
# Queued for other FRs, not done here: the neighbour items listed in the ledger section (FR-009 Screen 10 role compatibility and the Invited badge wording, FR-011 and FR-019 owner wording checks, FR-029 Screen 2A and Screen 5 text, FR-033 and FR-034 owner lists). Left alone on purpose: the wiring of the two search-limit steps (one stage per step) and the minor observations in the ledger leftovers.
reason: "FR-022 logic review pass 2: screen criteria mirror the owning FRs again (support center filters and search scope, promotion status list, aftercare case status with Overdue only and Urgent only, help content status, article, resource and video values, analytics country filter without a benchmarks toggle); FR-009 Screen 10 becomes an admin screen and the clinic team list gets its own rule; FR-029 currency pair list, deposit rate provider search and the commission search eligibility rule added; the search audit log rule says patient and provider records; message, conversation and support searches use 500ms."
by: docs-manager
