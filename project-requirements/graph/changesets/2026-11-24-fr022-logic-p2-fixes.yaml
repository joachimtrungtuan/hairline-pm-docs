  - {"op": "update_node", "id": "REQ-022-123", "attrs": {"statement": "FR-034 / Screen 1: Support Center Dashboard [P1 — MVP]. Admin searches for and filters all support tickets from patients and providers. Search: Case ID / patient name / provider name / email / phone / title and description keywords (Type: text; Placeholder: \"Search support cases…\"; Min Length: 3 chars; Debounce: 500ms; Notes: Real-time search across all listed fields). Filters: Status (Type: Multi-select; Options: Open, In Progress, Resolved, Closed; Default: Open + In Progress; Logic: OR (within field)) / Priority (Type: Multi-select; Options: Low, Medium, High, Urgent; Default: All; Logic: OR (within field)) / Category (Type: Dropdown; Options: All; admin-defined ticket categories; Default: All; Logic: Exact match) / Ticket Source (Type: Multi-select; Options: Patient App, Provider Portal, Manual Admin Entry; Default: All; Logic: OR (within field)) / Submitter Type (Type: Multi-select; Options: Patient, Provider, Admin; Default: All; Logic: OR (within field)) / Date Range (Type: Date range picker; Options: Custom; Default: Last 90 days; Logic: Filters by ticket creation date) / Assigned To (Type: Dropdown; Options: All Users; admin user list; Default: All Users; Logic: Exact match) / Request Type (Type: Multi-select; Options: Booking Cancellation, Booking Change; Default: All; Logic: OR (within field)) / Request Status (Type: Multi-select; Options: Open, Resolved, Declined; Default: All; Logic: OR (within field))."}}
  - {"op": "update_node", "id": "REQ-022-122", "attrs": {"statement": "FR-012 / Screen 5: Communication Monitoring Center [P1 — MVP]. Admin searches for and filters all platform conversations for oversight and support. Search: Patient / provider / keyword / inquiry ID (Type: text; Placeholder: \"Search conversations…\"; Min Length: 2 chars; Debounce: 500ms; Notes: Searches across all four fields simultaneously). Filters: Patient (Type: Autocomplete; Options: Matching patient names; Default: None; Logic: Exact selection) / Provider (Type: Autocomplete; Options: Matching provider names; Default: None; Logic: Exact selection) / Service Type (Type: Multi-select; Options: All; platform-defined service types; Default: All; Logic: OR (within field)) / Quote ID (text (optional); \"Filter by quote ID…\"; —; Optional exact match) / Inquiry ID (text (optional); \"Filter by inquiry ID…\"; —; Optional exact match) / Date Range (Type: Date range picker + presets; Options: Custom; Today, Last 7 days, Last 30 days, All; Default: All; Logic: Filters by message date) / Flag Type (Type: Multi-select; Options: Keyword Flagged, Manually Flagged, Intervened, No Flags; Default: All; Logic: OR (within field)) / Conversation Status (Type: Multi-select; Options: Active, Resolved, Escalated; Default: All; Logic: OR (within field)). Active filters combine, and the filters are remembered."}}
  - {"op": "update_node", "id": "REQ-022-059", "attrs": {"statement": "Patient Platform: [P2] Provider Search is accessed when the patient begins the quote request flow and needs to select destination/providers, is triggered from the \"Choose Destination\" or \"Select Providers\" screens, and is available throughout the quote request journey for comparison; [P2] Messaging search is accessed from the patient communications inbox once FR-012 messaging is scheduled; [P1] Help & Support search is accessed from the Help & Support hub, Help Center, and My Support Tickets screens. Provider Platform: PR-01 (Team) from Provider Dashboard → Team tab → Team Management Dashboard (FR-009/Screen 1); PR-02 (Inquiries/Quotes) from Provider Dashboard → Inquiries tab → Inquiry List (FR-003/Screen 9) and Quotes List (FR-004/Screen 2); PR-03 (Treatment) from Provider Dashboard → Treatments tab → In Progress Cases (FR-010/Screen 3); PR-04 (Aftercare) from Provider Dashboard → Aftercare tab → Aftercare Cases List (FR-011/Screen 8); PR-05 (Analytics) from Provider Dashboard → Analytics tab → Analytics Dashboard (FR-014/Screen 1); PR-06 (Profile/Settings) from Provider Dashboard → Profile/Settings section — Packages (FR-024/Screen 4), Help Centre (FR-032/Screen 5), Reviews (FR-032/Screen 1 Tab 5), Support Cases (FR-032/Screen 5.7); PR-07 (Messaging) [P2 - Post-MVP] from the provider secure messaging inbox once FR-012 is scheduled. Admin Platform [P1 - MVP]: each admin module (A-01 through A-10) provides context-specific search and filtering within its own interface."}}
