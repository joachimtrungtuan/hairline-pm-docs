  - {"op": "update_node", "id": "REQ-022-106", "attrs": {"statement": "FR-019 / Screen 1: Promotion Program Hub [P1 — MVP]. Admin searches for and filters all promotion programs across the platform, including Admin-via-Provider, Provider Self-Created, and Hairline-Funded & Direct-Issued programs. Search: Code / keyword (Type: text; Placeholder: \"Search promotion programs…\"; Debounce: 500ms; Notes: Minimum 2 characters; case-insensitive; fuzzy match on code text, program name, and keyword). Filters: Program Type (Type: Multi-select; Options: Admin-via-Provider, Provider Self-Created, Hairline-Funded & Direct-Issued; Default: All; Logic: OR (within field)) / Scope (Type: Multi-select; Options: Reusable, Ad-Hoc Quote-Bound; Default: All; Logic: OR (within field)) / Status (Type: Multi-select; Options: Draft, Active, Paused, Expired, Archived; Default: All; Logic: OR (within field)) / Funding Model (Type: Multi-select; Options: Both Fees, Hairline Only, Provider Only; Default: All; Logic: OR (within field)) / Provider Participation (Type: Dropdown; Options: All; provider list from DB; Default: All; Logic: Exact match) / Date Range (Type: Date range picker; Options: Custom; Default: All dates; Logic: Filters by active window overlap) / Usage (Type: Range; Options: 0–Max; Default: All; Logic: Min–Max usage count) / ROI (Type: Dropdown; Options: All; admin-defined ROI tiers; Default: All; Logic: Exact match)."}}
