  - {"op": "update_node", "id": "REQ-022-085", "attrs": {"statement": "FR-012 / Screen 3: Provider Messages List [P1 — MVP]. Provider searches for and filters their patient conversations from the header messages list. Search: Patient ID / inquiry or quote ID / message content (Type: text; Placeholder: \"Search messages…\"; Min Length: 2 chars; Debounce: 500ms; Notes: Filters the conversation list in real time; case-insensitive fuzzy match across Patient ID, inquiry/quote ID, and message content; the patient name is searchable only once the patient has confirmed payment (REQ-022-026)). Filters: Read Status (Type: Toggle; Options: All, Unread Only; Default: All; Logic: Exact match) / Date Range (Type: Dropdown; Options: Today, Last 7 days, Last 30 days, All; Default: All; Logic: Filters by activity date) / Service Type (Type: Dropdown; Options: All; options from service catalog; Default: All; Logic: Exact match)."}}
  - {"op": "update_node", "id": "REQ-022-090", "attrs": {"statement": "FR-006 / Screen 5: Admin Bookings Table [P1 — MVP]. Admin searches for and filters all bookings across the platform. Search: Booking reference / patient name / patient email / provider name (Type: text; Placeholder: \"Search bookings…\"; Debounce: 500ms; Notes: Case-insensitive; fuzzy match). Filters: Booking Status (Type: Multi-select; Options: Accepted, Payment Window Expired, Confirmed, In Progress, Aftercare, Completed, Cancelled; Default: All; Logic: OR (within field)) / Provider (Type: Dropdown; Options: All; provider list from DB; Default: All; Logic: Exact match) / Date Range (Type: Date range picker; Options: Custom; Default: All dates; Logic: Filters by appointment date) / Treatment Type (Type: Dropdown; Options: All, Hair Transplant, Beard Transplant, Both; Default: All; Logic: Exact match) / Payment Status (Type: Multi-select; Options: Unpaid, Deposit Only, Installments Active, Full Paid, Refunded (the payment status list owned by FR-007); Default: All; Logic: OR (within field)) / Deposit Status (Type: Multi-select; Options: Pending, Paid, Partial; Default: All; Logic: OR (within field))."}}
