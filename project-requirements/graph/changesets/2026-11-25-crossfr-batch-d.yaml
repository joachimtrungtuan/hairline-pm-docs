# Cross-FR alignment, batch D (FR-004, FR-005, FR-006): graph change-set mirroring the revised PRDs
reason: "Cross-FR alignment of the quote submission, quote acceptance and booking PRDs with the neighbouring FRs: legal acceptance gating (REQ-004-112, REQ-005-066), settings and terms blocking (REQ-005-067, REQ-006-013), promotion and discount wording, clinician replacement, reminder skipping, Close inquiry notices, Travel entry, patient suspension cause (REQ-006-084), aftercare completion, and payout shortfall wording."
by: docs-manager
operations:
  - {"op": "add_node", "id": "REQ-004-112", "type": "Rule", "owner_fr": "FR-004", "title": "A provider who has not accepted the current legal documents cannot submit a quote", "attrs": {"statement": "A provider who has not accepted the current legal documents MUST NOT be able to submit a quote (first send or re-send). The acceptance prompt of FR-027 is shown and the draft is kept unchanged; creating and editing a draft is not blocked (REQ-027-033).", "rationale": "prd.md Workflow 1 legal acceptance check; creating and editing a draft stays open"}}
  - {"op": "add_node", "id": "REQ-005-066", "type": "Rule", "owner_fr": "FR-005", "title": "Acceptance waits for the patient's legal document acceptance", "attrs": {"statement": "System MUST block the patient's confirmation of an acceptance until the patient has accepted the current legal documents, showing the FR-027 acceptance prompt; viewing and comparing quotes stay available (REQ-027-033).", "rationale": "prd.md General Module Rules and Screen 2 Accept Button; viewing and comparing stay available"}}
  - {"op": "add_node", "id": "REQ-005-067", "type": "Rule", "owner_fr": "FR-005", "title": "Acceptance is blocked and retryable when terms text or the Settings API is missing", "attrs": {"statement": "System MUST block acceptance with a message, and let the patient retry, when the acceptance terms text (FR-026 A-09) has not been set, or when the Settings API is unavailable as the slot hold is placed; no stale or guessed hold duration is used and no AcceptanceEvent is created (REQ-026-118, REQ-026-144).", "rationale": "prd.md General Module Rules; no stale or guessed hold duration and no AcceptanceEvent"}}
  - {"op": "add_node", "id": "REQ-006-084", "type": "Rule", "owner_fr": "FR-006", "title": "A patient suspension cascade cancels a booking with the cause Patient account suspended", "attrs": {"statement": "When the FR-016 suspension cascade cancels a patient's `Accepted`, `Payment Window Expired` or `Confirmed` booking, System MUST cancel it through the admin booking cancellation with the cause \"Patient account suspended\" (admin-initiated, request source Admin, the acting admin carried from FR-016) and the fixed reason \"Booking cancelled because the patient account was suspended\" sent to the patient and the provider, keep the admin justification in the audit entry only, and refund by the refund ladder set in FR-029, or by the provider-fault terms where the provider is at fault (REQ-016-219).", "rationale": "prd.md Alternative Flow B2, Screen 9 and Payment and Billing Rules"}}
  - {"op": "add_enum_value", "field_id": "ENT-booking.closure_cause", "value": "patient_account_suspended", "label": "Patient account suspended", "sort_order": 4}
