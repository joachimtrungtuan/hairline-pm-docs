  - {"op": "update_node", "id": "REQ-004-027", "attrs": {"statement": "A quote MUST support one or more eligible clinician assignments shared across every option. When a team member is removed or suspended, has a role change that takes away the rights needed to work their open items, or is force-suspended or force-removed by an admin, the system rewrites the clinician list of every draft, sent and accepted quote of that provider that names the member to the replacement clinician chosen at that moment, as a system change recorded in the quote's audit history; reactivating the member does not give the quotes back (REQ-009-191)."}}
  - {"op": "update_node", "id": "REQ-004-039", "attrs": {"statement": "System MUST emit `quote.expiring_soon` once per expiry window of a sent parent quote when it reaches the FR-026 quote-expiring-soon lead time, and MUST NOT emit it for draft, accepted, or terminal quotes, including the replacement quote, which has no expiry. A lead time raised after the send applies only to reminders not yet sent; a reminder whose time has already passed is skipped, not sent late (REQ-026-031)."}}
  - {"op": "update_node", "id": "REQ-004-050", "attrs": {"statement": "System MUST NOT attach an automatic FR-019 promotion to an admin-authored replacement quote or take a promotion usage reservation for it; the admin sets the replacement price directly, so the replacement quote carries no promotion, and the use held by the original acceptance's promotion, which FR-019 marks Superseded, returns to the usage limit. A replacement quote MUST have no expiry and MUST NOT emit `quote.expiring_soon`; it stays a `draft` until the admin records the replacement acceptance, and a replacement draft that is never accepted follows the 7-day draft rule. It MUST leave the inquiry flagged `supportRequired` without cancelling it automatically, and the admin MAY author another replacement quote, close the inquiry with Close inquiry on FR-006 Screen 6 when the booking is already `Cancelled` with the marker, or cancel through FR-006 Alternative Flow B2 (Screen 9) when the fault is still pending."}}
  - {"op": "update_node", "id": "REQ-005-016", "attrs": {"statement": "System MUST deliver a patient's quote question to the provider as an FR-012 message, and the provider's notification of it MUST arrive within 5 minutes at the latest, unless the provider has switched that notice off or held it in their notification preferences (REQ-012-007)."}}
  - {"op": "update_node", "id": "REQ-005-026", "attrs": {"statement": "System MUST let the patient apply a promotion code to one named subquote before acceptance, validated through FR-019, and MUST freeze the discounted price and promotion into the acceptance snapshot. The code MUST NOT be written to the provider's quote or promotion records, and the price and promotion MUST NOT change after acceptance except through an FR-006 provider-fault transfer. If the code is no longer valid, or its usage limit is exhausted, when the patient confirms, the acceptance MUST NOT happen and nothing is recorded as accepted; the patient MUST return to the subquote detail with the reason shown and the price is back to what the row carried when the quote was sent, including any promotion attached at send, and may accept without the code or enter another. The offered price is the price the provider entered for the row before any promotion (REQ-004-035)."}}
  - {"op": "update_node", "id": "REQ-006-011", "attrs": {"statement": "System MUST integrate with Notification Service for confirmations, reminders, and policy notices, and MUST trigger these FR-030 events: `booking.scheduled` (sent on patient acceptance and on an admin-authored replacement acceptance), `booking.rescheduled` (sent on an admin appointment change and on an emergency edit of the appointment time), `booking.cancelled` (sent on any booking cancellation with the reason or cause, and with the cancellation fee and the refund amount filled in by the system: an admin cancellation, a provider drop-out at the Screen 10 submit, and a system cancellation for an unpaid balance (cause `UnpaidBalance`, which an FR-007B installment plan that defaults and stays unpaid reaches at the cancellation point of Alternative Flow B8); not for a provider withdrawal, which FR-004 announces through `quote.withdrawn`), `booking.hold_expiring_soon`, `booking.payment_window_expired`, `booking.revived`, `booking.provider_fault_replacement` (sent to the patient and the admin at the admin submit of the provider-fault transfer; a withdrawal is announced before it by `quote.withdrawn`, a drop-out by `booking.cancelled` at the same submit, and a provider suspension or deactivation by this event only, REQ-030-044), `booking.confirmed` (sent when the first payment confirms the booking), and `booking.appointment_reminder` (sent twice by default, 7 days and 1 day before the appointment date, as FR-030 sets in REQ-030-048). The patient notice sent at Close inquiry is the admin-close variant of `inquiry.cancelled`, whose event and template are owned by FR-020 and FR-030 (REQ-020-076). Recipients, message content, and whether each notice is mandatory are owned by the notification Rules in FR-020 (for example REQ-020-021) and FR-030 and are not restated here. FR-004 is the only producer of `quote.withdrawn`; FR-006 does not emit it and reacts to it by starting the provider-fault transfer in Alternative Flow B5."}}
  - {"op": "update_node", "id": "REQ-006-013", "attrs": {"statement": "System MUST read the slot-hold duration (default: 48 hours) and the \"hold expiring soon\" reminder lead time from FR-026 and MUST NOT keep a separate FR-006 hold setting. When the Settings API is unavailable as a hold is placed (subquote acceptance or admin revive), System MUST block the action so it can be retried and MUST NOT use a stale or guessed duration (REQ-026-144)."}}
  - {"op": "update_node", "id": "REQ-006-017", "attrs": {"statement": "Admin MAY revive a `Payment Window Expired` booking to `Accepted` only through Screen 7 with a mandatory reason, a slot availability re-check, a check that the appointment is later than the new payment deadline, a new hold of the FR-026 duration, one promotion use taken again where the accepted promotion has a usage limit (re-reserved for a provider-selected promotion or patient code, taken again for an automatic promotion; the revive is rejected if the limit has no room), an audit entry, an unchanged AcceptanceEvent, and a mandatory \"booking revived\" notice to patient and provider. A revived booking MUST count again in the FR-014 pending-payment figures, aged from the start of its new hold (REQ-014-139). A revive MUST be blocked while the booking carries the marker of a pending provider fault. A revive MUST NOT extend the expired hold; it starts a new one, and the initial payment then MUST pass the Initial Payment Guard (REQ-007-017) against that new hold. Appointment date changes MUST be made through Screen 8 or the admin edit of the accepted quote's date range or appointment (REQ-005-023), both running the same checks (provider `Active`, slot availability, a feasible FR-007B plan recalculation, and for an `Accepted` booking an appointment later than the payment deadline), MUST NOT apply the FR-029 rescheduling fee, MUST update the booking's current appointment while the acceptance snapshot keeps the accepted baseline, MUST send `booking.rescheduled`, and MUST trigger an FR-008 travel review for any travel records already linked to the booking. No other manual status change is allowed."}}
  - {"op": "update_node", "id": "REQ-006-082", "attrs": {"statement": "An admin MAY close the inquiry of a `Cancelled` booking that still carries the `supportRequired` marker, through the Close inquiry action on Screen 6 with a mandatory reason; System MUST set the inquiry to `Cancelled`, clear the marker with an audited resolution, and send the patient the admin-close variant of `inquiry.cancelled` (REQ-020-076) saying that no replacement will follow. System MUST NOT notify any provider of the close (REQ-020-020) and MUST cancel any draft replacement quote of the inquiry without notice (REQ-004-111, REQ-003-127)."}}
  - {"op": "update_node", "id": "REQ-004-054", "attrs": {"statement": "Treatment type selection MUST use admin-curated treatment catalog; no free text. A treatment the provider has set to Not Offered blocks new quotes only: existing drafts and sent quotes are unchanged and a draft can still be sent (REQ-024-006)."}}
  - {"op": "update_node", "id": "REQ-004-059", "attrs": {"statement": "Changing the treatment after options exist requires confirmation. Packages are not tied to a treatment (REQ-024-101), so the package choices stay; the system must identify the option pricing and plan data that depend on the old treatment and must not silently retain or discard them."}}
  - {"op": "update_node", "id": "REQ-004-090", "attrs": {"statement": "Discounts are provider-managed with no admin review. A percentage discount above the maximum discount value (the FR-019 setting, starts at 50 percent) is refused as a hard cap; a fixed-amount discount has no cap (REQ-019-114)."}}
  - {"op": "update_node", "id": "REQ-006-030", "attrs": {"statement": "System uses the FR-029 calculation (REQ-029-016) for the first payment and presents the cancellation policy through the full Cancellation Policy link (FR-027), with the refund ladder numbers from FR-029 (REQ-027-026); FR-006 does not restate the percentage or the formula."}}
  - {"op": "update_node", "id": "REQ-006-036", "attrs": {"statement": "Before the hold expires, the patient receives the `booking.hold_expiring_soon` reminder; the lead time is set by admin in FR-026, and the notice details are in the notification Rule (REQ-020-086). No reminder is sent while a provider fault is pending on the booking. A lead time raised after the hold was placed applies only to reminders not yet sent; a reminder whose time has already passed is skipped, not sent late (REQ-026-031)."}}
  - {"op": "update_node", "id": "REQ-006-037", "attrs": {"statement": "If the booking is `Payment Window Expired`, carries a pending provider fault, or is `Cancelled` for any other cause (provider withdrawal or fault, provider suspension or deactivation), the screen shows the same read-only blocked layout with the banner text of that cause and the Contact Support button; all payment fields and payment actions are hidden. The Contact Support button opens a plain support request with the booking reference and no request type (REQ-034-182)."}}
  - {"op": "update_node", "id": "REQ-006-042", "attrs": {"statement": "Link to travel booking (FR-008) when available: Screen 2 carries a Travel entry that opens the FR-008 patient itinerary view, Screen 4 hosts the FR-008 provider Travel section once the booking is `Confirmed`, and Screen 6 hosts the FR-008 admin Travel section for every confirmed booking; FR-008 defines what each shows."}}
  - {"op": "update_node", "id": "REQ-006-057", "attrs": {"statement": "Travel carries over through FR-008 only when the replacement booking's travel path (A or B) matches the original's: when the replacement booking's travel context is created, the patient's passport record carries over to it, and the flight and hotel records are copied to it and flagged \"travel-date review required\" for admin review. When the paths differ, nothing is carried over or copied and the replacement's own initial travel requests go out. The original travel records stay read-only on the closed booking, and the patient re-enters nothing that was carried over."}}
  - {"op": "update_node", "id": "REQ-006-060", "attrs": {"statement": "`Accepted` (subquote accepted, awaiting payment) → `Confirmed` (deposit paid) → `In Progress` (procedure started, via FR-010) → `Aftercare` (treatment complete, or closed early by an admin decision on Screen 11; aftercare active via FR-011) → `Completed` (FR-011 emits the aftercare completion event, whatever its outcome value: completed, paperwork only, cancelled by the patient, or cancelled by an admin; REQ-011-096, REQ-011-101). An `In Progress` booking with a provider fault moves to `Aftercare` only through the admin decision on Screen 11 (Alternative Flow B7), and the decision date is then the aftercare start date handed to FR-011. From `Accepted`, hold expiry transitions to `Payment Window Expired`. From `Payment Window Expired`, only the audited admin revive returns the booking to `Accepted` with a new hold. `Confirmed` is a booking status only, never a quote status. `supportRequired` is a marker, not a status."}}
  - {"op": "update_node", "id": "STP-006-804", "attrs": {"description": "System holds the provider payout for the booking from the fault until the chosen route completes; the refund comes out of the held payout and a shortfall after release becomes a clinic balance entry applied to the clinic's next payout (REQ-017-191)"}}
  - {"op": "update_node", "id": "ENT-booking.closure_cause", "attrs": {"description": "Why the booking was closed. Provider-fault causes named by FR-004: ProviderFault, ProviderSuspended, ProviderDeactivated; UnpaidBalance for the system cancellation of an Installments booking whose balance is unpaid at the FR-029 cancellation point (Alternative Flow B8); and Patient account suspended for a booking cancelled by the FR-016 suspension cascade (REQ-006-084)."}}
  - {"op": "update_node", "id": "ENT-acceptance-event.promotion_code", "attrs": {"description": "Entered by the patient on Screen 2 for one named subquote before acceptance, validated through FR-019, held only with the open subquote view until the patient confirms, then recorded only on the AcceptanceEvent (never on the provider's quote or promotion records), and frozen into the acceptance snapshot. Added for the Screen 2 Promotion Code field."}}
