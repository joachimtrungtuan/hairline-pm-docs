  # Retention period text: one 10-year period (system PRD)
  - {op: update_node, id: SET-retention-period-by-category, attrs: {description: "Retention policy per data category (Medical Records, Financial Records, Communications, Media, Account Profile, Analytics) with legal basis and per-jurisdiction overrides, configured by Admin. Retention follows the one 10-year period of the system PRD (REQ-SYS-002), unless stricter jurisdictional rules exist. The PRD names module A-09 for the configuration and no FR-026 setting; FR-023 owns the policy itself."}}
  - {op: update_node, id: ENT-retention-policy.default_retention, attrs: {description: "Default retention duration of the category. Medical records, financial records and audit logs: the one 10-year period of the system PRD (REQ-SYS-002)."}}
  - {op: update_node, id: ENT-audit-log-entry, attrs: {description: "Immutable record of a read, write or delete on a protected record: who, when, which object, which action and the outcome. References users and data categories; kept in an immutable store whose retention follows the one 10-year period of the system PRD (REQ-SYS-002) (REQ-023-006, REQ-023-011). Distinct from the FR-specific audit entities such as ENT-audit-entry (FR-005)."}}
