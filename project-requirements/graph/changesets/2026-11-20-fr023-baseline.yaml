reason: "Requirements graph programme baseline 2026-11-20: owner rulings applied (FR-023)"
by: controller
operations:
  # Reworded Rules (PRD as it reads now)
  - {op: update_node, id: REQ-023-003, attrs: {statement: "System MUST support soft-deletes only for protected categories (Medical Records, Financial Records, Account Profile), preserving recoverability and auditability. Patient-cancelled inquiries (FR-003 Workflow 5) and all records generated from the cancellation cascade — including auto-cancelled quotes with status \"Cancelled (Inquiry Cancelled)\" per FR-004 — are subject to the same retention rules as completed inquiries and quotes. They are soft-deleted/archived, never hard-deleted before the retention period expires. This applies to inquiry records, quote records, acceptance events (including superseded AcceptanceEvents per FR-005), and associated audit trail entries.", rationale: "Restated by the Executive Summary (soft-deletion only for critical data) and Success Criteria (0% of critical records, medical and financial, hard-deleted before end of retention). The protected categories are Medical Records, Financial Records and Account Profile; the REQ-023-009 list has six categories.", scope: global}}
  - {op: update_node, id: REQ-023-004, title: "Deletion request: non-protected data deleted or anonymized; protected records retained anonymised with restricted access", attrs: {statement: "System MUST allow patients to request data deletion (erasure); non-protected data is deleted or anonymized; protected records (Medical Records, Financial Records, Account Profile) are retained in anonymised form, with strict access restrictions and documented legal basis.", rationale: "Restated by Main Flow step 4 (system deletes or anonymises non-protected data; anonymises and restricts access to protected records), Clarification CL-1 (retain in anonymised form and fully restrict access during the legal retention period; document legal basis in outcomes) and Success Criteria (retained protected records are kept in anonymised form). User Story 1 acceptance scenario 1 says protected records are \"restricted/anonymized\"."}}
  - {op: update_node, id: REQ-023-011, title: "Audit log entries immutable; retention follows the 10-year system rule", attrs: {statement: "Audit log entries MUST be immutable; their retention follows the system PRD, Platform-Wide Rules: One 10-year retention period.", rationale: "Restated by Clarification CL-3 (audit log retention follows the system PRD, Platform-Wide Rules: One 10-year retention period, REQ-SYS-002; logs are immutable and included in compliance reporting).", scope: global}}
  - {op: update_node, id: REQ-023-037, title: "Concurrent DSRs merged into one request; SLA per consolidated request", attrs: {statement: "When a patient submits multiple DSRs concurrently, the system merges them into one request with a clear status; the SLA applies per consolidated request."}}
  - {op: update_node, id: REQ-023-039, attrs: {rationale: "Restated by Assumptions (retention follows the system PRD, Platform-Wide Rules: One 10-year retention period, unless stricter jurisdictional rules exist)."}}
  - {op: update_node, id: REQ-023-040, attrs: {statement: "A deletion request made after the patient cancelled an inquiry proceeds normally, because a cancelled inquiry is a terminal state with no active obligation. Cancelled inquiry records, cascaded cancelled quotes, and associated audit entries are retained per the system PRD, Platform-Wide Rules: One 10-year retention period and REQ-023-003 even after the deletion request is fulfilled; the retained records are kept in anonymised form."}}
  - {op: update_node, id: REQ-023-019, attrs: {statement: "Entry points: Patient: Profile > Delete Account. Provider: Settings → Data Policy (read-only); Activity Logs. Admin: Compliance dashboard → Retention Settings; DSR Queue; Audit Logs; Reports."}}
  - {op: update_node, id: REQ-023-030, title: "Deletion request submitted from Profile > Delete Account and verified", attrs: {statement: "A patient submits a deletion request from Profile > Delete Account and completes verification.", rationale: "Restated by the Main Flow trigger (patient requests deletion from Profile > Delete Account) and Assumptions (patients are willing and able to complete identity verification for DSRs by standard methods)."}}
  - {op: update_node, id: STP-023-004, title: "System deletes or anonymizes the non-protected data, and anonymises and restricts access to protected records"}
