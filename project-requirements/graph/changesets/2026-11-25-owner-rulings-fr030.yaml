operations:
  - {"op": "update_node", "id": "REQ-030-019", "attrs": {"statement": "System MUST respect recipient opt-out preferences for notifications that are not locked (marketing, general updates); locked notices are always sent by email despite opt-out, with in-app explanation, while push follows the recipient's own setting"}}
  - {"op": "update_node", "id": "REQ-030-094", "attrs": {"statement": "Provider-Caused Cancellation / Offer Unavailable (provider.status_cancellation_patient) is an admin-configurable notification event. Primary recipients: Patient. FR-015 Alternative Flow A5 / Screen 4 (FR-020 REQ-020-013). One per affected inquiry/case when provider suspension (`ProviderSuspended`) or deactivation (`ProviderDeactivated`) cancels the patient's case or the provider's offer before acceptance. For a case already accepted, the patient instead receives `booking.provider_fault_replacement`. Before acceptance, three variants apply, checked in this order (FR-003 Workflow 2 Alternative Flow B4, REQ-003-021): (1) when other live offers remain open, the notice says \"[Clinic] is no longer available. Your other offers are still open.\"; (2) when no live offer remains and the patient had explicitly selected the affected provider, the notice asks the patient to confirm the redistribution first, with Confirm and Decline deep links to FR-003 Screen 8 (REQ-003-128); (3) when no live offer remains and the patient had not selected the provider, the inquiry is redistributed automatically and the notice says \"[Clinic] is no longer available. We are finding new offers for you.\" An unanswered confirm variant is followed by `provider.status_redistribution_reminder`. Includes inquiry/case reference and a Contact Admin/Support action. MUST NOT say the patient cancelled, instruct payment against the cancelled selection, or expose confidential suspension/deactivation reasons. Mandatory — admin cannot disable this event (see Non-Disableable by Default section); sent regardless of FR-015's \"Notify Provider\" checkbox. MVP default channels: Email + Push + in-app (a locked notice is always sent by email whatever the patient's channel toggles, and push follows the patient's own setting, see Non-Disableable by Default; in-app record always created). Retries de-duplicated per provider-status event + affected record + recipient"}}
  - {"op": "update_node", "id": "REQ-030-208", "title": "Locked notices are always sent by email despite opt-out and show an in-app banner", "attrs": {"statement": "System respects recipient opt-out for notifications that are not locked (marketing, general updates) and does not deliver. A locked notice is critical: it is sent at once, is exempt from quiet hours, the hourly rate limit and coalescing, and is always sent by email whatever the recipient's opt-out, while push (and any other optional channel) follows the recipient's own setting (the app displays a banner explaining why the email was sent despite opt-out). The one exception is legal.acceptance_reminder, which is locked but not critical: it respects quiet hours and the rate limit, and, like every locked notice, is still sent by email despite opt-out. The locked list is fixed in the codebase: an admin cannot mark any other notice as critical"}}
  - {"op": "update_node", "id": "REQ-030-227", "attrs": {"statement": "Critical - Cannot Opt Out is a read-only indicator that shows Yes for every event on the locked list: a locked notice is always sent by email even when the recipient has opted out, while push follows the recipient's own setting. Critical notices (all locked notices except legal.acceptance_reminder) are also exempt from quiet hours and the rate limit (REQ-030-208). An admin cannot mark an event critical; the indicator follows the locked list."}}
  - {"op": "update_node", "id": "REQ-030-241", "attrs": {"statement": "Legal Acceptance Reminder (legal.acceptance_reminder) is an admin-configurable notification event. Primary recipients: Patient, Provider (team members in the Pending set). One reminder to each user in the Pending set; FR-027 owns the cadence (REQ-027-063). Locked: the toggle cannot be switched off. It is the one locked notice that is not critical: it respects quiet hours and the rate limit, but, like every locked notice, it is still sent by email despite opt-out, while push follows the user's own setting"}}
