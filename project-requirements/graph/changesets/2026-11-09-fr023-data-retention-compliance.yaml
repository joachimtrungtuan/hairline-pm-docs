  - {"op": "add_node", "id": "REQ-023-003", "type": "Rule", "owner_fr": "FR-023", "title": "Soft-delete only for protected categories, including cancelled inquiries and cascade records", "attrs": {"statement": "System MUST support soft-deletes only for protected categories (medical, financial, identity), preserving recoverability and auditability. Patient-cancelled inquiries (FR-003 Workflow 5) and all records generated from the cancellation cascade — including auto-cancelled quotes with status \"Cancelled (Inquiry Cancelled)\" per FR-004 — are subject to the same retention rules as completed inquiries and quotes. They are soft-deleted/archived, never hard-deleted before the retention period expires. This applies to inquiry records, quote records, acceptance events (including superseded AcceptanceEvents per FR-005), and associated audit trail entries.", "rationale": "Restated by the Executive Summary (soft-deletion only for critical data) and Success Criteria (0% of critical records, medical and financial, hard-deleted before end of retention). The protected categories list names identity, which the REQ-023-009 category list does not; see the migration report."}}
  - {"op": "add_node", "id": "REQ-023-004", "type": "Rule", "owner_fr": "FR-023", "title": "Deletion request: non-protected data deleted or anonymized; protected records retained with restricted access", "attrs": {"statement": "System MUST allow patients to request data deletion (erasure); non-protected data is deleted or anonymized; protected medical/financial records are retained without anonymization but with strict access restrictions and documented legal basis.", "rationale": "Restated by Main Flow step 4 (system performs deletion or anonymization for non-protected data and restricts access to protected records), Clarification CL-1 (retain medical and financial records without anonymization but fully restrict access during the legal retention period; document legal basis in outcomes) and Success Criteria (no anonymization for retained medical or financial records). User Story 1 acceptance scenario 1 says protected records are \"restricted/anonymized\"; the graph follows this requirement, CL-1 and the success criteria."}}
  - {"op": "add_node", "id": "REQ-023-005", "type": "Rule", "owner_fr": "FR-023", "title": "Patient data anonymized in analytics and reports", "attrs": {"statement": "System MUST anonymize patient data in analytics and reports (no direct identifiers, quasi-identifiers masked or aggregated).", "rationale": "Restated by the Executive Summary (anonymizes patient data used in analytics) and Success Criteria (0% personally identifiable patient attributes in analytics dashboards or reports)."}}
  - {"op": "add_node", "id": "REQ-023-006", "type": "Rule", "owner_fr": "FR-023", "title": "Audit log of all read and write access to protected records", "attrs": {"statement": "System MUST maintain audit logs for all read and write access to protected records, including actor, timestamp, object, action, outcome.", "rationale": "Restated by the Executive Summary (audit logs for all data access and modification events), Success Criteria (100% of read/write access captured with who, when, what) and User Story 2 (a view of a medical record records who, when, what and outcome; a saved modification also records before/after metadata and the actor)."}}
  - {"op": "add_node", "id": "REQ-023-007", "type": "Rule", "owner_fr": "FR-023", "title": "Admin views for retention configuration and DSR queues", "attrs": {"statement": "System MUST provide Admin views to configure retention by data category and jurisdiction and to manage DSR queues.", "rationale": "Restated by the Admin Platform scope (configure retention settings by data category and region; triage and fulfill deletion requests)."}}
  - {"op": "add_node", "id": "REQ-023-008", "type": "Rule", "owner_fr": "FR-023", "title": "Patients and Admins notified of DSR status updates and outcomes", "attrs": {"statement": "System MUST notify Patients and Admins about DSR status updates and completion outcomes."}}
  - {"op": "add_node", "id": "REQ-023-009", "type": "Rule", "owner_fr": "FR-023", "title": "Data classified into six categories", "attrs": {"statement": "System MUST classify data into categories: Medical Records, Financial Records, Communications, Media, Account Profile, Analytics."}}
  - {"op": "add_node", "id": "REQ-023-010", "type": "Rule", "owner_fr": "FR-023", "title": "Each category has a retention policy and legal basis, with jurisdiction overrides", "attrs": {"statement": "Each category MUST have an assigned retention policy and legal basis (with jurisdiction overrides).", "rationale": "Restated by Key Entities (Retention Policy: data category, default retention, legal basis, jurisdiction overrides)."}}
  - {"op": "add_node", "id": "REQ-023-011", "type": "Rule", "owner_fr": "FR-023", "title": "Audit log entries immutable and retained at least 7 years", "attrs": {"statement": "Audit log entries MUST be immutable and retained for at least 7 years.", "rationale": "Restated by Clarification CL-3 (retain audit logs for 7 years; logs are immutable and included in compliance reporting). Other FRs state 10 years for their audit logs; see the migration report."}}
  - {"op": "add_node", "id": "REQ-023-012", "type": "Rule", "owner_fr": "FR-023", "title": "Backups every 6 hours, 30-day retention, deleted personal data excluded beyond window", "attrs": {"statement": "Backups MUST occur at least every 6 hours with 30-day retention (per system PRD) and exclude already-deleted personal data beyond backup windows.", "rationale": "Restated by Assumptions (backups every 6 hours with 30-day retention per system PRD; deleted data may persist in backups until window expiry)."}}
  - {"op": "add_node", "id": "REQ-023-013", "type": "Rule", "owner_fr": "FR-023", "title": "Deletion purges search indexes and caches", "attrs": {"statement": "Deletion actions MUST purge search indexes and caches for impacted personal data."}}
  - {"op": "add_node", "id": "REQ-023-014", "type": "Rule", "owner_fr": "FR-023", "title": "Anonymization removes direct identifiers and reduces re-identification risk", "attrs": {"statement": "Anonymization MUST remove direct identifiers and reduce re-identification risk for quasi-identifiers."}}
  - {"op": "add_node", "id": "REQ-023-015", "type": "Rule", "owner_fr": "FR-023", "title": "Analytics consent captured and opt-outs honored", "attrs": {"statement": "System MUST capture consent for analytics usage where applicable and honor opt-outs in non-essential analytics."}}
  - {"op": "add_node", "id": "REQ-023-016", "type": "Rule", "owner_fr": "FR-023", "title": "Admin export of audit logs and retention reports in portable formats", "attrs": {"statement": "Provide Admin export of audit logs and retention reports in portable, non-proprietary formats.", "rationale": "Restated by the Communication Structure (compliance reporting exports downloadable by Admin) and Clarification CL-3 (audit logs included in compliance reporting, summaries unless otherwise requested)."}}
  - {"op": "add_node", "id": "REQ-023-017", "type": "Rule", "owner_fr": "FR-023", "title": "Programmatic DSR submission and status for the Patient app", "attrs": {"statement": "Provide programmatic access for DSR submission/status for Patient app integration."}}
