  - {"op": "add_node", "id": "REQ-023-036", "type": "Rule", "owner_fr": "FR-023", "title": "Admin confirms exclusion of protected medical and financial records", "attrs": {"statement": "When data categories include records subject to mandatory retention, an Admin confirms the exclusion of protected medical/financial records; deletion/anonymization completes for the non-protected data."}}
  - {"op": "add_node", "id": "REQ-023-037", "type": "Rule", "owner_fr": "FR-023", "title": "Concurrent DSRs merged or queued; SLA per consolidated request", "attrs": {"statement": "When a patient submits multiple DSRs concurrently, the system merges or queues them with a clear status; the SLA applies per consolidated request."}}
  - {"op": "add_node", "id": "REQ-023-038", "type": "Rule", "owner_fr": "FR-023", "title": "Deletion paused while an active booking exists", "attrs": {"statement": "When a patient requests deletion while an active booking exists, the system pauses deletion until the booking resolves and communicates the timeline."}}
  - {"op": "add_node", "id": "REQ-023-039", "type": "Rule", "owner_fr": "FR-023", "title": "Jurisdiction conflict defaults to stricter retention and flags Admin review", "attrs": {"statement": "On a jurisdiction conflict (for example EU versus non-EU residency), the system defaults to the stricter retention and flags the request for Admin review.", "rationale": "Restated by Assumptions (the 7-year minimum applies platform-wide unless stricter jurisdictional rules exist)."}}
  - {"op": "add_node", "id": "REQ-023-040", "type": "Rule", "owner_fr": "FR-023", "title": "Deletion after inquiry cancellation proceeds; cancelled records stay retained", "attrs": {"statement": "A deletion request made after the patient cancelled an inquiry proceeds normally, because a cancelled inquiry is a terminal state with no active obligation. Cancelled inquiry records, cascaded cancelled quotes, and associated audit entries are retained per REQ-023-003 (7-year minimum for medical/financial data) even after PII anonymization; the anonymization applies to profile data, not to the retained medical/financial records."}}
