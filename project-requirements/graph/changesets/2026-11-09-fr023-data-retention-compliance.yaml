  - {"op": "add_node", "id": "REQ-023-001", "type": "Rule", "owner_fr": "FR-023", "title": "Medical records retained 7 years; no hard-delete before expiry", "attrs": {"statement": "System MUST retain patient medical records for a minimum of 7 years; hard-deletion is prohibited before expiry.", "rationale": "Restated by Assumptions (7-year minimum applies to medical and financial records platform-wide unless stricter jurisdictional rules exist) and the Executive Summary (minimum 7 years for medical and financial records)."}}
