  - {"op": "add_node", "id": "REQ-023-019", "type": "Rule", "owner_fr": "FR-023", "title": "Entry points to deletion, data policy, audit logs and retention settings", "attrs": {"statement": "Entry points: Patient: Profile/Privacy screen → Request Deletion. Provider: Settings → Data Policy (read-only); Activity Logs. Admin: Compliance dashboard → Retention Settings; DSR Queue; Audit Logs; Reports.", "rationale": "The PRD gives no Screen Specifications. The patient entry is the Delete Account screen SCR-001-16 (FR-001) and the admin DSR queue is SCR-016-08 (FR-016); the provider and admin compliance screens have no node yet."}}
  - {"op": "add_node", "id": "REQ-023-020", "type": "Rule", "owner_fr": "FR-023", "title": "Patients can view the retention policy, request deletion and receive status updates", "attrs": {"statement": "Patients can view the retention policy, request account/data deletion, and receive status updates and outcomes."}}
