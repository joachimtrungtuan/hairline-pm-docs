  - {"op": "add_node", "id": "REQ-023-023", "type": "Rule", "owner_fr": "FR-023", "title": "Providers have a read-only audit trail of their users' activity", "attrs": {"statement": "Providers have read-only access to the audit trail of activity by their users."}}
  - {"op": "add_node", "id": "REQ-023-024", "type": "Rule", "owner_fr": "FR-023", "title": "Admins can review audit trails of access and modifications to protected records", "attrs": {"statement": "Admins can review audit trails of access to and modifications of protected records, to investigate incidents and demonstrate compliance.", "rationale": "Restated by the Admin Platform scope (review audit trails) and User Story 2 (a complete audit trail so an Admin can investigate incidents and demonstrate compliance)."}}
  - {"op": "add_node", "id": "REQ-023-025", "type": "Rule", "owner_fr": "FR-023", "title": "Admins can approve exceptions", "attrs": {"statement": "Admins can approve exceptions.", "rationale": "The PRD states this once in the Admin Platform scope and does not say which rules admit an exception; see the migration report."}}
  - {"op": "add_node", "id": "REQ-023-026", "type": "Rule", "owner_fr": "FR-023", "title": "Retention enforced by scheduled jobs from the retention policy", "attrs": {"statement": "Retention is enforced by cross-cutting scheduled jobs that apply the Retention Policy of each data category to records.", "rationale": "Restated by the Shared Services scope (cross-cutting job scheduling for retention enforcement) and Key Entities (Retention Policy is applied to records via category mapping and referenced by enforcement jobs)."}}
  - {"op": "add_node", "id": "REQ-023-027", "type": "Rule", "owner_fr": "FR-023", "title": "Module boundary: no chat or video, no payment flow changes, no DPO tooling", "attrs": {"statement": "Out of scope for this module: real-time chat/video features (managed by other modules), payment flow changes beyond record retention, and third-party DPO/legal tooling integrations (future consideration)."}}
  - {"op": "add_node", "id": "REQ-023-028", "type": "Rule", "owner_fr": "FR-023", "title": "Patient notified at each DSR status change", "attrs": {"statement": "Patients are notified of each DSR status change: submission, verification required, in progress, and fulfilled."}}
  - {"op": "add_node", "id": "REQ-023-029", "type": "Rule", "owner_fr": "FR-023", "title": "Admins notified of new DSRs and approaching deadlines", "attrs": {"statement": "Admins are notified of new DSRs and of approaching deadlines."}}
  - {"op": "add_node", "id": "REQ-023-030", "type": "Rule", "owner_fr": "FR-023", "title": "Deletion request submitted from the Privacy screen and verified", "attrs": {"statement": "A patient submits a deletion request from the Privacy screen and completes verification.", "rationale": "Restated by the Main Flow trigger (patient requests deletion from the Privacy screen) and Assumptions (patients are willing and able to complete identity verification for DSRs by standard methods)."}}
  - {"op": "add_node", "id": "REQ-023-031", "type": "Rule", "owner_fr": "FR-023", "title": "System classifies the patient's data by category, retention and jurisdiction", "attrs": {"statement": "System classifies the patient's data by category and applicable retention/jurisdiction when a deletion request is processed."}}
  - {"op": "add_node", "id": "REQ-023-032", "type": "Rule", "owner_fr": "FR-023", "title": "Admin reviews the classification and approves the action", "attrs": {"statement": "Admin reviews the classification and approves the action before deletion, anonymization or restriction is performed.", "rationale": "Restated by User Story 1 acceptance scenario 1 (a verified deletion request is acted on when approved by Admin)."}}
  - {"op": "add_node", "id": "REQ-023-033", "type": "Rule", "owner_fr": "FR-023", "title": "Deletion actions audit-logged; outcome notice lists actions and legal basis", "attrs": {"statement": "System records deletion actions in the audit log and notifies the patient of the outcome, listing the actions taken and the legal basis and scope of any retained categories.", "rationale": "Restated by Main Flow step 5, Alternative Flow A2 step 2 (the legal basis and scope of retained categories are included in the outcome notification) and User Story 1 acceptance scenario 2 (the notification lists actions taken and the legal basis for retained records)."}}
  - {"op": "add_node", "id": "REQ-023-034", "type": "Rule", "owner_fr": "FR-023", "title": "Insufficient identity proof flags the request Verification Required", "attrs": {"statement": "A deletion request that lacks sufficient identity proof is flagged Verification Required and the patient is notified; the patient provides additional verification and an Admin validates it and resumes processing."}}
