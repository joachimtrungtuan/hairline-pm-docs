# Backlog points settled for FR-030 (2026-11-25): shorthand "locked (critical)" corrected in REQ-030-017, REQ-030-157, REQ-030-204 and REQ-030-224; back-link wording of REQ-030-164; four new catalogue rules (team compliance flag, three admin billing alerts).
# Not in this change-set: EVT-billing-payout-schedule-updated and REQ-017-044 are already retired; the Template Version History row of Screen 3 needs no operation because SCR-030-03 already shows ENT-notification-template.version_number.
reason: "Backlog points settled for FR-030: critical/locked wording aligned with REQ-030-208, back link keeps filters and search context, catalogue rows for the compliance flag notice (FR-009 REQ-009-135) and three admin billing alerts (FR-017 REQ-017-041, REQ-017-153, REQ-017-182)."
by: controller
source_id: SRC-PRD-030
operations:
  - {"op": "update_node", "id": "REQ-030-017", "attrs": {"statement": "System MUST enforce rate limiting to prevent notification spam: a maximum number of notifications per hour per recipient, set by admins with a default of 10 (notices over the limit are held and sent in order in the next hour; critical notices are never held)"}}
  - {"op": "update_node", "id": "REQ-030-157", "attrs": {"statement": "Admin receives a system.alert (in-app and by a channel other than the failing one) when a locked notice fails permanently; admin contacts the recipient via alternative channel (phone, in-app message) to update email address"}}
  - {"op": "update_node", "id": "REQ-030-204", "attrs": {"statement": "System renders template with placeholder text for missing variable (e.g., \"[Phone number not provided]\") or omits section containing missing variable if template designed with conditional logic System logs warning in admin notification logs: \"Variable `patient.phone` not available for notification [notification_id]; rendered with placeholder\" Admin receives alert if missing variable affects a locked notice (e.g., payment confirmation missing the amount)"}}
  - {"op": "update_node", "id": "REQ-030-224", "attrs": {"statement": "Admins set one platform-wide quiet-hours period during which non-critical notifications are held and sent in order when it ends. It is set only on the Rules Dashboard by an admin; recipients and providers cannot set their own. Default: 10 PM to 7 AM in the recipient's local time; start and end must differ; critical notices are never held; the hourly rate limit still applies to the release"}}
  - {"op": "update_node", "id": "REQ-030-164", "title": "Clicking a rule opens the Rule Editor; both screens offer a back link that preserves filters and search context", "attrs": {"statement": "Clicking a rule row (or the Event Name link / \"Configure\" action) opens Screen 2: Alerts & Notifications (Rule Editor) for that event Rule Editor MUST include a clear \"Back to list\" / breadcrumb link returning to the Rules Dashboard with the previous filters and search context preserved"}}
  - {"op": "add_node", "id": "REQ-030-296", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Team Member Compliance Flag Raised", "attrs": {"statement": "Team Member Compliance Flag Raised (team.compliance_flag_raised) is an admin-configurable notification event. Primary recipients: Admin (compliance team). Sent to the admin compliance team when a compliance flag is raised on a provider team member (FR-009 REQ-009-135)", "rationale": "Event Catalog table, row team.compliance_flag_raised. Category: Provider Team. Event nodes: EVT-team-compliance-flag-raised."}}
  - {"op": "add_node", "id": "REQ-030-297", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Payout Statements Ready for Review", "attrs": {"statement": "Payout Statements Ready for Review (payout.statements_ready_for_review) is an admin-configurable notification event. Primary recipients: Admin. Sent when the cutoff-day job has created the payout statements for review: the notice says how many statements are ready and gives the payout date (FR-017 REQ-017-041). MVP default channels: Email + Push", "rationale": "Event Catalog table, row payout.statements_ready_for_review. Category: Billing/Payouts. Event nodes: EVT-billing-statements-ready-for-review."}}
  - {"op": "add_node", "id": "REQ-030-298", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Overdue Payout Alert", "attrs": {"statement": "Overdue Payout Alert (payout.statement_overdue) is an admin-configurable notification event. Primary recipients: Admin. Sent on payout day when a statement was not approved between the cutoff day and the payout day and became Overdue (FR-017 REQ-017-153, REQ-017-035). MVP default channels: Email + Push", "rationale": "Event Catalog table, row payout.statement_overdue. Category: Billing/Payouts. Event nodes: EVT-billing-overdue-payout-alert."}}
  - {"op": "add_node", "id": "REQ-030-299", "type": "Rule", "owner_fr": "FR-030", "title": "Catalog event: Outstanding Invoice Alert", "attrs": {"statement": "Outstanding Invoice Alert (payment.outstanding_invoice_alert) is an admin-configurable notification event. Primary recipients: Admin. Internal alert sent when a patient invoice has been overdue for the alert threshold, an admin setting in days overdue (default 7) (FR-017 REQ-017-182). MVP default channels: Email + Push", "rationale": "Event Catalog table, row payment.outstanding_invoice_alert. Category: Billing/Payouts. Event nodes: EVT-billing-outstanding-invoice-alert."}}
