  - {"op": "add_field", "id": "ENT-message.call_type", "entity_id": "ENT-message", "name": "call_type", "data_type": "enum", "title": "Call type", "owner_fr": "FR-012", "required": false, "attrs": {"description": "For a system call entry: whether the call was audio or video."}}
  - {"op": "add_field", "id": "ENT-message.call_started_at", "entity_id": "ENT-message", "name": "call_started_at", "data_type": "datetime", "title": "Call started at", "owner_fr": "FR-012", "required": false, "attrs": {"description": "For a system call entry: when the call started."}}
  - {"op": "add_field", "id": "ENT-message.call_duration_seconds", "entity_id": "ENT-message", "name": "call_duration_seconds", "data_type": "int", "title": "Call duration in seconds", "owner_fr": "FR-012", "required": false, "attrs": {"description": "For a system call entry: how long the call lasted, in seconds."}}
  - {"op": "add_field", "id": "ENT-message.call_outcome", "entity_id": "ENT-message", "name": "call_outcome", "data_type": "enum", "title": "Call outcome", "owner_fr": "FR-012", "required": false, "attrs": {"description": "For a system call entry: answered, missed, declined or failed (the call could not be established)."}}
  - {"op": "update_node", "id": "REQ-012-026", "attrs": {"statement": "Manual observation flags MUST NOT trigger notifications. Delivery of message-event alerts and unread-badge updates follows the notification-service Rule in FR-020 (REQ-020-028), except that the intervention notice to both parties and the admin keyword alert are always delivered (REQ-012-007)."}}
  - {"op": "update_node", "id": "REQ-012-101", "title": "Reason is recorded with the emergency intervention message", "attrs": {"statement": "The reason is recorded with the emergency intervention message; the \"intervention enabled\" audit entry carries no reason and is written even when the session is cancelled; who accessed a conversation and when is stated once in the system PRD rule on role-based, audited access."}}
  - {"op": "update_node", "id": "REQ-012-010", "title": "Message lifecycle events, flags, emergency interventions, calls and moderation setting changes logged for audit", "attrs": {"statement": "System MUST log message lifecycle events (sent, delivered, read) and these audit events: attachment sent, keyword flag raised, manual flag raised, system flag raised, flag resolved, emergency intervention enabled, the emergency intervention message, call entry, and moderation setting changed."}}
  - {"op": "update_node", "id": "REQ-012-023", "attrs": {"statement": "System MUST log all admin actions (manual flags, flag status changes, enabling emergency intervention, emergency interventions, moderation setting changes) with timestamp, admin user, reason/notes, and action type for compliance audit."}}
  - {"op": "update_node", "id": "REQ-012-109", "attrs": {"statement": "Conversation status MUST be calculated from the conversation's flags, with no manual control: Escalated while a flag is escalated_to_intervention (the admin has enabled emergency intervention on Screen 6B and has not yet sent or cancelled); Resolved only when the conversation has at least one flag and all its flags are closed (resolved or intervention_completed); otherwise Active, which covers a conversation with no flag and one with any open flag that is not under intervention. Enabling emergency intervention is the step that sets the flags to escalated_to_intervention; cancelling Screen 6B puts the flags back as they were. While an emergency intervention session is open the conversation shows Escalated whether or not it has a flag; with no flag, the audit entries are the record of the session."}}
  - {"op": "update_node", "id": "REQ-012-098", "attrs": {"statement": "No provider response within 48 hours: The clock starts at the patient's oldest unanswered message and stops at any provider reply, counted in calendar hours; it also stops while the conversation is read-only and starts again from the next unanswered patient message when the conversation reopens. At 48 hours the system reminds the provider (once per unanswered stretch); if there is still no reply at 72 hours, the system itself creates a flag of type system with category Follow-Up Needed on the conversation (no admin is named on it) and sends additional provider reminders via notifications. The follow-up queue is Screen 5 filtered by the Follow-Up Needed category. A provider reply closes the system flag automatically (closed by the system, no admin action), after which the conversation can be Resolved. Admin messaging remains emergency-only."}}
  - {"op": "update_node", "id": "REQ-012-018", "attrs": {"statement": "System MUST enable patient-provider messaging only when provider has sent a quote to patient. The conversation is open while the pair has a live quote, booking or aftercare; it becomes read-only (history kept for both parties, nobody can send, admins can still view it) when the provider is suspended or deactivated, the patient's account is deleted, or nothing live is left between the pair, and it opens again when the same provider sends a new quote. Read-only is derived from those conditions and is not a stored conversation status. On a read-only conversation the composer, attach control and call buttons are disabled with a banner giving the reason, and Enable Emergency Intervention is not available."}}
  - {"op": "update_node", "id": "REQ-012-085", "attrs": {"statement": "Enabling emergency intervention sets the conversation's active flags to escalated_to_intervention and sending the message updates them to \"Intervention Completed\"; cancelling without sending restores the flags and changes nothing. Only one emergency intervention session can be open per conversation at a time, and Resolve Flag is disabled for a flag in escalated_to_intervention. A conversation manually flagged for observation escalates to emergency intervention when the situation worsens."}}
  - {"op": "update_node", "id": "REQ-012-073", "attrs": {"statement": "Button next to each flag; confirmation required; disabled for a flag in escalated_to_intervention"}}
  - {"op": "update_node", "id": "REQ-012-074", "attrs": {"statement": "\"Enable Emergency Intervention\" button only visible to admins with intervention permissions; Prominent button with warning styling; opens confirmation dialog; not available on a read-only conversation or while another emergency intervention session is open on the conversation"}}
  - {"op": "update_node", "id": "REQ-012-089", "attrs": {"statement": "System tracks intervention success: an intervention counts as successful when no new flag is raised on that conversation in the 30 days after it (the post-intervention flag does not count); Screen 5 shows the intervention success rate, successful interventions divided by interventions older than 30 days, worked out when the screen is read. After sending, the system raises a system flag with category Follow-Up Needed for follow-up review unless the post-intervention flag switch on Screen 5 is off (default on)."}}
  - {"op": "update_node", "id": "REQ-012-024", "attrs": {"statement": "System MUST restrict admin intervention to authorized admin roles only; Screen 5 shows the intervention rate (interventions in the calendar month divided by conversations with at least one message in that month; call entries are not messages) against a monitoring target of under 5%, which blocks nothing; manual observation flags can be used more liberally for proactive monitoring."}}
  - {"op": "update_node", "id": "REQ-012-012", "attrs": {"statement": "System MUST distinguish between automatic keyword flags (red) and manual observation flags (orange) in admin monitoring center and thread detail view; flagging must NOT notify patient or provider. Exception for the provider's view: the provider's conversation screen still shows the flag indicator for an open flag of any type (the patient is still not notified)."}}
  - {"op": "update_node", "id": "REQ-012-001", "attrs": {"statement": "System MUST automatically create a new conversation between patient and provider when provider submits their first quote for patient inquiry; subsequent quotes from same provider to same patient MUST add inquiry/quote IDs to existing conversation (one conversation per patient-provider pair). The provider side of the pair is the clinic: every clinic team member with messaging permission reads and replies in the same conversation. The unread count is kept once per clinic: when one team member opens the conversation it counts as read for the whole clinic."}}
  - {"op": "update_node", "id": "REQ-012-060", "attrs": {"statement": "\"You\" on the viewer's own messages and the colleague's name on other clinic team members' messages, the patient's masked identifier until payment is confirmed and then the patient name, \"Hairline Admin\", \"System\" for call entries"}}
  - {"op": "update_node", "id": "REQ-012-055", "attrs": {"statement": "Max 50 chars; shows \"You: \" prefix if the viewer sent it; Displayed if available; helps identify case; If more than 20 results, show \"Showing 20 of X conversations - refine filters\" message."}}
  - {"op": "update_node", "id": "REQ-012-032", "attrs": {"statement": "Audio and video call functionality using Twilio for real-time consultation and communication between patients and providers; Initiate or receive audio/video calls with providers for live consultations and discussions via Twilio; Initiate or receive audio/video calls with patients for consultations and detailed explanations via Twilio; Icon button in header; disabled if provider offline (optional); Calls are started from the chat header; each call leaves a system entry in the conversation (audio or video, start time, duration, outcome answered, missed, declined or failed), shown in the thread but not counted as an unread message, as the last-message preview or toward the monthly count of conversations with at least one message, and call content is not recorded or monitored."}}
  - {"op": "update_node", "id": "REQ-012-033", "attrs": {"statement": "Display connection error message; allow retry; fallback to text messaging if call cannot be established; the call entry records outcome failed."}}
  - {"op": "update_node", "id": "REQ-012-105", "attrs": {"statement": "Configure moderation rules and automatic keyword flags; maintain compliance audit trail; Keyword/phrase flags that trigger moderation or escalation cues, and the post-intervention flag switch (default on), in the Moderation settings group on Screen 5; the keyword list starts empty and the admin team fills it before go-live."}}
  - {"op": "update_node", "id": "REQ-012-020", "title": "Messages and attachments retained for the system retention period", "attrs": {"statement": "System MUST retain messages and attachments as set by the system PRD, Platform-Wide Rules: One 10-year retention period."}}
  - {"op": "update_node", "id": "STP-012-039", "title": "System connects the call through Twilio and notifies the other party, who answers, declines or does not answer; a call that cannot be established is recorded as failed"}
  - {"op": "update_node", "id": "STP-012-040", "title": "System writes the call entry in the conversation with type, start time, duration and outcome; it is not counted as an unread message, preview or monthly message"}
  - {"op": "update_node", "id": "SET-post-intervention-auto-flag", "attrs": {"default": "on"}}
  - {"op": "update_node", "id": "SET-moderation-keyword-flags", "attrs": {"default": "empty", "description": "Admin-editable list of keywords and phrases that trigger automatic keyword flags and moderation or escalation cues in conversations, edited in the Moderation settings group on Screen 5 (REQ-012-105). The list starts empty and the admin team fills it before go-live. Provisional owner FR-012; the PRD does not name another owner."}}
