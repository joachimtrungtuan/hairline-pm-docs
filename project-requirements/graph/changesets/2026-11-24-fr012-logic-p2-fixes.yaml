# FR-012 logic review, second pass: ruled fixes applied to the PRD (Secure Messaging). New fields come first, then updates, enum values and new edges.
# Cross-FR edges added or removed: none. Every node updated here is owned by FR-012.
# Not changed on purpose: STP-012-033 stays retired with its dangling next edge (it has no predecessor; the flow starts at STP-012-034); SET-escalation-routing-rules (no consumer), SET-conversation-export-controls (future phase) and SET-emergency-intervention-permissions (queued for FR-031) are kept as they are.
# call_type is an enum with audio and video so the audio-or-video rule has a stored value; this is the only value list added beyond the four named call fields.
reason: "FR-012 logic review, second pass: held-notice carve-out in the service rule, intervention reason recorded with the message, Escalated with or without a flag, system flag closed by a provider reply, the response clock paused while read-only, the flag indicator for any open flag, intervention success rate on Screen 5, read-only controls, call entry fields and counting rules, moderation settings Save control, default and audit event, clinic team labels and one unread count, Resolve Flag under intervention, and the audit export leftover."
by: docs-manager
