  - {"op": "add_node", "id": "REQ-010-121", "type": "Rule", "title": "Admin case listing has a status filter, a flag filter and a Flags column; Screen 8 opens for any status; failed signal has a Retry button", "owner_fr": "FR-010", "attrs": {"statement": "System MUST give admins a case listing (Screen 7) with a case status filter (default In Progress), a flag filter, and a Flags column, MUST open Screen 8 from it for a case in any status, and MUST show a Retry Completion Signal button on Screen 8 while the failed-signal flag is set (Rule 18)", "rationale": "Screens 7 and 8, Rule 18. A failed-signal case is already in Aftercare, so it is found through the status filter."}}
