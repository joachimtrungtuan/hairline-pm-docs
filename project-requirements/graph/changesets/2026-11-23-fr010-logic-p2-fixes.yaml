reason: FR-010 logic review round 2 - admin case listing with status filter, flags column and retry for a failed completion signal; no-fault early close with its own steps (Closed Early, FR-011 hand-off, payout eligible on the decision date); Check In path steps joined; stale rule text, titles and reminder default restated from the PRD; treatment.cancelled trigger
by: docs-manager
operations:
  - {"op": "update_node", "id": "REQ-010-033", "attrs": {"statement": "Booking status MUST transition through sequence: Confirmed → In Progress → Aftercare → Completed (no skipping stages). Exceptions: an admin may move an In Progress booking to Aftercare through the FR-006 Screen 11 decision (early close, Rule 17, or after a provider fault, Rule 12), an admin may cancel an In Progress booking through the same Screen 11 decision after a provider fault (Rule 12, Rule 16), and an admin may cancel the booking through the FR-006 Cancel Booking action before Check In."}}
  - {"op": "update_node", "id": "REQ-010-040", "attrs": {"statement": "The provider's Cancel / Close Case action does NOT auto-transition status or trigger financial actions. The admin resolves it only through FR-006 Screen 11 (early close without a fault, or provider-fault decision); no one sets a booking status by hand"}}
  - {"op": "update_node", "id": "REQ-010-041", "attrs": {"statement": "When a provider's suspension or deactivation becomes effective, System MUST leave that provider's In Progress cases In Progress with cause `ProviderSuspended` or `ProviderDeactivated` and an independent `supportRequired` marker, block further provider documentation, preserve clinical notes, photos, and head scan photo sets, and let an admin decide case by case through FR-006 Alternative Flow B7 (move the booking to Aftercare with an FR-011 aftercare reassignment, or cancel the booking), without restoring the provider's actions on reactivation (Alternative Flow B5; Rule 12; FR-015 A5/Screen 4). Provider-requested Cancel/Close Case (B4) remains a non-transitioning admin flag."}}
  - {"op": "update_node", "id": "REQ-010-069", "attrs": {"statement": "Entry points: Provider navigates to \"Confirmed\" section in Patient Management (Provider Platform dashboard) System opens the case detail page in tabbed view (tabs: Treatment Plan | Note | Book hotel & Book flight | In Progress) Provider can resume documentation for \"In Progress\" treatments from the \"In Progress\" section in Patient Management Provider can view completed and Closed Early treatments from the \"Completed\" section (read-only mode)"}}
  - {"op": "update_node", "id": "REQ-010-070", "attrs": {"statement": "Check In is disabled with a generic reason that never shows payment detail when the procedure date is in the future in the appointment timezone (tooltip: \"Cannot check in future appointments. Wait until procedure date.\"), when the booking has an outstanding balance or a Defaulted installment, when it carries the `supportRequired` marker, or when the patient has another treatment In Progress; the admin sees the payment detail and can assist per billing ops. Patient must complete payment through the booking/payment flow (FR-007) before treatment documentation can start. After the appointment date Check In stays available with the late Check In prompt (Alternative Flow A3)."}}
  - {"op": "update_node", "id": "REQ-010-078", "attrs": {"rationale": "Alternative Flow B3. Archived FR-010 PRD baseline, lines 201, 204, 205.", "statement": "Provider documents the interruption reason in the affected day's note field. If treatment can resume, the day stays In progress and the provider sets Finished when complete (Need caution/attention is a final status that counts as finished, not a pause). If it cannot, the provider sets the day to Cancelled/Deferred, clicks Cancel/Close Case, and documents the reason; the system flags the case for the admin on the dashboard and the case stays In Progress until the admin acts. The admin lets the case resume later, changes treatment details through Screen 9, or closes the case early on FR-006 Screen 11 with no provider fault (Alternative Flow B4); the refund is set by the admin on that screen"}}
  - {"op": "update_node", "id": "REQ-010-079", "attrs": {"rationale": "Alternative Flow B4. Closure is resolved through the FR-006 Screen 11 early close or the In-Progress provider-fault decision. Archived FR-010 PRD baseline, lines 216, 217."}}
  - {"op": "update_node", "id": "REQ-010-080", "attrs": {"statement": "Provider documentation actions (day edits, End Treatment) are blocked; day records, clinical notes, photos, and head scan photo sets are retained read-only. Patient/admin notifications per FR-015 Screen 4 and FR-030; the patient is told an admin will contact them about the next step"}}
  - {"op": "update_node", "id": "REQ-010-089", "attrs": {"statement": "Admin can trigger End Treatment on behalf of a provider only when the End Treatment gate is met (REQ-010-104) and the booking carries no `supportRequired` marker (Rule 12); the End of Treatment modal collects the same required fields as Screen 6."}}
  - {"op": "update_node", "id": "REQ-010-092", "title": "Cancellation and early close run through FR-006 actions; no automatic financial resolution", "attrs": {"statement": "Case cancellation before Check In is performed by an admin through the FR-006 Cancel Booking action; an In Progress case is closed early through FR-006 Screen 11 (Rule 17). Financial reconciliation follows the refund rules in FR-006 (Payment & Billing Rules: the refund ladder set in FR-029, or the provider-fault terms where the provider is at fault) and the platform does not perform automatic financial resolution."}}
  - {"op": "update_node", "id": "REQ-010-099", "attrs": {"statement": "status (\"Awaiting Check In\", \"In Progress\", \"Completed\", \"Closed Early\", \"Cancelled\"; the record is created with status \"Awaiting Check In\" when the booking becomes `Confirmed`, seeded from the accepted snapshot, so treatment-detail changes before Check In have a record to change; Check In sets \"In Progress\"; saving End Treatment sets \"Completed\"; \"Cancelled\" is set when the booking is cancelled before Check In (the FR-006 Cancel Booking action, the provider-status cascade, or the provider-fault transfer) or when an admin cancels an In Progress booking through the FR-006 Screen 11 decision after a provider fault or a provider status cascade, and the FR-030 `treatment.cancelled` event is then emitted (REQ-010-122); when an admin moves an In Progress booking to Aftercare through the FR-006 Screen 11 decision (early close, or after a provider fault or provider status cascade under FR-006 Alternative Flow B7), the record becomes \"Closed Early\"; in both In Progress cases the record keeps what was documented and provider documentation stays blocked; cause and `supportRequired` are held on the booking"}}
  - {"op": "update_node", "id": "REQ-010-103", "title": "Admin listing: all providers' cases by status and flag, opens the case in editable mode", "attrs": {"statement": "Admin listing shows all providers' cases in the selected case status (default In Progress), with a flag filter and a Flags column — platform-wide visibility. Clicking a row or the Action button opens Screen 8: In Progress Case Detail in editable mode, whatever the case status; the controls shown follow the status. Default sort: procedure date ascending."}}
  - {"op": "update_node", "id": "REQ-010-104", "attrs": {"statement": "End Treatment is enabled only when every day record is in a terminal status (Finished, Need caution/attention, or Cancelled/Deferred), at least one day is Finished or Need caution/attention, and the booking carries no `supportRequired` marker; a case with every day Cancelled/Deferred goes to the early close (Rule 17); a partly delivered treatment (at least one day Finished, the others Cancelled/Deferred) ends with End Treatment and needs no close request; the documentation deadline starts when the gate is first met"}}
  - {"op": "update_node", "id": "REQ-010-115", "attrs": {"statement": "System MUST show the admin notices raised by FR-010 (report issue before Check In, close request, Late Check In, Overdue Documentation, failed completion signal) as dashboard flags in the Flags column of the admin case listing and on the case detail, not FR-030 events; the action on a failed completion signal is a retry (Rule 18)"}}
  - {"op": "update_node", "id": "REQ-010-116", "title": "Early close of an In Progress case without a fault: payout eligible on the decision date, record becomes Closed Early", "attrs": {"rationale": "Business Rules, Rule 17. FR-006 owns the decision screen; the FR-010 side is the record status, the reminders, and the payout trigger. The refund comes out of what the patient paid.", "statement": "System MUST let an admin close an In Progress case early on FR-006 Screen 11 when the provider is not at fault, make the provider's share eligible for payout on the decision date after the refund and commission with no waiting window, set the treatment record to Closed Early, stop reminders and the Overdue Documentation flag, signal FR-011 so the aftercare team writes the post-op instructions, and never have the admin fill the End of Treatment fields (Rule 17; Alternative Flow B4)"}}
  - {"op": "update_node", "id": "REQ-010-117", "attrs": {"statement": "System MUST mark the treatment Completed at End Treatment save, have FR-006 move the booking to Aftercare in the same step whether or not the FR-011 signal is delivered, and start the FR-007 patient confirmation window at that moment; the save and the booking move succeed or fail together, and a save is rejected when the case gains the `supportRequired` marker meanwhile (Integration 5)"}}
  - {"op": "update_node", "id": "REQ-010-010", "attrs": {"statement": "System MUST send the first documentation reminder at the reminder-timing setting (default 6 hours after the End Treatment gate is first met; range 1 hour up to the deadline minus 1 hour) and the second at the configured completion deadline (default 24 hours) while documentation is incomplete, then flag the case as Overdue Documentation on the admin dashboard; the reminder time must be earlier than the deadline, and reminders stop when the case is Closed Early or blocked; enforcement is reminders plus the flag only and nothing is blocked"}}
  - {"op": "update_node", "id": "REQ-010-051", "attrs": {"statement": "Admin can configure the documentation completion deadline (default 24 hours, range 12-48 hours, counted from the moment the End Treatment gate is first met) and the first reminder timing (default 6 hours; range 1 hour up to the deadline minus 1 hour, so it is always earlier than the deadline; a value outside the range is rejected); reminders stop when the case is Closed Early or blocked"}}
  - {"op": "update_node", "id": "REQ-010-095", "attrs": {"rationale": "Overlaps REQ-010-010; the defaults (6 hours for the first reminder, 24 hours for the deadline) are both configurable. Archived FR-010 PRD baseline, lines 919.", "statement": "System sends the first reminder to the provider at the reminder-timing setting (default 6 hours after the End Treatment gate is first met) if documentation is still incomplete; the second reminder follows at the configured completion deadline (default 24 hours); the admin dashboard then flags the treatment as \"Overdue Documentation\" for manual follow-up. Reminders and the flag stop when the case is Closed Early or blocked. Enforcement is reminders plus the flag only; nothing is blocked."}}
  - {"op": "update_node", "id": "SET-documentation-reminder-timing", "attrs": {"description": "Timing of the first reminder when documentation is not completed, counted from the moment the End Treatment gate is first met; range 1 hour up to the deadline minus 1 hour, so it is always earlier than the deadline; admin configurable. Owner is FR-010 because only the FR-010 PRD states it.", "default": "6"}}
  - {"op": "update_node", "id": "SCR-010-07", "attrs": {"description": "Display cases across all providers and clinics platform-wide, In Progress cases by default and any other case status through the status filter, with search, filters, the admin flags, and direct access to open any case."}}
  - {"op": "update_node", "id": "SCR-010-08", "attrs": {"description": "Allow admin to view and edit all aspects of a case, opened from the admin listing in any status (Confirmed, In Progress, Aftercare, Completed, or Cancelled) — including treatment day statuses, provider notes, case actions, and the retry of a failed completion signal. The case status is never set by hand. All fields are editable by admin unless system-locked for audit integrity."}}
