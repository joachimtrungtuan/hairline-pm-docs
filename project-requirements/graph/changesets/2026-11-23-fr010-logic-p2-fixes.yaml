  - {"op": "add_node", "id": "REQ-010-122", "type": "Rule", "title": "treatment.cancelled is emitted when the treatment record becomes Cancelled", "owner_fr": "FR-010", "attrs": {"statement": "System MUST emit the FR-030 `treatment.cancelled` event when the treatment record becomes Cancelled: a booking cancelled before Check In, the provider-fault transfer, or an In Progress booking cancelled by an admin through the FR-006 Screen 11 decision (Entity 1)", "rationale": "Entity 1 and Integration 3. The event is already emitted at STG-main-06-treatment; this rule names the FR-010 routes that fire it."}}
