# FR-034 logic review pass 2: ruled fixes applied to the PRD (Support Center and Ticketing). Two new rules come first, then their edges, then rule, step, setting and field updates. No edge is removed and no node is retired.
# Cross-FR edges: REQ-034-182 applies to SCR-006-01 (FR-006 screen, edge from an FR-034 node only; FR-006 is not edited). No node owned by another FR is updated or retired.
# Queued for other FRs, not done here: FR-006 (Contact Support on the Payment Window Expired and Cancelled screens must carry the booking reference and no request type), FR-035 (Screen 5 form must pass the booking reference), FR-030 (three catalogue events: Urgent 1-hour alert to the Support Staff pool, orphaned-case notice to the Support Staff pool, manually-contact alert to the assigned admin or the pool).
# Left alone on purpose: minor observations of the review report; EVT-support-case-escalated description (FR-030 owns it, queued in pass 1); REQ-034-139 names no status for the automatic reopen, so Open is used for both reopen routes.
reason: "FR-034 logic review pass 2: system escalation flow, clocks that run only while a case is Open or In Progress and escalate once per start, manual escalation never lowering the priority, three plain system emails with recipients, Support Staff pool defined, status removed from Admin Editability, 90-day default with the Request Type and Request Status filters, Bulk Assign through one modal with one reason, Reopen Case on Resolved cases, every patient notice to the contact email when No Patient Link is ticked, and a plain case from blocked booking screens."
by: docs-manager
operations:
  - {"op": "add_node", "id": "REQ-034-181", "type": "Rule", "owner_fr": "FR-034", "title": "An admin can reopen a Resolved case", "attrs": {"statement": "An admin can use Reopen Case on a Resolved case as well as on a Closed one: the reopening reason is required, the auto-close timer is cancelled, the case returns to Open, and no reopening request is involved; the reopened notice of REQ-034-146 applies as for a Closed case", "rationale": "Screens 1, 3 and 6; Alternative Flow B3. A mistaken Resolve is undone without Close then Reopen, which would write a Closed event for a case that was never closed. A patient or provider reply on a Resolved case still reopens it automatically (REQ-034-139)."}}
  - {"op": "add_node", "id": "REQ-034-182", "type": "Rule", "owner_fr": "FR-034", "title": "Contact Support on a blocked booking screen creates a plain case with the booking reference", "attrs": {"statement": "Contact Support on the Payment Window Expired and Cancelled booking screens (FR-006) creates a plain support case that carries the booking reference and has no request type; only booking cancellation and booking change requests carry a request type (REQ-034-167)", "rationale": "Alternative Flow A8. A restore or refund question is not a booking request: FR-016 has no action to complete one, so it would add a request status nobody can finish."}}
