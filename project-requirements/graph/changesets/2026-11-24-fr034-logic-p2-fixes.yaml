  - {"op": "update_node", "id": "REQ-034-086", "attrs": {"statement": "Editable by Admin (via Admin Platform UI): Case category, priority, title, description (per-case editing in Screen 2); status changes follow REQ-034-102; Case assignment (transfer to another admin user via Screen 5); Internal notes and admin-only comments (in Screen 3); Patient/provider linkage (add, modify, or remove linked records in Screen 2); Case tags and labels (per-case in Screen 2); Resolution summary and resolution category (in Screen 4); Auto-close period (Immediately, 3, 7, or 14 days after resolution in Screen 4)"}}
  - {"op": "update_node", "id": "REQ-034-092", "attrs": {"statement": "Admin staff receive email notifications when: Case assigned to them; Case escalated to them (an escalation always goes to a Super Admin, and a system escalation goes to all Super Admins); Patient/provider replies to a case (one email per reply); A case is reopened (a separate reopening notice, in addition to the reply email); An Open or In Progress Urgent case is still unassigned 1 hour after the Urgent clock started (a fixed plain system email to the Support Staff pool; if the case is still unassigned at the Urgent Case Unassigned Threshold in Screen 7, default 24 hours, the system escalates it to Super Admin); The assigned admin of a case is deactivated and the case becomes unassigned (a plain system email to the Support Staff pool, to reassign it); A notice to the patient or provider still fails once the FR-030 retry rule is exhausted (a plain system email to the assigned admin, or to the Support Staff pool when the case is unassigned, to contact the patient or provider by hand)"}}
  - {"op": "update_node", "id": "REQ-034-094", "attrs": {"statement": "View Support Center: open and read cases, including internal notes; Respond to Support: reply, add internal notes, create, edit, reassign, resolve, close and reopen cases (assignment is informational only and does not restrict access); assignee lists show active admins with this permission; the Support Staff pool, the recipient of every notice sent to the pool, is all active admin users who hold this permission; Super Admin only: Support Center configuration (Screen 7), receipt of escalations and audit log export (no hard delete; archive only); There is no Support Manager role and no \"Manage Support Configuration\" permission; A user without View Support Center who sees a case row in FR-016 Screen 9 gets the case reference without a link"}}
  - {"op": "update_node", "id": "REQ-034-102", "attrs": {"statement": "Status follows unified workflow: Open → In Progress → Resolved → Closed (cannot skip stages except for case reopening); Case cannot be marked \"Closed\" until status is \"Resolved\" (validation rule); System prevents closing case unless status is \"Resolved\" first; Status is Open on create and is not editable on Screen 2 when a case is edited; the Update Status modal offers Open to In Progress only; Resolved is reached only through Resolve Case (Screen 4, resolution summary required), Closed only through Close Case, and Closed or Resolved to Open only through Reopen Case"}}
  - {"op": "update_node", "id": "REQ-034-103", "attrs": {"statement": "Admin clicks \"Reassign Case\" (there is no separate escalation button or form); System displays the Reassign Case modal (Screen 5); Admin ticks \"Escalate\", selects a Super Admin as the new assignee (the list shows active Super Admin users only), and enters the required reassignment reason; System sets the case priority to the \"High\" or \"Urgent\" the admin chose, from the values at or above the current priority only (a case that is already Urgent stays Urgent and no choice is shown), writes it to the case priority and shows it on the timeline; System sends the escalation notice to the chosen Super Admin; System logs the reassignment in case timeline, marked as an escalation; Case reassigned to a Super Admin at the chosen priority, never lower than before"}}
  - {"op": "update_node", "id": "REQ-034-108", "attrs": {"statement": "System automatically detects deactivated admin accounts and marks their assigned cases as \"Unassigned\"; The Support Staff pool receives a plain system email to reassign orphaned cases; Case timeline logs admin account deactivation event"}}
  - {"op": "update_node", "id": "REQ-034-113", "attrs": {"statement": "System queues the notification for retry following the FR-030 retry rule (FR-030 owns the retry schedule and count); Case timeline logs notification failure with timestamp; Admin dashboard displays notification status indicator (sent, pending, failed); If the notification still fails once the FR-030 retry rule is exhausted, the assigned admin (or the Support Staff pool when the case is unassigned) receives a plain system email to manually contact the patient/provider"}}
  - {"op": "update_node", "id": "REQ-034-145", "attrs": {"statement": "Case status changes from \"Closed\" (or \"Resolved\") to \"Open\" when reopened; System logs reopening in case timeline with timestamp, reopening reason, admin who reopened it, and reference to previous resolution; Previous resolution summary remains in case history for reference; Case timeline shows clear \"Case Reopened\" event with full context of why it was reopened"}}
  - {"op": "update_node", "id": "REQ-034-179", "attrs": {"statement": "When No Patient Link is ticked on Screen 2, a contact email is required and a contact name is optional; both are stored on the case, and every notice that would go to the patient goes to that address"}}
  - {"op": "update_node", "id": "REQ-034-119", "attrs": {"statement": "Bulk Assign: Assign selected cases to one admin user through the Screen 5 modal, opened once for all selected cases, with one new assignee and one required reason (Enabled only if cases selected); only Open and In Progress cases are included, the others are skipped and the count skipped is shown; there is no Escalate option in bulk; each case gets the normal assignment notice and timeline entry; Bulk Close: Close selected cases (only if all are Resolved status) (Enabled only if cases selected and all Resolved)", "rationale": "Screen 1 data fields and Screen 5 business rules. Bulk assign uses the same modal and the same required reason as single reassignment, so the assignment history stays complete."}}
  - {"op": "update_node", "id": "REQ-034-116", "attrs": {"statement": "Filter Bar: Comprehensive filtering controls including: Status Filter (multi-select dropdown: Open, In Progress, Resolved, Closed; Default: Open + In Progress), Priority Filter (multi-select dropdown: Low, Medium, High, Urgent; Default: All priorities), Category Filter (multi-select dropdown from centralized category list; Default: All categories), Ticket Source Filter (multi-select dropdown: Patient App, Provider Portal, Manual Admin Entry; Default: All sources), Submitter Type Filter (multi-select dropdown: Patient, Provider, Admin; Default: All types), Date Range Filter (date picker for creation date range; Default: Last 90 days), Assigned To Filter (dropdown select: All Users, specific user; Default: All Users), Request Type Filter (multi-select dropdown: Booking Cancellation, Booking Change; Default: All types), Request Status Filter (multi-select dropdown: Open, Resolved, Declined; Default: All statuses); Filters are cumulative (AND logic between different filter types); Filter selections persist during session"}}
  - {"op": "update_node", "id": "REQ-034-155", "attrs": {"statement": "Auto-escalation thresholds configurable within defined ranges to prevent overly aggressive or too lenient escalation; Urgent Case Unassigned Threshold: Hours before an Open or In Progress urgent case that is still unassigned auto-escalates once to Super Admin (REQ-034-173), counted from when the case is Urgent and unassigned and stopped on assignment, after a fixed alert email to the Support Staff pool at 1 hour (Min: 1, Max: 48, Default: 24 hours); High Priority Case Threshold: Hours before an Open or In Progress high priority case auto-escalates once to Super Admin (REQ-034-173) if no status change, counted from when the case is High and restarted on any status change; a stall alarm, separate from the resolution targets of Rule 12 (Min: 12, Max: 72, Default: 48 hours); Case Inactivity Threshold: Days before an Open or In Progress case with no activity is flagged for admin review, also the one clock behind the inactivity warnings in the case list and case detail view (Min: 7, Max: 90, Default: 14 days)"}}
  - {"op": "update_node", "id": "REQ-034-173", "attrs": {"statement": "When the Urgent Case Unassigned Threshold or the High Priority Case Threshold runs out, the system marks the case as escalated in its timeline and sends the escalation notice to all Super Admins; it does not reassign the case or change its priority. Both clocks are stall alarms that run only while the case is Open or In Progress. The Urgent clock starts when a case is Urgent and unassigned (at creation, or when it becomes Urgent later) and stops when the case is assigned; the High clock starts when a case is High and restarts on any status change. Each clock escalates once per start, with no repeat. The fixed 1-hour alert for an unassigned Urgent case goes to the Support Staff pool, counted from the same start of the Urgent clock"}}
  - {"op": "update_node", "id": "STP-034-024", "title": "System sets the case priority to the High or Urgent the admin chose, never lower than the current priority (an Urgent case stays Urgent)"}
  - {"op": "update_node", "id": "STP-034-026", "title": "System logs the reassignment in case timeline, marked as an escalation, with the new priority"}
