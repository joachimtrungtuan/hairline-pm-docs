  - {"op": "update_node", "id": "ENT-support-case.contact_email", "attrs": {"description": "Required when the case has no patient link (No Patient Link ticked); every notice that would go to the patient goes to it."}}
  - {"op": "update_node", "id": "SET-support-urgent-unassigned-escalation-threshold", "attrs": {"description": "Hours before an Open or In Progress urgent case that is still unassigned auto-escalates once to all Super Admins; the clock starts when the case is Urgent and unassigned and stops on assignment (a fixed alert email goes to the Support Staff pool after 1 hour first). Editable by Super Admin on Screen 7 within 1 to 48 hours."}}
  - {"op": "update_node", "id": "SET-support-high-priority-escalation-threshold", "attrs": {"description": "Hours before an Open or In Progress high priority case with no status change auto-escalates once to all Super Admins; the clock starts when the case is High and restarts on any status change; a stall alarm, separate from the resolution targets. Editable by Super Admin on Screen 7 within 12 to 72 hours."}}
