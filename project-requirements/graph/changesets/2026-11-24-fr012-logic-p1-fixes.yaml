  - {"op": "update_node", "id": "SET-post-intervention-auto-flag", "attrs": {"description": "Whether the system raises a system flag with category Follow-Up Needed after an emergency intervention; default on, edited in the Moderation settings group on Screen 5 (REQ-012-089, REQ-012-105)."}}
  - {"op": "update_node", "id": "SET-moderation-keyword-flags", "attrs": {"description": "Admin-editable list of keywords and phrases that trigger automatic keyword flags and moderation or escalation cues in conversations, edited in the Moderation settings group on Screen 5 (REQ-012-105). Provisional owner FR-012; the PRD does not name another owner."}}
