# FR-012 logic review: ruled fixes applied to the PRD (Secure Messaging). New steps and flows come first, then removals, updates, enum values and new edges.
# Cross-FR edges: FR-012 references REQ-023-044 (FR-023, new). Existing boundary edges are unchanged. Steps STP-012-038 to -041 are FR-012-owned; the two new Flow nodes have no owner.
# Not touched here (owned elsewhere): EVT-message-sent (FR-030); the FR-020 and FR-030 catalogue rows and locked list; the FR-005 5-minute promise; FR-031 permissions; FR-016 Communications tab; FR-004 first-quote wording; FR-015 cascade; FR-011 aftercare scope; FR-009 routing; FR-022 REQ-022-122 filter table; FR-023 record-type table; FR-001 line 73.
# Left alone on purpose: all steps and screens stay only at STG-main-02-quote; retired STP-012-033 keeps its dangling next edge; SET-escalation-routing-rules, SET-emergency-intervention-permissions and SET-conversation-export-controls are not wired to any screen.
reason: "FR-012 logic review: conversation status precedence and the escalation step, intervention success and the system flag type, the monitoring target on Screen 5, the 48-hour clock and the follow-up queue, held notices, translation switch precedence, masked provider screens, anonymise-in-place on deletion, conversation lifecycle, clinic-level conversation, fixed emergency reasons and the Moderation settings step, attachment scan on every sender, call entries, audit event types, and removal of the dead admin-patient reference and the dangling next edge of STP-012-011."
by: docs-manager
