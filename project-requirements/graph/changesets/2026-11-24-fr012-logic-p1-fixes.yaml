  - {"op": "update_node", "id": "REQ-012-001", "attrs": {"statement": "System MUST automatically create a new conversation between patient and provider when provider submits their first quote for patient inquiry; subsequent quotes from same provider to same patient MUST add inquiry/quote IDs to existing conversation (one conversation per patient-provider pair). The provider side of the pair is the clinic: every clinic team member with messaging permission reads and replies in the same conversation."}}
  - {"op": "update_node", "id": "REQ-012-007", "attrs": {"statement": "System MUST deliver real-time notifications for new messages to intended recipients (patients, providers, and both parties when admin intervenes); update unread badges in inbox views and header popup menus. The notification events are defined in the FR-030 event catalogue. The intervention notice to both parties and the admin keyword alert cannot be switched off or held; the other chat notices follow the user's notification settings."}}
  - {"op": "update_node", "id": "REQ-012-009", "attrs": {"statement": "System MUST enforce attachment type and size limits (Images: JPG/PNG max 5MB; Video: MP4 max 10MB; PDF: max 10MB; max 5 attachments per message) and provide specific user feedback on violations. The checks and the malware scan run on every attachment from a patient, provider or admin; a file that fails is refused with a specific message and the message can still be sent without it."}}
  - {"op": "update_node", "id": "REQ-012-010", "title": "Message lifecycle events, flags, emergency interventions and calls logged for audit", "attrs": {"statement": "System MUST log message lifecycle events (sent, delivered, read) and these audit events: attachment sent, keyword flag raised, manual flag raised, system flag raised, flag resolved, emergency intervention enabled, the emergency intervention message, and call entry."}}
  - {"op": "update_node", "id": "REQ-012-018", "title": "Messaging enabled only after the provider sent a quote; conversation read-only when nothing live is left", "attrs": {"statement": "System MUST enable patient-provider messaging only when provider has sent a quote to patient. The conversation is open while the pair has a live quote, booking or aftercare; it becomes read-only (history kept for both parties, nobody can send, admins can still view it) when the provider is suspended or deactivated, the patient's account is deleted, or nothing live is left between the pair, and it opens again when the same provider sends a new quote. Read-only is derived from those conditions and is not a stored conversation status."}}
  - {"op": "update_node", "id": "REQ-012-020", "title": "Messages and attachments retained for the system retention period with audit export", "attrs": {"statement": "System MUST retain messages and attachments as set by the system PRD, Platform-Wide Rules: One 10-year retention period, and support audit export for compliance."}}
  - {"op": "update_node", "id": "REQ-012-023", "attrs": {"statement": "System MUST log all admin actions (manual flags, flag status changes, enabling emergency intervention, emergency interventions) with timestamp, admin user, reason/notes, and action type for compliance audit."}}
  - {"op": "update_node", "id": "REQ-012-024", "title": "Intervention restricted to authorized admin roles; intervention rate shown against a 5 percent monitoring target", "attrs": {"statement": "System MUST restrict admin intervention to authorized admin roles only; Screen 5 shows the intervention rate (interventions in the calendar month divided by conversations with at least one message in that month) against a monitoring target of under 5%, which blocks nothing; manual observation flags can be used more liberally for proactive monitoring."}}
  - {"op": "update_node", "id": "REQ-012-028", "attrs": {"statement": "System MUST integrate with Payment Processing (FR-007) to lift patient anonymization upon payment confirmation. Until then, on the provider screens the sender label, avatar and search use the masked identifier and View patient profile is hidden."}}
  - {"op": "update_node", "id": "REQ-012-032", "attrs": {"statement": "Audio and video call functionality using Twilio for real-time consultation and communication between patients and providers; Initiate or receive audio/video calls with providers for live consultations and discussions via Twilio; Initiate or receive audio/video calls with patients for consultations and detailed explanations via Twilio; Icon button in header; disabled if provider offline (optional); Calls are started from the chat header; each call leaves a system entry in the conversation (audio or video, start time, duration, outcome answered, missed or declined), and call content is not recorded or monitored."}}
  - {"op": "update_node", "id": "REQ-012-040", "attrs": {"statement": "System validates attachment before upload; If invalid, system blocks upload and displays specific error:; Image must be JPG or PNG format, max 5MB; Video must be MP4 format, max 10MB; PDF must be max 10MB; Maximum 5 attachments per message; This file failed the security scan and was not attached; User can retry with valid content or send the message without the refused file."}}
  - {"op": "update_node", "id": "REQ-012-044", "attrs": {"statement": "S-05 Media Storage for secure storage and retrieval of attachments; virus/malware scanning pipeline: every attachment from a patient, provider or admin is scanned, and a file that fails the scan is refused."}}
  - {"op": "update_node", "id": "REQ-012-060", "title": "Message sender label: You, masked patient identifier or name, Hairline Admin, System", "attrs": {"statement": "\"You\" for provider, the patient's masked identifier until payment is confirmed and then the patient name, \"Hairline Admin\", \"System\" for call entries"}}
  - {"op": "update_node", "id": "REQ-012-061", "attrs": {"statement": "Options: Archive (future), View patient profile (hidden until payment is confirmed); Export conversation is deferred to a future phase"}}
  - {"op": "update_node", "id": "REQ-012-064", "attrs": {"statement": "Shows ALL patient-provider conversations by default; filters narrow the view."}}
  - {"op": "update_node", "id": "REQ-012-085", "attrs": {"statement": "Enabling emergency intervention sets the conversation's active flags to escalated_to_intervention and sending the message updates them to \"Intervention Completed\"; cancelling without sending restores the flags and changes nothing. A conversation manually flagged for observation escalates to emergency intervention when the situation worsens."}}
  - {"op": "update_node", "id": "REQ-012-089", "title": "Intervention success is 30 days without a new flag; post-intervention system flag is configurable", "attrs": {"statement": "System tracks intervention success: an intervention counts as successful when no new flag is raised on that conversation in the 30 days after it (the post-intervention flag does not count). After sending, the system raises a system flag with category Follow-Up Needed for follow-up review unless the post-intervention flag switch on Screen 5 is off (default on)."}}
  - {"op": "update_node", "id": "REQ-012-092", "title": "Patient safety emergency: admin can intervene at once or escalate to the on-call Admin", "attrs": {"statement": "Patient safety emergency during conversation: Admin can intervene immediately using emergency mode to provide guidance or escalate to the on-call Admin."}}
  - {"op": "update_node", "id": "REQ-012-098", "attrs": {"statement": "No provider response within 48 hours: The clock starts at the patient's oldest unanswered message and stops at any provider reply, counted in calendar hours. At 48 hours the system reminds the provider; if there is still no reply at 72 hours, the system itself creates a flag of type system with category Follow-Up Needed on the conversation (no admin is named on it) and sends additional provider reminders via notifications. The follow-up queue is Screen 5 filtered by the Follow-Up Needed category. Admin messaging remains emergency-only."}}
  - {"op": "update_node", "id": "REQ-012-100", "title": "Account deletion anonymises messages and attachments in place and makes the conversation read-only", "attrs": {"statement": "On account deletion the patient's messages and attachments are anonymised in place per FR-023 (REQ-023-044) and kept for the retention period; admin emergency messages are kept; the conversation becomes read-only.", "rationale": "prd.md Data & Privacy Rules; Edge Cases. FR-023 REQ-023-044 treats messages as Communications anonymised in place. The retention period is stated once in REQ-SYS-002."}}
  - {"op": "update_node", "id": "REQ-012-101", "title": "Reason is recorded when an admin enables emergency intervention", "attrs": {"statement": "The reason is recorded when an admin enables emergency intervention; who accessed a conversation and when is stated once in the system PRD rule on role-based, audited access."}}
  - {"op": "update_node", "id": "REQ-012-105", "title": "Admin can edit keyword flags and the post-intervention flag switch", "attrs": {"statement": "Configure moderation rules and automatic keyword flags; maintain compliance audit trail; Keyword/phrase flags that trigger moderation or escalation cues, and the post-intervention flag switch (default on), in the Moderation settings group on Screen 5.", "rationale": "prd.md Admin scope; Admin Editability, Editable by Admin. Notification preferences and quiet hours moved to FR-030. The emergency reason options are a fixed list of three (REQ-012-106)."}}
  - {"op": "update_node", "id": "REQ-012-106", "attrs": {"statement": "Cryptographic standards and security controls; Read receipt semantics and audit logging requirements; Minimum retention periods mandated by compliance; Attachment type and size limits: Images (JPG/PNG max 5MB), Video (MP4 max 10MB), PDF (max 10MB); Maximum number of attachments per message (5); Emergency intervention reasons: the fixed list Policy Violation / Urgent Dispute / Patient Safety."}}
  - {"op": "update_node", "id": "REQ-012-108", "attrs": {"statement": "Patient and provider chat screens MUST offer an on/off switch for machine translation of messages for the reader. The switch is shown and works only while the platform-wide translation switch (FR-021) is on. The translation behavior itself is owned by FR-021; this module owns only the switch in the conversation thread."}}
  - {"op": "update_node", "id": "REQ-012-109", "attrs": {"statement": "Conversation status MUST be calculated from the conversation's flags, with no manual control: Escalated while a flag is escalated_to_intervention (the admin has enabled emergency intervention on Screen 6B and has not yet sent or cancelled); Resolved only when the conversation has at least one flag and all its flags are closed (resolved or intervention_completed); otherwise Active, which covers a conversation with no flag and one with any open flag that is not under intervention. Enabling emergency intervention is the step that sets the flags to escalated_to_intervention; cancelling Screen 6B puts the flags back as they were."}}
  - {"op": "update_node", "id": "STP-012-012", "title": "System validates each attachment's type, size and count and scans it for malware", "attrs": {"prd_ref": "Alternative Flow A1 step 1"}}
