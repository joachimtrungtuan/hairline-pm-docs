  - {"op": "update_node", "id": "REQ-024-081", "attrs": {"statement": "Admin-authored library text (treatment descriptions and technique specifications) and all UI labels and error messages use FR-021 translation keys; FR-021 holds a treatment-library key group for the admin-authored text. The Screen 2 treatment form is the authoring screen for the English text: saving it writes the key's English source value (creating the key if new) and marks the dependent translations Review Needed; translation and publish stay in FR-021 (REQ-021-127). Provider-authored package names and descriptions are free text: they are shown as written, and machine-translated for the reader only when the FR-021 free-text translation switch is on (REQ-021-119). Treatment type codes (FUE, FUT, DHI, Sapphire FUE, Robotic), package item service type codes, and media file names and CDN URLs stay in English. Before production release all keyed treatment and package strings must be registered with the FR-021 translation management system."}}
  - {"op": "update_node", "id": "REQ-027-026", "attrs": {"statement": "Cancellation Policy is a read-only informational document that does NOT require user acceptance. It uses the same versioning and publishing pipeline, but Material Change is fixed to No and not editable and Requires Acceptance is always No. It is shown through the full policy link on the FR-006 booking and payment screens; the refund ladder numbers come from FR-029 and the legal text MUST NOT restate them. The Cancellation Policy acknowledgment checkbox on the FR-006 booking screen (REQ-006-038) is a separate booking-screen acknowledgment owned by FR-006: it is not a legal document acceptance under this module and creates no acceptance record here."}}
  - {"op": "update_node", "id": "STP-027-011", "attrs": {"handoff_from": null}}
  - {"op": "update_node", "id": "REQ-028-083", "attrs": {"statement": "When a country is deactivated in FR-026, regional groupings and price rows that reference it keep applying, and the grouping edit screen warns \"[Country] is deactivated. Remove from ordering?\"; nothing is forced, and an existing grouping or row of a deactivated country can still be saved (REQ-028-092). FR-026 also warns the admin before the deactivation and lists the groupings and price rows that use the country (REQ-026-129)."}}
  - {"op": "update_node", "id": "REQ-028-092", "attrs": {"statement": "A country deactivated in FR-026 MUST keep applying in regional groupings and starting prices (destination rows and fallback rows) until an admin edits them; the active check runs only when a country is newly selected, so an existing grouping or row of a deactivated country can still be saved, for example to set an expiry date; FR-026 warns before the deactivation and lists the regional groupings and fallback price rows that use the country (REQ-026-129)"}}
  - {"op": "update_node", "id": "REQ-029-053", "attrs": {"statement": "System MUST create a new FR-026 Quote Configuration version with Change Type \"System\" whenever the Default Currency changes (REQ-026-142); open quote drafts MUST keep their typed numbers, switch to the new currency without conversion, and require the provider to acknowledge a banner reading \"currency changed, check your prices\" (FR-004 quote screen) before send."}}
  - {"op": "update_node", "id": "SET-commission-rate", "attrs": {"description": "Platform global default commission percentage (allowed range 15-25%, precision 0.1%, the global model is always Percentage) plus provider-specific commission scopes (Percentage 0-100% or Flat Rate, Screen 5). The PRD names no default for the global value. The global rate also sets the commission on an aftercare payment when a provider delivers, as a percentage of the aftercare price (REQ-011-040).", "unit": "percent of booking total or, for an aftercare payment delivered by a provider, of the aftercare price (or fixed amount per completed procedure for Flat Rate)"}}
  - {"op": "update_node", "id": "REQ-032-066", "attrs": {"statement": "Password complexity requirements: minimum 12 characters with an uppercase letter, a lowercase letter, a digit and a special character, fixed by the platform password policy (REQ-SYS-007)", "rationale": "Admin Editability \"Fixed in Codebase\". FR-026 password policy parameters (max login attempts, lockout duration, OTP expiry, resend cooldown) are admin-configurable; complexity is not."}}
  - {"op": "update_node", "id": "ENT-service-status.overall_status", "attrs": {"description": "Current platform status (All Systems Operational, Partial Outage, Major Outage). Color-coded: green/yellow/red. With no active component the status page shows Status not available, which is never a dropdown option"}}
  - {"op": "update_node", "id": "REQ-034-092", "attrs": {"statement": "Admin staff receive email notifications when: Case assigned to them; Case escalated to them (an escalation always goes to a Super Admin, and a system escalation goes to all Super Admins); Patient/provider replies to a case (one email per reply); A case is reopened (a separate reopening notice, in addition to the reply email); An Open or In Progress Urgent case is still unassigned 1 hour after the Urgent clock started (the FR-030 notice `support.urgent_case_unassigned` to the Support Staff pool, REQ-030-258, with the 1-hour wait fixed; if the case is still unassigned at the Urgent Case Unassigned Threshold in Screen 7, default 24 hours, the system escalates it to Super Admin); The assigned admin of a case is deactivated and the case becomes unassigned (the FR-030 notice `support.case_orphaned` to the Support Staff pool, REQ-030-259, to reassign it); A notice to the patient or provider still fails once the FR-030 retry rule is exhausted (the FR-030 notice `support.notice_delivery_failed` to the assigned admin, or to the Support Staff pool when the case is unassigned, REQ-030-260, to contact the patient or provider by hand)"}}
  - {"op": "update_node", "id": "REQ-034-108", "attrs": {"statement": "System automatically detects deactivated admin accounts and marks their assigned cases as \"Unassigned\"; The Support Staff pool receives the FR-030 notice `support.case_orphaned` (REQ-030-259) to reassign orphaned cases; Case timeline logs admin account deactivation event"}}
  - {"op": "update_node", "id": "REQ-034-113", "attrs": {"statement": "System queues the notification for retry following the FR-030 retry rule (FR-030 owns the retry schedule and count); Case timeline logs notification failure with timestamp; Admin dashboard displays notification status indicator (sent, pending, failed); If the notification still fails once the FR-030 retry rule is exhausted, the assigned admin (or the Support Staff pool when the case is unassigned) receives the FR-030 notice `support.notice_delivery_failed` (REQ-030-260) to manually contact the patient/provider"}}
  - {"op": "update_node", "id": "REQ-034-155", "attrs": {"statement": "Auto-escalation thresholds configurable within defined ranges to prevent overly aggressive or too lenient escalation; Urgent Case Unassigned Threshold: Hours before an Open or In Progress urgent case that is still unassigned auto-escalates once to Super Admin (REQ-034-173), counted from when the case is Urgent and unassigned and stopped on assignment, after the FR-030 notice `support.urgent_case_unassigned` (REQ-030-258) to the Support Staff pool at a fixed 1 hour (Min: 1, Max: 48, Default: 24 hours); High Priority Case Threshold: Hours before an Open or In Progress high priority case auto-escalates once to Super Admin (REQ-034-173) if no status change, counted from when the case is High and restarted on any status change; a stall alarm, separate from the resolution targets of Rule 12 (Min: 12, Max: 72, Default: 48 hours); Case Inactivity Threshold: Days before an Open or In Progress case with no activity is flagged for admin review, also the one clock behind the inactivity warnings in the case list and case detail view (Min: 7, Max: 90, Default: 14 days)"}}
  - {"op": "update_node", "id": "REQ-034-173", "attrs": {"statement": "When the Urgent Case Unassigned Threshold or the High Priority Case Threshold runs out, the system marks the case as escalated in its timeline and sends the escalation notice to all Super Admins; it does not reassign the case or change its priority. Both clocks are stall alarms that run only while the case is Open or In Progress. The Urgent clock starts when a case is Urgent and unassigned (at creation, or when it becomes Urgent later) and stops when the case is assigned; the High clock starts when a case is High and restarts on any status change. Each clock escalates once per start, with no repeat. The FR-030 notice `support.urgent_case_unassigned` (REQ-030-258) for an unassigned Urgent case goes to the Support Staff pool after a fixed 1 hour, counted from the same start of the Urgent clock"}}
  - {"op": "update_node", "id": "SET-support-urgent-unassigned-escalation-threshold", "attrs": {"description": "Hours before an Open or In Progress urgent case that is still unassigned auto-escalates once to all Super Admins; the clock starts when the case is Urgent and unassigned and stops on assignment (the FR-030 notice `support.urgent_case_unassigned` goes to the Support Staff pool first, after a fixed 1 hour). Editable by Super Admin on Screen 7 within 1 to 48 hours."}}
  - {"op": "update_node", "id": "REQ-034-147", "attrs": {"statement": "Reopened case appears in default case listing view (Open status); the patient app shows it as Open with the reply box again (FR-035 REQ-035-071)"}}
  - {"op": "update_node", "id": "REQ-035-007", "attrs": {"statement": "System MUST provide \"Was this helpful?\" binary feedback on all content types, with feedback aggregated anonymously at the content level (FR-033 Privacy Rule 2); tapping Yes or No shows the confirmation \"Thank you for your feedback\"; each tap is one vote written to the item's helpfulness count through the FR-033 content interface, so a repeat tap adds another vote (FR-033 REQ-033-096)"}}
  - {"op": "update_node", "id": "REQ-035-028", "attrs": {"statement": "System MUST consume patient-specific Help Center content from FR-033 REST API; an admin publishing, editing, reordering, unpublishing or deleting content reaches the patient view within 1 minute (FR-033 REQ-033-034)", "rationale": "Restated by General Module Rule 4, Screen 2 rules, Dependencies FR-033 and Implementation Notes caching (cache invalidation respects the 1-minute propagation SLA)."}}
  - {"op": "update_node", "id": "REQ-035-033", "attrs": {"statement": "Patient navigates to \"Help & Support\" from the Settings Main screen (FR-001 Screen 15, REQ-001-185); in-app deep link from other screens (e.g., contextual help links from booking, payment, or aftercare screens); push notification tap (e.g., tapping a case status change notification navigates to Ticket Detail); the Report a Problem row on the Hub opens Contact Support with the category preset to Technical Issue and the device, operating system, app version, and report time attached per FR-034 REQ-034-164; a person who is not logged in reaches only the support contact details (REQ-035-024).", "rationale": "Entry Points (lines 96-98). Also Multi-Tenant Breakdown (48) and Dependencies FR-001 (the Settings Main screen has a Help & Support row linking to Screen 1)."}}
  - {"op": "update_node", "id": "REQ-035-039", "attrs": {"statement": "Emergency contact section is a healthcare UX best practice for post-procedure patient safety; the section is always rendered while at least one value is set - it cannot be hidden or require scrolling past it. The section must remain visible regardless of scroll position (sticky or always rendered); emergency phone is read-only with tap-to-call on mobile and emergency email is read-only with tap-to-compose on mobile. Each row is shown only when its App Setting has a value: a row with no value is left out, and the Contact Support row stays."}}
  - {"op": "update_node", "id": "REQ-035-040", "attrs": {"statement": "Emergency phone and email values are two App Settings owned by FR-026 (support emergency contact phone and email); this screen displays them. FR-026 refuses a save that changes the phone or the email and leaves both blank, but both values are blank at launch until an admin sets one; while both are blank the whole section is hidden and the other Hub rows stay (REQ-026-143).", "rationale": "Screen 1 rules, Admin Editability and Business Process Assumption 3; FR-026 REQ-026-143 lets other Screen 8 rows save while both values are blank, as at launch."}}
  - {"op": "update_node", "id": "REQ-035-054", "attrs": {"statement": "Upon successful submission, the system displays a confirmation screen showing the assigned Case ID (CASE-YYYY-#####) and the message \"We will respond within 24 hours on business days\" (REQ-034-175), then navigates to My Support Tickets (Screen 3); the confirmation always shows in the app, whether or not the confirmation email is sent"}}
  - {"op": "update_node", "id": "REQ-037-057", "attrs": {"statement": "Monitoring summary values are derived from valid entries: deleted and superseded entries are excluded from every count and from the severity trend. The monitoring period is the date range from the earlier of the case creation date and the earliest log date through the final case date. The severity trend is in date order; the Initial Severity given at intake is a trend point dated on the case creation date that follows the same-date rule (the latest-timestamped entry on a date wins), and the summary's First recorded severity is the first (earliest-dated) remaining trend point, which can be the intake rating, recalculated when entries are deleted or superseded. Logged-day count, scan count, advice count when applicable, and severity latest, minimum, maximum, average, and trend are derived from the same valid entries. A case with zero logs starts its period on the case creation date, shows the Initial Severity as a one-point trend (first, latest, minimum, maximum and average all equal it), and shows no log entries."}}
  - {"op": "update_node", "id": "ENT-monitoring-conversion.idempotency_key", "attrs": {"description": "One key per case, created at the first Request Treatment and kept when the conversion draft is cleared, so a retry never creates a second inquiry (REQ-037-031)."}}
