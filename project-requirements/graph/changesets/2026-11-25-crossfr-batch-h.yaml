# Cross-FR alignment: graph change-set mirroring the revised PRDs of FR-024, FR-027, FR-028, FR-029, FR-032, FR-033, FR-034, FR-035, FR-037 and FR-038
# New: rules REQ-035-090 (booking reference on the support form), REQ-035-091 (excerpt and video description sources), REQ-035-092 (view recording) and REQ-038-082 (rejected or expired converted request), each with stage, actor, screen and source edges; enum value status_not_available on ENT-service-status.overall_status. Updated: statements of rules in FR-024, FR-027, FR-028, FR-029, FR-032, FR-034, FR-035 and FR-037; one setting description and unit; one field description; stale handoff_from cleared on STP-027-011.
# Cross-FR edges: references from FR-024, FR-027, FR-028, FR-029, FR-034, FR-035 and FR-038 to rules owned by FR-006, FR-011, FR-021, FR-026, FR-030, FR-033, FR-034, FR-001; screen shows edges to ENT-support-case.booking_reference and ENT-monitoring-case.reminder_preference. No node owned by another FR is updated.
reason: "Cross-FR alignment for the FR-024, FR-025, FR-027, FR-028, FR-029, FR-032, FR-033, FR-034, FR-035, FR-037 and FR-038 requirements: treatment text authoring screen (FR-024), legal notices as catalogue events and the booking-screen acknowledgment kept apart from legal acceptance (FR-027), country deactivation warning (FR-028), Default Currency change type and aftercare commission base (FR-029), password policy citation (FR-032), fourth status page value (FR-033), support notices cited from the FR-030 catalogue (FR-034), patient help content update scope, vote and view recording, excerpt and description sources, booking reference on the support form, Settings entry point and hidden emergency contact section (FR-035), zero-log summary and idempotency key description (FR-037), reminder preference field and rejected request outcome (FR-038)."
by: docs-manager
operations:
  - {"op": "add_node", "id": "REQ-035-090", "type": "Rule", "owner_fr": "FR-035", "title": "Contact Support form carries the booking reference from a blocked booking screen", "attrs": {"statement": "When Contact Support is opened from the Payment Window Expired or Cancelled booking screen (FR-006), the booking reference is passed to the form and saved with the case, which is a plain case with no request type (REQ-034-182); the patient does not type or edit it.", "rationale": "Screen 5 field Booking Reference. FR-034 REQ-034-182 owns the case side."}}
  - {"op": "add_node", "id": "REQ-035-091", "type": "Rule", "owner_fr": "FR-035", "title": "Article list excerpt and video description sources", "attrs": {"statement": "The article list excerpt is a 1-2 line preview taken from the first words of the article body, because FR-033 holds no separate excerpt for articles; the Video Detail description is the FR-033 Video Description (up to 500 characters, optional) and is left out when the video has none.", "rationale": "Screen 2 fields Item Excerpt and Video Detail Description."}}
  - {"op": "add_node", "id": "REQ-035-092", "type": "Rule", "owner_fr": "FR-035", "title": "Content views recorded through the content interface", "attrs": {"statement": "Opening an FAQ answer, an article, a resource detail or a video is recorded as a view through the FR-033 content interface and counted each time it is opened; a resource download is counted too, and a video view follows the 30-second rule (FR-033 REQ-033-097, REQ-033-079).", "rationale": "Screen 2 business rules. FR-033 REQ-033-097 owns the counting rule."}}
  - {"op": "add_node", "id": "REQ-038-082", "type": "Rule", "owner_fr": "FR-038", "title": "Rejected or expired converted request leaves the monitoring case final", "attrs": {"statement": "When FR-011 ends a converted request as Rejected or Expired, the monitoring case stays converted and read-only; the patient may start a new standalone request from the same source data in FR-011, which uses a new idempotency key (FR-011 REQ-011-093, REQ-011-094).", "rationale": "Screen 7 business rules. FR-011 owns the receiving side and the new request."}}
