# FR-009 logic review pass 2: ruled fixes applied to the PRD (Provider Team Roles). New rule, steps and flows come first, then new edges, then updates. No node is retired and no edge is removed.
# Cross-FR edges: none. Every edge ends at an FR-009 node, a shared actor or stage, or an FR-009-owned field.
# Queued for other FRs, not done here: FR-004 and FR-010 (clinician lists also rewritten on suspension, role change and admin actions), FR-015 (Owner login email controls, handover not while Deactivated, deactivation trigger for REQ-009-194, Removed email free), FR-030 and FR-020 (events and notices for Reactivate, Cancel Invitation and Owner handover), FR-031 (Manager role-change row).
# Left alone on purpose: stage pinning of rules and steps, the A6 self-removal API-only path, A2 Manager role limit on Expired resend, removal reason storage on Suspend.
reason: "FR-009 logic review pass 2: a move between clinics is remove then a new invitation, no dead Archive unassigned option, Owner record exception to Rule 9, a Manager cannot promote to Manager, replacement clinician on suspension and on a role change that removes rights, one admin flow for force suspend, Reactivate, force remove and account deletion, Removed filter for the Owner, a Removed member's email is free and a new invitation always creates a new record, no Remove on a platform suspension, resend of a Pending invitation, Screen 7 messages for Expired and Cancelled links, Suspended login message, Owner handover while Suspended but not Deactivated, Task Transfer Wizard wired into removal, and missing edges."
by: docs-manager
