  # Reworded Rules (statement copied from the PRD as it reads now)
  - {"op": "update_node", "id": "REQ-034-036", "title": "Support file attachments up to 10MB per file, 5 files per message", "attrs": {"statement": "System MUST support file attachments up to 10MB per file, with up to 5 files per message (replies included)"}}
  - {"op": "update_node", "id": "REQ-034-038", "attrs": {"statement": "System MUST retain all case data per the system PRD, Platform-Wide Rules: One 10-year retention period (archive after closure, do not hard delete)"}}
  - {"op": "update_node", "id": "REQ-034-042", "attrs": {"statement": "System MUST enforce RBAC permissions for case access (Support Staff and Super Admin roles)"}}
  - {"op": "update_node", "id": "REQ-034-056", "title": "Support keyword search across case ID, title, description, names, email and phone", "attrs": {"statement": "System MUST support keyword search across case ID, case title, description, patient name, provider name, email address, and phone number (internal notes are not searched)"}}
  - {"op": "update_node", "id": "REQ-034-058", "title": "Display warning for cases with no activity beyond the Case Inactivity Threshold", "attrs": {"statement": "System MUST display warning for cases with no activity for longer than the Case Inactivity Threshold (Screen 7, default 14 days)"}}
  - {"op": "update_node", "id": "REQ-034-061", "title": "Support auto-closure period: Immediately, 3, 7, or 14 days", "attrs": {"statement": "System MUST support auto-closure period: Immediately, 3, 7, or 14 days after case marked Resolved (default 7 days)"}}
  - {"op": "update_node", "id": "REQ-034-114", "attrs": {"statement": "Default view shows Open and In Progress cases from last 90 days, sorted by Last Updated descending; the provider My Support Cases list (FR-032 Screen 5.7) uses this same default and refers to this rule, while its 20-cases-per-page detail is a separate rule in FR-032"}}
  - {"op": "update_node", "id": "REQ-034-078", "attrs": {"statement": "Cases with no activity for longer than the Case Inactivity Threshold (Screen 7, default 14 days) flagged for admin review and potential closure; the same threshold drives the warning shown in the case list and case detail view"}}
  - {"op": "update_node", "id": "REQ-034-103", "attrs": {"statement": "Admin clicks \"Reassign Case\" (there is no separate escalation button or form); System displays the Reassign Case modal (Screen 5); Admin selects the new assignee, enters the required reassignment reason, and ticks \"Escalate\"; System raises case priority to \"High\" or \"Urgent\" as the admin chooses; System sends the escalation notice to the new assignee; System logs the reassignment in case timeline, marked as an escalation; Case reassigned to higher-level support staff with increased priority", "rationale": "Alternative Flow A1. Escalation is the Escalate tick in the Reassign Case modal (Screen 5); it has no separate screen or form."}}
  - {"op": "update_node", "id": "REQ-034-105", "attrs": {"statement": "Admin manager or colleague opens case; Admin clicks \"Reassign Case\" button; System displays team member list; Admin selects new assignee and enters reassignment reason; System updates case assignment and notifies new assignee; System logs reassignment action in case timeline", "rationale": "Alternative Flow B2. Screen 5 rules add the logging and notification detail. Assignee availability status is out of scope."}}
  - {"op": "update_node", "id": "REQ-034-113", "attrs": {"statement": "System queues the notification for retry following the FR-030 retry rule (FR-030 owns the retry schedule and count); Case timeline logs notification failure with timestamp; Admin dashboard displays notification status indicator (sent, pending, failed); If the notification still fails once the FR-030 retry rule is exhausted, admin receives alert to manually contact patient/provider"}}
  - {"op": "update_node", "id": "REQ-034-118", "attrs": {"statement": "View: Opens case detail view (Screen 3); Reassign: Opens reassignment modal (Screen 5) - only for Open/In Progress cases; Resolve: Opens resolution modal (Screen 4) - only for In Progress cases; Reopen: Reopens case (changes status from Closed to Open) - only for Closed cases; Close: Closes case - only for Resolved cases; Actions column: View, Reassign, Resolve, Reopen, Close; Buttons shown/hidden based on case status; Not sortable", "rationale": "Screen 1 quick actions and Actions column."}}
  - {"op": "update_node", "id": "REQ-034-128", "attrs": {"statement": "Display character count for Title and Description fields; Description: Min 20 chars, max 5000 chars, supports plain text", "rationale": "Screen 2 notes and data fields. Description stays plain text."}}
  - {"op": "update_node", "id": "REQ-034-135", "attrs": {"statement": "Show unread message count badge (required) if patient/provider has sent new messages since last admin view", "rationale": "Screen 3 notes. The read flag is stored for each message; an admin-facing display of whether the patient/provider has viewed a message is a future enhancement."}}
