# FR-036 Admin Profile & Settings Management: first Draft PRD filed in the graph. Draft, awaiting Product Owner approval; rules that depend on open questions carry "Not yet decided" in their statements.
reason: "First Draft PRD for FR-036 (Admin Profile & Settings Management), written from the FR-036 summary in the system PRD and live rules cited by id; awaiting Product Owner approval, not covered by the 2026-11-25 baseline sign-off."
by: controller
source_id: SRC-PRD-036
operations:
  - {"op": "add_source", "id": "SRC-PRD-036", "title": "FR-036 PRD: Admin Profile & Settings Management", "kind": "document", "ref": "project-requirements/functional-requirements/fr036-admin-profile-settings/prd.md", "lifecycle": "pending review", "date": "2026-11-25"}
  - {"op": "add_node", "id": "FR-036", "type": "FR", "title": "Admin Profile & Settings Management", "attrs": {"module": "fr036-admin-profile-settings", "prd_path": "project-requirements/functional-requirements/fr036-admin-profile-settings/prd.md", "summary": "Admin Profile & Settings Management lets every admin user manage their own profile, account settings and notification preferences, independently of team management and access control (FR-031)."}}
  - {"op": "add_field", "id": "ENT-admin-user-account.profile_picture", "entity_id": "ENT-admin-user-account", "name": "profile_picture", "data_type": "media", "title": "Profile picture", "owner_fr": "FR-036", "required": false, "attrs": {"description": "The admin's own picture, JPEG or PNG; size limits not yet decided."}}
  - {"op": "add_node", "id": "SCR-036-01", "type": "Screen", "owner_fr": "FR-036", "title": "My Profile", "attrs": {"platform": "admin", "description": "Admin Platform page where an admin views and edits their own profile details (PRD Screen 1)."}}
  - {"op": "add_node", "id": "SCR-036-02", "type": "Screen", "owner_fr": "FR-036", "title": "Account Settings", "attrs": {"platform": "admin", "description": "Admin Platform page where an admin changes their own password and language (PRD Screen 2). The timezone row is not yet decided."}}
  - {"op": "add_node", "id": "SCR-036-04", "type": "Screen", "owner_fr": "FR-036", "title": "My Activity Log", "attrs": {"platform": "admin", "description": "Admin Platform page where an admin reads their own sign-ins and actions, read-only (PRD Screen 4)."}}
  - {"op": "add_node", "id": "REQ-036-001", "type": "Rule", "owner_fr": "FR-036", "title": "Admin manages only their own profile, settings and preferences, independent of FR-031 permissions", "attrs": {"statement": "Every admin, whatever their role, MUST be able to view and change only their own profile, account settings and notification preferences; these screens do not depend on the team-management or access-control permissions of FR-031.", "rationale": "FR-036 summary in system-prd.md, Profile Management; PRD Functional Requirements Summary."}}
  - {"op": "add_node", "id": "REQ-036-002", "type": "Rule", "owner_fr": "FR-036", "title": "Admin changes own first and last name under the FR-031 name rules", "attrs": {"statement": "The admin MUST be able to change their own first name and last name; both follow the name rules of REQ-031-033 (2 to 50 characters, letters, spaces and hyphens only).", "rationale": "FR-036 summary in system-prd.md, Profile Management; PRD Functional Requirements Summary."}}
  - {"op": "add_node", "id": "REQ-036-003", "type": "Rule", "owner_fr": "FR-036", "title": "Admin uploads a JPEG or PNG profile picture with a size check", "attrs": {"statement": "The admin MUST be able to upload a profile picture as a JPEG or PNG file, and the system MUST check the file size before accepting it; the size and dimension limits are Not yet decided (open question 1).", "rationale": "FR-036 summary in system-prd.md, Profile Management; PRD Functional Requirements Summary."}}
  - {"op": "add_node", "id": "REQ-036-004", "type": "Rule", "owner_fr": "FR-036", "title": "Assigned role and permissions shown read-only on the profile", "attrs": {"statement": "The admin MUST see their assigned role and its permissions on the profile as read-only information; only FR-031 changes them (REQ-031-050).", "rationale": "FR-036 summary in system-prd.md, Profile Management; PRD Functional Requirements Summary."}}
  - {"op": "add_node", "id": "REQ-036-005", "type": "Rule", "owner_fr": "FR-036", "title": "Admin changes own optional phone number in E.164 format", "attrs": {"statement": "The admin MUST be able to change their own phone number, which is optional and in E.164 format (REQ-031-033); an invalid number shows the message of REQ-031-121.", "rationale": "FR-036 summary in system-prd.md, Profile Management; PRD Functional Requirements Summary."}}
  - {"op": "add_node", "id": "REQ-036-006", "type": "Rule", "owner_fr": "FR-036", "title": "Admin changes own email; confirmation not yet decided", "attrs": {"statement": "The admin MUST be able to change their own email address; how the change is confirmed before it takes effect is Not yet decided (open question 2).", "rationale": "FR-036 summary in system-prd.md, Profile Management; PRD Functional Requirements Summary."}}
  - {"op": "add_node", "id": "REQ-036-007", "type": "Rule", "owner_fr": "FR-036", "title": "Password change needs the correct current password and meets the password policy", "attrs": {"statement": "The admin MUST be able to change their own password only after entering the current password correctly, and the new password MUST meet the platform password policy (REQ-SYS-007); a wrong current password or a new password that fails the policy leaves the password unchanged.", "rationale": "FR-036 summary in system-prd.md, Account Settings; PRD Functional Requirements Summary."}}
  - {"op": "add_node", "id": "REQ-036-008", "type": "Rule", "owner_fr": "FR-036", "title": "Admin chooses own Admin Platform language once multi-language support exists", "attrs": {"statement": "The admin MUST be able to choose their own Admin Platform language from the Active languages (REQ-021-004, REQ-021-076), the choice is stored as their preference (REQ-021-117), and the setting is offered once multi-language support (FR-021) is implemented.", "rationale": "FR-036 summary in system-prd.md, Account Settings; PRD Functional Requirements Summary."}}
  - {"op": "add_node", "id": "REQ-036-009", "type": "Rule", "owner_fr": "FR-036", "title": "Timezone setting not yet decided; times follow REQ-026-050 meanwhile", "attrs": {"statement": "Until the timezone setting is decided (open question 3), admin screens MUST show times as REQ-026-050 states.", "rationale": "FR-036 summary in system-prd.md, Account Settings; PRD Functional Requirements Summary."}}
  - {"op": "add_node", "id": "REQ-036-010", "type": "Rule", "owner_fr": "FR-036", "title": "Notification preferences are stored per admin, not per role", "attrs": {"statement": "Each admin MUST have their own notification preferences, stored per admin and not per role.", "rationale": "FR-036 summary in system-prd.md, Notification Preferences; PRD Functional Requirements Summary."}}
  - {"op": "add_node", "id": "REQ-036-011", "type": "Rule", "owner_fr": "FR-036", "title": "Admin switches email and in-app notices per event category", "attrs": {"statement": "The admin MUST be able to switch email and in-app notices on or off for each event category; the categories and the starting values are Not yet decided (open question 4).", "rationale": "FR-036 summary in system-prd.md, Notification Preferences; PRD Functional Requirements Summary."}}
  - {"op": "add_node", "id": "REQ-036-012", "type": "Rule", "owner_fr": "FR-036", "title": "Notices respect admin preferences; locked notices still go by email", "attrs": {"statement": "The system MUST respect each admin's notification preferences when it sends notices (FR-020); a locked notice is still sent by email whatever the preference, as REQ-030-208 states.", "rationale": "FR-036 summary in system-prd.md, Notification Preferences; PRD Functional Requirements Summary."}}
  - {"op": "add_node", "id": "REQ-036-013", "type": "Rule", "owner_fr": "FR-036", "title": "Own activity log is read-only", "attrs": {"statement": "The admin MUST be able to view their own activity log, which is read-only: no entry can be edited or deleted (REQ-SYS-009).", "rationale": "FR-036 summary in system-prd.md, Activity & Audit; PRD Functional Requirements Summary."}}
  - {"op": "add_node", "id": "REQ-036-014", "type": "Rule", "owner_fr": "FR-036", "title": "Activity log row shows timestamp, action type, affected entities and IP address", "attrs": {"statement": "Each activity log row MUST show the timestamp, the action type, the affected entities and the IP address; which actions are listed is Not yet decided (open question 5).", "rationale": "FR-036 summary in system-prd.md, Activity & Audit; PRD Functional Requirements Summary."}}
  - {"op": "add_node", "id": "REQ-036-015", "type": "Rule", "owner_fr": "FR-036", "title": "Activity log filters by date range and action type", "attrs": {"statement": "The admin MUST be able to filter the activity log by date range and action type; both filters behave as stated in REQ-022-117.", "rationale": "FR-036 summary in system-prd.md, Activity & Audit; PRD Functional Requirements Summary."}}
