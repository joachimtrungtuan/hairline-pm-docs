  - {"op": "add_node", "id": "REQ-033-001", "type": "Rule", "owner_fr": "FR-033", "title": "Separate provider and patient Help Centre content repositories", "attrs": {"statement": "System MUST provide Help Centre content management for TWO distinct audiences: Providers and Patients, with completely separated content repositories", "rationale": "Restated by Rule 1, Rule 7 and Privacy Rule 3 (repositories completely separated by audience; no sharing across audiences without manual re-creation), Admin Editability (audience types fixed to Provider and Patient) and the Content Separation note (separate tables or repositories)."}}
  - {"op": "add_node", "id": "REQ-033-002", "type": "Rule", "owner_fr": "FR-033", "title": "Ten-category provider Help Centre taxonomy", "attrs": {"statement": "System MUST support the 10-category provider Help Centre taxonomy (FAQ's, Tutorial Guides, Contact Support, Troubleshooting Tips, Resource Library, Community Forum, Feedback & Suggestions, Service Status, Policy Information, Video Tutorials) aligned with FR-032, backed by underlying content types and integrations (Contact Support/Feedback routed to FR-034)", "rationale": "Restated by Multi-Tenant Breakdown (provider Help Centre includes 10 categories) and Screen 1.1 (taxonomy fixed; admins configure labels, order, visibility and routing). Contact Support, Feedback & Suggestions and Community Forum are only configured in FR-033; submissions and forum interactions are handled outside it."}}
  - {"op": "add_node", "id": "REQ-033-003", "type": "Rule", "owner_fr": "FR-033", "title": "Four patient content types, no Service Status", "attrs": {"statement": "System MUST support 4 Help Centre content types for patients (FAQs, Articles, Resources, Videos - NO Service Status) displayed via FR-035 patient app", "rationale": "Restated by Multi-Tenant Breakdown (patient Help Centre: FAQs, Tutorial Guides, Troubleshooting Tips, Resource Library, Video Tutorials; no Service Status page for patients), Admin Editability (4 content types for patients) and Screen 8 to 13 (Service Status management excluded for patients)."}}
  - {"op": "add_node", "id": "REQ-033-004", "type": "Rule", "owner_fr": "FR-033", "title": "Admin creates content with audience, category, type, body, attachments, tags and status", "attrs": {"statement": "Admins MUST be able to create Help Centre content with audience selection (Provider or Patient), category assignment, content type, title, rich text body, file attachments, tags, and publish status", "rationale": "Restated by Main Flow steps 1 to 15, Rule 7 (admin must explicitly select the audience) and Admin Editability (title, body, attachments, category assignment, publish status, audience type are editable)."}}
  - {"op": "add_node", "id": "REQ-033-005", "type": "Rule", "owner_fr": "FR-033", "title": "Six content types for both audiences", "attrs": {"statement": "System MUST support multiple content types (FAQ, Tutorial Guide, Troubleshooting Tip, Video Tutorial, Resource Document, Policy Document) applicable to both audiences", "rationale": "Restated by Admin Editability (content type options are fixed in code)."}}
  - {"op": "add_node", "id": "REQ-033-006", "type": "Rule", "owner_fr": "FR-033", "title": "FAQ topic sections with drag-and-drop reordering", "attrs": {"statement": "Admins MUST be able to organize FAQ content into collapsible topic sections with drag-and-drop reordering for both provider and patient FAQs separately", "rationale": "Restated by Alternative Flow A3, Screen 2 and Screen 2.2 rules, Admin Editability (FAQ topic organisation and FAQ item assignment) and User Story 5."}}
  - {"op": "add_node", "id": "REQ-033-007", "type": "Rule", "owner_fr": "FR-033", "title": "Providers read provider Help Centre categories read-only via FR-032", "attrs": {"statement": "Providers MUST be able to access provider-specific Help Centre categories in read-only mode via FR-032 with category-appropriate layouts (accordion FAQs, article views, file viewer, video player, status page)", "rationale": "Restated by Provider Consumption workflow (FR-032 loads the category registry and published provider-audience content; providers interact read-only; feedback and support submissions go through FR-032 and FR-034), Multi-Tenant Breakdown and Rule 2 (providers and patients have read-only access)."}}
  - {"op": "add_node", "id": "REQ-033-008", "type": "Rule", "owner_fr": "FR-033", "title": "Patients read patient Help Centre content read-only via FR-035", "attrs": {"statement": "Patients MUST be able to access patient-specific Help Centre content in read-only mode via FR-035 (Patient Help Center & Support Submission)", "rationale": "Restated by Multi-Tenant Breakdown and Rule 2 (providers and patients have read-only access to their respective content)."}}
  - {"op": "add_node", "id": "REQ-033-009", "type": "Rule", "owner_fr": "FR-033", "title": "Rich text editing for content creation", "attrs": {"statement": "System MUST support rich text editing for content creation with formatting (bold, italic, lists, links, images, tables) for both audiences", "rationale": "Restated by Dependencies (rich text editor library). If the editor library fails to load the PRD falls back to a plain textarea with markdown support (not migrated as a rule: technical fallback)."}}
  - {"op": "add_node", "id": "REQ-033-010", "type": "Rule", "owner_fr": "FR-033", "title": "File upload size limits: PDF 50MB, video 500MB, image 10MB", "attrs": {"statement": "System MUST support file uploads for Help Centre content (PDFs max 50MB, videos max 500MB, images max 10MB) for both audiences", "rationale": "Restated by Alternative Flow B2, Admin Editability (upload size limits fixed in code) and Edge Cases (upload over the limit)."}}
  - {"op": "add_node", "id": "REQ-033-011", "type": "Rule", "owner_fr": "FR-033", "title": "Preview content as the audience will see it before publishing", "attrs": {"statement": "System MUST provide content preview functionality allowing admins to view content exactly as target audience will see it before publishing", "rationale": "Restated by Main Flow steps 9 and 10 and Screen 7."}}
  - {"op": "add_node", "id": "REQ-033-012", "type": "Rule", "owner_fr": "FR-033", "title": "Content versioning with admin identity, timestamp, audience type and version notes", "attrs": {"statement": "System MUST support content versioning tracking all changes with admin identity, timestamp, audience type, and version notes", "rationale": "Restated by Alternative Flow A2 steps 5 to 9 and Admin Editability (versioning enabled by default and cannot be disabled)."}}
  - {"op": "add_node", "id": "REQ-033-013", "type": "Rule", "owner_fr": "FR-033", "title": "Content record metadata", "attrs": {"statement": "System MUST store Help Centre content with metadata including audience type (Provider/Patient), content type, title, body, tags, publish status, created date, updated date, created by admin, updated by admin"}}
  - {"op": "add_node", "id": "REQ-033-014", "type": "Rule", "owner_fr": "FR-033", "title": "Provider-only Service Status data", "attrs": {"statement": "System MUST store provider-specific Service Status data with metadata (overall status, service components with statuses, incidents with timeline, maintenance windows with schedules) - NOT applicable to patient content", "rationale": "Restated by Multi-Tenant Breakdown (no Service Status page for patients) and Key Entities 6 to 8."}}
  - {"op": "add_node", "id": "REQ-033-015", "type": "Rule", "owner_fr": "FR-033", "title": "Audit trail for content creation, editing, publishing, unpublishing and deletion", "attrs": {"statement": "System MUST maintain audit trail logging all content creation, editing, publishing, unpublishing, and deletion actions with admin identity, audience type, and timestamp", "rationale": "Restated by Rule 5 (audit also records audience type and action type), the Audit Rule, Main Flow step 13, Alternative Flows A2 and A5 (unpublish logged with reason), Screen 1.1 (category configuration changes recorded with old and new value) and Security Considerations (adds the admin IP address; PRD line 1247)."}}
  - {"op": "add_node", "id": "REQ-033-016", "type": "Rule", "owner_fr": "FR-033", "title": "Soft delete to Archived status for both audiences", "attrs": {"statement": "System MUST support soft-delete for content (move to \"Archived\" status) not permanent deletion for both audiences", "rationale": "Restated by Rule 6 (soft delete supports recovery and audit compliance), Data Retention (archived content retained indefinitely) and the delete rules of Screens 2 to 5."}}
  - {"op": "add_node", "id": "REQ-033-017", "type": "Rule", "owner_fr": "FR-033", "title": "File attachments stored in media storage with audience tags", "attrs": {"statement": "System MUST store file attachments in media storage service (S-05) with references in Help Centre content records and audience type tags", "rationale": "Restated by Security Considerations (files tagged with audience type for access control)."}}
  - {"op": "add_node", "id": "REQ-033-018", "type": "Rule", "owner_fr": "FR-033", "title": "Content view analytics tracked separately per audience", "attrs": {"statement": "System MUST track content view analytics (total views per content item, views over time) separately for provider and patient audiences", "rationale": "Restated by Privacy Rule 2 (provider analytics at organisation level; patient analytics aggregated), Content Separation (analytics and view counts tracked separately per audience) and Shared Admin Capabilities (view counts, search queries, popular topics by audience)."}}
  - {"op": "add_node", "id": "REQ-033-019", "type": "Rule", "owner_fr": "FR-033", "title": "Authentication required for Help Centre access", "attrs": {"statement": "System MUST enforce authentication for Help Centre access (providers, patients, and admins must be logged in)", "rationale": "Restated by Security Considerations (authentication)."}}
  - {"op": "add_node", "id": "REQ-033-020", "type": "Rule", "owner_fr": "FR-033", "title": "Only admins with Help Centre permissions manage content", "attrs": {"statement": "System MUST enforce authorization for content management (only admins with Help Centre management permissions can create/edit/publish content for both audiences)", "rationale": "Restated by Rule 2 (only admins create, edit or delete Help Centre content; providers and patients have read-only access), Dependencies (FR-031 admin role permissions) and Security Considerations (authorization)."}}
  - {"op": "add_node", "id": "REQ-033-021", "type": "Rule", "owner_fr": "FR-033", "title": "Audience-based access control", "attrs": {"statement": "System MUST enforce audience-based access control preventing providers from accessing patient content and patients from accessing provider content", "rationale": "Restated by Privacy Rule 3 and Security Considerations (audience separation enforced at API level)."}}
  - {"op": "add_node", "id": "REQ-033-022", "type": "Rule", "owner_fr": "FR-033", "title": "Virus scan before files are made available", "attrs": {"statement": "System MUST scan all uploaded files for viruses before making available to users", "rationale": "Restated by Dependencies, external service 3 (if the scanner is unavailable uploads are quarantined and the admin notified; files are not made available until the scan completes) and Security Considerations (file upload)."}}
  - {"op": "add_node", "id": "REQ-033-023", "type": "Rule", "owner_fr": "FR-033", "title": "Sanitise rich text HTML", "attrs": {"statement": "System MUST sanitize rich text HTML input to prevent XSS attacks (strip dangerous tags: script, iframe, object)", "rationale": "Restated by Security Considerations (content injection: strip script and iframe tags before saving; Content Security Policy headers are a technical measure and not migrated)."}}
  - {"op": "add_node", "id": "REQ-033-024", "type": "Rule", "owner_fr": "FR-033", "title": "File type whitelist for uploads", "attrs": {"statement": "System MUST enforce file type whitelist for uploads (PDF, MP4, MOV, JPG, PNG only) rejecting all other file types", "rationale": "Restated by Security Considerations (whitelist PDF, MP4, MOV, JPG, PNG). Screen 4 lists a wider resource whitelist (PDF, DOCX, XLSX, PNG, JPG); see the needs-decision item."}}
  - {"op": "add_node", "id": "REQ-033-025", "type": "Rule", "owner_fr": "FR-033", "title": "REST API for provider platform content", "attrs": {"statement": "System MUST provide REST API for provider platform (FR-032) to fetch provider-specific Help Centre content with authentication", "rationale": "Integration Point 1 (JSON payload, endpoint, provider session token) is technical and not migrated."}}
  - {"op": "add_node", "id": "REQ-033-026", "type": "Rule", "owner_fr": "FR-033", "title": "REST API for patient app content", "attrs": {"statement": "System MUST provide REST API for patient app (FR-035) to fetch patient-specific Help Centre content with authentication", "rationale": "Integration Point 2 (JSON payload, endpoint, patient session token) is technical and not migrated."}}
  - {"op": "add_node", "id": "REQ-033-027", "type": "Rule", "owner_fr": "FR-033", "title": "Media storage integration with audience tagging", "attrs": {"statement": "System MUST integrate with media storage service (S-05) for file upload, retrieval, and deletion with audience type tagging", "rationale": "Integration Point 4 (signed upload URLs; retry) is technical; the retry outcome is a separate rule."}}
  - {"op": "add_node", "id": "REQ-033-028", "type": "Rule", "owner_fr": "FR-033", "title": "Rich text editor library integration", "attrs": {"statement": "System MUST integrate with rich text editor library (Quill/TinyMCE/CKEditor) for content creation interface"}}
  - {"op": "add_node", "id": "REQ-033-029", "type": "Rule", "owner_fr": "FR-033", "title": "Virus scanning service integration", "attrs": {"statement": "System MUST integrate with virus scanning service for file upload security validation"}}
  - {"op": "add_node", "id": "REQ-033-030", "type": "Rule", "owner_fr": "FR-033", "title": "Service Status management for providers only", "attrs": {"statement": "Admins MUST be able to manage Service Status components, incidents, and maintenance windows for provider audience only (not applicable to patient audience)", "rationale": "Restated by Multi-Tenant Breakdown, Screens 8 to 13 (excluded for patients) and Assumption 4 of Business Process (service status updates are made by Hairline technical operations)."}}
  # --- Rules: prose rules without an ID, numbered REQ-033-031 onward in PRD reading order (location in rationale)
  - {"op": "add_node", "id": "REQ-033-031", "type": "Rule", "owner_fr": "FR-033", "title": "Entry points to Help Centre management and the provider Help Centre", "attrs": {"statement": "Admins access Help Centre management via Settings > Help Centre Management, with quick access from the admin dashboard. Providers access the Help Centre via the \"Help Centre\" menu item in provider platform navigation and a direct link from the provider dashboard settings page (FR-032 integration point).", "rationale": "Context-sensitive help links from provider platform screens are a future enhancement (not migrated). PRD: Entry Points (102-115); Dependencies FR-032 (1115-1117)."}}
  - {"op": "add_node", "id": "REQ-033-032", "type": "Rule", "owner_fr": "FR-033", "title": "Out of scope: support submissions, live chat, forum, chatbot, notifications", "attrs": {"statement": "FR-033 does not handle Provider Contact Support or Feedback & Suggestions form submissions or patient support submissions (FR-034 Support Center & Ticketing creates the support cases), real-time chat between providers and admin (separate communication module A-10), provider-to-provider community forum interactions (FR-033 can only configure category presentation and routing) or automated chatbot responses (future V2). Content update notifications and email digest subscriptions are future enhancements.", "rationale": "FR-033 provides read-only Help Centre content; FR-034 handles all support ticket and feedback case management for providers and patients. PRD: Communication Structure (86-100); Dependencies FR-034 (1131-1133)."}}
  - {"op": "add_node", "id": "REQ-033-033", "type": "Rule", "owner_fr": "FR-033", "title": "Category registry and service status changes reach providers within 1 minute", "attrs": {"statement": "Changes to the category registry and status updates to service components, incidents and maintenance propagate to provider Help Centre navigation and the provider Service Status subscreen within 1 minute.", "rationale": "Content update propagation within 1 minute is stated by REQ-032-092 (provider) and REQ-035-028 (patient); no separate FR-033 node was created for it. PRD: Screen 1.1 (343); Screen 6 (833); Alternative Flow A6 step 9 (276)."}}
  - {"op": "add_node", "id": "REQ-033-034", "type": "Rule", "owner_fr": "FR-033", "title": "Publish, edit and reorder take effect in the Help Centre immediately", "attrs": {"statement": "Publishing content, editing published content, reordering FAQ topics or FAQs, and unpublishing content take effect immediately in the provider Help Centre.", "rationale": "Main Flow step 14, A2 step 10, A3 step 11, A5 step 7. The PRD also says content updates propagate within 1 minute (REQ-032-092); see the needs-decision item. PRD: Main Flow 14 (160); A2 (186); A3 (201); A5 (231)."}}
  - {"op": "add_node", "id": "REQ-033-035", "type": "Rule", "owner_fr": "FR-033", "title": "Full-text search across all Help Centre content, scoped to the audience", "attrs": {"statement": "Full-text search across all content (title, body, tags) is required for P1 and scoped to the selected audience (provider or patient). Database full-text indexing is the minimum implementation baseline; a dedicated search engine remains an optional later enhancement.", "rationale": "Also stated in Multi-Tenant Breakdown (search across all provider Help Centre content, line 54) and Content Separation (search and filtering scoped to the selected audience). PRD: Implementation Notes Search (1205); Multi-Tenant Breakdown (54)."}}
  - {"op": "add_node", "id": "REQ-033-036", "type": "Rule", "owner_fr": "FR-033", "title": "Content tagged with audience and exactly one predefined category", "attrs": {"statement": "Content must be tagged with audience type (Provider or Patient) and assigned to exactly one of the predefined categories for that audience.", "rationale": "Business Rules, General Module Rules, Rule 3. PRD: General Module Rules, Rule 3 (1013)."}}
  - {"op": "add_node", "id": "REQ-033-037", "type": "Rule", "owner_fr": "FR-033", "title": "Content states: Draft, Published, Unpublished", "attrs": {"statement": "Content can exist in three states: Draft (admin-only), Published (audience-visible), Unpublished (admin-only, previously published).", "rationale": "Rule 4. REQ-033-016 adds an Archived status for soft-deleted content; see the needs-decision item. PRD: General Module Rules, Rule 4 (1014)."}}
  - {"op": "add_node", "id": "REQ-033-038", "type": "Rule", "owner_fr": "FR-033", "title": "Help Centre content is non-sensitive and open to all users of the audience", "attrs": {"statement": "Help Centre content is non-sensitive and accessible to all users within their respective audience (all provider staff see provider content; all patients see patient content; no role-based content restrictions).", "rationale": "Dependencies FR-009 (all provider roles can access the provider Help Centre). PRD: Data & Privacy Rules, Privacy Rule 1 (1021)."}}
  - {"op": "add_node", "id": "REQ-033-039", "type": "Rule", "owner_fr": "FR-033", "title": "Analytics at organisation level for providers, aggregated for patients", "attrs": {"statement": "Content view analytics are tracked at organization level for providers (clinic), and aggregated for patients (not individual user level).", "rationale": "Privacy Rule 2. Security Considerations (line 1248) says helpfulness feedback is logged with user identity; see the needs-decision item. PRD: Data & Privacy Rules, Privacy Rule 2 (1022)."}}
  - {"op": "add_node", "id": "REQ-033-040", "type": "Rule", "owner_fr": "FR-033", "title": "Archived content and audit log retained indefinitely", "attrs": {"statement": "Archived content is retained indefinitely for historical reference and audit compliance; the audit log is retained indefinitely for compliance.", "rationale": "Data Retention rule and Admin Editability (audit log retention period fixed in code). PRD: Data Retention (1025); Admin Editability (1058)."}}
  - {"op": "add_node", "id": "REQ-033-041", "type": "Rule", "owner_fr": "FR-033", "title": "Fixed in code: categories, content types, audiences, size and character limits", "attrs": {"statement": "These are fixed in code and not editable by admins: the 10 provider Help Centre categories; 5 content types for providers and 4 for patients (no Service Status); the audience types Provider and Patient (no new audience types); the content type options (FAQ, Tutorial Guide, Troubleshooting Tip, Video Tutorial, Resource Document, Policy Document); the file upload size limits (PDF 50MB, Video 500MB, Image 10MB); the content body character limits (max 5000 characters for FAQ answers, max 10,000 characters for tutorial guides); the audit log retention period.", "rationale": "Admin Editability, Fixed in Codebase. No Setting node is created because the PRD names none as configurable. PRD: Admin Editability, Fixed in Codebase (1052-1058)."}}
  - {"op": "add_node", "id": "REQ-033-042", "type": "Rule", "owner_fr": "FR-033", "title": "Content versioning is always on", "attrs": {"statement": "Content versioning is enabled by default; admins cannot disable version control, for provider and patient content alike.", "rationale": "Configurable with Restrictions. PRD: Admin Editability, Configurable with Restrictions (1062)."}}
  - {"op": "add_node", "id": "REQ-033-043", "type": "Rule", "owner_fr": "FR-033", "title": "Admins reorder and hide categories but cannot add or remove them", "attrs": {"statement": "Provider Help Centre categories are fixed to the 10-category taxonomy in system-prd.md; admins can reorder and toggle visibility but cannot add or remove categories. Categories are predefined and cannot be deleted.", "rationale": "Screen 1.1 rules and Admin Editability (category visibility; applies separately to provider and patient content). PRD: Screen 1.1 (333, 341); Admin Editability (1061)."}}
  - {"op": "add_node", "id": "REQ-033-044", "type": "Rule", "owner_fr": "FR-033", "title": "Hiding a required MVP category needs admin confirmation", "attrs": {"statement": "Admins cannot hide required MVP categories without admin confirmation.", "rationale": "Screen 1.1 Visibility Toggle validation. The PRD does not say which categories are required MVP categories. PRD: Screen 1.1 data fields (329)."}}
  - {"op": "add_node", "id": "REQ-033-045", "type": "Rule", "owner_fr": "FR-033", "title": "Contact Support and Feedback & Suggestions route to FR-034 ticket forms", "attrs": {"statement": "For Contact Support and Feedback & Suggestions, Routing Type MUST be Ticket Form and MUST route to the FR-034-backed submission flows exposed in provider UX (FR-032 integration).", "rationale": "Routing Type options are Content List, Ticket Form, External Link and Coming Soon. PRD: Screen 1.1 rules (342)."}}
  - {"op": "add_node", "id": "REQ-033-046", "type": "Rule", "owner_fr": "FR-033", "title": "Community Forum defaults to Coming Soon; External Link needs an HTTPS URL", "attrs": {"statement": "For Community Forum, Routing Type defaults to Coming Soon in MVP; if set to External Link, the External URL is required and must be a valid HTTPS URL.", "rationale": "PRD: Screen 1.1 data fields (331) and rules (343)."}}
  - {"op": "add_node", "id": "REQ-033-047", "type": "Rule", "owner_fr": "FR-033", "title": "Category configuration changes are versioned and audited with old and new value", "attrs": {"statement": "All category configuration changes are versioned and recorded in audit trail (who/when/old value/new value).", "rationale": "Near the general audit rule REQ-033-015, which lists content actions only. PRD: Screen 1.1 rules (344)."}}
  - {"op": "add_node", "id": "REQ-033-048", "type": "Rule", "owner_fr": "FR-033", "title": "Category label and description limits", "attrs": {"statement": "Category Label is required (max 50 characters); Category Description is optional (max 200 characters); Contact Support and Feedback & Suggestions intro copy is optional admin-managed rich text with sanitized HTML, shown above the submission CTA/form.", "rationale": "PRD: Screen 1.1 data fields (326-332)."}}
  - {"op": "add_node", "id": "REQ-033-049", "type": "Rule", "owner_fr": "FR-033", "title": "Dashboard category navigation routes to the matching management screen", "attrs": {"statement": "The dashboard provides category navigation matching the provider Help Centre taxonomy (10 categories): FAQs open FAQ Management; Tutorial Guides, Troubleshooting Tips and Policy Information open Article Management filtered to that Article Type; Resources open Resource Management; Videos open Video Management; Service Status opens Service Status Management; Contact Support, Feedback & Suggestions and Community Forum open Category Configuration.", "rationale": "Screen 1 rules and notes. Patient Screen 8 mirrors it. PRD: Screen 1 rules (305-313)."}}
  - {"op": "add_node", "id": "REQ-033-050", "type": "Rule", "owner_fr": "FR-033", "title": "Dashboard quick stats and recent activity", "attrs": {"statement": "Quick stats (total content, published content, draft content, total views) are calculated, read-only and update in real time as aggregate metrics across all content types. Recent activity shows content created, edited and published, category configuration changes and service status updates, sorted by date.", "rationale": "PRD: Screen 1 data fields and rules (297-315)."}}
  - {"op": "add_node", "id": "REQ-033-051", "type": "Rule", "owner_fr": "FR-033", "title": "Patient content management screens mirror the provider screens, admin-only", "attrs": {"statement": "Patient Help Centre content management screens (Screens 8 to 13) are admin-only screens on the Admin Platform that mirror the provider content management screens (Screens 1 to 7) in structure and functionality, except that patients have no Service Status management; the audience of content managed there is displayed to patients via FR-035.", "rationale": "Version 2.1 change log: patient screens are admin-only, not patient app screens. PRD: Patient Help Centre Content Management note (977-996)."}}
  - {"op": "add_node", "id": "REQ-033-052", "type": "Rule", "owner_fr": "FR-033", "title": "Admin UI labels audience; no copying between audiences", "attrs": {"statement": "Admin UI clearly labels content as \"Patient Content\" or \"Provider Content\" throughout the interface; search and filtering are scoped to the selected audience; content cannot be copied or shared between provider and patient repositories (manual re-creation required).", "rationale": "Content Separation note and Rule 7. PRD: Content Separation (999-1004)."}}
  - {"op": "add_node", "id": "REQ-033-053", "type": "Rule", "owner_fr": "FR-033", "title": "Saved content carries a status and timestamps, with a success confirmation", "attrs": {"statement": "System saves content with status (Draft or Published) and timestamps and displays a success confirmation; for published content the confirmation links to the published content.", "rationale": "Main Flow steps 11, 12 and 15. PRD: Main Flow 11-15 (158-162)."}}
  - {"op": "add_node", "id": "REQ-033-054", "type": "Rule", "owner_fr": "FR-033", "title": "Editing content creates a version; optional version note", "attrs": {"statement": "When an admin edits existing content, the editor is pre-filled with the existing content and the system creates a new version in version control; the admin may add an optional \"Version note\" describing what changed; the system updates the content version and logs the change in the audit trail.", "rationale": "Alternative Flow A2. PRD: Alternative Flow A2 (171-186)."}}
  - {"op": "add_node", "id": "REQ-033-055", "type": "Rule", "owner_fr": "FR-033", "title": "Unpublish needs confirmation and a reason; content stays in admin view", "attrs": {"statement": "To unpublish content the admin must confirm and enter a reason; the status changes from Published to Unpublished, the content is removed immediately from the audience's Help Centre view, the action is logged in the audit trail with the reason, and the content remains in admin view as Unpublished for editing or re-publishing.", "rationale": "Alternative Flow A5. PRD: Alternative Flow A5 (222-233)."}}
  - {"op": "add_node", "id": "REQ-033-056", "type": "Rule", "owner_fr": "FR-033", "title": "Publish validates required fields and formats", "attrs": {"statement": "On Publish the system validates required fields (category, title, content body) and file formats, highlights missing or invalid fields with an error message, and publishes only after the admin corrects them and re-submits.", "rationale": "Alternative Flow B1; Screen forms validate required fields before saving. PRD: Alternative Flow B1 (235-247)."}}
  - {"op": "add_node", "id": "REQ-033-057", "type": "Rule", "owner_fr": "FR-033", "title": "Over-limit upload shows the limit and alternatives", "attrs": {"statement": "When a file exceeds its size limit (videos 500MB, PDFs 50MB, images 10MB) the system displays an error message with the limit and suggested alternatives (compress the file, use external video hosting); the admin may re-upload a smaller file or add an external video embed link (YouTube or Vimeo).", "rationale": "Alternative Flow B2. PRD: Alternative Flow B2 (249-262)."}}
  - {"op": "add_node", "id": "REQ-033-058", "type": "Rule", "owner_fr": "FR-033", "title": "Failed media upload after retries notifies the admin and saves a draft", "attrs": {"statement": "If an upload to media storage fails after 3 retry attempts with exponential backoff, the system notifies the admin and saves the content as draft.", "rationale": "Promoted from Integration Point 4 (error handling). PRD: Integration Points, Integration 4 (1230)."}}
  - {"op": "add_node", "id": "REQ-033-059", "type": "Rule", "owner_fr": "FR-033", "title": "Deleting content asks for confirmation and is a soft delete", "attrs": {"statement": "Deleting a FAQ, article, resource or video prompts the admin for confirmation before deletion, and the deletion is a soft delete.", "rationale": "Near REQ-033-016, which states the soft-delete outcome without the confirmation prompt. PRD: Screen 2 (366); Screen 3 (497); Screen 4 (588); Screen 5 (696)."}}
  - {"op": "add_node", "id": "REQ-033-060", "type": "Rule", "owner_fr": "FR-033", "title": "Add/Edit forms: pre-fill, defaults, return to list, cancel discards", "attrs": {"statement": "Add/Edit forms open pre-filled with current data when editing and empty with default values (Draft status) when creating; on save the item is created or updated and the admin returns to the list with the updated list; on cancel changes are discarded and the admin returns to the list.", "rationale": "Business rules of Screens 2.1, 3.1, 4.1, 5.1, 6.1, 6.2 and 6.3 (service status forms default to their own initial status, see the service status rules). PRD: Screens 2.1 (410-418), 3.1 (535-545), 4.1 (629-641), 5.1 (736-760)."}}
  - {"op": "add_node", "id": "REQ-033-061", "type": "Rule", "owner_fr": "FR-033", "title": "Rich text formats supported by content type", "attrs": {"statement": "The FAQ answer editor supports bold, italic, lists, links and images; the article editor also supports headings (H1 to H6), tables and code blocks, with image upload inline within the editor.", "rationale": "Screen 2.1 and Screen 3 / 3.1 rules. PRD: Screen 2.1 (415); Screen 3 (498-506); Screen 3.1 (539)."}}
  - {"op": "add_node", "id": "REQ-033-062", "type": "Rule", "owner_fr": "FR-033", "title": "Bulk operations on content", "attrs": {"statement": "Admins can run bulk operations: assign multiple FAQs to a topic, change status for multiple FAQs, articles, resources or videos, delete multiple items, and upload multiple resource files at once; multiple FAQs can be edited in batch.", "rationale": "Screen 2, 3, 4 and 5 rules and notes; Shared Admin Capabilities (bulk operations). PRD: Screen 2 (368, 386); Screen 3 (515); Screen 4 (607); Screen 5 (704)."}}
  - {"op": "add_node", "id": "REQ-033-063", "type": "Rule", "owner_fr": "FR-033", "title": "Related content assigned manually or auto-suggested", "attrs": {"statement": "Related articles and related videos can be assigned manually or auto-suggested based on tags or category; related content references other items of the same Help Centre.", "rationale": "Screens 3, 3.1, 5 and 5.1. PRD: Screen 3 (503); Screen 5 (703)."}}
  - {"op": "add_node", "id": "REQ-033-064", "type": "Rule", "owner_fr": "FR-033", "title": "FAQ list organised by topic with drag-and-drop ordering", "attrs": {"statement": "The FAQ list displays all FAQs organized by topics with expandable topic sections; FAQs can be reordered by drag-and-drop within topics; the Preview button shows the exact accordion layout providers will see; the FAQ editor is optimized for accordion display (question as header, answer as expandable content).", "rationale": "Screen 2 rules. List filtering and search are owned by REQ-022-118. PRD: Screen 2 rules (360-370)."}}
  - {"op": "add_node", "id": "REQ-033-065", "type": "Rule", "owner_fr": "FR-033", "title": "FAQ field rules", "attrs": {"statement": "FAQ question is required (max 200 characters); FAQ answer is required (max 5000 characters, HTML formatting supported); FAQ topic is required and chosen from pre-defined topics or a newly created one; display order is optional (an integer, auto-incremented within the topic if not specified); publish status is Draft, Published or Unpublished and defaults to Draft; question and answer are required before saving.", "rationale": "Screens 2 and 2.1. PRD: Screen 2 (352-359); Screen 2.1 (398-418)."}}
  - {"op": "add_node", "id": "REQ-033-066", "type": "Rule", "owner_fr": "FR-033", "title": "FAQ topic fields, uniqueness and ordering", "attrs": {"statement": "A topic name is required (max 100 characters) and unique within the audience; a topic description is optional (max 250 characters); display order is a required positive integer and topics can be reordered by drag-and-drop; Save Order persists the order and the provider Help Centre FAQ accordion reflects the updated topic order; Cancel discards unsaved changes.", "rationale": "Screen 2.2. PRD: Screen 2.2 (440-457)."}}
  - {"op": "add_node", "id": "REQ-033-067", "type": "Rule", "owner_fr": "FR-033", "title": "A topic with FAQs cannot be deleted", "attrs": {"statement": "A topic that has assigned FAQs cannot be hard-deleted: the system blocks deletion and prompts the admin to reassign or remove the FAQs first; a topic may be soft-deleted only when no FAQs are assigned.", "rationale": "Screen 2.2. PRD: Screen 2.2 (450-452)."}}
  - {"op": "add_node", "id": "REQ-033-068", "type": "Rule", "owner_fr": "FR-033", "title": "Topic shows the number of FAQs assigned", "attrs": {"statement": "Each topic shows the number of FAQs currently assigned to it; the number is read-only and calculated.", "rationale": "Screen 2.2 Number of FAQs. PRD: Screen 2.2 (440, 446)."}}
  - {"op": "add_node", "id": "REQ-033-069", "type": "Rule", "owner_fr": "FR-033", "title": "Article list organised by type", "attrs": {"statement": "The article list displays all articles organized by type (Tutorial Guide, Troubleshooting Tip, Policy Information); the Preview button shows the exact article layout providers will see; the editor is optimized for article layout (full-width content with formatted text, images, code blocks); print-friendly view is available in preview.", "rationale": "Screen 3 rules. List filtering and search are owned by REQ-022-119. PRD: Screen 3 rules (493-506)."}}
  - {"op": "add_node", "id": "REQ-033-070", "type": "Rule", "owner_fr": "FR-033", "title": "Article field rules", "attrs": {"statement": "Article title is required (max 200 characters); article content is required (max 10,000 characters; HTML, headings, lists, images and tables supported); article type is required (Tutorial Guide, Troubleshooting Tip or Policy Information); category/tags and related articles are optional; publish status defaults to Draft; title and content are required before saving.", "rationale": "Screens 3 and 3.1. PRD: Screen 3 (474-483); Screen 3.1 (522-545)."}}
  - {"op": "add_node", "id": "REQ-033-071", "type": "Rule", "owner_fr": "FR-033", "title": "Table of contents generated for long articles", "attrs": {"statement": "A table of contents is auto-generated from headings on save for articles with multiple headings (articles over 1000 words); it is read-only.", "rationale": "Screens 3 and 3.1. PRD: Screen 3 (481, 500); Screen 3.1 (542)."}}
  - {"op": "add_node", "id": "REQ-033-072", "type": "Rule", "owner_fr": "FR-033", "title": "Resource field rules", "attrs": {"statement": "Resource name is required (max 200 characters); description is optional (max 500 characters); the resource file is required for new resources (max 50MB; whitelist PDF, DOCX, XLSX, PNG, JPG); resource category is optional and pre-defined (Templates, Documents, Forms and similar); thumbnail or icon is optional (max 1MB, PNG or JPG, 128x128px recommended); publish status defaults to Draft; name and file are required before saving.", "rationale": "Screens 4 and 4.1. The wider whitelist conflicts with REQ-033-024; see the needs-decision item. PRD: Screen 4 (569-584); Screen 4.1 (615-641)."}}
  - {"op": "add_node", "id": "REQ-033-073", "type": "Rule", "owner_fr": "FR-033", "title": "Resource file validation, type and size detection, thumbnail generation", "attrs": {"statement": "File type and file size are detected from the upload automatically (read-only); the upload is validated for size, format and virus scan; the thumbnail is auto-generated from the PDF first page or uploaded by the admin; a file type icon is assigned automatically when no custom thumbnail exists.", "rationale": "Screens 4 and 4.1. PRD: Screen 4 (589-603); Screen 4.1 (636-641)."}}
  - {"op": "add_node", "id": "REQ-033-074", "type": "Rule", "owner_fr": "FR-033", "title": "Replacing a file keeps the same record", "attrs": {"statement": "An existing resource's file cannot be changed, only replaced; the \"Replace File\" option replaces the file while keeping the same resource record, and for Upload File videos the \"Replace Video\" option replaces the file while keeping the same video record.", "rationale": "Screens 4.1 and 5.1. PRD: Screen 4.1 (630, 639); Screen 5.1 (756)."}}
  - {"op": "add_node", "id": "REQ-033-075", "type": "Rule", "owner_fr": "FR-033", "title": "Admin can download resources and preview PDF and image files", "attrs": {"statement": "Admins can download a resource file; preview is available for PDF and image files and opens in a modal.", "rationale": "Screen 4. The download count increment is stated by REQ-032-098. PRD: Screen 4 (590, 598-599)."}}
  - {"op": "add_node", "id": "REQ-033-076", "type": "Rule", "owner_fr": "FR-033", "title": "Video field rules", "attrs": {"statement": "Video title is required (max 200 characters); description is optional (max 500 characters); the video source type is required (Upload File or Embed from Third-Party); transcript is optional but recommended for accessibility, regardless of source type (max 10,000 characters); thumbnail is optional (max 2MB, PNG or JPG, 16:9 recommended); publish status defaults to Draft; title and source type are always required.", "rationale": "Screens 5 and 5.1. PRD: Screen 5 (672-684); Screen 5.1 (722-760)."}}
  - {"op": "add_node", "id": "REQ-033-077", "type": "Rule", "owner_fr": "FR-033", "title": "Upload File videos: format, size, processing, duration and thumbnail", "attrs": {"statement": "For Upload File videos the video file is required for new videos (MP4 or MOV, max 500MB) with a progress indicator; after upload a background job processes the video for streaming optimization (transcoding, thumbnail generation); the video duration is auto-extracted (read-only); the thumbnail is auto-generated from the video frame at the 10% mark unless the admin uploads a custom one; a processing status (uploading, processing, ready) is shown.", "rationale": "Alternative Flow A4, Screens 5 and 5.1. PRD: Alternative Flow A4 (200-217); Screen 5.1 (741-752)."}}
  - {"op": "add_node", "id": "REQ-033-078", "type": "Rule", "owner_fr": "FR-033", "title": "Embedded videos: allowed providers, URL only, thumbnail", "attrs": {"statement": "For Embed from Third-Party videos the embed URL is required and the system validates that it is a valid URL whose domain is in the allowed provider list (for example YouTube or Vimeo, or an approved provider); only the URL or ID is stored, not the video file; no video file is uploaded; the thumbnail is either a custom upload or the provider thumbnail (if supported); the duration may be fetched from the provider API or left manual or optional.", "rationale": "Screens 5 and 5.1; the duration handling is left as an implementation detail by the PRD. PRD: Screen 5 (697-700); Screen 5.1 (747-754)."}}
  - {"op": "add_node", "id": "REQ-033-079", "type": "Rule", "owner_fr": "FR-033", "title": "Video analytics", "attrs": {"statement": "Video analytics comprise view count, average watch time and completion rate. A video view counts when the video plays for more than 30 seconds, regardless of source type.", "rationale": "Screen 5 notes and rules. The 30-second view count is also stated by REQ-032-099. PRD: Screen 5 (700, 713)."}}
  - {"op": "add_node", "id": "REQ-033-080", "type": "Rule", "owner_fr": "FR-033", "title": "Overall service status is calculated from components", "attrs": {"statement": "The overall status is calculated automatically from the service component statuses (if any component is Down, the overall status is Partial Outage or Major Outage) and recalculated when a component or an incident changes; the options are All Systems Operational, Partial Outage and Major Outage.", "rationale": "Alternative Flow A6 step 4, Screen 6 rules, Screen 6.1 and 6.2 rules. Screen 6 also lists Overall Status as an editable dropdown; see the needs-decision item. PRD: Screen 6 (803, 815-816); A6 step 4 (268); Screen 6.2 (898)."}}
  - {"op": "add_node", "id": "REQ-033-081", "type": "Rule", "owner_fr": "FR-033", "title": "Service component management", "attrs": {"statement": "Admins can create, edit and delete service components; delete prompts confirmation before deletion; the component name is required (max 100 characters); the component status is Operational, Degraded or Down and defaults to Operational for a new component; component status updates in real time and affects the overall platform status.", "rationale": "Screens 6 and 6.1. PRD: Screen 6 (808-811, 826); Screen 6.1 (843-859)."}}
  - {"op": "add_node", "id": "REQ-033-082", "type": "Rule", "owner_fr": "FR-033", "title": "Incident management", "attrs": {"statement": "Admins can create, edit and delete incidents (delete prompts confirmation); the incident title is required (max 200 characters); the description is required (max 2000 characters); the status is Investigating, Identified, Monitoring or Resolved and defaults to Investigating; at least one affected service is required; the start time defaults to the current time; the end time is optional and must be after the start time; an incident can be marked as resolved.", "rationale": "Alternative Flow A6 steps 5 to 8 and Screens 6 and 6.2. PRD: Screen 6 (812-815, 827); Screen 6.2 (875-899)."}}
  - {"op": "add_node", "id": "REQ-033-083", "type": "Rule", "owner_fr": "FR-033", "title": "Incident status changes are logged on the timeline automatically", "attrs": {"statement": "The system automatically logs every incident status change with a timestamp in the incident timeline (Investigating, Identified, Monitoring, Resolved) and adds each new incident to the incident history timeline.", "rationale": "Alternative Flow A6 steps 6 to 8, Screens 6 and 6.2. PRD: A6 (270-274); Screen 6 (828); Screen 6.2 (897)."}}
  - {"op": "add_node", "id": "REQ-033-084", "type": "Rule", "owner_fr": "FR-033", "title": "Maintenance window management", "attrs": {"statement": "Admins can schedule, edit, cancel and mark as completed maintenance windows; title and description are required (title max 200 characters, description max 2000 characters); scheduled start and end times are required and the end must be after the start; scheduled times must be in the future for new maintenance windows; at least one affected service is required; the status is Scheduled, In Progress, Completed or Cancelled and defaults to Scheduled.", "rationale": "Screens 6 and 6.3. Screen 6 and 6.3 data fields say \"future date\" without limiting it to new windows; the rule text limits it to new windows. PRD: Screen 6 (816-818, 830); Screen 6.3 (917-940)."}}
  - {"op": "add_node", "id": "REQ-033-085", "type": "Rule", "owner_fr": "FR-033", "title": "Past incidents and completed maintenance are retained", "attrs": {"statement": "Past incidents and completed maintenance are retained for historical reference.", "rationale": "Screen 6 notes. PRD: Screen 6 (836)."}}
  - {"op": "add_node", "id": "REQ-033-086", "type": "Rule", "owner_fr": "FR-033", "title": "Preview renders the audience-facing layout and updates live", "attrs": {"statement": "Preview renders content in the exact audience-facing layout for the selected subscreen type (FAQ accordion with expand and collapse, article layout with table of contents, resource file viewer, video player, service status page), updates in real time as the admin edits, and includes all formatting, images and interactive elements; a print preview is available for article content.", "rationale": "Screen 7 (mirrored by Screen 13). PRD: Screen 7 rules (955-964)."}}
  - {"op": "add_node", "id": "REQ-033-087", "type": "Rule", "owner_fr": "FR-033", "title": "Helpfulness rating is aggregated Yes/No feedback, read-only", "attrs": {"statement": "The helpfulness rating shown to admins is the aggregated Yes/No feedback counts from provider feedback (or aggregated patient feedback), read-only, and tracked per FAQ, article and video for analytics.", "rationale": "Screens 2, 3 and 5. Recording the feedback is stated by REQ-032-094 and REQ-035-007. PRD: Screen 2 (356, 371); Screen 3 (480); Screen 5 (683)."}}
  - {"op": "add_node", "id": "REQ-033-088", "type": "Rule", "owner_fr": "FR-033", "title": "Patient content avoids medical advice", "attrs": {"statement": "Patient content is curated to avoid medical advice and to focus on platform usage, appointment management and general information.", "rationale": "Promoted from Business Process Assumption 5 because it constrains what content admins publish. PRD: Assumptions, Business Process Assumption 5 (1194)."}}
