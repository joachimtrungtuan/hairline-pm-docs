  - {"op": "update_node", "id": "REQ-035-013", "attrs": {"statement": "System MUST support file attachments up to 10 MB per file, maximum 5 files per message (the initial request and each reply may each carry up to 5 files), formats: JPG, PNG, PDF, DOC, DOCX (FR-034 REQ-034-036/037)", "rationale": "Fixed in the codebase (482). Screen 5 Attachments (434: thumbnail preview with remove option) and Screen 4 Attachment Button (403) carry the same limits. The limit counts per message, replies included."}}
  - {"op": "update_node", "id": "REQ-035-036", "attrs": {"statement": "Search covers all published patient-audience Help Center content (FAQs, Articles, Resources, Videos); results are ranked by relevance; if no results match, show a \"Contact Support\" prompt. Full-text search is required for P1 and must not be downgraded to browse-only behavior.", "rationale": "Screen 1 rules (247), Screen 1 Search Bar (236), Screen 2 rules (338), Alternative Flow A1 (134-136). Search covers all four patient content types on Screen 1 and Screen 2."}}
  - {"op": "update_node", "id": "REQ-035-040", "title": "Emergency phone and email are two App Settings owned by FR-026", "attrs": {"statement": "Emergency phone and email values are two App Settings owned by FR-026 (support emergency contact phone and email); this screen displays them.", "rationale": "Screen 1 rules (248), Admin Editability (474: two App Settings owned by FR-026) and Business Process Assumption 3 (599: values are configured by admin before FR-035 goes live)."}}
  - {"op": "update_node", "id": "REQ-035-044", "title": "Featured / Popular Articles: five most viewed patient articles in the past 30 days", "attrs": {"statement": "Featured / Popular Articles [Design Addition]: automatic shortlist of the five patient articles with the most views in the past 30 days, up to 5 items; not defined in FR-033; generated automatically from view analytics (FR-033 REQ-033-018), not curated by admins.", "rationale": "Screen 2 field Featured / Popular Articles (270), optional (Required: No). Generated from view analytics, not admin-curated."}}
  - {"op": "update_node", "id": "REQ-035-050", "title": "Server-found problems highlighted inline after Submit", "attrs": {"statement": "Patient taps Submit with every field valid; System checks the submission on the server and finds a failure; System highlights the affected fields with inline error messages; Patient corrects the reported errors and resubmits.", "rationale": "Alternative Flow B1 (198-208). Submit is enabled only when every field is valid (REQ-035-049), so this flow covers a failure found by the server after submitting."}}
  - {"op": "update_node", "id": "REQ-035-063", "title": "Rate limit on new ticket submissions", "attrs": {"statement": "Rate limiting on new ticket submissions (max 10 new tickets per hour per patient); replies are not counted by this limit.", "rationale": "Security Considerations Threat mitigation (643), promoted."}}
  - {"op": "update_node", "id": "REQ-035-065", "attrs": {"statement": "Patient replies are added to the shared communication thread; the assigned admin notification for each reply (recipients, content, and whether it can be switched off) is defined in FR-020 REQ-020-111 (support.case_user_reply event)", "rationale": "Screen 4 rules (413), A4 steps 6-7 (179-181) and Send Reply Button (404). The notification itself is owned by FR-020 REQ-020-111."}}
