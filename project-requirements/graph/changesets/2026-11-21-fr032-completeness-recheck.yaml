reason: "Completeness re-check of FR-032 against the 2026-11-20 PRD: add the screen-note behaviours the graph still lacked (bulk edit, empty states, review paging, document error and drag-and-drop, conditional country code, Enable All and Test Notification, billing country selector and Verify button, Help Centre empty search, resource preview, Back to List, case list empty states and total count), show four existing timestamp Fields on their Screens, link the FR-033 table of contents Rule to Articles, put exact message text and the Quick Stats counts into four existing Rules, and set the eight notification toggle Fields optional as the PRD Required column says No"
