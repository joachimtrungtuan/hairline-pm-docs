reason: "FR-004 logic review pass 2 - withdrawal of an accepted quote while the booking is Accepted or Confirmed before check-in with no provider-fault marker, after a confirmation that names the consequence, with no contact-support wording; the provider-fault marker freezes every field of the accepted quote except admin notes (REQ-004-109); the replacement quote keeps its currency from the first Screen 8 save, is hidden from the provider and the patient until accepted, is edited only on Screen 8 and excluded from Screens 2 and 7; the replacement acceptance moves the draft through sent to accepted, runs no cancel-other-quotes cascade, and silently cancels other open replacement drafts (new System step after the FR-005 acceptance record); restore only for an expired quote or a quote archived from draft or sent, with guards (inquiry open, provider Active, no active acceptance, no provider-fault marker) and a blocked branch; a promotion reservation is taken only when none is held; expiry events once per expiry window; neutral banner wording for an admin-closed inquiry; the replacement draft cascade moved to its own Platform Admin step; the after-acceptance withdrawal is emitted at the booking stage; blocked branch for the Screen 8 preconditions. Business defaults per owner review entries 59 and 60."
by: docs-manager
operations:
  - {"op": "update_node", "id": "REQ-004-002", "attrs": {"statement": "System MUST enforce the admin-controlled FR-026 expiry window (default 48h), captured at first send, and compute the deadline per sent quote. The only renewal is the admin restore of an expired quote (REQ-004-105). The admin-authored replacement quote has no expiry (REQ-004-050)."}}
  - {"op": "update_node", "id": "REQ-004-003", "attrs": {"statement": "System MUST cancel every other parent quote for the same inquiry as `cancelled_other_accepted` upon one subquote acceptance by the patient. Each sent parent quote MUST produce one not-selected notice per parent quote; unsent drafts MUST be cancelled silently without notice. The not-selected notice is the FR-030 `quote.accepted` event with `outcome` = `competing_parent_cancelled_other_subquote_accepted` (REQ-030-038). The admin-authored replacement acceptance of a provider-fault transfer MUST NOT run this cascade (REQ-004-082)."}}
  - {"op": "update_node", "id": "REQ-004-004", "attrs": {"statement": "System MUST support provider withdrawal after acceptance, only while the booking is `Accepted` or `Confirmed`, before check-in, and without a provider-fault marker, by moving the parent quote to `withdrawn`, keeping the AcceptanceEvent and snapshot unchanged, and handing the case to the FR-006 provider-fault transfer, with full audit and the mandatory `quote.withdrawn` notice."}}
  - {"op": "update_node", "id": "REQ-004-005", "attrs": {"statement": "Admin MUST be able to inline edit policy-bound fields of `draft` and `sent` quotes with required reason and re-notifications. After a subquote is accepted, an admin MUST still be able to change any quote field except price, currency, and promotion (the date range and treatment details can be changed), with a mandatory reason and full before and after history; the change MUST be stored as a new version beside the acceptance snapshot, which stays unchanged, and payment records MUST NOT change. While the booking carries a provider-fault marker, this admin edit right is suspended, except for admin notes (REQ-004-109). A replacement draft is edited only on Screen 8 and is not opened on Screen 7 (REQ-004-048)."}}
  - {"op": "update_node", "id": "REQ-004-025", "attrs": {"statement": "Quote currency MUST come from the active FR-026 quote configuration (the FR-029 Default Currency), MUST NOT be provider input, and MUST be captured on the quote at first send so historical prices retain their original currency. The admin-authored replacement quote captures it at its first Screen 8 save (REQ-004-082)."}}
  - {"op": "update_node", "id": "REQ-004-036", "attrs": {"statement": "System MUST capture the quote expiry and quote currency read-only at first send from the FR-026 quote configuration. Drafts MUST carry neither, and there MUST be no per-quote expiry extension other than the admin restore of an expired quote (REQ-004-105). The admin-authored replacement quote is the exception: it has no expiry and captures its currency at its first Screen 8 save (REQ-004-082)."}}
  - {"op": "update_node", "id": "REQ-004-037", "attrs": {"statement": "After a subquote is accepted, System MUST block every FR-004 quote edit by providers; their treatment-detail changes (plan, clinicians, grafts) MUST go through FR-010. Admin edits after acceptance follow REQ-004-005 and are blocked, except admin notes, while the booking carries a provider-fault marker (REQ-004-109). Price, currency, and promotion MUST never change after acceptance. An accepted parent quote MUST never be reopened, expired, or restored to an acceptable state, including after `Payment Window Expired`, and no new parent quote MAY be created or sent for an inquiry with an active acceptance (REQ-004-110), except the admin-authored replacement quote of REQ-004-048."}}
  - {"op": "update_node", "id": "REQ-004-039", "attrs": {"statement": "System MUST emit `quote.expiring_soon` once per expiry window of a sent parent quote when it reaches the FR-026 quote-expiring-soon lead time, and MUST NOT emit it for draft, accepted, or terminal quotes, including the replacement quote, which has no expiry."}}
  - {"op": "update_node", "id": "REQ-004-042", "attrs": {"statement": "A sent quote carrying an automatic FR-019 promotion MUST hold exactly one reserved use of that promotion's usage limit. A re-send of a new version MUST keep the existing reservation, create one only if the new version newly qualifies, and release it if the new version no longer carries the promotion. The reservation MUST be released when the quote expires, is withdrawn, is archived, or ends not selected or cancelled, MUST be released with reason `not_applied` when the accepted row does not carry the promotion, and MUST be consumed at acceptance when the accepted row carries it, so the usage limit is never exceeded. When an admin restores an expired quote, System MUST re-check the promotion's validity and usage limit and take a new reservation only when the quote holds none; if the limit is used up or the promotion has ended, the restore MUST be blocked with a message and the provider MAY send a new quote (REQ-004-105). If the booking later ends in `Payment Window Expired` or is cancelled before the first payment, FR-005 and FR-019 own the return of the consumed use to the limit."}}
  - {"op": "update_node", "id": "REQ-004-048", "attrs": {"statement": "During an FR-006 provider-fault transfer before treatment starts, System MUST let an admin author a replacement quote for the replacement provider inside the same inquiry through Screen 8, with a mandatory reason and full audit. The quote MUST be marked admin-authored for a replacement and linked to the AcceptanceEvent it replaces, MUST NOT be offered for patient comparison, MUST stay a `draft` that is hidden from the replacement provider and the patient until it is accepted, MUST be editable only on Screen 8 and be excluded from Screen 2 and Screen 7, MUST NOT emit `quote.submitted` or `quote.expired`, and MUST be the target of the FR-005 admin-authored replacement acceptance."}}
  - {"op": "update_node", "id": "REQ-004-071", "attrs": {"statement": "An accepted parent quote stays `accepted` and is never reopened for acceptance or moved to `expired`, including after FR-006 moves the booking to `Payment Window Expired`; its status changes only through provider withdrawal (Workflow 6), which is allowed only while the booking is `Accepted` or `Confirmed`, before check-in, and without a provider-fault marker (REQ-004-079). An admin booking cancellation in FR-006 moves the booking and inquiry to `Cancelled` but leaves the accepted parent quote `accepted`. Competing parent quotes stay cancelled."}}
  - {"op": "update_node", "id": "REQ-004-077", "attrs": {"statement": "Soft-deletes are fully auditable and revertible only by admin. Admin can perform soft delete or restore and view the immutable audit trail and full quote history; soft delete and restore are unavailable for a quote in `accepted` status, which is never deleted or restored. Only admin can restore expired or archived quotes if justified (GDPR-compliant log). Restore is offered only for an expired quote and for a quote archived from `draft` or `sent`, read from its archive audit entry; a quote archived from any other status shows no Restore action. A restore MUST be blocked, with a message that names the failed guard, when the inquiry is not open, the provider is not `Active`, the inquiry has an active acceptance (REQ-004-110), or the booking carries a provider-fault marker (REQ-004-109). An archived draft is restored to `draft` with the 7-day count restarted. An archived sent quote (admin archive only) is restored to `sent` when its original expiry has not passed, with no renewal, and to `expired` otherwise; an expired quote is then restored under REQ-004-105."}}
  - {"op": "update_node", "id": "REQ-004-079", "title": "Withdrawal after acceptance needs a confirmation, a reason, an Accepted or Confirmed booking and edits nothing", "attrs": {"statement": "A provider submits a withdrawal after acceptance with a mandatory reason, and only while the booking is `Accepted` or `Confirmed`, before check-in, and carries no provider-fault marker. The Withdraw action opens a confirmation that states the consequence: the booking goes to the admin for a transfer or refund. In every other booking state the action is hidden and Screen 3 shows a short note that the quote can no longer be withdrawn. The parent quote moves from `accepted` to `withdrawn`. This is the only status change FR-004 makes after acceptance; no quote field, option, or option/date-price record is edited."}}
  - {"op": "update_node", "id": "REQ-004-080", "attrs": {"statement": "The provider-fault transfer with a replacement quote and a new acceptance applies only before treatment starts (booking `Accepted`, `Confirmed`, or `Cancelled` with the provider-fault marker); provider drop-out after acceptance, including an FR-010 reassignment, is not a quote withdrawal. If the fault happens in Aftercare, no replacement quote, new acceptance, or new payment is created. Screen 8 is unavailable for a booking in `In Progress` or later stages and once a replacement acceptance has been recorded for this transfer."}}
  - {"op": "update_node", "id": "REQ-004-081", "attrs": {"statement": "Before the admin authors a replacement quote, the system checks that the booking carries a provider-fault marker (pending, or closed with `ProviderFault`, `ProviderSuspended`, or `ProviderDeactivated`) and is `Accepted`, `Confirmed`, or `Cancelled` with that marker, that no replacement acceptance has been recorded for this transfer, that treatment had not started, and that the replacement provider is `Active` and is not the provider at fault. When a check fails, Screen 8 is blocked with a message that names the failed check."}}
  - {"op": "update_node", "id": "REQ-004-082", "title": "Replacement quote has no expiry, fixes its currency at first save and is accepted by the admin", "attrs": {"statement": "A replacement quote MUST have no expiry. Its currency MUST be captured from the active FR-026 quote configuration at the first Screen 8 save, shown on Screen 8, and fixed after that. When the admin records the replacement acceptance, the quote moves from `draft` through `sent` to `accepted` and its first-send time is recorded. This acceptance MUST NOT run the cancel-other-quotes cascade: the original quote keeps its status, and every other open replacement draft of the inquiry is cancelled as `cancelled_other_accepted` silently, with no notice to its provider."}}
  - {"op": "update_node", "id": "REQ-004-085", "attrs": {"statement": "Providers may edit a quote only while it is `draft` or `sent`; admins may edit `draft` and `sent` quotes, and after acceptance any field except price, currency, and promotion (REQ-004-005). A replacement draft is edited only on Screen 8 (REQ-004-048). Edits on expired, withdrawn, archived, or cancelled quotes are prohibited for providers and admins, and a late edit or deletion is disallowed with a user message."}}
  - {"op": "update_node", "id": "REQ-004-098", "attrs": {"statement": "Quotes with status \"Cancelled (Inquiry Cancelled)\" are displayed with greyed-out row styling and an \"Inquiry Cancelled\" badge, show a prominent \"Inquiry Cancelled\" banner on the detail view, have all edit and delete actions disabled, and remain read-only for reference; an edit attempt is blocked with the message \"This quote was cancelled because the patient cancelled their inquiry\". Quotes with status \"cancelled (other accepted)\" are similarly greyed out with an \"Another Quote Accepted\" badge. When an admin closed or cancelled the inquiry, the banner and the blocked-edit message are neutral: \"This inquiry was closed. Your quote can no longer be changed.\""}}
  - {"op": "update_node", "id": "REQ-004-105", "attrs": {"statement": "Only an admin, with a mandatory reason, MAY restore an expired quote. The restore MUST be blocked, with a message that names the failed guard, when the inquiry is not open, the provider is not `Active`, the inquiry has an active acceptance (REQ-004-110), or the booking carries a provider-fault marker (REQ-004-109); the same guards apply to every restore of an archived quote (REQ-004-077). Before restoring, System MUST re-check the validity and usage limit of the promotion on the quote's rows and take a new reservation only when the quote holds none; if the limit is used up or the promotion has ended, the restore MUST be blocked with a message and the provider MAY send a new quote. The same re-check applies when an archived sent quote is restored to `sent`. The restored quote MUST return to `sent` with a fresh full window: its new expiry is the restore time plus the FR-026 quote expiry window in force at that time. This is the only case in which a quote's expiry is renewed."}}
  - {"op": "update_node", "id": "REQ-004-109", "attrs": {"statement": "While the booking carries the provider-fault marker, whether the fault is pending or the booking is already `Cancelled` with the marker, System MUST block provider edits and admin Screen 7 edits of every field of the accepted quote except admin notes, MUST block an admin restore of any quote of the inquiry, and MUST hide a second Withdraw action. The replacement quote on Screen 8 is the only quote write allowed. The marker stops payment, reminders, and revive in FR-006 (REQ-006-081)."}}
  - {"op": "add_edge", "from": "REQ-004-048", "verb": "applies to", "to": "SCR-004-02"}
  - {"op": "add_edge", "from": "REQ-004-048", "verb": "applies to", "to": "SCR-004-07"}
  - {"op": "update_node", "id": "SCR-004-02", "attrs": {"description": "Provider views all quotes in a single unified list with no tabs, reflecting global case statuses; actions (Edit, Soft Delete for drafts only, View Details) are state-aware; cancelled quotes are greyed out with a badge and all actions disabled; the admin-authored replacement draft is not listed."}}
  - {"op": "update_node", "id": "SCR-004-03", "attrs": {"description": "Provider inspects full quote details, patient-first as a continuation of the inquiry (Patient, Inquiry, Quote, Audit); Edit and Soft Delete (drafts only) when eligible, and Withdraw for a sent quote before acceptance or for an accepted quote only while the booking is Accepted or Confirmed, before check-in, with no provider-fault marker; withdrawing an accepted quote opens a confirmation that names the consequence (the booking goes to the admin for a transfer or refund), and an ineligible accepted quote shows no Withdraw and a short note; an Inquiry Cancelled banner and read-only state for cancelled quotes, with neutral wording when an admin closed or cancelled the inquiry."}}
  - {"op": "update_node", "id": "SCR-004-05", "attrs": {"description": "Admin lists and filters all quotes across providers, grouped by inquiry by default, with a multi-quote cue, per-quote audit trail and version history; Restore and Archive are hidden for accepted quotes; Restore is offered only for an expired quote or a quote archived from draft or sent, other archived quotes show no Restore, and a restore is blocked with a message that names the failed guard (inquiry not open, provider not Active, active acceptance, provider-fault marker)."}}
  - {"op": "update_node", "id": "SCR-004-07", "attrs": {"description": "Admin performs inline edits with audit on draft, sent, and accepted quotes, with a mandatory reason; price, currency, and promotion stay read-only once accepted, an edit after acceptance is stored as a new version beside the unchanged acceptance snapshot, and edits of the accepted quote are blocked while the booking carries a provider-fault marker, except admin notes; the replacement draft is not offered, because Screen 8 is its only edit surface."}}
  - {"op": "update_node", "id": "SCR-004-08", "attrs": {"description": "Admin authors a quote for the replacement provider during an FR-006 provider-fault transfer, pending or closed, opened only from the transfer and blocked with a message that names the failed check; the quote stays a draft with no expiry, hidden from the provider and the patient, with its currency captured at the first save and fixed after, and Screen 8 is its only edit surface; Save and Continue confirms the summary and returns to FR-006 to record the acceptance."}}
  - {"op": "add_edge", "from": "SCR-004-08", "verb": "shows", "to": "ENT-quote.currency_snapshot", "attrs": {"provenance": "inherited from another FR", "label": "Currency: from the active quote configuration, fixed at the first save"}}
  - {"op": "update_node", "id": "ENT-quote.currency_snapshot", "attrs": {"description": "Captured read-only at first send from the active FR-026 quote configuration (FR-029 Default Currency); for an admin-authored replacement quote, captured at its first Screen 8 save and fixed after that; null on other drafts; never provider input."}}
  - {"op": "update_node", "id": "ENT-quote.first_sent_at", "attrs": {"description": "Set once on the first send; for an admin-authored replacement quote, set when the admin records the replacement acceptance and the draft moves through sent to accepted; never changed by a re-send or new version; null on drafts. FR-014 Time to First Quote reads it."}}
  - {"op": "update_node", "id": "EVT-quote-expiring-soon", "attrs": {"description": "Emitted once per expiry window of a sent parent quote when it reaches the FR-026 quote-expiring-soon lead time (FR-030); never for drafts, accepted or terminal quotes, or the admin-authored replacement quote, which has no expiry."}}
  - {"op": "update_node", "id": "EVT-quote-expired", "attrs": {"description": "Emitted once per expiry window of a parent quote when expiry processing moves a sent quote to expired (FR-030); a restore opens a fresh window; never for the admin-authored replacement quote, which has no expiry."}}
  - {"op": "update_node", "id": "EVT-quote-withdrawn", "attrs": {"description": "Mandatory notice; FR-004 is the only producer, at the quote stage for a withdrawal before acceptance and at the booking stage for a withdrawal after acceptance. Goes to the patient for every withdrawal and to the admin only when the withdrawn quote was already accepted; FR-006 then starts the provider-fault transfer without re-emitting it."}}
  - {"op": "add_edge", "from": "STG-main-04-booking", "verb": "emits", "to": "EVT-quote-withdrawn"}
  - {"op": "update_node", "id": "FLW-004-admin-restore", "title": "Admin restores an expired quote or a quote archived from draft or sent", "attrs": {"description": "Admin restores an expired quote or a quote archived from draft or sent"}}
  - {"op": "add_node", "id": "FLW-004-replacement-draft-cascade", "type": "Flow", "title": "A replacement draft is cancelled without notice when an admin closes or cancels the inquiry", "attrs": {"kind": "alternative", "description": "A replacement draft is cancelled without notice when an admin closes or cancels the inquiry", "prd_ref": "Alternative Flows bullet 17; Workflow 7"}}
  - {"op": "update_node", "id": "STP-004-114", "title": "Provider withdraws the accepted quote after a confirmation that names the consequence, with a mandatory reason, only while the booking is Accepted or Confirmed before check-in and has no provider-fault marker"}
  - {"op": "update_node", "id": "STP-004-117", "title": "Admin builds the replacement quote; its currency is captured at the first save and fixed after; the quote is saved as a draft with no expiry, no promotion and no notice, hidden from the provider and the patient"}
  - {"op": "update_node", "id": "STP-004-118", "title": "Admin restores an expired quote, or a quote archived from draft or sent, with a mandatory reason"}
