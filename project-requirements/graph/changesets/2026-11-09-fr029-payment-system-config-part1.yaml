  # --- Settings
  - {"op": "add_node", "id": "SET-global-markup-percentage", "type": "Setting", "owner_fr": "FR-029", "title": "Global default markup percentage", "attrs": {"description": "Default markup on currency conversion for pairs without a per-pair override. Range 0-20%, precision 0.01%. The PRD names no default (5% appears only as an example).", "unit": "%"}}
  - {"op": "add_node", "id": "SET-global-sync-frequency", "type": "Setting", "owner_fr": "FR-029", "title": "Global default sync frequency", "attrs": {"description": "Default sync interval for auto-fetch pairs: 1h, 3h, 6h, 12h or 24h. The PRD names no default (6h appears only as an example).", "unit": "hours"}}
  - {"op": "add_node", "id": "SET-rate-protection-threshold", "type": "Setting", "owner_fr": "FR-029", "title": "Rate protection threshold", "attrs": {"description": "Percentage change within 24 hours above which an auto-fetch pair is flagged and admins are alerted. Range 1-50%, precision 0.1%. The PRD names no default (3% appears only as an example).", "unit": "%"}}
  - {"op": "add_node", "id": "SET-payout-buffer-window", "type": "Setting", "owner_fr": "FR-029", "title": "Payout buffer window", "attrs": {"description": "Number of days before a scheduled payout date that the system auto-generates payout statements for admin review. Global setting consumed by FR-017 / A-05. Range 1-7 days.", "default": "3", "unit": "days"}}
  - {"op": "add_node", "id": "SET-default-currency", "type": "Setting", "owner_fr": "FR-029", "title": "System default currency", "attrs": {"description": "The enabled currency that is the system default (Screen 6). The MVP seed value is USD. FR-017 Screen 1 initializes its reporting currency from it, and a change creates a new FR-026 Quote Configuration version.", "default": "USD"}}
  - {"op": "update_node", "id": "SET-deposit-percentage", "attrs": {"description": "Deposit percentage of the booking total, configured globally or per provider (Screen 3). Allowed range 20-30%, precision 0.1%, fixed in code. The PRD names no default (25% appears only as an example). New bookings only: existing bookings keep their rate.", "default": null, "unit": "percent of booking total"}}  # stub owned by FR-029, created by the FR-006 migration
  - {"op": "update_node", "id": "SET-commission-rate", "attrs": {"description": "Platform global default commission percentage (allowed range 15-25%, precision 0.1%, the global model is always Percentage) plus provider-specific commission scopes (Percentage 0-100% or Flat Rate, Screen 5). The PRD names no default for the global value.", "default": null, "unit": "percent of booking total (or fixed amount per completed procedure for Flat Rate)"}}  # stub owned by FR-029, created by the FR-006 migration
  - {"op": "update_node", "id": "SET-split-payment-config", "attrs": {"description": "Split payment (installment) configuration of Screen 4: feature enabled switch, offered installment counts (2 to 9), cutoff days (30-90, default 30), minimum booking amount ($100-$10,000, stated in USD) and late payment grace period (0-14 days, 0 = none). Installment frequency is fixed at monthly (30-day intervals). The PRD names no defaults other than 30 cutoff days.", "default": null, "unit": null}}  # stub owned by FR-029, created by the FR-006 migration
  # --- Events
  - {"op": "add_node", "id": "EVT-payment-config-changed", "type": "Event", "owner_fr": "FR-029", "title": "Payment configuration changed", "attrs": {"description": "Email to admins when payment configuration is published (Stripe account activation, currency conversion, split payment), and email to affected providers on a provider-specific deposit rate change."}}
  - {"op": "add_node", "id": "EVT-rate-protection-alert", "type": "Event", "owner_fr": "FR-029", "title": "Rate protection alert", "attrs": {"description": "Urgent alert to admins when an auto-fetch pair's rate changes more than the global Rate Protection Threshold within 24 hours."}}
  - {"op": "add_node", "id": "EVT-rate-sync-failed", "type": "Event", "owner_fr": "FR-029", "title": "Rate sync failed", "attrs": {"description": "Alert to admins when a scheduled sync fails for an auto-fetch pair; the pair keeps its last cached rate."}}
  - {"op": "add_node", "id": "EVT-pair-switched-to-manual", "type": "Event", "owner_fr": "FR-029", "title": "Currency pair switched to manual", "attrs": {"description": "Notice to admins that a pair switched to manual mode with its last fetched rate because its source was deleted."}}
  - {"op": "add_node", "id": "EVT-stripe-account-failure", "type": "Event", "owner_fr": "FR-029", "title": "Stripe account connection or authentication failure", "attrs": {"description": "Admin dashboard notification and urgent alert for a Stripe connection failure, API error or failed authentication."}}
  - {"op": "add_node", "id": "EVT-payment-unsupported-country", "type": "Event", "owner_fr": "FR-029", "title": "Payment attempted from unsupported country", "attrs": {"description": "Alert to admins that a payment was attempted or blocked for a country with no Stripe account and no Global Fallback."}}
  - {"op": "add_node", "id": "EVT-payment-config-daily-digest", "type": "Event", "owner_fr": "FR-029", "title": "Daily rate digest", "attrs": {"description": "Daily email digest to admins summarising rate source outages with affected pairs and all rate changes across pairs."}}
  # --- Screens
  - {"op": "add_node", "id": "SCR-029-01", "type": "Screen", "owner_fr": "FR-029", "title": "Stripe Accounts Management", "attrs": {"platform": "admin", "description": "Admin Platform. Add, edit and manage multiple Stripe accounts and assign them to countries or regional groupings (PRD Screen 1). UI controls, not fields: Test Connection button and its modal (shows account name, mode and endpoint, calls Stripe with the keys and webhook secret, shows success or failure with error details, logs the attempt and updates Last Tested), Show toggle on the secret fields, Retry Connection, Save & Activate. Also shown: inline help on Test versus Live Mode, a warning icon when the account was not tested for over 30 days, and transaction count and total volume per account for the last 30 days (reference only; read from payment transactions owned by FR-007)."}}
  - {"op": "add_node", "id": "SCR-029-02", "type": "Screen", "owner_fr": "FR-029", "title": "Currency Conversion: Pair List and Global Settings", "attrs": {"platform": "admin", "description": "Admin Platform. Screen 2A: Section 1 Global Settings, Section 2 Rate Sources (Add, Edit, Delete, Test Connection), Section 3 Currency Pair List (PRD Screen 2A). The pair list supports sorting and filtering by pair name, mode, status and last updated, shows total pair count and counts by mode, an alert badge count in the header when any pair is yellow or red, a banner that currencies not configured default to USD, and actions Add Pair, Edit Pair, Delete Pair and Sync Now per auto-fetch pair. Source Status and Last Tested are display-only."}}
  - {"op": "add_node", "id": "SCR-029-03", "type": "Screen", "owner_fr": "FR-029", "title": "Add / Edit Currency Pair", "attrs": {"platform": "admin", "description": "Admin Platform. Screen 2B: form to create or edit a pair (PRD Screen 2B). UI controls, not fields: Test Connection & Fetch Rate (mandatory before saving a new auto-fetch pair), Save, Cancel, the Rate History link (chart and table of rate changes over the last 30 days when editing), inline help text on Base Rate, the source status indicator beside the Source dropdown, the estimated conversion impact example, and last and next sync timestamps below the form."}}
  - {"op": "add_node", "id": "SCR-029-04", "type": "Screen", "owner_fr": "FR-029", "title": "Deposit Rate Configuration", "attrs": {"platform": "admin", "description": "Admin Platform. Configure the deposit percentage globally or per provider (PRD Screen 3). UI controls, not fields: Provider Search by name or ID, bulk edit of several providers, Apply Deposit Rate. Also shown: a preview calculation, a sortable list of providers with custom rates, a badge next to providers with custom rates on provider list screens, and the historical deposit rate changes from the audit log."}}
  - {"op": "add_node", "id": "SCR-029-05", "type": "Screen", "owner_fr": "FR-029", "title": "Split Payment (Installment) Configuration", "attrs": {"platform": "admin", "description": "Admin Platform. Configure available installment options and cutoff rules (PRD Screen 4). UI controls, not fields: Preview Installment Schedule button, Save Split Payment Configuration. Also shown: a preview calculator and example scenarios, a warning when cutoff days are very aggressive (over 60), and installment usage statistics for the last 30 days (reference only)."}}
  - {"op": "add_node", "id": "SCR-029-06", "type": "Screen", "owner_fr": "FR-029", "title": "Commission Rate Configuration", "attrs": {"platform": "admin", "description": "Admin Platform. Global Default section and Provider Specific section (PRD Screen 5). A provider-scope modal collects Selected Providers, Commission Model, Provider Commission Value, Flat Rate Currency, Effective Date and a preview calculation per model. UI controls, not fields: Save Setting, Add new provider scope, Edit, Archive (the Actions menu). FR-015 Tab 7 is the synchronized single-provider edit surface for the same data."}}
  - {"op": "add_node", "id": "SCR-029-07", "type": "Screen", "owner_fr": "FR-029", "title": "Currency Management", "attrs": {"platform": "admin", "description": "Admin Platform. Manage the enabled subset of the master currency catalog and the system default currency (PRD Screen 6). UI controls, not fields: Search filter by code or name, Enable common set (e.g., USD/EUR/GBP) and Set Default quick actions. It is the source of truth for currency dropdowns across Admin, Provider and Patient experiences."}}
