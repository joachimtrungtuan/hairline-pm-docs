  - {"op": "add_field", "id": "ENT-commission-rate-config.flat_rate_amount", "entity_id": "ENT-commission-rate-config", "name": "flat_rate_amount", "data_type": "money", "title": "Flat rate amount", "owner_fr": "FR-029", "required": false, "attrs": {"description": "Flat Rate model: fixed amount deducted once per completed procedure (nullable when percentage). Amount > 0, precision per the currency's minor units."}}
  - {"op": "add_field", "id": "ENT-commission-rate-config.flat_rate_currency", "entity_id": "ENT-commission-rate-config", "name": "flat_rate_currency", "data_type": "text", "title": "Flat Rate Currency", "owner_fr": "FR-029", "required": false, "attrs": {"description": "Currency of the Flat Rate amount, shown only when the model is Flat Rate. Must be an enabled currency; defaults to the system default currency."}}
  - {"op": "add_field", "id": "ENT-commission-rate-config.effective_date", "entity_id": "ENT-commission-rate-config", "name": "effective_date", "data_type": "date", "title": "Effective Date", "owner_fr": "FR-029", "required": true, "attrs": {"description": "Date when the provider-specific scope becomes active for new bookings. Today or a future date."}}
