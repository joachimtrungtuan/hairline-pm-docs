  # --- Events produced by FR-004
  - {"op": "add_node", "id": "EVT-quote-submitted", "type": "Event", "owner_fr": "FR-004", "title": "Quote submitted", "attrs": {"description": "Emitted on the first send of a parent quote, for FR-020 notification. Not emitted for an admin-authored replacement quote."}}
  - {"op": "add_node", "id": "EVT-quote-updated", "type": "Event", "owner_fr": "FR-004", "title": "Quote updated", "attrs": {"description": "\"Quote revised (new version)\": emitted when a new version of an already-sent quote is re-sent, including after an admin edit. FR-004 is the only producer. Saving a draft emits nothing."}}
  - {"op": "add_node", "id": "EVT-quote-expiring-soon", "type": "Event", "owner_fr": "FR-004", "title": "Quote expiring soon", "attrs": {"description": "Emitted once per sent parent quote when it reaches the FR-026 quote-expiring-soon lead time (FR-030); never for drafts, accepted or terminal quotes."}}
  - {"op": "add_node", "id": "EVT-quote-expired", "type": "Event", "owner_fr": "FR-004", "title": "Quote expired", "attrs": {"description": "Emitted once per parent quote when expiry processing moves a sent quote to expired (FR-030)."}}
  - {"op": "add_node", "id": "EVT-quote-withdrawn", "type": "Event", "owner_fr": "FR-004", "title": "Quote withdrawn", "attrs": {"description": "Mandatory notice; FR-004 is the only producer. Goes to the patient for every withdrawal and to the admin only when the withdrawn quote was already accepted; FR-006 then starts the provider-fault transfer without re-emitting it."}}
  - {"op": "add_node", "id": "EVT-quote-cancelled-inquiry", "type": "Event", "owner_fr": "FR-004", "title": "Quote cancelled (inquiry cancelled)", "attrs": {"description": "Sent through FR-020 only to providers whose quotes the patient inquiry-cancellation cascade cancelled. The PRD does not name FR-004 as its producer explicitly."}}
  # --- Screens
  - {"op": "add_node", "id": "SCR-004-01", "type": "Screen", "owner_fr": "FR-004", "title": "Quote Creation/Edit", "attrs": {"platform": "provider", "description": "Provider creates or edits one parent quote and its package options with full inquiry context, through seven ordered tabs (Treatment Service; Package Options with Sub-screen 2A Inline Package Editor; Grafts & Visual Plan; Dates & Pricing; Option Treatment Plans; Clinical Details & Notes; Review & Submit). Each tab has a completion gate; Review & Submit links each issue back to its owning tab and submits parent and options as one transaction."}}
  - {"op": "add_node", "id": "SCR-004-02", "type": "Screen", "owner_fr": "FR-004", "title": "Quote List", "attrs": {"platform": "provider", "description": "Provider views all quotes in a single unified list with no tabs, reflecting global case statuses; actions (Edit, Soft Delete, View Details) are state-aware; cancelled quotes are greyed out with a badge and all actions disabled."}}
  - {"op": "add_node", "id": "SCR-004-03", "type": "Screen", "owner_fr": "FR-004", "title": "Quote Details", "attrs": {"platform": "provider", "description": "Provider inspects full quote details, patient-first as a continuation of the inquiry (Patient, Inquiry, Quote, Audit); Edit and Soft Delete only when eligible; an Inquiry Cancelled banner and read-only state for cancelled quotes."}}
  - {"op": "add_node", "id": "SCR-004-04", "type": "Screen", "owner_fr": "FR-004", "title": "Quote Review", "attrs": {"platform": "patient", "description": "Patient reviews parent quotes and their subquotes, read-only in FR-004; acceptance of exactly one subquote, edge cases and booking handoff are governed by FR-005, which may extend the actions while preserving FR-004 privacy and data structure."}}
  - {"op": "add_node", "id": "SCR-004-05", "type": "Screen", "owner_fr": "FR-004", "title": "Quote List (Admin)", "attrs": {"platform": "admin", "description": "Admin lists and filters all quotes across providers, grouped by inquiry by default, with a multi-quote cue, per-quote audit trail and version history; Restore and Archive are hidden for accepted quotes."}}
  - {"op": "add_node", "id": "SCR-004-06", "type": "Screen", "owner_fr": "FR-004", "title": "Quote Detail (Admin)", "attrs": {"platform": "admin", "description": "Admin views the complete quote with inquiry continuation and can switch between quotes of the same inquiry."}}
  - {"op": "add_node", "id": "SCR-004-07", "type": "Screen", "owner_fr": "FR-004", "title": "Admin Inline Quote Edit", "attrs": {"platform": "admin", "description": "Admin performs limited, audited inline edits on draft or sent quotes only, with a mandatory reason; blocked once a subquote is accepted."}}
  - {"op": "add_node", "id": "SCR-004-08", "type": "Screen", "owner_fr": "FR-004", "title": "Admin Replacement Quote Authoring", "attrs": {"platform": "admin", "description": "Admin authors a quote for the replacement provider during an FR-006 provider-fault transfer, opened only from the transfer; Save and Continue confirms the summary and returns to FR-006 to record the acceptance."}}
