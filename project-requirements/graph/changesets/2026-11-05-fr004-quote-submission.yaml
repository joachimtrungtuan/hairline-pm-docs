# FR-004 Quote Submission & Management: PRD migrated into the graph.
# Source: project-requirements/functional-requirements/fr004-quote-submission/prd.md (v3.7), read section by section,
# plus change-request-2026-10-16-mtg002-quote-model-alignment.md for the decided-by links to SRC-MTG-002 items.
# Rules keep REQ-004-001..050; prose rules without an ID get REQ-004-051 onward. Settings and stub entities are owned
# by the FR that owns them in the PRD (FR-026 quote configuration; FR-001/003/005/006/008/015/018/019/024 stubs).
reason: "Migrate the FR-004 PRD (v3.7) into the graph: rules, entities, fields, enum values, events, settings, screens and their edges"
by: docs-manager
operations:
  # --- Rules: Functional Requirements Summary IDs (REQ-004-001..050) and prose rules given new IDs (REQ-004-051..101)
  - {"op": "add_node", "id": "REQ-004-001", "type": "Rule", "owner_fr": "FR-004", "title": "Shared treatment version and one to five package options", "attrs": {"statement": "Providers MUST create, edit, and submit parent quotes with one shared immutable Treatment-version relationship and one to five package-based Quote Options. Technique details MUST be loaded read-only through that relationship and MUST NOT be duplicated as provider-entered Quote data."}}
  - {"op": "add_node", "id": "REQ-004-002", "type": "Rule", "owner_fr": "FR-004", "title": "Admin-controlled expiry window captured at first send", "attrs": {"statement": "System MUST enforce the admin-controlled FR-026 expiry window (default 48h), captured at first send, and compute the deadline per sent quote."}}
  - {"op": "add_node", "id": "REQ-004-003", "type": "Rule", "owner_fr": "FR-004", "title": "Competing quotes cancelled on subquote acceptance", "attrs": {"statement": "System MUST cancel every other parent quote for the same inquiry as `cancelled_other_accepted` upon one subquote acceptance. Each sent parent quote MUST produce one not-selected notice per parent quote; unsent drafts MUST be cancelled silently without notice."}}
  - {"op": "add_node", "id": "REQ-004-004", "type": "Rule", "owner_fr": "FR-004", "title": "Provider withdrawal after acceptance hands over to FR-006", "attrs": {"statement": "System MUST support provider withdrawal after acceptance by moving the parent quote to `withdrawn`, keeping the AcceptanceEvent and snapshot unchanged, and handing the case to the FR-006 provider-fault transfer, with full audit and the mandatory `quote.withdrawn` notice."}}
  - {"op": "add_node", "id": "REQ-004-005", "type": "Rule", "owner_fr": "FR-004", "title": "Admin inline edit of draft and sent quotes", "attrs": {"statement": "Admin MUST be able to inline edit policy-bound fields of `draft` and `sent` quotes with required reason and re-notifications; admin edits MUST be blocked once a subquote is accepted."}}
  - {"op": "add_node", "id": "REQ-004-006", "type": "Rule", "owner_fr": "FR-004", "title": "Quote references inquiry and patient and appends only", "attrs": {"statement": "Quotes MUST reference original inquiry and patient; quote data appends, never overwrites inquiry data.", "rationale": "Business Rules restate it: quotes MUST reference the distributed inquiry ID and be linked to the original patient object; no reduction or overwriting of inquiry-supplied fields; downstream stages inherit upstream data."}}
  - {"op": "add_node", "id": "REQ-004-007", "type": "Rule", "owner_fr": "FR-004", "title": "Edits and transitions versioned and auditable", "attrs": {"statement": "All quote edits and state transitions MUST be versioned and auditable.", "rationale": "Business Rules and Workflow 3 restate it: all state transitions (draft to sent to expired, etc.) MUST be fully auditable, are logged, and result in notifications as appropriate."}}
  - {"op": "add_node", "id": "REQ-004-008", "type": "Rule", "owner_fr": "FR-004", "title": "Patient identifiers anonymized until payment", "attrs": {"statement": "Patient identifiers MUST remain anonymized to providers until payment confirmation.", "rationale": "Business Rules: patient information remains censored at this stage until payment confirmation; only anonymized identifiers and allowed fields are visible to providers. Screen 3 hides contact until payment."}}
  - {"op": "add_node", "id": "REQ-004-009", "type": "Rule", "owner_fr": "FR-004", "title": "Encryption and soft deletes only", "attrs": {"statement": "All quote data MUST be encrypted at rest and in transit; soft deletes only.", "rationale": "Business Rules: quotes CANNOT be hard deleted (only archived/soft deleted)."}}
  - {"op": "add_node", "id": "REQ-004-010", "type": "Rule", "owner_fr": "FR-004", "title": "Integration with FR-003 and FR-020", "attrs": {"statement": "Module MUST integrate with FR-003 for inquiry context and FR-020 for notifications."}}
  - {"op": "add_node", "id": "REQ-004-011", "type": "Rule", "owner_fr": "FR-004", "title": "Admin settings applied from FR-026 quote configuration", "attrs": {"statement": "Admin settings (quote expiry window, quote-expiring-soon lead time, and quote currency) MUST be applied from the FR-026 quote configuration."}}
  - {"op": "add_node", "id": "REQ-004-012", "type": "Rule", "owner_fr": "FR-004", "title": "Money on withdrawal follows FR-006 placeholder", "attrs": {"statement": "Money handling for provider withdrawal after acceptance follows the FR-006 provider-fault placeholder; exact refund and payment-allocation mechanics are owned by FR-007, FR-007B, and FR-017."}}
  - {"op": "add_node", "id": "REQ-004-013", "type": "Rule", "owner_fr": "FR-004", "title": "Inquiry cancellation cascade", "attrs": {"statement": "System MUST auto-cancel only the draft, sent, and expired quotes for an inquiry when that inquiry is cancelled by the patient (FR-003 Workflow 5), with distinct status \"Cancelled (Inquiry Cancelled)\"; quotes in any other status MUST keep their status and cause; `quote.cancelled_inquiry` (FR-020) MUST go only to providers whose quotes were cancelled by this cascade.", "rationale": "The cascade is system-initiated, not a provider or patient action on the quote itself."}}
  - {"op": "add_node", "id": "REQ-004-014", "type": "Rule", "owner_fr": "FR-004", "title": "Multiple parent quotes per provider per inquiry", "attrs": {"statement": "System MUST allow the same provider to create multiple parent quotes for one active inquiry; every quote retains an independent lifecycle, expiry, version history, and audit history.", "rationale": "Business Rules: each inquiry may have multiple parent quotes from multiple providers or from the same provider; package alternatives within a parent quote are Quote Options, not independent quote responses."}}
  - {"op": "add_node", "id": "REQ-004-015", "type": "Rule", "owner_fr": "FR-004", "title": "One to five ordered Quote Options", "attrs": {"statement": "Each quote MUST contain between one and five ordered Quote Options, and submission MUST be blocked outside that range."}}
  - {"op": "add_node", "id": "REQ-004-016", "type": "Rule", "owner_fr": "FR-004", "title": "Option keeps source package and quote-owned snapshot", "attrs": {"statement": "Each Quote Option MUST retain the selected provider package ID/version and a stable, versioned quote-owned snapshot of its inclusions and standard values.", "rationale": "Business Rules: selecting a package MUST create a quote-owned snapshot."}}
  - {"op": "add_node", "id": "REQ-004-017", "type": "Rule", "owner_fr": "FR-004", "title": "Inline customization never touches the package library", "attrs": {"statement": "Providers MUST be able to customize every selected package inline for the current quote without updating or creating reusable package-library records.", "rationale": "Business Rules: inline option customization MUST NOT update or create reusable package-library records."}}
  - {"op": "add_node", "id": "REQ-004-018", "type": "Rule", "owner_fr": "FR-004", "title": "Applicable date ranges and complete option/date pricing", "attrs": {"statement": "Each Quote Option MUST define at least one applicable patient-requested date range and a price, appointment date/time, timezone, and optional structured promotion for every applicable option/date combination. Pairings the provider cannot offer MAY be left out.", "rationale": "Business Rules: providers must select option applicability from patient-requested date ranges; a parent quote yields up to (options x date ranges) subquotes; unavailable combinations are omitted rather than priced; each priced pairing becomes one subquote for FR-005."}}
  - {"op": "add_node", "id": "REQ-004-019", "type": "Rule", "owner_fr": "FR-004", "title": "Separate relative day plan per option", "attrs": {"statement": "Each Quote Option MUST own a separate ordered day-to-day treatment plan using consecutive relative day numbers."}}
  - {"op": "add_node", "id": "REQ-004-020", "type": "Rule", "owner_fr": "FR-004", "title": "Shared clinical facts stay on the parent quote", "attrs": {"statement": "Estimated grafts, graft description, visual treatment plan, clinicians, common notes, and common requirements MUST remain shared parent-quote fields.", "rationale": "Business Rules: these MUST NOT be duplicated as option-specific facts."}}
  - {"op": "add_node", "id": "REQ-004-021", "type": "Rule", "owner_fr": "FR-004", "title": "Atomic aggregate version and audit", "attrs": {"statement": "Quote version and audit records MUST capture the complete parent-and-options aggregate atomically, including option additions/removals, package snapshots, inclusion changes, date-price changes, and option plan changes."}}
  - {"op": "add_node", "id": "REQ-004-022", "type": "Rule", "owner_fr": "FR-004", "title": "Stable identifiers and aggregate subquote version", "attrs": {"statement": "FR-004 MUST expose stable identifiers for the parent quote, Quote Option, and option/date price so FR-005 can record exactly one accepted option/date combination. FR-004 versions the complete parent quote aggregate atomically; therefore, the FR-005 `subquoteVersion` MUST equal the owning parent quote's current `QuoteVersion`. Quote Options and option/date-price records do not have independent revision counters."}}
  - {"op": "add_node", "id": "REQ-004-023", "type": "Rule", "owner_fr": "FR-004", "title": "Seven-tab quote creation flow", "attrs": {"statement": "Provider Quote Creation/Edit MUST use the ordered seven-tab flow defined in Screen 1, including Sub-screen 2A for quote-local package editing and one combined Dates & Pricing tab driven by the selected package options."}}
  - {"op": "add_node", "id": "REQ-004-024", "type": "Rule", "owner_fr": "FR-004", "title": "Quote Data Ownership Matrix", "attrs": {"statement": "Every Quote, Quote Option, option item, option/date price, and option plan-day field MUST follow the Screen 1 Quote Data Ownership Matrix, with exactly one provider-editing surface or an explicit read-only/system-derived owner."}}
  - {"op": "add_node", "id": "REQ-004-025", "type": "Rule", "owner_fr": "FR-004", "title": "Quote currency from configuration, captured at first send", "attrs": {"statement": "Quote currency MUST come from the active FR-026 quote configuration (the FR-029 Default Currency), MUST NOT be provider input, and MUST be captured on the quote at first send so historical prices retain their original currency.", "rationale": "Business Rules: drafts carry no captured currency; packages carry no currency of their own; currency is displayed read-only."}}
  - {"op": "add_node", "id": "REQ-004-026", "type": "Rule", "owner_fr": "FR-004", "title": "Quote-level attachments", "attrs": {"statement": "Providers MUST be able to attach quote-level supporting files that apply to every option; file security, access, audit, and retention rules MUST be enforced."}}
  - {"op": "add_node", "id": "REQ-004-027", "type": "Rule", "owner_fr": "FR-004", "title": "Shared eligible clinicians", "attrs": {"statement": "A quote MUST support one or more eligible clinician assignments shared across every option."}}
  - {"op": "add_node", "id": "REQ-004-028", "type": "Rule", "owner_fr": "FR-004", "title": "Graft description generated from template", "attrs": {"statement": "Graft description MUST be generated from the approved system template and estimated graft count, displayed read-only, and versioned with the quote.", "rationale": "Business Rules: providers MAY enter and revise Estimated Grafts; the system regenerates Graft Description whenever Estimated Grafts changes; providers MUST NOT directly edit it."}}
  - {"op": "add_node", "id": "REQ-004-029", "type": "Rule", "owner_fr": "FR-004", "title": "System-owned values visible only where authorized", "attrs": {"statement": "System-owned identifiers, lifecycle status, price summaries, commission, timestamps, customization state, and version/audit metadata MUST be visible only where authorized and MUST NOT be provider-editable."}}
  - {"op": "add_node", "id": "REQ-004-030", "type": "Rule", "owner_fr": "FR-004", "title": "Analytics count parent responses, amounts from accepted price", "attrs": {"statement": "Quote-amount analytics MUST be computed from the accepted option/date price only. Unaccepted quotes MUST be excluded from amount metrics and counted once as a parent response in volume and conversion metrics; Quote Options MUST NOT be counted as responses.", "rationale": "Business Rules: analytics MUST distinguish parent quote responses from Quote Options so option counts do not inflate quote-response or conversion metrics."}}
  - {"op": "add_node", "id": "REQ-004-031", "type": "Rule", "owner_fr": "FR-004", "title": "Provider status revalidated at creation and submission", "attrs": {"statement": "System MUST revalidate provider status at quote creation and submission and MUST reject quote submission by a `Suspended` or `Deactivated` provider from the effective time, including in-flight requests.", "rationale": "Edge Cases: a submission at or after the effective time is rejected; no sent quote, patient notification, or version is created."}}
  - {"op": "add_node", "id": "REQ-004-032", "type": "Rule", "owner_fr": "FR-004", "title": "Provider-status cancellation of unaccepted quotes", "attrs": {"statement": "When a provider becomes `Suspended` or `Deactivated`, System MUST cancel that provider's unaccepted parent quotes with status `cancelled_provider_status` and `cancellationProvenance` `ProviderSuspended` or `ProviderDeactivated`, once per parent quote rather than per option or option/date alternative, without rewriting the AcceptanceEvent, accepted IDs/versions, or quote-local package snapshots, and without reclassifying terminal or completed history. An accepted parent quote MUST NOT receive `cancelled_provider_status`; it keeps `accepted` and is handled by the FR-006 provider-fault transfer. Processing MUST be deduplicated per provider-status event and quote."}}
  - {"op": "add_node", "id": "REQ-004-033", "type": "Rule", "owner_fr": "FR-004", "title": "One package seeds one option with prefills", "attrs": {"statement": "Each selected package MUST seed exactly one alternative Quote Option (maximum five per parent quote), never summed with another package. The package standard price MUST prefill each applicable option/date-price row, and the package's relative day plan MUST prefill the option plan."}}
  - {"op": "add_node", "id": "REQ-004-034", "type": "Rule", "owner_fr": "FR-004", "title": "Two package edit paths and option provenance", "attrs": {"statement": "Editing a package in the FR-024 package management screen MUST change only the library (as a new package version), and editing inside quote creation MUST change only a quote-local copy that is never written back. Each Quote Option MUST record its source package ID, source package version, and an inline-customised flag.", "rationale": "Business Rules, Package library edits and quote inline edits: the quote-local edit path covers Sub-screen 2A, Tab 5 and Tab 4 prices and never creates a package version; the first inline change sets the option's inline-customised flag."}}
  - {"op": "add_node", "id": "REQ-004-035", "type": "Rule", "owner_fr": "FR-004", "title": "Promotion terms copied at send; one automatic promotion", "attrs": {"statement": "System MUST store the offered price as entered and any promotion discount separately, MUST copy the terms of every attached promotion into the sent quote version at send, and MUST attach at most one automatic FR-019 promotion per quote to each eligible option/date-price row at send, chosen by the FR-019 priority order when several qualify. Later FR-019 promotion edits MUST NOT change a sent quote."}}
  - {"op": "add_node", "id": "REQ-004-036", "type": "Rule", "owner_fr": "FR-004", "title": "Expiry and currency captured at first send", "attrs": {"statement": "System MUST capture the quote expiry and quote currency read-only at first send from the FR-026 quote configuration. Drafts MUST carry neither, and there MUST be no per-quote expiry extension."}}
  - {"op": "add_node", "id": "REQ-004-037", "type": "Rule", "owner_fr": "FR-004", "title": "No quote edits or new quotes after acceptance", "attrs": {"statement": "After a subquote is accepted, System MUST block every FR-004 quote edit by providers and admins. Treatment-detail changes (plan, clinicians, grafts) MUST go through FR-010. An accepted parent quote MUST never be reopened, expired, or restored to an acceptable state, including after `Payment Window Expired`, and no new parent quote MAY be created or sent for an inquiry with an accepted subquote, except the admin-authored replacement quote of REQ-004-048."}}
  - {"op": "add_node", "id": "REQ-004-038", "type": "Rule", "owner_fr": "FR-004", "title": "Appointment fields are the FR-006 slot-hold key", "attrs": {"statement": "The Quote Option appointment date/time and time zone, together with the provider, MUST be the key FR-006 uses for the slot hold placed at acceptance; FR-004 MUST NOT create an appointment record."}}
  - {"op": "add_node", "id": "REQ-004-039", "type": "Rule", "owner_fr": "FR-004", "title": "Quote expiring soon emitted once", "attrs": {"statement": "System MUST emit `quote.expiring_soon` once per sent parent quote when it reaches the FR-026 quote-expiring-soon lead time, and MUST NOT emit it for draft, accepted, or terminal quotes."}}
  - {"op": "add_node", "id": "REQ-004-040", "type": "Rule", "owner_fr": "FR-004", "title": "Option/date price greater than zero", "attrs": {"statement": "Every option/date price MUST be greater than 0 before send, and a zero price MUST block send. A date range the clinic cannot serve MUST be left out of that option rather than priced.", "rationale": "A zero price is blocked with an inline error on that row."}}
  - {"op": "add_node", "id": "REQ-004-041", "type": "Rule", "owner_fr": "FR-004", "title": "Default Currency change on a draft", "attrs": {"statement": "If the FR-029 Default Currency changes while a draft holds prices, System MUST switch the draft to the new currency, keep every typed number unchanged, and show a \"currency changed, check your prices\" banner that the provider MUST acknowledge before send."}}
  - {"op": "add_node", "id": "REQ-004-042", "type": "Rule", "owner_fr": "FR-004", "title": "Automatic promotion usage reservation", "attrs": {"statement": "A sent quote carrying an automatic FR-019 promotion MUST hold exactly one reserved use of that promotion's usage limit. A re-send of a new version MUST keep the existing reservation, create one only if the new version newly qualifies, and release it if the new version no longer carries the promotion. The reservation MUST be released when the quote expires, is withdrawn, or ends not selected or cancelled, MUST be released with reason `not_applied` when the accepted row does not carry the promotion, and MUST be consumed at acceptance when the accepted row carries it, so the usage limit is never exceeded. If the booking later ends in `Payment Window Expired` or is cancelled before the first payment, FR-005 and FR-019 own the return of the consumed use to the limit."}}
  - {"op": "add_node", "id": "REQ-004-043", "type": "Rule", "owner_fr": "FR-004", "title": "First-send timestamp set once", "attrs": {"statement": "System MUST set the parent quote's `firstSentAt` on its first send, and a re-send or new version MUST NOT change it."}}
  - {"op": "add_node", "id": "REQ-004-044", "type": "Rule", "owner_fr": "FR-004", "title": "Treatment Base Price is a reference-only prefill", "attrs": {"statement": "The FR-024 treatment Base Price MAY prefill a new option/date-price row only where no other standard value exists; it MUST be treated as a non-binding reference and MUST NOT be read after the quote is sent."}}
  - {"op": "add_node", "id": "REQ-004-045", "type": "Rule", "owner_fr": "FR-004", "title": "FR-004 produces quote.updated on re-send", "attrs": {"statement": "FR-004 MUST be the producer of `quote.updated` and MUST emit it when a new version of an already-sent quote is re-sent, described as \"quote revised (new version)\"."}}
  - {"op": "add_node", "id": "REQ-004-046", "type": "Rule", "owner_fr": "FR-004", "title": "quote.submitted on first send and quote.expired on expiry", "attrs": {"statement": "System MUST emit `quote.submitted` on the first send of a parent quote and `quote.expired` when expiry processing moves a sent parent quote to `expired` (FR-030)."}}
  - {"op": "add_node", "id": "REQ-004-047", "type": "Rule", "owner_fr": "FR-004", "title": "FR-004 is the only producer of quote.withdrawn", "attrs": {"statement": "FR-004 MUST be the only producer of `quote.withdrawn`. The notice MUST go to the patient for every withdrawal and to the admin only when the withdrawn quote was already accepted.", "rationale": "A withdrawal before acceptance is a normal provider action; FR-006 reacts to a post-acceptance withdrawal without emitting the event again."}}
  - {"op": "add_node", "id": "REQ-004-048", "type": "Rule", "owner_fr": "FR-004", "title": "Admin-authored replacement quote", "attrs": {"statement": "During an FR-006 provider-fault transfer before treatment starts, System MUST let an admin author a replacement quote for the replacement provider inside the same inquiry through Screen 8, with a mandatory reason and full audit. The quote MUST be marked admin-authored for a replacement and linked to the closed AcceptanceEvent, MUST NOT be offered for patient comparison or emit `quote.submitted`, and MUST be the target of the FR-005 admin-authored replacement acceptance.", "rationale": "Business Rules: it is the only exception to the block on new quotes after acceptance."}}
  - {"op": "add_node", "id": "REQ-004-049", "type": "Rule", "owner_fr": "FR-004", "title": "Admin edit of a sent quote creates a version", "attrs": {"statement": "An admin edit of a sent quote through Screen 7 MUST create a new quote version and MUST emit `quote.updated` when that version is re-sent."}}
  - {"op": "add_node", "id": "REQ-004-050", "type": "Rule", "owner_fr": "FR-004", "title": "Replacement quote pricing and expiry", "attrs": {"statement": "System MUST NOT attach an automatic FR-019 promotion to an admin-authored replacement quote or take a promotion usage reservation for it; the admin sets the replacement price directly. A replacement quote that is not accepted MUST expire under the normal quote expiry, MUST leave the inquiry flagged `supportRequired` without cancelling it automatically, and MUST allow the admin to author another replacement quote or cancel the inquiry and booking."}}
  - {"op": "add_node", "id": "REQ-004-051", "type": "Rule", "owner_fr": "FR-004", "title": "Inquiry must be active to create or submit", "attrs": {"statement": "System MUST verify parent inquiry is not in Cancelled status before accepting quote creation or submission. If inquiry is cancelled mid-draft (race condition), system rejects submission with error \"Inquiry no longer active\" and locks the draft with \"Inquiry Cancelled\" banner. Opening quote creation for a cancelled inquiry is blocked with \"Inquiry no longer active — this inquiry was cancelled by the patient.\" and no draft is created; a drafting provider sees the banner \"This inquiry was cancelled by the patient. Your draft can no longer be submitted.\" on next save or refresh, and the draft is retained for reference but cannot be submitted."}}
  - {"op": "add_node", "id": "REQ-004-052", "type": "Rule", "owner_fr": "FR-004", "title": "Restricted recipient mode for FR-037 conversions", "attrs": {"statement": "If the inquiry was created via an FR-037 monitoring-case conversion with an active exclusive provider assignment (REQ-037-029, Business Rule 7; see FR-003 Workflow 2 Alternative Flow B3), only that assigned provider may create quotes for the inquiry, including any additional parent quote. Any other provider attempting to open the inquiry for quote creation is blocked with error \"This inquiry is restricted to its assigned provider.\" The restriction does not change the other workflows (editing, expiry, withdrawal, admin oversight) on quotes that already exist. FR-038 is self-service and does not create an FR-004 inquiry or provider assignment."}}
  - {"op": "add_node", "id": "REQ-004-053", "type": "Rule", "owner_fr": "FR-004", "title": "Only assigned clinic staff submit or edit", "attrs": {"statement": "Only assigned clinic staff may submit/edit quotes for assigned inquiries."}}
  - {"op": "add_node", "id": "REQ-004-054", "type": "Rule", "owner_fr": "FR-004", "title": "Treatment from the admin-curated catalog", "attrs": {"statement": "Treatment type selection MUST use admin-curated treatment catalog; no free text."}}
  - {"op": "add_node", "id": "REQ-004-055", "type": "Rule", "owner_fr": "FR-004", "title": "Grafts, prices and slots present and valid", "attrs": {"statement": "Graft/quantity, option/date prices, and scheduled slots MUST be present and valid."}}
  - {"op": "add_node", "id": "REQ-004-056", "type": "Rule", "owner_fr": "FR-004", "title": "Package active when selected; later changes warn only", "attrs": {"statement": "Every Quote Option MUST originate from a package that is active in the authenticated provider's package library when it is selected. If the source package is later edited or deactivated, existing draft and sent options keep their snapshot; a draft may still be submitted, and Tab 7 shows a warning that the source package has changed or is inactive."}}
  - {"op": "add_node", "id": "REQ-004-057", "type": "Rule", "owner_fr": "FR-004", "title": "What a package seeds and what is entered per quote", "attrs": {"statement": "A selected package seeds services and their pricing, included travel services (transport, hotel, flight, and other travel services), the standard price, and the relative day-by-day plan; date ranges, additional notes, and documents are never packaged and are entered per quote."}}
  - {"op": "add_node", "id": "REQ-004-058", "type": "Rule", "owner_fr": "FR-004", "title": "Treatment first; every option uses it", "attrs": {"statement": "Package selection occurs after the shared treatment is selected; every option in the quote MUST use that parent treatment. Tab 2 is unavailable until an active treatment is selected."}}
  - {"op": "add_node", "id": "REQ-004-059", "type": "Rule", "owner_fr": "FR-004", "title": "Changing treatment after options exist", "attrs": {"statement": "Changing the treatment after options exist requires confirmation. The system must identify incompatible options and must not silently retain or discard dependent package, pricing, or plan data."}}
  - {"op": "add_node", "id": "REQ-004-060", "type": "Rule", "owner_fr": "FR-004", "title": "Library changes never alter existing options", "attrs": {"statement": "Package-library changes after snapshot creation MUST NOT alter existing draft or sent options unless the provider explicitly replaces the source package and confirms a new snapshot; replacing the package requires a new snapshot and audit entry."}}
  - {"op": "add_node", "id": "REQ-004-061", "type": "Rule", "owner_fr": "FR-004", "title": "Each option/date pairing once per option", "attrs": {"statement": "Each option/date-range pairing MAY appear only once per option; (quoteOptionId, sourceInquiryDateRangeId) is unique."}}
  - {"op": "add_node", "id": "REQ-004-062", "type": "Rule", "owner_fr": "FR-004", "title": "Appointment within range, future, with timezone", "attrs": {"statement": "The appointment slot must fall within its selected inquiry date range and be in the future when sent; a timezone is required."}}
  - {"op": "add_node", "id": "REQ-004-063", "type": "Rule", "owner_fr": "FR-004", "title": "Option-owned content", "attrs": {"statement": "Included services, custom services, date applicability/pricing, promotions, and the day-to-day plan belong to the Quote Option or its option/date price record."}}
  - {"op": "add_node", "id": "REQ-004-064", "type": "Rule", "owner_fr": "FR-004", "title": "Removing an option", "attrs": {"statement": "A provider may remove an option before submission while at least one valid option remains; removing an option also removes its draft date-price rows and draft treatment plan after explicit confirmation."}}
  - {"op": "add_node", "id": "REQ-004-065", "type": "Rule", "owner_fr": "FR-004", "title": "Plan day numbers stay relative", "attrs": {"statement": "Relative day numbers are never resolved to stored calendar dates. Downstream consumers (FR-005 comparison, FR-010 In Progress) present the plan by day number against the accepted appointment."}}
  - {"op": "add_node", "id": "REQ-004-066", "type": "Rule", "owner_fr": "FR-004", "title": "First send reads the FR-026 quote configuration", "attrs": {"statement": "On first send, System records the first-send timestamp, captures the quote expiry and the quote currency read-only from the active FR-026 quote configuration, and records that configuration's version on the quote; drafts carry neither. If the FR-026 configuration cannot be read, first send is blocked and the draft is kept unchanged."}}
  - {"op": "add_node", "id": "REQ-004-067", "type": "Rule", "owner_fr": "FR-004", "title": "Expiry never reset or extended", "attrs": {"statement": "Later edits and re-sends do not reset the quote expiry, later setting changes never affect a sent quote, and there is no per-quote extension. Providers cannot modify the window and only see the computed expiry timestamp."}}
  - {"op": "add_node", "id": "REQ-004-068", "type": "Rule", "owner_fr": "FR-004", "title": "Only sent quotes expire", "attrs": {"statement": "Expiry applies only to `sent` parent quotes. Upon expiry, system updates the parent quote to `expired`, emits `quote.expired` once for that parent quote (FR-030), and every child subquote becomes ineligible for acceptance. `accepted` quotes and every cancelled, withdrawn, or archived quote are never moved to `expired`.", "rationale": "A quote accepted shortly before its expiry stays `accepted` during the payment hold."}}
  - {"op": "add_node", "id": "REQ-004-069", "type": "Rule", "owner_fr": "FR-004", "title": "Draft edits emit nothing", "attrs": {"statement": "Saving draft edits without re-sending emits nothing."}}
  - {"op": "add_node", "id": "REQ-004-070", "type": "Rule", "owner_fr": "FR-004", "title": "Provider withdraws or archives before acceptance", "attrs": {"statement": "Provider may withdraw or archive quotes pre-acceptance."}}
  - {"op": "add_node", "id": "REQ-004-071", "type": "Rule", "owner_fr": "FR-004", "title": "Accepted quote stays accepted", "attrs": {"statement": "An accepted parent quote stays `accepted` and is never reopened for acceptance or moved to `expired`, including after FR-006 moves the booking to `Payment Window Expired`; its status changes only through provider withdrawal (Workflow 6). An admin booking cancellation in FR-006 moves the booking and inquiry to `Cancelled` but leaves the accepted parent quote `accepted`. Competing parent quotes stay cancelled."}}
  - {"op": "add_node", "id": "REQ-004-072", "type": "Rule", "owner_fr": "FR-004", "title": "Inquiry cancellation reason is patient-private", "attrs": {"statement": "The patient's inquiry cancellation reason is patient-private and NOT shared with providers."}}
  - {"op": "add_node", "id": "REQ-004-073", "type": "Rule", "owner_fr": "FR-004", "title": "Draft cancelled by provider status is silent to the patient", "attrs": {"statement": "Cancelling an unsent draft because of provider suspension or deactivation is silent to the patient: the patient never saw it, so it triggers no `provider.status_cancellation_patient` notice on its own (admin support alerts still follow FR-020)."}}
  - {"op": "add_node", "id": "REQ-004-074", "type": "Rule", "owner_fr": "FR-004", "title": "Reactivation does not restore cancelled quotes", "attrs": {"statement": "Later reactivation of the provider does not restore quotes cancelled with `cancelled_provider_status`; other providers' quotes are unaffected by the cascade; quotes already expired, withdrawn, archived, or otherwise terminal are not reclassified."}}
  - {"op": "add_node", "id": "REQ-004-075", "type": "Rule", "owner_fr": "FR-004", "title": "Patient sees provider-status cancellation as unavailable", "attrs": {"statement": "Patients see a quote cancelled by provider status as unavailable (\"Offer Unavailable\") with a Contact Admin/Support action rather than the patient-cancellation message."}}
  - {"op": "add_node", "id": "REQ-004-076", "type": "Rule", "owner_fr": "FR-004", "title": "Provider soft delete before acceptance", "attrs": {"statement": "Provider may soft-delete a quote before acceptance (removes from provider listing, not from audit/archive or patient record); the system sets status = Archived with rationale. Quotes in terminal states (accepted, expired, withdrawn, cancelled_other_accepted, cancelled_inquiry_cancelled, cancelled_provider_status) cannot be soft-deleted by provider."}}
  - {"op": "add_node", "id": "REQ-004-077", "type": "Rule", "owner_fr": "FR-004", "title": "Admin soft delete and restore", "attrs": {"statement": "Soft-deletes are fully auditable and revertible only by admin. Admin can perform soft delete or restore and view the immutable audit trail and full quote history; soft delete and restore are unavailable for a quote in `accepted` status, which is never deleted or restored. Only admin can restore expired/archived quotes if justified (GDPR-compliant log); restore to an acceptable state is blocked when the inquiry already has an accepted subquote."}}
  - {"op": "add_node", "id": "REQ-004-078", "type": "Rule", "owner_fr": "FR-004", "title": "Admin authors a quote only as a replacement", "attrs": {"statement": "Admin authors a quote only as the replacement quote of an FR-006 provider-fault transfer (Workflow 7, Screen 8)."}}
  - {"op": "add_node", "id": "REQ-004-079", "type": "Rule", "owner_fr": "FR-004", "title": "Withdrawal after acceptance needs a reason and edits nothing", "attrs": {"statement": "Provider submits a withdrawal after acceptance with a mandatory reason; the parent quote moves from `accepted` to `withdrawn`. This is the only status change FR-004 makes after acceptance; no quote field, option, or option/date-price record is edited."}}
  - {"op": "add_node", "id": "REQ-004-080", "type": "Rule", "owner_fr": "FR-004", "title": "Replacement quote only before treatment starts", "attrs": {"statement": "The provider-fault transfer with a replacement quote and a new acceptance applies only before treatment starts (booking `Accepted` or `Confirmed`); provider drop-out after acceptance, including an FR-010 reassignment, is not a quote withdrawal. If the fault happens in Aftercare, no replacement quote, new acceptance, or new payment is created. Screen 8 is unavailable for a booking in `In Progress` or later stages and for any inquiry with an active acceptance."}}
  - {"op": "add_node", "id": "REQ-004-081", "type": "Rule", "owner_fr": "FR-004", "title": "Replacement quote preconditions", "attrs": {"statement": "Before the admin authors a replacement quote, the system checks that the booking was closed with a provider-fault cause (`ProviderFault`, `ProviderSuspended`, or `ProviderDeactivated`), that the inquiry has no active acceptance, that treatment had not started, and that the replacement provider is `Active` and is not the provider at fault."}}
  - {"op": "add_node", "id": "REQ-004-082", "type": "Rule", "owner_fr": "FR-004", "title": "Replacement quote captures currency and expiry when saved for acceptance", "attrs": {"statement": "A replacement quote captures its currency from the active FR-026 quote configuration, and its expiry is captured from the active FR-026 quote configuration when it is saved for acceptance."}}
  - {"op": "add_node", "id": "REQ-004-083", "type": "Rule", "owner_fr": "FR-004", "title": "Authoring a replacement quote sends no notice", "attrs": {"statement": "Authoring a replacement quote sends no notice."}}
  - {"op": "add_node", "id": "REQ-004-084", "type": "Rule", "owner_fr": "FR-004", "title": "Accepted terms never change", "attrs": {"statement": "After acceptance, price, currency, date range, and promotion never change; the booking's appointment changes only through the FR-006 admin appointment change, which emits `booking.rescheduled`, while the acceptance snapshot keeps the accepted appointment as the baseline."}}
  - {"op": "add_node", "id": "REQ-004-085", "type": "Rule", "owner_fr": "FR-004", "title": "Edits only while draft or sent", "attrs": {"statement": "Providers and admins may edit a quote only while it is `draft` or `sent`. Edits on accepted, expired, withdrawn, archived, or cancelled quotes are prohibited, and a late edit or deletion is disallowed with a user message."}}
  - {"op": "add_node", "id": "REQ-004-086", "type": "Rule", "owner_fr": "FR-004", "title": "Acceptance values are read-only copies of the FR-005 snapshot", "attrs": {"statement": "`acceptedTotal`, `termsAcknowledgedAt`, and `lockedExchangeRateSnapshot` are read-only copies written at FR-005 acceptance from the acceptance snapshot; the FR-005 snapshot is authoritative, and downstream FRs read money fields from it. Acceptance state is not stored on the option/date-price record; it is derived from FR-005."}}
  - {"op": "add_node", "id": "REQ-004-087", "type": "Rule", "owner_fr": "FR-004", "title": "confirmed is not a quote status", "attrs": {"statement": "`confirmed` is a booking status owned by FR-006, never a quote status; an accepted quote stays `accepted`."}}
  - {"op": "add_node", "id": "REQ-004-088", "type": "Rule", "owner_fr": "FR-004", "title": "Commission shown as indicative", "attrs": {"statement": "The quote shows the commission model and value (percentage or flat rate) only as an indicative figure labelled \"indicative, final at booking confirmation\"; the binding commission is fixed at booking confirmation on the accepted price after promotion, in the quote currency, read from the acceptance snapshot (FR-029)."}}
  - {"op": "add_node", "id": "REQ-004-089", "type": "Rule", "owner_fr": "FR-004", "title": "Automatic promotion with no uses left is not attached", "attrs": {"statement": "An automatic promotion with no uses left is not eligible and is not attached; when its last use is reserved by another quote before this quote is sent, it is not attached at send, because the usage limit can never be exceeded."}}
  - {"op": "add_node", "id": "REQ-004-090", "type": "Rule", "owner_fr": "FR-004", "title": "Discount review threshold", "attrs": {"statement": "Discounts are provider-managed (reviewed by admin if above configured threshold)."}}
  - {"op": "add_node", "id": "REQ-004-091", "type": "Rule", "owner_fr": "FR-004", "title": "Notifications follow platform rules", "attrs": {"statement": "All notifications MUST comply with platform notification/audit/logging rules."}}
  - {"op": "add_node", "id": "REQ-004-092", "type": "Rule", "owner_fr": "FR-004", "title": "Quote objects retained for at least 7 years", "attrs": {"statement": "GDPR/data compliance: all quote objects are archived for at least 7 years."}}
  - {"op": "add_node", "id": "REQ-004-093", "type": "Rule", "owner_fr": "FR-004", "title": "Price range derived from option/date prices", "attrs": {"statement": "The quote price range is derived from all option/date prices, from the lowest to the highest option/date price, and is never entered separately."}}
  - {"op": "add_node", "id": "REQ-004-094", "type": "Rule", "owner_fr": "FR-004", "title": "Abandoned drafts auto-archived after 7 days", "attrs": {"statement": "System retains an abandoned draft for 7 days, then auto-archives it."}}
  - {"op": "add_node", "id": "REQ-004-095", "type": "Rule", "owner_fr": "FR-004", "title": "Patient accepts one subquote; no parent-level action", "attrs": {"statement": "The patient accepts exactly one subquote through FR-005; there is no parent-level Accept or Decline action. If the patient accepts no subquote, all open sent quotes expire automatically."}}
  - {"op": "add_node", "id": "REQ-004-096", "type": "Rule", "owner_fr": "FR-004", "title": "Draft locked when another quote is accepted", "attrs": {"statement": "While a provider is drafting a quote, if another quote is accepted, the unsent draft is cancelled silently as \"cancelled (other accepted)\" with no notice; on next open the draft is read-only with the \"Another Quote Accepted\" badge and cannot be submitted."}}
  - {"op": "add_node", "id": "REQ-004-097", "type": "Rule", "owner_fr": "FR-004", "title": "Drafts and archived quotes hidden from patients", "attrs": {"statement": "Drafts and archived quotes are never shown to patients."}}
  - {"op": "add_node", "id": "REQ-004-098", "type": "Rule", "owner_fr": "FR-004", "title": "Cancelled quotes are read-only with badge and banner", "attrs": {"statement": "Quotes with status \"Cancelled (Inquiry Cancelled)\" are displayed with greyed-out row styling and an \"Inquiry Cancelled\" badge, show a prominent \"Inquiry Cancelled\" banner on the detail view, have all edit and delete actions disabled, and remain read-only for reference; an edit attempt is blocked with the message \"This quote was cancelled because the patient cancelled their inquiry\". Quotes with status \"cancelled (other accepted)\" are similarly greyed out with an \"Another Quote Accepted\" badge."}}
  - {"op": "add_node", "id": "REQ-004-099", "type": "Rule", "owner_fr": "FR-004", "title": "Admin promotion change on a draft or sent quote", "attrs": {"statement": "Admin may add, replace, or remove the structured promotion on an option/date price of a draft or sent quote; inline create is permitted with `scope = AD_HOC_QUOTE_BOUND` per FR-019 Screen 9 Mode 2. The promotion must resolve to a valid PromotionProgram id or null, a reason is required, and the change creates a new quote version into which the current promotion terms are copied."}}
  - {"op": "add_node", "id": "REQ-004-100", "type": "Rule", "owner_fr": "FR-004", "title": "Structured promotions only", "attrs": {"statement": "A promotion on an option/date price must resolve to a valid structured `PromotionProgram`; no free-text promotion."}}
  - {"op": "add_node", "id": "REQ-004-101", "type": "Rule", "owner_fr": "FR-004", "title": "Admin grafts change regenerates description without keeping prior text", "attrs": {"statement": "When an admin saves a new Estimated Grafts value through Screen 7, Graft Description is regenerated from the approved template; the prior text is not preserved."}}
  # --- Settings read from the FR-026 quote configuration (owned by FR-026)
  - {"op": "add_node", "id": "SET-quote-expiry-window", "type": "Setting", "owner_fr": "FR-026", "title": "Quote expiry window", "attrs": {"description": "Admin-set quote expiry window, copied read-only onto a quote at first send. Stub created during FR-004 migration; detail arrives when FR-026 migrates.", "default": "48", "unit": "hours"}}
  - {"op": "add_node", "id": "SET-quote-expiring-soon-lead-time", "type": "Setting", "owner_fr": "FR-026", "title": "Quote expiring-soon lead time", "attrs": {"description": "Admin-set lead time before expiry at which quote.expiring_soon is emitted for a sent quote. FR-004 states no default. Stub created during FR-004 migration; detail arrives when FR-026 migrates."}}
  - {"op": "add_node", "id": "SET-quote-currency", "type": "Setting", "owner_fr": "FR-026", "title": "Quote currency", "attrs": {"description": "Currency of the active FR-026 quote configuration, seeded from the FR-029 Default Currency, captured onto a quote at first send. Stub created during FR-004 migration; detail arrives when FR-026 migrates."}}
  # --- FR-004 entities
  - {"op": "add_node", "id": "ENT-quote", "type": "Entity", "owner_fr": "FR-004", "title": "Quote", "attrs": {"description": "Parent quote: one provider response for an inquiry and the aggregate/version boundary. Owns the provider, treatment, graft facts, visual plan, clinicians, shared notes/requirements, attachments, currency, expiry, lifecycle and audit history. One provider may own several Quote records for the same inquiry."}}
  - {"op": "add_node", "id": "ENT-quote-option", "type": "Entity", "owner_fr": "FR-004", "title": "Quote Option", "attrs": {"description": "One package alternative inside a parent quote; a quote-local copy of a package version, never written back to the library. Owns the package snapshot, included/custom services and the relative day-to-day plan."}}
  - {"op": "add_node", "id": "ENT-quote-option-item", "type": "Entity", "owner_fr": "FR-004", "title": "Quote Option Item", "attrs": {"description": "One service row in a Quote Option's quote-local inclusion snapshot."}}
  - {"op": "add_node", "id": "ENT-quote-option-date-price", "type": "Entity", "owner_fr": "FR-004", "title": "Quote Option Date-Price", "attrs": {"description": "One applicable patient-requested date range for a Quote Option, with its pre-scheduled appointment, offered price and optional promotion. Combined with its Quote Option it is one FR-005 subquote."}}
  - {"op": "add_node", "id": "ENT-quote-option-plan-day", "type": "Entity", "owner_fr": "FR-004", "title": "Quote Option Plan Day", "attrs": {"description": "One relative day of a Quote Option's day-to-day treatment plan; seeds FR-010 In Progress day descriptions by day number."}}
  - {"op": "add_node", "id": "ENT-quote-version", "type": "Entity", "owner_fr": "FR-004", "title": "Quote Version", "attrs": {"description": "Snapshot of the full Quote aggregate and all option-owned children, including promotion terms copied at send; one per sent version. Version source of every FR-005 subquote."}}
  - {"op": "add_node", "id": "ENT-quote-audit", "type": "Entity", "owner_fr": "FR-004", "title": "Quote Audit", "attrs": {"description": "Immutable audit entry for a quote change or transition (who, what, when, before and after, reason). Last editor and edit time are read from here rather than stored on Quote."}}
  # --- Entities owned by other FRs that FR-004 reads or writes (stubs)
  - {"op": "add_node", "id": "ENT-inquiry", "type": "Entity", "owner_fr": "FR-003", "title": "Inquiry", "attrs": {"description": "Stub created during FR-004 migration; detail arrives when FR-003 migrates."}}
  - {"op": "add_node", "id": "ENT-inquiry-date-range", "type": "Entity", "owner_fr": "FR-003", "title": "Inquiry date range", "attrs": {"description": "Stub created during FR-004 migration; detail arrives when FR-003 migrates."}}
  - {"op": "add_node", "id": "ENT-patient", "type": "Entity", "owner_fr": "FR-001", "title": "Patient", "attrs": {"description": "Stub created during FR-004 migration; detail arrives when FR-001 migrates."}}
  - {"op": "add_node", "id": "ENT-provider", "type": "Entity", "owner_fr": "FR-015", "title": "Provider", "attrs": {"description": "Stub created during FR-004 migration; detail arrives when FR-015 migrates."}}
  - {"op": "add_node", "id": "ENT-treatment", "type": "Entity", "owner_fr": "FR-024", "title": "Treatment", "attrs": {"description": "Stub created during FR-004 migration; detail arrives when FR-024 migrates."}}
  - {"op": "add_node", "id": "ENT-package", "type": "Entity", "owner_fr": "FR-024", "title": "Package", "attrs": {"description": "Stub created during FR-004 migration; detail arrives when FR-024 migrates."}}
  - {"op": "add_node", "id": "ENT-promotion-program", "type": "Entity", "owner_fr": "FR-019", "title": "Promotion program", "attrs": {"description": "Stub created during FR-004 migration; detail arrives when FR-019 migrates."}}
  - {"op": "add_node", "id": "ENT-subquote", "type": "Entity", "owner_fr": "FR-005", "title": "Subquote", "attrs": {"description": "Stub created during FR-004 migration; detail arrives when FR-005 migrates."}}
  - {"op": "add_node", "id": "ENT-acceptance-event", "type": "Entity", "owner_fr": "FR-005", "title": "Acceptance event", "attrs": {"description": "Stub created during FR-004 migration; detail arrives when FR-005 migrates."}}
  - {"op": "add_node", "id": "ENT-booking", "type": "Entity", "owner_fr": "FR-006", "title": "Booking", "attrs": {"description": "Stub created during FR-004 migration; detail arrives when FR-006 migrates."}}
  - {"op": "add_node", "id": "ENT-travel-responsibility", "type": "Entity", "owner_fr": "FR-008", "title": "Travel responsibility", "attrs": {"description": "Stub created during FR-004 migration; detail arrives when FR-008 migrates."}}
  - {"op": "add_node", "id": "ENT-affiliate-attribution", "type": "Entity", "owner_fr": "FR-018", "title": "Affiliate attribution", "attrs": {"description": "Stub created during FR-004 migration; detail arrives when FR-018 migrates."}}
  # --- Fields (defined once, on their Entity)
  - {"op": "add_field", "id": "ENT-quote.id", "entity_id": "ENT-quote", "name": "id", "data_type": "id", "title": "Quote ID", "owner_fr": "FR-004", "required": true, "attrs": {"description": "Stable generated identifier; read-only."}}
  - {"op": "add_field", "id": "ENT-quote.inquiry_id", "entity_id": "ENT-quote", "name": "inquiry_id", "data_type": "id", "title": "Inquiry ID", "owner_fr": "FR-004", "required": true, "attrs": {"description": "Distributed FR-003 inquiry the quote answers; read-only; the quote appends to the inquiry and never overwrites it."}}
  - {"op": "add_field", "id": "ENT-quote.provider_id", "entity_id": "ENT-quote", "name": "provider_id", "data_type": "id", "title": "Provider ID", "owner_fr": "FR-004", "required": true, "attrs": {"description": "Taken from the authenticated tenant; read-only; never selected in the quote."}}
  - {"op": "add_field", "id": "ENT-quote.treatment_id", "entity_id": "ENT-quote", "name": "treatment_id", "data_type": "id", "title": "Treatment ID", "owner_fr": "FR-004", "required": true, "attrs": {"description": "Exact immutable FR-024 Treatment record shared by every option; must be active when selected; treatment name, type and technique are resolved through it, not copied."}}
  - {"op": "add_field", "id": "ENT-quote.treatment_version", "entity_id": "ENT-quote", "name": "treatment_version", "data_type": "text", "title": "Treatment version", "owner_fr": "FR-004", "required": true, "attrs": {"description": "Version metadata of the exact Treatment record."}}
  - {"op": "add_field", "id": "ENT-quote.estimated_grafts", "entity_id": "ENT-quote", "name": "estimated_grafts", "data_type": "int", "title": "Estimated grafts", "owner_fr": "FR-004", "required": true, "attrs": {"description": "Provider-entered positive integer shared by every option."}}
  - {"op": "add_field", "id": "ENT-quote.graft_description", "entity_id": "ENT-quote", "name": "graft_description", "data_type": "text", "title": "Graft description", "owner_fr": "FR-004", "required": true, "calculated_by": "REQ-004-028", "attrs": {"description": "Generated from the approved template and the current estimated grafts; regenerated on every change; read-only; retained in aggregate versions."}}
  - {"op": "add_field", "id": "ENT-quote.graft_visual_plan", "entity_id": "ENT-quote", "name": "graft_visual_plan", "data_type": "media", "title": "Visual treatment plan / graft markup", "owner_fr": "FR-004", "required": false, "attrs": {"description": "Optional shared drawing, 3D markup or media snapshot; supported file/media rules; stored in the aggregate version."}}
  - {"op": "add_field", "id": "ENT-quote.clinician_ids", "entity_id": "ENT-quote", "name": "clinician_ids", "data_type": "id[]", "title": "Clinician IDs", "owner_fr": "FR-004", "required": true, "attrs": {"description": "One or more clinicians shared by every option; each must be active, eligible and belong to the provider."}}
  - {"op": "add_field", "id": "ENT-quote.common_notes", "entity_id": "ENT-quote", "name": "common_notes", "data_type": "text", "title": "Common notes", "owner_fr": "FR-004", "required": false, "attrs": {"description": "Optional text applying to every option; maximum 5,000 characters."}}
  - {"op": "add_field", "id": "ENT-quote.common_requirements", "entity_id": "ENT-quote", "name": "common_requirements", "data_type": "text[]", "title": "Common requirements", "owner_fr": "FR-004", "required": false, "attrs": {"description": "Optional patient or treatment requirements applying to every option; maximum 5,000 characters per entry; empty entries rejected."}}
  - {"op": "add_field", "id": "ENT-quote.attachment_ids", "entity_id": "ENT-quote", "name": "attachment_ids", "data_type": "id[]", "title": "Attachments", "owner_fr": "FR-004", "required": false, "attrs": {"description": "Optional quote-level images, videos or documents applying to every option; maximum 5 files; JPG/PNG up to 5 MB each; MP4/PDF up to 10 MB each; virus scan, retention and access rules enforced."}}
  - {"op": "add_field", "id": "ENT-quote.currency_snapshot", "entity_id": "ENT-quote", "name": "currency_snapshot", "data_type": "currency", "title": "Currency snapshot", "owner_fr": "FR-004", "required": false, "attrs": {"description": "Captured read-only at first send from the active FR-026 quote configuration (FR-029 Default Currency); null on drafts; never provider input."}}
  - {"op": "add_field", "id": "ENT-quote.calculated_price_range", "entity_id": "ENT-quote", "name": "calculated_price_range", "data_type": "money range", "title": "Calculated price range", "owner_fr": "FR-004", "required": false, "calculated_by": "REQ-004-093", "attrs": {"description": "Lowest to highest option/date price; never entered separately."}}
  - {"op": "add_field", "id": "ENT-quote.accepted_total", "entity_id": "ENT-quote", "name": "accepted_total", "data_type": "money", "title": "Accepted total", "owner_fr": "FR-004", "required": false, "attrs": {"description": "Price after promotion, written only at FR-005 acceptance as a read-only copy of the acceptance snapshot."}}
  - {"op": "add_field", "id": "ENT-quote.commission", "entity_id": "ENT-quote", "name": "commission", "data_type": "commission", "title": "Commission", "owner_fr": "FR-004", "required": false, "attrs": {"description": "Indicative commission model and value (percentage or flat rate) from the active FR-029 configuration, labelled \"indicative, final at booking confirmation\"; never provider input; shown only to authorized roles."}}
  - {"op": "add_field", "id": "ENT-quote.terms_acknowledged_at", "entity_id": "ENT-quote", "name": "terms_acknowledged_at", "data_type": "datetime", "title": "Terms acknowledged at", "owner_fr": "FR-004", "required": false, "attrs": {"description": "Null during quote creation; read-only copy of the FR-005 acceptance snapshot value."}}
  - {"op": "add_field", "id": "ENT-quote.locked_exchange_rate_snapshot", "entity_id": "ENT-quote", "name": "locked_exchange_rate_snapshot", "data_type": "exchange rate", "title": "Locked exchange-rate snapshot", "owner_fr": "FR-004", "required": false, "attrs": {"description": "Null before acceptance; read-only copy of the FR-005/FR-029 acceptance snapshot value (rate value and pair) when conversion is required."}}
  - {"op": "add_field", "id": "ENT-quote.cancellation_provenance", "entity_id": "ENT-quote", "name": "cancellation_provenance", "data_type": "enum", "title": "Cancellation provenance", "owner_fr": "FR-004", "required": false, "attrs": {"description": "Records why an unaccepted quote was cancelled (inquiry cancellation, another accepted quote, or provider suspension/deactivation) and, for provider status, the triggering provider-status event; never provider input."}}
  - {"op": "add_field", "id": "ENT-quote.author_type", "entity_id": "ENT-quote", "name": "author_type", "data_type": "enum", "title": "Author type", "owner_fr": "FR-004", "required": true, "attrs": {"description": "`provider` for every quote except the admin-authored replacement quote (`admin`)."}}
  - {"op": "add_field", "id": "ENT-quote.replacement_for_acceptance_event_id", "entity_id": "ENT-quote", "name": "replacement_for_acceptance_event_id", "data_type": "id", "title": "Replacement for acceptance event", "owner_fr": "FR-004", "required": false, "attrs": {"description": "Set only on an admin-authored replacement quote: the closed FR-005 AcceptanceEvent it replaces."}}
  - {"op": "add_field", "id": "ENT-quote.status", "entity_id": "ENT-quote", "name": "status", "data_type": "enum", "title": "Status", "owner_fr": "FR-004", "required": true, "attrs": {"description": "Governed lifecycle state; read-only; changed only by governed workflow actions. `confirmed` is not a quote status."}}
