reason: "FR-029 Payment System Configuration migration, part 2 of 2: rules with applies-at, governed-by and decided-by edges, and calculated-by links (migrate-fr checklist v1.1, from the frozen PRD)."
by: "docs-manager"
operations:
  # --- Rules
  - {"op": "add_node", "id": "REQ-029-001", "type": "Rule", "owner_fr": "FR-029", "title": "Allow admins to add, edit, and manage multiple Stripe accounts with API credentials", "attrs": {"statement": "System MUST allow admins to add, edit, and manage multiple Stripe accounts with API credentials (publishable key, secret key, webhook secret)", "rationale": "Also stated by the Add Stripe Account flow and Screen 1."}}
  - {"op": "add_node", "id": "REQ-029-002", "type": "Rule", "owner_fr": "FR-029", "title": "Allow admins to assign Stripe accounts to specific countries or regional groupings", "attrs": {"statement": "System MUST allow admins to assign Stripe accounts to specific countries or regional groupings (multi-select assignment)"}}
  - {"op": "add_node", "id": "REQ-029-003", "type": "Rule", "owner_fr": "FR-029", "title": "Validate Stripe API credentials by testing connection to Stripe API before activating...", "attrs": {"statement": "System MUST validate Stripe API credentials by testing connection to Stripe API before activating account", "rationale": "Restates Screen 1 rule on credential validation and the Add Stripe Account flow step 5."}}
  - {"op": "add_node", "id": "REQ-029-004", "type": "Rule", "owner_fr": "FR-029", "title": "Route payment transactions to appropriate Stripe account based on patient's country...", "attrs": {"statement": "System MUST route payment transactions to appropriate Stripe account based on patient's country location", "rationale": "Routing basis is under product owner decision (patient country selected during booking, profile country, or billing/payment context). Restated by Payment Rule 1."}}
  - {"op": "add_node", "id": "REQ-029-005", "type": "Rule", "owner_fr": "FR-029", "title": "Support multiple currencies per Stripe account and allow admins to configure supported...", "attrs": {"statement": "System MUST support multiple currencies per Stripe account and allow admins to configure supported currencies"}}
  - {"op": "add_node", "id": "REQ-029-006", "type": "Rule", "owner_fr": "FR-029", "title": "Allow admins to manage rate sources", "attrs": {"statement": "System MUST allow admins to manage rate sources (add, edit, delete) where each source bundles a provider type (xe.com, fixer.io) with its API credentials. Source creation requires a successful test connection before saving. Source deletion is blocked if currency pairs reference it; admin must reassign or convert affected pairs first.", "rationale": "Deletion of a referenced source is contradicted inside the PRD; see product owner decision."}}
  - {"op": "add_node", "id": "REQ-029-007", "type": "Rule", "owner_fr": "FR-029", "title": "Allow admins to set a global default markup percentage", "attrs": {"statement": "System MUST allow admins to set a global default markup percentage (0-20% range) and optionally override it per currency pair (0-20% range). If a pair has no per-pair markup, the global default applies.", "rationale": "Restated by REQ-029-038 (validation) and Screen 2A, 2B."}}
  - {"op": "add_node", "id": "REQ-029-008", "type": "Rule", "owner_fr": "FR-029", "title": "Fetch currency conversion rates automatically for each auto-fetch pair on its...", "attrs": {"statement": "System MUST fetch currency conversion rates automatically for each auto-fetch pair on its configured sync schedule (per-pair or inherited global frequency). Manual-mode pairs are not synced."}}
  - {"op": "add_node", "id": "REQ-029-009", "type": "Rule", "owner_fr": "FR-029", "title": "Calculate and display the effective rate for each pair as", "attrs": {"statement": "System MUST calculate and display the effective rate for each pair as: Base Rate × (1 + Markup %). This effective rate is applied to patient-facing prices.", "rationale": "Calculates the effective rate of a pair."}}
  - {"op": "add_node", "id": "REQ-029-010", "type": "Rule", "owner_fr": "FR-029", "title": "Allow admins to configure a global rate protection threshold", "attrs": {"statement": "System MUST allow admins to configure a global rate protection threshold (1-50% range). System monitors each auto-fetch pair independently and marks the pair's status as yellow/warning and sends an alert notification when the pair's rate changes more than the threshold within 24 hours."}}
  - {"op": "add_node", "id": "REQ-029-011", "type": "Rule", "owner_fr": "FR-029", "title": "Require a successful \"Test Connection & Fetch Rate\" action before saving any new...", "attrs": {"statement": "System MUST require a successful \"Test Connection & Fetch Rate\" action before saving any new auto-fetch currency pair. The Save button is disabled until this test succeeds."}}
  - {"op": "add_node", "id": "REQ-029-012", "type": "Rule", "owner_fr": "FR-029", "title": "Gracefully handle per-pair rate source failures by keeping the last successfully...", "attrs": {"statement": "System MUST gracefully handle per-pair rate source failures by keeping the last successfully fetched rate, marking the pair's status as red/error on the pair list, and alerting admin. If a source is deleted, all pairs referencing it MUST gracefully switch to manual mode with the last fetched rate pre-filled.", "rationale": "Retry and backoff are in the sync-retry rule; contradiction on deletion of a source in use is in product owner decision."}}
  - {"op": "add_node", "id": "REQ-029-013", "type": "Rule", "owner_fr": "FR-029", "title": "Allow admins to configure deposit rate percentage", "attrs": {"statement": "System MUST allow admins to configure deposit rate percentage (20-30% range) globally for all providers"}}
  - {"op": "add_node", "id": "REQ-029-014", "type": "Rule", "owner_fr": "FR-029", "title": "Allow admins to configure provider-specific deposit rates that override global default...", "attrs": {"statement": "System MUST allow admins to configure provider-specific deposit rates that override global default for selected providers"}}
  - {"op": "add_node", "id": "REQ-029-015", "type": "Rule", "owner_fr": "FR-029", "title": "Apply deposit rate changes to new bookings only", "attrs": {"statement": "System MUST apply deposit rate changes to new bookings only (existing bookings retain original deposit rate)", "rationale": "Restated by Screen 3 and Screen 4 rules."}}
  - {"op": "add_node", "id": "REQ-029-016", "type": "Rule", "owner_fr": "FR-029", "title": "Calculate deposit amount by multiplying booking total by configured deposit rate...", "attrs": {"statement": "System MUST calculate deposit amount by multiplying booking total by configured deposit rate percentage", "rationale": "Restated by Payment Rule 4 (rounded to 2 decimal places)."}}
  - {"op": "add_node", "id": "REQ-029-017", "type": "Rule", "owner_fr": "FR-029", "title": "Allow admins to enable or disable split payment", "attrs": {"statement": "System MUST allow admins to enable or disable split payment (installment) feature globally"}}
  - {"op": "add_node", "id": "REQ-029-018", "type": "Rule", "owner_fr": "FR-029", "title": "Allow admins to select available installment options", "attrs": {"statement": "System MUST allow admins to select available installment options (2-9 installments) via multi-select checkboxes"}}
  - {"op": "add_node", "id": "REQ-029-019", "type": "Rule", "owner_fr": "FR-029", "title": "Allow admins to configure cutoff days", "attrs": {"statement": "System MUST allow admins to configure cutoff days (30-90 day range) requiring full payment completion before procedure date", "rationale": "The PRD gives a default of 30 days (Screen 4)."}}
  - {"op": "add_node", "id": "REQ-029-020", "type": "Rule", "owner_fr": "FR-029", "title": "Allow admins to configure minimum booking amount", "attrs": {"statement": "System MUST allow admins to configure minimum booking amount ($100-$10,000 range) required to qualify for installments", "rationale": "Stated in USD; see product owner decision on the currency of the minimum."}}
  - {"op": "add_node", "id": "REQ-029-021", "type": "Rule", "owner_fr": "FR-029", "title": "Automatically calculate available installment options based on booking date, procedure...", "attrs": {"statement": "System MUST automatically calculate available installment options based on booking date, procedure date, and cutoff days", "rationale": "Restated by Payment Rule 5 and Screen 4."}}
  - {"op": "add_node", "id": "REQ-029-022", "type": "Rule", "owner_fr": "FR-029", "title": "Generate installment payment schedules using equal-split amounts", "attrs": {"statement": "System MUST generate installment payment schedules using equal-split amounts: booking total ÷ installment count (rounded to 2 decimal places; last installment absorbs rounding difference)", "rationale": "Restated by Billing Rule 1 and Screen 4. Rounding to 2 decimal places conflicts with currencies of 0 minor units; see product owner decision."}}
  - {"op": "add_node", "id": "REQ-029-023", "type": "Rule", "owner_fr": "FR-029", "title": "Allow admins to configure late payment grace period", "attrs": {"statement": "System MUST allow admins to configure late payment grace period (0-14 days) before booking cancellation"}}
  - {"op": "add_node", "id": "REQ-029-024", "type": "Rule", "owner_fr": "FR-029", "title": "Persist all payment configuration data", "attrs": {"statement": "System MUST persist all payment configuration data (Stripe accounts, rate sources, currency pairs, global conversion settings, deposit rates, commission global default, provider-specific commission scopes, split payment rules) with full audit history"}}
  - {"op": "add_node", "id": "REQ-029-025", "type": "Rule", "owner_fr": "FR-029", "title": "Log all payment configuration changes to audit trail with admin ID, timestamp, IP...", "attrs": {"statement": "System MUST log all payment configuration changes to audit trail with admin ID, timestamp, IP address, and before/after state", "rationale": "Restates General Rule 2, Audit Rule and the commission audit bullet. The audit configuration type list omits rate sources and currency management; see product owner decision."}}
  - {"op": "add_node", "id": "REQ-029-026", "type": "Rule", "owner_fr": "FR-029", "title": "Cache payment configuration data with 5-minute TTL to minimize database queries during...", "attrs": {"statement": "System MUST cache payment configuration data with 5-minute TTL to minimize database queries during payment processing", "rationale": "Restates General Rule 3 and the 5-minute propagation bullets of Screens 1, 3, 4, 5 and REQ-029-036."}}
  - {"op": "add_node", "id": "REQ-029-027", "type": "Rule", "owner_fr": "FR-029", "title": "Retain payment configuration audit history for minimum 10 years for financial compliance", "attrs": {"statement": "System MUST retain payment configuration audit history for minimum 10 years for financial compliance", "rationale": "Restates the Data Retention rule."}}
  - {"op": "add_node", "id": "REQ-029-028", "type": "Rule", "owner_fr": "FR-029", "title": "Encrypt Stripe API secret keys and webhook secrets at rest using AES-256 encryption", "attrs": {"statement": "System MUST encrypt Stripe API secret keys and webhook secrets at rest using AES-256 encryption", "rationale": "Restates Privacy Rule 1."}}
  - {"op": "add_node", "id": "REQ-029-029", "type": "Rule", "owner_fr": "FR-029", "title": "Never log Stripe secret keys in plain text to audit logs or error logs", "attrs": {"statement": "System MUST never log Stripe secret keys in plain text to audit logs or error logs (mask all but last 4 characters)", "rationale": "Restates Privacy Rule 2."}}
  - {"op": "add_node", "id": "REQ-029-030", "type": "Rule", "owner_fr": "FR-029", "title": "Require elevated admin permissions", "attrs": {"statement": "System MUST require elevated admin permissions (\"PaymentConfigAdmin\" role) to access payment configuration functionality", "rationale": "Restates Privacy Rule 3 and the Authorization security note."}}
  - {"op": "add_node", "id": "REQ-029-031", "type": "Rule", "owner_fr": "FR-029", "title": "Use TLS 1", "attrs": {"statement": "System MUST use TLS 1.3 for all connections to Payment Configuration API (no plain HTTP allowed)"}}
  - {"op": "add_node", "id": "REQ-029-032", "type": "Rule", "owner_fr": "FR-029", "title": "Comply with PCI DSS Level 1 requirements for payment data handling", "attrs": {"statement": "System MUST comply with PCI DSS Level 1 requirements for payment data handling", "rationale": "Restates the Compliance Rule."}}
  - {"op": "add_node", "id": "REQ-029-033", "type": "Rule", "owner_fr": "FR-029", "title": "Provide RESTful API for Payment Processing Service to query payment configuration", "attrs": {"statement": "System MUST provide RESTful API for Payment Processing Service to query payment configuration (Stripe accounts, currency pair effective rates, deposit rates, effective commission settings, installment rules)"}}
  - {"op": "add_node", "id": "REQ-029-034", "type": "Rule", "owner_fr": "FR-029", "title": "Integrate with external currency conversion rate APIs", "attrs": {"statement": "System MUST integrate with external currency conversion rate APIs (xe.com, fixer.io) via HTTP GET requests, using credentials stored per rate source"}}
  - {"op": "add_node", "id": "REQ-029-035", "type": "Rule", "owner_fr": "FR-029", "title": "Send email notifications to admins for payment configuration changes and rate...", "attrs": {"statement": "System MUST send email notifications to admins for payment configuration changes and rate protection alerts"}}
  - {"op": "add_node", "id": "REQ-029-036", "type": "Rule", "owner_fr": "FR-029", "title": "Propagate payment configuration changes to Payment Processing Service within 5 minutes...", "attrs": {"statement": "System MUST propagate payment configuration changes to Payment Processing Service within 5 minutes maximum (cache TTL)"}}
  - {"op": "add_node", "id": "REQ-029-037", "type": "Rule", "owner_fr": "FR-029", "title": "Validate deposit rate percentage is within allowed range", "attrs": {"statement": "System MUST validate deposit rate percentage is within allowed range (20-30%) and display error if out of range", "rationale": "Restated by Alternative flow B3 and Screen 3."}}
  - {"op": "add_node", "id": "REQ-029-038", "type": "Rule", "owner_fr": "FR-029", "title": "Validate markup percentage is within allowed range", "attrs": {"statement": "System MUST validate markup percentage is within allowed range (0-20%) and display error if out of range"}}
  - {"op": "add_node", "id": "REQ-029-039", "type": "Rule", "owner_fr": "FR-029", "title": "Validate cutoff days is within allowed range", "attrs": {"statement": "System MUST validate cutoff days is within allowed range (30-90 days) and display error if out of range"}}
  - {"op": "add_node", "id": "REQ-029-040", "type": "Rule", "owner_fr": "FR-029", "title": "Prevent deletion of Stripe accounts with transactions in last 90 days", "attrs": {"statement": "System MUST prevent deletion of Stripe accounts with transactions in last 90 days (archive instead)", "rationale": "Restates General Rule 5, the Screen 1 delete rule and the edge case on deletion with recent transactions. The Screen 3 deposit-rate delete rule (provider-specific rate with active bookings) and Rule 5 for split rules are folded into REQ-029-041."}}
  - {"op": "add_node", "id": "REQ-029-041", "type": "Rule", "owner_fr": "FR-029", "title": "Prevent modification of deposit rates or split payment rules for bookings with active...", "attrs": {"statement": "System MUST prevent modification of deposit rates or split payment rules for bookings with active references (changes apply to new bookings only)", "rationale": "Restates Screen 3 and Screen 4 rules on bookings with active references, Rule 5 and the Screen 3 rule on deleting a provider-specific rate with active bookings (archive instead)."}}
  - {"op": "add_node", "id": "REQ-029-042", "type": "Rule", "owner_fr": "FR-029", "title": "Display warning if admin configures aggressive cutoff date that may limit installment...", "attrs": {"statement": "System MUST display warning if admin configures aggressive cutoff date that may limit installment availability", "rationale": "Restated by alternative flow B4 and the Screen 4 warning for cutoff over 60 days."}}
  - {"op": "add_node", "id": "REQ-029-043", "type": "Rule", "owner_fr": "FR-029", "title": "Allow admins to configure both the platform commission global default", "attrs": {"statement": "System MUST allow admins to configure both the platform commission global default (percentage only, allowed range 15-25%) and provider-specific commission scopes (Percentage model 0-100% or Flat Rate model with a fixed amount > 0 per completed procedure) in Screen 5; changes apply to new bookings only and existing bookings retain the commission snapshot captured at booking confirmation"}}
  - {"op": "add_node", "id": "REQ-029-044", "type": "Rule", "owner_fr": "FR-029", "title": "Lock currency conversion rates", "attrs": {"statement": "System MUST lock currency conversion rates (including markup) at FR-005 subquote acceptance, store them in the acceptance snapshot, and copy them to the booking and its transactions (no rate fluctuation after subquote acceptance)", "rationale": "Restates Rule 1(a) and Currency Rule 2. Likely duplicate of REQ-005-017 (FR-005)."}}
  - {"op": "add_node", "id": "REQ-029-045", "type": "Rule", "owner_fr": "FR-029", "title": "Snapshot the effective commission model and value", "attrs": {"statement": "System MUST snapshot the effective commission model and value (and Flat Rate currency), with the source configuration ID and scope type, at booking confirmation and store it per booking/transaction for payout and reconciliation consistency; Flat Rate snapshots are deducted once per completed procedure", "rationale": "Restates the Commission Rule of Payment and Billing Rules."}}
  - {"op": "add_node", "id": "REQ-029-046", "type": "Rule", "owner_fr": "FR-029", "title": "Verify Stripe webhook signatures for all incoming webhook events using the configured...", "attrs": {"statement": "System MUST verify Stripe webhook signatures for all incoming webhook events using the configured webhook secret", "rationale": "Restates Privacy Rule 4."}}
  - {"op": "add_node", "id": "REQ-029-047", "type": "Rule", "owner_fr": "FR-029", "title": "Validate commission values by model", "attrs": {"statement": "System MUST validate commission values by model: global default and provider Percentage within allowed ranges (15-25% global, 0-100% provider) and provider Flat Rate amount greater than 0 with an enabled currency, displaying an error and rejecting the save otherwise (client-side and server-side)"}}
  - {"op": "add_node", "id": "REQ-029-048", "type": "Rule", "owner_fr": "FR-029", "title": "Keep each provider in at most one active provider-specific commission scope with at...", "attrs": {"statement": "System MUST keep each provider in at most one active provider-specific commission scope with at most one pending future-dated configuration (a new one replaces it); an FR-015 Tab 7 edit to a provider in a shared scope MUST split that provider into its own single-provider scope without changing the other providers", "rationale": "Restated by the one-active-scope-per-provider and scheduled configuration rules of Screen 5."}}
  - {"op": "add_node", "id": "REQ-029-049", "type": "Rule", "owner_fr": "FR-029", "title": "Lock payment configuration only at its named lock points", "attrs": {"statement": "System MUST lock payment configuration only at its named lock points: the currency conversion rate at FR-005 subquote acceptance; the commission configuration, deposit rate, and split payment settings at FR-006 booking confirmation; nothing at quote creation or sending", "rationale": "Near duplicate of the lock-points rule (Rule 1) and REQ-029-044."}}
  - {"op": "add_node", "id": "REQ-029-050", "type": "Rule", "owner_fr": "FR-029", "title": "Calculate the Percentage commission, deposit amount, and installment split from the...", "attrs": {"statement": "System MUST calculate the Percentage commission, deposit amount, and installment split from the booking total, defined as the accepted subquote price after promotion, in the quote currency, read from the acceptance snapshot and never recomputed from the live quote"}}
  - {"op": "add_node", "id": "REQ-029-051", "type": "Rule", "owner_fr": "FR-029", "title": "Present any pre-confirmation commission", "attrs": {"statement": "System MUST present any pre-confirmation commission (including the FR-004 quote screen) as an indicative model and value labelled \"indicative, final at booking confirmation\"; only the booking-confirmation snapshot is authoritative", "rationale": "Indicative commission also stated by the Indicative Commission Rule. The FR-004 quote screen is owned by FR-004."}}
  - {"op": "add_node", "id": "REQ-029-052", "type": "Rule", "owner_fr": "FR-029", "title": "Block disabling a currency while any non-terminal sent quote, unpaid accepted booking,...", "attrs": {"statement": "System MUST block disabling a currency while any non-terminal sent quote, unpaid accepted booking, or open booking or instalment plan uses it, and MUST show the admin the count of records still using that currency.", "rationale": "Overlaps the warn-and-resolution-path rule of Screen 6."}}
  - {"op": "add_node", "id": "REQ-029-053", "type": "Rule", "owner_fr": "FR-029", "title": "Create a new FR-026 Quote Configuration version whenever the Default Currency changes", "attrs": {"statement": "System MUST create a new FR-026 Quote Configuration version whenever the Default Currency changes; open quote drafts MUST keep their typed numbers, switch to the new currency without conversion, and require the provider to acknowledge a currency-change banner (FR-004 quote screen) before send."}}
  - {"op": "add_node", "id": "REQ-029-054", "type": "Rule", "owner_fr": "FR-029", "title": "Calculate commission on the price after promotion for every discount type, including...", "attrs": {"statement": "System MUST calculate commission on the price after promotion for every discount type, including discounts funded only by Hairline."}}
  - {"op": "add_node", "id": "REQ-029-055", "type": "Rule", "owner_fr": "FR-029", "title": "Support an optional Stripe account marked as Global Fallback used only when no...", "attrs": {"statement": "System MUST support an optional Stripe account marked as Global Fallback used only when no country/regional grouping mapping exists (at most 1 Global Fallback account)", "rationale": "Restated by Payment Rule 2 and Screen 1 Global Fallback validation."}}
  - {"op": "add_node", "id": "REQ-029-056", "type": "Rule", "owner_fr": "FR-029", "title": "Allow admins to create and manage currency pairs", "attrs": {"statement": "System MUST allow admins to create and manage currency pairs (CRUD), where each pair has USD as the mandatory base currency and a configurable rate mode: auto-fetch (from a configured source) or manual input (admin-entered base rate)."}}
  - {"op": "add_node", "id": "REQ-029-057", "type": "Rule", "owner_fr": "FR-029", "title": "Allow admins to set a global default sync frequency", "attrs": {"statement": "System MUST allow admins to set a global default sync frequency (1h, 3h, 6h, 12h, 24h) and optionally override it per auto-fetch currency pair. If an auto-fetch pair has no per-pair sync frequency, the global default applies. Each pair's sync schedule is calculated from the time it was saved (e.g., saved at 12:36 with 6h interval → next sync at 18:36).", "rationale": "Calculates the next scheduled sync of an auto-fetch pair from the save timestamp plus the configured interval."}}
  - {"op": "add_node", "id": "REQ-029-058", "type": "Rule", "owner_fr": "FR-029", "title": "For any currency not configured as a pair, the system MUST fall back to collecting...", "attrs": {"statement": "For any currency not configured as a pair, the system MUST fall back to collecting payment in USD (no conversion attempted). The admin dashboard MUST display a note informing admins of this fallback behavior.", "rationale": "Restated by Screen 2A rules and Payment Rule 3 context."}}
  - {"op": "add_node", "id": "REQ-029-059", "type": "Rule", "owner_fr": "FR-029", "title": "Keep provider-specific commission models and values synchronized between FR-029 Screen...", "attrs": {"statement": "System MUST keep provider-specific commission models and values synchronized between FR-029 Screen 5 and FR-015 Tab 7 because both screens are valid admin management surfaces for the same provider-specific commission data"}}
  - {"op": "add_node", "id": "REQ-029-060", "type": "Rule", "owner_fr": "FR-029", "title": "Entry points to payment configuration", "attrs": {"statement": "Admin-initiated: Admin accesses \"Payment Configuration\" section from admin dashboard settings menu System-triggered: Payment Processing Service queries payment configuration during every booking transaction API-accessed: External integrations (if authorized) can query currency conversion rates via read-only API Scheduled jobs: Currency conversion rate sync runs on scheduled intervals (e.g., every 6 hours) to update cached rates Alert-triggered: Rate protection system alerts admins when currency fluctuations exceed configured thresholds", "rationale": "Entry points to FR-029 (PRD Entry Points)."}}
  - {"op": "add_node", "id": "REQ-029-061", "type": "Rule", "owner_fr": "FR-029", "title": "Patients and providers cannot configure payments", "attrs": {"statement": "Patients cannot view or modify payment system configuration settings Providers have no direct interaction with payment system configuration"}}
  - {"op": "add_node", "id": "REQ-029-062", "type": "Rule", "owner_fr": "FR-029", "title": "Patient payments collected into the regional Stripe account", "attrs": {"statement": "Patient payments are collected into the Stripe account mapped to the patient’s region; provider payouts are later executed in FR-017 using those funds (provider bank details in FR-032). Providers do not configure Stripe accounts here.", "rationale": "Payout execution is owned by FR-017; provider bank details by FR-032."}}
  - {"op": "add_node", "id": "REQ-029-063", "type": "Rule", "owner_fr": "FR-029", "title": "Communications in scope", "attrs": {"statement": "Email notifications to admins when payment configuration changes are published System alerts when currency conversion rates exceed configured thresholds (rate protection) Admin dashboard notifications for Stripe account connection failures or API errors Audit log notifications for payment configuration changes requiring compliance review"}}
  - {"op": "add_node", "id": "REQ-029-064", "type": "Rule", "owner_fr": "FR-029", "title": "Communications out of scope", "attrs": {"statement": "Patient notifications about payment configuration changes (handled by P-03: Booking & Payment module) Provider notifications about payout schedule changes (handled by separate provider payout module) SMS notifications for payment failures or processing issues (handled by S-03: Notification Service; no SMS is sent in MVP and this channel is reserved for future implementation once S-03 SMS delivery is enabled) In-app chat or support messaging (handled by separate support module)"}}
  - {"op": "add_node", "id": "REQ-029-065", "type": "Rule", "owner_fr": "FR-029", "title": "Email to affected providers on provider-specific deposit change", "attrs": {"statement": "System sends email notification to affected providers (if provider-specific change)"}}
  - {"op": "add_node", "id": "REQ-029-066", "type": "Rule", "owner_fr": "FR-029", "title": "Save confirmation messages", "attrs": {"statement": "System displays confirmation message: \"Deposit rate updated. New bookings will use [X]% deposit rate.\" System displays confirmation message: \"Commission settings updated. New bookings will use the new effective commission configuration.\" System displays confirmation message: \"Split payment options updated. Patients will see [X] installment options.\""}}
  - {"op": "add_node", "id": "REQ-029-067", "type": "Rule", "owner_fr": "FR-029", "title": "Stripe credential failure shows error and highlights fields", "attrs": {"statement": "System displays error message: \"Unable to connect to Stripe. Please verify API keys are correct and your Stripe account is active.\" System highlights fields with credential errors (publishable key, secret key, webhook secret)"}}
  - {"op": "add_node", "id": "REQ-029-068", "type": "Rule", "owner_fr": "FR-029", "title": "Overlapping country assignment needs explicit override", "attrs": {"statement": "Admin must choose \"Override\" to replace existing assignment (no secondary accounts; one account per country/regional grouping)", "rationale": "Edge case (PRD line 1140): if the admin overrides, the most recently configured account serves the overlapping country; the conflict resolution is logged to the audit trail."}}
  - {"op": "add_node", "id": "REQ-029-069", "type": "Rule", "owner_fr": "FR-029", "title": "Country assignment supersedes group assignment", "attrs": {"statement": "Country-level assignment supersedes group-level assignment for any country already in that group (most-specific mapping wins)"}}
  - {"op": "add_node", "id": "REQ-029-070", "type": "Rule", "owner_fr": "FR-029", "title": "Global Fallback has no assignments", "attrs": {"statement": "At most one Stripe account can be marked as Global Fallback; Global Fallback cannot have explicit country/regional grouping assignments", "rationale": "Restated by the Global Fallback field validation (Screen 1). Payment Rule 2 adds that without an assigned account or fallback the payment is blocked (see the unsupported-location rule)."}}
  - {"op": "add_node", "id": "REQ-029-071", "type": "Rule", "owner_fr": "FR-029", "title": "Assigned countries are groups or countries, not both", "attrs": {"statement": "| Assigned Countries | multi-select | Conditional | Countries or regional groupings served by this account (mutually exclusive per record: choose groups or countries, not both) | Required unless Global Fallback is enabled. Each country/grouping can map to only one Stripe account (overrides required to reassign). If a country mapping exists, it overrides any group-level account for that country. |", "rationale": "Taken from the Assigned Countries field description (Screen 1)."}}
  - {"op": "add_node", "id": "REQ-029-072", "type": "Rule", "owner_fr": "FR-029", "title": "Supported currencies compatible with assigned countries", "attrs": {"statement": "Supported currencies must be compatible with assigned countries (e.g., EUR for European countries)"}}
  - {"op": "add_node", "id": "REQ-029-073", "type": "Rule", "owner_fr": "FR-029", "title": "Stripe connection can be tested at any time", "attrs": {"statement": "Admin can test Stripe connection at any time by clicking \"Test Connection\" button Show warning icon if Stripe account hasn't been tested in over 30 days Logs test attempt (admin, timestamp, result) and updates \"Last Tested\" timestamp/status badge"}}
  - {"op": "add_node", "id": "REQ-029-074", "type": "Rule", "owner_fr": "FR-029", "title": "Unsupported location blocks payment and alerts admin", "attrs": {"statement": "If no fallback: System displays error to patient: \"Payment processing not available for your location. Please contact support.\" System sends alert to admin: \"Payment attempted from unsupported country: South Africa. Configure Stripe account for this region.\"", "rationale": "Edge case (PRD line 1134) adds that the payment attempt is logged to the admin dashboard for follow-up. B6 line 378: when the Global Fallback is used, a warning is logged to the admin."}}
  - {"op": "add_node", "id": "REQ-029-075", "type": "Rule", "owner_fr": "FR-029", "title": "Stripe authentication failure after configuration", "attrs": {"statement": "How to manage admin accidentally entering incorrect Stripe secret key that initially validates but later fails during actual payment processing? During configuration, system validates Stripe credentials by making test API call to Stripe. If credentials are syntactically correct but have insufficient permissions or are later revoked by Stripe, first payment attempt will fail. Payment Processing Service logs error: \"Stripe authentication failed for account [name].\" System sends urgent alert to admin: \"Stripe account [name] failed authentication. Verify API keys are active and have required permissions.\" System temporarily routes payments to Global Fallback (if configured) and displays error banner to admin.", "rationale": "PRD line 1142: payments are temporarily routed to the Global Fallback when configured."}}
  - {"op": "add_node", "id": "REQ-029-076", "type": "Rule", "owner_fr": "FR-029", "title": "Stripe API unavailable queues payments", "attrs": {"statement": "Failure handling: If Stripe API unavailable, queue payment transactions for retry with exponential backoff, notify admin of Stripe outage"}}
  - {"op": "add_node", "id": "REQ-029-077", "type": "Rule", "owner_fr": "FR-029", "title": "Stripe key rotation without downtime", "attrs": {"statement": "Secret rotation: Support for Stripe API key rotation without downtime (configure new keys, test, then deactivate old keys)", "rationale": "PRD Implementation Notes: configure new keys, test, then deactivate old keys."}}
  - {"op": "add_node", "id": "REQ-029-078", "type": "Rule", "owner_fr": "FR-029", "title": "Editing a rate source re-runs the connection test", "attrs": {"statement": "Edit Source: Admin can update source name, API key. System re-runs test connection on save."}}
  - {"op": "add_node", "id": "REQ-029-079", "type": "Rule", "owner_fr": "FR-029", "title": "Rate source connection can be tested at any time", "attrs": {"statement": "Test Connection: Available per source at any time. Calls the provider API, updates Status and Last Tested."}}
  - {"op": "add_node", "id": "REQ-029-080", "type": "Rule", "owner_fr": "FR-029", "title": "Rate source credentials encrypted and masked", "attrs": {"statement": "API credentials are encrypted at rest (AES-256) and never logged in plain text (mask all but last 4 characters)", "rationale": "Restates REQ-029-028 and REQ-029-029 for rate source credentials."}}
  - {"op": "add_node", "id": "REQ-029-081", "type": "Rule", "owner_fr": "FR-029", "title": "Rate source health checked during syncs", "attrs": {"statement": "System periodically checks source health during scheduled syncs and updates the Status indicator. If a source becomes unhealthy, all pairs using that source display a visual warning badge (yellow/red) on the pair list.", "rationale": "The Status field of the rate source is calculated by this rule."}}
  - {"op": "add_node", "id": "REQ-029-082", "type": "Rule", "owner_fr": "FR-029", "title": "Rate protection does not stop payments", "attrs": {"statement": "Rate protection alerts do not automatically stop payments; they surface visual cues and send admin notifications", "rationale": "Rate protection is always active for auto-fetch pairs (PRD line 779) and each pair is monitored independently (REQ-029-010)."}}
  - {"op": "add_node", "id": "REQ-029-083", "type": "Rule", "owner_fr": "FR-029", "title": "Pairs use enabled currencies only", "attrs": {"statement": "Currency pairs must reference currencies that are enabled in the Currency Management screen (Screen 6)"}}
  - {"op": "add_node", "id": "REQ-029-084", "type": "Rule", "owner_fr": "FR-029", "title": "One pair per target currency", "attrs": {"statement": "Cannot create a duplicate pair (one pair per target currency; USD/EUR can only exist once)"}}
  - {"op": "add_node", "id": "REQ-029-085", "type": "Rule", "owner_fr": "FR-029", "title": "Pairs always use USD as base", "attrs": {"statement": "All pairs MUST use USD as the base currency. Admin selects only the target currency when adding a pair."}}
  - {"op": "add_node", "id": "REQ-029-086", "type": "Rule", "owner_fr": "FR-029", "title": "Pair deletion warns and falls back to USD", "attrs": {"statement": "Delete Pair: Remove a currency pair. System warns: \"Deleting this pair means payments involving {Target} currency will fall back to USD. Continue?\" Requires confirmation.", "rationale": "Deleted or unconfigured target currencies collect payment in USD (REQ-029-011b)."}}
  - {"op": "add_node", "id": "REQ-029-087", "type": "Rule", "owner_fr": "FR-029", "title": "Pair status badge definitions", "attrs": {"statement": "Status badges update automatically: green when last fetch succeeded and rate change is within threshold; yellow when rate protection threshold was breached in last 7 days or source is degraded; red when last fetch failed or source is down.", "rationale": "Status of a pair is calculated by this rule. See the product owner decision on badge reset."}}
  - {"op": "add_node", "id": "REQ-029-088", "type": "Rule", "owner_fr": "FR-029", "title": "Each pair tracks its own status", "attrs": {"statement": "Each pair independently tracks its own status. A source failure affects only pairs using that source; manual pairs are unaffected."}}
  - {"op": "add_node", "id": "REQ-029-089", "type": "Rule", "owner_fr": "FR-029", "title": "Sync Now fetches a rate immediately", "attrs": {"statement": "Sync Now (per pair): For auto-fetched pairs, triggers an immediate rate fetch outside the scheduled sync"}}
  - {"op": "add_node", "id": "REQ-029-090", "type": "Rule", "owner_fr": "FR-029", "title": "Pair switches to manual when its source is deleted", "attrs": {"statement": "If the source assigned to this pair is later deleted, the pair gracefully switches to manual mode with the last fetched rate pre-filled as the manual base rate. Admin is notified of this change.", "rationale": "Conflicts with the delete-blocked reading (see the product owner decision on rate source deletion)."}}
  - {"op": "add_node", "id": "REQ-029-091", "type": "Rule", "owner_fr": "FR-029", "title": "Deleting a referenced rate source is blocked", "attrs": {"statement": "Deleting a source that is referenced by existing pairs is blocked; admin must reassign or convert affected pairs to manual mode first. This is the graceful deletion pattern.", "rationale": "Also stated by the Delete Source action (Screen 2A) which requires reassigning or switching the pairs to manual before deletion."}}
  - {"op": "add_node", "id": "REQ-029-092", "type": "Rule", "owner_fr": "FR-029", "title": "Manual mode pairs have no sync schedule", "attrs": {"statement": "Admin enters the base rate directly in the Manual Base Rate field No sync schedule is created; rate only changes when admin manually edits and saves"}}
  - {"op": "add_node", "id": "REQ-029-093", "type": "Rule", "owner_fr": "FR-029", "title": "Switching a pair between auto-fetch and manual", "attrs": {"statement": "Auto → Manual: System pre-fills Manual Base Rate with the last fetched rate so admin doesn't start from zero. Sync schedule is removed. Manual → Auto: System requires admin to select a source and run \"Test Connection & Fetch Rate\" before saving. The fetched rate replaces the manual rate."}}
  - {"op": "add_node", "id": "REQ-029-094", "type": "Rule", "owner_fr": "FR-029", "title": "Effective rate preview updates live", "attrs": {"statement": "The Effective Rate preview updates in real-time as admin changes Base Rate or Markup %, giving immediate visibility into the patient-facing rate."}}
  - {"op": "add_node", "id": "REQ-029-095", "type": "Rule", "owner_fr": "FR-029", "title": "Failed sync retries with backoff and alerts", "attrs": {"statement": "System retries sync after exponential backoff (e.g., retry in 15 minutes, then 30 minutes, then 1 hour)", "rationale": "Part of the failed-sync alternative flow (B2). The source status also turns red when the source stays down."}}
  - {"op": "add_node", "id": "REQ-029-096", "type": "Rule", "owner_fr": "FR-029", "title": "Rate protection breach handling", "attrs": {"statement": "System detects the USD/EUR rate changed by 4.5% in the last 24 hours (exceeds the 3% global threshold) Admin decides to increase the per-pair markup from 5% to 7% to protect against the unfavorable rate", "rationale": "Breach alternative flow (B5): yellow status, urgent alert, admin reviews and adjusts the per-pair markup."}}
  - {"op": "add_node", "id": "REQ-029-097", "type": "Rule", "owner_fr": "FR-029", "title": "One rate alert per pair per six hours", "attrs": {"statement": "How does system handle rapid currency fluctuation exceeding rate protection threshold multiple times in single day for one pair (e.g., USD/EUR changes 3% at 8am, another 3% at 2pm, another 3% at 8pm)? System sends first alert at 8am when the pair's initial 3% threshold is crossed and marks the pair's status as yellow/warning on the pair list. System applies rate-limiting to alerts (maximum one alert per currency pair per 6 hours) to prevent alert fatigue. System accumulates rate changes and sends second alert at 2pm showing cumulative change: \"USD/EUR increased 6% in 6 hours.\" The pair's yellow/warning status persists on Screen 2A until the admin reviews and acknowledges. Admin receives summary of all rate changes across all pairs in daily digest email."}}
  - {"op": "add_node", "id": "REQ-029-098", "type": "Rule", "owner_fr": "FR-029", "title": "Daily digest of source outages", "attrs": {"statement": "How does system handle a rate source being completely unavailable for 24+ hours? For each auto-fetch pair using the affected source: system continues using the pair's last successfully cached rate, marks the pair's status as red/error on the pair list (Screen 2A), and marks the source's status as red in the Sources section. System sends daily email digest to admin summarizing the source outage and listing all affected pairs. When the source recovers, the next scheduled sync for each affected pair fetches the latest rate and restores green status. Admin can also switch affected pairs to a different source or manual mode at any time during the outage."}}
  - {"op": "add_node", "id": "REQ-029-099", "type": "Rule", "owner_fr": "FR-029", "title": "Rate history of 30 days", "attrs": {"statement": "When editing an existing pair, show a \"Rate History\" link/section displaying rate changes over the last 30 days (chart + table)"}}
  - {"op": "add_node", "id": "REQ-029-100", "type": "Rule", "owner_fr": "FR-029", "title": "Booking total definition", "attrs": {"statement": "Booking Total Rule: Throughout this FR, \"booking total\" means the accepted subquote price after any promotion, in the quote currency, read from the FR-005 acceptance snapshot. The same rule applies to every discount type, including discounts funded only by Hairline: commission is always calculated on the price after promotion. It is never recomputed from the live quote, option, or date-range price. This single figure is the base for the Percentage commission, the deposit amount, and the installment split; any display or charge in another currency uses the rate locked under Currency Rule 2.", "rationale": "Same rule applies to every discount type, including discounts funded only by Hairline (see REQ-029-054)."}}
  - {"op": "add_node", "id": "REQ-029-101", "type": "Rule", "owner_fr": "FR-029", "title": "Configuration locks only at named lock points", "attrs": {"statement": "Rule 1: Payment configuration changes never alter a value that has already been locked. Each configuration is locked at a named point: (a) the currency conversion rate (including markup) is locked when the patient accepts a subquote in FR-005 and is stored in the acceptance snapshot; (b) the effective commission configuration, the deposit rate, and the split payment (installment) settings are locked at FR-006 booking confirmation and stored with the booking; (c) no payment configuration is frozen when a parent quote or subquote is created or sent in FR-004. Before its lock point, a quote or accepted-but-unconfirmed subquote follows the configuration that is effective at that moment, and an active installment plan keeps the settings locked at its booking confirmation. When FR-019 expresses a fixed-amount promotion in the quote currency at quote send, it uses the currency conversion rate (including markup) in effect at send; this sets the promotion amount on the quote only and does not lock the conversion rate for payment, which stays locked at acceptance under (a).", "rationale": "Restated by REQ-029-049 (near duplicate). The lock point for the commission is booking confirmation in FR-006."}}
  - {"op": "add_node", "id": "REQ-029-102", "type": "Rule", "owner_fr": "FR-029", "title": "Use last known good configuration when unavailable", "attrs": {"statement": "Rule 4: System must gracefully handle payment processing when configuration data is unavailable (use last known good configuration)"}}
  - {"op": "add_node", "id": "REQ-029-103", "type": "Rule", "owner_fr": "FR-029", "title": "Markup applies to all conversions", "attrs": {"statement": "Payment Rule 3: Currency conversion markup applies to all transactions involving currency conversion (protects against bank rate differences)"}}
  - {"op": "add_node", "id": "REQ-029-104", "type": "Rule", "owner_fr": "FR-029", "title": "Prices shown in the patient's selected currency", "attrs": {"statement": "Currency Rule 1: Prices always displayed to patients in their selected currency using admin-configured conversion rates with markup", "rationale": "Display in the selected currency uses the admin-configured conversion rates with markup."}}
  - {"op": "add_node", "id": "REQ-029-105", "type": "Rule", "owner_fr": "FR-029", "title": "Missed installment reminder then cancellation", "attrs": {"statement": "Payment Rule 6: If patient misses installment payment deadline, system sends reminder notification during grace period, then cancels booking if not paid"}}
  - {"op": "add_node", "id": "REQ-029-106", "type": "Rule", "owner_fr": "FR-029", "title": "Insufficient time for chosen installments", "attrs": {"statement": "What happens when patient books procedure 35 days before procedure date with 30-day cutoff enabled, and selects 3 installments? System calculates time between booking date (35 days before) and cutoff date (30 days before) = 5 days available for installments. System determines 3 installments not feasible (would require payments every 1.67 days). System displays error: \"Insufficient time for 3 installments. Please select 2 installments or pay in full.\" Patient must select fewer installments or pay deposit + remaining balance immediately.", "rationale": "PRD line 1136: the patient must select fewer installments or pay deposit plus the remaining balance immediately."}}
  - {"op": "add_node", "id": "REQ-029-107", "type": "Rule", "owner_fr": "FR-029", "title": "Tiered installment plans by booking amount", "attrs": {"statement": "Admin creates multiple split payment rule tiers based on booking amount ranges", "rationale": "Alternative flow A4. Conflicts with the single global split configuration of Screen 4 (see the product owner decision on tiered installments). The graph models the single configuration."}}
  - {"op": "add_node", "id": "REQ-029-108", "type": "Rule", "owner_fr": "FR-029", "title": "Minimum 30-day cutoff", "attrs": {"statement": "System enforces a minimum 30-day cutoff before procedure date (per system booking/payment rules); admins may increase the cutoff up to 90 days"}}
  - {"op": "add_node", "id": "REQ-029-109", "type": "Rule", "owner_fr": "FR-029", "title": "Fewer installments offered when time is short", "attrs": {"statement": "If time between booking and procedure is insufficient for selected installments given cutoff, system offers fewer installments"}}
  - {"op": "add_node", "id": "REQ-029-110", "type": "Rule", "owner_fr": "FR-029", "title": "Deposit refunds follow provider cancellation policies", "attrs": {"statement": "Refund Rule: Deposit refunds follow provider-specific cancellation policies (separate from payment configuration)", "rationale": "Refund handling sits outside payment configuration."}}
  - {"op": "add_node", "id": "REQ-029-111", "type": "Rule", "owner_fr": "FR-029", "title": "Payout buffer window", "attrs": {"statement": "Payout Rule 1: Payout buffer window determines when payout statements are auto-generated before a scheduled payout date. The buffer window is a global setting (default: 3 days, range: 1–7 days). FR-017 / A-05 reads this value to schedule statement creation for provider and affiliate payouts.", "rationale": "Consumed by FR-017 (A-05) to schedule statement creation."}}
  - {"op": "add_node", "id": "REQ-029-112", "type": "Rule", "owner_fr": "FR-029", "title": "Values fixed in code", "attrs": {"statement": "Deposit rate allowed range (20-30% hard-coded business rule) Split payment installment range (2-9 installments hard-coded limit) Cutoff days allowed range (30-90 days hard-coded limits) Installment frequency (monthly; 30-day intervals) Payment audit logging requirements (always enabled, cannot be disabled)", "rationale": "Fixed values, not admin-editable (PRD Admin Editability Rules)."}}
  - {"op": "add_node", "id": "REQ-029-113", "type": "Rule", "owner_fr": "FR-029", "title": "Provider commission scope takes precedence", "attrs": {"statement": "Provider-specific commission scopes take precedence over the global default at booking confirmation"}}
  - {"op": "add_node", "id": "REQ-029-114", "type": "Rule", "owner_fr": "FR-029", "title": "Commission scope covers one or more providers and can be archived", "attrs": {"statement": "A provider-specific commission scope may cover one or multiple providers and may be archived when no longer needed"}}
  - {"op": "add_node", "id": "REQ-029-115", "type": "Rule", "owner_fr": "FR-029", "title": "Single-provider commission edit from FR-015 splits the scope", "attrs": {"statement": "Single-provider edit from FR-015: When an admin edits commission in FR-015 Tab 7 for a provider covered by a scope shared with other providers, the system removes that provider from the shared scope and creates a single-provider scope for it with the new values; the shared scope and its other providers are unchanged. The split is audit-logged with before/after state."}}
  - {"op": "add_node", "id": "REQ-029-116", "type": "Rule", "owner_fr": "FR-029", "title": "One pending future-dated commission configuration per provider", "attrs": {"statement": "Scheduled configuration: Each provider has at most one pending future-dated configuration. Saving another future-dated configuration for the same provider replaces the pending one (logged); on its Effective Date the pending configuration becomes the active one automatically. Screen 5 and FR-015 Tab 7 show the same pending configuration, which FR-032 Screen 4 displays read-only to the provider.", "rationale": "Same statement as REQ-029-048 second half (near duplicate)."}}
  - {"op": "add_node", "id": "REQ-029-117", "type": "Rule", "owner_fr": "FR-029", "title": "Provider eligibility for a commission scope", "attrs": {"statement": "System validates selected providers have status Active or Suspended (Deactivated providers cannot be selected; their existing scopes are read-only) and the commission value matches the selected model: Percentage 0-100% (0.1% precision); Flat Rate amount > 0 in an enabled currency"}}
  - {"op": "add_node", "id": "REQ-029-118", "type": "Rule", "owner_fr": "FR-029", "title": "Percentage commission formula", "attrs": {"statement": "Percentage model (global default or provider scope): commission amount = booking total (the accepted subquote price after promotion, in the quote currency, from the acceptance snapshot) × snapshotted commission percentage (rounded to 2 decimal places; last payment absorbs rounding difference if needed)", "rationale": "Part of the commission calculation; see REQ-029-050 for the booking total."}}
  - {"op": "add_node", "id": "REQ-029-119", "type": "Rule", "owner_fr": "FR-029", "title": "Flat Rate commission formula", "attrs": {"statement": "Flat Rate model (provider scope only): commission amount = the snapshotted fixed amount, deducted once per completed procedure (FR-010 completion milestone), regardless of procedure price; it is not charged per package, per Subquote, or per installment"}}
  - {"op": "add_node", "id": "REQ-029-120", "type": "Rule", "owner_fr": "FR-029", "title": "Flat Rate amount kept in its configured currency", "attrs": {"statement": "Flat Rate amounts are stored and snapshotted in their configured currency; this screen introduces no new currency conversion rule, and any conversion follows the existing FR-029 currency configuration and downstream FR-017 reconciliation handling"}}
  - {"op": "add_node", "id": "REQ-029-121", "type": "Rule", "owner_fr": "FR-029", "title": "Global commission is percentage only", "attrs": {"statement": "The global default is percentage-only; the Flat Rate model is available for provider-specific scopes only", "rationale": "Restated by REQ-029-043."}}
  - {"op": "add_node", "id": "REQ-029-122", "type": "Rule", "owner_fr": "FR-029", "title": "Currency codes are immutable", "attrs": {"statement": "Currency codes are immutable and come from a system-maintained catalog; admins cannot add non-ISO or custom codes."}}
  - {"op": "add_node", "id": "REQ-029-123", "type": "Rule", "owner_fr": "FR-029", "title": "One default currency and at least one enabled", "attrs": {"statement": "At least one currency must remain enabled at all times. Exactly one enabled currency must be set as the system default."}}
  - {"op": "add_node", "id": "REQ-029-124", "type": "Rule", "owner_fr": "FR-029", "title": "Disabling a referenced currency warns with a resolution path", "attrs": {"statement": "If an admin attempts to disable a currency currently referenced by system configuration (e.g., used in Stripe account supported currencies, location starting prices, or active pricing configs), the system MUST warn and provide a safe resolution path (e.g., update dependent configs first) before allowing the disable.", "rationale": "Overlaps REQ-029-052 (blocked while in use). See the product owner decision on warn versus block."}}
  - {"op": "add_node", "id": "REQ-029-125", "type": "Rule", "owner_fr": "FR-029", "title": "Currency enable and disable affects new choices only", "attrs": {"statement": "Enabling/disabling currencies affects new configuration choices immediately; existing records retain their stored currency codes."}}
  - {"op": "add_node", "id": "REQ-029-126", "type": "Rule", "owner_fr": "FR-029", "title": "Currency management is the source of truth for dropdowns", "attrs": {"statement": "This screen is the source of truth for currency dropdowns across Admin/Provider/Patient experiences (where applicable). FR-017 Screen 1 (\"Financial Reporting - Revenue Dashboard\") initializes its reporting currency selector from this system default currency; the MVP seed value is USD unless an admin changes it later."}}
  - {"op": "add_node", "id": "REQ-029-127", "type": "Rule", "owner_fr": "FR-029", "title": "Optimistic locking on configuration edits", "attrs": {"statement": "Concurrency: Payment configuration updates must use optimistic locking to prevent race conditions when multiple admins edit simultaneously"}}
  - {"op": "add_node", "id": "REQ-029-128", "type": "Rule", "owner_fr": "FR-029", "title": "Email service failure handling", "attrs": {"statement": "Failure handling: If email service unavailable, log notification failures and display in-app notification to admin, retry with queue"}}
  - {"op": "add_node", "id": "REQ-029-129", "type": "Rule", "owner_fr": "FR-029", "title": "Aggressive cutoff shows a warning", "attrs": {"statement": "What occurs if admin configures cutoff date (e.g., 60 days) that prevents any installment options from being offered for most bookings? System displays warning during configuration: \"Current cutoff date [60 days] may prevent installment options for most bookings. Only bookings made 75+ days in advance will see installments.\" Admin can choose to proceed with restrictive cutoff or adjust to more reasonable value (e.g., 30 days). System logs warning to admin activity log.", "rationale": "Overlaps REQ-029-042. The admin may proceed and a warning is logged to the admin activity log."}}
