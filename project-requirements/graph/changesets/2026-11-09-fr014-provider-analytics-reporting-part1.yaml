  - {"op": "add_field", "id": "ENT-analytics-metrics-aggregate.inquiry_stage_inquiry_count", "entity_id": "ENT-analytics-metrics-aggregate", "name": "inquiry_stage_inquiry_count", "data_type": "int", "title": "Inquiry-stage inquiry count", "owner_fr": "FR-014", "calculated_by": "REQ-014-135"}
  - {"op": "add_field", "id": "ENT-analytics-metrics-aggregate.inquiry_stage_quoted_count", "entity_id": "ENT-analytics-metrics-aggregate", "name": "inquiry_stage_quoted_count", "data_type": "int", "title": "Inquiry-stage quoted count", "owner_fr": "FR-014", "calculated_by": "REQ-014-135"}
  - {"op": "add_field", "id": "ENT-analytics-metrics-aggregate.inquiry_stage_accepted_count", "entity_id": "ENT-analytics-metrics-aggregate", "name": "inquiry_stage_accepted_count", "data_type": "int", "title": "Inquiry-stage accepted count", "owner_fr": "FR-014", "calculated_by": "REQ-014-135"}
  - {"op": "add_field", "id": "ENT-analytics-metrics-aggregate.inquiry_stage_confirmed_count", "entity_id": "ENT-analytics-metrics-aggregate", "name": "inquiry_stage_confirmed_count", "data_type": "int", "title": "Inquiry-stage confirmed count", "owner_fr": "FR-014", "calculated_by": "REQ-014-135"}
  - {"op": "add_field", "id": "ENT-analytics-metrics-aggregate.treatment_start_count", "entity_id": "ENT-analytics-metrics-aggregate", "name": "treatment_start_count", "data_type": "int", "title": "Treatment start count", "owner_fr": "FR-014"}
  - {"op": "add_field", "id": "ENT-analytics-metrics-aggregate.submitted_parent_count", "entity_id": "ENT-analytics-metrics-aggregate", "name": "submitted_parent_count", "data_type": "int", "title": "Distinct submitted parent count", "owner_fr": "FR-014", "calculated_by": "REQ-014-130"}
  - {"op": "add_field", "id": "ENT-analytics-metrics-aggregate.accepted_parent_count", "entity_id": "ENT-analytics-metrics-aggregate", "name": "accepted_parent_count", "data_type": "int", "title": "Distinct accepted parent count", "owner_fr": "FR-014", "calculated_by": "REQ-014-132"}
  - {"op": "add_field", "id": "ENT-analytics-metrics-aggregate.quote_option_count", "entity_id": "ENT-analytics-metrics-aggregate", "name": "quote_option_count", "data_type": "int", "title": "Quote Option count", "owner_fr": "FR-014"}
