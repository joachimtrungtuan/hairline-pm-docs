  - {"op": "add_node", "id": "ENT-analytics-metrics-aggregate", "type": "Entity", "owner_fr": "FR-014", "title": "Analytics metrics aggregate", "attrs": {"description": "Entity 1 — Analytics Metrics Aggregate (provider-level, daily/cohort): `provider_id`, cohort start/end and timestamp basis, reporting cutoff/data-as-of, distinct inquiry-stage counts (inquiry, quoted, accepted, confirmed), separately labelled treatment-start count, distinct submitted/accepted parent counts, separately labelled Quote Option/Subquote counts, distribution-cohort assigned/responded inquiry counts, TTFQ observations/p50/p90, accepted-price sample count, effective SLA, income/commission totals, and reporting currency. Inquiry-stage counts MUST NOT be populated with quote/option counts; retain the source observations or equivalent mergeable data needed for longer-range distinct counts and percentiles rather than summing daily percentiles."}}
  - {"op": "add_node", "id": "ENT-booking-intensity-record", "type": "Entity", "owner_fr": "FR-014", "title": "Booking intensity record", "attrs": {"description": "Entity 2 — Booking Intensity Record (provider-level, daily): `provider_id`, `date`, `bookings_on_day`, `monthly_daily_avg`, `intensity_index`, `baseline_type`. `bookings_on_day` and `monthly_daily_avg` count only FR-006 Bookings in `Confirmed` or `In Progress` status by appointment date; `Accepted` (held), `Payment Window Expired` and `Cancelled` bookings are excluded."}}
  - {"op": "add_node", "id": "ENT-accepted-selection-aging-snapshot", "type": "Entity", "owner_fr": "FR-014", "title": "Accepted selection aging snapshot", "attrs": {"description": "Entity 3 — Accepted Selection Aging Snapshot (provider-level, refreshed every 15 min): Booking/AcceptanceEvent/inquiry/provider IDs, accepted parent/subquote IDs and equal aggregate versions, Quote Option/Option-Date-Price IDs, immutable acceptedAt, actual hold deadline, booking/payment/hold eligibility, age hours/bucket, snapshot time, treatment/country, accepted total price/original currency/locked FX, and reporting amount/currency/FX provenance. One row per active pending booking; deadline/status checks prevent a stale Accepted quote from remaining in cash risk after hold expiry."}}
  - {"op": "add_node", "id": "ENT-platform-analytics-aggregate", "type": "Entity", "owner_fr": "FR-014", "title": "Platform analytics aggregate", "attrs": {"description": "Entity 4 — Platform Analytics Aggregate (platform-level, daily/cohort): reporting period/basis/cutoff, distinct platform inquiry-stage counts, separate submitted/accepted parent counts, accepted-price sample counts, active providers, pooled inquiry/provider TTFQ observations/p50/p90, Confirmed-booking conversion rate, deduplicated GMV/commission, new patients, and reporting/FX provenance. Provider funnel totals and percentile values are not directly additive platform aggregates."}}
  - {"op": "add_node", "id": "ENT-provider-engagement-snapshot", "type": "Entity", "owner_fr": "FR-014", "title": "Provider engagement snapshot", "attrs": {"description": "Entity 5 — Provider Engagement Snapshot (provider-level, daily): `provider_id`, `last_active_at` (sourced from `MAX(provider_activity_logs.action_at)` per provider), `last_login_at` (sourced from `MAX(provider_activity_logs.action_at WHERE action_type = 'login')` per provider), distinct parent first submissions in 30 days, distinct assigned/responded inquiry counts for the 30-day distribution cohort, response rate or unavailable reason, reporting cutoff, and engagement status."}}
  - {"op": "add_node", "id": "ENT-benchmark-segment", "type": "Entity", "owner_fr": "FR-014", "title": "Benchmark segment", "attrs": {"description": "Entity 6 — Benchmark Segment (platform-level, weekly): `segment_id`, `segment_type`, eligible provider count per metric, metric medians, units/cohort/cutoff/sample basis, historical reporting-currency/FX basis, and calculation time. Accepted-price benchmarks require actual accepted-price samples; unaccepted parents are not zero values."}}
  - {"op": "add_node", "id": "ENT-export-report-config", "type": "Entity", "owner_fr": "FR-014", "title": "Export report configuration", "attrs": {"description": "Entity 8 — Export Report Configuration: `config_id`, `provider_id`, `report_type`, `screens_included` (array), `date_range_type` (`custom` for one-off exports; `previous_full_period` for recurring), `custom_start`/`custom_end` (one-off only), `recurring`, `frequency`, `timezone`, `status` (active/paused), `email_recipients` (registered email plus up to 5 team member IDs), `next_run_at`, `last_run_status`, `last_generated_at`"}}
  - {"op": "add_node", "id": "ENT-analytics-generated-report", "type": "Entity", "owner_fr": "FR-014", "title": "Analytics generated report", "attrs": {"description": "Generated export report (Screen 6 Report History Tab 1). Generated reports additionally retain the metric definitions/cohorts, reporting cutoff/data-as-of, sample sizes, currency/FX provenance, and authorized accepted-selection IDs/versions for detailed rows. Configuration and scheduling do not change screen metric semantics."}}
  - {"op": "add_node", "id": "ENT-currency-exchange-rate", "type": "Entity", "owner_fr": "FR-014", "title": "Currency exchange rate", "attrs": {"description": "Entity 9 — Currency Exchange Rate: `date`, `base_currency`, `target_currency`, `exchange_rate`, `fetched_at`"}}
  - {"op": "add_node", "id": "ENT-accepted-price-observation", "type": "Entity", "owner_fr": "FR-014", "title": "Accepted price observation", "attrs": {"description": "Entity 10 — Accepted Price Observation (one per accepted parent): AcceptanceEvent/inquiry/provider IDs, accepted parent/subquote IDs and equal versions, Quote Option/Option-Date-Price IDs, treatment/package snapshot provenance, first-submitted parent time, acceptedAt, immutable accepted total price/promotion/original currency/locked FX, reporting amount/currency/historical FX provenance, and later lifecycle outcome. Cohorts use the documented timestamp; later outcomes do not rewrite the accepted observation."}}
  # --- Rules (part 1): PRD REQ ids kept verbatim; prose rules numbered from REQ-014-118
  - {"op": "add_node", "id": "REQ-014-105", "type": "Rule", "owner_fr": "FR-014", "title": "Each submitted parent quote counted once", "attrs": {"statement": "System MUST count each submitted Parent Quote once and keep Quote Option/Subquote volumes distinct; drafts, versions, edits, and resends MUST NOT inflate response volume.", "rationale": "PRD line 1766 (Functional Requirements Summary, REQ-014-105)."}}
  - {"op": "add_node", "id": "REQ-014-106", "type": "Rule", "owner_fr": "FR-014", "title": "Accepted amounts resolve to the immutable AcceptanceEvent", "attrs": {"statement": "System MUST resolve every accepted amount and selection drill-down to the immutable FR-005 AcceptanceEvent and exact accepted parent/subquote aggregate version, with equal parent and subquote versions.", "rationale": "PRD line 1767 (Functional Requirements Summary, REQ-014-106)."}}
  - {"op": "add_node", "id": "REQ-014-107", "type": "Rule", "owner_fr": "FR-014", "title": "Rates from distinct-record cohorts; N/A for zero denominators", "attrs": {"statement": "System MUST calculate parent acceptance, inquiry response, and inquiry funnel rates from their specified distinct-record cohorts and cutoff, returning N/A for zero denominators and an unavailable response metric for missing distribution provenance.", "rationale": "PRD line 1768 (Functional Requirements Summary, REQ-014-107)."}}
  - {"op": "add_node", "id": "REQ-014-108", "type": "Rule", "owner_fr": "FR-014", "title": "Unaccepted parents excluded from amounts, kept in volumes", "attrs": {"statement": "System MUST exclude unaccepted parents from amount observations without excluding them from submitted-parent volume or acceptance-rate denominators; accepted historical prices MUST NOT be overwritten by library changes, cancellation, hold expiry, or later financial adjustments.", "rationale": "PRD line 1769 (Functional Requirements Summary, REQ-014-108)."}}
  - {"op": "add_node", "id": "REQ-014-109", "type": "Rule", "owner_fr": "FR-014", "title": "Accepted, Confirmed, In Progress and Payment Window Expired kept distinct", "attrs": {"statement": "System MUST distinguish Accepted, payment-confirmed Booking, procedure In Progress, and Payment Window Expired; active cash risk MUST validate the actual hold deadline and exclude cancelled, expired, and superseded selections.", "rationale": "PRD line 1770 (Functional Requirements Summary, REQ-014-109)."}}
  - {"op": "add_node", "id": "REQ-014-110", "type": "Rule", "owner_fr": "FR-014", "title": "Financial records aggregated at their owning grain", "attrs": {"statement": "System MUST aggregate financial records at their owning grain before quote-hierarchy joins, preventing duplicate payments, refunds, deductions, or payouts from repeated events or multiple alternatives.", "rationale": "PRD line 1771 (Functional Requirements Summary, REQ-014-110). Restated by Screen 4 Business Rules (line 599) and Data Contract row (line 1600)."}}
  - {"op": "add_node", "id": "REQ-014-111", "type": "Rule", "owner_fr": "FR-014", "title": "Accepted price and FX provenance preserved; no invented history", "attrs": {"statement": "System MUST preserve accepted price/currency/locked-rate provenance and historical reporting-conversion provenance; missing canonical history MUST NOT be filled with an invented alternative price or today's package/FX value.", "rationale": "PRD line 1772 (Functional Requirements Summary, REQ-014-111)."}}
  - {"op": "add_node", "id": "REQ-014-112", "type": "Rule", "owner_fr": "FR-014", "title": "Same contracts across screens, benchmarks, drill-downs, caches and exports", "attrs": {"statement": "System MUST apply the same revised contracts to provider/admin screens, benchmarks, drill-downs, cached aggregates, PDF/CSV, and scheduled exports without expanding existing permissions or redesigning the locked cockpit.", "rationale": "PRD line 1773 (Functional Requirements Summary, REQ-014-112)."}}
  - {"op": "add_node", "id": "REQ-014-113", "type": "Rule", "owner_fr": "FR-014", "title": "TTFQ SLA-breach alert once per inquiry/provider pair", "attrs": {"statement": "System MUST send the in-app TTFQ SLA-breach alert (`inquiry.ttfq_sla_breached`) once per distributed inquiry/provider pair when no parent quote is submitted within the FR-026 SLA target, suppressed for cancelled or withdrawn distributions and never repeated for the same pair", "rationale": "PRD line 1774 (Functional Requirements Summary, REQ-014-113)."}}
  - {"op": "add_node", "id": "REQ-014-115", "type": "Rule", "owner_fr": "FR-014", "title": "WCAG 2.1 AA on all analytics screens", "attrs": {"statement": "All provider and admin analytics screens MUST meet WCAG 2.1 Level AA per Accessibility Rules 15C–15E: no colour-only status signals, AA contrast for text and chart marks, and a text or table alternative for every chart", "rationale": "PRD line 1781 (Functional Requirements Summary, REQ-014-115)."}}
  - {"op": "add_node", "id": "REQ-014-116", "type": "Rule", "owner_fr": "FR-014", "title": "Booking load and country booking figures count Confirmed or In Progress only", "attrs": {"statement": "System MUST count booking load and country booking figures (Screen 1 B3 and B4, Screen 3 Widget 1, Screen 10 Widget 1) from FR-006 Bookings in `Confirmed` or `In Progress` status only, label them \"Confirmed bookings\", and never count held (`Accepted`), `Payment Window Expired` or `Cancelled` bookings or show a separate held figure.", "rationale": "PRD line 1775 (Functional Requirements Summary, REQ-014-116)."}}
  - {"op": "add_node", "id": "REQ-014-117", "type": "Rule", "owner_fr": "FR-014", "title": "Admin-authored replacement quotes excluded from provider quote metrics", "attrs": {"statement": "System MUST exclude admin-authored replacement quotes (`authorType = admin`) and their replacement acceptances and bookings from provider quote counts, parent-quote acceptance rates, inquiry response rates, booking conversion, the inquiry funnel, and TTFQ on every provider and admin screen and export, and MUST report them to admins only as a separate count of provider-fault replacements per provider at fault (Screen 8 Widget 1).", "rationale": "PRD line 1776 (Functional Requirements Summary, REQ-014-117). Restated by Screen 8 Business Rules (line 936: replacement quotes appear only in the Provider-fault replacements column, attributed to the provider at fault)."}}
  - {"op": "add_node", "id": "REQ-014-118", "type": "Rule", "owner_fr": "FR-014", "title": "Counting boundary is the parent quote; grains not interchanged", "attrs": {"statement": "The counting boundary is the FR-004 Parent Quote, not its packages or date-price alternatives. Each provider may submit multiple parent quotes per inquiry; each parent contains Quote Options, and each option/date-price combination resolves to an FR-005 Subquote. Acceptance records the exact bottom-level choice in an immutable AcceptanceEvent. Inquiry funnels, parent-quote acceptance rates, accepted-price analytics, and confirmed-booking metrics therefore have distinct grains and MUST NOT be interchanged. See Analytics Counting & Time Basis for the shared definitions used by every screen and export.", "rationale": "PRD line 23. Executive Summary rule promoted (D13: summary prose itself is not migrated)."}}
  - {"op": "add_node", "id": "REQ-014-119", "type": "Rule", "owner_fr": "FR-014", "title": "No direct patient-facing analytics features", "attrs": {"statement": "No direct patient-facing features. Patient behaviour data (inquiry timing, booking patterns, location) feeds the analytics pipeline.", "rationale": "PRD line 31."}}
  - {"op": "add_node", "id": "REQ-014-120", "type": "Rule", "owner_fr": "FR-014", "title": "Provider 6-screen suite; Screen 1 is the landing page", "attrs": {"statement": "6-screen suite (5 screens in the \"Analytics\" nav + Screen 1 as the platform landing page, not accessed via the Analytics nav section).", "rationale": "PRD line 32. Screen list restated by Provider Platform Scope (lines 38-43)."}}
  - {"op": "add_node", "id": "REQ-014-121", "type": "Rule", "owner_fr": "FR-014", "title": "Admin 7-screen suite from the admin Analytics nav", "attrs": {"statement": "7-screen analytics suite accessible from the admin \"Analytics\" nav section.", "rationale": "PRD line 33. Screen list restated by Admin Platform Scope (lines 47-53)."}}
  - {"op": "add_node", "id": "REQ-014-122", "type": "Rule", "owner_fr": "FR-014", "title": "TTFQ SLA-breach alert recipients, channel and suppression", "attrs": {"statement": "In-app TTFQ SLA-breach alert (`inquiry.ttfq_sla_breached`, FR-020/FR-030 catalog): sent once per distributed inquiry/provider pair when that provider has not submitted a parent quote within the FR-026 SLA target from the inquiry's distribution to the provider. Recipients: provider users permitted to respond to inquiries (FR-009). Default channel: in-app notification dropdown; email/push are off by default and admin-configurable in FR-030. No alert is sent if the inquiry is cancelled, the distribution is withdrawn, or the provider responds before the SLA elapses; it is never repeated for the same pair. The alert does not change TTFQ metrics.", "rationale": "PRD line 60. Communication Structure in-scope item; REQ-014-113 states the summary. Clock shared with the TTFQ formula (line 158) and FR-003 distributed_at (REQ-003-118)."}}
  - {"op": "add_node", "id": "REQ-014-123", "type": "Rule", "owner_fr": "FR-014", "title": "Channel attribution out of scope", "attrs": {"statement": "Channel attribution (organic, paid ads, social media) — not tracked in database", "rationale": "PRD line 64. Restated by Screen 9 Note (line 946) and Assumption 7 (line 1614)."}}
  - {"op": "add_node", "id": "REQ-014-124", "type": "Rule", "owner_fr": "FR-014", "title": "Clinical outcome data out of scope", "attrs": {"statement": "Clinical outcome data (graft survival, hair density results) — not tracked in database", "rationale": "PRD line 65. Screen-level form is REQ-014-090."}}
  - {"op": "add_node", "id": "REQ-014-125", "type": "Rule", "owner_fr": "FR-014", "title": "Real-time collaborative dashboard viewing out of scope", "attrs": {"statement": "Real-time collaborative dashboard viewing (future enhancement)", "rationale": "PRD line 66. Listed as a future enhancement."}}
  - {"op": "add_node", "id": "REQ-014-126", "type": "Rule", "owner_fr": "FR-014", "title": "Entry points to provider and admin analytics and export", "attrs": {"statement": "\"Analytics\" nav item → defaults to Screen 2 (Performance); Screen 1 (Main Dashboard) is the platform landing page, not the analytics section entry; \"Analytics\" nav item → defaults to Screen 7 (Platform Overview); \"Export Report\" button available on all provider analytics screens", "rationale": "PRD lines 70, 71, 72. Main Flows (lines 78-103) walk Screens 2 to 6 and 7 to 13; admin step 8 (line 103) links flagged providers to FR-015 provider management."}}
  - {"op": "add_node", "id": "REQ-014-127", "type": "Rule", "owner_fr": "FR-014", "title": "Export from any screen pre-populates Screen 6", "attrs": {"statement": "A2 — Export from any screen: Provider clicks \"Export\" button → reaches Screen 6 pre-populated with the current screen's section selected.", "rationale": "PRD line 109. Alternative Flow A2."}}
  - {"op": "add_node", "id": "REQ-014-128", "type": "Rule", "owner_fr": "FR-014", "title": "Pipeline delay shows banner with cached data and timestamp", "attrs": {"statement": "B1 — Analytics pipeline delay: Non-blocking banner shown; cached data displayed with last-updated timestamp.", "rationale": "PRD line 111. Alternative Flow B1; staleness threshold in Data Quality Rule 6."}}
  - {"op": "add_node", "id": "REQ-014-129", "type": "Rule", "owner_fr": "FR-014", "title": "Counting definitions apply to all widgets, drill-downs, aggregates, benchmarks and exports", "attrs": {"statement": "These definitions apply to all provider/admin widgets, drill-downs, aggregates, benchmarks, and exports. A chart's \"Quoted\" inquiry stage is not the same unit as a submitted-parent volume metric.", "rationale": "PRD line 1424. Analytics Counting & Time Basis preamble."}}
  - {"op": "add_node", "id": "REQ-014-130", "type": "Rule", "owner_fr": "FR-014", "title": "Parent response grain", "attrs": {"statement": "Count a stable FR-004 Parent Quote ID once on its first successful submission. Multiple parent quotes from one provider are separate responses; drafts, edits, resends, aggregate versions, Quote Options, and Option/Date-Price Records are not extra responses. Child-volume or comparison telemetry, when reported, MUST be separately labelled as Quote Option or Subquote counts and never substituted into parent metrics.", "rationale": "PRD line 1426."}}
  - {"op": "add_node", "id": "REQ-014-131", "type": "Rule", "owner_fr": "FR-014", "title": "Admin-authored replacement quotes are not provider responses", "attrs": {"statement": "A quote that an admin authors for a replacement provider during an FR-006 provider-fault transfer (FR-004 Workflow 7, `authorType = admin`) is not a provider response. It is excluded from every provider quote count (parent response volume, inquiry response rate, parent-quote acceptance rate), from booking conversion and the inquiry funnel for the replacement provider, and from TTFQ, together with its replacement acceptance and booking. Admin views report these quotes only as a separate count of provider-fault replacements.", "rationale": "PRD line 1427."}}
  - {"op": "add_node", "id": "REQ-014-132", "type": "Rule", "owner_fr": "FR-014", "title": "Acceptance grain is the immutable AcceptanceEvent", "attrs": {"statement": "FR-005's immutable AcceptanceEvent identifies the selected Subquote, its Quote Option and Option/Date-Price Record, inherited parent context, and accepted aggregate revision. Deduplicate redelivery of the same acceptance and count each accepted parent once. `acceptedSubquoteVersion = acceptedParentQuoteVersion`; neither a changed package preset nor an unselected alternative may replace the accepted snapshot. Historical acceptance measures patient selection and is retained after cancellation or payment-window expiry; it is not proof of a confirmed booking or captured revenue.", "rationale": "PRD line 1428."}}
  - {"op": "add_node", "id": "REQ-014-133", "type": "Rule", "owner_fr": "FR-014", "title": "Parent-quote acceptance rate cohort and formula", "attrs": {"statement": "Numerator = distinct parents in the selected first-submission cohort with an AcceptanceEvent by the reporting cutoff. Denominator = all distinct submitted parents in that same cohort, including unaccepted, expired, withdrawn, or later-cancelled parents. Use the parent's `first_sent_at` (set by FR-004 on first send; never changed by a re-send) to assign each parent to its cohort; do not divide acceptance events occurring in one period by unrelated submissions in another. This is a parent-level rate, not accepted subquotes divided by available subquotes.", "rationale": "PRD line 1429."}}
  - {"op": "add_node", "id": "REQ-014-134", "type": "Rule", "owner_fr": "FR-014", "title": "Inquiry response rate cohort and formula", "attrs": {"statement": "Denominator = distinct `(providerId, inquiryId)` distribution records first assigned to that provider within the selected distribution period. Numerator = those same pairs with at least one submitted parent response by the cutoff. Retries of distribution and multiple parent responses do not multiply either side. Missing authoritative distribution data yields an unavailable metric, not a proxy based on platform inquiries or quote volume.", "rationale": "PRD line 1430."}}
  - {"op": "add_node", "id": "REQ-014-135", "type": "Rule", "owner_fr": "FR-014", "title": "Inquiry funnel and booking conversion cohort", "attrs": {"statement": "Use inquiry `created_at` to select the inquiry cohort. Provider views count distinct `(providerId, inquiryId)` pairs assigned to that provider; platform views count distinct Inquiry IDs across providers, not the sum of provider totals. Quoted means at least one parent was submitted; Accepted means an AcceptanceEvent exists for that inquiry and, in provider views, that provider; Confirmed booking means FR-006 recorded successful deposit or first installment confirmation. Each inquiry contributes at most once to each reached stage and cumulatively to preceding stages. Inquiries have no treatment (the provider chooses it in the parent quote), so treatment segments start at Quoted and use the parent/accepted booking's treatment; unquoted inquiries count only in all-treatments views. Deduplicate within each segment. Later cancellation does not erase a reached milestone; cancellation and no-show metrics remain separate. `In Progress` is a procedure-start milestone, never a synonym for payment confirmation.", "rationale": "PRD line 1431."}}
  - {"op": "add_node", "id": "REQ-014-136", "type": "Rule", "owner_fr": "FR-014", "title": "Reporting cutoff and empty denominators", "attrs": {"statement": "Historical funnel/acceptance/response cohorts are evaluated through the earlier of the selected period end and the pipeline's data-as-of time. Current cohorts show that cutoff and indicate that outcomes may still be pending. A zero denominator is N/A, not 0% or 100%. Tooltips/exports state the unit, cohort timestamp, numerator/denominator, cutoff, and relevant sample sizes; rates based on these distinct-record sets cannot exceed 100%.", "rationale": "PRD line 1432."}}
  - {"op": "add_node", "id": "REQ-014-137", "type": "Rule", "owner_fr": "FR-014", "title": "First response and journey cohorts", "attrs": {"statement": "TTFQ uses the same inquiry-created cohort and reporting cutoff as the funnel, which differs on purpose from the distribution-period cohort of the inquiry response rate; screens that show both (such as Screen 8) and exports MUST state each metric's cohort basis in the tooltip and export definition. TTFQ contributes one observation per inquiry/provider pair whose first parent response occurred by that cutoff, from the inquiry's distribution to that provider (`inquiry_providers.distributed_at`) to the `first_sent_at` of the provider's earliest parent quote for the inquiry; a re-send or new version never changes it. Pairs without an authoritative distribution timestamp have no TTFQ observation. Unanswered inquiries remain in funnel/response denominators but have no completed TTFQ observation. Provider distributions pool those observations; platform p50/p90 pool the underlying observations, not provider percentile averages. Journey time instead uses the successful initial payment that first confirms a booking, selects the confirmation-time cohort, and counts the inquiry once. Later installments or failed payment attempts do not create new journey observations.", "rationale": "PRD line 1433."}}
  - {"op": "add_node", "id": "REQ-014-138", "type": "Rule", "owner_fr": "FR-014", "title": "Accepted-price grain", "attrs": {"statement": "Count one immutable accepted total price per accepted parent, including the accepted package/date-price and promotion. Standalone price metrics use `AcceptanceEvent.acceptedAt` to select their cohort; Screen 5's scatter uses its expressly stated parent first-submission cohort. Unaccepted parents have a price range, not one amount, and remain excluded from all amount observations while included in parent volume/rate metrics. Cancellation, hold expiry, package-library edits, quote revisions, or later financial adjustments do not rewrite the historical acceptance-price observation. Show accepted selection counts and distinguish these statistics from captured revenue.", "rationale": "PRD line 1434."}}
  - {"op": "add_node", "id": "REQ-014-139", "type": "Rule", "owner_fr": "FR-014", "title": "Active cash risk eligibility", "attrs": {"statement": "At the displayed snapshot time, include only Accepted FR-006 pending bookings with a non-superseded AcceptanceEvent, valid exclusive slot hold, and no successful initial payment. Scope the time filter by acceptance time, calculate age from immutable `acceptedAt`, and validate the actual configured hold deadline. Remove cancelled, expired-hold, and `Payment Window Expired` selections even before stale quote status caches update; do not restart age on payment retries. Sum each eligible accepted total price once as potential accepted booking value, not deposit receivables, captured revenue, or outstanding installment balances.", "rationale": "PRD line 1435."}}
  - {"op": "add_node", "id": "REQ-014-140", "type": "Rule", "owner_fr": "FR-014", "title": "Financial record grain", "attrs": {"statement": "Payments, refunds, commission deductions, installments, and payouts retain their existing owning-record accounting rules. Aggregate those records before attaching read-only AcceptanceEvent/Booking/quote provenance; joining several packages or date options MUST NOT multiply financial totals. This change does not redefine fund release, fees, payout routing, or travel responsibility.", "rationale": "PRD line 1436. Restated by Screen 4 Business Rules (line 599) and Screen 12 Business Rules (line 1319)."}}
  - {"op": "add_node", "id": "REQ-014-141", "type": "Rule", "owner_fr": "FR-014", "title": "Refund source of truth", "attrs": {"statement": "Refunds are counted only from refund rows (`payments.payment_type = 'refund'` with `payment_status = 'completed'`); refund amount, refund count, and Net GMV use these rows alone. An original payment whose `payment_status` later becomes `refunded` stays in gross income/GMV and captured payment counts (`payment_type ≠ 'refund'` and `payment_status IN ('completed', 'refunded')`) and is never counted as a second refund. This prevents a refund from being removed from gross figures and subtracted again.", "rationale": "PRD line 1437. Restated by Screen 4 Business Rules (line 595: Income excludes refund rows; refunds reported in Widget 5)."}}
  - {"op": "add_node", "id": "REQ-014-142", "type": "Rule", "owner_fr": "FR-014", "title": "Shared benchmark rule", "attrs": {"statement": "All provider benchmark comparisons (Screen 2 Widget 7 and Screen 5 Widget 4) use one peer pool: active providers with ≥30 inquiries in the same rolling 12-month window, minimum 5 eligible providers per metric (price metrics additionally require accepted-price observations). Provider identities stay anonymised (Rule 13). Colour is direction-aware: for higher-is-better metrics (conversion, parent-quote acceptance, ratings) Green = at or better than median, Amber = up to 10% worse, Red = more than 10% worse; for TTFQ p50 lower is better, so worse means above median. Average accepted price is neutral: variance and percentile are shown without colour. Benchmarks refresh at the FR-026 benchmark refresh frequency.", "rationale": "PRD line 1438. Restated by Screen 5 Business Rules (line 666: provider identity fully anonymised in benchmark calculations)."}}
  - {"op": "add_node", "id": "REQ-014-143", "type": "Rule", "owner_fr": "FR-014", "title": "Default time range Last 4 weeks, all countries", "attrs": {"statement": "Default time range on page load = Last 4 weeks, all countries", "rationale": "PRD line 1442. Rule 1. Restated by Screen 1 header filter default (line 138) and Screen 7 Business Rules (line 842)."}}
  - {"op": "add_node", "id": "REQ-014-144", "type": "Rule", "owner_fr": "FR-014", "title": "Each screen keeps its own filter state", "attrs": {"statement": "Each screen maintains its own filter state (changing filters on Screen 2 does not affect Screen 3)", "rationale": "PRD line 1443. Rule 2."}}
  - {"op": "add_node", "id": "REQ-014-145", "type": "Rule", "owner_fr": "FR-014", "title": "Chart click opens pre-filtered operational list in a new context", "attrs": {"statement": "Clicking a chart element opens the corresponding pre-filtered operational list in a new context (does not navigate away from the analytics screen). Exception: on Screen 1, a single click applies the cross-filter, and the same drill-down opens from the element's explicit \"View list\" action", "rationale": "PRD line 1444. Rule 3. Restated by Alternative Flow A1 (line 107)."}}
  - {"op": "add_node", "id": "REQ-014-146", "type": "Rule", "owner_fr": "FR-014", "title": "Skeleton loading states; no full-page spinners", "attrs": {"statement": "All screens use skeleton loading states; no full-page blocking spinners", "rationale": "PRD line 1445. Rule 4. Restated by Screen 1 States (line 252)."}}
  - {"op": "add_node", "id": "REQ-014-147", "type": "Rule", "owner_fr": "FR-014", "title": "Localize dates, currencies and timezones to the user's locale", "attrs": {"statement": "Localize all dates, currencies, and timezones to the user's configured locale (provider locale for provider screens; admin platform locale for admin screens)", "rationale": "PRD line 1446. Rule 5."}}
  - {"op": "add_node", "id": "REQ-014-148", "type": "Rule", "owner_fr": "FR-014", "title": "Filter applicability by source dimension", "attrs": {"statement": "A filter applies only to widgets whose source records carry that dimension. Inquiries carry no treatment (the provider chooses it in the FR-004 Parent Quote), so the Treatment filter applies from Quoted onward: quoted inquiries, parent quotes, acceptances, bookings, accepted prices, payments and refunds attributed through the accepted parent (Screen 4 Widget 2 attribution), reviews, and aftercare. Funnel and conversion widgets with a treatment selected follow the Screen 2 rule: the Inquiries stage shows \"— (inquiries have no treatment)\" and conversion is measured from Quoted. Widgets built on inquiries, patient registrations, provider counts, or payout statements are not filtered by a dimension their records lack; they keep rendering unfiltered data with a visible note such as \"Not filtered by treatment\". This covers: Screen 4: Widget 8 payout history is filtered by neither treatment nor patient country, because payout statements are per provider period (likewise Screen 1 C4 for the country filter); Screen 9: Widgets 1 (inquiry volume), 3 (new vs. returning), and 5 (seasonality) are not treatment-filtered; Widget 2 measures from Quoted; Widgets 4 (journey time) and 6 (affiliate bookings) filter by the accepted parent's treatment; Screen 10: Widgets 1 (demand map), 2 (provider coverage), 3 (demand vs. supply gap), and 5 (emerging origins) are not treatment-filtered; Widget 4 measures conversion from Quoted", "rationale": "PRD lines 1447, 1448, 1449, 1450. Rule 5A with its per-screen sub-bullets."}}
  - {"op": "add_node", "id": "REQ-014-149", "type": "Rule", "owner_fr": "FR-014", "title": "Pipeline every 15 minutes; stale banner over 20 minutes", "attrs": {"statement": "Analytics pipeline updates every 15 minutes; non-blocking banner shown when data is >20 minutes stale", "rationale": "PRD line 1454. Rule 6. Restated by Implementation Notes (line 1626: 15-minute aggregation cycle)."}}
  - {"op": "add_node", "id": "REQ-014-150", "type": "Rule", "owner_fr": "FR-014", "title": "Low sample threshold under 30 inquiries", "attrs": {"statement": "Low sample threshold = <30 inquiries for provider screens; helper copy shown but data still rendered", "rationale": "PRD line 1455. Rule 7. Restated by Alternative Flow B2 (line 113), Screen 1 States (line 251) and Screen 2 Business Rules (line 363)."}}
  - {"op": "add_node", "id": "REQ-014-151", "type": "Rule", "owner_fr": "FR-014", "title": "Below per-widget minimum show Not enough data yet", "attrs": {"statement": "Minimum sample requirements per widget are specified in each screen spec; below minimum, widgets show \"Not enough data yet\" with the threshold stated", "rationale": "PRD line 1456. Rule 8."}}
  - {"op": "add_node", "id": "REQ-014-152", "type": "Rule", "owner_fr": "FR-014", "title": "Benchmark pool minimum 5 providers with explanatory message", "attrs": {"statement": "Benchmark pools require minimum 5 providers; if pool is insufficient, benchmark widgets show an explanatory message rather than blank state", "rationale": "PRD line 1457. Rule 9; overlaps REQ-014-040."}}
  - {"op": "add_node", "id": "REQ-014-153", "type": "Rule", "owner_fr": "FR-014", "title": "Daily FX rates, locked at transaction date, 48-hour fallback cap", "attrs": {"statement": "All currency amounts converted using daily FX rates cached from the currency conversion API; rates locked at the transaction date for historical data. On API failure, fall back to the previous day's cached rate up to a maximum of 48 hours; beyond 48 hours, affected widgets show \"FX data unavailable\" instead of rendering with stale rates; Accepted-price observations preserve the FR-005 acceptance snapshot's original currency, total price, locked exchange rate, and acceptance time. If a different reporting currency needs an additional conversion, use a historical acceptance-date reporting rate and retain its provenance; do not replace the commercial locked rate with today's rate. Payment/payout records retain their own existing historical financial FX basis. Missing historical provenance yields an unavailable affected amount metric, not an inferred currency, current package price, or current FX value.", "rationale": "PRD lines 1458, 1459. Rule 10 with its accepted-price sub-bullet. Restated by Assumption 9 (line 1616) and External dependency Currency Conversion API (line 1585)."}}
  - {"op": "add_node", "id": "REQ-014-154", "type": "Rule", "owner_fr": "FR-014", "title": "Patient identity masked in provider-facing analytics", "attrs": {"statement": "Patient identity is masked in all provider-facing analytics: where a patient row is shown, display the patient ID plus a partially masked name in the FR-003 format (for example HP102589-0001 · \"Aylin K****\"); full names and contact details are never shown", "rationale": "PRD line 1463. Rule 11. Restated by Screen 1 States (line 254: patient names masked throughout)."}}
  - {"op": "add_node", "id": "REQ-014-155", "type": "Rule", "owner_fr": "FR-014", "title": "Patient identities never exposed to affiliates", "attrs": {"statement": "Patient identities are never exposed to affiliates (aggregates only)", "rationale": "PRD line 1464. Rule 12."}}
  - {"op": "add_node", "id": "REQ-014-156", "type": "Rule", "owner_fr": "FR-014", "title": "Provider identities anonymised in benchmarks and platform-wide charts", "attrs": {"statement": "Provider identities are anonymised in benchmark comparisons and platform-wide charts (providers cannot identify individual competitors)", "rationale": "PRD line 1465. Rule 13."}}
  - {"op": "add_node", "id": "REQ-014-157", "type": "Rule", "owner_fr": "FR-014", "title": "Admin sees individual provider identities", "attrs": {"statement": "Admin can see individual provider identities in admin screens for operational support", "rationale": "PRD line 1466. Rule 14. Restated by Screen 8 Business Rules (line 932)."}}
  - {"op": "add_node", "id": "REQ-014-158", "type": "Rule", "owner_fr": "FR-014", "title": "All analytics access logged to the audit log", "attrs": {"statement": "All analytics access logged with user ID, timestamp, screen accessed, and active filters to the S-06 Audit Log Service as an immutable, tamper-proof audit trail retained for 10 years (constitution §II, Data Retention & Deletion)", "rationale": "PRD line 1467. Rule 15. Restated by Implementation Notes (line 1628: access is logged per Rule 15)."}}
  - {"op": "add_node", "id": "REQ-014-159", "type": "Rule", "owner_fr": "FR-014", "title": "FR-014 uses the existing role and permission model", "attrs": {"statement": "FR-014 consumes the existing role and permission model; it does not define new roles or expand access beyond the owning platform's permission system.", "rationale": "PRD line 1471. Rule 15A."}}
  - {"op": "add_node", "id": "REQ-014-160", "type": "Rule", "owner_fr": "FR-014", "title": "Widgets without data-domain permission are not rendered or requested", "attrs": {"statement": "If a user lacks permission to view a widget's underlying data domain, the UI MUST not render that widget for that user, and the corresponding widget data MUST not be requested. Remaining widgets reflow within the existing responsive layout.", "rationale": "PRD line 1472. Rule 15B."}}
  - {"op": "add_node", "id": "REQ-014-161", "type": "Rule", "owner_fr": "FR-014", "title": "Default provider-role access matrix", "attrs": {"statement": "Default provider-role access to the provider analytics screens, using the FR-009 roles. The matrix states the default data-domain grants only; actual visibility is always resolved through Rules 15A and 15B, so a role whose permissions are changed sees whatever its granted data domains allow. Screens or sections a role cannot see are hidden from navigation, not shown as locked. Screen 1 Main Dashboard — Sections A and B (inbox and performance): Owner: Full; Manager: Full; Billing Staff: Hidden; Clinical Staff: Hidden; Custom Provider Role: Per granted operational domain; Screen 1 Main Dashboard — Section C (financials): Owner: Full; Manager: Only with financial permission; Billing Staff: Full; Clinical Staff: Hidden; Custom Provider Role: Per granted financial domain; Screen 2 Performance & Conversion: Owner: Full; Manager: Full; Billing Staff: Hidden; Clinical Staff: Hidden; Custom Provider Role: Per granted operational domain; Screen 3 Patient Analytics: Owner: Full; Manager: Full; Billing Staff: Hidden; Clinical Staff: Satisfaction and aftercare widgets only; Custom Provider Role: Per granted patient or review domain; Screen 4 Finance & Payouts: Owner: Full; Manager: Only with financial permission; Billing Staff: Full; Clinical Staff: Hidden; Custom Provider Role: Per granted financial domain; Screen 5 Pricing & Benchmarks: Owner: Full; Manager: Full; Billing Staff: Full; Clinical Staff: Hidden; Custom Provider Role: Per granted pricing domain; Screen 6 Export Report Configuration: Owner: Full; Manager: Exports limited to the screens and widgets the user can see; Billing Staff: Exports limited to the screens and widgets the user can see; Clinical Staff: Exports limited to the screens and widgets the user can see (Screen 3 exports contain only the satisfaction and aftercare widgets); Custom Provider Role: Exports limited to the screens and widgets the user can see", "rationale": "PRD lines 1473, 1475-1483. Rule 15F with its matrix (lines 1475-1483). FR-009 roles per dependency line 1566."}}
  - {"op": "add_node", "id": "REQ-014-162", "type": "Rule", "owner_fr": "FR-014", "title": "Colour is never the only signal", "attrs": {"statement": "Colour is never the only signal. Every Green/Amber/Red tier, benchmark variance, health badge, aging bucket, heatmap cell, and gap/outlier flag MUST also carry a text label or icon (for example ✓ On target, ▲ Watch, ✕ Off target, or the tier name), and chart series MUST be distinguishable by label, pattern, or marker shape as well as colour.", "rationale": "PRD line 1490. Rule 15C."}}
  - {"op": "add_node", "id": "REQ-014-163", "type": "Rule", "owner_fr": "FR-014", "title": "WCAG 2.1 AA contrast", "attrs": {"statement": "Text, data labels, and status badges MUST meet WCAG 2.1 AA contrast (4.5:1 for normal text, 3:1 for large text and for chart marks and UI components against their background) in the platform default palette.", "rationale": "PRD line 1491. Rule 15D."}}
  - {"op": "add_node", "id": "REQ-014-164", "type": "Rule", "owner_fr": "FR-014", "title": "Every chart has a text alternative", "attrs": {"statement": "Every chart MUST have a text alternative: an accessible name and summary, plus keyboard-reachable tooltips/drill-downs, or a data-table view of the same values. Heatmaps and maps fall back to their ranked-table equivalents for screen readers.", "rationale": "PRD line 1492. Rule 15E."}}
  - {"op": "add_node", "id": "REQ-014-165", "type": "Rule", "owner_fr": "FR-014", "title": "Admin-editable analytics values and recalculation rule", "attrs": {"statement": "Values are owned by the FR-026 Analytics Configuration Manager (Screen 5e); FR-014 reads the active version at calculation time. Recalculation rule: live dashboards and benchmarks always use the configuration version active when they are calculated, including for past periods shown on screen. After a change, the next calculation recolours and re-buckets every period in view (for example, last month's TTFQ tiers after an SLA change); past periods are not frozen at older values. Each aggregate records the configuration version used. PDF/CSV exports and scheduled-export files already generated are never rewritten; they keep the values and version from their generation time. Editable by Admin: SLA target (minutes, default 120) — platform-wide value used across all TTFQ color coding and benchmark charts; per-provider SLA overrides are out of scope for this version; Benchmark refresh frequency (default Weekly); Provider engagement status thresholds (Active/At Risk/Dormant day boundaries; defaults At Risk 7 days, Dormant 30 days); Outlier detection threshold for Screen 13 (default 30%); Target monthly commission reference line on Screen 12 Widget 2 (optional; unset by default, and the line is hidden until set)", "rationale": "PRD lines 1498, 1500, 1501, 1502, 1503, 1504. Admin Editability Rules. Assumption 4 (line 1611) restates the single platform-wide SLA in minutes; FR-026 dependency (line 1574)."}}
  - {"op": "add_node", "id": "REQ-014-166", "type": "Rule", "owner_fr": "FR-014", "title": "Values fixed in codebase", "attrs": {"statement": "Fixed in Codebase: Dashboard section order (Screen 1: A → B → C); TTFQ formula and funnel stage definitions; Booking Intensity Index formula; Commission calculation logic: `IF provider_commissions.type = 'percentage' THEN payment.amount × (effective_rate / 100) ELSE effective_flat_amount once per completed procedure` — percentage applies per completed payment, flat rate applies once per FR-010 completed procedure (FR-015); the conditional is fixed; the type and rate/amount values come from each booking's confirmation-time commission snapshot (`snapshot_commission_percentage` / `snapshot_commission_amount`, FR-015 REQ-015-022, FR-029), never from the provider's current commission configuration", "rationale": "PRD lines 1508, 1509, 1510, 1511. Admin Editability Rules, Fixed in Codebase."}}
  - {"op": "add_node", "id": "REQ-014-167", "type": "Rule", "owner_fr": "FR-014", "title": "Screens load within 3 seconds at p95", "attrs": {"statement": "All screens load within 3 seconds for 95th percentile (pre-aggregated metrics)", "rationale": "PRD line 1515. Rule 16."}}
  - {"op": "add_node", "id": "REQ-014-168", "type": "Rule", "owner_fr": "FR-014", "title": "Chart rendering within 1 second for ranges up to 12 weeks", "attrs": {"statement": "Chart rendering completes within 1 second for ranges ≤12 weeks", "rationale": "PRD line 1516. Rule 17."}}
  - {"op": "add_node", "id": "REQ-014-169", "type": "Rule", "owner_fr": "FR-014", "title": "Export generation PDF under 60 s, CSV under 30 s", "attrs": {"statement": "Export generation: PDF <60 seconds, CSV <30 seconds", "rationale": "PRD line 1517. Rule 18. Restated by Screen 6 Business Rules (line 696: report generation under 60 seconds; async queue for large datasets) and Implementation Notes (line 1629: asynchronous job queue)."}}
  - {"op": "add_node", "id": "REQ-014-170", "type": "Rule", "owner_fr": "FR-014", "title": "1,000 concurrent provider analytics sessions", "attrs": {"statement": "System supports 1,000 concurrent provider analytics sessions without degradation", "rationale": "PRD line 1518. Rule 19."}}
  - {"op": "add_node", "id": "REQ-014-171", "type": "Rule", "owner_fr": "FR-014", "title": "Reporting currency resolution never overwrites quote or accepted currency", "attrs": {"statement": "Provider display currency is derived from `banking_details.currency` via provider default-currency resolution; if absent, the current implementation falls back to USD; This is reporting-currency resolution only; it MUST NOT overwrite FR-004 system-configured quote currency or the immutable FR-005 accepted currency/locked rate. Reconcile any legacy fallback against the accepted snapshot before presenting historical amount metrics.", "rationale": "PRD lines 1579, 1580. Provider Banking Details dependency and its sub-bullet."}}
  - {"op": "add_node", "id": "REQ-014-172", "type": "Rule", "owner_fr": "FR-014", "title": "Last active from provider_activity_logs; last_login_at field must not be used", "attrs": {"statement": "Engagement views rely on `provider_activity_logs.action_at` as the canonical activity timestamp source (documented in system-data-schema.md). Last active = `MAX(action_at)` per provider. The previously referenced `provider_users.last_login_at` field does not exist in the schema and must not be used.", "rationale": "PRD line 1581. Provider Team / Auth Data dependency; restated by Screen 8 Business Rules (line 933)."}}
  - {"op": "add_node", "id": "REQ-014-173", "type": "Rule", "owner_fr": "FR-014", "title": "Analytics data contract canonical boundaries", "attrs": {"statement": "Parent Quote first-submission `first_sent_at`: Where used: Response volume, TTFQ, acceptance-rate cohorts, provider ramp; Canonical boundary / legacy constraint: One immutable first send per stable parent identity, set by FR-004 on first send and never changed by a re-send or new version; legacy `quotes.sent_at` is never used as a fallback for these metrics; AcceptanceEvent acceptedAt + accepted snapshot: Where used: Acceptance milestones, accepted prices, aging origin; Canonical boundary / legacy constraint: FR-005 event is authoritative; legacy `quotes.accepted_at` alone cannot identify the chosen package/date price or establish an active hold; Parent/subquote IDs and accepted aggregate versions; Quote Option/Option-Date-Price IDs: Where used: Drill-downs, accepted-price observations, detailed exports; Canonical boundary / legacy constraint: Resolve the exact accepted version and inherited context; require equal parent/subquote aggregate versions; Booking linkage, confirmation event, hold deadline, and lifecycle: Where used: Confirmed funnels, patient journey, pending-payment aging; Canonical boundary / legacy constraint: FR-006 distinguishes Accepted, Confirmed, In Progress, Payment Window Expired, and Cancelled; flat quote status is insufficient; Original accepted total price/currency and locked FX provenance: Where used: Accepted-price aggregates, comparisons, exports; Canonical boundary / legacy constraint: Preserve immutable acceptance value; any additional historical reporting conversion follows Rule 10; Owning payment/refund/commission/payout records: Where used: Financial aggregates; Canonical boundary / legacy constraint: Deduplicate before quote-hierarchy joins; selected price is not a substitute for captured transaction amounts", "rationale": "PRD lines 1593-1600. Analytics Data Contract and Legacy Compatibility table."}}
  - {"op": "add_node", "id": "REQ-014-174", "type": "Rule", "owner_fr": "FR-014", "title": "Do not backfill accepted amounts; show unavailable instead", "attrs": {"statement": "Do not backfill an accepted amount by choosing a current alternative or consulting today's package library. If historical accepted-selection or cohort provenance cannot be recovered faithfully, show unavailable data for the affected metric and record the gap for implementation reconciliation. System-wide schema/spec updates and implementation migration are outside this FR-014 documentation change.", "rationale": "PRD line 1602. Analytics Data Contract closing paragraph."}}
  - {"op": "add_node", "id": "REQ-014-175", "type": "Rule", "owner_fr": "FR-014", "title": "Admin analytics responsive across desktop, tablet and mobile", "attrs": {"statement": "Admin analytics must remain responsive across desktop, tablet, and mobile viewports in accordance with the platform constitution; lower-width layouts may reduce density but must preserve the core workflows", "rationale": "PRD line 1609. Assumption 2 (a layout rule). Restated by Screen 7 Layout (line 748)."}}
  - {"op": "add_node", "id": "REQ-014-176", "type": "Rule", "owner_fr": "FR-014", "title": "Provider analytics desktop-first, single-column at or below 1024px", "attrs": {"statement": "Provider analytics screens are desktop-first (≥1024px), responsive single-column on ≤1024px", "rationale": "PRD line 1610. Assumption 3 (a layout rule). Restated by Screen 1 Layout (line 130)."}}
  - {"op": "add_node", "id": "REQ-014-177", "type": "Rule", "owner_fr": "FR-014", "title": "Payout cadence sourced from provider commission configuration", "attrs": {"statement": "Payout cadence (weekly/bi-weekly/monthly) is currently sourced from provider commission configuration (`provider_commissions.payment_cycle`), not from the provider profile record itself", "rationale": "PRD line 1612. Assumption 5 (a data-source rule). FR-015 dependency (line 1570) names provider_commissions.payment_cycle."}}
  - {"op": "add_node", "id": "REQ-014-178", "type": "Rule", "owner_fr": "FR-014", "title": "Legacy location fallback rows flagged in country widgets", "attrs": {"statement": "Country widgets (Screens 3, 10) flag rows resolved via legacy `patients.location` fallback with a subtle UI indicator (tooltip or badge) until the `patients.location_id` backfill is complete, so users can distinguish canonical vs. transitional data.", "rationale": "PRD line 1617. Assumption 10 (a display rule)."}}
  - {"op": "add_node", "id": "REQ-014-179", "type": "Rule", "owner_fr": "FR-014", "title": "Caches never hold data across provider tenants", "attrs": {"statement": "Aggregate reads are cached per provider and filter combination and invalidated when the next aggregation cycle completes or the FR-026 configuration version changes. Benchmark peer statistics are cached for the configured benchmark refresh frequency. Caches never hold data across provider tenants.", "rationale": "PRD line 1627. Implementation Notes, Caching; the tenant-isolation sentence is a business rule."}}
  - {"op": "add_node", "id": "REQ-014-180", "type": "Rule", "owner_fr": "FR-014", "title": "Every analytics request scoped server-side to tenant and permitted domains", "attrs": {"statement": "Every analytics request is scoped server-side to the caller's provider tenant and permitted data domains (Rules 15A, 15B and 15F); the client never filters restricted data. Access is logged per Rule 15. Export artifacts are stored in S-05 with secure links that expire after 48 hours, and benchmark outputs only expose anonymised peer statistics above the minimum peer count.", "rationale": "PRD line 1628. Implementation Notes, Security and audit logging; restates Rules 15, 15A, 15B, 15F, the 48-hour secure link and the benchmark minimum."}}
  # --- Fields (part 1); calculated fields follow the Rule that computes them
  - {"op": "add_field", "id": "ENT-analytics-metrics-aggregate.provider_id", "entity_id": "ENT-analytics-metrics-aggregate", "name": "provider_id", "data_type": "id", "title": "Provider ID", "owner_fr": "FR-014", "required": true}
