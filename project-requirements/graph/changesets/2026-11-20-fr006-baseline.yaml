reason: "Requirements graph programme baseline 2026-11-20: owner rulings applied (FR-006)"
by: controller
operations:
  - {"op": "retire_node", "id": "REQ-006-012"}
  - {"op": "retire_node", "id": "REQ-006-031"}
  - {"op": "update_node", "id": "REQ-006-004", "attrs": {"statement": "System MUST enforce the cancellation policy, with refunds following the refund ladder set in FR-029 (rescheduling deferred to V2). Apart from the deposit-plan balance case in REQ-006-016, only an admin MAY cancel a booking, from `Accepted`, `Payment Window Expired`, `Confirmed`, `In Progress`, or `Aftercare`, with a mandatory reason, confirmation, and audit entry; the booking and inquiry MUST become `Cancelled`, the accepted quote MUST stay `accepted`, and `booking.cancelled` MUST be sent. The patient MUST NOT have an in-app cancel action from acceptance onward and MUST be offered \"Contact support\" instead."}}
  - {"op": "update_node", "id": "REQ-006-005", "attrs": {"statement": "System MUST hold the accepted subquote's appointment slot with one fixed hold that starts at subquote acceptance and lasts the FR-026 slot-hold duration (default 48 hours); payment failure MUST NOT extend or restart it. If the hold expires before the first payment succeeds, System MUST set the booking to `Payment Window Expired`, release the hold, create no appointment record, block payment against that accepted selection, and preserve the immutable AcceptanceEvent/snapshot without reopening the prior parent quote or accepted subquote. The hold is keyed by provider, appointment date/time, and time zone. Recovery is by the audited admin revive, or by admin cancellation on a support request followed by a new inquiry; the patient is offered the \"Contact support\" route and has no in-app retry."}}
  - {"op": "update_node", "id": "REQ-006-011", "attrs": {"statement": "System MUST integrate with Notification Service for confirmations, reminders, and policy notices, and MUST trigger these FR-030 events: `booking.scheduled` (sent on patient acceptance and on an admin-authored replacement acceptance), `booking.rescheduled` (sent on an admin appointment change), `booking.cancelled` (sent on admin cancellation with the reason), `booking.hold_expiring_soon`, `booking.payment_window_expired`, `booking.revived`, `booking.provider_fault_replacement`, `booking.confirmed` (sent when the first payment confirms the booking), and `booking.appointment_reminder` (sent ahead of a confirmed appointment). Recipients, message content, and whether each notice is mandatory are owned by the notification Rules in FR-020 (for example REQ-020-021) and FR-030 and are not restated here. FR-004 is the only producer of `quote.withdrawn`; FR-006 does not emit it and reacts to it by starting the provider-fault transfer in Alternative Flow B5."}}
  - {"op": "update_node", "id": "REQ-006-015", "attrs": {"statement": "When a provider's suspension or deactivation becomes effective, System MUST cancel that provider's `Accepted` and `Confirmed` bookings with cause `ProviderSuspended` or `ProviderDeactivated` and an independent `supportRequired` marker, release holds/reservations/slots, block further payment, revalidate provider eligibility at booking-confirming payment, treat any racing capture as paid money under the B4 payment placeholder (see Provider-Status Cancellation), retain the accepted snapshot and booking/payment history, write the supersession record only at the replacement acceptance, and let an admin rehome the patient to a replacement provider in the same inquiry through Alternative Flow B5, without restoration on reactivation (Alternative Flow B4; FR-015 A5/Screen 4). `In Progress` and `Aftercare` bookings MUST keep their status and receive the cause and `supportRequired` (Alternative Flows B7 and B6)."}}
  - {"op": "update_node", "id": "REQ-006-016", "attrs": {"statement": "`Payment Window Expired` MUST apply only to the first payment step (acceptance to deposit or first installment). A missed later installment or final payment MUST NOT cause `Payment Window Expired`, booking cancellation, or inquiry cancellation. The one exception is a deposit plan: when its unpaid balance is still unpaid at the point set for it (FR-029), the booking is cancelled at that point and the refund ladder applies."}}
  - {"op": "update_node", "id": "REQ-006-017", "attrs": {"statement": "Admin MAY revive a `Payment Window Expired` booking to `Accepted` only through Screen 7 with a mandatory reason, a slot availability re-check, a new hold of the FR-026 duration, one promotion use taken again where the accepted promotion has a usage limit (re-reserved for a provider-selected promotion or patient code, taken again for an automatic promotion; the revive is rejected if the limit has no room), an audit entry, an unchanged AcceptanceEvent, and a mandatory \"booking revived\" notice to patient and provider. A revive MUST NOT extend the expired hold; it starts a new one, and the initial payment then MUST pass the Initial Payment Guard (REQ-007-017) against that new hold. Appointment date changes MUST be made through Screen 8, MUST pass a slot availability check, MUST update the booking's current appointment while the acceptance snapshot keeps the accepted baseline, MUST send `booking.rescheduled`, and MUST trigger an FR-008 travel review for any travel records already linked to the booking. No other manual status change is allowed."}}
  - {"op": "update_node", "id": "REQ-006-020", "attrs": {"statement": "System MUST block an admin revive (Screen 7), an admin appointment change (Screen 8), and an admin-authored replacement acceptance (Screen 10) when the provider concerned is `Suspended` or `Deactivated` at submit, MUST change nothing, and MUST show the action-specific message that directs the admin to the provider-fault transfer or to another replacement provider (Admin Status and Date Intervention Rules; FR-015 Rule 9). The messages are: revive, \"This provider is suspended or deactivated, so this booking cannot be revived. Use the provider-fault transfer instead.\"; appointment change, \"This provider is suspended or deactivated, so this appointment cannot be changed. Use the provider-fault transfer instead.\"; replacement acceptance, \"This provider is suspended or deactivated, so this replacement quote cannot be accepted. Choose another replacement provider.\""}}
  - {"op": "update_node", "id": "REQ-006-030", "title": "Deposit comes from the FR-029 calculation", "attrs": {"statement": "System uses the FR-029 calculation (REQ-029-016) for the first payment and presents the cancellation policy; FR-006 does not restate the percentage or the formula."}}
  - {"op": "update_node", "id": "REQ-006-036", "attrs": {"statement": "Before the hold expires, the patient receives the `booking.hold_expiring_soon` reminder; the lead time is set by admin in FR-026, and the notice details are in the notification Rule (REQ-020-086)."}}
  - {"op": "update_node", "id": "REQ-006-053", "title": "A full refund only for provider withdrawal or drop-out; other cancellations follow the FR-029 refund ladder", "attrs": {"statement": "A full refund applies only when the provider withdraws or drops out; every other cancellation follows the refund ladder set in FR-029. When the provider withdraws or drops out after acceptance and before treatment starts (Alternative Flow B5), the patient is refunded everything paid and a replacement booking takes a new payment; while `In Progress` the case follows Alternative Flow B7. The patient pays no cancellation fee in either case."}}
  - {"op": "update_node", "id": "REQ-006-054", "title": "Provider-status cancellation money follows the B4 placeholder", "attrs": {"statement": "Bookings cancelled by an effective provider suspension/deactivation (Alternative Flow B4) are rehomed by admin to a replacement provider in the same inquiry through the Alternative Flow B5 transfer. The payment terms for this cause are not yet ruled and stay a placeholder: paid amounts move with the patient as credit toward the replacement booking, any unused part is refunded, and the patient pays no fee; exact mechanics are defined later in FR-007, FR-007B, and FR-017. Provider eligibility is revalidated at booking-confirming payment (FR-015 Rule 9). A payment captured while suspension/deactivation becomes effective is recorded and treated as paid money under this B4 payment placeholder; it never confirms or revives the booking."}}
  - {"op": "update_node", "id": "REQ-006-064", "attrs": {"statement": "Cancellation policy schedule (thresholds and refund percentages). The refund ladder setting is owned by FR-029; FR-006 points to it."}}
  - {"op": "add_node", "id": "REQ-006-071", "type": "Rule", "owner_fr": "FR-006", "title": "Booking confirmation stays visible in-app when the email fails", "attrs": {"statement": "After a successful payment, System MUST keep the booking confirmation visible in the app even when the confirmation email fails; retrying the failed delivery belongs to the notification service (REQ-030-008)."}}
  - {"op": "add_node", "id": "REQ-006-072", "type": "Rule", "owner_fr": "FR-006", "title": "Screen 1 moves to blocked state at once when the inquiry is cancelled", "attrs": {"statement": "When the parent inquiry is cancelled while the patient is on Screen 1, System MUST move Screen 1 to its blocked state at once, without a page refresh."}}
  - {"op": "add_node", "id": "REQ-006-073", "type": "Rule", "owner_fr": "FR-006", "title": "Inquiry checked atomically at payment submission", "attrs": {"statement": "System MUST check that the parent inquiry is not cancelled at the moment the payment is submitted, in one atomic step, not only when the screen is opened. If the inquiry has been cancelled, System MUST reject the payment with the message \"This inquiry has been cancelled\" and take no charge."}}
  - {"op": "add_node", "id": "REQ-006-074", "type": "Rule", "owner_fr": "FR-006", "title": "Audited emergency edit of non-money booking details", "attrs": {"statement": "An admin MAY make an audited emergency edit of non-money booking details, with a mandatory reason; System MUST keep the full before and after history of every emergency edit. An emergency edit MUST NOT set the booking status and MUST NOT change payment records or money terms, which stay immutable; revive, appointment change, cancellation, and the provider-fault transfer keep their own guarded steps and checks, and the acceptance snapshot stays unchanged."}}
