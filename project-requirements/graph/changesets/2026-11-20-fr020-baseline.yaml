- op: update_node
  id: REQ-020-014
  attrs:
    statement: System MUST retry failed provider-status notifications (per Flow B2) without duplicates per provider-status event + affected record + recipient, and a retry MUST NOT restore a cancelled record; System MUST send `provider.suspended` / `provider.deactivated` email to the provider Owner only when "Notify Provider" is checked; for a scheduled change, the email MUST be sent when the change is created and again when it takes effect. `provider.status_cancellation_admin_support` MUST go to admins with the FR-031 Respond to Support permission, and `provider.reactivated` and `provider.scheduled_change_cancelled` MUST go to the provider Owner only.
    rationale: Functional Requirements Summary. Carries the never-restore-a-cancelled-record clause of the merged REQ-020-151; the Business Rules Provider-Status Cancellation bullet points here.
