reason: "FR-015 Provider Management (Admin-Initiated) migration, part 1 of 2: rules with their applies-at and decided-by edges (migrate-fr checklist v1.1, from the frozen PRD)."
by: "docs-manager"
# Source: archived/prd-baseline-2026-11-08/fr015-provider-management/prd.md. REQ-015-001..029 kept verbatim; prose rules numbered from REQ-015-030.
# Operations marked '# stub' create a node or field owned by another FR; the controller converts a collision into an update.
# Operations marked '# shared edge' touch a Stage or Actor shared with other FRs.
# Apply part 1 first.
operations:
  - {"op": "add_node", "id": "REQ-015-001", "type": "Rule", "owner_fr": "FR-015", "title": "Admins create providers through a multi-step wizard", "attrs": {"statement": "System MUST allow admins to create new provider accounts via a multi-step wizard, including profile (Bio, Languages, Awards), clinic details, seat limit (team member capacity), and commission settings."}}
  - {"op": "add_node", "id": "REQ-015-002", "type": "Rule", "owner_fr": "FR-015", "title": "Provider creation is admin-initiated only", "attrs": {"statement": "System MUST enforce admin-initiated provider creation only (no self-service registration).", "rationale": "Restated by General Module Rule 1 (all provider accounts are created by admins, no self-service registration) and Business Process Assumption 1 (providers cannot register themselves; admins control network quality through manual vetting)."}}
  - {"op": "add_node", "id": "REQ-015-003", "type": "Rule", "owner_fr": "FR-015", "title": "Provider lifecycle: Active, Suspended, Deactivated", "attrs": {"statement": "System MUST support provider status lifecycle with statuses Active, Suspended, and Deactivated only (no Draft): Active → Suspended (Screen 4), Suspended → Active via the Screen 5 reactivation modal, and Active or Suspended → Deactivated (Screen 4). Every transition requires a reason and admin re-authentication.", "rationale": "Restated by General Module Rule 3 (statuses, no Draft, allowed transitions, password not yet set tracked by password_set not by a status), Screen 5 (Suspended only) and the Implementation Notes state machine (cannot transition from Deactivated to any other status)."}}
  - {"op": "add_node", "id": "REQ-015-004", "type": "Rule", "owner_fr": "FR-015", "title": "Providers and admins manage documents; documents never block activation", "attrs": {"statement": "System MUST allow providers to upload and manage their documents (license, certification, insurance) via FR-032. System MUST also allow admins to upload supplementary documents received externally. Documents are for record-keeping and do not block activation.", "rationale": "Executive Summary: document verification is performed externally and the system treats uploaded documents as pre-verified records."}}
  - {"op": "add_node", "id": "REQ-015-005", "type": "Rule", "owner_fr": "FR-015", "title": "Provider management actions go to an immutable audit trail", "attrs": {"statement": "System MUST log all provider management actions (creation, edits, status changes) in an immutable audit trail.", "rationale": "Restated by Security Considerations (audit logs immutable, cannot be edited or deleted by admins) and Tab 8."}}
  - {"op": "add_node", "id": "REQ-015-006", "type": "Rule", "owner_fr": "FR-015", "title": "Activation email with one-time link; resend rate limited", "attrs": {"statement": "System MUST send account activation email with one-time password setup link (expires 24 hours) when provider account is created. System MUST support activation email resend via self-service (provider login page) and admin manual resend (provider profile Quick Actions), with rate limiting (3 requests per hour per email) and automatic invalidation of previous links.", "rationale": "Main Flow steps 12 to 13 and Alternative Flow A1; the event is FR-020 provider.activation, mandatory and cannot be disabled."}}
  - {"op": "add_node", "id": "REQ-015-007", "type": "Rule", "owner_fr": "FR-015", "title": "Provider profile data aligned with FR-032 and synced in real time", "attrs": {"statement": "System MUST maintain provider profile data aligned with FR-032 (Bio, Languages, Awards, Profile Picture, Contact details, etc.). Changes made by providers in FR-032 must sync to admin view in real-time.", "rationale": "Provider-editable fields are listed under Admin Editability Rules; Screen 3 notes say provider changes reflect immediately in the admin view."}}
  - {"op": "add_node", "id": "REQ-015-008", "type": "Rule", "owner_fr": "FR-015", "title": "Provider documents stored in secure cloud storage (AES-256)", "attrs": {"statement": "System MUST store uploaded provider documents in secure cloud storage (AES-256).", "rationale": "Restated by Privacy Rule 2 (AES-256 at rest) and the Implementation Notes storage and encryption bullets."}}
  - {"op": "add_node", "id": "REQ-015-009", "type": "Rule", "owner_fr": "FR-015", "title": "Commission configuration stored per provider in the FR-029 record", "attrs": {"statement": "System MUST store commission configuration (Model: Percentage/Flat, Value, Flat Rate Currency, Effective Date) per provider in the FR-029 provider-specific commission record."}}
  - {"op": "add_node", "id": "REQ-015-010", "type": "Rule", "owner_fr": "FR-015", "title": "Seat limit per provider: default 100, range 1-500", "attrs": {"statement": "System MUST store seat limit (maximum team members) per provider with default value of 100, adjustable range 1-500. Seat limit must be enforced by FR-009 when providers invite staff members.", "rationale": "Restated by General Module Rule 7 and the Screen 2 and Tab 1 Seat Limit rows. Seat usage counting is owned by FR-009 Rule 6."}}
  - {"op": "add_node", "id": "REQ-015-011", "type": "Rule", "owner_fr": "FR-015", "title": "Activation token, expiry and password_set stored; old tokens invalidated", "attrs": {"statement": "System MUST store activation token (one-time password setup link), token expiry timestamp (24 hours from generation), and the password_set status of the provider owner's login (stored on the owner's team-member record). System MUST invalidate previous tokens when new token is generated.", "rationale": "The PRD says password_set lives on the owner's team-member record, while Key Entity 1 lists it on Provider (see report, question on password_set location)."}}
  - {"op": "add_node", "id": "REQ-015-012", "type": "Rule", "owner_fr": "FR-015", "title": "Provider documents encrypted at rest and in transit", "attrs": {"statement": "System MUST encrypt provider documents at rest and in transit."}}
  - {"op": "add_node", "id": "REQ-015-013", "type": "Rule", "owner_fr": "FR-015", "title": "Document access limited to authenticated users with role permissions", "attrs": {"statement": "System MUST restrict document access to authenticated users (providers can access their own documents, admins can access all provider documents) with role-based permissions (providers can edit their own uploads, admins can edit admin uploads only)."}}
  - {"op": "add_node", "id": "REQ-015-014", "type": "Rule", "owner_fr": "FR-015", "title": "Login email and contact email uniqueness", "attrs": {"statement": "System MUST validate provider login Email against the FR-009 global provider email identity rule (Rule 3, REQ-009-008) on creation and on every change (blocking emails used by another provider organization as Owner, team member, or pending invitation), and MUST validate Contact Email uniqueness among Active and Suspended providers; Deactivated providers' emails are freed so a re-onboarded provider can reuse them.", "rationale": "Restated by General Module Rule 4 (Deactivated providers' emails freed), the Screen 2 and Tab 1 Email Address rows and the duplicate-email edge cases. The PRD at Tab 1 (Owner login email change) cites this rule where the FR-009 identity rule REQ-009-008 is meant."}}
  - {"op": "add_node", "id": "REQ-015-015", "type": "Rule", "owner_fr": "FR-015", "title": "Platform password policy and bcrypt hashing", "attrs": {"statement": "System MUST enforce the platform-wide password policy defined in the Hairline Platform Constitution and shared authentication spec: passwords MUST be at least 12 characters long and include at least 1 uppercase letter, 1 lowercase letter, 1 number, and 1 special character from !@#$%^&(),.?\\\":{}|<>. This policy is centrally defined and NOT configurable per FR. Passwords MUST be hashed using bcrypt with a minimum cost factor of 12.", "rationale": "Main Flow steps 15 and 17."}}
  - {"op": "add_node", "id": "REQ-015-016", "type": "Rule", "owner_fr": "FR-015", "title": "Activation resend limited to 3 per hour per email", "attrs": {"statement": "System MUST rate limit activation email resend requests to 3 per hour per email address to prevent abuse and email flooding.", "rationale": "Restated by Alternative Flow A1 and the activation-resend edge case."}}
  - {"op": "add_node", "id": "REQ-015-017", "type": "Rule", "owner_fr": "FR-015", "title": "Suspension cascade: cancel unaccepted quotes, close pre-treatment bookings", "attrs": {"statement": "Effective provider suspension MUST automatically cancel the provider's unaccepted Parent Quotes with the FR-004 status `cancelled_provider_status` and close all related non-terminal Accepted and Confirmed cases under A5/Screen 4, while an accepted Parent Quote keeps `accepted`; release active reservations and block further payment. Closed accepted bookings MUST enter the FR-006 provider-fault transfer instead of cancelling their inquiry. In Progress bookings MUST NOT be closed automatically; they MUST stay `In Progress` with the cause and support marker until an admin moves them to `Aftercare` with aftercare reassignment or cancels them with a reason. Aftercare bookings and FR-011 standalone aftercare cases assigned to that provider MUST NOT be closed; they MUST keep their status, receive the cause and support marker, and move to admin aftercare reassignment with no new acceptance or payment. Effective deactivation MUST apply the same cascade scope with the `ProviderDeactivated` cause, without overwriting an earlier `ProviderSuspended` cause.", "rationale": "Alternative Flow A5 steps 1 to 7 and the Screen 4 Suspension and Deactivation bullets restate this rule; deactivation runs the same cascade with ProviderDeactivated and also disables login."}}
  - {"op": "add_node", "id": "REQ-015-018", "type": "Rule", "owner_fr": "FR-015", "title": "Provider-caused cancellation causes and independent supportRequired marker", "attrs": {"statement": "System MUST distinguish ProviderSuspended and ProviderDeactivated cancellation causes from patient cancellation and payment-window expiry, and set an independent `supportRequired` marker on affected cases/inquiries. Shared unaccepted inquiries MUST retain unrelated providers' offers; an inquiry whose accepted booking is closed by the cascade MUST stay open for the FR-006 provider-fault transfer and MUST NOT be cancelled.", "rationale": "Restated by A5 step 4 and the Screen 4 Admin Support Required bullet."}}
  - {"op": "add_node", "id": "REQ-015-019", "type": "Rule", "owner_fr": "FR-015", "title": "Mandatory patient notices and admin support alerts", "attrs": {"statement": "System MUST send affected patients cancellation/offer-unavailability messages with Contact Admin/Support instructions (`provider.status_cancellation_patient` before acceptance; for a closed accepted booking, the mandatory `booking.provider_fault_replacement` notice that an admin will arrange a replacement provider within the same inquiry) and alert admins for special support, regardless of the optional Notify Provider checkbox. Support resolution MUST be audited before clearing the marker; confidential investigation details MUST NOT appear in patient messages.", "rationale": "Restated by Communication Structure (in scope) and the Screen 4 Patient communication bullet."}}
  - {"op": "add_node", "id": "REQ-015-020", "type": "Rule", "owner_fr": "FR-015", "title": "Eligibility revalidation and idempotent cascade", "attrs": {"statement": "System MUST revalidate provider eligibility at allocation, submission, acceptance, booking confirmation, and the FR-006 admin actions admin Revive Booking, admin appointment change (reschedule), and admin acceptance of a replacement quote (FR-006 B5) (each requires an Active provider, per FR-006 REQ-006-020), prevent in-flight operations/callbacks from reviving cancelled cases, and deduplicate cascade processing by provider-status event and affected record. The status change and its provider status event MUST be written in one transaction; the cascade MUST run as an idempotent background job with a target completion within 5 minutes, and a reactivation MUST NOT stop a running cascade for the earlier event.", "rationale": "Restated by General Module Rule 9 and Integration 5. The A5 background job targets completion within 5 minutes of the effective time."}}
  - {"op": "add_node", "id": "REQ-015-021", "type": "Rule", "owner_fr": "FR-015", "title": "Status changes never rewrite history or reopen cancelled records", "attrs": {"statement": "Suspension, deactivation, or reactivation MUST NOT rewrite accepted snapshots/versions, erase clinical or financial history, or automatically reopen cancelled quotes/cases/payment windows. Admin support MUST retain access to the records needed for clinical continuity and financial resolution.", "rationale": "Screen 4 Reactivation bullet: reactivation permits new eligible activity only and does not restore cancelled quotes or cases, reopen accepted selections, reinstate reservations, restart payment windows, clear unresolved support markers or restore the Featured flag."}}
  - {"op": "add_node", "id": "REQ-015-022", "type": "Rule", "owner_fr": "FR-015", "title": "Commission snapshot at booking confirmation stays synchronized", "attrs": {"statement": "Effective commission configuration MUST be snapshotted at booking confirmation under FR-029 and retained for later transactions; edits in FR-015/FR-029 MUST stay synchronized without replacing existing booking snapshots. Percentage/Flat Rate models and the once-per-completed-procedure flat-fee rule remain unchanged.", "rationale": "Restated by General Module Rule 5 and Commission Rule 4: the effective model and value are resolved and snapshotted at booking confirmation; changes affect newly confirmed bookings only."}}
  - {"op": "add_node", "id": "REQ-015-023", "type": "Rule", "owner_fr": "FR-015", "title": "Completed Procedures counts distinct FR-010 completions", "attrs": {"statement": "Provider-profile Completed Procedures MUST count distinct FR-010 treatment completions, not quotes, options, accepted selections, payments, or final aftercare status. Later cancellation MUST NOT erase a recorded completion.", "rationale": "Tab 1 business rule: Completed Procedures uses the FR-010 treatment-completion milestone, not acceptance, payment confirmation or final aftercare completion, and cancellation during Aftercare does not erase a recorded completion."}}
  - {"op": "add_node", "id": "REQ-015-024", "type": "Rule", "owner_fr": "FR-015", "title": "Lifecycle impact references retained in existing owning entities", "attrs": {"statement": "System MUST retain provider-status event/effective-time references, affected record identifiers and prior stages, cancellation cause, support marker/resolution audit, slot-release outcome, and notification outcome for lifecycle impact and admin follow-up; storage remains with the existing owning entities rather than duplicating accepted data in Provider."}}
  - {"op": "add_node", "id": "REQ-015-025", "type": "Rule", "owner_fr": "FR-015", "title": "Admin profile saves require a 10-500 character reason", "attrs": {"statement": "Admin saves to provider profile data (Screen 3 Tabs 1, 2, 4, 6 notes, and 7) MUST require a change reason of 10-500 characters that is stored in the Tab 8 audit entry; provider self-edits via FR-032 and Featured Provider set/unset actions are exempt.", "rationale": "Tab 1 business rule: the reason is stored with the audit entry and shown in Tab 8; the Featured Provider toggle and Set/Unset Featured quick actions never ask for it (Tab 8 still logs them)."}}
  - {"op": "add_node", "id": "REQ-015-026", "type": "Rule", "owner_fr": "FR-015", "title": "Login as Provider rules", "attrs": {"statement": "Login as Provider MUST require a reason (min 20 characters) and admin re-authentication, show a persistent impersonation banner, block password/email/financial changes, log every action in Tab 8, and end after 30 minutes of inactivity. It MUST be blocked for a Deactivated provider and MUST be limited to the FR-032 Rule 6 read-only rules for a Suspended provider, whether the admin impersonates the Owner or a team member.", "rationale": "Screen 3 Login as Provider rules (see also the Super Admin and new-tab rule below)."}}
  - {"op": "add_node", "id": "REQ-015-027", "type": "Rule", "owner_fr": "FR-015", "title": "Featured flag cleared on suspension or deactivation", "attrs": {"statement": "System MUST clear the Featured flag automatically when suspension or deactivation becomes effective and MUST NOT restore it on reactivation.", "rationale": "Restated by General Module Rule 6 and the Screen 4 Featured flag bullet (logged in Tab 8, frees a slot under the 10-provider cap)."}}
  - {"op": "add_node", "id": "REQ-015-028", "type": "Rule", "owner_fr": "FR-015", "title": "Scheduled suspension and deactivation", "attrs": {"statement": "System MUST support scheduled suspension and deactivation: store at most one pending change per provider, show a \"Scheduled\" marker on Screen 1 and the Screen 3 header, allow admins to cancel it with a reason and re-authentication before the Effective Date, apply it automatically on that date with the A5 cascade recalculated at effective time, and log scheduling, cancellation, and application in Tab 8."}}
  - {"op": "add_node", "id": "REQ-015-029", "type": "Rule", "owner_fr": "FR-015", "title": "Screen 4 links each affected record to its resolving screen", "attrs": {"statement": "Screen 4 MUST link each affected record to the admin screen that resolves it (provider-fault transfer, aftercare reassignment, or the FR-016 Admin Support Required view), and each of those actions MUST record a mandatory reason, confirmation, and audit entry."}}
  - {"op": "add_node", "id": "REQ-015-030", "type": "Rule", "owner_fr": "FR-015", "title": "Creation requires every Required field of the wizard", "attrs": {"statement": "Provider creation (and therefore activation) requires every field marked Required in the Screen 2 wizard: First Name, Last Name, Email, Phone Number, Bio/Description (50-500 chars), Specialty, Medical License Number, Years of Experience, at least 1 Language, Clinic Name, Clinic Address, Contact Email, Medical License file, Commission Model and Value, Flat Rate Currency (when Commission Model = Flat Rate), Payout Frequency, and Commission Start Date. The Medical License file is a record-keeping baseline only; document authenticity or later document changes never block activation or change status.", "rationale": "General Module Rule 2."}}
  - {"op": "add_node", "id": "REQ-015-031", "type": "Rule", "owner_fr": "FR-015", "title": "Provider without a password is excluded from inquiry distribution", "attrs": {"statement": "An Active provider with `password_set = false` is excluded from FR-003 inquiry distribution (including explicit patient selection and reassignment) until the password is set; it may still be featured or edited by admins.", "rationale": "Restated by Main Flow steps 12 and 21, FR-003 distribution (CR-aligned) and the Dependencies FR-003 entry."}}
  - {"op": "add_node", "id": "REQ-015-032", "type": "Rule", "owner_fr": "FR-015", "title": "Deactivation is permanent; new account needed to re-onboard", "attrs": {"statement": "Deactivation is permanent—deactivated providers cannot be reactivated; admin must create new provider account if re-onboarding required. Deactivation frees the provider's emails: Contact Email uniqueness counts only Active and Suspended providers, and login Email follows the FR-009 global provider email identity rule (Rule 3, REQ-009-008), under which the Owner, team member, and pending-invitation emails of a Deactivated provider are freed. The new account may reuse those emails; the deactivated record and its history are retained unchanged.", "rationale": "Screen 4 describes deactivation as permanent and irreversible; Alternative Flow A7 adds that there is no separate Deleted status and that data is retained per FR-023."}}
  - {"op": "add_node", "id": "REQ-015-033", "type": "Rule", "owner_fr": "FR-015", "title": "Featured designation only for Active providers", "attrs": {"statement": "Featured provider designation only available for providers with status = \"Active\".", "rationale": "General Module Rule 6, first sentence."}}
  - {"op": "add_node", "id": "REQ-015-034", "type": "Rule", "owner_fr": "FR-015", "title": "At most 10 featured providers, enforced server-side", "attrs": {"statement": "At most 10 active providers may be featured. Admin can set or unset featured status from the Provider-list quick action or the Basic Information toggle. A request to feature an eleventh provider must be rejected without changing data and must clearly tell the admin to unfeature another provider first, using the message: \"Maximum of 10 featured providers reached. Unfeature another provider first.\" Featuring or unfeaturing does not require an admin change reason (Tab 8 still logs it). This limit must be enforced server-side for every write path.", "rationale": "General Module Rule 8; Alternative Flow A3 step 2 restates the Active and fewer-than-10 check."}}
  - {"op": "add_node", "id": "REQ-015-035", "type": "Rule", "owner_fr": "FR-015", "title": "Seat increase requests go through FR-009 and FR-034; admin edits Seat Limit", "attrs": {"statement": "Providers request seat limit increases via FR-009 \"Request more seats\", which opens an FR-034 support case pre-filled as a seat-increase request; if approved, the admin edits Seat Limit in Screen 3 Tab 1. Seat limit blocks staff invitations when reached (enforced by FR-009).", "rationale": "General Module Rule 7, second and third sentences."}}
  - {"op": "add_node", "id": "REQ-015-036", "type": "Rule", "owner_fr": "FR-015", "title": "Cascade ownership: A5 and Screen 4 own cancellation; FR-006 and FR-011 own transfers", "attrs": {"statement": "Screen 4 and Alternative Flow A5 own provider-status cancellation and support effects; FR-006 Alternative Flow B5 owns the replacement-provider transfer for accepted bookings before treatment starts, FR-006 Screen 6 owns the admin decision for `In Progress` bookings (move to Aftercare with reassignment, or cancel), and FR-006 Alternative Flow B6 with FR-011 owns the aftercare reassignment. The cascade is provider-scoped, preserves immutable accepted context, and must not count alternatives as independent treatments or cancel unrelated providers' unaccepted offers.", "rationale": "General Module Rule 10. A5 Boundary: This admin-triggered suspension cascade is distinct from patient inquiry cancellation, normal payment-window expiry, and FR-010's provider-requested Cancel/Close Case flow. The replacement provider is chosen by an admin through FR-006 Alternative Flow B5, not selected automatically. This flow defines no refund or fund-release mechanics and does not erase completed care."}}
  - {"op": "add_node", "id": "REQ-015-037", "type": "Rule", "owner_fr": "FR-015", "title": "Provider contact details visible to admins only", "attrs": {"statement": "Provider contact information (email, phone) visible only to admins; patients see clinic phone/email."}}
  - {"op": "add_node", "id": "REQ-015-038", "type": "Rule", "owner_fr": "FR-015", "title": "Audit entries carry actor, reason and cancellation details", "attrs": {"statement": "All provider management actions logged with timestamp, admin user ID, action details, and the admin's reason or justification (Screen 3 Tab 1 admin change reason, Screens 4-5 status reasons, Login as Provider reason). Provider-status cancellation records include the triggering status event, effective time, affected inquiry/quote/booking/treatment identifiers, prior stage, cancellation cause, support marker, slot-release outcome, and notification outcome. Sensitive suspension reasons remain admin/provider context rather than patient notification content.", "rationale": "Near-duplicate of REQ-015-005 and REQ-015-024 within this FR."}}
  - {"op": "add_node", "id": "REQ-015-039", "type": "Rule", "owner_fr": "FR-015", "title": "Admin and provider editability of profile data", "attrs": {"statement": "Editable by Admin: provider basic information (name, specialty, bio, languages, awards); clinic information (name, address, phone, logo, contact email); commission configuration (Model: Percentage/Flat, Value, Flat Rate Currency, Effective Date); seat limit (maximum team members, range 1-500, default 100); document uploads (Add; Replace/Remove admin-uploaded documents only; provider-uploaded documents are managed by the provider via FR-032); provider status (Active, Suspended, Deactivated); featured provider designation. Editable by Provider (via FR-032): Profile Picture/Logo; Cover Image; Bio/Description; Languages Spoken; Awards & Recognition (add/edit/delete with images); Clinic Name; Contact Phone (Public); Contact Email; Location (City, Country); Website URL. Fixed in codebase: deactivation finality rule; encryption standards; commission calculation logic. Fields marked \"Admin only\" can only be edited by admin users with provider management permissions Admin can override any provider changes if needed (logged in audit trail)", "rationale": "Admin Editability Rules; Tab 1 business rules and notes."}}
  - {"op": "add_node", "id": "REQ-015-040", "type": "Rule", "owner_fr": "FR-015", "title": "Commissions apply to all provider earnings from patient bookings", "attrs": {"statement": "Commissions apply to all provider earnings from patient bookings."}}
  - {"op": "add_node", "id": "REQ-015-041", "type": "Rule", "owner_fr": "FR-015", "title": "Percentage commission formula and base", "attrs": {"statement": "Percentage Model: Calculated as `Booking Total * (Commission Rate / 100)`. The booking total is the accepted price after promotion, in the quote currency, read from the FR-005 acceptance snapshot; commission never reads the live quote or option record. The same base applies to every discount type, including discounts funded only by Hairline. The rate is the one fixed at booking confirmation (Commission Rule 4)."}}
  - {"op": "add_node", "id": "REQ-015-042", "type": "Rule", "owner_fr": "FR-015", "title": "Flat Rate commission is a fixed deduction per completed procedure", "attrs": {"statement": "Flat Rate Model: Fixed amount deducted per completed procedure (e.g., £150 flat fee).", "rationale": "Alternative Flow A2 restates this for the admin configuration step."}}
  - {"op": "add_node", "id": "REQ-015-043", "type": "Rule", "owner_fr": "FR-015", "title": "Cancellation by provider status leaves payment records intact; money follows FR-006 B5", "attrs": {"statement": "Suspension or deactivation closes affected bookings and blocks further patient payment to that provider, but payment/refund/commission records remain intact. For a closed accepted booking, money follows the FR-006 Alternative Flow B5 payment placeholder: paid amounts move with the patient as credit toward the replacement booking, any unused part is refunded, and the patient pays no fee. Exact refund, fund-release, and allocation mechanics belong to FR-007, FR-007B, and FR-017; no new refund percentage, fee, payout rail, or fund-release rule is defined here."}}
  - {"op": "add_node", "id": "REQ-015-044", "type": "Rule", "owner_fr": "FR-015", "title": "Payouts follow the provider's Payout Frequency", "attrs": {"statement": "Provider payouts are calculated per the provider's Payout Frequency (Weekly, 2x a Month, or Monthly; Tab 7) and transferred to the provider's bank account through FR-017."}}
  - {"op": "add_node", "id": "REQ-015-045", "type": "Rule", "owner_fr": "FR-015", "title": "Documents never gate activation or change provider status", "attrs": {"statement": "A Medical License file is required once, when completing the Screen 2 wizard. After creation, the absence, replacement, or deletion of any document never changes provider status or blocks activity Documents are stored for internal record-keeping only; their authenticity or status is never checked by the system and never gates activation.", "rationale": "Main Flow step 7, Screen 2 Step 4 note and Tab 6."}}
  - {"op": "add_node", "id": "REQ-015-046", "type": "Rule", "owner_fr": "FR-015", "title": "Featured display to patients ships with FR-022 after MVP", "attrs": {"statement": "Provider appears in \"Featured\" lists in Patient App once FR-022 patient provider search (P2 - Post-MVP) is delivered; in MVP the flag is stored and enforced but not yet displayed to patients.", "rationale": "Module Scope: the admin featured flag and cap are MVP; the patient-facing display is P2."}}
  - {"op": "add_node", "id": "REQ-015-047", "type": "Rule", "owner_fr": "FR-015", "title": "Providers see profile, documents and commission read-only", "attrs": {"statement": "Providers view their own profile (synced with A-02). Providers see uploaded documents (for reference). Providers view configured commission rates and payout frequency (read-only) in the FR-032 Screen 4 Commission & Payout panel. Providers can edit profile fields (Bio, Languages, Awards, Profile Picture, Contact details) via FR-032: Provider Dashboard Settings & Profile Management, which updates the A-02 record. All editable fields must align between FR-015 and FR-032 to ensure consistency.", "rationale": "Module Scope, Multi-Tenant Breakdown, Provider Platform."}}
  - {"op": "add_node", "id": "REQ-015-048", "type": "Rule", "owner_fr": "FR-015", "title": "Failed notification emails retry and show an admin warning", "attrs": {"statement": "System queues notification for retry (up to 3 attempts over 1 hour); admin sees warning message: \"Notification queued but not yet delivered.\" Admin can manually resend via the \"Resend Activation Email\" button in Screen 3.", "rationale": "Dependencies External Service 1 states the same retry and warning for activation and provider status emails."}}
  - {"op": "add_node", "id": "REQ-015-049", "type": "Rule", "owner_fr": "FR-015", "title": "Provider status emails go to the Owner only", "attrs": {"statement": "Provider status emails (`provider.suspended`, `provider.deactivated`, `provider.reactivated`, and `provider.scheduled_change_cancelled`) go to the provider Owner only. Team members learn of the status through the FR-032 Rule 6 banner or the deactivated-login message."}}
  - {"op": "add_node", "id": "REQ-015-050", "type": "Rule", "owner_fr": "FR-015", "title": "Provider status email timing and Notify Provider default", "attrs": {"statement": "For an immediate change the email is sent once. For a scheduled change with \"Notify Provider\" checked, the email is sent when the scheduled change is created (with the Effective Date) and again when it takes effect. If \"Notify Provider\" is unchecked, no provider email is sent at either point; patient messages and admin-support alerts are still mandatory. If \"Notify Provider\" checkbox enabled (default), system sends email (FR-020 `provider.suspended` or `provider.deactivated`) to the provider Owner with:", "rationale": "Screen 4 Notification Email and Email timing bullets; Notify Provider is checked and locked for a closure-request deactivation."}}
  - {"op": "add_node", "id": "REQ-015-051", "type": "Rule", "owner_fr": "FR-015", "title": "Entry points for provider management", "attrs": {"statement": "Admin accesses \"Provider Management\" section in Admin Platform dashboard → selects \"Add New Provider\" to initiate provider creation workflow Admin opens \"Providers\" list view to see all providers across all statuses (active, suspended, deactivated) with filtering and search Provider logs into Provider Platform → views account status (FR-032 Rule 6 banner when Suspended), uploaded documents (FR-032 Tab 6: Documents), and commission configuration read-only in FR-032 Screen 4: Billing Settings (Commission & Payout panel, Owner role only)"}}
  - {"op": "add_node", "id": "REQ-015-052", "type": "Rule", "owner_fr": "FR-015", "title": "Creation sets Active status, password_set false and the success message", "attrs": {"statement": "System creates provider record with status = \"Active\" and initializes provider credentials with `password_set = false`. Until the password is set, the provider is excluded from inquiry distribution (Rule 3). The admin sees the success message: \"Provider [Clinic Name] created successfully. An activation email has been sent to [email].\"", "rationale": "Main Flow step 12."}}
  - {"op": "add_node", "id": "REQ-015-053", "type": "Rule", "owner_fr": "FR-015", "title": "Activation email content and link", "attrs": {"statement": "System sends the account activation email (FR-020 `provider.activation`; mandatory and cannot be disabled) to provider with:", "rationale": "Main Flow step 13: the email carries a welcome message and platform introduction, the secure one-time link (24 hours), the provider's email address (login username) and first-login instructions."}}
  - {"op": "add_node", "id": "REQ-015-054", "type": "Rule", "owner_fr": "FR-015", "title": "First login shows an onboarding screen prompting profile completion", "attrs": {"statement": "System displays \"Welcome to Hairline\" onboarding screen prompting provider to complete profile (via FR-032):", "rationale": "Main Flow steps 19 to 20: logo and cover image, bio, languages, awards, contact review via FR-032."}}
  - {"op": "add_node", "id": "REQ-015-055", "type": "Rule", "owner_fr": "FR-015", "title": "Missing required fields block the wizard step with a message", "attrs": {"statement": "System validates every field marked Required in the Screen 2 wizard tables on each step (see Rule 2). System displays error: \"Please complete all required fields before proceeding\" and highlights missing fields in red."}}
  - {"op": "add_node", "id": "REQ-015-056", "type": "Rule", "owner_fr": "FR-015", "title": "Resend validates the account; responses never reveal whether the email exists", "attrs": {"statement": "System validates email exists in provider database and account status = \"Active\" (account created but password not set). If provider email not found or account already activated (password already set), system displays generic message: \"If an account exists with this email, an activation link will be sent.\" (security: don't reveal if email exists).", "rationale": "Alternative Flow A1 and the already-activated edge case (prevents email enumeration)."}}
  - {"op": "add_node", "id": "REQ-015-057", "type": "Rule", "owner_fr": "FR-015", "title": "Expired activation link shows a message and offers a new email", "attrs": {"statement": "Provider can request new activation email via login page resend flow or contact admin. Admin can manually resend from provider profile. When provider clicks expired link, system displays: \"This activation link has expired. Request a new activation email or contact support.\""}}
  - {"op": "add_node", "id": "REQ-015-058", "type": "Rule", "owner_fr": "FR-015", "title": "Admin Resend Activation Email visibility and permission", "attrs": {"statement": "\"Resend Activation Email\" (requires the FR-031 Edit Providers permission; visible only if password not yet set and status = Active, so it is hidden for Suspended and Deactivated providers, matching Alternative Flow A1; sends new one-time password setup link)", "rationale": "Screen 3 header quick action."}}
  - {"op": "add_node", "id": "REQ-015-059", "type": "Rule", "owner_fr": "FR-015", "title": "Document permissions by uploader", "attrs": {"statement": "Provider-uploaded documents: Admin can view, download, add notes, but cannot replace or delete (only provider can via FR-032) Admin-uploaded documents: Admin has full control (view, download, replace, delete, add notes) Replacing a document uploads the new file as the current version and archives the old file (soft-deleted and retained per the Soft Delete rule, logged in Tab 8). Replace does not require an admin change reason", "rationale": "Tab 6 business rules. Near-duplicate of the permission clause in REQ-015-013."}}
  - {"op": "add_node", "id": "REQ-015-060", "type": "Rule", "owner_fr": "FR-015", "title": "Replaced or deleted documents are archived by soft delete", "attrs": {"statement": "Deleted documents (by provider or admin) retained in archive for compliance; visible in Activity Log but not in main document list"}}
  - {"op": "add_node", "id": "REQ-015-061", "type": "Rule", "owner_fr": "FR-015", "title": "Document changes sync between FR-032 and FR-015 within 1 minute", "attrs": {"statement": "Provider uploads in FR-032 → Syncs to FR-015 within 1 minute. Admin uploads in FR-015 → Syncs to FR-032 within 1 minute"}}
  - {"op": "add_node", "id": "REQ-015-062", "type": "Rule", "owner_fr": "FR-015", "title": "All document actions are logged with user and IP address", "attrs": {"statement": "All document actions (upload/view/download/replace/delete/note edits) logged in Tab 8: Activity Log with timestamp, user (admin/provider), action type, and IP address"}}
  - {"op": "add_node", "id": "REQ-015-063", "type": "Rule", "owner_fr": "FR-015", "title": "Document types and the admin upload modal", "attrs": {"statement": "Document types are Medical License, Board Certification, Insurance (general), Malpractice Insurance, Business License and Other. The Upload Document modal requires File (PDF, JPG, PNG, DOCX, XLSX; max 10MB) and Document Type, with optional Notes (max 500 chars); on save the system sets Document Name, File Size, Upload Date and Uploaded By.", "rationale": "Tab 6 data fields and Upload Document Modal Fields."}}
  - {"op": "add_node", "id": "REQ-015-064", "type": "Rule", "owner_fr": "FR-015", "title": "Upload errors show a specific inline message and save nothing", "attrs": {"statement": "Every admin file upload in this FR (wizard Steps 1, 2 and 4, the profile images and award images on the provider detail tabs, and the Tab 6 Upload Document modal and Replace) validates the file before saving it and shows one inline message under the field. The file is not saved. Wrong format: \"Unsupported file type. Allowed: {types}.\" ({types} is the field's list, e.g. \"JPEG, PNG\" or \"PDF, JPG, PNG, DOCX, XLSX\") Too large: \"File is too large. Maximum size is {limit} MB.\" ({limit}: Profile Picture / Logo 5, Cover Image 10, award image 2, documents 10) Below the minimum dimensions (Profile Picture / Logo only): \"Image is too small. Minimum size is 200 × 200 pixels.\""}}
  - {"op": "add_node", "id": "REQ-015-065", "type": "Rule", "owner_fr": "FR-015", "title": "Uploaded files are scanned for malware before storage", "attrs": {"statement": "File upload validation (max 10MB per file, only PDF, JPG, PNG, DOCX, and XLSX allowed, matching FR-032; malware scanning via antivirus integration before storage)"}}
  - {"op": "add_node", "id": "REQ-015-066", "type": "Rule", "owner_fr": "FR-015", "title": "Provider creation is rate limited per admin", "attrs": {"statement": "Rate limiting on provider creation API (max 10 provider creations per admin per hour) to prevent bulk account creation abuse"}}
  - {"op": "add_node", "id": "REQ-015-067", "type": "Rule", "owner_fr": "FR-015", "title": "Sensitive contact data protected by database encryption, not application-level", "attrs": {"statement": "Provider sensitive data (email, phone, medical license number) is stored in the database protected by database/disk encryption at rest, HTTPS/TLS in transit, and access control. It is not encrypted at application level, so the Screen 1 partial search and the login email uniqueness check keep working"}}
  - {"op": "add_node", "id": "REQ-015-068", "type": "Rule", "owner_fr": "FR-015", "title": "Deactivated provider data retained at least 7 years, never hard-deleted", "attrs": {"statement": "Deactivated providers' data is retained for a minimum of 7 years for legal/audit purposes, then archived; it is never hard-deleted. GDPR/data deletion requests are handled via separate data privacy workflows (not in-scope for A-02)", "rationale": "Also stated in Security Considerations (Compliance) and the Screen 4 Deactivation bullet (data retained for audit and legal purposes but marked deactivated)."}}
  - {"op": "add_node", "id": "REQ-015-069", "type": "Rule", "owner_fr": "FR-015", "title": "Admin actions require the matching FR-031 permission", "attrs": {"statement": "Each action checks its FR-031 permission: View Providers (read-only access), Onboard Providers (create), Edit Providers (profile, documents, commission, seat limit, featured flag), Suspend Providers (all status changes). Resend Activation Email requires Edit Providers. Login as Provider is Super Admin only. Roles are defined in FR-031, not in this FR", "rationale": "Dependencies FR-031 entry lists the same permissions per screen."}}
  - {"op": "add_node", "id": "REQ-015-070", "type": "Rule", "owner_fr": "FR-015", "title": "Duplicate email shows an in-use validation error", "attrs": {"statement": "Login email follows the FR-009 global provider email identity rule (Rule 3, REQ-009-008); Deactivated providers' emails are freed (see Rule 4). If another provider organization uses the email as Owner, team member, or pending invitation, system displays validation error: \"Email address already in use by another provider. Please use a different email.\" Provider creation blocked until unique email provided.", "rationale": "Duplicate-provider edge case restates this for an Active or Suspended provider with the same Owner login."}}
  - {"op": "add_node", "id": "REQ-015-071", "type": "Rule", "owner_fr": "FR-015", "title": "Acceptance or payment racing a suspension is checked and never revives a cancelled selection", "attrs": {"statement": "Eligibility must be checked against the effective provider status. No cancelled selection may be confirmed or revived; any real captured payment remains recorded and is routed to admin financial resolution.", "rationale": "Edge case; related FR-005 and FR-006 rules own the matching blocks."}}
  - {"op": "add_node", "id": "REQ-015-072", "type": "Rule", "owner_fr": "FR-015", "title": "Cascade retries keep eligibility revoked and failures stay visible", "attrs": {"statement": "Keep provider eligibility revoked and cancelled records cancelled. Retry incomplete work using the same status event/case references without duplicate cancellations, alerts, or slot releases; retain visible unresolved processing failures for admins."}}
  - {"op": "add_node", "id": "REQ-015-073", "type": "Rule", "owner_fr": "FR-015", "title": "A quote's alternatives are cancelled once, not per alternative", "attrs": {"statement": "They remain alternatives of the same Parent Quote. Cancel its availability once; do not create a treatment or support item per unselected alternative."}}
  - {"op": "add_node", "id": "REQ-015-074", "type": "Rule", "owner_fr": "FR-015", "title": "Suspension never cancels an Aftercare case after completed procedure", "attrs": {"statement": "The case is not cancelled. It keeps its status, the FR-010 completion milestone, and its single Completed Procedures count; an admin reassigns aftercare to another provider or the Hairline aftercare team through the FR-011 aftercare reassignment screen. Performed care and payment history are not erased."}}
  - {"op": "add_node", "id": "REQ-015-075", "type": "Rule", "owner_fr": "FR-015", "title": "Deactivation after suspension keeps the earlier cancellation reason", "attrs": {"statement": "Do not overwrite ProviderSuspended or create another cancellation for terminal records; retain unresolved support markers and the original audit chain."}}
  - {"op": "add_node", "id": "REQ-015-076", "type": "Rule", "owner_fr": "FR-015", "title": "Deactivation disables login for the account and all team members", "attrs": {"statement": "Provider login disabled immediately for the provider account and all of its FR-009 team members"}}
  - {"op": "add_node", "id": "REQ-015-077", "type": "Rule", "owner_fr": "FR-015", "title": "Suspended provider keeps read-only access with an Account Suspended banner", "attrs": {"statement": "Provider can still log in to Provider Platform but sees \"Account Suspended\" banner; the same applies to all of the provider's FR-009 team members. The banner and the suspended read-only behavior are specified in FR-032 (Rule 6). Read-only includes `In Progress` bookings: the suspended provider cannot check in, end treatment, or edit the treatment plan; the admin decides the case through FR-006 Alternative Flow B7. The suspended provider may still chat with patients on its open `In Progress` and `Aftercare` cases. Clinical notes, photos, and aftercare answers and actions stay blocked until the admin reassigns or decides the case", "rationale": "The banner and read-only behavior are specified in FR-032 Rule 6."}}
  - {"op": "add_node", "id": "REQ-015-078", "type": "Rule", "owner_fr": "FR-015", "title": "Admin Support Required is an independent marker resolved by audited admin action", "attrs": {"statement": "This is an independent support marker, not a new patient journey stage or provider account status. Affected cases/inquiries must be identifiable and filterable through FR-016's admin workflow, with mandatory admin alerts through FR-020. The FR-020 admin-support alert goes to admins with the FR-031 Respond to Support permission. Opening the FR-016 list requires FR-031 View Patients, and Resolve Support requires Respond to Support. Admin resolution records a reason and audit event before clearing the marker; the cancellation cause remains. An inquiry's marker stays set while any linked provider-caused impact is unresolved. If an FR-034 support case is created/linked during assistance, retain its existing Open → In Progress → Resolved → Closed workflow. Automatic ticket creation is not introduced here.", "rationale": "Near-duplicate of REQ-015-018 and REQ-015-019 in this FR."}}
  - {"op": "add_node", "id": "REQ-015-079", "type": "Rule", "owner_fr": "FR-015", "title": "Reactivation permits new eligible activity only", "attrs": {"statement": "Performed through Screen 5 (Suspended providers only). Reactivation cancels any pending scheduled suspension or deactivation and permits new eligible activity only. It must not restore cancelled quotes/cases, reopen accepted selections, reinstate old reservations, restart payment windows, clear unresolved support markers, or restore the Featured flag.", "rationale": "Near-duplicate of REQ-015-021 and REQ-015-027 in this FR."}}
  - {"op": "add_node", "id": "REQ-015-080", "type": "Rule", "owner_fr": "FR-015", "title": "Reactivation modal rules", "attrs": {"statement": "Available only when provider status = Suspended; Deactivated providers can never be reactivated (Rule 4) On submit, status changes to Active immediately; the status event (reason, admin, timestamp) is logged in Tab 8 On submit, any pending scheduled suspension or deactivation is cancelled automatically; the cancellation is logged in Tab 8 with the reactivation reason and admin, and the reactivation email states that the scheduled change no longer applies (if the provider had been notified of it)", "rationale": "Screen 5 business rules and Alternative Flow A6 (reason 20-500 chars, admin password, confirm checkbox, Notify Provider default checked)."}}
  - {"op": "add_node", "id": "REQ-015-081", "type": "Rule", "owner_fr": "FR-015", "title": "Status change modal requires reason, password and confirmation", "attrs": {"statement": "Admin cannot suspend or deactivate provider without providing detailed reason (minimum 20 characters) Admin must explicitly check \"I confirm this action\" checkbox before \"Submit\" button enabled (prevents accidental suspension/deactivation) Reason is 20 to 500 characters; re-authentication is the acting admin's password (MFA once the FR-026 and FR-031 MFA stack is delivered).", "rationale": "Screen 4 data fields and business rules."}}
  - {"op": "add_node", "id": "REQ-015-082", "type": "Rule", "owner_fr": "FR-015", "title": "Effective Date: blank or today is immediate; a future date schedules", "attrs": {"statement": "A blank or today's Effective Date is treated as immediate and is never queued for the midnight UTC job. If admin selects a future Effective Date, the suspension or deactivation is stored as pending and applied automatically on that date (job processes scheduled suspensions and deactivations daily at midnight UTC), recalculating affected records at that time (A5). Until then the provider keeps its current status, and Screen 1 and the Screen 3 header show \"Scheduled: Suspend/Deactivate on DD-MM-YYYY\". Only one pending change per provider is allowed; an immediate suspension or deactivation replaces any pending change. Reactivating a provider through Screen 5 cancels any pending change automatically (logged in Tab 8 with the reactivation reason).", "rationale": "Screen 4 Scheduled Status Change bullet. Near-duplicate of REQ-015-028 in this FR."}}
  - {"op": "add_node", "id": "REQ-015-083", "type": "Rule", "owner_fr": "FR-015", "title": "Cancelling a scheduled change needs a reason, re-authentication and logging", "attrs": {"statement": "Before the Effective Date, an admin can cancel the pending change from Screen 1 or the Screen 3 header by entering a reason (min 20 chars) and re-authenticating. Scheduling, cancellation, and application are logged in Tab 8; the provider Owner is emailed about the cancellation (FR-020 `provider.scheduled_change_cancelled`) if they were notified of the scheduled change.", "rationale": "Near-duplicate of REQ-015-028 in this FR."}}
  - {"op": "add_node", "id": "REQ-015-084", "type": "Rule", "owner_fr": "FR-015", "title": "Affected cases and quotes are previewed before confirmation", "attrs": {"statement": "Before confirmation, show the affected provider's outstanding quotes and treatment cases, grouped by current FR-006 booking stage. Include `Accepted`, `Confirmed`, `In Progress`, and `Aftercare`, including FR-011 standalone aftercare cases assigned to this provider; exclude already terminal cases.", "rationale": "Alternative Flow A5 step 1 and the Screen 4 Affected Cases and Quotes field."}}
  - {"op": "add_node", "id": "REQ-015-085", "type": "Rule", "owner_fr": "FR-015", "title": "Terminal cases are not relabelled; care and money history is retained", "attrs": {"statement": "`Completed`, already `Cancelled`, and `Payment Window Expired` cases are not relabelled as new suspension or deactivation cancellations. Retain clinical notes, photos, completion milestones, accepted identifiers/versions, and payment/refund history. In Progress bookings awaiting the admin decision and Aftercare reassignments caused by suspension or deactivation must reach admins for clinical continuity and recovery support; automatic lifecycle cancellation does not itself transfer care or settle money; the admin replacement-provider transfer and its payment placeholder follow FR-006 Alternative Flow B5, and the aftercare reassignment follows FR-006 Alternative Flow B6 with no new acceptance or payment.", "rationale": "Near-duplicate of REQ-015-021 in this FR."}}
  - {"op": "add_node", "id": "REQ-015-086", "type": "Rule", "owner_fr": "FR-015", "title": "Account-closure request approval path", "attrs": {"statement": "Admin clicks \"Deactivate Provider\", which opens Screen 4 with Deactivate selected and the reason pre-filled as \"Provider requested account closure on [date]\" (editable, min 20 chars). Admin chooses immediate or scheduled deactivation, re-authenticates, and confirms. \"Notify Provider\" is checked and locked, because FR-032 promised the provider an email once the account is deactivated. When the deactivation takes effect, the system marks the FR-032 closure request Approved, links it to the deactivation status event, and logs both in Tab 8. If the admin scheduled the deactivation for a future Effective Date, the request stays Pending Admin Review until that date, and the Screen 1 marker reads \"Closure requested, deactivation scheduled DD-MM-YYYY\". If the scheduled deactivation is cancelled before it takes effect, the request stays Pending Admin Review, the marker returns to \"Closure Requested\", and no rejection email is sent.", "rationale": "Alternative Flow A7 steps 2, 3 and 5. There is no self-service deactivation."}}
  - {"op": "add_node", "id": "REQ-015-087", "type": "Rule", "owner_fr": "FR-015", "title": "Account-closure request rejection needs review notes", "attrs": {"statement": "If the admin rejects the request instead (e.g., the provider withdraws it), the admin enters review notes (required, min 20 chars); the request is marked Rejected, the provider stays Active, the Closure Requested marker clears, and the provider receives the FR-020 `provider.closure_rejected` email with the review notes (mandatory).", "rationale": "Alternative Flow A7 step 6."}}
  - {"op": "add_node", "id": "REQ-015-088", "type": "Rule", "owner_fr": "FR-015", "title": "Closure Requested marker on the provider list", "attrs": {"statement": "Rows with a pending FR-032 account-closure request show a \"Closure Requested — DD-MM-YYYY\" badge (request date) next to the status badge, linking to the request in the provider profile (A7). While a deactivation scheduled from the request is pending, the badge reads \"Closure requested, deactivation scheduled DD-MM-YYYY\" (Effective Date). The marker clears when the request is Approved (the deactivation has taken effect) or Rejected", "rationale": "Screen 1 business rule."}}
  - {"op": "add_node", "id": "REQ-015-089", "type": "Rule", "owner_fr": "FR-015", "title": "Dashboard default view and search", "attrs": {"statement": "Dashboard displays all providers with status = \"Active\" by default on initial load Search queries match against provider name, clinic name, email, medical license number (case-insensitive) Search Bar accepts at most 200 characters; Status Filter allows multiple selections; Commission Type Filter is Percentage, Flat Rate or All; Closure Requested Filter shows providers with a pending FR-032 closure request.", "rationale": "Screen 1 data fields and business rules."}}
  - {"op": "add_node", "id": "REQ-015-090", "type": "Rule", "owner_fr": "FR-015", "title": "Dashboard quick actions depend on provider status", "attrs": {"statement": "Each row includes action buttons: \"View Profile\", \"Edit\", \"Set Featured\" (if active and not featured), \"Unset Featured\" (if featured), \"Suspend\" (if active), \"Reactivate\" (if suspended; opens Screen 5), \"Deactivate\" (if active/suspended), \"Cancel Scheduled Change\" (if a scheduled suspension/deactivation is pending)"}}
  - {"op": "add_node", "id": "REQ-015-091", "type": "Rule", "owner_fr": "FR-015", "title": "Commission rate sorting groups by model", "attrs": {"statement": "Table columns sortable by name (alphabetical), created date (chronological), and commission rate. Commission rate sorting groups by model: all Percentage providers first, ordered by percentage value, then all Flat Rate providers, ordered by Flat Rate Currency (ISO code) and then amount. Descending order reverses the value order within each group; amounts in different currencies are never compared. A provider on the FR-029 global default sorts by the default value, in the group of the default model"}}
  - {"op": "add_node", "id": "REQ-015-092", "type": "Rule", "owner_fr": "FR-015", "title": "Commission Rate column shows the effective rate with Default and Scheduled tags", "attrs": {"statement": "Shows the provider's current effective commission. A provider on the FR-029 global default shows the default rate with \"(Default)\", for example \"15% (Default)\". A provider whose only provider-specific configuration is future-dated shows its current effective rate (the global default until the Effective Date) plus a \"Scheduled\" tag"}}
  - {"op": "add_node", "id": "REQ-015-093", "type": "Rule", "owner_fr": "FR-015", "title": "Last Activity Date derivation and date filter", "attrs": {"statement": "Last Activity Date is system-derived: the most recent of the provider's last FR-004 Parent Quote submission and last FR-006 booking confirmation (empty if neither has occurred); providers with no Last Activity Date are excluded when filtering by it. The Date Range Filter filters by provider creation date or Last Activity Date and needs a valid date range.", "rationale": "Screen 1 Date Range Filter field."}}
  - {"op": "add_node", "id": "REQ-015-094", "type": "Rule", "owner_fr": "FR-015", "title": "Status count tiles count all providers regardless of filters", "attrs": {"statement": "Status Count Tiles show counts of Active, Suspended and Deactivated providers above the table (SC-012), calculated from provider status; they count all providers regardless of active filters and refresh with real-time status updates.", "rationale": "Screen 1 data fields."}}
  - {"op": "add_node", "id": "REQ-015-095", "type": "Rule", "owner_fr": "FR-015", "title": "Dashboard badges, featured star and pagination", "attrs": {"statement": "Active (green), Suspended (yellow), Deactivated (red) Gold star icon displayed next to provider name if featured = true Display 50 providers per page, with page navigation controls"}}
  - {"op": "add_node", "id": "REQ-015-096", "type": "Rule", "owner_fr": "FR-015", "title": "Wizard and profile field limits", "attrs": {"statement": "First Name and Last Name max 50 chars; Bio/Description min 50, max 500 chars; Years of Experience numeric 0-60; Medical License Number max 50 chars; Clinic Name min 3, max 200 chars; Location City max 100 chars; Website URL valid http/https (https:// is prepended when missing); Profile Picture/Logo max 5MB, JPEG/PNG, min 200x200px; Cover Image max 10MB, JPEG/PNG; each award has name (max 100 chars), issuer (max 150 chars, optional), description (max 300 chars), year (1900 to current) and image (max 2MB, JPEG/PNG).", "rationale": "Screen 2 Steps 1 to 3 and Screen 3 Tabs 1 and 4 validation columns."}}
  - {"op": "add_node", "id": "REQ-015-097", "type": "Rule", "owner_fr": "FR-015", "title": "Specialty and country values come from managed lists", "attrs": {"statement": "Specialty values come from the centrally managed Provider Specialties list (FR-026 Screen 5f), active values only; a stored value later deactivated in FR-026 still displays but cannot be newly selected. Location country values come from the centrally managed country list (FR-026).", "rationale": "Screen 2 Step 2 and 3; Tab 1."}}
  - {"op": "add_node", "id": "REQ-015-098", "type": "Rule", "owner_fr": "FR-015", "title": "Languages: at least one, from the FR-021 catalog", "attrs": {"statement": "At least 1 language must be selected (validation prevents removing last language); attempting to save with none shows: \"At least one language is required.\" Language list consumed from the FR-021 central language catalog; chips mean languages spoken at the clinic, not UI language A stored language later removed from the catalog still displays but cannot be newly selected.", "rationale": "Screen 2 Step 2, Tab 2 and the FR-021 dependency."}}
  - {"op": "add_node", "id": "REQ-015-099", "type": "Rule", "owner_fr": "FR-015", "title": "The wizard saves no drafts and warns before leaving", "attrs": {"statement": "The wizard does not save drafts. If the admin has entered any data and tries to leave the wizard before \"Create Provider\" succeeds (in-app navigation, browser Back, or closing/reloading the tab), the system shows the FR-032 unsaved-changes message text, \"You have unsaved changes. Are you sure you want to leave?\", with only \"Stay\" and \"Leave\" actions. The FR-032 Save option is not offered, because the wizard has no drafts. \"Leave\" discards all entered data; for tab close or reload the browser's native leave-page prompt is used."}}
  - {"op": "add_node", "id": "REQ-015-100", "type": "Rule", "owner_fr": "FR-015", "title": "Commission and payout inputs: model, value, currency, start date, frequency", "attrs": {"statement": "Commission Model is Percentage (default) or Flat Rate. Percentage value is 0-100 with 0.1% precision; Flat Rate value is greater than 0 in the Flat Rate Currency's minor units, per FR-029. Flat Rate Currency is required for Flat Rate, taken from the FR-029 enabled currency list and defaulting to the system default currency. Commission Start Date is required, today (current UTC date) or a future date. Payout Frequency is required (Weekly, 2x a Month or Monthly) with no preselected value. System displays client-side validation error immediately: \"Percentage must be between 0-100%\" or \"Flat rate must be greater than 0.\" Server-side validation also enforces rules; the API returns a 422 validation error whose field message uses the same PRD wording if an invalid rate is submitted.", "rationale": "Screen 2 Step 5 and Tab 7 data fields; Implementation Notes validation applies on client and server."}}
  - {"op": "add_node", "id": "REQ-015-101", "type": "Rule", "owner_fr": "FR-015", "title": "Payout frequency periods", "attrs": {"statement": "Payout Frequency period definitions: Weekly = Monday to Sunday; 2x a Month = 1st to 15th then 16th to last day of month; Monthly = full calendar month.", "rationale": "Tab 7 Payout Frequency row."}}
  - {"op": "add_node", "id": "REQ-015-102", "type": "Rule", "owner_fr": "FR-015", "title": "Commission edit eligibility by provider status", "attrs": {"statement": "Commission settings and payout frequency can be edited for Active and Suspended providers (so terms can be fixed before reactivation). For Deactivated providers Tab 7 is read-only; history stays visible. FR-029 Screen 5 applies the same rule (CR-FR029-20261015-02). When a deactivation takes effect, the system automatically cancels any pending Scheduled Configuration and logs the cancellation in Commission History"}}
  - {"op": "add_node", "id": "REQ-015-103", "type": "Rule", "owner_fr": "FR-015", "title": "Scheduled commission configuration: at most one pending", "attrs": {"statement": "\"Today\" means the current UTC date (the same calendar used by the midnight UTC jobs). An edit with an Effective Date of today applies immediately to newly confirmed bookings. An edit with a future Effective Date is stored as the provider's Scheduled Configuration; at most one may be pending per provider. Saving another future-dated edit replaces the pending one (the replacement is logged in Commission History with both values). On its Effective Date the scheduled configuration becomes the current configuration automatically. The pending configuration is shown read-only to the provider in the FR-032 Screen 4 Commission & Payout panel."}}
  - {"op": "add_node", "id": "REQ-015-104", "type": "Rule", "owner_fr": "FR-015", "title": "Commission edit removes the provider from a shared FR-029 scope", "attrs": {"statement": "A provider belongs to at most one active provider-specific commission scope. If this provider is currently covered by an FR-029 scope shared with other providers, saving a commission edit here removes this provider from that shared scope and creates a single-provider scope for it with the new values; the other providers in the shared scope are unchanged. The tab warns the admin before saving, and the split is logged in Commission History and the FR-029 audit trail."}}
  - {"op": "add_node", "id": "REQ-015-105", "type": "Rule", "owner_fr": "FR-015", "title": "Payout frequency changes take effect from the next billing cycle", "attrs": {"statement": "Payout frequency changes take effect from the next billing cycle — the current in-progress cycle is not affected"}}
  - {"op": "add_node", "id": "REQ-015-106", "type": "Rule", "owner_fr": "FR-015", "title": "Commission and payout changes are logged with old and new values", "attrs": {"statement": "All changes to commission and payout frequency logged in history with timestamp, admin user, old/new values"}}
  - {"op": "add_node", "id": "REQ-015-107", "type": "Rule", "owner_fr": "FR-015", "title": "Provider-specific commission stays synchronized with FR-029 Screen 5", "attrs": {"statement": "Changes made to provider-specific commission values here MUST stay synchronized with the provider-specific commission data shown in FR-029 Screen 5 for the same provider"}}
  - {"op": "add_node", "id": "REQ-015-108", "type": "Rule", "owner_fr": "FR-015", "title": "Tab 7 is the single-provider commission surface and owns payout frequency for FR-017", "attrs": {"statement": "FR-029 / A-09 owns the central commission-settings screen (global default + provider-specific commission scopes) and the booking-time snapshot policy; this tab remains the single-provider management surface for provider-specific commission configuration and owns payout frequency used by FR-017 FR-017 reads the payout frequency set here to determine when to generate payout statements for this provider"}}
  - {"op": "add_node", "id": "REQ-015-109", "type": "Rule", "owner_fr": "FR-015", "title": "Commission edits apply to bookings confirmed after the Effective Date", "attrs": {"statement": "Commission edits apply to bookings confirmed after the configuration becomes effective, not to every later payment transaction. Resolve the effective provider-specific configuration (or global default) and snapshot its model/value (and Flat Rate currency) at FR-006 booking confirmation under FR-029. Until a new configuration's Effective Date, the previous configuration remains effective. Existing confirmed bookings retain that snapshot for subsequent installments, deductions, and payout reconciliation. Patient price/currency/exchange-rate context is locked at FR-005 acceptance; commission is locked at booking confirmation; nothing is fixed at quote creation. An accepted-but-unpaid selection has not yet fixed its commission snapshot. The Percentage and Flat Rate models remain unchanged; a flat fee remains one deduction per completed procedure, not one per package, Subquote, or installment.", "rationale": "Near-duplicate of REQ-015-022 and General Module Rule 5 in this FR."}}
  - {"op": "add_node", "id": "REQ-015-110", "type": "Rule", "owner_fr": "FR-015", "title": "Commission and payout edits require admin re-authentication", "attrs": {"statement": "Admin can edit commission settings and payout frequency (requires re-authentication). In MVP this is implemented as password re-entry; once the shared MFA stack from FR-026 / FR-031 is delivered, these actions MUST use MFA-based re-authentication and any MFA references in this FR are to be understood as future (non-MVP) behavior."}}
  - {"op": "add_node", "id": "REQ-015-111", "type": "Rule", "owner_fr": "FR-015", "title": "Seat limit changes require admin re-authentication", "attrs": {"statement": "Seat Limit changes require admin re-authentication for security. In MVP this is implemented as password re-entry; once the shared MFA stack from FR-026 / FR-031 is delivered, these actions MUST use MFA-based re-authentication and any MFA references in this FR are to be understood as future (non-MVP) behavior."}}
  - {"op": "add_node", "id": "REQ-015-112", "type": "Rule", "owner_fr": "FR-015", "title": "Saves apply changed fields only; last save wins", "attrs": {"statement": "An admin save (FR-015) or provider save (FR-032) applies only the fields the user changed; untouched fields are not rewritten. Last save wins only when two people change the same field. There is no conflict check and no conflict message.", "rationale": "Concurrent-edit edge case: no conflict check and no conflict message."}}
  - {"op": "add_node", "id": "REQ-015-113", "type": "Rule", "owner_fr": "FR-015", "title": "Profile edits never alter accepted snapshots or booking commission snapshots", "attrs": {"statement": "Current profile edits must not alter an FR-005 accepted snapshot, historical appointment/price/package context, or an FR-006 booking commission snapshot. This does not prevent normal current-profile synchronization with FR-032."}}
  - {"op": "add_node", "id": "REQ-015-114", "type": "Rule", "owner_fr": "FR-015", "title": "Owner login email change", "attrs": {"statement": "Changing the Email Address (the Owner's login ID) requires admin password re-authentication and a reason (the admin change reason above). The new address is validated against the FR-009 global provider email identity rule (REQ-015-014) before saving. The Owner does not confirm the new address. On save, the system: sends FR-020 `provider.login_email_changed` (mandatory security notice) to the old address, saying the login email was changed to the new address (partly masked) by a Hairline admin, with the date and time and a prompt to contact support if unexpected, and to the new address, saying it is now the login email for the clinic; signs the Owner out of all sessions and revokes the Owner's tokens; if `password_set` is false, invalidates the pending activation link and sends a new activation email (FR-020 `provider.activation`) to the new address."}}
  - {"op": "add_node", "id": "REQ-015-115", "type": "Rule", "owner_fr": "FR-015", "title": "Seat limit below current team size warns and needs admin confirmation", "attrs": {"statement": "System validates seat limit against current team size, meaning FR-009 seat usage (non-Owner team members with status Active or Suspended plus invitations with status Pending that are not past expiry; the Owner, Removed members, and Expired, Cancelled, or Accepted invitations do not count (FR-009 Rule 6, CR-FR009-20261028-01)). If seat limit is set below current count (e.g., provider has 50 staff but admin sets limit to 30), system displays warning: \"Current team size (50) exceeds new seat limit (30). Existing team members will not be removed, but no new invitations can be sent until limit is increased or team size is reduced.\" Admin must confirm to proceed. Existing team members remain active; only new invitations are blocked."}}
  - {"op": "add_node", "id": "REQ-015-116", "type": "Rule", "owner_fr": "FR-015", "title": "Staff tab: invite blocked at the seat limit or when not Active", "attrs": {"statement": "Invite is blocked when the provider's Seat Limit (Rule 7) is reached and when provider status is Suspended or Deactivated. \"Invite Staff Member\": admin enters an email and selects one of the provider's existing roles (not Owner); the invitation uses FR-009's normal invitation email, acceptance, and expiry flow. Requires the FR-031 \"Edit Providers\" permission; the invite and the inviting admin are logged in FR-009's audit trail and Tab 8. Existing FR-009 admin actions (force suspend member, reset invitation, view audit log, impersonate) remain available.", "rationale": "Tab 3 embeds FR-009 Screen 12. Overlaps FR-009 REQ-009-024 and REQ-009-143."}}
  - {"op": "add_node", "id": "REQ-015-117", "type": "Rule", "owner_fr": "FR-015", "title": "Reviews tab defers review actions to FR-013", "attrs": {"statement": "Admin insert, edit, and remove actions follow FR-013 (including the \"Verified Off-platform\" label, verification source/date, and audit trail); FR-015 does not define its own review editing rules Providers cannot edit or delete reviews; they can only respond via FR-013 Screen 6", "rationale": "Tab 5 business rules."}}
  - {"op": "add_node", "id": "REQ-015-118", "type": "Rule", "owner_fr": "FR-015", "title": "Activity log content, immutability, filters", "attrs": {"statement": "Activity log displays all actions: profile edits, status changes, document uploads, logins, commission changes Each log entry includes: timestamp, user (admin or provider via FR-032), action type, changed fields, IP address Logs are immutable (cannot be edited or deleted) Admin can filter by action type, date range, user", "rationale": "Tab 8 business rules."}}
  - {"op": "add_node", "id": "REQ-015-119", "type": "Rule", "owner_fr": "FR-015", "title": "Suspension entries link affected records and show Admin Support Required", "attrs": {"statement": "Suspension/deactivation entries must link the affected case/inquiry references, prior stages, cancellation causes, support markers, slot-release results, and notification outcomes. Display `Admin Support Required` for unresolved provider-caused cancellations with a link to the existing FR-016 patient intervention/support context; do not add a case-management editor to this tab."}}
  - {"op": "add_node", "id": "REQ-015-120", "type": "Rule", "owner_fr": "FR-015", "title": "Activity log CSV export", "attrs": {"statement": "Admin can export the activity log for compliance reporting as a CSV file of the rows matching the current filters. Export is available to every admin who can view Tab 8 (FR-031 View Providers). IP addresses are included unmasked. The export action itself is logged in Tab 8"}}
  - {"op": "add_node", "id": "REQ-015-121", "type": "Rule", "owner_fr": "FR-015", "title": "Login as Provider is Super Admin only and opens in a new tab", "attrs": {"statement": "Login as Provider is allowed when the provider is Active or Suspended. It is blocked when the provider is Deactivated, with the message: \"Login as Provider is not available for a deactivated provider.\" These rules apply both to impersonating the Owner and to impersonating a team member (FR-009 REQ-009-023). The impersonation session opens in a new browser tab; the admin's own Admin Platform tab stays open. Session start (with reason), end, and every write action performed during the session are logged in Tab 8: Activity Log, attributed to the admin user acting as the provider. Login as Provider is Super Admin only (Screen 3 header quick actions; Security Considerations Authorization).", "rationale": "Overlaps REQ-015-026 and FR-009 REQ-009-023."}}
  - {"op": "add_node", "id": "REQ-015-122", "type": "Rule", "owner_fr": "FR-015", "title": "Header quick actions are shown only for the matching status", "attrs": {"statement": "\"Reactivate\" (visible only if Suspended; opens Screen 5) \"Cancel Scheduled Change\" (visible only if a scheduled suspension/deactivation is pending; see Screen 4)"}}
  - {"op": "add_node", "id": "REQ-015-123", "type": "Rule", "owner_fr": "FR-015", "title": "Admin save of provider data keeps per-tab permission and reason", "attrs": {"statement": "Fields marked \"Both\" can be edited by provider via FR-032 and changes sync to admin view in real-time", "rationale": "Tab 1 business rules; Both-fields sync in real time."}}
