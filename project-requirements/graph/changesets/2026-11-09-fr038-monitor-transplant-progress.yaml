  - {"op": "add_node", "id": "REQ-038-046", "type": "Rule", "owner_fr": "FR-038", "title": "V1 3D head scan means the standardized multi-view photo set", "attrs": {"statement": "In V1, all references to a “3D head scan” mean the standardized multi-view head scan photo set defined by FR-002; true 3D capture and viewing remain V2 scope.", "rationale": "Executive Summary (V1 scan terminology) and Screen 4 (V1 does not require true 3D reconstruction)."}}
  - {"op": "add_node", "id": "REQ-038-047", "type": "Rule", "owner_fr": "FR-038", "title": "Capture guidance and quality and completeness checks", "attrs": {"statement": "Scan capture shows front, top, left, and right guidance, and the standardized multi-view photo set must pass quality and completeness checks under the FR-002 V1 contract."}}
  - {"op": "add_node", "id": "REQ-038-048", "type": "Rule", "owner_fr": "FR-038", "title": "Failed-quality scan may be retaken before save", "attrs": {"statement": "A failed-quality scan may be retaken before save."}}
  - {"op": "add_node", "id": "REQ-038-049", "type": "Rule", "owner_fr": "FR-038", "title": "Scan history grouped by date, current case only", "attrs": {"statement": "Scan history lists prior scans grouped by date, for the current case only."}}
  - {"op": "add_node", "id": "REQ-038-050", "type": "Rule", "owner_fr": "FR-038", "title": "Provider access to copied data begins only under FR-011 authorization", "attrs": {"statement": "Provider access to information copied from FR-038 begins only under FR-011 authorization after assignment and activation.", "rationale": "Module Scope (provider access begins only if a converted FR-011 request completes assignment and activation), Screen 4 (scans remain inaccessible to providers unless later transferred into an activated FR-011 case under FR-011 rules) and Data & Privacy Rules."}}
