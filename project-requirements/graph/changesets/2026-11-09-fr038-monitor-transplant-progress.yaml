  - {"op": "add_node", "id": "REQ-038-061", "type": "Rule", "owner_fr": "FR-038", "title": "Admin case list: all cases, paginated, status filter, permission-scoped search", "attrs": {"statement": "Admin Monitoring Cases lists all transplant-progress monitoring cases, paginated, with a status filter (active, completed, converted) and search by patient or case identifier within the Admin's permission scope.", "rationale": "Module Scope (Admin views all self-service cases and supports the patient when needed) and Entry Points (Admin filters Type = Transplant Progress). Digest of the Screen 8 field table."}}
  - {"op": "add_node", "id": "REQ-038-062", "type": "Rule", "owner_fr": "FR-038", "title": "Entry points to transplant-progress monitoring", "attrs": {"statement": "Patient selects Aftercare: Monitor Transplant Progress from FR-003 Screen 1: Service Selection. Patient opens the active case from the patient home/dashboard monitoring card. Admin opens Monitoring Cases and filters Type = Transplant Progress. Patient selects Switch to Aftercare Package from active-case actions or the completion screen."}}
  - {"op": "add_node", "id": "REQ-038-063", "type": "Rule", "owner_fr": "FR-038", "title": "No FR-012 messaging; no FR-011 milestone communications before activation", "attrs": {"statement": "FR-038 includes no FR-012 secure messaging, and FR-011 milestone/task communications do not begin before standalone aftercare is purchased, assigned, and activated."}}
  - {"op": "add_node", "id": "REQ-038-064", "type": "Rule", "owner_fr": "FR-038", "title": "Current summary PDF generated when conversion starts", "attrs": {"statement": "System generates the current monitoring-summary PDF when the patient selects Switch to Aftercare Package.", "rationale": "Screen 6 Monitoring Summary PDF (current date-to-date report, system-generated)."}}
  - {"op": "add_node", "id": "REQ-038-065", "type": "Rule", "owner_fr": "FR-038", "title": "Package availability and compatibility governed by FR-011 templates", "attrs": {"statement": "Available aftercare packages and treatment compatibility are governed by FR-011 templates.", "rationale": "Screen 6 Available Aftercare Services (FR-011 compatibility and availability). Promoted from Business Process Assumptions."}}
  - {"op": "add_node", "id": "REQ-038-066", "type": "Rule", "owner_fr": "FR-038", "title": "Package selected and fields valid before checkout", "attrs": {"statement": "Patient selects an available aftercare package and continues to FR-011 checkout only when a package is selected and the fields are valid."}}
  - {"op": "add_node", "id": "REQ-038-067", "type": "Rule", "owner_fr": "FR-038", "title": "Only reviewed data is transferred to FR-011", "attrs": {"statement": "Only data explicitly reviewed in the conversion draft is transferred to FR-011.", "rationale": "Promoted from Security Considerations; Assumptions say patients review copied external-treatment information before conversion."}}
  - {"op": "add_node", "id": "REQ-038-068", "type": "Rule", "owner_fr": "FR-038", "title": "Failed or abandoned conversion preserves the case and the conversion draft", "attrs": {"statement": "When FR-011 request validation or creation does not complete, System preserves the active monitoring case and the conversion draft, and the patient can correct information, retry, or return to monitoring.", "rationale": "REQ-038-015 states the active-case half of this rule."}}
