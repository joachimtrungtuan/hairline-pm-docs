  # --- Rules: REQ-038-001..017 verbatim from Functional Requirements Summary; prose rules without an id get REQ-038-018 onward
  - {"op": "add_node", "id": "REQ-038-001", "type": "Rule", "owner_fr": "FR-038", "title": "One active monitoring case per patient", "attrs": {"statement": "System MUST enforce one active transplant-progress monitoring case per patient.", "rationale": "Restated by General Rule 1 (one active case per monitoring type), Screen 1 (a patient may have only one active transplant-progress case), Main Flow step 2 (System checks that no active transplant-progress case exists), Alternative Flow B1 and Admin Editability (one-active-case-per-type enforcement is fixed in codebase)."}}
  - {"op": "add_node", "id": "REQ-038-002", "type": "Rule", "owner_fr": "FR-038", "title": "Self-service only: no provider advice, assignment, queue or data access", "attrs": {"statement": "FR-038 MUST remain self-service only with no provider advice, assignment, queue, or data access.", "rationale": "Restated by General Rule 2, Module Scope (Provider Platform not applicable: no operational surface, no provider assigned, no provider dashboard, advice, chat, review queue or patient-data access), Screen 2 (no provider identity or advice controls appear), Provider Platform Screens (no list, detail, advice, assignment or media-access surface) and Admin Editability (self-service-only restriction and provider-access prohibition are fixed in codebase). Executive Summary and Business Process Assumptions give the reason: avoiding clinic conflicts of interest and preventing a free self-tracking tool from being represented as managed aftercare. Communication Structure puts provider advice, assignment, chat, clinic review, diagnosis and prescriptions out of scope."}}
  - {"op": "add_node", "id": "REQ-038-003", "type": "Rule", "owner_fr": "FR-038", "title": "Optional dated logs with severity, notes, photos and head scan", "attrs": {"statement": "Patient MUST be able to record optional dated logs with severity 1 to 10, notes, photos, and V1 head scan photo sets.", "rationale": "Restated by Module Scope (adds optional logs on any date with recovery severity/condition rating, notes, photos and V1 head scan photo sets) and Main Flow steps 6 and 7."}}
  - {"op": "add_node", "id": "REQ-038-004", "type": "Rule", "owner_fr": "FR-038", "title": "No required cadence, milestones, overdue status or compliance", "attrs": {"statement": "System MUST NOT impose required cadence, milestones, overdue status, or compliance obligations.", "rationale": "Restated by General Rule 3 (logging frequency is entirely optional; no overdue, missed-task, compliance or milestone state), Screen 2 (the system must not display overdue, missed milestone, compliance or required-frequency states), Executive Summary and Main Flow step 8 (timeline, scan history and severity trend update without overdue states)."}}
  - {"op": "add_node", "id": "REQ-038-005", "type": "Rule", "owner_fr": "FR-038", "title": "Patient completes the case and exports a date-to-date PDF", "attrs": {"statement": "Patient MUST be able to complete the case and export a date-to-date PDF summary.", "rationale": "Restated by Alternative Flow A1 and Screens 5 and 7."}}
  - {"op": "add_node", "id": "REQ-038-006", "type": "Rule", "owner_fr": "FR-038", "title": "Convert an active case into a distinct FR-011 standalone request", "attrs": {"statement": "Patient MUST be able to convert an active case into a distinct FR-011 standalone-aftercare request.", "rationale": "Restated by Alternative Flow A2 and Screens 5 and 6."}}
  - {"op": "add_node", "id": "REQ-038-007", "type": "Rule", "owner_fr": "FR-038", "title": "Intake captures FR-011-compatible external treatment details", "attrs": {"statement": "Initial intake MUST capture FR-011-compatible external treatment details.", "rationale": "Restated by Main Flow step 3, Module Scope and Screen 1 purpose (information compatible with FR-011 standalone aftercare)."}}
  - {"op": "add_node", "id": "REQ-038-008", "type": "Rule", "owner_fr": "FR-038", "title": "Conversion pre-fills compatible data; every copied field editable", "attrs": {"statement": "Conversion MUST pre-fill compatible information and allow the patient to edit all copied fields.", "rationale": "Restated by Alternative Flow A2 steps 3 and 5, Screen 6 (every copied field is editable before standalone request creation; the patient may replace copied documentation) and the Executive Summary."}}
  - {"op": "add_node", "id": "REQ-038-009", "type": "Rule", "owner_fr": "FR-038", "title": "Latest valid scan selected by default; another scan or retake allowed", "attrs": {"statement": "Conversion MUST select the latest valid scan by default and allow another scan or retake.", "rationale": "Restated by Alternative Flow A2 step 4, Screen 6 (Selected Head Scan: latest valid scan by default, another scan, or retake) and Edge Cases (latest scan fails quality and an earlier valid scan is selected during conversion)."}}
  - {"op": "add_node", "id": "REQ-038-010", "type": "Rule", "owner_fr": "FR-038", "title": "Conversion attaches a summary PDF", "attrs": {"statement": "Conversion MUST attach a PDF containing treatment summary, logs, scan photos, logged-day count, and severity summary.", "rationale": "Restated by Executive Summary (carries the monitoring-summary PDF into the aftercare request) and Integration Points (FR-011 receives the generated PDF and must accept it as treatment documentation or additional case context)."}}
  - {"op": "add_node", "id": "REQ-038-011", "type": "Rule", "owner_fr": "FR-038", "title": "No history attached to a new case; provenance links only source and destination", "attrs": {"statement": "Previous monitoring history MUST NOT attach to a new monitoring case; conversion provenance MUST link only the source case and destination FR-011 request.", "rationale": "Restated by General Rule 4 (previous monitoring history is not linked to a new monitoring case; conversion links only the source FR-038 case to its destination FR-011 standalone request) and Screen 1 (prior monitoring-case history is not attached when starting a new monitoring case)."}}
  - {"op": "add_node", "id": "REQ-038-012", "type": "Rule", "owner_fr": "FR-038", "title": "Data restricted to the patient and authorized Admin users", "attrs": {"statement": "System MUST restrict FR-038 data to the patient and authorized Admin users.", "rationale": "Restated by Data & Privacy Rules (access is restricted to the patient and authorized Admin users while data belongs to FR-038), Screen 7 (Head Scan Photos: authorized access only) and Screen 9 (Conversion Link: authorized access only)."}}
  - {"op": "add_node", "id": "REQ-038-013", "type": "Rule", "owner_fr": "FR-038", "title": "All medical-data access, edits, exports and conversions audited", "attrs": {"statement": "System MUST audit all medical-data access, edits, exports, and conversions.", "rationale": "Restated by Data & Privacy Rules (every view, edit, export and conversion is audited), Module Scope (Admin edits with audit history) and Communication Structure (Admin support actions visible in audit history where appropriate)."}}
  - {"op": "add_node", "id": "REQ-038-014", "type": "Rule", "owner_fr": "FR-038", "title": "Admin edits keep version history and need a reason", "attrs": {"statement": "Admin edits MUST preserve version history and require a reason.", "rationale": "Restated by Module Scope (Admin edits carry actor, timestamp, reason, before-value and after-value), Admin Editability (edits require permission, a reason and version history) and Screen 9 (Edit Reason: required before save for any mutation)."}}
  - {"op": "add_node", "id": "REQ-038-015", "type": "Rule", "owner_fr": "FR-038", "title": "Case stays active unless conversion commits or the patient completes", "attrs": {"statement": "Monitoring MUST remain active if FR-011 request creation fails and MUST terminate only after successful conversion commit or explicit completion.", "rationale": "Restated by Alternative Flow A2 step 7 and B2 (no partial conversion is committed), Screen 5 (conversion ends the case only when the FR-011 standalone request is successfully created), Executive Summary and User Story 3 scenario 4."}}
  - {"op": "add_node", "id": "REQ-038-016", "type": "Rule", "owner_fr": "FR-038", "title": "Conversion is idempotent; no duplicate standalone requests", "attrs": {"statement": "Conversion MUST be idempotent and MUST NOT create duplicate standalone-aftercare requests.", "rationale": "Restated by Module Scope (idempotent transfer), Admin Editability (conversion idempotency is fixed in codebase), Edge Cases (conversion retried after network timeout) and Implementation Notes (idempotency key on the conversion record)."}}
  - {"op": "add_node", "id": "REQ-038-017", "type": "Rule", "owner_fr": "FR-038", "title": "FR-011 owns everything after a successful handoff", "attrs": {"statement": "After successful handoff, FR-011 MUST exclusively own package selection, payment, assignment, activation, milestones, and provider-managed aftercare.", "rationale": "Restated by General Rule 6, Alternative Flow A2 step 8, Admin Editability (FR-011 ownership after successful handoff is fixed in codebase) and Executive Summary."}}
  - {"op": "add_node", "id": "REQ-038-018", "type": "Rule", "owner_fr": "FR-038", "title": "An active FR-038 case does not block an active FR-037 case", "attrs": {"statement": "An active FR-038 case does not block an active FR-037 case.", "rationale": "Second clause of General Rule 1; the first clause (one active case per monitoring type) is REQ-038-001."}}
  - {"op": "add_node", "id": "REQ-038-019", "type": "Rule", "owner_fr": "FR-038", "title": "Duplicate creation blocked; Resume Monitoring or End Existing Case offered", "attrs": {"statement": "When an active transplant-progress case already exists, System blocks duplicate creation and the patient can Resume Monitoring or End Existing Case."}}
  - {"op": "add_node", "id": "REQ-038-020", "type": "Rule", "owner_fr": "FR-038", "title": "Intake required and optional fields with validation", "attrs": {"statement": "Intake requires treatment date (not in the future), treatment type (an active treatment-type value), treating clinic (1 to 200 characters), initial severity (integer 1 to 10) and the self-service acknowledgment. Treating country (an active FR-028 country), treatment documentation (PDF, JPG or PNG, maximum 10MB each), current concerns (maximum 2000 characters), initial photos (maximum 5, secure image limits) and an initial head scan (FR-002 quality contract) are optional.", "rationale": "Digest of the Required and Validation Rules columns of the Screen 1 field table."}}
  - {"op": "add_node", "id": "REQ-038-021", "type": "Rule", "owner_fr": "FR-038", "title": "Consent review and self-tracking confirmation", "attrs": {"statement": "Patient reviews consent and confirms this is self-tracking, not managed aftercare.", "rationale": "Main Flow step 4. Screen 1 Self-Service Acknowledgment (confirms no provider monitoring or required cadence) is required and must be selected before the case is created. Patient profile and consent state are listed under Data Dependencies."}}
  - {"op": "add_node", "id": "REQ-038-022", "type": "Rule", "owner_fr": "FR-038", "title": "Self-tracking is not medical advice or provider-monitored aftercare", "attrs": {"statement": "The system must clearly state that self-tracking is not medical advice or provider-monitored aftercare."}}
  - {"op": "add_node", "id": "REQ-038-023", "type": "Rule", "owner_fr": "FR-038", "title": "Intake does not purchase aftercare or create an FR-011 request", "attrs": {"statement": "This intake does not purchase aftercare and does not create an FR-011 request."}}
  - {"op": "add_node", "id": "REQ-038-024", "type": "Rule", "owner_fr": "FR-038", "title": "Valid intake creates an active self-service case", "attrs": {"statement": "System creates active self-service case.", "rationale": "Main Flow step 5. User Story 1 scenario 1 adds that the case opens without provider assignment."}}
  - {"op": "add_node", "id": "REQ-038-025", "type": "Rule", "owner_fr": "FR-038", "title": "Severity 1 is least severe, 10 is most severe", "attrs": {"statement": "Severity 1 means least severe and 10 means most severe.", "rationale": "Promoted from User Behavior Assumptions because it defines the meaning of every severity value stored."}}
  - {"op": "add_node", "id": "REQ-038-026", "type": "Rule", "owner_fr": "FR-038", "title": "Log required and optional fields with validation", "attrs": {"statement": "A log requires a log date (not in the future and not before the treatment date) and a severity (integer 1 to 10). Notes (maximum 3000 characters), photos (secure image limits) and a head scan (V1 photo set, FR-002 quality contract) are optional.", "rationale": "Digest of the Required and Validation Rules columns of the Screen 3 field table."}}
  - {"op": "add_node", "id": "REQ-038-027", "type": "Rule", "owner_fr": "FR-038", "title": "Patient may create, edit or delete own entries while active; versions auditable", "attrs": {"statement": "Patient may create, edit, or delete their own entries while active; versions remain auditable.", "rationale": "Implementation Notes add append-only versions for patient and Admin edits that affect medical context."}}
  - {"op": "add_node", "id": "REQ-038-028", "type": "Rule", "owner_fr": "FR-038", "title": "Multiple entries on one date; Logged Days counts a date once", "attrs": {"statement": "Multiple entries on one date are allowed, but Logged Days counts that date once.", "rationale": "Screen 2 defines Logged Days as the unique dates with entries; Edge Cases cover several entries and scans on one date."}}
