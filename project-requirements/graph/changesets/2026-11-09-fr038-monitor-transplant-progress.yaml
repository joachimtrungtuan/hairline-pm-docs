  - {"op": "add_node", "id": "REQ-038-043", "type": "Rule", "owner_fr": "FR-038", "title": "Completed or converted case is read-only except Admin correction", "attrs": {"statement": "A completed or converted case is read-only except for Admin audited correction.", "rationale": "User Story 2 scenario 1 (the case becomes read-only when completion is confirmed)."}}
