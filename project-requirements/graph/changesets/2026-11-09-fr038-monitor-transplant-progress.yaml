  - {"op": "add_node", "id": "REQ-038-038", "type": "Rule", "owner_fr": "FR-038", "title": "Completion previews date range, logged days, scan count and severity trend", "attrs": {"statement": "Before completion, System previews the monitoring date range, logged-day count, scan count, and severity trend.", "rationale": "Alternative Flow A1 step 2 and the Screen 5 Case Summary (derived)."}}
  - {"op": "add_node", "id": "REQ-038-039", "type": "Rule", "owner_fr": "FR-038", "title": "Explicit completion ends the case immediately after confirmation", "attrs": {"statement": "Explicit completion ends the case immediately after confirmation.", "rationale": "Alternative Flow A1 steps 3 and 4. Screen 5 requires the patient to select the Confirmation checkbox (acknowledges the current monitoring case will end) and a single Completion Choice."}}
  - {"op": "add_node", "id": "REQ-038-040", "type": "Rule", "owner_fr": "FR-038", "title": "Completion PDF content", "attrs": {"statement": "PDF includes treatment summary, complete date-to-date log, scan photos, logged-day count, and severity summary.", "rationale": "Alternative Flow A1 step 5 and User Story 2 scenario 2. REQ-038-010 states the same content for the PDF attached at conversion."}}
