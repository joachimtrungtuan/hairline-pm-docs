  - {"op": "add_node", "id": "REQ-038-030", "type": "Rule", "owner_fr": "FR-038", "title": "Invalid pre-treatment log dates flagged for review, not deleted", "attrs": {"statement": "When the treatment date is corrected after several logs, invalid pre-treatment log dates are flagged for review rather than silently deleted."}}
  - {"op": "add_node", "id": "REQ-038-031", "type": "Rule", "owner_fr": "FR-038", "title": "Reminders are patient-chosen, optional and never mandatory", "attrs": {"statement": "Reminders are chosen by the patient and may be disabled without affecting case status; reminders cannot become mandatory milestones or compliance checks.", "rationale": "Communication Structure (reminders chosen by the patient), Screen 2 (optional personal reminders may be disabled without affecting case status) and Admin Editability (optional patient reminder defaults may be configured, but cannot become mandatory milestones or compliance checks)."}}
  - {"op": "add_node", "id": "REQ-038-032", "type": "Rule", "owner_fr": "FR-038", "title": "Calendar uses the patient-local timezone", "attrs": {"statement": "The calendar shows dates with logs and scans in the patient-local timezone."}}
  - {"op": "add_node", "id": "REQ-038-033", "type": "Rule", "owner_fr": "FR-038", "title": "Add Log, Switch to Aftercare Package and End Monitoring need an active case", "attrs": {"statement": "Add Log, Switch to Aftercare Package, and End Monitoring are available on an active case only."}}
  - {"op": "add_node", "id": "REQ-038-034", "type": "Rule", "owner_fr": "FR-038", "title": "Severity summary derived from the severity ratings", "attrs": {"statement": "Severity Summary shows first, latest, minimum, maximum, average, and trend of the severity ratings.", "rationale": "Screen 2 Severity Trend is the rating over time (derived); Main Flow step 8 updates the severity trend as entries change; Scalability says trend summaries may be cached while source entries stay authoritative."}}
