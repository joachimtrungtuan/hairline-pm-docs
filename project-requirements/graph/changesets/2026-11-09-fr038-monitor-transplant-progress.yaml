  - {"op": "add_node", "id": "REQ-038-052", "type": "Rule", "owner_fr": "FR-038", "title": "Case records and PDF exports retained 7 years", "attrs": {"statement": "Case records, entries, conversion provenance, and PDF exports are retained for 7 years after completion or conversion."}}
  - {"op": "add_node", "id": "REQ-038-053", "type": "Rule", "owner_fr": "FR-038", "title": "Raw scan media retained 2 years", "attrs": {"statement": "Raw monitoring scan media is retained for 2 years after completion or conversion unless legal or consent policy requires longer."}}
  - {"op": "add_node", "id": "REQ-038-054", "type": "Rule", "owner_fr": "FR-038", "title": "PDF and media download links expire and recheck authorization", "attrs": {"statement": "PDF and media download links must expire and recheck authorization.", "rationale": "Screen 7 Download PDF uses a signed access link; Security Considerations repeat the recheck."}}
  - {"op": "add_node", "id": "REQ-038-055", "type": "Rule", "owner_fr": "FR-038", "title": "Admin may edit all case information for operational correction", "attrs": {"statement": "Admin may edit all monitoring intake information, entries, severity ratings, scan metadata, status, exports, and conversion metadata when operational correction is required.", "rationale": "Module Scope (Admin Platform: full case visibility and audited editing) and Screen 9 Case Data (permission controlled)."}}
  - {"op": "add_node", "id": "REQ-038-056", "type": "Rule", "owner_fr": "FR-038", "title": "Admin cannot erase version history, exports or conversion provenance", "attrs": {"statement": "Admin may edit any information but cannot erase version history, exports, or conversion provenance."}}
  - {"op": "add_node", "id": "REQ-038-057", "type": "Rule", "owner_fr": "FR-038", "title": "Admin edit validated for permission and value, then saved as a new version", "attrs": {"statement": "System validates permission and value before saving a new version of an edited monitoring case.", "rationale": "Alternative Flow A3 steps 3 and 4."}}
  - {"op": "add_node", "id": "REQ-038-058", "type": "Rule", "owner_fr": "FR-038", "title": "Audit history is immutable and records actor, reason, time, before and after", "attrs": {"statement": "Audit history is immutable and records actor, reason, time, and before and after values; a saved Admin edit creates an immutable before-and-after audit event.", "rationale": "Alternative Flow A3 step 4, Screen 9 Audit History, Admin Editability (audit immutability fixed in codebase)."}}
  - {"op": "add_node", "id": "REQ-038-059", "type": "Rule", "owner_fr": "FR-038", "title": "Admin cannot assign a provider; conversion to FR-011 is the only route", "attrs": {"statement": "Admin cannot assign a provider to FR-038; the patient must convert to FR-011 for managed aftercare.", "rationale": "Module Scope (Admin cannot turn an FR-038 case into provider-managed monitoring), Screen 8 (no assignment queue or provider field) and Business Process Assumptions (FR-011 standalone aftercare remains the only route from self-tracking to provider-managed aftercare)."}}
