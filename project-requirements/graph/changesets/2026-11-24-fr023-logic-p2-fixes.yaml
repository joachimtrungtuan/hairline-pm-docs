# Operations ordered so nodes and fields are created before the edges that use them.
reason: 'FR-023 logic review pass 2: overdue display and 7-day warning reachable from every open request, Deny closed once In Progress; blocked mark cleared by the system with an Admin notice and a Deny path; outcome notice to the contact address captured at approval; refresh that differs from the reviewed classification returns to review; passport number and photo erased at approval as a named exception (owner default 73, narrows 67); record-type mapping completed; deletion-requested stage reads and writes; anonymisation waits for the FR-003 cancellation with a retry on failure; a Completed inquiry does not block a deletion request'
by: docs-manager
