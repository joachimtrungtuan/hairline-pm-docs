  - {"op": "update_node", "id": "REQ-026-001", "title": "Settings UI gated by View Settings and per-screen edit permissions", "attrs": {"statement": "System MUST provide Settings Management UI accessible only to admins with the View Settings permission, and editing only to admins with the edit permission of the screen: Manage Authentication Policies for authentication throttling, OTP configuration and the admin session settings; Manage App Data for the App Data lists; Manage Notification Templates for the OTP email templates; Edit Settings (Super Admin only) for the Quote and Analytics Configuration and the other Platform Settings (REQ-031-113, REQ-031-067).", "rationale": "One gate for every Settings screen, replacing the former role names and the separate Screen 1 permission. FR-031 names the permissions; assigning the other App Data lists and the OTP settings is queued for FR-031 to confirm."}}
  - {"op": "update_node", "id": "REQ-026-054", "title": "Settings permissions and what each may do", "attrs": {"statement": "Access is enforced with the FR-031 admin permissions: View Settings views every Settings screen and the version history (read-only); Edit Settings is Super Admin only (REQ-031-067); Manage Authentication Policies, Manage App Data and Manage Notification Templates edit the screens named in REQ-026-001; View Sensitive Settings shows the full value of a sensitive setting, which applies only to a setting later marked sensitive.", "rationale": "Security Controls table in the PRD. FR-031 owns the permission matrix; this rule records only which permission FR-026 screens use."}}
  - {"op": "update_node", "id": "REQ-026-002", "attrs": {"statement": "System MUST require change reason (10-500 characters) for all setting modifications made on FR-026 screens; a Quote Configuration version created by a Default Currency change in FR-029 is recorded as a System change with a fixed reason (REQ-026-142)"}}
  - {"op": "update_node", "id": "REQ-026-014", "attrs": {"rationale": "Restated by Privacy Rule 1 (UI) and Privacy Rule 2 (audit logs). No FR-026 setting is sensitive at launch; the rule applies only to a setting later marked sensitive."}}
  - {"op": "update_node", "id": "REQ-026-016", "attrs": {"rationale": "No FR-026 setting is sensitive at launch; the rule applies only to a setting later marked sensitive."}}
  - {"op": "update_node", "id": "REQ-026-052", "attrs": {"statement": "Sensitive values are masked in version history (displayed as \"[REDACTED]\"); admins with \"View Sensitive Settings\" permission can click \"Show\" to unmask them. No FR-026 setting is sensitive at launch, so the Show control appears only for a value later marked sensitive."}}
  - {"op": "update_node", "id": "REQ-026-027", "attrs": {"statement": "Quote Configuration changes MUST affect only quotes first sent after activation; the currency and expiry already copied onto a sent quote MUST remain unchanged, drafts MUST carry neither value, and no per-quote extension is allowed except the admin restore of an expired quote (REQ-004-105) and the admin-authored replacement quote (REQ-004-036), which captures its currency at its first Screen 8 save (REQ-004-082)."}}
  - {"op": "update_node", "id": "REQ-026-031", "attrs": {"statement": "Changes to the quote-expiring-soon or hold-expiring-soon lead time MUST apply only to reminders not yet sent; when a lead time is raised and a reminder's time has already passed, that reminder MUST be skipped, not sent late."}}
  - {"op": "update_node", "id": "REQ-026-034", "attrs": {"statement": "System MUST store centrally managed inquiry treatment-area options: stable option ID, label, image/icon asset URL, display order, and active status. Consumer: FR-003 Screen 1. Seeded with Hair, Beard and Both (REQ-003-120)."}}
  - {"op": "update_node", "id": "REQ-026-050", "attrs": {"statement": "All timestamps MUST be stored in UTC and displayed in admin's local timezone. Consumer: FR-021."}}
  - {"op": "update_node", "id": "REQ-026-072", "title": "One OTP expiry for registration verification and password reset", "attrs": {"statement": "Single global OTP expiry: the configured OTP Expiry Time applies uniformly to registration email verification and password reset OTP flows (no separate per-flow expiry). Re-verification and email-change codes follow FR-001 (fixed 15 minutes, REQ-001-098), are outside this setting, and are sent with the email verification template."}}
  - {"op": "update_node", "id": "REQ-026-112", "attrs": {"statement": "System MUST store a Re-Verification Threshold Setting (whole minutes from 1 to 60, default 5, the value FR-001 uses), the time after a patient's last successful sign-in beyond which FR-001 asks the patient to confirm identity again before a sensitive action. Consumer: FR-001 Screens 16 and 18."}}
  - {"op": "update_node", "id": "REQ-026-113", "attrs": {"statement": "System MUST let an admin manage the Landing Background Images Setting, the set of background images that rotate behind the patient landing screen; with none set, no background images are shown. Consumer: FR-001."}}
  - {"op": "update_node", "id": "REQ-026-116", "attrs": {"statement": "System MUST store the admin session Settings: concurrent sessions per admin user (1 to 5, default 3) and the admin inactivity timeout (whole minutes from 5 to 240, default 30). Failed admin sign-ins use the shared Max Login Attempts Setting of Screen 2 and there is no separate admin Setting; the fixed FR-031 endpoint throttle of 5 attempts per 15 minutes (REQ-031-100) applies in addition, whichever trips first. A Login as Provider session ends after its own fixed 30 minutes of inactivity (REQ-015-026) or when the admin's own session ends under the admin inactivity timeout, whichever comes first. Consumer: FR-031."}}
  - {"op": "update_node", "id": "REQ-026-117", "title": "Head scan quality Settings", "attrs": {"statement": "System MUST store the head scan Settings FR-002 still reads: a minimum brightness score and a minimum blur score (each a whole number from 0 to 100, default 40, admin-editable; a photo passes when both reach their minimum), and head video duration limits, which are not used until head video ships (REQ-002-035). File size, total size and required views are product constants in FR-002 (REQ-002-033, REQ-002-032) and are not Settings. Consumer: FR-002 REQ-002-034, REQ-002-035, REQ-002-050."}}
  - {"op": "update_node", "id": "REQ-026-118", "attrs": {"statement": "System MUST store the acceptance legal copy and terms acknowledgment text shown at quote acceptance as a versioned Setting, with no seeded text; until the admin sets it, the quote acceptance action that needs the acknowledgment checkbox is blocked with a message. Consumer: FR-005."}}
  - {"op": "update_node", "id": "REQ-026-120", "attrs": {"statement": "System MUST store the provider notification types offered in provider notification preferences, seeded with the five core types. Admins can add or remove types, but the core types (quote, schedule, treatment, aftercare, review) cannot be removed. Consumers: FR-032, FR-020."}}
  - {"op": "update_node", "id": "REQ-026-121", "attrs": {"statement": "System MUST store the timezone options (every whole-hour offset from GMT-12 to GMT+14 at launch, each with its offset and a city example). Consumers: FR-032, FR-021."}}
  - {"op": "update_node", "id": "REQ-026-128", "attrs": {"statement": "Screen 4 MUST offer bulk import of countries from a CSV file with the columns Country Name, ISO Code, Calling Code and Display Order (optional) and no flag column, with validation of every row before anything is saved. An imported country is saved Inactive with a \"flag missing\" state and cannot be activated until the admin uploads its flag."}}
  - {"op": "update_node", "id": "REQ-026-129", "attrs": {"statement": "Before an admin deactivates a country that active users have selected, a discovery option, cancellation reason, or deletion reason that patients frequently select, or a provider specialty that providers currently hold, the system MUST warn the admin. The country warning also lists the FR-028 regional groupings and fallback price rows that use the country; a deactivated country keeps applying in FR-028 until an admin edits them (REQ-028-083, REQ-028-092)."}}
  - {"op": "update_node", "id": "REQ-026-139", "attrs": {"statement": "System MUST store the centrally managed problem-duration list: option label, display order, active status. Starting values, editable by Admin: Less than 6 months; 6 to 12 months; 1 to 2 years; 2 to 5 years; More than 5 years. At least one option stays active. A deactivated duration is no longer offered, and answers already stored stay readable. Consumer: FR-003 Screen 3 (Duration)."}}
  - {"op": "update_node", "id": "SET-reverification-threshold", "attrs": {"description": "How long after a patient's last successful sign-in the patient must confirm identity again before a sensitive action (FR-001 Screens 16 and 18). Whole minutes from 1 to 60. Edited on FR-026 Screen 8."}}
  - {"op": "update_node", "id": "SET-admin-inactivity-timeout", "attrs": {"description": "The standard admin inactivity timeout (consumer: FR-031). Whole minutes from 5 to 240. A Login as Provider session ends after its own fixed 30 minutes of inactivity (REQ-015-026) or when the admin's own session ends under this timeout, whichever comes first. Edited on FR-026 Screen 8."}}
  - {"op": "update_node", "id": "SET-head-video-duration-limits", "attrs": {"description": "Minimum and maximum duration of a head video; not used until head video ships (consumer: FR-002 REQ-002-035). Edited on FR-026 Screen 8; the PRD fixes no value."}}
  - {"op": "update_node", "id": "SET-support-emergency-contact-phone", "attrs": {"description": "Emergency phone number shown read-only with tap-to-call on the patient Help & Support Hub (FR-035 Screen 1). No default; at least one of phone and email must be set (REQ-026-143); FR-035 assumes the admin sets it before go-live. Edited on FR-026 Screen 8."}}
  - {"op": "update_node", "id": "SET-support-emergency-contact-email", "attrs": {"description": "Emergency email address shown read-only with tap-to-compose on the patient Help & Support Hub (FR-035 Screen 1). No default; at least one of phone and email must be set (REQ-026-143); FR-035 assumes the admin sets it before go-live. Edited on FR-026 Screen 8."}}
  - {"op": "update_node", "id": "SET-password-policy", "attrs": {"description": "Defined by REQ-SYS-007. FR-026 holds this Setting only as the stored value other FRs read; it is not editable on FR-026 screens. Minimum 12 characters with at least one uppercase, lowercase, digit and special character."}}
  - {"op": "update_node", "id": "SET-timezone-options", "attrs": {"description": "Timezone choices: every whole-hour offset from GMT-12 to GMT+14, each with its offset and a city example such as \"(GMT+3) Istanbul\" (consumers: FR-032, FR-021). Edited on FR-026 Screen 8."}}
  - {"op": "update_node", "id": "SET-provider-notification-types", "attrs": {"description": "Notification types offered in provider notification preferences (consumers: FR-032, FR-020). Core types quote, schedule, treatment, aftercare and review cannot be removed. Seeded with the five core types. Edited on FR-026 Screen 8."}}
  - {"op": "update_node", "id": "SET-landing-background", "attrs": {"description": "Background images that rotate behind the patient landing screen (FR-001). Image assets only; rotation follows the admin configuration. With none set, no background images are shown. Edited on FR-026 Screen 8."}}
  - {"op": "update_node", "id": "SET-acceptance-terms-text", "attrs": {"description": "Legal copy and terms acknowledgment text shown at quote acceptance (consumer: FR-005). Versioned and edited on FR-026 Screen 8; Terms and Conditions, Privacy Policy and consent forms stay in FR-027. No seeded text: until the admin sets it, the quote acceptance action that needs the acknowledgment checkbox is blocked with a message."}}
  - {"op": "update_node", "id": "SET-treatment-area-options", "attrs": {"description": "Ordered list of treatment-area options (label, image or icon asset, active flag) offered on inquiry creation. Seeded with Hair, Beard and Both (REQ-003-120)."}}
  - {"op": "update_node", "id": "SCR-026-02", "attrs": {"description": "Admin edits max login attempts and lockout duration, then supplies a change reason. Changes apply within 60 seconds of saving (propagation); existing lockouts are untouched. The fixed FR-031 admin endpoint throttle applies in addition to the shared lockout."}}
  - {"op": "update_node", "id": "SCR-026-04", "attrs": {"description": "Admin adds, edits, reorders, activates and deactivates countries (name, ISO code, calling code, flag, display order); a usage count of users per country is shown with a warning before deactivating, which also lists the FR-028 groupings and fallback price rows that use it; the final active country cannot be deactivated; a CSV import saves countries Inactive with a flag missing state."}}
  - {"op": "update_node", "id": "SCR-026-13", "attrs": {"description": "Read-only list of versions of a setting group, newest first, with diff highlighting of old and new values, change reason and admin; sensitive values are masked. A Quote Configuration version created by an FR-029 Default Currency change shows Change Type System."}}
  - {"op": "update_node", "id": "SCR-026-14", "attrs": {"description": "Admin views and changes the platform Settings that other modules read and that Screens 2 to 7 do not edit: re-verification threshold, admin session policy, landing background images, profile photo limits, head scan quality minimums, acceptance terms text, timezone options, provider notification types, the support emergency contact and the limits owned by other features (creation rate limits, admin invitation token expiry, admin repeated denial threshold). Each Setting sits in one of the Screen 1 setting groups."}}
