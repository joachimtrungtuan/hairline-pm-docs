# FR-026 logic review pass 1: ruled fixes applied to the PRD (App Settings and Security Policies). New rules, settings and the System change type come first, then edges, then updates, edge removals and retirements.
# Cross-FR edges: adds FR-026 references to REQ-031-100, REQ-031-113, REQ-015-026, REQ-004-105, REQ-004-036, REQ-035-040, REQ-029-053 and REQ-003-120 (rules owned by other FRs); adds REQ-002-034 (FR-002 rule) governed by the two new head scan Settings and removes its edge to the retired quality-threshold Setting. No node owned by another FR is updated or retired.
# Queued for other FRs, not done here: FR-001 (re-verification and email-change OTP flows read the setting boundary), FR-002 (retired size and view settings, default 40 minimums), FR-004, FR-015 (provider creation limit), FR-024 (limit entries), FR-028 (grouping and fallback price warning), FR-029, FR-031 (permission names, throttle wording), FR-035.
# Left alone on purpose: minor observations other than FR-021 consumer wording and the 60-second propagation wording.
reason: "FR-026 logic review pass 1: FR-031 permissions replace the working role names, treatment areas seeded Hair, Beard and Both, head scan Settings reduced to two quality minimums, admin sign-in lockout and fixed throttle both apply, System change type for FR-029 currency versions, limits owned by other features listed on Screen 8, reminder skip rule, country CSV and guard rules, emergency contact at-least-one rule, bounds and seeds for platform Settings, Settings API outage at hold placement."
by: docs-manager
operations:
  - {"op": "add_node", "id": "REQ-026-140", "type": "Rule", "owner_fr": "FR-026", "title": "Screen 8 lists limits owned by other features", "attrs": {"statement": "System MUST list on Screen 8, under the group \"Limits owned by other features\", the Settings whose owning FR makes them admin-editable: the treatment creation rate limit and the package creation rate limit (FR-024; a new record counts once, when first saved as Active or Inactive), the admin invitation token expiry and the admin repeated denial threshold (FR-031). Range, default and counting rule stay with the owning FR.", "rationale": "Logic review of the FR-026 PRD; mirrors the PRD text. The provider creation rate limit (FR-015) is not stated as admin-editable by its owner, so it is not listed."}}
  - {"op": "add_node", "id": "REQ-026-141", "type": "Rule", "owner_fr": "FR-026", "title": "Final active country cannot be deactivated", "attrs": {"statement": "System MUST prevent deactivation of the final active country; a deactivation that would leave no active country is rejected with a message.", "rationale": "Logic review of the FR-026 PRD; mirrors the PRD text. Mirrors the treatment-area guard REQ-026-036."}}
  - {"op": "add_node", "id": "REQ-026-142", "type": "Rule", "owner_fr": "FR-026", "title": "Quote Configuration version from a Default Currency change is a System change", "attrs": {"statement": "A Quote Configuration version created by a Default Currency change in FR-029 (REQ-029-053) MUST have Change Type \"System\", the fixed reason text \"Default currency changed in Payment Configuration\", and Changed By set to the admin who confirmed the change in FR-029; the change reason rule (REQ-026-002) covers changes made on FR-026 screens.", "rationale": "Logic review of the FR-026 PRD; mirrors the PRD text."}}
  - {"op": "add_node", "id": "REQ-026-143", "type": "Rule", "owner_fr": "FR-026", "title": "Emergency contact needs at least one value", "attrs": {"statement": "System MUST refuse to save the Support Emergency Contact Settings when both phone and email are blank, with the message \"Set at least one emergency contact (phone or email).\" (REQ-035-040).", "rationale": "Logic review of the FR-026 PRD; mirrors the PRD text."}}
  - {"op": "add_node", "id": "REQ-026-144", "type": "Rule", "owner_fr": "FR-026", "title": "Slot hold placement blocked when the Settings API is unavailable", "attrs": {"statement": "When the Settings API is unavailable as a slot hold is placed at subquote acceptance or an FR-006 admin revive, the action MUST be blocked and can be retried; no stale or guessed slot-hold duration is used.", "rationale": "Logic review of the FR-026 PRD; mirrors the PRD text. Mirrors REQ-026-063 for the quote send."}}
  - {"op": "add_node", "id": "SET-head-scan-min-brightness-score", "type": "Setting", "owner_fr": "FR-026", "title": "Head scan minimum brightness score", "attrs": {"description": "Lowest brightness score (0 to 100) a head scan photo may have and still pass the basic quality check (consumer: FR-002 REQ-002-034, REQ-002-050). Whole number; a photo passes when both its brightness and its blur score reach their minimum. Edited on FR-026 Screen 8.", "default": "40", "unit": "score"}}
  - {"op": "add_node", "id": "SET-head-scan-min-blur-score", "type": "Setting", "owner_fr": "FR-026", "title": "Head scan minimum blur score", "attrs": {"description": "Lowest blur score (0 to 100) a head scan photo may have and still pass the basic quality check (consumer: FR-002 REQ-002-034, REQ-002-050). Whole number; a photo passes when both its brightness and its blur score reach their minimum. Edited on FR-026 Screen 8.", "default": "40", "unit": "score"}}
