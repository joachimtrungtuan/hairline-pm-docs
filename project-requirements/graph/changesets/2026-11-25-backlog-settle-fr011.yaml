  - {"op": "update_node", "id": "REQ-011-032", "attrs": {"statement": "Retention of aftercare data, scan media and communication logs follows the system PRD, Platform-Wide Rules: One 10-year retention period, REQ-SYS-002."}}
  - {"op": "update_node", "id": "REQ-011-077", "attrs": {"statement": "Provider performance scores are calculated monthly, poor performance triggers a review process and provider suspension requires admin approval. Retention of performance data follows the system PRD, Platform-Wide Rules: One 10-year retention period, REQ-SYS-002."}}
  - {"op": "update_node", "id": "REQ-011-008", "attrs": {"statement": "Aftercare data encryption in transit and at rest MUST follow the system PRD, Platform-Wide Rules: Encryption in transit and at rest (REQ-SYS-004)."}}
  - {"op": "update_node", "id": "REQ-011-009", "attrs": {"statement": "Retired. Role-based (patient, provider, admin) and audited access is one platform rule in the system PRD, Platform-Wide Rules: Role-based, audited access (REQ-SYS-009)."}}
  - {"op": "update_node", "id": "REQ-011-057", "attrs": {"statement": "When the provider marks \"Assign to Hairline aftercare team\", the admin receives a notification for aftercare assignment, the Hairline aftercare team takes over patient monitoring, and, after the handover, the coordinator confirms the plan on Screen 14 and the system activates it. The provider is paid a fixed handover fee set by the admin (default 0, so nothing is paid until the admin sets an amount); in the treatment-linked flow there is no separate aftercare price, so Hairline pays the fee from its own revenue, and in the add-on and standalone flows Hairline keeps the rest of the price. The fee is a Handover Fee credit entry on the clinic's balance record owned by FR-017 (REQ-017-203). When the Hairline team delivers by default in the add-on flow, or after an admin reassignment, Hairline keeps the full price with no commission line and no provider payment. When a provider delivers, the provider is paid the price less commission (REQ-011-040)."}}
  - {"op": "update_node", "id": "REQ-011-097", "attrs": {"statement": "The patient MUST be able to cancel from the plan payment screen (Screen 7). A monthly subscription runs to the end of the paid month, later months are not charged, the plan then becomes Cancelled, and nothing is refunded. A plan paid in full stops at the end of the current month and the unused full months are refunded pro rata (REQ-011-083). Commission and provider payout follow the refund in the same proportion. The commission reversal is FR-017 REQ-017-202."}}
  - {"op": "update_node", "id": "STG-monitoring-03-conversion", "attrs": {"description": "Patient moves from monitoring into a treatment inquiry or into a standalone aftercare request."}}
  - {"op": "add_edge", "from": "STG-monitoring-03-conversion", "verb": "joins", "to": "STG-aftercare-01-recovery-plan"}
