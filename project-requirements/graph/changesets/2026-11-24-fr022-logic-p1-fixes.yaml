  - {"op": "update_node", "id": "REQ-022-006", "title": "Search results paginated (page-size setting for admin and provider lists, 10 patient mobile)", "attrs": {"statement": "System MUST paginate search results: admin and provider lists default to the page-size setting (default 25 per page, range 10 to 100), except where the owning screen states its own page size or selector, which wins (FR-015 Screen 1 at 50, FR-016 selectable 25, 50 or 100, FR-024 at 20); the patient app is fixed at 10 per page"}}
  - {"op": "update_node", "id": "REQ-022-017", "attrs": {"statement": "System MUST limit patient provider selection to maximum 5 providers per quote request; the patient continues with 1 to 5 selected, can deselect a selected provider, and at 5 selected the remaining cards cannot be selected [P2 - Post-MVP]"}}
  - {"op": "update_node", "id": "REQ-022-023", "attrs": {"statement": "System MUST log all admin searches with user ID, timestamp, search terms, and result count; the log is written for admin searches only"}}
  - {"op": "update_node", "id": "REQ-022-025", "attrs": {"statement": "System MUST rate-limit search queries to 100 per hour per user; a search past the limit is declined (Alternative Flow B2)"}}
  - {"op": "update_node", "id": "REQ-022-026", "attrs": {"statement": "System MUST show providers only the Patient ID and a masked patient name in search results at every stage until the patient has confirmed payment; provider search stays by Patient ID, plus inquiry or quote ID and message content on the Messages list, and never by patient name"}}
  - {"op": "update_node", "id": "REQ-022-027", "attrs": {"statement": "System MUST encrypt the search audit log (the history of admin searches for patient and provider records)"}}
  - {"op": "update_node", "id": "REQ-022-041", "attrs": {"statement": "System MUST allow providers to search their package list by name and filter it by package status (Active, Draft or Inactive)"}}
  - {"op": "update_node", "id": "REQ-022-043", "attrs": {"statement": "System MUST allow providers to search their support cases by case ID, title, description and message content and filter them by status (Open, In Progress, Resolved, Closed), type (Support Request, Feedback) and creation date range; the criteria are owned by FR-032 (REQ-032-107) and the default view by FR-034 (REQ-034-114)"}}
  - {"op": "update_node", "id": "REQ-022-140", "attrs": {"statement": "The search audit log MUST be kept for audit purposes (who searched for whom, when) for the same period as the FR-031 admin audit trail (REQ-031-015), and is read on that audit trail"}}
  - {"op": "update_node", "id": "REQ-022-136", "attrs": {"statement": "Search times out after 10 seconds; the user sees the same message as in Alternative Flow B2, \"Search temporarily unavailable. Please try again.\"; error logged for engineering team to investigate."}}
  - {"op": "update_node", "id": "REQ-022-069", "attrs": {"statement": "Price sorts use each subquote's price after promotion where a promotion applies, otherwise its offered price, both as shown on FR-005 / Screen 1 (the offered price is the price before any promotion, REQ-005-050); the price per graft is not used for price sorting. For ordering only, each price is converted to the patient's display currency at the current rate; each card still shows its own quote currency, and when the listed subquotes use more than one currency the price order is labelled approximate. Subquotes with the same sort value are ordered by parent quote send date (most recent first), then by option order within the parent quote, then by date range start. Subquotes that cannot currently be accepted (Not Selected, Expired, Withdrawn or Cancelled) stay in the list, shown disabled as in FR-005, and sort after all eligible subquotes. Each list row and each counted result is one subquote."}}
  - {"op": "update_node", "id": "REQ-022-070", "title": "Search and filter criteria: Patient Messages Inbox (FR-012 / Screen 1)"}
  - {"op": "update_node", "id": "REQ-022-067", "attrs": {"statement": "FR-003 / Screen 7a: Provider Selection [P2 — Post-MVP]. Patient searches for and selects providers during the quote request flow. Search: Provider name / keyword (Type: text; Placeholder: \"Search providers…\"; Debounce: 500ms; Max Length: 50 chars; Notes: Case-insensitive; matches provider name and specialty tags) / Destination (Type: text with autocomplete; Placeholder: \"Search destination…\"; Debounce: 500ms; Max Length: 50 chars; Notes: Suggests destination countries as the patient types (maximum 10 suggestions, cached 5 minutes); picking a suggestion adds the country to Country / Destination below (REQ-022-015, REQ-022-126, REQ-022-029)). Filters: Country / Destination (Type: Multi-select chips; Options: Patient's previously selected destination countries; Default: All selected countries; Logic: OR (within field)) / Rating (Type: Star selector; Options: All, 4+ stars, 4.5+ stars; Default: All; Logic: Min threshold) / Specialty (Type: Dropdown; Options: Hair Transplant, Beard Transplant, Both; Default: All; Logic: Exact match) / Sort By (Type: Dropdown; Options: Recommended, Rating, Price, Experience; Default: The default provider sort order set by an admin (Recommended until an admin changes it); Logic: Single selection; Recommended order follows the featured providers list (REQ-022-130)). Notes: Only Active providers are listed, so the screen has no Active Status control (REQ-022-131). There is no Available Capacity filter or sort at launch because no screen or record holds provider capacity."}}
  - {"op": "update_node", "id": "REQ-022-071", "attrs": {"statement": "FR-035 / Screen 1: Help & Support Hub [P1 — MVP]. Patient searches help content from the support entry hub before deciding whether to browse content or open a support request. Search: Search Bar (Type: text; Placeholder: \"Search help articles...\"; Debounce: 500ms; Notes: Full-text server search across all published patient-audience content (FAQs, Articles, Resources, Videos); results are relevance-ranked, open on the Help Center Browser (Screen 2) and must surface a Contact Support path when no match is found (REQ-035-036)). Notes: No filter controls on this screen — search-only entry point into the patient help system."}}
  - {"op": "update_node", "id": "REQ-022-072", "attrs": {"statement": "FR-035 / Screen 2: Help Center [P1 — MVP]. Patient searches for help articles and browses content by type. Search: Help content search (Type: text; Placeholder: \"Search help articles…\"; Debounce: 500ms; Notes: Full-text server search across all patient-audience FAQs, articles, resources, and videos; auto-suggests results while typing (REQ-022-132)). Filters: Content Type (Type: Segmented chips / cards; Options: All, FAQs, Articles, Resources, Videos; Default: All; Logic: Single selection) / Article Subtype (Type: Filter chips (conditional); Options: All, Tutorial Guides, Troubleshooting Tips; Default: All; Logic: Shown only when \"Articles\" type is selected)."}}
  - {"op": "update_node", "id": "REQ-022-080", "attrs": {"statement": "FR-024 / Screen 4: Provider Package List [P1 — MVP]. Provider searches for and filters their published treatment packages. Search: Package name (Type: text; Placeholder: \"Search packages…\"; Debounce: 300ms; Notes: Real-time filter; case-insensitive). Filters: Status (Type: Dropdown; Options: All, Active, Draft, Inactive; Default: All; Logic: Exact match)."}}
  - {"op": "update_node", "id": "REQ-022-084", "attrs": {"statement": "FR-032 / Screen 1 / Tab 5: Reviews Tab [P1 — MVP]. Provider reads their patient reviews on this tab, which shows the FR-013 / Screen 5 review list. Filters: Sort (Type: Dropdown; Options: Most recent, Highest rated, Lowest rated, Oldest first; Default: Most recent; Logic: Single selection). Notes: The search and filter criteria of this list are those of `FR-013 / Screen 5` (REQ-022-092) and are not repeated here; this tab adds only the sort. Filter and sort selections on this screen persist for the session."}}
  - {"op": "update_node", "id": "REQ-022-087", "attrs": {"statement": "FR-003 / Screen 11: Hairline Overview Dashboard [P1 — MVP]. Admin searches for and filters all patient inquiries across all providers. Search: Patient ID / name (Type: text; Placeholder: \"Search by patient ID or name…\"; Debounce: 500ms; Notes: Case-insensitive; fuzzy match). Filters: Patient Location (Type: Dropdown; Options: All; country list from DB; Default: All; Logic: Exact match) / Provider Location (Type: Dropdown; Options: All; country list from DB; Default: All; Logic: Exact match) / Inquiry Stage (Type: Multi-select; Options: Inquiry, Quoted, Accepted, Confirmed, In Progress, Aftercare, Completed, Cancelled (the inquiry stage list owned by FR-003); Default: All; Logic: OR (within field)) / Payment Status (Type: Dropdown; Options: Unpaid, Deposit Only, Installments Active, Full Paid, Refunded (the payment status list owned by FR-007); Default: No selection (all); Logic: Exact match) / Date Range (Type: Date range picker; Options: Custom; Default: All dates; Logic: Filters by inquiry submission date)."}}
  - {"op": "update_node", "id": "REQ-022-090", "attrs": {"statement": "FR-006 / Screen 5: Admin Bookings Table [P1 — MVP]. Admin searches for and filters all bookings across the platform. Search: Booking reference / patient name / patient email / provider name (Type: text; Placeholder: \"Search bookings…\"; Debounce: 500ms; Notes: Case-insensitive; fuzzy match). Filters: Booking Status (Type: Multi-select; Options: Accepted, Payment Window Expired, Confirmed, In Progress, Aftercare, Completed, Cancelled; Default: All; Logic: OR (within field)) / Provider (Type: Dropdown; Options: All; provider list from DB; Default: All; Logic: Exact match) / Date Range (Type: Date range picker; Options: Custom; Default: All dates; Logic: Filters by booking date) / Treatment Type (Type: Dropdown; Options: All, Hair Transplant, Beard Transplant, Both; Default: All; Logic: Exact match) / Payment Status (Type: Multi-select; Options: Unpaid, Deposit Only, Installments Active, Full Paid, Refunded (the payment status list owned by FR-007); Default: All; Logic: OR (within field)) / Deposit Status (Type: Multi-select; Options: Pending, Paid, Partial; Default: All; Logic: OR (within field))."}}
  - {"op": "update_node", "id": "REQ-022-091", "attrs": {"statement": "FR-007 / Screen 5: Patient Payment Progress Dashboard [P1 — MVP]. Admin searches for and filters payment records by booking, patient, and payment status. Search: Booking ID / patient name (Type: text; Placeholder: \"Search by booking ID or patient name…\"; Debounce: 500ms; Notes: Case-insensitive; fuzzy match). Filters: Provider (Type: Dropdown; Options: All; provider list from DB; Default: All; Logic: Exact match) / Deposit Status (Type: Multi-select; Options: Pending, Paid, Partial; Default: All; Logic: OR (within field)) / Payment Status (Type: Multi-select; Options: Unpaid, Deposit Only, Installments Active, Full Paid, Refunded (the payment status list owned by FR-007; Overdue is the separate flag below); Default: All; Logic: OR (within field)) / Final Payment Status (Type: Multi-select; Options: Not Due, Due, Paid, Overdue; Default: All; Logic: OR (within field)) / Overdue Flag (Type: Toggle; Options: Show overdue only; Default: Off; Logic: Single flag) / Date Range (Type: Date range picker; Options: Custom; Default: All dates; Logic: Filters by booking date)."}}
  - {"op": "update_node", "id": "REQ-022-092", "attrs": {"statement": "FR-013 / Screen 5: Provider Reviews List & Filters [P1 — MVP]. Provider searches their reviews by reviewer alias and filters them by treatment, rating, date, response status, and source type. Search: Reviewer alias (Type: text; Placeholder: \"Search by reviewer alias…\"; Debounce: 500ms; Notes: Case-insensitive; the list has no patient or case search (REQ-013-009, REQ-013-058)). Filters: Treatment (Type: Dropdown; Options: All; treatments in this provider's reviews; Default: All; Logic: Exact match) / Rating (Type: Multi-select star chips; Options: 5★, 4★, 3★, 2★, 1★; Default: All; Logic: OR (within field)) / Date Range (Type: Date range picker; Options: Custom; Default: All dates; Logic: Filters by review submission date) / Response Status (Type: Multi-select; Options: No response, Responded; Default: All; Logic: OR (within field)) / Source Type (Type: Multi-select; Options: Patient-submitted, Verified Off-platform; Default: All; Logic: OR (within field))."}}
  - {"op": "update_node", "id": "REQ-022-093", "attrs": {"statement": "FR-013 / Screen 7: Review Management Dashboard [P1 — MVP]. Admin filters all platform reviews by date, provider, patient, treatment case, treatment, rating, status, source type, flagged status, and response status. Search: Patient / provider / case identifier (Type: text; Placeholder: \"Search reviews…\"; Debounce: 500ms; Min Length: 2 chars; Notes: Case-insensitive). Filters: Date Range (Type: Date range picker; Options: Custom; Default: All dates; Logic: Filters by review submission date) / Provider (Type: Dropdown; Options: All; provider list from DB; Default: All; Logic: Exact match) / Patient (Type: Dropdown; Options: All; patient list from DB; Default: All; Logic: Exact match) / Treatment Case (Type: Dropdown; Options: All; cases scoped by selected patient/provider; Default: All; Logic: Exact match) / Treatment (Type: Dropdown; Options: All; treatment list from DB; Default: All; Logic: Exact match) / Rating (Type: Multi-select star chips; Options: 5★, 4★, 3★, 2★, 1★; Default: All; Logic: OR (within field)) / Review Status (Type: Multi-select; Options: Published, Removed; Default: All; Logic: OR (within field) — updated per FR-013 v1.10 backend-aligned status vocabulary; `Pending Moderation` / `Rejected` removed) / Source Type (Type: Multi-select; Options: Patient-submitted, Verified Off-platform; Default: All; Logic: OR (within field)) / Response Status (Type: Multi-select; Options: No response, Responded; Default: All; Logic: OR (within field)) / Flagged (Type: Toggle; Options: Show flagged only (admin-internal `Flagged` state); Default: Off; Logic: Single flag)."}}
  - {"op": "update_node", "id": "REQ-022-094", "attrs": {"statement": "FR-016 / Screen 1: Patient Management List [P1 — MVP]. Admin searches for and filters all registered patients across the platform. Search: Name / email / patient code (HPID) / phone (Type: text; Placeholder: \"Search patients…\"; Debounce: 500ms; Min Length: 2 chars; Notes: Case-insensitive; fuzzy match). Filters: Status (Type: Multi-select; Options: Inquiry, Quoted, Accepted, Confirmed, In Progress, Aftercare, Completed, Cancelled (the FR-003 stage list, per FR-016 Screen 1); Default: All; Logic: OR (within field)) / Account Status (Type: Multi-select; Options: Active, Suspended, Locked (per FR-016 Screen 1); Default: All; Logic: OR (within field)) / Date Range (Type: Date range picker + type toggle; Options: Custom; toggle: Registration Date / Last Activity; Default: All dates — Registration Date; Logic: Filters by selected date type) / Location (Type: Dropdown; Options: All; country list from DB; Default: All; Logic: Exact match) / Provider (Type: Dropdown; Options: All; provider list from DB; Default: All; Logic: Exact match)."}}
  - {"op": "update_node", "id": "REQ-022-095", "attrs": {"statement": "FR-016 / Screen 7: Admin Actions Audit Log [P1 — MVP]. Admin searches for and filters the patient data access and modification audit log. Filters: Action Type (Type: Multi-select; Options: The action types listed on FR-016 / Screen 7 (the list is closed, REQ-016-160); Default: All; Logic: OR (within field)) / Date Range (Type: Date range picker; Options: Custom; Default: All dates; Logic: Filters by action timestamp) / Admin User (Type: Dropdown; Options: All; admin user list; Default: All; Logic: Exact match) / Show Only My Actions (Type: Toggle; Options: On / Off; Default: Off; Logic: Filters to current admin's actions only). Notes: No search input on this screen — filtering only."}}
  - {"op": "update_node", "id": "REQ-022-096", "attrs": {"statement": "FR-016 / Screen 8: Pending Data Requests [P1 — MVP]. Admin searches the patient data access and deletion request queue and filters it by request status. Search: Patient name / email / HPID (Type: text; Placeholder: \"Search requests…\"; Debounce: 500ms; Notes: Debounced; case-insensitive; searches the requests the Status filter shows). Filters: Status (Type: Multi-select; Options: Pending Admin Review, Verification Required, In Progress, Fulfilled, Denied (REQ-016-186); Default: Pending Admin Review; Logic: OR (within field))."}}
  - {"op": "update_node", "id": "REQ-022-110", "attrs": {"statement": "FR-027 / Screen 1: Legal Documents List [P1 — MVP]. Admin filters the legal document catalog by type, status, and locale. Filters: Document Type (Type: Dropdown; Options: All, Terms & Conditions, Privacy Policy, Consent, Cancellation Policy (the four fixed types); Default: All; Logic: Exact match) / Status (Type: Multi-select; Options: Draft, Current, Scheduled, Archived; Default: All; Logic: OR (within field)) / Locale (Type: Dropdown; Options: All; configured locale list; Default: All; Logic: Exact match). Notes: No search input on this screen — filtering only."}}
  - {"op": "update_node", "id": "REQ-022-111", "attrs": {"statement": "FR-027 / Screen 4A: User Acceptance List [P1 — MVP]. Admin searches for and filters user acceptance records for legal documents. Search: User name / email / user ID (Type: text; Placeholder: \"Search users…\"; Debounce: 500ms; Notes: Case-insensitive; fuzzy match). Filters: Acceptance Status (Type: Dropdown; Options: Accepted, Pending; Default: Pending (to focus on outstanding users, REQ-027-056); Logic: Exact match) / Locale (Type: Dropdown; Options: All; configured locale list; Default: All; Logic: Exact match). Notes: Document Type (Terms & Conditions, Privacy Policy, Consent) and Version are inherited from the version selected on FR-027 / Screen 4. Acceptance time and last reminder are read-only columns, not filters."}}
  - {"op": "update_node", "id": "REQ-022-115", "attrs": {"statement": "FR-031 / Screen 1 / Tab 2: Admin Users List [P1 — MVP]. Admin searches for and filters admin user accounts. Search: Name / email (Type: text; Placeholder: \"Search admin users…\"; Debounce: 300ms; Notes: Real-time filter; case-insensitive). Filters: Role (Type: Dropdown; Options: All Roles, then every admin role including custom roles (predefined: Super Admin, Aftercare Coordinator, Billing Admin, Support Staff); Default: All Roles; Logic: Exact match) / Status (Type: Dropdown; Options: All, Active, Suspended, Invited, Deleted; Default: All (a Deleted account stays hidden unless Deleted is chosen, REQ-031-126); Logic: Exact match)."}}
  - {"op": "update_node", "id": "REQ-022-116", "title": "Search and filter criteria: Permission Matrix (FR-031 / Screen 4 / Matrix Comparison View)", "attrs": {"statement": "FR-031 / Screen 4 / Matrix Comparison View: Permission Matrix [P1 — MVP]. Super Admin searches for permissions and filters them by category or module inside the Permission Matrix Modal (REQ-031-077). Search: Permission name (Type: text; Placeholder: \"Search permissions…\"; Debounce: 300ms; Notes: Real-time filter on permission name (Matrix Comparison View)). Filters: Category / Module (Type: Dropdown; Options: All; the permission categories and module codes of the matrix (REQ-031-072); Default: All; Logic: Exact match) / Show only differences between roles (Type: Toggle; Options: On, Off; Default: Off; Logic: Keeps only permissions whose grant differs between the compared roles)."}}
  - {"op": "update_node", "id": "REQ-022-117", "attrs": {"statement": "FR-031 / Screen 5: User Detail & Audit Trail [P1 — MVP]. Admin filters one admin user's audit trail (access-control events only, REQ-031-132) by action type, date, and outcome (REQ-031-094). Filters: Action Type (Type: Multi-select; Options: Login, Role Change, Permission Grant, Access Denied, Password Reset, User Suspended, User Reactivated, User Deleted, Account Created, Role Created, Role Deleted, Role Permissions Edited, Invitation Sent, Invitation Resent, Invitation Cancelled, Invitation Delivery Failed, Sensitive Access; Default: All; Logic: OR (within field)) / Date Range (Type: Date range picker; Options: Custom; Default: Last 30 days; Logic: Filters by action timestamp) / Outcome (Type: Multi-select; Options: Success, Failed, Denied; Default: All; Logic: OR (within field)). Notes: No search input on this screen — filtering only."}}
  - {"op": "update_node", "id": "REQ-022-085", "attrs": {"statement": "FR-012 / Screen 3: Provider Messages List [P1 — MVP]. Provider searches for and filters their patient conversations from the header messages list. Search: Patient ID / inquiry or quote ID / message content (Type: text; Placeholder: \"Search messages…\"; Min Length: 2 chars; Debounce: 300ms; Notes: Filters the conversation list in real time; case-insensitive fuzzy match across Patient ID, inquiry/quote ID, and message content; the patient name is searchable only once the patient has confirmed payment (REQ-022-026)). Filters: Read Status (Type: Toggle; Options: All, Unread Only; Default: All; Logic: Exact match) / Date Range (Type: Dropdown; Options: Today, Last 7 days, Last 30 days, All; Default: All; Logic: Filters by activity date) / Service Type (Type: Dropdown; Options: All; options from service catalog; Default: All; Logic: Exact match)."}}
  - {"op": "update_node", "id": "SET-search-results-page-size", "attrs": {"description": "Admin-editable default page size for admin and provider lists; default 25, range 10-100. A screen whose owning FR states its own page size or selector keeps it (FR-015 Screen 1 at 50, FR-016 selectable 25, 50 or 100, FR-024 at 20). The patient app is fixed at 10 results per page and is not governed by this setting. Edited on the FR-026 app settings screens."}}
  - {"op": "update_node", "id": "SET-provider-search-default-sort", "attrs": {"description": "Admin-editable default sort order for patient provider search; options Recommended, Rating, Price, Experience; it is the default of the Sort By control on FR-003 Screen 7a, and Recommended applies until an admin changes it. Edited on the FR-026 app settings screens. [P2 - Post-MVP]"}}
