  - {"op": "update_node", "id": "REQ-034-092", "attrs": {"statement": "Admin staff receive email notifications when: Case assigned to them; Case escalated to them (an escalation always goes to a Super Admin, and a system escalation goes to all Super Admins); Patient/provider replies to a case (one email per reply); A case is reopened (a separate reopening notice, in addition to the reply email); Urgent case created and still unassigned after 1 hour (a fixed alert email to the Support Staff pool; if the case is still unassigned at the Urgent Case Unassigned Threshold in Screen 7, default 24 hours, the system escalates it to Super Admin)", "rationale": "Business Rules, Notification Rule 3. The 1-hour alert is fixed; the Screen 7 threshold is the point where the system escalates the case (REQ-034-173)."}}
  - {"op": "update_node", "id": "REQ-034-094", "title": "Support Center permissions", "attrs": {"statement": "View Support Center: open and read cases, including internal notes; Respond to Support: reply, add internal notes, create, edit, reassign, resolve, close and reopen cases (assignment is informational only and does not restrict access); Super Admin only: Support Center configuration (Screen 7), receipt of escalations and audit log export (no hard delete; archive only); There is no Support Manager role and no \"Manage Support Configuration\" permission; A user without View Support Center who sees a case row in FR-016 Screen 9 gets the case reference without a link", "rationale": "Data and Privacy Rules, Authorization. The two permission names are the FR-031 Communication and Support permissions (REQ-031-111); FR-031 owns the role definitions."}}
  - {"op": "update_node", "id": "REQ-034-042", "attrs": {"statement": "System MUST enforce RBAC permissions for case access on the FR-031 permissions View Support Center and Respond to Support, with the Screen 7 settings and the audit export limited to Super Admin (REQ-034-094)", "rationale": "Functional Requirements Summary, Security and Privacy. REQ-034-094 lists what each permission allows."}}
  - {"op": "update_node", "id": "REQ-034-102", "attrs": {"statement": "Status follows unified workflow: Open → In Progress → Resolved → Closed (cannot skip stages except for case reopening); Case cannot be marked \"Closed\" until status is \"Resolved\" (validation rule); System prevents closing case unless status is \"Resolved\" first; Status is Open on create and is not editable on Screen 2 when a case is edited; the Update Status modal offers Open to In Progress only; Resolved is reached only through Resolve Case (Screen 4, resolution summary required), Closed only through Close Case, and Closed to Open only through Reopen Case", "rationale": "Screen 2, Screen 3 and Business Rule 2. Each later stage has one control that carries its own required input."}}
  - {"op": "update_node", "id": "REQ-034-103", "attrs": {"statement": "Admin clicks \"Reassign Case\" (there is no separate escalation button or form); System displays the Reassign Case modal (Screen 5); Admin ticks \"Escalate\", selects a Super Admin as the new assignee (the list shows active Super Admin users only), and enters the required reassignment reason; System raises case priority to \"High\" or \"Urgent\" as the admin chooses; System sends the escalation notice to the chosen Super Admin; System logs the reassignment in case timeline, marked as an escalation; Case reassigned to a Super Admin with increased priority", "rationale": "Alternative Flow A1. Escalation is the Escalate tick in the Reassign Case modal (Screen 5); it has no separate screen or form, and it always goes to a Super Admin."}}
  - {"op": "update_node", "id": "REQ-034-126", "attrs": {"statement": "Assigned To field optional on creation; can be assigned later (assignment is informational only - all admins can work on all cases); Assigned To: List of active admin users with the Respond to Support permission", "rationale": "Screen 2 data fields and business rules. The permission name comes from FR-031 (REQ-031-111)."}}
  - {"op": "update_node", "id": "REQ-034-144", "attrs": {"statement": "New Assignee: List of active admin users with the Respond to Support permission (active Super Admin users only when Escalate is ticked); cannot select current assignee; Reassignment Reason: Min 10 chars, max 500 chars; Display new assignee's current case load (number of Open/In Progress cases) to help with workload balancing", "rationale": "Screen 5 data fields and notes. An escalation goes to a Super Admin (REQ-034-103)."}}
  - {"op": "update_node", "id": "REQ-034-098", "attrs": {"statement": "System displays confirmation to patient: \"Support request submitted. Case #[number]. Our team will respond within 24 hours on business days.\"; System displays confirmation to provider: \"Support request submitted. Case #[number]. Our team will respond within 24 hours on business days.\"; System displays confirmation to provider: \"Thank you for your feedback! Case #[number]. We'll review your submission.\"", "rationale": "Alternative Flows A5, A3 and A4 step 10. The quoted wording is template copy and is not modelled; the 24-hours-on-business-days commitment is the first-response target (REQ-034-175), worded as in FR-035 REQ-035-054."}}
  - {"op": "update_node", "id": "REQ-034-101", "attrs": {"statement": "System sets case category based on the patient's selection from the categories visible to patients; System sets case priority based on patient's selection (Low, Medium, High, Urgent); System sets case category based on the provider's selection from the categories visible to providers; System sets case priority based on provider's selection (Low, Medium, High, Urgent); System sets case category from the feedback type: Feature Request and Bug Report keep their own categories, Suggestion and Other are filed under category Feedback (no new categories); System sets case priority based on provider's suggested priority (Low, Medium, High, Urgent); Each built-in category has a fixed Visible To value (patient and provider, patient, provider, or admin only) that decides which submission forms offer it; the membership is the table on Screen 7 and is not editable", "rationale": "Alternative Flows A5, A3 and A4 steps 6 and 7, and Screen 7. The feedback-type mapping in A4 is separate from the Visible To value, which governs the category choices a form offers."}}
  - {"op": "update_node", "id": "REQ-034-109", "attrs": {"statement": "Support case remains in system with anonymized patient identifier for audit trail compliance; Case marked with \"Patient Account Deleted\" badge; Admin cannot deep-link to patient record but can still take the case to Resolved with a resolution summary and then Closed; If patient record deleted, support case retains anonymized copy of patient name/email for audit trail, and the anonymisation follows FR-023; No email of any kind is sent to a deleted patient, and the email checkboxes on Screens 4 and 6 show unchecked and disabled", "rationale": "Edge Cases and Data and Privacy Rules. FR-035 REQ-035-075 states the matching rule for the patient app: notices stop."}}
  - {"op": "update_node", "id": "REQ-034-139", "attrs": {"statement": "System automatically closes a Resolved case after the specified auto-close period if the patient/provider doesn't respond; If the patient/provider replies while the case is Resolved (before the auto-close period expires), the case is reopened automatically and the system records a Reopening by System with the reason \"User replied\"; A reply to a Closed case does not reopen it automatically: it goes to an admin, who decides whether to reopen it; A provider replies through FR-032 Screen 5.8 (Case Detail) and the same rules apply", "rationale": "Screen 4 business rules. Admins reopen Closed cases (REQ-034-017); the automatic reopen applies only while the case is Resolved (REQ-034-165)."}}
  - {"op": "update_node", "id": "REQ-034-164", "attrs": {"statement": "Report a problem: FR-034 owns the Report a problem rule for the patient app (FR-035 and FR-001 point to it). A problem report MUST create a support case under the Technical Issue preset with the device, operating system, app version, and report timestamp attached (shown read-only on Screen 3), and problem report submissions MUST be throttled to 10 new cases per hour per patient (REQ-035-063)", "rationale": "Functional Requirements Summary; restated in Business Rule 18. FR-035 and FR-001 point to it."}}
  - {"op": "update_node", "id": "REQ-034-077", "attrs": {"statement": "Maximum case resolution time target: 48 hours for Urgent, 5 business days for High, 10 business days for Medium/Low priority; a target only, with no system behaviour when it passes", "rationale": "General Module Rules, Rule 12. Success criteria state a 5 business day target for non-urgent cases; see migration report."}}
  - {"op": "update_node", "id": "REQ-034-078", "attrs": {"statement": "Open and In Progress cases with no activity for longer than the Case Inactivity Threshold (Screen 7, default 14 days) are flagged for admin review and potential closure; the same threshold drives the warning shown in the case list and case detail view; activity means any reply, note, status change or reassignment", "rationale": "General Module Rules, Rule 13. The 14-day figure is configurable on Screen 7 (Case Inactivity Threshold)."}}
  - {"op": "update_node", "id": "REQ-034-058", "attrs": {"statement": "System MUST display warning for Open and In Progress cases with no activity for longer than the Case Inactivity Threshold (Screen 7, default 14 days); activity means any reply, note, status change or reassignment", "rationale": "Functional Requirements Summary. Restated in Screen 1 and Screen 3 (REQ-034-078)."}}
  - {"op": "update_node", "id": "REQ-034-155", "attrs": {"statement": "Auto-escalation thresholds configurable within defined ranges to prevent overly aggressive or too lenient escalation; Urgent Case Unassigned Threshold: Hours before an urgent case that is still unassigned auto-escalates to Super Admin (REQ-034-173), after a fixed alert email to the Support Staff pool at 1 hour (Min: 1, Max: 48, Default: 24 hours); High Priority Case Threshold: Hours before a high priority case auto-escalates to Super Admin (REQ-034-173) if no status change (Min: 12, Max: 72, Default: 48 hours); Case Inactivity Threshold: Days before an Open or In Progress case with no activity is flagged for admin review, also the one clock behind the inactivity warnings in the case list and case detail view (Min: 7, Max: 90, Default: 14 days)", "rationale": "Screen 7, Section 6. Notification Rule 3 states the 1-hour alert and the escalation to Super Admin; Alternative Flow A7 is the escalation itself."}}
  - {"op": "update_node", "id": "REQ-034-044", "attrs": {"statement": "System MUST scan uploaded attachments for viruses/malware before accepting; when the scanner is unavailable the file is refused with a \"try again later\" message and the case, reply or note can be saved without it", "rationale": "Functional Requirements Summary, Screen 2, Edge Cases and Alternative Flow B4a. FR-035 states the same behaviour for the patient app."}}
  - {"op": "update_node", "id": "REQ-034-055", "attrs": {"statement": "System MUST display case list with comprehensive filters: status, priority, category, ticket source, submitter type, request type, request status, date range, assigned admin, and search functionality", "rationale": "Functional Requirements Summary. Restated in the Screen 1 filter bar."}}
  - {"op": "update_node", "id": "STP-034-016", "title": "Admin Staff clicks \"Resolve Case\" (Screen 4) and enters the resolution summary once the issue is fixed; the case moves to \"Resolved\""}
  - {"op": "update_node", "id": "STP-034-023", "title": "Admin ticks \"Escalate\", selects a Super Admin as the new assignee, and enters the required reassignment reason"}
  - {"op": "update_node", "id": "STP-034-025", "title": "System sends the escalation notice to the chosen Super Admin"}
  - {"op": "update_node", "id": "STP-034-029", "title": "Admin performs account intervention (password reset, suspend account, lift suspension, account unlock, data correction) with the account permission; an admin without it escalates the case to a Super Admin"}
  - {"op": "update_node", "id": "STP-034-078", "title": "Admin performs provider account intervention if needed, with the account permission (Edit Providers); an admin without it escalates the case to a Super Admin"}
  - {"op": "update_node", "id": "STP-034-037", "title": "System sets case category based on provider's selection from the categories visible to providers (Screen 7 table)"}
  - {"op": "update_node", "id": "STP-034-041", "title": "System displays confirmation to provider: \"Support request submitted. Case #[number]. Our team will respond within 24 hours on business days.\""}
  - {"op": "update_node", "id": "STP-034-060", "title": "Patient opens the Help & Support Hub in the patient app and taps the \"Contact Support\" row (FR-035 Screen 1); feedback is sent with the category Feedback"}
  - {"op": "update_node", "id": "STP-034-061", "title": "FR-035 Screen 5 displays the submission form (the form is owned by FR-035)"}
  - {"op": "update_node", "id": "STP-034-062", "title": "Patient submits the form and FR-035 hands the submission to FR-034"}
  - {"op": "update_node", "id": "STP-034-065", "title": "System sets case category based on patient's selection from the categories visible to patients (Screen 7 table)"}
  - {"op": "update_node", "id": "STP-034-069", "title": "System displays confirmation to patient: \"Support request submitted. Case #[number]. Our team will respond within 24 hours on business days.\""}
  - {"op": "update_node", "id": "STP-034-083", "title": "Admin corrects identifier or ticks \"No Patient Link\" and enters the required contact email (contact name optional)"}
  - {"op": "update_node", "id": "STP-034-084", "title": "System allows case creation without patient linkage and stores the contact on the case"}
  - {"op": "update_node", "id": "STP-034-091", "title": "Admin receives the patient's email, which carries the case ID in the subject (FR-035 Closed Case Banner)"}
  - {"op": "update_node", "id": "STP-034-092", "title": "Admin finds the closed case by that case ID in search"}
