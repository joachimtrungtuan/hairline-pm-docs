# FR-034 logic review pass 1: ruled fixes applied to the PRD (Support Center and Ticketing). New rules, flows, steps and fields come first, then edges, then updates. No edge is removed and no node is retired; the Resolve Case, Escalate and hand-off wording are title and statement updates.
# Cross-FR edges: FR-034 references REQ-016-070, REQ-016-175, REQ-016-177, REQ-016-196, REQ-016-197, REQ-016-220 (FR-016), REQ-023-004, REQ-023-014 (FR-023), REQ-031-103, REQ-031-111 (FR-031) and REQ-035-063 (FR-035); STP-034-106 is on SCR-006-02 (FR-006), STP-034-109 is on SCR-016-09 (FR-016), STP-034-110 is on SCR-032-18 (FR-032); REQ-034-139 applies to SCR-032-17 and REQ-034-178 applies to SCR-032-18 (FR-032); REQ-034-177 is governed by SET-support-emergency-contact-email (FR-026). No node owned by another FR is updated.
# Queued for other FRs, not done here: FR-030 (REQ-030-070 recipient wording and the EVT-support-case-escalated description, which still says technical team; no new event for the provider reopening request), FR-016 (REQ-016-208 wording; Screen 9 case reference without a link when the viewer lacks View Support Center), FR-032 (Screen 5.8 reply for Resolved cases and the Resolved banner text; Screen 5.9 and REQ-032-114 must not change status; REQ-032-103 wording), FR-035 (its FR-034 SC-003 pointer should cite REQ-034-175).
# Left alone on purpose: minor observations; the ENT-support-case.request_status description still calls ownership between FR-016 and FR-034 an open question (update_field cannot change a description); A5 is not renumbered because FR-035 cites A5 step 11 (STP-034-070).
reason: "FR-034 logic review pass 1: Super Admin escalation target, system escalation flow, Resolve Case and Update Status limits, booking request flow and display, request-status and reopening field flags, Support Center permissions, account intervention permission, provider reply route and reopening request, device details and provider limit, first-response target, B3 email route, A5 hand-off to FR-035, scanner-unavailable variant, category visibility, deleted-patient emails, No Patient Link contact, inactivity warning scope."
by: docs-manager
operations:
  - {"op": "add_node", "id": "REQ-034-173", "type": "Rule", "owner_fr": "FR-034", "title": "An overdue Urgent or High case is escalated by the system to all Super Admins", "attrs": {"statement": "When the Urgent Case Unassigned Threshold or the High Priority Case Threshold expires, the system marks the case as escalated in its timeline and sends the escalation notice to all Super Admins; it does not reassign the case or change its priority. The High clock restarts on any status change, and the fixed 1-hour alert for an unassigned Urgent case goes to the Support Staff pool", "rationale": "Alternative Flow A7 and Screen 7, Section 6. It is the same Support Case Escalated event as a manual escalation (REQ-034-103), raised by a clock instead of an admin."}}
  - {"op": "add_node", "id": "REQ-034-174", "type": "Rule", "owner_fr": "FR-034", "title": "A case with an Open booking request cannot be Resolved until the request is completed or declined", "attrs": {"statement": "A case whose request status is Open cannot be set to Resolved until the request is completed or declined; declining and recording the outcome stay in FR-016 (Screen 9, REQ-016-196, REQ-016-197)", "rationale": "Screen 3 business rules and Business Rule 20. The request status and the case status are separate (REQ-034-168); this rule keeps them from contradicting each other."}}
  - {"op": "add_node", "id": "REQ-034-175", "type": "Rule", "owner_fr": "FR-034", "title": "First response target: 24 hours on business days", "attrs": {"statement": "First-response target: 24 hours on business days (Monday to Friday, UTC, matching the support staff hours); it is a target only and the system takes no action when it passes", "rationale": "Business Rule 21. The submission confirmations (REQ-034-098) and FR-035 REQ-035-054 quote the same 24 hours on business days."}}
  - {"op": "add_node", "id": "REQ-034-176", "type": "Rule", "owner_fr": "FR-034", "title": "Provider case submission limit", "attrs": {"statement": "Provider submissions are limited to 10 new cases per hour per provider user, the same figure as the patient limit (REQ-035-063)", "rationale": "Data and Privacy Rules, Threat mitigation. Owner ruling: the provider figure follows the patient figure."}}
  - {"op": "add_node", "id": "REQ-034-177", "type": "Rule", "owner_fr": "FR-034", "title": "No email route to reopen when the support email setting is empty", "attrs": {"statement": "When the support email setting is empty there is no email route for asking to reopen a Closed case, and the patient creates a new ticket instead", "rationale": "Alternative Flow B3. FR-035 shows the Email support link in the Closed Case Banner only when the setting has a value."}}
  - {"op": "add_node", "id": "REQ-034-178", "type": "Rule", "owner_fr": "FR-034", "title": "A provider can only ask for a Closed case to be reopened", "attrs": {"statement": "A provider cannot reopen a Closed case; the request is added to the case thread as a flagged message, the case stays Closed, the assigned admin (or the Support Staff pool if unassigned) is told through the user-reply notice, and an admin decides with Reopen Case (Screen 6), as for a patient", "rationale": "Alternative Flow B3a. Owner ruling: the admin decides, as for patients (REQ-034-017). No new notification event is needed."}}
  - {"op": "add_node", "id": "REQ-034-179", "type": "Rule", "owner_fr": "FR-034", "title": "A case without a patient link carries a contact email", "attrs": {"statement": "When No Patient Link is ticked on Screen 2, a contact email is required and a contact name is optional; both are stored on the case, and replies, the confirmation and the resolution email go to that address", "rationale": "Screen 2 and Alternative Flow B1. Owner ruling: a case without a patient link still gets its emails."}}
  - {"op": "add_node", "id": "REQ-034-180", "type": "Rule", "owner_fr": "FR-034", "title": "Account intervention from a case needs the account permission", "attrs": {"statement": "An account intervention started from a case needs the FR-031 permission that FR-016 requires for that action (Edit Patients for patient accounts, REQ-016-070 and REQ-016-220; Edit Providers for provider accounts); an admin without it escalates the case to a Super Admin (REQ-034-103)", "rationale": "Alternative Flows A2 and A6. The permission is settled by FR-016 and FR-031; FR-034 only states that the case route needs it."}}
