  - {"op": "add_node", "id": "REQ-034-101", "type": "Rule", "owner_fr": "FR-034", "title": "Category and priority from the submitter", "attrs": {"statement": "System sets case category based on patient's selection (Technical Issue, Account Access, Payment Question, Booking Issue, General Inquiry, Feature Request, Bug Report, Feedback); System sets case priority based on patient's selection (Low, Medium, High, Urgent); System sets case category based on provider's selection (Technical Issue, Account Access, Payment Question, Booking Issue, General Inquiry, Provider Support); System sets case priority based on provider's selection (Low, Medium, High, Urgent); System sets case category based on feedback type (Feature Request, Bug Report, Suggestion, Other); System sets case priority based on provider's suggested priority (Low, Medium, High, Urgent)", "rationale": "Alternative Flows A5, A3 and A4 steps 6 and 7 (prd.md lines 281, 282, 241, 242, 261, 262). The feedback type list in A4 (Suggestion, Other) does not match the managed category list; see migration report."}}
