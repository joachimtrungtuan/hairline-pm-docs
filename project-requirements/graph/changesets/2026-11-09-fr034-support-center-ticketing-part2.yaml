  - {"op": "add_node", "id": "REQ-034-098", "type": "Rule", "owner_fr": "FR-034", "title": "Submission confirmation shown to submitter", "attrs": {"statement": "System displays confirmation to patient: \"Support request submitted. Case #[number]. Our team will respond within 24 hours.\"; System displays confirmation to provider: \"Support request submitted. Case #[number]. Our team will respond within 24 hours.\"; System displays confirmation to provider: \"Thank you for your feedback! Case #[number]. We'll review your submission.\"", "rationale": "Alternative Flows A5, A3 and A4 step 10 (prd.md lines 285, 245, 265). The quoted confirmation wording is template copy and is not modelled; the 24-hour response commitment is the rule."}}
  - {"op": "add_edge", "from": "REQ-034-098", "verb": "applies at", "to": "STG-patient-03-active"}
  - {"op": "add_edge", "from": "REQ-034-098", "verb": "applies at", "to": "STG-provider-03-active"}
  - {"op": "add_node", "id": "REQ-034-099", "type": "Rule", "owner_fr": "FR-034", "title": "Submission confirmation email and admin notice", "attrs": {"statement": "System sends confirmation email to patient with case reference number (via S-03); System sends notification to assigned admin team member; System sends confirmation email to provider with case reference number (via S-03); System sends notification to assigned admin team member; System sends confirmation email to provider with case reference number (via S-03); System sends notification to assigned admin team member", "rationale": "Alternative Flows A5, A3 and A4 steps 11 and 12 (prd.md lines 286, 287, 246, 247, 266, 267). Main Flow steps 10 and 11 state the optional version for manually created cases (prd.md lines 195, 196)."}}
