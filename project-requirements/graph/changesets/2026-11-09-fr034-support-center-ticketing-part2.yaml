  - {"op": "add_node", "id": "REQ-034-100", "type": "Rule", "owner_fr": "FR-034", "title": "Default team by submission type", "attrs": {"statement": "System sets case status to \"Open\" and assigns to patient support team; System sets case status to \"Open\" and assigns to default provider support team; System sets case status to \"Open\" and assigns to product/feedback team", "rationale": "Alternative Flows A5, A3 and A4 step 8 (prd.md lines 283, 243, 263). Assignment is informational only (Business Rule 9); a team is not an assignee in this PRD, see migration report."}}
