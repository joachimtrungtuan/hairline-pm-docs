  - {"op": "add_node", "id": "REQ-006-075", "type": "Rule", "owner_fr": "FR-006", "title": "Installment Plan control shows only for installments, 2 to 9", "attrs": {"statement": "On Screen 1 the Installment Plan control is shown only when the patient chooses the installment payment option, and it offers a number of installments from 2 to 9, limited to the feasible options (REQ-006-033).", "rationale": "prd.md lines 241-242 (Payment Option 'Installments (2-9)' and Installment Plan 'Only shown if installment option selected')"}}
  - {"op": "add_node", "id": "REQ-006-076", "type": "Rule", "owner_fr": "FR-006", "title": "Provider booking row opens the booking detail view", "attrs": {"statement": "Clicking a booking row on the provider Bookings Dashboard (Screen 3) opens the booking detail view (Screen 4).", "rationale": "prd.md lines 361 (Screen 3 Business Rules, clicking on booking row)"}}
  - {"op": "add_node", "id": "REQ-006-077", "type": "Rule", "owner_fr": "FR-006", "title": "Booking detail links open the inquiry, accepted selection and parent quote", "attrs": {"statement": "On the provider booking detail (Screen 4) and the admin booking detail (Screen 6), the links to the inquiry, the accepted selection and the source parent quote open that record, giving full context and audit trail.", "rationale": "prd.md lines 489, 690 (Screen 4 and Screen 6 Business Rules, links to the inquiry, accepted selection and source parent quote)"}}
  - {"op": "add_node", "id": "REQ-006-078", "type": "Rule", "owner_fr": "FR-006", "title": "Admin modal Confirm checkbox must be checked before submit", "attrs": {"statement": "On the admin modals and screens for revive, appointment change, cancellation, provider-fault transfer and in-progress provider-fault resolution (Screens 7 to 11), the Confirm checkbox must be checked before the admin can submit.", "rationale": "prd.md lines 714, 739, 765, 792, 818 (Confirm row of Screens 7 to 11, 'Must be checked before submit')"}}
  - {"op": "add_node", "id": "REQ-006-079", "type": "Rule", "owner_fr": "FR-006", "title": "Change Appointment shows a travel review notice when travel is linked", "attrs": {"statement": "On Screen 8 a read-only Travel Review Notice is shown when travel records are linked to the booking; it states that an FR-008 travel-date review will be raised.", "rationale": "prd.md lines 738 (Screen 8 Travel Review Notice, shown when travel records are linked)"}}
  - {"op": "add_node", "id": "REQ-006-080", "type": "Rule", "owner_fr": "FR-006", "title": "Installment default before the deadline flags the booking and notifies admin and patient", "attrs": {"statement": "When an installment plan defaults before its deadline, System MUST flag the booking and notify the admin and the patient, and apply the policy set in FR-007B (REQ-007B-019 and REQ-007B-020).", "rationale": "prd.md lines 1101 (Edge Cases, installment plan default before deadline)"}}
