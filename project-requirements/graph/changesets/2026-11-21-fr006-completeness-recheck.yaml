reason: "FR-006 completeness re-check 2026-11-21 against the PRD as edited on 2026-11-20: the one held booking.scheduled emission, six new Rules for screen and edge-case behaviours the PRD states, the blocked-state banner text, missing shows links (versions, event reference, time zone, treatment area), refund-ladder links, one Step title (plans/reports/tester-261121-fr006-completeness-recheck.md)."
by: controller
operations:
  # Held operation kept from 2026-11-10-fr006-completeness-held.yaml: booking.scheduled also fires at the booking stage (admin-authored replacement acceptance, PRD lines 176 and 802).
  - {"op": "add_edge", "from": "STG-main-04-booking", "verb": "emits", "to": "EVT-booking-scheduled"}
  - {"op": "update_node", "id": "EVT-booking-scheduled", "attrs": {"description": "booking.scheduled (displayed as \"Booking Accepted — Slot Held (Pending Payment)\"): mandatory, patient only, sent on patient acceptance (Acceptance stage) and on an admin-authored replacement acceptance (booking stage); the provider is told by quote.accepted."}}
  # Rule text follows the PRD: exact blocked-state banner and the Back to Dashboard button (PRD lines 87, 255, 258, 260).
  - {"op": "update_node", "id": "REQ-006-014", "attrs": {"statement": "System MUST verify the parent inquiry is not in \"Cancelled\" status before allowing entry to the booking/payment flow. If cancelled, system MUST block entry and display a read-only blocked state (Screen 1 blocked state) instead of the payment form, with the banner \"This inquiry has been cancelled. Booking is no longer available.\" and a Back to Dashboard button that returns the patient to the Inquiry Dashboard (FR-003 Screen 8); all payment fields and actions are hidden."}}
