reason: "Owner ruling 2026-11-22 for FR-017: a booking cancelled by a provider suspension or deactivation gets the same payment terms as a provider withdrawal or drop-out (full refund, no cancellation fee, new payment on the replacement booking; the placeholder money principle is gone); for a treatment already started and interrupted by the provider's fault the admin sets the patient refund (zero up to the full amount paid) with mandatory reason and audit entry and the provider's payout is held until the admin decides."
by: controller
operations:
  - {"op": "update_node", "id": "REQ-017-133", "attrs": {"statement": "Refunds follow the refund ladder, a platform-wide setting owned by FR-029 / A-09: Payment System Configuration (default: >30 days = 90%, 15-30 days = 50%, <15 days = 0%). The data model allows a per-clinic ladder later. Provider-status cancellations follow Rule 13, and an interrupted treatment follows Rule 19"}}
  - {"op": "update_node", "id": "REQ-017-137", "attrs": {"statement": "Bookings cancelled by an FR-015 provider suspension or deactivation (cause `ProviderSuspended` / `ProviderDeactivated`) are excluded from provider payout calculation like other cancelled bookings. The Rule 7 refund ladder is not applied. As when the clinic withdraws or drops out, the patient is always refunded in full everything paid and pays no cancellation fee; the system issues no refund automatically, and the admin issues the full refund through admin financial resolution (Screen 4b, mandatory reason, audit trail). A replacement booking through the FR-006 provider-fault transfer takes a new payment. The fixed clinic cancellation charge applies to a clinic withdrawal or drop-out only, not to a provider suspension or deactivation (FR-006 Alternative Flow B4). Captured patient payments on these bookings, including payments captured while the cancellation cascade was running, remain recorded against the booking invoice and are routed to admin financial resolution through the existing refund and adjustment controls (Screen 4b, mandatory reason, audit trail). Provider reactivation does not restore cancelled bookings or their payout eligibility", "rationale": "General Module Rule 13 (prd.md line 1175). Restated by the provider-suspension edge case (lines 1743-1751: a procedure already recorded as completed under FR-010 is not erased by the cancellation). Owner ruling 2026-11-22: a provider-status cancellation takes the same payment terms as a provider withdrawal or drop-out (FR-006 Alternative Flow B4 and B5): full refund of everything paid, no cancellation fee, new payment on the replacement booking; the fixed clinic charge is not extended to it."}}
  - {"op": "update_node", "id": "REQ-017-094", "attrs": {"statement": "Modal auto-calculates refund amount using the refund ladder set in FR-029 / A-09 based on days until treatment at time admin opens the modal; the ladder does not apply to a provider-fault refund (Rules 13 and 19), where the amount follows that rule. Adjusted Refund Amount defaults to Calculated Refund Amount. Non-Refundable Amount: invoice amount − Final Refund Amount. Labelled \"Platform fee (non-refundable)\""}}
  - {"op": "update_node", "id": "REQ-017-095", "attrs": {"statement": "Adjusted Refund Amount can be changed ONLY for eligible partial or discretionary pre-treatment refunds and for provider-fault refunds (Rule 13 full refund, Rule 19 admin-set amount from zero to the full amount paid); if changed, Adjustment Justification becomes mandatory. Partial refunds (e.g., cancelling add-on packages only) use the same modal; the pre-calculated amount can be manually adjusted by admin with mandatory justification in the Adjustment Justification field"}}
  - {"op": "update_node", "id": "REQ-017-097", "attrs": {"statement": "If treatment date has already passed (treatment completed; a Rule 19 interrupted treatment is not covered here, the admin sets that amount), the <15 days tier applies (0% refund) — admin sees \"0% refund — treatment has been completed\" and the Confirm button is disabled; admin must use Override Status instead if a discretionary refund is needed"}}
  - {"op": "add_node", "id": "REQ-017-185", "type": "Rule", "owner_fr": "FR-017", "title": "Interrupted treatment: admin sets the refund, payout held until decided", "attrs": {"statement": "When a treatment already started is interrupted by the provider's fault (FR-006 Alternative Flow B7, booking `In Progress`), the Rule 7 refund ladder is not applied. An admin reviews each case and sets the patient refund amount, from zero up to the full amount paid, with a mandatory reason and an audit entry, through the existing refund control (Screen 4b). The provider's payout for that booking is held until the admin decides", "rationale": "General Module Rule 19 (prd.md line 1181), added by the owner ruling 2026-11-22 for FR-006 Alternative Flow B7 (provider fault while the booking is In Progress). Restated by the provider-suspension edge case (In Progress bullet) and the Screen 4b business rules on provider-fault refunds."}}
