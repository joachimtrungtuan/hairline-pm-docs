  - {"op": "add_node", "id": "SET-benchmark-refresh-frequency", "type": "Setting", "owner_fr": "FR-026", "title": "Benchmark refresh frequency", "attrs": {"description": "How often benchmarks are refreshed: Daily, Weekly or Monthly.", "default": "Weekly"}}
  - {"op": "add_node", "id": "SET-target-monthly-commission", "type": "Setting", "owner_fr": "FR-026", "title": "Target monthly commission", "attrs": {"description": "Optional platform target for monthly commission shown as a reference line in FR-014; blank hides the line."}}
