  - {"op": "update_node", "id": "SET-quote-currency", "attrs": {"description": "Currency of a quote. Read from the FR-029 Default Currency; FR-026 holds no separate currency value. Each Default Currency change creates a new Quote Configuration version."}}  # stub updated, owner FR-026
  - {"op": "update_node", "id": "SET-quote-expiring-soon-lead-time", "attrs": {"description": "Hours before a quote expires at which the quote-expiring-soon reminder is sent. Whole hours from 1 up to half of the quote expiry window.", "default": "12", "unit": "hours"}}  # stub updated, owner FR-026
