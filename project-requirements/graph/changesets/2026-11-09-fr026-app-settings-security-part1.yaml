  - {"op": "add_node", "id": "SET-ttfq-sla-target", "type": "Setting", "owner_fr": "FR-026", "title": "Time-to-first-quote SLA target", "attrs": {"description": "Platform-wide target for time to first quote, in positive whole minutes.", "default": "120", "unit": "minutes"}}
  - {"op": "add_node", "id": "SET-at-risk-threshold", "type": "Setting", "owner_fr": "FR-026", "title": "At Risk threshold", "attrs": {"description": "Whole days of provider inactivity after which a provider is At Risk.", "default": "7", "unit": "days"}}
