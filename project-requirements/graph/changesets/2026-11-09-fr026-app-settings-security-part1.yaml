  - {"op": "update_node", "id": "SET-inquiry-cancellation-reasons", "attrs": {"description": "Ordered list of reasons offered when a patient cancels an inquiry; each has a requires-explanation flag and an active flag. Consumer FR-003 Screen 8a."}}  # stub updated, owner FR-026
  - {"op": "update_node", "id": "SET-inquiry-lead-time", "attrs": {"description": "Versioned minimum inquiry lead time: whole days from 0 through 730, applied to the calendar and to submission validation. Consumer FR-003 Screen 5.", "default": "3", "unit": "days"}}  # stub updated, owner FR-026
