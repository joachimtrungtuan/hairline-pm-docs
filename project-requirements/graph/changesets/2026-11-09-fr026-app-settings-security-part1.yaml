  - {"op": "update_node", "id": "SET-slot-hold-duration", "attrs": {"description": "Hours a slot hold lasts once placed. Whole hours from 24 to 168.", "default": "48", "unit": "hours"}}  # stub updated, owner FR-026
  - {"op": "add_node", "id": "REQ-026-001", "type": "Rule", "owner_fr": "FR-026", "title": "Settings UI limited to Settings Manager and Settings Viewer", "attrs": {"statement": "System MUST provide Settings Management UI accessible only to admins with \"Settings Manager\" or \"Settings Viewer\" role", "rationale": "Screen 1 states a different permission name (\"Settings Management\"); see the open question on permission naming."}}
  - {"op": "add_node", "id": "REQ-026-002", "type": "Rule", "owner_fr": "FR-026", "title": "Change reason required for every setting change", "attrs": {"statement": "System MUST require change reason (10-500 characters) for all setting modifications", "rationale": "Restated by General Module Rule 1 and Main Flow step 9 (modal titled \"Change Reason\", 10-500 chars, shown after Save) and by the Screen Specification notes and the A1 to A9 workflows."}}
  - {"op": "add_node", "id": "REQ-026-003", "type": "Rule", "owner_fr": "FR-026", "title": "Setting changes versioned with auto-incremented numbers", "attrs": {"statement": "System MUST version all setting changes with auto-incremented version numbers (v1.0, v1.1, v1.2, etc.)", "rationale": "Restated by General Module Rule 2 and Main Flow step 11."}}
  - {"op": "add_node", "id": "REQ-026-004", "type": "Rule", "owner_fr": "FR-026", "title": "Immutable audit log entry for every change", "attrs": {"statement": "System MUST create immutable audit log for every change capturing: timestamp, admin ID, admin email, setting group, old values, new values, change reason", "rationale": "Restated by Audit Rule 1, Audit Rule 2 (no deletion, no editing) and Main Flow step 10; Screen 7 states that version history is immutable."}}
  - {"op": "add_node", "id": "REQ-026-005", "type": "Rule", "owner_fr": "FR-026", "title": "Changes propagate within 1 minute by polling", "attrs": {"statement": "System MUST propagate setting changes to dependent services within 1 minute via polling mechanism", "rationale": "Restated by General Module Rule 3 (60-second polling interval), the Entry Points and Main Flow step 15."}}
  - {"op": "add_node", "id": "REQ-026-006", "type": "Rule", "owner_fr": "FR-026", "title": "Settings cache invalidated immediately on save", "attrs": {"statement": "System MUST invalidate settings cache immediately upon save to trigger propagation", "rationale": "Restated by General Module Rule 4 and Main Flow step 13."}}
  - {"op": "add_node", "id": "REQ-026-007", "type": "Rule", "owner_fr": "FR-026", "title": "No rollback; forward-only changes", "attrs": {"statement": "System MUST NOT support rollback. Admins make forward-only changes; version history is read-only.", "rationale": "Restated by the Executive Summary and the Admin Platform scope."}}
  - {"op": "add_node", "id": "REQ-026-008", "type": "Rule", "owner_fr": "FR-026", "title": "Version history newest first with diff highlighting", "attrs": {"statement": "System MUST display version history in reverse chronological order with diff highlighting (old → new)", "rationale": "Restated by the Screen 7 business rules."}}
  - {"op": "add_node", "id": "REQ-026-009", "type": "Rule", "owner_fr": "FR-026", "title": "Authentication throttling settings and ranges", "attrs": {"statement": "System MUST store authentication throttling settings: max login attempts (1-10), lockout duration (5-60 minutes)", "rationale": "Restated by Main Flow step 8, Alternative Flow B1 and the Admin Editability Rules; Screen 2 field validation ranges."}}
  - {"op": "add_node", "id": "REQ-026-010", "type": "Rule", "owner_fr": "FR-026", "title": "OTP configuration settings and ranges", "attrs": {"statement": "System MUST store OTP configuration: expiry time (5-30 minutes), resend cooldown (30-300 seconds), max resend attempts (3-10)", "rationale": "Restated by the Admin Editability Rules and the Screen 3 field validation ranges."}}
  - {"op": "add_node", "id": "REQ-026-011", "type": "Rule", "owner_fr": "FR-026", "title": "Centrally managed country list", "attrs": {"statement": "System MUST store centrally managed country list: country name, ISO code, calling code, country flag asset URL (stored via S-05 Media Storage, nullable), display order, active status", "rationale": "Flag assets are stored in centralized media storage/CDN (S-05) and referenced by URL. Screen 4 marks the Country Flag field Required = Yes while this rule and Entity 4 say nullable; see the open question on country flag."}}
  - {"op": "add_node", "id": "REQ-026-012", "type": "Rule", "owner_fr": "FR-026", "title": "Centrally managed discovery question options", "attrs": {"statement": "System MUST store centrally managed discovery question options: answer option, display order, active status"}}
  - {"op": "add_node", "id": "REQ-026-013", "type": "Rule", "owner_fr": "FR-026", "title": "OTP email templates stored with version number", "attrs": {"statement": "System MUST store OTP email templates: template name, subject line, HTML body, plain text body, version number"}}
  - {"op": "add_node", "id": "REQ-026-014", "type": "Rule", "owner_fr": "FR-026", "title": "Sensitive values masked in UI and audit logs", "attrs": {"statement": "System MUST mask sensitive values (API keys, secrets) in UI and audit logs (display as \"••••••••\" or \"[REDACTED]\")", "rationale": "Restated by Privacy Rule 1 (UI) and Privacy Rule 2 (audit logs), and the Admin Platform scope."}}
  - {"op": "add_node", "id": "REQ-026-015", "type": "Rule", "owner_fr": "FR-026", "title": "\"View Sensitive Settings\" limited to authorized admins", "attrs": {"statement": "System MUST restrict \"View Sensitive Settings\" permission to authorized admins only", "rationale": "Restated by Privacy Rule 3 and the Admin Platform scope."}}
  - {"op": "add_node", "id": "REQ-026-016", "type": "Rule", "owner_fr": "FR-026", "title": "Sensitive values encrypted at rest with AES-256", "attrs": {"statement": "System MUST encrypt sensitive values at rest using AES-256"}}
  - {"op": "add_node", "id": "REQ-026-017", "type": "Rule", "owner_fr": "FR-026", "title": "Admin MFA is a future requirement tied to FR-031", "attrs": {"statement": "Multi-factor authentication for admin access to Settings Management UI is a future (non-MVP) requirement and MUST be enforced once the shared MFA stack (FR-031) is delivered.", "rationale": "Future (non-MVP) requirement; the PRD defers it to the shared MFA stack of FR-031."}}
  - {"op": "add_node", "id": "REQ-026-018", "type": "Rule", "owner_fr": "FR-026", "title": "Settings API rate limited to 100 requests per minute per admin", "attrs": {"statement": "System MUST rate limit Settings API to 100 requests/minute per admin to prevent abuse"}}
  - {"op": "add_node", "id": "REQ-026-019", "type": "Rule", "owner_fr": "FR-026", "title": "Audit logs retained for at least 10 years", "attrs": {"statement": "System MUST retain audit logs for minimum 10 years per compliance requirements", "rationale": "Restated by Audit Rule 3 and the Security Considerations compliance bullet."}}
  - {"op": "add_node", "id": "REQ-026-020", "type": "Rule", "owner_fr": "FR-026", "title": "Admin inputs validated against XSS, SQL and command injection", "attrs": {"statement": "System MUST validate all admin inputs to prevent XSS, SQL injection, command injection attacks"}}
  - {"op": "add_node", "id": "REQ-026-021", "type": "Rule", "owner_fr": "FR-026", "title": "Settings API exposed for dependent services to poll", "attrs": {"statement": "System MUST expose Settings API (RESTful) for dependent services to poll configurations"}}
  - {"op": "add_node", "id": "REQ-026-022", "type": "Rule", "owner_fr": "FR-026", "title": "Settings API response carries version, values and last-modified", "attrs": {"statement": "Settings API MUST return JSON response with version number, setting values, and last modified timestamp"}}
  - {"op": "add_node", "id": "REQ-026-023", "type": "Rule", "owner_fr": "FR-026", "title": "Settings API supports OAuth 2.0 with read:settings and write:settings", "attrs": {"statement": "Settings API MUST support OAuth 2.0 authentication with \"read:settings\" or \"write:settings\" scopes"}}
  - {"op": "add_node", "id": "REQ-026-024", "type": "Rule", "owner_fr": "FR-026", "title": "No rollback API exposed", "attrs": {"statement": "System MUST NOT expose a rollback API."}}
  - {"op": "add_node", "id": "REQ-026-025", "type": "Rule", "owner_fr": "FR-026", "title": "Patient configuration response returns treatment areas and lead days together", "attrs": {"statement": "The patient configuration response MUST return active ordered treatment-area options and `minimum_inquiry_lead_days` together so the client calendar and backend validator use one configuration source.", "rationale": "Screen 5c adds that the API must not return inactive options for new inquiries."}}
  - {"op": "add_node", "id": "REQ-026-026", "type": "Rule", "owner_fr": "FR-026", "title": "Settings API returns the whole Quote Configuration at once", "attrs": {"statement": "The authenticated Settings API MUST return the quote currency, the quote expiry window, both lead times, the slot-hold duration, the configuration version, and the last-modified timestamp together, so FR-004 sends each parent Quote from one consistent configuration version and can record that version on the quote.", "rationale": "Quote currency and expiry window are copied onto the quote at first send by FR-004."}}
  - {"op": "add_node", "id": "REQ-026-027", "type": "Rule", "owner_fr": "FR-026", "title": "Quote Configuration changes affect only quotes first sent after activation", "attrs": {"statement": "Quote Configuration changes MUST affect only quotes first sent after activation; the currency and expiry already copied onto a sent quote MUST remain unchanged, drafts MUST carry neither value, and no per-quote extension is allowed.", "rationale": "Restated by workflow A7 step 6 and the Screen 5d business rules."}}
  - {"op": "add_node", "id": "REQ-026-028", "type": "Rule", "owner_fr": "FR-026", "title": "Settings API returns the whole Analytics Configuration at once", "attrs": {"statement": "The authenticated Settings API MUST return all Analytics Configuration values with the configuration version and last-modified timestamp so FR-014 calculations use one consistent version and can record it with their aggregates."}}
  - {"op": "add_node", "id": "REQ-026-029", "type": "Rule", "owner_fr": "FR-026", "title": "Analytics Configuration changes apply to every displayed period; exports untouched", "attrs": {"statement": "Analytics Configuration changes MUST apply from FR-014's next calculation or benchmark refresh to every period then displayed (past periods are not frozen), and MUST NOT rewrite exports or scheduled-export files that were already generated.", "rationale": "Restated by the Screen 5e recalculation rule."}}
  - {"op": "add_node", "id": "REQ-026-030", "type": "Rule", "owner_fr": "FR-026", "title": "Each slot hold uses the duration in effect when placed", "attrs": {"statement": "Each slot hold MUST use the slot-hold duration in effect when the hold is placed (at subquote acceptance or an FR-006 admin revive); later changes MUST NOT alter an existing hold, and payment failure MUST NOT extend or restart a hold.", "rationale": "Restated by workflow A7 step 7, the Screen 5d business rules and the edge case on changing the slot-hold duration while holds are active."}}
  - {"op": "add_node", "id": "REQ-026-031", "type": "Rule", "owner_fr": "FR-026", "title": "Lead-time changes apply only to reminders not yet sent", "attrs": {"statement": "Changes to the quote-expiring-soon or hold-expiring-soon lead time MUST apply only to reminders not yet sent."}}
  - {"op": "add_node", "id": "REQ-026-032", "type": "Rule", "owner_fr": "FR-026", "title": "Centrally managed inquiry cancellation reasons", "attrs": {"statement": "System MUST store centrally managed inquiry cancellation reason options: reason label, requires_explanation flag, display order, active status. Consumer: FR-003 Screen 8a.", "rationale": "PRD id REQ-026-012a, renumbered. Consumer FR-003 Screen 8a."}}
  - {"op": "add_node", "id": "REQ-026-033", "type": "Rule", "owner_fr": "FR-026", "title": "Centrally managed account deletion reasons", "attrs": {"statement": "System MUST store centrally managed account deletion reason options: reason label, requires_explanation flag, display order, active status. Consumer: FR-001 Screen 16.", "rationale": "PRD id REQ-026-012b, renumbered. Consumer FR-001 Screen 16."}}
  - {"op": "add_node", "id": "REQ-026-034", "type": "Rule", "owner_fr": "FR-026", "title": "Centrally managed inquiry treatment-area options", "attrs": {"statement": "System MUST store centrally managed inquiry treatment-area options: stable option ID, label, image/icon asset URL, display order, and active status. Consumer: FR-003 Screen 1.", "rationale": "PRD id REQ-026-012c, renumbered. Consumer FR-003 Screen 1."}}
  - {"op": "add_node", "id": "REQ-026-035", "type": "Rule", "owner_fr": "FR-026", "title": "Versioned minimum inquiry lead time, 0 to 730 days", "attrs": {"statement": "System MUST store a versioned minimum inquiry lead time as a whole number of days from 0 through 730. Default: 3 days. Consumer: FR-003 Screen 5 and submission validation.", "rationale": "PRD id REQ-026-012d, renumbered. Consumer FR-003 Screen 5."}}
  - {"op": "add_node", "id": "REQ-026-036", "type": "Rule", "owner_fr": "FR-026", "title": "Final active treatment-area option cannot be deactivated", "attrs": {"statement": "System MUST prevent deactivation of the final active inquiry treatment-area option.", "rationale": "PRD id REQ-026-012e, renumbered."}}
  - {"op": "add_node", "id": "REQ-026-037", "type": "Rule", "owner_fr": "FR-026", "title": "One versioned Quote Configuration; currency is the FR-029 Default Currency", "attrs": {"statement": "System MUST store one versioned Quote Configuration containing the quote expiry window (whole hours from 24 to 336, default 48), the quote-expiring-soon lead time (whole hours from 1 up to half of the expiry window, default 12), the slot-hold duration (whole hours from 24 to 168, default 48), and the hold-expiring-soon lead time (whole hours from 1 up to half of the slot-hold duration, default 12). The quote currency MUST be the FR-029 Default Currency, not a separate setting, and each change to the FR-029 Default Currency MUST create a new Quote Configuration version so the version recorded on a quote identifies both the hours and the currency used. Consumers: FR-004 (currency, expiry window, quote-expiring-soon lead time), FR-005 and FR-006 (slot-hold duration), and FR-006 (hold-expiring-soon lead time).", "rationale": "PRD id REQ-026-012f, renumbered. FR-026 keeps no second currency setting."}}
  - {"op": "add_node", "id": "REQ-026-038", "type": "Rule", "owner_fr": "FR-026", "title": "One versioned Analytics Configuration", "attrs": {"statement": "System MUST store one versioned Analytics Configuration containing TTFQ SLA target (positive whole minutes, default 120), At Risk threshold (whole days, default 7), Dormant threshold (whole days, greater than At Risk, default 30), price outlier threshold (whole percent 1-100, default 30), benchmark refresh frequency (Daily, Weekly, or Monthly; default Weekly), and optional target monthly commission (blank by default). Consumer: FR-014.", "rationale": "PRD id REQ-026-012g, renumbered. Consumer FR-014."}}
  - {"op": "add_node", "id": "REQ-026-039", "type": "Rule", "owner_fr": "FR-026", "title": "Centrally managed Provider Specialties list", "attrs": {"statement": "System MUST store a centrally managed Provider Specialties list: stable specialty ID, specialty name (max 100 chars, unique case-insensitive), display order, active status; seeded with Hair Transplant Surgeon, Dermatologist, Trichologist, Plastic Surgeon, Other. Admins can add, rename, reorder, and deactivate values (no hard delete); at least one value MUST remain active; changes MUST be versioned and audit-logged. Deactivated values MUST be hidden from new selection while providers that hold them keep and still display them; renames MUST apply to display everywhere. Consumer: FR-015 Screen 2 Step 2 and Screen 3 Tab 1.", "rationale": "PRD id REQ-026-012h, renumbered. Consumer FR-015."}}
  - {"op": "add_node", "id": "REQ-026-040", "type": "Rule", "owner_fr": "FR-026", "title": "Settings consumers by platform", "attrs": {"statement": "Patient Platform (P-01) consumes authentication policies, OTP configurations, country/calling code lists, discovery question options, inquiry cancellation reason options, and account deletion reason options. Provider Platform (PR-06 and PR-02) consumes centrally managed profile lists and the versioned Quote Configuration. Quote Acceptance and Booking (FR-005 and FR-006) consume the versioned slot-hold duration and the hold-expiring-soon reminder lead time. Admin Platform (A-02) FR-015 consumes the Provider Specialties list. Analytics (PR-05 and A-08) FR-014 consumes the versioned Analytics Configuration. Shared Services (S-03) Notification Service consumes OTP email templates. Admin Platform (A-09) is the primary interface for viewing, editing, and versioning all settings.", "rationale": "Module Scope, Multi-Tenant Architecture."}}
  - {"op": "add_node", "id": "REQ-026-041", "type": "Rule", "owner_fr": "FR-026", "title": "Patient platform applies throttling, OTP and centrally managed lists", "attrs": {"statement": "Patient registration and login flows apply authentication throttling policies. OTP verification for email confirmation applies OTP expiry and resend cooldown. Profile forms use centrally managed country and calling code lists. Discovery questions (\"How did you find us?\") display options from the centralized list.", "rationale": "Module Scope, Multi-Tenant Breakdown, Patient Platform (P-01)."}}
  - {"op": "add_node", "id": "REQ-026-042", "type": "Rule", "owner_fr": "FR-026", "title": "Provider platform applies throttling and OTP parameters", "attrs": {"statement": "Authentication throttling (PR-01) applies to provider login attempts. OTP parameters (PR-01) apply to provider email verification flows. Provider staff management (PR-06) indirectly uses centrally managed lists.", "rationale": "Module Scope, Multi-Tenant Breakdown, Provider Platform."}}
  - {"op": "add_node", "id": "REQ-026-043", "type": "Rule", "owner_fr": "FR-026", "title": "Boundaries of FR-026", "attrs": {"statement": "Out of scope for FR-026: actual email sending (handled by S-03: Notification Service); SMS notifications (future enhancement, V2); push notification templates (handled separately in notification preferences module); legal content management (see FR-027: Terms & Conditions, Privacy Policy, Consent forms); regional configuration and pricing (see FR-028: Location presentation, starting prices by currency); payment system configuration (see FR-029: Stripe account management, conversion rates, split payment rules); notification rules and event-based triggers (see FR-030: Event-to-notification mapping, channel configuration); admin access control and role-based permissions (see FR-031: Role management, permission matrix).", "rationale": "Communication Structure, Out of Scope. Boundary recorded as the PRD states it (D10)."}}
  - {"op": "add_node", "id": "REQ-026-044", "type": "Rule", "owner_fr": "FR-026", "title": "Entry points to settings", "attrs": {"statement": "Admin reaches settings through Settings, Authentication & Security (throttling policies), Settings, App Data (country lists, discovery questions, inquiry cancellation reasons, account deletion reasons, provider specialties, inquiry configuration, quote configuration), Settings, Notifications (OTP email templates) and Settings, Analytics (analytics configuration consumed by FR-014).", "rationale": "Entry Points, Admin-Initiated."}}
  - {"op": "add_node", "id": "REQ-026-045", "type": "Rule", "owner_fr": "FR-026", "title": "Out-of-range values rejected before save with a range message", "attrs": {"statement": "The system validates admin input before save and rejects an out-of-range value with an error message stating the valid range (for example, \"Max Login Attempts must be between 1 and 10\" for 0); the admin corrects the value and the system re-validates.", "rationale": "Alternative Flow B1."}}
  - {"op": "add_node", "id": "REQ-026-046", "type": "Rule", "owner_fr": "FR-026", "title": "Consumers keep cached settings when the Settings API fails", "attrs": {"statement": "If a consuming platform cannot retrieve updated settings (for example a network timeout on the Settings API), it logs the error, continues using its cached settings, and retries on the next scheduled 60-second poll; on a successful retry it applies the updated settings. The system logs the propagation delay but does not alert (self-healing).", "rationale": "Alternative Flow B2, the Settings API unreachable edge case and Integration 1. The edge case and Integration 1 say cached settings are used for up to 1 minute, then the error is logged and the poll retried; see the open question on cache duration."}}
  - {"op": "add_node", "id": "REQ-026-047", "type": "Rule", "owner_fr": "FR-026", "title": "Notification Service falls back to a default template", "attrs": {"statement": "If the Settings API is unreachable when the Notification Service retrieves an OTP email template, the Notification Service uses a fallback template (hardcoded default) and logs the error for admin review.", "rationale": "Implementation Notes, Integration 2 (a business rule inside the technical section)."}}
  - {"op": "add_node", "id": "REQ-026-048", "type": "Rule", "owner_fr": "FR-026", "title": "Settings API stays available during deployments", "attrs": {"statement": "The Settings API remains available during deployments; the Patient app retrieves settings after restart; no data is lost.", "rationale": "Edge case on settings propagation during a Patient app deployment."}}
  - {"op": "add_node", "id": "REQ-026-049", "type": "Rule", "owner_fr": "FR-026", "title": "Concurrent edits to one setting group are detected before save", "attrs": {"statement": "The system detects a concurrent edit by two admins to the same setting group before save and displays a modal popup: \"This setting was updated by [admin email] 30 seconds ago. Your changes may conflict. Review the latest version before saving.\" The modal shows a diff of the latest changes and the options \"Reload Latest Version\" or \"Save Anyway (Overwrite)\".", "rationale": "Edge case on concurrent edits."}}
  - {"op": "add_node", "id": "REQ-026-050", "type": "Rule", "owner_fr": "FR-026", "title": "Timestamps stored in UTC, shown in the admin local timezone", "attrs": {"statement": "All timestamps MUST be stored in UTC and displayed in admin's local timezone.", "rationale": "General Module Rule 5."}}
  - {"op": "add_node", "id": "REQ-026-051", "type": "Rule", "owner_fr": "FR-026", "title": "Admin activity logs exempt from GDPR deletion requests", "attrs": {"statement": "Admin activity logs are exempt from GDPR deletion requests (business records, legal requirement).", "rationale": "Data & Privacy Rules, GDPR line."}}
  - {"op": "add_node", "id": "REQ-026-052", "type": "Rule", "owner_fr": "FR-026", "title": "Sensitive values masked in version history; unmask by permission", "attrs": {"statement": "Sensitive values are masked in version history (displayed as \"[REDACTED]\"); admins with \"View Sensitive Settings\" permission can click \"Show\" to unmask them.", "rationale": "Edge case on sensitive value visibility in version history, and the Screen 7 business rule."}}
  - {"op": "add_node", "id": "REQ-026-053", "type": "Rule", "owner_fr": "FR-026", "title": "Audit trail also records IP address and user agent", "attrs": {"statement": "All admin actions are logged with IP address, user agent, timestamp, and change details.", "rationale": "Security Considerations, Audit trail. REQ-026-004 lists a narrower set of audit fields; the lists are complementary."}}
  - {"op": "add_node", "id": "REQ-026-054", "type": "Rule", "owner_fr": "FR-026", "title": "Settings roles and what each may do", "attrs": {"statement": "Role-based access control is enforced: the \"Settings Manager\" role can view and edit all settings; the \"Settings Viewer\" role can view settings and version history (read-only); the \"Security Admin\" role can view sensitive values (API keys, secrets) unmasked.", "rationale": "Security Considerations and Dependencies. FR-031 owns role management and the permission matrix; this rule records only what FR-026 states. See the open question on roles versus the \"Settings Management\" permission."}}
  - {"op": "add_node", "id": "REQ-026-055", "type": "Rule", "owner_fr": "FR-026", "title": "Password policy fixed in codebase", "attrs": {"statement": "Password policy is fixed in codebase and not admin-editable: minimum 12 characters, at least 1 uppercase, 1 lowercase, 1 digit, 1 special character from !@#$%^&(),.?\":{}|<>.", "rationale": "Admin Editability Rules, Fixed in Codebase; shown view-only on Screen 1."}}
  - {"op": "add_node", "id": "REQ-026-056", "type": "Rule", "owner_fr": "FR-026", "title": "IP and device rate limiting fixed, independent of per-user throttling", "attrs": {"statement": "IP/device-level rate limiting is fixed at the application layer and not admin-configurable: max 20 failed login attempts per IP address per hour with a 1-hour IP lockout. It is enforced independently of the per-user authentication throttling configured in Screen 2; both constraints apply simultaneously (whichever triggers first locks the user out).", "rationale": "Admin Editability Rules, Fixed in Codebase, and Security Considerations."}}
  - {"op": "add_node", "id": "REQ-026-057", "type": "Rule", "owner_fr": "FR-026", "title": "Discovery question text fixed", "attrs": {"statement": "The discovery question text is FIXED as \"How did you find out about us?\" and is not editable.", "rationale": "Admin Editability Rules, Fixed in Codebase, and Screen 5."}}
  - {"op": "add_node", "id": "REQ-026-058", "type": "Rule", "owner_fr": "FR-026", "title": "OTP email template names fixed", "attrs": {"statement": "OTP email template names are fixed: admins cannot rename the templates.", "rationale": "Admin Editability Rules, Fixed in Codebase, and Screen 6."}}
  - {"op": "add_node", "id": "REQ-026-059", "type": "Rule", "owner_fr": "FR-026", "title": "Setting groups are predefined", "attrs": {"statement": "The setting group structure is predefined: admins cannot create new setting groups.", "rationale": "Admin Editability Rules, Fixed in Codebase."}}
  - {"op": "add_node", "id": "REQ-026-060", "type": "Rule", "owner_fr": "FR-026", "title": "OTP code length fixed at 6 digits", "attrs": {"statement": "OTP code length is FIXED at 6 digits in codebase and is not editable.", "rationale": "Admin Editability Rules, Fixed in Codebase, and Screen 3 business rules."}}
  - {"op": "add_node", "id": "REQ-026-061", "type": "Rule", "owner_fr": "FR-026", "title": "FR-024 and FR-011 build on the FR-026 settings infrastructure", "attrs": {"statement": "FR-026 provides the settings infrastructure (audit trail, versioning, UI shell); FR-024 implements treatment-specific CRUD operations and FR-011 implements aftercare milestone template management within that infrastructure, sharing the Settings Management UI and audit trail.", "rationale": "Dependencies, Downstream Consumers. Listed for traceability."}}
  - {"op": "add_node", "id": "REQ-026-062", "type": "Rule", "owner_fr": "FR-026", "title": "A reason deactivated mid-flow is still accepted for that submission", "attrs": {"statement": "If an admin deactivates a cancellation reason while a patient is mid-cancellation, the patient app uses its cached reason list (up to 1 minute stale); a submission with a now-deactivated reason is still accepted because the reason was valid at flow start, and the next cancellation flow loads the updated list.", "rationale": "Edge case on deactivating a cancellation reason mid-flow."}}
  - {"op": "add_node", "id": "REQ-026-063", "type": "Rule", "owner_fr": "FR-026", "title": "Quote send blocked when the Settings API is unavailable", "attrs": {"statement": "If the Settings API is unavailable as a provider first sends a quote, FR-004 blocks the send and keeps the quote as a draft; the quote is never sent with a guessed or stale currency or expiry. The provider can retry.", "rationale": "Edge case on the Settings API being unavailable at first send."}}
  - {"op": "add_node", "id": "REQ-026-064", "type": "Rule", "owner_fr": "FR-026", "title": "Seeded discovery question options", "attrs": {"statement": "Discovery Questions are seeded with \"Search Engine\" (Order 1), \"Social Media\" (Order 2) and \"Friend Referral\" (Order 3).", "rationale": "Implementation Notes, Initial Configuration / Seeding."}}
  - {"op": "add_node", "id": "REQ-026-065", "type": "Rule", "owner_fr": "FR-026", "title": "Seeded inquiry cancellation reasons", "attrs": {"statement": "Inquiry Cancellation Reasons are seeded with: \"Changed my mind\" (Order 1), \"Found a better option elsewhere\" (2), \"Medical concerns\" (3), \"Financial reasons\" (4), \"Travel restrictions\" (5), \"Timeline doesn't work\" (6), each with Requires Explanation = No; and \"Other\" (7) with Requires Explanation = Yes, FIXED, which cannot be deactivated.", "rationale": "Implementation Notes, Initial Configuration / Seeding."}}
  - {"op": "add_node", "id": "REQ-026-066", "type": "Rule", "owner_fr": "FR-026", "title": "Seeded account deletion reasons", "attrs": {"statement": "Account Deletion Reasons are seeded with: \"I no longer use this app\" (Order 1), \"I found a better alternative\" (2), \"The app doesn't meet my needs\" (3), \"Too many notifications or emails\" (4), \"Concerns about privacy or data security\" (5), \"I had technical issues or bugs\" (6), \"The app is difficult to use\" (7), \"I'm taking a break and may return later\" (8), each with Requires Explanation = No; and \"Others\" (9) with Requires Explanation = Yes, FIXED, which cannot be deactivated.", "rationale": "Implementation Notes, Initial Configuration / Seeding."}}
  - {"op": "add_node", "id": "REQ-026-067", "type": "Rule", "owner_fr": "FR-026", "title": "Seeded minimum country set", "attrs": {"statement": "The country list is seeded with at least: Turkey (TR, +90), UK (GB, +44), USA (US, +1) and Germany (DE, +49).", "rationale": "Implementation Notes, Initial Configuration / Seeding (minimum initial set)."}}
  - {"op": "add_node", "id": "REQ-026-068", "type": "Rule", "owner_fr": "FR-026", "title": "Seeded OTP email templates", "attrs": {"statement": "The default \"Verification Email\" and \"Password Reset Email\" templates MUST be seeded with standard branding and variables.", "rationale": "Implementation Notes, Initial Configuration / Seeding."}}
  - {"op": "add_node", "id": "REQ-026-069", "type": "Rule", "owner_fr": "FR-026", "title": "Template HTML sanitized; previews run under a restrictive policy", "attrs": {"statement": "Email template HTML MUST be sanitized server-side: script, iframe, form and similar tags, event-handler attributes, and javascript:, data: and other non-whitelisted URL protocols (only http, https and mailto are allowed) are stripped or rejected, and dangerous CSS is removed; variable substitution still renders. The template preview MUST render with a restrictive content security policy that blocks scripts.", "rationale": "Implementation Notes, Security Considerations, HTML Sanitization for Email Templates (a business rule inside the technical section). Condensed: tag and attribute allow-lists, library names and XSS test cases stay in the technical spec."}}
  - {"op": "add_node", "id": "ENT-setting-group", "type": "Entity", "owner_fr": "FR-026", "title": "Setting group", "attrs": {"description": "A predefined collection of related settings (for example Authentication Throttling, OTP Configuration) that admins view, edit and version together."}}
  - {"op": "add_node", "id": "ENT-setting-version", "type": "Entity", "owner_fr": "FR-026", "title": "Setting version", "attrs": {"description": "One saved version of a setting group configuration, with the change reason."}}
  - {"op": "add_node", "id": "ENT-settings-audit-entry", "type": "Entity", "owner_fr": "FR-026", "title": "Settings audit log entry", "attrs": {"description": "Immutable record of one setting change, kept at least 10 years."}}
