  - {"op": "add_node", "id": "REQ-016-013", "type": "Rule", "owner_fr": "FR-016", "title": "Allow admins to update patient profile information (name, email, phone", "attrs": {"statement": "System MUST allow admins to update patient profile information (name, email, phone, location) with justification and audit logging", "rationale": "Stated in prd.md, Admin Intervention Requirements (line 1116). Restated: prd.md line 705: \"Patient profile information (name, email, phone, location) with justification\""}}
  - {"op": "add_node", "id": "REQ-016-014", "type": "Rule", "owner_fr": "FR-016", "title": "Require admins to enter access justification before viewing patient", "attrs": {"statement": "System MUST require admins to enter access justification before viewing patient medical data (minimum 20 characters)", "rationale": "Stated in prd.md, Data Governance Requirements (line 1125). Restated: prd.md line 143: \"System requests admin justification for access (audit trail requirement)\" prd.md line 454: \"Admin reason for viewing medical data; Min 20 characters\" prd.md line 465: \"CRITICAL: Admin must enter justification before viewing medical data (audit compliance)\" prd.md line 685: \"Admin access to patient medical data MUST trigger access justification prompt (HIPAA/GDPR compliance)\""}}
  - {"op": "add_node", "id": "REQ-016-015", "type": "Rule", "owner_fr": "FR-016", "title": "Log all medical data access in audit trail (who accessed, when, what", "attrs": {"statement": "System MUST log all medical data access in audit trail (who accessed, when, what data viewed, justification)", "rationale": "Stated in prd.md, Data Governance Requirements (line 1126). Restated: prd.md line 145: \"System logs access with timestamp, admin ID, and justification\" prd.md line 153: \"System marks medical data access in audit log\" prd.md line 468: \"Every access logged with: admin ID, timestamp, justification, data viewed\" prd.md line 692: \"Admin access to patient medical data MUST be logged with justification (Protected Health Information)\""}}
  - {"op": "add_node", "id": "REQ-016-016", "type": "Rule", "owner_fr": "FR-016", "title": "Process patient data deletion requests (GDPR) via anonymization +", "attrs": {"statement": "System MUST process patient data deletion requests (GDPR) via anonymization + archival workflow, retaining compliance records (7 years)", "rationale": "Stated in prd.md, Data Governance Requirements (line 1127). Restated: prd.md line 298: \"System executes deletion workflow (soft delete with anonymization)\" prd.md line 696: \"Patient data deletion requests (GDPR right to be forgotten) MUST result in anonymization + archival, not permanent deletion\""}}
  - {"op": "add_node", "id": "REQ-016-017", "type": "Rule", "owner_fr": "FR-016", "title": "Prevent hard deletion of patient accounts; all deletions must be", "attrs": {"statement": "System MUST prevent hard deletion of patient accounts; all deletions must be soft-deletes with anonymization", "rationale": "Stated in prd.md, Data Governance Requirements (line 1128). Restated: prd.md line 686: \"Patient account deactivation MUST be soft-delete (archive) not hard-delete; data retained per compliance requirements (7 years)\""}}
  - {"op": "add_node", "id": "REQ-016-019", "type": "Rule", "owner_fr": "FR-016", "title": "Enforce authenticated admin access with MFA and MUST authorize each", "attrs": {"statement": "System MUST enforce authenticated admin access with MFA and MUST authorize each action against the admin's FR-031 role permissions", "rationale": "Stated in prd.md, Security & Privacy Requirements (line 1132). Restated: prd.md line 38: \"Admin Platform Role Model: Admin roles and permissions follow FR-031 (Admin Access Control & Permissions): default roles Super Admin, Aftercare Specialist, Billing Staff, and Support Staff, plus custom roles\" prd.md line 911: \"Authentication: Admins MUST authenticate via multi-factor authentication (MFA required for production access)\" prd.md line 912: \"Authorization: The admin's FR-031 role permissions are validated on every API call; each action requires its matching FR-031 permission\""}}
  - {"op": "add_node", "id": "REQ-016-020", "type": "Rule", "owner_fr": "FR-016", "title": "Require enhanced confirmation + justification for high-impact actions", "attrs": {"statement": "System MUST require enhanced confirmation + justification for high-impact actions (account suspensions of any duration, refunds > $1,000, permanent data deletion) even when the admin holds the FR-031 permission for the action", "rationale": "Stated in prd.md, Security & Privacy Requirements (line 1133). Restated: prd.md line 684: \"High-impact actions (account suspension, refunds > $1000, permanent data deletion) MUST require enhanced confirmation + justification, in addition to the FR-031 permission the action needs (Edit Patients for account suspension, Issue Refunds for refunds, Delete Patients for data deletion)\""}}
  - {"op": "add_node", "id": "REQ-016-021", "type": "Rule", "owner_fr": "FR-016", "title": "Log all admin downloads of patient head scan media in audit trail with", "attrs": {"statement": "System MUST log all admin downloads of patient head scan media in audit trail with timestamp, admin ID, and justification", "rationale": "Stated in prd.md, Security & Privacy Requirements (line 1134)."}}
  - {"op": "add_node", "id": "REQ-016-022", "type": "Rule", "owner_fr": "FR-016", "title": "Encrypt all patient data in transit (TLS 1.3) and at rest (AES-256)", "attrs": {"statement": "System MUST encrypt all patient data in transit (TLS 1.3) and at rest (AES-256)", "rationale": "Stated in prd.md, Security & Privacy Requirements (line 1135). Restated: prd.md line 913: \"Encryption: All patient data encrypted in transit (TLS 1.3) and at rest (AES-256)\""}}
  - {"op": "add_node", "id": "REQ-016-023", "type": "Rule", "owner_fr": "FR-016", "title": "Never display patient payment card details in admin interface (PCI-DSS", "attrs": {"statement": "System MUST never display patient payment card details in admin interface (PCI-DSS compliance)", "rationale": "Stated in prd.md, Security & Privacy Requirements (line 1136). Restated: prd.md line 695: \"Patient payment card details NEVER stored or displayed in admin interface (PCI-DSS compliance)\""}}
  - {"op": "add_node", "id": "REQ-016-024", "type": "Rule", "owner_fr": "FR-016", "title": "Integrate with patient authentication module (P-01) for password reset", "attrs": {"statement": "System MUST integrate with patient authentication module (P-01) for password reset and account unlock functionality", "rationale": "Stated in prd.md, Integration Requirements (line 1140)."}}
  - {"op": "add_node", "id": "REQ-016-025", "type": "Rule", "owner_fr": "FR-016", "title": "Integrate with payment module (P-03) to display transaction history and", "attrs": {"statement": "System MUST integrate with payment module (P-03) to display transaction history and initiate refunds via Stripe API", "rationale": "Stated in prd.md, Integration Requirements (line 1141)."}}
  - {"op": "add_node", "id": "REQ-016-026", "type": "Rule", "owner_fr": "FR-016", "title": "Integrate with media storage service (S-05) to display patient head", "attrs": {"statement": "System MUST integrate with media storage service (S-05) to display patient head scan media with secure signed URLs", "rationale": "Stated in prd.md, Integration Requirements (line 1142)."}}
  - {"op": "add_node", "id": "REQ-016-027", "type": "Rule", "owner_fr": "FR-016", "title": "Integrate with notification service (S-03) to send notifications when", "attrs": {"statement": "System MUST integrate with notification service (S-03) to send notifications when admin takes actions affecting patients", "rationale": "Stated in prd.md, Integration Requirements (line 1143). Restated: prd.md line 79: \"System-generated notifications to patients when admin takes action\""}}
  - {"op": "add_node", "id": "REQ-016-028", "type": "Rule", "owner_fr": "FR-016", "title": "Display FR-015 provider-caused cancellation causes", "attrs": {"statement": "System MUST display FR-015 provider-caused cancellation causes (`ProviderSuspended`, `ProviderDeactivated`) distinctly from patient cancellation and let admins filter/badge patients with unresolved Admin Support Required records", "rationale": "Stated in prd.md, Admin Intervention Requirements (line 1117). Restated: prd.md line 272: \"Admin filters Screen 1 by \"Admin Support Required: Unresolved\" or opens the alert's deep link\" prd.md line 322: \"Filter patients with provider-caused cancellation impacts (FR-015 A5); Options: All, Unresolved, Resolved; Unresolved = any linked case/inquiry with `supportRequired` set\" prd.md line 353: \"\"Admin Support Required\" badge is independent of Stage and Status Filter; it clears only when every linked provider-caused impact is resolved (Flow A7). Provider-caused cancellations are never labelled \"Cancelled by patient\"\""}}
  - {"op": "add_node", "id": "REQ-016-029", "type": "Rule", "owner_fr": "FR-016", "title": "Show, per affected record, the inquiry/case reference, prior stage", "attrs": {"statement": "System MUST show, per affected record, the inquiry/case reference, prior stage, cancellation cause, support state, and linked FR-034 support case (if any)", "rationale": "Stated in prd.md, Admin Intervention Requirements (line 1118). Restated: prd.md line 388: \"One row per affected inquiry/case: inquiry/case reference (deep link), prior stage, cancellation cause, Admin Support Required state (Unresolved/Resolved with reason, admin, timestamp), linked FR-034 support case (if any); Read-only; shown when any FR-015 A5 impact exists\""}}
  - {"op": "add_node", "id": "REQ-016-030", "type": "Rule", "owner_fr": "FR-016", "title": "Require a resolution reason and log an audit event before clearing", "attrs": {"statement": "System MUST require a resolution reason and log an audit event before clearing Admin Support Required; the cause remains, an inquiry's marker stays while any linked provider-caused impact is unresolved, and no ticket is auto-created", "rationale": "Stated in prd.md, Admin Intervention Requirements (line 1119). Restated: prd.md line 276: \"System records the resolution reason and audit event (Screen 7), then clears the marker; the cancellation cause remains unchanged\" prd.md line 277: \"Outcome: Provider-caused impact is resolved with an audit trail; an inquiry's marker stays set while any linked provider-caused impact on it remains unresolved\" prd.md line 688: \"Provider-caused cancellations (FR-015 A5, causes `ProviderSuspended` / `ProviderDeactivated`) carry an independent Admin Support Required marker that only an admin resolution with reason and audit event can clear; the cause is never overwritten. FR-016 does not auto-create FR-034 tickets or change FR-034's workflow\""}}
  - {"op": "add_node", "id": "REQ-016-031", "type": "Rule", "owner_fr": "FR-016", "title": "List patient booking cancellation and change requests raised through", "attrs": {"statement": "System MUST list patient booking cancellation and change requests raised through Contact Support after acceptance on Screen 9, open the matching FR-006 action for each, and record a Resolved or Declined outcome with reason and audit entry", "rationale": "Stated in prd.md, Admin Intervention Requirements (line 1120). Restated: prd.md line 264: \"System links the outcome to the request, marks it Resolved or Declined, and logs the action on Screen 7\""}}
  - {"op": "add_node", "id": "REQ-016-032", "type": "Rule", "owner_fr": "FR-016", "title": "Cancel or change a booking from FR-016 except through the FR-006 Cancel", "attrs": {"statement": "System MUST NOT cancel or change a booking from FR-016 except through the FR-006 Cancel Booking or Change Appointment action, including cancellations caused by patient account suspension", "rationale": "Stated in prd.md, Admin Intervention Requirements (line 1121). Restated: prd.md line 248: \"System cancels each active booking through the FR-006 admin booking cancellation, using the suspension justification as the cancellation reason; refunds follow the FR-006 payment placeholder\" prd.md line 265: \"Outcome: Every post-acceptance cancellation or change goes through one audited FR-006 action, and the patient's request has a recorded outcome\""}}
  - {"op": "add_node", "id": "REQ-016-033", "type": "Rule", "owner_fr": "FR-016", "title": "Patient Platform (P-##): No direct patient-facing functionality -", "attrs": {"statement": "Patient Platform (P-##): No direct patient-facing functionality - patients are unaware of admin oversight; Provider Platform (PR-##): No provider-facing functionality - providers don't see admin interventions", "rationale": "Stated in prd.md, Multi-Tenant Architecture (line 35)."}}
  - {"op": "add_node", "id": "REQ-016-034", "type": "Rule", "owner_fr": "FR-016", "title": "Providers unaware of admin oversight except when admins mediate disputes", "attrs": {"statement": "Providers unaware of admin oversight except when admins mediate disputes", "rationale": "Stated in prd.md, Multi-Tenant Breakdown (line 51)."}}
  - {"op": "add_node", "id": "REQ-016-035", "type": "Rule", "owner_fr": "FR-016", "title": "Patients may receive notifications when admins take actions on their", "attrs": {"statement": "Patients may receive notifications when admins take actions on their behalf (password resets, manual interventions)", "rationale": "Stated in prd.md, Multi-Tenant Breakdown (line 46)."}}
  - {"op": "add_node", "id": "REQ-016-036", "type": "Rule", "owner_fr": "FR-016", "title": "Out of scope: Direct admin-to-patient messaging (handled by Support", "attrs": {"statement": "Out of scope: Direct admin-to-patient messaging (handled by Support Center & Ticketing system; see FR-034); Admin intercepting or modifying patient-provider messages in real-time", "rationale": "Stated in prd.md, Communication Structure (line 83)."}}
  - {"op": "add_node", "id": "REQ-016-037", "type": "Rule", "owner_fr": "FR-016", "title": "View patient support escalations/context via Support Center (see", "attrs": {"statement": "View patient support escalations/context via Support Center (see FR-034); Support escalations context (view-only link to Support Center; see FR-034)", "rationale": "Stated in prd.md, Multi-Tenant Breakdown (line 63)."}}
  - {"op": "add_node", "id": "REQ-016-038", "type": "Rule", "owner_fr": "FR-016", "title": "Admin logs into admin dashboard and navigates to \"Patients\" section", "attrs": {"statement": "Admin logs into admin dashboard and navigates to \"Patients\" section; Admin searches for specific patient by name, email, patient code, or ID; Admin filters patient list by status (inquiry, quoted, scheduled, in-progress, aftercare, completed); System alerts admin to patients requiring attention (failed payments, flagged communications, disputes); Admin receives escalations requiring account-level intervention (via Support Center; see FR-034)", "rationale": "Stated in prd.md, Entry Points (line 88)."}}
  - {"op": "add_node", "id": "REQ-016-039", "type": "Rule", "owner_fr": "FR-016", "title": "Generate patient reports and analytics", "attrs": {"statement": "Generate patient reports and analytics", "rationale": "Stated in prd.md, Multi-Tenant Breakdown (line 64)."}}
  - {"op": "add_node", "id": "REQ-016-040", "type": "Rule", "owner_fr": "FR-016", "title": "In V1, patient \"3D scans\" are implemented as standardized head scan", "attrs": {"statement": "In V1, patient \"3D scans\" are implemented as standardized head scan photo sets (multiple 2D views; JPG/PNG). An interactive 3D model viewer is a V2 enhancement.", "rationale": "Stated in prd.md, Executive Summary (line 19)."}}
  - {"op": "add_node", "id": "REQ-016-041", "type": "Rule", "owner_fr": "FR-016", "title": "System displays results in paginated list with key information", "attrs": {"statement": "System displays results in paginated list with key information:; Patient name and code (e.g., \"Mark Peterson #HP258742\"); Current journey stage (Inquiry, Quoted, Accepted, Confirmed, In Progress, Aftercare, Completed, Cancelled), using the FR-003 stage list; Registration date; Last activity timestamp; Provider assignment (if applicable); Flags/alerts (payment issues, compliance concerns, support escalations)", "rationale": "Stated in prd.md, Main Flow: Patient Account Search and Overview (line 110)."}}
  - {"op": "add_node", "id": "REQ-016-042", "type": "Rule", "owner_fr": "FR-016", "title": "System loads patient detail view with tabbed sections:; Overview", "attrs": {"statement": "System loads patient detail view with tabbed sections:; Overview: Profile summary, contact info, current status; Treatment Journey: Milestone timeline summarizing journey progress with deep links to the latest case stage/inquiry detail; Medical Data: Medical questionnaire, head scan assets *(V1 photo set; V2 true 3D)*, health history; Payments: Payment history, outstanding balances, refunds; Communications: Message history with providers and support; Admin Actions: Audit log of admin interventions", "rationale": "Stated in prd.md, Main Flow: Patient Account Search and Overview (line 118)."}}
  - {"op": "add_node", "id": "REQ-016-043", "type": "Rule", "owner_fr": "FR-016", "title": "System displays chronological milestone cards (Inquiry submitted, Quote", "attrs": {"statement": "System displays chronological milestone cards (Inquiry submitted, Quote approved, Booking confirmed, Travel complete, Procedure complete, Aftercare checkpoints); Each milestone surfaces concise status + timestamp and includes a \"Open Case Detail\" link that launches the dedicated inquiry/case page for full context of that stage", "rationale": "Stated in prd.md, Alternative Flows (Manual Intervention) (line 134)."}}
  - {"op": "add_node", "id": "REQ-016-044", "type": "Rule", "owner_fr": "FR-016", "title": "System displays:; Medical questionnaire responses with severity flags", "attrs": {"statement": "System displays:; Medical questionnaire responses with severity flags (red, yellow, green); Head scan viewer *(V1 photo set gallery; V2 interactive 3D model); Uploaded photos/videos; Declared medications and allergies; Previous procedure history", "rationale": "Stated in prd.md, Alternative Flows (Manual Intervention) (line 146)."}}
  - {"op": "add_node", "id": "REQ-016-045", "type": "Rule", "owner_fr": "FR-016", "title": "Admin can click on transaction to view Stripe payment intent details", "attrs": {"statement": "Admin can click on transaction to view Stripe payment intent details", "rationale": "Stated in prd.md, Alternative Flows (Manual Intervention) (line 168). Restated: prd.md line 511: \"Stripe Payment ID links directly to Stripe dashboard for admins with Stripe access\""}}
  - {"op": "add_node", "id": "REQ-016-046", "type": "Rule", "owner_fr": "FR-016", "title": "System displays \"No patients found matching your search criteria\"", "attrs": {"statement": "System displays \"No patients found matching your search criteria\"; System suggests broadening search:; Remove date range filters; Try partial name match; Search by phone number instead of email; If still no results, admin checks if patient account exists in different status or was deactivated", "rationale": "Stated in prd.md, Alternative Flows (Manual Intervention) (line 176)."}}
  - {"op": "add_node", "id": "REQ-016-047", "type": "Rule", "owner_fr": "FR-016", "title": "Admin selects action from available options:; Reset password; Unlock", "attrs": {"statement": "Admin selects action from available options:; Reset password; Unlock account (after failed login attempts); Update patient profile information; Suspend account (fraud prevention); Initiate manual refund (when payment service unavailable or support requires override); Log admin note / follow-up task", "rationale": "Stated in prd.md, Main Flow: Manual Patient Intervention (line 198)."}}
  - {"op": "add_node", "id": "REQ-016-048", "type": "Rule", "owner_fr": "FR-016", "title": "System displays confirmation dialog with:; Summary of action to be", "attrs": {"statement": "System displays confirmation dialog with:; Summary of action to be taken; Impact on patient (e.g., \"Patient will receive password reset email\"); Required justification field", "rationale": "Stated in prd.md, Main Flow: Manual Patient Intervention (line 205). Restated: prd.md line 226: \"System displays confirmation dialog: \"Send password reset email to [patient email]?\"\""}}
  - {"op": "add_node", "id": "REQ-016-049", "type": "Rule", "owner_fr": "FR-016", "title": "System executes action:; Updates patient account state; Logs action in", "attrs": {"statement": "System executes action:; Updates patient account state; Logs action in audit trail with admin ID, timestamp, justification; Sends notification to patient (if applicable); System displays confirmation: \"Action completed successfully\"", "rationale": "Stated in prd.md, Main Flow: Manual Patient Intervention (line 211)."}}
  - {"op": "add_node", "id": "REQ-016-050", "type": "Rule", "owner_fr": "FR-016", "title": "System generates password reset token; System sends email to patient", "attrs": {"statement": "System generates password reset token; System sends email to patient with reset link (6-digit OTP)", "rationale": "Stated in prd.md, Alternative Flows (line 229)."}}
  - {"op": "add_node", "id": "REQ-016-051", "type": "Rule", "owner_fr": "FR-016", "title": "System displays warning: \"Patient changed password 5 minutes ago. Reset", "attrs": {"statement": "System displays warning: \"Patient changed password 5 minutes ago. Reset anyway?\"; admin must confirm they still want to reset (logs additional justification); patient receives notification: \"Your password was reset by admin - if this wasn't you, contact support immediately\"", "rationale": "Stated in prd.md, Edge Cases (line 1087)."}}
  - {"op": "add_node", "id": "REQ-016-052", "type": "Rule", "owner_fr": "FR-016", "title": "System displays warning: \"This action will immediately prevent patient", "attrs": {"statement": "System displays warning: \"This action will immediately prevent patient login and cancel active bookings. Proceed?\"", "rationale": "Stated in prd.md, Alternative Flows (line 243)."}}
  - {"op": "add_node", "id": "REQ-016-053", "type": "Rule", "owner_fr": "FR-016", "title": "System immediately revokes patient authentication tokens", "attrs": {"statement": "System immediately revokes patient authentication tokens", "rationale": "Stated in prd.md, Alternative Flows (line 247)."}}
  - {"op": "add_node", "id": "REQ-016-054", "type": "Rule", "owner_fr": "FR-016", "title": "System sends suspension notification to patient with appeal process", "attrs": {"statement": "System sends suspension notification to patient with appeal process information", "rationale": "Stated in prd.md, Alternative Flows (line 249)."}}
  - {"op": "add_node", "id": "REQ-016-055", "type": "Rule", "owner_fr": "FR-016", "title": "Note: Booking modifications or cancellations occur on the dedicated", "attrs": {"statement": "Note: Booking modifications or cancellations occur on the dedicated case/inquiry detail page; the intervention flow links admins there rather than duplicating controls.", "rationale": "Stated in prd.md, Alternative Flows (line 253)."}}
  - {"op": "add_node", "id": "REQ-016-056", "type": "Rule", "owner_fr": "FR-016", "title": "From subquote acceptance onward the patient has no in-app booking", "attrs": {"statement": "From subquote acceptance onward the patient has no in-app booking cancellation; the patient uses Contact Support on the FR-006 booking screens, and the request is logged as an FR-034 support case of type booking cancellation or booking change", "rationale": "Stated in prd.md, Alternative Flows (line 257)."}}
  - {"op": "add_node", "id": "REQ-016-057", "type": "Rule", "owner_fr": "FR-016", "title": "FR-015 provider suspension or deactivation (FR-015 Alternative Flow A5", "attrs": {"statement": "FR-015 provider suspension or deactivation (FR-015 Alternative Flow A5 and Screen 4) cancels a patient's case/inquiry or provider participation, or closes an accepted booking for the FR-006 provider-fault transfer while the inquiry stays open, with cause `ProviderSuspended` or `ProviderDeactivated` and sets `supportRequired` (\"Admin Support Required\"); admin receives the mandatory FR-020 admin-support alert (sent to admins with the FR-031 Respond to Support permission)", "rationale": "Stated in prd.md, Alternative Flows (line 269)."}}
  - {"op": "add_node", "id": "REQ-016-058", "type": "Rule", "owner_fr": "FR-016", "title": "Viewing the Admin Support Required list and the patient's", "attrs": {"statement": "Viewing the Admin Support Required list and the patient's Provider-Caused Impacts requires FR-031 View Patients; Resolve Support requires FR-031 Respond to Support (default roles Super Admin, Aftercare Specialist, and Support Staff)", "rationale": "Stated in prd.md, Alternative Flows (line 270)."}}
  - {"op": "add_node", "id": "REQ-016-059", "type": "Rule", "owner_fr": "FR-016", "title": "Admin assists the patient through existing owners (rebooking, refunds", "attrs": {"statement": "Admin assists the patient through existing owners (rebooking, refunds, care continuity, FR-034 support case if created); FR-016 adds no automatic rebooking, refund, or ticket creation", "rationale": "Stated in prd.md, Alternative Flows (line 274)."}}
  - {"op": "add_node", "id": "REQ-016-060", "type": "Rule", "owner_fr": "FR-016", "title": "Admin receives data deletion request (via Support Center / compliant", "attrs": {"statement": "Admin receives data deletion request (via Support Center / compliant support channel; see FR-034); Admin verifies patient identity and confirms legitimate request; Admin checks if patient has active bookings or outstanding financial obligations; If active obligations exist, admin explains data cannot be deleted yet (legal requirement)", "rationale": "Stated in prd.md, Note: Patient Support Center / Ticketing (line 289)."}}
  - {"op": "add_node", "id": "REQ-016-061", "type": "Rule", "owner_fr": "FR-016", "title": "If no obligations, admin initiates data deletion workflow:; Mark", "attrs": {"statement": "If no obligations, admin initiates data deletion workflow:; Mark account for anonymization; Remove PII (name, email, phone, address); Retain anonymized medical records (7-year healthcare compliance); Archive transaction history (7-year financial compliance)", "rationale": "Stated in prd.md, Note: Patient Support Center / Ticketing (line 293)."}}
  - {"op": "add_node", "id": "REQ-016-062", "type": "Rule", "owner_fr": "FR-016", "title": "System generates data deletion certificate for audit", "attrs": {"statement": "System generates data deletion certificate for audit", "rationale": "Stated in prd.md, Note: Patient Support Center / Ticketing (line 299)."}}
  - {"op": "add_node", "id": "REQ-016-063", "type": "Rule", "owner_fr": "FR-016", "title": "Admin sends confirmation to patient: \"Your data has been deleted per", "attrs": {"statement": "Admin sends confirmation to patient: \"Your data has been deleted per GDPR requirements\"; Admin closes the request", "rationale": "Stated in prd.md, Note: Patient Support Center / Ticketing (line 300)."}}
  - {"op": "add_node", "id": "REQ-016-064", "type": "Rule", "owner_fr": "FR-016", "title": "System uses optimistic locking; first admin's change succeeds, second", "attrs": {"statement": "System uses optimistic locking; first admin's change succeeds, second admin receives error: \"This booking was just modified by [Admin Name]. Please refresh and retry.\"; forces second admin to reload current state before making changes", "rationale": "Stated in prd.md, Edge Cases (line 1078)."}}
  - {"op": "add_node", "id": "REQ-016-065", "type": "Rule", "owner_fr": "FR-016", "title": "System pushes real-time notification to admin's dashboard: \"New support", "attrs": {"statement": "System pushes real-time notification to admin's dashboard: \"New support escalation from this patient\"; admin can click notification to open the Support Center case without losing current context; escalation appears in patient's overview section (via link to Support Center)", "rationale": "Stated in prd.md, Edge Cases (line 1081)."}}
  - {"op": "add_node", "id": "REQ-016-066", "type": "Rule", "owner_fr": "FR-016", "title": "Admin sees banner: \"Patient currently active on platform (last", "attrs": {"statement": "Admin sees banner: \"Patient currently active on platform (last activity: 30 seconds ago)\"; admin's view refreshes automatically when patient makes changes; if admin attempts modification, system warns: \"Patient is actively using the platform - your changes may conflict\"", "rationale": "Stated in prd.md, Edge Cases (line 1084)."}}
  - {"op": "add_node", "id": "REQ-016-067", "type": "Rule", "owner_fr": "FR-016", "title": "System prevents deletion: \"Cannot process deletion request - patient", "attrs": {"statement": "System prevents deletion: \"Cannot process deletion request - patient has pending refund of £500. Deletion will be available after refund completes.\"; admin can schedule deletion for after refund clears; system sends automated notification when patient becomes eligible", "rationale": "Stated in prd.md, Edge Cases (line 1090)."}}
  - {"op": "add_node", "id": "REQ-016-068", "type": "Rule", "owner_fr": "FR-016", "title": "System queues refund for automatic retry (exponential backoff: 1 min, 5", "attrs": {"statement": "System queues refund for automatic retry (exponential backoff: 1 min, 5 min, 15 min); admin sees status \"Refund Pending\"; if all retries fail after 1 hour, system alerts admin: \"Refund failed - manual intervention required\"; admin can review Stripe error and retry manually", "rationale": "Stated in prd.md, Edge Cases (line 1093)."}}
  - {"op": "add_node", "id": "REQ-016-069", "type": "Rule", "owner_fr": "FR-016", "title": "Admins MUST NOT modify patient medical data (questionnaire responses", "attrs": {"statement": "Admins MUST NOT modify patient medical data (questionnaire responses, scans); medical data is immutable except by patients", "rationale": "Stated in prd.md, General Module Rules (line 682). Restated: prd.md line 714: \"Patient medical questionnaire responses (immutable; submitted by patient only)\" prd.md line 715: \"Patient head scan assets (photo sets in V1; 3D scans in V2) and uploaded photos (immutable; uploaded by patient only)\""}}
  - {"op": "add_node", "id": "REQ-016-070", "type": "Rule", "owner_fr": "FR-016", "title": "Admin visibility and edit rights follow the FR-031 role permissions", "attrs": {"statement": "Admin visibility and edit rights follow the FR-031 role permissions: View Patients grants patient visibility (all default roles), Edit Patients grants patient edits (Super Admin by default), Manage Aftercare covers aftercare actions and access to medical data and scans (Super Admin and Aftercare Specialist by default), View Support Center and Respond to Support cover support actions (Super Admin, Aftercare Specialist, and Support Staff by default), Issue Refunds covers refunds, and Delete Patients covers account archiving", "rationale": "Stated in prd.md, General Module Rules (line 683)."}}
  - {"op": "add_node", "id": "REQ-016-071", "type": "Rule", "owner_fr": "FR-016", "title": "Admin interventions that affect bookings (reschedule, cancel) MUST go", "attrs": {"statement": "Admin interventions that affect bookings (reschedule, cancel) MUST go through the FR-006 Change Appointment or Cancel Booking action and MUST notify both patient and provider within 5 minutes through `booking.rescheduled` or `booking.cancelled`", "rationale": "Stated in prd.md, General Module Rules (line 687)."}}
  - {"op": "add_node", "id": "REQ-016-072", "type": "Rule", "owner_fr": "FR-016", "title": "Patient scans displayed in admin interface MUST be read-only and", "attrs": {"statement": "Patient scans displayed in admin interface MUST be read-only and access-controlled (prevent unauthorized distribution)", "rationale": "Stated in prd.md, Data & Privacy Rules (line 693)."}}
  - {"op": "add_node", "id": "REQ-016-073", "type": "Rule", "owner_fr": "FR-016", "title": "Only admins with the FR-031 Manage Aftercare permission (Super Admin", "attrs": {"statement": "Only admins with the FR-031 Manage Aftercare permission (Super Admin and Aftercare Specialist by default) can view and download patient scans; all downloads are logged in audit trail for compliance", "rationale": "Stated in prd.md, Data & Privacy Rules (line 694). Restated: prd.md line 467: \"Medical data is available only to admins with the FR-031 Manage Aftercare permission (Super Admin and Aftercare Specialist by default), always with mandatory justification; View Patients alone shows the profile without medical data\" prd.md line 467: \"Medical data is available only to admins with the FR-031 Manage Aftercare permission (Super Admin and Aftercare Specialist by default), always with mandatory justification; View Patients alone shows the profile without medical data\""}}
  - {"op": "add_node", "id": "REQ-016-074", "type": "Rule", "owner_fr": "FR-016", "title": "Archived patient data accessible only through dedicated archive", "attrs": {"statement": "Archived patient data accessible only through dedicated archive interface (requires explicit justification and logged access)", "rationale": "Stated in prd.md, Data & Privacy Rules (line 697)."}}
  - {"op": "add_node", "id": "REQ-016-075", "type": "Rule", "owner_fr": "FR-016", "title": "Patient consent required before sharing medical data with third", "attrs": {"statement": "Patient consent required before sharing medical data with third parties; admin cannot share medical data outside platform", "rationale": "Stated in prd.md, Data & Privacy Rules (line 699)."}}
  - {"op": "add_node", "id": "REQ-016-076", "type": "Rule", "owner_fr": "FR-016", "title": "Editable by admin: Patient account status (active, suspended", "attrs": {"statement": "Editable by admin: Patient account status (active, suspended, deactivated)", "rationale": "Stated in prd.md, Admin Editability Rules (line 706)."}}
  - {"op": "add_node", "id": "REQ-016-077", "type": "Rule", "owner_fr": "FR-016", "title": "Editable by admin: Booking appointment date only through the FR-006", "attrs": {"statement": "Editable by admin: Booking appointment date only through the FR-006 guarded date change: allowed for `Accepted` or `Confirmed` bookings, with a mandatory reason and a slot availability check, and triggering an FR-008 travel-date review for any linked travel records (emergency reschedules with provider coordination)", "rationale": "Stated in prd.md, Admin Editability Rules (line 707). Restated: prd.md line 262: \"For a change request, admin opens the FR-006 Change Appointment action (FR-006 Screen 8), which applies to `Accepted` or `Confirmed` bookings; the patient and provider receive `booking.rescheduled`\""}}
  - {"op": "add_node", "id": "REQ-016-078", "type": "Rule", "owner_fr": "FR-016", "title": "Editable by admin: Booking cancellation only through the FR-006 Cancel", "attrs": {"statement": "Editable by admin: Booking cancellation only through the FR-006 Cancel Booking action: allowed from `Accepted` through `Aftercare`, on an admin decision or a support-routed patient request, with a mandatory reason, confirmation, and audit entry (Flow A8, Screen 9)", "rationale": "Stated in prd.md, Admin Editability Rules (line 708). Restated: prd.md line 261: \"For a cancellation request, admin opens the FR-006 Cancel Booking action (FR-006 Screen 9), which applies to any booking state from `Accepted` to `Aftercare`, enters the mandatory reason, and confirms; the booking and inquiry become `Cancelled`, the accepted quote stays accepted, the patient and provider receive `booking.cancelled`, and refunds follow the FR-006 payment placeholder\""}}
  - {"op": "add_node", "id": "REQ-016-079", "type": "Rule", "owner_fr": "FR-016", "title": "Editable by admin: Payment status (manual refund issuance, payment", "attrs": {"statement": "Editable by admin: Payment status (manual refund issuance, payment retry)", "rationale": "Stated in prd.md, Admin Editability Rules (line 709)."}}
  - {"op": "add_node", "id": "REQ-016-080", "type": "Rule", "owner_fr": "FR-016", "title": "Not editable by admin: Transaction timestamps and amounts (immutable", "attrs": {"statement": "Not editable by admin: Transaction timestamps and amounts (immutable financial records)", "rationale": "Stated in prd.md, Admin Editability Rules (line 716)."}}
  - {"op": "add_node", "id": "REQ-016-081", "type": "Rule", "owner_fr": "FR-016", "title": "Not editable by admin: Patient password (admin can reset but cannot", "attrs": {"statement": "Not editable by admin: Patient password (admin can reset but cannot view current password)", "rationale": "Stated in prd.md, Admin Editability Rules (line 718)."}}
  - {"op": "add_node", "id": "REQ-016-082", "type": "Rule", "owner_fr": "FR-016", "title": "High-impact actions require extended confirmation + justification", "attrs": {"statement": "High-impact actions require extended confirmation + justification: Account suspension (any duration: 30 days, 90 days, or permanent); Refunds exceeding $1,000; Manual booking modifications during active treatment (handled on case detail screen); Bulk patient notifications; Patient data deletion (GDPR requests)", "rationale": "Stated in prd.md, Admin Editability Rules (line 722)."}}
  - {"op": "add_node", "id": "REQ-016-083", "type": "Rule", "owner_fr": "FR-016", "title": "Threat mitigation: Admin session timeout after 30 minutes of", "attrs": {"statement": "Threat mitigation: Admin session timeout after 30 minutes of inactivity; re-authentication required for sensitive actions", "rationale": "Stated in prd.md, Security Considerations (line 916)."}}
  - {"op": "add_node", "id": "REQ-016-084", "type": "Rule", "owner_fr": "FR-016", "title": "Threat mitigation: Rate limiting on patient search API (max 100", "attrs": {"statement": "Threat mitigation: Rate limiting on patient search API (max 100 searches per admin per minute) to prevent data scraping", "rationale": "Stated in prd.md, Security Considerations (line 915)."}}
