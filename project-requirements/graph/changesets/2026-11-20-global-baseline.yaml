  # System Rules
  - {op: "add_node", id: "REQ-SYS-001", type: "Rule", owner_fr: "FR-SYS", title: "Patient identity hidden until booking confirmation", attrs: {"statement": "Providers MUST see only the anonymized patient ID, shown in the display form \"Mark P.\" followed by the ID, until booking confirmation (the first successful payment). At booking confirmation the patient's name and contact details (phone number and email address) unlock for the provider. The rule does not apply to admins, who see the full patient identity for compliance and support.", "scope": "global", "aliases": "REQ-002-018,REQ-003-008,REQ-004-008,REQ-005-008,REQ-010-045,REQ-011-022,REQ-012-022"}}
  - {op: "add_edge", from: "REQ-SYS-001", verb: "applies at", to: "STG-platform-01-all-stages"}
  - {op: "add_node", id: "REQ-SYS-002", type: "Rule", owner_fr: "FR-SYS", title: "One 10-year retention period", attrs: {"statement": "System MUST keep every record for 10 years: audit logs, financial transaction and payment records, booking records, discount records, medical records, inquiry data, and head and monitoring scan media; no record type has a shorter period. A patient deletion request does not shorten the period: the patient's personal data stays archived and anonymised (no hard deletion). Backup copies follow the separate backup retention in NFR-004.", "scope": "global", "aliases": "REQ-023-001,REQ-023-002,REQ-006-006,REQ-016-167,REQ-026-019,REQ-003-006,REQ-003-040,REQ-038-053,REQ-019-092"}}
  - {op: "add_edge", from: "REQ-SYS-002", verb: "applies at", to: "STG-platform-01-all-stages"}
  - {op: "add_node", id: "REQ-SYS-003", type: "Rule", owner_fr: "FR-SYS", title: "Soft deletes only", attrs: {"statement": "Every delete MUST be a soft delete (the record is archived); hard deletion is prohibited.", "scope": "global", "aliases": "REQ-005-060"}}
  - {op: "add_edge", from: "REQ-SYS-003", verb: "applies at", to: "STG-platform-01-all-stages"}
  - {op: "add_node", id: "REQ-SYS-004", type: "Rule", owner_fr: "FR-SYS", title: "Encryption in transit and at rest", attrs: {"statement": "All data in transit MUST be encrypted using TLS 1.3. All sensitive data at rest MUST be encrypted using AES-256, including personal and medical data, payment-related personal data, messages, and media.", "scope": "global", "aliases": "REQ-016-022,REQ-035-026,REQ-011-008,REQ-007-070,REQ-037-047,REQ-038-051,REQ-029-031"}}
  - {op: "add_edge", from: "REQ-SYS-004", verb: "applies at", to: "STG-platform-01-all-stages"}
  - {op: "add_node", id: "REQ-SYS-005", type: "Rule", owner_fr: "FR-SYS", title: "No card numbers stored", attrs: {"statement": "System MUST NOT store card numbers; only the payment processor handles them. System MUST be PCI DSS compliant through the payment processor. System MUST verify the signature of every payment webhook before acting on it.", "scope": "global", "aliases": "REQ-007-008,REQ-029-032,REQ-029-046"}}
  - {op: "add_edge", from: "REQ-SYS-005", verb: "applies at", to: "STG-platform-01-all-stages"}
  - {op: "add_node", id: "REQ-SYS-006", type: "Rule", owner_fr: "FR-SYS", title: "Core security controls fixed in code", attrs: {"statement": "Core security controls, encryption standards, the audit scope for financial events, and duplicate-charge protections are fixed in the product and MUST NOT be editable in the Admin Platform.", "scope": "global", "aliases": "REQ-007-075"}}
  - {op: "add_edge", from: "REQ-SYS-006", verb: "applies at", to: "STG-platform-01-all-stages"}
  - {op: "add_node", id: "REQ-SYS-007", type: "Rule", owner_fr: "FR-SYS", title: "Password and one-time-code policy", attrs: {"statement": "Passwords MUST have at least 12 characters, including at least one uppercase letter, one lowercase letter, one digit, and one special character; the policy is fixed and not editable in the Admin Platform. One-time codes (email verification and password reset) MUST have 6 digits (fixed); their expiry time and resend limits MUST be configurable in FR-026.", "scope": "global"}}
  - {op: "add_edge", from: "REQ-SYS-007", verb: "applies at", to: "STG-platform-01-all-stages"}
  - {op: "add_node", id: "REQ-SYS-008", type: "Rule", owner_fr: "FR-SYS", title: "Admin API rate limit", attrs: {"statement": "System MUST rate-limit the admin configuration and settings APIs, including the payment configuration API, to 100 requests per minute per admin to prevent abuse.", "scope": "global", "aliases": "REQ-026-018,REQ-028-016"}}
  - {op: "add_edge", from: "REQ-SYS-008", verb: "applies at", to: "STG-platform-01-all-stages"}
  - {op: "add_node", id: "REQ-SYS-009", type: "Rule", owner_fr: "FR-SYS", title: "Role-based, audited access", attrs: {"statement": "Access to platform data MUST be granted by role (patient, provider, admin, and the permissions inside each). Every access to personal, medical, financial, and conversation data MUST be audited with who accessed it and when; a feature adds the reason where one is required. Audit log entries MUST be immutable: read-only, with no editing or deletion.", "scope": "global", "aliases": "REQ-011-009"}}
  - {op: "add_edge", from: "REQ-SYS-009", verb: "applies at", to: "STG-platform-01-all-stages"}
  - {op: "add_node", id: "REQ-SYS-010", type: "Rule", owner_fr: "FR-SYS", title: "Times shown in the user's local time zone", attrs: {"statement": "System MUST display every date and time on every screen in the user's local time zone; admin views MAY switch to UTC for audits.", "scope": "global", "aliases": "REQ-012-099"}}
  - {op: "add_edge", from: "REQ-SYS-010", verb: "applies at", to: "STG-platform-01-all-stages"}
  - {op: "add_node", id: "REQ-SYS-011", type: "Rule", owner_fr: "FR-SYS", title: "GDPR and HIPAA-equivalent compliance", attrs: {"statement": "System MUST follow GDPR and HIPAA-equivalent practices for personal and medical data. Patient consent MUST be respected for any data sharing, and data residency MUST be honored. Tenants MUST NOT share a database directly with each other.", "scope": "global", "aliases": "REQ-012-103"}}
  - {op: "add_edge", from: "REQ-SYS-011", verb: "applies at", to: "STG-platform-01-all-stages"}
  - {op: "add_node", id: "REQ-SYS-012", type: "Rule", owner_fr: "FR-SYS", title: "Concurrent admin edits: warn, then last save wins", attrs: {"statement": "When two admins edit the same item at the same time on an admin screen, the second admin MUST be warned that the item was changed since they opened it, with who changed it and when, and MAY continue; the last save wins and overwrites the earlier change.", "scope": "global", "aliases": "REQ-024-050,REQ-029-127"}}
  - {op: "add_edge", from: "REQ-SYS-012", verb: "applies at", to: "STG-platform-01-all-stages"}
  - {op: "add_node", id: "REQ-SYS-013", type: "Rule", owner_fr: "FR-SYS", title: "Setting and policy changes apply to new cases only", attrs: {"statement": "A change to any setting, configuration, or policy MUST NOT affect a case that is already ongoing; it affects only a new case from the point the new setting or policy goes into effect.", "scope": "global"}}
  - {op: "add_edge", from: "REQ-SYS-013", verb: "applies at", to: "STG-platform-01-all-stages"}
  - {op: "add_node", id: "REQ-SYS-014", type: "Rule", owner_fr: "FR-SYS", title: "Download links expire and check permission", attrs: {"statement": "Links to downloadable files (PDF reports and media) MUST expire and MUST check the requester's permission every time they are opened.", "scope": "global", "aliases": "REQ-038-054,REQ-037-050"}}
  - {op: "add_edge", from: "REQ-SYS-014", verb: "applies at", to: "STG-platform-01-all-stages"}
